lines:
  - chapter: "Chapter 3 — Licences"
  - section: "A name over the door"
    learn: "naming: hesaru iḍu, hesaralli · Śr̥ṅgēri Śāradāmbe · let's / let it be: -ōṇa, -irli · a blessing with conditions: śuddhavāgi naḍesi, … bēḍa"
  - scene: "Monday, 1 December 2025, 7 a.m. The empty shop smells of old paper and damp. Amma draws a rangoli at the threshold; Mahesh lifts the shutter; Kavya photographs the bare walls for the interior contractor."
  - who: amma
    t: "ಮೊದಲು ಹೊಸ್ತಿಲು ಪೂಜೆ. ಆಮೇಲೆ ನಿಮ್ಮ ಲೆಕ್ಕ, ಲೈಸೆನ್ಸ್ ಎಲ್ಲಾ."
    tr: "Modalu hostilu pūje. Āmēle nimma lekka, laisens ellā."
    en: "Threshold puja first. Then your accounts, your licences, all that."
  - who: kavya
    t: "ಅಮ್ಮ, ಪೂಜೆ ಆದ್ಮೇಲೆ ಒಂದು ಮುಖ್ಯ ತೀರ್ಮಾನ. ಎಲ್ಲಾ ಅರ್ಜಿಯಲ್ಲೂ ಹೋಟೆಲ್ ಹೆಸರು ಕೇಳ್ತಾರೆ. ಬೋರ್ಡ್‌ಗೂ ಹೆಸರು ಬೇಕು. ನಾವು ಇನ್ನೂ ಹೆಸರೇ ಇಟ್ಟಿಲ್ಲ."
    tr: "Amma, pūje ādmēle ondu mukhya tīrmāna. Ellā arjiyallū hōṭel hesaru kēḷtāre. Bōrḍ-gū hesaru bēku. Nāvu innū hesarē iṭṭilla."
    en: "Amma, after the puja, one important decision. Every application asks for the hotel's name. The board needs a name too. We haven't even named it yet."
  - who: mahesh
    t: "ನಾನು ಇಟ್ಟಿದೀನಿ. ಯಾರಿಗೂ ಹೇಳಿರ್ಲಿಲ್ಲ ಅಷ್ಟೇ. ಶಾರದಾ ದರ್ಶಿನಿ."
    tr: "Nānu iṭṭidīni. Yārigū hēḷirlilla aṣṭē. Śāradā Darśini."
    en: "I've named it. I just hadn't told anyone. Sharada Darshini."
  - who: amma
    t: "ಶಾರದಾ? ನನ್ನ ಹೆಸರು ಯಾಕೋ? ಬೋರ್ಡ್ ಮೇಲೆ ಮುದುಕಿ ಹೆಸರು ನೋಡಿ ಜನ ನಗ್ತಾರೆ. ಉಡುಪಿ ಕೃಷ್ಣ ಅಂತ ಇಡು, ಚೆನ್ನಾಗಿರುತ್ತೆ."
    tr: "Śāradā? Nanna hesaru yākō? Bōrḍ mēle muduki hesaru nōḍi jana nagtāre. Uḍupi Kr̥ṣṇa anta iḍu, chennāgirutte."
    en: "Sharada? Why my name? People will laugh at an old woman's name on a board. Call it Udupi Krishna, that sounds nice."
  - who: mahesh
    t: "ಜಯನಗರದಲ್ಲಿ ಉಡುಪಿ ಕೃಷ್ಣ ಅಂತ ಹತ್ತು ಹೋಟೆಲ್ ಇವೆ ಅಮ್ಮ. ಶಾರದಾ ಒಂದೇ. ಚಟ್ನಿ ನಿಂದು, ಧೈರ್ಯ ನಿಂದು, ಬೇಕಾದ್ರೆ ಚಿನ್ನಾನೂ ನಿಂದೇ. ಹೆಸರೂ ನಿಂದೇ ಇರ್ಲಿ."
    tr: "Jayanagaradalli Uḍupi Kr̥ṣṇa anta hattu hōṭel ive amma. Śāradā ondē. Chaṭni nindu, dhairya nindu, bēkādre chinnānū nindē. Hesarū nindē irli."
    en: "There are ten hotels called Udupi Krishna in Jayanagar, Amma. There's only one Sharada. The chutney is yours, the courage is yours, even the gold, if we need it, is yours. Let the name be yours too."
  - who: kavya
    t: "ಮತ್ತೆ ಅಮ್ಮ, ಶಾರದೆ ಅಂದ್ರೆ ಶೃಂಗೇರಿ ಶಾರದಾಂಬೆ ಕೂಡ. ಜನ ದೇವಿ ಹೆಸರು ಅಂದ್ಕೊಳ್ತಾರೆ, ನಾವು ನಿಮ್ಮ ಹೆಸರು ಅಂದ್ಕೊಳ್ತೀವಿ. ಎರಡೂ ಸರಿ."
    tr: "Matte amma, Śārade andre Śr̥ṅgēri Śāradāmbe kūḍa. Jana dēvi hesaru andkoḷtāre, nāvu nimma hesaru andkoḷtīvi. Eraḍū sari."
    en: "And Amma, Sharada is also Sringeri Sharadambe. People will take it as the goddess's name; we'll know it's yours. Both are true."
  - who: amma
    t: "ನೀವಿಬ್ರೂ ಸೇರಿ ಮೊದಲೇ ತೀರ್ಮಾನ ಮಾಡಿದೀರಿ, ನನಗೆ ಗೊತ್ತು. ಸರಿ. ಹೆಸರಿಗೆ ತಕ್ಕ ಹಾಗೆ ಶುದ್ಧವಾಗಿ ನಡೆಸಿ. ಶಾರದೆ ಹೆಸರಲ್ಲಿ ಸುಳ್ಳು ಲೆಕ್ಕ ಬೇಡ, ಹಳಸಿದ ಚಟ್ನಿ ಬೇಡ."
    tr: "Nīvibrū sēri modalē tīrmāna māḍidīri, nanage gottu. Sari. Hesarige takka hāge śuddhavāgi naḍesi. Śārade hesaralli suḷḷu lekka bēḍa, haḷasida chaṭni bēḍa."
    en: "(Wiping her eyes with the end of her sari) You two decided this together beforehand, I know. All right. Run it cleanly, worthy of the name. No false accounts and no stale chutney under Sharada's name."
  - who: mahesh
    t: "ಮಾತು ಕೊಡ್ತೀನಿ ಅಮ್ಮ. ಕಾವ್ಯ, ಬರ್ಕೋ: ಶಾರದಾ ದರ್ಶಿನಿ, ಶುದ್ಧ ಸಸ್ಯಾಹಾರಿ. ಇವತ್ತಿಂದ ಎಲ್ಲಾ ಅರ್ಜಿಗೂ ಇದೇ ಹೆಸರು."
    tr: "Mātu koḍtīni amma. Kāvya, barkō: Śāradā Darśini, śuddha sasyāhāri. Ivattinda ellā arjigū idē hesaru."
    en: "I give you my word, Amma. Kavya, write it down: Sharada Darshini, pure vegetarian. From today, this name on every application."
  - who: kavya
    t: "ಬರ್ಕೊಂಡೆ. ಇವತ್ತು ಡಿಸೆಂಬರ್ ಒಂದು. ಓಪನಿಂಗ್‌ಗೆ ಐವತ್ತಾರು ದಿನ. ಮೊದಲ ಕೆಲಸ ನಾಳೆ ಬೆಳಗ್ಗೆ, ಭಟ್ರ ಆಫೀಸ್‌ನಲ್ಲಿ."
    tr: "Barkoṇḍe. Ivattu Ḍisembar ondu. Ōpaniṅg-ge aivattāru dina. Modala kelasa nāḷe beḷagge, Bhaṭra āphīs-nalli."
    en: "Written. Today is the first of December. Fifty-six days to the opening. First job: tomorrow morning, at Mr. Bhat's office."

  - section: "FSSAI: registration or licence?"
    learn: "nōndaṇi (registration) vs paravānagi (licence) · turnover limits; hedging a rumour: … māḍtāre anta mātu ide, ādre ārḍar bandilla · documents: nīrina ṭesṭ ripōrṭ, kichan lē-auṭ · rules: -bēku, -ō hāgilla, -abahudu"
  - scene: "Tuesday, 2 December 2025. Mr. Bhat's office again. On his desk, a printed checklist with the darshini's new name at the top; nothing is ticked yet."
  - who: ca
    t: "ಶಾರದಾ ದರ್ಶಿನಿ. ಒಳ್ಳೆ ಹೆಸರು. ಈಗ ಪಟ್ಟಿ ನೋಡಿ: ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ, ಜಿಎಸ್‌ಟಿ, ಶಾಪ್ಸ್ ಅಂಡ್ ಎಸ್ಟಾಬ್ಲಿಷ್‌ಮೆಂಟ್, ಜಿಬಿಎ ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್. ಆಹಾರದ ವ್ಯಾಪಾರ ಆದ್ದರಿಂದ ಮೊದಲು ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ. ಅದಿಲ್ದೆ ಒಂದು ಇಡ್ಲಿನೂ ಮಾರೋ ಹಾಗಿಲ್ಲ."
    tr: "Śāradā Darśini. Oḷḷe hesaru. Īga paṭṭi nōḍi: ef-es-es-e-ai, ji-es-ṭi, śāps aṇḍ esṭābliṣmeṇṭ, ji-bi-e ṭrēḍ laisens. Āhārada vyāpāra āddarinda modalu ef-es-es-e-ai. Adilde ondu iḍlinū mārō hāgilla."
    en: "Sharada Darshini. A good name. Now look at the list: FSSAI, GST, Shops and Establishments, the GBA trade licence. Since it's a food business, FSSAI first. Without it you can't sell a single idli."
  - who: mahesh
    t: "ಅದರಲ್ಲಿ ರಿಜಿಸ್ಟ್ರೇಷನ್ ಅಂತ ಒಂದು, ಲೈಸೆನ್ಸ್ ಅಂತ ಒಂದು ಇದೆಯಂತೆ. ನಮಗೆ ಯಾವುದು ಸಾರ್?"
    tr: "Adaralli rijisṭrēṣan anta ondu, laisens anta ondu ideyante. Namage yāvudu sār?"
    en: "I hear there's one called registration and one called a licence. Which one is ours, sir?"
  - who: ca
    t: "ಅದು ವರ್ಷದ ಟರ್ನೋವರ್ ಮೇಲೆ. ಇವತ್ತಿನ ರೂಲ್ ಪ್ರಕಾರ ವರ್ಷಕ್ಕೆ ಹನ್ನೆರಡು ಲಕ್ಷದವರೆಗೆ ಬೇಸಿಕ್ ರಿಜಿಸ್ಟ್ರೇಷನ್ ಸಾಕು. ಹನ್ನೆರಡು ಲಕ್ಷದಿಂದ ಇಪ್ಪತ್ತು ಕೋಟಿವರೆಗೆ ಸ್ಟೇಟ್ ಲೈಸೆನ್ಸ್. ಕಾವ್ಯ, ಪ್ರಾಜೆಕ್ಟ್ ರಿಪೋರ್ಟ್‌ನಲ್ಲಿ ಮೊದಲ ವರ್ಷದ ಸೇಲ್ಸ್ ಎಷ್ಟು ಹಾಕಿದ್ರಿ?"
    tr: "Adu varṣada ṭarnōvar mēle. Ivattina rūl prakāra varṣakke hanneraḍu lakṣadavarege bēsik rijisṭrēṣan sāku. Hanneraḍu lakṣadinda ippattu kōṭivarege sṭēṭ laisens. Kāvya, prājekṭ ripōrṭ-nalli modala varṣada sēls eṣṭu hākidri?"
    en: "It depends on annual turnover. Under today's rules, basic registration is enough up to twelve lakh a year. From twelve lakh to twenty crore, a state licence. Kavya, what first-year sales did you put in the project report?"
  - who: kavya
    t: "ದಿನಕ್ಕೆ ಮೂವತ್ತು ಸಾವಿರ ಅಂದ್ಕೊಂಡಿದೀನಿ ಸಾರ್. ವರ್ಷಕ್ಕೆ ಸುಮಾರು ಒಂದು ಕೋಟಿ ಹತ್ತು ಲಕ್ಷ."
    tr: "Dinakke mūvattu sāvira andkoṇḍidīni sār. Varṣakke sumāru ondu kōṭi hattu lakṣa."
    en: "I've assumed thirty thousand a day, sir. About one crore ten lakh a year."
  - who: ca
    t: "ಹಾಗಾದ್ರೆ ಸ್ಟೇಟ್ ಲೈಸೆನ್ಸ್. ಒಂದು ಮಾತು: ಈ ಲಿಮಿಟ್‌ಗಳನ್ನ ಮುಂದಿನ ವರ್ಷ ಜಾಸ್ತಿ ಮಾಡ್ತಾರೆ ಅಂತ ಮಾತು ಕೇಳಿಬರ್ತಿದೆ. ಆದ್ರೆ ಆರ್ಡರ್ ಇನ್ನೂ ಬಂದಿಲ್ಲ. ಮಾತಿನ ಮೇಲೆ ಬಿಸಿನೆಸ್ ನಡೆಸೋಕಾಗಲ್ಲ. ಇವತ್ತು ಇರೋ ರೂಲ್ ಪ್ರಕಾರ ಮಾಡೋಣ."
    tr: "Hāgādre sṭēṭ laisens. Ondu mātu: ī limiṭ-gaḷanna mundina varṣa jāsti māḍtāre anta mātu kēḷibartide. Ādre ārḍar innū bandilla. Mātina mēle bisines naḍesōkāgalla. Ivattu irō rūl prakāra māḍōṇa."
    en: "Then a state licence. One thing: there's talk that these limits will be raised next year. But no order has come yet. You can't run a business on talk. Let's go by the rule as it stands today."
  - who: mahesh
    t: "ಸ್ಟೇಟ್ ಲೈಸೆನ್ಸ್‌ಗೆ ಏನೇನು ಬೇಕು ಸಾರ್?"
    tr: "Sṭēṭ laisens-ge ēnēnu bēku sār?"
    en: "What does a state licence need, sir?"
  - who: ca
    t: "ಫೋಸ್ಕೋಸ್ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಆನ್‌ಲೈನ್ ಅರ್ಜಿ. ಪಾರ್ಟ್ನರ್‌ಗಳ ಐಡಿ, ಫೋಟೋ, ಲೀಸ್ ಡೀಡ್, ಕಿಚನ್ ಲೇಔಟ್ ಪ್ಲಾನ್, ಮೆಷಿನ್‌ಗಳ ಪಟ್ಟಿ, ಆಹಾರದ ಐಟಂಗಳ ಪಟ್ಟಿ. ಮತ್ತೆ ನೀರಿನ ಟೆಸ್ಟ್ ರಿಪೋರ್ಟ್, ಅದನ್ನ ಎನ್‌ಎಬಿಎಲ್ ಲ್ಯಾಬ್‌ನಲ್ಲಿ ಮಾಡಿಸ್ಬೇಕು. ಫೀಸ್ ವರ್ಷಕ್ಕೆ ಎರಡು ಸಾವಿರ. ಒಂದರಿಂದ ಐದು ವರ್ಷದವರೆಗೆ ಒಟ್ಟಿಗೆ ಕಟ್ಟಬಹುದು."
    tr: "Phōskōs pōrṭal-nalli ān-lain arji. Pārṭnar-gaḷa ai-ḍi, phōṭō, līs ḍīḍ, kichan lē-auṭ plān, meṣin-gaḷa paṭṭi, āhārada aiṭam-gaḷa paṭṭi. Matte nīrina ṭesṭ ripōrṭ, adanna en-e-bi-el lyāb-nalli māḍisbēku. Phīs varṣakke eraḍu sāvira. Ondarinda aidu varṣadavarege oṭṭige kaṭṭabahudu."
    en: "An online application on the FoSCoS portal. The partners' IDs and photos, the lease deed, a kitchen layout plan, a list of the machines, a list of food items. And a water test report, which you have to get done at an NABL lab. The fee is two thousand a year. You can pay for anything from one to five years at once."
  - who: kavya
    t: "ಕಿಚನ್ ಲೇಔಟ್ ಇನ್ನೂ ಫೈನಲ್ ಆಗಿಲ್ಲ ಸಾರ್. ಮೆಷಿನ್ ಕೂಡ ತಗೊಂಡಿಲ್ಲ."
    tr: "Kichan lē-auṭ innū phainal āgilla sār. Meṣin kūḍa tagoṇḍilla."
    en: "The kitchen layout isn't final yet, sir. We haven't bought the machines either."
  - who: ca
    t: "ಪರವಾಗಿಲ್ಲ, ಪ್ಲಾನ್ ಮಾಡಿರೋ ಲೇಔಟ್ ಸಾಕು. ಆದ್ರೆ ಆಮೇಲೆ ಇನ್ಸ್‌ಪೆಕ್ಷನ್‌ಗೆ ಬಂದಾಗ ಪೇಪರ್‌ನಲ್ಲಿ ಇರೋದೂ ಜಾಗದಲ್ಲಿ ಇರೋದೂ ಒಂದೇ ಇರ್ಬೇಕು. ನೀರಿನ ಸ್ಯಾಂಪಲ್ ಇವತ್ತೇ ಕೊಡಿ. ರಿಪೋರ್ಟ್ ಬರೋಕೆ ಒಂದು ವಾರ ಆಗುತ್ತೆ."
    tr: "Paravāgilla, plān māḍirō lē-auṭ sāku. Ādre āmēle inspekṣan-ge bandāga pēpar-nalli irōdū jāgadalli irōdū ondē irbēku. Nīrina syāmpal ivattē koḍi. Ripōrṭ barōke ondu vāra āgutte."
    en: "That's fine; the planned layout will do. But when they come to inspect later, what's on paper and what's on the ground must match. Give the water sample today. The report takes a week."
  - who: mahesh
    t: "ಲೈಸೆನ್ಸ್ ಬರೋಕೆ ಎಷ್ಟು ದಿನ ಸಾರ್?"
    tr: "Laisens barōke eṣṭu dina sār?"
    en: "How many days for the licence to come, sir?"
  - who: ca
    t: "ರೂಲ್ ಪ್ರಕಾರ ಅರವತ್ತು ದಿನದೊಳಗೆ ತೀರ್ಮಾನ ಆಗ್ಬೇಕು. ಸಾಮಾನ್ಯವಾಗಿ ಅದಕ್ಕಿಂತ ಬೇಗ ಬರುತ್ತೆ, ಆದ್ರೆ ನಿಮ್ಮ ಓಪನಿಂಗ್ ದಿನ ನೋಡಿ ಯಾರೂ ಕೆಲಸ ಮಾಡಲ್ಲ. ಒಂದು ಒಳ್ಳೆ ವಿಷಯ: ಫೈಲ್ ಎಲ್ಲಿದೆ ಅಂತ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ನೀವೇ ಟ್ರ್ಯಾಕ್ ಮಾಡಬಹುದು. ಯಾರ ಹತ್ರಾನೂ ಹೋಗಿ ಕೇಳೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ."
    tr: "Rūl prakāra aravattu dinadoḷage tīrmāna āgbēku. Sāmānyavāgi adakkinta bēga barutte, ādre nimma ōpaniṅg dina nōḍi yārū kelasa māḍalla. Ondu oḷḷe viṣaya: phail ellide anta pōrṭal-nalli nīvē ṭryāk māḍabahudu. Yāra hatrānū hōgi kēḷō avaśyakate illa."
    en: "By the rules, a decision has to be made within sixty days. It usually comes sooner, but nobody works to your opening date. One good thing: you can track on the portal yourself where the file is. No need to go and ask anybody."
  - who: ca
    t: "ಇನ್ನೊಂದು: ಅಡುಗೆಮನೆ ಸ್ಟಾಫ್‌ಗೆ ವರ್ಷಕ್ಕೊಮ್ಮೆ ಮೆಡಿಕಲ್ ಸರ್ಟಿಫಿಕೇಟ್. ಮತ್ತೆ ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬರು ಫುಡ್ ಸೇಫ್ಟಿ ಟ್ರೈನಿಂಗ್ ಮಾಡ್ಬೇಕು. ಮಹೇಶ್ ಅವರೇ, ಅದು ನೀವೇ."
    tr: "Innondu: aḍugemane sṭāf-ge varṣakkomme meḍikal sarṭiphikēṭ. Matte nimmalli obbaru phuḍ sēphṭi ṭrainiṅg māḍbēku. Mahēś avarē, adu nīvē."
    en: "One more: a medical certificate once a year for the kitchen staff. And one of you has to do a food-safety training course. Mahesh, that's you."
  - who: mahesh
    t: "ಹತ್ತು ವರ್ಷ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಹೈಜೀನ್ ಬಗ್ಗೆ ಬೇರೆಯವರಿಗೆ ಬೈತಿದ್ದೆ. ಈಗ ನಾನೇ ಕ್ಲಾಸ್‌ನಲ್ಲಿ ಕೂರ್ಬೇಕು. ಸರಿ ಸಾರ್."
    tr: "Hattu varṣa hōṭel-nalli haijīn bagge bēreyavarige baitidde. Īga nānē klās-nalli kūrbēku. Sari sār."
    en: "For ten years I scolded other people about hygiene at the hotel. Now I have to sit in the class myself. All right, sir."

  - section: "GST: five percent, two ways"
    learn: "terige / ṭyāks · the ₹20 lakh threshold · 5% without ITC (regular) vs composition: grāhakarinda vasūli māḍbahudu / māḍō hāgilla · reasoning with -drū: eraḍu skīm-nallū … ondē · warnings: eccharike, takṣaṇa"
  - scene: "The same morning. Mr. Bhat pulls out a calculator with worn-out keys."
  - who: kavya
    t: "ಜಿಎಸ್‌ಟಿ ಈಗಲೇ ಬೇಕಾ ಸಾರ್? ಇಪ್ಪತ್ತು ಲಕ್ಷ ದಾಟಿದ ಮೇಲೆ ಅಲ್ವಾ ಕಡ್ಡಾಯ?"
    tr: "Ji-es-ṭi īgalē bēkā sār? Ippattu lakṣa dāṭida mēle alvā kaḍḍāya?"
    en: "Do we need GST right now, sir? Isn't it compulsory only after crossing twenty lakh?"
  - who: ca
    t: "ಹೌದು, ವರ್ಷಕ್ಕೆ ಇಪ್ಪತ್ತು ಲಕ್ಷ. ನಿಮ್ಮ ಲೆಕ್ಕದಲ್ಲಿ ದಿನಕ್ಕೆ ಮೂವತ್ತು ಸಾವಿರ ಅಂದ್ರೆ ಎರಡು ತಿಂಗಳೊಳಗೆ ಅದನ್ನ ದಾಟ್ತೀರಿ. ಮತ್ತೆ ಬ್ಯಾಂಕ್, ಜಿಬಿಎ ಎರಡೂ ಜಿಎಸ್‌ಟಿ ನಂಬರ್ ಕೇಳ್ತಾರೆ. ಮೊದಲೇ ತಗೊಳ್ಳೋದು ಒಳ್ಳೇದು. ಪ್ರಶ್ನೆ ಇರೋದು ಯಾವ ಸ್ಕೀಮ್ ಅಂತ."
    tr: "Haudu, varṣakke ippattu lakṣa. Nimma lekkadalli dinakke mūvattu sāvira andre eraḍu tingaḷoḷage adanna dāṭtīri. Matte byāṅk, ji-bi-e eraḍū ji-es-ṭi nambar kēḷtāre. Modalē tagoḷḷōdu oḷḷēdu. Praśne irōdu yāva skīm anta."
    en: "Yes, twenty lakh a year. By your numbers, thirty thousand a day, you'll cross that within two months. And both the bank and the GBA ask for a GST number. Better to take it from the start. The question is which scheme."
  - who: mahesh
    t: "ಹೋಟೆಲ್‌ಗೆ ಐದು ಪರ್ಸೆಂಟ್ ಅಲ್ವಾ ಸಾರ್?"
    tr: "Hōṭel-ge aidu parsenṭ alvā sār?"
    en: "For a restaurant it's five percent, isn't it, sir?"
  - who: ca
    t: "ಎರಡು ದಾರಿಯಲ್ಲೂ ಐದು ಪರ್ಸೆಂಟೇ. ಮೊದಲನೇದು ರೆಗ್ಯುಲರ್ ಸ್ಕೀಮ್: ಬಿಲ್ ಮೇಲೆ ಐದು ಪರ್ಸೆಂಟ್ ಗ್ರಾಹಕರಿಂದ ವಸೂಲಿ ಮಾಡ್ತೀರಿ, ಸರ್ಕಾರಕ್ಕೆ ಕಟ್ತೀರಿ. ಆದ್ರೆ ಇನ್‌ಪುಟ್ ಟ್ಯಾಕ್ಸ್ ಕ್ರೆಡಿಟ್ ಇಲ್ಲ. ಅಂದ್ರೆ ಗ್ಯಾಸ್, ಮೆಷಿನ್ ಮೇಲೆ ನೀವು ಕಟ್ಟಿದ ಜಿಎಸ್‌ಟಿ ವಾಪಸ್ ಬರಲ್ಲ. ಪ್ರತಿ ತಿಂಗಳು ರಿಟರ್ನ್ ಹಾಕ್ಬೇಕು."
    tr: "Eraḍu dāriyallū aidu parsenṭē. Modalanēdu regyular skīm: bil mēle aidu parsenṭ grāhakarinda vasūli māḍtīri, sarkārakke kaṭtīri. Ādre in-puṭ ṭyāks kreḍiṭ illa. Andre gyās, meṣin mēle nīvu kaṭṭida ji-es-ṭi vāpas baralla. Prati tingaḷu riṭarn hākbēku."
    en: "Both ways it's five percent. The first is the regular scheme: you collect five percent on the bill from the customer and pay it to the government. But there's no input tax credit. That means the GST you paid on gas and machines doesn't come back to you. And you file returns every month."
  - who: ca
    t: "ಎರಡನೇದು ಕಾಂಪೊಸಿಷನ್ ಸ್ಕೀಮ್, ಒಂದೂವರೆ ಕೋಟಿವರೆಗಿನ ಟರ್ನೋವರ್‌ಗೆ ಮಾತ್ರ. ಅದರಲ್ಲೂ ಐದು ಪರ್ಸೆಂಟ್, ಆದ್ರೆ ಗ್ರಾಹಕರಿಂದ ಟ್ಯಾಕ್ಸ್ ಅಂತ ಬೇರೆ ವಸೂಲಿ ಮಾಡೋ ಹಾಗಿಲ್ಲ. ನಿಮ್ಮ ಕಲೆಕ್ಷನ್‌ನಿಂದಲೇ ಕಟ್ಬೇಕು. ಮೂರು ತಿಂಗಳಿಗೊಮ್ಮೆ ಕಟ್ಟಿದ್ರೆ ಸಾಕು, ಪೇಪರ್ ಕೆಲಸ ಕಮ್ಮಿ."
    tr: "Eraḍanēdu kāmpoṣiṣan skīm, ondūvare kōṭivaregina ṭarnōvar-ge mātra. Adarallū aidu parsenṭ, ādre grāhakarinda ṭyāks anta bēre vasūli māḍō hāgilla. Nimma kalekṣan-nindalē kaṭbēku. Mūru tingaḷigomme kaṭṭidre sāku, pēpar kelasa kammi."
    en: "The second is the composition scheme, only for turnover up to one and a half crore. That's five percent too, but you can't collect tax separately from customers. You pay it out of your own takings. Paying once every three months is enough; less paperwork."
  - who: mahesh
    t: "ಅಂದ್ರೆ ಕಾಂಪೊಸಿಷನ್‌ನಲ್ಲಿ ಐದು ಪರ್ಸೆಂಟ್ ನಮ್ಮ ಜೇಬಿನಿಂದ ಹೋಗುತ್ತೆ. ಅದು ನಷ್ಟ ಅಲ್ವಾ?"
    tr: "Andre kāmpoṣiṣan-nalli aidu parsenṭ namma jēbininda hōgutte. Adu naṣṭa alvā?"
    en: "So under composition, the five percent comes out of our pocket. Isn't that a loss?"
  - who: kavya
    t: "ಇಲ್ಲ, ಯೋಚನೆ ಮಾಡು. ದರ್ಶಿನಿಯಲ್ಲಿ ಯಾರೂ “ಇಡ್ಲಿ ನಲವತ್ತು ಪ್ಲಸ್ ಟ್ಯಾಕ್ಸ್” ಅಂತ ಬೋರ್ಡ್ ಹಾಕಲ್ಲ. ರೇಟ್ ಟ್ಯಾಕ್ಸ್ ಸೇರಿಸಿಯೇ ಇಡ್ತೀವಿ. ಹಾಗಾದ್ರೆ ಎರಡು ಸ್ಕೀಮ್‌ನಲ್ಲೂ ನಮ್ಮ ಕೈಗೆ ಬರೋದು ಒಂದೇ. ವ್ಯತ್ಯಾಸ ಪೇಪರ್ ಕೆಲಸದಲ್ಲಿ ಮಾತ್ರ."
    tr: "Illa, yōchane māḍu. Darśiniyalli yārū “iḍli nalavattu plas ṭyāks” anta bōrḍ hākalla. Rēṭ ṭyāks sērisiyē iḍtīvi. Hāgādre eraḍu skīm-nallū namma kaige barōdu ondē. Vyatyāsa pēpar kelasadalli mātra."
    en: "No, think about it. No darshini puts up a board saying “idli forty plus tax”. We'll set the prices with tax included anyway. Then under both schemes, what reaches our hands is the same. The difference is only in the paperwork."
  - who: ca
    t: "ಕಾವ್ಯ ಸರಿಯಾಗಿ ಹೇಳಿದ್ರು. ಐಟಿಸಿ ಎರಡರಲ್ಲೂ ಇಲ್ಲ, ಹಾಗಾಗಿ ಮೊದಲ ವರ್ಷಕ್ಕೆ ಕಾಂಪೊಸಿಷನ್ ಸುಲಭ. ಆದ್ರೆ ಎರಡು ಎಚ್ಚರಿಕೆ. ಬಿಲ್ ಮೇಲೆ “ಕಾಂಪೊಸಿಷನ್ ಟ್ಯಾಕ್ಸೇಬಲ್ ಪರ್ಸನ್” ಅಂತ ಬರೀಬೇಕು, ಅಂಗಡಿಯಲ್ಲೂ ಬೋರ್ಡ್ ಹಾಕ್ಬೇಕು. ಎರಡನೇದು: ಟರ್ನೋವರ್ ಒಂದೂವರೆ ಕೋಟಿ ದಾಟಿದ್ರೆ ತಕ್ಷಣ ರೆಗ್ಯುಲರ್‌ಗೆ ಬರ್ಬೇಕು."
    tr: "Kāvya sariyāgi hēḷidru. Ai-ṭi-si eraḍarallū illa, hāgāgi modala varṣakke kāmpoṣiṣan sulabha. Ādre eraḍu eccharike. Bil mēle “kāmpoṣiṣan ṭyāksēbal parsan” anta barībēku, aṅgaḍiyallū bōrḍ hākbēku. Eraḍanēdu: ṭarnōvar ondūvare kōṭi dāṭidre takṣaṇa regyular-ge barbēku."
    en: "Kavya is right. There's no ITC in either, so for the first year composition is simpler. But two warnings. The bill must say “composition taxable person”, and you must put up a notice in the shop too. Second: if turnover crosses one and a half crore, you have to move to the regular scheme at once."
  - who: mahesh
    t: "ಒಂದೂವರೆ ಕೋಟಿ ದಾಟಿದ್ರೆ ನಾನೇ ಸಂತೋಷದಿಂದ ರೆಗ್ಯುಲರ್‌ಗೆ ಬರ್ತೀನಿ ಸಾರ್."
    tr: "Ondūvare kōṭi dāṭidre nānē santōṣadinda regyular-ge bartīni sār."
    en: "If we cross one and a half crore, sir, I'll move to regular myself, happily."
  - who: ca
    t: "ಎಲ್ಲರೂ ಹಾಗೇ ಹೇಳ್ತಾರೆ, ಆಮೇಲೆ ಮಾರ್ಚ್‌ನಲ್ಲಿ ನನಗೆ ಫೋನ್ ಮಾಡ್ತಾರೆ. ಇನ್ನೊಂದು: ಮುಂದೆ ಸ್ವಿಗ್ಗಿ, ಜೊಮ್ಯಾಟೋ ಸೇರೋ ಯೋಚನೆ ಇದ್ರೆ ಆಗ ಸ್ಕೀಮ್ ಮತ್ತೆ ನೋಡ್ಬೇಕಾಗಬಹುದು. ಆ ರೂಲ್ಸ್ ಬೇರೆ. ಅದು ಬಂದಾಗ ನೋಡೋಣ."
    tr: "Ellarū hāgē hēḷtāre, āmēle mārch-nalli nanage phōn māḍtāre. Innondu: munde Sviggi, Jomyāṭō sērō yōchane idre āga skīm matte nōḍbēkāgabahudu. Ā rūls bēre. Adu bandāga nōḍōṇa."
    en: "Everyone says that, and then they call me in March. One more thing: if you later think of joining Swiggy or Zomato, we may have to look at the scheme again. Those rules are different. We'll see when it comes to that."
  - who: kavya
    t: "ಜಿಎಸ್‌ಟಿ ಅರ್ಜಿ ನಾನೇ ಇವತ್ತು ರಾತ್ರಿ ಹಾಕ್ತೀನಿ. ಆಧಾರ್ ಓಟಿಪಿ ನಿನ್ನ ಫೋನ್‌ಗೆ ಬರುತ್ತೆ, ಫೋನ್ ಸೈಲೆಂಟ್ ಮಾಡ್ಬೇಡ."
    tr: "Ji-es-ṭi arji nānē ivattu rātri hāktīni. Ādhār ō-ṭi-pi ninna phōn-ge barutte, phōn sailenṭ māḍbēḍa."
    en: "I'll file the GST application myself tonight. The Aadhaar OTP will come to your phone; don't put it on silent."
  - who: ca
    t: "ಎಲ್ಲಾ ಸರಿ ಇದ್ರೆ ಏಳು ದಿನದಲ್ಲಿ ನಂಬರ್ ಬರುತ್ತೆ. ಅಧಿಕಾರಿ ಏನಾದ್ರೂ ಪ್ರಶ್ನೆ ಕೇಳಿದ್ರೆ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಕೆಲವೊಮ್ಮೆ ಜಾಗ ನೋಡೋಕೂ ಬರ್ತಾರೆ, ಬೋರ್ಡ್ ಇದೆಯಾ, ಅಂಗಡಿ ನಿಜವಾಗ್ಲೂ ಇದೆಯಾ ಅಂತ."
    tr: "Ellā sari idre ēḷu dinadalli nambar barutte. Adhikāri ēnādrū praśne kēḷidre svalpa jāsti. Kelavomme jāga nōḍōkū bartāre, bōrḍ ideyā, aṅgaḍi nijavāglū ideyā anta."
    en: "If everything is in order, the number comes within seven days. A bit longer if the officer raises a query. Sometimes they even come to see the place, to check there's a board and the shop really exists."

  - section: "Shops and Establishments"
    learn: "kārmika ilākhe (Labour Department) · kāyde (Act) · vārada raje (weekly off), kelasada gaṇṭe, saradi (rotation) · hedging: … anta ide ansutte, pakkā gottilla · positives: arji nambar, sṭēṭas ān-lain"
  - scene: "Saturday, 6 December, late at night. Kavya at the laptop, Mahesh with a cup of coffee. The GST number has come through in four days."
  - who: kavya
    t: "ಒಳ್ಳೆ ಸುದ್ದಿ: ಜಿಎಸ್‌ಟಿ ನಂಬರ್ ಬಂತು. ನಾಲ್ಕೇ ದಿನ. ಯಾರ ಬಾಗಿಲೂ ತಟ್ಟಿಲ್ಲ."
    tr: "Oḷḷe suddi: ji-es-ṭi nambar bantu. Nālkē dina. Yāra bāgilū taṭṭilla."
    en: "Good news: the GST number has come. Just four days. We didn't knock on anyone's door."
  - who: mahesh
    t: "ನಂಬೋಕಾಗ್ತಿಲ್ಲ. ಈಗ ಆ ಶಾಪ್ಸ್ ಅಂಡ್ ಎಸ್ಟಾಬ್ಲಿಷ್‌ಮೆಂಟ್ ಏನು? ಅದು ಯಾರ ಡಿಪಾರ್ಟ್‌ಮೆಂಟ್?"
    tr: "Nambōkāgtilla. Īga ā śāps aṇḍ esṭābliṣmeṇṭ ēnu? Adu yāra ḍipārṭmeṇṭ?"
    en: "Unbelievable. Now what's this Shops and Establishments thing? Whose department is that?"
  - who: kavya
    t: "ಕಾರ್ಮಿಕ ಇಲಾಖೆ. ಕರ್ನಾಟಕ ಅಂಗಡಿಗಳು ಮತ್ತು ವಾಣಿಜ್ಯ ಸಂಸ್ಥೆಗಳ ಕಾಯ್ದೆ. ಕೆಲಸಗಾರರು ಇರೋ ಪ್ರತಿ ಅಂಗಡಿ ರಿಜಿಸ್ಟರ್ ಆಗ್ಬೇಕು. ಇದೂ ಆನ್‌ಲೈನ್. ಫೀಸ್ ಎಷ್ಟು ಜನ ಕೆಲಸಗಾರರು ಅನ್ನೋದರ ಮೇಲೆ."
    tr: "Kārmika ilākhe. Karnāṭaka aṅgaḍigaḷu mattu vāṇijya saṁsthegaḷa kāyde. Kelasagāraru irō prati aṅgaḍi rijisṭar āgbēku. Idū ān-lain. Phīs eṣṭu jana kelasagāraru annōdara mēle."
    en: "The Labour Department. The Karnataka Shops and Commercial Establishments Act. Every shop with workers has to be registered. This is online too. The fee depends on how many workers you have."
  - who: mahesh
    t: "ಇನ್ನೂ ಯಾರನ್ನೂ ಕೆಲಸಕ್ಕೆ ತಗೊಂಡಿಲ್ಲ. ಏನು ಹಾಕೋದು?"
    tr: "Innū yārannū kelasakke tagoṇḍilla. Ēnu hākōdu?"
    en: "We haven't hired anyone yet. What do we put?"
  - who: kavya
    t: "ಪ್ಲಾನ್ ಮಾಡಿರೋ ಸಂಖ್ಯೆ: ಒಬ್ಬ ಕುಕ್, ಮೂರು ಹೆಲ್ಪರ್, ಒಬ್ಬ ಕ್ಯಾಶಿಯರ್, ಮತ್ತೆ ನೀನು. ವ್ಯಾಪಾರ ಶುರುವಾದ ಒಂದು ತಿಂಗಳೊಳಗೆ ರಿಜಿಸ್ಟರ್ ಮಾಡ್ಬೇಕು ಅಂತ ಇದೆ ಅನ್ಸುತ್ತೆ, ಪಕ್ಕಾ ಗೊತ್ತಿಲ್ಲ. ನಾವು ಮೊದಲೇ ಮಾಡಿಬಿಡೋಣ. ಆಮೇಲೆ ಯಾರೂ “ಲೇಟ್ ಆಯ್ತು” ಅನ್ನೋ ಹಾಗಿಲ್ಲ."
    tr: "Plān māḍirō saṅkhye: obba kuk, mūru helpar, obba kyāśiyar, matte nīnu. Vyāpāra śuruvāda ondu tingaḷoḷage rijisṭar māḍbēku anta ide ansutte, pakkā gottilla. Nāvu modalē māḍibiḍōṇa. Āmēle yārū “lēṭ āytu” annō hāgilla."
    en: "The planned number: one cook, three helpers, one cashier, and you. I think the rule says register within a month of starting business, but I'm not certain. Let's just do it beforehand. Then nobody can say we were late."
  - who: mahesh
    t: "ಫಾರ್ಮ್‌ನಲ್ಲಿ ಇದೇನು, “ವಾರದ ರಜಾ ದಿನ”?"
    tr: "Phārm-nalli idēnu, “vārada rajā dina”?"
    en: "What's this on the form, “weekly holiday”?"
  - who: kavya
    t: "ಕೆಲಸಗಾರರಿಗೆ ವಾರಕ್ಕೆ ಒಂದು ದಿನ ರಜೆ ಕೊಡ್ಬೇಕು. ಕೆಲಸದ ಗಂಟೆ, ಓವರ್‌ಟೈಮ್, ಎಲ್ಲಾ ಕಾಯ್ದೆಯಲ್ಲಿ ಇದೆ. ಹೋಟೆಲ್ ವಾರವೆಲ್ಲಾ ತೆರೆದಿದ್ರೂ ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಒಂದು ದಿನ ರಜೆ, ಸರದಿ ಪ್ರಕಾರ."
    tr: "Kelasagārarige vārakke ondu dina raje koḍbēku. Kelasada gaṇṭe, ōvarṭaim, ellā kāydeyalli ide. Hōṭel vāravellā teredidrū pratiyobbarigū ondu dina raje, saradi prakāra."
    en: "Workers have to get one day off a week. Working hours, overtime, it's all in the Act. Even if the hotel is open all week, everyone gets one day off, by rotation."
  - who: mahesh
    t: "ನಾನು ಕೆಲಸ ಮಾಡಿದ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಹುಡುಗರಿಗೆ ತಿಂಗಳಿಗೆ ಎರಡು ದಿನ ರಜೆ ಸಿಕ್ಕಿದ್ರೆ ಹೆಚ್ಚು. ನಮ್ಮಲ್ಲಿ ಹಾಗಾಗಬಾರದು. ಬರ್ಕೋ: ಎಲ್ಲರಿಗೂ ವಾರಕ್ಕೊಂದು ರಜೆ."
    tr: "Nānu kelasa māḍida hōṭel-nalli huḍugarige tingaḷige eraḍu dina raje sikkidre heccu. Nammalli hāgāgabāradu. Barkō: ellarigū vārakkondu raje."
    en: "In the hotel where I worked, the boys were lucky to get two days off a month. That mustn't happen with us. Write it: one day off a week for everyone."
  - who: kavya
    t: "ಸಬ್ಮಿಟ್ ಆಯ್ತು. ಅರ್ಜಿ ನಂಬರ್ ಬಂತು, ಸ್ಟೇಟಸ್ ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ನೋಡಬಹುದು. ಸರ್ಟಿಫಿಕೇಟ್ ಬಂದ್ರೆ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ ಕೌಂಟರ್ ಹತ್ರ ಫ್ರೇಮ್ ಹಾಕಿಸೋಣ."
    tr: "Sabmiṭ āytu. Arji nambar bantu, sṭēṭas ān-lain-nallē nōḍabahudu. Sarṭiphikēṭ bandre ḍaunlōḍ māḍi kauṇṭar hatra phrēm hākisōṇa."
    en: "Submitted. We've got an application number; we can check the status online. When the certificate comes, we'll download it and have it framed by the counter."

  - section: "Sixty percent Kannada"
    learn: "the nameboard rule: mēlina aravattu parsenṭ Kannaḍa, uḷida nalavattaralli bēre bhāṣe · sealing: sīl māḍidru · comparisons: -ginta doḍḍa · limits: mīrabāradu · family humour"
  - scene: "Wednesday, 10 December. A signboard shop has sent a draft design. Nitin has come over after work; the draft is on the TV screen. Amma watches from the sofa."
  - who: nitin
    t: "ಅಣ್ಣ, ಡಿಸೈನ್ ಸೂಪರ್, ಆದ್ರೆ ಇಂಗ್ಲಿಷ್ ಸ್ವಲ್ಪ ದೊಡ್ಡದು ಮಾಡಿಸೋಣ. ಜಯನಗರದಲ್ಲಿ ಟೆಕ್ಕಿಗಳು, ಹೊರಗಿನವರು ತುಂಬಾ ಜನ. ಅವರಿಗೂ ಓದೋಕೆ ಆಗ್ಬೇಕಲ್ಲ."
    tr: "Aṇṇa, ḍisain sūpar, ādre iṅgliṣ svalpa doḍḍadu māḍisōṇa. Jayanagaradalli ṭekkigaḷu, horaginavaru tumbā jana. Avarigū ōdōke āgbēkalla."
    en: "Anna, the design is great, but let's have the English made a bit bigger. Jayanagar is full of techies and outsiders. They need to be able to read it too."
  - who: kavya
    t: "ಆಗಲ್ಲ ನಿತಿನ್. ರೂಲ್ ಸ್ಪಷ್ಟ: ಬೋರ್ಡ್‌ನ ಮೇಲಿನ ಅರವತ್ತು ಪರ್ಸೆಂಟ್ ಕನ್ನಡ. ಉಳಿದ ನಲವತ್ತರಲ್ಲಿ ಬೇರೆ ಭಾಷೆ, ಕೆಳಗೆ, ಚಿಕ್ಕದಾಗಿ."
    tr: "Āgalla Nitin. Rūl spaṣṭa: bōrḍ-na mēlina aravattu parsenṭ Kannaḍa. Uḷida nalavattaralli bēre bhāṣe, keḷage, chikkadāgi."
    en: "Can't, Nitin. The rule is clear: the top sixty percent of the board is Kannada. Other languages go in the remaining forty, below, smaller."
  - who: nitin
    t: "ಅದನ್ನ ಎಷ್ಟು ಸೀರಿಯಸ್ ಆಗಿ ಜಾರಿ ಮಾಡ್ತಾರೆ? ಬರೀ ಪೇಪರ್ ರೂಲ್ ಅಲ್ವಾ?"
    tr: "Adanna eṣṭu sīriyas āgi jāri māḍtāre? Barī pēpar rūl alvā?"
    en: "How seriously do they enforce it? Isn't it just a rule on paper?"
  - who: mahesh
    t: "ಎರಡು ವರ್ಷದ ಹಿಂದೆ ಹೆಬ್ಬಾಳದ ದೊಡ್ಡ ಮಾಲ್‌ನಲ್ಲೇ ಅಂಗಡಿಗಳನ್ನ ಸೀಲ್ ಮಾಡಿದ್ರು. ಈಗ ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಅರ್ಜಿಗೆ ಬೋರ್ಡ್ ಫೋಟೋನೇ ಅಪ್‌ಲೋಡ್ ಮಾಡ್ಬೇಕು. ಬೋರ್ಡ್ ಸರಿ ಇಲ್ಲಾಂದ್ರೆ ಲೈಸೆನ್ಸೇ ಇಲ್ಲ."
    tr: "Eraḍu varṣada hinde Hebbāḷada doḍḍa māl-nallē aṅgaḍigaḷanna sīl māḍidru. Īga ṭrēḍ laisens arjige bōrḍ phōṭōnē ap-lōḍ māḍbēku. Bōrḍ sari illāndre laisensē illa."
    en: "Two years ago they sealed shops in a big mall in Hebbal, no less. Now you have to upload a photo of the board with the trade licence application. If the board's not right, there's no licence at all."
  - who: amma
    t: "ಕನ್ನಡ ನಾಡಲ್ಲಿ ಕನ್ನಡ ಬೋರ್ಡ್‌ಗೆ ರೂಲ್ ಬೇಕಾ? ನಮ್ಮ ಕಾಲದಲ್ಲಿ ಎಲ್ಲಾ ಬೋರ್ಡ್ ಕನ್ನಡದಲ್ಲೇ ಇರ್ತಿತ್ತು. ನಿತಿನ್, ಕನ್ನಡ ಓದೋಕೆ ಬರದೋರು ಬೋರ್ಡ್ ನೋಡಿ ಬರಲ್ಲ, ವಾಸನೆ ಹಿಡ್ಕೊಂಡು ಬರ್ತಾರೆ."
    tr: "Kannaḍa nāḍalli Kannaḍa bōrḍ-ge rūl bēkā? Namma kāladalli ellā bōrḍ Kannaḍadallē irtittu. Nitin, Kannaḍa ōdōke baradōru bōrḍ nōḍi baralla, vāsane hiḍkoṇḍu bartāre."
    en: "Does a Kannada board in the land of Kannada need a rule? In our day every board was in Kannada. Nitin, people who can't read Kannada don't come because of the board; they follow the smell."
  - who: nitin
    t: "ದೊಡ್ಡಮ್ಮ, ನಿಮ್ಮ ಚಟ್ನಿ ವಾಸನೆ ಯಾವ ಬೋರ್ಡ್‌ಗಿಂತಲೂ ದೊಡ್ಡ ಜಾಹೀರಾತು, ಒಪ್ತೀನಿ. ಸರಿ, ಕನ್ನಡ ಮೇಲೆ. ಆದ್ರೆ ಕೆಳಗೆ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ “ಪ್ಯೂರ್ ವೆಜ್” ಅಂತಾದ್ರೂ ಇರ್ಲಿ."
    tr: "Doḍḍamma, nimma chaṭni vāsane yāva bōrḍ-gintalū doḍḍa jāhīrātu, optīni. Sari, Kannaḍa mēle. Ādre keḷage iṅgliṣ-nalli “pyūr vej” antādrū irli."
    en: "Doddamma, the smell of your chutney is a bigger advertisement than any board, I agree. Fine, Kannada on top. But at least let “Pure Veg” be there below, in English."
  - who: kavya
    t: "ಅದು ಸರಿ. ಮೇಲೆ ದೊಡ್ಡದಾಗಿ “ಶಾರದಾ ದರ್ಶಿನಿ”, ಅದರ ಕೆಳಗೆ “ಶುದ್ಧ ಸಸ್ಯಾಹಾರಿ ಉಪಾಹಾರ”. ಕೊನೆಯ ಪಟ್ಟಿಯಲ್ಲಿ ಇಂಗ್ಲಿಷ್ ಹೆಸರು, “ಪ್ಯೂರ್ ವೆಜ್”, ಜಿಎಸ್‌ಟಿ ನಂಬರ್. ಎತ್ತರ ಅಳತೆ ಮಾಡಿ ಪೇಂಟರ್‌ಗೆ ಸೆಂಟಿಮೀಟರ್ ಲೆಕ್ಕದಲ್ಲಿ ಹೇಳ್ತೀನಿ."
    tr: "Adu sari. Mēle doḍḍadāgi “Śāradā Darśini”, adara keḷage “śuddha sasyāhāri upāhāra”. Koneya paṭṭiyalli iṅgliṣ hesaru, “pyūr vej”, ji-es-ṭi nambar. Ettara aḷate māḍi pēṇṭar-ge seṇṭimīṭar lekkadalli hēḷtīni."
    en: "That's fine. On top, big: “Sharada Darshini”, under it “Pure vegetarian tiffin”. On the bottom strip, the English name, “Pure Veg” and the GST number. I'll measure the heights and give the painter the numbers in centimetres."
  - who: mahesh
    t: "ಮತ್ತೆ ಬಾಲ್ಕನಿ ಮುಚ್ಚಬಾರದು, ಮೂರ್ತಿ ಸಾರ್ ಕಂಡೀಷನ್. ಬೋರ್ಡ್ ಎತ್ತರ ಮೂರು ಅಡಿ ಮೀರಬಾರದು."
    tr: "Matte bālkani mucchabāradu, Mūrti sār kaṇḍīṣan. Bōrḍ ettara mūru aḍi mīrabāradu."
    en: "And it mustn't cover the balcony; that's Murthy sir's condition. The board can't be more than three feet high."
  - who: amma
    t: "ಬೋರ್ಡ್ ಹಾಕಿದ ದಿನ ನಿಂಬೆಹಣ್ಣು, ಮೆಣಸಿನಕಾಯಿ ಕಟ್ಟಬೇಕು. ಅದು ನನ್ನ ರೂಲ್."
    tr: "Bōrḍ hākida dina nimbehaṇṇu, meṇasinakāyi kaṭṭabēku. Adu nanna rūl."
    en: "On the day the board goes up, a lemon and chillies must be tied to it. That's my rule."
  - who: nitin
    t: "ಅದಕ್ಕೆ ಎಷ್ಟು ಪರ್ಸೆಂಟ್ ದೊಡ್ಡಮ್ಮ?"
    tr: "Adakke eṣṭu parsenṭ doḍḍamma?"
    en: "And how many percent for that, Doddamma?"
  - who: amma
    t: "ನೂರು ಪರ್ಸೆಂಟ್."
    tr: "Nūru parsenṭ."
    en: "A hundred percent."

  - section: "The trade licence: a portal and a missing paper"
    learn: "GBA trade licence (uddime paravānagi): category, fee, inspection, approval chain · renewal: Phebravari 1–28 no fine, March +25%, April +100% · frustration: sarvar ḍaun, ḍākyumeṇṭ illa · the landlord's property-tax receipt"
  - scene: "Tuesday, 16 December, 11:40 p.m. The board went up that afternoon, lemon and chillies included; Kavya has its photos on her phone. The GBA trade-licence portal has shown the same message since nine."
  - who: mahesh
    t: "ಇನ್ನೂ ಬಂದಿಲ್ವಾ? ಒಂಬತ್ತು ಗಂಟೆಯಿಂದ ಅದೇ ಪೇಜ್."
    tr: "Innū bandilvā? Ombattu gaṇṭeyinda adē pēj."
    en: "Still not up? The same page since nine o'clock."
  - who: kavya
    t: "“ಸರ್ವರ್ ನಿರ್ವಹಣೆಯಲ್ಲಿದೆ, ದಯವಿಟ್ಟು ನಂತರ ಪ್ರಯತ್ನಿಸಿ.” ನಂತರ ಅಂದ್ರೆ ಯಾವಾಗ ಅಂತ ಹೇಳಲ್ಲ. ಬಿಬಿಎಂಪಿ ಜಿಬಿಎ ಆಯ್ತು, ಪೋರ್ಟಲ್ ಮಾತ್ರ ಹಾಗೇ ಇದೆ."
    tr: "“Sarvar nirvahaṇeyallide, dayaviṭṭu nantara prayatnisi.” Nantara andre yāvāga anta hēḷalla. Bi-bi-em-pi ji-bi-e āytu, pōrṭal mātra hāgē ide."
    en: "(Reading) “The server is under maintenance; please try later.” It doesn't say when later is. BBMP became GBA, but the portal has stayed exactly the same."
  - who: mahesh
    t: "ನಾಳೆ ಬೆಳಗ್ಗೆ ಆಫೀಸ್‌ಗೇ ಹೋಗಿ ಕೊಟ್ಟುಬಿಡ್ತೀನಿ."
    tr: "Nāḷe beḷagge āphīs-gē hōgi koṭṭubiḍtīni."
    en: "I'll just go to the office tomorrow morning and hand it in."
  - who: kavya
    t: "ಆಫೀಸ್‌ನಲ್ಲೂ ಇದೇ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಹಾಕ್ತಾರೆ. ಅಲ್ಲಿಗೆ ಹೋದ್ರೆ ಹೊರಗೆ ನಿಂತಿರೋರು “ಏಜೆಂಟ್ ಮೂಲಕ ಮಾಡಿಸಿ” ಅಂತ ಹಿಡ್ಕೊಳ್ತಾರೆ. ಬೆಳಗಿನ ಜಾವ ಸರ್ವರ್ ಖಾಲಿ ಇರುತ್ತೆ. ಐದು ಗಂಟೆಗೆ ಅಲಾರಂ ಇಡು."
    tr: "Āphīs-nallū idē pōrṭal-nalli hāktāre. Allige hōdre horage nintirōru “ējeṇṭ mūlaka māḍisi” anta hiḍkoḷtāre. Beḷagina jāva sarvar khāli irutte. Aidu gaṇṭege alāram iḍu."
    en: "Even at the office they enter it on the same portal. Go there and the men standing outside will grab you: “get it done through an agent”. In the early morning the server is free. Set an alarm for five."
  - scene: "5:10 a.m. The portal opens. Kavya fills in the form; Mahesh reads out from a folder."
  - who: kavya
    t: "ವ್ಯಾಪಾರದ ವಿಧ: ಹೋಟೆಲ್, ರೆಸ್ಟೋರೆಂಟ್, ತಿಂಡಿ. ಜಾಗ ಐನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್, ಫೀಸ್ ಅದರ ಮೇಲೆ ಲೆಕ್ಕ ಆಗುತ್ತೆ. ಈಗ ಅಪ್‌ಲೋಡ್: ಲೀಸ್ ಡೀಡ್, ಆಧಾರ್, ಪ್ಯಾನ್, ಜಿಎಸ್‌ಟಿ, ಕರೆಂಟ್ ಬಿಲ್, ಬೋರ್ಡ್ ಫೋಟೋ… ಮತ್ತೆ ಓನರ್‌ನ ಈ ವರ್ಷದ ಪ್ರಾಪರ್ಟಿ ಟ್ಯಾಕ್ಸ್ ರಶೀದಿ."
    tr: "Vyāpārada vidha: hōṭel, resṭōreṇṭ, tiṇḍi. Jāga ainūru skvēr fīṭ, phīs adara mēle lekka āgutte. Īga ap-lōḍ: līs ḍīḍ, ādhār, pyān, ji-es-ṭi, karaṇṭ bil, bōrḍ phōṭō… matte ōnar-na ī varṣada prāparṭi ṭyāks raśīdi."
    en: "Type of trade: hotel, restaurant, eatery. Area five hundred square feet; the fee is calculated from that. Now the uploads: lease deed, Aadhaar, PAN, GST, electricity bill, board photos… and the owner's property-tax receipt for this year."
  - who: mahesh
    t: "ಅದು… ನಮ್ಮ ಹತ್ರ ಇಲ್ಲ. ಲೀಸ್ ಟೈಮ್‌ನಲ್ಲಿ ಹೋದ ವರ್ಷದ್ದು ಕೊಟ್ಟಿದ್ರು."
    tr: "Adu… namma hatra illa. Līs ṭaim-nalli hōda varṣaddu koṭṭidru."
    en: "That… we don't have it. At the time of the lease he gave us last year's."
  - who: kavya
    t: "ಹಳೇದು ತಗೊಳ್ಳಲ್ಲ. ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ ಕೂಡ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ಅದರ ಅರ್ಜಿ ನಂಬರ್ ಹಾಕ್ತೀನಿ. ಮೂರ್ತಿ ಸಾರ್ ಎದ್ದಮೇಲೆ ಕೇಳು. ಐದು ಗಂಟೆಗೆ ಫೋನ್ ಮಾಡಿದ್ರೆ ಲೀಸ್ ಕ್ಯಾನ್ಸಲ್ ಮಾಡ್ತಾರೆ."
    tr: "Haḷēdu tagoḷḷalla. Ef-es-es-e-ai kūḍa innū bandilla, adara arji nambar hāktīni. Mūrti sār eddamēle kēḷu. Aidu gaṇṭege phōn māḍidre līs kyānsal māḍtāre."
    en: "It won't accept the old one. FSSAI hasn't come yet either; I'll enter its application number. Ask Murthy sir once he's up. Phone him at five and he'll cancel the lease."
  - scene: "8 a.m. Upstairs, Mr. Murthy, in a banian with a towel over his shoulder, opens a steel cupboard full of labelled files."
  - who: landlord
    t: "ಪ್ರಾಪರ್ಟಿ ಟ್ಯಾಕ್ಸ್ ರಶೀದಿ? ಏಪ್ರಿಲ್‌ನಲ್ಲೇ ಕಟ್ಟಿದೀನಿ, ಐದು ಪರ್ಸೆಂಟ್ ರಿಬೇಟ್‌ಗೋಸ್ಕರ. ಇಗೋ. ಸ್ಟೇಷನರಿ ಅಂಗಡಿ ಇದ್ದಾಗಿಂದಲೂ ಕೆಳಗಿನ ಭಾಗಕ್ಕೆ ಕಮರ್ಷಿಯಲ್ ರೇಟ್‌ನಲ್ಲೇ ಕಟ್ತಿದೀನಿ. ಮನೆ ಅಂತ ತೋರಿಸಿ ಉಳಿಸೋ ಬುದ್ಧಿ ನನಗಿಲ್ಲ. ಅದಕ್ಕೇ ನಿಮ್ಮ ಲೈಸೆನ್ಸ್‌ಗೆ ತೊಂದರೆ ಆಗಲ್ಲ."
    tr: "Prāparṭi ṭyāks raśīdi? Ēpril-nallē kaṭṭidīni, aidu parsenṭ ribēṭ-gōskara. Igō. Sṭēṣanari aṅgaḍi iddāgindalū keḷagina bhāgakke kamarṣiyal rēṭ-nallē kaṭtidīni. Mane anta tōrisi uḷisō buddhi nanagilla. Adakkē nimma laisens-ge tondare āgalla."
    en: "Property-tax receipt? I paid it in April itself, for the five-percent rebate. Here. Ever since the stationery shop was there, I've paid the commercial rate for the ground floor. I'm not the type to save money by showing it as a house. That's why your licence won't run into trouble."
  - who: mahesh
    t: "ಅದಕ್ಕೇ ನಿಮ್ಮ ಜಾಗ ತಗೊಂಡಿದ್ದು ಸಾರ್. ಸ್ಕ್ಯಾನ್ ಮಾಡಿ ಇವತ್ತೇ ವಾಪಸ್ ಕೊಡ್ತೀನಿ."
    tr: "Adakkē nimma jāga tagoṇḍiddu sār. Skyān māḍi ivattē vāpas koḍtīni."
    en: "That's why we took your place, sir. I'll scan it and give it back today."
  - scene: "That evening the application goes through. The fee is paid online, and the portal shows a status line."
  - who: kavya
    t: "ಕಟ್ಟಿದ್ದು ಏಳು ಸಾವಿರದ ಚಿಲ್ಲರೆ, ಒಂದು ವರ್ಷಕ್ಕೆ. ಸ್ಟೇಟಸ್: “ತಪಾಸಣೆಗೆ ಬಾಕಿ.” ಇದಾದ ಮೇಲೆ ಮೆಡಿಕಲ್ ಆಫೀಸರ್, ಹೆಲ್ತ್ ಆಫೀಸರ್, ಜಾಯಿಂಟ್ ಕಮಿಷನರ್, ಎಲ್ಲರ ಟೇಬಲ್ ದಾಟ್ಬೇಕು."
    tr: "Kaṭṭiddu ēḷu sāvirada chillare, ondu varṣakke. Sṭēṭas: “tapāsaṇege bāki.” Idāda mēle meḍikal āphīsar, helth āphīsar, jāyiṇṭ kamiṣanar, ellara ṭēbal dāṭbēku."
    en: "We paid seven thousand odd, for one year. Status: “pending inspection”. After that it has to cross the desks of the medical officer, the health officer, the joint commissioner, all of them."
  - who: mahesh
    t: "ಒಂದು ವರ್ಷಕ್ಕೆ ಮಾತ್ರನಾ? ಮುಂದಿನ ವರ್ಷ ಮತ್ತೆ ಇದೆಲ್ಲ?"
    tr: "Ondu varṣakke mātranā? Mundina varṣa matte idella?"
    en: "Only for one year? All this again next year?"
  - who: kavya
    t: "ರಿನೀವಲ್ ಸುಲಭ, ಆದ್ರೆ ಡೇಟ್ ನೆನಪಿಡು. ಫೆಬ್ರವರಿ ಒಂದರಿಂದ ಇಪ್ಪತ್ತೆಂಟರೊಳಗೆ ಮಾಡಿದ್ರೆ ಫೈನ್ ಇಲ್ಲ. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಇಪ್ಪತ್ತೈದು ಪರ್ಸೆಂಟ್ ಜಾಸ್ತಿ. ಏಪ್ರಿಲ್‌ನಿಂದ ಡಬಲ್. ನಿನ್ನ ಫೋನ್‌ನಲ್ಲಿ ರಿಮೈಂಡರ್ ಹಾಕಿದೀನಿ."
    tr: "Rinīval sulabha, ādre ḍēṭ nenapiḍu. Phebravari ondarinda ippatteṇṭaroḷage māḍidre phain illa. Mārch-nalli ippattaidu parsenṭ jāsti. Ēpril-ninda ḍabal. Ninna phōn-nalli rimainḍar hākidīni."
    en: "Renewal is easy, but remember the dates. Between the first and the twenty-eighth of February, no fine. In March, twenty-five percent extra. From April, double. I've put a reminder on your phone."

  - section: "The sanction letter"
    learn: "syāṅkṣan, kantu (instalment), ḍisbarsmeṇṭ, moraṭōriyam, vime (insurance) · stages: modala kantu…, adāda mēle mātra… · conditions: -ade (without) … āgalla · money per day: dinakke eṣṭu"
  - scene: "Friday, 19 December 2025. Ms. Rashmi's cabin at the bank. A printed letter in a plastic sleeve lies on the desk."
  - who: bank
    t: "ಅಭಿನಂದನೆಗಳು. ಸ್ಯಾಂಕ್ಷನ್ ಆಯ್ತು. ತರುಣ್ ಕೆಟಗರಿ, ಹತ್ತು ಲಕ್ಷ. ಬಡ್ಡಿ ಹತ್ತು ಪಾಯಿಂಟ್ ಎರಡೈದು ಪರ್ಸೆಂಟ್, ಐದು ವರ್ಷ. ಮೊದಲ ಆರು ತಿಂಗಳು ಮೊರಟೋರಿಯಂ ಸಿಕ್ಕಿದೆ: ಆ ಟೈಮ್‌ನಲ್ಲಿ ಬಡ್ಡಿ ಮಾತ್ರ ಕಟ್ಬೇಕು."
    tr: "Abhinandanegaḷu. Syāṅkṣan āytu. Taruṇ keṭagari, hattu lakṣa. Baḍḍi hattu pāyiṇṭ eraḍaidu parsenṭ, aidu varṣa. Modala āru tingaḷu moraṭōriyam sikkide: ā ṭaim-nalli baḍḍi mātra kaṭbēku."
    en: "Congratulations. It's sanctioned. Tarun category, ten lakh. Interest ten point two five percent, five years. You've been given a six-month moratorium at the start: during that time you pay only interest."
  - who: mahesh
    t: "ಮೇಡಂ, ತುಂಬಾ ಥ್ಯಾಂಕ್ಸ್. ಮೂರು ವಾರ ಅಂದಿದ್ರಿ, ಮೂರು ವಾರದಲ್ಲೇ ಆಯ್ತು."
    tr: "Mēḍam, tumbā thyāṅks. Mūru vāra andidri, mūru vāradallē āytu."
    en: "Madam, thank you so much. You said three weeks, and it came in three weeks."
  - who: bank
    t: "ಫೈಲ್ ಪೂರ್ತಿ ಇತ್ತು, ಅದಕ್ಕೆ. ಕಾವ್ಯ ಅವರ ಪ್ರಾಜೆಕ್ಟ್ ರಿಪೋರ್ಟ್ ನೋಡಿ ನಮ್ಮ ಕ್ರೆಡಿಟ್ ಮ್ಯಾನೇಜರ್ ಕೂಡ “ರಿಪೋರ್ಟ್ ಅಂದ್ರೆ ಹೀಗಿರ್ಬೇಕು” ಅಂದ್ರು. ಈಗ ಡಿಸ್ಬರ್ಸ್‌ಮೆಂಟ್ ಹೇಗೆ ಅಂತ ಸರಿಯಾಗಿ ಕೇಳಿ. ದುಡ್ಡು ಒಂದೇ ಸಲ ಬರಲ್ಲ, ಎರಡು ಕಂತಲ್ಲಿ."
    tr: "Phail pūrti ittu, adakke. Kāvya avara prājekṭ ripōrṭ nōḍi namma kreḍiṭ myānējar kūḍa “ripōrṭ andre hīgirbēku” andru. Īga ḍisbarsmeṇṭ hēge anta sariyāgi kēḷi. Duḍḍu ondē sala baralla, eraḍu kantalli."
    en: "That's because the file was complete. Even our credit manager looked at Kavya's project report and said, “This is what a report should look like.” Now listen carefully to how the disbursement works. The money doesn't come all at once; it comes in two instalments."
  - who: bank
    t: "ಮೊದಲ ಕಂತು ಆರು ಲಕ್ಷ: ನೀವು ಆರಿಸಿದ ಕಿಚನ್ ಸಪ್ಲೈಯರ್‌ಗೆ, ಅವರ ಕೊಟೇಷನ್ ಪ್ರಕಾರ, ನೇರವಾಗಿ. ಸಾಮಾನು ಬಂದು ಫಿಟ್ ಆದ್ಮೇಲೆ ನಾನು ಅಂಗಡಿಗೆ ಬಂದು ನೋಡ್ತೀನಿ, ಬಿಲ್, ಸೀರಿಯಲ್ ನಂಬರ್ ಎಲ್ಲಾ ಚೆಕ್ ಮಾಡ್ತೀನಿ. ಅದಾದ ಮೇಲೆ ಮಾತ್ರ ಉಳಿದ ನಾಲ್ಕು ಲಕ್ಷ."
    tr: "Modala kantu āru lakṣa: nīvu ārisida kichan saplaiyar-ge, avara koṭēṣan prakāra, nēravāgi. Sāmānu bandu phiṭ ādmēle nānu aṅgaḍige bandu nōḍtīni, bil, sīriyal nambar ellā chek māḍtīni. Adāda mēle mātra uḷida nālku lakṣa."
    en: "The first instalment, six lakh, goes straight to the kitchen supplier you chose, as per their quotation. After the equipment arrives and is fitted, I'll come to the shop and check the bills, the serial numbers, everything. Only after that, the remaining four lakh."
  - who: kavya
    t: "ಉಳಿದ ನಾಲ್ಕರಲ್ಲಿ ಎರಡು ಲಕ್ಷ ಅರವತ್ತು ಸಾವಿರ ಸಪ್ಲೈಯರ್‌ನ ಬಾಕಿಗೆ, ಒಂದು ಲಕ್ಷ ನಲವತ್ತು ಇಂಟೀರಿಯರ್ ಬಾಕಿಗೆ. ಇಂಟೀರಿಯರ್ ಬಿಲ್‌ಗಳೂ ಜಿಎಸ್‌ಟಿ ಬಿಲ್‌ಗಳೇ ಮೇಡಂ."
    tr: "Uḷida nālkaralli eraḍu lakṣa aravattu sāvira saplaiyar-na bākige, ondu lakṣa nalavattu iṇṭīriyar bākige. Iṇṭīriyar bil-gaḷū ji-es-ṭi bil-gaḷē mēḍam."
    en: "Of the remaining four, two lakh sixty thousand for the supplier's balance and one lakh forty for the interior contractor's balance. The interior bills are proper GST bills too, madam."
  - who: bank
    t: "ಒಳ್ಳೇದು. ಇನ್ನೆರಡು ಕಂಡೀಷನ್. ಲೋನ್ ಸಾಮಾನಿಗೆ ವಿಮೆ ಮಾಡಿಸ್ಬೇಕು, ಬ್ಯಾಂಕ್ ಹೆಸರು ಸೇರಿಸಿ, ಬೆಂಕಿ ಮತ್ತೆ ಕಳ್ಳತನ ಎರಡಕ್ಕೂ. ಮತ್ತೆ ಎರಡನೇ ಕಂತಿಗೆ ಮುಂಚೆ ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಕಾಪಿ ಬೇಕು. ಅದು ಬರದೆ ನಾನು ಏನೂ ಮಾಡೋಕಾಗಲ್ಲ."
    tr: "Oḷḷēdu. Inneraḍu kaṇḍīṣan. Lōn sāmānige vime māḍisbēku, byāṅk hesaru sērisi, beṅki matte kaḷḷatana eraḍakkū. Matte eraḍanē kantige muñche ṭrēḍ laisens kāpi bēku. Adu barade nānu ēnū māḍōkāgalla."
    en: "Good. Two more conditions. The loan equipment has to be insured, with the bank's name added, against both fire and theft. And before the second instalment I need a copy of the trade licence. Without it I can't do anything."
  - who: mahesh
    t: "ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಇನ್ಸ್‌ಪೆಕ್ಷನ್‌ಗೆ ಕಾಯ್ತಿದೆ ಮೇಡಂ. ಅದು ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐಗೆ ಕಾಯ್ತಿದೆ. ಎಲ್ಲಾ ಒಂದರ ಮೇಲೆ ಒಂದು ನಿಂತಿದೆ."
    tr: "Ṭrēḍ laisens inspekṣan-ge kāytide mēḍam. Adu ef-es-es-e-ai-ge kāytide. Ellā ondara mēle ondu nintide."
    en: "The trade licence is waiting for inspection, madam. And that is waiting for FSSAI. Everything is stacked one on top of another."
  - who: bank
    t: "ಸರ್ಕಾರಿ ಕೆಲಸ ಹಾಗೇ, ರೈಲಿನ ಡಬ್ಬಿ ಥರ. ಎಂಜಿನ್ ಓಡಿದ್ರೆ ಉಳಿದದ್ದು ಹಿಂದೆ ಬರುತ್ತೆ. ಇನ್ನೊಂದು ವಿಷಯ, ಮಹೇಶ್ ಅವರೇ: ಮೊರಟೋರಿಯಂ ಅಂದ್ರೆ ಬಡ್ಡಿ ಮಾಫಿ ಅಲ್ಲ. ಆರು ತಿಂಗಳು ಬಡ್ಡಿ ಮಾತ್ರ, ಆಮೇಲೆ ಪೂರ್ತಿ ಇಎಂಐ. ಆ ಆರು ತಿಂಗಳೂ ಐದು ವರ್ಷದೊಳಗೇ ಬರೋದ್ರಿಂದ ಇಎಂಐ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ, ಸುಮಾರು ಇಪ್ಪತ್ಮೂರು ಸಾವಿರ."
    tr: "Sarkāri kelasa hāgē, railina ḍabbi thara. Eñjin ōḍidre uḷidaddu hinde barutte. Innondu viṣaya, Mahēś avarē: moraṭōriyam andre baḍḍi māphi alla. Āru tingaḷu baḍḍi mātra, āmēle pūrti i-em-ai. Ā āru tingaḷū aidu varṣadoḷagē barōdrinda i-em-ai svalpa jāsti, sumāru ippatmūru sāvira."
    en: "Government work is like that, like railway coaches. When the engine moves, the rest follow. One more thing, Mahesh: a moratorium doesn't mean the interest is waived. Six months of interest only, then the full EMI. Because those six months fall inside the five years, the EMI is a little higher: about twenty-three thousand."
  - who: kavya
    t: "ಅಂದ್ರೆ ಜನವರಿಯಿಂದ ಜೂನ್‌ವರೆಗೆ ತಿಂಗಳಿಗೆ ಸುಮಾರು ಎಂಟೂವರೆ ಸಾವಿರ ಬಡ್ಡಿ. ಜುಲೈಯಿಂದ ಇಪ್ಪತ್ಮೂರು. ಬರ್ಕೊಂಡೆ."
    tr: "Andre Janavariyinda Jūn-varege tingaḷige sumāru eṇṭūvare sāvira baḍḍi. Julaiyinda ippatmūru. Barkoṇḍe."
    en: "So from January to June, about eight and a half thousand a month in interest. From July, twenty-three. Noted."
  - who: mahesh
    t: "ಜುಲೈಯಿಂದ ದಿನಕ್ಕೆ ಸುಮಾರು ಎಂಟುನೂರು ರೂಪಾಯಿ ಬ್ಯಾಂಕ್‌ಗೆ. ಅಂದ್ರೆ ದಿನಾ ಮೊದಲ ಹತ್ತು ಮಸಾಲೆ ದೋಸೆ ಬ್ಯಾಂಕ್‌ದು."
    tr: "Julaiyinda dinakke sumāru eṇṭunūru rūpāyi byāṅk-ge. Andre dinā modala hattu masāle dōse byāṅk-du."
    en: "From July, about eight hundred rupees a day to the bank. So every day, the first ten masala doses belong to the bank."
  - who: bank
    t: "ಹಾಗೆ ಲೆಕ್ಕ ಹಾಕೋರು ಸಾಮಾನ್ಯವಾಗಿ ಲೋನ್ ಸರಿಯಾಗಿ ಕಟ್ತಾರೆ. ಆಲ್ ದಿ ಬೆಸ್ಟ್. ಓಪನಿಂಗ್‌ಗೆ ಕರೀರಿ."
    tr: "Hāge lekka hākōru sāmānyavāgi lōn sariyāgi kaṭtāre. Āl di besṭ. Ōpaniṅg-ge karīri."
    en: "People who do that sum usually repay their loans properly. All the best. Invite me to the opening."

  - section: "Mr. Gowda's inspection"
    learn: "inspection talk: tōrisi, elli, ellige hōgutte · an official's hint: svalpa nōḍkoṇḍre…, adara pāḍige adu hōgutte · polite refusal: chalan koḍi, raśīdi samēta kaṭtīni, kāytīni · reported speech: mātu koṭṭidīni … anta"
  - scene: "Tuesday, 23 December, 11 a.m. The shop is half-built: granite counters in, wall tiles drying, wires hanging where the chimney hood will go. Mr. Gowda, the GBA health inspector, arrives on a scooter with a file under his arm."
  - who: officer
    t: "ಶಾರದಾ ದರ್ಶಿನಿ ಅಂದ್ರೆ ಇದೇನಾ? ಇನ್ನೂ ಕೆಲಸ ನಡೀತಿದೆಯಲ್ಲ. ಪಾರ್ಟ್ನರ್ ಯಾರು?"
    tr: "Śāradā Darśini andre idēnā? Innū kelasa naḍītideyalla. Pārṭnar yāru?"
    en: "So this is Sharada Darshini? Work is still going on, I see. Who's the partner?"
  - who: mahesh
    t: "ನಾನೇ ಸಾರ್, ಮಹೇಶ್ ಉಪಾಧ್ಯ. ಇನ್ನೊಬ್ಬ ಪಾರ್ಟ್ನರ್ ನನ್ನ ತಮ್ಮ, ಅವನು ಆಫೀಸ್‌ಗೆ ಹೋಗಿದಾನೆ. ಕೂತ್ಕೊಳ್ಳಿ ಸಾರ್, ಕಾಫಿ ತರಿಸ್ತೀನಿ."
    tr: "Nānē sār, Mahēś Upādhya. Innobba pārṭnar nanna tamma, avanu āphīs-ge hōgidāne. Kūtkoḷḷi sār, kāphi taristīni."
    en: "I am, sir, Mahesh Upadhya. The other partner is my cousin; he's at his office. Please sit, sir, I'll have some coffee brought."
  - who: officer
    t: "ಕಾಫಿ ಆಮೇಲೆ. ಮೊದಲು ನೋಡೋಣ. ಅಡುಗೆಮನೆ ಎಲ್ಲಿ? ಡ್ರೈನೇಜ್ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತೆ? ಗ್ರೀಸ್ ಟ್ರ್ಯಾಪ್ ಎಲ್ಲಿ?"
    tr: "Kāphi āmēle. Modalu nōḍōṇa. Aḍugemane elli? Ḍrainēj ellige hōgutte? Grīs ṭryāp elli?"
    en: "Coffee later. Let's look first. Where's the kitchen? Where does the drainage go? Where's the grease trap?"
  - who: mahesh
    t: "ಇಲ್ಲಿ ಸಾರ್, ಸಿಂಕ್ ಕೆಳಗೆ. ಎರಡು ಚೇಂಬರ್ ಗ್ರೀಸ್ ಟ್ರ್ಯಾಪ್, ಅಲ್ಲಿಂದ ಹೊಸ ಪೈಪ್ ಮೇನ್ ಲೈನ್‌ಗೆ. ಓನರ್ ಹೋದ ವಾರ ಹೊಸ ಪೈಪ್ ಹಾಕಿಸಿದ್ರು."
    tr: "Illi sār, siṅk keḷage. Eraḍu chēmbar grīs ṭryāp, allinda hosa paip mēn lain-ge. Ōnar hōda vāra hosa paip hākisidru."
    en: "Here, sir, under the sink. A two-chamber grease trap, and from there a new pipe to the main line. The owner had the new pipe laid last week."
  - who: officer
    t: "ಹ್ಮ್. ಚಿಮಣಿ ಹೊಗೆ ಎಲ್ಲಿಗೆ ಬಿಡ್ತೀರಿ? ಪಕ್ಕದ ಮನೆಯವರ ಕಿಟಕಿಗೆ ಬಿಟ್ರೆ ನಾಳೆ ಕಂಪ್ಲೇಂಟ್ ನನಗೇ ಬರುತ್ತೆ."
    tr: "Hm. Chimaṇi hoge ellige biḍtīri? Pakkada maneyavara kiṭakige biṭre nāḷe kampleṇṭ nanagē barutte."
    en: "Hm. Where will the chimney smoke go out? If it goes into the neighbours' window, tomorrow the complaint comes to me."
  - who: mahesh
    t: "ಡಕ್ಟ್ ಟೆರೇಸ್‌ನಿಂದ ಮೂರು ಅಡಿ ಮೇಲೆ ಹೋಗುತ್ತೆ ಸಾರ್. ಡ್ರಾಯಿಂಗ್ ಇದೆ, ನೋಡಿ. ಕೆಲಸ ಜನವರಿ ಮೊದಲ ವಾರ ಮುಗಿಯುತ್ತೆ."
    tr: "Ḍakṭ ṭerēs-ninda mūru aḍi mēle hōgutte sār. Ḍrāyiṅg ide, nōḍi. Kelasa Janavari modala vāra mugiyutte."
    en: "The duct goes three feet above the terrace, sir. Here's the drawing. The work will be finished in the first week of January."
  - who: officer
    t: "ಬೋರ್ಡ್ ಸರಿ ಇದೆ, ಕನ್ನಡ ಮೇಲೆ ದೊಡ್ಡದಾಗಿ ಇದೆ. ಒಳ್ಳೇದು. ಅರ್ಧ ಜನ ಇಂಗ್ಲಿಷ್ ದೊಡ್ಡದಾಗಿ ಹಾಕಿ, ಸೀಲ್ ಆದ್ಮೇಲೆ ಓಡಿ ಬರ್ತಾರೆ."
    tr: "Bōrḍ sari ide, Kannaḍa mēle doḍḍadāgi ide. Oḷḷēdu. Ardha jana iṅgliṣ doḍḍadāgi hāki, sīl ādmēle ōḍi bartāre."
    en: "The board is fine; the Kannada is big and on top. Good. Half the people put the English big and come running after they get sealed."
  - who: officer
    t: "ಸರಿ. ಪೇಪರ್ ಎಲ್ಲಾ ಸರಿ ಇದೆ. ಆದ್ರೆ ನೋಡಿ, ನನ್ನ ರಿಪೋರ್ಟ್ ಆದ್ಮೇಲೆ ಫೈಲ್ ಇನ್ನೂ ನಾಲ್ಕು ಟೇಬಲ್ ದಾಟ್ಬೇಕು. ಹೊಸ ವರ್ಷದ ರಜೆ, ಸಾಹೇಬ್ರು ಬ್ಯುಸಿ… ಜನವರಿ ಇಪ್ಪತ್ತಾರಕ್ಕೆ ಓಪನಿಂಗ್ ಅಂದ್ರಿ ಅಲ್ವಾ?"
    tr: "Sari. Pēpar ellā sari ide. Ādre nōḍi, nanna ripōrṭ ādmēle phail innū nālku ṭēbal dāṭbēku. Hosa varṣada raje, sāhēbru byusi… Janavari ippattārakke ōpaniṅg andri alvā?"
    en: "All right. The papers are all in order. But look, after my report the file still has to cross four desks. New Year holidays, the bosses are busy… You said the opening is on the twenty-sixth of January, didn't you?"
  - who: mahesh
    t: "ಹೌದು ಸಾರ್."
    tr: "Haudu sār."
    en: "Yes, sir."
  - who: officer
    t: "ಅದಕ್ಕೇ ಹೇಳ್ತಿದೀನಿ. ಕೆಲವರು ನಮ್ಮನ್ನ ಸ್ವಲ್ಪ “ನೋಡ್ಕೊಂಡ್ರೆ” ಫೈಲ್ ಬೇಗ ಓಡುತ್ತೆ. ನಾನೇ ಕೈಯಲ್ಲಿ ತಗೊಂಡು ಹೋಗಿ ಸಹಿ ಮಾಡಿಸ್ಕೊಂಡು ಬರ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ… ಅದರ ಪಾಡಿಗೆ ಅದು ಹೋಗುತ್ತೆ. ಯಾವಾಗ ತಲುಪುತ್ತೋ ಗೊತ್ತಿಲ್ಲ."
    tr: "Adakkē hēḷtidīni. Kelavaru nammanna svalpa “nōḍkoṇḍre” phail bēga ōḍutte. Nānē kaiyalli tagoṇḍu hōgi sahi māḍiskoṇḍu bartīni. Illāndre… adara pāḍige adu hōgutte. Yāvāga taluputtō gottilla."
    en: "That's why I'm telling you. When some people “take care of” us a little, the file runs fast. I carry it by hand myself and get the signatures. Otherwise… it goes at its own pace. Who knows when it gets there."
  - who: mahesh
    t: "ಅರ್ಥ ಆಯ್ತು ಸಾರ್. ಆದ್ರೆ ಈ ಹೆಸರಲ್ಲಿ ಸುಳ್ಳು ಲೆಕ್ಕ ಇರಲ್ಲ ಅಂತ ನಾನು ಅಮ್ಮನಿಗೆ ಮಾತು ಕೊಟ್ಟಿದೀನಿ. ಫೀಸ್ ಏನಿದೆಯೋ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಕಟ್ಟಿದೀನಿ. ಸರ್ಕಾರಕ್ಕೆ ಬೇರೆ ಏನಾದ್ರೂ ಕಟ್ಬೇಕಾದ್ರೆ ಚಲನ್ ಕೊಡಿ, ರಶೀದಿ ಸಮೇತ ಕಟ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ ಕಾಯ್ತೀನಿ."
    tr: "Artha āytu sār. Ādre ī hesaralli suḷḷu lekka iralla anta nānu ammanige mātu koṭṭidīni. Phīs ēnideyō ān-lain-nalli kaṭṭidīni. Sarkārakke bēre ēnādrū kaṭbēkādre chalan koḍi, raśīdi samēta kaṭtīni. Illāndre kāytīni."
    en: "I understand, sir. But I've given my mother my word that there'll be no false accounts under this name. Whatever the fee is, I've paid it online. If anything else is due to the government, give me a challan and I'll pay it against a receipt. Otherwise, I'll wait."
  - who: officer
    t: "ನಾನೇನು ಕೇಳಿದ್ನಾ? ಸಿಸ್ಟಮ್ ಹೇಗಿದೆ ಅಂತ ಹೇಳಿದೆ ಅಷ್ಟೇ. ಸರಿ. ನನ್ನ ರಿಪೋರ್ಟ್ ಇವತ್ತೇ ಅಪ್‌ಲೋಡ್ ಮಾಡ್ತೀನಿ. ಆದ್ರೆ ನೆನಪಿರ್ಲಿ, ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ ಲೈಸೆನ್ಸ್ ಕಾಪಿ ಬರದೆ ಫೈನಲ್ ಅಪ್ರೂವಲ್ ಆಗಲ್ಲ."
    tr: "Nānēnu kēḷidnā? Sisṭam hēgide anta hēḷide aṣṭē. Sari. Nanna ripōrṭ ivattē ap-lōḍ māḍtīni. Ādre nenapirli, ef-es-es-e-ai laisens kāpi barade phainal aprūval āgalla."
    en: "(Stiffly) Did I ask for anything? I only told you how the system is. All right. I'll upload my report today itself. But remember: without a copy of the FSSAI licence, there's no final approval."
  - who: mahesh
    t: "ಖಂಡಿತ ಸಾರ್. ಕಾಫಿ?"
    tr: "Khaṇḍita sār. Kāphi?"
    en: "Of course, sir. Coffee?"
  - who: officer
    t: "ಇವತ್ತು ಬೇಡ. ಓಪನಿಂಗ್ ಆದ್ಮೇಲೆ ಬರ್ತೀನಿ. ದುಡ್ಡು ಕೊಟ್ಟು ಕುಡೀತೀನಿ."
    tr: "Ivattu bēḍa. Ōpaniṅg ādmēle bartīni. Duḍḍu koṭṭu kuḍītīni."
    en: "Not today. I'll come after the opening. And I'll pay for it."
  - scene: "When he has gone, Mahesh sits on an upturned paint bucket and phones Kavya."
  - who: kavya
    t: "ಸರಿಯಾಗಿ ಮಾಡಿದೆ. ಸ್ಟೇಟಸ್ ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ದಿನಾ ತಗೋತೀನಿ. ಜನವರಿ ಹತ್ತರೊಳಗೆ ಫೈಲ್ ಮುಂದೆ ಹೋಗದಿದ್ರೆ ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ಕಂಪ್ಲೇಂಟ್ ಹಾಕೋಣ. ಕೈ ನಡುಗ್ತಿದೆಯಾ?"
    tr: "Sariyāgi māḍide. Sṭēṭas skrīnśāṭ dinā tagōtīni. Janavari hattaroḷage phail munde hōgadidre ān-lain-nallē kampleṇṭ hākōṇa. Kai naḍugtideyā?"
    en: "You did the right thing. I'll take a screenshot of the status every day. If the file hasn't moved by the tenth of January, we'll file a complaint online. Is your hand shaking?"
  - who: mahesh
    t: "ಸ್ವಲ್ಪ. ರಿಸೈನ್ ಮಾಡಿದ ದಿನಕ್ಕಿಂತ ಕಮ್ಮಿ."
    tr: "Svalpa. Risain māḍida dinakkinta kammi."
    en: "A little. Less than on the day I resigned."

  - section: "The fire question"
    learn: "fire safety: phair en-ō-si, eksṭiṅgviṣar, gyās līk ḍiṭekṭar, mēn vālv · hedging what officials say: sāmānyavāgi, bāyimātalli, baravaṇigeyalli alla · concessive pairs: bēkirali biḍali"
  - scene: "Saturday, 27 December. Mr. Murthy has come down to see the kitchen. He stops at the back door, where an iron cage for gas cylinders is being welded."
  - who: landlord
    t: "ಮಹೇಶ್, ಮೇಲೆ ನಾನು ಮಲಗೋದು. ಕೆಳಗೆ ನಾಲ್ಕು ಗ್ಯಾಸ್ ಸಿಲಿಂಡರ್. ನನಗೂ ರಾತ್ರಿ ನಿದ್ದೆ ಬರ್ಬೇಕಲ್ಲ. ಫೈರ್ ಎನ್‌ಓಸಿ ತಗೊಂಡಿದೀರಾ?"
    tr: "Mahēś, mēle nānu malagōdu. Keḷage nālku gyās silinḍar. Nanagū rātri nidde barbēkalla. Phair en-ō-si tagoṇḍidīrā?"
    en: "Mahesh, I sleep upstairs. Downstairs, four gas cylinders. I need to sleep at night too. Have you got a fire NOC?"
  - who: mahesh
    t: "ಅದನ್ನೇ ಕೇಳೋಕೆ ನಿನ್ನೆ ಹತ್ತಿರದ ಫೈರ್ ಸ್ಟೇಷನ್‌ಗೆ ಹೋಗಿದ್ದೆ ಸಾರ್. ಅಲ್ಲಿನ ಅಧಿಕಾರಿ ಹೇಳಿದ್ರು: ಗ್ರೌಂಡ್ ಫ್ಲೋರ್, ಐನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್, ಕೂರೋ ವ್ಯವಸ್ಥೆ ಇಲ್ಲದ ಸಣ್ಣ ಹೋಟೆಲ್‌ಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಪೂರ್ತಿ ಎನ್‌ಓಸಿ ಬೇಕಾಗಲ್ಲ ಅಂತ. ಎತ್ತರದ ಕಟ್ಟಡ, ದೊಡ್ಡ ಜಾಗ, ತುಂಬಾ ಜನ ಕೂರೋ ರೆಸ್ಟೋರೆಂಟ್‌ಗೆ ಬೇಕು ಅಂದ್ರು."
    tr: "Adannē kēḷōke ninne hattirada phair sṭēṣan-ge hōgidde sār. Allina adhikāri hēḷidru: grauṇḍ phlōr, ainūru skvēr fīṭ, kūrō vyavasthe illada saṇṇa hōṭel-ge sāmānyavāgi pūrti en-ō-si bēkāgalla anta. Ettarada kaṭṭaḍa, doḍḍa jāga, tumbā jana kūrō resṭōreṇṭ-ge bēku andru."
    en: "That's exactly what I went to ask at the nearest fire station yesterday, sir. The officer there said that a small ground-floor hotel of five hundred square feet with no seating usually doesn't need a full NOC. He said it's needed for tall buildings, large premises, restaurants where lots of people sit."
  - who: landlord
    t: "“ಸಾಮಾನ್ಯವಾಗಿ” ಅಂದ್ರು. ಬರವಣಿಗೆಯಲ್ಲಿ ಕೊಟ್ರಾ?"
    tr: "“Sāmānyavāgi” andru. Baravaṇigeyalli koṭrā?"
    en: "He said “usually”. Did he give it in writing?"
  - who: mahesh
    t: "ಇಲ್ಲ ಸಾರ್, ಬಾಯಿಮಾತಲ್ಲಿ. ಅದಕ್ಕೇ ಭಟ್ರ ಹತ್ರಾನೂ ಕೇಳಿದೆ. ನಿಯಮ ಕಟ್ಟಡದ ಎತ್ತರ, ಜಾಗ, ಜನರ ಸಂಖ್ಯೆ ಮೇಲೆ ಡಿಪೆಂಡ್ ಆಗುತ್ತೆ, ಬದಲಾಗ್ತಾನೂ ಇರುತ್ತೆ ಅಂದ್ರು. ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್‌ನವರು ಕೇಳಿದ್ರೆ ಆಗ ಅರ್ಜಿ ಹಾಕೋಣ ಅಂತ. ಆದ್ರೆ ಎನ್‌ಓಸಿ ಬೇಕಿರಲಿ ಬಿಡಲಿ, ಸೇಫ್ಟಿ ನಮಗೆ ಬೇಕು."
    tr: "Illa sār, bāyimātalli. Adakkē Bhaṭra hatrānū kēḷide. Niyama kaṭṭaḍada ettara, jāga, janara saṅkhye mēle ḍipeṇḍ āgutte, badalāgtānū irutte andru. Ṭrēḍ laisens-navaru kēḷidre āga arji hākōṇa anta. Ādre en-ō-si bēkirali biḍali, sēphṭi namage bēku."
    en: "No, sir, only by word of mouth. That's why I asked Mr. Bhat too. He said the rule depends on the building's height, the area and the number of people, and it keeps changing. If the trade-licence people ask for it, we'll apply then. But NOC or no NOC, we need the safety."
  - who: landlord
    t: "ಅದು ಸರಿಯಾದ ಮಾತು. ಏನೇನು ಹಾಕಿಸ್ತೀರಿ?"
    tr: "Adu sariyāda mātu. Ēnēnu hākistīri?"
    en: "That's the right way to talk. What will you have installed?"
  - who: mahesh
    t: "ಎರಡು ಫೈರ್ ಎಕ್ಸ್‌ಟಿಂಗ್ವಿಷರ್, ಒಂದು ಅಡುಗೆಮನೆಯಲ್ಲಿ, ಒಂದು ಕೌಂಟರ್ ಹತ್ರ. ಎಣ್ಣೆ ಬೆಂಕಿಗೆ ಬೇರೆ ತರದ್ದು. ಗ್ಯಾಸ್ ಲೀಕ್ ಡಿಟೆಕ್ಟರ್, ಅಲಾರಂ ಜೊತೆ. ಸಿಲಿಂಡರ್ ಒಳಗೆ ಅಲ್ಲ, ಹೊರಗೆ ಈ ಕಬ್ಬಿಣದ ಕೇಜ್‌ನಲ್ಲಿ, ಗಾಳಿ ಓಡಾಡೋ ಜಾಗದಲ್ಲಿ. ಪೈಪ್‌ಲೈನ್ ಗ್ಯಾಸ್ ಕಂಪನಿಯ ಅಧಿಕೃತ ಫಿಟ್ಟರ್ ಹಾಕ್ತಾರೆ. ರಾತ್ರಿ ಹೋಗೋವಾಗ ಮೇನ್ ವಾಲ್ವ್ ಬಂದ್."
    tr: "Eraḍu phair eksṭiṅgviṣar, ondu aḍugemaneyalli, ondu kauṇṭar hatra. Eṇṇe beṅkige bēre taraddu. Gyās līk ḍiṭekṭar, alāram jote. Silinḍar oḷage alla, horage ī kabbiṇada kēj-nalli, gāḷi ōḍāḍō jāgadalli. Paip-lain gyās kampaniya adhikr̥ta phiṭṭar hāktāre. Rātri hōgōvāga mēn vālv band."
    en: "Two fire extinguishers, one in the kitchen and one by the counter. A different type for oil fires. A gas-leak detector with an alarm. The cylinders not inside but out here, in this iron cage, where the air moves. The pipeline will be fitted by the gas company's authorised fitter. When we leave at night, the main valve goes off."
  - who: landlord
    t: "ಮತ್ತೆ ಸ್ಟಾಫ್‌ಗೆ ಅದನ್ನ ಉಪಯೋಗಿಸೋದು ಹೇಳಿಕೊಡಿ. ಗೋಡೆ ಮೇಲೆ ನೇತಾಡೋ ಎಕ್ಸ್‌ಟಿಂಗ್ವಿಷರ್ ಯಾರಿಗೂ ಉಪಯೋಗಿಸೋಕೆ ಬರದಿದ್ರೆ ಅದು ಬರೀ ಅಲಂಕಾರ."
    tr: "Matte sṭāf-ge adanna upayōgisōdu hēḷikoḍi. Gōḍe mēle nētāḍō eksṭiṅgviṣar yārigū upayōgisōke baradidre adu barī alaṅkāra."
    en: "And teach the staff how to use them. An extinguisher hanging on the wall that nobody knows how to use is just decoration."
  - who: mahesh
    t: "ಓಪನಿಂಗ್‌ಗೆ ಮುಂಚೆ ಒಂದು ಡೆಮೋ ಮಾಡಿಸ್ತೀನಿ ಸಾರ್. ನೀವೂ ಬನ್ನಿ."
    tr: "Ōpaniṅg-ge muñche ondu ḍemō māḍistīni sār. Nīvū banni."
    en: "I'll arrange a demonstration before the opening, sir. You come too."
  - who: landlord
    t: "ಬರ್ತೀನಿ. ಎಪ್ಪತ್ತು ವರ್ಷ ಆದ್ರೂ ಕಲಿಯೋದು ಮುಗಿದಿಲ್ಲ."
    tr: "Bartīni. Eppattu varṣa ādrū kaliyōdu mugidilla."
    en: "I'll come. Seventy years old, and the learning still isn't over."
