lines:
  - chapter: "Chapter 6 — Seemantha"
  - section: "🌼 The morning of the seemantha"
    learn: "five rices: chitrānna, puḷiyōgare, mosaranna, kāyi anna, sihi pongal · -ಅಷ್ಟರಲ್ಲಿ (by the time) · causatives ಹಾಕಿಸು, ಇಡಿಸು (have something put)"
  - scene: "Sunday, 20 September 2026, seven in the morning, the Rao house in Jayanagar. Shwetha is thirty-two weeks pregnant, in her eighth month; Ajji has been home for five weeks. Mango-leaf garlands are going up over the door, and the kitchen smells of tempering."
  - who: vimala
    t: "ಲಕ್ಷ್ಮಿ, ಮಲ್ಲಿಗೆ ಹೂವು ತಂದೆ ನೋಡು, ಹತ್ತು ಮೊಳ. ಗಾಂಧಿ ಬಜಾರಿಗೆ ಬೆಳಿಗ್ಗೆ ಆರು ಗಂಟೆಗೇ ಹೋಗಿದ್ದೆ, ಆಮೇಲೆ ಹೋದ್ರೆ ಒಳ್ಳೆ ಹೂವು ಸಿಗಲ್ಲ."
    tr: "Lakshmī, mallige hūvu tande nōḍu, hattu moḷa. Gāndhi Bajārige beḷigge āru gaṇṭegē hōgidde, āmēle hōdre oḷḷe hūvu sigalla."
    en: "Lakshmi, look, I brought the jasmine — ten arm-lengths. I went to Gandhi Bazaar at six this morning; any later and you don't get good flowers."
  - who: amma
    t: "ಎಷ್ಟು ಉಪಕಾರ ಮಾಡಿದೆ ವಿಮಲಾ. ಪುರೋಹಿತರು ಹತ್ತೂವರೆಗೆ ಬರ್ತಾರೆ. ಅಷ್ಟರಲ್ಲಿ ಐದು ಥರದ ಅನ್ನ ರೆಡಿ ಆಗಿರ್ಬೇಕು, ಹಾಲ್ ಅಲಂಕಾರ ಮುಗಿದಿರ್ಬೇಕು."
    tr: "Eṣṭu upakāra māḍide Vimalā. Purōhitaru hattūvarege bartāre. Aṣṭaralli aidu tharada anna reḍi āgirbēku, hāl alaṅkāra mugidirbēku."
    en: "What a help you are, Vimala. The priest comes at half past ten. By then the five kinds of rice have to be ready and the hall decorations finished."
  - who: sam
    t: "ಐದು ಥರದ ಅನ್ನ ಯಾಕೆ ಆಂಟಿ? ಒಂದು ಬಿಸಿಬೇಳೆಬಾತ್ ಸಾಕಾಗಲ್ವಾ?"
    tr: "Aidu tharada anna yāke āṇṭi? Ondu bisibēḷebāt sākāgalvā?"
    en: "Why five kinds of rice, Aunty? Wouldn't one bisibelebath do?"
  - who: amma
    t: "ಸೀಮಂತದಲ್ಲಿ ಚಿತ್ರಾನ್ನ, ಪುಳಿಯೋಗರೆ, ಮೊಸರನ್ನ, ಕಾಯಿ ಅನ್ನ, ಸಿಹಿ ಪೊಂಗಲ್, ಐದೂ ಮಾಡೋದು ನಮ್ಮ ಮನೆ ಪದ್ಧತಿ. ಬಸುರಿಗೆ ಯಾವ ರುಚಿ ಆಸೆ ಆಗುತ್ತೋ, ಅದೆಲ್ಲಾ ತಟ್ಟೇಲಿ ಇರ್ಲಿ ಅಂತ."
    tr: "Sīmantadalli chitrānna, puḷiyōgare, mosaranna, kāyi anna, sihi pongal, aidū māḍōdu namma mane paddhati. Basurige yāva ruchi āse āguttō, adellā taṭṭēli irli anta."
    en: "At a seemantha we make chitranna, puliyogare, curd rice, coconut rice and sweet pongal — all five. It's our family custom: whatever taste the pregnant woman craves, let it all be on her plate."
  - who: vimala
    t: "ಹಾಗಾದ್ರೆ ಸಿಹಿ ಪೊಂಗಲ್ ಜಾಸ್ತಿ ಮಾಡಿಸು ಲಕ್ಷ್ಮಿ. ಬಸುರಿಯರಿಗೆ ಸಿಹಿ ಆಸೆ ಜಾಸ್ತಿ."
    tr: "Hāgādre sihi pongal jāsti māḍisu Lakshmī. Basuriyarige sihi āse jāsti."
    en: "Then have plenty of sweet pongal made, Lakshmi. Pregnant women always crave sweets."
  - who: amma
    t: "ಇಲ್ಲ ವಿಮಲಾ, ಶ್ವೇತಾಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಅಂತ ಡಾಕ್ಟ್ರು ಹೇಳಿದಾರೆ. ಅವಳಿಗೆ ಪೊಂಗಲ್ ಶಾಸ್ತ್ರಕ್ಕೆ ಒಂದು ಚಮಚ ಅಷ್ಟೇ. ಅಡುಗೆಯವರಿಗೆ ಬೆಲ್ಲ ಕಮ್ಮಿ ಹಾಕಿ ಅಂತ ಹೇಳಿದೀನಿ."
    tr: "Illa Vimalā, Shwētāge śugar bārḍarlain anta ḍākṭru hēḷidāre. Avaḷige pongal śāstrakke ondu chamacha aṣṭē. Aḍugeyavarige bella kammi hāki anta hēḷidīni."
    en: "No, Vimala — the doctor says Shwetha's sugar is borderline. For her, one spoon of pongal for the ritual's sake, that's all. I've told the cooks to go easy on the jaggery."
  - who: kiran
    t: "ಅಮ್ಮ, ಶಾಮಿಯಾನದವರು ಬಂದ್ರು. ಕುರ್ಚಿ ಎಷ್ಟು ಬೇಕು, ಎಲ್ಲಿ ಹಾಕ್ಬೇಕು ಅಂತ ಕೇಳ್ತಿದಾರೆ."
    tr: "Amma, śāmiyānadavaru bandru. Kurchi eṣṭu bēku, elli hākbēku anta kēḷtidāre."
    en: "Amma, the shamiana people are here. They're asking how many chairs and where to put them."
  - who: amma
    t: "ಐವತ್ತು ಕುರ್ಚಿ ಹಾಕಿಸು. ಅಜ್ಜಿಗೆ ಕೈ ಇರೋ ಮೆತ್ತನೆ ಕುರ್ಚಿ ಬೇರೆ, ಅದನ್ನ ಮಣೆ ಪಕ್ಕದಲ್ಲೇ, ಮುಂದೆನೇ ಇಡಿಸು."
    tr: "Aivattu kurchi hākisu. Ajjige kai irō mettane kurchi bēre, adanna maṇe pakkadallē, mundenē iḍisu."
    en: "Have fifty chairs put out. And a separate cushioned armchair for Ajji — have it placed right in front, next to the ritual seat."
  - who: sam
    t: "ಮಾವಿನ ಎಲೆ ತೋರಣ ನಾನು ಕಟ್ತೀನಿ. ಈ ಸಲ ಉಲ್ಟಾ ಕಟ್ಟಲ್ಲ, ಪ್ರಾಮಿಸ್."
    tr: "Māvina ele tōraṇa nānu kaṭtīni. Ī sala ulṭā kaṭṭalla, prāmis."
    en: "I'll tie up the mango-leaf garland. I won't hang it upside down this time, promise."
  - who: kiran
    t: "ಕಳೆದ ಯುಗಾದಿಗೆ ನೀನು ಕಟ್ಟಿದ್ದು ಇನ್ನೂ ಅಜ್ಜಿ ನೆನಪಿಸ್ಕೊಂಡು ನಗ್ತಾರೆ."
    tr: "Kaḷeda Yugādige nīnu kaṭṭiddu innū ajji nenapiskoṇḍu nagtāre."
    en: "Ajji still laughs about the one you tied last Ugadi."
  - who: appa
    t: "ಅಮ್ಮ ಆಗ್ಲೇ ಎದ್ದು, ಸ್ನಾನ ಮಾಡಿ, ರೇಷ್ಮೆ ಸೀರೆ ಉಟ್ಕೊಂಡು ಕೂತಿದಾರೆ. ಏಳು ಗಂಟೆಗೇ ರೆಡಿ!"
    tr: "Amma āglē eddu, snāna māḍi, rēṣme sīre uṭkoṇḍu kūtidāre. Ēḷu gaṇṭegē reḍi!"
    en: "Amma is already up, bathed, and sitting there in her silk saree. Ready at seven!"
  - who: amma
    t: "ಅದೇ ನನ್ನ ಭಯ. ಸ್ಟೆಂಟ್ ಹಾಕಿ ಇನ್ನೂ ಎರಡು ತಿಂಗಳೂ ಆಗಿಲ್ಲ. ಸಂಭ್ರಮದಲ್ಲಿ ಮೈ ಮರೆತು ಓಡಾಡ್ತಾರೆ, ನೋಡ್ತಿರಿ."
    tr: "Adē nanna bhaya. Sṭeṇṭ hāki innū eraḍu tiṅgaḷū āgilla. Sambhramadalli mai maretu ōḍāḍtāre, nōḍtiri."
    en: "That's exactly what scares me. It's not even two months since the stent. In all the excitement she'll forget herself and rush around, you'll see."

  - section: "👵 Ajji will not sit this out"
    learn: "prohibitions: -ಬಾರದು, -ಬೇಡ · ಯಾವ ಕಾರಣಕ್ಕೂ (for any reason) · -ಬೇಕು ಅಂದ್ರೆ (if … is to happen) · ಹಠ (stubbornness)"
  - scene: "Ajji's room. She sits on her bed in a green silk saree, a plate of turmeric, kumkum and akshate beside her. Appa stands in the doorway with her pill box."
  - who: ajji
    t: "ರಮೇಶ, ಇವತ್ತು ನನ್ನ ಮೊಮ್ಮಗಳ ಸೀಮಂತ. ಮನೆಗೆ ನಾನೇ ಹಿರಿಯಳು, ಮೊದಲ ಆಶೀರ್ವಾದ ನಂದೇ. ಶಾಸ್ತ್ರ ಮುಗಿಯೋವರೆಗೂ ಅವಳ ಪಕ್ಕದಲ್ಲೇ ಇರ್ತೀನಿ. ಅದರಲ್ಲಿ ಯಾವ ಮಾತೂ ಇಲ್ಲ."
    tr: "Ramēsha, ivattu nanna mommagaḷa sīmanta. Manege nānē hiriyaḷu, modala āśīrvāda nandē. Śāstra mugiyōvaregū avaḷa pakkadallē irtīni. Adaralli yāva mātū illa."
    en: "Ramesh, today is my granddaughter's seemantha. I'm the eldest in this house, so the first blessing is mine. I'll stay right beside her until the rituals are over. No arguments."
  - who: appa
    t: "ಸರಿ ಅಮ್ಮ, ಮೊದಲ ಆಶೀರ್ವಾದ ನಿಮ್ದೇ. ಆದ್ರೆ ಕುರ್ಚಿ ಮೇಲೆ ಕೂತ್ಕೊಂಡೇ. ಡಾಕ್ಟ್ರು ಏನು ಹೇಳಿದ್ರು ನೆನಪಿದೆ ತಾನೇ? ಜಾಸ್ತಿ ಹೊತ್ತು ನಿಲ್ಲಬಾರದು, ಆಯಾಸ ಮಾಡ್ಕೊಳ್ಳಬಾರದು."
    tr: "Sari amma, modala āśīrvāda nimdē. Ādre kurchi mēle kūtkoṇḍē. Ḍākṭru ēnu hēḷidru nenapide tānē? Jāsti hottu nillabāradu, āyāsa māḍkoḷḷabāradu."
    en: "Fine, Amma, the first blessing is yours. But from the chair. You remember what the doctor said, don't you? No standing for long, and no wearing yourself out."
  - who: ajji
    t: "ನೆಲದ ಮೇಲೆ ಮಣೆ ಹಾಕಿ ಕೂತ್ಕೊಳ್ತೀನಿ. ಕುರ್ಚಿ ಮೇಲೆ ಕೂತು ಆಶೀರ್ವಾದ ಮಾಡಿದ್ರೆ ನೆಂಟರು ಏನಂತಾರೆ?"
    tr: "Nelada mēle maṇe hāki kūtkoḷtīni. Kurchi mēle kūtu āśīrvāda māḍidre neṇṭaru ēnantāre?"
    en: "I'll sit on a wooden plank on the floor. If I bless her from a chair, what will the relatives say?"
  - who: sam
    t: "ಅಜ್ಜಿ, ನೆಂಟರು ಏನೂ ಅನ್ನಲ್ಲ. ಎಲ್ರೂ 'ನೋಡಿ, ಅಜ್ಜಿ ಎಷ್ಟು ಧೈರ್ಯವಾಗಿ ಬಂದಿದಾರೆ' ಅಂತಾರೆ. ಆದ್ರೆ ಕೆಳಗೆ ಕೂತ್ರೆ ಎದ್ದೇಳೋಕೆ ಕಷ್ಟ ಆಗುತ್ತೆ ಅಂತ ನಿನ್ನೆ ನೀವೇ ಹೇಳಿದ್ರಿ."
    tr: "Ajji, neṇṭaru ēnū annalla. Ellrū 'nōḍi, ajji eṣṭu dhairyavāgi bandidāre' antāre. Ādre keḷage kūtre eddēḷōke kaṣṭa āgutte anta ninne nīvē hēḷidri."
    en: "Ajji, the relatives won't say a thing. Everyone will say, 'Look how bravely Ajji has come.' But you said yourself yesterday that if you sit down low, it's hard to get up."
  - who: ajji
    t: "ನೀನೂ ಇವರ ಪಾರ್ಟಿಗೆ ಸೇರ್ಕೊಂಡ್ಯಾ ಸ್ಯಾಮ್? ಸರಿ, ಕುರ್ಚಿನೇ ಆಗ್ಲಿ."
    tr: "Nīnū ivara pārṭige sērkoṇḍyā Sām? Sari, kurchinē āgli."
    en: "(smiling) So you've joined their side too, Sam? Fine, let it be the chair."
  - who: appa
    t: "ಇನ್ನೊಂದು ವಿಷಯ. ಬೆಳಿಗ್ಗೆ ಮಾತ್ರೆ ತಗೊಂಡ್ರಾ? ತಿಂಡಿ ತಿಂದ್ರಾ?"
    tr: "Innondu viṣaya. Beḷigge mātre tagoṇḍrā? Tiṇḍi tindrā?"
    en: "One more thing. Did you take your morning tablets? Did you eat breakfast?"
  - who: ajji
    t: "ಶುಭ ಕಾರ್ಯ ಅಲ್ವಾ, ಪೂಜೆ ಮುಗಿಯೋವರೆಗೂ ಉಪವಾಸ ಇರ್ತೀನಿ. ಮಾತ್ರೆ ಆಮೇಲೆ ತಗೋತೀನಿ."
    tr: "Śubha kārya alvā, pūje mugiyōvaregū upavāsa irtīni. Mātre āmēle tagōtīni."
    en: "It's an auspicious day, isn't it? I'll fast until the puja is over. I'll take the tablets afterwards."
  - who: appa
    t: "ಅಮ್ಮಾ, ಅದು ಮಾತ್ರ ಆಗಲ್ಲ. ರಕ್ತ ತೆಳು ಮಾಡೋ ಮಾತ್ರೆ ಯಾವ ಕಾರಣಕ್ಕೂ ತಪ್ಪಿಸಬಾರದು ಅಂತ ಡಾಕ್ಟ್ರು ಮೀರಾ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದಾರೆ. ಖಾಲಿ ಹೊಟ್ಟೇಲಿ ತಗೊಂಡ್ರೆ ಹೊಟ್ಟೆ ಉರಿ ಬರುತ್ತೆ. ಎರಡು ಇಡ್ಲಿ ತಿನ್ನಿ, ಆಮೇಲೆ ಮಾತ್ರೆ."
    tr: "Ammā, adu mātra āgalla. Rakta teḷu māḍō mātre yāva kāraṇakkū tappisabāradu anta ḍākṭru Mīrā spaṣṭavāgi hēḷidāre. Khāli hoṭṭēli tagoṇḍre hoṭṭe uri barutte. Eraḍu iḍli tinni, āmēle mātre."
    en: "Amma, that one I won't allow. Dr. Meera said very clearly that the blood thinner must not be skipped for any reason. On an empty stomach it'll give you acidity. Eat two idlis, then the tablet."
  - who: ajji
    t: "ದೇವರೇ… ಆ ಡಾಕ್ಟ್ರಮ್ಮ ನನ್ನ ಉಪವಾಸನೂ ಕಿತ್ಕೊಂಡ್ಬಿಟ್ರು."
    tr: "Dēvarē… ā ḍākṭramma nanna upavāsanū kitkoṇḍbiṭru."
    en: "(sighing) Oh God… that lady doctor has taken even my fasting away from me."
  - who: appa
    t: "ಅವರು ನಿಮ್ಮ ಜೀವ ಉಳಿಸಿದಾರೆ ಅಮ್ಮ. ಒಂದು ಉಪವಾಸ ತಪ್ಪಿದ್ರೆ ದೇವರು ಕ್ಷಮಿಸ್ತಾನೆ."
    tr: "Avaru nimma jīva uḷisidāre amma. Ondu upavāsa tappidre dēvaru kṣamistāne."
    en: "She saved your life, Amma. God will forgive one missed fast."
  - who: ajji
    t: "ಸರಿ ಸರಿ, ಇಡ್ಲಿ ತಗೊಂಡ್ ಬಾ. ನನ್ನ ಮರಿಮಗುನ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಬೇಕು ಅಂದ್ರೆ ನಿಮ್ಮೆಲ್ಲರ ಮಾತು ಕೇಳ್ಲೇಬೇಕು."
    tr: "Sari sari, iḍli tagoṇḍ bā. Nanna marimaguna kaiyalli ettikoḷbēku andre nimmellara mātu kēḷlēbēku."
    en: "All right, all right, bring the idlis. If I'm going to hold my great-grandchild in my arms, I suppose I have to listen to all of you."

  - section: "🙏 The priest and the rituals"
    learn: "ritual words: ಸಂಕಲ್ಪ, ಅಕ್ಷತೆ, ಬಳೆ ಶಾಸ್ತ್ರ, ಮಡಿಲು ತುಂಬು, ಮುತ್ತೈದೆ, ಆರತಿ, ಬೀಗತಿ · blessings with -ಲಿ: ಸುಖ ಪ್ರಸವ ಆಗಲಿ"
  - scene: "Half past ten. The hall is full. Shwetha sits on a decorated seat in a new green silk saree, jasmine in her hair, Pradeep beside her. Sumitra and Shankar came early and have been helping in the kitchen. Ajji sits in her armchair at the front."
  - who: purohit
    t: "ಎಲ್ಲರೂ ಸ್ವಲ್ಪ ಶಾಂತವಾಗಿ ಕೂತ್ಕೊಳ್ಳಿ. ಮೊದಲು ಗಣಪತಿ ಪೂಜೆ, ಆಮೇಲೆ ಸಂಕಲ್ಪ. ಶ್ವೇತಾ ಅವರೇ, ಪ್ರದೀಪ್ ಅವರೇ, ಕೈಯಲ್ಲಿ ಸ್ವಲ್ಪ ಅಕ್ಷತೆ ಹಿಡ್ಕೊಳ್ಳಿ."
    tr: "Ellarū svalpa śāntavāgi kūtkoḷḷi. Modalu Gaṇapati pūje, āmēle saṅkalpa. Shwētā avarē, Pradīp avarē, kaiyalli svalpa akṣate hiḍkoḷḷi."
    en: "Everyone, please settle down. First the Ganapati puja, then the sankalpa, the formal vow. Shwetha, Pradeep, hold a little akshate in your hands."
  - who: sam
    t: "ಅಕ್ಷತೆ ಅಂದ್ರೆ ಏನು ಕಿರಣ್?"
    tr: "Akṣate andre ēnu Kiraṇ?"
    en: "(whispering) What's akshate, Kiran?"
  - who: kiran
    t: "ಅರಿಶಿನ ಹಚ್ಚಿದ ಅಕ್ಕಿ. ಆಶೀರ್ವಾದ ಮಾಡೋವಾಗ ತಲೆ ಮೇಲೆ ಹಾಕ್ತಾರೆ. ಕೊನೇಲಿ ನಿನ್ನ ಕೈಗೂ ಕೊಡ್ತಾರೆ, ರೆಡಿಯಾಗಿರು."
    tr: "Ariśina hachchida akki. Āśīrvāda māḍōvāga tale mēle hāktāre. Konēli ninna kaigū koḍtāre, reḍiyāgiru."
    en: "(whispering) Rice coloured with turmeric. People sprinkle it on your head when they bless you. They'll hand you some at the end too, so be ready."
  - who: purohit
    t: "ಇದು ಸೀಮಂತೋನ್ನಯನ ಸಂಸ್ಕಾರ. ತಾಯಿಯ ಮನಸ್ಸು ಸಂತೋಷವಾಗಿದ್ರೆ ಹೊಟ್ಟೆಯಲ್ಲಿರೋ ಮಗುವೂ ಸಂತೋಷವಾಗಿರುತ್ತೆ ಅಂತ ನಮ್ಮ ಹಿರಿಯರು ನಂಬಿದ್ರು. ಅದಕ್ಕೇ ಇವತ್ತು ಈ ಹುಡುಗಿಗೆ ಯಾವ ಚಿಂತೆನೂ ಇರಬಾರದು, ಯಾರೂ ಅವಳಿಗೆ ಬೇಜಾರು ಮಾಡಬಾರದು."
    tr: "Idu sīmantōnnayana saṁskāra. Tāyiya manassu santōṣavāgidre hoṭṭeyallirō maguvū santōṣavāgirutte anta namma hiriyaru nambidru. Adakkē ivattu ī huḍugige yāva chintenū irabāradu, yārū avaḷige bējāru māḍabāradu."
    en: "This is the seemantonnayana samskara. Our elders believed that if the mother's mind is happy, the baby in her womb is happy too. That's why today this girl must not have a single worry, and nobody must upset her."
  - who: purohit
    t: "ಮೊದಲು ಮನೆಯ ಹಿರಿಯರ ಆಶೀರ್ವಾದ. ಅಜ್ಜಿ, ನೀವು ಕೂತಲ್ಲೇ ಇರಿ, ಹುಡುಗಿನೇ ನಿಮ್ಮ ಹತ್ರ ಬರ್ತಾಳೆ."
    tr: "Modalu maneya hiriyara āśīrvāda. Ajji, nīvu kūtallē iri, huḍuginē nimma hatra bartāḷe."
    en: "First, the blessing of the eldest of the house. Ajji, stay where you are; the girl will come to you."
  - who: ajji
    t: "ಬಾ ಮಗಳೇ, ತಲೆ ಬಗ್ಗಿಸು. ಸುಖ ಪ್ರಸವ ಆಗ್ಲಿ. ತಾಯಿ-ಮಗು ಇಬ್ರೂ ನೂರು ವರ್ಷ ಚೆನ್ನಾಗಿರಿ. ಗಂಡೋ ಹೆಣ್ಣೋ, ದೇವರು ಕೊಟ್ಟಿದ್ದು ನಮ್ಮ ಭಾಗ್ಯ."
    tr: "Bā magaḷē, tale baggisu. Sukha prasava āgli. Tāyi-magu ibrū nūru varṣa chennāgiri. Gaṇḍō heṇṇō, dēvaru koṭṭiddu namma bhāgya."
    en: "Come, my girl, bow your head. May the birth be easy. May mother and child both live well for a hundred years. Boy or girl, whatever God gives is our good fortune."
  - who: shwe
    t: "ಅಜ್ಜಿ… ಆಗಸ್ಟ್‌ನಲ್ಲಿ ಆ ರಾತ್ರಿ, ನೀವು ಇಲ್ಲಿ ಕೂತು ನನಗೆ ಆಶೀರ್ವಾದ ಮಾಡ್ತೀರಾ ಅಂತ ನಾನು ಅಂದ್ಕೊಂಡಿರಲಿಲ್ಲ."
    tr: "Ajji… Āgasṭnalli ā rātri, nīvu illi kūtu nanage āśīrvāda māḍtīrā anta nānu andkoṇḍiralilla."
    en: "(tearful) Ajji… that night in August, I never thought you'd be sitting here blessing me."
  - who: ajji
    t: "ಅಳಬಾರದು ಕಣೇ, ಇವತ್ತು ಅಳಬಾರದು. ಪುರೋಹಿತರೇ ಹೇಳಿದ್ರಲ್ಲ. ದೇವರು ನನ್ನನ್ನ ಇದಕ್ಕೇ ಉಳಿಸಿದ್ದು."
    tr: "Aḷabāradu kaṇē, ivattu aḷabāradu. Purōhitarē hēḷidralla. Dēvaru nannanna idakkē uḷisiddu."
    en: "No crying, dear, not today. You heard the priest. God kept me alive for exactly this."
  - who: purohit
    t: "ಈಗ ಬಳೆ ಶಾಸ್ತ್ರ. ಮುತ್ತೈದೆಯರು ಬನ್ನಿ. ಹುಡುಗಿಯ ತಾಯಿ ಮತ್ತು ಬೀಗತಿಯವರು, ಅಂದ್ರೆ ಹುಡುಗನ ತಾಯಿ, ಇಬ್ರೂ ಒಟ್ಟಿಗೆ ಮೊದಲ ಬಳೆ ತೊಡಿಸಿ. ಬಳೆ ಸದ್ದು ಹೊಟ್ಟೆಯಲ್ಲಿರೋ ಮಗುವಿಗೆ ಕೇಳಿಸುತ್ತೆ ಅಂತಾರೆ."
    tr: "Īga baḷe śāstra. Muttaideyaru banni. Huḍugiya tāyi mattu bīgatiyavaru, andre huḍugana tāyi, ibrū oṭṭige modala baḷe toḍisi. Baḷe saddu hoṭṭeyallirō maguvige kēḷisutte antāre."
    en: "Now the bangle ceremony. Married women, please come. The girl's mother and her beegathi — the boy's mother — put on the first bangles together. They say the baby in the womb can hear the bangles jingle."
  - who: sumitra
    t: "ಬನ್ನಿ ಲಕ್ಷ್ಮಿ ಅವರೇ, ನೀವು ಎಡಗೈಗೆ, ನಾನು ಬಲಗೈಗೆ. ನಿಧಾನ… ಹಸಿರು ಬಳೆ ಸ್ವಲ್ಪ ಬಿಗಿ ಇದೆ."
    tr: "Banni Lakshmī avarē, nīvu eḍagaige, nānu balagaige. Nidhāna… hasiru baḷe svalpa bigi ide."
    en: "Come, Lakshmi — you take the left hand, I'll take the right. Gently… the green bangles are a little tight."
  - who: amma
    t: "ಮದುವೆಗೆ ಮುಂಚೆ ಯಾರಾದ್ರೂ 'ನೀವಿಬ್ರೂ ಹೀಗೆ ಒಟ್ಟಿಗೆ ಬಳೆ ತೊಡಿಸ್ತೀರಾ' ಅಂತ ಹೇಳಿದ್ರೆ ನಾನು ನಂಬ್ತಿರಲಿಲ್ಲ, ಸುಮಿತ್ರಾ ಅವರೇ."
    tr: "Maduvege munche yārādrū 'nīvibrū hīge oṭṭige baḷe toḍistīrā' anta hēḷidre nānu nambtiralilla, Sumitrā avarē."
    en: "(softly) Before the wedding, if anyone had told me the two of us would put on bangles together like this, I wouldn't have believed it, Sumitra."
  - who: sumitra
    t: "ನಾನೂ ನಂಬ್ತಿರಲಿಲ್ಲ. ಆಗ ನಾನು ದೊಡ್ಡ ತಪ್ಪು ಮಾಡಿದೆ. ಅದನ್ನ ಮರೆತು ನನ್ನ ಸೊಸೆಯ ಮಡಿಲು ತುಂಬಿಸೋ ಭಾಗ್ಯ ಕೊಟ್ರಿ. ಅದಕ್ಕಿಂತ ದೊಡ್ಡದು ಏನೂ ಇಲ್ಲ."
    tr: "Nānū nambtiralilla. Āga nānu doḍḍa tappu māḍide. Adanna maretu nanna soseya maḍilu tumbisō bhāgya koṭri. Adakkinta doḍḍadu ēnū illa."
    en: "Neither would I. I made a big mistake back then. You put it behind you and gave me the blessing of filling my daughter-in-law's lap. Nothing is bigger than that."
  - who: purohit
    t: "ಈಗ ಮಡಿಲು ತುಂಬಿ. ತೆಂಗಿನಕಾಯಿ, ಐದು ಥರದ ಹಣ್ಣು, ರವಿಕೆ ಕಣ, ಅಕ್ಕಿ, ಎಲೆ-ಅಡಿಕೆ, ಹೂವು. ಆಮೇಲೆ ಮುತ್ತೈದೆಯರು ಆರತಿ ಎತ್ತಿ, ಎಲ್ಲರೂ ಅಕ್ಷತೆ ಹಾಕಿ ಆಶೀರ್ವಾದ ಮಾಡಿ."
    tr: "Īga maḍilu tumbi. Teṅginakāyi, aidu tharada haṇṇu, ravike kaṇa, akki, ele-aḍike, hūvu. Āmēle muttaideyaru ārati etti, ellarū akṣate hāki āśīrvāda māḍi."
    en: "Now fill her lap: coconut, five kinds of fruit, a blouse piece, rice, betel leaves and nuts, flowers. Then the married women wave the arathi, and everyone sprinkle akshate and give your blessing."
  - who: shankar
    t: "ಶ್ವೇತಾ, ಮಗಳೇ… ನಿಂಗೆ ಏನು ಬೇಕಾದ್ರೂ ಸಂಕೋಚ ಇಲ್ಲದೆ ಕೇಳು. ಈ ಮನೆ, ಆ ಮನೆ ಅಂತ ಇಲ್ಲ. ಎರಡೂ ನಿನ್ನವೇ."
    tr: "Shwētā, magaḷē… ninge ēnu bēkādrū saṅkōcha illade kēḷu. Ī mane, ā mane anta illa. Eraḍū ninnavē."
    en: "Shwetha, my girl… whatever you need, ask without hesitating. There's no 'this house' and 'that house'. Both are yours."
  - who: pradeep
    t: "ಅಪ್ಪ ಇಷ್ಟು ಮಾತಾಡಿದ್ದು ನಾನು ಇತ್ತೀಚೆಗೆ ಕೇಳೇ ಇಲ್ಲ. ಥ್ಯಾಂಕ್ಸ್ ಅಪ್ಪ."
    tr: "Appa iṣṭu mātāḍiddu nānu ittīchege kēḷē illa. Thyāṅks appa."
    en: "I haven't heard Appa say this much in a long time. Thanks, Appa."

  - section: "🍲 Everybody's advice"
    learn: "reported advice: -ಅಂತಾರೆ, -ಅಂತೆ · ಉಷ್ಣ (heaty) · polite disagreement: ನೀವು ಹೇಳೋದು ಪ್ರೀತಿಯಿಂದ ಅಂತ ಗೊತ್ತು, ಆದ್ರೆ… · ಹಸಿ vs ಹಣ್ಣಾದ"
  - scene: "Lunch on banana leaves. Relatives gather around Shwetha, and each of them has advice."
  - who: vimala
    t: "ಶ್ವೇತಾ, ಇನ್ನು ಮೇಲೆ ದಿನಾ ಒಂದು ಚಮಚ ತುಪ್ಪ ಜಾಸ್ತಿ ತಿನ್ನು. ತುಪ್ಪ ತಿಂದ್ರೆ ಹೆರಿಗೆ ಸಲೀಸಾಗುತ್ತೆ ಅಂತಾರೆ. ನನ್ನ ಸೊಸೆಗೆ ಹಾಗೇ ಆಯ್ತು."
    tr: "Shwētā, innu mēle dinā ondu chamacha tuppa jāsti tinnu. Tuppa tindre herige salīsāgutte antāre. Nanna sosege hāgē āytu."
    en: "Shwetha, from now on eat an extra spoon of ghee every day. They say ghee makes the delivery smooth. That's how it went for my daughter-in-law."
  - who: shwe
    t: "ಆಂಟಿ, ನೀವು ಹೇಳೋದು ಪ್ರೀತಿಯಿಂದ ಅಂತ ಗೊತ್ತು. ಆದ್ರೆ ನನಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಇದೆ. ಸಿಹಿ, ಎಣ್ಣೆ, ತುಪ್ಪ ಕಮ್ಮಿ ಮಾಡು, ದಿನಾ ಅರ್ಧ ಗಂಟೆ ನಡಿ ಅಂತ ಡಾಕ್ಟ್ರು ಉಷಾ ಹೇಳಿದಾರೆ. ಶುಗರ್ ಜಾಸ್ತಿ ಆದ್ರೆ ಮಗು ತುಂಬಾ ದೊಡ್ಡದಾಗಬಹುದಂತೆ, ಆಮೇಲೆ ಹೆರಿಗೆನೇ ಕಷ್ಟ ಆಗುತ್ತಂತೆ."
    tr: "Āṇṭi, nīvu hēḷōdu prītiyinda anta gottu. Ādre nanage śugar bārḍarlain ide. Sihi, eṇṇe, tuppa kammi māḍu, dinā ardha gaṇṭe naḍi anta ḍākṭru Uṣā hēḷidāre. Śugar jāsti ādre magu tumbā doḍḍadāgabahudante, āmēle herigenē kaṣṭa āguttante."
    en: "Aunty, I know you say it out of love. But my sugar is borderline. Dr. Usha told me to cut down sweets, oil and ghee and walk half an hour every day. Apparently if the sugar goes up, the baby can grow too big, and then the delivery itself gets harder."
  - who: vimala
    t: "ಅಯ್ಯೋ, ಈಗಿನ ಡಾಕ್ಟ್ರುಗಳು ಎಲ್ಲದಕ್ಕೂ 'ಬೇಡ' ಅಂತಾರೆ. ನಮ್ಮ ಕಾಲದಲ್ಲಿ ಬಸುರಿ ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು ಅಂತ ಹೇಳ್ತಿದ್ರು."
    tr: "Ayyō, īgina ḍākṭrugaḷu elladakkū 'bēḍa' antāre. Namma kāladalli basuri ibbarige tinnabēku anta hēḷtidru."
    en: "Oh, today's doctors say 'no' to everything. In our day they said a pregnant woman should eat for two."
  - who: sumitra
    t: "ವಿಮಲಾ ಅವರೇ, ಇಬ್ಬರಿಗೆ ತಿನ್ನೋದು ಮುಖ್ಯ ಅಲ್ಲ, ಇಬ್ಬರಿಗೋಸ್ಕರ ಒಳ್ಳೇದನ್ನ ತಿನ್ನೋದು ಮುಖ್ಯ. ನನ್ನ ಸೊಸೆ ತನ್ನ ಡಾಕ್ಟ್ರ ಮಾತು ಕೇಳ್ತಾಳೆ, ಅದೇ ಸರಿ."
    tr: "Vimalā avarē, ibbarige tinnōdu mukhya alla, ibbarigōskara oḷḷēdanna tinnōdu mukhya. Nanna sose tanna ḍākṭra mātu kēḷtāḷe, adē sari."
    en: "Vimala, what matters isn't eating for two, it's eating well for the two of them. My daughter-in-law listens to her doctor, and that's right."
  - who: shwe
    t: "ಕೇಳಿಸ್ಕೊಂಡ್ಯಾ? ನಿಮ್ಮಮ್ಮ ನನ್ನ ಪರ ಮಾತಾಡಿದ್ರು!"
    tr: "Kēḷiskoṇḍyā? Nimmamma nanna para mātāḍidru!"
    en: "(quietly, to Pradeep) Did you hear that? Your mother took my side!"
  - who: pradeep
    t: "ಕೇಳಿಸ್ಕೊಂಡೆ. ಅಮ್ಮ ತುಂಬಾ ಬದಲಾಗಿದಾರೆ, ಶ್ವೇತಾ. ಅಜ್ಜಿ ಆಸ್ಪತ್ರೆಯಲ್ಲಿದ್ದಾಗ ಏನೋ ಬದಲಾಯ್ತು ಅವರಲ್ಲಿ."
    tr: "Kēḷiskoṇḍe. Amma tumbā badalāgidāre, Shwētā. Ajji āspatreyalliddāga ēnō badalāytu avaralli."
    en: "(quietly) I heard. Amma has changed a lot, Shwetha. Something changed in her while Ajji was in hospital."
  - who: ajji
    t: "ವಿಮಲಾ, ಡಾಕ್ಟ್ರ ಮಾತನ್ನ ಹಗುರವಾಗಿ ತಗೋಬೇಡ. ಆಗಸ್ಟ್‌ನಲ್ಲಿ ನಾನು 'ಗ್ಯಾಸ್ ಅಷ್ಟೇ, ಏನೂ ಆಗಿಲ್ಲ' ಅಂತ ಹಠ ಮಾಡಿದ್ರೆ ಇವತ್ತು ಇಲ್ಲಿ ಕೂತಿರ್ತಿರಲಿಲ್ಲ."
    tr: "Vimalā, ḍākṭra mātanna haguravāgi tagōbēḍa. Āgasṭnalli nānu 'gyās aṣṭē, ēnū āgilla' anta haṭha māḍidre ivattu illi kūtirtiralilla."
    en: "Vimala, don't take what doctors say lightly. In August, if I'd stubbornly insisted 'it's only gas, nothing's wrong', I wouldn't be sitting here today."
  - who: vimala
    t: "ಅದೂ ನಿಜ ಅಜ್ಜಿ. ಸರಿ, ತುಪ್ಪ ಬೇಡ. ಆದ್ರೆ ಪಪ್ಪಾಯಿ ಮಾತ್ರ ಮುಟ್ಟಬೇಡ ಶ್ವೇತಾ, ಉಷ್ಣ!"
    tr: "Adū nija ajji. Sari, tuppa bēḍa. Ādre pappāyi mātra muṭṭabēḍa Shwētā, uṣṇa!"
    en: "That's true too, Ajji. Fine, no ghee. But don't you touch papaya, Shwetha — it's heaty!"
  - who: shwe
    t: "ಆಂಟಿ, ಪಪ್ಪಾಯಿ ಕೇಸ್ ಮಾರ್ಚ್‌ನಲ್ಲೇ ಮುಗೀತು. ಅಜ್ಜಿನೂ ಡಾಕ್ಟ್ರೂ ಇಬ್ರೂ ಖುಷಿ ಆಗೋ ತೀರ್ಪು: ಹೆರಿಗೆ ಆಗೋವರೆಗೂ ಪಪ್ಪಾಯಿ ಮುಟ್ಟಲ್ಲ. ಪ್ರಾಮಿಸ್."
    tr: "Āṇṭi, pappāyi kēs mārch-nallē mugītu. Ajjinū ḍākṭrū ibrū khuṣi āgō tīrpu: herige āgōvaregū pappāyi muṭṭalla. Prāmis."
    en: "Aunty, the papaya case was closed back in March, with a verdict that keeps both Ajji and the doctor happy: no papaya until the baby comes. Promise."
  - who: sam
    t: "ಶ್ವೇತಾ ಒಳ್ಳೆ ಡಿಪ್ಲೊಮ್ಯಾಟ್ ಆಗಿದಾಳೆ. ಆಫೀಸಲ್ಲಿ ಟೀಮ್ ಲೀಡ್ ಆಗಿದ್ದು ವ್ಯರ್ಥ ಆಗಿಲ್ಲ."
    tr: "Shwētā oḷḷe ḍiplomyāṭ āgidāḷe. Āphīsalli ṭīm līḍ āgiddu vyartha āgilla."
    en: "Shwetha's become quite the diplomat. Being a team lead at the office hasn't gone to waste."
  - who: kiran
    t: "ಅಕ್ಕ, ಇದು ನಿನ್ನ ಬಯಕೆ ಊಟ. ಇವತ್ತು ನೀನು ಏನು ಕೇಳಿದ್ರೂ ಸಿಗುತ್ತೆ. ಹೇಳು, ಏನು ಬೇಕು?"
    tr: "Akka, idu ninna bayake ūṭa. Ivattu nīnu ēnu kēḷidrū sigutte. Hēḷu, ēnu bēku?"
    en: "Akka, this is your craving meal. Today you get anything you ask for. Tell me, what do you want?"
  - who: shwe
    t: "ಇನ್ನೊಂದು ಸೌಟು ಪುಳಿಯೋಗರೆ, ಜೊತೆಗೆ ನಿಂಬೆಕಾಯಿ ಉಪ್ಪಿನಕಾಯಿ. ಸಿಹಿ ಬೇಡ, ಈ ತಿಂಗಳೆಲ್ಲಾ ಬರೀ ಹುಳಿ ಬೇಕು ಅನ್ಸುತ್ತೆ."
    tr: "Innondu sauṭu puḷiyōgare, jotege nimbekāyi uppinakāyi. Sihi bēḍa, ī tiṅgaḷellā barī huḷi bēku ansutte."
    en: "Another ladle of puliyogare, with lemon pickle. No sweets — this whole month I've wanted nothing but sour things."

  - section: "🧳 Going to her mother's home"
    learn: "ತವರು ಮನೆ (a woman's parental home) · ಕಳಿಸು (send off), ಒಪ್ಪಿಸು (hand over) · -ಆದ್ಮೇಲೆ (after) · who pays for the delivery"
  - scene: "Evening. The guests have gone. On the veranda: Pradeep, Shwetha, Appa, Amma, Sumitra and Shankar. A suitcase stands by the door — Shwetha will now stay at her parents' house until the delivery."
  - who: sumitra
    t: "ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಸೀಮಂತ ಆದ್ಮೇಲೆ ಹುಡುಗಿನ ತವರು ಮನೆಗೆ ಕಳಿಸ್ತೀವಿ. ಲಕ್ಷ್ಮಿ ಅವರೇ, ನಮ್ಮ ಸೊಸೆನ ನಿಮ್ಮ ಕೈಗೆ ಒಪ್ಪಿಸ್ತಿದೀವಿ. ಜೋಪಾನವಾಗಿ ನೋಡ್ಕೊಳ್ಳಿ."
    tr: "Sampradāyada prakāra sīmanta ādmēle huḍugina tavaru manege kaḷistīvi. Lakshmī avarē, namma sosena nimma kaige oppistidīvi. Jōpānavāgi nōḍkoḷḷi."
    en: "By tradition, after the seemantha we send the girl to her mother's home. Lakshmi, we're placing our daughter-in-law in your hands. Look after her carefully."
  - who: amma
    t: "ಅವಳು ನಮ್ಮ ಮಗಳೂ ಹೌದು, ನಿಮ್ಮ ಸೊಸೆನೂ ಹೌದು. ನೀವು ಯಾವಾಗ ಬೇಕಾದ್ರೂ ಬನ್ನಿ, ಫೋನ್ ಮಾಡಿ ಬರೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ."
    tr: "Avaḷu namma magaḷū haudu, nimma sosenū haudu. Nīvu yāvāga bēkādrū banni, phōn māḍi barō avaśyakate illa."
    en: "She's our daughter and your daughter-in-law both. Come whenever you like — there's no need to call before you come."
  - who: pradeep
    t: "ನಾನು ಜೆಪಿ ನಗರದಿಂದ ದಿನಾ ಸಂಜೆ ಬರ್ತೀನಿ. ನನ್ನ ಆಫೀಸ್ ಕಾಲ್‌ಗಳೆಲ್ಲಾ ರಾತ್ರಿನೇ ಇರ್ತವೆ, ಅವನ್ನ ಇಲ್ಲಿಂದಾನೇ ಮಾಡ್ಬಹುದು. ಲ್ಯಾಪ್‌ಟಾಪ್ ತಗೊಂಡು ಬರ್ತೀನಿ."
    tr: "Nānu Jepi Nagaradinda dinā sañje bartīni. Nanna āphīs kālgaḷellā rātrinē irtave, avanna illindānē māḍbahudu. Lyāpṭāp tagoṇḍu bartīni."
    en: "I'll come over from JP Nagar every evening. All my office calls are at night anyway; I can take them from here. I'll bring my laptop."
  - who: appa
    t: "ಇನ್ನೊಂದು ವಿಷಯ, ಹೆರಿಗೆ ಖರ್ಚು. ಮೊದಲ ಹೆರಿಗೆ ಖರ್ಚು ತವರು ಮನೆಯವರೇ ನೋಡ್ಕೋಬೇಕು ಅನ್ನೋದು ನಮ್ಮ ಕಡೆ ಪದ್ಧತಿ. ಆಸ್ಪತ್ರೆ ಬಿಲ್ ನಾನು ಕಟ್ತೀನಿ."
    tr: "Innondu viṣaya, herige kharchu. Modala herige kharchu tavaru maneyavarē nōḍkōbēku annōdu namma kaḍe paddhati. Āspatre bil nānu kaṭtīni."
    en: "One more thing: the delivery costs. Where we come from, the mother's family bears the cost of the first delivery. I'll pay the hospital bill."
  - who: pradeep
    t: "ಮಾವ, ಬೇಡ. ನಮ್ಮ ಇನ್ಶೂರೆನ್ಸ್‌ನಲ್ಲಿ ಮೆಟರ್ನಿಟಿ ಕವರ್ ಇದೆ, ಲಿಮಿಟ್ ಮೀರಿದ್ದನ್ನ ನಾವು ಕಟ್ತೀವಿ. ಅಜ್ಜಿ ಆಸ್ಪತ್ರೆ ಖರ್ಚು ಆಗಿ ಇನ್ನೂ ಎರಡು ತಿಂಗಳೂ ಆಗಿಲ್ಲ."
    tr: "Māva, bēḍa. Namma inśūrensnalli meṭarniṭi kavar ide, limiṭ mīriddanna nāvu kaṭtīvi. Ajji āspatre kharchu āgi innū eraḍu tiṅgaḷū āgilla."
    en: "Mava, please don't. Our insurance has maternity cover, and whatever goes over the limit, we'll pay. It's not even two months since Ajji's hospital expenses."
  - who: shankar
    t: "ರಮೇಶ್ ಅವರೇ, ಹಳೇ ಪದ್ಧತಿಗಳಲ್ಲಿ ಕೆಲವನ್ನ ನಾವು ಬಿಟ್ಟಿದೀವಿ. ವರದಕ್ಷಿಣೆಯಂಥ ಕೆಟ್ಟದ್ದನ್ನ ಬಿಟ್ಟಿದ್ದು ತುಂಬಾ ತಡವಾಗಿ, ಅದಕ್ಕೆ ನನಗೆ ಈಗಲೂ ನಾಚಿಕೆ ಆಗುತ್ತೆ. ಇದನ್ನ ಹಂಚ್ಕೊಳ್ಳೋಣ: ಇನ್ಶೂರೆನ್ಸ್ ಮೀರಿದ್ದು ಮಕ್ಕಳು ಕಟ್ಟಲಿ, ಅದಕ್ಕೆ ನಾವೂ ಒಂದು ಪಾಲು ಕೊಡ್ತೀವಿ. ಶ್ವೇತಾ ಆಗ್ಲೇ ಒಪ್ಕೊಂಡಿದ್ದಾಳೆ. ನೀವು ಈಗ ತಾನೇ ಅಜ್ಜಿ ಖರ್ಚು ನೋಡಿದ್ದೀರಿ."
    tr: "Ramēsh avarē, haḷē paddhatigaḷalli kelavanna nāvu biṭṭidīvi. Varadakṣiṇeyantha keṭṭaddanna biṭṭiddu tumbā taḍavāgi, adakke nanage īgalū nāchike āgutte. Idanna hañchkoḷḷōṇa: inśūrens mīriddu makkaḷu kaṭṭali, adakke nāvū ondu pālu koḍtīvi. Shwētā āglē opkoṇḍiddāḷe. Nīvu īga tānē ajji kharchu nōḍiddīri."
    en: "Ramesh, we've left some old customs behind. We dropped a bad one like dowry far too late, and I'm still ashamed of that. Let's share this one: the children pay what the insurance doesn't, and we put in a share towards it. Shwetha has already agreed. You've only just had Ajji's expenses."
  - who: appa
    t: "ಶಂಕರ್ ಅವರೇ, ನೀವು ಹಾಗಂದ ಮೇಲೆ ನಾನೇನು ಹೇಳಲಿ. ಸರಿ, ಹಾಗೇ ಮಾಡೋಣ."
    tr: "Śaṅkar avarē, nīvu hāganda mēle nānēnu hēḷali. Sari, hāgē māḍōṇa."
    en: "Shankar, after you've said that, what can I say? All right, let's do it that way."
  - who: amma
    t: "ಆಸ್ಪತ್ರೆ ಬ್ಯಾಗ್ ಈಗ್ಲೇ ರೆಡಿ ಮಾಡಿಡೋಣ. ಡಾಕ್ಟ್ರು ಉಷಾ ಕೊಟ್ಟ ಲಿಸ್ಟ್ ಇದೆ: ಫೈಲ್, ಸ್ಕ್ಯಾನ್ ರಿಪೋರ್ಟ್‌ಗಳು, ತಾಯಿ ಕಾರ್ಡ್, ಇನ್ಶೂರೆನ್ಸ್ ಕಾರ್ಡ್, ಆಧಾರ್, ಶ್ವೇತಾಗೆ ಸಡಿಲ ನೈಟಿ, ಮಗುವಿಗೆ ಹತ್ತಿ ಬಟ್ಟೆ, ಟವಲ್."
    tr: "Āspatre byāg īglē reḍi māḍiḍōṇa. Ḍākṭru Uṣā koṭṭa lisṭ ide: phail, skyān riporṭgaḷu, tāyi kārḍ, inśūrens kārḍ, ādhār, Shwētāge saḍila naiṭi, maguvige hatti baṭṭe, ṭaval."
    en: "Let's get the hospital bag ready right now. There's the list Dr. Usha gave: the file, the scan reports, the Thayi card, insurance card, Aadhaar, a loose nightie for Shwetha, soft cotton clothes and a towel for the baby."
  - who: shwe
    t: "ಡ್ಯೂ ಡೇಟ್ ನವೆಂಬರ್ ಹತ್ತು ಅಮ್ಮ. ಇನ್ನೂ ಏಳು ವಾರ ಇದೆ, ಈಗ್ಲೇ ಯಾಕೆ ಬ್ಯಾಗ್?"
    tr: "Ḍyū ḍēṭ navembar hattu amma. Innū ēḷu vāra ide, īglē yāke byāg?"
    en: "The due date is the tenth of November, Amma. That's seven weeks away — why the bag already?"
  - who: amma
    t: "ಮಗು ಕ್ಯಾಲೆಂಡರ್ ನೋಡ್ಕೊಂಡು ಬರಲ್ಲ ಕಣೇ. ನೀನು ಹುಟ್ಟಿದ್ದು ಡ್ಯೂ ಡೇಟ್‌ಗಿಂತ ಹತ್ತು ದಿನ ಮುಂಚೆ, ಮಧ್ಯರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ."
    tr: "Magu kyāleṇḍar nōḍkoṇḍu baralla kaṇē. Nīnu huṭṭiddu ḍyū ḍēṭginta hattu dina munche, madhyarātri eraḍu gaṇṭege."
    en: "Babies don't check the calendar before they come, dear. You were born ten days before your due date, at two in the morning."
  - who: ajji
    t: "ಅವತ್ತು ನಾನು ರಾತ್ರಿ ಆಟೋ ಹುಡುಕ್ಕೊಂಡು ರೋಡಲ್ಲಿ ಓಡಿದ್ದು ಇನ್ನೂ ನೆನಪಿದೆ. ಈಗ ಓಡೋಕಾಗಲ್ಲ, ಅದಕ್ಕೇ ಸ್ಯಾಮ್ ಇದಾನೆ."
    tr: "Avattu nānu rātri āṭō huḍukkoṇḍu rōḍalli ōḍiddu innū nenapide. Īga ōḍōkāgalla, adakkē Sām idāne."
    en: "I still remember running down the road that night looking for an auto. I can't run now — that's what Sam is for."
  - who: sam
    t: "ಕಾರಲ್ಲಿ ಯಾವಾಗ್ಲೂ ಅರ್ಧ ಟ್ಯಾಂಕ್ ಪೆಟ್ರೋಲ್ ಇಟ್ಟಿರ್ತೀನಿ ಅಜ್ಜಿ. ರಾತ್ರಿ ಎಷ್ಟೊತ್ತಾದ್ರೂ ಸರಿ, ಎಬ್ಬಿಸಿ."
    tr: "Kāralli yāvāglū ardha ṭyāṅk peṭrōl iṭṭirtīni ajji. Rātri eṣṭottādrū sari, ebbisi."
    en: "I'll always keep at least half a tank of petrol in the car, Ajji. Whatever time of night it is, wake me."
  - who: ajji
    t: "ಶ್ವೇತಾ, ನಿನ್ನ ಮಗುವನ್ನ ಈ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ. ಅದು ನನ್ನ ಹರಕೆ, ದೇವರಿಗೂ ಹೇಳಿದೀನಿ."
    tr: "Shwētā, ninna maguvanna ī kaiyalli ettikoḷḷōvaregū nānu ellū hōgalla. Adu nanna harake, dēvarigū hēḷidīni."
    en: "Shwetha, I'm not going anywhere until I've held your baby in these arms. That's my vow — I've told God as well."
  - who: shwe
    t: "ಹಾಗಾದ್ರೆ ಆಮೇಲೂ ತುಂಬಾ ವರ್ಷ ಇರ್ಬೇಕು ಅಜ್ಜಿ. ಮರಿಮಗು ಮದುವೆವರೆಗೂ!"
    tr: "Hāgādre āmēlū tumbā varṣa irbēku ajji. Marimagu maduvevaregū!"
    en: "Then you'll have to stay many years after that too, Ajji. Right up to the great-grandchild's wedding!"

  - chapter: "Chapter 7 — Delivery"
  - section: "🌙 Two in the morning"
    learn: "dative experiencer: ನನಗೆ ನೋವು ಬರ್ತಿದೆ · -ಕ್ಕೊಂದು ಸಲ (once every …) · ಬಂದು ಹೋಗು (come and go) · true vs false labour"
  - scene: "Seven weeks after the seemantha. Shwetha has been on maternity leave since the first of November. It is the night of Tuesday, 10 November 2026, her due date — a little after one in the morning. The Rao house. Shwetha, forty weeks pregnant, knocks on her mother's door."
  - who: shwe
    t: "ಅಮ್ಮ… ಅಮ್ಮ, ಎದ್ದೇಳು. ನನಗೆ ಹೊಟ್ಟೆ ಕೆಳಗೆ ನೋವು ಬರ್ತಿದೆ, ಬೆನ್ನಿಗೂ ಹೋಗ್ತಿದೆ. ಹನ್ನೆರಡು ಗಂಟೆಯಿಂದ ಬಂದು ಹೋಗ್ತಿದೆ."
    tr: "Amma… amma, eddēḷu. Nanage hoṭṭe keḷage nōvu bartide, bennigū hōgtide. Hanneraḍu gaṇṭeyinda bandu hōgtide."
    en: "Amma… Amma, wake up. I'm getting pain low in my belly, and it's going into my back. It's been coming and going since midnight."
  - who: amma
    t: "ಗಾಬರಿ ಆಗ್ಬೇಡ, ಕೂತ್ಕೋ. ನೋವು ಬಂದು ಹೋಗ್ತಿದೆಯಾ, ಅಥವಾ ಒಂದೇ ಸಮನೆ ಇದೆಯಾ? ನೋವು ಬಂದಾಗ ಹೊಟ್ಟೆ ಕಲ್ಲಿನ ಥರ ಗಟ್ಟಿ ಆಗುತ್ತಾ?"
    tr: "Gābari āgbēḍa, kūtkō. Nōvu bandu hōgtideyā, athavā ondē samane ideyā? Nōvu bandāga hoṭṭe kallina thara gaṭṭi āguttā?"
    en: "Don't panic, sit down. Is the pain coming and going, or is it constant? When it comes, does your belly go hard like a stone?"
  - who: shwe
    t: "ಬಂದು ಹೋಗ್ತಿದೆ. ಬಂದಾಗ ಹೊಟ್ಟೆ ಗಟ್ಟಿ ಆಗುತ್ತೆ, ಉಸಿರು ಕಟ್ಟಿದ ಹಾಗೆ ಆಗುತ್ತೆ. ಆಮೇಲೆ ಐದಾರು ನಿಮಿಷ ಏನೂ ಇಲ್ಲ."
    tr: "Bandu hōgtide. Bandāga hoṭṭe gaṭṭi āgutte, usiru kaṭṭida hāge āgutte. Āmēle aidāru nimiṣa ēnū illa."
    en: "Coming and going. When it comes my belly goes hard and I feel like I can't breathe. Then nothing for five or six minutes."
  - who: amma
    t: "ಕಳೆದ ವಾರನೂ ಹೀಗೇ ಆಗಿತ್ತಲ್ಲ, ಆಮೇಲೆ ನಿಂತು ಹೋಯ್ತು. ಅದು ಫಾಲ್ಸ್ ಪೇನ್ ಅಂತ ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ರು. ಈ ಸಲ ನಿಜವೋ ಸುಳ್ಳೋ ನೋಡೋಣ. ನೋವು ಶುರುವಾದಾಗ ಹೇಳು, ನಾನು ಫೋನಲ್ಲಿ ಟೈಮ್ ನೋಡ್ತೀನಿ."
    tr: "Kaḷeda vāranū hīgē āgittalla, āmēle nintu hōytu. Adu phāls pēn anta ḍākṭru hēḷidru. Ī sala nijavō suḷḷō nōḍōṇa. Nōvu śuruvādāga hēḷu, nānu phōnalli ṭaim nōḍtīni."
    en: "Last week it was like this too, and then it stopped. The doctor said that was false labour. Let's see whether this time it's real. Tell me when a pain starts — I'll time it on the phone."
  - scene: "Forty minutes later. Ajji has woken too and sits on the sofa with a shawl around her shoulders. Amma holds the phone with a stopwatch running."
  - who: amma
    t: "ನೋಡು: ಪ್ರತಿ ಆರು ನಿಮಿಷಕ್ಕೊಂದು ಸಲ, ಒಂದೊಂದು ನೋವು ನಲವತ್ತೈದು ಸೆಕೆಂಡು. ಅರ್ಧ ಗಂಟೆಯಿಂದ ಹತ್ರ ಹತ್ರ ಬರ್ತಿದೆ, ಜೋರೂ ಆಗ್ತಿದೆ. ಇದು ಸುಳ್ಳು ನೋವು ಅಲ್ಲ."
    tr: "Nōḍu: prati āru nimiṣakkondu sala, ondondu nōvu nalavattaidu sekeṇḍu. Ardha gaṇṭeyinda hatra hatra bartide, jōrū āgtide. Idu suḷḷu nōvu alla."
    en: "Look: once every six minutes, each pain forty-five seconds. For half an hour they've been coming closer together, and getting stronger too. This isn't false labour."
  - who: ajji
    t: "ನಿಜವಾದ ನೋವು ಹಾಗೇ ಬರೋದು, ಸಮುದ್ರದ ಅಲೆ ಥರ. ಶ್ವೇತಾ, ನೀರು ಹೋಗಿದೆಯಾ? ರಕ್ತ ಏನಾದ್ರೂ ಕಾಣಿಸ್ತಾ?"
    tr: "Nijavāda nōvu hāgē barōdu, samudrada ale thara. Shwētā, nīru hōgideyā? Rakta ēnādrū kāṇistā?"
    en: "Real pains come just like that, like waves of the sea. Shwetha, has your water gone? Have you seen any blood?"
  - who: shwe
    t: "ನೀರು ಹೋಗಿಲ್ಲ ಅಜ್ಜಿ. ಸ್ವಲ್ಪ ಲೋಳೆ ಥರ ಬಂತು, ಅದರಲ್ಲಿ ರಕ್ತದ ಗೆರೆ ಇತ್ತು. ಮಗು ಮಾತ್ರ ಚೆನ್ನಾಗಿ ಒದೀತಿದೆ, ಅದೇ ಸಮಾಧಾನ."
    tr: "Nīru hōgilla ajji. Svalpa lōḷe thara bantu, adaralli raktada gere ittu. Magu mātra chennāgi odītide, adē samādhāna."
    en: "The water hasn't gone, Ajji. A little mucus came, with a streak of blood in it. But the baby's kicking well — that's a relief."
  - who: ajji
    t: "ಅದೇ ಶುರುವಾಗೋ ಲಕ್ಷಣ. ಲಕ್ಷ್ಮಿ, ಡಾಕ್ಟ್ರಿಗೆ ಫೋನ್ ಮಾಡು. ನಾನು ದೇವರಿಗೆ ದೀಪ ಹಚ್ಚ್ತೀನಿ."
    tr: "Adē śuruvāgō lakṣaṇa. Lakshmī, ḍākṭrige phōn māḍu. Nānu dēvarige dīpa hachchtīni."
    en: "That's the sign it's starting. Lakshmi, call the doctor. I'll light a lamp for God."
  - who: amma
    t: "ಅಮ್ಮ, ದೀಪ ಹಚ್ಚಿ ಮಲಗಿ. ರಾತ್ರಿಯೆಲ್ಲಾ ಎದ್ದಿದ್ರೆ ನಾಳೆ ನಿಮ್ಮ ಬಿಪಿ ಏರುತ್ತೆ."
    tr: "Amma, dīpa hachchi malagi. Rātriyellā eddidre nāḷe nimma bipi ērutte."
    en: "Amma, light the lamp and then go to bed. If you're up all night, your BP will go up tomorrow."
  - who: ajji
    t: "ನನ್ನ ಮರಿಮಗು ಬರ್ತಿರೋ ರಾತ್ರಿ ನಾನು ಮಲಗ್ಬೇಕಾ? ಆಸ್ಪತ್ರೆಗೆ ಬರಲ್ಲ, ಅಷ್ಟು ಮಾತು ಕೇಳ್ತೀನಿ. ಆದ್ರೆ ಇಲ್ಲೇ ಕೂತು ಜಪ ಮಾಡ್ತೀನಿ."
    tr: "Nanna marimagu bartirō rātri nānu malagbēkā? Āspatrege baralla, aṣṭu mātu kēḷtīni. Ādre illē kūtu japa māḍtīni."
    en: "On the night my great-grandchild is coming, I'm supposed to sleep? I won't come to the hospital — I'll listen to you that far. But I'll sit right here and pray."

  - section: "📞 Calling Dr. Usha"
    learn: "the doctor's questions on the phone · -ಇರೋದ್ರಿಂದ (because of) · instructions: ತಿನ್ನಬೇಡಿ, ಕುಡೀಬಹುದು"
  - scene: "2:10 a.m. Shwetha calls Dr. Usha Rao's mobile, on speaker."
  - who: gyn
    t: "ಹಲೋ ಶ್ವೇತಾ, ಹೇಳಿ. ನೋವು ಶುರು ಆಯ್ತಾ?"
    tr: "Halō Shwētā, hēḷi. Nōvu śuru āytā?"
    en: "Hello Shwetha, tell me. Have the pains started?"
  - who: shwe
    t: "ಹೌದು ಡಾಕ್ಟರ್. ಸಾರಿ, ರಾತ್ರಿ ಹೊತ್ತು ಫೋನ್ ಮಾಡಿದ್ದಕ್ಕೆ. ಅರ್ಧ ಗಂಟೆಯಿಂದ ಆರು ನಿಮಿಷಕ್ಕೊಂದು ಸಲ ಬರ್ತಿದೆ, ಒಂದೊಂದೂ ನಲವತ್ತೈದು ಸೆಕೆಂಡ್ ಇರುತ್ತೆ."
    tr: "Haudu ḍākṭar. Sāri, rātri hottu phōn māḍiddakke. Ardha gaṇṭeyinda āru nimiṣakkondu sala bartide, ondondū nalavattaidu sekeṇḍ irutte."
    en: "Yes, Doctor. Sorry for calling in the middle of the night. For half an hour they've been coming every six minutes, each one lasting forty-five seconds."
  - who: gyn
    t: "ಸಾರಿ ಯಾಕೆ, ಇದೇ ನನ್ನ ಕೆಲಸ. ನೀರು ಹೋಗಿದೆಯಾ? ಬ್ಲೀಡಿಂಗ್ ಇದೆಯಾ? ಮಗುವಿನ ಮೂವ್‌ಮೆಂಟ್ ಸರಿಯಾಗಿದೆಯಾ?"
    tr: "Sāri yāke, idē nanna kelasa. Nīru hōgideyā? Blīḍiṅg ideyā? Maguvina mūvmeṇṭ sariyāgideyā?"
    en: "Why sorry? This is exactly my job. Has your water broken? Any bleeding? Is the baby moving normally?"
  - who: shwe
    t: "ನೀರು ಹೋಗಿಲ್ಲ. ಸ್ವಲ್ಪ ಲೋಳೆ ಬಂತು, ಅದರಲ್ಲಿ ರಕ್ತದ ಗೆರೆ ಇತ್ತು, ಅಷ್ಟೇ. ಮಗು ಚೆನ್ನಾಗಿ ಒದೀತಿದೆ."
    tr: "Nīru hōgilla. Svalpa lōḷe bantu, adaralli raktada gere ittu, aṣṭē. Magu chennāgi odītide."
    en: "No water. A little mucus with a streak of blood, that's all. The baby's kicking well."
  - who: gyn
    t: "ಸರಿ, ಅದು ಸಹಜ, ಅದನ್ನ 'ಶೋ' ಅಂತೀವಿ. ಮೊದಲ ಹೆರಿಗೆಯಲ್ಲಿ ಇದು ಇನ್ನೂ ತುಂಬಾ ಗಂಟೆ ಹೋಗಬಹುದು. ಆದ್ರೆ ನಿಮಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಇರೋದ್ರಿಂದ ಮನೇಲಿ ಕಾಯೋದು ಬೇಡ. ಈಗ್ಲೇ ಆಸ್ಪತ್ರೆಗೆ ಬನ್ನಿ, ಲೇಬರ್ ವಾರ್ಡ್‌ಗೆ ನಾನು ಹೇಳ್ತೀನಿ. ಬರೋವಾಗ ಏನೂ ತಿನ್ನಬೇಡಿ, ಸ್ವಲ್ಪ ನೀರು ಕುಡೀಬಹುದು."
    tr: "Sari, adu sahaja, adanna 'śō' antīvi. Modala herigeyalli idu innū tumbā gaṇṭe hōgabahudu. Ādre nimage śugar bārḍarlain irōdrinda manēli kāyōdu bēḍa. Īglē āspatrege banni, lēbar vārḍge nānu hēḷtīni. Barōvāga ēnū tinnabēḍi, svalpa nīru kuḍībahudu."
    en: "All right, that's normal — we call it the 'show'. With a first baby this can still go on for many hours. But since your sugar is borderline, I don't want you waiting at home. Come to the hospital now; I'll inform the labour ward. Don't eat anything on the way — a little water is fine."
  - who: shwe
    t: "ನೀವು ಈಗ ಬರ್ತೀರಾ ಡಾಕ್ಟರ್?"
    tr: "Nīvu īga bartīrā ḍākṭar?"
    en: "Will you come now, Doctor?"
  - who: gyn
    t: "ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು ಮೊದಲು ನಿಮ್ಮನ್ನ ಚೆಕ್ ಮಾಡಿ ನನಗೆ ಹೇಳ್ತಾರೆ. ಬೇಕಾದ ತಕ್ಷಣ ನಾನು ಹತ್ತು ನಿಮಿಷದಲ್ಲಿ ಅಲ್ಲಿರ್ತೀನಿ. ಧೈರ್ಯವಾಗಿರಿ, ನಾವೆಲ್ಲಾ ಇದೀವಿ."
    tr: "Ḍyūṭi ḍākṭru modalu nimmanna chek māḍi nanage hēḷtāre. Bēkāda takṣaṇa nānu hattu nimiṣadalli allirtīni. Dhairyavāgiri, nāvellā idīvi."
    en: "The duty doctor will examine you first and report to me. The moment I'm needed, I'll be there in ten minutes. Be brave — we're all here."
  - who: kiran
    t: "ಸ್ಯಾಮ್ ಆಗ್ಲೇ ಕಾರ್ ಕೀ ಹಿಡ್ಕೊಂಡು ಶೂ ಹಾಕ್ತಿದಾನೆ! ಬ್ಯಾಗ್ ಡಿಕ್ಕಿಯಲ್ಲಿಟ್ಟೆ. ಪ್ರದೀಪ್ ಭಾವನಿಗೆ ನಾನು ಫೋನ್ ಮಾಡ್ತೀನಿ, ನೇರ ಆಸ್ಪತ್ರೆಗೆ ಬರೋಕೆ ಹೇಳ್ತೀನಿ."
    tr: "Sām āglē kār kī hiḍkoṇḍu śū hāktidāne! Byāg ḍikkiyalliṭṭe. Pradīp bhāvanige nānu phōn māḍtīni, nēra āspatrege barōke hēḷtīni."
    en: "Sam's already putting his shoes on with the car key in his hand! I've put the bag in the boot. I'll call Pradeep and tell him to come straight to the hospital."

  - section: "🚗 The night drive and admission"
    learn: "ನಿಲ್ಲಿಸು (to stop something, causative of ನಿಲ್ಲು) · ಮೊದಲೇ ಹೇಳ್ತೀನಿ (I'll tell you up front) · cashless, advance, maternity limit"
  - scene: "2:40 a.m. Sam drives through the empty streets of Jayanagar, Amma and Shwetha in the back seat."
  - who: sam
    t: "ಶ್ವೇತಾ, ಮುಂದೆ ಹಂಪ್ ಇದೆ, ನಿಧಾನ ಮಾಡ್ತೀನಿ. ನೋವು ಬಂದ್ರೆ ಹೇಳು, ಗಾಡಿ ನಿಲ್ಲಿಸ್ತೀನಿ."
    tr: "Shwētā, munde hamp ide, nidhāna māḍtīni. Nōvu bandre hēḷu, gāḍi nillistīni."
    en: "Shwetha, there's a speed bump ahead, I'll slow down. Tell me if a pain comes and I'll stop the car."
  - who: shwe
    t: "ನಿಲ್ಲಿಸ್ಬೇಡ ಸ್ಯಾಮ್, ಓಡಿಸ್ತಾನೇ ಇರು! ಉಸಿರು ಒಳಗೆ… ಹೊರಗೆ… ಪ್ರೆಗ್ನೆನ್ಸಿ ಕ್ಲಾಸಲ್ಲಿ ಹೇಳಿಕೊಟ್ಟಿದ್ದು ಈಗ ನೆನಪಾಗ್ತಿದೆ."
    tr: "Nillisbēḍa Sām, ōḍistānē iru! Usiru oḷage… horage… pregnensi klāsalli hēḷikoṭṭiddu īga nenapāgtide."
    en: "Don't stop, Sam, keep driving! Breathe in… out… what they taught us in the pregnancy class is coming back to me now."
  - who: amma
    t: "ಹಾಗೇ, ನಿಧಾನವಾಗಿ ಉಸಿರಾಡು. ನನ್ನ ಕೈ ಹಿಡ್ಕೋ, ಎಷ್ಟು ಬೇಕಾದ್ರೂ ಒತ್ತು."
    tr: "Hāgē, nidhānavāgi usirāḍu. Nanna kai hiḍkō, eṣṭu bēkādrū ottu."
    en: "That's it, breathe slowly. Hold my hand — squeeze as hard as you need to."
  - scene: "The hospital's maternity entrance. Pradeep is already there, hair uncombed, a folder under his arm."
  - who: pradeep
    t: "ರೋಡ್ ಖಾಲಿ ಇತ್ತು, ಹದಿನೈದು ನಿಮಿಷದಲ್ಲಿ ಬಂದ್ಬಿಟ್ಟೆ. ಶ್ವೇತಾ, ಹೇಗಿದೀಯಾ?"
    tr: "Rōḍ khāli ittu, hadinaidu nimiṣadalli bandbiṭṭe. Shwētā, hēgidīyā?"
    en: "The road was empty, I got here in fifteen minutes. Shwetha, how are you?"
  - who: shwe
    t: "ಹೇಗಿದೀನಿ ಅಂತ ಮಾತ್ರ ಕೇಳ್ಬೇಡ. ಫೈಲ್ ತಂದ್ಯಾ?"
    tr: "Hēgidīni anta mātra kēḷbēḍa. Phail tandyā?"
    en: "Just don't ask me how I am. Did you bring the file?"
  - who: pradeep
    t: "ತಂದೆ. ಫೈಲ್, ಇನ್ಶೂರೆನ್ಸ್ ಕಾರ್ಡ್, ಆಧಾರ್, ಎಲ್ಲಾ ಇದೆ."
    tr: "Tande. Phail, inśūrens kārḍ, ādhār, ellā ide."
    en: "I did. The file, insurance card, Aadhaar — it's all here."
  - who: desk
    t: "ಡಾಕ್ಟರ್ ಉಷಾ ರಾವ್ ಪೇಶಂಟಾ? ಡಾಕ್ಟ್ರು ಫೋನ್ ಮಾಡಿ ಹೇಳಿದ್ರು. ಪೇಶಂಟ್‌ನ ಮೊದಲು ಲೇಬರ್ ವಾರ್ಡ್‌ಗೆ ಕರ್ಕೊಂಡು ಹೋಗಿ. ಅಡ್ಮಿಷನ್ ಫಾರ್ಮಾಲಿಟಿ ನೀವು ಇಲ್ಲಿ ಮುಗಿಸಿ ಸಾರ್."
    tr: "Ḍākṭar Uṣā Rāv pēśaṇṭā? Ḍākṭru phōn māḍi hēḷidru. Pēśaṇṭna modalu lēbar vārḍge karkoṇḍu hōgi. Aḍmiṣan phārmāliṭi nīvu illi mugisi sār."
    en: "Dr. Usha Rao's patient? The doctor phoned us. Take the patient up to the labour ward first. You can finish the admission formalities here, sir."
  - who: desk
    t: "ಇನ್ಶೂರೆನ್ಸ್ ಕ್ಯಾಶ್‌ಲೆಸ್ ಆಗುತ್ತೆ, ಪ್ರಿ-ಆಥರೈಸೇಶನ್ ಈಗ್ಲೇ ಕಳಿಸ್ತೀವಿ. ಆದ್ರೆ ಒಂದು ವಿಷಯ ಮೊದಲೇ ಹೇಳ್ತೀನಿ: ನಿಮ್ಮ ಪಾಲಿಸಿಲಿ ಮೆಟರ್ನಿಟಿಗೆ ಲಿಮಿಟ್ ಇದೆ. ನಾರ್ಮಲ್‌ಗೆ ಐವತ್ತು ಸಾವಿರ, ಸಿಸೇರಿಯನ್ ಆದ್ರೆ ಎಪ್ಪತ್ತೈದು ಸಾವಿರ. ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಆದ್ರೆ ನೀವೇ ಕಟ್ಬೇಕು. ಈಗ ಇಪ್ಪತ್ತು ಸಾವಿರ ಅಡ್ವಾನ್ಸ್ ಕಟ್ಟಿ."
    tr: "Inśūrens kyāśles āgutte, pri-ātharaisēśan īglē kaḷistīvi. Ādre ondu viṣaya modalē hēḷtīni: nimma pālisili meṭarniṭige limiṭ ide. Nārmalge aivattu sāvira, sisēriyan ādre eppattaidu sāvira. Adakkinta jāsti ādre nīvē kaṭbēku. Īga ippattu sāvira aḍvāns kaṭṭi."
    en: "The insurance will be cashless; we'll send the pre-authorisation right away. But let me tell you one thing up front: your policy has a maternity limit — fifty thousand for a normal delivery, seventy-five thousand if it's a C-section. Anything above that you pay yourselves. For now, please pay an advance of twenty thousand."
  - who: pradeep
    t: "ಕ್ಯಾಶ್‌ಲೆಸ್ ಅಂದ್ರೂ ಅಡ್ವಾನ್ಸ್ ಯಾಕೆ?"
    tr: "Kyāśles andrū aḍvāns yāke?"
    en: "Why an advance if it's cashless?"
  - who: desk
    t: "ಅಪ್ರೂವಲ್ ಬರೋವರೆಗೂ ಸಾರ್. ಬಿಲ್ ಲಿಮಿಟ್ ಒಳಗೇ ಮುಗಿದ್ರೆ ಡಿಸ್ಚಾರ್ಜ್ ಟೈಮಲ್ಲಿ ಅಡ್ವಾನ್ಸ್ ವಾಪಸ್ ಕೊಡ್ತೀವಿ. ಯುಪಿಐ ಆಗುತ್ತೆ."
    tr: "Aprūval barōvaregū sār. Bil limiṭ oḷagē mugidre ḍischārj ṭaimalli aḍvāns vāpas koḍtīvi. Yupiai āgutte."
    en: "Until the approval comes, sir. If the bill stays within the limit, we refund the advance at discharge. UPI is fine."
  - who: pradeep
    t: "ಸರಿ, ಈಗ್ಲೇ ಮಾಡ್ತೀನಿ. ಸ್ಯಾಮ್, ನೀನು ಅತ್ತೆ ಜೊತೆ ಮೇಲೆ ಹೋಗು. ನಾನು ಐದು ನಿಮಿಷದಲ್ಲಿ ಬರ್ತೀನಿ."
    tr: "Sari, īglē māḍtīni. Sām, nīnu atte jote mēle hōgu. Nānu aidu nimiṣadalli bartīni."
    en: "Fine, I'll pay now. Sam, you go up with my mother-in-law. I'll be there in five minutes."

  - section: "🩺 The labour ward — a long night"
    learn: "monitoring words: ಸಿಟಿಜಿ, ಹಾರ್ಟ್‌ಬೀಟ್, ಗರ್ಭಕೋಶದ ಬಾಯಿ, ಸೆಂಟಿಮೀಟರ್ ತೆರೆದಿದೆ · -ಅಂದ್ಮೇಲೆ (once … says so) · ಸುಸ್ತು (exhaustion)"
  - scene: "3:15 a.m. The labour room. Two belts are strapped around Shwetha's belly and a machine beeps with the baby's heartbeat. Only one attendant is allowed inside; Pradeep is with her."
  - who: nurse
    t: "ಶ್ವೇತಾ ಅವರೇ, ಇದು ಸಿಟಿಜಿ ಮಷೀನ್. ಒಂದು ಬೆಲ್ಟ್ ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ನೋಡುತ್ತೆ, ಇನ್ನೊಂದು ನಿಮ್ಮ ನೋವು ಎಷ್ಟು ಹೊತ್ತಿಗೊಂದು ಸಲ, ಎಷ್ಟು ಜೋರಾಗಿ ಬರ್ತಿದೆ ಅಂತ ತೋರಿಸುತ್ತೆ. ಆ ಟಕ್ ಟಕ್ ಸದ್ದು ನಿಮ್ಮ ಮಗುವಿನ ಹೃದಯ."
    tr: "Shwētā avarē, idu siṭiji maṣīn. Ondu belṭ maguvina hārṭbīṭ nōḍutte, innondu nimma nōvu eṣṭu hottigondu sala, eṣṭu jōrāgi bartide anta tōrisutte. Ā ṭak ṭak saddu nimma maguvina hṛdaya."
    en: "Shwetha, this is the CTG machine. One belt follows the baby's heartbeat; the other shows how often your contractions come and how strong they are. That tick-tick sound is your baby's heart."
  - who: pradeep
    t: "ಸ್ಕ್ರೀನ್ ಮೇಲೆ ನೂರ ನಲವತ್ತು ಅಂತ ತೋರಿಸ್ತಿದೆ. ಅದು ಸರಿನಾ ಸಿಸ್ಟರ್?"
    tr: "Skrīn mēle nūra nalavattu anta tōristide. Adu sarinā sisṭar?"
    en: "The screen says a hundred and forty. Is that all right, Sister?"
  - who: nurse
    t: "ಹೌದು, ನೂರ ಹತ್ತರಿಂದ ನೂರ ಅರವತ್ತರ ಒಳಗೆ ಇದ್ರೆ ನಾರ್ಮಲ್. ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು ಒಳಗೆ ಚೆಕ್ ಮಾಡಿದ್ರು: ಗರ್ಭಕೋಶದ ಬಾಯಿ ಮೂರು ಸೆಂಟಿಮೀಟರ್ ತೆರೆದಿದೆ. ಹತ್ತು ಆಗ್ಬೇಕು."
    tr: "Haudu, nūra hattarinda nūra aravattara oḷage idre nārmal. Ḍyūṭi ḍākṭru oḷage chek māḍidru: garbhakōśada bāyi mūru seṇṭimīṭar teredide. Hattu āgbēku."
    en: "Yes, anything between a hundred and ten and a hundred and sixty is normal. The duty doctor examined you inside: the cervix is three centimetres open. It has to reach ten."
  - who: shwe
    t: "ಇನ್ನೂ ಮೂರೇನಾ? ಎರಡು ಗಂಟೆಯಿಂದ ಈ ನೋವು ತಿಂತಿದೀನಿ…"
    tr: "Innū mūrēnā? Eraḍu gaṇṭeyinda ī nōvu tintidīni…"
    en: "Only three? I've been suffering this pain for two hours…"
  - who: nurse
    t: "ಮೊದಲ ಮಗುವಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಗಂಟೆಗೆ ಒಂದು ಸೆಂಟಿಮೀಟರ್ ಅಂತ ಲೆಕ್ಕ. ನೋವು ಬಂದಾಗ ಉಸಿರು ಬಿಗಿ ಹಿಡೀಬೇಡಿ, ನಿಧಾನವಾಗಿ ಬಿಡಿ. ನೋವು ಇಲ್ಲದಾಗ ಸ್ವಲ್ಪ ನಡೀರಿ, ಅದರಿಂದ ಮಗು ಕೆಳಗೆ ಇಳಿಯುತ್ತೆ."
    tr: "Modala maguvige sāmānyavāgi gaṇṭege ondu seṇṭimīṭar anta lekka. Nōvu bandāga usiru bigi hiḍībēḍi, nidhānavāgi biḍi. Nōvu illadāga svalpa naḍīri, adarinda magu keḷage iḷiyutte."
    en: "With a first baby we usually reckon about a centimetre an hour. When a pain comes, don't hold your breath — let it out slowly. Between pains, walk a little; it helps the baby come down."
  - who: shwe
    t: "ಎಪಿಡ್ಯೂರಲ್ ಸಿಗುತ್ತಾ? ಬೇಕಾದ್ರೆ ಕೊಡಬಹುದು ಅಂತ ಡಾಕ್ಟ್ರು ಉಷಾ ಹೇಳಿದ್ರು."
    tr: "Epiḍyūral siguttā? Bēkādre koḍabahudu anta ḍākṭru Uṣā hēḷidru."
    en: "Can I get an epidural? Dr. Usha said I could have one if I wanted."
  - who: nurse
    t: "ಸಿಗುತ್ತೆ. ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು ಸರಿ ಅಂದ್ಮೇಲೆ ಅನಸ್ತೀಶಿಯಾ ಡಾಕ್ಟ್ರು ಬಂದು ಬೆನ್ನಿಗೆ ಹಾಕ್ತಾರೆ. ಅದಕ್ಕೆ ಬೇರೆ ಚಾರ್ಜ್ ಇದೆ ಅಂತ ನಿಮ್ಮ ಮನೆಯವರಿಗೆ ಹೇಳಿ."
    tr: "Sigutte. Ḍyūṭi ḍākṭru sari andmēle anastīśiyā ḍākṭru bandu bennige hāktāre. Adakke bēre chārj ide anta nimma maneyavarige hēḷi."
    en: "You can. Once the duty doctor okays it, the anaesthetist will come and put it in your back. Tell your family there's a separate charge for it."
  - scene: "Morning, 9:30. Outside the labour room. Appa has arrived with Kiran and a flask of coffee. Sam never went home. Pradeep has come out to talk while Amma takes his place inside."
  - who: appa
    t: "ಏನಾಯ್ತು ಪ್ರದೀಪ್? ಡಾಕ್ಟ್ರು ಏನಂದ್ರು?"
    tr: "Ēnāytu Pradīp? Ḍākṭru ēnandru?"
    en: "What's happening, Pradeep? What did the doctor say?"
  - who: pradeep
    t: "ರಾತ್ರಿ ಮೂರು ಇತ್ತು, ಬೆಳಿಗ್ಗೆ ಆರು ಗಂಟೆಗೆ ಆರು ಸೆಂಟಿಮೀಟರ್ ಆಯ್ತು. ಆಮೇಲೆ ಮೂರೂವರೆ ಗಂಟೆಯಿಂದ ಅಲ್ಲೇ ನಿಂತಿದೆ, ಮುಂದೆ ಹೋಗ್ತಿಲ್ಲ. ಎಂಟು ಗಂಟೆಗೆ ನೀರು ಹೋಯ್ತು, ಎಪಿಡ್ಯೂರಲ್ ಕೊಟ್ಟಿದಾರೆ, ನೋವು ಸ್ವಲ್ಪ ಕಮ್ಮಿ. ಆದ್ರೆ ಅವಳು ತುಂಬಾ ಸುಸ್ತಾಗಿದಾಳೆ, ಮಾವ."
    tr: "Rātri mūru ittu, beḷigge āru gaṇṭege āru seṇṭimīṭar āytu. Āmēle mūrūvare gaṇṭeyinda allē nintide, munde hōgtilla. Eṇṭu gaṇṭege nīru hōytu, epiḍyūral koṭṭidāre, nōvu svalpa kammi. Ādre avaḷu tumbā sustāgidāḷe, māva."
    en: "At night it was three; by six this morning it was six centimetres. Since then, three and a half hours, it's been stuck there, not moving. Her water broke at eight, they've given the epidural, so the pain's a bit less. But she's completely exhausted, Mava."
  - who: kiran
    t: "ಅಕ್ಕ ರಾತ್ರಿಯೆಲ್ಲಾ ಒಂದು ನಿಮಿಷನೂ ನಿದ್ದೆ ಮಾಡಿಲ್ಲ ಅಲ್ವಾ…"
    tr: "Akka rātriyellā ondu nimiṣanū nidde māḍilla alvā…"
    en: "Akka hasn't slept a single minute all night, has she…"
  - who: sam
    t: "ಎಲ್ರಿಗೂ ಕಾಫಿ ಇದೆ. ಪ್ರದೀಪ್, ನೀನು ಏನಾದ್ರೂ ತಿನ್ನು. ಇಲ್ಲಾಂದ್ರೆ ಆಮೇಲೆ ನಿನ್ನನ್ನೂ ಅಡ್ಮಿಟ್ ಮಾಡ್ಬೇಕಾಗುತ್ತೆ."
    tr: "Ellrigū kāphi ide. Pradīp, nīnu ēnādrū tinnu. Illāndre āmēle ninnannū aḍmiṭ māḍbēkāgutte."
    en: "There's coffee for everyone. Pradeep, eat something. Otherwise they'll have to admit you too."
  - who: amma
    t: "ಪ್ರದೀಪ್, ಬೇಗ ಒಳಗೆ ಬಾ. ಮಷೀನ್ ಬೀಪ್ ಮಾಡ್ತಾ ಇತ್ತು, ಸಿಸ್ಟರ್ ಓಡಿ ಹೋಗಿ ಡಾಕ್ಟ್ರು ಉಷಾನ ಕರೆದ್ರು. ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ಕೆಳಗೆ ಹೋಗ್ತಿತ್ತು ಅನ್ಸುತ್ತೆ."
    tr: "Pradīp, bēga oḷage bā. Maṣīn bīp māḍtā ittu, sisṭar ōḍi hōgi ḍākṭru Uṣāna karedru. Maguvina hārṭbīṭ keḷage hōgtittu ansutte."
    en: "(at the door, anxious) Pradeep, come in quickly. The machine was beeping and the sister ran to call Dr. Usha. I think the baby's heartbeat was dropping."

  - section: "⚠️ The decision: a C-section"
    learn: "explaining risk: -ಬಹುದು, ಕಾಯೋದು ಸೇಫ್ ಅಲ್ಲ · ಸಲಹೆ (advice), ರಕ್ತಸ್ರಾವ (bleeding), ಅರಿವಳಿಕೆ (anaesthesia), ಸಾಕ್ಷಿ (witness) · consent: who signs"
  - scene: "10:05 a.m. Dr. Usha Rao, in green scrubs, sits on a stool beside Shwetha's bed. Pradeep stands holding Shwetha's hand. The CTG paper strip lies on the bed."
  - who: gyn
    t: "ಶ್ವೇತಾ, ಪ್ರದೀಪ್, ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ. ಕಳೆದ ಅರ್ಧ ಗಂಟೆಯಿಂದ ಪ್ರತಿ ನೋವು ಬಂದಾಗ ಮಗುವಿನ ಹಾರ್ಟ್‌ರೇಟ್ ತೊಂಬತ್ತಕ್ಕೆ ಇಳೀತಿದೆ, ಮತ್ತೆ ಮೇಲೆ ಬರೋಕೆ ತುಂಬಾ ಟೈಮ್ ತಗೋತಿದೆ. ನೀರಿನ ಬಣ್ಣನೂ ಹಸಿರಾಗಿದೆ, ಅಂದ್ರೆ ಮಗು ಒಳಗೇ ಮೆಕೋನಿಯಂ, ಅಂದ್ರೆ ಮೊದಲ ಮಲ, ಮಾಡಿದೆ. ಇದನ್ನ ನಾವು ಫೀಟಲ್ ಡಿಸ್ಟ್ರೆಸ್ ಅಂತೀವಿ."
    tr: "Shwētā, Pradīp, nēravāgi hēḷtīni. Kaḷeda ardha gaṇṭeyinda prati nōvu bandāga maguvina hārṭrēṭ tombattakke iḷītide, matte mēle barōke tumbā ṭaim tagōtide. Nīrina baṇṇanū hasirāgide, andre magu oḷagē mekōniyam, andre modala mala, māḍide. Idanna nāvu phīṭal ḍisṭres antīvi."
    en: "Shwetha, Pradeep, I'll be direct. For the last half hour, with every contraction the baby's heart rate drops to ninety and takes too long to come back up. And the fluid has turned green, which means the baby has passed meconium — its first stool — inside. We call this foetal distress."
  - who: shwe
    t: "ಮಗುವಿಗೆ ಏನಾದ್ರೂ ಆಗಿದೆಯಾ ಡಾಕ್ಟರ್?"
    tr: "Maguvige ēnādrū āgideyā ḍākṭar?"
    en: "Has something happened to the baby, Doctor?"
  - who: gyn
    t: "ಈ ಕ್ಷಣದಲ್ಲಿ ಮಗು ಸರಿಯಾಗಿದೆ. ಆದ್ರೆ ಮಗುವಿಗೆ ಆಕ್ಸಿಜನ್ ಸರಿಯಾಗಿ ಸಿಗ್ತಿಲ್ಲ ಅನ್ನೋ ಸೂಚನೆ ಇದು. ಮೂರೂವರೆ ಗಂಟೆಯಿಂದ ಆರು ಸೆಂಟಿಮೀಟರ್‌ನಲ್ಲೇ ನಿಂತಿದೆ. ನಾರ್ಮಲ್ ಡೆಲಿವರಿಗೆ ಇನ್ನೂ ಹಲವು ಗಂಟೆ ಬೇಕಾಗಬಹುದು. ಅಷ್ಟು ಹೊತ್ತು ಕಾಯೋದು ಸೇಫ್ ಅಲ್ಲ. ಸಿಸೇರಿಯನ್ ಮಾಡೋಣ ಅಂತ ನನ್ನ ಸಲಹೆ."
    tr: "Ī kṣaṇadalli magu sariyāgide. Ādre maguvige āksijan sariyāgi sigtilla annō sūchane idu. Mūrūvare gaṇṭeyinda āru seṇṭimīṭarnallē nintide. Nārmal ḍelivarige innū halavu gaṇṭe bēkāgabahudu. Aṣṭu hottu kāyōdu sēph alla. Sisēriyan māḍōṇa anta nanna salahe."
    en: "At this moment the baby is all right. But this is a sign the baby isn't getting enough oxygen. You've been stuck at six centimetres for three and a half hours. A normal delivery could take many more hours. Waiting that long isn't safe. My advice is a C-section."
  - who: shwe
    t: "ನಾರ್ಮಲ್ ಆಗ್ಬೇಕು ಅಂತ ಒಂಬತ್ತು ತಿಂಗಳು ದಿನಾ ನಡೆದೆ, ಯೋಗ ಮಾಡಿದೆ, ಸಿಹಿ ಬಿಟ್ಟೆ… ಅದೆಲ್ಲಾ ವ್ಯರ್ಥ ಆಯ್ತಾ?"
    tr: "Nārmal āgbēku anta ombattu tiṅgaḷu dinā naḍede, yōga māḍide, sihi biṭṭe… adellā vyartha āytā?"
    en: "(crying) For nine months I walked every day so it would be normal, I did yoga, I gave up sweets… was all of that for nothing?"
  - who: gyn
    t: "ಒಂದು ಚೂರೂ ವ್ಯರ್ಥ ಆಗಿಲ್ಲ. ನೀವು ಆರೋಗ್ಯವಾಗಿದೀರಿ, ಅದಕ್ಕೇ ಆಪರೇಷನ್ ಆದ್ಮೇಲೆ ಬೇಗ ಹುಷಾರಾಗ್ತೀರಿ. ಸಿಸೇರಿಯನ್ ಸೋಲು ಅಲ್ಲ ಶ್ವೇತಾ. ಮಗು ಸುರಕ್ಷಿತವಾಗಿ ಹೊರಗೆ ಬರೋದು ಮುಖ್ಯ."
    tr: "Ondu chūrū vyartha āgilla. Nīvu ārōgyavāgidīri, adakkē āparēṣan ādmēle bēga huṣārāgtīri. Sisēriyan sōlu alla Shwētā. Magu surakṣitavāgi horage barōdu mukhya."
    en: "Not one bit of it was wasted. You're healthy, and that's exactly why you'll recover quickly after the operation. A C-section isn't a failure, Shwetha. What matters is that the baby comes out safely."
  - who: pradeep
    t: "ಶ್ವೇತಾಗೆ ಏನು ರಿಸ್ಕ್ ಇದೆ ಡಾಕ್ಟರ್? ಮುಚ್ಚಿಡದೆ ಹೇಳಿ."
    tr: "Shwētāge ēnu risk ide ḍākṭar? Muchchiḍade hēḷi."
    en: "What are the risks for Shwetha, Doctor? Please don't hide anything."
  - who: gyn
    t: "ಯಾವ ಆಪರೇಷನ್‌ನಲ್ಲೂ ಸ್ವಲ್ಪ ರಿಸ್ಕ್ ಇರುತ್ತೆ. ರಕ್ತಸ್ರಾವ ಜಾಸ್ತಿ ಆಗಬಹುದು, ಗಾಯಕ್ಕೆ ಇನ್‌ಫೆಕ್ಷನ್ ಆಗಬಹುದು, ಕಾಲಲ್ಲಿ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟಬಹುದು. ಅಪರೂಪಕ್ಕೆ ಮೂತ್ರಕೋಶಕ್ಕೆ ಪೆಟ್ಟಾಗಬಹುದು. ಇವನ್ನ ತಡೆಯೋಕೆ ಆಂಟಿಬಯಾಟಿಕ್ ಕೊಡ್ತೀವಿ, ನಾಳೆನೇ ಎಬ್ಬಿಸಿ ನಡೆಸ್ತೀವಿ. ಆದ್ರೆ ಈಗ ಕಾಯೋದ್ರಲ್ಲಿರೋ ರಿಸ್ಕ್ ಇದಕ್ಕಿಂತ ಜಾಸ್ತಿ."
    tr: "Yāva āparēṣannallū svalpa risk irutte. Raktasrāva jāsti āgabahudu, gāyakke inphekṣan āgabahudu, kālalli rakta heppugaṭṭabahudu. Aparūpakke mūtrakōśakke peṭṭāgabahudu. Ivanna taḍeyōke āṇṭibayāṭik koḍtīvi, nāḷenē ebbisi naḍestīvi. Ādre īga kāyōdralli irō risk idakkinta jāsti."
    en: "Every operation carries some risk. There could be heavier bleeding, the wound could get infected, a clot could form in the legs. Rarely, the bladder can be injured. To prevent these we give antibiotics, and we'll have you up and walking tomorrow. But right now, the risk in waiting is bigger than all of this."
  - who: shwe
    t: "ಅರಿವಳಿಕೆ ಕೊಟ್ಟು ನನ್ನನ್ನ ಪೂರ್ತಿ ಮಲಗಿಸ್ತೀರಾ? ಮಗು ಹುಟ್ಟೋದು ನನಗೆ ಗೊತ್ತೇ ಆಗಲ್ವಾ?"
    tr: "Arivaḷike koṭṭu nannanna pūrti malagistīrā? Magu huṭṭōdu nanage gottē āgalvā?"
    en: "Will you put me completely to sleep with anaesthesia? Won't I even know when the baby is born?"
  - who: gyn
    t: "ಇಲ್ಲ. ಎಪಿಡ್ಯೂರಲ್ ಆಗ್ಲೇ ಹಾಕಿದೆಯಲ್ಲ, ಅದರಲ್ಲೇ ಜಾಸ್ತಿ ಔಷಧ ಕೊಟ್ಟು ಸೊಂಟದ ಕೆಳಗೆ ಮಾತ್ರ ಮರಗಟ್ಟಿಸ್ತಾರೆ. ನೀವು ಎಚ್ಚರವಾಗೇ ಇರ್ತೀರಿ. ನೋವು ಇರಲ್ಲ, ಸ್ವಲ್ಪ ಎಳೆದ ಹಾಗೆ ಅನ್ಸುತ್ತೆ ಅಷ್ಟೇ. ಮಗು ಅಳೋದನ್ನ ಮೊದಲು ಕೇಳೋದು ನೀವೇ."
    tr: "Illa. Epiḍyūral āglē hākideyalla, adarallē jāsti auṣadha koṭṭu soṇṭada keḷage mātra maragaṭṭistāre. Nīvu echcharavāgē irtīri. Nōvu iralla, svalpa eḷeda hāge ansutte aṣṭē. Magu aḷōdanna modalu kēḷōdu nīvē."
    en: "No. The epidural is already in; they'll give a stronger dose through it so you're numb only below the waist. You'll stay awake. There'll be no pain, just a feeling of tugging. You'll be the first to hear the baby cry."
  - who: pradeep
    t: "ಮುಂದೆ ಇನ್ನೊಂದು ಮಗು ಬೇಕು ಅಂದ್ರೆ, ಅದೂ ಆಪರೇಷನ್ನೇ ಆಗ್ಬೇಕಾ?"
    tr: "Munde innondu magu bēku andre, adū āparēṣannē āgbēkā?"
    en: "If we want another child later, will that have to be an operation too?"
  - who: gyn
    t: "ಹಾಗೇನಿಲ್ಲ. ಸಿಸೇರಿಯನ್ ಆದ್ಮೇಲೂ ಎಷ್ಟೋ ಜನಕ್ಕೆ ಮುಂದಿನ ಸಲ ನಾರ್ಮಲ್ ಆಗುತ್ತೆ. ಸಾಮಾನ್ಯವಾಗಿ ಕನಿಷ್ಠ ಒಂದೂವರೆ ವರ್ಷ ಅಂತರ ಇರ್ಲಿ ಅಂತ ಹೇಳ್ತೀವಿ. ಅದನ್ನ ಆಮೇಲೆ ಆರಾಮಾಗಿ ಮಾತಾಡೋಣ."
    tr: "Hāgēnilla. Sisēriyan ādmēlū eṣṭō janakke mundina sala nārmal āgutte. Sāmānyavāgi kaniṣṭha ondūvare varṣa antara irli anta hēḷtīvi. Adanna āmēle ārāmāgi mātāḍōṇa."
    en: "Not necessarily. Plenty of women have a normal delivery the next time, even after a C-section. We usually advise a gap of at least a year and a half. We can talk about that calmly later."
  - who: nurse
    t: "ಇದು ಕನ್ಸೆಂಟ್ ಫಾರ್ಮ್. ಆಪರೇಷನ್ ಯಾಕೆ, ಏನೇನು ರಿಸ್ಕ್, ಅರಿವಳಿಕೆ, ಬೇಕಾದ್ರೆ ರಕ್ತ ಕೊಡೋದು, ಎಲ್ಲಾ ಇದರಲ್ಲಿ ಬರೆದಿದೆ. ಕನ್ನಡದಲ್ಲೂ ಇದೆ, ಓದಿ."
    tr: "Idu kanseṇṭ phārm. Āparēṣan yāke, ēnēnu risk, arivaḷike, bēkādre rakta koḍōdu, ellā idaralli baredide. Kannaḍadallū ide, ōdi."
    en: "This is the consent form. Why the operation is needed, what the risks are, the anaesthesia, a blood transfusion if needed — it's all written here. It's in Kannada too; please read it."
  - who: pradeep
    t: "ನಾನು ಸೈನ್ ಮಾಡ್ಲಾ?"
    tr: "Nānu sain māḍlā?"
    en: "Shall I sign?"
  - who: gyn
    t: "ಮೊದಲು ಶ್ವೇತಾ ಸೈನ್ ಮಾಡ್ಬೇಕು. ಪೇಶಂಟ್ ಅವರೇ, ಪೂರ್ತಿ ಎಚ್ಚರವಾಗಿದಾರೆ, ನಿರ್ಧಾರ ಅವರದ್ದು. ನೀವು ಕೆಳಗೆ ಸಂಬಂಧಿಕರಾಗಿ, ಸಾಕ್ಷಿಯಾಗಿ ಸೈನ್ ಮಾಡಿ. ಏನಾದ್ರೂ ಡೌಟ್ ಇದ್ರೆ ಈಗ್ಲೇ ಕೇಳಿ."
    tr: "Modalu Shwētā sain māḍbēku. Pēśaṇṭ avarē, pūrti echcharavāgidāre, nirdhāra avaraddu. Nīvu keḷage sambandhikarāgi, sākṣiyāgi sain māḍi. Ēnādrū ḍauṭ idre īglē kēḷi."
    en: "Shwetha signs first. She's the patient, she's fully conscious, the decision is hers. You sign below as her relative and witness. If you have any doubts, ask now."
  - who: shwe
    t: "ಡೌಟ್ ಇಲ್ಲ ಡಾಕ್ಟರ್. ಭಯ ಇದೆ, ಡೌಟ್ ಇಲ್ಲ. ಪೆನ್ ಕೊಡಿ."
    tr: "Ḍauṭ illa ḍākṭar. Bhaya ide, ḍauṭ illa. Pen koḍi."
    en: "No doubts, Doctor. I'm scared, but I have no doubts. Give me the pen."
  - who: gyn
    t: "ಧೈರ್ಯವಂತೆ. ಇಪ್ಪತ್ತು ನಿಮಿಷದಲ್ಲಿ ಓಟಿಗೆ ಶಿಫ್ಟ್ ಮಾಡ್ತೀವಿ. ಮಕ್ಕಳ ಡಾಕ್ಟ್ರು ಫರ್ಹಾನ್ ಕೂಡ ಓಟಿಯಲ್ಲಿರ್ತಾರೆ, ಮಗು ಹೊರಗೆ ಬಂದ ತಕ್ಷಣ ಅವರು ನೋಡ್ಕೊಳ್ತಾರೆ."
    tr: "Dhairyavante. Ippattu nimiṣadalli ōṭige śifṭ māḍtīvi. Makkaḷa ḍākṭru Pharhān kūḍa ōṭiyallirtāre, magu horage banda takṣaṇa avaru nōḍkoḷtāre."
    en: "Brave girl. We'll shift you to the OT in twenty minutes. The paediatrician, Dr. Farhan, will be in the OT too; he'll take care of the baby the moment she's out."
  - who: pradeep
    t: "ನಾನು ಇಲ್ಲೇ ಬಾಗಿಲ ಹತ್ರ ಇರ್ತೀನಿ, ಶ್ವೇತಾ. ಎಲ್ಲೂ ಹೋಗಲ್ಲ."
    tr: "Nānu illē bāgila hatra irtīni, Shwētā. Ellū hōgalla."
    en: "I'll be right here by the door, Shwetha. I'm not going anywhere."

  - section: "🪑 Waiting outside the OT"
    learn: "ನಡುಗು (tremble) · ಹರಕೆ ಹೊರು (make a vow) · telling elders the truth: ಸುಳ್ಳು ಹೇಳ್ಬೇಡ · ಅತ್ತ ಇತ್ತ (back and forth)"
  - scene: "10:40 a.m. The corridor outside the operation theatre; a red light glows above the door. Appa, Amma, Pradeep, Kiran and Sam. Sumitra and Shankar hurry in."
  - who: sumitra
    t: "ಏನಾಯ್ತು? ಫೋನಲ್ಲಿ ಪ್ರದೀಪ್ 'ಆಪರೇಷನ್' ಅಂದ ತಕ್ಷಣ ನನ್ನ ಕೈ ಕಾಲು ನಡುಗೋಕೆ ಶುರು ಆಯ್ತು."
    tr: "Ēnāytu? Phōnalli Pradīp 'āparēṣan' anda takṣaṇa nanna kai kālu naḍugōke śuru āytu."
    en: "What happened? The moment Pradeep said 'operation' on the phone, my hands and legs started shaking."
  - who: amma
    t: "ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ಇಳೀತಿತ್ತು, ಅದಕ್ಕೆ ಡಾಕ್ಟ್ರು ಸಿಸೇರಿಯನ್ ಮಾಡ್ತಿದಾರೆ. ಶ್ವೇತಾ ತುಂಬಾ ಧೈರ್ಯವಾಗಿ ಸೈನ್ ಮಾಡಿದ್ಲು. ನಾನೇ ಅಳ್ತಾ ಇದ್ದೆ, ಅವಳು ನನಗೆ ಸಮಾಧಾನ ಮಾಡಿದ್ಲು."
    tr: "Maguvina hārṭbīṭ iḷītittu, adakke ḍākṭru sisēriyan māḍtidāre. Shwētā tumbā dhairyavāgi sain māḍidlu. Nānē aḷtā idde, avaḷu nanage samādhāna māḍidlu."
    en: "The baby's heartbeat was dropping, so the doctor is doing a C-section. Shwetha signed so bravely. I was the one crying — she was the one comforting me."
  - who: shankar
    t: "ಉಷಾ ಡಾಕ್ಟ್ರದ್ದು ಒಳ್ಳೆ ಕೈ ಅಂತ ಎಲ್ರೂ ಹೇಳ್ತಾರೆ. ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ನಿರ್ಧಾರ ತಗೊಂಡಿದಾರೆ. ಎಲ್ಲಾ ಸರಿ ಹೋಗುತ್ತೆ."
    tr: "Uṣā ḍākṭraddu oḷḷe kai anta ellrū hēḷtāre. Samayakke sariyāgi nirdhāra tagoṇḍidāre. Ellā sari hōgutte."
    en: "Everyone says Dr. Usha has good hands. She made the decision at the right time. It'll all be fine."
  - who: appa
    t: "ಹಲೋ ಅಮ್ಮ… ಹೌದು, ಓಟಿ ಒಳಗೆ ಕರ್ಕೊಂಡು ಹೋದ್ರು. ಇಲ್ಲ ಇಲ್ಲ, ಗಾಬರಿ ಪಡೋ ಅಂಥದ್ದು ಏನಿಲ್ಲ…"
    tr: "Halō amma… haudu, ōṭi oḷage karkoṇḍu hōdru. Illa illa, gābari paḍō anthaddu ēnilla…"
    en: "(on the phone) Hello, Amma… yes, they've taken her into the OT. No, no, there's nothing to panic about…"
  - who: ajji
    t: "ರಮೇಶ, ನನಗೆ ಸುಳ್ಳು ಹೇಳ್ಬೇಡ. ನಿನ್ನ ಧ್ವನಿಯಲ್ಲೇ ಗೊತ್ತಾಗುತ್ತೆ. ಆಪರೇಷನ್ ಯಾಕೆ ಆಯ್ತು?"
    tr: "Ramēsha, nanage suḷḷu hēḷbēḍa. Ninna dhvaniyallē gottāgutte. Āparēṣan yāke āytu?"
    en: "(on the phone) Ramesh, don't lie to me. I can hear it in your voice. Why did it become an operation?"
  - who: appa
    t: "ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ಸ್ವಲ್ಪ ಕಮ್ಮಿ ಆಗ್ತಿತ್ತು ಅಮ್ಮ. ಅದಕ್ಕೇ ಕಾಯದೆ ಆಪರೇಷನ್. ಡಾಕ್ಟ್ರು ಎಲ್ಲಾ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದ್ರು, ಶ್ವೇತಾ ಸಮಾಧಾನವಾಗಿದಾಳೆ."
    tr: "Maguvina hārṭbīṭ svalpa kammi āgtittu amma. Adakkē kāyade āparēṣan. Ḍākṭru ellā spaṣṭavāgi hēḷidru, Shwētā samādhānavāgidāḷe."
    en: "The baby's heartbeat was going down a bit, Amma. That's why they're operating instead of waiting. The doctor explained everything clearly, and Shwetha is calm."
  - who: ajji
    t: "ಸರಿ. ನಾನು ಇಲ್ಲಿ ದೇವರ ಮುಂದೆ ಕೂತಿದೀನಿ, ವಿಮಲಾ ಜೊತೆಗಿದಾಳೆ. ನನ್ನ ಚಿಂತೆ ಮಾಡ್ಬೇಡ. ಮಗು ಅತ್ತ ತಕ್ಷಣ ನನಗೆ ಫೋನ್ ಮಾಡು, ಮೊದಲು ನನಗೆ."
    tr: "Sari. Nānu illi dēvara munde kūtidīni, Vimalā jotegidāḷe. Nanna chinte māḍbēḍa. Magu atta takṣaṇa nanage phōn māḍu, modalu nanage."
    en: "All right. I'm sitting here in front of the gods, and Vimala is with me. Don't worry about me. The moment the baby cries, call me — me first."
  - who: vimala
    t: "ರಮೇಶ್, ಅಜ್ಜಿ ಬಿಪಿ ನೋಡಿದೀನಿ, ನೂರ ಮೂವತ್ತು ಬೈ ಎಂಬತ್ತು. ಮಾತ್ರೆನೂ ತಗೊಂಡಿದಾರೆ. ಇಲ್ಲಿ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ, ನೀವು ಅಲ್ಲಿ ನೋಡ್ಕೊಳ್ಳಿ."
    tr: "Ramēsh, ajji bipi nōḍidīni, nūra mūvattu bai embattu. Mātrenū tagoṇḍidāre. Illi nānu nōḍkoḷtīni, nīvu alli nōḍkoḷḷi."
    en: "(on the phone) Ramesh, I've checked Ajji's BP — one-thirty over eighty. She's taken her tablets too. I'll look after things here; you look after things there."
  - who: kiran
    t: "ಪ್ರದೀಪ್ ಭಾವ, ಸ್ವಲ್ಪ ಕೂತ್ಕೊಳ್ಳಿ. ಅರ್ಧ ಗಂಟೆಯಿಂದ ಆ ಬಾಗಿಲ ಮುಂದೆ ಅತ್ತ ಇತ್ತ ಓಡಾಡ್ತಿದೀರಿ."
    tr: "Pradīp bhāva, svalpa kūtkoḷḷi. Ardha gaṇṭeyinda ā bāgila munde atta itta ōḍāḍtidīri."
    en: "Pradeep, sit down for a bit. You've been pacing back and forth in front of that door for half an hour."
  - who: pradeep
    t: "ಕೂತ್ರೆ ಇನ್ನೂ ಜಾಸ್ತಿ ಟೆನ್ಶನ್ ಆಗುತ್ತೆ ಕಿರಣ್. ಒಳಗೆ ಏನಾಗ್ತಿದೆ ಅಂತ ಗೊತ್ತಿಲ್ಲದೆ ಕಾಯೋದು… ಇದಕ್ಕಿಂತ ಕಷ್ಟದ ಕೆಲಸ ನಾನು ಜೀವನದಲ್ಲಿ ಮಾಡಿಲ್ಲ."
    tr: "Kūtre innū jāsti ṭenśan āgutte Kiraṇ. Oḷage ēnāgtide anta gottillade kāyōdu… idakkinta kaṣṭada kelasa nānu jīvanadalli māḍilla."
    en: "Sitting down makes it worse, Kiran. Waiting without knowing what's happening inside… I've never done anything harder in my life."
  - who: sam
    t: "ಅಜ್ಜಿ ಐಸಿಯುನಲ್ಲಿದ್ದಾಗ್ಲೂ ನಾವು ಹೀಗೇ ಕಾಯ್ತಿದ್ವಿ, ನೆನಪಿದೆಯಾ? ಆ ರಾತ್ರಿನೂ ಚೆನ್ನಾಗಿ ಮುಗೀತು. ಇದೂ ಮುಗಿಯುತ್ತೆ."
    tr: "Ajji aisiyunalliddāglū nāvu hīgē kāytidvi, nenapideyā? Ā rātrinū chennāgi mugītu. Idū mugiyutte."
    en: "When Ajji was in the ICU we waited just like this, remember? That night ended well too. This will as well."
  - who: sumitra
    t: "ನಾನು ತಿರುಪತಿಗೆ ಹರಕೆ ಹೊತ್ತಿದೀನಿ. ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಆರಾಮಾಗಿ ಹೊರಗೆ ಬಂದ್ರೆ ನಾವೆಲ್ಲಾ ಒಟ್ಟಿಗೆ ಹೋಗಿ ಬರೋಣ."
    tr: "Nānu Tirupatige harake hottidīni. Tāyi-magu ibrū ārāmāgi horage bandre nāvellā oṭṭige hōgi barōṇa."
    en: "I've made a vow to Tirupati. If mother and child both come out safe and well, let's all go there together."
  - who: amma
    t: "ನಾನೂ ಬರ್ತೀನಿ ಸುಮಿತ್ರಾ ಅವರೇ. ಡಾಕ್ಟ್ರು ಒಪ್ಪಿದ್ರೆ ಅಜ್ಜಿನೂ ಕರ್ಕೊಂಡು ಹೋಗೋಣ."
    tr: "Nānū bartīni Sumitrā avarē. Ḍākṭru oppidre ajjinū karkoṇḍu hōgōṇa."
    en: "I'll come too, Sumitra. And if the doctor agrees, let's take Ajji with us."

  - section: "👶 A baby girl"
    learn: "birth news: ಹೆಣ್ಣು ಮಗು, ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಆರಾಮಾಗಿದಾರೆ · ಹೊಲಿಗೆ (stitches) · ಮರಿಮಗಳು, ಮಾಮ, ತಾತ — new titles"
  - scene: "Wednesday, 11 November, 11:12 a.m. The OT door opens. A nurse comes out carrying a small bundle wrapped in a green cloth."
  - who: nurse
    t: "ಶ್ವೇತಾ ಅವರ ಕಡೆಯವರು ಯಾರು? ಬನ್ನಿ. ಹೆಣ್ಣು ಮಗು! ಹನ್ನೊಂದು ಗಂಟೆ ಏಳು ನಿಮಿಷಕ್ಕೆ ಹುಟ್ಟಿದ್ದು. ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಆರಾಮಾಗಿದಾರೆ."
    tr: "Shwētā avara kaḍeyavaru yāru? Banni. Heṇṇu magu! Hannondu gaṇṭe ēḷu nimiṣakke huṭṭiddu. Tāyi-magu ibrū ārāmāgidāre."
    en: "Who's with Shwetha? Come. It's a girl! Born at seven minutes past eleven. Mother and baby are both fine."
  - who: pradeep
    t: "ಹೆಣ್ಣು ಮಗು… ನನ್ನ ಮಗಳು… ಸಿಸ್ಟರ್, ಶ್ವೇತಾ ಹೇಗಿದಾಳೆ? ನಿಜವಾಗ್ಲೂ ಆರಾಮಾಗಿದಾಳಾ?"
    tr: "Heṇṇu magu… nanna magaḷu… sisṭar, Shwētā hēgidāḷe? Nijavāglū ārāmāgidāḷā?"
    en: "A girl… my daughter… Sister, how's Shwetha? Is she really all right?"
  - who: nurse
    t: "ಹೌದು ಸಾರ್. ಅವರು ಎಚ್ಚರವಾಗಿದಾರೆ, ಮಗು ಅತ್ತಿದ್ದು ಕೇಳಿ ಅತ್ತು-ನಕ್ಕರು. ಡಾಕ್ಟ್ರು ಹೊಲಿಗೆ ಹಾಕ್ತಿದಾರೆ, ಅರ್ಧ ಗಂಟೆಯಲ್ಲಿ ರಿಕವರಿ ರೂಮಿಗೆ ಶಿಫ್ಟ್ ಮಾಡ್ತೀವಿ. ತಗೊಳ್ಳಿ, ತಲೆ ಕೆಳಗೆ ಕೈ ಇಟ್ಕೊಂಡು ಹಿಡೀರಿ."
    tr: "Haudu sār. Avaru echcharavāgidāre, magu attiddu kēḷi attu-nakkaru. Ḍākṭru holige hāktidāre, ardha gaṇṭeyalli rikavari rūmige śifṭ māḍtīvi. Tagoḷḷi, tale keḷage kai iṭkoṇḍu hiḍīri."
    en: "Yes, sir. She's awake; when she heard the baby cry she laughed and cried at once. The doctor is putting in the stitches; we'll shift her to the recovery room in half an hour. Here — take her, keep your hand under her head."
  - who: amma
    t: "ಅಯ್ಯೋ ನನ್ನ ಬಂಗಾರ… ನೋಡಿ, ಶ್ವೇತಾ ಹುಟ್ಟಿದಾಗ ಹೀಗೇ ಇದ್ಲು. ಅದೇ ಮೂಗು."
    tr: "Ayyō nanna baṅgāra… nōḍi, Shwētā huṭṭidāga hīgē idlu. Adē mūgu."
    en: "Oh, my little treasure… look, Shwetha looked just like this when she was born. The very same nose."
  - who: sumitra
    t: "ಮೂಗು ನಿಮ್ಮ ಕಡೆದು ಲಕ್ಷ್ಮಿ ಅವರೇ, ಒಪ್ತೀನಿ. ಆದ್ರೆ ಕಣ್ಣು ನೋಡಿ, ಅದು ಪ್ರದೀಪ್ ಕಣ್ಣು!"
    tr: "Mūgu nimma kaḍedu Lakshmī avarē, optīni. Ādre kaṇṇu nōḍi, adu Pradīp kaṇṇu!"
    en: "(laughing through tears) The nose is from your side, Lakshmi, I'll grant you that. But look at the eyes — those are Pradeep's eyes!"
  - who: appa
    t: "ಅಮ್ಮ! ಹೆಣ್ಣು ಮಗು, ಮನೆಗೆ ಲಕ್ಷ್ಮಿ ಬಂದ್ಲು! ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಚೆನ್ನಾಗಿದಾರೆ. ಮೊದಲು ನಿಮಗೇ ಫೋನ್ ಮಾಡಿದೀನಿ."
    tr: "Amma! Heṇṇu magu, manege Lakshmī bandlu! Tāyi-magu ibrū chennāgidāre. Modalu nimagē phōn māḍidīni."
    en: "(on the phone) Amma! It's a girl — Lakshmi herself has come into the house! Mother and baby are both well. I called you first."
  - who: ajji
    t: "ದೇವರೇ… ನಿನ್ನ ದಯೆ. ನನ್ನ ಮರಿಮಗಳು… ರಮೇಶ, ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಎಲ್ರಿಗೂ ಸಿಹಿ ಹಂಚು. ವಿಮಲಾ, ದೀಪಕ್ಕೆ ಇನ್ನೂ ಸ್ವಲ್ಪ ಎಣ್ಣೆ ಹಾಕು."
    tr: "Dēvarē… ninna daye. Nanna marimagaḷu… Ramēsha, āspatreyalli ellrigū sihi hañchu. Vimalā, dīpakke innū svalpa eṇṇe hāku."
    en: "(on the phone, her voice breaking) Oh God… by your grace. My great-granddaughter… Ramesh, hand out sweets to everyone at the hospital. Vimala, pour a little more oil in the lamp."
  - who: shankar
    t: "ನಮ್ಮ ವಂಶದಲ್ಲಿ ಎರಡು ತಲೆಮಾರಿನಿಂದ ಹೆಣ್ಣು ಮಗು ಹುಟ್ಟಿರಲಿಲ್ಲ. ಇದಕ್ಕಿಂತ ದೊಡ್ಡ ಭಾಗ್ಯ ಇಲ್ಲ."
    tr: "Namma vaṁśadalli eraḍu talemārininda heṇṇu magu huṭṭiralilla. Idakkinta doḍḍa bhāgya illa."
    en: "(quietly) No girl has been born in our family for two generations. There's no greater blessing than this."
  - who: kiran
    t: "ನಾನು ಮಾಮ ಆದೆ! ಸ್ಯಾಮ್, ಫೋಟೋ ತೆಗಿ, ಫ್ಯಾಮಿಲಿ ಗ್ರೂಪಿಗೆ ಹಾಕ್ಬೇಕು."
    tr: "Nānu māma āde! Sām, phōṭō tegi, phyāmili grūpige hākbēku."
    en: "I'm an uncle! Sam, take a photo, it has to go on the family group."
  - who: sam
    t: "ತೆಗೀತೀನಿ, ಆದ್ರೆ ಫ್ಲ್ಯಾಶ್ ಇಲ್ಲದೆ. ಮೊದಲು ಅಜ್ಜಿಗೆ ವಿಡಿಯೋ ಕಾಲ್ ಮಾಡೋಣ, ಗ್ರೂಪ್ ಆಮೇಲೆ."
    tr: "Tegītīni, ādre phlyāś illade. Modalu ajjige viḍiyō kāl māḍōṇa, grūp āmēle."
    en: "I'll take one, but without the flash. First let's video-call Ajji; the group can wait."

  - section: "🍼 Dr. Farhan: the first hours"
    learn: "ತೂಕ (weight) · APGAR explained · ಗಿಣ್ಣಿನ ಹಾಲು (colostrum), ಎದೆಹಾಲು, ಹಾಲು ಕುಡಿಸು · ಲಸಿಕೆ: BCG, OPV-0, Hep B · prohibitions: ಜೇನುತುಪ್ಪ ಕೊಡಬೇಡಿ"
  - scene: "Two hours later, the postnatal room. Shwetha lies propped up, pale but smiling, the baby skin-to-skin on her chest. The paediatrician, Dr. Farhan, examines the baby while Pradeep and Amma listen."
  - who: paed
    t: "ನಮಸ್ಕಾರ, ನಾನು ಡಾಕ್ಟರ್ ಫರ್ಹಾನ್, ಮಕ್ಕಳ ಡಾಕ್ಟ್ರು. ಮೊದಲು ಒಳ್ಳೆ ಸುದ್ದಿ: ಮಗು ಎರಡು ಪಾಯಿಂಟ್ ಒಂಬತ್ತು ಕೆಜಿ, ಉದ್ದ ನಲವತ್ತೊಂಬತ್ತು ಸೆಂಟಿಮೀಟರ್. ನಲವತ್ತು ವಾರಕ್ಕೆ ಇದು ಒಳ್ಳೆ ತೂಕ."
    tr: "Namaskāra, nānu ḍākṭar Pharhān, makkaḷa ḍākṭru. Modalu oḷḷe suddi: magu eraḍu pāyiṇṭ ombattu keji, udda nalavattombattu seṇṭimīṭar. Nalavattu vārakke idu oḷḷe tūka."
    en: "Hello, I'm Dr. Farhan, the paediatrician. Good news first: the baby weighs 2.9 kilos and is forty-nine centimetres long. That's a good weight at forty weeks."
  - who: shwe
    t: "ಹುಟ್ಟಿದ ತಕ್ಷಣ ಅವಳು ಅತ್ತಳಾ ಡಾಕ್ಟರ್? ನೀರು ಹಸಿರಾಗಿತ್ತು ಅಂತ ಹೇಳಿದ್ರು, ಅದಕ್ಕೆ ಭಯ."
    tr: "Huṭṭida takṣaṇa avaḷu attaḷā ḍākṭar? Nīru hasirāgittu anta hēḷidru, adakke bhaya."
    en: "Did she cry straight away when she was born, Doctor? They said the fluid was green, so I'm scared."
  - who: paed
    t: "ಹೌದು, ಹೊರಗೆ ಬಂದ ತಕ್ಷಣ ಜೋರಾಗಿ ಅತ್ತಳು. ಮೆಕೋನಿಯಂ ಇದ್ದಿದ್ರಿಂದ ನಾವು ರೆಡಿಯಾಗಿದ್ವಿ, ಆದ್ರೆ ಅವಳಿಗೆ ಉಸಿರಾಟಕ್ಕೆ ಯಾವ ಸಹಾಯನೂ ಬೇಕಾಗಲಿಲ್ಲ. ಆಪ್ಗಾರ್ ಸ್ಕೋರ್ ಒಂದು ನಿಮಿಷಕ್ಕೆ ಎಂಟು, ಐದು ನಿಮಿಷಕ್ಕೆ ಒಂಬತ್ತು."
    tr: "Haudu, horage banda takṣaṇa jōrāgi attaḷu. Mekōniyam iddidrinda nāvu reḍiyāgidvi, ādre avaḷige usirāṭakke yāva sahāyanū bēkāgalilla. Āpgār skōr ondu nimiṣakke eṇṭu, aidu nimiṣakke ombattu."
    en: "Yes, she cried loudly the moment she was out. Because of the meconium we were prepared, but she didn't need any help with breathing. Her APGAR score was eight at one minute and nine at five minutes."
  - who: pradeep
    t: "ಆಪ್ಗಾರ್ ಅಂದ್ರೆ ಏನು? ಹತ್ತಕ್ಕೆ ಒಂಬತ್ತಾ?"
    tr: "Āpgār andre ēnu? Hattakke ombattā?"
    en: "What's APGAR? Nine out of ten?"
  - who: paed
    t: "ಹೌದು. ಹುಟ್ಟಿದ ತಕ್ಷಣ ಐದು ವಿಷಯ ನೋಡ್ತೀವಿ: ಹಾರ್ಟ್‌ರೇಟ್, ಉಸಿರಾಟ, ಮೈ ಬಣ್ಣ, ಕೈ ಕಾಲು ಎಷ್ಟು ಗಟ್ಟಿಯಾಗಿ ಆಡಿಸ್ತಾಳೆ, ಮುಟ್ಟಿದ್ರೆ ಹೇಗೆ ಸ್ಪಂದಿಸ್ತಾಳೆ. ಒಂದೊಂದಕ್ಕೂ ಎರಡು ಮಾರ್ಕ್ಸ್. ಹತ್ತು ಸಿಗೋದು ಅಪರೂಪ, ಮೊದಲು ಕೈ ಕಾಲು ಸ್ವಲ್ಪ ನೀಲಿ ಇರುತ್ತೆ. ಎಂಟು-ಒಂಬತ್ತು ಅಂದ್ರೆ ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ."
    tr: "Haudu. Huṭṭida takṣaṇa aidu viṣaya nōḍtīvi: hārṭrēṭ, usirāṭa, mai baṇṇa, kai kālu eṣṭu gaṭṭiyāgi āḍistāḷe, muṭṭidre hēge spandistāḷe. Ondondakkū eraḍu mārks. Hattu sigōdu aparūpa, modalu kai kālu svalpa nīli irutte. Eṇṭu-ombattu andre tumbā chennāgide."
    en: "Yes. Right after birth we check five things: heart rate, breathing, skin colour, how strongly she moves her arms and legs, and how she responds to touch. Two marks for each. A ten is rare — the hands and feet are usually a little blue at first. Eight or nine is very good."
  - who: paed
    t: "ಇನ್ನೊಂದು ವಿಷಯ: ತಾಯಿಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಇದ್ದಿದ್ರಿಂದ ಮೊದಲ ಇಪ್ಪತ್ನಾಲ್ಕು ಗಂಟೆ ಮಗುವಿನ ಶುಗರ್ ಕೆಲವು ಸಲ ಚೆಕ್ ಮಾಡ್ತೀವಿ. ಹಿಮ್ಮಡಿಗೆ ಸಣ್ಣ ಸೂಜಿ ಚುಚ್ಚಿ ಒಂದು ಹನಿ ರಕ್ತ ತಗೋತೀವಿ. ಮೊದಲ ಟೆಸ್ಟ್ ನಾರ್ಮಲ್ ಬಂದಿದೆ."
    tr: "Innondu viṣaya: tāyige śugar bārḍarlain iddidrinda modala ippatnālku gaṇṭe maguvina śugar kelavu sala chek māḍtīvi. Himmaḍige saṇṇa sūji chuchchi ondu hani rakta tagōtīvi. Modala ṭesṭ nārmal bandide."
    en: "One more thing: because the mother's sugar was borderline, we'll check the baby's sugar a few times in the first twenty-four hours. We prick her heel with a tiny needle and take one drop of blood. The first test came back normal."
  - who: amma
    t: "ಡಾಕ್ಟ್ರೇ, ನಮ್ಮ ಕಡೆ ಹುಟ್ಟಿದ ತಕ್ಷಣ ಸ್ವಲ್ಪ ಜೇನುತುಪ್ಪ ನೆಕ್ಕಿಸ್ತಾರೆ… ಅದು ಕೊಡಬಹುದಾ?"
    tr: "Ḍākṭrē, namma kaḍe huṭṭida takṣaṇa svalpa jēnutuppa nekkistāre… adu koḍabahudā?"
    en: "Doctor, in our family we give a newborn a little lick of honey… can we give that?"
  - who: paed
    t: "ಬೇಡ ಅಮ್ಮ, ದಯವಿಟ್ಟು ಬೇಡ. ಜೇನುತುಪ್ಪ, ನೀರು, ಗ್ರೈಪ್ ವಾಟರ್, ಯಾವುದೂ ಬೇಡ. ಒಂದು ವರ್ಷದ ಒಳಗಿನ ಮಗುವಿಗೆ ಜೇನುತುಪ್ಪದಿಂದ ಅಪಾಯಕಾರಿ ಇನ್‌ಫೆಕ್ಷನ್ ಆಗಬಹುದು. ಆರು ತಿಂಗಳು ಬರೀ ಎದೆಹಾಲು ಸಾಕು, ನೀರೂ ಬೇಕಾಗಿಲ್ಲ."
    tr: "Bēḍa amma, dayaviṭṭu bēḍa. Jēnutuppa, nīru, graip vāṭar, yāvudū bēḍa. Ondu varṣada oḷagina maguvige jēnutuppadinda apāyakāri inphekṣan āgabahudu. Āru tiṅgaḷu barī edehālu sāku, nīrū bēkāgilla."
    en: "No, Amma — please, no. No honey, no water, no gripe water, nothing. In a baby under one, honey can cause a dangerous infection. For six months, breast milk alone is enough — she doesn't even need water."
  - who: paed
    t: "ಮೊದಲು ಬರೋದು ಗಿಣ್ಣಿನ ಹಾಲು: ಹಳದಿ, ದಪ್ಪ, ಸ್ವಲ್ಪನೇ ಬರುತ್ತೆ. ಅದು ಮಗುವಿನ ಮೊದಲ ಲಸಿಕೆ ಇದ್ದ ಹಾಗೆ, ಒಂದು ಹನಿನೂ ವೇಸ್ಟ್ ಮಾಡ್ಬೇಡಿ. ಆಪರೇಷನ್ ಆಗಿದೆ ಅಂತ ಕಾಯೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ, ಈಗ್ಲೇ ಹಾಲು ಕುಡಿಸಿ. ಹೇಗೆ ಹಿಡ್ಕೋಬೇಕು ಅಂತ ಸಿಸ್ಟರ್ ತೋರಿಸ್ತಾರೆ."
    tr: "Modalu barōdu giṇṇina hālu: haḷadi, dappa, svalpanē barutte. Adu maguvina modala lasike idda hāge, ondu haninū vēsṭ māḍbēḍi. Āparēṣan āgide anta kāyō avaśyakate illa, īglē hālu kuḍisi. Hēge hiḍkōbēku anta sisṭar tōristāre."
    en: "The first milk is colostrum — yellow, thick, and only a little of it. It's like the baby's first vaccine; don't waste a single drop. There's no need to wait because of the operation — feed her now. The sister will show you how to hold her."
  - who: shwe
    t: "ಹಾಲು ಸಾಕಾಗುತ್ತಾ ಅಂತ ಭಯ ಆಗ್ತಿದೆ ಡಾಕ್ಟರ್. ಏನೂ ಬರ್ತಿಲ್ಲ ಅನ್ಸುತ್ತೆ."
    tr: "Hālu sākāguttā anta bhaya āgtide ḍākṭar. Ēnū bartilla ansutte."
    en: "I'm scared there won't be enough milk, Doctor. It feels like nothing's coming."
  - who: paed
    t: "ಮೊದಲ ಎರಡು-ಮೂರು ದಿನ ಸ್ವಲ್ಪನೇ ಬರೋದು ಸಹಜ. ಈಗ ಮಗುವಿನ ಹೊಟ್ಟೆ ಒಂದು ಗೋಲಿ ಅಷ್ಟು ಚಿಕ್ಕದು. ಎಷ್ಟು ಸಲ ಕುಡಿಸ್ತೀರೋ ಅಷ್ಟು ಹಾಲು ಜಾಸ್ತಿ ಆಗುತ್ತೆ. ಹಾಲು ಬರೋದು ಹೊಟ್ಟೆಯಿಂದ ಅಲ್ಲ, ಮನಸ್ಸಿನಿಂದ ಅಂತಾರೆ, ಅದಕ್ಕೇ ಟೆನ್ಶನ್ ತಗೋಬೇಡಿ."
    tr: "Modala eraḍu-mūru dina svalpanē barōdu sahaja. Īga maguvina hoṭṭe ondu gōli aṣṭu chikkadu. Eṣṭu sala kuḍistīrō aṣṭu hālu jāsti āgutte. Hālu barōdu hoṭṭeyinda alla, manassininda antāre, adakkē ṭenśan tagōbēḍi."
    en: "For the first two or three days, only a little comes — that's normal. Right now the baby's stomach is as small as a marble. The more often you feed her, the more milk you'll make. They say milk comes from the mind, not the body — so don't stress."
  - who: paed
    t: "ಈಗ ಲಸಿಕೆ. ಹುಟ್ಟಿದಾಗ ಮೂರು ಕೊಡ್ತೀವಿ: ಬಿಸಿಜಿ, ಟಿಬಿಗೆ, ಎಡ ತೋಳಿನ ಮೇಲೆ; ಓಪಿವಿ ಝೀರೋ, ಬಾಯಿಗೆ ಎರಡು ಹನಿ ಪೋಲಿಯೊ; ಮತ್ತೆ ಹೆಪಟೈಟಿಸ್ ಬಿ ಮೊದಲ ಡೋಸ್, ತೊಡೆಗೆ ಇಂಜೆಕ್ಷನ್. ಹೆಪಟೈಟಿಸ್ ಬಿ ಇಪ್ಪತ್ನಾಲ್ಕು ಗಂಟೆ ಒಳಗೆ ಕೊಡ್ಬೇಕು, ಅದಕ್ಕೇ ಇವತ್ತೇ ಕೊಡ್ತೀವಿ."
    tr: "Īga lasike. Huṭṭidāga mūru koḍtīvi: bisiji, ṭibige, eḍa tōḷina mēle; ōpivi zīrō, bāyige eraḍu hani pōliyo; matte hepaṭaiṭis bi modala ḍōs, toḍege iñjekṣan. Hepaṭaiṭis bi ippatnālku gaṇṭe oḷage koḍbēku, adakkē ivattē koḍtīvi."
    en: "Now the vaccines. At birth we give three: BCG, against TB, on the left upper arm; OPV zero, two drops of polio vaccine in the mouth; and the first dose of hepatitis B, an injection in the thigh. Hepatitis B has to be given within twenty-four hours, so we'll do it today."
  - who: pradeep
    t: "ಬಿಸಿಜಿ ಹಾಕಿದ ಜಾಗದಲ್ಲಿ ಆಮೇಲೆ ಏನಾದ್ರೂ ಆಗುತ್ತಾ? ಏನು ನೋಡ್ಕೋಬೇಕು?"
    tr: "Bisiji hākida jāgadalli āmēle ēnādrū āguttā? Ēnu nōḍkōbēku?"
    en: "Does anything happen later where the BCG is given? What should we watch for?"
  - who: paed
    t: "ಒಳ್ಳೆ ಪ್ರಶ್ನೆ. ಕೆಲವು ವಾರ ಆದ್ಮೇಲೆ ಅಲ್ಲಿ ಸಣ್ಣ ಗುಳ್ಳೆ ಆಗಿ, ಸ್ವಲ್ಪ ಕೀವು ಬಂದು, ಆಮೇಲೆ ಒಣಗಿ ಒಂದು ಸಣ್ಣ ಕಲೆ ಉಳಿಯುತ್ತೆ. ಲಸಿಕೆ ಕೆಲಸ ಮಾಡ್ತಿದೆ ಅನ್ನೋದಕ್ಕೆ ಅದೇ ಗುರುತು. ಅದರ ಮೇಲೆ ಏನೂ ಹಚ್ಚಬೇಡಿ, ಒತ್ತಬೇಡಿ."
    tr: "Oḷḷe praśne. Kelavu vāra ādmēle alli saṇṇa guḷḷe āgi, svalpa kīvu bandu, āmēle oṇagi ondu saṇṇa kale uḷiyutte. Lasike kelasa māḍtide annōdakke adē gurutu. Adara mēle ēnū hachchabēḍi, ottabēḍi."
    en: "Good question. After a few weeks a small bump forms there, a little pus comes, then it dries and leaves a small scar. That's the sign the vaccine is working. Don't put anything on it, and don't press it."
  - who: paed
    t: "ಮುಂದಿನದು ಆರನೇ ವಾರಕ್ಕೆ: ಪೋಲಿಯೊ, ಪೆಂಟಾವೇಲೆಂಟ್, ರೋಟಾವೈರಸ್, ನ್ಯುಮೋಕಾಕಲ್, ಆಮೇಲೆ ಹತ್ತನೇ ವಾರ, ಹದಿನಾಲ್ಕನೇ ವಾರ. ಈ ಕಾರ್ಡಲ್ಲಿ ಎಲ್ಲಾ ದಿನಾಂಕ ಬರೆದಿದೀನಿ. ಸರ್ಕಾರಿ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಇವೆಲ್ಲಾ ಫ್ರೀ. ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ 'ಪೇನ್‌ಲೆಸ್' ಆಪ್ಷನ್ ಇದೆ, ಆದ್ರೆ ಒಂದು ಡೋಸಿಗೆ ಮೂರು-ನಾಲ್ಕು ಸಾವಿರ ಆಗುತ್ತೆ. ಎರಡೂ ಸೇಫ್, ನೀವೇ ನಿರ್ಧಾರ ಮಾಡಿ."
    tr: "Mundinadu āranē vārakke: pōliyo, peṇṭāvēleṇṭ, rōṭāvairas, nyumōkākal, āmēle hattanē vāra, hadinālkanē vāra. Ī kārḍalli ellā dināṅka baredidīni. Sarkāri āspatreyalli ivellā phrī. Praivēṭnalli 'pēnles' āpṣan ide, ādre ondu ḍōsige mūru-nālku sāvira āgutte. Eraḍū sēph, nīvē nirdhāra māḍi."
    en: "The next ones are at six weeks: polio, pentavalent, rotavirus, pneumococcal; then at ten weeks and fourteen weeks. I've written all the dates on this card. At government hospitals all of these are free. Privately there's a 'painless' option, but it costs three to four thousand a dose. Both are safe — you decide."
  - who: amma
    t: "ಸರ್ಕಾರಿದ್ದು ಫ್ರೀ, ಪ್ರೈವೇಟ್ ತುಂಬಾ ದುಬಾರಿ… ಮನೆ ಹತ್ರ ಸರ್ಕಾರಿ ಆರೋಗ್ಯ ಕೇಂದ್ರ ಇದೆ, ಅಲ್ಲಿ ವಿಚಾರಿಸೋಣ."
    tr: "Sarkāriddu phrī, praivēṭ tumbā dubāri… mane hatra sarkāri ārōgya kēndra ide, alli vichārisōṇa."
    en: "The government one is free, the private one very expensive… there's a government health centre near the house; let's ask there."
  - who: paed
    t: "ಹಾಗೇ ಮಾಡಿ, ತೊಂದರೆ ಇಲ್ಲ. ಒಂದೇ ಕಂಡೀಷನ್: ದಿನಾಂಕ ತಪ್ಪಿಸ್ಬೇಡಿ. ಮತ್ತೆ ಮೂರನೇ ದಿನದಿಂದ ಮಗುವಿನ ಕಣ್ಣು, ಮೈ ಹಳದಿ ಆಗ್ತಿದೆಯಾ ಅಂತ ನೋಡ್ತೀವಿ. ಸ್ವಲ್ಪ ಕಾಮಾಲೆ ತುಂಬಾ ಮಕ್ಕಳಿಗೆ ಬರುತ್ತೆ, ಗಾಬರಿ ಬೇಡ."
    tr: "Hāgē māḍi, tondare illa. Ondē kaṇḍīṣan: dināṅka tappisbēḍi. Matte mūranē dinadinda maguvina kaṇṇu, mai haḷadi āgtideyā anta nōḍtīvi. Svalpa kāmāle tumbā makkaḷige barutte, gābari bēḍa."
    en: "Do that, no problem. Just one condition: don't miss the dates. And from the third day we'll check whether the baby's eyes and skin are turning yellow. Lots of babies get a little jaundice — no need to panic."

  - section: "🧾 Discharge and the bill"
    learn: "billing words: ಫೈನಲ್ ಬಿಲ್, ಅಪ್ರೂವಲ್, ಲಿಮಿಟ್ ಮೀರಿದ್ದು, ರಸೀದಿ, ಜನನ ನೋಂದಣಿ · arithmetic in lakhs and thousands · ಕಳೆದು (minus)"
  - scene: "Saturday, 14 November, the fourth day. Discharge was promised for ten in the morning. It is now half past three. Appa and Pradeep stand at the billing desk."
  - who: desk
    t: "ಸಾರ್, ಫೈನಲ್ ಬಿಲ್ ರೆಡಿ. ಒಟ್ಟು ಒಂದು ಲಕ್ಷ ನಲವತ್ತೆರಡು ಸಾವಿರದ ಐನೂರು. ಸಿಸೇರಿಯನ್ ಪ್ಯಾಕೇಜ್, ಎಪಿಡ್ಯೂರಲ್, ನಾಲ್ಕು ದಿನದ ರೂಮ್, ಮಕ್ಕಳ ಡಾಕ್ಟ್ರ ಚಾರ್ಜ್, ಲ್ಯಾಬ್, ಮೆಡಿಸಿನ್, ಎಲ್ಲಾ ಸೇರಿದೆ."
    tr: "Sār, phainal bil reḍi. Oṭṭu ondu lakṣa nalavatteraḍu sāvirada ainūru. Sisēriyan pyākēj, epiḍyūral, nālku dinada rūm, makkaḷa ḍākṭra chārj, lyāb, meḍisin, ellā sēride."
    en: "Sir, the final bill is ready. One lakh forty-two thousand five hundred in total. That includes the C-section package, the epidural, four days' room, the paediatrician's charges, lab and medicines."
  - who: appa
    t: "ಹತ್ತು ಗಂಟೆಗೆ ಡಿಸ್ಚಾರ್ಜ್ ಅಂದಿದ್ರಿ. ಈಗ ಮೂರೂವರೆ. ಬಾಣಂತಿ, ಹಸುಗೂಸು ಮೇಲೆ ಬ್ಯಾಗ್ ಕಟ್ಕೊಂಡು ಕಾಯ್ತಾ ಕೂತಿದಾರೆ."
    tr: "Hattu gaṇṭege ḍischārj andidri. Īga mūrūvare. Bāṇanti, hasugūsu mēle byāg kaṭkoṇḍu kāytā kūtidāre."
    en: "You said discharge at ten. It's half past three. A new mother and a newborn are sitting upstairs with their bags packed, waiting."
  - who: desk
    t: "ಗೊತ್ತು ಸಾರ್, ಕ್ಷಮಿಸಿ. ಇನ್ಶೂರೆನ್ಸ್ ಕಡೆಯಿಂದ ಫೈನಲ್ ಅಪ್ರೂವಲ್ ಈಗ ತಾನೇ ಬಂತು. ಅವರಿಗೆ ಡಿಸ್ಚಾರ್ಜ್ ಸಮ್ಮರಿ, ಓಟಿ ನೋಟ್ಸ್ ಎಲ್ಲಾ ಕಳಿಸ್ಬೇಕಿತ್ತು. ರೂಲ್ಸ್ ಪ್ರಕಾರ ಮೂರು ಗಂಟೆ ಒಳಗೆ ಕೊಡ್ಬೇಕು, ಆದ್ರೆ ಶನಿವಾರ ಅಂದ್ರೆ ಎಲ್ಲಾ ನಿಧಾನ."
    tr: "Gottu sār, kṣamisi. Inśūrens kaḍeyinda phainal aprūval īga tānē bantu. Avarige ḍischārj sammari, ōṭi nōṭs ellā kaḷisbēkittu. Rūls prakāra mūru gaṇṭe oḷage koḍbēku, ādre śanivāra andre ellā nidhāna."
    en: "I know, sir, I'm sorry. The final approval from the insurance side has only just come. We had to send them the discharge summary, the OT notes, everything. By the rules they should answer within three hours, but on a Saturday everything's slow."
  - who: pradeep
    t: "ಎಷ್ಟು ಅಪ್ರೂವ್ ಆಯ್ತು?"
    tr: "Eṣṭu aprūv āytu?"
    en: "How much was approved?"
  - who: desk
    t: "ಮೆಟರ್ನಿಟಿ ಲಿಮಿಟ್ ಪೂರ್ತಿ, ಸಿಸೇರಿಯನ್‌ಗೆ ಎಪ್ಪತ್ತೈದು ಸಾವಿರ. ಮಗುವಿನ ಚಾರ್ಜ್ ಕೂಡ ಅದೇ ಲಿಮಿಟ್ ಒಳಗೆ ಬರುತ್ತೆ ಅಂತ ಟಿಪಿಎ ಹೇಳಿದೆ. ಉಳಿದ ಅರವತ್ತೇಳು ಸಾವಿರದ ಐನೂರು ನೀವು ಕಟ್ಬೇಕು. ಇಪ್ಪತ್ತು ಸಾವಿರ ಅಡ್ವಾನ್ಸ್ ಕಳೆದು, ಈಗ ನಲವತ್ತೇಳು ಸಾವಿರದ ಐನೂರು."
    tr: "Meṭarniṭi limiṭ pūrti, sisēriyange eppattaidu sāvira. Maguvina chārj kūḍa adē limiṭ oḷage barutte anta ṭipie hēḷide. Uḷida aravattēḷu sāvirada ainūru nīvu kaṭbēku. Ippattu sāvira aḍvāns kaḷedu, īga nalavattēḷu sāvirada ainūru."
    en: "The full maternity limit — seventy-five thousand for a C-section. The TPA says the baby's charges also fall within that same limit. The remaining sixty-seven thousand five hundred is yours to pay. Minus the twenty-thousand advance, that's forty-seven thousand five hundred now."
  - who: pradeep
    t: "ಅಡ್ಮಿಷನ್ ಟೈಮಲ್ಲೇ ನೀವು ಲಿಮಿಟ್ ಬಗ್ಗೆ ಹೇಳಿದ್ರಿ, ಅದು ಒಳ್ಳೇದಾಯ್ತು. ಕೊನೇ ಕ್ಷಣದಲ್ಲಿ ಶಾಕ್ ಇಲ್ಲ."
    tr: "Aḍmiṣan ṭaimallē nīvu limiṭ bagge hēḷidri, adu oḷḷēdāytu. Konē kṣaṇadalli śāk illa."
    en: "You told us about the limit right at admission, which was good. No last-minute shock."
  - who: appa
    t: "ಇಗೋ ನನ್ನ ಕಾರ್ಡ್, ನಾನು ಕಟ್ತೀನಿ."
    tr: "Igō nanna kārḍ, nānu kaṭtīni."
    en: "Here's my card. I'll pay."
  - who: pradeep
    t: "ಮಾವ! ಸೀಮಂತದ ದಿನ ನಾವು ಏನು ಮಾತಾಡ್ಕೊಂಡಿದ್ವಿ, ನೆನಪಿದೆಯಲ್ಲ? ಲಿಮಿಟ್ ಮೀರಿದ್ದು ನಾವು ಕಟ್ತೀವಿ."
    tr: "Māva! Sīmantada dina nāvu ēnu mātāḍkoṇḍidvi, nenapideyalla? Limiṭ mīriddu nāvu kaṭtīvi."
    en: "Mava! You remember what we agreed on the day of the seemantha? What goes over the limit, we pay."
  - who: appa
    t: "ನೆನಪಿದೆ, ನೆನಪಿದೆ. ಸರಿ, ಬಿಲ್ ನೀನು ಕಟ್ಟು. ಆದ್ರೆ ಮಗುವಿನ ತೊಟ್ಟಿಲು, ನಾಮಕರಣದ ಖರ್ಚು ತಾತನದ್ದು. ಅದರಲ್ಲಿ ವಾದ ಇಲ್ಲ."
    tr: "Nenapide, nenapide. Sari, bil nīnu kaṭṭu. Ādre maguvina toṭṭilu, nāmakaraṇada kharchu tātanaddu. Adaralli vāda illa."
    en: "I remember, I remember. Fine, you pay the bill. But the baby's cradle and the naming ceremony are on her grandfather. No arguing about that."
  - who: pradeep
    t: "ಡೀಲ್, ತಾತ!"
    tr: "Ḍīl, tāta!"
    en: "(laughing) Deal, Grandpa!"
  - who: desk
    t: "ಇವು ನಿಮ್ಮ ಪೇಪರ್ಸ್: ಡಿಸ್ಚಾರ್ಜ್ ಸಮ್ಮರಿ, ಫೈನಲ್ ಬಿಲ್, ಪೇಮೆಂಟ್ ರಸೀದಿ. ಎಲ್ಲದಕ್ಕೂ ಜೆರಾಕ್ಸ್ ಇಟ್ಕೊಳ್ಳಿ. ಮಗುವಿನ ಜನನ ನೋಂದಣಿ ಆಸ್ಪತ್ರೆಯಿಂದಲೇ ಆನ್‌ಲೈನ್ ಮಾಡ್ತೀವಿ. ಹೆಸರು ಇನ್ನೂ ಇಟ್ಟಿಲ್ಲ ಅಂದ್ರೆ ಆಮೇಲೆ ಸೇರಿಸ್ಬಹುದು, ಆದ್ರೆ ತುಂಬಾ ತಡ ಮಾಡ್ಬೇಡಿ."
    tr: "Ivu nimma pēpars: ḍischārj sammari, phainal bil, pēmeṇṭ rasīdi. Elladakkū jerāks iṭkoḷḷi. Maguvina janana nōndaṇi āspatreyindalē ānlain māḍtīvi. Hesaru innū iṭṭilla andre āmēle sērisbahudu, ādre tumbā taḍa māḍbēḍi."
    en: "Here are your papers: discharge summary, final bill, payment receipt. Keep photocopies of everything. We register the baby's birth online from the hospital itself. If you haven't named her yet, you can add the name later — but don't leave it too long."
  - scene: "4:30 p.m. Sam brings the car round to the entrance. Shwetha walks slowly, one hand pressed over her stitches. Amma carries the baby. A nurse walks them to the door."
  - who: nurse
    t: "ಏಳನೇ ದಿನ ಹೊಲಿಗೆ ತೋರಿಸೋಕೆ ಬನ್ನಿ. ಜ್ವರ ಬಂದ್ರೆ, ಗಾಯದಿಂದ ಕೀವು ಬಂದ್ರೆ, ತುಂಬಾ ರಕ್ತಸ್ರಾವ ಆದ್ರೆ ಕಾಯದೆ ತಕ್ಷಣ ಬನ್ನಿ. ಆರು ವಾರ ಭಾರ ಎತ್ತಬಾರದು. ಮಗುವಿಗಿಂತ ಭಾರ ಏನೂ ಎತ್ತಬೇಡಿ."
    tr: "Ēḷanē dina holige tōrisōke banni. Jvara bandre, gāyadinda kīvu bandre, tumbā raktasrāva ādre kāyade takṣaṇa banni. Āru vāra bhāra ettabāradu. Maguviginta bhāra ēnū ettabēḍi."
    en: "Come on the seventh day to have the stitches checked. If you get a fever, pus from the wound, or heavy bleeding, don't wait — come at once. No lifting heavy things for six weeks. Nothing heavier than the baby."
  - who: shwe
    t: "ಸ್ಯಾಮ್, ನಿಧಾನವಾಗಿ ಓಡಿಸು. ಈ ಸಲ ಹಂಪ್ ಬಂದ್ರೆ ನಿಜವಾಗ್ಲೂ ನಿಲ್ಲಿಸು!"
    tr: "Sām, nidhānavāgi ōḍisu. Ī sala hamp bandre nijavāglū nillisu!"
    en: "Sam, drive slowly. This time, if there's a speed bump, really do stop!"
  - who: sam
    t: "ಗಂಟೆಗೆ ಇಪ್ಪತ್ತು ಕಿಲೋಮೀಟರ್ ಅಷ್ಟೇ, ಪ್ರಾಮಿಸ್. ಇವತ್ತು ನನ್ನ ಕಾರಲ್ಲಿ ಇಡೀ ಮನೆಯ ಅತಿ ಮುಖ್ಯ ವ್ಯಕ್ತಿ ಕೂತಿದಾಳೆ."
    tr: "Gaṇṭege ippattu kilōmīṭar aṣṭē, prāmis. Ivattu nanna kāralli iḍī maneya ati mukhya vyakti kūtidāḷe."
    en: "Twenty kilometres an hour, no more, promise. Today the most important person in the whole family is sitting in my car."
  - who: amma
    t: "ಅಮ್ಮ, ಹೊರಟ್ವಿ. ಇನ್ನು ಇಪ್ಪತ್ತು ನಿಮಿಷ."
    tr: "Amma, horaṭvi. Innu ippattu nimiṣa."
    en: "(on the phone) Amma, we've left. Twenty more minutes."
  - who: ajji
    t: "ಬಾಗಿಲಲ್ಲಿ ಆರತಿ ತಟ್ಟೆ ರೆಡಿ ಇದೆ. ದೃಷ್ಟಿ ತೆಗೆದೇ ಒಳಗೆ ಕರ್ಕೊಳ್ಳೋದು. ಬೇಗ ಬನ್ನಿ… ಅಲ್ಲ, ನಿಧಾನವಾಗಿ ಬನ್ನಿ. ಇಷ್ಟು ವರ್ಷ ಕಾದಿದೀನಿ, ಇನ್ನು ಇಪ್ಪತ್ತು ನಿಮಿಷ ಕಾಯ್ತೀನಿ."
    tr: "Bāgilalli ārati taṭṭe reḍi ide. Dṛṣṭi tegedē oḷage karkoḷḷōdu. Bēga banni… alla, nidhānavāgi banni. Iṣṭu varṣa kādidīni, innu ippattu nimiṣa kāytīni."
    en: "(on the phone) The arathi plate is ready at the door. We'll ward off the evil eye before she comes in. Come quickly… no — come slowly. I've waited all these years; I can wait twenty more minutes."
