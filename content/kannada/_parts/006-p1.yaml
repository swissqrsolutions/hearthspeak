lines:
  - chapter: "Chapter 1 — The group chat wakes up"
  - section: "Six in one room, two on the phone"
    learn: "reunion talk: eṣṭu varṣa āytu, gurtē sikkalla, ēn samāchāra · mock-honorifics between friends: ḍākṭru sāhēbru, mēḍam avru · speakerphone: kēḷistā?, kaṭ āytu · four accents in one minute: ಉಂಟು (coast), ಐತಿ (north), -ರಿ (Dharwad), ಯಪ್ಪಾ (Kalaburagi)"
  - scene: "Saturday, 28 November 2026, 8:30 at night. Arjun's flat in Jayanagar 4th Block, Bengaluru. Takeaway boxes from a darshini cover the low table. Arjun, Shruti, Deepa, Ramya, Kaveri and Prakash, who is in Bengaluru for a week of teacher training, sit on the floor around a phone. Naveen in Udupi and Imran in Kalaburagi are on speaker."
  - who: arjun
    t: "ಸರಿ, ಎಲ್ರೂ ಇದೀರಾ? ನವೀನ್, ಇಮ್ರಾನ್, ಸ್ಪೀಕರ್ ಆನ್ ಇದೆ. ಕೇಳಿಸ್ತಿದ್ಯಾ ಮಗಾ?"
    tr: "Sari, ellrū idīrā? Navīn, Imrān, spīkar ān ide. Kēḷistidyā magā?"
    en: "Right, is everyone here? Naveen, Imran, you're on speaker. Can you hear us, guys?"
  - who: naveen
    t: "ಕೇಳ್ತದೆ ಮಾರಾಯ, ಜೋರಾಗೇ ಕೇಳ್ತದೆ. ಇಲ್ಲಿ ಹೋಟೆಲ್ ಕೌಂಟರ್‌ನಲ್ಲಿ ಉಂಟು ನಾನು, ಗಿರಾಕಿಗಳೆಲ್ಲ ನನ್ನನ್ನೇ ನೋಡ್ತಾ ಉಂಟು."
    tr: "Kēḷtade mārāya, jōrāgē kēḷtade. Illi hōṭel kauṇṭar-nalli uṇṭu nānu, girākigaḷella nannannē nōḍtā uṇṭu."
    en: "I can hear you, maraya, loud and clear. I'm at the hotel counter here, and all the customers are staring at me."
  - who: imran
    t: "ನಂಗೂ ಕೇಳಾಕತ್ತೈತಿ ಯಪ್ಪಾ. ಆದ್ರ ಹತ್ತು ನಿಮಿಷ ಅಷ್ಟೇ. ಕ್ಯಾಶುವಾಲ್ಟಿಯಿಂದ ಕರೆ ಬಂದ್ರ ಓಡ್ಬೇಕು, ನೈಟ್ ಡ್ಯೂಟಿ ಐತಿ."
    tr: "Naṅgū kēḷākattaiti yappā. Ādra hattu nimiṣa aṣṭē. Kyāśuvālṭiyinda kare bandra ōḍbēku, naiṭ ḍyūṭi aiti."
    en: "I can hear you too, yappa. But ten minutes, that's all. If casualty calls, I have to run. I'm on night duty."
  - who: ramya
    t: "ಡಾಕ್ಟ್ರು ಸಾಹೇಬ್ರು ನಮಗೆ ಹತ್ತು ನಿಮಿಷ ಕೊಟ್ರಲ್ಲಾ, ಅದೇ ಬ್ರೇಕಿಂಗ್ ನ್ಯೂಸ್! ನಾನು ರೆಕಾರ್ಡ್ ಮಾಡ್ತಿದೀನಿ, ಎಲ್ರೂ ಕ್ಯಾಮೆರಾ ನೋಡಿ ಕೈ ಬೀಸಿ."
    tr: "Ḍākṭru sāhēbru namage hattu nimiṣa koṭrallā, adē brēkiṅg nyūs! Nānu rekārḍ māḍtidīni, ellrū kyāmerā nōḍi kai bīsi."
    en: "The Doctor Sahib has granted us ten whole minutes — that's the breaking news! I'm recording; everyone look at the camera and wave."
  - who: kaveri
    t: "ರಮ್ಯಾ, ಊಟದ ಡಬ್ಬಗಳ ಮುಂದೆ ಕ್ಯಾಮೆರಾ ಬೇಡ, ಪ್ಲೀಸ್. ಮೊದಲು ವಿಷಯಕ್ಕೆ ಬರೋಣ. ಅರ್ಜುನ್, ಎಂಟು ವರ್ಷದಿಂದ ಸತ್ತು ಬಿದ್ದಿದ್ದ ಗ್ರೂಪ್‌ಗೆ ಒಂದು ರಾತ್ರಿ ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಮೆಸೇಜ್ ಹಾಕಿದ್ದು ಯಾಕೆ?"
    tr: "Ramyā, ūṭada ḍabbagaḷa munde kyāmerā bēḍa, plīs. Modalu viṣayakke barōṇa. Arjun, eṇṭu varṣadinda sattu biddidda grūp-ge ondu rātri iddakkiddante mesēj hākiddu yāke?"
    en: "Ramya, no camera in front of the food boxes, please. Let's get to the point first. Arjun, why did you suddenly message a group that's been dead for eight years, one random night?"
  - who: arjun
    t: "ಯಾಕೆ ಅಂದ್ರೆ… ಸುಮ್ನೆ. ಕಾಲೇಜಿಗೆ ಸೇರಿ ಹದಿನಾರು ವರ್ಷ ಆಯ್ತು. ಈಗ ಎಲ್ರಿಗೂ ಮೂವತ್ನಾಲ್ಕು. ಇನ್ನೂ ಕಾದ್ರೆ ನಾವು ಮತ್ತೆ ಸಿಗೋದು ಯಾರದೋ ಮದುವೆಯಲ್ಲಿ, ಇಲ್ಲಾಂದ್ರೆ ಯಾರದೋ ಸಾವಲ್ಲಿ. ಅದು ಬೇಡ ಅನ್ನಿಸ್ತು."
    tr: "Yāke andre… sumne. Kālējige sēri hadināru varṣa āytu. Īga ellrigū mūvatnālku. Innū kādre nāvu matte sigōdu yāradō maduveyalli, illāndre yāradō sāvalli. Adu bēḍa annistu."
    en: "Why… just like that. It's sixteen years since we joined college. Everyone's thirty-four now. If we wait any longer, the next time we meet will be at somebody's wedding, or somebody's funeral. I didn't want that."
  - who: shruti
    t: "ಓಹೋ, ಅರ್ಜುನ್ ರಾವ್ ಫಿಲಾಸಫಿ ಶುರು ಮಾಡಿದ್ರು. ಸ್ಟಾರ್ಟಪ್ ಫೌಂಡರ್ ಅವರಿಗೆ ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಹಳೆ ಗೆಳೆಯರ ನೆನಪಾಯ್ತು ನೋಡಿ."
    tr: "Ōhō, Arjun Rāv philāsaphi śuru māḍidru. Sṭārṭap phauṇḍar avarige iddakkiddante haḷe geḷeyara nenapāytu nōḍi."
    en: "Oho, Arjun Rao has started philosophising. Look at that — the startup founder suddenly remembered his old friends."
  - who: arjun
    t: "ಶ್ರುತಿ, ಪ್ಲೀಸ್. ಇವತ್ತು ಕಾಲು ಎಳೀಬೇಡ. ಒಂದ್ಸಲ ಸೀರಿಯಸ್ಸಾಗಿ ಹೇಳ್ತಿದೀನಿ."
    tr: "Śruti, plīs. Ivattu kālu eḷībēḍa. Ondsala sīriyassāgi hēḷtidīni."
    en: "Shruti, please. Don't pull my leg tonight. For once I'm saying something seriously."
  - who: prakash
    t: "ಖರೇ ಹೇಳಿದ್ರಿ ಅರ್ಜುನ್. ನಾನು ಧಾರವಾಡದಿಂದ ಟ್ರೇನಿಂಗ್‌ಗೆ ಬಂದೇನಿ ಅಂತ ಗ್ರೂಪ್‌ನಲ್ಲಿ ಹಾಕಿದಾಗ ಯಾರೂ ಉತ್ತರ ಕೊಟ್ಟಿರ್ಲಿಲ್ಲ. ನೀವು ಮೆಸೇಜ್ ಹಾಕಿದ ಕೂಡ್ಲೇ ಐವತ್ತು ರಿಪ್ಲೈ ಬಂದ್ವು."
    tr: "Kharē hēḷidri Arjun. Nānu Dhāravāḍadinda ṭrēniṅg-ge bandēni anta grūp-nalli hākidāga yārū uttara koṭṭirlilla. Nīvu mesēj hākida kūḍlē aivattu riplai bandvu."
    en: "That's true, Arjun. When I posted in the group that I'd come from Dharwad for a training, nobody replied. The moment you posted, fifty replies came in."
  - who: deepa
    t: "ಅಯ್ಯೋ ಪ್ರಕಾಶ್, ಬೇಜಾರು ಮಾಡ್ಕೋಬೇಡ ಕಣೋ. ಆ ಗ್ರೂಪ್ ಮ್ಯೂಟ್‌ನಲ್ಲಿತ್ತು ಅಷ್ಟೇ. ನಿನ್ ಮೆಸೇಜ್ ನಾನು ನೋಡಿದ್ದೆ, ಉತ್ತರ ಕೊಡೋಕೆ ಮರೆತುಹೋಯ್ತು."
    tr: "Ayyō Prakāś, bējāru māḍkōbēḍa kaṇō. Ā grūp myūṭ-nallittu aṣṭē. Nin mesēj nānu nōḍidde, uttara koḍōke maretuhōytu."
    en: "Oh, Prakash, don't feel bad. The group was on mute, that's all. I did see your message; I just forgot to reply."
  - who: prakash
    t: "ಆತು ಬಿಡ್ರಿ ದೀಪಾ. ಹಂಗೇನಿಲ್ಲ. ಬೆಂಗಳೂರಿನ ಜನ ಭಾಳ ಬ್ಯುಸಿ, ಗೊತ್ತೈತಿ."
    tr: "Ātu biḍri Dīpā. Haṅgēnilla. Beṅgaḷūrina jana bhāḷa byusi, gottaiti."
    en: "Never mind, Deepa. It's nothing. Bengaluru people are very busy, I know."
  - section: "Dates, leave, kids and money"
    learn: "planning: plyān phiks māḍōṇa, rajā sikkalla, aḍjast māḍtīni · conditionals: rajā sikkidre bartīni, maḷe bandrū hōgōṇa · sharing costs: kharcu hañcikoḷḷōṇa, peṭrōl, ṭōl, hōmsṭē · a hint of edge: ninna hatra duḍḍu jāsti uṇṭalvā?"
  - scene: "Arjun opens a map on the television. A route is drawn in red: Bengaluru, Chitradurga, Hampi, Dharwad, Gokarna, and back."
  - who: arjun
    t: "ನೋಡಿ, ಪ್ಲ್ಯಾನ್ ಇದು. ಡಿಸೆಂಬರ್ ನಾಲ್ಕು ಶುಕ್ರವಾರ ಬೆಳಗ್ಗೆ ಹೊರಡೋದು. ಚಿತ್ರದುರ್ಗ, ಹಂಪಿ, ಧಾರವಾಡ, ಗೋಕರ್ಣ. ಒಂಬತ್ತನೇ ತಾರೀಖು ರಾತ್ರಿ ವಾಪಸ್. ಆರು ದಿನ, ಸುಮಾರು ಸಾವಿರದ ಮುನ್ನೂರು ಕಿಲೋಮೀಟರ್."
    tr: "Nōḍi, plyān idu. Ḍisembar nālku śukravāra beḷagge horaḍōdu. Chitradurga, Hampi, Dhāravāḍa, Gōkarṇa. Ombattanē tārīkhu rātri vāpas. Āru dina, sumāru sāvirada munnūru kilōmīṭar."
    en: "Look, here's the plan. We leave on Friday morning, the fourth of December. Chitradurga, Hampi, Dharwad, Gokarna. Back on the night of the ninth. Six days, about thirteen hundred kilometres."
  - who: imran
    t: "ಆರು ದಿನ? ಯಪ್ಪಾ, ನಮ್ ಡಿಸ್ಟ್ರಿಕ್ಟ್ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಆರು ಗಂಟೆ ರಜೆ ಸಿಗೋದೇ ಕಷ್ಟ. ಡಿಸ್ಟ್ರಿಕ್ಟ್ ಸರ್ಜನ್ ಹತ್ರ ಅರ್ಜಿ ಹಾಕ್ಬೇಕು, ಬದಲಿ ಡಾಕ್ಟರ್ ಹುಡುಕ್ಬೇಕು. ಈ ಚಳಿಗಾಲದಾಗ ಜ್ವರದ ಕೇಸ್ ಭಾಳ ಅದಾವು."
    tr: "Āru dina? Yappā, nam ḍisṭrikṭ āspatreyalli āru gaṇṭe raje sigōdē kaṣṭa. Ḍisṭrikṭ sarjan hatra arji hākbēku, badali ḍākṭar huḍukbēku. Ī chaḷigāladāga jvarada kēs bhāḷa adāvu."
    en: "Six days? Yappa, in our district hospital even six hours off is hard to get. I'd have to apply to the District Surgeon and find a doctor to cover for me. This winter there are lots of fever cases."
  - who: kaveri
    t: "ಇಮ್ರಾನ್, ಕಳೆದ ವರ್ಷ ನೀನು ಎಷ್ಟು ದಿನ ರಜೆ ತಗೊಂಡೆ? ನಿಜ ಹೇಳು."
    tr: "Imrān, kaḷeda varṣa nīnu eṣṭu dina raje tagoṇḍe? Nija hēḷu."
    en: "Imran, how many days of leave did you take last year? Tell the truth."
  - who: imran
    t: "ನಿಜ ಹೇಳ್ಲಾ? ಎರಡು ದಿನ. ಅದೂ ನಮ್ ಅಬ್ಬಾಜಾನ್ ಆಪರೇಷನ್‌ಗೆ."
    tr: "Nija hēḷlā? Eraḍu dina. Adū nam abbājān āparēṣan-ge."
    en: "The truth? Two days. And that was for my father's operation."
  - who: kaveri
    t: "ಹಾಗಾದ್ರೆ ಇದು ರಜೆ ಅಲ್ಲ, ಚಿಕಿತ್ಸೆ. ಡಾಕ್ಟರ್‌ಗೂ ಒಬ್ಬ ಡಾಕ್ಟರ್ ಬೇಕು. ಅರ್ಜಿ ನಾಳೆನೇ ಹಾಕು. ಬೇಕಿದ್ರೆ ನಾನೇ ಡ್ರಾಫ್ಟ್ ಮಾಡಿ ಕೊಡ್ತೀನಿ."
    tr: "Hāgādre idu raje alla, chikitse. Ḍākṭar-gū obba ḍākṭar bēku. Arji nāḷenē hāku. Bēkidre nānē ḍrāphṭ māḍi koḍtīni."
    en: "Then this isn't leave, it's treatment. Even a doctor needs a doctor. Put in the application tomorrow itself. If you want, I'll draft it for you."
  - who: imran
    t: "ವಕೀಲರು ಅರ್ಜಿ ಬರೆದ್ರ ಸರ್ಜನ್ ಸಾಹೇಬ್ರು ಹೆದರಿ ರಜೆ ಕೊಡ್ತಾರ ನೋಡು! ಆತು, ಪ್ರಯತ್ನ ಮಾಡ್ತೇನಿ. ಫಿಕರ್ ಮಾಡಬ್ಯಾಡ್ರಿ."
    tr: "Vakīlaru arji baredra sarjan sāhēbru hedari raje koḍtāra nōḍu! Ātu, prayatna māḍtēni. Phikar māḍabyāḍri."
    en: "If a lawyer writes the application, the Surgeon Sahib will get scared and grant the leave, you'll see! All right, I'll try. Don't worry."
  - who: shruti
    t: "ನನ್ ಕಥೆ ಬೇರೆ. ಆದ್ಯಾಗೆ ಏಳು ವರ್ಷ, ಇಶಾನ್‌ಗೆ ನಾಲ್ಕು. ವಿಕ್ರಮ್ ಹತ್ರ ಮಾತಾಡಿದೆ. ಅವರು ಮನೆಯಿಂದ ಕೆಲಸ ಮಾಡ್ತಾರಂತೆ, ಅತ್ತೆ ಮಲ್ಲೇಶ್ವರಕ್ಕೆ ಬರ್ತಾರೆ. ಆರು ವರ್ಷದಲ್ಲಿ ಇದೇ ಮೊದಲ ಸಲ ನಾನು ಮಕ್ಕಳಿಲ್ಲದೆ ಎಲ್ಲಾದ್ರೂ ಹೋಗ್ತಿರೋದು."
    tr: "Nan kathe bēre. Ādyāge ēḷu varṣa, Iśān-ge nālku. Vikram hatra mātāḍide. Avaru maneyinda kelasa māḍtārante, atte Mallēśvarakke bartāre. Āru varṣadalli idē modala sala nānu makkaḷillade ellādrū hōgtirōdu."
    en: "My story is different. Aadya is seven, Ishaan is four. I talked to Vikram. He says he'll work from home, and my mother-in-law is coming over to Malleshwaram. In six years this is the first time I'm going anywhere without the kids."
  - who: deepa
    t: "ಸೂಪರ್ ಕಣೇ ಶ್ರುತಿ. ನೀನು ಅದಕ್ಕೆ ಅರ್ಹಳು. ನಂಗೆ ಏನೂ ಪ್ರಾಬ್ಲಮ್ ಇಲ್ಲ, ಲ್ಯಾಪ್‌ಟಾಪ್ ತಗೊಂಡ್ ಬರ್ತೀನಿ. ಎಲ್ಲಿಂದ ಬೇಕಾದ್ರೂ ಕೆಲಸ ಮಾಡ್ಬೋದು."
    tr: "Sūpar kaṇē Śruti. Nīnu adakke arhaḷu. Naṅge ēnū prābḷam illa, lyāp-ṭāp tagoṇḍ bartīni. Ellinda bēkādrū kelasa māḍbōdu."
    en: "Super, Shruti. You deserve it. No problem for me, I'll bring my laptop. I can work from anywhere."
  - who: ramya
    t: "ದೀಪಾ, ರೋಹಿತ್ ಬರಲ್ವಾ? ಕಳೆದ ಸಲ ಅವನು ನಮ್ ಜೊತೆ ಕೂರ್ಗ್‌ಗೆ ಬಂದಿದ್ದ ಅಲ್ವಾ?"
    tr: "Dīpā, Rōhit baralvā? Kaḷeda sala avanu nam jote Kūrg-ge bandidda alvā?"
    en: "Deepa, isn't Rohit coming? Last time he came with us to Coorg, didn't he?"
  - who: deepa
    t: "ಅವನಿಗೆ… ಕೆಲಸ ಇದೆ. ಈ ಸಲ ಬರೋಕಾಗಲ್ಲ. ಅದನ್ನ ಬಿಡು, ಊಟ ಮುಂದೆ ಬರ್ಲಿ."
    tr: "Avanige… kelasa ide. Ī sala barōkāgalla. Adanna biḍu, ūṭa munde barli."
    en: "He's… got work. He can't come this time. Leave that — pass the food over."
  - scene: "Shruti and Kaveri glance at each other. Nobody asks again."
  - who: naveen
    t: "ಸರಿ, ಈಗ ದುಡ್ಡಿನ ವಿಷಯ. ಹೋಮ್‌ಸ್ಟೇ, ಪೆಟ್ರೋಲ್, ಟೋಲ್, ಊಟ. ಎಂಟು ಜನ. ಎಲ್ಲಾ ಸಮಾನವಾಗಿ ಹಂಚ್ಕೊಳ್ಳುವ. ಒಬ್ಬರಿಗೆ ಹದಿನೈದು ಸಾವಿರ ಆಗಬಹುದು ಅಂತ ನನ್ನ ಲೆಕ್ಕ."
    tr: "Sari, īga duḍḍina viṣaya. Hōmsṭē, peṭrōl, ṭōl, ūṭa. Eṇṭu jana. Ellā samānavāgi hañchkoḷḷuva. Obbarige hadinaidu sāvira āgabahudu anta nanna lekka."
    en: "Right, now the money. Homestays, petrol, tolls, food. Eight people. Let's split everything equally. My estimate is it'll come to about fifteen thousand each."
  - who: arjun
    t: "ಏನ್ ಮಗಾ, ಹದಿನೈದು ಸಾವಿರಕ್ಕೆ ಲೆಕ್ಕ ಯಾಕೆ? ಹೋಮ್‌ಸ್ಟೇ ಎಲ್ಲಾ ನಾನೇ ಬುಕ್ ಮಾಡ್ತೀನಿ, ಕಂಪನಿ ಕಾರ್ಡ್‌ನಲ್ಲಿ. ನೀವು ಸುಮ್ನೆ ಬನ್ನಿ."
    tr: "Ēn magā, hadinaidu sāvirakke lekka yāke? Hōmsṭē ellā nānē buk māḍtīni, kampani kārḍ-nalli. Nīvu sumne banni."
    en: "Come on, maga, why bother with accounts over fifteen thousand? I'll book all the homestays myself, on the company card. You lot just come."
  - who: naveen
    t: "ಕಂಪನಿ ಕಾರ್ಡ್ ಉಂಟಾ? ಓಹೋ. ಬೇಡ ಮಾರಾಯ. ಎಲ್ಲರೂ ಅವರವರ ಪಾಲು ಕೊಡುವ. ಲೆಕ್ಕ ಸರಿ ಇದ್ರೆ ಸ್ನೇಹ ಸರಿ ಇರ್ತದೆ."
    tr: "Kampani kārḍ uṇṭā? Ōhō. Bēḍa mārāya. Ellarū avaravara pālu koḍuva. Lekka sari idre snēha sari irtade."
    en: "There's a company card, is there? Oho. No, maraya. Let everyone pay their own share. When the accounts are straight, the friendship stays straight."
  - who: ramya
    t: "ಅದು ಉಡುಪಿ ಹೋಟೆಲ್ ಮಾಲೀಕನ ಫಿಲಾಸಫಿ. ಕ್ಯಾಶ್ ಕೌಂಟರ್‌ನಿಂದಲೇ ಬಂದಿದೆ!"
    tr: "Adu Uḍupi hōṭel mālīkana philāsaphi. Kyāś kauṇṭar-nindalē bandide!"
    en: "That's an Udupi hotel owner's philosophy. Straight from the cash counter!"
  - who: arjun
    t: "ಸರಿ ಸರಿ, ನವೀನ್ ಹೇಳಿದ ಹಾಗೇ ಆಗ್ಲಿ. ನಾನು ಒಂದು ಸ್ಪ್ಲಿಟ್ ಆ್ಯಪ್‌ನಲ್ಲಿ ಗ್ರೂಪ್ ಮಾಡ್ತೀನಿ. ಯಾರು ಏನು ಖರ್ಚು ಮಾಡಿದ್ರೂ ಅಲ್ಲಿ ಹಾಕಿ."
    tr: "Sari sari, Navīn hēḷida hāgē āgli. Nānu ondu split āyp-nalli grūp māḍtīni. Yāru ēnu kharchu māḍidrū alli hāki."
    en: "Fine, fine, let it be as Naveen says. I'll make a group on a bill-splitting app. Whoever spends anything, put it in there."
  - who: kaveri
    t: "ನಾನು ಹೈಕೋರ್ಟ್‌ನಲ್ಲಿ ಮೂರು ಮ್ಯಾಟರ್‌ಗಳನ್ನ ಜೂನಿಯರ್‌ಗೆ ಕೊಡ್ಬೇಕು. ಆದ್ರೆ ಬರ್ತೀನಿ. ನಮ್ಮ ಐನ್ ಮನೆಯಲ್ಲಿ ಪುತ್ತರಿ ಹತ್ರ ಬರ್ತಿದೆ, ಅಮ್ಮ ಕೋಪ ಮಾಡ್ಕೊಳ್ತಾರೆ. ಅದನ್ನ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ."
    tr: "Nānu Haikōrṭ-nalli mūru myāṭar-gaḷanna jūniyar-ge koḍbēku. Ādre bartīni. Namma ain maneyalli Puttari hatra bartide, amma kōpa māḍkoḷtāre. Adanna nānu nōḍkoḷtīni."
    en: "I'll have to hand three High Court matters to my junior. But I'll come. Puttari is coming up at our ancestral house, and Amma will be cross. I'll handle that."
  - section: "Where life has taken us"
    learn: "catching up: ēn samāchāra?, kelasa hēgide?, innū alliyē idīya? · tech talk in Kanglish: lē-āph, ṭīm kaṭ, e-ai ējeṇṭs, phaṇḍiṅg, ranvē · hospital talk: ōpi-ḍi, ḍyūṭi, iṁṭarn illa · putting a brave face on: ellā sūpar, nō ṭeṇṣan"
  - who: kaveri
    t: "ಸರಿ, ಪ್ಲ್ಯಾನ್ ಆಯ್ತು. ಈಗ ನಿಜವಾದ ಸಮಾಚಾರ. ಇಮ್ರಾನ್, ಆಸ್ಪತ್ರೆ ಹೇಗಿದೆ? ಕಳೆದ ಸಲ ಫೋನ್‌ನಲ್ಲಿ ನೀನು ತುಂಬಾ ಸುಸ್ತಾಗಿದ್ದ ಹಾಗೆ ಕೇಳಿಸ್ತಿತ್ತು."
    tr: "Sari, plyān āytu. Īga nijavāda samāchāra. Imrān, āspatre hēgide? Kaḷeda sala phōn-nalli nīnu tumbā sustāgidda hāge kēḷistittu."
    en: "Right, the plan's done. Now the real news. Imran, how's the hospital? Last time on the phone you sounded very tired."
  - who: imran
    t: "ಹ್ಯಾಂಗ ಹೇಳ್ಲಿ? ದಿನಾ ಮುನ್ನೂರು ಓಪಿಡಿ ಪೇಷಂಟ್. ಡಾಕ್ಟರ್‌ಗಳು ನಾಲ್ಕು ಜನ, ಬೇಕಾಗಿದ್ದು ಹತ್ತು. ಆರಾಮ ಅದೇನಿ ಅಂತ ಹೇಳತೇನಿ, ಆದ್ರ ಅದು ಪೂರ್ತಿ ಖರೇ ಅಲ್ಲ. ಅದನ್ನ ಟ್ರಿಪ್‌ನಾಗ ಮಾತಾಡೋಣು."
    tr: "Hyāṅga hēḷli? Dinā munnūru ō-pi-ḍi pēṣaṇṭ. Ḍākṭar-gaḷu nālku jana, bēkāgiddu hattu. Ārāma adēni anta hēḷatēni, ādra adu pūrti kharē alla. Adanna ṭrip-nāga mātāḍōṇu."
    en: "How do I put it? Three hundred outpatients a day. Four doctors, when ten are needed. I say I'm fine, but that's not entirely true. Let's talk about it on the trip."
  - who: deepa
    t: "ನಮ್ ಕಂಪನಿಯಲ್ಲಿ ಉಲ್ಟಾ. ಕೆಲಸ ಕಡಿಮೆ, ಭಯ ಜಾಸ್ತಿ. ಈ ವರ್ಷ ಎರಡು ಸಲ ಲೇಆಫ್ ಆಯ್ತು. ನನ್ನ ಟೀಮ್‌ನಲ್ಲಿ ಹನ್ನೆರಡು ಜನ ಇದ್ರು, ಈಗ ಐದು. ಉಳಿದ ಕೆಲಸ ಎಐ ಏಜೆಂಟ್ಸ್ ಮಾಡ್ತಾವೆ ಅಂತ ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್ ಹೇಳುತ್ತೆ."
    tr: "Nam kampaniyalli ulṭā. Kelasa kaḍime, bhaya jāsti. Ī varṣa eraḍu sala lē-āph āytu. Nanna ṭīm-nalli hanneraḍu jana idru, īga aidu. Uḷida kelasa e-ai ējeṇṭs māḍtāve anta myānēj-meṇṭ hēḷutte."
    en: "In my company it's the opposite. Less work, more fear. There were two rounds of layoffs this year. My team had twelve people; now it's five. Management says AI agents will do the rest of the work."
  - who: ramya
    t: "ನಮ್ ಚಾನೆಲ್‌ನಲ್ಲೂ ಅದೇ ಕಥೆ. ಈಗ ಸುದ್ದಿಗಿಂತ ‘ವ್ಯೂಸ್’ ಮುಖ್ಯ. ಅದು ಬಿಡಿ. ಅರ್ಜುನ್, ನಿನ್ ಸ್ಟಾರ್ಟಪ್ ಹೇಗಿದೆ? ಜುಲೈನಲ್ಲಿ ಅರವತ್ತರಲ್ಲಿ ಮೂವತ್ತೇಳು ಜನರನ್ನ ತೆಗೆದ್ರಿ ಅಂತ ಲಿಂಕ್ಡ್‌ಇನ್‌ನಲ್ಲಿ ನೋಡಿದ್ದೆ."
    tr: "Nam chānel-nallū adē kathe. Īga suddiginta ‘vyūs’ mukhya. Adu biḍi. Arjun, nin sṭārṭap hēgide? Julainalli aravattaralli mūvattēḷu janaranna tegedri anta Liṅkḍ-in-nalli nōḍidde."
    en: "Same story in our channel. Now ‘views’ matter more than news. Never mind that. Arjun, how's your startup? I saw on LinkedIn that in July you let thirty-seven of your sixty people go."
  - who: arjun
    t: "ಹೂಂ, ಅದು ಕಷ್ಟದ ತೀರ್ಮಾನ. ಬರ್ನ್ ರೇಟ್ ಕಡಿಮೆ ಮಾಡ್ಬೇಕಿತ್ತು. ಈಗ ಎಲ್ಲಾ ಕಂಟ್ರೋಲ್‌ನಲ್ಲಿದೆ. ಹೊಸ ಫಂಡಿಂಗ್ ಮಾತುಕತೆ ನಡೀತಿದೆ. ನೋ ಟೆನ್ಷನ್."
    tr: "Hūṁ, adu kaṣṭada tīrmāna. Barn rēṭ kaḍime māḍbēkittu. Īga ellā kaṇṭrōl-nallide. Hosa phaṇḍiṅg mātukate naḍītide. Nō ṭenṣan."
    en: "Mm, that was a hard decision. We had to cut the burn rate. Everything's under control now. New funding talks are on. No tension."
  - who: naveen
    t: "‘ನೋ ಟೆನ್ಷನ್’. ಒಳ್ಳೆದು ಮಾರಾಯ. ಕೇಳಿ ಖುಷಿ ಆಯ್ತು."
    tr: "‘Nō ṭenṣan’. Oḷḷedu mārāya. Kēḷi khuṣi āytu."
    en: "‘No tension.’ Good, maraya. Glad to hear it."
  - scene: "Something in Naveen's voice makes Kaveri look up from her plate. Arjun is already talking about something else."
  - section: "Slang, then and now"
    learn: "2010 slang: sakkat, bombāṭ, chindi, kirik, sīn illa, buruḍe biḍu · 2026 words in Kannada script: vaib, krinj, ḍelulu · teasing age: aṅkal āgbiṭṭe, hoṭṭe nōḍu, hattu gaṇṭege nidde · emphatic -ē and -ū: nīnē hēḷde!, nānū bartīni"
  - who: ramya
    t: "ಒಂದು ನಿಮಿಷ. ನೆನಪಿದ್ಯಾ, ಕಾಲೇಜಲ್ಲಿ ನಾವು ಪ್ರತಿ ಮಾತಿಗೂ ‘ಸಕ್ಕತ್’, ‘ಬೊಂಬಾಟ್’, ‘ಚಿಂದಿ’ ಅಂತಿದ್ವಿ. ಕ್ಯಾಂಟೀನ್ ಸಮೋಸ ಕೂಡ ಚಿಂದಿ!"
    tr: "Ondu nimiṣa. Nenapidyā, kālējalli nāvu prati mātigū ‘sakkat’, ‘bombāṭ’, ‘chindi’ antidvi. Kyāṇṭīn samōsa kūḍa chindi!"
    en: "One minute. Remember how in college we said ‘sakkat’, ‘bombaat’, ‘chindi’ about everything? Even the canteen samosa was ‘chindi’!"
  - who: shruti
    t: "ಈಗ ನನ್ ಮಗಳು ಎಲ್ಲದಕ್ಕೂ ‘ವೈಬ್’ ಅಂತಾಳೆ. ಏಳು ವರ್ಷದ ಹುಡುಗಿ, ‘ಅಮ್ಮ, ಈ ಉಪ್ಪಿಟ್ಟು ವೈಬ್ ಇಲ್ಲ’ ಅಂತಾಳೆ. ಉಪ್ಪಿಟ್ಟಿಗೆ ವೈಬ್ ಎಲ್ಲಿಂದ ಬರ್ಬೇಕು?"
    tr: "Īga nan magaḷu elladakkū ‘vaib’ antāḷe. Ēḷu varṣada huḍugi, ‘amma, ī uppiṭṭu vaib illa’ antāḷe. Uppiṭṭige vaib ellinda barbēku?"
    en: "Now my daughter says ‘vibe’ about everything. A seven-year-old, and she says, ‘Amma, this upma has no vibe.’ Where's upma supposed to get a vibe from?"
  - who: arjun
    t: "ನನ್ ಆಫೀಸಲ್ಲಿ ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದ ಹುಡುಗ್ರು ನನ್ ಪ್ರೆಸೆಂಟೇಷನ್ ನೋಡಿ ‘ಕ್ರಿಂಜ್’ ಅಂದ್ರು. ಅವತ್ತೇ ಗೊತ್ತಾಯ್ತು, ನಾನು ಅಂಕಲ್ ಆಗ್ಬಿಟ್ಟೆ ಅಂತ."
    tr: "Nan āphīsalli ippatteraḍu varṣada huḍugru nan prezeṇṭēṣan nōḍi ‘krinj’ andru. Avattē gottāytu, nānu aṅkal āgbiṭṭe anta."
    en: "In my office, twenty-two-year-olds looked at my presentation and called it ‘cringe’. That day I knew I'd become an uncle."
  - who: naveen
    t: "ಆಫೀಸ್ ಉಂಟಲ್ವಾ ನಿನಗೆ, ಅದೇ ದೊಡ್ಡದು. ನಮ್ಮಲ್ಲಿ ಹುಡುಗರು ‘ಮಾರಾಯ’ ಬಿಟ್ಟು ‘ಬ್ರೋ’ ಅಂತಾರೆ. ನನ್ನ ಅಪ್ಪನಿಗೂ ‘ಬ್ರೋ, ಬಿಲ್ ಕೊಡಿ’ ಅಂದ ಒಬ್ಬ ಹುಡುಗ!"
    tr: "Āphīs uṇṭalvā ninage, adē doḍḍadu. Nammalli huḍugaru ‘mārāya’ biṭṭu ‘brō’ antāre. Nanna appanigū ‘brō, bil koḍi’ anda obba huḍuga!"
    en: "At least you have an office, that's something. Where I am, the boys have dropped ‘maraya’ for ‘bro’. One kid even said to my father, ‘Bro, give the bill!’"
  - who: imran
    t: "ನಮ್ ಕಡೆ ಇನ್ನೂ ‘ಏನಪಾ, ಹ್ಯಾಂಗ ಅದಿ’ ನಡೀತೈತಿ. ಕಲಬುರಗಿ ಬಿಸಿಲು ಹಂಗೇ ಐತಿ, ಭಾಷಾನೂ ಹಂಗೇ ಐತಿ. ಏನೂ ಬದಲಾಗಿಲ್ಲ."
    tr: "Nam kaḍe innū ‘ēnapā, hyāṅga adi’ naḍītaiti. Kalaburagi bisilu haṅgē aiti, bhāṣānū haṅgē aiti. Ēnū badalāgilla."
    en: "Back home we still go ‘Enapa, hyanga adi’. The Kalaburagi heat is the same as ever, and so is the language. Nothing's changed."
  - who: prakash
    t: "ಹೌದ್ರಿ, ಉತ್ತರ ಕರ್ನಾಟಕದಾಗ ಮಾತು ಹಳೇದೇ. ನನ್ ಸಾಲೀ ಹುಡುಗರು ಇನ್‌ಸ್ಟಾಗ್ರಾಮ್ ನೋಡಿ ‘ಡೆಲುಲು’ ಅಂತಾರ. ನಾ ಮೊದಲು ಅದು ಯಾವುದೋ ರೋಗ ಅಂತ ತಿಳಕೊಂಡಿದ್ದೆ."
    tr: "Haudri, uttara Karnāṭakadāga mātu haḷēdē. Nan sālī huḍugaru Insṭāgrām nōḍi ‘ḍelulu’ antāra. Nā modalu adu yāvudō rōga anta tiḷakoṇḍidde."
    en: "Yes, in North Karnataka the talk is still the old kind. The kids in my school watch Instagram and say ‘delulu’. At first I thought it was some disease."
  - who: deepa
    t: "ಅದು ‘ಡೆಲ್ಯೂಷನಲ್’ ಅಂತ, ಪ್ರಕಾಶ್. ಅಂದ್ರೆ ಕನಸಲ್ಲಿ ಬದುಕೋದು. ನಾವು ಹೇಳ್ತಿದ್ವಲ್ಲಾ, ‘ಬುರುಡೆ ಬಿಡ್ಬೇಡ’ ಅಂತ, ಸುಮಾರು ಅದೇ."
    tr: "Adu ‘ḍelyūṣanal’ anta, Prakāś. Andre kanasalli badukōdu. Nāvu hēḷtidvallā, ‘buruḍe biḍbēḍa’ anta, sumāru adē."
    en: "It's from ‘delusional’, Prakash. Living in a dream, basically. Like we used to say, ‘stop spinning yarns’ — roughly that."
  - who: kaveri
    t: "ಹದಿನಾರು ವರ್ಷ ಆದ್ರೂ ಅರ್ಜುನ್ ಬುರುಡೆ ಮಾತ್ರ ಬದಲಾಗಿಲ್ಲ. ಅದಕ್ಕೆ ಯಾವ ಹೊಸ ಪದನೂ ಬೇಕಾಗಿಲ್ಲ."
    tr: "Hadināru varṣa ādrū Arjun buruḍe mātra badalāgilla. Adakke yāva hosa padanū bēkāgilla."
    en: "Sixteen years on, the only thing that hasn't changed is Arjun's tall tales. Those don't need any new word."
  - who: arjun
    t: "ಹೂಂ ಮತ್ತೆ! ಎಲ್ರೂ ಸೇರಿ ನನ್ನನ್ನೇ ಬಕ್ರಾ ಮಾಡಿ. ಆಯ್ತು, ಇವತ್ತು ನಾನೇ ಬಕ್ರಾ."
    tr: "Hūṁ matte! Ellrū sēri nannannē bakrā māḍi. Āytu, ivattu nānē bakrā."
    en: "Yeah, right! Go on, all of you, make me the fall guy. Fine, tonight I'm the scapegoat."
  - who: ramya
    t: "ನೆನಪಿದ್ಯಾ, ಮೂರನೇ ವರ್ಷದಲ್ಲಿ ನಾವು ಎಂಟೂ ಜನ ಗೋಕರ್ಣಕ್ಕೆ ಹೋಗಿದ್ವಿ? ನವೀನ್ ರಾತ್ರಿ ಬೀಚ್‌ನಲ್ಲಿ ಮಲಗಿ, ಬೆಳಗ್ಗೆ ಅಲೆ ಬಂದು ಅವನ ಚಪ್ಪಲಿ ತಗೊಂಡು ಹೋಯ್ತು!"
    tr: "Nenapidyā, mūranē varṣadalli nāvu eṇṭū jana Gōkarṇakke hōgidvi? Navīn rātri bīch-nalli malagi, beḷagge ale bandu avana chappali tagoṇḍu hōytu!"
    en: "Remember, in third year all eight of us went to Gokarna? Naveen slept on the beach at night, and in the morning a wave came and took his slippers!"
  - who: naveen
    t: "ಒಂದು ಚಪ್ಪಲಿ ಮಾತ್ರ. ಇನ್ನೊಂದು ಇವತ್ತಿಗೂ ನನ್ನ ಹತ್ರ ಉಂಟು. ಸಮುದ್ರಕ್ಕೆ ನನ್ನ ಮೇಲೆ ಅರ್ಧ ಪ್ರೀತಿ."
    tr: "Ondu chappali mātra. Innondu ivattigū nanna hatra uṇṭu. Samudrakke nanna mēle ardha prīti."
    en: "Only one slipper. I still have the other one today. The sea only half loves me."
  - who: deepa
    t: "ಅದೇ ನಮ್ಮ ಕೊನೆಯ ಪೂರ್ತಿ ಗ್ಯಾಂಗ್ ಟ್ರಿಪ್ ಅಲ್ವಾ? ಆಮೇಲೆ… ಏನೇನೋ ಆಯ್ತು."
    tr: "Adē namma koneya pūrti gyāṅg ṭrip alvā? Āmēle… ēnēnō āytu."
    en: "That was our last full-gang trip, wasn't it? After that… all sorts of things happened."
  - scene: "A short silence. Shruti looks at her phone. Arjun looks at the ceiling."
  - who: kaveri
    t: "ಹಾಗಾದ್ರೆ ಈ ಸಲ ಗೋಕರ್ಣ ಮುಗಿಸದೇ ಇದ್ದ ಕೆಲಸ ಮುಗಿಸೋಕೆ. ನವೀನ್, ಎರಡೂ ಚಪ್ಪಲಿ ಕಟ್ಟಿಕೊಂಡು ಮಲಗು."
    tr: "Hāgādre ī sala Gōkarṇa mugisadē idda kelasa mugisōke. Navīn, eraḍū chappali kaṭṭikoṇḍu malagu."
    en: "Then this time Gokarna is for finishing unfinished business. Naveen, sleep with both slippers tied on."
  - section: "Ee sala cup namdu — and the fourth of June"
    learn: "cricket banter: chēs māḍidru, phiniśar, ī sala kap namdu · a sudden change of tone: sambhrama durantavāytu, kālttuḷita, hannondu jana · reporting what one saw: nānē alli idde, nōḍide, marelikke āgalla · the 2026 title, hedged: kēḷde, ī sala mauna"
  - who: arjun
    t: "ಏನೇ ಹೇಳಿ, ಈ ವರ್ಷ ಒಂದು ವಿಷಯಕ್ಕೆ ನಾವು ಪುಣ್ಯವಂತರು. ಆರ್‌ಸಿಬಿ ಬ್ಯಾಕ್ ಟು ಬ್ಯಾಕ್! ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೈದು, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರು. ಹದಿನೆಂಟು ವರ್ಷ ‘ಈ ಸಲ ಕಪ್ ನಮ್ದೇ’ ಅಂದ್ವಿ, ಈಗ ಎರಡು ಕಪ್ ನಮ್ದು!"
    tr: "Ēnē hēḷi, ī varṣa ondu viṣayakke nāvu puṇyavantaru. Ār-si-bi byāk ṭu byāk! Eraḍu sāvirada ippattaidu, eraḍu sāvirada ippattāru. Hadineṇṭu varṣa ‘ī sala kap namdē’ andvi, īga eraḍu kap namdu!"
    en: "Say what you like, this year we're lucky on one count. RCB, back to back! 2025, 2026. For eighteen years we said ‘this time the cup is ours’, and now two cups are ours!"
  - who: imran
    t: "ಮೇ ಮೂವತ್ತೊಂದು ರಾತ್ರಿ ಫೈನಲ್ ನೋಡಾಕ ವಾರ್ಡ್‌ನಾಗ ನರ್ಸ್‌ಗಳ ಜೊತೆ ಮೊಬೈಲ್ ಹಿಡ್ಕೊಂಡು ನಿಂತಿದ್ದೆ. ಗುಜರಾತ್ ಮೇಲೆ ಐದು ವಿಕೆಟ್‌ನಿಂದ ಗೆದ್ದಾಗ ಒಬ್ಬ ಪೇಷಂಟ್ ಭೀ ಬೆಡ್ ಮೇಲೆ ಕುಣಿದ!"
    tr: "Mē mūvattondu rātri phainal nōḍāka vārḍ-nāga nars-gaḷa jote mobail hiḍkoṇḍu nintidde. Gujarāt mēle aidu vikeṭ-ninda geddāga obba pēṣaṇṭ bhī beḍ mēle kuṇida!"
    en: "On the night of May thirty-first I stood in the ward holding my phone with the nurses to watch the final. When we beat Gujarat by five wickets, even a patient danced on his bed!"
  - who: naveen
    t: "ಕೊಹ್ಲಿ ಇಪ್ಪತ್ತೈದು ಬಾಲ್‌ನಲ್ಲಿ ಫಿಫ್ಟಿ ಹೊಡೆದಾಗ ನನ್ನ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಎಲ್ಲರಿಗೂ ಫ್ರೀ ಐಸ್‌ಕ್ರೀಮ್ ಕೊಟ್ಟೆ. ಅಪ್ಪ ಲೆಕ್ಕ ನೋಡಿ ಎರಡು ದಿನ ಮಾತಾಡ್ಲಿಲ್ಲ."
    tr: "Kohli ippattaidu bāl-nalli phiphṭi hoḍedāga nanna hōṭel-nalli ellarigū phrī ais-krīm koṭṭe. Appa lekka nōḍi eraḍu dina mātāḍlilla."
    en: "When Kohli hit a fifty off twenty-five balls, I gave free ice cream to everyone in my hotel. Appa saw the accounts and didn't speak to me for two days."
  - who: shruti
    t: "ಈ ಸಲ ಬೆಂಗಳೂರಲ್ಲಿ ದೊಡ್ಡ ಮೆರವಣಿಗೆ ಏನೂ ಮಾಡ್ಲಿಲ್ಲ ಅಲ್ವಾ? ಸ್ವಲ್ಪ ಮೌನವಾಗೇ ಆಚರಿಸಿದ್ರು ಅಂತ ಕೇಳ್ದೆ."
    tr: "Ī sala Beṅgaḷūralli doḍḍa meravaṇige ēnū māḍlilla alvā? Svalpa maunavāgē ācharisidru anta kēḷde."
    en: "This time there was no big parade in Bengaluru, was there? I heard they celebrated a bit quietly."
  - scene: "Ramya lowers her phone and stops recording."
  - who: ramya
    t: "ಹೂಂ. ಕಳೆದ ವರ್ಷದ ನಂತರ ಯಾರಿಗೆ ತಾನೇ ಧೈರ್ಯ ಇರುತ್ತೆ? ಜೂನ್ ನಾಲ್ಕು, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೈದು. ನಾನು ಆ ದಿನ ಚಿನ್ನಸ್ವಾಮಿ ಗೇಟ್ ಹತ್ರ ಲೈವ್ ಮಾಡ್ತಿದ್ದೆ."
    tr: "Hūṁ. Kaḷeda varṣada nantara yārige tānē dhairya irutte? Jūn nālku, eraḍu sāvirada ippattaidu. Nānu ā dina Chinnasvāmi gēṭ hatra laiv māḍtidde."
    en: "Mm. After last year, who would have the nerve? June the fourth, 2025. That day I was doing a live report near the Chinnaswamy gate."
  - who: deepa
    t: "ನೀನು ಅಲ್ಲಿದ್ದೆಯಾ? ನಂಗೆ ಗೊತ್ತೇ ಇರ್ಲಿಲ್ಲ, ರಮ್ಯಾ."
    tr: "Nīnu allidde-yā? Naṅge gottē irlilla, Ramyā."
    en: "You were there? I never knew, Ramya."
  - who: ramya
    t: "ಎರಡು ಲಕ್ಷಕ್ಕೂ ಜಾಸ್ತಿ ಜನ ಬಂದಿದ್ರು ಅಂತ ಹೇಳ್ತಾರೆ. ಒಂದು ಕಡೆ ಹಾಡು, ಕುಣಿತ. ಇನ್ನೊಂದು ಕಡೆ ಗೇಟ್ ಹತ್ರ ಕಾಲ್ತುಳಿತ. ಹನ್ನೊಂದು ಜನ ಸತ್ತರು. ಒಬ್ಬ ಹುಡುಗಿಯ ಅಪ್ಪ ನನ್ ಮೈಕ್ ಮುಂದೆ ಅತ್ತರು. ಆ ಮುಖ ಇವತ್ತಿಗೂ ಮರೆಯೋಕಾಗಿಲ್ಲ."
    tr: "Eraḍu lakṣakkū jāsti jana bandidru anta hēḷtāre. Ondu kaḍe hāḍu, kuṇita. Innondu kaḍe gēṭ hatra kālttuḷita. Hannondu jana sattaru. Obba huḍugiya appa nan maik munde attaru. Ā mukha ivattigū mareyōkāgilla."
    en: "They say more than two lakh people came. On one side, songs and dancing. On the other, a stampede at the gates. Eleven people died. One girl's father wept in front of my microphone. I still can't forget that face."
  - who: kaveri
    t: "ಆಮೇಲೆ ನ್ಯಾಯಮೂರ್ತಿ ಡಿ’ಕುನ್ಹಾ ಆಯೋಗ ವರದಿ ಕೊಟ್ಟಿತು. ಪೊಲೀಸ್ ವ್ಯವಸ್ಥೆ ವಿಫಲ ಆಯ್ತು, ಆಯೋಜಕರ ಘೋಷಣೆಗಳು ಬೇಜವಾಬ್ದಾರಿ ಆಗಿದ್ವು, ಸ್ಟೇಡಿಯಂ ದೊಡ್ಡ ಜನಸಂದಣಿಗೆ ಸುರಕ್ಷಿತ ಅಲ್ಲ ಅಂತ. ವರದಿ ಸ್ಪಷ್ಟವಾಗಿತ್ತು. ಆದ್ರೆ ಹೋದ ಜೀವ ವಾಪಸ್ ಬರಲ್ಲ."
    tr: "Āmēle nyāyamūrti Ḍi’kunhā āyōga varadi koṭṭitu. Polīs vyavasthe viphala āytu, āyōjakara ghōṣaṇegaḷu bējavābdāri āgidvu, sṭēḍiyaṁ doḍḍa janasandaṇige surakṣita alla anta. Varadi spaṣṭavāgittu. Ādre hōda jīva vāpas baralla."
    en: "Later the Justice D'Cunha commission submitted its report. The police arrangements failed, the organisers' announcements were reckless, and the stadium is not safe for huge crowds. The report was clear. But the lives that were lost don't come back."
  - who: arjun
    t: "ಅದಕ್ಕೇ ಈ ಸಲ ಕಪ್ ಗೆದ್ದಾಗ ಖುಷಿ ಆಯ್ತು, ಆದ್ರೆ ಪೂರ್ತಿ ಖುಷಿ ಆಗ್ಲಿಲ್ಲ. ಒಳಗೆ ಎಲ್ಲೋ ಒಂದು ಮುಳ್ಳು ಚುಚ್ಚುತ್ತಿತ್ತು."
    tr: "Adakkē ī sala kap geddāga khuṣi āytu, ādre pūrti khuṣi āglilla. Oḷage ellō ondu muḷḷu chuchchuttittu."
    en: "That's why, when we won the cup this time, I was happy, but not completely happy. Somewhere inside, a thorn was pricking."
  - who: prakash
    t: "ಹೌದು. ಸಂಭ್ರಮ ಮಾಡೋದು ತಪ್ಪಲ್ಲ, ಆದ್ರ ಜನರ ಜೀವಕ್ಕಿಂತ ಕಪ್ ದೊಡ್ಡದಲ್ಲ. ನನ್ ಸಾಲ್ಯಾಗ ಮಕ್ಕಳಿಗೆ ಅದನ್ನೇ ಹೇಳಿದೆ."
    tr: "Haudu. Sambhrama māḍōdu tappalla, ādra janara jīvakkinta kap doḍḍadalla. Nan sālyāga makkaḷige adannē hēḷide."
    en: "Yes. Celebrating isn't wrong, but no cup is bigger than people's lives. That's exactly what I told the children in my school."
  - who: imran
    t: "ಆ ರಾತ್ರಿ ನನ್ನ ಬ್ಯಾಚ್‌ಮೇಟ್ ಬೌರಿಂಗ್ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಡ್ಯೂಟಿ ಮೇಲಿದ್ದ. ಬೆಳಗಿನವರೆಗೆ ಒಂದು ಮಾತೂ ಆಡ್ಲಿಲ್ಲ ಅಂತ ಹೇಳಿದ. ಸರಿ, ಸಾಕು, ಜರಾ ಮನಸ್ಸು ಹಗುರ ಮಾಡೋಣ. ಕಾರ್ ವಿಷಯ ಹೇಳ್ರಿ."
    tr: "Ā rātri nanna byāch-mēṭ Bauriṅg āspatreyalli ḍyūṭi mēlidda. Beḷaginavarege ondu mātū āḍlilla anta hēḷida. Sari, sāku, jarā manassu hagura māḍōṇa. Kār viṣaya hēḷri."
    en: "That night a batchmate of mine was on duty at Bowring Hospital. He told me he didn't say a word until morning. All right, enough; let's lighten our hearts a little. Tell me about the cars."
  - section: "Two cars, one invitation"
    learn: "who sits where: munde kūrtīni, hindgaḍe aḍjast māḍkoḷi, ḍraivar badalāyisōṇa · Dharwad hospitality: nam manige barri, avva kāytāḷa, pēḍa illade kaḷisōdilla · a promise: mātu koṭṭīni"
  - who: arjun
    t: "ಎರಡು ಕಾರ್. ನನ್ ಕಾರಲ್ಲಿ ನಾನು, ಶ್ರುತಿ, ಪ್ರಕಾಶ್, ಇಮ್ರಾನ್. ನವೀನ್ ಮೂರನೇ ತಾರೀಖು ರಾತ್ರಿ ಉಡುಪಿಯಿಂದ ಕಾರ್ ತಗೊಂಡ್ ಬರ್ತಾನೆ. ಅವನ ಕಾರಲ್ಲಿ ದೀಪಾ, ಕಾವೇರಿ, ರಮ್ಯಾ."
    tr: "Eraḍu kār. Nan kāralli nānu, Śruti, Prakāś, Imrān. Navīn mūranē tārīkhu rātri Uḍupiyinda kār tagoṇḍ bartāne. Avana kāralli Dīpā, Kāvēri, Ramyā."
    en: "Two cars. In my car: me, Shruti, Prakash, Imran. Naveen drives up from Udupi on the night of the third. In his car: Deepa, Kaveri, Ramya."
  - who: shruti
    t: "ನಾನು ನಿನ್ ಕಾರಲ್ಲಿ ಯಾಕೆ? ಈ ಲಿಸ್ಟ್ ಯಾರು ಮಾಡಿದ್ದು?"
    tr: "Nānu nin kāralli yāke? Ī lisṭ yāru māḍiddu?"
    en: "Why am I in your car? Who made this list?"
  - who: arjun
    t: "ಮಲ್ಲೇಶ್ವರ ನನ್ ದಾರಿಯಲ್ಲೇ ಬರುತ್ತೆ, ಅಷ್ಟೇ. ಬೇರೆ ಏನೂ ಅರ್ಥ ಇಲ್ಲ. ಬೇಕಿದ್ರೆ ಬದಲಾಯಿಸೋಣ."
    tr: "Mallēśvara nan dāriyallē barutte, aṣṭē. Bēre ēnū artha illa. Bēkidre badalāyisōṇa."
    en: "Malleshwaram is on my way, that's all. There's no other meaning to it. We can change it if you want."
  - who: shruti
    t: "ಬೇಡ, ಇರ್ಲಿ. ಮೊದಲನೇ ದಿನದಿಂದಲೇ ಕಿರಿಕ್ ಬೇಡ."
    tr: "Bēḍa, irli. Modalanē dinadindalē kirik bēḍa."
    en: "No, leave it. Let's not have trouble from day one."
  - scene: "Ramya catches the look between them and quietly raises her phone again. Kaveri pushes it down."
  - who: naveen
    t: "ನನ್ನ ಕಾರಲ್ಲಿ ಮೂರು ಮಹಿಳೆಯರು, ಒಬ್ಬ ವಕೀಲೆ, ಒಬ್ಬ ಪತ್ರಕರ್ತೆ. ದೇವರೇ, ನನ್ನ ಡ್ರೈವಿಂಗ್ ಬಗ್ಗೆ ವರದಿ ಬರ್ತದೆ, ಕೇಸೂ ಬೀಳ್ತದೆ!"
    tr: "Nanna kāralli mūru mahiḷeyaru, obba vakīle, obba patrakarte. Dēvarē, nanna ḍraiviṅg bagge varadi bartade, kēsū bīḷtade!"
    en: "In my car, three women — one a lawyer, one a journalist. God help me, there'll be a news report on my driving, and a court case too!"
  - who: kaveri
    t: "ನೀನು ನೂರಿಪ್ಪತ್ತು ದಾಟದಿದ್ರೆ ಯಾವ ಕೇಸೂ ಇಲ್ಲ, ನವೀನ್. ಹೈವೇಯಲ್ಲಿ ಸ್ಪೀಡ್ ಕ್ಯಾಮೆರಾಗಳಿವೆ, ಗೊತ್ತಲ್ವಾ."
    tr: "Nīnu nūrippattu dāṭadidre yāva kēsū illa, Navīn. Haivēyalli spīḍ kyāmerāgaḷive, gottalvā."
    en: "If you don't cross a hundred and twenty, there's no case, Naveen. There are speed cameras on the highway, you know."
  - who: prakash
    t: "ಒಂದು ಮಾತು ಹೇಳ್ಲೇನ್ರಿ? ಆರನೇ ತಾರೀಖು ನಾವು ಧಾರವಾಡದ ದಾರಿಯಾಗ ಇರ್ತೇವಿ. ಆ ರಾತ್ರಿ ಹೋಟ್ಲಾ ಬ್ಯಾಡ. ಎಲ್ಲಾರೂ ಸಪ್ತಾಪುರದಾಗ ನಮ್ ಮನಿಗೆ ಬರ್ರಿ."
    tr: "Ondu mātu hēḷlēnri? Āranē tārīkhu nāvu Dhāravāḍada dāriyāga irtēvi. Ā rātri hōṭlā byāḍa. Ellārū Saptāpuradāga nam manige barri."
    en: "May I say something? On the sixth we'll be on the Dharwad road. No hotel that night. All of you, come to our home in Saptapur."
  - who: deepa
    t: "ಎಂಟು ಜನ, ಪ್ರಕಾಶ್? ನಿಮ್ಮ ಅಮ್ಮನಿಗೆ ಕಷ್ಟ ಆಗಲ್ವಾ?"
    tr: "Eṇṭu jana, Prakāś? Nimma ammanige kaṣṭa āgalvā?"
    en: "Eight people, Prakash? Won't it be hard on your mother?"
  - who: prakash
    t: "ಕಷ್ಟ? ನಮ್ ಅವ್ವಗ ನೀವು ಬರಲಿಲ್ಲಂದ್ರ ಕಷ್ಟ ಆಗತೈತಿ. ಜೋಳದ ರೊಟ್ಟಿ, ಎಣ್ಣಿಗಾಯಿ, ಪೇಡ. ಪೇಡ ಇಲ್ಲದೆ ಅವ್ವ ಯಾರನ್ನೂ ಕಳಿಸೂದಿಲ್ಲ. ನಾ ಇವತ್ತೇ ಫೋನ್ ಮಾಡಿ ಹೇಳ್ತೇನಿ."
    tr: "Kaṣṭa? Nam avvaga nīvu baralillandra kaṣṭa āgataiti. Jōḷada roṭṭi, eṇṇigāyi, pēḍa. Pēḍa illade avva yārannū kaḷisūdilla. Nā ivattē phōn māḍi hēḷtēni."
    en: "Hard? It'll be hard on my Avva if you don't come. Jowar rotti, stuffed brinjal, peda. Avva doesn't let anyone leave without peda. I'll phone her and tell her tonight."
  - who: arjun
    t: "ಡನ್! ಪ್ರಕಾಶ್ ಮನೆಯಲ್ಲಿ ಒಂದು ರಾತ್ರಿ. ಅಮ್ಮನ ಕೈಯಡುಗೆ. ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಹೋಮ್‌ಸ್ಟೇ ಎಲ್ಲಿ ಸಿಗುತ್ತೆ ಮಗಾ!"
    tr: "Ḍan! Prakāś maneyalli ondu rātri. Ammana kaiyaḍuge. Idakkinta oḷḷe hōmsṭē elli sigutte magā!"
    en: "Done! One night at Prakash's place. His mother's cooking. Where would you find a better homestay, maga!"
  - who: imran
    t: "ನಾನು ಮೂರನೇ ತಾರೀಖು ರಾತ್ರಿ ಕಲಬುರಗಿಯಿಂದ ಟ್ರೇನ್ ಹತ್ತತೇನಿ. ಯಶವಂತಪುರಕ್ಕೆ ಬೆಳಗ್ಗೆ ನಾಲ್ಕೂವರೆಗೆ ಬರ್ತೇನಿ. ರಜೆ ಸಿಕ್ಕರ. ಸಿಗದಿದ್ರೂ ಬರ್ತೇನಿ ಅಂತ ಅನ್ಸತೈತಿ."
    tr: "Nānu mūranē tārīkhu rātri Kalaburagiyinda ṭrēn hattatēni. Yaśavantapurakke beḷagge nālkūvarege bartēni. Raje sikkara. Sigadidrū bartēni anta ansataiti."
    en: "I'll catch the train from Kalaburagi on the night of the third. I'll reach Yeshwanthpur at half past four in the morning. If I get leave. I think I'll come even if I don't."
  - who: naveen
    t: "ಸರಿ, ನಾನು ಹೋಗ್ಬೇಕು, ಊಟದ ಗಿರಾಕಿ ಬಂದ್ರು. ಅರ್ಜುನ್… ಬರುವಾಗ ಸಿಗುವ. ಒಂದೆರಡು ವಿಷಯ ಮಾತಾಡ್ಲಿಕ್ಕೆ ಉಂಟು."
    tr: "Sari, nānu hōgbēku, ūṭada girāki bandru. Arjun… baruvāga siguva. Onderaḍu viṣaya mātāḍlikke uṇṭu."
    en: "Right, I have to go — the dinner customers are here. Arjun… we'll meet when I come. There are one or two things to talk about."
  - who: arjun
    t: "ಹಾಂ… ಹೌದು, ಖಂಡಿತ. ಸಿಗೋಣ. ಡ್ರೈವ್ ಸೇಫ್ ಮಗಾ."
    tr: "Hāṁ… haudu, khaṇḍita. Sigōṇa. Ḍraiv sēph magā."
    en: "Hm… yes, of course. We'll meet. Drive safe, maga."
  - scene: "The call cuts. Arjun puts the phone face down on the table and is quiet for a moment longer than anyone expects."
  - who: ramya
    t: "ಸರಿ, ಗ್ರೂಪ್‌ಗೆ ಹೆಸರು ಬದಲಾಯಿಸ್ತೀನಿ. ‘ಎರಡು ಸಾವಿರದ ಹತ್ತು ಗ್ಯಾಂಗ್ — ಮತ್ತೆ ರಸ್ತೆಗೆ’. ಯಾರಿಗಾದ್ರೂ ಆಕ್ಷೇಪ ಉಂಟಾ?"
    tr: "Sari, grūp-ge hesaru badalāyistīni. ‘Eraḍu sāvirada hattu gyāṅg — matte rastege’. Yārigādrū ākṣēpa uṇṭā?"
    en: "Right, I'm changing the group's name. ‘The 2010 Gang — Back on the Road’. Any objections?"
  - who: kaveri
    t: "ಆಕ್ಷೇಪ ಇಲ್ಲ, ಆದ್ರೆ ಒಂದು ಷರತ್ತು. ಯಾರನ್ನೂ ಅವರ ಅನುಮತಿ ಇಲ್ಲದೆ ವಿಡಿಯೋ ಹಾಕ್ಬಾರ್ದು. ಇದು ವಕೀಲೆಯ ಸಲಹೆ, ಉಚಿತವಾಗಿ."
    tr: "Ākṣēpa illa, ādre ondu ṣarattu. Yārannū avara anumati illade viḍiyō hākbārdu. Idu vakīleya salahe, uchitavāgi."
    en: "No objection, but one condition. Nobody's video goes up without their permission. That's legal advice, free of charge."
  - who: deepa
    t: "ಒಪ್ಪಿಗೆ. ಎಲ್ಲಾ ಮುಗಿದ್ಮೇಲೆ ನಾನೇ ನೋಡಿ ಹೇಳ್ತೀನಿ ಯಾವುದು ಹಾಕ್ಬೋದು ಅಂತ."
    tr: "Oppige. Ellā mugidmēle nānē nōḍi hēḷtīni yāvudu hākbōdu anta."
    en: "Agreed. When it's all over, I'll look myself and say which ones can go up."
  - who: shruti
    t: "ಸರಿ ಹಾಗಾದ್ರೆ. ನಾಲ್ಕನೇ ತಾರೀಖು, ಬೆಳಗ್ಗೆ ಐದು ಗಂಟೆ. ಅರ್ಜುನ್, ಈ ಸಲ ಲೇಟ್ ಮಾಡಿದ್ರೆ ನಾನು ಕಾಯಲ್ಲ. ಆ ಕಾಲ ಮುಗಿದುಹೋಯ್ತು."
    tr: "Sari hāgādre. Nālkanē tārīkhu, beḷagge aidu gaṇṭe. Arjun, ī sala lēṭ māḍidre nānu kāyalla. Ā kāla mugiduhōytu."
    en: "All right then. The fourth, five in the morning. Arjun, if you're late this time, I won't wait. Those days are over."
  - scene: "Nobody laughs. Arjun nods. Outside, a late bus to the metro groans past on the main road."
  - chapter: "Chapter 2 — Leaving at dawn"
  - section: "Five in the morning"
    learn: "early-morning calls: eddyā?, keḷage bā, aidu nimiṣa, gēṭ hatra iddīni · surprise at punctuality: nambōkē āgtilla · picking someone up at a station: plāṭphārm nambar, mukhya bāgilu · Kalaburagi speech: jaldi bā, iḷadēni, antāna"
  - scene: "Friday, 4 December 2026, 4:52 a.m. Malleshwaram, 8th Cross. The street is dark and cold, about seventeen degrees. A milk van passes. Shruti stands at her gate with a small bag and a flask. Arjun's grey SUV is already waiting, its engine running."
  - who: shruti
    t: "ನಾಲ್ಕು ಐವತ್ತೆರಡು? ಅರ್ಜುನ್ ರಾವ್ ಐದು ಗಂಟೆಗೆ ಮುಂಚೆ ಬಂದಿದ್ದಾನೆ? ನಂಬೋಕೇ ಆಗ್ತಿಲ್ಲ."
    tr: "Nālku aivatteraḍu? Arjun Rāv aidu gaṇṭege muñche bandiddāne? Nambōkē āgtilla."
    en: "Four fifty-two? Arjun Rao has come before five o'clock? I can't believe it."
  - who: arjun
    t: "ಹದಿನಾಲ್ಕು ವರ್ಷದಲ್ಲಿ ಜನ ಬದಲಾಗ್ತಾರೆ, ಶ್ರುತಿ. ನಾನು ನಾಲ್ಕೂ ಕಾಲಿಗೆ ಮನೆ ಬಿಟ್ಟೆ. ಬಾ, ಬ್ಯಾಗ್ ಹಿಂದೆ ಇಡ್ತೀನಿ."
    tr: "Hadinālku varṣadalli jana badalāgtāre, Śruti. Nānu nālkū kālige mane biṭṭe. Bā, byāg hinde iḍtīni."
    en: "People change in fourteen years, Shruti. I left home at a quarter past four. Come, I'll put your bag in the back."
  - who: shruti
    t: "ಬೇಡ, ನಾನೇ ಇಡ್ತೀನಿ. ಈ ಫ್ಲಾಸ್ಕ್‌ನಲ್ಲಿ ಫಿಲ್ಟರ್ ಕಾಫಿ ಇದೆ. ಅತ್ತೆ ಎದ್ದು ಮಾಡಿ ಕೊಟ್ರು. ‘ದಾರೀಲಿ ಎಲ್ರಿಗೂ ಕೊಡು’ ಅಂದ್ರು."
    tr: "Bēḍa, nānē iḍtīni. Ī phlāsk-nalli philṭar kāphi ide. Atte eddu māḍi koṭru. ‘Dārīli ellrigū koḍu’ andru."
    en: "No, I'll put it in myself. There's filter coffee in this flask. My mother-in-law got up and made it. She said, ‘Give everyone some on the way.’"
  - who: arjun
    t: "ನಿನ್ ಅತ್ತೆಗೆ ನನ್ ಕಡೆಯಿಂದ ಥ್ಯಾಂಕ್ಸ್ ಹೇಳು. ಮಕ್ಕಳು ಮಲಗಿದ್ದಾರಾ?"
    tr: "Nin attege nan kaḍeyinda thyāṅks hēḷu. Makkaḷu malagiddārā?"
    en: "Say thanks to your mother-in-law from me. Are the kids asleep?"
  - who: shruti
    t: "ಆದ್ಯಾ ಎದ್ದಿದ್ಲು. ‘ಅಮ್ಮ, ನೀನು ವಾಪಸ್ ಬರ್ತೀಯಾ ತಾನೇ?’ ಅಂತ ಕೇಳಿದ್ಲು. ಆರು ದಿನದ ಟ್ರಿಪ್‌ಗೆ ಹೋಗ್ತಿರೋ ಅಮ್ಮನಿಗೆ ಎಂಥಾ ಪ್ರಶ್ನೆ ನೋಡು. ಹೊರಡು, ಇಲ್ಲಾಂದ್ರೆ ನಾನು ಇಳಿದುಬಿಡ್ತೀನಿ."
    tr: "Ādyā eddidlu. ‘Amma, nīnu vāpas bartīyā tānē?’ anta kēḷidlu. Āru dinada ṭrip-ge hōgtirō ammanige enthā praśne nōḍu. Horaḍu, illāndre nānu iḷidubiḍtīni."
    en: "Aadya woke up. She asked, ‘Amma, you will come back, won't you?’ What a question to ask a mother going on a six-day trip. Drive, or I'll get out."
  - scene: "4:58 a.m. A training hostel in Basavanagudi. Prakash is already outside with a cloth bag and a steel tiffin box tied with string."
  - who: prakash
    t: "ನಮಸ್ಕಾರ್ರೀ. ನಾ ನಾಲ್ಕೂವರೆಗೇ ಎದ್ದು ಸ್ನಾನ ಮಾಡಿ ಕುಂತಿದ್ದೆ. ಈ ಡಬ್ಬಿಯಾಗ ಅವ್ವ ಕಳಿಸಿದ ಶೇಂಗಾ ಹೋಳಿಗಿ ಐತಿ. ದಾರಿಯಾಗ ತಿನ್ನೋಣು."
    tr: "Namaskārrī. Nā nālkūvaregē eddu snāna māḍi kuntidde. Ī ḍabbiyāga avva kaḷisida śēṅgā hōḷigi aiti. Dāriyāga tinnōṇu."
    en: "Namaskara. I was up at half past four, bathed and sitting ready. In this box there's peanut holige that Avva sent. We'll eat it on the way."
  - who: arjun
    t: "ಶೇಂಗಾ ಹೋಳಿಗೆ? ಪ್ರಕಾಶ್, ನೀನು ಗೆದ್ದೆ. ಈ ಟ್ರಿಪ್‌ನ ಮೊದಲ ಹೀರೋ ನಿಮ್ಮ ಅಮ್ಮ."
    tr: "Śēṅgā hōḷige? Prakāś, nīnu gedde. Ī ṭrip-na modala hīrō nimma amma."
    en: "Peanut holige? Prakash, you win. The first hero of this trip is your mother."
  - scene: "5:20 a.m. Yeshwanthpur railway station. The overnight train from Kalaburagi is late. Arjun's phone rings through the car speaker."
  - who: imran
    t: "ಅರ್ಜುನ್, ಎಲ್ಲಿದೀಯಪಾ? ಟ್ರೇನ್ ನಲವತ್ತು ನಿಮಿಷ ತಡ ಆತು. ನಾ ಈಗ ಪ್ಲಾಟ್‌ಫಾರ್ಮ್ ಆರರಾಗ ಇಳದೇನಿ. ಜಲ್ದಿ ಬಾ, ಇಲ್ಲಿ ಆಟೋದವರು ನನ್ನ ಸುತ್ತ ನಿಂತಾರ."
    tr: "Arjun, ellidīyapā? Ṭrēn nalavattu nimiṣa taḍa ātu. Nā īga plāṭphārm ārarāga iḷadēni. Jaldi bā, illi āṭōdavaru nanna sutta nintāra."
    en: "Arjun, where are you, man? The train was forty minutes late. I've just got off on platform six. Come quick, the auto drivers are standing all around me here."
  - who: arjun
    t: "ಹೊರಗಿನ ಪಾರ್ಕಿಂಗ್‌ನಲ್ಲಿದೀನಿ, ಮುಖ್ಯ ಬಾಗಿಲ ಎದುರು. ಬೂದು ಬಣ್ಣದ ಕಾರ್. ಆಟೋದವ್ರಿಗೆ ‘ಬೇಡ ಗುರು, ಗಾಡಿ ಬಂದಿದೆ’ ಅಂತ ಹೇಳು."
    tr: "Horagina pārkiṅg-nallidīni, mukhya bāgila eduru. Būdu baṇṇada kār. Āṭōdavrige ‘bēḍa guru, gāḍi bandide’ anta hēḷu."
    en: "I'm in the parking outside, opposite the main entrance. A grey car. Tell the auto guys, ‘No thanks, boss, my ride's here.’"
  - who: imran
    t: "ಹೇಳಿದೆ. ಒಬ್ಬ ‘ಸಾರ್, ಏರ್‌ಪೋರ್ಟ್ ಆರ್ನೂರು’ ಅಂತಾನ. ನಾ ಏರ್‌ಪೋರ್ಟ್‌ಗೆ ಹೋಗಾಕತ್ತಿಲ್ಲ ಅಂದ್ರ ‘ಹಂಗಾದ್ರ ನಾನೂರು’ ಅಂತಾನ! ಬೆಂಗಳೂರು ಬದಲಾಗೇ ಇಲ್ಲ."
    tr: "Hēḷide. Obba ‘sār, ēr-pōrṭ ārnūru’ antāna. Nā ēr-pōrṭ-ge hōgākattilla andra ‘haṅgādra nānūru’ antāna! Beṅgaḷūru badalāgē illa."
    en: "I did. One says, ‘Sir, airport, six hundred.’ I tell him I'm not going to the airport, and he says, ‘Then four hundred!’ Bengaluru hasn't changed at all."
  - scene: "5:31 a.m. Imran climbs in with a backpack, a stethoscope sticking out of the side pocket. He hugs Prakash across the seat."
  - who: imran
    t: "ಪ್ರಕಾಶಾ! ಹ್ಯಾಂಗ ಅದಿ? ಶ್ರುತಿ, ನಮಸ್ಕಾರ. ಅರ್ಜುನ್, ನಿನ್ ಹೊಟ್ಟೆ ನೋಡಿದ್ರ ಸ್ಟಾರ್ಟಪ್ ಚೆನ್ನಾಗಿ ನಡೀತೈತಿ ಅನ್ಸತೈತಿ!"
    tr: "Prakāśā! Hyāṅga adi? Śruti, namaskāra. Arjun, nin hoṭṭe nōḍidra sṭārṭap chennāgi naḍītaiti ansataiti!"
    en: "Prakasha! How are you? Shruti, namaskara. Arjun, looking at your belly, the startup must be doing very well!"
  - who: arjun
    t: "ಡಾಕ್ಟ್ರೇ, ಕಾರ್ ಹತ್ತಿದ ಕೂಡ್ಲೇ ಡಯಾಗ್ನೋಸಿಸ್ ಶುರು ಮಾಡ್ಬೇಡಿ. ಸೀಟ್ ಬೆಲ್ಟ್ ಹಾಕಿ. ನವೀನ್ ಕಾರ್ ಆಗ್ಲೇ ನೆಲಮಂಗಲ ದಾಟಿದೆಯಂತೆ."
    tr: "Ḍākṭrē, kār hattida kūḍlē ḍayāgnōsis śuru māḍbēḍi. Sīṭ belṭ hāki. Navīn kār āglē Nelamaṅgala dāṭideyante."
    en: "Doctor, don't start a diagnosis the moment you get in the car. Put on your seat belt. Naveen's car has already crossed Nelamangala, apparently."
  - section: "Tumakuru road and thatte idli"
    learn: "highway words: ṭōl, ānyuyal pās, haivē · a slip in tense: irtittu (used to be) vs ide · ordering at a roadside stop: eṇṭu plēṭ, beṇṇe hāki, chaṭni jāsti · praising food: bombāṭ, bāyāga karagataiti, bhāḷa chalō aiti · town pride: Uḍupiyalli idakkinta oḷḷe uṇṭu"
  - scene: "6:40 a.m. NH-48 past Nelamangala. Mist over the fields. The FASTag beeps at a toll plaza."
  - who: imran
    t: "ಈ ಟೋಲ್ ಎಷ್ಟು ಕಟ್ ಆತು? ಜುಲೈನಾಗ ಮತ್ತ ರೇಟ್ ಹೆಚ್ಚಿಸ್ಯಾರ ಅಂತ ಓದಿದ್ದೆ."
    tr: "Ī ṭōl eṣṭu kaṭ ātu? Julaināga matta rēṭ heccisyāra anta ōdidde."
    en: "How much did this toll take? I read they raised the rates again in July."
  - who: arjun
    t: "ನಾನು ಆನ್ಯುಯಲ್ ಪಾಸ್ ತಗೊಂಡಿದೀನಿ. ಮೂರು ಸಾವಿರ ರೂಪಾಯಿ, ಇನ್ನೂರು ಟ್ರಿಪ್. ಆಗಾಗ ತುಮಕೂರು ಕಡೆ ಕ್ಲೈಂಟ್ ಮೀಟಿಂಗ್ ಇರ್ತಿತ್ತು, ಅದಕ್ಕೆ."
    tr: "Nānu ānyuyal pās tagoṇḍidīni. Mūru sāvira rūpāyi, innūru ṭrip. Āgāga Tumakūru kaḍe klaiṇṭ mīṭiṅg irtittu, adakke."
    en: "I've got the annual pass. Three thousand rupees, two hundred trips. I used to have client meetings out towards Tumakuru now and then, that's why."
  - who: shruti
    t: "‘ಇರ್ತಿತ್ತು’? ಈಗ ಇಲ್ವಾ?"
    tr: "‘Irtittu’? Īga ilvā?"
    en: "‘Used to’? Not any more?"
  - who: arjun
    t: "ಈಗ… ಎಲ್ಲಾ ಆನ್‌ಲೈನ್. ಜೂಮ್ ಕಾಲ್. ಅದು ಬಿಡು. ಕ್ಯಾತಸಂದ್ರ ಬಂತು, ತಟ್ಟೆ ಇಡ್ಲಿ!"
    tr: "Īga… ellā ān-lain. Jūm kāl. Adu biḍu. Kyātasandra bantu, taṭṭe iḍli!"
    en: "Now… it's all online. Zoom calls. Forget it. Here's Kyathsandra — thatte idli!"
  - scene: "7:05 a.m. A roadside idli hotel at Kyathsandra, near Tumakuru. Naveen's white car is already parked. Steam rises from the big flat idli plates. The eight are together for the first time in eight years."
  - who: naveen
    t: "ಬಂದ್ರಾ ಮಾರಾಯ್ರೆ! ಅರ್ಧ ಗಂಟೆಯಿಂದ ಕಾಯ್ತಾ ಉಂಟು. ಪ್ರಕಾಶ್, ಇಮ್ರಾನ್! ಬನ್ನಿ ಇಲ್ಲಿ!"
    tr: "Bandrā mārāyre! Ardha gaṇṭeyinda kāytā uṇṭu. Prakāś, Imrān! Banni illi!"
    en: "You've come, my dears! We've been waiting half an hour. Prakash, Imran! Come here!"
  - scene: "Naveen hugs Prakash and Imran hard. He gives Arjun a short handshake and turns to the counter."
  - who: ramya
    t: "ಎಂತ ಮರ್ರೆ, ಎಂಟು ವರ್ಷ ಆದ ಮೇಲೆ ಮೊದಲ ಫೋಟೋ! ಎಲ್ರೂ ಇಡ್ಲಿ ಮುಂದೆ ನಿಂತ್ಕೊಳ್ಳಿ. ಅರ್ಜುನ್, ನೀನು ಮಧ್ಯ ಬಾ. ನವೀನ್, ಹತ್ರ ಬಾ ಮರ್ರೆ!"
    tr: "Enta marre, eṇṭu varṣa āda mēle modala phōṭō! Ellrū iḍli munde nintkoḷḷi. Arjun, nīnu madhya bā. Navīn, hatra bā marre!"
    en: "What's this — the first photo in eight years! Everyone stand in front of the idlis. Arjun, you come to the middle. Naveen, come closer, man!"
  - who: kaveri
    t: "ಫೋಟೋ ಆಮೇಲೆ, ರಮ್ಯಾ. ಇಡ್ಲಿ ತಣ್ಣಗಾದ್ರೆ ಅದು ತಟ್ಟೆ ಇಡ್ಲಿ ಅಲ್ಲ, ಬರೀ ತಟ್ಟೆ."
    tr: "Phōṭō āmēle, Ramyā. Iḍli taṇṇagādre adu taṭṭe iḍli alla, barī taṭṭe."
    en: "Photo later, Ramya. If the idli goes cold, it isn't thatte idli any more — just the thatte, the plate."
  - who: arjun
    t: "ಅಣ್ಣಾ, ಎಂಟು ಪ್ಲೇಟ್ ತಟ್ಟೆ ಇಡ್ಲಿ, ಬೆಣ್ಣೆ ಹಾಕಿ. ಚಟ್ನಿ ಜಾಸ್ತಿ. ಮತ್ತೆ ಎಂಟು ಕಾಫಿ."
    tr: "Aṇṇā, eṇṭu plēṭ taṭṭe iḍli, beṇṇe hāki. Chaṭni jāsti. Matte eṇṭu kāphi."
    en: "Anna, eight plates of thatte idli, with butter. Extra chutney. And eight coffees."
  - who: deepa
    t: "ನಂಗೆ ಕಾಫಿ ಬೇಡ, ಟೀ. ಸಕ್ಕರೆ ಕಮ್ಮಿ. ರಾತ್ರಿ ನಿದ್ದೆ ಸರಿ ಆಗ್ಲಿಲ್ಲ."
    tr: "Naṅge kāphi bēḍa, ṭī. Sakkare kammi. Rātri nidde sari āglilla."
    en: "No coffee for me — tea. Less sugar. I didn't sleep well last night."
  - who: shruti
    t: "ಯಾಕೆ ದೀಪಾ? ಮೈಸೂರಿನಿಂದ ರಾತ್ರಿನೇ ಬಂದ್ಯಾ?"
    tr: "Yāke Dīpā? Maisūrininda rātrinē bandyā?"
    en: "Why, Deepa? Did you come back from Mysuru last night?"
  - who: deepa
    t: "ಹೂಂ, ಸ್ವಲ್ಪ ಕೆಲಸ ಇತ್ತು ಅಲ್ಲಿ. ತಡ ಆಯ್ತು. ಏನಿಲ್ಲ."
    tr: "Hūṁ, svalpa kelasa ittu alli. Taḍa āytu. Ēnilla."
    en: "Mm, I had some work there. It got late. It's nothing."
  - scene: "The idlis arrive, soft, as wide as a saucer, a cube of butter melting on each."
  - who: prakash
    t: "ಆಹಾ! ಇದು ಭಾಳ ಛಲೋ ಐತಿ. ಬಾಯಾಗ ಕರಗತೈತಿ. ನಮ್ ಕಡೆ ಇಡ್ಲಿ ಇಷ್ಟು ಮೆತ್ತಗೆ ಸಿಗೂದಿಲ್ಲ."
    tr: "Āhā! Idu bhāḷa chalō aiti. Bāyāga karagataiti. Nam kaḍe iḍli iṣṭu mettage sigūdilla."
    en: "Aha! This is really good. It melts in the mouth. Back home you don't get idli this soft."
  - who: naveen
    t: "ಉಡುಪಿಯಲ್ಲಿ ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಇಡ್ಲಿ ಉಂಟು. ಆದ್ರೆ ಹೈವೇ ಮೇಲೆ ಇದು ಬೊಂಬಾಟೇ. ಒಪ್ಪಿಕೊಳ್ತೇನೆ."
    tr: "Uḍupiyalli idakkinta oḷḷe iḍli uṇṭu. Ādre haivē mēle idu bombāṭē. Oppikoḷtēne."
    en: "In Udupi there's better idli than this. But for the highway, this is fantastic. I'll admit that."
  - who: imran
    t: "ಉಡುಪಿಯವರು ತಮ್ಮ ಊರಿನ ಇಡ್ಲಿ ಬಿಟ್ಟು ಯಾವುದನ್ನೂ ಪೂರ್ತಿ ಹೊಗಳೂದಿಲ್ಲ. ಇದು ವೈದ್ಯಕೀಯವಾಗಿ ಸಾಬೀತಾದ ವಿಷಯ."
    tr: "Uḍupiyavaru tamma ūrina iḍli biṭṭu yāvudannū pūrti hogaḷūdilla. Idu vaidyakīyavāgi sābītāda viṣaya."
    en: "Udupi people never fully praise any idli except their own town's. That's a medically proven fact."
  - who: naveen
    t: "ಡಾಕ್ಟ್ರೇ, ನೀವು ಕಲಬುರಗಿ ರೊಟ್ಟಿ ಬಗ್ಗೆ ಮಾತಾಡುವಾಗ ನಾನೂ ಹೀಗೇ ಹೇಳ್ತೇನೆ, ನೆನಪಿಟ್ಕೊಳ್ಳಿ."
    tr: "Ḍākṭrē, nīvu Kalaburagi roṭṭi bagge mātāḍuvāga nānū hīgē hēḷtēne, nenapiṭkoḷḷi."
    en: "Doctor, when you start talking about Kalaburagi rotti, I'll say the same thing — remember that."
  - who: imran
    t: "ಒಂದು ಪ್ರಸ್ತಾವ. ಚಿತ್ರದುರ್ಗ ಆದ ಮೇಲೆ ದಾವಣಗೆರೆಗೆ ಹೋಗಿ ಬೆಣ್ಣೆ ದೋಸೆ ತಿನ್ನೋಣು. ಬೆಣ್ಣೆ ದೋಸೆ ತಿನ್ನದೆ ಉತ್ತರ ಕರ್ನಾಟಕಕ್ಕೆ ಹೋಗೋದು ಪಾಪ."
    tr: "Ondu prastāva. Chitradurga āda mēle Dāvaṇagerege hōgi beṇṇe dōse tinnōṇu. Beṇṇe dōse tinnade uttara Karnāṭakakke hōgōdu pāpa."
    en: "A proposal. After Chitradurga, let's go to Davanagere and eat benne dose. Going to North Karnataka without eating benne dose is a sin."
  - who: prakash
    t: "ದಾವಣಗೆರೆ ಹಂಪಿ ದಾರಿಯಾಗ ಇಲ್ರೀ ಡಾಕ್ಟ್ರೇ. ಅದು ಹುಬ್ಬಳ್ಳಿ ಹೈವೇ ಮ್ಯಾಲ ಐತಿ. ಚಿತ್ರದುರ್ಗದಿಂದ ಅರವತ್ತು ಕಿಲೋಮೀಟರ್ ಉಲ್ಟಾ ಹೋಗಬೇಕು, ಮತ್ತ ವಾಪಸ್."
    tr: "Dāvaṇagere Hampi dāriyāga illrī ḍākṭrē. Adu Hubbaḷḷi haivē myāla aiti. Chitradurgadinda aravattu kilōmīṭar ulṭā hōgabēku, matta vāpas."
    en: "Davanagere isn't on the Hampi road, Doctor. It's on the Hubballi highway. From Chitradurga you'd have to go sixty kilometres the other way, and then come back."
  - who: arjun
    t: "ನೂರಿಪ್ಪತ್ತು ಕಿಲೋಮೀಟರ್ ಒಂದು ದೋಸೆಗೆ? ಸೀನ್ ಇಲ್ಲ ಗುರು. ಕತ್ತಲಾಗೋದ್ರೊಳಗೆ ಹಂಪಿ ಮುಟ್ಟಬೇಕು."
    tr: "Nūrippattu kilōmīṭar ondu dōsege? Sīn illa guru. Kattalāgōdroḷage Hampi muṭṭabēku."
    en: "A hundred and twenty kilometres for one dosa? No chance, boss. We have to reach Hampi before dark."
  - who: naveen
    t: "ದೋಸೆಗೋಸ್ಕರ ನೂರಿಪ್ಪತ್ತು ಕಿಲೋಮೀಟರ್ ಹೋಗುವುದು ತಪ್ಪಲ್ಲ ಮಾರಾಯ. ಉಡುಪಿಯವರು ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಹೋಗ್ತಾರೆ. ಆದ್ರೆ ಈ ಸಲ ಬೇಡ. ವಾಪಸ್ ಬರುವಾಗ ನೋಡುವ."
    tr: "Dōsegōskara nūrippattu kilōmīṭar hōguvudu tappalla mārāya. Uḍupiyavaru adakkinta jāsti hōgtāre. Ādre ī sala bēḍa. Vāpas baruvāga nōḍuva."
    en: "Going a hundred and twenty kilometres for a dosa isn't wrong, maraya. Udupi people go further than that. But not this time. Let's see on the way back."
  - who: imran
    t: "ಆತು. ಆದ್ರ ಬರೆದು ಇಡ್ರಿ: ಬೆಣ್ಣೆ ದೋಸೆ ಬಾಕಿ ಐತಿ. ಕಾವೇರಿ, ಇದು ಒಪ್ಪಂದ."
    tr: "Ātu. Ādra baredu iḍri: beṇṇe dōse bāki aiti. Kāvēri, idu oppanda."
    en: "Fine. But write it down: benne dose is pending. Kaveri, this is a contract."
  - who: kaveri
    t: "ದಾಖಲಿಸಲಾಗಿದೆ. ಬೆಣ್ಣೆ ದೋಸೆ ಬಾಕಿ. ಬಡ್ಡಿ ಸಮೇತ."
    tr: "Dākhalisalāgide. Beṇṇe dōse bāki. Baḍḍi samēta."
    en: "Recorded. Benne dose outstanding. With interest."
  - scene: "At the counter, Arjun takes out his phone to pay for everyone. Naveen's hand is already there with cash."
  - who: arjun
    t: "ಅಣ್ಣಾ, ಎಲ್ಲಾದ್ದೂ ಸೇರಿ ಎಷ್ಟಾಯ್ತು? ಯುಪಿಐ ಮಾಡ್ತೀನಿ, ಸ್ಕ್ಯಾನರ್ ತೋರಿಸಿ."
    tr: "Aṇṇā, ellāddū sēri eṣṭāytu? Yu-pi-ai māḍtīni, skyānar tōrisi."
    en: "Anna, how much for everything together? I'll pay by UPI — show me the scanner."
  - who: naveen
    t: "ಬೇಡ ಮಾರಾಯ. ನಮ್ಮ ಕಾರಿನ ನಾಲ್ಕು ಪ್ಲೇಟ್ ನಾನು ಕೊಡ್ತೇನೆ, ನಿನ್ನ ಕಾರಿನದ್ದು ನೀನು ಕೊಡು. ಆಮೇಲೆ ಆ್ಯಪ್‌ನಲ್ಲಿ ಹಾಕುವ."
    tr: "Bēḍa mārāya. Namma kārina nālku plēṭ nānu koḍtēne, ninna kārinaddu nīnu koḍu. Āmēle āyp-nalli hākuva."
    en: "No, maraya. I'll pay for the four plates from our car; you pay for yours. We'll put it in the app later."
  - who: arjun
    t: "ಏನ್ ಮಗಾ, ಇನ್ನೂರು ರೂಪಾಯಿ ಇಡ್ಲಿಗೆ ಇಷ್ಟು ಲೆಕ್ಕನಾ? ಕೋರ್ಟ್ ಕೇಸ್ ತರ ಮಾಡ್ತಿದೀಯಲ್ಲ."
    tr: "Ēn magā, innūru rūpāyi iḍlige iṣṭu lekkanā? Kōrṭ kēs tara māḍtidīyalla."
    en: "Come on, maga, this much accounting over two hundred rupees of idli? You're making it sound like a court case."
  - who: naveen
    t: "ಸಣ್ಣ ಲೆಕ್ಕ ಸರಿ ಇದ್ರೆನೇ ದೊಡ್ಡ ಲೆಕ್ಕ ಸರಿ ಇರ್ತದೆ. ಹೋಟೆಲ್ ನಡೆಸುವವನಿಗೆ ಅದೇ ಮೊದಲ ಪಾಠ."
    tr: "Saṇṇa lekka sari idrenē doḍḍa lekka sari irtade. Hōṭel naḍesuvavanige adē modala pāṭha."
    en: "Only when the small accounts are straight do the big ones stay straight. That's the first lesson for anyone who runs a hotel."
  - scene: "He pays in cash, counts the change twice, and walks out to the cars without waiting. Kaveri, drying her hands at the tap, has heard every word."
  - who: kaveri
    t: "ನವೀನ್ ಯಾವಾಗಿಂದ ಇಷ್ಟು ಕಟ್ಟುನಿಟ್ಟು ಆದ? ಕಾಲೇಜಲ್ಲಿ ಕ್ಯಾಂಟೀನ್ ಬಿಲ್ ಎಲ್ಲಾ ಅವನೇ ಕೊಡ್ತಿದ್ದ."
    tr: "Navīn yāvāginda iṣṭu kaṭṭuniṭṭu āda? Kālējalli kyāṇṭīn bil ellā avanē koḍtidda."
    en: "Since when has Naveen become this strict? In college he used to pay everybody's canteen bill."
  - who: deepa
    t: "ದುಬೈ ಮನುಷ್ಯನ್ನ ಬದಲಾಯಿಸುತ್ತೆ ಅಂತಾರೆ. ಅಥವಾ ಬೇರೆ ಏನೋ ಇರ್ಬೋದು. ನಮಗ್ಯಾಕೆ, ಬಿಡು."
    tr: "Dubai manuṣyanna badalāyisutte antāre. Athavā bēre ēnō irbōdu. Namagyāke, biḍu."
    en: "They say Dubai changes a person. Or it could be something else. Why should we bother? Leave it."
  - who: kaveri
    t: "‘ನಮಗ್ಯಾಕೆ’ ಅನ್ನೋದು ಕೋರ್ಟಲ್ಲಿ ನಡೆಯಲ್ಲ, ದೀಪಾ. ಆದ್ರೆ ಸ್ನೇಹದಲ್ಲಿ ಕೆಲವೊಮ್ಮೆ ಅದೇ ಸರಿ. ಸದ್ಯಕ್ಕೆ."
    tr: "‘Namagyāke’ annōdu kōrṭalli naḍeyalla, Dīpā. Ādre snēhadalli kelavomme adē sari. Sadyakke."
    en: "‘Why should we bother’ doesn't work in court, Deepa. But in friendship it's sometimes the right thing. For now."
  - section: "The car playlist: old films, new films"
    learn: "film talk: blāk-basṭar, pyān-iṇḍiyā, phasṭ ḍē phasṭ śō, kathenē illa, bilḍap · cinema facts, dated: Kāntāra adhyāya ondu, eṇṭu nūru kōṭi, Ṭāksik nirāśe · respect: Appu, Rājkumār, kaṇṇu dāna · a lawyer's caution: kēs kōrṭ-nallide, kānūnu ellrigū ondē"
  - scene: "8:10 a.m. Back on NH-48, past Tumakuru. In Arjun's car the playlist moves to ‘Anisuthide’ from Mungaru Male. Ramya calls from Naveen's car and stays on speaker."
  - who: shruti
    t: "ಅಯ್ಯೋ, ಈ ಹಾಡು! ಎರಡು ಸಾವಿರದ ಆರು. ನಾವು ಹೈಸ್ಕೂಲ್‌ನಲ್ಲಿದ್ವಿ. ಮಳೆ ಬಂದ್ರೆ ಸಾಕು, ಎಲ್ರೂ ಇದನ್ನೇ ಹಾಡ್ತಿದ್ರು."
    tr: "Ayyō, ī hāḍu! Eraḍu sāvirada āru. Nāvu haiskūl-nallidvi. Maḷe bandre sāku, ellrū idannē hāḍtidru."
    en: "Oh, this song! 2006. We were in high school. The minute it rained, everyone would sing this."
  - who: arjun
    t: "ಆವಾಗಿನ ಸಿನಿಮಾಗಳಲ್ಲಿ ಕಥೆ ಇತ್ತು, ಹಾಡು ಇತ್ತು. ಈಗ ಎಲ್ಲಾ ಪ್ಯಾನ್-ಇಂಡಿಯಾ. ಐದು ಭಾಷೆ, ಐನೂರು ಕೋಟಿ ಬಜೆಟ್, ಕಥೆ ಎಲ್ಲಿ ಅಂತ ಕೇಳಿದ್ರೆ ಯಾರಿಗೂ ಗೊತ್ತಿಲ್ಲ."
    tr: "Āvāgina sinimāgaḷalli kathe ittu, hāḍu ittu. Īga ellā pyān-iṇḍiyā. Aidu bhāṣe, ainūru kōṭi bajeṭ, kathe elli anta kēḷidre yārigū gottilla."
    en: "The films back then had a story, they had songs. Now everything's pan-India. Five languages, a five-hundred-crore budget, and if you ask where the story is, nobody knows."
  - who: ramya
    t: "ಏಯ್, ಅದು ಸುಳ್ಳು! ಕಾಂತಾರ ಅಧ್ಯಾಯ ಒಂದು ನೋಡು. ಕಳೆದ ವರ್ಷ ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಬಂತು. ಸುಮಾರು ಎಂಟು ನೂರು ಕೋಟಿ. ಕೆಜಿಎಫ್ ಎರಡರ ನಂತರ ಕನ್ನಡದ ಎರಡನೇ ದೊಡ್ಡ ಸಿನಿಮಾ. ಅದರಲ್ಲಿ ಕಥೆ ಇರ್ಲಿಲ್ವಾ?"
    tr: "Ēy, adu suḷḷu! Kāntāra adhyāya ondu nōḍu. Kaḷeda varṣa akṭōbar-nalli bantu. Sumāru eṇṭu nūru kōṭi. Ke-ji-eph eraḍara nantara Kannaḍada eraḍanē doḍḍa sinimā. Adaralli kathe irlilvā?"
    en: "Hey, that's not true! Look at Kantara: Chapter 1. It came out in October last year. Around eight hundred crore. The second-biggest Kannada film after KGF 2. Didn't that have a story?"
  - who: arjun
    t: "ಕಾಂತಾರ ಬೇರೆ. ಅದು ನೆಲದ ಕಥೆ. ನಾನು ಹೇಳ್ತಿರೋದು ಆ ಬಿಲ್ಡಪ್ ಸಿನಿಮಾಗಳ ಬಗ್ಗೆ. ಉದಾಹರಣೆಗೆ ಆಗಸ್ಟ್‌ನಲ್ಲಿ ಬಂದ ‘ಟಾಕ್ಸಿಕ್’."
    tr: "Kāntāra bēre. Adu nelada kathe. Nānu hēḷtirōdu ā bilḍap sinimāgaḷa bagge. Udāharaṇege āgasṭ-nalli banda ‘Ṭāksik’."
    en: "Kantara's different. It's a story of the soil. I'm talking about those hype films. Like ‘Toxic’, which came out in August."
  - who: imran
    t: "ಟಾಕ್ಸಿಕ್ ನಾನು ಕಲಬುರಗಿಯಾಗ ಫಸ್ಟ್ ಡೇ ಫಸ್ಟ್ ಶೋ ನೋಡಿದೆ. ಮೊದಲ ದಿನ ನೂರು ಕೋಟಿ ಅಂದ್ರು. ಎರಡನೇ ದಿನ ಥಿಯೇಟರ್ ಖಾಲಿ. ಯಶ್ ಅಂದ್ರ ನಂಗ ಇಷ್ಟ, ಆದ್ರ ಈ ಸಲ ನಿರಾಶೆ ಆತು ಯಪ್ಪಾ."
    tr: "Ṭāksik nānu Kalaburagiyāga phasṭ ḍē phasṭ śō nōḍide. Modala dina nūru kōṭi andru. Eraḍanē dina thiyēṭar khāli. Yaś andra naṅga iṣṭa, ādra ī sala nirāśe ātu yappā."
    en: "I saw Toxic first day, first show, in Kalaburagi. They said a hundred crore on day one. On day two, the theatre was empty. I like Yash, but this time I was disappointed, yappa."
  - who: prakash
    t: "ನನಗ ಹಳೇ ಸಿನಿಮಾನೇ ಇಷ್ಟ್ರಿ. ರಾಜ್‌ಕುಮಾರ್ ಅವರ ‘ಬಂಗಾರದ ಮನುಷ್ಯ’. ನಮ್ ಅಪ್ಪಾಜಿ ಅದನ್ನ ಹತ್ತು ಸಲ ನೋಡ್ಯಾರ. ಅದರಾಗ ಹೀರೋ ಹೊಡೆದಾಟ ಮಾಡಂಗಿಲ್ಲ, ಹೊಲ ಉಳತಾನ, ಊರು ಕಟ್ಟತಾನ."
    tr: "Nanaga haḷē sinimānē iṣṭri. Rājkumār avara ‘Baṅgārada Manuṣya’. Nam appāji adanna hattu sala nōḍyāra. Adarāga hīrō hoḍedāṭa māḍaṅgilla, hola uḷatāna, ūru kaṭṭatāna."
    en: "I like the old films. Rajkumar's ‘Bangarada Manushya’. My father has seen it ten times. In it the hero doesn't fight; he ploughs the field, he builds the village."
  - who: shruti
    t: "ರಾಜ್‌ಕುಮಾರ್ ಅಂದ್ರೆ ನೆನಪಾಯ್ತು. ಅಕ್ಟೋಬರ್ ಇಪ್ಪತ್ತೊಂಬತ್ತಕ್ಕೆ ಅಪ್ಪು ಹೋಗಿ ಐದು ವರ್ಷ ಆಯ್ತು. ನಮ್ಮ ಮಲ್ಲೇಶ್ವರದಲ್ಲಿ ಹುಡುಗರು ಕಣ್ಣು ದಾನದ ಕ್ಯಾಂಪ್ ಮಾಡಿದ್ರು. ನಾನೂ ಫಾರ್ಮ್ ತುಂಬಿದೆ."
    tr: "Rājkumār andre nenapāytu. Akṭōbar ippattombattakke Appu hōgi aidu varṣa āytu. Namma Mallēśvaradalli huḍugaru kaṇṇu dānada kyāmp māḍidru. Nānū phārm tumbide."
    en: "Speaking of Rajkumar — on October twenty-ninth it was five years since Appu passed. In our Malleshwaram the boys held an eye-donation camp. I filled in the form too."
  - who: imran
    t: "ಅಪ್ಪು ಹೋದ ಮೇಲೆ ನಮ್ ಆಸ್ಪತ್ರೆಗೂ ಕಣ್ಣು ದಾನದ ಫಾರ್ಮ್ ಭಾಳ ಬಂದ್ವು. ಒಬ್ಬ ಮನುಷ್ಯ ಹೋದ ಮೇಲೂ ಇಷ್ಟು ಜನಕ್ಕೆ ಬೆಳಕು ಕೊಡ್ತಾನ ಅಂದ್ರ, ಅದು ನಿಜವಾದ ಹೀರೋ."
    tr: "Appu hōda mēle nam āspatregū kaṇṇu dānada phārm bhāḷa bandvu. Obba manuṣya hōda mēlū iṣṭu janakke beḷaku koḍtāna andra, adu nijavāda hīrō."
    en: "After Appu passed, lots of eye-donation forms came to our hospital too. If a man gives light to so many people even after he's gone, that's a real hero."
  - who: ramya
    t: "ಹೀರೋ ಅಂದ್ರೆ… ದರ್ಶನ್ ಕೇಸ್ ಬಗ್ಗೆ ಯಾರಿಗೂ ಅಭಿಪ್ರಾಯ ಇಲ್ವಾ? ಮೇ ತಿಂಗಳಲ್ಲಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಮತ್ತೆ ಬೇಲ್ ಕೊಡ್ಲಿಲ್ಲ. ಟ್ರಯಲ್ ಬೇಗ ಮುಗಿಸಿ ಅಂತ ಹೇಳಿದೆ."
    tr: "Hīrō andre… Darśan kēs bagge yārigū abhiprāya ilvā? Mē tiṅgaḷalli Suprīṁ Kōrṭ matte bēl koḍlilla. Ṭrayal bēga mugisi anta hēḷide."
    en: "Speaking of heroes… does nobody have an opinion on the Darshan case? In May the Supreme Court refused bail again. It said to finish the trial quickly."
  - who: arjun
    t: "ರಮ್ಯಾ, ನೀನು ಟಿವಿ ಸ್ಟುಡಿಯೋದಲ್ಲಿಲ್ಲ. ಬೆಳಗ್ಗೆ ಎಂಟು ಗಂಟೆಗೆ ಪ್ರೈಮ್ ಟೈಮ್ ಡಿಬೇಟ್ ಬೇಡ."
    tr: "Ramyā, nīnu ṭivi sṭuḍiyōdallilla. Beḷagge eṇṭu gaṇṭege praim ṭaim ḍibēṭ bēḍa."
    en: "Ramya, you're not in a TV studio. No prime-time debate at eight in the morning."
  - who: kaveri
    t: "ನನ್ನ ಅಭಿಪ್ರಾಯ ಚಿಕ್ಕದು. ಕೇಸ್ ಕೋರ್ಟ್‌ನಲ್ಲಿದೆ. ಆರೋಪ ಸಾಬೀತಾಗೋವರೆಗೆ ಯಾರೂ ಅಪರಾಧಿ ಅಲ್ಲ. ಆದ್ರೆ ಸ್ಟಾರ್ ಅಂತ ವಿಶೇಷ ರಿಯಾಯಿತಿನೂ ಇಲ್ಲ. ಕಾನೂನು ಎಲ್ರಿಗೂ ಒಂದೇ."
    tr: "Nanna abhiprāya chikkadu. Kēs kōrṭ-nallide. Ārōpa sābītāgōvarege yārū aparādhi alla. Ādre sṭār anta viśēṣa riyāyitinū illa. Kānūnu ellrigū ondē."
    en: "My opinion is short. The case is in court. Nobody is guilty until the charge is proved. But there's no special discount for being a star, either. The law is the same for everyone."
  - who: ramya
    t: "ವಕೀಲೆ ಮೇಡಂ ತೀರ್ಪು ಕೊಟ್ಟಾಯ್ತು. ಸರಿ, ನೆಟ್‌ವರ್ಕ್ ಹೋಗ್ತಿದೆ… ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ಸಿಗುವ…"
    tr: "Vakīle mēḍam tīrpu koṭṭāytu. Sari, neṭ-vark hōgtide… Chitradurgadalli siguva…"
    en: "Madam Lawyer has delivered her verdict. Okay, the network's going… see you at Chitradurga…"
  - scene: "The call drops. Prakash and Imran doze off in the back row, heads tilted together. For a few kilometres it is only Arjun and Shruti awake in front."
  - who: arjun
    t: "ಆದ್ಯಾ, ಇಶಾನ್… ಫೋಟೋ ಇದ್ರೆ ತೋರಿಸು. ನಿನ್ ಇನ್‌ಸ್ಟಾ ಪ್ರೈವೇಟ್, ನಾನು ಯಾವತ್ತೂ ನೋಡಿಲ್ಲ."
    tr: "Ādyā, Iśān… phōṭō idre tōrisu. Nin Insṭā praivēṭ, nānu yāvattū nōḍilla."
    en: "Aadya, Ishaan… show me a photo if you have one. Your Insta's private; I've never seen them."
  - who: shruti
    t: "ಅದಕ್ಕೇ ಪ್ರೈವೇಟ್. ತಗೋ, ಇದು ಆದ್ಯಾ, ಸ್ಕೂಲ್ ಡೇ ಡ್ಯಾನ್ಸ್. ಇದು ಇಶಾನ್, ಅಪ್ಪನ ಕನ್ನಡಕ ಹಾಕ್ಕೊಂಡು."
    tr: "Adakkē praivēṭ. Tagō, idu Ādyā, skūl ḍē ḍyāns. Idu Iśān, appana kannaḍaka hākkoṇḍu."
    en: "That's why it's private. Here — this is Aadya, her school-day dance. This is Ishaan, wearing his dad's glasses."
  - who: arjun
    t: "ಆದ್ಯಾ ಥೇಟ್ ನಿನ್ನ ಹಾಗೇ ಇದಾಳೆ. ಅದೇ ಕಣ್ಣು, ಅದೇ ‘ನನ್ನ ದಾರಿ ಬಿಡು’ ನಗು."
    tr: "Ādyā thēṭ ninna hāgē idāḷe. Adē kaṇṇu, adē ‘nanna dāri biḍu’ nagu."
    en: "Aadya looks exactly like you. The same eyes, the same ‘get out of my way’ smile."
  - who: shruti
    t: "ನಿನ್ನ ಅಮ್ಮ ಹೇಗಿದಾರೆ? ಜಯನಗರದ ಮನೆಯಲ್ಲೇ ಇದಾರಾ?"
    tr: "Ninna amma hēgidāre? Jayanagarada maneyallē idārā?"
    en: "How's your mother? Is she still in the Jayanagar house?"
  - who: arjun
    t: "ಹೂಂ. ಮಂಡಿ ನೋವು, ಆದ್ರೂ ದಿನಾ ಬೆಳಗ್ಗೆ ಮಾರ್ಕೆಟ್‌ಗೆ ಹೋಗ್ತಾರೆ. ಅವರು ಈಗಲೂ ಕೇಳ್ತಾರೆ, ‘ಆ ಮಲ್ಲೇಶ್ವರದ ಹುಡುಗಿ ಹೇಗಿದಾಳೆ’ ಅಂತ."
    tr: "Hūṁ. Maṇḍi nōvu, ādrū dinā beḷagge mārkeṭ-ge hōgtāre. Avaru īgalū kēḷtāre, ‘ā Mallēśvarada huḍugi hēgidāḷe’ anta."
    en: "Mm. Bad knees, but she still goes to the market every morning. She still asks, ‘How's that Malleshwaram girl?’"
  - who: shruti
    t: "ಹೇಳು, ‘ಆ ಹುಡುಗಿಗೆ ಮೂವತ್ನಾಲ್ಕು ವರ್ಷ, ಎರಡು ಮಕ್ಕಳು, ಚೆನ್ನಾಗಿದಾಳೆ’ ಅಂತ. ರಸ್ತೆ ನೋಡು, ಅರ್ಜುನ್."
    tr: "Hēḷu, ‘ā huḍugige mūvatnālku varṣa, eraḍu makkaḷu, chennāgidāḷe’ anta. Raste nōḍu, Arjun."
    en: "Tell her, ‘That girl is thirty-four, has two children, and is fine.’ Watch the road, Arjun."
  - who: arjun
    t: "ಹೇಳ್ತೀನಿ. ಆದ್ರೆ ಅಮ್ಮ ನಂಬಲ್ಲ. ‘ಆ ಹುಡುಗಿನ ಕಳ್ಕೊಂಡಿದ್ದು ನಿನ್ನ ಸ್ವಂತ ತಪ್ಪು’ ಅಂತ ಇವತ್ತಿಗೂ ಹೇಳ್ತಾರೆ."
    tr: "Hēḷtīni. Ādre amma namballa. ‘Ā huḍugina kaḷkoṇḍiddu ninna svanta tappu’ anta ivattigū hēḷtāre."
    en: "I'll tell her. But Amma won't believe it. To this day she says, ‘Losing that girl was your own fault.’"
  - who: shruti
    t: "ನಿಮ್ ಮನೇಲಿ ಯಾವಾಗ್ಲೂ ಬುದ್ಧಿ ಇದ್ದಿದ್ದು ನಿಮ್ಮಮ್ಮನಿಗೆ ಮಾತ್ರ. ರೋಡ್ ನೋಡು ಅಂದೆ."
    tr: "Nim manēli yāvāglū buddhi iddiddu nimmammanige mātra. Rōḍ nōḍu ande."
    en: "In your house, the only one with any sense was always your mother. I said, watch the road."
  - scene: "Imran wakes up with a start as the car hits a speed breaker. Prakash opens his eyes and looks out at the fields."
  - section: "Politics in the back seat"
    learn: "arguing: ondu nimiṣa, nan mātu mugisli, ond maṭṭige opputtīni ādre…, tappu tiḷkōbēḍa · Karnataka politics, dated: Ḍi.Ke. Śivakumār, jūn mūrakke si-eṁ · the guarantees: Śakti, Gr̥halakṣmi, bāki kantu · the caste survey: varadi, mīsalāti, jāri · Dharwad -ri: illri, mātāḍli; ending: rājakīya sāku"
  - scene: "9:00 a.m. Past Sira. Sun on the windscreen, the road straight and wide. A billboard with the Chief Minister's face goes by."
  - who: arjun
    t: "ನೋಡು, ಡಿ.ಕೆ. ಶಿವಕುಮಾರ್ ಫೋಟೋ ಎಲ್ಲಾ ಕಡೆ. ಜೂನ್ ಮೂರಕ್ಕೆ ಸಿಎಂ ಆದ್ರು. ಆರು ತಿಂಗಳಲ್ಲಿ ಬೋರ್ಡ್‌ಗಳು ಮಾತ್ರ ಬದಲಾಗಿವೆ. ಬೆಂಗಳೂರು ರಸ್ತೆ ಹಾಗೇ ಇದೆ."
    tr: "Nōḍu, Ḍi.Ke. Śivakumār phōṭō ellā kaḍe. Jūn mūrakke si-eṁ ādru. Āru tiṅgaḷalli bōrḍ-gaḷu mātra badalāgive. Beṅgaḷūru raste hāgē ide."
    en: "Look, D.K. Shivakumar's photo everywhere. He became CM on the third of June. In six months only the boards have changed. Bengaluru's roads are exactly the same."
  - who: imran
    t: "ಬೆಂಗಳೂರು ರಸ್ತೆ? ಯಪ್ಪಾ, ನೀವು ಹದಿನೇಳು ಸಾವಿರ ಕೋಟಿ ಟನಲ್ ರೋಡ್ ಬಗ್ಗೆ ಜಗಳ ಆಡ್ತೀರಿ. ನಮ್ ಕಡೆ ತಾಲೂಕು ಆಸ್ಪತ್ರೆಗೆ ಹೋಗೋ ರಸ್ತೆನೇ ಸರಿ ಇಲ್ಲ. ಆಂಬುಲೆನ್ಸ್ ಒಳಗೇ ಹೆರಿಗೆ ಆಗೈತಿ, ನಾನೇ ನೋಡೇನಿ."
    tr: "Beṅgaḷūru raste? Yappā, nīvu hadinēḷu sāvira kōṭi ṭanal rōḍ bagge jagaḷa āḍtīri. Nam kaḍe tālūku āspatrege hōgō rastenē sari illa. Āmbulens oḷagē herige āgaiti, nānē nōḍēni."
    en: "Bengaluru's roads? Yappa, you people fight about a seventeen-thousand-crore tunnel road. Where I live, even the road to the taluk hospital is broken. A baby has been born inside an ambulance — I've seen it myself."
  - who: arjun
    t: "ಒಂದು ನಿಮಿಷ, ನನ್ ಮಾತು ಮುಗಿಸ್ಲಿ. ನಾನೂ ಟನಲ್ ರೋಡ್ ಪರ ಇಲ್ಲ. ಅದರ ಬಗ್ಗೆ ಹೈಕೋರ್ಟ್‌ನಲ್ಲಿ ಪಿಐಎಲ್ ಇದೆ ಅಂತ ಓದಿದೆ. ನನ್ ಪಾಯಿಂಟ್ ಅಂದ್ರೆ, ಬೆಂಗಳೂರು ರಾಜ್ಯಕ್ಕೆ ದುಡ್ಡು ಕೊಡುತ್ತೆ, ಆದ್ರೆ ನಮಗೆ ಫುಟ್‌ಪಾತ್ ಕೂಡ ಇಲ್ಲ."
    tr: "Ondu nimiṣa, nan mātu mugisli. Nānū ṭanal rōḍ para illa. Adara bagge Haikōrṭ-nalli pi-ai-el ide anta ōdide. Nan pāyiṇṭ andre, Beṅgaḷūru rājyakke duḍḍu koḍutte, ādre namage phuṭ-pāth kūḍa illa."
    en: "One minute, let me finish. I'm not for the tunnel road either. I read there's a PIL about it in the High Court. My point is, Bengaluru gives the state its money, and we don't even have footpaths."
  - who: imran
    t: "ಮತ್ತ ಅದೇ ‘ನಾವು ದುಡ್ಡು ಕೊಡ್ತೇವಿ’ ಮಾತು. ಕಲಬುರಗಿಯ ಹುಡುಗರು ನಿಮ್ ಬೆಂಗಳೂರಾಗ ಸೆಕ್ಯೂರಿಟಿ, ಡೆಲಿವರಿ ಕೆಲಸ ಮಾಡಿ ಆ ದುಡ್ಡು ದುಡಿದು ಕೊಡ್ತಾರ. ಅದನ್ನ ಭೀ ಲೆಕ್ಕಕ್ಕೆ ಹಾಕ್ರಿ."
    tr: "Matta adē ‘nāvu duḍḍu koḍtēvi’ mātu. Kalaburagiya huḍugaru nim Beṅgaḷūrāga sekyūriṭi, ḍelivari kelasa māḍi ā duḍḍu duḍidu koḍtāra. Adanna bhī lekkakke hākri."
    en: "There it is again — ‘we pay the money’. Boys from Kalaburagi earn that money for you, working security and delivery jobs in your Bengaluru. Count that too."
  - who: shruti
    t: "ಸರಿ ಸರಿ, ಇಬ್ರೂ ಸ್ವಲ್ಪ ಸಮಾಧಾನ. ನಾನು ಒಂದು ಹೇಳ್ತೀನಿ. ಶಕ್ತಿ ಯೋಜನೆ ಬಂದ ಮೇಲೆ ನಮ್ಮ ಮನೆ ಕೆಲಸದ ಲಕ್ಷ್ಮಮ್ಮ ಫ್ರೀ ಬಸ್‌ನಲ್ಲಿ ತಿಂಗಳಿಗೆ ಸಾವಿರ ರೂಪಾಯಿ ಉಳಿಸ್ತಾರೆ. ಅದು ಅವರಿಗೆ ದೊಡ್ಡ ವಿಷಯ."
    tr: "Sari sari, ibrū svalpa samādhāna. Nānu ondu hēḷtīni. Śakti yōjane banda mēle namma mane kelasada Lakṣmamma phrī bas-nalli tiṅgaḷige sāvira rūpāyi uḷistāre. Adu avarige doḍḍa viṣaya."
    en: "Okay, okay, both of you calm down a little. Let me say one thing. Since the Shakti scheme came, Lakshmamma, who works in our house, saves a thousand rupees a month on the free bus. For her that's a big deal."
  - who: prakash
    t: "ಶಕ್ತಿ ಛಲೋ ಐತಿ, ಖರೆ. ನಮ್ ಅವ್ವ ಭೀ ಹುಬ್ಬಳ್ಳಿಗೆ ಫ್ರೀ ಬಸ್ಸಿನ್ಯಾಗ ಹೋಗತಾರ. ಆದ್ರ ಗೃಹಲಕ್ಷ್ಮಿ ದುಡ್ಡು ಮೂರು ತಿಂಗಳು ಬರಲಿಲ್ಲ. ಈ ತಿಂಗಳ ಸುರುವಿಗೆ ಬಾಕಿ ಕಂತು ಒಟ್ಟಿಗೆ ಬಂತು ಅಂತ ಕೇಳಿದೆ. ಅವ್ವ ದಿನಾ ಬ್ಯಾಂಕ್ ಮೆಸೇಜ್ ನೋಡತಿದ್ರು."
    tr: "Śakti chalō aiti, khare. Nam avva bhī Hubbaḷḷige phrī bassinyāga hōgatāra. Ādra Gr̥halakṣmi duḍḍu mūru tiṅgaḷu baralilla. Ī tiṅgaḷa suruvige bāki kantu oṭṭige bantu anta kēḷide. Avva dinā byāṅk mesēj nōḍatidru."
    en: "Shakti is good, true. My Avva also goes to Hubballi on the free bus. But the Gruha Lakshmi money didn't come for three months. I heard the pending instalments came together at the start of the month. Avva was checking her bank messages every day."
  - who: arjun
    t: "ಅದೇ ನಾನು ಹೇಳೋದು. ಗ್ಯಾರಂಟಿಗೆ ದುಡ್ಡು ಹೋಗುತ್ತೆ, ರಸ್ತೆಗೆ ದುಡ್ಡಿಲ್ಲ. ಎಲ್ಲಾ ಪಾರ್ಟಿನೂ ಒಂದೇ ಗುರು. ವೋಟಿಗೋಸ್ಕರ ಏನು ಬೇಕಾದ್ರೂ ಮಾಡ್ತಾರೆ."
    tr: "Adē nānu hēḷōdu. Gyāraṇṭige duḍḍu hōgutte, rastege duḍḍilla. Ellā pārṭinū ondē guru. Vōṭigōskara ēnu bēkādrū māḍtāre."
    en: "That's exactly what I'm saying. The money goes to the guarantees, and there's none for roads. All parties are the same, boss. They'll do anything for votes."
  - scene: "Prakash, who has been looking out of the window, turns around."
  - who: prakash
    t: "ಅರ್ಜುನ್, ತಪ್ಪು ತಿಳ್ಕೋಬ್ಯಾಡ್ರಿ. ಎರಡು ಸಾವಿರ ರೂಪಾಯಿ ನಿಮಗ ಒಂದು ಡಿನ್ನರ್. ನಮ್ ಅವ್ವಗ ಅದು ಒಂದು ತಿಂಗಳ ಔಷಧ. ನೀವು ಅದನ್ನ ‘ವೋಟಿಗೋಸ್ಕರ’ ಅಂತೀರಿ. ಅವ್ವ ಅದನ್ನ ‘ಮರ್ಯಾದೆ’ ಅಂತಾರ."
    tr: "Arjun, tappu tiḷkōbyāḍri. Eraḍu sāvira rūpāyi nimaga ondu ḍinnar. Nam avvaga adu ondu tiṅgaḷa auṣadha. Nīvu adanna ‘vōṭigōskara’ antīri. Avva adanna ‘maryāde’ antāra."
    en: "Arjun, don't take this wrongly. Two thousand rupees is one dinner for you. For my Avva it's a month of medicine. You call it ‘for votes’. Avva calls it ‘dignity’."
  - who: arjun
    t: "ಸರಿ, ಒಂದ್ ಮಟ್ಟಿಗೆ ಒಪ್ಪುತ್ತೀನಿ. ಆದ್ರೆ ಜಾತಿ ಸಮೀಕ್ಷೆ ವಿಷಯ ನೋಡು. ವರದಿ ಮೇ ತಿಂಗಳಲ್ಲಿ ಕೊಟ್ರು, ಹೊಸ ಸರ್ಕಾರ ಜಾರಿ ಮಾಡ್ತೀವಿ ಅಂತಿದೆ. ಮೀಸಲಾತಿ ಇನ್ನೂ ಜಾಸ್ತಿ ಮಾಡ್ತಾರಂತೆ. ಹೀಗೇ ಆದ್ರೆ ಮೆರಿಟ್‌ಗೆ ಬೆಲೆ ಎಲ್ಲಿ?"
    tr: "Sari, ond maṭṭige opputtīni. Ādre jāti samīkṣe viṣaya nōḍu. Varadi Mē tiṅgaḷalli koṭru, hosa sarkāra jāri māḍtīvi antide. Mīsalāti innū jāsti māḍtārante. Hīgē ādre meriṭ-ge bele elli?"
    en: "All right, I agree up to a point. But look at the caste survey. The report came in May, and the new government says it'll implement it. Apparently they'll raise the reservation further. If it goes on like this, where's the value of merit?"
  - who: shruti
    t: "ಅರ್ಜುನ್, ಬೇಡ. ಈ ವಿಷಯ ಕಾರಲ್ಲಿ ಬೇಡ."
    tr: "Arjun, bēḍa. Ī viṣaya kāralli bēḍa."
    en: "Arjun, don't. Not this topic, not in the car."
  - who: prakash
    t: "ಇಲ್ರಿ, ಮಾತಾಡ್ಲಿ. ಮೆರಿಟ್. ಛಲೋ ಶಬ್ದ. ಜಯನಗರದಾಗ ಹುಟ್ಟಿ, ಇಂಗ್ಲಿಷ್ ಸ್ಕೂಲ್, ಟ್ಯೂಷನ್, ಕೋಚಿಂಗ್, ಕಾರು. ಅದು ಮೆರಿಟ್. ಹಳ್ಳಿ ಸಾಲ್ಯಾಗ ಕಂದೀಲು ಬೆಳಕಿನಾಗ ಓದಿದ್ದು, ಅದು ಏನು? ಅದಕ್ಕ ಏನು ಹೆಸರು?"
    tr: "Illri, mātāḍli. Meriṭ. Chalō śabda. Jayanagaradāga huṭṭi, iṅgliṣ skūl, ṭyūṣan, kōchiṅg, kāru. Adu meriṭ. Haḷḷi sālyāga kandīlu beḷakināga ōdiddu, adu ēnu? Adakka ēnu hesaru?"
    en: "No, let him talk. Merit. A fine word. Born in Jayanagar, English school, tuition, coaching, a car. That's merit. Studying in a village school by the light of a kerosene lamp — what's that? What do you call that?"
  - scene: "Silence. Only the tyres on the road. Imran puts a hand on Prakash's shoulder."
  - who: imran
    t: "ಪ್ರಕಾಶಾ, ಬಿಡಪಾ. ಅರ್ಜುನ್ ಬೆಂಗಳೂರಿನ ಗುಳ್ಳೆಯಾಗ ಇರ್ತಾನ, ಅವನಿಗೆ ಗೊತ್ತಿಲ್ಲ. ಅರ್ಜುನ್, ನೀನು ಒಂದು ಸಲ ನಮ್ ಕಡೆ ಹಳ್ಳಿಗಳಿಗೆ ಬಾ. ಆಮೇಲೆ ಮೆರಿಟ್ ಬಗ್ಗೆ ಮಾತಾಡು."
    tr: "Prakāśā, biḍapā. Arjun Beṅgaḷūrina guḷḷeyāga irtāna, avanige gottilla. Arjun, nīnu ondu sala nam kaḍe haḷḷigaḷige bā. Āmēle meriṭ bagge mātāḍu."
    en: "Prakasha, let it go, man. Arjun lives in the Bengaluru bubble; he doesn't know. Arjun, come once to the villages on our side. Then talk about merit."
  - who: arjun
    t: "ಸರಿ, ಸರಿ. ಸಾರಿ, ಪ್ರಕಾಶ್. ನಾನು ಆ ಅರ್ಥದಲ್ಲಿ ಹೇಳ್ಲಿಲ್ಲ. ರಾಜಕೀಯ ಸಾಕು. ಪ್ರಕಾಶ್, ನೀನು ಕೆಎಎಸ್ ಬರೀತಿದ್ದೆಯಲ್ವಾ? ಏನಾಯ್ತು?"
    tr: "Sari, sari. Sāri, Prakāś. Nānu ā arthadalli hēḷlilla. Rājakīya sāku. Prakāś, nīnu Ke-e-es barītiddeyalvā? Ēnāytu?"
    en: "Okay, okay. Sorry, Prakash. I didn't mean it that way. Enough politics. Prakash, you were writing the KAS exam, weren't you? What happened?"
  - who: prakash
    t: "ಅದರ ಬಗ್ಗೆ ಇವತ್ತು ಬ್ಯಾಡ್ರಿ. ಧಾರವಾಡಕ್ಕೆ ಬಂದಾಗ ಹೇಳ್ತೇನಿ. ಈಗ ಹೋಳಿಗಿ ತಿನ್ರಿ."
    tr: "Adara bagge ivattu byāḍri. Dhāravāḍakke bandāga hēḷtēni. Īga hōḷigi tinri."
    en: "Not about that today. I'll tell you when we get to Dharwad. Now eat some holige."
  - scene: "He opens the steel box and passes it around. Shruti pours coffee from the flask into four paper cups. The argument sits in the car with them, quiet, like a fifth passenger."
  - who: shruti
    t: "ಹಿರಿಯೂರು ದಾಟಿದ್ರೆ ಇನ್ನು ನಲವತ್ತು ಕಿಲೋಮೀಟರ್. ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ಎಲ್ರೂ ಹೊಸದಾಗಿ ಶುರು ಮಾಡೋಣ, ಆಯ್ತಾ?"
    tr: "Hiriyūru dāṭidre innu nalavattu kilōmīṭar. Chitradurgadalli ellrū hosadāgi śuru māḍōṇa, āytā?"
    en: "After Hiriyur it's another forty kilometres. At Chitradurga let's all start fresh, okay?"
  - who: imran
    t: "ಡಾಕ್ಟರ್ ಸಲಹೆ: ಹೋಳಿಗಿ ತಿಂದ ಮೇಲೆ ಜಗಳ ಆಡಾಕ ಆಗೂದಿಲ್ಲ. ರಕ್ತದಾಗ ಸಕ್ಕರೆ ಜಾಸ್ತಿ ಆಗತೈತಿ, ಸಿಟ್ಟು ಕಡಿಮಿ ಆಗತೈತಿ."
    tr: "Ḍākṭar salahe: hōḷigi tinda mēle jagaḷa āḍāka āgūdilla. Raktadāga sakkare jāsti āgataiti, siṭṭu kaḍimi āgataiti."
    en: "Doctor's advice: after holige, you can't fight. The sugar in your blood goes up, and the anger comes down."
  - who: prakash
    t: "ಅದು ಯಾವ ಮೆಡಿಕಲ್ ಪುಸ್ತಕದಾಗ ಐತ್ರೀ ಡಾಕ್ಟ್ರೇ?"
    tr: "Adu yāva meḍikal pustakadāga aitrī ḍākṭrē?"
    en: "Which medical book is that in, Doctor?"
  - who: imran
    t: "ಕಲಬುರಗಿ ವೈದ್ಯಶಾಸ್ತ್ರ, ಮೊದಲ ಅಧ್ಯಾಯ. ನಾನೇ ಬರೆದೇನಿ."
    tr: "Kalaburagi vaidyaśāstra, modala adhyāya. Nānē baredēni."
    en: "Kalaburagi Medicine, Chapter One. I wrote it myself."
  - scene: "Prakash laughs for the first time since Sira. Ahead, the low granite hills of Chitradurga rise out of the plain."
  - who: shruti
    t: "ಪ್ರಕಾಶ್, ಟ್ರೇನಿಂಗ್ ಹೇಗಿತ್ತು? ಒಂದು ವಾರ ಪೂರ್ತಿ ಬೆಂಗಳೂರಲ್ಲಿ."
    tr: "Prakāś, ṭrēniṅg hēgittu? Ondu vāra pūrti Beṅgaḷūralli."
    en: "Prakash, how was the training? A whole week in Bengaluru."
  - who: prakash
    t: "ಟ್ರೇನಿಂಗ್ ಛಲೋ ಇತ್ತ್ರಿ. ಸ್ಮಾರ್ಟ್ ಕ್ಲಾಸ್, ಡಿಜಿಟಲ್ ಬೋರ್ಡ್ ಎಲ್ಲಾ ಹೇಳಿಕೊಟ್ರು. ಆದ್ರ ನಮ್ ಸಾಲ್ಯಾಗ ದಿನಕ್ಕ ನಾಕು ತಾಸು ಕರೆಂಟ್ ಇರಂಗಿಲ್ಲ. ಮೂರು ಮಾಸ್ತರ ಜಾಗ ಖಾಲಿ ಅವ. ಗಣಿತ, ವಿಜ್ಞಾನ, ಕೆಲವು ಸಲ ಇಂಗ್ಲೀಷ್ ಕೂಡ ನಾನೇ ಕಲಿಸ್ತೇನಿ."
    tr: "Ṭrēniṅg chalō ittri. Smārṭ klās, ḍijiṭal bōrḍ ellā hēḷikoṭru. Ādra nam sālyāga dinakka nāku tāsu kareṇṭ iraṅgilla. Mūru māstara jāga khāli ava. Gaṇita, vijñāna, kelavu sala iṅglīṣ kūḍa nānē kalistēni."
    en: "The training was good. They taught us smart classes, digital boards, all that. But in my school there's no power for four hours a day. Three teaching posts are vacant. Maths, science, sometimes even English — I teach them all myself."
  - who: shruti
    t: "ಇಂಗ್ಲೀಷ್ ಕೂಡ ನೀನೇನಾ?"
    tr: "Iṅglīṣ kūḍa nīnēnā?"
    en: "English too — you?"
  - who: prakash
    t: "ಹೌದ್ರಿ. ನಮ್ಮಂಥವರ ಇಂಗ್ಲೀಷ್ ಕೇಳಿ ಬೆಂಗಳೂರಿನವ್ರು ನಗ್ತಾರ. ಆದ್ರ ಹಳ್ಳಿ ಹುಡುಗರಿಗೆ ಅದೇ ಮೊದಲ ಬಾಗಿಲು. ಬಾಗಿಲು ಚಿಕ್ಕದಿದ್ರೂ ಬಾಗಿಲೇ."
    tr: "Haudri. Nammanthavara iṅglīṣ kēḷi Beṅgaḷūrinavru nagtāra. Ādra haḷḷi huḍugarige adē modala bāgilu. Bāgilu chikkadidrū bāgilē."
    en: "Yes. Bengaluru people laugh when they hear the English of people like us. But for village kids it's the first door. Even a small door is a door."
  - who: imran
    t: "ಖರೇ ಮಾತು. ನಮ್ ಕಡೆ ಹುಡುಗರಿಗೆ ಆ ಬಾಗಿಲು ತೆಗಿಯಾಕ ನಿನ್ನಂಥ ಮಾಸ್ತರ ಬೇಕು ಯಪ್ಪಾ."
    tr: "Kharē mātu. Nam kaḍe huḍugarige ā bāgilu tegiyāka ninnantha māstara bēku yappā."
    en: "That's the truth. Kids on our side need a teacher like you to open that door, yappa."
  - scene: "Arjun, at the wheel, hears the word 'laugh' and, for once, says nothing."
  - chapter: "Chapter 3 — Chitradurga fort"
  - section: "The seven-ringed fort"
    learn: "history words: kōṭe, ēḷu suttu, batēri, heb-bāgilu, pāḷēgāraru, kallu · reading a notice aloud (bookish -ide/-ttade): illi dhūmapāna niṣēdhisalāgide · a teacher's way of telling: kēḷri, ondu kathe aiti · teasing a teacher: mēṣṭru śuru māḍidru"
  - scene: "11:00 a.m. Chitradurga fort. Huge rounded granite boulders, walls winding over the hill in ring after ring. The December sun is already sharp. The two cars park near the main gate; schoolchildren in blue uniforms stream past in a line."
  - who: ramya
    t: "ಎಂತ ಚಂದ ಮರ್ರೆ! ಇದನ್ನ ಡ್ರೋನ್‌ನಲ್ಲಿ ಶೂಟ್ ಮಾಡ್ಬೇಕಿತ್ತು. ಬಂಡೆ ಮೇಲೆ ಬಂಡೆ, ಅದರ ಮೇಲೆ ಗೋಡೆ!"
    tr: "Enta chanda marre! Idanna ḍrōn-nalli śūṭ māḍbēkittu. Baṇḍe mēle baṇḍe, adara mēle gōḍe!"
    en: "How beautiful, man! I should have shot this with a drone. Boulder on boulder, and a wall on top of that!"
  - who: kaveri
    t: "ಡ್ರೋನ್ ಇಲ್ಲಿ ಅನುಮತಿ ಇಲ್ಲದೆ ಹಾರಿಸಬಾರದು, ರಮ್ಯಾ. ಬೋರ್ಡ್ ನೋಡು. ‘ಇದು ಕೇಂದ್ರ ಸಂರಕ್ಷಿತ ಸ್ಮಾರಕ. ಇಲ್ಲಿ ಹಾನಿ ಮಾಡುವುದು ಶಿಕ್ಷಾರ್ಹ ಅಪರಾಧವಾಗಿರುತ್ತದೆ.’"
    tr: "Ḍrōn illi anumati illade hārisabāradu, Ramyā. Bōrḍ nōḍu. ‘Idu kēndra saṁrakṣita smāraka. Illi hāni māḍuvudu śikṣārha aparādhavāgiruttade.’"
    en: "You can't fly a drone here without permission, Ramya. Look at the board. ‘This is a centrally protected monument. Damaging it is a punishable offence.’"
  - who: naveen
    t: "ವಕೀಲೆ ಬೋರ್ಡ್ ಓದಿದ್ರೆ ಅದೂ ಕೋರ್ಟ್ ತೀರ್ಪಿನ ಹಾಗೇ ಕೇಳ್ತದೆ ಮಾರಾಯ."
    tr: "Vakīle bōrḍ ōdidre adū kōrṭ tīrpina hāgē kēḷtade mārāya."
    en: "When the lawyer reads a board, even that sounds like a court verdict, maraya."
  - who: prakash
    t: "ಈ ಕೋಟೆಗೆ ‘ಏಳು ಸುತ್ತಿನ ಕೋಟೆ’ ಅಂತಾರ್ರಿ. ಏಳು ಸುತ್ತು ಗೋಡೆ. ಹದಿನೇಳನೇ, ಹದಿನೆಂಟನೇ ಶತಮಾನದಾಗ ನಾಯಕರು, ಅಂದ್ರ ಪಾಳೇಗಾರರು, ಇದನ್ನ ಭಾಳ ಗಟ್ಟಿ ಮಾಡಿದ್ರು. ಕೊನೆಯ ದೊರೆ ಮದಕರಿ ನಾಯಕ."
    tr: "Ī kōṭege ‘ēḷu suttina kōṭe’ antārri. Ēḷu suttu gōḍe. Hadinēḷanē, hadineṇṭanē śatamānadāga nāyakaru, andra pāḷēgāraru, idanna bhāḷa gaṭṭi māḍidru. Koneya dore Madakari Nāyaka."
    en: "They call this fort ‘the fort of seven rings’. Seven rings of walls. In the seventeenth and eighteenth centuries the Nayakas — the palegars — made it very strong. The last ruler was Madakari Nayaka."
  - who: arjun
    t: "ಓಹೋ, ಮೇಷ್ಟ್ರು ಕ್ಲಾಸ್ ಶುರು ಮಾಡಿದ್ರು. ಎಲ್ರೂ ಸಾಲಾಗಿ ನಿಂತ್ಕೊಳ್ಳಿ, ಹಾಜರಾತಿ ತಗೋತಾರೆ."
    tr: "Ōhō, mēṣṭru klās śuru māḍidru. Ellrū sālāgi nintkoḷḷi, hājarāti tagōtāre."
    en: "Oho, the schoolmaster has started his class. Everyone line up, he's taking attendance."
  - who: deepa
    t: "ಅರ್ಜುನ್, ಸುಮ್ನಿರು. ಪ್ರಕಾಶ್, ನೀನು ಹೇಳು. ನಾನು ಇಲ್ಲಿಗೆ ಶಾಲೆಯ ಪ್ರವಾಸದಲ್ಲಿ ಬಂದಿದ್ದೆ, ಎಲ್ಲಾ ಮರೆತುಹೋಗಿದೆ."
    tr: "Arjun, sumniru. Prakāś, nīnu hēḷu. Nānu illige śāleya pravāsadalli bandidde, ellā maretuhōgide."
    en: "Arjun, be quiet. Prakash, you tell it. I came here on a school trip, and I've forgotten everything."
  - who: prakash
    t: "ನೋಡ್ರಿ, ಈ ಗೋಡೆಗಳಿಗೆ ಸಿಮೆಂಟ್ ಇಲ್ಲ. ದೊಡ್ಡ ದೊಡ್ಡ ಕಲ್ಲುಗಳನ್ನ ಒಂದರ ಮೇಲೊಂದು ಕೂರಿಸ್ಯಾರ. ಮುನ್ನೂರು ವರ್ಷ ಆತು, ಇನ್ನೂ ನಿಂತಾವ. ಬೆಂಗಳೂರಿನ ಫ್ಲೈಓವರ್ ಹತ್ತು ವರ್ಷ ನಿಲ್ಲೂದಿಲ್ಲ."
    tr: "Nōḍri, ī gōḍegaḷige simeṇṭ illa. Doḍḍa doḍḍa kallugaḷanna ondara mēlondu kūrisyāra. Munnūru varṣa ātu, innū nintāva. Beṅgaḷūrina phlai-ōvar hattu varṣa nillūdilla."
    en: "Look, these walls have no cement. They set huge stones one on top of another. Three hundred years, and they're still standing. A Bengaluru flyover doesn't last ten."
  - who: imran
    t: "ಬರೋಬ್ಬರಿ ಹೇಳಿದಿ ನೋಡು! ಇದು ನಿಜವಾದ ಎಂಜಿನಿಯರಿಂಗ್. ನಾವು ಎಂಟು ಜನ ಎಂಜಿನಿಯರಿಂಗ್ ಓದೇವಿ, ಒಂದು ಗೋಡೆ ಭೀ ಕಟ್ಟಿಲ್ಲ."
    tr: "Barōbbari hēḷidi nōḍu! Idu nijavāda eñjiniyariṅg. Nāvu eṇṭu jana eñjiniyariṅg ōdēvi, ondu gōḍe bhī kaṭṭilla."
    en: "Spot on! This is real engineering. Eight of us studied engineering, and not one of us has built even a wall."
  - who: shruti
    t: "ನೀನು ಎಂಜಿನಿಯರಿಂಗ್ ಬಿಟ್ಟು ಡಾಕ್ಟರ್ ಆದೆ, ಇಮ್ರಾನ್. ನಾನು ಐಟಿ ಬಿಟ್ಟು ಅಮ್ಮ ಆದೆ. ಪ್ರಕಾಶ್ ಮೇಷ್ಟ್ರು ಆದ. ನಮ್ಮಲ್ಲಿ ಎಂಜಿನಿಯರ್ ಅಂತ ಉಳಿದಿರೋದು ದೀಪಾ ಒಬ್ಬಳೇ."
    tr: "Nīnu eñjiniyariṅg biṭṭu ḍākṭar āde, Imrān. Nānu ai-ṭi biṭṭu amma āde. Prakāś mēṣṭru āda. Nammalli eñjiniyar anta uḷidirōdu Dīpā obbaḷē."
    en: "You left engineering and became a doctor, Imran. I left IT and became a mother. Prakash became a teacher. The only one of us still an engineer is Deepa."
  - who: deepa
    t: "ಎಂಜಿನಿಯರ್ ಅಲ್ಲ ಕಣೇ, ಕೋಡ್ ಬರೆಯೋ ಮೆಷಿನ್. ಅದೂ ಈಗ ಎಐ ಬರೆದುಕೊಡುತ್ತೆ. ಸರಿ, ಪ್ರಕಾಶ್, ಮುಂದೆ?"
    tr: "Eñjiniyar alla kaṇē, kōḍ bareyō meṣin. Adū īga e-ai baredukoḍutte. Sari, Prakāś, munde?"
    en: "Not an engineer — a code-writing machine. And now AI writes even that. Okay, Prakash, what next?"
  - section: "Onake Obavva's window"
    learn: "telling a legend: oṁdu dina…, āga…, konege… · the story's words: onake (pestle), kiṇḍi (narrow opening), sainikaru, vīravanite, kāvalu · past habitual and sequence: baruttiddaru, hoḍedu ellegidaḷu · reported thought: ‘yārigū gottāgabāradu’ anta"
  - scene: "11:40 a.m. A narrow cleft between two boulders, just wide enough for one person to crawl through. A painted board above it reads ‘Onake Obavvana Kindi’. The schoolchildren crowd around it."
  - who: prakash
    t: "ಇದು ಓಬವ್ವನ ಕಿಂಡಿ. ಕೇಳ್ರಿ. ಹೈದರ್ ಅಲಿಯ ಸೈನ್ಯ ಈ ಕೋಟೆಯನ್ನ ಸುತ್ತುವರಿದಿತ್ತು. ಒಳಗೆ ಬರಾಕ ದಾರಿ ಸಿಗ್ಲಿಲ್ಲ. ಆಗ ಅವರಿಗೆ ಈ ಸಣ್ಣ ಕಿಂಡಿ ಕಾಣಿಸ್ತು."
    tr: "Idu Ōbavvana kiṇḍi. Kēḷri. Haidar Aliya sainya ī kōṭeyanna suttuvariditti. Oḷage barāka dāri siglilla. Āga avarige ī saṇṇa kiṇḍi kāṇistu."
    en: "This is Obavva's window. Listen. Hyder Ali's army had surrounded this fort. They couldn't find a way in. Then they spotted this narrow opening."
  - who: prakash
    t: "ಈ ಕಿಂಡಿಯ ಕಾವಲು ಕಹಳೆ ಮದ್ದಹನುಮಪ್ಪನದು. ಅವನು ಮಧ್ಯಾಹ್ನ ಊಟಕ್ಕೆ ಮನಿಗೆ ಹೋಗಿದ್ದ. ಅವನ ಹೆಂಡತಿ ಓಬವ್ವ ನೀರು ತರಾಕ ಬಂದಾಗ ಕಿಂಡಿಯಿಂದ ಸೈನಿಕರು ಒಬ್ಬೊಬ್ಬರಾಗಿ ಒಳಗೆ ಬರೋದು ನೋಡಿದ್ಲು."
    tr: "Ī kiṇḍiya kāvalu Kahaḷe Maddahanumappanadu. Avanu madhyāhna ūṭakke manige hōgidda. Avana heṇḍati Ōbavva nīru tarāka bandāga kiṇḍiyinda sainikaru obbobbarāgi oḷage barōdu nōḍidlu."
    en: "Guarding this window was Kahale Maddahanumappa's duty. He had gone home for his midday meal. His wife Obavva came to fetch water and saw soldiers coming through the window one by one."
  - who: ramya
    t: "ಆಮೇಲೆ? ಗಂಡನನ್ನ ಕರೀಲಿಲ್ವಾ?"
    tr: "Āmēle? Gaṇḍananna karīlilvā?"
    en: "And then? Didn't she call her husband?"
  - who: prakash
    t: "ಕರೆದ್ರ ಸೈನಿಕರಿಗೆ ಗೊತ್ತಾಗತೈತಿ. ಅದಕ್ಕ ಅವಳು ಮನಿಯಾಗಿನ ಒನಕಿ ತಗೊಂಡು ಕಿಂಡಿ ಪಕ್ಕ ನಿಂತ್ಲು. ಒಬ್ಬೊಬ್ಬ ಸೈನಿಕ ತಲೆ ಹೊರಗೆ ಹಾಕಿದ ಕೂಡ್ಲೇ ಒಂದೇ ಏಟು. ಹಿಂಗ ನೂರಾರು ಜನರನ್ನ ಎದುರಿಸಿದ್ಲು ಅಂತ ಜನಪದ ಹೇಳತೈತಿ."
    tr: "Karedra sainikarige gottāgataiti. Adakka avaḷu maniyāgina onaki tagoṇḍu kiṇḍi pakka nintlu. Obbobba sainika tale horage hākida kūḍlē ondē ēṭu. Hiṅga nūrāru janaranna edurisidlu anta janapada hēḷataiti."
    en: "If she called out, the soldiers would know. So she took the grain pestle from her house and stood beside the opening. The moment each soldier put his head through — one blow. The folk tradition says she faced hundreds of them like that."
  - who: kaveri
    t: "ಎಷ್ಟು ಜನ ಅನ್ನೋದು ಇತಿಹಾಸಕಾರರಲ್ಲಿ ಚರ್ಚೆ ಇದೆ ಅಂತ ಓದಿದ್ದೆ. ಆದ್ರೆ ಕಥೆಯ ಅರ್ಥ ಸ್ಪಷ್ಟ. ಕತ್ತಿ ಇರ್ಲಿಲ್ಲ, ಸೇನೆ ಇರ್ಲಿಲ್ಲ. ಮನೆಯ ಒನಕೆ, ಮತ್ತೆ ಧೈರ್ಯ."
    tr: "Eṣṭu jana annōdu itihāsakāraralli charche ide anta ōdidde. Ādre katheya artha spaṣṭa. Katti irlilla, sēne irlilla. Maneya onake, matte dhairya."
    en: "I'd read that historians debate how many there were. But the meaning of the story is clear. She had no sword, no army. A household pestle, and courage."
  - who: shruti
    t: "ಒಂದು ಮನೆ ಕೆಲಸದ ಸಾಮಾನು ಆಯುಧ ಆಯ್ತು. ಆದ್ಯಾಗೆ ಈ ಕಥೆ ಹೇಳ್ಬೇಕು. ಅವಳು ಎಲ್ಲಾ ಪ್ರಿನ್ಸೆಸ್ ಕಥೆ ಕೇಳ್ತಾಳೆ."
    tr: "Ondu mane kelasada sāmānu āyudha āytu. Ādyāge ī kathe hēḷbēku. Avaḷu ellā prinses kathe kēḷtāḷe."
    en: "A household tool became a weapon. I must tell Aadya this story. All she hears are princess stories."
  - who: prakash
    t: "ನನ್ ಸಾಲ್ಯಾಗ ಪ್ರತಿ ವರ್ಷ ನವೆಂಬರ್ ಹನ್ನೊಂದಕ್ಕೆ ಓಬವ್ವ ಜಯಂತಿ ಮಾಡ್ತೇವಿ. ಹೆಣ್ಣುಮಕ್ಕಳು ಒನಕಿ ಹಿಡಕೊಂಡು ನಾಟಕ ಮಾಡ್ತಾರ. ಭಾಳ ಜೋರಾಗಿ ಮಾಡ್ತಾರ್ರಿ, ಹುಡುಗರು ಹೆದರ್ತಾರ."
    tr: "Nan sālyāga prati varṣa Navembar hannondakke Ōbavva jayanti māḍtēvi. Heṇṇumakkaḷu onaki hiḍakoṇḍu nāṭaka māḍtāra. Bhāḷa jōrāgi māḍtārri, huḍugaru hedartāra."
    en: "In my school we celebrate Obavva Jayanti every year on the eleventh of November. The girls put on a play holding pestles. They do it really fiercely — the boys get scared."
  - section: "The joke"
    learn: "mimicry and mockery: aṇaku, kāpi māḍu, gēli māḍu, haḷḷi bhāṣe · the moment the laughter stops: naguvu nintu hōytu, mukha baṇṇa badalāytu · a teacher's quiet pain: makkaḷige hēḷtēni…, ivattu nanna geḷeyara munde"
  - scene: "Arjun steps up onto a rock in front of the kindi, takes a stick for a pestle, puts on a heavy, exaggerated imitation of Prakash's Dharwad speech, and performs for the group and the school children."
  - who: arjun
    t: "ಕೇಳ್ರೀ, ಕೇಳ್ರೀ ಮಕ್ಕಳ್ರೀ! ಓಬವ್ವ ಒನಕಿ ತಗೊಂಡಾಳ್ರೀ, ಹೈದರ್ ಅಲಿ ಬಂದಾನ್ರೀ, ಯಾಕ್ರೀ ಬಂದ್ರೀ ಅಂದಾಳ್ರೀ, ಢಣ್ ಅಂತ ಹೊಡದಾಳ್ರೀ! ಭಾಳ ಛಲೋ ಐತ್ರೀ!"
    tr: "Kēḷrī, kēḷrī makkaḷrī! Ōbavva onaki tagoṇḍāḷrī, Haidar Ali bandānrī, yākrī bandrī andāḷrī, ḍhaṇ anta hoḍadāḷrī! Bhāḷa chalō aitrī!"
    en: "Listen-ree, listen-ree, children-ree! Obavva took the pestle-ree, Hyder Ali came-ree, ‘Why'd you come-ree?’ she said-ree, and bang, she hit him-ree! Very nice it is-ree!"
  - scene: "A few of the schoolchildren giggle. Ramya laughs behind her phone. Naveen snorts once. Then Arjun drops the stick and goes on in his normal voice."
  - who: arjun
    t: "ನಾಲ್ಕು ವರ್ಷ ಕಾಲೇಜಲ್ಲಿ ಇವನು ಹೀಗೇ ಮಾತಾಡ್ತಿದ್ದ, ಗೊತ್ತಾ? ವೈವಾದಲ್ಲಿ ಎಕ್ಸ್‌ಟರ್ನಲ್ ‘ಯಾವ ಹಳ್ಳಿಯಪ್ಪಾ ನೀನು’ ಅಂತ ಕೇಳಿದ್ರು. ಇನ್ನೂ ಹಾಗೇ ಇದಾನೆ. ಮೇಷ್ಟ್ರು ಆದ್ಮೇಲೆ ಮಕ್ಕಳಿಗೂ ಇದೇ ಭಾಷೆ ಕಲಿಸ್ತಿದಾನೆ!"
    tr: "Nālku varṣa kālējalli ivanu hīgē mātāḍtidda, gottā? Vaivādalli ekstarnal ‘yāva haḷḷiyappā nīnu’ anta kēḷidru. Innū hāgē idāne. Mēṣṭru ādmēle makkaḷigū idē bhāṣe kalistidāne!"
    en: "For all his college years he talked just like this, you know? In the viva the external examiner asked him, ‘Which village are you from?’ He's still the same. Now he's a teacher, he's teaching the kids this same language!"
  - scene: "Nobody laughs now. Ramya lowers the phone. Prakash stands very still beside the boulder."
  - who: prakash
    t: "ಮುಗೀತೇನ್ರಿ, ಅರ್ಜುನ್?"
    tr: "Mugītēnri, Arjun?"
    en: "Are you finished, Arjun?"
  - who: arjun
    t: "ಏಯ್, ಜೋಕ್ ಮಗಾ. ಕಾಲೇಜಲ್ಲಿ ನಾವು ಹೀಗೇ ಆಡ್ತಿದ್ವಿ ಅಲ್ವಾ? ನೀನೇ ನಗ್ತಿದ್ದೆ."
    tr: "Ēy, jōk magā. Kālējalli nāvu hīgē āḍtidvi alvā? Nīnē nagtidde."
    en: "Hey, it's a joke, maga. We used to do this in college, didn't we? You used to laugh yourself."
  - who: prakash
    t: "ನಗ್ತಿದ್ದೆ. ಯಾಕಂದ್ರ ಹದಿನೆಂಟು ವರ್ಷದ ಹುಡುಗ, ಹಾಸ್ಟೆಲ್‌ನಾಗ ಒಬ್ಬನೇ, ಬೇರೆ ದಾರಿ ಇರ್ಲಿಲ್ಲ. ನೀವು ನಗತಿದ್ರಿ, ನಾನೂ ನಗತಿದ್ದೆ. ರಾತ್ರಿ ರೂಮಿನ್ಯಾಗ ‘ಬೆಂಗಳೂರು ಕನ್ನಡ’ ಪ್ರಾಕ್ಟೀಸ್ ಮಾಡತಿದ್ದೆ. ನಿಮಗ ಗೊತ್ತಿರ್ಲಿಲ್ಲ."
    tr: "Nagtidde. Yākandra hadineṇṭu varṣada huḍuga, hāsṭel-nāga obbanē, bēre dāri irlilla. Nīvu nagatidri, nānū nagatidde. Rātri rūminyāga ‘Beṅgaḷūru Kannaḍa’ prākṭīs māḍatidde. Nimaga gottirlilla."
    en: "I laughed. Because I was an eighteen-year-old boy, alone in the hostel, with no other choice. You laughed, so I laughed too. At night in my room I used to practise ‘Bengaluru Kannada’. You didn't know that."
  - who: prakash
    t: "ಈಗ ನಾನು ಸಾಲ್ಯಾಗ ಮಕ್ಕಳಿಗೆ ಹೇಳ್ತೇನಿ, ‘ನಿಮ್ಮ ಮಾತಿನ ಬಗ್ಗೆ ನಾಚಿಕೆ ಪಡಬ್ಯಾಡ್ರಿ’ ಅಂತ. ಇವತ್ತು ನನ್ ಗೆಳೆಯರ ಮುಂದೆ, ಆ ಮಕ್ಕಳ ಮುಂದೆ, ನಾನೇ ಒಂದು ಜೋಕ್ ಆದೆ. ಆತು. ಛಲೋ ಆತು."
    tr: "Īga nānu sālyāga makkaḷige hēḷtēni, ‘nimma mātina bagge nāchike paḍabyāḍri’ anta. Ivattu nan geḷeyara munde, ā makkaḷa munde, nānē ondu jōk āde. Ātu. Chalō ātu."
    en: "Now in my school I tell the children, ‘Don't be ashamed of the way you speak.’ Today, in front of my friends, in front of those children, I became the joke. Fine. That's just fine."
  - scene: "He turns and walks up the stone steps towards the next ring of the wall without looking back. The schoolteacher leading the children quickly moves them on."
  - section: "No dialect is lesser"
    learn: "answering seriously: tamāṣe alla idu, ondu mātu hēḷtīni kēḷu · dignity of speech: yāva bhāṣeyū kīḷalla, uccāraṇe, prādēśika bhāṣe · facts as arguments: Bēndre, Jñānapīṭha, Dhāravāḍada Kannaḍa · Kalaburagi: avamāna, ijjat, āru tiṅgaḷu mātāḍlilla"
  - who: imran
    t: "ಅರ್ಜುನ್, ಒಂದು ಮಾತು ಹೇಳ್ತೇನಿ, ಕೇಳು. ಎಂಬಿಬಿಎಸ್ ಮೊದಲ ವರ್ಷ, ಬೆಂಗಳೂರಾಗ. ನಾನು ಕ್ಲಾಸ್‌ನಾಗ ಒಂದು ಪ್ರಶ್ನೆಗೆ ಉತ್ತರ ಕೊಟ್ಟೆ. ಮೂವತ್ತು ಜನ ನಕ್ಕರು, ನನ್ ಉತ್ತರಕ್ಕಲ್ಲ, ನನ್ ‘ಐತಿ’ಗೆ."
    tr: "Arjun, ondu mātu hēḷtēni, kēḷu. Em-bi-bi-es modala varṣa, Beṅgaḷūrāga. Nānu klās-nāga ondu praśnege uttara koṭṭe. Mūvattu jana nakkaru, nan uttarakkalla, nan ‘aiti’ge."
    en: "Arjun, let me tell you something; listen. First year of MBBS, in Bengaluru. I answered a question in class. Thirty people laughed — not at my answer, at my ‘aiti’."
  - who: imran
    t: "ಆಮೇಲೆ ಆರು ತಿಂಗಳು ನಾನು ಕ್ಲಾಸ್‌ನಾಗ ಬಾಯಿ ಬಿಡಲಿಲ್ಲ. ಆರು ತಿಂಗಳು. ಗೊತ್ತಿದ್ದ ಉತ್ತರಾನೂ ಹೇಳಲಿಲ್ಲ. ಒಂದು ನಗು ಒಬ್ಬ ಮನುಷ್ಯನ ಬಾಯಿ ಮುಚ್ಚಿಸಬಹುದು. ನಾನು ಡಾಕ್ಟರ್, ಇದು ನನ್ ಡಯಾಗ್ನೋಸಿಸ್."
    tr: "Āmēle āru tiṅgaḷu nānu klās-nāga bāyi biḍalilla. Āru tiṅgaḷu. Gottidda uttarānū hēḷalilla. Ondu nagu obba manuṣyana bāyi mucchisabahudu. Nānu ḍākṭar, idu nan ḍayāgnōsis."
    en: "After that, for six months I didn't open my mouth in class. Six months. I didn't give even the answers I knew. One laugh can shut a person's mouth. I'm a doctor; that's my diagnosis."
  - who: arjun
    t: "ಇಮ್ರಾನ್, ಅದು ಬೇರೆ. ಅವರು ಅಪರಿಚಿತರು. ನಾವು ಗೆಳೆಯರು. ಗೆಳೆಯರ ಮಧ್ಯೆ ಸ್ವಲ್ಪ ಕಾಲೆಳಿಯೋದು ತಪ್ಪಾ?"
    tr: "Imrān, adu bēre. Avaru aparichitaru. Nāvu geḷeyaru. Geḷeyara madhye svalpa kāleḷiyōdu tappā?"
    en: "Imran, that's different. They were strangers. We're friends. Is it wrong to pull a friend's leg a little?"
  - who: kaveri
    t: "ಕಾಲೆಳಿಯೋದು ತಪ್ಪಲ್ಲ, ಅರ್ಜುನ್. ಆದ್ರೆ ನೀನು ಎಳೆದದ್ದು ಅವನ ಕಾಲಲ್ಲ, ಅವನ ಊರು. ಅವನ ಅಮ್ಮನ ಮಾತು. ಅವನ ಮಕ್ಕಳ ಮಾತು. ‘ಹಳ್ಳಿ ಭಾಷೆ’ ಅಂದೆ ನೀನು. ಅದು ಜೋಕ್ ಅಲ್ಲ, ಅದು ತೀರ್ಪು."
    tr: "Kāleḷiyōdu tappalla, Arjun. Ādre nīnu eḷedaddu avana kālalla, avana ūru. Avana ammana mātu. Avana makkaḷa mātu. ‘Haḷḷi bhāṣe’ ande nīnu. Adu jōk alla, adu tīrpu."
    en: "Pulling a leg isn't wrong, Arjun. But what you pulled wasn't his leg — it was his hometown. His mother's speech. His students' speech. ‘Village language,’ you said. That's not a joke, that's a verdict."
  - who: kaveri
    t: "ನನ್ನ ಕನ್ನಡಕ್ಕೂ ಕೊಡವ ಉಚ್ಚಾರಣೆ ಇದೆ. ಕೋರ್ಟ್‌ನಲ್ಲಿ ಒಬ್ಬ ಹಿರಿಯ ವಕೀಲರು ‘ಮೇಡಂ, ನೀವು ಕನ್ನಡ ಎಲ್ಲಿ ಕಲಿತಿರಿ?’ ಅಂತ ಕೇಳಿದ್ರು. ನಾನು ‘ನನ್ನ ಅಜ್ಜಿಯಿಂದ’ ಅಂದೆ. ಅವರ ಬಾಯಿ ಮುಚ್ಚಿತು."
    tr: "Nanna Kannaḍakkū Koḍava uchchāraṇe ide. Kōrṭ-nalli obba hiriya vakīlaru ‘mēḍam, nīvu Kannaḍa elli kalitiri?’ anta kēḷidru. Nānu ‘nanna ajjiyinda’ ande. Avara bāyi mucchitu."
    en: "My Kannada has a Kodava accent too. In court a senior advocate once asked, ‘Madam, where did you learn Kannada?’ I said, ‘From my grandmother.’ That shut him up."
  - who: kaveri
    t: "ಒಂದು ವಿಷಯ ನೆನಪಿಡು. ದ.ರಾ. ಬೇಂದ್ರೆ ಬರೆದದ್ದು ಧಾರವಾಡದ ಕನ್ನಡದಲ್ಲಿ. ಜ್ಞಾನಪೀಠ ಬಂತು ಅವರಿಗೆ. ‘ಸ್ಟ್ಯಾಂಡರ್ಡ್ ಕನ್ನಡ’ ಅನ್ನೋದು ಮೈಸೂರು-ಬೆಂಗಳೂರಿನ ಅಧಿಕಾರದ ಭಾಷೆ ಅಷ್ಟೇ. ಯಾವ ಪ್ರಾದೇಶಿಕ ಮಾತೂ ಕೀಳಲ್ಲ."
    tr: "Ondu viṣaya nenapiḍu. Da.Rā. Bēndre baredaddu Dhāravāḍada Kannaḍadalli. Jñānapīṭha bantu avarige. ‘Sṭyāṇḍarḍ Kannaḍa’ annōdu Maisūru-Beṅgaḷūrina adhikārada bhāṣe aṣṭē. Yāva prādēśika mātū kīḷalla."
    en: "Remember one thing. D.R. Bendre wrote in Dharwad Kannada. He got the Jnanpith. What we call ‘standard Kannada’ is just the language of Mysuru–Bengaluru power. No regional speech is lesser."
  - who: deepa
    t: "ನಾನೂ ಒಂದು ಒಪ್ಪಿಕೊಳ್ಳಬೇಕು. ಮೈಸೂರಲ್ಲಿ ಚಿಕ್ಕಂದಿನಿಂದ ‘ನಮ್ಮ ಕನ್ನಡವೇ ಶುದ್ಧ’ ಅಂತ ಕೇಳಿ ಬೆಳೆದೆ. ಅದು ಹೆಮ್ಮೆ ಅಂತ ಅಂದ್ಕೊಂಡಿದ್ದೆ. ಈಗ ಅನ್ಸುತ್ತೆ, ಅದು ಸ್ವಲ್ಪ ಅಹಂಕಾರನೂ ಹೌದು."
    tr: "Nānū ondu oppikoḷḷabēku. Maisūralli chikkandininda ‘namma Kannaḍavē śuddha’ anta kēḷi beḷede. Adu hemme anta andkoṇḍidde. Īga ansutte, adu svalpa ahaṅkāranū haudu."
    en: "I have to admit something too. In Mysuru I grew up hearing, ‘Our Kannada is the pure one.’ I thought that was pride. Now I feel it's a bit of arrogance too."
  - who: ramya
    t: "ನನಗೆ ಚಾನೆಲ್‌ಗೆ ಸೇರಿದ ಮೊದಲ ವಾರ ಬಾಸ್ ಹೇಳಿದ್ರು, ‘ಆನ್ ಏರ್ ‘ಹೋತೆ, ಬತ್ತೆ’ ಎಲ್ಲಾ ಬೇಡ, ಬೆಂಗಳೂರು ಕನ್ನಡ ಮಾತಾಡು’ ಅಂತ. ಹನ್ನೆರಡು ವರ್ಷ ಆಯ್ತು, ಟಿವಿಯಲ್ಲಿ ನನ್ನ ಊರಿನ ಮಾತು ಒಂದು ಸಲನೂ ಆಡಿಲ್ಲ. ಮನೆಗೆ ಫೋನ್ ಮಾಡಿದಾಗ ಮಾತ್ರ ನಾನು ನಾನಾಗ್ತೇನೆ."
    tr: "Nanage chānel-ge sērida modala vāra bās hēḷidru, ‘ān ēr ‘hōte, batte’ ellā bēḍa, Beṅgaḷūru Kannaḍa mātāḍu’ anta. Hanneraḍu varṣa āytu, ṭiviyalli nanna ūrina mātu ondu salanū āḍilla. Manege phōn māḍidāga mātra nānu nānāgtēne."
    en: "The first week I joined the channel, my boss said, ‘On air, none of this hote, batte — speak Bengaluru Kannada.’ Twelve years now, and I've never once spoken my hometown's language on TV. Only when I call home do I become myself."
  - who: shruti
    t: "ಮತ್ತೆ ನಮ್ಮ ಬೆಂಗಳೂರು ಕನ್ನಡಕ್ಕೆ ಹಳೆ ಪಂಡಿತರು ‘ಕಂಗ್ಲಿಷ್, ಕನ್ನಡನೇ ಅಲ್ಲ’ ಅಂತಾರೆ. ಎಲ್ಲರೂ ಯಾರನ್ನಾದ್ರೂ ಕೀಳಾಗಿ ನೋಡ್ತಾರೆ. ಅದೇ ತಮಾಷೆ."
    tr: "Matte namma Beṅgaḷūru Kannaḍakke haḷe paṇḍitaru ‘Kaṅgliṣ, Kannaḍanē alla’ antāre. Ellarū yārannādrū kīḷāgi nōḍtāre. Adē tamāṣe."
    en: "And the old scholars call our Bengaluru Kannada ‘Kanglish — not Kannada at all.’ Everybody looks down on somebody. That's the joke."
  - who: naveen
    t: "ನಮ್ಮ ಮಂಗಳೂರು ಕನ್ನಡ ಕೇಳಿ ಬೆಂಗಳೂರಲ್ಲಿ ‘ಮಲಯಾಳಿನಾ?’ ಅಂತ ಕೇಳ್ತಾರೆ ಮಾರಾಯ. ಪ್ರತಿ ಸಲ ನಗ್ತೇನೆ. ಆದ್ರೆ ಒಳಗೆ ಸ್ವಲ್ಪ ಚುಚ್ಚುತ್ತದೆ."
    tr: "Namma Maṅgaḷūru Kannaḍa kēḷi Beṅgaḷūralli ‘Malayāḷinā?’ anta kēḷtāre mārāya. Prati sala nagtēne. Ādre oḷage svalpa chuchchuttade."
    en: "When people in Bengaluru hear our Mangaluru Kannada, they ask, ‘Are you Malayali?’, maraya. I laugh every time. But inside, it pricks a little."
  - who: imran
    t: "ನೋಡ್ರಿ, ಎಲ್ಲಾರೂ ನಗ್ತೇವಿ, ಎಲ್ಲಾರಿಗೂ ಚುಚ್ಚತೈತಿ. ಯಾರೂ ಬಾಯಿಬಿಟ್ಟು ಹೇಳಂಗಿಲ್ಲ, ಅಷ್ಟೇ."
    tr: "Nōḍri, ellārū nagtēvi, ellārigū chuchchataiti. Yārū bāyibiṭṭu hēḷaṅgilla, aṣṭē."
    en: "See, we all laugh, and it pricks all of us. Nobody says it out loud, that's all."
  - section: "The first real fight"
    learn: "getting defensive: sumne jōk māḍde, ellrū ōvar sensiṭiv, ivāga ēnū mātāḍōke āgalla · taking sides: nānu Prakāśna kaḍe, nīnu tappu māḍde · rhetorical questions: nānēn kolle māḍidīna?, ēn māḍbēku īga, kāl hiḍībēkā? · calming: svalpa samādhāna, ellrū ondu nimiṣa"
  - who: arjun
    t: "ಓಕೆ, ಓಕೆ, ಸಾಕು! ಎಲ್ರೂ ಸೇರಿ ನನ್ನ ಮೇಲೆ ಕೇಸ್ ಹಾಕಿ. ಒಂದು ಜೋಕ್ ಮಾಡಿದೆ, ನಾನೇನ್ ಕೊಲೆ ಮಾಡಿದೀನಾ? ಈಗ ಎಲ್ರೂ ಓವರ್ ಸೆನ್ಸಿಟಿವ್. ಏನೂ ಮಾತಾಡೋಕೇ ಆಗಲ್ಲ."
    tr: "Ōke, ōke, sāku! Ellrū sēri nanna mēle kēs hāki. Ondu jōk māḍide, nānēn kole māḍidīnā? Īga ellrū ōvar sensiṭiv. Ēnū mātāḍōkē āgalla."
    en: "Okay, okay, enough! Go on, all of you, file a case against me. I made one joke — did I commit murder? Everyone's oversensitive these days. You can't say anything any more."
  - who: shruti
    t: "ಅರ್ಜುನ್, ನೀನು ಯಾವಾಗ್ಲೂ ಹೀಗೇ. ಯಾರಿಗಾದ್ರೂ ನೋವಾದ್ರೆ ತಪ್ಪು ಅವರದ್ದು, ಯಾಕಂದ್ರೆ ಅವರು ‘ಸೆನ್ಸಿಟಿವ್’. ಹದಿನಾಲ್ಕು ವರ್ಷ ಆದ್ರೂ ಈ ಬುದ್ಧಿ ಬದಲಾಗಿಲ್ಲ."
    tr: "Arjun, nīnu yāvāglū hīgē. Yārigādrū nōvādre tappu avaraddu, yākandre avaru ‘sensiṭiv’. Hadinālku varṣa ādrū ī buddhi badalāgilla."
    en: "Arjun, you're always like this. If someone gets hurt, it's their fault, because they're ‘sensitive’. Fourteen years, and this habit hasn't changed."
  - who: arjun
    t: "ಓಹೋ, ಈಗ ಅದಕ್ಕೂ ಇದಕ್ಕೂ ಸಂಬಂಧ ಬಂತಾ? ಶ್ರುತಿ, ಹಳೆಯ ಲೆಕ್ಕ ಇಲ್ಲಿ ಬೇಡ."
    tr: "Ōhō, īga adakkū idakkū sambandha bantā? Śruti, haḷeya lekka illi bēḍa."
    en: "Oho, so now there's a connection between that and this? Shruti, don't settle old accounts here."
  - who: shruti
    t: "ನಾನು ಯಾವ ಲೆಕ್ಕನೂ ಹೇಳ್ಲಿಲ್ಲ. ನೀನೇ ಅಂದ್ಕೊಂಡೆ."
    tr: "Nānu yāva lekkanū hēḷlilla. Nīnē andkoṇḍe."
    en: "I didn't mention any account. You thought of it yourself."
  - who: naveen
    t: "ಅರ್ಜುನ್, ನಾನೂ ನಕ್ಕೆ, ಮೊದಲಿಗೆ. ಅದಕ್ಕೆ ನಂಗೂ ನಾಚಿಕೆ ಆಗ್ತದೆ. ಆದ್ರೆ ನಿನಗೆ ಎಲ್ಲವೂ ಜೋಕ್, ಎಲ್ಲವೂ ಸುಲಭ. ಬೇರೆಯವರಿಗೆ ಅದರ ಬೆಲೆ ಎಷ್ಟು ಅಂತ ನೀನು ಯಾವತ್ತೂ ಯೋಚನೆ ಮಾಡುದಿಲ್ಲ."
    tr: "Arjun, nānū nakke, modalige. Adakke naṅgū nāchike āgtade. Ādre ninage ellavū jōk, ellavū sulabha. Bēreyavarige adara bele eṣṭu anta nīnu yāvattū yōchane māḍudilla."
    en: "Arjun, I laughed too, at first. I'm ashamed of that. But for you, everything's a joke, everything's easy. You never think what it costs other people."
  - scene: "Arjun looks at Naveen for a second too long. Naveen doesn't look away."
  - who: arjun
    t: "‘ಬೆಲೆ’? ಏನು ಹೇಳ್ಬೇಕು ಅಂತಿದೀಯ ನವೀನ್? ನೇರವಾಗಿ ಹೇಳು."
    tr: "‘Bele’? Ēnu hēḷbēku antidīya Navīn? Nēravāgi hēḷu."
    en: "‘What it costs’? What are you trying to say, Naveen? Say it straight."
  - who: naveen
    t: "ಏನೂ ಇಲ್ಲ. ಇವತ್ತು ವಿಷಯ ಪ್ರಕಾಶ್. ಅಷ್ಟೇ."
    tr: "Ēnū illa. Ivattu viṣaya Prakāś. Aṣṭē."
    en: "Nothing. Today the subject is Prakash. That's all."
  - who: deepa
    t: "ಪ್ಲೀಸ್, ಎಲ್ರೂ ಒಂದು ನಿಮಿಷ ಸುಮ್ನಿರಿ. ಎಂಟು ವರ್ಷದ ಮೇಲೆ ಎಲ್ರೂ ಒಟ್ಟಿಗೆ ಸಿಕ್ಕಿದೀವಿ. ಮೊದಲ ದಿನವೇ ಇಷ್ಟು ಜಗಳ ಬೇಕಾ? ಅರ್ಜುನ್, ನೀನು ಹೋಗಿ ಪ್ರಕಾಶ್ ಹತ್ರ ಮಾತಾಡು. ನಾವೆಲ್ಲ ಇಲ್ಲೇ ಇರ್ತೀವಿ."
    tr: "Plīs, ellrū ondu nimiṣa sumniri. Eṇṭu varṣada mēle ellrū oṭṭige sikkidīvi. Modala dinavē iṣṭu jagaḷa bēkā? Arjun, nīnu hōgi Prakāś hatra mātāḍu. Nāvella illē irtīvi."
    en: "Please, everyone, be quiet for one minute. All of us together for the first time in eight years. Do we need this much fighting on the very first day? Arjun, go and talk to Prakash. The rest of us will stay right here."
  - who: arjun
    t: "ಏನ್ ಮಾತಾಡ್ಬೇಕು? ಹೋಗಿ ಕಾಲು ಹಿಡೀಬೇಕಾ?"
    tr: "Ēn mātāḍbēku? Hōgi kālu hiḍībēkā?"
    en: "Talk about what? Should I go and fall at his feet?"
  - who: imran
    t: "ಕಾಲು ಹಿಡೀಬ್ಯಾಡ. ಕೈ ಹಿಡಿ. ಅಷ್ಟು ಸಾಕು. ಆದ್ರ ಮನಸಿನಿಂದ ಹಿಡಿ, ಅರ್ಜುನ್. ನಾಟಕ ಬ್ಯಾಡ."
    tr: "Kālu hiḍībyāḍa. Kai hiḍi. Aṣṭu sāku. Ādra manasininda hiḍi, Arjun. Nāṭaka byāḍa."
    en: "Don't hold his feet. Hold his hand. That's enough. But do it from the heart, Arjun. No drama."
  - scene: "Arjun breathes out hard, shoves his hands into his pockets, and climbs the steps after Prakash. Ramya has stopped filming. She puts her phone in her bag."
  - scene: "The fourth ring of the wall. Prakash sits on the warm parapet, looking down at the town. Arjun arrives, out of breath, and stands a few feet away."
  - who: arjun
    t: "ಪ್ರಕಾಶ್… ಎಷ್ಟು ಮೆಟ್ಟಿಲು ಮಗಾ ಇಲ್ಲಿ. ಉಸಿರೇ ಹೋಯ್ತು."
    tr: "Prakāś… eṣṭu meṭṭilu magā illi. Usirē hōytu."
    en: "Prakash… so many steps up here, maga. I'm completely out of breath."
  - who: prakash
    t: "ಏಳು ಸುತ್ತಿನ ಕೋಟಿ ಅಲ್ಲೇನ್ರಿ. ಒಂದೊಂದು ಸುತ್ತು ಹತ್ತೂದು ಸುಲಭ ಅಲ್ಲ. ಮನುಷ್ಯನ ಮನಸ್ಸೂ ಹಂಗೇ."
    tr: "Ēḷu suttina kōṭi allēnri. Ondondu suttu hattūdu sulabha alla. Manuṣyana manassū haṅgē."
    en: "It's the seven-ringed fort, isn't it. Climbing each ring isn't easy. A man's mind is the same."
  - who: arjun
    t: "ಕೆಳಗೆ ಎಲ್ರೂ ಸೇರಿ ನನ್ನನ್ನ ವಿಲನ್ ಮಾಡಿದ್ರು. ಒಂದು ಜೋಕ್‌ಗೆ ಇಷ್ಟೆಲ್ಲಾ. ನೀನಾದ್ರೂ ಹೇಳು, ನಾನು ಕೆಟ್ಟವನಾ?"
    tr: "Keḷage ellrū sēri nannanna vilan māḍidru. Ondu jōk-ge iṣṭellā. Nīnādrū hēḷu, nānu keṭṭavanā?"
    en: "Down there they all ganged up and made me the villain. All this over one joke. You tell me, at least — am I a bad person?"
  - who: prakash
    t: "ನೋಡ್ರಿ, ಮತ್ತ ನಿಮ್ ಬಗ್ಗೆನೇ ಕೇಳಾಕತ್ತೀರಿ. ಕೆಟ್ಟವ್ರು ಅಂತ ನಾ ಹೇಳಿಲ್ಲ. ನೋವಾತು ಅಂತ ಹೇಳಿದೆ. ಎರಡೂ ಒಂದೇ ಅಲ್ಲ."
    tr: "Nōḍri, matta nim baggenē kēḷākattīri. Keṭṭavru anta nā hēḷilla. Nōvātu anta hēḷide. Eraḍū ondē alla."
    en: "See, you're asking about yourself again. I never said you're bad. I said it hurt. The two aren't the same."
  - who: arjun
    t: "ನೀನು ರಾತ್ರಿ ರೂಮಲ್ಲಿ ಬೆಂಗಳೂರು ಕನ್ನಡ ಪ್ರ್ಯಾಕ್ಟೀಸ್ ಮಾಡ್ತಿದ್ದೆ ಅಂದ್ಯಲ್ಲ… ನಿಜವಾಗ್ಲೂ? ನನಗೆ ಗೊತ್ತೇ ಇರ್ಲಿಲ್ಲ."
    tr: "Nīnu rātri rūmalli Beṅgaḷūru Kannaḍa pryākṭīs māḍtidde andyalla… nijavāglū? Nanage gottē irlilla."
    en: "You said you used to practise Bengaluru Kannada in your room at night… really? I never knew."
  - who: prakash
    t: "ಗೊತ್ತಾಗಾಕ ನೀವು ಒಮ್ಮೆನೂ ಕೇಳಿರಲಿಲ್ಲ. ನಾಕು ವರ್ಷದಾಗ ಒಮ್ಮೆನೂ."
    tr: "Gottāgāka nīvu ommenū kēḷiralilla. Nāku varṣadāga ommenū."
    en: "For you to know, you'd have had to ask. Not once in four years."
  - who: arjun
    t: "ಸರಿ… ಕೆಳಗೆ ಊಟಕ್ಕೆ ಬಾ. ಎಲ್ರ ಮುಂದೆ ಏನೋ ಹೇಳ್ತೀನಿ."
    tr: "Sari… keḷage ūṭakke bā. Ellra munde ēnō hēḷtīni."
    en: "Okay… come down for lunch. I'll say something in front of everyone."
  - who: prakash
    t: "ಎಲ್ಲಾರ ಮುಂದ ಹೇಳೂದು ಮುಖ್ಯ ಅಲ್ಲ. ಏನು ಹೇಳ್ತೀರಿ ಅನ್ನೂದು ಮುಖ್ಯ. ನಡೀರಿ."
    tr: "Ellāra munda hēḷūdu mukhya alla. Ēnu hēḷtīri annūdu mukhya. Naḍīri."
    en: "Saying it in front of everyone isn't what matters. What you say is what matters. Let's go."
  - section: "Lunch and a half-apology"
    learn: "North-Karnataka meal words: jōḷada roṭṭi, eṇṇigāyi, śēṅgā chaṭni, mosaru, khānāvaḷi · mandakki-menasinakāyi · the conditional non-apology: ninage bējārāgidre sāri · the real thing, by contrast: nānu tappu māḍde · cool politeness: ātu biḍri, ūṭa māḍōṇu, paravāgilla"
  - scene: "1:30 p.m. A small khanavali at the foot of the fort. Steel plates on a long table: jowar rotti, stuffed brinjal, a green leafy palya, peanut chutney powder, curd. A side plate of mandakki with fried green chillies. Arjun and Prakash come in last, a few steps apart."
  - who: naveen
    t: "ಬನ್ನಿ ಬನ್ನಿ, ರೊಟ್ಟಿ ತಣ್ಣಗಾಗ್ತದೆ. ಪ್ರಕಾಶ್, ನೀನು ಇಲ್ಲಿ ಕೂತ್ಕೋ, ನನ್ನ ಪಕ್ಕ."
    tr: "Banni banni, roṭṭi taṇṇagāgtade. Prakāś, nīnu illi kūtkō, nanna pakka."
    en: "Come, come, the rotti is getting cold. Prakash, you sit here, next to me."
  - who: arjun
    t: "ಎಲ್ರೂ ಕೇಳಿ. ಮತ್ತೆ ಪ್ರಕಾಶ್… ಮೇಲೆ ಆಗಿದ್ದು… ನಿನಗೆ ಬೇಜಾರಾಗಿದ್ರೆ ಸಾರಿ, ಮಗಾ. ನಾನು ಕೆಟ್ಟ ಉದ್ದೇಶದಿಂದ ಮಾಡ್ಲಿಲ್ಲ. ನಿಂಗೆ ಗೊತ್ತಲ್ವಾ, ನಾನು ಹಾಗೇ."
    tr: "Ellrū kēḷi. Matte Prakāś… mēle āgiddu… ninage bējārāgidre sāri, magā. Nānu keṭṭa uddēśadinda māḍlilla. Niṅge gottalvā, nānu hāgē."
    en: "Listen, everyone. And Prakash… what happened up there… if you felt bad, sorry, maga. I didn't do it with bad intentions. You know me — that's just how I am."
  - who: prakash
    t: "ಆತು ಬಿಡ್ರಿ. ಪರವಾಗಿಲ್ಲ. ಊಟ ಮಾಡೋಣು."
    tr: "Ātu biḍri. Paravāgilla. Ūṭa māḍōṇu."
    en: "That's fine. Never mind. Let's eat."
  - scene: "He says it politely, with a small smile, and passes Arjun the chutney powder without meeting his eyes."
  - who: kaveri
    t: "‘ಬೇಜಾರಾಗಿದ್ರೆ ಸಾರಿ’. ಕೋರ್ಟ್‌ನಲ್ಲಿ ಇದನ್ನ ‘ಷರತ್ತುಬದ್ಧ ಕ್ಷಮೆ’ ಅಂತೀವಿ. ತಪ್ಪು ಒಪ್ಪಿಕೊಳ್ಳೋದಿಲ್ಲ, ಆದ್ರೆ ಕ್ಷಮೆ ಕೇಳಿದ ಹಾಗೆ ಕಾಣುತ್ತೆ."
    tr: "‘Bējārāgidre sāri’. Kōrṭ-nalli idanna ‘ṣarattubaddha kṣame’ antīvi. Tappu oppikoḷḷōdilla, ādre kṣame kēḷida hāge kāṇutte."
    en: "‘Sorry if you felt bad.’ In court we call that a ‘conditional apology’. It doesn't admit the wrong, but it looks like an apology."
  - who: arjun
    t: "ಕಾವೇರಿ, ಪ್ಲೀಸ್. ಊಟದ ಟೇಬಲ್ ಕೋರ್ಟ್ ಅಲ್ಲ."
    tr: "Kāvēri, plīs. Ūṭada ṭēbal kōrṭ alla."
    en: "Kaveri, please. The lunch table is not a courtroom."
  - who: kaveri
    t: "ಸರಿ. ತೀರ್ಪು ಮುಂದಕ್ಕೆ ಹಾಕಲಾಗಿದೆ. ಮುಂದಿನ ದಿನಾಂಕ ಆಮೇಲೆ."
    tr: "Sari. Tīrpu mundakke hākalāgide. Mundina dināṅka āmēle."
    en: "Fine. Judgment reserved. Next date to be announced."
  - who: imran
    t: "ಈ ರೊಟ್ಟಿ ನೋಡ್ರಿ. ಕಲಬುರಗಿ ರೊಟ್ಟಿ ಇದಕ್ಕಿಂತ ತೆಳ್ಳಗೆ, ಗಟ್ಟಿ. ಆದ್ರ ಈ ಎಣ್ಣಿಗಾಯಿ ಮಸ್ತ್ ಐತಿ. ನವೀನ್, ನೋಡು, ನಾನು ಬೇರೆ ಊರಿನ ಊಟ ಹೊಗಳಾಕತ್ತೇನಿ!"
    tr: "Ī roṭṭi nōḍri. Kalaburagi roṭṭi idakkinta teḷḷage, gaṭṭi. Ādra ī eṇṇigāyi mast aiti. Navīn, nōḍu, nānu bēre ūrina ūṭa hogaḷākattēni!"
    en: "Look at this rotti. Kalaburagi rotti is thinner than this, and crisper. But this stuffed brinjal is superb. Naveen, look — I'm praising another town's food!"
  - who: naveen
    t: "ದಾಖಲೆ ಮಾಡ್ಕೊಳ್ಳಿ, ಕಾವೇರಿ. ಸಾಕ್ಷಿ ಉಂಟು."
    tr: "Dākhale māḍkoḷḷi, Kāvēri. Sākṣi uṇṭu."
    en: "Put it on record, Kaveri. There's a witness."
  - who: deepa
    t: "ಈ ಮಂಡಕ್ಕಿ ಮೆಣಸಿನಕಾಯಿ ಸೂಪರ್. ಚಿತ್ರದುರ್ಗದ ಸ್ಪೆಷಲ್ ಅಂತ ಹೋಟೆಲ್ ಅಣ್ಣ ಹೇಳಿದ್ರು."
    tr: "Ī maṇḍakki meṇasinakāyi sūpar. Chitradurgada speṣal anta hōṭel aṇṇa hēḷidru."
    en: "This mandakki with chillies is super. The hotel anna said it's a Chitradurga special."
  - who: prakash
    t: "ನಮ್ ಕಡೆ ಹುಬ್ಬಳ್ಳಿಯಾಗ ಇದಕ್ಕ ಗಿರ್ಮಿಟ್ ಅಂತೇವಿ, ಸ್ವಲ್ಪ ಬೇರೆ ತರ. ನಾಳೆ ನಾಡಿದ್ದು ತಿನಿಸ್ತೇನಿ. ಮಿರ್ಚಿ ಜೊತೆ."
    tr: "Nam kaḍe Hubbaḷḷiyāga idakka girmiṭ antēvi, svalpa bēre tara. Nāḷe nāḍiddu tinistēni. Mirchi jote."
    en: "On our side, in Hubballi, we have girmit — a bit different. I'll make you eat it in a day or two. With mirchi bajji."
  - who: shruti
    t: "ಪ್ರಕಾಶ್, ಈ ಟ್ರಿಪ್ ಮುಗಿಯೋ ಹೊತ್ತಿಗೆ ನಾವೆಲ್ಲ ಐದು ಕೆಜಿ ಜಾಸ್ತಿ ಆಗ್ತೀವಿ."
    tr: "Prakāś, ī ṭrip mugiyō hottige nāvella aidu keji jāsti āgtīvi."
    en: "Prakash, by the time this trip is over we'll all be five kilos heavier."
  - scene: "A little laughter returns. Deepa quietly puts a second rotti on Prakash's plate. Ramya eats in silence, her phone face down."
  - who: ramya
    t: "ಪ್ರಕಾಶ್, ಮೇಲೆ ನಾನು ವಿಡಿಯೋ ಮಾಡ್ತಿದ್ದೆ. ಅದನ್ನ ಡಿಲೀಟ್ ಮಾಡಿದೀನಿ. ನಿನ್ನ ಮುಂದೇನೇ ಮಾಡ್ತೀನಿ, ನೋಡು. ಸಾರಿ. ನಾನೂ ನಕ್ಕೆ."
    tr: "Prakāś, mēle nānu viḍiyō māḍtidde. Adanna ḍilīṭ māḍidīni. Ninna mundēnē māḍtīni, nōḍu. Sāri. Nānū nakke."
    en: "Prakash, up there I was filming. I've deleted it. I'll do it right in front of you, look. Sorry. I laughed too."
  - who: prakash
    t: "ಥ್ಯಾಂಕ್ಸ್ ರಮ್ಯಾ. ಅದು ಸಾರಿ ಅಂದ್ರ. ‘ನಾನೂ ನಕ್ಕೆ’. ಅಷ್ಟೇ ಸಾಕು."
    tr: "Thyāṅks Ramyā. Adu sāri andra. ‘Nānū nakke’. Aṣṭē sāku."
    en: "Thanks, Ramya. That's what a sorry is. ‘I laughed too.’ That's all it takes."
  - scene: "Arjun hears it. He looks at his plate and tears his rotti into small pieces without eating."
  - who: prakash
    t: "ಅರ್ಜುನ್ ಅವರೇ, ಆ ಚಟ್ನಿಪುಡಿ ಇನ್ನಷ್ಟು ಕೊಡ್ರಿ."
    tr: "Arjun avarē, ā caṭnipuḍi innaṣṭu koḍri."
    en: "Arjun-avare, pass me a little more of that chutney powder."
  - scene: "Arjun freezes at the word 'avare'. In college it was always 'Le, Arjuna'. He passes the bowl."
  - who: arjun
    t: "‘ಅವರೇ’? ಏನಿದು ಪ್ರಕಾಶ್, ಹೊಸ ಮರ್ಯಾದೆ?"
    tr: "‘Avarē’? Ēnidu Prakāś, hosa maryāde?"
    en: "‘Avare’? What's this, Prakash — some new respect?"
  - who: prakash
    t: "ಎಲ್ಲಾರಿಗೂ ಮರ್ಯಾದಿ ಕೊಡಬೇಕು ಅಂತ ನಮ್ಮವ್ವ ಕಲಿಸ್ಯಾಳ್ರಿ. ಹಳ್ಳಿ ಮಾತಾದ್ರೂ ಅಷ್ಟು ಅದಕ್ಕ ಗೊತ್ತೈತಿ."
    tr: "Ellārigū maryādi koḍabēku anta nammavva kalisyāḷri. Haḷḷi mātādrū aṣṭu adakka gottaiti."
    en: "My Avva taught me to give everyone respect. It may be village talk, but it knows that much."
  - scene: "Nobody says anything. Naveen quietly pushes the rotti basket towards Prakash."
  - scene: "3:15 p.m. Outside the khanavali. Arjun stands by the cars, kicking at the gravel. Kaveri comes out and stands beside him."
  - who: kaveri
    t: "ಅರ್ಜುನ್, ಕೋರ್ಟ್ ಇಲ್ಲ, ಗೆಳತಿಯಾಗಿ ಹೇಳ್ತೀನಿ. ನಿಜವಾದ ಕ್ಷಮೆಗೆ ಮೂರು ಭಾಗ. ‘ನಾನು ತಪ್ಪು ಮಾಡಿದೆ’. ‘ಇದರಿಂದ ನಿನಗೆ ನೋವಾಯ್ತು ಅಂತ ಗೊತ್ತು’. ‘ಮತ್ತೆ ಹೀಗೆ ಮಾಡಲ್ಲ’. ‘ಆಗಿದ್ರೆ’ ಅನ್ನೋ ಪದ ಅದರಲ್ಲಿ ಇಲ್ಲ."
    tr: "Arjun, kōrṭ illa, geḷatiyāgi hēḷtīni. Nijavāda kṣamege mūru bhāga. ‘Nānu tappu māḍide’. ‘Idarinda ninage nōvāytu anta gottu’. ‘Matte hīge māḍalla’. ‘Āgidre’ annō pada adaralli illa."
    en: "Arjun, no court now; I'm saying this as a friend. A real apology has three parts. ‘I was wrong.’ ‘I know it hurt you.’ ‘I won't do it again.’ The word ‘if’ isn't in it."
  - who: arjun
    t: "ಗೊತ್ತು ಕಾವೇರಿ. ಗೊತ್ತು. ಆದ್ರೆ ಇವತ್ತು ಆಗಲ್ಲ. ಈಗ ನನ್ನ ತಲೇಲಿ ಬೇರೆ ಏನೇನೋ ಇದೆ."
    tr: "Gottu Kāvēri. Gottu. Ādre ivattu āgalla. Īga nanna talēli bēre ēnēnō ide."
    en: "I know, Kaveri. I know. But not today. There's all sorts of other stuff in my head right now."
  - who: kaveri
    t: "ಬೇರೆ ಏನು?"
    tr: "Bēre ēnu?"
    en: "Other stuff like what?"
  - who: arjun
    t: "ಏನಿಲ್ಲ. ಕೆಲಸ. ಬಿಡು."
    tr: "Ēnilla. Kelasa. Biḍu."
    en: "Nothing. Work. Leave it."
  - scene: "Kaveri looks at him for a long moment, like a lawyer at a witness who has just said less than he knows. Then she lets it go."
  - scene: "Imran comes out of the khanavali, wiping his hands on his handkerchief, and leans on the car beside Arjun."
  - who: imran
    t: "ಅರ್ಜುನ್, ಮ್ಯಾಲೆ ನಾ ಜೋರಾಗಿ ಮಾತಾಡಿದೆ. ಆದ್ರ ಒಂದು ಮಾತು ಕೇಳು. ಆ ಸಾಲಿ ಹುಡುಗರು ನಕ್ಕಿದ್ದು ನೋಡಿದಿ? ಅವರ ಮನ್ಯಾಗೂ ಅಜ್ಜಿ-ಅಜ್ಜ ಹಂಗೇ ಮಾತಾಡ್ತಾರ. ಇವತ್ತು ಆ ಮಕ್ಕಳು ಏನು ಕಲಿತವು?"
    tr: "Arjun, myāle nā jōrāgi mātāḍide. Ādra ondu mātu kēḷu. Ā sāli huḍugaru nakkiddu nōḍidi? Avara manyāgū ajji-ajja haṅgē mātāḍtāra. Ivattu ā makkaḷu ēnu kalitavu?"
    en: "Arjun, I spoke loudly up there. But listen to one thing. Did you see those schoolkids laughing? At home their own grandparents talk just like that. What did those children learn today?"
  - who: arjun
    t: "…ತಮ್ಮ ಅಜ್ಜಿ ಮಾತು ತಮಾಷೆ ಅಂತ."
    tr: "…tamma ajji mātu tamāṣe anta."
    en: "…that their grandmother's speech is a joke."
  - who: imran
    t: "ಅದೇ. ಅದಕ್ಕೇ ಈ ನೋವು ದೊಡ್ಡದು. ಹೋಗ್ಲಿ, ನಡಿ, ಹೊತ್ತಾತು."
    tr: "Adē. Adakkē ī nōvu doḍḍadu. Hōgli, naḍi, hottātu."
    en: "Exactly. That's why this hurt is a big one. Anyway, come on, it's getting late."
  - section: "Who drives the night road"
    learn: "planning the next leg: innu mūru gaṇṭe, katḷāguvudrolage, rātri ḍraiv · offering and refusing help: nānu ōḍistīni, susthāgide, ninna kāru oḷḷe uddadu · switching seats: nānu ā kārige hōgtīni, sīṭ badalāyisōṇa"
  - scene: "4:30 p.m. The car park. The sun is low and orange behind the fort walls. Naveen rubs his eyes."
  - who: naveen
    t: "ನಿನ್ನೆ ಉಡುಪಿಯಿಂದ ಎಂಟು ಗಂಟೆ ಓಡಿಸಿದೆ, ಇವತ್ತು ಮೂರು ಗಂಟೆ. ಕಣ್ಣು ಮುಚ್ಚಿ ಹೋಗ್ತಾ ಉಂಟು. ಹಂಪಿಗೆ ಇನ್ನೂ ಮೂರು ಗಂಟೆ, ಕತ್ತಲೆಯಲ್ಲಿ."
    tr: "Ninne Uḍupiyinda eṇṭu gaṇṭe ōḍiside, ivattu mūru gaṇṭe. Kaṇṇu mucchi hōgtā uṇṭu. Hampige innū mūru gaṇṭe, kattaleyalli."
    en: "Yesterday I drove eight hours from Udupi, and three more today. My eyes are closing. Hampi is another three hours, in the dark."
  - who: kaveri
    t: "ನಾನು ಓಡಿಸ್ತೀನಿ. ಹತ್ತು ವರ್ಷದಿಂದ ಕೊಡಗಿನ ಘಾಟ್ ರಸ್ತೆಯಲ್ಲಿ ಓಡಿಸ್ತಿದೀನಿ. ಈ ಹೈವೇ ಅದಕ್ಕಿಂತ ಸುಲಭ. ನವೀನ್, ನೀನು ಮಲಗು."
    tr: "Nānu ōḍistīni. Hattu varṣadinda Koḍagina ghāṭ rasteyalli ōḍistidīni. Ī haivē adakkinta sulabha. Navīn, nīnu malagu."
    en: "I'll drive. I've been driving on the Kodagu ghat roads for ten years. This highway is easier than that. Naveen, you sleep."
  - who: naveen
    t: "ಸರಿ. ಆದ್ರೆ ನಾನು ಅರ್ಜುನ್ ಕಾರಲ್ಲಿ ಬರ್ತೇನೆ. ಅದರ ಕೊನೆ ಸೀಟು ಉದ್ದ ಉಂಟು, ಕಾಲು ಚಾಚಿ ಮಲಗಬಹುದು."
    tr: "Sari. Ādre nānu Arjun kāralli bartēne. Adara kone sīṭu udda uṇṭu, kālu chāchi malagabahudu."
    en: "All right. But I'll come in Arjun's car. Its last row is long — I can stretch my legs out and sleep."
  - who: shruti
    t: "ಹಾಗಾದ್ರೆ ನಾನು ಕಾವೇರಿ ಕಾರಿಗೆ ಹೋಗ್ತೀನಿ. ದೀಪಾ ಜೊತೆ ಕೂತ್ಕೋತೀನಿ. ರಮ್ಯಾ, ನೀನು ಅರ್ಜುನ್ ಕಾರಲ್ಲಿ ಹೋಗು, ಬೇಕಾದಷ್ಟು ಶೂಟ್ ಮಾಡು."
    tr: "Hāgādre nānu Kāvēri kārige hōgtīni. Dīpā jote kūtkōtīni. Ramyā, nīnu Arjun kāralli hōgu, bēkādaṣṭu śūṭ māḍu."
    en: "Then I'll go in Kaveri's car. I'll sit with Deepa. Ramya, you go in Arjun's car and shoot as much as you like."
  - who: arjun
    t: "ಸರಿ. ಯಾರಿಗೆ ಎಲ್ಲಿ ಬೇಕೋ ಅಲ್ಲಿ ಕೂತ್ಕೊಳ್ಳಿ. ನನ್ ಕಾರಲ್ಲಿ ಜಾಗ ಇದೆ. ಏಳು ಗಂಟೆಗೆ ಹೊಸಪೇಟೆ, ಎಂಟೂವರೆಗೆ ಹಂಪಿ."
    tr: "Sari. Yārige elli bēkō alli kūtkoḷḷi. Nan kāralli jāga ide. Ēḷu gaṇṭege Hosapēṭe, eṇṭūvarege Hampi."
    en: "Fine. Sit wherever you want. There's room in my car. Hosapete by seven, Hampi by half past eight."
  - scene: "Prakash climbs silently into the middle row of Arjun's car beside Imran and puts in his earphones. Naveen stretches out in the back row. In the other car, Kaveri adjusts the mirrors; Shruti and Deepa sit together in the back. The two cars pull out onto the highway as the fort turns dark against the sky."
  - chapter: "Chapter 4 — The night road"
  - section: "Three women, one car, the dark highway"
    learn: "night driving: hai-bīm, ḍip māḍu, lārigaḷu, ḍaivarṣan · talking about a fight afterwards: avanu hāgē, yāvattū badalāglilla, nānū jāsti mātāḍbiṭṭe · noticing a friend's silence: ninne inda ēnō bēre tara idīya"
  - scene: "6:20 p.m. NH-50 towards Hosapete. Full dark. Lorries loaded with sugarcane and iron ore crawl in the left lane. Kaveri drives with both hands on the wheel; Shruti and Deepa sit in the back of Naveen's white car. Arjun's tail lights glow a kilometre ahead."
  - who: kaveri
    t: "ಎದುರಿಂದ ಬರೋ ಲಾರಿಗಳು ಹೈ-ಬೀಮ್ ಡಿಪ್ ಮಾಡಲ್ಲ. ಕಣ್ಣಿಗೆ ನೇರ ಹೊಡೆಯುತ್ತೆ. ಶ್ರುತಿ, ಸ್ವಲ್ಪ ಎಡಗಡೆ ನೋಡ್ತಿರು, ಬೈಕ್‌ಗಳು ಲೈಟ್ ಇಲ್ಲದೆ ಬರ್ತವೆ."
    tr: "Edurinda barō lārigaḷu hai-bīm ḍip māḍalla. Kaṇṇige nēra hoḍeyutte. Śruti, svalpa eḍagaḍe nōḍtiru, baik-gaḷu laiṭ illade bartave."
    en: "The oncoming lorries don't dip their high beams. It hits you straight in the eyes. Shruti, keep an eye on the left; bikes come along without lights."
  - who: shruti
    t: "ನೋಡ್ತಿದೀನಿ. ಕಾವೇರಿ, ನೀನು ಇಲ್ಲದಿದ್ರೆ ಇವತ್ತು ನಾನು ಆ ಕಾರಲ್ಲೇ ಮೂರು ಗಂಟೆ ಕೂರಬೇಕಿತ್ತು. ಅರ್ಜುನ್ ಪಕ್ಕ. ಆ ಮೌನ ತಡ್ಕೊಳ್ಳೋಕಾಗ್ತಿರ್ಲಿಲ್ಲ."
    tr: "Nōḍtidīni. Kāvēri, nīnu illadidre ivattu nānu ā kārallē mūru gaṇṭe kūrabēkittu. Arjun pakka. Ā mauna taḍkoḷḷōkāgtirlilla."
    en: "I'm watching. Kaveri, if it weren't for you, I'd have had to sit in that car for three hours tonight. Next to Arjun. I couldn't have stood that silence."
  - who: kaveri
    t: "ನೀನು ಇವತ್ತು ಸ್ವಲ್ಪ ಜಾಸ್ತಿನೇ ಹೇಳಿದೆ ಅವನಿಗೆ. ‘ಹದಿನಾಲ್ಕು ವರ್ಷ’ ಅಂದಾಗ ಎಲ್ರಿಗೂ ಅರ್ಥ ಆಯ್ತು ನೀನು ಯಾವುದರ ಬಗ್ಗೆ ಮಾತಾಡ್ತಿದೀಯ ಅಂತ."
    tr: "Nīnu ivattu svalpa jāstinē hēḷide avanige. ‘Hadinālku varṣa’ andāga ellrigū artha āytu nīnu yāvudara bagge mātāḍtidīya anta."
    en: "You said a bit too much to him today. When you said ‘fourteen years’, everyone understood what you were talking about."
  - who: shruti
    t: "ಗೊತ್ತು. ನಾನೂ ಜಾಸ್ತಿ ಮಾತಾಡ್ಬಿಟ್ಟೆ. ಆದ್ರೆ ಅವನ ಆ ಮುಖ… ‘ನನಗೆ ಏನೂ ತಾಗಲ್ಲ’ ಅನ್ನೋ ಮುಖ. ಆವತ್ತೂ ಅದೇ ಮುಖ ಇತ್ತು. ಬಿಡು, ಅದು ಇವತ್ತಿನ ವಿಷಯ ಅಲ್ಲ."
    tr: "Gottu. Nānū jāsti mātāḍbiṭṭe. Ādre avana ā mukha… ‘nanage ēnū tāgalla’ annō mukha. Āvattū adē mukha ittu. Biḍu, adu ivattina viṣaya alla."
    en: "I know. I said too much as well. But that face of his… the ‘nothing touches me’ face. He had the same face back then too. Leave it, that's not today's subject."
  - scene: "Deepa has been looking out of the window at the black fields. Her phone lights up in her lap; she turns it face down."
  - who: shruti
    t: "ದೀಪಾ, ನೀನು ನಿನ್ನೆಯಿಂದ ಏನೋ ಬೇರೆ ತರ ಇದೀಯ. ಊಟ ಸರಿಯಾಗಿ ಮಾಡ್ಲಿಲ್ಲ, ನಗೋದೂ ಅರ್ಧ. ಆರೋಗ್ಯ ಸರಿ ಇದ್ಯಾ?"
    tr: "Dīpā, nīnu ninneyinda ēnō bēre tara idīya. Ūṭa sariyāgi māḍlilla, nagōdū ardha. Ārōgya sari idyā?"
    en: "Deepa, you've been different since yesterday. You didn't eat properly, you only half-laugh. Are you well?"
  - who: deepa
    t: "ಆರೋಗ್ಯ ಚೆನ್ನಾಗಿದೆ ಕಣೇ. ಸುಮ್ನೆ ಸುಸ್ತು."
    tr: "Ārōgya chennāgide kaṇē. Sumne sustu."
    en: "My health is fine. I'm just tired."
  - who: shruti
    t: "ಕಾವೇರಿ, ಪುತ್ತರಿಗೆ ಊರಿಗೆ ಹೋಗದೆ ಇಲ್ಲಿ ಬಂದ್ಯಲ್ಲಾ, ಅಮ್ಮ ಏನಂದ್ರು?"
    tr: "Kāvēri, Puttarige ūrige hōgade illi bandyallā, amma ēnandru?"
    en: "Kaveri, you came here instead of going home for Puttari — what did your mother say?"
  - who: kaveri
    t: "ಅಮ್ಮ ಎರಡು ವಿಷಯ ಹೇಳಿದ್ರು. ಒಂದು, ‘ಹಬ್ಬಕ್ಕೆ ಬರಲ್ಲ’. ಎರಡು, ‘ಮೂವತ್ನಾಲ್ಕು ವರ್ಷ ಆಯ್ತು, ಮದುವೆಗೂ ಬರಲ್ಲ’. ಪ್ರತಿ ಫೋನ್ ಕಾಲ್ ಒಂದು ಕ್ರಾಸ್-ಎಕ್ಸಾಮಿನೇಷನ್."
    tr: "Amma eraḍu viṣaya hēḷidru. Ondu, ‘habbakke baralla’. Eraḍu, ‘mūvatnālku varṣa āytu, maduvegū baralla’. Prati phōn kāl ondu krās-eksāminēṣan."
    en: "Amma said two things. One: ‘You won't come for the festival.’ Two: ‘You're thirty-four and you won't come to your own wedding either.’ Every phone call is a cross-examination."
  - who: shruti
    t: "ನೀನು ಏನು ಉತ್ತರ ಕೊಡ್ತೀಯ?"
    tr: "Nīnu ēnu uttara koḍtīya?"
    en: "What do you answer?"
  - who: kaveri
    t: "‘ಆಕ್ಷೇಪಣೆ, ಮಾನ್ಯರೇ. ಪ್ರಶ್ನೆ ಅಪ್ರಸ್ತುತ’ ಅಂತೀನಿ. ಅಮ್ಮ ಫೋನ್ ಇಡ್ತಾರೆ. ಮುಂದಿನ ವಾರ ಮತ್ತೆ ಅದೇ ವಿಚಾರಣೆ."
    tr: "‘Ākṣēpaṇe, mān'yarē. Praśne aprastuta’ antīni. Amma phōn iḍtāre. Mundina vāra matte adē vichāraṇe."
    en: "I say, ‘Objection, Your Honour. The question is irrelevant.’ Amma hangs up. Next week, the same hearing again."
  - scene: "Shruti laughs. Deepa smiles faintly at the window. Then the torches of a check post appear ahead."
  - section: "The check post"
    learn: "formal register with police: namaskāra sār, khaṇḍita, tōristīni, idē sār · documents: lais-ens, ār-si, inśūrens, pi-yu-si, ḍiji-lākar · the officer's speech: gāḍi sāiḍige hāki, ellinda bartidīri?, mālīkaru yāru? · procedures: brīth anālaisar, ūdi, hinde sīṭ belṭ kaḍḍāya"
  - scene: "7:05 p.m. A police check post a few kilometres before Hosapete. Orange barricades narrow the road to one lane. A jeep with a blue light, three constables with torches, and a sub-inspector in a khaki sweater. A torch waves the white car to the side."
  - who: police
    t: "ನಮಸ್ಕಾರ ಮೇಡಂ. ಗಾಡಿ ಸ್ವಲ್ಪ ಸೈಡಿಗೆ ಹಾಕಿ, ಇಂಜಿನ್ ಆಫ್ ಮಾಡಿ. ಒಳಗಿನ ಲೈಟ್ ಆನ್ ಮಾಡಿ."
    tr: "Namaskāra mēḍam. Gāḍi svalpa sāiḍige hāki, iñjin āph māḍi. Oḷagina laiṭ ān māḍi."
    en: "Good evening, madam. Pull the vehicle to the side, please, switch off the engine. Switch on the inside light."
  - who: kaveri
    t: "ನಮಸ್ಕಾರ ಸಾರ್. ಮಾಡಿದೀನಿ. ಏನು ತೋರಿಸಬೇಕು ಹೇಳಿ."
    tr: "Namaskāra sār. Māḍidīni. Ēnu tōrisabēku hēḷi."
    en: "Good evening, sir. Done. Tell me what I need to show you."
  - who: police
    t: "ನಿಮ್ಮ ಡ್ರೈವಿಂಗ್ ಲೈಸೆನ್ಸ್, ಗಾಡಿಯ ಆರ್‌ಸಿ, ಇನ್ಶೂರೆನ್ಸ್, ಪಿಯುಸಿ. ಡಿಜಿಲಾಕರ್‌ನಲ್ಲಿ ಇದ್ರೂ ನಡೆಯುತ್ತೆ."
    tr: "Nimma ḍraiviṅg laisens, gāḍiya ār-si, inśūrens, pi-yu-si. Ḍiji-lākar-nalli idrū naḍeyutte."
    en: "Your driving licence, the vehicle's RC, insurance and PUC. It's fine if they're in DigiLocker."
  - who: kaveri
    t: "ಲೈಸೆನ್ಸ್ ಇದು, ಒರಿಜಿನಲ್. ಗಾಡಿಯ ಪೇಪರ್ಸ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್‌ನಲ್ಲಿವೆ. ಒಂದು ನಿಮಿಷ… ಇಲ್ಲಿ ಆರ್‌ಸಿ ಇದೆ, ಇನ್ಶೂರೆನ್ಸ್ ಮುಂದಿನ ಮಾರ್ಚ್‌ವರೆಗೆ ಇದೆ, ಪಿಯುಸಿ ಸೆಪ್ಟೆಂಬರ್‌ನಲ್ಲಿ ಮಾಡಿಸಿದ್ದು."
    tr: "Laisens idu, orijinal. Gāḍiya pēpars ḍyāś-bōrḍ-nallive. Ondu nimiṣa… illi ār-si ide, inśūrens mundina mārch-varege ide, pi-yu-si sepṭembar-nalli māḍisiddu."
    en: "Here's the licence, the original. The vehicle papers are in the dashboard. One minute… here's the RC, the insurance is valid till next March, the PUC was done in September."
  - who: police
    t: "ಗಾಡಿ ಉಡುಪಿ ರಿಜಿಸ್ಟ್ರೇಷನ್, ನವೀನ್ ಶೆಟ್ಟಿ ಅವರ ಹೆಸರಲ್ಲಿದೆ. ನೀವು ಮಾಲೀಕರಲ್ಲ. ಮಾಲೀಕರು ಎಲ್ಲಿದ್ದಾರೆ? ಅವರ ಜೊತೆ ನಿಮಗೇನು ಸಂಬಂಧ?"
    tr: "Gāḍi Uḍupi rijisṭrēṣan, Navīn Śeṭṭi avara hesarallide. Nīvu mālīkaralla. Mālīkaru elliddāre? Avara jote nimagēnu sambandha?"
    en: "The vehicle has an Udupi registration, in the name of one Naveen Shetty. You're not the owner. Where is the owner? What's your relationship with him?"
  - who: kaveri
    t: "ನವೀನ್ ಶೆಟ್ಟಿ ನಮ್ಮ ಕಾಲೇಜು ಗೆಳೆಯ, ಸಾರ್. ಅವರು ಸುಸ್ತಾಗಿದ್ರು, ಅದಕ್ಕೆ ನಾನು ಓಡಿಸ್ತಿದೀನಿ. ಅವರು ಮುಂದಿನ ಕಾರಲ್ಲಿದ್ದಾರೆ, ಬೂದು ಬಣ್ಣದ ಎಸ್‌ಯುವಿ. ಈಗಲೇ ಫೋನ್ ಮಾಡಿ ಮಾತಾಡಿಸ್ತೀನಿ."
    tr: "Navīn Śeṭṭi namma kālēju geḷeya, sār. Avaru sustāgidru, adakke nānu ōḍistidīni. Avaru mundina kāralliddāre, būdu baṇṇada es-yu-vi. Īgalē phōn māḍi mātāḍistīni."
    en: "Naveen Shetty is our college friend, sir. He was exhausted, so I'm driving. He's in the car ahead, a grey SUV. I'll call him right now and you can speak to him."
  - who: police
    t: "ಮಾಡಿ. ಸ್ಪೀಕರ್‌ನಲ್ಲಿ ಹಾಕಿ."
    tr: "Māḍi. Spīkar-nalli hāki."
    en: "Do that. Put it on speaker."
  - scene: "Kaveri dials. It rings for a long time. Then Ramya answers, whispering."
  - who: ramya
    t: "ಹಲೋ ಕಾವೇರಿ? ನವೀನ್ ಗೊರಕೆ ಹೊಡೀತಾ ಉಂಟು ಮರ್ರೆ. ಎಂತ ಆಯ್ತು?"
    tr: "Halō Kāvēri? Navīn gorake hoḍītā uṇṭu marre. Enta āytu?"
    en: "Hello, Kaveri? Naveen's snoring away, man. What's happened?"
  - who: kaveri
    t: "ರಮ್ಯಾ, ಪೊಲೀಸ್ ಚೆಕ್ ಪೋಸ್ಟ್. ಏನೂ ಸಮಸ್ಯೆ ಇಲ್ಲ, ಆದ್ರೆ ನವೀನ್‌ನ ಎಬ್ಬಿಸು. ಇನ್ಸ್‌ಪೆಕ್ಟರ್ ಅವರು ಮಾಲೀಕರ ಜೊತೆ ಮಾತಾಡ್ಬೇಕಂತೆ."
    tr: "Ramyā, polīs chek pōsṭ. Ēnū samasye illa, ādre Navīn-na ebbisu. Inspekṭar avaru mālīkara jote mātāḍbēkante."
    en: "Ramya, it's a police check post. No problem at all, but wake Naveen up. The inspector needs to speak to the owner."
  - who: naveen
    t: "ಹಾಂ… ಹಲೋ? ನಮಸ್ಕಾರ ಸಾರ್. ನಾನು ನವೀನ್ ಶೆಟ್ಟಿ. ಹೌದು ಸಾರ್, ಅದು ನನ್ನ ಗಾಡಿ. ನಾನೇ ಅವರಿಗೆ ಓಡಿಸ್ಲಿಕ್ಕೆ ಹೇಳಿದ್ದು. ಬೇಕಾದ್ರೆ ನಾವು ವಾಪಸ್ ಬರ್ತೇವೆ."
    tr: "Hāṁ… halō? Namaskāra sār. Nānu Navīn Śeṭṭi. Haudu sār, adu nanna gāḍi. Nānē avarige ōḍislikke hēḷiddu. Bēkādre nāvu vāpas bartēve."
    en: "Hm… hello? Good evening, sir. I'm Naveen Shetty. Yes, sir, that's my vehicle. I asked her to drive it myself. If you need us to, we'll turn back."
  - who: police
    t: "ಬೇಡ, ಪರವಾಗಿಲ್ಲ. ಮಾಲೀಕರ ಒಪ್ಪಿಗೆ ಇದೆ, ಲೈಸೆನ್ಸ್ ಸರಿ ಇದೆ. ಥ್ಯಾಂಕ್ಯೂ ಸಾರ್. ನೀವು ಮಲಗಿ."
    tr: "Bēḍa, paravāgilla. Mālīkara oppige ide, laisens sari ide. Thyāṅkyū sār. Nīvu malagi."
    en: "No need, it's all right. The owner has consented, and the licence is in order. Thank you, sir. You can go back to sleep."
  - scene: "The call ends. The officer shines his torch over the back seat."
  - who: police
    t: "ಮೇಡಂ, ಎಲ್ಲಿಂದ ಬರ್ತಿದೀರಿ, ಎಲ್ಲಿಗೆ ಹೋಗ್ತಿದೀರಿ?"
    tr: "Mēḍam, ellinda bartidīri, ellige hōgtidīri?"
    en: "Madam, where are you coming from, and where are you going?"
  - who: kaveri
    t: "ಬೆಂಗಳೂರಿನಿಂದ, ಸಾರ್. ಇವತ್ತು ಚಿತ್ರದುರ್ಗ ನೋಡ್ಕೊಂಡು ಬಂದ್ವಿ. ಇವತ್ತು ರಾತ್ರಿ ಕಮಲಾಪುರದಲ್ಲಿ ಹೋಮ್‌ಸ್ಟೇ. ನಾಳೆ ಹಂಪಿ, ಆಮೇಲೆ ಧಾರವಾಡ, ಗೋಕರ್ಣ. ಹಳೆ ಕಾಲೇಜು ಗೆಳೆಯರ ಪ್ರವಾಸ."
    tr: "Beṅgaḷūrininda, sār. Ivattu Chitradurga nōḍkoṇḍu bandvi. Ivattu rātri Kamalāpuradalli hōmsṭē. Nāḷe Hampi, āmēle Dhāravāḍa, Gōkarṇa. Haḷe kālēju geḷeyara pravāsa."
    en: "From Bengaluru, sir. We saw Chitradurga today. Tonight we're at a homestay in Kamalapur. Tomorrow Hampi, then Dharwad and Gokarna. A trip of old college friends."
  - who: police
    t: "ಸರಿ. ಡಿಕ್ಕಿ ತೆಗೀರಿ ಒಂದ್ಸಲ. ಈ ರಸ್ತೆಯಲ್ಲಿ ರಾತ್ರಿ ಹೊತ್ತು ಮದ್ಯ, ಮರಳು ಎಲ್ಲಾ ಸಾಗಣೆ ಆಗುತ್ತೆ. ಎಲ್ಲಾ ಗಾಡಿನೂ ಚೆಕ್ ಮಾಡ್ತೀವಿ. ಬೇಜಾರು ಮಾಡ್ಕೋಬೇಡಿ."
    tr: "Sari. Ḍikki tegīri ondsala. Ī rasteyalli rātri hottu madya, maraḷu ellā sāgaṇe āgutte. Ellā gāḍinū chek māḍtīvi. Bējāru māḍkōbēḍi."
    en: "All right. Open the boot once, please. Liquor, sand, all sorts of things get transported on this road at night. We check every vehicle. Please don't mind."
  - who: kaveri
    t: "ಖಂಡಿತ ಸಾರ್. ನಿಮ್ಮ ಕೆಲಸ ನೀವು ಮಾಡ್ತಿದೀರಿ. ಮೂರು ಬ್ಯಾಗ್, ಒಂದು ನೀರಿನ ಕ್ಯಾನ್, ಒಂದು ಡಬ್ಬದಲ್ಲಿ ಹೋಳಿಗೆ. ಬೇಕಾದ್ರೆ ಒಂದು ತಗೊಳ್ಳಿ."
    tr: "Khaṇḍita sār. Nimma kelasa nīvu māḍtidīri. Mūru byāg, ondu nīrina kyān, ondu ḍabbadalli hōḷige. Bēkādre ondu tagoḷḷi."
    en: "Of course, sir. You're doing your job. Three bags, a water can, and holige in a box. Do take one if you like."
  - who: police
    t: "ಇಲ್ಲ ಮೇಡಂ, ಡ್ಯೂಟಿಯಲ್ಲಿದೀನಿ. ಇನ್ನೊಂದು ವಿಷಯ, ಡ್ರೈವರ್‌ಗೆ ಬ್ರೀತ್ ಅನಲೈಸರ್ ಟೆಸ್ಟ್. ಇದು ಎಲ್ಲರಿಗೂ ಕಡ್ಡಾಯ. ಈ ಪೈಪ್‌ಗೆ ಜೋರಾಗಿ ಊದಿ."
    tr: "Illa mēḍam, ḍyūṭiyallidīni. Innondu viṣaya, ḍraivar-ge brīth anālaisar ṭesṭ. Idu ellarigū kaḍḍāya. Ī paip-ge jōrāgi ūdi."
    en: "No, madam, I'm on duty. One more thing: a breath analyser test for the driver. It's compulsory for everyone. Blow hard into this pipe."
  - scene: "Kaveri blows. The little machine beeps. The officer reads the screen under his torch."
  - who: police
    t: "ಸೊನ್ನೆ. ಸರಿ. ಹಿಂದೆ ಕೂತವರು ಸೀಟ್ ಬೆಲ್ಟ್ ಹಾಕಿಲ್ಲ. ಹಿಂದಿನ ಸೀಟಿಗೂ ಬೆಲ್ಟ್ ಕಡ್ಡಾಯ, ಮೇಡಂ. ಹೈವೇಯಲ್ಲಿ ಒಂದು ಆಕ್ಸಿಡೆಂಟ್ ಆದ್ರೆ ಹಿಂದಿನವರೇ ಮುಂದೆ ಹಾರ್ತಾರೆ. ನಾನು ದಿನಾ ನೋಡ್ತೀನಿ."
    tr: "Sonne. Sari. Hinde kūtavaru sīṭ belṭ hākilla. Hindina sīṭigū belṭ kaḍḍāya, mēḍam. Haivēyalli ondu āksiḍeṇṭ ādre hindinavarē munde hārtāre. Nānu dinā nōḍtīni."
    en: "Zero. Fine. The people in the back aren't wearing seat belts. Belts are compulsory in the rear seats too, madam. In an accident on the highway, it's the people in the back who fly forward. I see it every day."
  - who: shruti
    t: "ಸಾರಿ ಸಾರ್, ಈಗಲೇ ಹಾಕ್ತೀವಿ. ತಪ್ಪಾಯ್ತು."
    tr: "Sāri sār, īgalē hāktīvi. Tappāytu."
    en: "Sorry, sir, we'll put them on right away. Our mistake."
  - who: police
    t: "ಈ ಸಲ ಎಚ್ಚರಿಕೆ ಅಷ್ಟೇ, ದಂಡ ಹಾಕಲ್ಲ. ಮೇಡಂ, ನೀವು ಏನು ಕೆಲಸ ಮಾಡ್ತೀರಿ? ಪೇಪರ್ಸ್ ಎಲ್ಲಾ ಇಷ್ಟು ಸರಿಯಾಗಿ ಇಟ್ಟಿದೀರಿ."
    tr: "Ī sala eccharike aṣṭē, daṇḍa hākalla. Mēḍam, nīvu ēnu kelasa māḍtīri? Pēpars ellā iṣṭu sariyāgi iṭṭidīri."
    en: "This time it's just a warning; no fine. Madam, what do you do for a living? You've kept all the papers so neatly."
  - who: kaveri
    t: "ನಾನು ವಕೀಲೆ, ಸಾರ್. ಹೈಕೋರ್ಟ್‌ನಲ್ಲಿ ಪ್ರಾಕ್ಟೀಸ್ ಮಾಡ್ತೀನಿ."
    tr: "Nānu vakīle, sār. Haikōrṭ-nalli prākṭīs māḍtīni."
    en: "I'm an advocate, sir. I practise at the High Court."
  - who: police
    t: "ಓಹೋ, ಹೈಕೋರ್ಟ್ ವಕೀಲರಾ? ಮೊದಲೇ ಯಾಕೆ ಹೇಳ್ಲಿಲ್ಲ ಮೇಡಂ?"
    tr: "Ōhō, Haikōrṭ vakīlarā? Modalē yāke hēḷlilla mēḍam?"
    en: "Oho, a High Court advocate? Why didn't you say so at the start, madam?"
  - who: kaveri
    t: "ಯಾಕಂದ್ರೆ ಅದರಿಂದ ಏನೂ ಬದಲಾಗಬಾರದು, ಸಾರ್. ನಿಯಮ ಎಲ್ಲರಿಗೂ ಒಂದೇ. ನೀವು ಸರಿಯಾಗಿ ಚೆಕ್ ಮಾಡಿದ್ರಿ, ಸೌಜನ್ಯದಿಂದ ಮಾತಾಡಿದ್ರಿ. ಅದಕ್ಕೆ ಧನ್ಯವಾದ."
    tr: "Yākandre adarinda ēnū badalāgabāradu, sār. Niyama ellarigū ondē. Nīvu sariyāgi chek māḍidri, saujanyadinda mātāḍidri. Adakke dhanyavāda."
    en: "Because it shouldn't change anything, sir. The rules are the same for everyone. You checked properly, and you spoke courteously. Thank you for that."
  - who: police
    t: "ಸರಿ ಮೇಡಂ. ಮುಂದೆ ಹೊಸಪೇಟೆ ಬೈಪಾಸ್ ಹತ್ರ ರಸ್ತೆ ಕೆಲಸ ನಡೀತಿದೆ, ಡೈವರ್ಶನ್ ಇದೆ. ನಿಧಾನವಾಗಿ ಹೋಗಿ. ಕಮಲಾಪುರಕ್ಕೆ ಎಡಕ್ಕೆ ತಿರುಗಿ. ಹ್ಯಾಪಿ ಜರ್ನಿ."
    tr: "Sari mēḍam. Munde Hosapēṭe baipās hatra raste kelasa naḍītide, ḍaivarṣan ide. Nidhānavāgi hōgi. Kamalāpurakke eḍakke tirugi. Hyāpi jarni."
    en: "Very well, madam. Ahead, near the Hosapete bypass, there's road work and a diversion. Go slowly. Turn left for Kamalapur. Happy journey."
  - scene: "The barricade lifts. Kaveri pulls back onto the road. For a minute nobody says anything; then Shruti laughs softly."
  - who: shruti
    t: "‘ಮೊದಲೇ ಯಾಕೆ ಹೇಳ್ಲಿಲ್ಲ’! ನೀನು ಹೇಳಿದ್ರೆ ಅವರು ಡಿಕ್ಕಿನೇ ತೆಗೆಸ್ತಿರ್ಲಿಲ್ಲ."
    tr: "‘Modalē yāke hēḷlilla’! Nīnu hēḷidre avaru ḍikkinē tegestirlilla."
    en: "‘Why didn't you say so at the start’! If you'd said it, he wouldn't even have opened the boot."
  - who: kaveri
    t: "ಅದಕ್ಕೇ ಹೇಳ್ಲಿಲ್ಲ. ಅವರ ಕೆಲಸ ಕಷ್ಟದ್ದು. ಚಳಿಯಲ್ಲಿ ರಾತ್ರಿ ಇಡೀ ರಸ್ತೆ ಮೇಲೆ ನಿಲ್ಲಬೇಕು. ಸರಿಯಾಗಿ ಮಾಡೋರಿಗೆ ಗೌರವ ಕೊಡಬೇಕು."
    tr: "Adakkē hēḷlilla. Avara kelasa kaṣṭaddu. Chaḷiyalli rātri iḍī raste mēle nillabēku. Sariyāgi māḍōrige gaurava koḍabēku."
    en: "That's exactly why I didn't. His job is hard. He has to stand on the road all night in the cold. Those who do it properly deserve respect."
  - section: "What Deepa carries"
    learn: "breaking difficult news: ondu viṣaya hēḷbēku, yārigū hēḷilla innū · divorce vocabulary: phyāmili kōrṭ, parasapara oppigeya vichchēdana, jaṇṭi arji, bērebēre irōdu · no villain: yārū keṭṭavaralla, ibrū sōtvi · comforting: nānidīni kaṇē, aḷu paravāgilla, ninna tappalla"
  - scene: "7:40 p.m. The road is quieter now, past the diversion. Deepa speaks without turning from the window."
  - who: deepa
    t: "ಶ್ರುತಿ, ನೀನು ಕೇಳಿದ್ಯಲ್ಲಾ, ಮೈಸೂರಲ್ಲಿ ಏನು ಕೆಲಸ ಇತ್ತು ಅಂತ. ನಿನ್ನೆ ಮೈಸೂರಿನ ಫ್ಯಾಮಿಲಿ ಕೋರ್ಟ್‌ನಲ್ಲಿದ್ದೆ."
    tr: "Śruti, nīnu kēḷidyallā, Maisūralli ēnu kelasa ittu anta. Ninne Maisūrina phyāmili kōrṭ-nallidde."
    en: "Shruti, you asked what work I had in Mysuru. Yesterday I was at the family court in Mysuru."
  - scene: "Shruti turns fully towards her. Kaveri's eyes go to the rear-view mirror and back to the road."
  - who: deepa
    t: "ನಾನು ಮತ್ತೆ ರೋಹಿತ್ ಡಿವೋರ್ಸ್‌ಗೆ ಅರ್ಜಿ ಹಾಕಿದೀವಿ. ಪರಸ್ಪರ ಒಪ್ಪಿಗೆಯಿಂದ. ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಫೈಲ್ ಮಾಡಿದ್ವಿ. ಮದುವೆ ಆಗಿದ್ದು ಮೈಸೂರಲ್ಲಿ, ಅದಕ್ಕೆ ಅಲ್ಲೇ."
    tr: "Nānu matte Rōhit ḍivōrs-ge arji hākidīvi. Paraspara oppigeyinda. Akṭōbar-nalli phail māḍidvi. Maduve āgiddu Maisūralli, adakke allē."
    en: "Rohit and I have applied for a divorce. By mutual consent. We filed in October. We got married in Mysuru, so it's there."
  - who: shruti
    t: "ದೀಪಾ… ಅಯ್ಯೋ, ಕಣೇ. ಯಾವಾಗಿಂದ ಇದೆಲ್ಲಾ? ನೀನು ಒಂದು ಮಾತೂ ಹೇಳ್ಲಿಲ್ಲ."
    tr: "Dīpā… ayyō, kaṇē. Yāvāginda idellā? Nīnu ondu mātū hēḷlilla."
    en: "Deepa… oh, my dear. Since when has all this been going on? You never said a word."
  - who: deepa
    t: "ಕಳೆದ ವರ್ಷ ಸೆಪ್ಟೆಂಬರ್‌ನಿಂದ ಬೇರೆಬೇರೆ ಇದೀವಿ. ಅವನು ಕೋರಮಂಗಲದ ಫ್ಲ್ಯಾಟ್‌ನಲ್ಲಿ, ನಾನು ಒಂದು ಪಿಜಿ ತರ ಸಣ್ಣ ಮನೆಯಲ್ಲಿ. ಹೇಳೋಕೆ ಏನಿತ್ತು? ‘ನನ್ನ ಮದುವೆ ಮುಗೀತು’ ಅಂತ ಗ್ರೂಪ್‌ನಲ್ಲಿ ಹಾಕ್ಬೇಕಿತ್ತಾ?"
    tr: "Kaḷeda varṣa sepṭembar-ninda bērebēre idīvi. Avanu Kōramaṅgalada phlyāṭ-nalli, nānu ondu pi-ji tara saṇṇa maneyalli. Hēḷōke ēnittu? ‘Nanna maduve mugītu’ anta grūp-nalli hākbēkittā?"
    en: "We've been living apart since September last year. He's in the Koramangala flat, I'm in a small place, like a PG. What was there to say? Should I have posted ‘My marriage is over’ in the group?"
  - who: shruti
    t: "ಗ್ರೂಪ್‌ನಲ್ಲಿ ಅಲ್ಲ. ನನಗೆ. ಒಂದು ಫೋನ್. ಅಷ್ಟೇ ಸಾಕಿತ್ತು. ಸರಿ, ಈಗ ಹೇಳ್ತಿದೀಯಲ್ಲಾ. ಏನಾಯ್ತು? ಅವನು ಏನಾದ್ರೂ…"
    tr: "Grūp-nalli alla. Nanage. Ondu phōn. Aṣṭē sākittu. Sari, īga hēḷtidīyallā. Ēnāytu? Avanu ēnādrū…"
    en: "Not in the group. To me. One phone call. That would have been enough. All right, you're telling me now. What happened? Did he do something…"
  - who: deepa
    t: "ಇಲ್ಲ, ಇಲ್ಲ. ಅವನು ಕೆಟ್ಟವನಲ್ಲ. ಹೊಡೆದಿಲ್ಲ, ಮೋಸ ಮಾಡಿಲ್ಲ. ಅದೇ ಕಷ್ಟ. ಯಾರೂ ವಿಲನ್ ಇಲ್ಲ. ಇಬ್ರೂ ದಿನಾ ಹದಿನಾಲ್ಕು ಗಂಟೆ ಕೆಲಸ, ವೀಕೆಂಡ್‌ನಲ್ಲಿ ಇಬ್ರೂ ಲ್ಯಾಪ್‌ಟಾಪ್ ಮುಂದೆ. ಒಂದೇ ಮನೆಯಲ್ಲಿ ಇಬ್ರು ಅಪರಿಚಿತರು. ಒಂದು ದಿನ ಅವನೇ ಹೇಳಿದ, ‘ದೀಪಾ, ನಾವು ಸ್ನೇಹಿತರಾಗಿ ಉಳಿಯೋಣ, ಗಂಡ-ಹೆಂಡತಿಯಾಗಿ ಅಲ್ಲ’ ಅಂತ. ನಾನು ಅಳಲಿಲ್ಲ. ಯಾಕಂದ್ರೆ ನಾನೂ ಅದನ್ನೇ ಯೋಚಿಸ್ತಿದ್ದೆ."
    tr: "Illa, illa. Avanu keṭṭavanalla. Hoḍedilla, mōsa māḍilla. Adē kaṣṭa. Yārū vilan illa. Ibrū dinā hadinālku gaṇṭe kelasa, vīkeṇḍ-nalli ibrū lyāp-ṭāp munde. Ondē maneyalli ibru aparichitaru. Ondu dina avanē hēḷida, ‘Dīpā, nāvu snēhitarāgi uḷiyōṇa, gaṇḍa-heṇḍatiyāgi alla’ anta. Nānu aḷalilla. Yākandre nānū adannē yōchistidde."
    en: "No, no. He's not a bad man. He never hit me, never cheated. That's what makes it hard. There's no villain. Both of us working fourteen hours a day, both in front of laptops at the weekend. Two strangers in one house. One day he said it himself: ‘Deepa, let's stay friends — not husband and wife.’ I didn't cry. Because I'd been thinking the same thing."
  - who: deepa
    t: "ಜಗಳ ಆಡ್ಲಿಲ್ಲ, ಯಾರ ಮೇಲೂ ಕೇಸ್ ಹಾಕ್ಲಿಲ್ಲ. ಸುಮ್ನೆ… ಇಬ್ರೂ ಸೋತ್ವಿ ಅನ್ಸುತ್ತೆ. ‘ಮ್ಯೂಚುವಲ್ ಕನ್ಸೆಂಟ್’ ಅಂದ್ರೆ ಅದೇ."
    tr: "Jagaḷa āḍlilla, yāra mēlū kēs hāklilla. Sumne… ibrū sōtvi ansutte. ‘Myūchuval kanseṇṭ’ andre adē."
    en: "We didn't fight, nobody filed a case against anyone. Just… I think we both lost. That's what ‘mutual consent’ means."
  - scene: "Her voice breaks on the last word. Shruti unbuckles, then remembers the officer and buckles up again, and reaches across to hold Deepa's hand instead."
  - who: shruti
    t: "ಅಳು, ಪರವಾಗಿಲ್ಲ. ಎಲ್ಲಾ ಒಳಗೇ ಇಟ್ಕೋಬೇಡ. ನಾನಿದೀನಿ ಕಣೇ. ನೀನು ಒಬ್ಬಳೇ ಅಂತ ಅನ್ಕೋಬೇಡ."
    tr: "Aḷu, paravāgilla. Ellā oḷagē iṭkōbēḍa. Nānidīni kaṇē. Nīnu obbaḷē anta ankōbēḍa."
    en: "Cry, it's all right. Don't keep it all inside. I'm here. Don't think you're alone."
  - who: deepa
    t: "ನಿನ್ನೆ ಕೋರ್ಟ್‌ನಿಂದ ಹೊರಗೆ ಬಂದ್ಮೇಲೆ ಕಾರಲ್ಲಿ ಕುವೆಂಪುನಗರದ ನಮ್ಮ ಮನೆ ರಸ್ತೆ ದಾಟಿದೆ. ಅಮ್ಮ ಬಾಲ್ಕನಿಯಲ್ಲಿ ಬಟ್ಟೆ ಒಣಗಿಸ್ತಿದ್ರು. ನಾನು ನಿಲ್ಲಿಸ್ಲಿಲ್ಲ, ಶ್ರುತಿ. ಅಮ್ಮ-ಅಪ್ಪನಿಗೆ ಇನ್ನೂ ಗೊತ್ತಿಲ್ಲ. ಯಾರಿಗೂ ಗೊತ್ತಿಲ್ಲ."
    tr: "Ninne kōrṭ-ninda horage bandmēle kāralli Kuvempunagarada namma mane raste dāṭide. Amma bālkaniyalli baṭṭe oṇagistidru. Nānu nillislilla, Śruti. Amma-appanige innū gottilla. Yārigū gottilla."
    en: "Yesterday, after I came out of court, I drove past our street in Kuvempunagar. Amma was drying clothes on the balcony. I didn't stop, Shruti. Amma and Appa still don't know. Nobody knows."
  - who: shruti
    t: "ಯಾಕೆ ಹೇಳ್ಲಿಲ್ಲ ಅವರಿಗೆ?"
    tr: "Yāke hēḷlilla avarige?"
    en: "Why haven't you told them?"
  - who: deepa
    t: "ಅಪ್ಪನಿಗೆ ಕಳೆದ ವರ್ಷ ಬೈಪಾಸ್ ಸರ್ಜರಿ ಆಯ್ತು. ಅಮ್ಮ ಪ್ರತಿ ಹಬ್ಬಕ್ಕೂ ‘ಮೊಮ್ಮಗು ಯಾವಾಗ’ ಅಂತ ಕೇಳ್ತಾರೆ. ‘ನಮ್ಮ ಮನೆತನದಲ್ಲಿ ಯಾರೂ ಡಿವೋರ್ಸ್ ಆಗಿಲ್ಲ’ ಅನ್ನೋ ಮಾತು ಕೇಳೋಕೆ ನನಗೆ ಶಕ್ತಿ ಇಲ್ಲ. ಇನ್ನೂ ಇಲ್ಲ."
    tr: "Appanige kaḷeda varṣa baipās sarjari āytu. Amma prati habbakkū ‘mommagu yāvāga’ anta kēḷtāre. ‘Namma manetanadalli yārū ḍivōrs āgilla’ annō mātu kēḷōke nanage śakti illa. Innū illa."
    en: "Appa had bypass surgery last year. Amma asks at every festival, ‘When's the grandchild?’ I don't have the strength to hear the words ‘Nobody in our family has ever divorced.’ Not yet."
  - section: "Kaveri explains, carefully"
    learn: "the law in plain words: Hindū vivāha kāyde, ondu varṣa bērebēre, modala mōṣan, āru tiṅgaḷu kāyuvike, eraḍanē mōṣan · hedging like a lawyer: sāmān'yavāgi, prati kēs bēre, khachitavāgi hēḷalla, pēpars nōḍade · waiver: suprīṁ kōrṭ, 2017, kelavu sandarbhagaḷalli manna māḍbahudu · settlement: strīdhana, jīvanāṁśa, ellā arjiyallē"
  - who: deepa
    t: "ಕಾವೇರಿ, ನೀನು ಸುಮ್ಮನಿದೀಯ. ನೀನು ವಕೀಲೆ. ನನ್ನ ವಕೀಲರು ಏನೇನೋ ಹೇಳ್ತಾರೆ, ನನಗೆ ಅರ್ಧ ಅರ್ಥ ಆಗಲ್ಲ. ನಿಜವಾಗಲೂ ಎಷ್ಟು ದಿನ ಆಗುತ್ತೆ ಇದು?"
    tr: "Kāvēri, nīnu summanidīya. Nīnu vakīle. Nanna vakīlaru ēnēnō hēḷtāre, nanage ardha artha āgalla. Nijavāgalū eṣṭu dina āgutte idu?"
    en: "Kaveri, you're quiet. You're a lawyer. My lawyer says all sorts of things and I understand half of it. Honestly, how long will this take?"
  - who: kaveri
    t: "ಮೊದಲು ಒಂದು ಮಾತು. ಇಲ್ಲಿ ನಾನು ನಿನ್ನ ಗೆಳತಿ, ನಿನ್ನ ವಕೀಲೆ ಅಲ್ಲ. ನಿನ್ನ ಪೇಪರ್ಸ್ ನೋಡದೆ ಯಾವುದನ್ನೂ ಖಚಿತವಾಗಿ ಹೇಳಲ್ಲ. ಸಾಮಾನ್ಯವಾಗಿ ಏನು ನಡೆಯುತ್ತೆ ಅಂತ ಸರಳವಾಗಿ ಹೇಳ್ತೀನಿ. ಸರಿನಾ?"
    tr: "Modalu ondu mātu. Illi nānu ninna geḷati, ninna vakīle alla. Ninna pēpars nōḍade yāvudannū khachitavāgi hēḷalla. Sāmān'yavāgi ēnu naḍeyutte anta saraḷavāgi hēḷtīni. Sarinā?"
    en: "First, one thing. Here I'm your friend, not your lawyer. Without seeing your papers I won't say anything for certain. I'll tell you simply what generally happens. All right?"
  - who: deepa
    t: "ಸರಿ. ಅಷ್ಟೇ ಬೇಕು."
    tr: "Sari. Aṣṭē bēku."
    en: "All right. That's all I need."
  - who: kaveri
    t: "ಹಿಂದೂ ವಿವಾಹ ಕಾಯ್ದೆಯ ಹದಿಮೂರು-ಬಿ ಸೆಕ್ಷನ್. ಗಂಡ-ಹೆಂಡತಿ ಕನಿಷ್ಠ ಒಂದು ವರ್ಷ ಬೇರೆಬೇರೆ ಇದ್ದಿರಬೇಕು. ಆಮೇಲೆ ಇಬ್ರೂ ಸೇರಿ ಜಂಟಿ ಅರ್ಜಿ ಹಾಕ್ತೀರಿ. ಅದು ಮೊದಲ ಮೋಷನ್. ನೀವು ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಮಾಡಿದ್ದು ಅದೇ."
    tr: "Hindū vivāha kāydeya hadimūru-bi sekṣan. Gaṇḍa-heṇḍati kaniṣṭha ondu varṣa bērebēre iddirabēku. Āmēle ibrū sēri jaṇṭi arji hāktīri. Adu modala mōṣan. Nīvu akṭōbar-nalli māḍiddu adē."
    en: "Section 13B of the Hindu Marriage Act. The husband and wife must have lived separately for at least one year. Then the two of you file a joint petition together. That's the first motion. That's what you did in October."
  - who: kaveri
    t: "ಅದಾದ ಮೇಲೆ ಕಾನೂನು ಆರು ತಿಂಗಳು ಕಾಯಿರಿ ಅನ್ನುತ್ತೆ. ಅದನ್ನ ‘ಕೂಲಿಂಗ್ ಪೀರಿಯಡ್’ ಅಂತಾರೆ. ಮನಸ್ಸು ಬದಲಾಗುತ್ತಾ ನೋಡೋಕೆ. ಆಮೇಲೆ ಎರಡನೇ ಮೋಷನ್. ಇಬ್ರೂ ಮತ್ತೆ ಕೋರ್ಟ್‌ಗೆ ಬಂದು ‘ಹೌದು, ನಮ್ಮ ನಿರ್ಧಾರ ಬದಲಾಗಿಲ್ಲ’ ಅಂತ ಹೇಳ್ತೀರಿ. ಆಮೇಲೆ ಡಿಕ್ರಿ."
    tr: "Adāda mēle kānūnu āru tiṅgaḷu kāyiri annutte. Adanna ‘kūliṅg pīriyaḍ’ antāre. Manassu badalāguttā nōḍōke. Āmēle eraḍanē mōṣan. Ibrū matte kōrṭ-ge bandu ‘haudu, namma nirdhāra badalāgilla’ anta hēḷtīri. Āmēle ḍikri."
    en: "After that, the law says wait six months. They call it the ‘cooling period’. To see if your minds change. Then the second motion. You both come back to court and say, ‘Yes, our decision hasn't changed.’ Then the decree."
  - who: deepa
    t: "ಅಂದ್ರೆ ಏಪ್ರಿಲ್‌ವರೆಗೆ ಹೀಗೇ ಕಾಯ್ಬೇಕಾ? ಆರು ತಿಂಗಳು ಮತ್ತೆ ಮತ್ತೆ ಇದನ್ನೇ ಯೋಚಿಸ್ತಾ?"
    tr: "Andre Ēpril-varege hīgē kāybēkā? Āru tiṅgaḷu matte matte idannē yōchistā?"
    en: "So I have to wait like this till April? Six months of thinking about this over and over?"
  - who: kaveri
    t: "ಯಾವಾಗ್ಲೂ ಅಲ್ಲ. ಎರಡು ಸಾವಿರದ ಹದಿನೇಳರಲ್ಲಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಒಂದು ತೀರ್ಪಲ್ಲಿ ಹೇಳಿದೆ, ಈ ಆರು ತಿಂಗಳು ಕಡ್ಡಾಯ ಅಲ್ಲ, ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ ಕೋರ್ಟ್ ಅದನ್ನ ಮನ್ನಾ ಮಾಡಬಹುದು ಅಂತ."
    tr: "Yāvāglū alla. Eraḍu sāvirada hadinēḷaralli Suprīṁ Kōrṭ ondu tīrpalli hēḷide, ī āru tiṅgaḷu kaḍḍāya alla, kelavu sandarbhagaḷalli kōrṭ adanna mannā māḍabahudu anta."
    en: "Not always. In 2017 the Supreme Court said in a judgment that these six months aren't mandatory — that in some situations the court may waive them."
  - who: kaveri
    t: "ಆದ್ರೆ ಷರತ್ತುಗಳಿವೆ. ಸಾಮಾನ್ಯವಾಗಿ ಒಟ್ಟು ಒಂದೂವರೆ ವರ್ಷಕ್ಕಿಂತ ಜಾಸ್ತಿ ಬೇರೆ ಇದ್ದಿರಬೇಕು, ರಾಜಿ ಪ್ರಯತ್ನ ವಿಫಲ ಆಗಿರಬೇಕು, ಜೀವನಾಂಶ, ಸ್ತ್ರೀಧನ, ಆಸ್ತಿ ಎಲ್ಲಾ ಇತ್ಯರ್ಥ ಆಗಿರಬೇಕು. ಕೇಳಿದ ತಕ್ಷಣ ಸಿಗಲ್ಲ. ಅದು ಕೋರ್ಟ್‌ನ ವಿವೇಚನೆ. ಪ್ರತಿ ಕೇಸ್ ಬೇರೆ."
    tr: "Ādre ṣarattugaḷive. Sāmān'yavāgi oṭṭu ondūvare varṣakkinta jāsti bēre iddirabēku, rāji prayatna viphala āgirabēku, jīvanāṁśa, strīdhana, āsti ellā ityartha āgirabēku. Kēḷida takṣaṇa sigalla. Adu kōrṭ-na vivēchane. Prati kēs bēre."
    en: "But there are conditions. Usually you must have lived apart for more than a year and a half in all, attempts at reconciliation must have failed, and maintenance, stridhan and property must all be settled. You don't get it just for asking. It's the court's discretion. Every case is different."
  - who: deepa
    t: "ಸೆಪ್ಟೆಂಬರ್‌ನಿಂದ ಲೆಕ್ಕ ಹಾಕಿದ್ರೆ ಮಾರ್ಚ್‌ಗೆ ಒಂದೂವರೆ ವರ್ಷ. ಎಲ್ಲಾ ಮಾತಾಡ್ಕೊಂಡಿದೀವಿ. ನಾನು ಜೀವನಾಂಶ ಏನೂ ಕೇಳಿಲ್ಲ. ನನ್ನ ಒಡವೆ ನನಗೆ. ಫ್ಲ್ಯಾಟ್ ಮಾರಿ ಅರ್ಧ ಅರ್ಧ. ಮಕ್ಕಳಿಲ್ಲ, ಅದಕ್ಕೆ ಕಸ್ಟಡಿ ಪ್ರಶ್ನೆನೇ ಇಲ್ಲ."
    tr: "Sepṭembar-ninda lekka hākidre Mārch-ge ondūvare varṣa. Ellā mātāḍkoṇḍidīvi. Nānu jīvanāṁśa ēnū kēḷilla. Nanna oḍave nanage. Phlyāṭ māri ardha ardha. Makkaḷilla, adakke kasṭaḍi praśnenē illa."
    en: "Counting from September, it'll be a year and a half by March. We've talked everything through. I haven't asked for any maintenance. My jewellery comes to me. We sell the flat and split it half and half. There are no children, so there's no question of custody."
  - who: kaveri
    t: "ಹಾಗಾದ್ರೆ ನಿನ್ನ ವಕೀಲರ ಜೊತೆ ಮನ್ನಾ ಅರ್ಜಿ ಬಗ್ಗೆ ಮಾತಾಡು. ಆಗಬಹುದು, ಆಗದೆನೂ ಇರಬಹುದು. ಒಂದು ವಿಷಯ ಮಾತ್ರ ಖಚಿತವಾಗಿ ಹೇಳ್ತೀನಿ, ಈ ಒಪ್ಪಂದ ಎಲ್ಲಾ ಬರಹದಲ್ಲಿ ಇರಲಿ. ಬಾಯಿಮಾತು ಬೇಡ. ಎಷ್ಟೇ ಒಳ್ಳೆಯವನಾದ್ರೂ."
    tr: "Hāgādre ninna vakīlara jote mannā arji bagge mātāḍu. Āgabahudu, āgadenū irabahudu. Ondu viṣaya mātra khachitavāgi hēḷtīni, ī oppanda ellā barahadalli irali. Bāyimātu bēḍa. Eṣṭē oḷḷeyavanādrū."
    en: "Then talk to your lawyer about a waiver application. It may work, it may not. One thing I'll say for certain: put this whole agreement in writing. No verbal promises. However good a man he is."
  - who: deepa
    t: "ಥ್ಯಾಂಕ್ಸ್ ಕಾವೇರಿ. ನನ್ನ ವಕೀಲರು ಒಂದು ಗಂಟೆ ಮಾತಾಡಿದ್ರು. ನೀನು ಐದು ನಿಮಿಷದಲ್ಲಿ ಅರ್ಥ ಮಾಡಿಸಿದೆ."
    tr: "Thyāṅks Kāvēri. Nanna vakīlaru ondu gaṇṭe mātāḍidru. Nīnu aidu nimiṣadalli artha māḍiside."
    en: "Thanks, Kaveri. My lawyer talked for an hour. You made me understand in five minutes."
  - who: kaveri
    t: "ಅವರು ಫೀಸ್ ತಗೋತಾರೆ, ಅದಕ್ಕೆ ಒಂದು ಗಂಟೆ. ನಾನು ಉಚಿತ, ಅದಕ್ಕೆ ಐದು ನಿಮಿಷ."
    tr: "Avaru phīs tagōtāre, adakke ondu gaṇṭe. Nānu uchita, adakke aidu nimiṣa."
    en: "He charges a fee, hence an hour. I'm free, hence five minutes."
  - scene: "Deepa laughs, wet-eyed. Shruti still has her hand."
  - section: "Between the three of us"
    learn: "asking for secrecy: yārigū hēḷbēḍi, namma mūrara madhye irli · promising: mātu koḍtīni, āṇe · the right time: sariyāda samaya bandāga nānē hēḷtīni · gratitude: hagura āytu"
  - who: deepa
    t: "ಒಂದು ಕೇಳ್ತೀನಿ. ಇದು ನಮ್ಮ ಮೂರರ ಮಧ್ಯೆನೇ ಇರಲಿ. ಹುಡುಗರಿಗೆ ಬೇಡ. ರಮ್ಯಾಗಂತೂ ಬೇಡ, ಅವಳು ಪ್ರೀತಿಯಿಂದಲೇ ಕ್ಯಾಮೆರಾ ಮುಂದೆ ಕೇಳಿಬಿಡ್ತಾಳೆ. ಸರಿಯಾದ ಸಮಯ ಬಂದಾಗ ನಾನೇ ಹೇಳ್ತೀನಿ."
    tr: "Ondu kēḷtīni. Idu namma mūrara madhyenē irali. Huḍugarige bēḍa. Ramyāgantū bēḍa, avaḷu prītiyindalē kyāmerā munde kēḷibiḍtāḷe. Sariyāda samaya bandāga nānē hēḷtīni."
    en: "I'm asking one thing. Let this stay between the three of us. Not the boys. And definitely not Ramya — she'd ask me in front of the camera, out of pure love. When the right time comes, I'll tell them myself."
  - who: shruti
    t: "ಮಾತು ಕೊಡ್ತೀನಿ. ಯಾರಿಗೂ ಹೇಳಲ್ಲ."
    tr: "Mātu koḍtīni. Yārigū hēḷalla."
    en: "I give you my word. I won't tell anyone."
  - who: kaveri
    t: "ವಕೀಲೆ ಮತ್ತೆ ಗೆಳತಿ, ಎರಡೂ ಆಗಿ ಮಾತು ಕೊಡ್ತೀನಿ. ಗೌಪ್ಯತೆ ನನ್ನ ವೃತ್ತಿ."
    tr: "Vakīle matte geḷati, eraḍū āgi mātu koḍtīni. Gaupyate nanna vr̥tti."
    en: "As a lawyer and as a friend, both, I give you my word. Confidentiality is my profession."
  - who: deepa
    t: "ಹದಿನೈದು ತಿಂಗಳಿಂದ ಇದನ್ನ ಎದೆಯ ಮೇಲೆ ಕಲ್ಲಿನ ತರ ಹೊತ್ತಿದ್ದೆ. ಈಗ ಸ್ವಲ್ಪ ಹಗುರ ಆಯ್ತು. ಈ ಟ್ರಿಪ್‌ಗೆ ಬರದೇ ಇದ್ದಿದ್ರೆ…"
    tr: "Hadinaidu tiṅgaḷinda idanna edeya mēle kallina tara hottidde. Īga svalpa hagura āytu. Ī ṭrip-ge baradē iddidre…"
    en: "For fifteen months I've carried this like a stone on my chest. Now it's a little lighter. If I hadn't come on this trip…"
  - who: shruti
    t: "ಬಂದ್ಯಲ್ಲಾ. ಅಷ್ಟೇ ಮುಖ್ಯ."
    tr: "Bandyallā. Aṣṭē mukhya."
    en: "But you came. That's all that matters."
  - who: kaveri
    t: "ಒಂದು ಪ್ರಾಕ್ಟಿಕಲ್ ವಿಷಯ. ಈ ಆರು ದಿನದಲ್ಲಿ ಕೋರ್ಟ್ ಕೆಲಸ ಏನಾದ್ರೂ ಇದ್ಯಾ? ನಿನ್ನ ಲಾಯರ್ ಫೋನ್ ಮಾಡಿದ್ರೆ?"
    tr: "Ondu prākṭikal viṣaya. Ī āru dinadalli kōrṭ kelasa ēnādrū idyā? Ninna lāyar phōn māḍidre?"
    en: "One practical thing. Is there any court work in these six days? What if your lawyer calls?"
  - who: deepa
    t: "ಮುಂದಿನ ಡೇಟ್ ಜನವರಿಯಲ್ಲಿ. ಸದ್ಯಕ್ಕೆ ಸೈನ್ ಮಾಡಬೇಕಾದ ಪೇಪರ್ ಎಲ್ಲಾ ಆಗಿದೆ. ಈ ಆರು ದಿನ ನಾನು ಯಾರ ಹೆಂಡತಿನೂ ಅಲ್ಲ, ಯಾರ ಕೇಸೂ ಅಲ್ಲ. ಬರೀ ದೀಪಾ."
    tr: "Mundina ḍēṭ janavariyalli. Sadyakke sain māḍabēkāda pēpar ellā āgide. Ī āru dina nānu yāra heṇḍatinū alla, yāra kēsū alla. Barī Dīpā."
    en: "The next date is in January. All the papers that needed signing for now are done. For these six days I'm nobody's wife and nobody's case. Just Deepa."
  - who: shruti
    t: "ಬರೀ ದೀಪಾ. ಅದೇ ಸಾಕು. ಸರಿ, ಈಗ ಒಂದು ಹಾಡು ಹಾಕೋಣ. ಕಾವೇರಿ, ನಿನ್ ಫೋನ್‌ನಲ್ಲಿ ಏನಿದೆ?"
    tr: "Barī Dīpā. Adē sāku. Sari, īga ondu hāḍu hākōṇa. Kāvēri, nin phōn-nalli ēnide?"
    en: "Just Deepa. That's enough. Right, let's put a song on. Kaveri, what's on your phone?"
  - who: kaveri
    t: "ಕೊಡವ ವಾಲಗ, ಇಲ್ಲಾಂದ್ರೆ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ತೀರ್ಪುಗಳ ಬಗ್ಗೆ ಒಂದು ಪಾಡ್‌ಕಾಸ್ಟ್. ಆರಿಸಿಕೊಳ್ಳಿ."
    tr: "Koḍava vālaga, illāndre Suprīṁ Kōrṭ tīrpugaḷa bagge ondu pāḍ-kāsṭ. Ārisikoḷḷi."
    en: "Kodava valaga music, or a podcast about Supreme Court judgments. Take your pick."
  - who: deepa
    t: "ವಾಲಗ! ಪ್ಲೀಸ್, ವಾಲಗನೇ."
    tr: "Vālaga! Plīs, vālaganē."
    en: "Valaga! Please — the valaga."
  - scene: "Meanwhile, a kilometre ahead in Arjun's car: Naveen asleep again in the back row, Prakash with his earphones in, eyes closed. Imran and Ramya talk in low voices. Arjun's phone lights up on its dashboard mount. A message. He reads it at a red signal and turns the screen off."
  - who: ramya
    t: "ಯಾರದ್ದು ಮರ್ರೆ, ರಾತ್ರಿ ಎಂಟು ಗಂಟೆಗೆ? ಆಫೀಸಾ?"
    tr: "Yāraddu marre, rātri eṇṭu gaṇṭege? Āphīsā?"
    en: "Who's that, man, at eight at night? The office?"
  - who: arjun
    t: "ಹೂಂ. ಒಬ್ಬ ಇನ್ವೆಸ್ಟರ್. ಏನಿಲ್ಲ. ಸೋಮವಾರ ನೋಡ್ಕೊಳ್ತೀನಿ."
    tr: "Hūṁ. Obba invesṭar. Ēnilla. Sōmavāra nōḍkoḷtīni."
    en: "Mm. An investor. It's nothing. I'll deal with it on Monday."
  - who: imran
    t: "ನಿನ್ ಮುಖ ನೋಡಿದ್ರ ‘ಏನಿಲ್ಲ’ ಅನ್ನಿಸೂದಿಲ್ಲ ಯಪ್ಪಾ. ಬಿಪಿ ಚೆಕ್ ಮಾಡ್ಲೇನು?"
    tr: "Nin mukha nōḍidra ‘ēnilla’ annisūdilla yappā. Bi-pi chek māḍlēnu?"
    en: "Looking at your face, it doesn't seem like ‘nothing’, yappa. Shall I check your BP?"
  - who: arjun
    t: "ಡಾಕ್ಟ್ರೇ, ನಿಮ್ ಸ್ಟೆತಸ್ಕೋಪ್ ಬ್ಯಾಗ್‌ನಲ್ಲೇ ಇರಲಿ. ಕಮಲಾಪುರ ಬಂತು. ಎಲ್ರನ್ನೂ ಎಬ್ಬಿಸಿ."
    tr: "Ḍākṭrē, nim sṭetaskōp byāg-nallē irali. Kamalāpura bantu. Ellrannū ebbisi."
    en: "Doctor, keep your stethoscope in your bag. Here's Kamalapur. Wake everyone up."
  - scene: "Prakash takes out one earphone. He has heard everything."
  - who: prakash
    t: "ಡಾಕ್ಟ್ರೇ, ಬಿಪಿ ಚೆಕ್ ಮಾಡೋದಾದ್ರ ಎಲ್ಲಾರಿಗೂ ಮಾಡು. ಇವತ್ತು ಎಲ್ಲಾರದೂ ಸ್ವಲ್ಪ ಜಾಸ್ತಿನೇ ಐತಿ."
    tr: "Ḍākṭrē, bi-pi chek māḍōdādra ellārigū māḍu. Ivattu ellāradū svalpa jāstinē aiti."
    en: "Doctor, if you're checking BP, check everyone's. Today everyone's is a little high."
  - who: ramya
    t: "ಪ್ರಕಾಶ್, ಮಧ್ಯಾಹ್ನದ ವಿಷಯ… ನೀನು ಇನ್ನೂ ಬೇಜಾರಲ್ಲಿ ಇದೀಯಾ?"
    tr: "Prakāś, madhyāhnada viṣaya… nīnu innū bējāralli idīyā?"
    en: "Prakash, about this afternoon… are you still upset?"
  - who: prakash
    t: "ಬೇಜಾರು ಅಲ್ಲ, ರಮ್ಯಾ. ಒಂದು ಹಳೇ ಗಾಯ ತೆರೆದಂಗ ಆತು ಅಷ್ಟೇ. ಗಾಯ ಒಂದು ದಿನದಾಗ ಒಣಗಂಗಿಲ್ಲ. ಡಾಕ್ಟರ್‌ಗೆ ಕೇಳು."
    tr: "Bējāru alla, Ramyā. Ondu haḷē gāya teredaṅga ātu aṣṭē. Gāya ondu dinadāga oṇagaṅgilla. Ḍākṭar-ge kēḷu."
    en: "It's not being upset, Ramya. It's as if an old wound opened, that's all. A wound doesn't heal in one day. Ask the doctor."
  - who: imran
    t: "ಖರೇ. ಮೊದಲು ಸ್ವಚ್ಛ ಮಾಡಬೇಕು, ಆಮೇಲೆ ಸಮಯ ಕೊಡಬೇಕು. ಡ್ರೆಸ್ಸಿಂಗ್ ಮಾಡೋರು ಮಾತ್ರ ಸರಿಯಾದವರಾಗಿರಬೇಕು."
    tr: "Kharē. Modalu svachchha māḍabēku, āmēle samaya koḍabēku. Ḍressiṅg māḍōru mātra sariyādavarāgirabēku."
    en: "True. First you have to clean it, then give it time. Only the person who dresses it has to be the right one."
  - scene: "Arjun's eyes go to the rear-view mirror, to Prakash, and back to the road. From the back row, Naveen, who is not quite asleep, says nothing."
  - who: ramya
    t: "ನವೀನ್, ನೀನು ನಿದ್ದೆ ಮಾಡ್ತಿಲ್ಲ ಅಂತ ಗೊತ್ತು. ಕಣ್ಣು ಮುಚ್ಕೊಂಡು ಎಲ್ಲಾ ಕೇಳ್ತಿದೀಯಾ ಅಲ್ವಾ?"
    tr: "Navīn, nīnu nidde māḍtilla anta gottu. Kaṇṇu muchkoṇḍu ellā kēḷtidīyā alvā?"
    en: "Naveen, I know you're not asleep. You're listening to everything with your eyes shut, aren't you?"
  - who: naveen
    t: "ಕೇಳ್ತಾ ಉಂಟು. ಹೋಟೆಲ್ ಕೌಂಟರ್‌ನಲ್ಲಿ ಕೂತು ಕೂತು ಅಭ್ಯಾಸ. ಕಣ್ಣು ಮುಚ್ಚಿದ್ರೂ ಕಿವಿ ತೆರೆದೇ ಇರ್ತದೆ."
    tr: "Kēḷtā uṇṭu. Hōṭel kauṇṭar-nalli kūtu kūtu abhyāsa. Kaṇṇu mucchidrū kivi teredē irtade."
    en: "I'm listening. A habit from years of sitting at the hotel counter. Even with my eyes shut, my ears stay open."
  - who: arjun
    t: "ಹಾಗಾದ್ರೆ ಕಿವಿಗೂ ಸ್ವಲ್ಪ ರೆಸ್ಟ್ ಕೊಡು ಮಗಾ. ನಾಳೆ ಬೇಗ ಏಳ್ಬೇಕು."
    tr: "Hāgādre kivigū svalpa resṭ koḍu magā. Nāḷe bēga ēḷbēku."
    en: "Then give your ears a rest too, maga. We have to be up early tomorrow."
  - who: naveen
    t: "ನಾನು ಬೇಗ ಏಳ್ತೇನೆ. ನೀನು ನಿನ್ನ ಮೆಸೇಜುಗಳಿಗೆ ಬೇಗ ಉತ್ತರ ಕೊಡು. ಕೆಲವರು ಕಾಯ್ತಾ ಇರ್ತಾರೆ, ಗೊತ್ತುಂಟಲ್ವಾ."
    tr: "Nānu bēga ēḷtēne. Nīnu ninna mesējugaḷige bēga uttara koḍu. Kelavaru kāytā irtāre, gottuṇṭalvā."
    en: "I'll be up early. You answer your messages early. Some people are kept waiting — you know that, don't you."
  - scene: "Arjun's hands tighten on the wheel. Ramya looks from one to the other and, for once, does not ask."
  - scene: "9:10 p.m. A homestay at the edge of Kamalapur, under a dark hill of boulders. The two cars pull in a minute apart. Stars, cold air, the smell of woodsmoke. Shruti gets out with her arm around Deepa; Kaveri carries Deepa's bag. Nobody in the other car notices anything."
  - chapter: "Chapter 5 — Hampi"
  - section: "Morning call from Dharwad"
    learn: "an elder on the phone: ēnappā, ellārū āramāgiddāra?, ūṭa āyta? · Dharwad hospitality: eṇṭu manshyāra aḍigi, khāra kaḍimi, pēḍa tandiṭṭēni · a son's patience: haudavva, ātavva, chintī māḍbyāḍa"
  - scene: "Saturday, 5 December 2026, 7:15 a.m. The homestay veranda in Kamalapur. Mist sits on the boulder hills. The owner's boy brings idli-vada and tea in steel tumblers. Prakash's phone rings; he puts it on speaker so everyone can greet his mother."
  - who: amma
    t: "ಏನಪ್ಪಾ ಪ್ರಕಾಶಾ, ಎದ್ದೀಯೇನು? ಎಲ್ಲಾರೂ ಆರಾಮದಾರ? ಚಳಿ ಭಾಳ ಐತೇನು ಅಲ್ಲಿ?"
    tr: "Ēnappā Prakāśā, eddīyēnu? Ellārū ārāmadāra? Chaḷi bhāḷa aitēnu alli?"
    en: "Well, Prakasha, are you up? Is everyone well? Is it very cold there?"
  - who: prakash
    t: "ಹೌದವ್ವ, ಎಲ್ಲಾರೂ ಆರಾಮ ಅದೇವಿ. ನೋಡು, ಎಲ್ಲಾರೂ ಇಲ್ಲೇ ಕುಂತಾರ, ಸ್ಪೀಕರ್ ಹಾಕೇನಿ. ನಿನಗ ನಮಸ್ಕಾರ ಹೇಳತಾರ."
    tr: "Haudavva, ellārū ārāma adēvi. Nōḍu, ellārū illē kuntāra, spīkar hākēni. Ninaga namaskāra hēḷatāra."
    en: "Yes, Avva, we're all well. Look, everyone's sitting right here; I've put you on speaker. They're saying namaskara to you."
  - who: deepa
    t: "ನಮಸ್ಕಾರ ಅಮ್ಮ! ನಾನು ದೀಪಾ, ಮೈಸೂರು. ನಾಳೆ ನಿಮ್ಮ ಮನೆಗೆ ಬರ್ತಿದೀವಿ. ತುಂಬಾ ತೊಂದರೆ ಕೊಡ್ತಿದೀವಿ, ಕ್ಷಮಿಸಿ."
    tr: "Namaskāra amma! Nānu Dīpā, Maisūru. Nāḷe nimma manege bartidīvi. Tumbā tondare koḍtidīvi, kṣamisi."
    en: "Namaskara, Amma! I'm Deepa, from Mysuru. We're coming to your house tomorrow. We're giving you so much trouble — please forgive us."
  - who: amma
    t: "ತೊಂದರೆ ಏನವ್ವ? ಮನಿಗೆ ಮಕ್ಕಳು ಬರೋದು ತೊಂದರೆನಾ? ಎಂಟು ಮಂದಿಗೆ ರೊಟ್ಟಿ ಹಿಟ್ಟು ಕಲಸಿ ಇಟ್ಟೇನಿ. ಯಾರಿಗೆ ಖಾರ ಕಡಿಮಿ ಬೇಕು, ಈಗಲೇ ಹೇಳರಿ."
    tr: "Tondare ēnavva? Manige makkaḷu barōdu tondarenā? Eṇṭu mandige roṭṭi hiṭṭu kalasi iṭṭēni. Yārige khāra kaḍimi bēku, īgalē hēḷari."
    en: "What trouble, child? Is it trouble when children come home? I've already got the rotti flour ready for eight. Whoever wants it less spicy, tell me now."
  - who: arjun
    t: "ನಮಸ್ಕಾರ ಅಮ್ಮ, ನಾನು ಅರ್ಜುನ್. ಬೆಂಗಳೂರು. ನನಗೆ ಖಾರ ಸ್ವಲ್ಪ ಕಡಿಮೆ, ಪ್ಲೀಸ್."
    tr: "Namaskāra amma, nānu Arjun. Beṅgaḷūru. Nanage khāra svalpa kaḍime, plīs."
    en: "Namaskara, Amma, I'm Arjun. From Bengaluru. A little less spicy for me, please."
  - who: amma
    t: "ಆತಪ್ಪ. ಬೆಂಗಳೂರಿನವರಿಗೆ ಖಾರ ಕಡಿಮಿ, ಗೊತ್ತೈತಿ. ಪ್ರಕಾಶ ನಿನ್ನ ಬಗ್ಗೆ ಭಾಳ ಹೇಳತಿದ್ದ, ಕಾಲೇಜಿನ್ಯಾಗ. ಬರ್ರಿ, ಎಲ್ಲಾರೂ ಬರ್ರಿ. ಪೇಡ ತಂದಿಟ್ಟೇನಿ."
    tr: "Ātappa. Beṅgaḷūrinavarige khāra kaḍimi, gottaiti. Prakāśa ninna bagge bhāḷa hēḷatidda, kālējinyāga. Barri, ellārū barri. Pēḍa tandiṭṭēni."
    en: "All right, son. Less spice for the Bengaluru folk, I know. Prakash used to talk about you a lot, in his college days. Come, all of you, come. I've brought the peda already."
  - scene: "Arjun glances at Prakash. Prakash is looking at the phone, not at him."
  - who: prakash
    t: "ಆತವ್ವ, ಇಡತೇನಿ. ಚಿಂತಿ ಮಾಡಬ್ಯಾಡ. ನಾಳೆ ಮಧ್ಯಾಹ್ನದೊಳಗ ಬರತೇವಿ."
    tr: "Ātavva, iḍatēni. Chinti māḍabyāḍa. Nāḷe madhyāhnadoḷaga baratēvi."
    en: "All right, Avva, I'll hang up. Don't worry. We'll be there by tomorrow afternoon."
  - who: arjun
    t: "ನವೀನ್, ಇವತ್ತಿನ ಹೋಮ್‌ಸ್ಟೇ ಅಡ್ವಾನ್ಸ್ ನಾನು ಕೊಟ್ಟಿದೀನಿ, ಆ್ಯಪ್‌ನಲ್ಲಿ ಹಾಕಿದೀನಿ. ಇವತ್ತು ನನ್ ಕಾರಲ್ಲಿ ಬಾ, ಸ್ವಲ್ಪ ಮಾತಾಡೋಣ."
    tr: "Navīn, ivattina hōmsṭē aḍvāns nānu koṭṭidīni, āyp-nalli hākidīni. Ivattu nan kāralli bā, svalpa mātāḍōṇa."
    en: "Naveen, I've paid today's homestay advance and put it in the app. Come in my car today; let's talk a bit."
  - who: naveen
    t: "ಆ್ಯಪ್‌ನಲ್ಲಿ ನೋಡಿದೆ. ನನ್ನ ಪಾಲು ಕ್ಯಾಶ್‌ನಲ್ಲಿ ಕೊಡ್ತೇನೆ. ಇವತ್ತು ಕಾರ್ ಬೇಡ, ಎಲ್ಲಾ ಹತ್ರವೇ ಉಂಟು. ಮಾತು… ಆಮೇಲೆ."
    tr: "Āyp-nalli nōḍide. Nanna pālu kyāś-nalli koḍtēne. Ivattu kār bēḍa, ellā hatravē uṇṭu. Mātu… āmēle."
    en: "I saw it in the app. I'll give you my share in cash. No car needed today, everything's close by. The talk… later."
  - scene: "Naveen gets up and goes to wash his tumbler. Kaveri and Imran exchange a look across the table."
  - section: "The guide at Virupaksha"
    learn: "formal heritage register: ivattu nāvu nōḍuttiruvudu…, endu hēḷalāguttade, nirmisalāyitu, saṁrakṣisalāgide · history words: sāmrājya, rājadhāni, dore, gōpura, maṇṭapa, sthāpane, patana · respectful requests: dayaviṭṭu, muṭṭabēḍi, chappali horage biḍi · numbers as years: sāvirada munnūra mūvattāru"
  - scene: "8:30 a.m. In front of the tall eastern gopura of the Virupaksha temple in Hampi. A licensed guide in a white shirt with an identity card on a lanyard greets them. Pilgrims, a temple bell, the smell of camphor."
  - who: guide
    t: "ನಮಸ್ಕಾರ. ನನ್ನ ಹೆಸರು ಬಸವರಾಜ. ನಾನು ಪ್ರವಾಸೋದ್ಯಮ ಇಲಾಖೆಯ ಪರವಾನಗಿ ಪಡೆದ ಮಾರ್ಗದರ್ಶಿ. ಇದು ನನ್ನ ಗುರುತಿನ ಚೀಟಿ. ಶುಲ್ಕ ಸರ್ಕಾರ ನಿಗದಿಪಡಿಸಿದ ದರದಂತೆ. ಮೊದಲು ಹಣ ಕೊಡಬೇಕಾಗಿಲ್ಲ, ಪ್ರವಾಸ ಮುಗಿದ ಮೇಲೆ ಕೊಡಿ."
    tr: "Namaskāra. Nanna hesaru Basavarāja. Nānu pravāsōdyama ilākheya paravānagi paḍeda mārgadarśi. Idu nanna gurutina chīṭi. Śulka sarkāra nigadipaḍisida daradante. Modalu haṇa koḍabēkāgilla, pravāsa mugida mēle koḍi."
    en: "Namaskara. My name is Basavaraja. I am a guide licensed by the Tourism Department. This is my identity card. The fee is as per the government-fixed rate. You need not pay in advance; pay when the tour is over."
  - who: kaveri
    t: "ಧನ್ಯವಾದ ಸಾರ್. ನೀವು ಕಾರ್ಡ್ ತೋರಿಸಿದ್ದು ಒಳ್ಳೆಯದಾಯ್ತು."
    tr: "Dhanyavāda sār. Nīvu kārḍ tōrisiddu oḷḷeyadāytu."
    en: "Thank you, sir. It's good that you showed us your card."
  - who: guide
    t: "ನೀವು ಈಗ ನಿಂತಿರುವುದು ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯದ ಮುಂದೆ. ಇದು ಹಂಪಿಯ ಜೀವಂತ ದೇವಾಲಯ. ಇಲ್ಲಿನ ಬಹುತೇಕ ಸ್ಮಾರಕಗಳು ಪಾಳುಬಿದ್ದಿವೆ, ಆದರೆ ಇಲ್ಲಿ ಪೂಜೆ ಎಂದೂ ನಿಂತಿಲ್ಲ. ಏಳನೇ ಶತಮಾನದಿಂದಲೇ ಇಲ್ಲಿ ಪೂಜೆ ನಡೆಯುತ್ತಿತ್ತು ಎಂದು ಹೇಳಲಾಗುತ್ತದೆ."
    tr: "Nīvu īga nintiruvudu Virūpākṣa dēvālayada munde. Idu Hampiya jīvanta dēvālaya. Illina bahutēka smārakagaḷu pāḷubiddive, ādare illi pūje endū nintilla. Ēḷanē śatamānadindalē illi pūje naḍeyuttittu endu hēḷalāguttade."
    en: "You are now standing in front of the Virupaksha temple. This is Hampi's living temple. Most of the monuments here lie in ruins, but worship here has never stopped. It is said that worship was going on here as early as the seventh century."
  - who: ramya
    t: "ಸಾರ್, ಒಂದು ನಿಮಿಷ. ನಾನು ರೆಕಾರ್ಡ್ ಮಾಡ್ಬೋದಾ? ಒಂದು ವ್ಲಾಗ್‌ಗೆ."
    tr: "Sār, ondu nimiṣa. Nānu rekārḍ māḍbōdā? Ondu vlāg-ge."
    en: "Sir, one minute. May I record? It's for a vlog."
  - who: guide
    t: "ಹೊರಗೆ ಮಾಡಬಹುದು ಮೇಡಂ. ಗರ್ಭಗುಡಿಯ ಒಳಗೆ ಕ್ಯಾಮೆರಾ ನಿಷೇಧ. ಅಲ್ಲಿ ದಯವಿಟ್ಟು ಫೋನ್ ಒಳಗಿಡಿ."
    tr: "Horage māḍabahudu mēḍam. Garbhaguḍiya oḷage kyāmerā niṣēdha. Alli dayaviṭṭu phōn oḷagiḍi."
    en: "Outside you may, madam. Cameras are prohibited inside the sanctum. There, kindly put your phone away."
  - who: guide
    t: "ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸಾವಿರದ ಮುನ್ನೂರ ಮೂವತ್ತಾರರಲ್ಲಿ ಹರಿಹರ ಮತ್ತು ಬುಕ್ಕ ಎಂಬ ಸಹೋದರರು ಸ್ಥಾಪಿಸಿದರು ಎಂದು ಇತಿಹಾಸ ಹೇಳುತ್ತದೆ. ಸುಮಾರು ಇನ್ನೂರ ಮೂವತ್ತು ವರ್ಷ ಈ ಹಂಪಿ ಅದರ ರಾಜಧಾನಿ. ಆ ಕಾಲದಲ್ಲಿ ಪ್ರಪಂಚದ ಅತಿ ದೊಡ್ಡ ನಗರಗಳಲ್ಲಿ ಇದೂ ಒಂದು."
    tr: "Vijayanagara sāmrājyavannu sāvirada munnūra mūvattāraralli Harihara mattu Bukka emba sahōdararu sthāpisidaru endu itihāsa hēḷuttade. Sumāru innūra mūvattu varṣa ī Hampi adara rājadhāni. Ā kāladalli prapañchada ati doḍḍa nagaragaḷalli idū ondu."
    en: "History tells us that the Vijayanagara empire was founded in 1336 by two brothers, Harihara and Bukka. For about two hundred and thirty years this Hampi was its capital. In that age it was one of the largest cities in the world."
  - who: imran
    t: "ಸಾರ್, ಕೃಷ್ಣದೇವರಾಯರ ಕಾಲ ಇದರ ಸುವರ್ಣಯುಗ ಅಂತಾರಲ್ಲ, ಅದು ಯಾವಾಗ?"
    tr: "Sār, Kr̥ṣṇadēvarāyara kāla idara suvarṇayuga antāralla, adu yāvāga?"
    en: "Sir, they say Krishnadevaraya's time was its golden age — when was that?"
  - who: guide
    t: "ಒಳ್ಳೆಯ ಪ್ರಶ್ನೆ. ಕೃಷ್ಣದೇವರಾಯರು ಸಾವಿರದ ಐನೂರ ಒಂಬತ್ತರಿಂದ ಸುಮಾರು ಇಪ್ಪತ್ತು ವರ್ಷ ಆಳಿದರು. ಈ ದೇವಾಲಯದ ಒಳಗಿನ ರಂಗಮಂಟಪವನ್ನು ಅವರ ಪಟ್ಟಾಭಿಷೇಕದ ಸಂದರ್ಭದಲ್ಲಿ ಕಟ್ಟಿಸಿದರು ಎಂದು ಶಾಸನ ಹೇಳುತ್ತದೆ. ಒಳಗೆ ಹೋದಾಗ ತೋರಿಸುತ್ತೇನೆ."
    tr: "Oḷḷeya praśne. Kr̥ṣṇadēvarāyaru sāvirada ainūra ombattarinda sumāru ippattu varṣa āḷidaru. Ī dēvālayada oḷagina raṅgamaṇṭapavannu avara paṭṭābhiṣēkada sandarbhadalli kaṭṭisidaru endu śāsana hēḷuttade. Oḷage hōdāga tōrisuttēne."
    en: "A good question. Krishnadevaraya ruled for about twenty years from 1509. An inscription says he had the ranga-mantapa inside this temple built at the time of his coronation. I will show you when we go in."
  - scene: "Inside, the guide leads them to a small dark chamber at the back. On the wall, through a narrow opening, an upside-down image of the great gopura appears in soft light."
  - who: guide
    t: "ಈಗ ಗೋಡೆಯನ್ನು ನೋಡಿ. ಹೊರಗಿನ ಗೋಪುರದ ಚಿತ್ರ ತಲೆಕೆಳಗಾಗಿ ಕಾಣುತ್ತಿದೆ. ಒಂದು ಸಣ್ಣ ಕಿಂಡಿಯಿಂದ ಬೆಳಕು ಬಂದು ಈ ಚಿತ್ರ ಮೂಡುತ್ತದೆ. ಇದನ್ನು ಪಿನ್‌ಹೋಲ್ ಕ್ಯಾಮೆರಾ ತತ್ವ ಎನ್ನುತ್ತಾರೆ. ನಮ್ಮ ಶಿಲ್ಪಿಗಳಿಗೆ ಇದು ಐನೂರು ವರ್ಷಗಳ ಹಿಂದೆಯೇ ತಿಳಿದಿತ್ತು."
    tr: "Īga gōḍeyannu nōḍi. Horagina gōpurada chitra talekeḷagāgi kāṇuttide. Ondu saṇṇa kiṇḍiyinda beḷaku bandu ī chitra mūḍuttade. Idannu pin-hōl kyāmerā tatva ennuttāre. Namma śilpigaḷige idu ainūru varṣagaḷa hindeyē tiḷidittu."
    en: "Now look at the wall. The image of the gopura outside appears upside down. Light comes through a small opening and forms this picture. This is called the pinhole-camera principle. Our sculptors knew it five hundred years ago."
  - who: prakash
    t: "ನನ್ ಸಾಲೀ ಮಕ್ಕಳಿಗೆ ಭೌತಶಾಸ್ತ್ರದಾಗ ಇದನ್ನ ಪಾಠ ಮಾಡತೇನಿ. ಮುಂದಿನ ವರ್ಷ ಅವರನ್ನ ಇಲ್ಲಿಗೆ ಕರಕೊಂಡು ಬರಬೇಕು. ಪುಸ್ತಕಕ್ಕಿಂತ ಈ ಗೋಡೆ ದೊಡ್ಡ ಮೇಷ್ಟ್ರು."
    tr: "Nan sālī makkaḷige bhautaśāstradāga idanna pāṭha māḍatēni. Mundina varṣa avaranna illige karakoṇḍu barabēku. Pustakakkinta ī gōḍe doḍḍa mēṣṭru."
    en: "I teach this to my school kids in physics. Next year I must bring them here. This wall is a better teacher than any textbook."
  - section: "Ruins, a battle, a collapse"
    learn: "telling the fall: yuddha, sōlu, nagaravannu lūṭi māḍidaru, āru tiṅgaḷu · heritage and care: yunesko viśva paraṁpare tāṇa, kusiyitu, punaśchētana · the guide's polite warnings: kambagaḷannu muṭṭabēḍi, hattabēḍi · the ₹50 note: aivattu rūpāyi nōṭina mēle"
  - scene: "10:15 a.m. Outside, along the old bazaar street. A long row of stone pavilions, some of them propped with steel supports and fenced off."
  - who: guide
    t: "ಇವು ಸಾಲು ಮಂಟಪಗಳು. ಹಿಂದೆ ಇಲ್ಲಿ ವ್ಯಾಪಾರಿಗಳು ಮುತ್ತು, ರತ್ನ, ಕುದುರೆ ಮಾರುತ್ತಿದ್ದರು ಎಂದು ವಿದೇಶಿ ಪ್ರವಾಸಿಗರು ಬರೆದಿದ್ದಾರೆ. ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ನಾಲ್ಕರ ಮೇ ತಿಂಗಳಲ್ಲಿ ಭಾರಿ ಮಳೆಗೆ ಈ ಮಂಟಪದ ಒಂದು ಭಾಗ ಕುಸಿಯಿತು. ಅದಕ್ಕೇ ಬೇಲಿ ಹಾಕಿದ್ದಾರೆ. ದಯವಿಟ್ಟು ಒಳಗೆ ಹೋಗಬೇಡಿ."
    tr: "Ivu sālu maṇṭapagaḷu. Hinde illi vyāpārigaḷu muttu, ratna, kudure māruttiddaru endu vidēśi pravāsigaru barediddāre. Eraḍu sāvirada ippatnālkara Mē tiṅgaḷalli bhāri maḷege ī maṇṭapada ondu bhāga kusiyitu. Adakkē bēli hākiddāre. Dayaviṭṭu oḷage hōgabēḍi."
    en: "These are the row pavilions. Foreign travellers wrote that merchants here once sold pearls, gems and horses. In May 2024 part of this pavilion collapsed in heavy rain. That is why it is fenced. Kindly do not go inside."
  - who: naveen
    t: "ಐನೂರು ವರ್ಷ ಯುದ್ಧ, ಬಿಸಿಲು ತಡ್ಕೊಂಡು ನಿಂತಿತ್ತು. ಒಂದು ಮಳೆಗೆ ಬಿತ್ತು. ಎಂತ ಹೇಳುವುದು ಮಾರಾಯ."
    tr: "Ainūru varṣa yuddha, bisilu taḍkoṇḍu nintittu. Ondu maḷege bittu. Enta hēḷuvudu mārāya."
    en: "It stood through five hundred years of war and sun. And fell in one rain. What can you say, maraya."
  - who: guide
    t: "ನಿಜ ಸಾರ್. ಸಂರಕ್ಷಣೆ ನಿರಂತರ ಕೆಲಸ. ಹಂಪಿಗೆ ಸಾವಿರದ ಒಂಬೈನೂರ ಎಂಬತ್ತಾರರಲ್ಲಿ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆ ತಾಣದ ಸ್ಥಾನ ಸಿಕ್ಕಿತು. ಆದರೆ ಪಟ್ಟಿಯಲ್ಲಿ ಹೆಸರು ಇದ್ದರೆ ಸಾಲದು, ಪ್ರತಿ ವರ್ಷ ಹಣ, ಕೆಲಸಗಾರರು, ಕಾಳಜಿ ಬೇಕು."
    tr: "Nija sār. Saṁrakṣaṇe nirantara kelasa. Hampige sāvirada ombainūra embattāraralli Yuneskō viśva paraṁpare tāṇada sthāna sikkitu. Ādare paṭṭiyalli hesaru iddare sāladu, prati varṣa haṇa, kelasagāraru, kāḷaji bēku."
    en: "True, sir. Conservation is continuous work. Hampi became a UNESCO World Heritage Site in 1986. But having a name on a list is not enough; every year it needs money, workers and care."
  - who: shruti
    t: "ಸಾರ್, ಇಷ್ಟು ದೊಡ್ಡ ನಗರ ಹೇಗೆ ಹೀಗೆ ಪಾಳು ಬಿತ್ತು?"
    tr: "Sār, iṣṭu doḍḍa nagara hēge hīge pāḷu bittu?"
    en: "Sir, how did such a great city fall into ruins like this?"
  - who: guide
    t: "ಸಾವಿರದ ಐನೂರ ಅರವತ್ತೈದರಲ್ಲಿ ತಾಳಿಕೋಟೆ ಯುದ್ಧ ನಡೆಯಿತು. ಕೆಲವರು ಅದನ್ನು ರಕ್ಕಸ-ತಂಗಡಿ ಯುದ್ಧ ಎನ್ನುತ್ತಾರೆ. ಡೆಕ್ಕನ್ ಸುಲ್ತಾನರ ಒಗ್ಗೂಡಿದ ಸೈನ್ಯದ ಎದುರು ವಿಜಯನಗರ ಸೋತಿತು. ಅದರ ನಂತರ ಹಲವು ತಿಂಗಳು ನಗರವನ್ನು ಲೂಟಿ ಮಾಡಿ ಸುಟ್ಟರು ಎಂದು ದಾಖಲೆಗಳು ಹೇಳುತ್ತವೆ. ನೀವು ನೋಡುತ್ತಿರುವ ಒಡೆದ ಕಂಬಗಳು ಆ ಕಥೆಯನ್ನೇ ಹೇಳುತ್ತವೆ."
    tr: "Sāvirada ainūra aravattaidaralli Tāḷikōṭe yuddha naḍeyitu. Kelavaru adannu Rakkasa-Taṅgaḍi yuddha ennuttāre. Ḍekkan sultānara oggūḍida sainyada eduru Vijayanagara sōtitu. Adara nantara halavu tiṅgaḷu nagaravannu lūṭi māḍi suṭṭaru endu dākhalegaḷu hēḷuttave. Nīvu nōḍuttiruva oḍeda kambagaḷu ā katheyannē hēḷuttave."
    en: "In 1565 the battle of Talikota was fought. Some call it the battle of Rakkasa-Tangadi. Vijayanagara was defeated by the combined army of the Deccan Sultans. The records say that for many months after that, the city was looted and burned. The broken pillars you are looking at tell that very story."
  - who: imran
    t: "ಅದು ನಮ್ ಕಡೆ ಇತಿಹಾಸ ಭೀ. ಬಹಮನಿ ಸುಲ್ತಾನರ ಮೊದಲ ರಾಜಧಾನಿ ಕಲಬುರಗಿನೇ. ಸಾಲೀ ಪುಸ್ತಕದಾಗ ಒಬ್ಬರು ಹೀರೋ, ಒಬ್ಬರು ವಿಲನ್. ಆದ್ರ ಯುದ್ಧದಾಗ ಸತ್ತೋರು ಎರಡೂ ಕಡೆ ಸಾಮಾನ್ಯ ಜನಾನೇ, ಸಾರ್."
    tr: "Adu nam kaḍe itihāsa bhī. Bahamani sultānara modala rājadhāni Kalaburaginē. Sālī pustakadāga obbaru hīrō, obbaru vilan. Ādra yuddhadāga sattōru eraḍū kaḍe sāmān'ya janānē, sār."
    en: "That's my side's history too. The first capital of the Bahmani sultans was Kalaburagi itself. In schoolbooks one side is the hero and the other the villain. But the ones who died in war, on both sides, were ordinary people, sir."
  - who: guide
    t: "ತುಂಬಾ ಸರಿಯಾದ ಮಾತು ಡಾಕ್ಟರೇ. ನಾನು ಪ್ರವಾಸಿಗರಿಗೆ ಇದನ್ನೇ ಹೇಳಲು ಪ್ರಯತ್ನಿಸುತ್ತೇನೆ. ಇತಿಹಾಸ ದ್ವೇಷ ಕಲಿಸಬಾರದು, ಎಚ್ಚರಿಕೆ ಕಲಿಸಬೇಕು."
    tr: "Tumbā sariyāda mātu ḍākṭarē. Nānu pravāsigarige idannē hēḷalu prayatnisuttēne. Itihāsa dvēṣa kalisabāradu, eccharike kalisabēku."
    en: "A very true word, Doctor. That is exactly what I try to tell visitors. History should not teach hatred; it should teach caution."
  - scene: "11:30 a.m. The Vittala temple. The stone chariot stands in the courtyard, its stone wheels worn smooth."
  - who: guide
    t: "ಇದು ಕಲ್ಲಿನ ರಥ. ಐವತ್ತು ರೂಪಾಯಿ ನೋಟಿನ ಹಿಂಭಾಗದಲ್ಲಿ ಇದರ ಚಿತ್ರ ಇದೆ, ನೋಡಿ. ಆ ಮಂಟಪದ ಕಂಬಗಳನ್ನು ತಟ್ಟಿದರೆ ಸಂಗೀತದ ಸ್ವರ ಬರುತ್ತಿತ್ತು. ಈಗ ಹಾನಿ ತಪ್ಪಿಸಲು ಕಂಬಗಳನ್ನು ಮುಟ್ಟುವುದನ್ನು ನಿಷೇಧಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ದೂರದಿಂದಲೇ ನೋಡಿ."
    tr: "Idu kallina ratha. Aivattu rūpāyi nōṭina hiṁbhāgadalli idara chitra ide, nōḍi. Ā maṇṭapada kambagaḷannu taṭṭidare saṅgītada svara baruttittu. Īga hāni tappisalu kambagaḷannu muṭṭuvudannu niṣēdhisalāgide. Dayaviṭṭu dūradindalē nōḍi."
    en: "This is the stone chariot. Its picture is on the back of the fifty-rupee note — see. If you tapped the pillars of that pavilion, musical notes would come out. Now, to prevent damage, touching the pillars is prohibited. Kindly look from a distance."
  - who: ramya
    t: "ನವೀನ್, ನಿನ್ ಪರ್ಸ್‌ನಲ್ಲಿ ಐವತ್ತು ರೂಪಾಯಿ ನೋಟ್ ಉಂಟಾ? ರಥದ ಮುಂದೆ ನೋಟ್ ಹಿಡ್ಕೊಂಡು ಒಂದು ಶಾಟ್! ಬತ್ತೆ, ಬತ್ತೆ, ಇಲ್ಲೇ ನಿಲ್ಲು!"
    tr: "Navīn, nin pars-nalli aivattu rūpāyi nōṭ uṇṭā? Rathada munde nōṭ hiḍkoṇḍu ondu śāṭ! Batte, batte, illē nillu!"
    en: "Naveen, have you got a fifty-rupee note in your wallet? One shot holding the note in front of the chariot! I'm coming, I'm coming, stay right there!"
  - who: naveen
    t: "ಉಂಟು. ದುಬೈಯಿಂದ ಬಂದಾಗಿಂದ ಪರ್ಸ್‌ನಲ್ಲಿ ಕ್ಯಾಶ್ ಇಟ್ಟುಕೊಳ್ಳುವ ಅಭ್ಯಾಸ. ಕಾರ್ಡ್, ಚೆಕ್ ಮೇಲೆ ನಂಬಿಕೆ ಕಮ್ಮಿ."
    tr: "Uṇṭu. Dubaiyinda bandāginda pars-nalli kyāś iṭṭukoḷḷuva abhyāsa. Kārḍ, chek mēle nambike kammi."
    en: "I have. Ever since I came back from Dubai, I've had the habit of keeping cash in my wallet. Less faith in cards and cheques."
  - scene: "He says it lightly, holding the note up for Ramya. Arjun, standing a few steps behind, turns away to look at the chariot's wheels."
  - scene: "12:20 p.m. Leaving the Vittala temple. Arjun falls into step with Prakash on the stone path."
  - who: arjun
    t: "ಪ್ರಕಾಶ್, ಆ ಪಿನ್‌ಹೋಲ್ ಕ್ಯಾಮೆರಾ ವಿಷಯ ನೀನು ಮಕ್ಕಳಿಗೆ ಪಾಠ ಮಾಡ್ತೀಯ ಅಂದೆಯಲ್ಲಾ. ನಿನ್ನ ಸ್ಕೂಲ್ ಟ್ರಿಪ್‌ಗೆ ಬಸ್ ಖರ್ಚು ನಾನು ಕೊಡ್ತೀನಿ. ಸುಮ್ನೆ, ಒಂದು ಸಹಾಯ."
    tr: "Prakāś, ā pin-hōl kyāmerā viṣaya nīnu makkaḷige pāṭha māḍtīya andeyallā. Ninna skūl ṭrip-ge bas kharchu nānu koḍtīni. Sumne, ondu sahāya."
    en: "Prakash, you said you teach the kids about the pinhole camera. I'll pay the bus costs for your school trip. Just like that, as a help."
  - who: prakash
    t: "ಥ್ಯಾಂಕ್ಸ್ರೀ. ಆದ್ರ ಸಾಲೀ ಟ್ರಿಪ್‌ಗೆ ಇಲಾಖೆಯ ಅನುದಾನ ಐತಿ, ಊರಿನ ಜನಾನೂ ಕೊಡತಾರ. ನಿಮ್ಮ ದುಡ್ಡು ನಿಮ್ಮ ಹತ್ರನೇ ಇರಲಿ."
    tr: "Thyāṅksrī. Ādra sālī ṭrip-ge ilākheya anudāna aiti, ūrina janānū koḍatāra. Nimma duḍḍu nimma hatranē irali."
    en: "Thank you. But there's a department grant for school trips, and the village people contribute too. Keep your money with you."
  - who: arjun
    t: "ದುಡ್ಡಿನಿಂದ ಎಲ್ಲಾ ಸರಿ ಮಾಡ್ತೀನಿ ಅಂತ ಅಲ್ಲ, ಪ್ರಕಾಶ್. ನಾನು…"
    tr: "Duḍḍininda ellā sari māḍtīni anta alla, Prakāś. Nānu…"
    en: "It's not that I think I can fix everything with money, Prakash. I…"
  - who: prakash
    t: "ಗೊತ್ತೈತ್ರೀ. ಹೊತ್ತು ಬಂದಾಗ ಮಾತಾಡೋಣು. ಈಗ ಹರಿಗೋಲು ಕಾಯಾಕತ್ತಾವ."
    tr: "Gottaitrī. Hottu bandāga mātāḍōṇu. Īga harigōlu kāyākattāva."
    en: "I know. We'll talk when the time comes. Right now the coracles are waiting."
  - scene: "He walks ahead to join Imran. Arjun slows down until he is walking alone at the back."
  - section: "The coracle and the Dubai years"
    learn: "on the river: harigōlu, tuḍupu, tirugisu, nīru kammi · the dam, dated: kraisṭ gēṭ, kocchikoṇḍu hōytu, mūvattamūru hosa gēṭ · working abroad: gal'ph, kyāmp, rūmnalli eṇṭu jana, ūrige duḍḍu kaḷisu · loneliness and pride: obbanē, aḷalikkū samaya illa, pratiyondu dirhamge bevaru"
  - scene: "1:30 p.m. The Tungabhadra near the Hampi ghats. Round bamboo coracles sealed with tar spin slowly on the green water among the boulders. The guide has come along to arrange the boats. They go two and three to a coracle; Naveen, Imran and Ramya share one."
  - who: guide
    t: "ಈ ದೋಣಿಗೆ ಹರಿಗೋಲು ಅನ್ನುತ್ತಾರೆ. ಬಿದಿರಿನಿಂದ ಮಾಡಿದ್ದು. ಈ ವರ್ಷ ನದಿಯಲ್ಲಿ ನೀರು ಚೆನ್ನಾಗಿದೆ. ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ನಾಲ್ಕರಲ್ಲಿ ತುಂಗಭದ್ರಾ ಅಣೆಕಟ್ಟಿನ ಒಂದು ಕ್ರಸ್ಟ್ ಗೇಟ್ ಕೊಚ್ಚಿಕೊಂಡು ಹೋಗಿತ್ತು. ಆಮೇಲೆ ಎಲ್ಲಾ ಮೂವತ್ತಮೂರು ಗೇಟುಗಳನ್ನೂ ಹೊಸದಾಗಿ ಹಾಕಿದರು. ಈ ಜೂನ್‌ನಲ್ಲಿ ಉದ್ಘಾಟನೆ ಆಯಿತು."
    tr: "Ī dōṇige harigōlu annuttāre. Bidirininda māḍiddu. Ī varṣa nadiyalli nīru chennāgide. Eraḍu sāvirada ippatnālkaralli Tuṅgabhadrā aṇekaṭṭina ondu krasṭ gēṭ kocchikoṇḍu hōgittu. Āmēle ellā mūvattamūru gēṭugaḷannū hosadāgi hākidaru. Ī Jūn-nalli udghāṭane āyitu."
    en: "This boat is called a harigolu — a coracle. It's made of bamboo. This year there's good water in the river. In 2024 one crest gate of the Tungabhadra dam was washed away. Later they put in all thirty-three gates new. They were inaugurated this June."
  - who: imran
    t: "ಆ ವರ್ಷ ರಾಯಚೂರು, ಕೊಪ್ಪಳದ ರೈತರು ಒಂದು ಬೆಳೆ ಕಳಕೊಂಡ್ರು ಅಂತ ಓದಿದ್ದೆ. ಒಂದು ಗೇಟ್, ಲಕ್ಷ ಜನರ ಹೊಟ್ಟೆ."
    tr: "Ā varṣa Rāyachūru, Koppaḷada raitaru ondu beḷe kaḷakoṇḍru anta ōdidde. Ondu gēṭ, lakṣa janara hoṭṭe."
    en: "I read that farmers in Raichur and Koppal lost a crop that year. One gate — and the stomachs of a lakh people."
  - scene: "The coracle spins. Ramya films the boulders turning around them. Naveen trails his hand in the water."
  - who: ramya
    t: "ನವೀನ್, ನೀನು ದುಬೈ ಬಗ್ಗೆ ಯಾವತ್ತೂ ಹೇಳೇ ಇಲ್ಲ. ಆರು ವರ್ಷ ಅಲ್ವಾ? ಕ್ಯಾಮೆರಾ ಆಫ್ ಮಾಡ್ತೇನೆ, ಹೇಳು."
    tr: "Navīn, nīnu Dubai bagge yāvattū hēḷē illa. Āru varṣa alvā? Kyāmerā āph māḍtēne, hēḷu."
    en: "Naveen, you've never once talked about Dubai. It was six years, wasn't it? I'll switch the camera off — tell us."
  - who: naveen
    t: "ಆರು ವರ್ಷ. ಎರಡು ಸಾವಿರದ ಹದಿನಾಲ್ಕರಿಂದ ಇಪ್ಪತ್ತರವರೆಗೆ. ಒಂದು ದೊಡ್ಡ ಹೋಟೆಲ್‌ನ ಕಿಚನ್‌ನಲ್ಲಿ, ಆಮೇಲೆ ಎಫ್ ಅಂಡ್ ಬಿ ಸೂಪರ್‌ವೈಸರ್. ಹೊರಗೆ ನೋಡಿದವರಿಗೆ ದುಬೈ ಅಂದ್ರೆ ಬಂಗಾರ, ಕಾರು, ಬುರ್ಜ್ ಖಲೀಫಾ. ನಮಗೆ ದುಬೈ ಅಂದ್ರೆ ಒಂದು ರೂಮಲ್ಲಿ ಆರು ಜನ, ಹದಿನಾಲ್ಕು ಗಂಟೆ ಡ್ಯೂಟಿ."
    tr: "Āru varṣa. Eraḍu sāvirada hadinālkarinda ippattaravarege. Ondu doḍḍa hōṭel-na kichan-nalli, āmēle eph aṇḍ bi sūpar-vaisar. Horage nōḍidavarige Dubai andre baṅgāra, kāru, Burj Khalīphā. Namage Dubai andre ondu rūmalli āru jana, hadinālku gaṇṭe ḍyūṭi."
    en: "Six years. From 2014 to 2020. In the kitchen of a big hotel, and later as an F&B supervisor. To people looking from outside, Dubai means gold, cars, the Burj Khalifa. To us Dubai meant six people in one room and fourteen-hour shifts."
  - who: imran
    t: "ಮನಿ ನೆನಪಾಗತಿತ್ತೇನಪಾ?"
    tr: "Mani nenapāgatittēnapā?"
    en: "Did you miss home, man?"
  - who: naveen
    t: "ನೆನಪಾಗ್ತಿತ್ತು ಅಂತ ಹೇಳುವುದು ಸಣ್ಣ ಮಾತು. ಅಮ್ಮನ ಮೀನು ಸಾರು ವಾಸನೆ ಕನಸಲ್ಲಿ ಬರ್ತಿತ್ತು. ಆದ್ರೆ ಅಳಲಿಕ್ಕೂ ಸಮಯ ಇರ್ಲಿಲ್ಲ. ಪ್ರತಿ ತಿಂಗಳು ಸಂಬಳ ಬಂದ ದಿನ ಮನೆಗೆ ಕಳಿಸುವುದು, ಉಳಿದದ್ದು ಬ್ಯಾಂಕಲ್ಲಿ. ಆರು ವರ್ಷದ ಉಳಿತಾಯ. ಪ್ರತಿಯೊಂದು ದಿರ್ಹಮ್‌ಗೂ ಬೆವರು ಉಂಟು."
    tr: "Nenapāgtittu anta hēḷuvudu saṇṇa mātu. Ammana mīnu sāru vāsane kanasalli bartittu. Ādre aḷalikkū samaya irlilla. Prati tiṅgaḷu saṁbaḷa banda dina manege kaḷisuvudu, uḷidaddu byāṅkalli. Āru varṣada uḷitāya. Pratiyondu dirham-gū bevaru uṇṭu."
    en: "‘Missed it’ is too small a word. The smell of Amma's fish curry used to come to me in my dreams. But there wasn't even time to cry. Every month, on payday, send money home, and the rest into the bank. Six years of savings. There's sweat on every single dirham."
  - who: ramya
    t: "ಮತ್ತೆ ವಾಪಸ್ ಯಾಕೆ ಬಂದೆ?"
    tr: "Matte vāpas yāke bande?"
    en: "Then why did you come back?"
  - who: naveen
    t: "ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತು. ಕೋವಿಡ್. ಹೋಟೆಲ್ ಮುಚ್ಚಿತು. ಅದೇ ತಿಂಗಳು ಅಪ್ಪನಿಗೆ ಸ್ಟ್ರೋಕ್ ಆಯ್ತು. ವಂದೇ ಭಾರತ್ ವಿಮಾನದಲ್ಲಿ ಮಂಗಳೂರಿಗೆ ಬಂದೆ. ಆಮೇಲೆ ವಾಪಸ್ ಹೋಗಲಿಲ್ಲ. ಅಪ್ಪನ ಹೋಟೆಲ್ ನನ್ನ ಕೈಗೆ ಬಂತು. ಈಗ ನಾನೇ ಕ್ಯಾಶ್ ಕೌಂಟರ್, ನಾನೇ ಕಿಚನ್."
    tr: "Eraḍu sāvirada ippattu. Kōviḍ. Hōṭel mucchitu. Adē tiṅgaḷu appanige sṭrōk āytu. Vandē Bhārat vimānadalli Maṅgaḷūrige bande. Āmēle vāpas hōgalilla. Appana hōṭel nanna kaige bantu. Īga nānē kyāś kauṇṭar, nānē kichan."
    en: "2020. Covid. The hotel shut. That same month Appa had a stroke. I came to Mangaluru on a Vande Bharat flight. I never went back. Appa's hotel came into my hands. Now I'm the cash counter and the kitchen both."
  - who: imran
    t: "ನಮ್ ಕಲಬುರಗಿಯ ಸುಮಾರು ಹುಡುಗರು ಸೌದಿ, ದುಬೈಗೆ ಹೋಗ್ಯಾರ. ಬಂದಾಗ ಎಲ್ಲಾರೂ ‘ಭಾಳ ಛಲೋ ಐತಿ’ ಅಂತಾರ. ಯಾರೂ ನಿನ್ನಂಗ ನಿಜ ಹೇಳಂಗಿಲ್ಲ."
    tr: "Nam Kalaburagiya sumāru huḍugaru Saudi, Dubaige hōgyāra. Bandāga ellārū ‘bhāḷa chalō aiti’ antāra. Yārū ninnaṅga nija hēḷaṅgilla."
    en: "Lots of boys from our Kalaburagi have gone to Saudi and Dubai. When they come back, they all say, ‘It's really great.’ Nobody tells the truth like you do."
  - who: naveen
    t: "ನಿಜ ಹೇಳಿದ್ರೆ ಮನೆಯವರು ಅಳ್ತಾರೆ, ಅದಕ್ಕೆ ಯಾರೂ ಹೇಳುದಿಲ್ಲ. ಅದಕ್ಕೇ ಆ ದುಡ್ಡಿನ ಬೆಲೆ ನನಗೆ ಗೊತ್ತು. ಯಾರಾದ್ರೂ ಅದನ್ನ ಹಗುರವಾಗಿ ತಗೊಂಡ್ರೆ…"
    tr: "Nija hēḷidre maneyavaru aḷtāre, adakke yārū hēḷudilla. Adakkē ā duḍḍina bele nanage gottu. Yārādrū adanna haguravāgi tagoṇḍre…"
    en: "If you tell the truth, your family cries, so nobody does. That's why I know the value of that money. If anyone takes it lightly…"
  - scene: "He stops. He looks across the water at the other coracle, where Arjun sits with Shruti and Deepa, laughing at something. Naveen doesn't finish the sentence."
  - who: ramya
    t: "ಯಾರಾದ್ರೂ ಹಗುರವಾಗಿ ತಗೊಂಡ್ರೆ ಎಂತ?"
    tr: "Yārādrū haguravāgi tagoṇḍre enta?"
    en: "If anyone takes it lightly, what?"
  - who: naveen
    t: "ಏನಿಲ್ಲ. ಸುಮ್ಮನೆ ಹೇಳಿದೆ. ಹರಿಗೋಲು ತಿರುಗ್ತಾ ಇದೆ, ನನ್ನ ತಲೆನೂ ತಿರುಗ್ತಾ ಇದೆ. ದಡಕ್ಕೆ ಹೋಗುವ."
    tr: "Ēnilla. Summane hēḷide. Harigōlu tirugtā ide, nanna talenū tirugtā ide. Daḍakke hōguva."
    en: "Nothing. I was just talking. The coracle's spinning, and so is my head. Let's go to the bank."
  - scene: "On the bank, while the others pay the boatmen, Imran falls into step beside Kaveri."
  - who: imran
    t: "ಕಾವೇರಿ, ನೀನು ಗಮನಿಸಿದ್ಯಾ? ನವೀನ್ ಅರ್ಜುನ್ ಜೊತೆ ಸರಿಯಾಗಿ ಮಾತಾಡ್ತಿಲ್ಲ. ಬೆಳಗ್ಗೆ ಕಾರ್ ಬೇಡ ಅಂದ, ಈಗ ‘ಚೆಕ್ ಮೇಲೆ ನಂಬಿಕೆ ಇಲ್ಲ’ ಅಂದ. ಏನೋ ಐತಿ."
    tr: "Kāvēri, nīnu gamanisidyā? Navīn Arjun jote sariyāgi mātāḍtilla. Beḷagge kār bēḍa anda, īga ‘chek mēle nambike illa’ anda. Ēnō aiti."
    en: "Kaveri, have you noticed? Naveen isn't talking properly with Arjun. This morning he said no to the car, and just now, ‘no faith in cheques’. Something's going on."
  - who: kaveri
    t: "ಗಮನಿಸಿದೆ. ಆದ್ರೆ ಊಹೆಯ ಮೇಲೆ ಏನೂ ಹೇಳಬಾರದು. ಅವರಿಬ್ಬರೇ ಹೇಳೋವರೆಗೆ ನಾವು ಕಾಯೋಣ. ಸಾಕ್ಷಿ ಇಲ್ಲದೆ ತೀರ್ಪು ಇಲ್ಲ."
    tr: "Gamaniside. Ādre ūheya mēle ēnū hēḷabāradu. Avaribbarē hēḷōvarege nāvu kāyōṇa. Sākṣi illade tīrpu illa."
    en: "I've noticed. But you shouldn't say anything on a guess. Let's wait until the two of them say it themselves. No verdict without evidence."
  - section: "Sunset at Hemakuta"
    learn: "the view: sūryāsta, baṇḍegaḷa mēle keṁpu beḷaku, gāḷi taṇṇage · finally alone: ondu nimiṣa mātāḍbōdā?, illi bēḍa · the past: āvattu nīnu hēḷade hōde, nanage bēre yārindalō gottāytu · refusal with a promise: īga alla, samudrada hatra"
  - scene: "5:30 p.m. Hemakuta hill above the Virupaksha temple. Small ancient shrines on bare granite. Dozens of tourists sit waiting for the sunset. The guide has said goodbye and been paid. The eight spread out over the warm rock."
  - who: deepa
    t: "ನೋಡಿ, ಬಂಡೆಗಳೆಲ್ಲಾ ಕೆಂಪಾಗ್ತಿವೆ. ಐನೂರು ವರ್ಷದ ಹಿಂದೆ ಇಲ್ಲಿ ಕೂತವರೂ ಇದೇ ಸೂರ್ಯನ್ನ ನೋಡಿದ್ರು ಅಲ್ವಾ."
    tr: "Nōḍi, baṇḍegaḷellā keṁpāgtive. Ainūru varṣada hinde illi kūtavarū idē sūryanna nōḍidru alvā."
    en: "Look, all the boulders are turning red. The people who sat here five hundred years ago watched this same sun, didn't they."
  - who: prakash
    t: "ಖರೇ. ರಾಜರು ಹೋದ್ರು, ಸಾಮ್ರಾಜ್ಯ ಹೋತು. ಸೂರ್ಯ ಮಾತ್ರ ದಿನಾ ಬರತಾನ, ಹೋಗತಾನ. ಯಾರಿಗೂ ಕಾಯಂಗಿಲ್ಲ."
    tr: "Kharē. Rājaru hōdru, sāmrājya hōtu. Sūrya mātra dinā baratāna, hōgatāna. Yārigū kāyaṅgilla."
    en: "True. The kings went, the empire went. Only the sun comes and goes every day. He doesn't wait for anyone."
  - who: deepa
    t: "ಶ್ರುತಿ, ಕಾವೇರಿ… ನಿನ್ನೆ ರಾತ್ರಿ ಥ್ಯಾಂಕ್ಸ್. ಇವತ್ತು ಬೆಳಗ್ಗೆ ಎದ್ದಾಗ ಎಷ್ಟೋ ತಿಂಗಳ ನಂತರ ಎದೆ ಭಾರ ಇರಲಿಲ್ಲ."
    tr: "Śruti, Kāvēri… ninne rātri thyāṅks. Ivattu beḷagge eddāga eṣṭō tiṅgaḷa nantara ede bhāra iralilla."
    en: "Shruti, Kaveri… thank you for last night. When I woke up this morning, for the first time in months my chest didn't feel heavy."
  - who: kaveri
    t: "ಒಳ್ಳೆದು. ಒಂದೊಂದೇ ಹೆಜ್ಜೆ. ಇವತ್ತು ಸೂರ್ಯಾಸ್ತ ನೋಡು, ಅಷ್ಟು ಸಾಕು. ಕೋರ್ಟ್ ಸೋಮವಾರದ ವಿಷಯ."
    tr: "Oḷḷedu. Ondondē hejje. Ivattu sūryāsta nōḍu, aṣṭu sāku. Kōrṭ sōmavārada viṣaya."
    en: "Good. One step at a time. Today, watch the sunset; that's enough. Court is a Monday matter."
  - scene: "Ramya sets up her phone on a small tripod for a time-lapse. Arjun gets up and walks over to where Shruti sits alone on a ledge, a little apart."
  - who: arjun
    t: "ಶ್ರುತಿ, ಒಂದು ನಿಮಿಷ ಮಾತಾಡ್ಬೋದಾ?"
    tr: "Śruti, ondu nimiṣa mātāḍbōdā?"
    en: "Shruti, can we talk for a minute?"
  - who: shruti
    t: "ಕೂತ್ಕೋ. ಸೂರ್ಯ ಮುಳುಗೋವರೆಗೆ ಸಮಯ ಇದೆ."
    tr: "Kūtkō. Sūrya muḷugōvarege samaya ide."
    en: "Sit. There's time until the sun goes down."
  - who: arjun
    t: "ನಿನ್ನೆ ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ನೀನು ‘ಹದಿನಾಲ್ಕು ವರ್ಷ’ ಅಂದೆ. ಅದು ಎರಡು ಸಾವಿರದ ಹನ್ನೆರಡರ ಬಗ್ಗೆ ಅಂತ ನನಗೆ ಗೊತ್ತು. ಪುಣೆ ಆಫರ್. ನಾನು ಅದರ ಬಗ್ಗೆ ಯಾವತ್ತೂ ಸರಿಯಾಗಿ…"
    tr: "Ninne Chitradurgadalli nīnu ‘hadinālku varṣa’ ande. Adu eraḍu sāvirada hanneraḍara bagge anta nanage gottu. Puṇe āphar. Nānu adara bagge yāvattū sariyāgi…"
    en: "Yesterday at Chitradurga you said ‘fourteen years’. I know that was about 2012. The Pune offer. I never properly…"
  - who: shruti
    t: "ನೀನು ಪುಣೆಗೆ ಹೋಗಿದ್ದು ತಪ್ಪಲ್ಲ, ಅರ್ಜುನ್. ಒಳ್ಳೆ ಅವಕಾಶ ಇತ್ತು. ತಪ್ಪು ಅದಲ್ಲ. ನೀನು ನನಗೆ ಹೇಳದೆ ಹೋದೆ. ನನಗೆ ನಿನ್ನ ರೂಮ್‌ಮೇಟ್‌ನಿಂದ ಗೊತ್ತಾಯ್ತು, ನೀನು ರೈಲು ಹತ್ತಿದ ಮೇಲೆ."
    tr: "Nīnu Puṇege hōgiddu tappalla, Arjun. Oḷḷe avakāśa ittu. Tappu adalla. Nīnu nanage hēḷade hōde. Nanage ninna rūm-mēṭ-ninda gottāytu, nīnu railu hattida mēle."
    en: "Going to Pune wasn't wrong, Arjun. It was a good opportunity. That's not the wrong. You went without telling me. I found out from your roommate — after you'd boarded the train."
  - who: arjun
    t: "ಗೊತ್ತು. ಹೇಳಿದ್ರೆ ನೀನು ‘ಹೋಗಬೇಡ’ ಅಂತೀಯ ಅಂತ ಹೆದರಿದೆ. ನೀನು ‘ಹೋಗಬೇಡ’ ಅಂದಿದ್ರೆ ನಾನು ಹೋಗ್ತಿರ್ಲಿಲ್ಲ. ಅದಕ್ಕೇ ಹೇಳ್ಲಿಲ್ಲ. ಅದು ಹೇಡಿತನ. ಈಗ ಅರ್ಥ ಆಗುತ್ತೆ. ಶ್ರುತಿ, ನಾನು…"
    tr: "Gottu. Hēḷidre nīnu ‘hōgabēḍa’ antīya anta hedaride. Nīnu ‘hōgabēḍa’ andidre nānu hōgtirlilla. Adakkē hēḷlilla. Adu hēḍitana. Īga artha āgutte. Śruti, nānu…"
    en: "I know. I was afraid that if I told you, you'd say, ‘Don't go.’ And if you'd said ‘Don't go’, I wouldn't have gone. That's why I didn't tell you. It was cowardice. I understand that now. Shruti, I…"
  - scene: "Shruti raises a hand, gently, without looking at him. The lower edge of the sun touches the hills."
  - who: shruti
    t: "ಈಗ ಅಲ್ಲ, ಅರ್ಜುನ್. ಇಲ್ಲಿ ಅಲ್ಲ. ಇಲ್ಲಿ ಎಲ್ರೂ ಇದಾರೆ, ರಮ್ಯಾ ಕ್ಯಾಮೆರಾ ಇದೆ, ನನ್ನ ತಲೇಲಿ ದೀಪಾ, ಪ್ರಕಾಶ್, ಎಲ್ಲಾ ಇದಾರೆ. ಸಮುದ್ರದ ಹತ್ರ. ಗೋಕರ್ಣದಲ್ಲಿ. ಆವಾಗ ನಾನೂ ಹೇಳ್ಬೇಕಾದ್ದು ಹೇಳ್ತೀನಿ."
    tr: "Īga alla, Arjun. Illi alla. Illi ellrū idāre, Ramyā kyāmerā ide, nanna talēli Dīpā, Prakāś, ellā idāre. Samudrada hatra. Gōkarṇadalli. Āvāga nānū hēḷbēkāddu hēḷtīni."
    en: "Not now, Arjun. Not here. Everyone's here, Ramya's camera is here, and my head is full of Deepa, Prakash, everything. At the sea. In Gokarna. Then I'll say what I have to say too."
  - who: arjun
    t: "ನೀನೂ? ನೀನೇನು ಹೇಳ್ಬೇಕು?"
    tr: "Nīnū? Nīnēnu hēḷbēku?"
    en: "You too? What do you have to say?"
  - who: shruti
    t: "ಸಮುದ್ರದ ಹತ್ರ ಅಂದೆ. ಈಗ ಸೂರ್ಯ ನೋಡು. ಹದಿನಾಲ್ಕು ವರ್ಷ ಕಾದಿದೀವಿ, ಇನ್ನು ಮೂರು ದಿನ ಕಾಯೋಕಾಗಲ್ವಾ?"
    tr: "Samudrada hatra ande. Īga sūrya nōḍu. Hadinālku varṣa kādidīvi, innu mūru dina kāyōkāgalvā?"
    en: "I said at the sea. Now look at the sun. We've waited fourteen years — can't we wait three more days?"
  - scene: "They sit side by side without speaking as the sun goes down behind the boulders. Twenty metres away, Ramya's phone on its tripod records the whole sunset, and two small figures on a ledge."
  - section: "Dinner, cash, and a cool ‘-ri’"
    learn: "café talk: ḍinnar, banāna pyānkēk, nimbe sōḍa, bil · paying separately: nanna pālu nānē koḍtēne, ninna kārḍ bēḍa · -ri as distance, not respect: Arjun-ge ‘rī’ antidīya · tomorrow's plan: beḷagge ēḷakke horaḍōṇa, avva kāytāḷa, hiṁdina sīṭugaḷu"
  - scene: "8:00 p.m. A small rooftop café near Hampi village. Fairy lights, floor cushions, a temple's lit gopura in the distance. Thalis, lemon sodas, one plate of banana pancakes that Ramya insists is ‘part of the Hampi experience’."
  - who: ramya
    t: "ಎಲ್ರೂ ನೋಡಿ, ಸನ್‌ಸೆಟ್ ಟೈಮ್-ಲ್ಯಾಪ್ಸ್! ಮೂವತ್ತು ಸೆಕೆಂಡ್‌ನಲ್ಲಿ ಒಂದು ಗಂಟೆ. ಎಂತ ಚಂದ ಉಂಟು ಮರ್ರೆ!"
    tr: "Ellrū nōḍi, san-seṭ ṭaim-lyāps! Mūvattu sekeṇḍ-nalli ondu gaṇṭe. Enta chanda uṇṭu marre!"
    en: "Everyone, look — the sunset time-lapse! An hour in thirty seconds. Isn't it beautiful, man!"
  - who: imran
    t: "ನಿಲ್ಲಿಸು, ನಿಲ್ಲಿಸು. ಅಲ್ಲಿ ಮೂಲೆಯಾಗ ಎರಡು ಜನ ಕುಂತಾರಲ್ಲ, ಅವರು ಯಾರು?"
    tr: "Nillisu, nillisu. Alli mūleyāga eraḍu jana kuntāralla, avaru yāru?"
    en: "Stop, stop. Those two people sitting in the corner there — who are they?"
  - who: kaveri
    t: "ಇಮ್ರಾನ್. ಊಟ ಮಾಡು."
    tr: "Imrān. Ūṭa māḍu."
    en: "Imran. Eat your dinner."
  - scene: "Shruti looks down at her plate. Arjun reaches for the water jug. Ramya quickly swipes to the next video."
  - who: arjun
    t: "ಪ್ರಕಾಶ್, ಈ ಪಲ್ಯ ಚೆನ್ನಾಗಿದೆ, ಸ್ವಲ್ಪ ಹಾಕ್ಕೋ. ನಾಳೆ ನಿಮ್ಮ ಅಮ್ಮನ ಊಟಕ್ಕೆ ಮುಂಚೆ ಅಭ್ಯಾಸ."
    tr: "Prakāś, ī palya chennāgide, svalpa hākkō. Nāḷe nimma ammana ūṭakke muñche abhyāsa."
    en: "Prakash, this palya is good, have some. Practice before your mother's meal tomorrow."
  - who: prakash
    t: "ಥ್ಯಾಂಕ್ಸ್ರೀ, ಅರ್ಜುನ್ ಅವರೇ. ಸಾಕಾತ್ರಿ. ನೀವು ತಗೋರಿ."
    tr: "Thyāṅksrī, Arjun avarē. Sākātri. Nīvu tagōri."
    en: "Thank you, Arjun-avare. I've had enough. You have it."
  - scene: "A small pause at the table. Imran puts his spoon down."
  - who: imran
    t: "ಪ್ರಕಾಶಾ, ಕಾಲೇಜಿನ್ಯಾಗ ನೀನು ಅವನಿಗೆ ‘ಲೇ ಅರ್ಜುನಾ’ ಅಂತಿದ್ದಿ. ಈಗ ‘ಅರ್ಜುನ್ ಅವರೇ’, ‘ತಗೋರಿ’. ನಮ್ ಕಡೆ ‘ರೀ’ ಮರ್ಯಾದೆಗೆ. ಆದ್ರ ಇದು ಮರ್ಯಾದೆ ಅಲ್ಲ, ಇದು ದೂರ."
    tr: "Prakāśā, kālējinyāga nīnu avanige ‘lē Arjunā’ antiddi. Īga ‘Arjun avarē’, ‘tagōri’. Nam kaḍe ‘rī’ maryādege. Ādra idu maryāde alla, idu dūra."
    en: "Prakasha, in college you used to call him ‘Le, Arjuna’. Now it's ‘Arjun-avare’ and ‘have it-ree’. Where we come from, ‘ree’ is for respect. But this isn't respect, this is distance."
  - who: prakash
    t: "ದೂರಾನೂ ಒಂದು ಮರ್ಯಾದೆನೇ, ಡಾಕ್ಟ್ರೇ. ಎಲ್ಲಾರಿಗೂ ಅವರವರ ಜಾಗ. ಊಟ ತಣ್ಣಗಾಗತೈತಿ."
    tr: "Dūrānū ondu maryādenē, ḍākṭrē. Ellārigū avaravara jāga. Ūṭa taṇṇagāgataiti."
    en: "Distance is a kind of respect too, Doctor. Everyone has their own place. The food's getting cold."
  - scene: "Arjun opens his mouth, then closes it. He passes the palya to Deepa instead."
  - who: deepa
    t: "ನಾಳೆ ಧಾರವಾಡದಲ್ಲಿ ಪ್ರಕಾಶ್ ಮನೆಯಲ್ಲಿ ಎಲ್ರೂ ಚೆನ್ನಾಗಿರೋಣ, ಆಯ್ತಾ? ಅವರ ಅಮ್ಮ ಬೆಳಗ್ಗೆ ಫೋನ್‌ನಲ್ಲಿ ಎಷ್ಟು ಖುಷಿಯಾಗಿದ್ರು. ಅವರ ಮುಂದೆ ಯಾವ ಜಗಳನೂ ಬೇಡ."
    tr: "Nāḷe Dhāravāḍadalli Prakāś maneyalli ellrū chennāgirōṇa, āytā? Avara amma beḷagge phōn-nalli eṣṭu khuṣiyāgidru. Avara munde yāva jagaḷanū bēḍa."
    en: "Tomorrow in Dharwad, at Prakash's house, let's all be good, okay? His mother was so happy on the phone this morning. No fights of any kind in front of her."
  - who: prakash
    t: "ಅವ್ವನ ಮುಂದೆ ಜಗಳ ಆಡಾಕ ಯಾರಿಗೂ ಧೈರ್ಯ ಇಲ್ಲ, ದೀಪಾ. ಒನಕಿ ಓಬವ್ವನ ಕೈಯಾಗ ಮಾತ್ರ ಇರಂಗಿಲ್ಲ."
    tr: "Avvana munde jagaḷa āḍāka yārigū dhairya illa, Dīpā. Onaki Ōbavvana kaiyāga mātra iraṅgilla."
    en: "Nobody has the nerve to fight in front of Avva, Deepa. The pestle isn't only in Obavva's hands."
  - who: naveen
    t: "ರಮ್ಯಾ, ನೀನು ಇಡೀ ದಿನ ಶೂಟ್ ಮಾಡ್ತಾ ಉಂಟು. ಈ ವ್ಲಾಗ್ ನಿಜವಾಗಲೂ ಎಲ್ಲಿ ಹಾಕ್ತೀಯ? ನಿನ್ನ ಚಾನೆಲ್‌ನಲ್ಲಾ?"
    tr: "Ramyā, nīnu iḍī dina śūṭ māḍtā uṇṭu. Ī vlāg nijavāgalū elli hāktīya? Ninna chānel-nallā?"
    en: "Ramya, you've been shooting all day. Where are you really going to put this vlog? On your channel?"
  - who: ramya
    t: "ಚಾನೆಲ್‌ನಲ್ಲಿ ಅಲ್ಲ ಮರ್ರೆ. ಅಲ್ಲಿ ಇದಕ್ಕೆ ಜಾಗ ಇಲ್ಲ, ಅಲ್ಲಿ ಜಗಳಕ್ಕೆ ಮಾತ್ರ ಜಾಗ. ಇದು ನನ್ನದು. ಎಲ್ಲಿ ಹಾಕ್ತೇನೆ ಅಂತ… ಆಮೇಲೆ ಹೇಳ್ತೆ."
    tr: "Chānel-nalli alla marre. Alli idakke jāga illa, alli jagaḷakke mātra jāga. Idu nannadu. Elli hāktēne anta… āmēle hēḷte."
    en: "Not on the channel, man. There's no room for this there; there's only room for fights there. This is mine. Where I'll put it… I'll tell you later."
  - scene: "Everyone laughs, Arjun too, a beat late. The waiter brings the bill. Arjun reaches for it with his card."
  - who: arjun
    t: "ಇದು ನನ್ ಕಡೆಯಿಂದ. ಇವತ್ತು ಹಂಪಿ ದಿನ. ಯಾರೂ ಜಗಳ ಮಾಡ್ಬೇಡಿ."
    tr: "Idu nan kaḍeyinda. Ivattu Hampi dina. Yārū jagaḷa māḍbēḍi."
    en: "This one's on me. Today is Hampi day. Nobody argue."
  - who: naveen
    t: "ಬೇಡ. ಬಿಲ್ ಎಂಟು ಭಾಗ ಮಾಡು. ನನ್ನ ಪಾಲು ಇದು, ಕ್ಯಾಶ್. ನಿನ್ನ ಕಾರ್ಡ್ ನಿನ್ನ ಹತ್ರವೇ ಇರಲಿ, ಅರ್ಜುನ್. ಬೇರೆ ಕಡೆ ಬೇಕಾಗಬಹುದು."
    tr: "Bēḍa. Bil eṇṭu bhāga māḍu. Nanna pālu idu, kyāś. Ninna kārḍ ninna hatravē irali, Arjun. Bēre kaḍe bēkāgabahudu."
    en: "No. Split the bill eight ways. Here's my share, in cash. Keep your card with you, Arjun. You might need it somewhere else."
  - scene: "He puts the notes on the table and gets up to look at the view. Arjun stays seated, the card still in his hand. Kaveri and Imran exchange a second look. Deepa notices it too."
  - who: shruti
    t: "ಸರಿ. ನಾಳೆ ಬೆಳಗ್ಗೆ ಏಳು ಗಂಟೆಗೆ ಹೊರಡೋಣ. ಕಾರ್‌ಗಳು ಮೊದಲಿನ ಹಾಗೇ. ನಾನು ಅರ್ಜುನ್ ಕಾರಲ್ಲಿ, ಪ್ರಕಾಶ್, ಇಮ್ರಾನ್ ಜೊತೆ. ನವೀನ್ ತನ್ನ ಕಾರ್ ಓಡಿಸ್ಲಿ, ದೀಪಾ, ಕಾವೇರಿ, ರಮ್ಯಾ ಜೊತೆ."
    tr: "Sari. Nāḷe beḷagge ēḷu gaṇṭege horaḍōṇa. Kār-gaḷu modalina hāgē. Nānu Arjun kāralli, Prakāś, Imrān jote. Navīn tanna kār ōḍisli, Dīpā, Kāvēri, Ramyā jote."
    en: "Right. Let's leave at seven tomorrow morning. The cars as before. I'll be in Arjun's car with Prakash and Imran. Naveen drives his own car, with Deepa, Kaveri and Ramya."
  - who: prakash
    t: "ಹೊಸಪೇಟೆ, ಕೊಪ್ಪಳ, ಗದಗ, ಹುಬ್ಬಳ್ಳಿ. ಸುಮಾರು ಮೂರು-ನಾಲ್ಕು ತಾಸು. ಸಪ್ತಾಪುರದಾಗ ಅವ್ವ ಬಾಗಿಲಲ್ಲಿ ನಿಂತಿರತಾಳ. ತಡ ಮಾಡಬ್ಯಾಡ್ರಿ."
    tr: "Hosapēṭe, Koppaḷa, Gadaga, Hubbaḷḷi. Sumāru mūru-nālku tāsu. Saptāpuradāga avva bāgilalli nintiratāḷa. Taḍa māḍabyāḍri."
    en: "Hosapete, Koppal, Gadag, Hubballi. About three or four hours. In Saptapur, Avva will be standing at the door. Don't be late."
  - who: arjun
    t: "ನಾಲ್ಕೂ ಐವತ್ತಕ್ಕೇ ರೆಡಿ ಇರ್ತೀನಿ. ಗೊತ್ತಲ್ವಾ, ಜನ ಬದಲಾಗ್ತಾರೆ."
    tr: "Nālkū aivattakkē reḍi irtīni. Gottalvā, jana badalāgtāre."
    en: "I'll be ready at four-fifty. You know — people change."
  - who: shruti
    t: "ನೋಡೋಣ."
    tr: "Nōḍōṇa."
    en: "We'll see."
  - scene: "The café's lights go off one by one. Below, Hampi's boulders are dark shapes under the stars. Eight friends walk back to the cars in twos and threes, Naveen ahead alone, Prakash beside Imran, Shruti between Deepa and Kaveri, Arjun last."
