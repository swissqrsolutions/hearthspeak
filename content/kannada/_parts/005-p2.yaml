lines:
  - chapter: "Chapter 4 — The elders"
  - section: "Before the moon rises"
    learn: "getting ready: snāna māḍi, dīpa hacci, horaḍōṇa · custom in habitual past: hiriyaru hēḷtidru · wishes with -li: kempāgi huṭṭali, beḷḷage muḷugali · advice before a hard talk: kōpadalli āḍida mātu vāpas tagoḷḷōkāgalla"
  - scene: "Tuesday, 3 March 2026, the full-moon evening. In the yard of the house in Bettahalli, Avva lights the lamp before Thatha's garlanded photograph. Suresh, Meena and Rakshith have driven down from Bengaluru; Shobha came on the afternoon bus. Mahadeva, freshly bathed, is tying a white dhoti. Tonight the moon will rise at the tail end of an eclipse."
  - who: avva
    t: "ಗ್ರಹಣ ಬುಟ್ಟ ಮೇಲೆ ಎಲ್ರೂ ಸ್ನಾನ ಮಾಡಿ, ಆಮೇಲೆ ದೀಪ ಹಚ್ಚಿ ಹೊರಡೋಣ. ಗ್ರಹಣ ಇರೋವಾಗ ಯಾವ ಒಳ್ಳೆ ಕೆಲಸಾನೂ ಶುರು ಮಾಡಬಾರ್ದು ಅಂತ ನಮ್ಮ ಹಿರಿಯರು ಹೇಳ್ತಿದ್ರು."
    tr: "Grahaṇa buṭṭa mēle ellrū snāna māḍi, āmēle dīpa hacci horaḍōṇa. Grahaṇa irōvāga yāva oḷḷe kelasānū śuru māḍabārdu anta namma hiriyaru hēḷtidru."
    en: "Once the eclipse has passed, everybody bathe, then we'll light the lamp and set out. Our elders used to say you mustn't begin any good work while an eclipse is on."
  - who: rakshith
    t: "ಅಜ್ಜಿ, ಇವತ್ತು ಚಂದ್ರ ಗ್ರಹಣ ಅಂತ ನಮ್ಮ ಸ್ಕೂಲ್ ಗ್ರೂಪ್‌ನಲ್ಲಿ ಫೋಟೋ ಹಾಕಿದಾರೆ. ಚಂದ್ರ ಕೆಂಪಾಗಿ ಹುಟ್ಟುತ್ತೆ ಅಂತೆ."
    tr: "Ajji, ivattu candra grahaṇa anta namma skūl grūp-nalli phōṭō hākidāre. Candra kempāgi huṭṭutte ante."
    en: "Ajji, people in my school group have posted photos — there's a lunar eclipse today. Apparently the moon rises red."
  - who: avva
    t: "ಕೆಂಪಾಗಿ ಹುಟ್ಟಲಿ, ಬೆಳ್ಳಗೆ ಮುಳುಗಲಿ ಕಣಪ್ಪ. ಇವತ್ತು ರಾತ್ರಿ ನಮ್ಮನೇಲೂ ಹಂಗೇ ಆಗ್ಲಿ."
    tr: "Kempāgi huṭṭali, beḷḷage muḷugali kaṇappa. Ivattu rātri nammanēlū haṅgē āgli."
    en: "Let it rise red and set white, child. May it go the same way in our house tonight."
  - who: meena
    t: "ಮಹದೇವ, ಅಲ್ಲಿ ಏನು ಹೇಳ್ಬೇಕು ಅಂತ ಯೋಚನೆ ಮಾಡಿದ್ದೀರಾ?"
    tr: "Mahadēva, alli ēnu hēḷbēku anta yōcane māḍiddīrā?"
    en: "Mahadeva, have you thought about what you're going to say there?"
  - who: mahadeva
    t: "ಯೋಚನೆ ಏನು ಅತ್ತಿಗೆ? ಇಪ್ಪತ್ತು ವರ್ಷದಿಂದ ಅದೇ ಮಾತು ಎದೆಯಲ್ಲಿ ಇಟ್ಕಂಡಿದೀನಿ. ಇವತ್ತು ಹೊರಗೆ ಬರುತ್ತೆ, ಅಷ್ಟೇ."
    tr: "Yōcane ēnu attige? Ippattu varṣadinda adē mātu edeyalli iṭkaṇḍidīni. Ivattu horage barutte, aṣṭē."
    en: "What's there to think about, Attige? I've kept the same words in my chest for twenty years. Tonight they'll come out, that's all."
  - who: meena
    t: "ಹೊರಗೆ ಬರ್ಲಿ. ಆದ್ರೆ ಒಂದು ಕೇಳ್ಕೊಳ್ತೀನಿ — ಕೋಪದಲ್ಲಿ ಬರೋದು ಬೇಡ. ಕೋಪದಲ್ಲಿ ಆಡಿದ ಮಾತು ವಾಪಸ್ ತಗೊಳ್ಳೋಕಾಗಲ್ಲ."
    tr: "Horage barli. Ādre ondu kēḷkoḷḷtīni — kōpadalli barōdu bēḍa. Kōpadalli āḍida mātu vāpas tagoḷḷōkāgalla."
    en: "Let them come out. But I ask one thing — don't let them come out in anger. Words spoken in anger can't be taken back."
  - who: mahadeva
    t: "ನಿಮ್ ಸ್ಕೂಲ್ ಹುಡುಗರಿಗೆ ಹೇಳೋ ಹಂಗೆ ಹೇಳ್ತೀರಲ್ಲ ಅತ್ತಿಗೆ. … ಆಯ್ತು, ಪ್ರಯತ್ನ ಮಾಡ್ತೀನಿ."
    tr: "Nim skūl huḍugarige hēḷō haṅge hēḷtīralla attige. … Āytu, prayatna māḍtīni."
    en: "You talk to me the way you talk to your school kids, Attige. … All right, I'll try."
  - who: shobha
    t: "ಅವ್ವ, ನೀನೂ ಬರ್ತೀಯಾ ಕಟ್ಟೆಗೆ? ನಿನ್ನ ಮಂಡಿ ನೋವಿಗೆ ಕಲ್ಲಿನ ಮೇಲೆ ಕೂರೋದು ಕಷ್ಟ. ಒಂದು ಚಾಪೆ ತಗೊಂಡು ಹೋಗೋಣ."
    tr: "Avva, nīnū bartīyā kaṭṭege? Ninna maṇḍi nōvige kallina mēle kūrōdu kaṣṭa. Ondu cāpe tagoṇḍu hōgōṇa."
    en: "Avva, are you coming to the platform too? With your bad knees it's hard to sit on stone. Let's take a mat."
  - who: avva
    t: "ಬರ್ದೇ ಇರ್ತೀನಾ? ನನ್ ಮಕ್ಳ ಜಗಳ ಊರ ಮುಂದೆ ನಡೀತಿರೋವಾಗ ನಾನು ಮನೇಲಿ ಕುಂತಿರ್ಲಾ?"
    tr: "Bardē irtīnā? Nan makḷa jagaḷa ūra munde naḍītirōvāga nānu manēli kuntirlā?"
    en: "Would I stay away? While my children's quarrel is going on in front of the whole village, am I to sit at home?"

  - section: "Under the peepul"
    learn: "convening a panchayati: araḷi kaṭṭe, hiriyaru, saradi, kūgāḍaṅgilla · elder's story in past perfect: kōrṭige hōgidvi, mukha nōḍirlilla · the farmer's claim in habitual past: ēḷtidde, kaṭtidde, nintkaḷtidde · slogan: uḷuvavanē holadoḍeya · being in the middle: eraḍu dōṇi mēle kālu"
  - scene: "Later that night. The stone platform round the old peepul tree in the middle of Bettahalli. A hurricane lamp hangs from a low branch; the moon, pale again, is climbing over the coconut palms. Thimmegowda sits cross-legged at the centre with two other elders, Ningegowda and Kempaiah. Men stand around; the women sit together on one side, Meena and Rakshith among them. The family sits facing the elders."
  - who: elder
    t: "ಎಲ್ರೂ ಕುಂತ್ಕಳಿ. ಗ್ರಹಣ ಬುಟ್ಟು ಚಂದ್ರ ಮತ್ತೆ ಬೆಳಗ್ತಾ ಅವ್ನೆ — ಒಳ್ಳೆ ಗಳಿಗೆ. ಇವತ್ತು ಇಲ್ಲಿ ಚನ್ನೇಗೌಡನ ಮನೆ ಮಾತು. ಮೊದ್ಲೇ ಒಂದು ನಿಯಮ ಹೇಳ್ತೀನಿ: ಒಂದ್ಸಲ ಒಬ್ರೇ ಮಾತಾಡ್ಬೇಕು. ಯಾರೂ ಕೂಗಾಡಂಗಿಲ್ಲ. ಹೆಣ್ಮಕ್ಳೂ ಮಾತಾಡ್ಬೋದು — ಇದು ಅವರ ಮನೆ ವಿಷಯಾನೂ ಹೌದು."
    tr: "Ellrū kuntkaḷi. Grahaṇa buṭṭu candra matte beḷagtā avne — oḷḷe gaḷige. Ivattu illi Cannēgauḍana mane mātu. Modlē ondu niyama hēḷtīni: ondsala obrē mātāḍbēku. Yārū kūgāḍaṅgilla. Heṇmakḷū mātāḍbōdu — idu avara mane viṣayānū haudu."
    en: "Sit down, all of you. The eclipse has let go and the moon is shining again — a good hour. Tonight the matter here is Channegowda's household. First I'll lay down one rule: one person speaks at a time. Nobody is to shout. The women may speak too — it's their household's matter as well."
  - who: elder
    t: "ನಿಂಗೇಗೌಡ್ರು, ಕೆಂಪಯ್ಯ ನನ್ ಜೊತೆ ಕುಂತಿದಾರೆ. ನಾವು ಕೋರ್ಟಲ್ಲ, ಯಾರ್ಗೂ ಶಿಕ್ಷೆ ಕೊಡಲ್ಲ. ಮನೆ ಮುರೀಬಾರ್ದು, ಅಷ್ಟೇ ನಮ್ ಆಸೆ. ಮಾತಾಡೋಕೆ ಮುಂಚೆ ಒಂದು ಕತೆ ಹೇಳ್ತೀನಿ. ನಾನು, ನನ್ನ ತಮ್ಮ ಸಿದ್ದೇಗೌಡ ಎಪ್ಪತ್ತೆಂಟರಲ್ಲಿ ಮೂರು ಎಕರೆ ತೋಟಕ್ಕೆ ಕೋರ್ಟಿಗೆ ಹೋಗಿದ್ವಿ. ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ ಕೇಸ್ ನಡೀತು. ವಕೀಲರ ಫೀಸ್ ಕಟ್ಟೋಕೆ ಇಬ್ರೂ ಅರ್ಧರ್ಧ ಜಮೀನು ಮಾರಿದ್ವಿ."
    tr: "Niṅgēgauḍru, Kempayya nan jote kuntidāre. Nāvu kōrṭalla, yārgū śikṣe koḍalla. Mane murībārdu, aṣṭē nam āse. Mātāḍōke mun̄ce ondu kate hēḷtīni. Nānu, nanna tamma Siddēgauḍa eppatteṇṭaralli mūru ekare tōṭakke kōrṭige hōgidvi. Ippatteraḍu varṣa kēs naḍītu. Vakīlara phīs kaṭṭōke ibbrū ardhardha jamīnu māridvi."
    en: "Ningegowda and Kempaiah are sitting with me. We are not a court; we punish no one. The house must not break — that's all we want. Before we talk, I'll tell you a story. In seventy-eight my younger brother Siddegowda and I went to court over three acres of garden land. The case went on for twenty-two years. To pay the lawyers' fees, each of us sold half our land."
  - who: mahadeva
    t: "ಕೊನೆಗೆ ಏನಾಯ್ತು ತಿಮ್ಮಣ್ಣ?"
    tr: "Konege ēnāytu Timmaṇṇa?"
    en: "What happened in the end, Thimmanna?"
  - who: elder
    t: "ತೀರ್ಪು ಬಂದಾಗ ನಾವಿಬ್ರೂ ಮುದುಕರಾಗಿದ್ವಿ. ಗೆದ್ದಿದ್ದು ನಾನು. ಆದ್ರೆ ಆ ದಿನ ಸಿಹಿ ಹಂಚೋಕೂ ಮನಸ್ಸಾಗ್ಲಿಲ್ಲ. ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ ನನ್ನ ತಮ್ಮನ ಮುಖ ನೋಡಿರ್ಲಿಲ್ಲ. ಅವನು ಸತ್ತಾಗ ಅವನ ಮಕ್ಳು ನನಗೆ ಸುದ್ದಿ ಕೂಡ ಕಳಿಸ್ಲಿಲ್ಲ. ಅದಕ್ಕೇ ಹೇಳ್ತೀನಿ — ಕೋರ್ಟಲ್ಲಿ ಗೆಲ್ಲೋದು ಕಾಗದ. ಸೋಲೋದು ಮನೆ. … ಮಹದೇವ, ನೀನೇ ಆಕ್ಷೇಪಣೆ ಕೊಟ್ಟೋನು. ಮೊದ್ಲು ನೀನು ಹೇಳಪ್ಪ."
    tr: "Tīrpu bandāga nāvibbrū mudukarāgidvi. Geddiddu nānu. Ādre ā dina sihi han̄cōkū manassāglilla. Ippatteraḍu varṣa nanna tammana mukha nōḍirlilla. Avanu sattāga avana makḷu nanage suddi kūḍa kaḷislilla. Adakkē hēḷtīni — kōrṭalli gellōdu kāgada. Sōlōdu mane. … Mahadēva, nīnē ākṣēpaṇe koṭṭōnu. Modlu nīnu hēḷappa."
    en: "By the time the judgment came, we were both old men. I was the one who won. But that day I didn't even have the heart to hand out sweets. For twenty-two years I hadn't seen my brother's face. When he died, his children didn't even send me word. That's why I say: in court it's the paper that wins. What loses is the family. … Mahadeva, you're the one who filed the objection. You speak first, son."
  - who: mahadeva
    t: "ತಿಮ್ಮಣ್ಣ, ಊರಿಗೆಲ್ಲಾ ಗೊತ್ತಿರೋದನ್ನೇ ಹೇಳ್ತೀನಿ. ತೊಂಬತ್ತೆಂಟರಲ್ಲಿ ಅಣ್ಣ ಕಾಲೇಜಿಗೆ ಹೋದ. ಎರಡು ಸಾವಿರದ ಆರರಲ್ಲಿ ನಾನು ಪಿಯುಸಿ ಮುಗಿಸಿದೆ, ಅದೇ ವರ್ಷ ಅಪ್ಪನ ಕಾಲು ಮುರೀತು. ಕಬ್ಬು ಕಟಾವಿಗೆ ಬಂದಿತ್ತು. ಅವತ್ತು ಪುಸ್ತಕ ಕೆಳಗಿಟ್ಟು ಕುಡುಗೋಲು ಕೈಗೆ ತಗಂಡೆ. ಮತ್ತೆ ಪುಸ್ತಕ ಮುಟ್ಟಲೇ ಇಲ್ಲ."
    tr: "Timmaṇṇa, ūrigellā gottirōdannē hēḷtīni. Tombatteṇṭaralli aṇṇa kālējige hōda. Eraḍu sāvirada āraralli nānu pi-yu-si mugiside, adē varṣa appana kālu murītu. Kabbu kaṭāvige bandittu. Avattu pustaka keḷagiṭṭu kuḍugōlu kaige tagaṇḍe. Matte pustaka muṭṭalē illa."
    en: "Thimmanna, I'll only say what the whole village already knows. In ninety-eight Anna went to college. In two thousand six I finished my PUC, and that same year Appa broke his leg. The cane was ready to be cut. That day I put down my books and took the sickle in my hand. I never touched a book again."
  - who: mahadeva
    t: "ಆಮೇಲೆ ಇಪ್ಪತ್ತು ವರ್ಷ ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಏಳ್ತಿದ್ದೆ. ರಾತ್ರಿ ಕರೆಂಟ್ ಬಂದಾಗ ಗದ್ದೆಗೆ ನೀರು ಕಟ್ತಿದ್ದೆ. ಕಾರ್ಖಾನೆ ಮುಂದೆ ಮೂರು ಮೂರು ದಿನ ಟ್ರ್ಯಾಕ್ಟರ್ ಸಾಲಲ್ಲಿ ನಿಂತ್ಕಳ್ತಿದ್ದೆ. ಶೋಭನ ಮದುವೆ ಸಾಲ ಐದು ವರ್ಷ ಕಟ್ಟಿದೆ. ಅಣ್ಣ ಸಂಬಳದಲ್ಲಿ, ತಂಗಿ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ — ನಾನು ಈ ಮಣ್ಣಲ್ಲಿ."
    tr: "Āmēle ippattu varṣa beḷigge aidakke ēḷtidde. Rātri karaṇṭ bandāga gaddege nīru kaṭtidde. Kārkhāne munde mūru mūru dina ṭrākṭar sālalli nintkaḷtidde. Śōbhana maduve sāla aidu varṣa kaṭṭide. Aṇṇa sambaḷadalli, taṅgi āspatreyalli — nānu ī maṇṇalli."
    en: "After that, for twenty years I'd get up at five. At night, whenever the power came, I'd water the paddy. I'd stand in the tractor queue outside the factory for three days at a stretch. I paid off Shobha's wedding loan for five years. Anna in his salary, my sister in her hospital — and me in this soil."
  - who: mahadeva
    t: "ದೇವರಾಜ ಅರಸು ಕಾಲದಲ್ಲೇ ಹೇಳಿದ್ರಲ್ಲ — ‘ಉಳುವವನೇ ಹೊಲದೊಡೆಯ’ ಅಂತ. ಉತ್ತೋನು ನಾನು. ಅದಕ್ಕೇ ಗದ್ದೆ ನಂಗೆ ಬೇಕು. ಬೇಕಾದ್ರೆ ಹೊಲದಲ್ಲಿ ಅವ್ರು ಪಾಲು ತಗಳ್ಲಿ."
    tr: "Dēvarāja Arasu kāladallē hēḷidralla — ‘uḷuvavanē holadoḍeya’ anta. Uttōnu nānu. Adakkē gadde naṅge bēku. Bēkādre holadalli avru pālu tagaḷli."
    en: "Back in Devaraj Urs's time they said it, didn't they — 'the one who tills is the owner of the field'. The one who ploughed is me. That's why I want the wet land. If they want, let them take shares in the dry field."
  - who: elder
    t: "ಕೇಳ್ಲಾ ಮಹದೇವ. ಆ ಮಾತು ನನ್ ಕಾಲದ್ದು. ನಾನೇ ಅವತ್ತು ಮೆರವಣಿಗೇಲಿ ಕೂಗಿದ್ದೆ. ಆದ್ರೆ ಅದು ಜಮೀನ್ದಾರನ ಮುಂದೆ ಗೇಣಿದಾರನ ಮಾತು. ಅಣ್ಣ-ತಂಗಿ ಮುಂದೆ ತಮ್ಮನ ಮಾತಲ್ಲ. ಇಲ್ಲಿ ಯಾರೂ ಜಮೀನ್ದಾರರಲ್ಲ, ಯಾರೂ ಗೇಣಿದಾರರಲ್ಲ. ಒಂದೇ ಹೊಟ್ಟೇಲಿ ಹುಟ್ಟಿದೋರು."
    tr: "Kēḷlā Mahadēva. Ā mātu nan kāladdu. Nānē avattu meravaṇigēli kūgidde. Ādre adu jamīndārana munde gēṇidārana mātu. Aṇṇa-taṅgi munde tammana mātalla. Illi yārū jamīndāraralla, yārū gēṇidāraralla. Ondē hoṭṭēli huṭṭidōru."
    en: "Listen, Mahadeva. That slogan is from my time. I shouted it myself in the processions back then. But it was the tenant's cry against the landlord. Not a younger brother's cry against his brother and sister. Nobody here is a landlord, and nobody here is a tenant. You were all born of the same womb."
  - who: mahadeva
    t: "ಗೊತ್ತು ತಿಮ್ಮಣ್ಣ. ಆದ್ರೆ ಬೆವರು ಸುರ್ಸಿದ್ದು ಒಂದೇ ಮೈ. ಅದನ್ನ ಯಾವ ಕಾನೂನು ಲೆಕ್ಕ ಹಾಕುತ್ತೆ?"
    tr: "Gottu Timmaṇṇa. Ādre bevaru sursiddu ondē mai. Adanna yāva kānūnu lekka hākutte?"
    en: "I know, Thimmanna. But the sweat was poured from only one body. Which law counts that?"
  - who: elder
    t: "ಸುರೇಶ, ನೀನು ದೊಡ್ಡೋನು. ನೀನೇನ್ ಹೇಳ್ತೀಯಪ್ಪ?"
    tr: "Surēśa, nīnu doḍḍōnu. Nīnēn hēḷtīyappa?"
    en: "Suresha, you're the eldest. What do you say, son?"
  - who: suresh
    t: "ತಿಮ್ಮೇಗೌಡ್ರೇ, ಮಹದೇವ ಹೇಳಿದ ಒಂದು ಮಾತೂ ಸುಳ್ಳಲ್ಲ. ಅಪ್ಪ ನನ್ನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ರು ಅಂತ ನಂಗೆ ಗೊತ್ತಾಗಿದ್ದು ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ, ಅವರ ದಿನಚರಿ ಓದಿದಾಗ. ನಾನು ಇವತ್ತು ಏನಾಗಿದೀನೋ ಅದರಲ್ಲಿ ಈ ಮಣ್ಣಿನ ಪಾಲೂ ಇದೆ, ಮಹದೇವನ ಪಾಲೂ ಇದೆ."
    tr: "Timmēgauḍrē, Mahadēva hēḷida ondu mātū suḷḷalla. Appa nanna ōdige ettu māridru anta naṅge gottāgiddu Ḍisembar-nalli, avara dinacari ōdidāga. Nānu ivattu ēnāgidīnō adaralli ī maṇṇina pālū ide, Mahadēvana pālū ide."
    en: "Thimmegowda, not one thing Mahadeva said is untrue. I only found out in December, reading his diary, that Appa sold the bullocks for my studies. Whatever I am today, this soil has a share in it, and so does Mahadeva."
  - who: suresh
    t: "ಆದ್ರೆ ಒಂದು ವಿಷಯ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳ್ಬೇಕು. ಶೋಭಾಗೆ ಪಾಲು ಇಲ್ಲ ಅನ್ನೋದು ತಪ್ಪು. ನಾನು ಮಹದೇವನ ದುಡಿಮೆಗೆ ಬೆಲೆ ಕೊಡ್ತೀನಿ, ಶೋಭಾಳ ಹಕ್ಕಿಗೂ ಬೆಲೆ ಕೊಡ್ತೀನಿ. ಇವೆರಡನ್ನೂ ಹೇಗೆ ಜೋಡಿಸೋದು ಅನ್ನೋದೇ ಇವತ್ತಿನ ಪ್ರಶ್ನೆ."
    tr: "Ādre ondu viṣaya spaṣṭavāgi hēḷbēku. Śōbhāge pālu illa annōdu tappu. Nānu Mahadēvana duḍimege bele koḍtīni, Śōbhāḷa hakkigū bele koḍtīni. Iveraḍannū hēge jōḍisōdu annōdē ivattina praśne."
    en: "But one thing must be said clearly. Saying Shobha has no share is wrong. I value Mahadeva's labour, and I value Shobha's right too. How to fit the two together — that is tonight's question."
  - who: mahadeva
    t: "ನೋಡಿದ್ರಾ? ಅಣ್ಣ ಯಾವಾಗ್ಲೂ ಹಿಂಗೇ — ಎರಡು ದೋಣಿ ಮೇಲೆ ಕಾಲು."
    tr: "Nōḍidrā? Aṇṇa yāvāglū hiṅgē — eraḍu dōṇi mēle kālu."
    en: "See that? Anna's always like this — a foot in two boats."
  - who: elder
    t: "ಮಹದೇವ! ನಿಯಮ ಮರೀಬೇಡ. ಅವನ ಸರದಿ ಮುಗೀಲಿ."
    tr: "Mahadēva! Niyama marībēḍa. Avana saradi mugīli."
    en: "Mahadeva! Don't forget the rule. Let him finish his turn."
  - who: suresh
    t: "ಪರವಾಗಿಲ್ಲ ತಿಮ್ಮೇಗೌಡ್ರೇ. ಹೌದು ಮಹದೇವ, ನಾನು ಮಧ್ಯದಲ್ಲಿ ನಿಂತಿದೀನಿ. ಯಾಕಂದ್ರೆ ಒಂದು ಕಡೆ ನನ್ನ ತಮ್ಮ, ಇನ್ನೊಂದು ಕಡೆ ನನ್ನ ತಂಗಿ. ಯಾರ ಕಡೆ ನಿಂತ್ರೂ ಇನ್ನೊಬ್ಬರನ್ನ ಕಳ್ಕೊಳ್ತೀನಿ."
    tr: "Paravāgilla Timmēgauḍrē. Haudu Mahadēva, nānu madhyadalli nintidīni. Yākandre ondu kaḍe nanna tamma, innondu kaḍe nanna taṅgi. Yāra kaḍe nintrū innobbaranna kaḷkoḷḷtīni."
    en: "It's all right, Thimmegowda. Yes, Mahadeva, I'm standing in the middle. Because on one side is my brother and on the other my sister. Whichever side I stand on, I lose the other."
  - who: elder
    t: "ಸರಿ. ಈಗ ಮಗಳ ಸರದಿ. ಶೋಭಾ, ಹೇಳವ್ವ. ಭಯ ಬೇಡ."
    tr: "Sari. Īga magaḷa saradi. Śōbhā, hēḷavva. Bhaya bēḍa."
    en: "Good. Now it's the daughter's turn. Shobha, speak, my girl. Don't be afraid."

  - section: "The law and the sister"
    learn: "citing the law: pitrārjita āsti, tiddupaḍi, huṭṭinindalē, sahasamāṁśi (coparcener), tīrpu, ḍikri · explaining a hard word with an image: ondē taṭṭeyalli uṇṇōru · rhetorical questions: yāke pālu āgutte? · debt vs right: ṛṇa bēre, hakku bēre · firm limits: ‘pālē illa’ annō dārige baralla"
  - scene: "Shobha has a thin folder of photocopies on her lap. Some of the men at the back murmur when she opens it. Thimmegowda raises a hand, and they fall silent."
  - who: shobha
    t: "ತಿಮ್ಮೇಗೌಡ್ರೇ, ನಾನು ಕೂತ್ಕೊಂಡೇ ಮಾತಾಡ್ತೀನಿ. ನನ್ನ ಕೈಲಿ ಸ್ವಲ್ಪ ಕಾಗದ ಇದೆ — ಜಗಳಕ್ಕಲ್ಲ. ನಾನು ಹೇಳೋದು ನನ್ನ ಸ್ವಂತ ಅಭಿಪ್ರಾಯ ಅಲ್ಲ ಅಂತ ತೋರಿಸೋಕೆ."
    tr: "Timmēgauḍrē, nānu kūtkoṇḍē mātāḍtīni. Nanna kaili svalpa kāgada ide — jagaḷakkalla. Nānu hēḷōdu nanna svanta abhiprāya alla anta tōrisōke."
    en: "Thimmegowda, I'll speak sitting down. I have some papers in my hand — not for a fight. Just to show that what I'm saying isn't merely my own opinion."
  - who: shobha
    t: "ಗದ್ದೆ ಅಪ್ಪನಿಗೆ ಅವರ ಅಪ್ಪ ಕರಿಯಪ್ಪನಿಂದ ಬಂದಿದ್ದು. ಅಂದ್ರೆ ಅದು ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿ. ಎರಡು ಸಾವಿರದ ಐದರಲ್ಲಿ ಹಿಂದೂ ಉತ್ತರಾಧಿಕಾರ ಕಾಯ್ದೆಗೆ ತಿದ್ದುಪಡಿ ಆಯ್ತು. ಅದರ ಪ್ರಕಾರ ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿಯಲ್ಲಿ ಮಗಳಿಗೂ ಹುಟ್ಟಿನಿಂದಲೇ ಮಗನಷ್ಟೇ ಹಕ್ಕು ಇದೆ. ಕಾನೂನಿನ ಭಾಷೇಲಿ ಮಗಳೂ ‘ಸಹಸಮಾಂಶಿ’."
    tr: "Gadde appanige avara appa Kariyappaninda bandiddu. Andre adu pitrārjita āsti. Eraḍu sāvirada aidaralli Hindū uttarādhikāra kāydege tiddupaḍi āytu. Adara prakāra pitrārjita āstiyalli magaḷigū huṭṭinindalē maganaṣṭē hakku ide. Kānūnina bhāṣēli magaḷū ‘sahasamāṁśi’."
    en: "The wet land came to Appa from his father, Kariyappa. That makes it ancestral property. In 2005 the Hindu Succession Act was amended. Under it, a daughter has, from birth, the same right in ancestral property as a son. In the law's language, the daughter too is a 'coparcener'."
  - who: elder
    t: "ಸಹ… ಸಮಾಂಶಿ. ಅಂಗಂದ್ರೆ ಏನವ್ವ? ನಮ್ಗೆ ಅರ್ಥ ಆಗಂಗೆ ಹೇಳು."
    tr: "Saha… samāṁśi. Aṅgandre ēnavva? Namge artha āgaṅge hēḷu."
    en: "Co… parcener. Meaning what, girl? Say it so we can understand."
  - who: shobha
    t: "ಒಂದೇ ತಟ್ಟೆಯಲ್ಲಿ ಉಣ್ಣೋರು ಅಂತ ತಿಳ್ಕೊಳ್ಳಿ. ಹಿಂದೆ ಆ ತಟ್ಟೆ ಮುಂದೆ ಗಂಡುಮಕ್ಕಳು ಮಾತ್ರ ಕೂರ್ತಿದ್ರು. ಈಗ ಮಗಳೂ ಹುಟ್ಟಿದ ದಿನದಿಂದಲೇ ಅದೇ ತಟ್ಟೆ ಮುಂದೆ ಕೂತಿರ್ತಾಳೆ. ಮದುವೆ ಆದ್ರೂ ಅವಳ ಜಾಗ ಹೋಗಲ್ಲ."
    tr: "Ondē taṭṭeyalli uṇṇōru anta tiḷkoḷḷi. Hinde ā taṭṭe munde gaṇḍumakkaḷu mātra kūrtidru. Īga magaḷū huṭṭida dinadindalē adē taṭṭe munde kūtirtāḷe. Maduve ādrū avaḷa jāga hōgalla."
    en: "Think of it as those who eat from the same plate. In the old days only the sons sat before that plate. Now the daughter too sits before the same plate from the day she's born. Even if she marries, she doesn't lose her place."
  - who: elder
    t: "ಹ್ಞೂ… ಚೆನ್ನಾಗಿ ಹೇಳ್ದೆ. ಮುಂದುವರ್ಸು."
    tr: "Hñū… cennāgi hēḷde. Munduvarsu."
    en: "Hmm… well put. Go on."
  - who: shobha
    t: "ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತರಲ್ಲಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ವಿನೀತಾ ಶರ್ಮಾ ಪ್ರಕರಣದಲ್ಲಿ ತೀರ್ಪು ಕೊಟ್ಟಿದೆ: ತಿದ್ದುಪಡಿ ಬಂದಾಗ ಅಪ್ಪ ಬದುಕಿರ್ಲಿ ಬಿಡ್ಲಿ, ಮಗಳ ಹಕ್ಕು ಹುಟ್ಟಿನಿಂದಲೇ. ಇನ್ನೊಂದು ಮಾತೂ ಆ ತೀರ್ಪಲ್ಲಿದೆ — ಬರೀ ಬಾಯ್ಮಾತಿನ ಪಾಲನ್ನ ಸಾಮಾನ್ಯವಾಗಿ ಒಪ್ಪಲ್ಲ. ನೋಂದಣಿ ಆದ ಪತ್ರ ಅಥವಾ ಕೋರ್ಟ್ ಡಿಕ್ರಿ ಬೇಕು."
    tr: "Eraḍu sāvirada ippattaralli Suprīṁ Kōrṭ Vinītā Śarmā prakaraṇadalli tīrpu koṭṭide: tiddupaḍi bandāga appa badukirli biḍli, magaḷa hakku huṭṭinindalē. Innondu mātū ā tīrpallide — barī bāymātina pālanna sāmānyavāgi oppalla. Nōndaṇi āda patra athavā kōrṭ ḍikri bēku."
    en: "In 2020 the Supreme Court gave its judgment in the Vineeta Sharma case: whether or not the father was alive when the amendment came, the daughter's right exists from birth. There's one more thing in that judgment — a division made only by word of mouth is generally not accepted. You need a registered deed or a court decree."
  - who: mahadeva
    t: "ದಿಲ್ಲಿ ಕೋರ್ಟು, ದಿಲ್ಲಿ ತೀರ್ಪು. ಆ ಜಡ್ಜು ಯಾವತ್ತಾದ್ರೂ ಬೆಟ್ಟಹಳ್ಳಿ ಗದ್ದೇಲಿ ಕಾಲಿಟ್ಟಿದಾರಾ?"
    tr: "Dilli kōrṭu, dilli tīrpu. Ā jaḍju yāvattādrū Beṭṭahaḷḷi gaddēli kāliṭṭidārā?"
    en: "A Delhi court, a Delhi judgment. Has that judge ever once set foot in a Bettahalli paddy field?"
  - who: shobha
    t: "ಇಲ್ಲ, ಮಹದೇವ. ಆದ್ರೆ ಬೆಟ್ಟಹಳ್ಳಿಯೂ ಇದೇ ದೇಶದಲ್ಲಿದೆ. ತಹಸೀಲ್ದಾರ್ ಮೇಡಂ ಹೇಳಿದ್ದೂ ಅದೇ ಅಲ್ವಾ?"
    tr: "Illa, Mahadēva. Ādre Beṭṭahaḷḷiyū idē dēśadallide. Tahasīldār mēḍam hēḷiddū adē alvā?"
    en: "No, Mahadeva. But Bettahalli is in this same country. Isn't that exactly what the Tahsildar madam said too?"
  - who: shobha
    t: "ಮತ್ತೆ, ಊರಲ್ಲಿ ಒಂದು ಮಾತು ಓಡಾಡ್ತಿದೆ ಅಂತ ನಂಗೆ ಗೊತ್ತು — ‘ಮದುವೆಗೆ ಎರಡು ಲಕ್ಷ ಖರ್ಚಾಯ್ತು, ಅದೇ ಅವಳ ಪಾಲು’ ಅಂತ. ಮದುವೆ ಖರ್ಚು ಪಾಲಲ್ಲ. ಅಪ್ಪ ಮಗನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ರು — ಅದನ್ನ ಯಾರೂ ಅಣ್ಣನ ಪಾಲು ಅನ್ನಲ್ಲ. ಮಗಳಿಗೆ ಮಾಡಿದ್ದು ಮಾತ್ರ ಯಾಕೆ ಪಾಲು ಆಗುತ್ತೆ?"
    tr: "Matte, ūralli ondu mātu ōḍāḍtide anta naṅge gottu — ‘maduvege eraḍu lakṣa kharcāytu, adē avaḷa pālu’ anta. Maduve kharcu pālalla. Appa magana ōdige ettu māridru — adanna yārū aṇṇana pālu annalla. Magaḷige māḍiddu mātra yāke pālu āgutte?"
    en: "And I know there's talk going round the village — 'Two lakh was spent on her wedding; that was her share.' Wedding expenses are not a share. Appa sold the bullocks for his son's studies — nobody calls that Anna's share. Why is it that only what was done for the daughter becomes her share?"
  - who: elder
    t: "… ಇದಕ್ಕೆ ಯಾರತ್ರಾನಾದ್ರೂ ಉತ್ರ ಇದೆಯಾ?"
    tr: "… Idakke yāratrānādrū utra ideyā?"
    en: "(after a silence) … Does anyone have an answer to that?"
  - who: mahadeva
    t: "ಉತ್ರ ಇದೆ. ಎತ್ತು ಮಾರಿದ್ದು ಅಪ್ಪ. ಸಾಲ ತೀರಿಸಿದ್ದು ನಾನು. ಅವಳ ಮದುವೆ ಸಾಲ ಅಪ್ಪನ ಸಾಲ ಆಗಿ ಉಳೀಲಿಲ್ಲ, ನನ್ನ ಬೆನ್ನ ಮೇಲಿನ ಸಾಲ ಆಗಿತ್ತು."
    tr: "Utra ide. Ettu māriddu appa. Sāla tīrisiddu nānu. Avaḷa maduve sāla appana sāla āgi uḷīlilla, nanna benna mēlina sāla āgittu."
    en: "There's an answer. It was Appa who sold the bullocks. It was me who cleared the debt. Her wedding loan didn't stay Appa's debt — it had become a debt on my back."
  - who: shobha
    t: "ಅದಕ್ಕೆ ನಾನು ನಿನಗೆ ಋಣಿ, ಮಹದೇವ. ನಿಜವಾಗ್ಲೂ. ಪಾಲು ಮಾಡುವಾಗ ಅದನ್ನ ಲೆಕ್ಕಕ್ಕೆ ತಗೊಳ್ಳೋಣ. ಆದ್ರೆ ಋಣ ಬೇರೆ, ಹಕ್ಕು ಬೇರೆ."
    tr: "Adakke nānu ninage ṛṇi, Mahadēva. Nijavāglū. Pālu māḍuvāga adanna lekkakke tagoḷḷōṇa. Ādre ṛṇa bēre, hakku bēre."
    en: "I'm indebted to you for that, Mahadeva. Truly. Let's take it into account when we divide. But a debt of gratitude is one thing, and a right is another."
  - who: elder
    t: "ನಿಂಗೇಗೌಡ್ರು ಒಂದು ಪ್ರಶ್ನೆ ಕೇಳ್ತಿದಾರೆ, ನಾನೇ ಕೇಳ್ತೀನಿ: ಶೋಭಾ, ನಿಂಗೆ ಏನು ಬೇಕು? ಗದ್ದೆ ಒಡೆದು ಒಂದು ತುಂಡು ಬೇಕಾ? ನೀನು ಮೈಸೂರಲ್ಲಿ ಇದ್ಕಂಡು ಉಳುಮೆ ಮಾಡ್ತೀಯಾ?"
    tr: "Niṅgēgauḍru ondu praśne kēḷtidāre, nānē kēḷtīni: Śōbhā, niṅge ēnu bēku? Gadde oḍedu ondu tuṇḍu bēkā? Nīnu Maisūralli idkaṇḍu uḷume māḍtīyā?"
    en: "Ningegowda is asking a question; I'll put it for him. Shobha, what is it you want? Do you want the wet land broken up and a piece of it? Will you plough it while living in Mysuru?"
  - who: shobha
    t: "ಇಲ್ಲ, ತಿಮ್ಮೇಗೌಡ್ರೇ. ನಾನು ಮಹದೇವನ ಕೈಯಿಂದ ನೇಗಿಲು ಕಿತ್ಕೊಳ್ಳೋಕೆ ಬಂದಿಲ್ಲ. ನನಗೆ ಮೂರು ವಿಷಯ ಬೇಕು. ಒಂದು: ನನ್ನ ಹೆಸರು ಇನ್ಮೇಲೆ ಯಾವ ಕಾಗದದಿಂದಲೂ ಕಾಣೆ ಆಗಬಾರದು. ಎರಡು: ನನ್ನ ಪಾಲು ನನಗೆ ಸಿಗ್ಬೇಕು — ಜಮೀನಾಗಿ ಆಗ್ಲಿ, ದುಡ್ಡಾಗಿ ಆಗ್ಲಿ. ಮೂರು: ನಾನು ಈ ಮನೆಗೆ ಬಂದಾಗ ನೆಂಟರ ತರ ಅಲ್ಲ, ಮಗಳ ತರ ಬರ್ಬೇಕು."
    tr: "Illa, Timmēgauḍrē. Nānu Mahadēvana kaiyinda nēgilu kitkoḷḷōke bandilla. Nanage mūru viṣaya bēku. Ondu: nanna hesaru inmēle yāva kāgadadindalū kāṇe āgabāradu. Eraḍu: nanna pālu nanage sigbēku — jamīnāgi āgli, duḍḍāgi āgli. Mūru: nānu ī manege bandāga neṇṭara tara alla, magaḷa tara barbēku."
    en: "No, Thimmegowda. I haven't come to snatch the plough from Mahadeva's hands. I want three things. One: from now on my name must never go missing from any paper. Two: I must get my share — as land or as money. Three: when I come to this house, I should come as a daughter, not as a visiting relative."
  - who: mahadeva
    t: "ದುಡ್ಡಾಗಿ? ಎಲ್ಲಿಂದ ತರ್ಲಿ? ಕಬ್ಬಿನ ದುಡ್ಡೇ ಇನ್ನೂ ಕಾರ್ಖಾನೆಯಿಂದ ಬಂದಿಲ್ಲ. ಸಂಘದ ಸಾಲ ಒಂದು ಲಕ್ಷ ಅರವತ್ತು ಸಾವಿರ ಬಾಕಿ ಇದೆ. ನಿನ್ನ ಪಾಲಿನ ಬೆಲೆ ಎಷ್ಟು ಲಕ್ಷ ಅಂತ ಲೆಕ್ಕ ಹಾಕಿದೀಯಾ? ಅಷ್ಟು ದುಡ್ಡು ನಾನು ಜೀವಮಾನದಲ್ಲಿ ಕಣ್ಣಲ್ಲಿ ನೋಡಿಲ್ಲ."
    tr: "Duḍḍāgi? Ellinda tarli? Kabbina duḍḍē innū kārkhāneyinda bandilla. Saṅghada sāla ondu lakṣa aravattu sāvira bāki ide. Ninna pālina bele eṣṭu lakṣa anta lekka hākidīyā? Aṣṭu duḍḍu nānu jīvamānadalli kaṇṇalli nōḍilla."
    en: "As money? Where am I to bring it from? The cane money itself still hasn't come from the factory. One lakh sixty thousand of society loan is outstanding. Have you worked out how many lakhs your share is worth? I haven't seen that much money with my own eyes in my whole life."
  - who: shobha
    t: "ಒಂದೇ ಸಲ ಕೊಡು ಅಂತ ನಾನು ಹೇಳಿಲ್ಲ. ಕಂತಿನಲ್ಲಿ ಕೊಡು. ಇಲ್ಲಾಂದ್ರೆ ಹೊಲದಲ್ಲಿ ಒಂದು ತುಂಡು ನನ್ನ ಹೆಸರಿಗೆ ಇರ್ಲಿ, ನೀನೇ ಬೆಳೆ ಮಾಡು. ದಾರಿ ಹುಡುಕೋಕೆ ನಾನು ತಯಾರು. ಆದ್ರೆ ‘ಪಾಲೇ ಇಲ್ಲ’ ಅನ್ನೋ ದಾರಿಗೆ ಮಾತ್ರ ಬರಲ್ಲ."
    tr: "Ondē sala koḍu anta nānu hēḷilla. Kantinalli koḍu. Illāndre holadalli ondu tuṇḍu nanna hesarige irli, nīnē beḷe māḍu. Dāri huḍukōke nānu tayāru. Ādre ‘pālē illa’ annō dārige mātra baralla."
    en: "I never said give it all at once. Give it in instalments. Or let a piece of the dry field be in my name, and you grow the crop on it. I'm ready to look for a way. But the one road I won't take is the one that says 'no share at all'."
  - who: suresh
    t: "ತಿಮ್ಮೇಗೌಡ್ರೇ, ನಾನೊಂದು ಸಲಹೆ ಹೇಳ್ತೀನಿ. ತೀರ್ಮಾನ ಅಲ್ಲ, ಬರೀ ಸಲಹೆ. ಗದ್ದೆ ಮಹದೇವನ ಕೈಯಲ್ಲೇ ಇರ್ಲಿ. ಶೋಭಾಳ ಪಾಲಿನ ಬೆಲೆಯಷ್ಟು ಜಾಗ ಹೊಲದಲ್ಲಿ ಅಳತೆ ಮಾಡಿ ಅವಳಿಗೆ ಕೊಡೋಣ. ನನ್ನ ಪಾಲಿನ ವಿಷಯ ಆಮೇಲೆ ನೋಡೋಣ — ನಾನು ಯಾರನ್ನೂ ಕಾಯಿಸಲ್ಲ."
    tr: "Timmēgauḍrē, nānondu salahe hēḷtīni. Tīrmāna alla, barī salahe. Gadde Mahadēvana kaiyallē irli. Śōbhāḷa pālina beleyaṣṭu jāga holadalli aḷate māḍi avaḷige koḍōṇa. Nanna pālina viṣaya āmēle nōḍōṇa — nānu yārannū kāyisalla."
    en: "Thimmegowda, let me offer a suggestion. Not a decision, just a suggestion. Let the wet land stay in Mahadeva's hands. Let's measure out land in the dry field worth Shobha's share and give it to her. My own share we can look at later — I won't keep anyone waiting."
  - who: elder
    t: "ಕೇಳೋಕೆ ಚೆನ್ನಾಗಿದೆ. ಮಹದೇವ, ಏನಂತೀಯ?"
    tr: "Kēḷōke cennāgide. Mahadēva, ēnantīya?"
    en: "It sounds good to the ear. Mahadeva, what do you say?"
  - who: mahadeva
    t: "ಹೊಲ ತುಂಡು ಮಾಡ್ತೀರಾ? ಅಪ್ಪ ಮಲಗಿರೋದು ಆ ಹೊಲದ ಹುಣಸೆ ಮರದ ಕೆಳಗೆ, ಅಣ್ಣ. ನಾಳೆ ಅವಳ ಪಾಲಿನ ತುಂಡು ಯಾರೋ ಬೆಂಗಳೂರಿನೋರಿಗೆ ಮಾರಿದ್ರೆ? ಅಪ್ಪನ ಸಮಾಧಿ ಪಕ್ಕ ಯಾರದೋ ಕಾಂಪೌಂಡ್ ಗೋಡೆ ಏಳುತ್ತೆ. ಅದನ್ನ ನಾನು ನೋಡ್ಬೇಕಾ?"
    tr: "Hola tuṇḍu māḍtīrā? Appa malagirōdu ā holada huṇase marada keḷage, aṇṇa. Nāḷe avaḷa pālina tuṇḍu yārō Beṅgaḷūrinōrige māridre? Appana samādhi pakka yāradō kāmpauṇḍ gōḍe ēḷutte. Adanna nānu nōḍbēkā?"
    en: "You'll cut up the dry field? Appa lies under the tamarind tree in that field, Anna. What if tomorrow her piece is sold to some Bengaluru people? Somebody's compound wall will go up right next to Appa's grave. Am I supposed to watch that?"
  - who: shobha
    t: "ನಾನು ಮಾರ್ತೀನಿ ಅಂತ ಯಾರು ಹೇಳಿದ್ರು? ಅದು ನನ್ನ ಅಪ್ಪನ ಸಮಾಧಿನೂ ಹೌದು, ನಿನ್ನೊಬ್ಬನದಲ್ಲ."
    tr: "Nānu mārtīni anta yāru hēḷidru? Adu nanna appana samādhinū haudu, ninnobbanadalla."
    en: "Who said I'd sell it? That's my father's grave too, not yours alone."
  - who: mahadeva
    t: "ಇವತ್ತು ನೀನು ಹೇಳಲ್ಲ. ನಾಳೆ ನಿನ್ನ ಗಂಡನ ಮನೆಯೋರು ಹೇಳ್ತಾರೆ. ಊರೂರಲ್ಲಿ ಹಂಗೆ ಆಗಿರೋದನ್ನ ನೋಡಿಲ್ವಾ?"
    tr: "Ivattu nīnu hēḷalla. Nāḷe ninna gaṇḍana maneyōru hēḷtāre. Ūrūralli haṅge āgirōdanna nōḍilvā?"
    en: "You won't say it today. Tomorrow your husband's family will say it. Haven't we seen it happen that way in village after village?"
  - who: shobha
    t: "ನನ್ನ ಗಂಡನ ಮನೆಯೋರನ್ನ ಇಲ್ಲಿಗೆ ಎಳೀಬೇಡ, ಮಹದೇವ."
    tr: "Nanna gaṇḍana maneyōranna illige eḷībēḍa, Mahadēva."
    en: "Don't drag my husband's family into this, Mahadeva."
  - who: elder
    t: "ಸಾಕು, ಸಾಕು. ಮಾತು ಬೇರೆ ಕಡೆ ಹೋಯ್ತಾ ಇದೆ."
    tr: "Sāku, sāku. Mātu bēre kaḍe hōytā ide."
    en: "Enough, enough. The talk is drifting the wrong way."

  - section: "Old wounds"
    learn: "reproach in habitual past: kaḷistiddaddu yāru?, mātāḍtiddaddu yāru? · counterfactual: ūrallē iddidre … kūtirtidde · admitting fault: adu nanna tappu, taḍavāgi hēḷtidīni · shared burdens: obbobbaru ondondu bhāra · image: maṇṇu han̄cabōdu, nōvu han̄cōkāgalla, karagisbēku"
  - scene: "The lamp hisses. Among the women, a small child has fallen asleep in his mother's lap. The talk has turned from land to the past."
  - who: shobha
    t: "ಮಹದೇವ, ನೀನು ‘ನಾನೇ ಇದ್ದೆ, ನಾನೇ ಇದ್ದೆ’ ಅಂತೀಯ. ಅವ್ವನ ಮಂಡಿ ನೋವಿಗೆ ಪ್ರತಿ ತಿಂಗಳು ಮೈಸೂರಿಂದ ಮಾತ್ರೆ ಕಳಿಸ್ತಿದ್ದದ್ದು ಯಾರು? ಪ್ರತಿ ಭಾನುವಾರ ಫೋನ್ ಮಾಡಿ ಅಪ್ಪನ ಹತ್ರ ಅರ್ಧ ಗಂಟೆ ಮಾತಾಡ್ತಿದ್ದದ್ದು ಯಾರು? ಊರಿಗೆ ಬಂದಾಗ ಅಪ್ಪ ‘ನನ್ ಮಗಳು ನರ್ಸ್’ ಅಂತ ಎಲ್ಲರಿಗೂ ತೋರಿಸ್ತಿದ್ದದ್ದು ಯಾರನ್ನ?"
    tr: "Mahadēva, nīnu ‘nānē idde, nānē idde’ antīya. Avvana maṇḍi nōvige prati tiṅgaḷu Maisūrinda mātre kaḷistiddaddu yāru? Prati bhānuvāra phōn māḍi appana hatra ardha gaṇṭe mātāḍtiddaddu yāru? Ūrige bandāga appa ‘nan magaḷu nars’ anta ellarigū tōristiddaddu yāranna?"
    en: "Mahadeva, you keep saying, 'I was the one who was here, I was here.' Who sent tablets from Mysuru every month for Avva's knee pain? Who phoned every Sunday and talked to Appa for half an hour? Whenever I came to the village, who was it Appa showed off to everyone — 'my daughter, the nurse'?"
  - who: mahadeva
    t: "ಫೋನ್ ಮಾಡೋದು ಸುಲಭ, ಶೋಭಾ. ಅಪ್ಪ ಜ್ವರದಲ್ಲಿ ನಡುಗ್ತಿದ್ದಾಗ ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಬೈಕಲ್ಲಿ ಕೂರಿಸ್ಕಂಡು ಮದ್ದೂರಿನ ಡಾಕ್ಟ್ರ ಮನೆ ಬಾಗಿಲು ತಟ್ಟೋದು ಕಷ್ಟ."
    tr: "Phōn māḍōdu sulabha, Śōbhā. Appa jvaradalli naḍugtiddāga rātri eraḍu gaṇṭege baikalli kūriskaṇḍu Maddūrina ḍākṭra mane bāgilu taṭṭōdu kaṣṭa."
    en: "Phoning is easy, Shobha. What's hard is sitting Appa on the back of the bike at two in the morning when he's shaking with fever, and knocking on the Maddur doctor's door."
  - who: shobha
    t: "ಅದಕ್ಕೇ ನನ್ನ ಮೈಸೂರಿಗೆ ಕಳಿಸಿದ್ದು ನೀವೇ ಅಂದಿದ್ದು. ನಾನು ಇಪ್ಪತ್ತೊಂದು ವರ್ಷದವಳಿದ್ದಾಗ ‘ಒಳ್ಳೆ ಸಂಬಂಧ, ಬಿಡಬಾರದು’ ಅಂತ ಮದುವೆ ಮಾಡಿದ್ರಿ. ನಾನು ಊರಲ್ಲೇ ಇದ್ದಿದ್ರೆ ಆ ಬೈಕ್ ಹಿಂದೆ ನಾನೂ ಕೂತಿರ್ತಿದ್ದೆ."
    tr: "Adakkē nanna Maisūrige kaḷisiddu nīvē andiddu. Nānu ippattondu varṣadavaḷiddāga ‘oḷḷe sambandha, biḍabāradu’ anta maduve māḍidri. Nānu ūrallē iddidre ā baik hinde nānū kūtirtidde."
    en: "That's exactly why I said it was all of you who sent me off to Mysuru. When I was twenty-one, you married me off saying 'it's a good match, we mustn't let it go'. If I had stayed in the village, I'd have been sitting on the back of that bike too."
  - who: suresh
    t: "ಶೋಭಾ, ಆ ಸಂಬಂಧ ತಂದಿದ್ದು ನಾನು. ಅವತ್ತು ನೀನು ‘ನರ್ಸಿಂಗ್ ಮುಗಿಸಿ ಕೆಲಸಕ್ಕೆ ಸೇರಿದ ಮೇಲೆ ಮದುವೆ’ ಅಂದಾಗ ನಾನು ಕೇಳಿಸ್ಕೊಳ್ಳಲಿಲ್ಲ. ಬ್ಯಾಂಕ್ ಕೆಲಸ ಸಿಕ್ಕಿದ ಜಂಬ ಇತ್ತು ನಂಗೆ — ಮನೆಯ ಎಲ್ಲಾ ತೀರ್ಮಾನ ನಾನೇ ಮಾಡ್ತೀನಿ ಅನ್ನೋ ಜಂಬ. ಅದು ನನ್ನ ತಪ್ಪು. ಹದಿನಾರು ವರ್ಷ ತಡವಾಗಿ ಹೇಳ್ತಿದೀನಿ."
    tr: "Śōbhā, ā sambandha tandiddu nānu. Avattu nīnu ‘narsiṅg mugisi kelasakke sērida mēle maduve’ andāga nānu kēḷiskoḷḷalilla. Byāṅk kelasa sikkida jamba ittu naṅge — maneya ellā tīrmāna nānē māḍtīni annō jamba. Adu nanna tappu. Hadināru varṣa taḍavāgi hēḷtidīni."
    en: "Shobha, I was the one who brought that proposal. That day, when you said 'I'll marry after I finish nursing and start a job', I didn't listen. I was full of pride at having got a bank job — the pride of thinking I'd make every decision in the house. That was my fault. I'm saying it sixteen years late."
  - who: shobha
    t: "… ಮದುವೆ ಆದ ಮೇಲೆ ಮೂರು ವರ್ಷ ಕಷ್ಟಪಟ್ಟು ನರ್ಸಿಂಗ್ ಮುಗಿಸಿದೆ, ಅಣ್ಣ. ಅವತ್ತು ಯಾರೂ ‘ಹೇಗಿದೀಯ’ ಅಂತ ಕೇಳ್ಲಿಲ್ಲ."
    tr: "… Maduve āda mēle mūru varṣa kaṣṭapaṭṭu narsiṅg mugiside, aṇṇa. Avattu yārū ‘hēgidīya’ anta kēḷlilla."
    en: "(quietly) … After the wedding I struggled for three years to finish my nursing, Anna. Back then nobody asked me how I was."
  - who: mahadeva
    t: "ಕೇಳ್ಲಿಲ್ಲ, ನಿಜ. ಯಾಕಂದ್ರೆ ಆಗ ನಾನು ನಿನ್ನ ಮದುವೆ ಸಾಲದ ಕಂತು ಕಟ್ತಿದ್ದೆ. ನಾವೆಲ್ಲಾ ಒಬ್ಬೊಬ್ಬರು ಒಂದೊಂದು ಭಾರ ಹೊತ್ಕಂಡಿದ್ವಿ. ಯಾರೂ ಇನ್ನೊಬ್ಬರ ಭಾರ ನೋಡ್ಲಿಲ್ಲ."
    tr: "Kēḷlilla, nija. Yākandre āga nānu ninna maduve sālada kantu kaṭtidde. Nāvellā obbobbaru ondondu bhāra hotkaṇḍidvi. Yārū innobbara bhāra nōḍlilla."
    en: "True, nobody asked. Because back then I was paying the instalments on your wedding loan. Each of us was carrying a load of our own. Nobody looked at anyone else's."
  - who: elder
    t: "ಈಗ ನಿಜವಾದ ಮಾತು ಬಂತು. ನೋಡ್ರಪ್ಪ, ಜಮೀನಿನ ಜಗಳ ಅಂತ ಕುಂತ್ರಿ. ಆದ್ರೆ ಒಳಗೆ ಇರೋದು ಇಪ್ಪತ್ತು ವರ್ಷದ ನೋವು. ಮಣ್ಣು ಹಂಚಬೋದು, ನೋವು ಹಂಚೋಕಾಗಲ್ಲ — ಮಾತಾಡಿ ಮಾತಾಡಿ ಕರಗಿಸ್ಬೇಕು."
    tr: "Īga nijavāda mātu bantu. Nōḍrappa, jamīnina jagaḷa anta kuntri. Ādre oḷage irōdu ippattu varṣada nōvu. Maṇṇu han̄cabōdu, nōvu han̄cōkāgalla — mātāḍi mātāḍi karagisbēku."
    en: "Now the real talk has come out. Look, my children, you sat down calling it a land dispute. But what's inside is twenty years of hurt. Soil can be divided; hurt can't be divided — you have to talk and talk until it melts."
  - who: rakshith
    t: "ಅಮ್ಮ, ‘ಕರಗಿಸ್ಬೇಕು’ ಅಂದ್ರೇನು?"
    tr: "Amma, ‘karagisbēku’ andrēnu?"
    en: "(whispering) Amma, what does 'karagisbeku' mean?"
  - who: meena
    t: "ಬೆಣ್ಣೆ ಬಿಸಿಗೆ ಕರಗೋ ಹಾಗೆ, ಗಟ್ಟಿಯಾಗಿರೋದನ್ನ ಮೆತ್ತಗೆ ಮಾಡ್ಬೇಕು ಅಂತ. ಈಗ ಸುಮ್ನೆ ಕೇಳು."
    tr: "Beṇṇe bisige karagō hāge, gaṭṭiyāgirōdanna mettage māḍbēku anta. Īga sumne kēḷu."
    en: "(whispering back) Like butter melting in the heat — making what has gone hard soft again. Now just listen."

  - section: "Avva's wish"
    learn: "a mother's plea: nānu badukirō tanaka, kaṇṇu muccida mēle · proverb-like images: ondu beraḷu koydrū nōvu · reported wisdom: nammavva hēḷtidlu · the elders' terms (ondu, eraḍu, mūru) and a deadline: varṣada tithi tanaka · partial acceptance and refusal: modala eraḍu mātige optīni; oppige illa, tappu tiḷkōbēḍi · closing proverb: kūḍi bāḷidare svarga sukha"
  - scene: "Thimmegowda turns to Avva, who has sat silent all evening on her mat, the end of her sari drawn over her head."
  - who: elder
    t: "ಪುಟ್ಟಮ್ಮ, ಇವತ್ತು ಕೊನೇ ಮಾತು ನಿಂದು. ನೀನು ಏನ್ ಬಯಸ್ತೀಯಮ್ಮ?"
    tr: "Puṭṭamma, ivattu konē mātu nindu. Nīnu ēn bayastīyamma?"
    en: "Puttamma, tonight the last word is yours. What is it you wish for?"
  - who: avva
    t: "ನಾನೇನು ಹೇಳ್ಲಿ ತಿಮ್ಮಣ್ಣ… ಮೂರೂ ನನ್ ಹೊಟ್ಟೇಲಿ ಹುಟ್ಟಿದ ಮಕ್ಳು. ಒಂದು ಬೆರಳು ಕೊಯ್ದ್ರೂ ನೋವು, ಇನ್ನೊಂದು ಕೊಯ್ದ್ರೂ ನೋವು. ಯಾರ ಕಡೆ ನಿಲ್ಲಲಿ?"
    tr: "Nānēnu hēḷli Timmaṇṇa… mūrū nan hoṭṭēli huṭṭida makḷu. Ondu beraḷu koydrū nōvu, innondu koydrū nōvu. Yāra kaḍe nillali?"
    en: "What can I say, Thimmanna… all three are children of my own womb. Cut one finger, it hurts; cut another, it hurts just the same. Whose side am I to stand on?"
  - who: avva
    t: "ನನ್ನ ಆಸೆ ಒಂದೇ. ನಾನು ಬದುಕಿರೋ ತನಕ ಈ ಮನೆ, ಈ ಜಮೀನು ಒಡೀಬಾರ್ದು. ಮಹದೇವ ಗದ್ದೆ ನೋಡ್ಕಳ್ಲಿ. ಸುರೇಶ, ಶೋಭಾ ಹಬ್ಬಕ್ಕೆ ಬರ್ಲಿ, ಅಂಗಳದಲ್ಲಿ ಎಲ್ರೂ ಒಟ್ಟಿಗೆ ಉಣ್ಲಿ. ನಾನು ಕಣ್ಣು ಮುಚ್ಚಿದ ಮೇಲೆ ಏನ್ ಬೇಕಾದ್ರೂ ಮಾಡ್ಕಳಿ."
    tr: "Nanna āse ondē. Nānu badukirō tanaka ī mane, ī jamīnu oḍībārdu. Mahadēva gadde nōḍkaḷli. Surēśa, Śōbhā habbakke barli, aṅgaḷadalli ellrū oṭṭige uṇli. Nānu kaṇṇu muccida mēle ēn bēkādrū māḍkaḷi."
    en: "I have only one wish. As long as I'm alive, this house and this land must not be split. Let Mahadeva look after the wet land. Let Suresha and Shobha come for the festivals; let everyone eat together in the yard. Once I've closed my eyes, do whatever you like."
  - who: avva
    t: "ಆದ್ರೆ ಮಹದೇವ, ಒಂದು ಮಾತು ಕೇಳು ಕಣಪ್ಪ. ಶೋಭಾ ನನ್ನ ಮಗಳು. ಅವಳಿಗೆ ‘ಪಾಲಿಲ್ಲ’ ಅನ್ನೋ ಮಾತು ನನ್ನ ಬಾಯಿಂದ ಯಾವತ್ತೂ ಬರಲ್ಲ. ತವರು ಮನೆ ಬಾಗಿಲು ಮಗಳಿಗೆ ಮುಚ್ಚಿದ್ರೆ ಆ ಮನೆಗೆ ಏಳ್ಗೆ ಇಲ್ಲ ಅಂತ ನಮ್ಮವ್ವ ಹೇಳ್ತಿದ್ಲು."
    tr: "Ādre Mahadēva, ondu mātu kēḷu kaṇappa. Śōbhā nanna magaḷu. Avaḷige ‘pālilla’ annō mātu nanna bāyinda yāvattū baralla. Tavaru mane bāgilu magaḷige muccidre ā manege ēḷge illa anta nammavva hēḷtidlu."
    en: "But Mahadeva, hear one thing, my son. Shobha is my daughter. The words 'you have no share' will never come out of my mouth. My own mother used to say: if a house shuts its door on its daughter, that house will never prosper."
  - who: mahadeva
    t: "ಅವ್ವ, ನೀನೂ…?"
    tr: "Avva, nīnū…?"
    en: "Avva, you too…?"
  - who: avva
    t: "ನಾನು ಯಾರ ಕಡೇನೂ ಅಲ್ಲ ಕಣಪ್ಪ. ನಾನು ಈ ಮನೆ ಕಡೆ."
    tr: "Nānu yāra kaḍēnū alla kaṇappa. Nānu ī mane kaḍe."
    en: "I'm on nobody's side, son. I'm on this house's side."
  - who: elder
    t: "ಸರಿ. ನಾವು ಮೂರು ಜನ ಹಿರಿಯರು ಮಾತಾಡ್ಕಂಡಿದೀವಿ. ನಮ್ ಮಾತು ಇದು. ಒಂದು: ಪಹಣಿಯಲ್ಲಿ ನಾಲ್ಕೂ ಹೆಸರು ಇರ್ಲಿ, ಯಾರೂ ಯಾರ ಹೆಸರೂ ತೆಗೆಸೋ ಪ್ರಯತ್ನ ಮಾಡಬಾರ್ದು. ಎರಡು: ಚನ್ನೇಗೌಡನ ವರ್ಷದ ತಿಥಿ ತನಕ — ಈ ಡಿಸೆಂಬರ್ ತನಕ — ಮಹದೇವನೇ ಬೇಸಾಯ ಮಾಡ್ಲಿ. ಕಬ್ಬಿನ ದುಡ್ಡು ಬಂದಾಗ ಸಾಲ ಕಟ್ಟಿ, ಉಳಿದಿದ್ರಲ್ಲಿ ಒಂದು ಭಾಗ ಅವ್ವನ ಕೈಗೆ ಕೊಡ್ಲಿ. ಮೂರು: ತಿಥಿ ಆದ ಮೇಲೆ ಮತ್ತೆ ಇದೇ ಕಟ್ಟೆ ಮೇಲೆ ಕುಂತು ಪಾಲು ತೀರ್ಮಾನ ಮಾಡೋಣ."
    tr: "Sari. Nāvu mūru jana hiriyaru mātāḍkaṇḍidīvi. Nam mātu idu. Ondu: pahaṇiyalli nālkū hesaru irli, yārū yāra hesarū tegesō prayatna māḍabārdu. Eraḍu: Cannēgauḍana varṣada tithi tanaka — ī Ḍisembar tanaka — Mahadēvanē bēsāya māḍli. Kabbina duḍḍu bandāga sāla kaṭṭi, uḷididralli ondu bhāga avvana kaige koḍli. Mūru: tithi āda mēle matte idē kaṭṭe mēle kuntu pālu tīrmāna māḍōṇa."
    en: "All right. We three elders have talked it over. Here is our word. One: let all four names stay in the RTC, and let nobody try to have anybody's name removed. Two: until Channegowda's first-year rite — until this December — let Mahadeva go on farming. When the cane money comes, let him repay the loan and hand a portion of what's left to Avva. Three: after the rite, we'll sit again on this same platform and decide the shares."
  - who: suresh
    t: "ನನಗೆ ಒಪ್ಪಿಗೆ ಇದೆ, ತಿಮ್ಮೇಗೌಡ್ರೇ."
    tr: "Nanage oppige ide, Timmēgauḍrē."
    en: "I agree, Thimmegowda."
  - who: mahadeva
    t: "ಮೊದಲ ಎರಡು ಮಾತಿಗೆ ಒಪ್ತೀನಿ. ಮೂರನೇದಕ್ಕೆ… ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಕುಂತಾಗ್ಲೂ ನನ್ ಮಾತು ಇದೇ ಆಗಿರುತ್ತೆ: ಗದ್ದೆ ಒಡೆಯಲ್ಲ."
    tr: "Modala eraḍu mātige optīni. Mūranēdakke… Ḍisembar-nalli kuntāglū nan mātu idē āgirutte: gadde oḍeyalla."
    en: "I accept the first two. As for the third… even when we sit in December, my answer will be the same: the wet land will not be split."
  - who: shobha
    t: "ಹಂಗಾದ್ರೆ ಡಿಸೆಂಬರ್ ತನಕ ಕಾಯೋದು ಯಾಕೆ, ತಿಮ್ಮೇಗೌಡ್ರೇ? ಹದಿನಾರು ವರ್ಷದಿಂದ ‘ಮುಂದಿನ ವರ್ಷ ನೋಡೋಣ’ ಅಂತಾನೇ ಕೇಳ್ತಾ ಬಂದಿದೀನಿ. ಇವತ್ತೂ ಅದೇ ಮಾತು. ಕೊನೆಗೆ ಉತ್ತರ ‘ಇಲ್ಲ’ ಅಂತ ಮೊದ್ಲೇ ಗೊತ್ತಿದ್ರೆ ಕಾಯೋದ್ರಲ್ಲಿ ಅರ್ಥ ಇಲ್ಲ."
    tr: "Haṅgādre Ḍisembar tanaka kāyōdu yāke, Timmēgauḍrē? Hadināru varṣadinda ‘mundina varṣa nōḍōṇa’ antānē kēḷtā bandidīni. Ivattū adē mātu. Konege uttara ‘illa’ anta modlē gottidre kāyōdralli artha illa."
    en: "Then why wait till December, Thimmegowda? For sixteen years I've heard nothing but 'we'll see next year'. Tonight it's the same words again. If we already know the answer at the end will be 'no', there's no sense in waiting."
  - who: elder
    t: "ಶೋಭಾ, ತಾಳ್ಮೆ ಕಳ್ಕೋಬೇಡವ್ವ. ಹಿರಿಯರ ಮಾತು ಕೇಳು."
    tr: "Śōbhā, tāḷme kaḷkōbēḍavva. Hiriyara mātu kēḷu."
    en: "Shobha, don't lose your patience, my girl. Listen to your elders."
  - who: shobha
    t: "ನಿಮ್ಮ ಮೇಲೆ ನನಗೆ ಪೂರ್ತಿ ಗೌರವ ಇದೆ. ಆದ್ರೆ ತಾಳ್ಮೆ ಯಾವಾಗ್ಲೂ ಹೆಣ್ಣುಮಕ್ಕಳಿಂದಾನೇ ಯಾಕೆ ಕೇಳ್ತೀರಿ? ಇವತ್ತಿನ ಮಾತಿಗೆ ನನ್ನ ಒಪ್ಪಿಗೆ ಇಲ್ಲ. ತಪ್ಪು ತಿಳ್ಕೋಬೇಡಿ."
    tr: "Nimma mēle nanage pūrti gaurava ide. Ādre tāḷme yāvāglū heṇṇumakkaḷindānē yāke kēḷtīri? Ivattina mātige nanna oppige illa. Tappu tiḷkōbēḍi."
    en: "I have complete respect for you. But why is patience always asked of the women? I don't agree to tonight's terms. Please don't take it the wrong way."
  - who: suresh
    t: "ಮಹದೇವ, ಒಂದು ಹೆಜ್ಜೆ ನೀನೂ ಹಿಂದೆ ಇಡು. ‘ಒಡೆಯಲ್ಲ’ ಅನ್ನೋ ಬದಲು ‘ಯೋಚನೆ ಮಾಡ್ತೀನಿ’ ಅನ್ನು, ಸಾಕು."
    tr: "Mahadēva, ondu hejje nīnū hinde iḍu. ‘Oḍeyalla’ annō badalu ‘yōcane māḍtīni’ annu, sāku."
    en: "Mahadeva, you take a step back too. Instead of 'it won't be split', just say 'I'll think about it' — that's enough."
  - who: mahadeva
    t: "ಸುಳ್ಳು ಹೇಳೋಕೆ ಬರಲ್ಲ ಅಣ್ಣ. ಅಪ್ಪ ಅದನ್ನ ಕಲಿಸ್ಲಿಲ್ಲ."
    tr: "Suḷḷu hēḷōke baralla aṇṇa. Appa adanna kalislilla."
    en: "I don't know how to tell lies, Anna. Appa never taught me that."
  - who: elder
    t: "… ಕೂಡಿ ಬಾಳಿದರೆ ಸ್ವರ್ಗ ಸುಖ ಅಂತಾರೆ. ಇವತ್ತು ಆ ಸ್ವರ್ಗ ಈ ಕಟ್ಟೆ ಮೇಲೆ ಇಳೀಲಿಲ್ಲ. ಪರವಾಗಿಲ್ಲ. ಒಂದೇ ರಾತ್ರೀಲಿ ಹಣ್ಣಾಗೋ ಕಾಯಿ ಯಾವ್ದೂ ಇಲ್ಲ. ಎಲ್ರೂ ಮನೆಗೆ ಹೋಗಿ. ಮಾತು ಮುಗಿದಿಲ್ಲ, ನಿಂತಿದೆ ಅಷ್ಟೇ."
    tr: "… Kūḍi bāḷidare svarga sukha antāre. Ivattu ā svarga ī kaṭṭe mēle iḷīlilla. Paravāgilla. Ondē rātrīli haṇṇāgō kāyi yāvdū illa. Ellrū manege hōgi. Mātu mugidilla, nintide aṣṭē."
    en: "(sighing) … They say living together is heaven's own happiness. Tonight that heaven didn't come down onto this platform. Never mind. No fruit ripens in a single night. Go home, all of you. The talk isn't over; it has only paused."
  - scene: "The crowd breaks up. In the moonlight the family walks back along the cart track. Mahadeva strides ahead alone with a torch. Shobha falls in beside Suresh; Meena and Rakshith follow with Avva."
  - who: rakshith
    t: "ಅಪ್ಪ, ನನಗೊಂದು ಅರ್ಥ ಆಗ್ಲಿಲ್ಲ. ಎಲ್ರೂ ತಾತನ್ನ ಪ್ರೀತಿಸ್ತಿದ್ರು, ಎಲ್ರೂ ಅಜ್ಜಿನ ಪ್ರೀತಿಸ್ತಾರೆ. ಆದ್ರೂ ಯಾಕೆ ಒಪ್ಪಿಗೆ ಆಗ್ಲಿಲ್ಲ?"
    tr: "Appa, nanagondu artha āglilla. Ellrū tātanna prītistidru, ellrū ajjina prītistāre. Ādrū yāke oppige āglilla?"
    en: "Appa, there's one thing I don't get. Everyone loved Thatha, everyone loves Ajji. So why couldn't they agree?"
  - who: suresh
    t: "ಯಾಕಂದ್ರೆ ಪ್ರೀತಿ ಇದ್ದಲ್ಲಿ ನೋವೂ ಜಾಸ್ತಿ, ಕಂದ. ಅಪರಿಚಿತರ ಜೊತೆ ಜಗಳ ಸುಲಭ — ಮುಗಿಸಿ ಹೊರಟು ಹೋಗ್ಬೋದು. ಸ್ವಂತದವರ ಜೊತೆ ಜಗಳ ಮುಗಿಯಲ್ಲ, ಮನಸ್ಸಲ್ಲೇ ಉಳಿಯುತ್ತೆ."
    tr: "Yākandre prīti iddalli nōvū jāsti, kanda. Aparicitara jote jagaḷa sulabha — mugisi horaṭu hōgbōdu. Svantadavara jote jagaḷa mugiyalla, manassallē uḷiyutte."
    en: "Because where there's love there's more hurt too, son. A quarrel with strangers is easy — you finish it and walk away. A quarrel with your own people never finishes; it stays inside you."
  - who: meena
    t: "ಆದ್ರೆ ಇವತ್ತು ಒಂದು ಒಳ್ಳೇದೂ ಆಯ್ತು. ಹದಿನಾರು ವರ್ಷದಿಂದ ಯಾರೂ ಆಡದ ಮಾತುಗಳು ಹೊರಗೆ ಬಂದ್ವು. ಗಾಯ ತೆರೆದ್ರೇನೇ ಮದ್ದು ಹಚ್ಚೋಕಾಗೋದು."
    tr: "Ādre ivattu ondu oḷḷēdū āytu. Hadināru varṣadinda yārū āḍada mātugaḷu horage bandvu. Gāya teredrēnē maddu haccōkāgōdu."
    en: "But one good thing happened tonight too. Words nobody had spoken for sixteen years came out. Only when a wound is opened can you put medicine on it."
  - who: shobha
    t: "ಅಣ್ಣ, ಇವತ್ತು ನೀನು ಹೇಳಿದ ಆ ಮಾತು… ಹದಿನಾರು ವರ್ಷದ ಹಿಂದಿನದು. ಅದು ನನಗೆ ಯಾವ ಪಾಲಿಗಿಂತಲೂ ದೊಡ್ಡದು."
    tr: "Aṇṇa, ivattu nīnu hēḷida ā mātu… hadināru varṣada hindinadu. Adu nanage yāva pāligintalū doḍḍadu."
    en: "Anna, what you said tonight… about sixteen years ago. That means more to me than any share."
  - who: suresh
    t: "ಅದನ್ನ ಎಷ್ಟೋ ಮುಂಚೆ ಹೇಳ್ಬೇಕಿತ್ತು. … ಮುಂದೇನು ಮಾಡ್ತೀಯ, ಶೋಭಾ?"
    tr: "Adanna eṣṭō mun̄ce hēḷbēkittu. … Mundēnu māḍtīya, Śōbhā?"
    en: "I should have said it long ago. … What will you do next, Shobha?"
  - who: shobha
    t: "ಒಂದು ತಿಂಗಳು ಕಾಯ್ತೀನಿ. ಮಹದೇವ ತಾನಾಗೇ ಒಂದು ಹೆಜ್ಜೆ ಮುಂದೆ ಬಂದ್ರೆ ನಾನು ಎರಡು ಹೆಜ್ಜೆ ಬರ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ… ಮೈಸೂರಲ್ಲಿ ನನ್ನ ಸಹೋದ್ಯೋಗಿಯ ಅಣ್ಣ ವಕೀಲರು. ಅವರು ಮದ್ದೂರಿನ ಒಬ್ಬ ವಕೀಲರ ಹೆಸರು ಹೇಳಿದಾರೆ."
    tr: "Ondu tiṅgaḷu kāytīni. Mahadēva tānāgē ondu hejje munde bandre nānu eraḍu hejje bartīni. Illāndre… Maisūralli nanna sahōdyōgiya aṇṇa vakīlaru. Avaru Maddūrina obba vakīlara hesaru hēḷidāre."
    en: "I'll wait one month. If Mahadeva takes one step forward on his own, I'll take two. If not… a colleague of mine in Mysuru has a brother who's a lawyer. He's given me the name of a lawyer in Maddur."
  - who: avva
    t: "ವಕೀಲ… ಅಯ್ಯೋ ದೇವ್ರೇ. ಯಜಮಾನ್ರೇ, ಮೇಲಿಂದ ನೋಡ್ತಾ ಇದೀರಾ?"
    tr: "Vakīla… ayyō dēvrē. Yajamānrē, mēlinda nōḍtā idīrā?"
    en: "(behind them, catching the last words) A lawyer… oh God. Are you watching this from up there, my husband?"

  - chapter: "Chapter 5 — The broker"
  - section: "The white car"
    learn: "a broker's pitch: pārṭi, rēṭ, ekarege, oṭṭu, muṅgaḍa, oppanda · conversion: bhū parivartane, kṛṣiyētara upayōga, ādaṅgē · who may buy since 2020: sekṣan-gaḷannē tegeduhāktu, hiḍuvaḷi miti, darakhāstu jamīnu · refusing a cash deal: mārgasūci bele, kappu haṇa, ellrū māḍtāre anda takṣaṇa sari āgalla · polite dismissal: ā kāgada oḷage iṭkō"
  - scene: "Saturday, 21 March 2026, two days after Ugadi — a quiet one, since the house is still in its year of mourning. Late morning. Suresh, Meena and Rakshith have come to spend the weekend with Avva; Mahadeva has gone to the canal to water the cane. A white SUV stops at the gate. A man in his forties in a crisp shirt, with two phones and a gold chain, gets out carrying a bag of fruit."
  - who: broker
    t: "ನಮಸ್ಕಾರ ಸಾರ್, ನಮಸ್ಕಾರ ಅಮ್ಮಾವ್ರೇ. ನಾನು ಮಂಜುನಾಥ್, ಮದ್ದೂರು — ‘ಶ್ರೀ ಲಕ್ಷ್ಮಿ ಲ್ಯಾಂಡ್ ಡೆವಲಪರ್ಸ್’. ಗೌಡ್ರು ತೀರಿಕೊಂಡ್ರು ಅಂತ ಕೇಳಿ ತುಂಬಾ ಬೇಜಾರಾಯ್ತು. ದುಃಖದ ಮನೆಗೆ ಸಿಹಿ ತರಬಾರದು ಅಂತ ಸ್ವಲ್ಪ ಹಣ್ಣು ತಂದಿದೀನಿ."
    tr: "Namaskāra sār, namaskāra ammāvrē. Nānu Man̄junāth, Maddūru — ‘Śrī Lakṣmi Lyāṇḍ Ḍevalapars’. Gauḍru tīrikoṇḍru anta kēḷi tumbā bējārāytu. Duḥkhada manege sihi tarabāradu anta svalpa haṇṇu tandidīni."
    en: "Namaskara, sir; namaskara, Amma. I'm Manjunath, from Maddur — 'Sri Lakshmi Land Developers'. I was very sorry to hear Gowdru had passed away. You shouldn't bring sweets to a house in mourning, so I've brought a little fruit."
  - who: suresh
    t: "ನಮಸ್ಕಾರ. ಕೂತ್ಕೊಳ್ಳಿ. ಏನು ವಿಷಯ ಅಂತ ಗೊತ್ತಾಗ್ಲಿಲ್ಲ."
    tr: "Namaskāra. Kūtkoḷḷi. Ēnu viṣaya anta gottāglilla."
    en: "Namaskara. Please sit. I'm not sure what this is about."
  - who: broker
    t: "ನೇರವಾಗೇ ಹೇಳ್ತೀನಿ ಸಾರ್, ನಿಮ್ಮ ಟೈಮ್ ವೇಸ್ಟ್ ಮಾಡಲ್ಲ. ನವೆಂಬರ್‌ನಲ್ಲಿ ಗೌಡ್ರನ್ನ ಒಂದ್ಸಲ ಭೇಟಿ ಮಾಡಿದ್ದೆ. ಅವರು ‘ನಾನು ಬದುಕಿರೋ ತನಕ ಮಾರಲ್ಲ’ ಅಂದ್ರು. ಅವರ ಮಾತಿಗೆ ಗೌರವ ಕೊಟ್ಟು ವಾಪಸ್ ಹೋದೆ. ಈಗ ಪರಿಸ್ಥಿತಿ ಬೇರೆ. ಜಮೀನು ನಾಲ್ಕು ಜನ ವಾರಸುದಾರರ ಹೆಸರಿಗೆ ಬಂದಿದೆ ಅಂತ ಕೇಳ್ದೆ."
    tr: "Nēravāgē hēḷtīni sār, nimma ṭaim vēsṭ māḍalla. Navembar-nalli Gauḍranna ondsala bhēṭi māḍidde. Avaru ‘nānu badukirō tanaka māralla’ andru. Avara mātige gaurava koṭṭu vāpas hōde. Īga paristhiti bēre. Jamīnu nālku jana vārasudārara hesarige bandide anta kēḷde."
    en: "I'll come straight to the point, sir; I won't waste your time. In November I met Gowdru once. He said, 'As long as I'm alive, I won't sell.' I respected his word and went back. Now the situation is different. I heard the land has come into the names of four heirs."
  - who: meena
    t: "ಊರಲ್ಲಿ ಸುದ್ದಿ ಬೇಗ ಓಡಾಡುತ್ತೆ."
    tr: "Ūralli suddi bēga ōḍāḍutte."
    en: "News travels fast in a village."
  - who: broker
    t: "ನಮ್ಮ ಕೆಲಸವೇ ಅದು ಮೇಡಂ — ಸುದ್ದಿ ಮೊದ್ಲು ಕೇಳೋದು. ನೋಡಿ ಸಾರ್, ನಿಮ್ಮ ಗದ್ದೆ ಎಕ್ಸ್‌ಪ್ರೆಸ್‌ವೇ ಸರ್ವಿಸ್ ರೋಡಿಂದ ಬರೀ ಒಂದೂವರೆ ಕಿಲೋಮೀಟರ್. ನನ್ನ ಪಾರ್ಟಿ ಬೆಂಗಳೂರಿನ ಒಂದು ಕಂಪನಿ — ‘ಫಾರ್ಮ್ ಪ್ಲಾಟ್’ ಮಾಡ್ತಾರೆ. ಐಟಿ ಜನ ವೀಕೆಂಡ್‌ಗೆ ಬಂದು ತೆಂಗು, ಮಾವು ಬೆಳೆಸ್ತಾರೆ, ಸಣ್ಣ ಫಾರ್ಮ್‌ಹೌಸ್ ಕಟ್ಕೋತಾರೆ."
    tr: "Namma kelasavē adu mēḍam — suddi modlu kēḷōdu. Nōḍi sār, nimma gadde eksprēs-vē sarvis rōḍinda barī ondūvare kilōmīṭar. Nanna pārṭi Beṅgaḷūrina ondu kampani — ‘phārm plāṭ’ māḍtāre. Aiṭi jana vīkeṇḍ-ge bandu teṅgu, māvu beḷestāre, saṇṇa phārm-haus kaṭkōtāre."
    en: "That's our job, madam — hearing the news first. Look, sir: your wet land is just a kilometre and a half from the expressway service road. My party is a Bengaluru company — they do 'farm plots'. IT people come at weekends, grow coconut and mango, and build themselves a small farmhouse."
  - who: suresh
    t: "ರೇಟ್ ಎಷ್ಟು ಅಂತ ಹೇಳ್ತಿದಾರೆ?"
    tr: "Rēṭ eṣṭu anta hēḷtidāre?"
    en: "What rate are they talking about?"
  - who: broker
    t: "ಗದ್ದೆಗೆ ಎಕರೆಗೆ ಐವತ್ತೈದು ಲಕ್ಷ. ಒಣ ಹೊಲಕ್ಕೆ ಎಕರೆಗೆ ನಲವತ್ತು. ಒಟ್ಟು ಎರಡು ಕೋಟಿ ತೊಂಬತ್ತೆರಡೂವರೆ ಲಕ್ಷ ಸಾರ್. ಮದ್ದೂರು ತಾಲೂಕಿನ ಒಳಗಿನ ಹಳ್ಳಿಗಳಲ್ಲಿ ಇದು ತುಂಬಾ ಒಳ್ಳೆ ರೇಟ್. ಬೇಕಾದ್ರೆ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ನೋಡಿ — ನಲವತ್ತರಿಂದ ಎಪ್ಪತ್ತೈದು ಲಕ್ಷದ ತನಕ ಕೇಳ್ತಾರೆ, ಕೊಡೋರು ಕಡಿಮೆ."
    tr: "Gaddege ekarege aivattaidu lakṣa. Oṇa holakke ekarege nalavattu. Oṭṭu eraḍu kōṭi tombatteraḍūvare lakṣa sār. Maddūru tālūkina oḷagina haḷḷigaḷalli idu tumbā oḷḷe rēṭ. Bēkādre ānlain-nalli nōḍi — nalavattarinda eppattaidu lakṣada tanaka kēḷtāre, koḍōru kaḍime."
    en: "For the wet land, fifty-five lakh an acre. For the dry field, forty an acre. Altogether two crore ninety-two and a half lakh, sir. For interior villages in Maddur taluk that's a very good rate. Look online if you like — people ask anywhere from forty to seventy-five lakh, but few actually pay it."
  - who: rakshith
    t: "ಎರಡು ಕೋಟಿ ತೊಂಬತ್ತು…! ಅಪ್ಪ!"
    tr: "Eraḍu kōṭi tombattu…! Appa!"
    en: "Two crore ninety…! Appa!"
  - who: meena
    t: "ಆ ಕಂಪನಿಯ ಹೆಸರೇನು? ಅವರ ದಾಖಲೆಗಳನ್ನ ನೋಡಬಹುದಾ?"
    tr: "Ā kampaniya hesarēnu? Avara dākhalegaḷanna nōḍabahudā?"
    en: "What's the company's name? Can we see their documents?"
  - who: broker
    t: "ಒಪ್ಪಂದದ ದಿನ ಎಲ್ಲಾ ತೋರಿಸ್ತೀನಿ ಮೇಡಂ. ಈಗ ಪಾರ್ಟಿ ಹೆಸರು ಹೇಳೋ ಹಾಗಿಲ್ಲ — ಬಿಸಿನೆಸ್ ಸೀಕ್ರೆಟ್. … ಇನ್ನೂ ಕೇಳಿ, ತಮ್ಮ. ಭೂ ಪರಿವರ್ತನೆ ಆದ್ರೆ — ಅಂದ್ರೆ ಕೃಷಿ ಜಮೀನನ್ನ ಕೃಷಿಯೇತರ ಉಪಯೋಗಕ್ಕೆ ಡಿಸಿ ಕನ್ವರ್ಷನ್ ಮಾಡಿಸಿದ್ರೆ — ಎಕರೆಗೆ ಒಂದು ಕೋಟಿ ಇಪ್ಪತ್ತು ಲಕ್ಷದವರೆಗೂ ಹೋಗುತ್ತೆ. ಈಗ ಕನ್ವರ್ಷನ್ ಸುಲಭ. ಕಾನೂನು ಬದಲಾಗಿದೆ — ಡಿಸಿ ಮೂವತ್ತು ದಿನದೊಳಗೆ ತೀರ್ಮಾನ ಮಾಡ್ದಿದ್ರೆ ಆದಂಗೇ ಅಂತ."
    tr: "Oppandada dina ellā tōristīni mēḍam. Īga pārṭi hesaru hēḷō hāgilla — bisines sīkreṭ. … Innū kēḷi, tamma. Bhū parivartane ādre — andre kṛṣi jamīnanna kṛṣiyētara upayōgakke Ḍi-si kanvarṣan māḍisidre — ekarege ondu kōṭi ippattu lakṣadavaregū hōgutte. Īga kanvarṣan sulabha. Kānūnu badalāgide — Ḍi-si mūvattu dinadoḷage tīrmāna māḍdidre ādaṅgē anta."
    en: "I'll show you everything on the day of the agreement, madam. I can't give the party's name just now — business secret. … And hear this, young man. With land conversion — that is, if you get the farmland converted by the DC for non-agricultural use — it goes up to one crore twenty lakh an acre. Conversion's easy now. The law has changed: if the DC doesn't decide within thirty days, it's as good as done."
  - who: suresh
    t: "‘ಆದಂಗೇ’ ಅಂದ್ರೆ? ನಾನು ಬ್ಯಾಂಕಲ್ಲಿ ಇಂಥ ಫೈಲ್ ನೋಡಿದೀನಿ, ಮಂಜುನಾಥ್. ಶುಲ್ಕ ಕಟ್ಟಿ ಪ್ರಮಾಣ ಪತ್ರ ಕೊಡ್ಬೇಕು, ಮಾಸ್ಟರ್ ಪ್ಲಾನ್‌ನಲ್ಲಿ ಆ ಜಾಗ ಯಾವ ವಲಯದಲ್ಲಿದೆ ಅನ್ನೋದು ಹೊಂದಬೇಕು. ಹೊಸ ನಿಯಮಗಳು ಇನ್ನೂ ಬದಲಾಗ್ತಾನೇ ಇವೆ. ಅಷ್ಟು ಸುಲಭ ಅಲ್ಲ."
    tr: "‘Ādaṅgē’ andre? Nānu byāṅkalli intha phail nōḍidīni, Man̄junāth. Śulka kaṭṭi pramāṇa patra koḍbēku, māsṭar plān-nalli ā jāga yāva valayadallide annōdu hondabēku. Hosa niyamagaḷu innū badalāgtānē ive. Aṣṭu sulabha alla."
    en: "What do you mean, 'as good as done'? I've seen files like this at the bank, Manjunath. You have to pay the fee and give an affidavit, and the zone the land falls in on the master plan has to match. The new rules are still changing. It's not that simple."
  - who: broker
    t: "ಬ್ಯಾಂಕ್ ಸಾರ್ ಅಂದ್ರೆ ಬ್ಯಾಂಕ್ ಸಾರೇ! ಸರಿ ಸಾರ್, ಅದೆಲ್ಲಾ ನಮ್ ಪಾರ್ಟಿ ನೋಡ್ಕೋತಾರೆ. ನಿಮಗೆ ಯಾವ ತಲೆನೋವೂ ಇಲ್ಲ."
    tr: "Byāṅk sār andre byāṅk sārē! Sari sār, adellā nam pārṭi nōḍkōtāre. Nimage yāva talenōvū illa."
    en: "(laughing) A bank man is a bank man! All right, sir — my party will take care of all that. No headache at all for you."
  - who: rakshith
    t: "ಆದ್ರೆ ಅಂಕಲ್, ಬೆಂಗಳೂರಿನ ಐಟಿ ಜನ ಕೃಷಿ ಜಮೀನು ಕೊಳ್ಳಬಹುದಾ? ರೈತರು ಮಾತ್ರ ಕೊಳ್ಳಬೇಕು ಅಂತ ನಿಯಮ ಇರಲಿಲ್ವಾ?"
    tr: "Ādre aṅkal, Beṅgaḷūrina aiṭi jana kṛṣi jamīnu koḷḷabahudā? Raitaru mātra koḷḷabēku anta niyama iralilvā?"
    en: "But uncle, can IT people from Bengaluru buy farmland? Wasn't there a rule that only farmers could buy it?"
  - who: broker
    t: "ಇತ್ತು, ತಮ್ಮ — ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತರ ತನಕ. ಭೂ ಸುಧಾರಣಾ ಕಾಯ್ದೆಯಲ್ಲಿ ಕೃಷಿಯೇತರ ಆದಾಯ ಜಾಸ್ತಿ ಇರೋರು, ಕಂಪನಿಗಳು ಕೊಳ್ಳಬಾರದು ಅಂತ ಸೆಕ್ಷನ್‌ಗಳಿದ್ವು. ಇಪ್ಪತ್ತರಲ್ಲಿ ಸರ್ಕಾರ ಆ ಸೆಕ್ಷನ್‌ಗಳನ್ನೇ ತೆಗೆದುಹಾಕ್ತು. ಈಗ ಯಾರು ಬೇಕಾದ್ರೂ ಕೊಳ್ಳಬಹುದು. ಅದಕ್ಕೇ ನಮ್ ಬಿಸಿನೆಸ್ ಚೆನ್ನಾಗಿ ನಡೀತಿದೆ."
    tr: "Ittu, tamma — eraḍu sāvirada ippattara tanaka. Bhū sudhāraṇā kāydeyalli kṛṣiyētara ādāya jāsti irōru, kampanigaḷu koḷḷabāradu anta sekṣan-gaḷidvu. Ippattaralli sarkāra ā sekṣan-gaḷannē tegeduhāktu. Īga yāru bēkādrū koḷḷabahudu. Adakkē nam bisines cennāgi naḍītide."
    en: "There was, young man — until 2020. The Land Reforms Act had sections saying that people with big non-farm incomes, and companies, couldn't buy. In 2020 the government removed those sections altogether. Now anyone can buy. That's why our business is doing so well."
  - who: suresh
    t: "ಯಾರು ಬೇಕಾದ್ರೂ ಅಲ್ಲ. ಹಿಡುವಳಿ ಮಿತಿ ಇನ್ನೂ ಇದೆ. ಸರ್ಕಾರ ಮಂಜೂರು ಮಾಡಿದ ದರಖಾಸ್ತು ಜಮೀನಿಗೆ ಅನುಮತಿ ಬೇಕು. ವಿದೇಶದಲ್ಲಿರೋ ಎನ್‌ಆರ್‌ಐಗಳು ಕೃಷಿ ಜಮೀನು ಕೊಳ್ಳೋ ಹಾಗಿಲ್ಲ — ಪಿತ್ರಾರ್ಜಿತವಾಗಿ ಬಂದ್ರೆ ಮಾತ್ರ ಇಟ್ಕೋಬಹುದು."
    tr: "Yāru bēkādrū alla. Hiḍuvaḷi miti innū ide. Sarkāra man̄jūru māḍida darakhāstu jamīnige anumati bēku. Vidēśadallirō en-ār-aigaḷu kṛṣi jamīnu koḷḷō hāgilla — pitrārjitavāgi bandre mātra iṭkōbahudu."
    en: "Not anyone. The landholding ceiling still applies. Land granted by the government needs permission. And NRIs living abroad can't buy farmland — they can only keep it if it comes to them by inheritance."
  - who: broker
    t: "ಸರಿ ಸರಿ, ಸಾರ್ ಎಲ್ಲಾ ಓದ್ಕೊಂಡಿದಾರೆ. ಇನ್ನೊಂದು ಮಾತು ಸಾರ್ — ಸ್ವಲ್ಪ ಪ್ರೈವೇಟ್ ಆಗಿ. ರಿಜಿಸ್ಟ್ರೇಷನ್ ಮಾರ್ಗಸೂಚಿ ಬೆಲೆಗೆ ಮಾಡೋಣ, ಉಳಿದಿದ್ದು ಕ್ಯಾಶ್‌ನಲ್ಲಿ. ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ ಉಳಿಯುತ್ತೆ, ತೆರಿಗೆ ಉಳಿಯುತ್ತೆ. ಎಲ್ರೂ ಮಾಡೋದೇ."
    tr: "Sari sari, sār ellā ōdkoṇḍidāre. Innondu mātu sār — svalpa praivēṭ āgi. Rijisṭrēṣan mārgasūci belege māḍōṇa, uḷididdu kyāś-nalli. Sṭyāmp ḍyūṭi uḷiyutte, terige uḷiyutte. Ellrū māḍōdē."
    en: "All right, all right, sir has read up on everything. One more thing, sir — a bit privately. We do the registration at the guidance value and the rest in cash. You save stamp duty, you save tax. Everybody does it."
  - who: rakshith
    t: "ಮಾರ್ಗಸೂಚಿ ಬೆಲೆ ಅಂದ್ರೆ?"
    tr: "Mārgasūci bele andre?"
    en: "What's 'guidance value'?"
  - who: meena
    t: "ಸರ್ಕಾರ ನಿಗದಿ ಮಾಡಿರೋ ಬೆಲೆ. ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ ಅದರ ಮೇಲೆ ಲೆಕ್ಕ ಆಗುತ್ತೆ. ಹಳ್ಳಿಗಳಲ್ಲಿ ಅದು ಮಾರುಕಟ್ಟೆ ಬೆಲೆಗಿಂತ ತುಂಬಾ ಕಡಿಮೆ. ಆ ವ್ಯತ್ಯಾಸ ಕ್ಯಾಶ್‌ನಲ್ಲಿ ಕೈ ಬದಲಾಯಿಸಿದ್ರೆ ಅದೇ ಕಪ್ಪು ಹಣ."
    tr: "Sarkāra nigadi māḍirō bele. Sṭyāmp ḍyūṭi adara mēle lekka āgutte. Haḷḷigaḷalli adu mārukaṭṭe beleginta tumbā kaḍime. Ā vyatyāsa kyāś-nalli kai badalāyisidre adē kappu haṇa."
    en: "The price fixed by the government. Stamp duty is calculated on it. In villages it's far below the market price. If that difference changes hands in cash, that's exactly what black money is."
  - who: suresh
    t: "ಎಲ್ರೂ ಮಾಡ್ತಾರೆ ಅಂದ ತಕ್ಷಣ ಅದು ಸರಿ ಆಗಲ್ಲ. ಇಪ್ಪತ್ತು ವರ್ಷ ಬ್ಯಾಂಕಲ್ಲಿ ಇಂಥದೇ ಕಪ್ಪು ಹಣದ ಕೇಸುಗಳನ್ನ ನೋಡಿದೀನಿ. ಮಾರೋದಾದ್ರೆ — ‘ಆದ್ರೆ’ ಅಂತ ಹೇಳ್ತಿದೀನಿ — ಪೂರ್ತಿ ಬೆಲೆ ಕಾಗದದ ಮೇಲೆ, ಪೂರ್ತಿ ಹಣ ಬ್ಯಾಂಕ್ ಮೂಲಕ."
    tr: "Ellrū māḍtāre anda takṣaṇa adu sari āgalla. Ippattu varṣa byāṅkalli inthadē kappu haṇada kēsugaḷanna nōḍidīni. Mārōdādre — ‘ādre’ anta hēḷtidīni — pūrti bele kāgadada mēle, pūrti haṇa byāṅk mūlaka."
    en: "Just because everybody does it doesn't make it right. For twenty years at the bank I've seen exactly these black-money cases. If we sell — and I'm saying 'if' — it's the full price on paper and the full amount through the bank."
  - who: broker
    t: "ಸರಿ ಸಾರ್, ನಿಮ್ಮಿಷ್ಟ. ಪಾರ್ಟಿ ಅದಕ್ಕೂ ರೆಡಿ, ರೇಟ್ ಸ್ವಲ್ಪ ಕಡಿಮೆ ಆಗಬಹುದು ಅಷ್ಟೇ. ಇವತ್ತು ಎಲ್ಲಾ ವಾರಸುದಾರರು ಒಪ್ಪಂದಕ್ಕೆ ಸಹಿ ಹಾಕಿದ್ರೆ ಐದು ಲಕ್ಷ ಮುಂಗಡ ಸ್ಥಳದಲ್ಲೇ ಕೊಡ್ತೀನಿ."
    tr: "Sari sār, nimmiṣṭa. Pārṭi adakkū reḍi, rēṭ svalpa kaḍime āgabahudu aṣṭē. Ivattu ellā vārasudāraru oppandakke sahi hākidre aidu lakṣa muṅgaḍa sthaḷadallē koḍtīni."
    en: "Fine, sir, as you wish. The party's ready for that too — the rate may come down a little, that's all. If all the heirs sign an agreement today, I'll pay five lakh advance right here on the spot."
  - who: meena
    t: "ಎಲ್ಲಾ ವಾರಸುದಾರರು ಅಂದ್ರೆ ನಾಲ್ಕು ಜನ. ಮಹದೇವ ಇಲ್ಲಿಲ್ಲ, ಶೋಭಾ ಮೈಸೂರಲ್ಲಿದಾರೆ. ಮತ್ತೆ ಅವ್ವ…"
    tr: "Ellā vārasudāraru andre nālku jana. Mahadēva illilla, Śōbhā Maisūrallidāre. Matte avva…"
    en: "All the heirs means four people. Mahadeva isn't here, Shobha is in Mysuru. And then there's Avva…"
  - who: broker
    t: "ಮೈಸೂರಿನೋರ ಕಡೆಯಿಂದ ಸಮಸ್ಯೆ ಇಲ್ಲ ಅನ್ಸುತ್ತೆ ಮೇಡಂ. ಮೊನ್ನೆ ಅವರ ಯಜಮಾನ್ರು ನನಗೆ ಫೋನ್ ಮಾಡಿ ರೇಟ್ ಎಷ್ಟು ಅಂತ ಕೇಳಿದ್ರು."
    tr: "Maisūrinōra kaḍeyinda samasye illa ansutte mēḍam. Monne avara yajamānru nanage phōn māḍi rēṭ eṣṭu anta kēḷidru."
    en: "I don't think there'll be a problem from the Mysuru side, madam. The other day her husband phoned me and asked what the rate was."
  - who: suresh
    t: "ಶೋಭಾಳ ಗಂಡ? ನಿಮಗೆ ಫೋನ್ ಮಾಡಿದ್ರಾ?"
    tr: "Śōbhāḷa gaṇḍa? Nimage phōn māḍidrā?"
    en: "Shobha's husband? He phoned you?"
  - who: broker
    t: "ಬರೀ ರೇಟ್ ಕೇಳಿದ್ರು ಸಾರ್, ಏನೂ ಮಾತು ಕೊಟ್ಟಿಲ್ಲ. ಈಗಿನ ಕಾಲದಲ್ಲಿ ಎಲ್ರೂ ರೇಟ್ ಕೇಳ್ತಾರೆ."
    tr: "Barī rēṭ kēḷidru sār, ēnū mātu koṭṭilla. Īgina kāladalli ellrū rēṭ kēḷtāre."
    en: "He only asked the rate, sir; he didn't promise anything. Everyone asks the rate these days."
  - who: avva
    t: "ಮಂಜುನಾಥ, ಕಣಪ್ಪ. ನವೆಂಬರ್‌ನಲ್ಲಿ ನೀನು ಬಂದಾಗ ನಾನೇ ನಿಂಗೆ ಕಾಫಿ ಕೊಟ್ಟಿದ್ದೆ. ನನ್ ಯಜಮಾನ್ರು ಏನಂದ್ರು ನೆನಪಿದೆಯಾ?"
    tr: "Man̄junātha, kaṇappa. Navembar-nalli nīnu bandāga nānē niṅge kāphi koṭṭidde. Nan yajamānru ēnandru nenapideyā?"
    en: "(from the doorway, where she has been listening) Manjunatha, son. When you came in November, it was I who gave you coffee. Do you remember what my husband said?"
  - who: broker
    t: "ನೆನಪಿದೆ ಅಮ್ಮಾವ್ರೇ. ‘ಈ ಮಣ್ಣು ನನ್ನ ಅಪ್ಪನ ಬೆವರು’ ಅಂದ್ರು."
    tr: "Nenapide ammāvrē. ‘Ī maṇṇu nanna appana bevaru’ andru."
    en: "I remember, Amma. He said, 'This soil is my father's sweat.'"
  - who: avva
    t: "ಹಂಗಾದ್ರೆ ಅದೇ ಮಾತು ಇವತ್ತೂ ಈ ಮನೆಯ ಮಾತು. ಹಣ್ಣು ತಂದಿದೀಯ, ತಗಂಡು ಹೋಗು ಅನ್ನಲ್ಲ. ಆದ್ರೆ ಆ ಕಾಗದ ಒಳಗೆ ಇಟ್ಕೋ."
    tr: "Haṅgādre adē mātu ivattū ī maneya mātu. Haṇṇu tandidīya, tagaṇḍu hōgu annalla. Ādre ā kāgada oḷage iṭkō."
    en: "Then those same words are this house's words today too. You've brought fruit; I won't tell you to take it back. But put that paper away."
  - who: broker
    t: "ಸರಿ ಅಮ್ಮಾವ್ರೇ. ಸಾರ್, ನನ್ ಕಾರ್ಡ್ ಇಟ್ಕೊಳ್ಳಿ. ಒಂದೇ ಮಾತು: ಇಂಥ ರೇಟ್ ಯಾವಾಗ್ಲೂ ಇರಲ್ಲ. ಮತ್ತೆ ಜಮೀನಿನ ಮೇಲೆ ಕೋರ್ಟ್ ಕೇಸ್ ಏನಾದ್ರೂ ಬಿದ್ರೆ ಯಾವ ಪಾರ್ಟಿನೂ ಮುಟ್ಟಲ್ಲ. ವಿವಾದದ ಜಮೀನು ಅಂದ್ರೆ ಬೆಲೆ ಅರ್ಧ. ಯೋಚನೆ ಮಾಡಿ."
    tr: "Sari ammāvrē. Sār, nan kārḍ iṭkoḷḷi. Ondē mātu: intha rēṭ yāvāglū iralla. Matte jamīnina mēle kōrṭ kēs ēnādrū bidre yāva pārṭinū muṭṭalla. Vivādada jamīnu andre bele ardha. Yōcane māḍi."
    en: "(standing up) All right, Amma. Sir, keep my card. Just one thing: a rate like this won't last for ever. And if a court case lands on the land, no party will touch it. Disputed land means half the price. Think it over."

  - section: "Meena's numbers"
    learn: "calculating aloud: -dante (at … each), oṭṭu, sumārāgi, śēkaḍa ēḷu baḍḍi, ṭhēvaṇi, varṣakke · conditionals: iṭre … barutte, uḷidre heccu · the numbers not on paper: baṇḍavāḷa lābhada terige, gurutu · confessing temptation: manassu allāḍtu · a teenager weighing both sides: eraḍū sari ansutte"
  - scene: "That night, on the flat roof of the house. A mat, a steel tumbler of buttermilk each, a school notebook. Avva has gone to sleep. Meena writes figures by the light of her phone."
  - who: meena
    t: "ಸರಿ, ಭಾವನೆ ಒಂದು ಕ್ಷಣ ಪಕ್ಕಕ್ಕಿಡೋಣ, ಲೆಕ್ಕ ನೋಡೋಣ. ಮೂರೂವರೆ ಎಕರೆ ಗದ್ದೆ, ಐವತ್ತೈದು ಲಕ್ಷದಂತೆ — ಒಂದು ಕೋಟಿ ತೊಂಬತ್ತೆರಡೂವರೆ ಲಕ್ಷ. ಎರಡೂವರೆ ಎಕರೆ ಹೊಲ, ನಲವತ್ತು ಲಕ್ಷದಂತೆ — ಒಂದು ಕೋಟಿ. ಒಟ್ಟು ಎರಡು ಕೋಟಿ ತೊಂಬತ್ತೆರಡೂವರೆ ಲಕ್ಷ."
    tr: "Sari, bhāvane ondu kṣaṇa pakkakkiḍōṇa, lekka nōḍōṇa. Mūrūvare ekare gadde, aivattaidu lakṣadante — ondu kōṭi tombatteraḍūvare lakṣa. Eraḍūvare ekare hola, nalavattu lakṣadante — ondu kōṭi. Oṭṭu eraḍu kōṭi tombatteraḍūvare lakṣa."
    en: "Right — let's set feelings aside for a moment and look at the numbers. Three and a half acres of wet land at fifty-five lakh each — one crore ninety-two and a half lakh. Two and a half acres of dry field at forty lakh each — one crore. Total: two crore ninety-two and a half lakh."
  - who: suresh
    t: "ಬೇಜಾರಿನ ವಿಷಯ ಅಂದ್ರೆ, ಆ ಸಂಖ್ಯೆ ಕೇಳಿದಾಗ ನನಗೂ ಒಂದು ಕ್ಷಣ ಮನಸ್ಸು ಅಲ್ಲಾಡ್ತು, ಮೀನಾ. ಮನೆ ಸಾಲದ ಇಎಂಐ, ಮುಂದಿನ ವರ್ಷ ರಕ್ಷಿತ್‌ನ ಕಾಲೇಜು ಫೀಸು… ಎಲ್ಲಾ ಕಣ್ಣ ಮುಂದೆ ಬಂತು."
    tr: "Bējārina viṣaya andre, ā saṅkhye kēḷidāga nanagū ondu kṣaṇa manassu allāḍtu, Mīnā. Mane sālada i-em-ai, mundina varṣa Rakṣit-na kālēju phīsu… ellā kaṇṇa munde bantu."
    en: "The sad part is, when I heard that number my mind wavered for a moment too, Meena. The home-loan EMI, Rakshith's college fees next year… it all flashed before my eyes."
  - who: meena
    t: "ಅದು ಸಹಜ. ಮುಂದೆ ಕೇಳಿ. ಸುಮಾರಾಗಿ ನಾಲ್ಕು ಸಮ ಪಾಲು ಮಾಡಿದ್ರೆ ಒಬ್ಬೊಬ್ಬರಿಗೆ ಎಪ್ಪತ್ಮೂರು ಲಕ್ಷ. ಅದನ್ನ ಶೇಕಡ ಏಳು ಬಡ್ಡಿಗೆ ಠೇವಣಿ ಇಟ್ರೆ ವರ್ಷಕ್ಕೆ ಐದು ಲಕ್ಷ ಬಡ್ಡಿ ಬರುತ್ತೆ — ತೆರಿಗೆಗೆ ಮುಂಚೆ."
    tr: "Adu sahaja. Munde kēḷi. Sumārāgi nālku sama pālu māḍidre obbobbarige eppatmūru lakṣa. Adanna śēkaḍa ēḷu baḍḍige ṭhēvaṇi iṭre varṣakke aidu lakṣa baḍḍi barutte — terigege mun̄ce."
    en: "That's natural. Listen to the rest. Roughly, with four equal shares, each gets seventy-three lakh. Put that in a fixed deposit at seven percent and it earns five lakh a year in interest — before tax."
  - who: meena
    t: "ಈಗ ಜಮೀನಿನ ಆದಾಯ. ಮಹದೇವ ಹೇಳಿದ್ದು ನೆನಪಿದೆ — ಎಕರೆಗೆ ನಲವತ್ತು ಟನ್ ಕಬ್ಬು ಬಂದ್ರೆ ಒಳ್ಳೆ ವರ್ಷ. ಗೊಬ್ಬರ, ಕೂಲಿ, ಕಟಾವು, ಸಾಗಣೆ ಕಳೆದ್ರೆ ಆರು ಎಕರೆಯಿಂದ ಇಡೀ ಮನೆಗೆ ವರ್ಷಕ್ಕೆ ಎರಡು-ಎರಡೂವರೆ ಲಕ್ಷ ಉಳಿದ್ರೆ ಹೆಚ್ಚು. ಅದೂ ಕಾರ್ಖಾನೆ ಸಮಯಕ್ಕೆ ದುಡ್ಡು ಕೊಟ್ರೆ."
    tr: "Īga jamīnina ādāya. Mahadēva hēḷiddu nenapide — ekarege nalavattu ṭan kabbu bandre oḷḷe varṣa. Gobbara, kūli, kaṭāvu, sāgaṇe kaḷedre āru ekareyinda iḍī manege varṣakke eraḍu-eraḍūvare lakṣa uḷidre heccu. Adū kārkhāne samayakke duḍḍu koṭre."
    en: "Now the land's income. I remember what Mahadeva said — forty tonnes of cane an acre is a good year. After fertiliser, labour, harvesting and transport, if six acres leave the whole household two or two and a half lakh a year, that's a lot. And that's only if the factory pays on time."
  - who: rakshith
    t: "ಅಂದ್ರೆ… ಮಾರಿದ್ರೆ ಒಬ್ಬರ ಪಾಲಿನ ಬಡ್ಡಿಯೇ ಇಡೀ ಜಮೀನಿನ ಆದಾಯಕ್ಕಿಂತ ಜಾಸ್ತಿ! ಚಿಕ್ಕಪ್ಪ ಇಷ್ಟು ಕಷ್ಟಪಡೋ ಅವಶ್ಯಕತೆನೇ ಇರಲ್ಲ."
    tr: "Andre… māridre obbara pālina baḍḍiyē iḍī jamīnina ādāyakkinta jāsti! Cikkappa iṣṭu kaṣṭapaḍō avaśyakatenē iralla."
    en: "So… if we sell, the interest on just one person's share is more than the income from the whole land! Chikkappa wouldn't need to slave like this at all."
  - who: meena
    t: "ಕಾಗದದ ಮೇಲೆ ಹಾಗೆ ಕಾಣುತ್ತೆ. ಈಗ ಕಾಗದದಲ್ಲಿ ಇಲ್ಲದ ಸಂಖ್ಯೆಗಳು. ಒಂದು: ಕಳೆದ ಹತ್ತು ವರ್ಷದಲ್ಲಿ ಈ ಕಡೆ ಜಮೀನಿನ ಬೆಲೆ ಬಡ್ಡಿಗಿಂತ ವೇಗವಾಗಿ ಏರಿದೆ. ಎರಡು: ಮದ್ದೂರು ಪಟ್ಟಣದಿಂದ ಎಷ್ಟು ದೂರ ಅನ್ನೋದರ ಮೇಲೆ ಕೃಷಿ ಜಮೀನು ಮಾರಿದ್ರೂ ಬಂಡವಾಳ ಲಾಭದ ತೆರಿಗೆ ಬರಬಹುದು — ಅದನ್ನ ಆಡಿಟರ್ ಹತ್ರ ಕೇಳ್ಬೇಕು. ಮೂರು: ಹಣ ಕೈಗೆ ಬಂದ ಮೇಲೆ ಉಳಿಸೋದು ಕಷ್ಟ. ಸಂಬಂಧಿಕರು, ಸಾಲ ಕೇಳೋರು, ಹೊಸ ಕಾರು…"
    tr: "Kāgadada mēle hāge kāṇutte. Īga kāgadadalli illada saṅkhyegaḷu. Ondu: kaḷeda hattu varṣadalli ī kaḍe jamīnina bele baḍḍiginta vēgavāgi ēride. Eraḍu: Maddūru paṭṭaṇadinda eṣṭu dūra annōdara mēle kṛṣi jamīnu māridrū baṇḍavāḷa lābhada terige barabahudu — adanna āḍiṭar hatra kēḷbēku. Mūru: haṇa kaige banda mēle uḷisōdu kaṣṭa. Sambandhikaru, sāla kēḷōru, hosa kāru…"
    en: "On paper it looks that way. Now the numbers that aren't on paper. One: over the last ten years, land prices round here have risen faster than interest. Two: depending on how far it is from Maddur town, even selling farmland may attract capital gains tax — we'd have to ask an auditor. Three: once money is in your hand, it's hard to hold on to. Relatives, people asking for loans, a new car…"
  - who: meena
    t: "ನಾಲ್ಕನೇದು, ಎಲ್ಲಕ್ಕಿಂತ ದೊಡ್ಡದು: ಮಹದೇವ. ನಲವತ್ತು ವರ್ಷದ ರೈತ. ಎಪ್ಪತ್ಮೂರು ಲಕ್ಷ ಕೈಗೆ ಬಂದ್ರೆ ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಎದ್ದು ಏನು ಮಾಡ್ತಾನೆ? ಅವನ ಕೆಲಸ, ಅವನ ಗುರುತು, ಅವನ ದನಗಳು — ಇದಕ್ಕೆಲ್ಲಾ ಬಡ್ಡಿ ದರ ಇಲ್ಲ."
    tr: "Nālkanēdu, ellakkinta doḍḍadu: Mahadēva. Nalavattu varṣada raita. Eppatmūru lakṣa kaige bandre nāḷe beḷigge aidakke eddu ēnu māḍtāne? Avana kelasa, avana gurutu, avana danagaḷu — idakkellā baḍḍi dara illa."
    en: "The fourth, and the biggest: Mahadeva. A forty-year-old farmer. If seventy-three lakh lands in his hands, what does he do when he gets up at five tomorrow morning? His work, his identity, his cattle — none of these has an interest rate."
  - who: suresh
    t: "ಮತ್ತೆ ಅವ್ವ. ಜಮೀನು ಹೋದ್ರೆ ಅವ್ವ ಎಲ್ಲಿರ್ತಾಳೆ? ನಮ್ಮ ಜೊತೆ ಬೆಂಗಳೂರಿಗಾ? ಅಪ್ಪ ಅಲ್ಲಿ ಹತ್ತು ದಿನಕ್ಕಿಂತ ಜಾಸ್ತಿ ಇರಲಿಲ್ಲ. ಅವ್ವ ನಮ್ಮ ಫ್ಲ್ಯಾಟ್‌ನಲ್ಲಿ ಒಂದು ವಾರಾನೂ ಇರಲ್ಲ — ದನ ಇಲ್ಲ, ಅಂಗಳ ಇಲ್ಲ, ಪಕ್ಕದ್ಮನೆಯವರ ಹೆಸರೇ ಗೊತ್ತಿಲ್ಲ."
    tr: "Matte avva. Jamīnu hōdre avva ellirtāḷe? Namma jote Beṅgaḷūrigā? Appa alli hattu dinakkinta jāsti iralilla. Avva namma phlyāṭ-nalli ondu vārānū iralla — dana illa, aṅgaḷa illa, pakkadmaneyavara hesarē gottilla."
    en: "And then Avva. If the land goes, where will Avva live? With us in Bengaluru? Appa didn't last more than ten days there. Avva won't last even a week in our flat — no cattle, no yard, and nobody knows the neighbours' names."
  - who: meena
    t: "ಅದಕ್ಕೇ ಹೇಳಿದ್ದು — ಎಲ್ಲಾ ಸಂಖ್ಯೆಗಳೂ ಲೆಕ್ಕದ ಪುಸ್ತಕದಲ್ಲಿ ಬರಲ್ಲ."
    tr: "Adakkē hēḷiddu — ellā saṅkhyegaḷū lekkada pustakadalli baralla."
    en: "That's what I meant — not every number fits in the account book."
  - who: suresh
    t: "ನೀನು ಪ್ರಿನ್ಸಿಪಾಲ್ ಆಗೋ ಬದಲು ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಆಗ್ಬೇಕಿತ್ತು."
    tr: "Nīnu prinsipāl āgō badalu byāṅk myānējar āgbēkittu."
    en: "You should have been a bank manager instead of a principal."
  - who: meena
    t: "ಒಬ್ಬ ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಮನೇಲಿ ಸಾಕು. … ರಕ್ಷಿತ್, ನೀನೇನು ಯೋಚಿಸ್ತೀಯ? ನೀನೂ ಈ ಮನೆಯ ಮುಂದಿನ ತಲೆಮಾರು."
    tr: "Obba byāṅk myānējar manēli sāku. … Rakṣit, nīnēnu yōcistīya? Nīnū ī maneya mundina talemāru."
    en: "One bank manager in the house is enough. … Rakshith, what do you think? You're this family's next generation."
  - who: rakshith
    t: "ನಿಜ ಹೇಳ್ಲಾ? ಮೊದಲು ಆ ಸಂಖ್ಯೆ ಕೇಳಿದಾಗ ತುಂಬಾ ಖುಷಿ ಆಯ್ತು. ಆಮೇಲೆ ತಾತನ ಹುಣಸೆ ಮರ ನೆನಪಾಯ್ತು. ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಅಲ್ಲಿ ಹಾಲು ಹಾಕಿದ್ವಿ. ಆ ಹೊಲ ಮಾರಿದ್ರೆ ತಾತನ ಸಮಾಧಿ ಯಾರದೋ ಫಾರ್ಮ್‌ಹೌಸ್ ತೋಟದಲ್ಲಿರುತ್ತೆ. ವಾರಾಂತ್ಯಕ್ಕೆ ಬರೋ ಜನ ಅದರ ಪಕ್ಕ ಬಾರ್ಬೆಕ್ಯೂ ಮಾಡ್ತಾರೆ."
    tr: "Nija hēḷlā? Modalu ā saṅkhye kēḷidāga tumbā khuṣi āytu. Āmēle tātana huṇase mara nenapāytu. Ḍisembar-nalli alli hālu hākidvi. Ā hola māridre tātana samādhi yāradō phārm-haus tōṭadallirutte. Vārāntyakke barō jana adara pakka bārbekyū māḍtāre."
    en: "Shall I tell you the truth? When I first heard that number I was really thrilled. Then I remembered Thatha's tamarind tree. In December we poured milk there. If that field is sold, Thatha's grave will be in somebody's farmhouse garden. Weekend people will have barbecues right next to it."
  - who: rakshith
    t: "ತಾತ ನನಗೆ ದನಗಳ ಕೊಂಬಿಗೆ ಬಣ್ಣ ಹಚ್ಚೋದು ಕಲಿಸ್ತೀನಿ ಅಂದಿದ್ರು. ಚಿಕ್ಕಪ್ಪ ನೇಗಿಲು ಹಿಡಿಯೋದು ಕಲಿಸ್ತೀನಿ ಅಂದಿದಾರೆ. ಎಲ್ಲಾ ಮಾರಿಬಿಟ್ರೆ ನಾನು ಎಲ್ಲಿ ಕಲೀಲಿ? ನಾಳೆ ನನ್ನ ಮಕ್ಕಳಿಗೆ ‘ನಮ್ಮ ಮನೆತನ ಇಲ್ಲಿಂದ ಬಂತು’ ಅಂತ ಎಲ್ಲಿ ತೋರಿಸ್ಲಿ? ಆದ್ರೂ… ಚಿಕ್ಕಪ್ಪ ಇಷ್ಟು ಕಷ್ಟಪಡೋದು ನೋಡಿದ್ರೆ, ಗೊತ್ತಿಲ್ಲ ಅಪ್ಪ. ಎರಡೂ ಸರಿ ಅನ್ಸುತ್ತೆ."
    tr: "Tāta nanage danagaḷa kombige baṇṇa haccōdu kalistīni andidru. Cikkappa nēgilu hiḍiyōdu kalistīni andidāre. Ellā māribiṭre nānu elli kalīli? Nāḷe nanna makkaḷige ‘namma manetana illinda bantu’ anta elli tōrisli? Ādrū… cikkappa iṣṭu kaṣṭapaḍōdu nōḍidre, gottilla appa. Eraḍū sari ansutte."
    en: "Thatha said he'd teach me to paint the cattle's horns. Chikkappa has said he'll teach me to hold a plough. If we sell it all, where do I learn? One day, where do I show my own kids 'this is where our family came from'? But still… when I see how hard Chikkappa works — I don't know, Appa. Both seem right."
  - who: suresh
    t: "‘ಎರಡೂ ಸರಿ ಅನ್ಸುತ್ತೆ’ — ಇದೇ ಕಣೋ ದೊಡ್ಡೋರಾಗೋದ್ರ ಕಷ್ಟ. ಸರಿ-ತಪ್ಪಿನ ಮಧ್ಯೆ ಆಯ್ಕೆ ಸುಲಭ. ಎರಡು ಸರಿಗಳ ಮಧ್ಯೆ ಆಯ್ಕೆ ಮಾಡೋದೇ ಕಷ್ಟ."
    tr: "‘Eraḍū sari ansutte’ — idē kaṇō doḍḍōrāgōdra kaṣṭa. Sari-tappina madhye āyke sulabha. Eraḍu sarigaḷa madhye āyke māḍōdē kaṣṭa."
    en: "'Both seem right' — that's exactly what's hard about growing up, son. Choosing between right and wrong is easy. Choosing between two rights is the hard part."
  - who: meena
    t: "ಇನ್ನೊಂದು ವಿಷಯ. ಶೋಭಾಳ ಗಂಡ ಮಂಜುನಾಥ್‌ಗೆ ಫೋನ್ ಮಾಡಿದ್ದು. ಇದು ಬೇರೆ ಯಾರಿಂದಲಾದ್ರೂ ಮಹದೇವನ ಕಿವಿಗೆ ಬೀಳೋ ಮುಂಚೆ ನೀವೇ ಹೇಳೋದು ಒಳ್ಳೇದು."
    tr: "Innondu viṣaya. Śōbhāḷa gaṇḍa Man̄junāth-ge phōn māḍiddu. Idu bēre yārindalādrū Mahadēvana kivige bīḷō mun̄ce nīvē hēḷōdu oḷḷēdu."
    en: "One more thing. Shobha's husband phoning Manjunath. Better you tell Mahadeva yourself before it reaches his ears from someone else."
  - who: suresh
    t: "ಬೆಳಿಗ್ಗೆ ಗದ್ದೆಗೆ ಹೋಗಿ ಹೇಳ್ತೀನಿ. … ಅಷ್ಟರಲ್ಲಿ ಊರೇ ಅವನಿಗೆ ಹೇಳಿರದಿದ್ರೆ."
    tr: "Beḷigge gaddege hōgi hēḷtīni. … Aṣṭaralli ūrē avanige hēḷiradidre."
    en: "I'll go to the field in the morning and tell him. … If the village hasn't told him by then."

  - section: "Mahadeva's anger"
    learn: "accusation: kūrisidrallā nīvu!, ‘illa’ antānū annalilla, alvā? · honest admission: suḷḷu hēḷalla, nānū manuṣya · land as mother: mūru talemārina bevaru, bhūmi tāyi · a phone quarrel: āṇe māḍi hēḷtīni, nanna paravāgi vakīlaru mātāḍtāre · defiance: nan mēle uḷume māḍbēku · a mother's image: kāḷanna sippeyinda bēre māḍōdu sulabha"
  - scene: "Sunday morning, 22 March. The cane field by the canal. Mahadeva is opening a channel with a spade; water gurgles into the furrows. Suresh walks along the bund towards him. Mahadeva doesn't look up."
  - who: mahadeva
    t: "ನಿನ್ನೆ ನಮ್ಮನೆ ಮುಂದೆ ಬಿಳಿ ಕಾರು ನಿಂತಿತ್ತಂತೆ. ಡೈರಿಗೆ ಹಾಲು ಹಾಕೋಕೆ ಹೋದಾಗ ಊರಿಗೆಲ್ಲಾ ಗೊತ್ತಿತ್ತು. ನನಗೆ ಮಾತ್ರ ಕೊನೆಗೆ."
    tr: "Ninne nammane munde biḷi kāru nintittante. Ḍairige hālu hākōke hōdāga ūrigellā gottittu. Nanage mātra konege."
    en: "Apparently a white car was parked outside our house yesterday. When I went to pour the milk at the dairy, the whole village knew. Only I found out last."
  - who: suresh
    t: "ಅದಕ್ಕೇ ನಾನೇ ಹೇಳೋಕೆ ಬಂದೆ, ಮಹದೇವ. ಮಂಜುನಾಥ್ ಬಂದಿದ್ದ. ಎಕರೆಗೆ ಐವತ್ತೈದು ಲಕ್ಷ ಅಂದ."
    tr: "Adakkē nānē hēḷōke bande, Mahadēva. Man̄junāth bandidda. Ekarege aivattaidu lakṣa anda."
    en: "That's why I came to tell you myself, Mahadeva. Manjunath came. He said fifty-five lakh an acre."
  - who: mahadeva
    t: "ಅದೇ ಮಂಜುನಾಥ. ನವೆಂಬರ್‌ನಲ್ಲಿ ಅಪ್ಪ ಯಾರಿಗೆ ‘ಇಲ್ಲ’ ಅಂದು ಕಳಿಸಿದ್ರೋ ಅದೇ ಮನುಷ್ಯ. ಅಪ್ಪನ ಫೋಟೋ ಮುಂದೆ, ಅಪ್ಪನ ಮನೇಲಿ, ಅವನಿಗೆ ಕಾಫಿ ಕೊಟ್ಟು ಕೂರಿಸಿದ್ರಲ್ಲಾ ನೀವು!"
    tr: "Adē Man̄junātha. Navembar-nalli appa yārige ‘illa’ andu kaḷisidrō adē manuṣya. Appana phōṭō munde, appana manēli, avanige kāphi koṭṭu kūrisidrallā nīvu!"
    en: "(putting down the spade) The same Manjunath. The very man Appa sent away with a 'no' in November. In front of Appa's photo, in Appa's own house, you sat him down and gave him coffee!"
  - who: suresh
    t: "ಮನೆಗೆ ಬಂದೋರನ್ನ ಬಾಗಿಲಲ್ಲೇ ನಿಲ್ಲಿಸೋದು ನಮ್ಮ ಮನೆತನದ ಪದ್ಧತಿ ಅಲ್ಲ. ನಾನು ‘ಹೂಂ’ ಅನ್ನಲಿಲ್ಲ, ಯಾವ ಕಾಗದಕ್ಕೂ ಸಹಿ ಹಾಕಲಿಲ್ಲ. ಅವ್ವನೇ ಅವನನ್ನ ಕಳಿಸಿದ್ರು."
    tr: "Manege bandōranna bāgilallē nillisōdu namma manetanada paddhati alla. Nānu ‘hūṁ’ annalilla, yāva kāgadakkū sahi hākalilla. Avvanē avananna kaḷisidru."
    en: "Keeping a visitor standing at the door isn't our family's way. I didn't say 'yes', and I didn't sign any paper. It was Avva herself who sent him off."
  - who: mahadeva
    t: "‘ಹೂಂ’ ಅನ್ನಲಿಲ್ಲ. ‘ಇಲ್ಲ’ ಅಂತಾನೂ ಅನ್ನಲಿಲ್ಲ, ಅಲ್ವಾ ಅಣ್ಣ? ನಿನ್ನ ಕಣ್ಣ ಮುಂದೆ ಆ ಕೋಟಿ ಸಂಖ್ಯೆ ಕುಣೀತಾ ಇತ್ತು. ಮುಖ ನೋಡಿದ್ರೇ ಗೊತ್ತಾಗುತ್ತೆ."
    tr: "‘Hūṁ’ annalilla. ‘Illa’ antānū annalilla, alvā aṇṇa? Ninna kaṇṇa munde ā kōṭi saṅkhye kuṇītā ittu. Mukha nōḍidrē gottāgutte."
    en: "You didn't say 'yes'. You didn't say 'no' either, did you, Anna? That crore figure was dancing before your eyes. I can tell just from your face."
  - who: suresh
    t: "… ಹೌದು. ಸುಳ್ಳು ಹೇಳಲ್ಲ. ಒಂದು ಕ್ಷಣ ಮನಸ್ಸು ಅಲ್ಲಾಡ್ತು. ರಕ್ಷಿತ್‌ನ ಓದು, ಮನೆ ಸಾಲ… ನಾನೂ ಮನುಷ್ಯ, ಮಹದೇವ. ಆದ್ರೆ ಮನಸ್ಸು ಅಲ್ಲಾಡೋದು ಬೇರೆ, ಮಾರೋದು ಬೇರೆ."
    tr: "… Haudu. Suḷḷu hēḷalla. Ondu kṣaṇa manassu allāḍtu. Rakṣit-na ōdu, mane sāla… nānū manuṣya, Mahadēva. Ādre manassu allāḍōdu bēre, mārōdu bēre."
    en: "… Yes. I won't lie. For a moment my mind wavered. Rakshith's studies, the house loan… I'm human too, Mahadeva. But wavering is one thing, and selling is another."
  - who: mahadeva
    t: "ಇದನ್ನ ನೋಡು ಅಣ್ಣ. ಈ ಮಣ್ಣಿಗೆ ಅಜ್ಜ ಕರಿಯಪ್ಪ ಕೆರೆ ಹೂಳು ತಂದು ಹಾಕಿದ್ರು, ಅಪ್ಪ ಬದು ಕಟ್ಟಿದ್ರು, ನಾನು ಇಪ್ಪತ್ತು ವರ್ಷ ಗೊಬ್ಬರ ಹಾಕಿದೀನಿ. ಮೂರು ತಲೆಮಾರಿನ ಬೆವರು ಇದು. ದುಡ್ಡು ಖರ್ಚಾಗುತ್ತೆ, ಭೂಮಿ ಒಂದ್ಸಲ ಹೋದ್ರೆ ವಾಪಸ್ ಬರಲ್ಲ. ಭೂಮಿ ತಾಯಿ ಅಂತೀವಿ — ಯಾರಾದ್ರೂ ತಾಯಿನ ಮಾರ್ತಾರಾ?"
    tr: "Idanna nōḍu aṇṇa. Ī maṇṇige ajja Kariyappa kere hūḷu tandu hākidru, appa badu kaṭṭidru, nānu ippattu varṣa gobbara hākidīni. Mūru talemārina bevaru idu. Duḍḍu kharcāgutte, bhūmi ondsala hōdre vāpas baralla. Bhūmi tāyi antīvi — yārādrū tāyina mārtārā?"
    en: "(scooping up a handful of soil) Look at this, Anna. Grandfather Kariyappa carted silt from the tank and spread it on this soil; Appa built the bunds; I've put manure on it for twenty years. This is three generations' sweat. Money gets spent; once land is gone it never comes back. We call the earth our mother — does anyone sell their mother?"
  - who: mahadeva
    t: "ಮತ್ತೆ ಆ ಫಾರ್ಮ್ ಪ್ಲಾಟ್ ಜನ ಏನ್ ಮಾಡ್ತಾರೆ ಗೊತ್ತಾ? ಪಕ್ಕದ ಹಳ್ಳೀಲಿ ನೋಡ್ಕಂಡು ಬಾ. ಗೇಟ್ ಹಾಕ್ತಾರೆ, ಬಂಡಿ ದಾರಿ ಮುಚ್ತಾರೆ, ಐನೂರು ಅಡಿ ಬೋರ್‌ವೆಲ್ ಕೊರೆಸ್ತಾರೆ — ನಮ್ ಬಾವಿ ಒಣಗುತ್ತೆ. ವಾರಕ್ಕೊಂದ್ಸಲ ಬಂದು ಫೋಟೋ ತಗಂಡು ಹೋಗ್ತಾರೆ. ಉಳಿದ ದಿನ ಅಲ್ಲಿ ಕಾವಲುಗಾರ ಮಾತ್ರ."
    tr: "Matte ā phārm plāṭ jana ēn māḍtāre gottā? Pakkada haḷḷīli nōḍkaṇḍu bā. Gēṭ hāktāre, baṇḍi dāri muctāre, ainūru aḍi bōr-vel korestāre — nam bāvi oṇagutte. Vārakkondsala bandu phōṭō tagaṇḍu hōgtāre. Uḷida dina alli kāvalugāra mātra."
    en: "And do you know what those farm-plot people do? Go and look in the next village. They put up gates, they block the cart track, they drill a five-hundred-foot borewell — and our well dries up. They come once a week and take photos. The rest of the time there's only a watchman."
  - who: suresh
    t: "ನೀನು ಹೇಳೋದು ನಿಜ. ಇನ್ನೊಂದು ವಿಷಯ ನಿನಗೆ ನನ್ನಿಂದಲೇ ಗೊತ್ತಾಗ್ಬೇಕು: ಶೋಭಾಳ ಗಂಡ ಮಂಜುನಾಥ್‌ಗೆ ಫೋನ್ ಮಾಡಿ ರೇಟ್ ಕೇಳಿದ್ರಂತೆ. ಬರೀ ರೇಟ್ ಅಂತೆ."
    tr: "Nīnu hēḷōdu nija. Innondu viṣaya ninage nanninda gottāgbēku: Śōbhāḷa gaṇḍa Man̄junāth-ge phōn māḍi rēṭ kēḷidrante. Barī rēṭ ante."
    en: "What you say is true. There's one more thing you should hear from me: Shobha's husband apparently phoned Manjunath and asked the rate. Only the rate, he says."
  - who: mahadeva
    t: "ಬರೀ ರೇಟ್! ನೋಡಿದ್ಯಾ? ಹುಣ್ಣಿಮೆ ದಿನ ಕಟ್ಟೆ ಮೇಲೆ ಅವಳು ಏನಂದ್ಲು — ‘ನಾನು ಮಾರ್ತೀನಿ ಅಂತ ಯಾರು ಹೇಳಿದ್ರು?’ ಮೂರು ವಾರ ಆಗಿಲ್ಲ, ಆಗ್ಲೇ ಗಂಡ ರೇಟ್ ಕೇಳ್ತಿದಾನೆ. ನಾನು ಅವತ್ತೇ ಹೇಳಿದ್ದೆ. ಕಾನೂನು ಪುಸ್ತಕ ಎಲ್ಲಾ ಇದಕ್ಕೇ."
    tr: "Barī rēṭ! Nōḍidyā? Huṇṇime dina kaṭṭe mēle avaḷu ēnandlu — ‘nānu mārtīni anta yāru hēḷidru?’ Mūru vāra āgilla, āglē gaṇḍa rēṭ kēḷtidāne. Nānu avattē hēḷidde. Kānūnu pustaka ellā idakkē."
    en: "(with a bitter laugh) Only the rate! See? What did she say on the platform that full-moon night — 'Who said I'd sell?' Not three weeks later, and already her husband is asking the rate. I said it that very day. All those law books were for this."
  - who: suresh
    t: "ಮಹದೇವ, ಶೋಭಾಗೆ ಇದು ಗೊತ್ತಿತ್ತೋ ಇಲ್ವೋ ನಮಗೆ ಗೊತ್ತಿಲ್ಲ. ತೀರ್ಮಾನಕ್ಕೆ ಮುಂಚೆ ಅವಳನ್ನೇ ಕೇಳೋಣ."
    tr: "Mahadēva, Śōbhāge idu gottittō ilvō namage gottilla. Tīrmānakke mun̄ce avaḷannē kēḷōṇa."
    en: "Mahadeva, we don't know whether Shobha knew about this or not. Before we judge, let's ask her."
  - who: mahadeva
    t: "ಕೇಳ್ತೀನಿ. ಈಗ್ಲೇ ಕೇಳ್ತೀನಿ."
    tr: "Kēḷtīni. Īglē kēḷtīni."
    en: "(pulling out his phone) I'll ask. I'll ask right now."
  - scene: "He puts the call on speaker. It rings for a long time. In Mysuru it is Shobha's day off."
  - who: shobha
    t: "ಹಲೋ? ಮಹದೇವ? ಇಷ್ಟು ಬೆಳಿಗ್ಗೆ… ಅವ್ವ ಚೆನ್ನಾಗಿದಾಳಾ?"
    tr: "Halō? Mahadēva? Iṣṭu beḷigge… avva cennāgidāḷā?"
    en: "Hello? Mahadeva? So early in the morning… is Avva all right?"
  - who: mahadeva
    t: "ಅವ್ವ ಚೆನ್ನಾಗಿದಾಳೆ. ನಿನ್ ಯಜಮಾನ್ರು ಚೆನ್ನಾಗಿದಾರಾ? ಮಂಜುನಾಥನಿಗೆ ಫೋನ್ ಮಾಡಿ ನಮ್ ಗದ್ದೆ ರೇಟ್ ಕೇಳೋಷ್ಟು ಚೆನ್ನಾಗಿದಾರೆ ಅಂತ ಕೇಳ್ದೆ."
    tr: "Avva cennāgidāḷe. Nin yajamānru cennāgidārā? Man̄junāthanige phōn māḍi nam gadde rēṭ kēḷōṣṭu cennāgidāre anta kēḷde."
    en: "Avva's fine. Is your husband well? I hear he's well enough to phone Manjunath and ask the rate for our wet land."
  - who: shobha
    t: "ಏನು? … ನನಗೆ ಗೊತ್ತೇ ಇಲ್ಲ, ಮಹದೇವ. ನಾನು ಅವರ ಹತ್ರ ಮಾತಾಡ್ತೀನಿ. ಆದ್ರೆ ನಾನು ಯಾರಿಗೂ ಜಮೀನು ಮಾರ್ತೀನಿ ಅಂತ ಹೇಳಿಲ್ಲ — ಆಣೆ ಮಾಡಿ ಹೇಳ್ತೀನಿ."
    tr: "Ēnu? … Nanage gottē illa, Mahadēva. Nānu avara hatra mātāḍtīni. Ādre nānu yārigū jamīnu mārtīni anta hēḷilla — āṇe māḍi hēḷtīni."
    en: "What? … I knew nothing about it, Mahadeva. I'll talk to him. But I have told no one I'd sell the land — I swear it."
  - who: mahadeva
    t: "ಆಣೆ ಬೇಡ. ಮೊದಲು ಕಾನೂನು, ಈಗ ಬ್ರೋಕರ್, ನಾಳೆ ಇನ್ನೇನೋ. ನಿಮ್ಮೆಲ್ಲರ ಕಣ್ಣು ಮಣ್ಣಿನ ಮೇಲಿಲ್ಲ, ಮಣ್ಣಿನ ಬೆಲೆ ಮೇಲಿದೆ."
    tr: "Āṇe bēḍa. Modalu kānūnu, īga brōkar, nāḷe innēnō. Nimmellara kaṇṇu maṇṇina mēlilla, maṇṇina bele mēlide."
    en: "Don't swear. First the law, now a broker, tomorrow something else. None of you has your eyes on the soil — your eyes are on the price of the soil."
  - who: shobha
    t: "ಮಹದೇವ, ಹೀಗೆ ಮಾತಾಡಿದ್ರೆ… ಸರಿ. ನಿನ್ನ ಜೊತೆ ಮಾತಾಡಿದ್ದು ಸಾಕು ಅನ್ಸುತ್ತೆ. ಇನ್ಮೇಲೆ ನನ್ನ ಪರವಾಗಿ ಒಬ್ಬ ವಕೀಲರು ಮಾತಾಡ್ತಾರೆ."
    tr: "Mahadēva, hīge mātāḍidre… sari. Ninna jote mātāḍiddu sāku ansutte. Inmēle nanna paravāgi obba vakīlaru mātāḍtāre."
    en: "Mahadeva, if you talk like this… fine. I think I've done enough talking with you. From now on a lawyer will speak on my behalf."
  - who: mahadeva
    t: "ಕರ್ಕಂಡು ಬಾ ನಿನ್ ವಕೀಲನ್ನ! ನಾನೂ ಕೋರ್ಟ್ ಮೆಟ್ಟಿಲು ಹತ್ತೋಕೆ ಹೆದರಲ್ಲ. ಈ ಗದ್ದೆಗೆ ಯಾರಾದ್ರೂ ಕಾಲಿಡ್ಬೇಕು ಅಂದ್ರೆ ಮೊದ್ಲು ನನ್ ಮೇಲೆ ಉಳುಮೆ ಮಾಡ್ಬೇಕು."
    tr: "Karkaṇḍu bā nin vakīlanna! Nānū kōrṭ meṭṭilu hattōke hedaralla. Ī gaddege yārādrū kāliḍbēku andre modlu nan mēle uḷume māḍbēku."
    en: "Bring your lawyer, then! I'm not afraid to climb the court steps either. If anyone wants to set foot on this field, they'll have to plough over me first."
  - scene: "He cuts the call. For a long moment only the water running in the channel can be heard."
  - who: suresh
    t: "ಮಹದೇವ… ಅವ್ವ ‘ನಮ್ಮ ಮನೆತನದಲ್ಲಿ ಯಾರೂ ಕೋರ್ಟು ಮೆಟ್ಟಿಲು ಹತ್ತಿಲ್ಲ’ ಅಂದಿದ್ರು. ನೆನಪಿದೆಯಾ?"
    tr: "Mahadēva… avva ‘namma manetanadalli yārū kōrṭu meṭṭilu hattilla’ andidru. Nenapideyā?"
    en: "Mahadeva… Avva said, 'No one in our family has ever climbed the steps of a court.' Do you remember?"
  - who: mahadeva
    t: "ನೆನಪಿದೆ. ಆ ಮಾತು ಮೊದ್ಲು ಮುರಿಯೋರು ನಾನಲ್ಲ, ಅಣ್ಣ. … ನೀರು ಬೇರೆ ಕಡೆ ಹರೀತಿದೆ, ಬದಿಗೆ ಸರಿ."
    tr: "Nenapide. Ā mātu modlu muriyōru nānalla, aṇṇa. … Nīru bēre kaḍe harītide, badige sari."
    en: "(picking up the spade again) I remember. I won't be the first to break those words, Anna. … The water's running the wrong way — move aside."
  - scene: "Noon. Avva sits on the veranda shelling avare beans into a winnowing tray. The two brothers come back from the field, walking several feet apart."
  - who: avva
    t: "ಮುಖ ನೋಡಿದ್ರೇ ಗೊತ್ತಾಗುತ್ತೆ. ಏನಾಯ್ತು?"
    tr: "Mukha nōḍidrē gottāgutte. Ēnāytu?"
    en: "I can tell by your faces. What's happened?"
  - who: suresh
    t: "ಶೋಭಾ ವಕೀಲರ ಹತ್ರ ಹೋಗ್ತೀನಿ ಅಂದ್ಲು, ಅವ್ವ."
    tr: "Śōbhā vakīlara hatra hōgtīni andlu, avva."
    en: "Shobha says she's going to a lawyer, Avva."
  - who: avva
    t: "… ಅವರೆ ಕಾಳನ್ನ ಸಿಪ್ಪೆಯಿಂದ ಬೇರೆ ಮಾಡೋದು ಸುಲಭ ಕಣ್ರಪ್ಪ. ಮಕ್ಳನ್ನ ಮನೆಯಿಂದ ಬೇರೆ ಮಾಡೋದು… ನಿಮ್ಮಪ್ಪ ಇದ್ದಿದ್ರೆ ಮೂರೂ ಜನನ್ನ ಕಿವಿ ಹಿಡ್ಕಂಡು ಒಂದೇ ಚಾಪೆ ಮೇಲೆ ಕೂರಿಸ್ತಿದ್ರು."
    tr: "… Avare kāḷanna sippeyinda bēre māḍōdu sulabha kaṇrappa. Makḷanna maneyinda bēre māḍōdu… nimmappa iddidre mūrū janna kivi hiḍkaṇḍu ondē cāpe mēle kūristidru."
    en: "(her hands go still) … Separating avare beans from their pods is easy, my sons. Separating children from their home… If your father were alive, he'd have pulled all three of you by the ear and sat you down on one mat."
  - who: mahadeva
    t: "ಅಪ್ಪ ಇದ್ದಿದ್ರೆ ಈ ಜಗಳಾನೇ ಇರ್ತಿರ್ಲಿಲ್ಲ, ಅವ್ವ."
    tr: "Appa iddidre ī jagaḷānē irtirlilla, avva."
    en: "If Appa were alive, there wouldn't be any fight at all, Avva."
