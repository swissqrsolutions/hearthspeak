  - scene: "Tuesday, 10 March, 10 p.m. The shutter is down. Mahesh, Kavya, Nitin and Shankara sit on crates in the empty shop. Amma stands by the counter."
  - who: cook
    t: "ನಮ್ಮ ಊರಿನ ದೇವಸ್ಥಾನದ ಅಡುಗೆಮನೆಯಲ್ಲಿ ಇವತ್ತಿಗೂ ಸೌದೆ ಒಲೆ. ಸಾವಿರ ಜನಕ್ಕೆ ಸಾರು, ಪಾಯಸ ಸೌದೆಯಲ್ಲೇ. ಕೆಲವು ಹೋಟೆಲ್‌ಗಳು ಈಗ ಸೌದೆಗೆ ಬದಲಾಯಿಸಿವೆ ಅಂತ ಕೇಳಿದೆ. ನನಗೆ ಸೌದೆ ಒಲೆ ಗೊತ್ತು."
    tr: "Namma ūrina dēvasthānada aḍugemaneyalli ivattigū saude ole. Sāvira janakke sāru, pāyasa saudeyallē. Kelavu hōṭel-gaḷu īga saudege badalāyisive anta kēḷide. Nanage saude ole gottu."
    en: "Even today, the temple kitchen back home cooks on firewood. Rasam and payasa for a thousand people, all on firewood. I hear some hotels have switched to firewood now. I know how to cook on a wood fire."
  - who: mahesh
    t: "ನಾನೂ ಯೋಚನೆ ಮಾಡಿದೆ, ಮೂರ್ತಿ ಸಾರ್‌ಗೆ ಫೋನ್ ಕೂಡ ಮಾಡಿದೆ. ಅವರು ಹೇಳಿದ್ರು: ‘ಹೊಗೆ ಮೇಲೆ ಬಂದ್ರೆ ನಾನು ಉಸಿರಾಡೋದು ಹೇಗೆ? ಅದಕ್ಕೆ ಚಿಮಣಿ ಇಲ್ಲ, ಬೆಂಕಿ ಅಪಾಯ ಬೇರೆ. ಲೀಸ್‌ನಲ್ಲಿ ಬರೆದಿದೆ ನೋಡು.’ ಅವರು ಹೇಳಿದ್ದು ಸರಿ."
    tr: "Nānū yōchane māḍide, Mūrti sār-ge phōn kūḍa māḍide. Avaru hēḷidru: ‘Hoge mēle bandre nānu usirāḍōdu hēge? Adakke chimaṇi illa, beṅki apāya bēre. Līs-nalli baredide nōḍu.’ Avaru hēḷiddu sari."
    en: "I thought about it too, and I even phoned Murthy sir. He said: ‘If smoke comes up, how am I supposed to breathe? There's no chimney for that, and there's the fire risk besides. Look, it's written in the lease.’ He's right."
  - who: nitin
    t: "ಹಾಗಾದ್ರೆ ಕರೆಂಟ್. ನಾನು ಇಡೀ ದಿನ ರಿಸರ್ಚ್ ಮಾಡಿದೆ. ಕಮರ್ಷಿಯಲ್ ಇಂಡಕ್ಷನ್, ಮೂರೂವರೆ ಕಿಲೋವ್ಯಾಟ್‌ನದ್ದು, ಒಂದಕ್ಕೆ ನಲವತ್ತೈದು ಸಾವಿರ. ಆದ್ರೆ ಇವತ್ತು ಬೆಂಗಳೂರಲ್ಲಿ ಎಲ್ಲಾ ಹೋಟೆಲ್‌ನವರೂ ಅದನ್ನೇ ಹುಡುಕ್ತಿದ್ದಾರೆ. ಸ್ಟಾಕ್ ಇಲ್ಲ, ರೇಟ್ ದಿನಾ ಏರ್ತಿದೆ."
    tr: "Hāgādre kareṇṭ. Nānu iḍī dina risarch māḍide. Kamarṣiyal inḍakṣan, mūrūvare kilōvyāṭ-naddu, ondakke nalavattaidu sāvira. Ādre ivattu Beṅgaḷūralli ellā hōṭel-navarū adannē huḍuktiddāre. Sṭāk illa, rēṭ dinā ērtide."
    en: "Then electricity. I spent the whole day researching. A commercial induction unit, three and a half kilowatts, costs forty-five thousand each. But today every hotel in Bengaluru is looking for the same thing. No stock, and the price goes up every day."
  - who: kavya
    t: "ನಲವತ್ತೈದು ಸಾವಿರ ಎರಡು ಅಂದ್ರೆ ತೊಂಬತ್ತು. ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಇರೋದು ಒಂದು ಲಕ್ಷ ಎಂಬತ್ತು. ಈ ತಿಂಗಳ ಸಂಬಳ, ರೆಂಟ್ ಇನ್ನೂ ಮುಂದೆ ಇದೆ. ಖರೀದಿ ಮಾಡೋದು ಬೇಡ."
    tr: "Nalavattaidu sāvira eraḍu andre tombattu. Byāṅk-nalli irōdu ondu lakṣa embattu. Ī tingaḷa sambaḷa, renṭ innū munde ide. Kharīdi māḍōdu bēḍa."
    en: "Forty-five thousand times two is ninety. What's in the bank is one lakh eighty. This month's salaries and rent are still ahead of us. Let's not buy."
  - who: nitin
    t: "ಖರೀದಿ ಅಲ್ಲ, ಬಾಡಿಗೆ. ನನ್ನ ಫ್ರೆಂಡ್‌ಗೆ ಕ್ಯಾಟರಿಂಗ್ ಬಿಸಿನೆಸ್ ಇದೆ. ಮದುವೆ ಸೀಸನ್ ಮುಗಿದಿದೆ, ಅವನ ಹತ್ರ ಎರಡು ಇಂಡಕ್ಷನ್ ಖಾಲಿ ಬಿದ್ದಿವೆ. ತಿಂಗಳಿಗೆ ಎಂಟು ಸಾವಿರ, ಎರಡಕ್ಕೂ ಸೇರಿ. ಗ್ಯಾಸ್ ಬಂದ ತಕ್ಷಣ ವಾಪಸ್."
    tr: "Kharīdi alla, bāḍige. Nanna phreṇḍ-ge kyāṭariṅg bisines ide. Maduve sīsan mugidide, avana hatra eraḍu inḍakṣan khāli biddive. Tingaḷige eṇṭu sāvira, eraḍakkū sēri. Gyās banda takṣaṇa vāpas."
    en: "Not buy: rent. A friend of mine has a catering business. The wedding season is over, and he has two induction units lying idle. Eight thousand a month for both together. They go back the moment the gas returns."
  - who: mahesh
    t: "ಕರೆಂಟ್ ಲೋಡ್ ನೋಡಬೇಕು. ನಮ್ಮ ಸ್ಯಾಂಕ್ಷನ್ಡ್ ಲೋಡ್ ಹನ್ನೆರಡು ಕಿಲೋವ್ಯಾಟ್. ಗ್ರೈಂಡರ್, ಫ್ರಿಜ್, ಚಿಮಣಿ, ಲೈಟ್ ಸೇರಿ ಸುಮಾರು ಆರು. ಎರಡು ಇಂಡಕ್ಷನ್ ಏಳು. ಒಟ್ಟು ಹದಿಮೂರು, ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಹಾಗಾದ್ರೆ ಗ್ರೈಂಡರ್ ಹಗಲಲ್ಲಿ ಬೇಡ, ರಾತ್ರಿ ಮಾತ್ರ. ಆಗ ಹನ್ನೊಂದರೊಳಗೆ ಇರುತ್ತೆ."
    tr: "Kareṇṭ lōḍ nōḍabēku. Namma syāṅkṣanḍ lōḍ hanneraḍu kilōvyāṭ. Graiṇḍar, phrij, chimaṇi, laiṭ sēri sumāru āru. Eraḍu inḍakṣan ēḷu. Oṭṭu hadimūru, svalpa jāsti. Hāgādre graiṇḍar hagalalli bēḍa, rātri mātra. Āga hannondaroḷage irutte."
    en: "We have to check the electrical load. Our sanctioned load is twelve kilowatts. Grinder, fridge, chimney and lights come to about six. Two induction units, seven. Thirteen in all; slightly over. So no grinder in the daytime, only at night. Then we stay under eleven."
  - who: cook
    t: "ಇಂಡಕ್ಷನ್‌ನಲ್ಲಿ ಇಡ್ಲಿ ಆಗುತ್ತೆ, ಸಾಂಬಾರ್ ಆಗುತ್ತೆ, ಬಾತ್ ಆಗುತ್ತೆ. ಪಾತ್ರೆ ತಳ ಚಪ್ಪಟೆ ಇರಬೇಕು ಅಷ್ಟೇ. ಆದ್ರೆ ದೋಸೆ? ಇಂಡಕ್ಷನ್ ಕಾವಲಿಯಲ್ಲಿ ನನ್ನ ದೋಸೆ ಗರಿಗರಿ ಬರಲ್ಲ. ಅರೆಬರೆ ದೋಸೆ ಕೊಡೋದಕ್ಕಿಂತ ದೋಸೆ ಇಲ್ಲ ಅನ್ನೋದು ವಾಸಿ."
    tr: "Inḍakṣan-nalli iḍli āgutte, sāmbār āgutte, bāt āgutte. Pātre taḷa chappaṭe irabēku aṣṭē. Ādre dōse? Inḍakṣan kāvaliyalli nanna dōse garigari baralla. Arebare dōse koḍōdakkinta dōse illa annōdu vāsi."
    en: "On induction you can do idli, sambar and the baths. The vessels just need flat bottoms. But dosa? On an induction griddle my dosa won't come out crisp. Better to say ‘no dosa’ than to serve a half-baked one."
  - who: kavya
    t: "ಹಾಗಾದ್ರೆ ಮೆನು ಕಟ್. ಎಷ್ಟು ಐಟಂ?"
    tr: "Hāgādre menu kaṭ. Eṣṭu aiṭam?"
    en: "Then we cut the menu. How many items?"
  - who: mahesh
    t: "ಐದು. ಇಡ್ಲಿ, ಖಾರಾ ಬಾತ್, ಕೇಸರಿ ಬಾತ್, ಚಿತ್ರಾನ್ನ, ಕಾಫಿ. ಅಶೋಕ್ ಹತ್ರ ಏನಾದ್ರೂ ಗ್ಯಾಸ್ ಸಿಕ್ಕಿದ್ರೆ ಅದು ಕಾಫಿ ಹಾಲಿಗೆ ಮಾತ್ರ. ದೋಸೆ, ವಡೆ ಗ್ಯಾಸ್ ಬರೋವರೆಗೆ ಇಲ್ಲ."
    tr: "Aidu. Iḍli, khārā bāt, kēsari bāt, chitrānna, kāphi. Aśōk hatra ēnādrū gyās sikkidre adu kāphi hālige mātra. Dōse, vaḍe gyās barōvarege illa."
    en: "Five. Idli, khara bath, kesari bath, chitranna, coffee. Whatever gas we get from Ashok goes only to boiling milk for coffee. No dosa or vada until the gas comes back."
  - who: nitin
    t: "ರೇಟ್? ಕೆಲವು ದರ್ಶಿನಿಗಳು ಊಟದ ರೇಟ್ ತೊಂಬತ್ತರಿಂದ ನೂರಕ್ಕೆ ಏರಿಸಿವೆ ಅಂತ ನ್ಯೂಸ್‌ನಲ್ಲಿ ಬಂದಿದೆ."
    tr: "Rēṭ? Kelavu darśinigaḷu ūṭada rēṭ tombattarinda nūrakke ērisive anta nyūs-nalli bandide."
    en: "Prices? The news says some darshinis have raised the price of a meal from ninety to a hundred."
  - who: amma
    t: "ಕಷ್ಟದ ಕಾಲದಲ್ಲಿ ರೇಟ್ ಏರಿಸಿದ್ರೆ ಜನ ಮರೆಯಲ್ಲ, ಮಗು. ಇಳಿಸಿದ್ರೂ ಮರೆಯಲ್ಲ. ಇಡ್ಲಿ ನಲವತ್ತೇ ಇರ್ಲಿ."
    tr: "Kaṣṭada kāladalli rēṭ ērisidre jana mareyalla, magu. Iḷisidrū mareyalla. Iḍli nalavattē irli."
    en: "If you raise prices in hard times, people don't forget it, child. If you keep them down, they don't forget that either. Let idli stay at forty."

  - section: "Five items on the board"
    learn: "apologising on a notice: … koratheyinda, kṣamisi, sahakarisi · customers' impatience and patience: hāgādre yāke bāgilu tegedidīri? vs bāgilu tegediddē doḍḍadu · the 20% quota: ippattu parsenṭ kōṭā, vārakke eraḍu silinḍar"
  - scene: "Friday, 13 March, 7 a.m. A whiteboard by the shutter, in Latha's neat handwriting. Two induction units hum in the kitchen. Ashok's auto pulls up with two blue cylinders."
  - who: cashier
    t: "‘ಗ್ಯಾಸ್ ಕೊರತೆಯಿಂದ ಇಂದು ಐದು ತಿಂಡಿಗಳು ಮಾತ್ರ: ಇಡ್ಲಿ, ಖಾರಾ ಬಾತ್, ಕೇಸರಿ ಬಾತ್, ಚಿತ್ರಾನ್ನ, ಕಾಫಿ. ದೋಸೆ, ವಡೆ ಸದ್ಯಕ್ಕೆ ಇಲ್ಲ. ತೊಂದರೆಗಾಗಿ ಕ್ಷಮಿಸಿ, ಸಹಕರಿಸಿ.’ ಸರಿಯಾಗಿದೆಯಾ ಸಾರ್?"
    tr: "‘Gyās korateyinda indu aidu tiṇḍigaḷu mātra: iḍli, khārā bāt, kēsari bāt, chitrānna, kāphi. Dōse, vaḍe sadyakke illa. Tondaregāgi kṣamisi, sahakarisi.’ Sariyāgideyā sār?"
    en: "(Reading the board) ‘Due to the gas shortage, only five items today: idli, khara bath, kesari bath, chitranna, coffee. No dosa or vada for now. We apologise for the inconvenience; please bear with us.’ Is that right, sir?"
  - who: gas
    t: "ಮಹೇಶ್ ಅವರೇ, ಸರ್ಕಾರ ಕೋಟಾ ಕೊಟ್ಟಿದೆ: ಹೋಟೆಲ್‌ಗಳ ಸಾಮಾನ್ಯ ಬಳಕೆಯ ಇಪ್ಪತ್ತು ಪರ್ಸೆಂಟ್ ಅಂತೆ. ನಿಮ್ಮ ಪಾಲು ವಾರಕ್ಕೆ ಎರಡು ಸಿಲಿಂಡರ್. ಮೊದಲ ಎರಡು ಇವು. ಬಿಲ್ ಜೊತೆ, ಕಂಪನಿ ರೇಟ್‌ಗೆ."
    tr: "Mahēś avarē, sarkāra kōṭā koṭṭide: hōṭel-gaḷa sāmānya baḷakeya ippattu parsenṭ ante. Nimma pālu vārakke eraḍu silinḍar. Modala eraḍu ivu. Bil jote, kampani rēṭ-ge."
    en: "Mahesh, the government has given a quota: twenty percent of hotels' normal use, they say. Your share is two cylinders a week. Here are the first two. With a bill, at the company rate."
  - who: mahesh
    t: "ಅಶೋಕ್, ನೀವು ಮಾತು ಉಳಿಸ್ಕೊಂಡ್ರಿ. ಇಪ್ಪತ್ತು ಪರ್ಸೆಂಟ್ ಅಂದ್ರೆ ಕಾಫಿ ಉಳಿಯುತ್ತೆ. ಕಾಫಿ ಉಳಿದ್ರೆ ಜನ ಬರ್ತಾರೆ."
    tr: "Aśōk, nīvu mātu uḷiskoṇḍri. Ippattu parsenṭ andre kāphi uḷiyutte. Kāphi uḷidre jana bartāre."
    en: "Ashok, you kept your word. Twenty percent means the coffee survives. If the coffee survives, people will keep coming."
  - who: customer
    t: "ದೋಸೆ ಇಲ್ವಾ? ವಡೆನೂ ಇಲ್ವಾ? ಹಾಗಾದ್ರೆ ಬಾಗಿಲು ಯಾಕೆ ತೆಗೆದಿದೀರಾ? ಮಗನಿಗೆ ಮಸಾಲೆ ದೋಸೆ ಪ್ರಾಮಿಸ್ ಮಾಡಿ ಕರ್ಕೊಂಡು ಬಂದಿದೀನಿ."
    tr: "Dōse ilvā? Vaḍenū ilvā? Hāgādre bāgilu yāke tegedidīrā? Maganige masāle dōse prāmis māḍi karkoṇḍu bandidīni."
    en: "No dosa? No vada either? Then why are you open at all? I promised my son a masala dose and brought him here."
  - who: dev
    t: "ಸಾರ್, ಕ್ಷಮಿಸಿ. ಇವತ್ತು ದೋಸೆ ಇಲ್ಲ. ಗ್ಯಾಸ್ ಇಲ್ಲ, ಇಡೀ ಬೆಂಗಳೂರಲ್ಲಿ. ಆದ್ರೆ ಇಡ್ಲಿ ಇದೆ, ಬಿಸಿ ಇದೆ. ಕೇಸರಿ ಬಾತ್ ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ. ಮಗುವಿಗೆ ಇಷ್ಟ ಆಗುತ್ತೆ."
    tr: "Sār, kṣamisi. Ivattu dōse illa. Gyās illa, iḍī Beṅgaḷūralli. Ādre iḍli ide, bisi ide. Kēsari bāt tumbā chennāgide. Maguvige iṣṭa āgutte."
    en: "Sorry, sir. No dosa today. No gas, in all of Bengaluru. But there's idli, and it's hot. The kesari bath is very good. Your boy will like it."
  - who: customer
    t: "ಇವನು ಯಾವಾಗ ಇಷ್ಟು ಕನ್ನಡ ಕಲಿತ? ಸರಿ, ಎರಡು ಕೇಸರಿ ಬಾತ್, ಒಂದು ಇಡ್ಲಿ."
    tr: "Ivanu yāvāga iṣṭu Kannaḍa kalita? Sari, eraḍu kēsari bāt, ondu iḍli."
    en: "(Softening) When did he learn this much Kannada? All right: two kesari bath, one idli."
  - who: customer
    t: "ಇಡೀ ಊರಲ್ಲಿ ಗ್ಯಾಸ್ ಇಲ್ಲ. ಕೆಲವು ಹೋಟೆಲ್‌ಗಳು ಬಾಗಿಲೇ ಹಾಕಿವೆ. ಇವರು ತೆಗೆದಿರೋದೇ ದೊಡ್ಡದು. ಮಹೇಶ, ಸಾಂಬಾರ್ ಇವತ್ತೂ ಬಿಸಿ ಇದೆ, ನೋಡಿದೆ."
    tr: "Iḍī ūralli gyās illa. Kelavu hōṭel-gaḷu bāgilē hākive. Ivaru tegedirōdē doḍḍadu. Mahēśa, sāmbār ivattū bisi ide, nōḍide."
    en: "(Another voice: the elderly walker from the cold-sambar morning) There's no gas in the whole city. Some hotels have shut their doors altogether. That these people are open at all is something. Mahesha, the sambar is hot today too; I checked."
  - who: sam
    t: "ಮಹೇಶ್ ಅವರೇ, ನಿಮಗೆ ಏನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? ಅಜ್ಜಿ ಹೇಳಿದ್ರು, ಮನೆ ಸಿಲಿಂಡರ್ ಬುಕಿಂಗ್‌ಗೂ ಈಗ ತುಂಬಾ ದಿನ ಕಾಯಬೇಕಂತೆ. ಅವರು ಇಡ್ಲಿ ಹಿಟ್ಟು ಮನೆಯಲ್ಲಿ ಮಾಡ್ತಿಲ್ಲ, ಇನ್ಮೇಲೆ ದಿನಾ ನಿಮ್ಮ ಪಾರ್ಸೆಲ್."
    tr: "Mahēś avarē, nimage ēnādrū sahāya bēkā? Ajji hēḷidru, mane silinḍar bukiṅg-gū īga tumbā dina kāyabēkante. Avaru iḍli hiṭṭu maneyalli māḍtilla, inmēle dinā nimma pārsel."
    en: "Mahesh, do you need any help? Ajji says that even for household cylinders you have to wait many days for a booking now. She's not making idli batter at home; from now on, it's your parcel every day."
  - who: mahesh
    t: "ಇದೇ ಸಹಾಯ ಸ್ಯಾಮ್. ದಿನಾ ಬನ್ನಿ, ಅಜ್ಜಿಗೆ ಹೇಳಿ: ಚಟ್ನಿ ಜಾಸ್ತಿ, ಯಾವಾಗ್ಲೂ."
    tr: "Idē sahāya Syām. Dinā banni, ajjige hēḷi: chaṭni jāsti, yāvāglū."
    en: "That is the help, Sam. Come every day, and tell Ajji: extra chutney, always."

  - section: "Nobody will be sent home"
    learn: "staff worries: ūrige kaḷistāra?, sambaḷa baruttā?, kelasa uḷiyuttā? · reassurance with conditions: … ādrū, … kaḷisalla; … tanaka · deferring pay with dignity: mundina tingaḷige iḍi, baḍḍi samēta vāpas · Bihu, Rongāli Bihu"
  - scene: "Friday, 20 March, 9:30 p.m. After closing. The staff eat dinner sitting on the kitchen floor. Mahesh sits down with them, plate in hand."
  - who: helper
    t: "ಸಾಹೇಬ್ರ, ಒಂದು ಮಾತು ಕೇಳ್ಬೇಕಿತ್ರಿ. ಹುಬ್ಬಳ್ಳಿಯೊಳಗ ನನ್ನ ಗೆಳ್ಯಾನ ಹೋಟೆಲ್ ಬಂದ್ ಆಗೇತಿ. ಎಲ್ಲಾರ್ನೂ ಪಗಾರ ಇಲ್ಲದ ಊರಿಗೆ ಕಳಿಸ್ಯಾರ. ನಮ್ಮನ್ನೂ ಕಳಿಸ್ತೀರೇನ್ರಿ?"
    tr: "Sāhēbra, ondu mātu kēḷbēkitri. Hubbaḷḷiyoḷaga nanna geḷyāna hōṭel band āgēti. Ellārnū pagāra illada ūrige kaḷisyāra. Nammannū kaḷistīrēnri?"
    en: "Sir, I wanted to ask you something. My friend's hotel in Hubballi has shut. They've sent everyone home without wages. Will you send us home too?"
  - who: mahesh
    t: "ಇಲ್ಲ. ಎಲ್ರೂ ಕೇಳಿ. ಈ ತಿಂಗಳು ಕಲೆಕ್ಷನ್ ಮೂವತ್ತು ಪರ್ಸೆಂಟ್‌ಗಿಂತ ಜಾಸ್ತಿ ಕಮ್ಮಿ ಆಗಿದೆ. ನಷ್ಟ ಆಗ್ತಿದೆ, ಸುಳ್ಳು ಹೇಳಲ್ಲ. ಆದ್ರೂ ಮಾರ್ಚ್ ಸಂಬಳ ಪೂರ್ತಿ, ಏಪ್ರಿಲ್ ಒಂದನೇ ತಾರೀಖು. ಅಂಗಡಿ ತೆರೆದಿರೋ ತನಕ ಯಾರನ್ನೂ ಕೆಲಸದಿಂದ ತೆಗೆಯಲ್ಲ."
    tr: "Illa. Ellrū kēḷi. Ī tingaḷu kalekṣan mūvattu parsenṭ-ginta jāsti kammi āgide. Naṣṭa āgtide, suḷḷu hēḷalla. Ādrū Mārch sambaḷa pūrti, Ēpril ondanē tārīkhu. Aṅgaḍi teredirō tanaka yārannū kelasadinda tegeyalla."
    en: "No. Everyone, listen. This month the takings are down by more than thirty percent. We're losing money; I won't lie. Even so, March salaries in full, on the first of April. As long as this shop is open, nobody loses their job."
  - who: cashier
    t: "ಸಾರ್, ಜನ ಕಮ್ಮಿ ಇದ್ದಾಗ ನಾನು ಒಂದು ಗಂಟೆ ಬೇಗ ಹೋಗಬಹುದು. ಆ ಗಂಟೆಯ ಸಂಬಳ ಕಟ್ ಮಾಡಿ. ನನಗೆ ಬೇಜಾರಿಲ್ಲ."
    tr: "Sār, jana kammi iddāga nānu ondu gaṇṭe bēga hōgabahudu. Ā gaṇṭeya sambaḷa kaṭ māḍi. Nanage bējārilla."
    en: "Sir, when there are fewer people I can leave an hour early. Cut that hour's pay. I don't mind."
  - who: mahesh
    t: "ಬೇಡ ಲತಾ. ಆ ಒಂದು ಗಂಟೆಯಲ್ಲಿ ಕೌಂಟರ್‌ನಲ್ಲಿ ನಿಂತು ಗಿರಾಕಿಗಳಿಗೆ ಮೆನು ಯಾಕೆ ಚಿಕ್ಕದಾಗಿದೆ ಅಂತ ಹೇಳಿ. ನಿಮ್ಮ ಮಾತು ಕೇಳಿದ ಮೇಲೆ ಜನ ಕೋಪದಿಂದ ಹೋಗಲ್ಲ, ನಗ್ತಾ ಹೋಗ್ತಾರೆ."
    tr: "Bēḍa Latā. Ā ondu gaṇṭeyalli kauṇṭar-nalli nintu girākigaḷige menu yāke chikkadāgide anta hēḷi. Nimma mātu kēḷida mēle jana kōpadinda hōgalla, nagtā hōgtāre."
    en: "No, Latha. Use that hour standing at the counter and telling customers why the menu is short. After they've heard you, people don't leave angry; they leave smiling."
  - who: cook
    t: "ನನ್ನ ಸಂಬಳದಲ್ಲಿ ಹತ್ತು ಸಾವಿರ ಮುಂದಿನ ತಿಂಗಳಿಗೆ ಇಡಿ. ಇದು ದಾನ ಅಲ್ಲ, ಸಾಲ. ಗ್ಯಾಸ್ ಬಂದ್ಮೇಲೆ ವಾಪಸ್ ಕೊಡಿ. ಈ ಹುಡುಗರ ಸಂಬಳ ಮಾತ್ರ ಒಂದು ರೂಪಾಯಿನೂ ಕಮ್ಮಿ ಆಗಬಾರದು."
    tr: "Nanna sambaḷadalli hattu sāvira mundina tingaḷige iḍi. Idu dāna alla, sāla. Gyās bandmēle vāpas koḍi. Ī huḍugara sambaḷa mātra ondu rūpāyinū kammi āgabāradu."
    en: "Keep ten thousand of my salary for next month. It's not charity; it's a loan. Pay it back when the gas returns. But these boys' wages must not be one rupee short."
  - who: mahesh
    t: "ಶಂಕರಣ್ಣ… ಆಯ್ತು. ಮೇ ತಿಂಗಳ ಸಂಬಳದ ಜೊತೆ, ಬಡ್ಡಿ ಸಮೇತ. ಕಾವ್ಯ ಲೆಕ್ಕದಲ್ಲಿ ಬರೀತಾಳೆ."
    tr: "Śaṅkaraṇṇa… āytu. Mē tingaḷa sambaḷada jote, baḍḍi samēta. Kāvya lekkadalli barītāḷe."
    en: "Shankara-anna… all right. With May's salary, with interest. Kavya will write it in the books."
  - who: cook
    t: "ಬಡ್ಡಿ ಬೇಡ ಮಾರಾಯ್ರೆ. ಗ್ಯಾಸ್ ಬಂದ ದಿನ ನನ್ನ ಕಾವಲಿ ಮೇಲೆ ಮೊದಲ ದೋಸೆ ನಿಮ್ಮ ಅಮ್ಮನಿಗೆ. ಅದೇ ಬಡ್ಡಿ."
    tr: "Baḍḍi bēḍa mārāyre. Gyās banda dina nanna kāvali mēle modala dōse nimma ammanige. Adē baḍḍi."
    en: "No interest, my friend. The day the gas comes back, the first dosa off my griddle goes to your mother. That's the interest."
  - who: dev
    t: "ಸಾರ್… ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಬಿಹು. ನಮ್ಮ ಹೊಸ ವರ್ಷ. ಎರಡು ವರ್ಷದಿಂದ ಮನೆಗೆ ಹೋಗಿಲ್ಲ. ಹೋದ್ರೆ… ವಾಪಸ್ ಬಂದಾಗ ಕೆಲಸ ಇರುತ್ತಾ?"
    tr: "Sār… Ēpril-nalli Bihu. Namma hosa varṣa. Eraḍu varṣadinda manege hōgilla. Hōdre… vāpas bandāga kelasa iruttā?"
    en: "Sir… in April it's Bihu. Our new year. I haven't been home for two years. If I go… will there be a job when I come back?"
  - who: mahesh
    t: "ನಿಯಮ ನೆನಪಿದೆಯಾ? ಹದಿನೈದು ದಿನ ಮುಂಚೆ ಹೇಳಬೇಕು. ನೀನು ಈಗಲೇ ಹೇಳ್ತಿದೀಯ, ಮೂರು ವಾರ ಮುಂಚೆ. ಹೋಗು. ಕೆಲಸ ಇಲ್ಲೇ ಇರುತ್ತೆ. ಆದ್ರೆ ಒಂದು ಕಂಡೀಷನ್: ವಾಪಸ್ ಬಂದಾಗ ಅಮ್ಮನಿಗೆ ಅಸ್ಸಾಂ ಟೀ ತರಬೇಕು."
    tr: "Niyama nenapideyā? Hadinaidu dina muñche hēḷabēku. Nīnu īgalē hēḷtidīya, mūru vāra muñche. Hōgu. Kelasa illē irutte. Ādre ondu kaṇḍīṣan: vāpas bandāga ammanige Assām ṭī tarabēku."
    en: "Remember the rule? Tell us fifteen days ahead. You're telling me now, three weeks ahead. Go. The job will be right here. But one condition: when you come back, you bring Amma some Assam tea."
  - who: dev
    t: "ಎರಡು ಕೆಜಿ ತರ್ತೀನಿ! ಮತ್ತೆ… ಸಾರ್, ನಾನು ನೂರರವರೆಗೆ ಎಣಿಸ್ತೀನಿ, ಕೇಳಿ: ತೊಂಬತ್ತೇಳು, ತೊಂಬತ್ತೆಂಟು, ತೊಂಬತ್ತೊಂಬತ್ತು, ನೂರು!"
    tr: "Eraḍu keji tartīni! Matte… sār, nānu nūraravarege eṇistīni, kēḷi: tombattēḷu, tombatteṇṭu, tombattombattu, nūru!"
    en: "I'll bring two kilos! And… sir, I can count to a hundred now, listen: ninety-seven, ninety-eight, ninety-nine, a hundred!"
  - who: helper
    t: "ಶಭಾಷ್ ದೇವ್! ನನಗಿಂತ ಚೊಲೋ ಹೇಳ್ತಿ ನೀನು."
    tr: "Śabhāṣ Dēv! Nanaginta cholō hēḷti nīnu."
    en: "Shabash, Dev! You say it better than I do."

  - section: "Two in the morning"
    learn: "doubt and counterfactuals: kelasa biḍade iddidre…, … bartittu, … irtiralilla · family pressure: oḷḷe kelasa biṭṭu hōṭel yāke?, nālku jana ēnantāre? · planning in scenarios: … bandre, … baradidre, āga mātra · support: nāviddīvi, dhairyavāgiru"
  - scene: "Wednesday, 25 March, 2 a.m. The bedroom light is off; the street light comes through the curtain. Mahesh is lying awake. Kavya turns over."
  - who: mahesh
    t: "ಕಾವ್ಯ, ಎದ್ದಿದೀಯಾ? ನಿದ್ದೆ ಬರ್ತಿಲ್ಲ. ನಾನು ಕೆಲಸ ಬಿಡದೆ ಇದ್ದಿದ್ರೆ ಈ ತಿಂಗಳೂ ಸಂಬಳ ಬರ್ತಿತ್ತು, ಇಎಂಐ ಇರ್ತಿರಲಿಲ್ಲ, ಅಮ್ಮ ದಿನಾ ನಾಲ್ಕೂವರೆಗೆ ಏಳ್ತಿರಲಿಲ್ಲ."
    tr: "Kāvya, eddidīyā? Nidde bartilla. Nānu kelasa biḍade iddidre ī tingaḷū sambaḷa bartittu, ī-em-ai irtiralilla, amma dinā nālkūvarege ēḷtiralilla."
    en: "Kavya, are you awake? I can't sleep. If I hadn't quit my job, a salary would have come this month too, there'd be no EMI, and Amma wouldn't be getting up at half past four every day."
  - who: kavya
    t: "ಮತ್ತೆ ನೀನು ಆ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಬೇರೆಯವರ ಲಾಭಕ್ಕೆ ಕೆಲಸ ಮಾಡ್ತಿದ್ದೆ, ಪ್ರತಿ ರಾತ್ರಿ ‘ನನ್ನದೇ ಒಂದು ಅಂಗಡಿ ಇದ್ದಿದ್ರೆ…’ ಅಂತ ಹೇಳ್ತಿದ್ದೆ. ಅದನ್ನೂ ಲೆಕ್ಕಕ್ಕೆ ಸೇರಿಸು."
    tr: "Matte nīnu ā hōṭel-nalli bēreyavara lābhakke kelasa māḍtidde, prati rātri ‘nannadē ondu aṅgaḍi iddidre…’ anta hēḷtidde. Adannū lekkakke sērisu."
    en: "And you'd be working for someone else's profit at that hotel, saying every night, ‘If only I had a shop of my own…’. Put that in the accounts too."
  - who: mahesh
    t: "ಇವತ್ತು ಚಿಕ್ಕಪ್ಪ ಫೋನ್ ಮಾಡಿದ್ರು. ‘ಒಳ್ಳೆ ಕೆಲಸ ಬಿಟ್ಟು ಹೋಟೆಲ್ ಯಾಕೆ? ಈಗ ನೋಡು, ಗ್ಯಾಸೂ ಇಲ್ಲ. ನಾಲ್ಕು ಜನ ಏನಂತಾರೆ?’ ಅಂದ್ರು."
    tr: "Ivattu chikkappa phōn māḍidru. ‘Oḷḷe kelasa biṭṭu hōṭel yāke? Īga nōḍu, gyāsū illa. Nālku jana ēnantāre?’ andru."
    en: "My uncle phoned today. He said, ‘Why leave a good job for a hotel? Look at you now, not even gas. What will people say?’"
  - who: kavya
    t: "ನಾಲ್ಕು ಜನ ಏನಂತಾರೆ ಗೊತ್ತಾ? ನಿನ್ನೆ ಗೂಗಲ್‌ನಲ್ಲಿ ಒಬ್ಬರು ಬರೆದಿದ್ರು: ‘ಗ್ಯಾಸ್ ಇಲ್ಲದ ವಾರದಲ್ಲೂ ಇವರ ಇಡ್ಲಿ ರೇಟ್ ಏರಲಿಲ್ಲ.’ ಆ ನಾಲ್ಕು ಜನ ನನಗೆ ಸಾಕು."
    tr: "Nālku jana ēnantāre gottā? Ninne Gūgal-nalli obbaru baredidru: ‘Gyās illada vāradallū ivara iḍli rēṭ ēralilla.’ Ā nālku jana nanage sāku."
    en: "Do you know what people say? Yesterday someone wrote on Google: ‘Even in the week without gas, their idli price didn't go up.’ Those are the people I care about."
  - who: mahesh
    t: "ಆದ್ರೆ ಏಪ್ರಿಲ್‌ನಲ್ಲೂ ಹೀಗೇ ಆದ್ರೆ? ಅಮ್ಮನ ಚಿನ್ನ…"
    tr: "Ādre Ēpril-nallū hīgē ādre? Ammana chinna…"
    en: "But what if April is like this too? Amma's gold…"
  - who: kavya
    t: "ನಾನು ಒಂದು ಶೀಟ್ ಮಾಡಿದೀನಿ. ಹೆದರಬೇಡ, ಚಿಕ್ಕದು. ಮೂರು ಸ್ಥಿತಿ. ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಗ್ಯಾಸ್ ಬಂದ್ರೆ, ಮೇ ತಿಂಗಳಲ್ಲಿ ಮತ್ತೆ ಬ್ರೇಕ್-ಈವನ್. ಮೇವರೆಗೆ ಬರದಿದ್ರೆ, ನಿತಿನ್‌ನ ಸಾಲ. ಜೂನ್‌ವರೆಗೂ ಬರದಿದ್ರೆ, ಆಗ ಮಾತ್ರ ಚಿನ್ನದ ಮಾತು. ಅಲ್ಲಿವರೆಗೆ ಆ ಪದ ಈ ಮನೆಯಲ್ಲಿ ಬೇಡ."
    tr: "Nānu ondu śīṭ māḍidīni. Hedarabēḍa, chikkadu. Mūru sthiti. Ēpril-nalli gyās bandre, Mē tingaḷalli matte brēk-īvan. Mēvarege baradidre, Nitin-na sāla. Jūn-varegū baradidre, āga mātra chinnada mātu. Allivarege ā pada ī maneyalli bēḍa."
    en: "I've made a sheet. Don't panic, it's a small one. Three scenarios. If the gas comes back in April, break-even again in May. If it doesn't come by May, Nitin's loan. If it still hasn't come by June, only then do we talk about the gold. Until then, that word isn't spoken in this house."
  - who: mahesh
    t: "ಮೊದಲ ಸಲ ನಿನ್ನ ಶೀಟ್ ನೋಡಿ ಭಯ ಆಗ್ತಿಲ್ಲ."
    tr: "Modala sala ninna śīṭ nōḍi bhaya āgtilla."
    en: "For the first time, your spreadsheet doesn't scare me."
  - who: kavya
    t: "ಒಳ್ಳೇದು. ಈಗ ಮಲಗು. ಎರಡೂವರೆ ಗಂಟೆಯಲ್ಲಿ ಶಂಕರಣ್ಣ ಇಂಡಕ್ಷನ್ ಮೇಲೆ ಸಾಂಬಾರ್ ಇಡ್ತಾರೆ. ನೀನು ಅಲ್ಲಿರಬೇಕು."
    tr: "Oḷḷēdu. Īga malagu. Eraḍūvare gaṇṭeyalli Śaṅkaraṇṇa inḍakṣan mēle sāmbār iḍtāre. Nīnu allirabēku."
    en: "Good. Now sleep. In two and a half hours Shankara-anna puts the sambar on the induction. You need to be there."
  - who: amma
    t: "ನಾನೂ ಎದ್ದಿದೀನಿ, ಗೋಡೆ ತೆಳ್ಳಗಿದೆ. ನೀವಿಬ್ರೂ ಮಲಗಿ. ನಾವಿದ್ದೀವಿ, ಧೈರ್ಯವಾಗಿರು ಮಹೇಶ."
    tr: "Nānū eddidīni, gōḍe teḷḷagide. Nīvibrū malagi. Nāviddīvi, dhairyavāgiru Mahēśa."
    en: "(From the next room) I'm awake too; the walls are thin. Both of you, go to sleep. We're here. Be brave, Mahesha."

  - section: "Counting the loss"
    learn: "a bad month in numbers: kalekṣan … parsenṭ kammi, naṣṭa, uḷididdu · concessive: naṣṭa ādrū… · looking ahead with hedges: sudhārisabahudu antāre, bele ērutte anta echcharisidru, … anta mātu ide · ending a hard month: yāra hoṭṭegū mōsa māḍilla"
  - scene: "Tuesday, 31 March 2026, 11 p.m. The last night of the financial year. Kavya's laptop, Nitin on a video call, Amma with a cup of coffee she isn't drinking."
  - who: kavya
    t: "ಮಾರ್ಚ್ ಲೆಕ್ಕ. ಕಲೆಕ್ಷನ್ ಮೂರು ಲಕ್ಷ ತೊಂಬತ್ತು ಸಾವಿರ. ಫೆಬ್ರವರಿಗಿಂತ ಮೂವತ್ಮೂರು ಪರ್ಸೆಂಟ್ ಕಮ್ಮಿ. ಅಸೋಸಿಯೇಷನ್ ಇಪ್ಪತ್ತೈದರಿಂದ ಮೂವತ್ತು ಪರ್ಸೆಂಟ್ ನಷ್ಟ ಅಂತ ಅಂದಾಜು ಮಾಡಿತ್ತು. ನಾವು ಅದಕ್ಕಿಂತ ಸ್ವಲ್ಪ ಕೆಟ್ಟದಾಗಿದೀವಿ."
    tr: "Mārch lekka. Kalekṣan mūru lakṣa tombattu sāvira. Phebravariginta mūvatmūru parsenṭ kammi. Asōsiyēṣan ippattaidarinda mūvattu parsenṭ naṣṭa anta andāju māḍittu. Nāvu adakkinta svalpa keṭṭadāgidīvi."
    en: "March's accounts. Takings: three lakh ninety thousand. Thirty-three percent less than February. The association had estimated losses of twenty-five to thirty percent. We're doing a little worse than that."
  - who: kavya
    t: "ಖರ್ಚು: ಸಾಮಾನು ಕಮ್ಮಿ ತಗೊಂಡಿದ್ರಿಂದ ಒಂದು ಲಕ್ಷ ನಲವತ್ತೈದು. ಸ್ಟಾಫ್ ಪೂರ್ತಿ, ಎಂಬತ್ತೆಂಟು, ಶಂಕರಣ್ಣನ ಹತ್ತು ಸಾವಿರ ಸಾಲವಾಗಿ ಬಾಕಿ. ರೆಂಟ್ ಒಂದು ಲಕ್ಷ. ಗ್ಯಾಸ್ ಹತ್ತೊಂಬತ್ತು ಸಾವಿರ. ಇಂಡಕ್ಷನ್ ಬಾಡಿಗೆ ಎಂಟು. ಕರೆಂಟ್ ಬಿಲ್ ಎರಡು ಪಟ್ಟಿಗಿಂತ ಜಾಸ್ತಿ, ಮೂವತ್ತೆಂಟು. ಇಎಂಐ, ಜಿಎಸ್‌ಟಿ, ಉಳಿದದ್ದು ಸೇರಿ ಒಟ್ಟು ನಾಲ್ಕು ಲಕ್ಷ ಐವತ್ತೆಂಟು."
    tr: "Kharchu: sāmānu kammi tagoṇḍidrinda ondu lakṣa nalavattaidu. Sṭāf pūrti, embatteṇṭu, Śaṅkaraṇṇana hattu sāvira sālavāgi bāki. Renṭ ondu lakṣa. Gyās hattombattu sāvira. Inḍakṣan bāḍige eṇṭu. Kareṇṭ bil eraḍu paṭṭiginta jāsti, mūvatteṇṭu. Ī-em-ai, ji-es-ṭi, uḷidaddu sēri oṭṭu nālku lakṣa aivatteṇṭu."
    en: "Expenses: since we bought less stock, one lakh forty-five. Staff in full, eighty-eight, with Shankara-anna's ten thousand owed to him as a loan. Rent, one lakh. Gas, nineteen thousand. Induction rental, eight. The electricity bill more than doubled: thirty-eight. With the EMI, GST and the rest, four lakh fifty-eight in all."
  - who: mahesh
    t: "ಅರವತ್ತೆಂಟು ಸಾವಿರ ನಷ್ಟ."
    tr: "Aravatteṇṭu sāvira naṣṭa."
    en: "A loss of sixty-eight thousand."
  - who: kavya
    t: "ಹೌದು. ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಉಳಿದಿರೋದು ಒಂದು ಲಕ್ಷ ಹನ್ನೆರಡು ಸಾವಿರ. ಏಪ್ರಿಲ್ ಒಂದಕ್ಕೆ ಸಂಬಳ, ಐದಕ್ಕೆ ರೆಂಟ್. ಎರಡೂ ಕೊಟ್ಟ ಮೇಲೆ ಕೈಯಲ್ಲಿ ಬಹುತೇಕ ಏನೂ ಇರಲ್ಲ. ಇನ್ನೊಂದು ತಿಂಗಳು ಹೀಗೇ ಆದ್ರೆ…"
    tr: "Haudu. Byāṅk-nalli uḷidirōdu ondu lakṣa hanneraḍu sāvira. Ēpril ondakke sambaḷa, aidakke renṭ. Eraḍū koṭṭa mēle kaiyalli bahutēka ēnū iralla. Innondu tingaḷu hīgē ādre…"
    en: "Yes. What's left in the bank is one lakh twelve thousand. Salaries on the first of April, rent on the fifth. Once both are paid, there's almost nothing in hand. If another month goes like this…"
  - who: nitin
    t: "ನಾನು ಇನ್ನೂ ಎರಡು ಲಕ್ಷ ಹಾಕಬಹುದು, ಸಾಲವಾಗಿ, ಡೀಡ್‌ನಲ್ಲಿ ಬರೆದು. ಅಮ್ಮನ ಚಿನ್ನಕ್ಕೆ ಮುಂಚೆ ನನ್ನ ದುಡ್ಡು."
    tr: "Nānu innū eraḍu lakṣa hākabahudu, sālavāgi, ḍīḍ-nalli baredu. Ammana chinnakke muñche nanna duḍḍu."
    en: "I can put in two lakh more, as a loan, written into the deed. My money before Amma's gold."
  - who: amma
    t: "ನಷ್ಟ ಆದ್ರೂ ನನಗೆ ಒಂದು ಸಮಾಧಾನ ಇದೆ. ಈ ತಿಂಗಳು ನಾವು ಯಾರ ಹೊಟ್ಟೆಗೂ ಮೋಸ ಮಾಡಿಲ್ಲ. ಹುಡುಗರ ಸಂಬಳ ನಿಂತಿಲ್ಲ, ಕದ್ದ ಸಿಲಿಂಡರ್ ಅಂಗಡಿಗೆ ಬಂದಿಲ್ಲ, ಇಡ್ಲಿ ರೇಟ್ ಏರಿಲ್ಲ. ದೇವರು ನೋಡ್ತಾನೆ."
    tr: "Naṣṭa ādrū nanage ondu samādhāna ide. Ī tingaḷu nāvu yāra hoṭṭegū mōsa māḍilla. Huḍugara sambaḷa nintilla, kadda silinḍar aṅgaḍige bandilla, iḍli rēṭ ērilla. Dēvaru nōḍtāne."
    en: "Even with the loss, I have one comfort. This month we cheated nobody's stomach. The boys' wages didn't stop, no stolen cylinder came into the shop, the idli price didn't go up. God is watching."
  - who: kavya
    t: "ದೇವರ ಜೊತೆ ಸಿಎ ಆಫೀಸ್ ಕೂಡ ನೋಡ್ತಿದೆ, ಅಮ್ಮ. ಅಲ್ಲಿ ಇನ್ನೊಂದು ಮಾತು ಓಡಾಡ್ತಿದೆ: ಸರ್ಕಾರ ಕನಿಷ್ಠ ವೇತನ ಪರಿಷ್ಕರಣೆ ಮಾಡುತ್ತಂತೆ, ತುಂಬಾ ದೊಡ್ಡ ಏರಿಕೆ ಅಂತ. ಇನ್ನೂ ಏನೂ ಖಚಿತ ಇಲ್ಲ."
    tr: "Dēvara jote si-e āphīs kūḍa nōḍtide, amma. Alli innondu mātu ōḍāḍtide: sarkāra kaniṣṭha vētana pariṣkaraṇe māḍuttante, tumbā doḍḍa ērike anta. Innū ēnū khachita illa."
    en: "Along with God, the CA's office is watching too, Amma. Another rumour is going round there: the government is going to revise minimum wages, and it's a very big increase, they say. Nothing is certain yet."
  - scene: "Mahesh's phone buzzes. Ashok. He puts it on speaker."
  - who: gas
    t: "ಮಹೇಶ್ ಅವರೇ, ತಡ ರಾತ್ರಿ ಕ್ಷಮಿಸಿ. ಸಪ್ಲೈ ಸ್ವಲ್ಪ ಸುಧಾರಿಸ್ತಿದೆ. ನಾಳೆ ಬೆಳಗ್ಗೆ ನಾಲ್ಕು ಸಿಲಿಂಡರ್ ತರ್ತೀನಿ. ಆದ್ರೆ ಒಂದು ಎಚ್ಚರಿಕೆ: ಗ್ಯಾಸ್ ಬರುತ್ತೆ, ಬೆಲೆನೂ ಏರುತ್ತೆ. ಮುಂದಿನ ತಿಂಗಳುಗಳಲ್ಲಿ ದೊಡ್ಡ ಏರಿಕೆ ಬರಬಹುದು ಅಂತ ಕಂಪನಿಯವರೇ ಹೇಳ್ತಿದ್ದಾರೆ."
    tr: "Mahēś avarē, taḍa rātri kṣamisi. Saplai svalpa sudhāristide. Nāḷe beḷagge nālku silinḍar tartīni. Ādre ondu echcharike: gyās barutte, belenū ērutte. Mundina tingaḷugaḷalli doḍḍa ērike barabahudu anta kampaniyavarē hēḷtiddāre."
    en: "Mahesh, sorry for calling so late. Supply is improving a little. I'll bring four cylinders tomorrow morning. But a warning: the gas is coming back, and so is the price going up. The company people themselves say a big increase may come in the next few months."
  - who: mahesh
    t: "ನಾಲ್ಕು ಸಿಲಿಂಡರ್… ಅಮ್ಮ, ನಾಳೆ ಬೆಳಗ್ಗೆ ಆರು ಗಂಟೆಗೆ ಅಂಗಡಿಗೆ ಬಾ. ಶಂಕರಣ್ಣನ ಕಾವಲಿಯ ಮೊದಲ ದೋಸೆ ನಿನಗೆ. ಅದು ಅವರ ಬಡ್ಡಿ."
    tr: "Nālku silinḍar… Amma, nāḷe beḷagge āru gaṇṭege aṅgaḍige bā. Śaṅkaraṇṇana kāvaliya modala dōse ninage. Adu avara baḍḍi."
    en: "Four cylinders… Amma, come to the shop at six tomorrow morning. The first dosa off Shankara-anna's griddle is yours. That's his interest."
  - who: amma
    t: "ಬರ್ತೀನಿ. ಚಟ್ನಿ ನಾನೇ ತರ್ತೀನಿ."
    tr: "Bartīni. Chaṭni nānē tartīni."
    en: "I'll come. I'll bring the chutney myself."
