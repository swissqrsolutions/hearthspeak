lines:
  - chapter: "Chapter 1 — Good news"
  - section: "🧪 Two lines"
    learn: "dative experiencer: nanage vākarike āgtide (I feel sick) · garbhiṇi (pregnant), gere (line), masuku (faint) · concessive -idrū (even if) · -ōvaregū (until) · reported -anta"
  - scene: "Saturday, 7 March 2026, seven in the morning. A two-bedroom flat in JP Nagar. Shwetha and Pradeep have been married for just over three months. Pradeep is making coffee; Shwetha comes out of the bathroom holding a small plastic test strip."
  - who: "shwe"
    t: "ಪ್ರದೀಪ್… ಸ್ವಲ್ಪ ಇಲ್ಲಿ ಬಾ. ಕಾಫಿ ಆಮೇಲೆ."
    tr: "Pradīp… svalpa illi bā. Kāphi āmēle."
    en: "Pradeep… come here a moment. The coffee can wait."
  - who: "pradeep"
    t: "ಏನಾಯ್ತು? ಮುಖ ಯಾಕೆ ಹಾಗಿದೆ? ಹುಷಾರಿಲ್ವಾ?"
    tr: "Ēnāytu? Mukha yāke hāgide? Huṣārilvā?"
    en: "What happened? Why that face? Aren't you feeling well?"
  - who: "shwe"
    t: "ನಾಲ್ಕು ದಿನದಿಂದ ಬೆಳಿಗ್ಗೆ ಎದ್ದ ತಕ್ಷಣ ವಾಕರಿಕೆ ಆಗ್ತಿದೆ. ಪೀರಿಯಡ್ಸ್ ಕೂಡ ಮೂರು ದಿನ ಲೇಟ್. ಅದಕ್ಕೆ ನಿನ್ನೆ ರಾತ್ರಿ ಮೆಡಿಕಲ್ ಶಾಪ್‌ನಿಂದ ಒಂದು ಕಿಟ್ ತಂದಿದ್ದೆ."
    tr: "Nālku dinadinda beḷigge edda takṣaṇa vākarike āgtide. Pīriyaḍs kūḍa mūru dina lēṭ. Adakke ninne rātri meḍikal śāp-ninda ondu kiṭ tandidde."
    en: "For four days I've felt sick the moment I get up. And my period is three days late. So last night I picked up a kit from the pharmacy."
  - who: "pradeep"
    t: "ಕಿಟ್? ಅಂದ್ರೆ… ನೀನು… ರಿಸಲ್ಟ್ ಏನು ಬಂತು?"
    tr: "Kiṭ? Andre… nīnu… risalṭ ēnu bantu?"
    en: "A kit? You mean… you're… what did it say?"
  - who: "shwe"
    t: "ನೋಡು. ಎರಡು ಗೆರೆ. ಎರಡನೇದು ಸ್ವಲ್ಪ ಮಸುಕಾಗಿದೆ, ಆದ್ರೆ ಇದೆ."
    tr: "Nōḍu. Eraḍu gere. Eraḍanēdu svalpa masukāgide, ādre ide."
    en: "Look. Two lines. The second one is a bit faint, but it's there."
  - who: "pradeep"
    t: "ಎರಡು ಗೆರೆ ಅಂದ್ರೆ ಪಾಸಿಟಿವ್ ತಾನೇ? ಡಬ್ಬದ ಮೇಲೆ ಏನು ಬರೆದಿದೆ? ಕೊಡು, ನಾನೇ ಓದ್ತೀನಿ."
    tr: "Eraḍu gere andre pāsiṭiv tānē? Ḍabbada mēle ēnu baredide? Koḍu, nānē ōdtīni."
    en: "Two lines means positive, right? What does it say on the box? Give it here, I'll read it myself."
  - who: "shwe"
    t: "ಮೂರು ಸಲ ಓದಿದೀನಿ. ಎರಡನೇ ಗೆರೆ ಮಸುಕಾಗಿದ್ರೂ ಪಾಸಿಟಿವ್ ಅಂತಾನೇ ಅರ್ಥ ಅಂತ ಬರೆದಿದೆ. ಪ್ರದೀಪ್… ನಾನು ಗರ್ಭಿಣಿ."
    tr: "Mūru sala ōdidīni. Eraḍanē gere masukāgidrū pāsiṭiv antānē artha anta baredide. Pradīp… nānu garbhiṇi."
    en: "I've read it three times. It says even if the second line is faint, it still means positive. Pradeep… I'm pregnant."
  - who: "pradeep"
    t: "ಅಯ್ಯೋ ದೇವ್ರೇ… ಶ್ವೇತಾ… ನಿಜವಾಗ್ಲೂ? ನಾನು… ನಾನು ಅಪ್ಪ ಆಗ್ತೀನಾ?"
    tr: "Ayyō dēvrē… Shwētā… nijavāglū? Nānu… nānu appa āgtīnā?"
    en: "(stunned, quietly) Oh my God… Shwetha… really? I'm… I'm going to be a father?"
  - who: "shwe"
    t: "ಹಾಗೇ ಅನ್ಸುತ್ತೆ. ಆದ್ರೆ ಡಾಕ್ಟ್ರು ಕನ್ಫರ್ಮ್ ಮಾಡೋವರೆಗೂ ಊರಿಗೆಲ್ಲಾ ಹೇಳ್ಬೇಡ. ಕಿಟ್ ಕೆಲವು ಸಲ ತಪ್ಪಾಗಬಹುದು."
    tr: "Hāgē ansutte. Ādre ḍākṭru kanpharm māḍōvaregū ūrigellā hēḷbēḍa. Kiṭ kelavu sala tappāgabahudu."
    en: "Looks like it. But don't tell the whole world until a doctor confirms it. These kits can sometimes be wrong."
  - who: "pradeep"
    t: "ಸರಿ, ಸರಿ. ಆದ್ರೆ ನನ್ ಮುಖ ನೋಡು, ನಾನು ಏನೂ ಮುಚ್ಚಿಡೋಕೆ ಆಗಲ್ಲ. ಇವತ್ತು ಸಂಜೆ ಜಯನಗರಕ್ಕೆ ಊಟಕ್ಕೆ ಹೋಗ್ಬೇಕು. ನಿಮ್ಮಮ್ಮ ಒಂದೇ ನೋಟಕ್ಕೆ ಕಂಡುಹಿಡೀತಾರೆ."
    tr: "Sari, sari. Ādre nan mukha nōḍu, nānu ēnū muchchiḍōke āgalla. Ivattu sanje Jayanagarakke ūṭakke hōgbēku. Nimmamma ondē nōṭakke kaṇḍuhiḍītāre."
    en: "Okay, okay. But look at my face, I can't hide anything. We're going to Jayanagar for dinner tonight. Your mother will work it out with one look."
  - who: "shwe"
    t: "ಹಾಗಾದ್ರೆ ಮನೆಯವರಿಗೆ ಮಾತ್ರ ಹೇಳೋಣ. ಮೂರು ತಿಂಗಳು ಆಗೋವರೆಗೂ ಬೇರೆ ಯಾರಿಗೂ ಬೇಡ. ವಿಮಲಾ ಆಂಟಿಗೆ ಅಂತೂ ಖಂಡಿತ ಬೇಡ."
    tr: "Hāgādre maneyavarige mātra hēḷōṇa. Mūru tingaḷu āgōvaregū bēre yārigū bēḍa. Vimalā āṇṭige antū khaṇḍita bēḍa."
    en: "Then let's tell only the family. Nobody else until three months are up. And definitely not Vimala Aunty."
  - who: "pradeep"
    t: "ಡೀಲ್. ಮೊದಲು ಕ್ಲಿನಿಕ್‌ಗೆ ಫೋನ್ ಮಾಡಿ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ತಗೊಳ್ಳೋಣ. … ಶ್ವೇತಾ, ನಿಂಗೆ ಹೇಗನ್ಸ್ತಿದೆ? ಖುಷಿನಾ, ಭಯನಾ?"
    tr: "Ḍīl. Modalu klinik-ge phōn māḍi apāyiṇṭmeṇṭ tagoḷḷōṇa. … Shwētā, ninge hēganstide? Khuṣinā, bhayanā?"
    en: "Deal. First let's call the clinic and get an appointment. … Shwetha, how do you feel? Happy or scared?"
  - who: "shwe"
    t: "ಎರಡೂ. ಖುಷಿ ಆಗ್ತಿದೆ, ಆದ್ರೆ ಒಳಗೆ ಏನೋ ಗಡಿಬಿಡಿ. ಟೀಮ್, ಡೆಡ್‌ಲೈನ್, ರಾತ್ರಿ ಕಾಲ್‌ಗಳು… ಎಲ್ಲಾ ಹೇಗೆ ಮ್ಯಾನೇಜ್ ಮಾಡ್ತೀನೋ ಗೊತ್ತಿಲ್ಲ."
    tr: "Eraḍū. Khuṣi āgtide, ādre oḷage ēnō gaḍibiḍi. Ṭīm, ḍeḍlain, rātri kāl-gaḷu… ellā hēge myānēj māḍtīnō gottilla."
    en: "Both. I'm happy, but inside it's all a flutter. The team, deadlines, the late-night calls… I don't know how I'll manage it all."
  - who: "pradeep"
    t: "ಒಂದೊಂದೇ ಹೆಜ್ಜೆ. ಮೊದಲು ಕಾಫಿ… ಇರು, ನೀನು ಕಾಫಿ ಕುಡೀಬಹುದಾ? ಅದನ್ನೂ ಡಾಕ್ಟ್ರನ್ನ ಕೇಳ್ಬೇಕು ಅನ್ಸುತ್ತೆ."
    tr: "Ondondē hejje. Modalu kāphi… iru, nīnu kāphi kuḍībahudā? Adannū ḍākṭranna kēḷbēku ansutte."
    en: "One step at a time. First, coffee… wait, are you even allowed coffee? I think we need to ask the doctor that too."
  - who: "shwe"
    t: "ನೋಡು, ಹತ್ತು ನಿಮಿಷ ಆಗಿಲ್ಲ, ಆಗ್ಲೇ ಶುರು ಮಾಡ್ದೆ! ಒಂದು ಕಪ್ ಕುಡಿದ್ರೆ ಏನೂ ಆಗಲ್ಲ. ಕೊಡು ಇಲ್ಲಿ."
    tr: "Nōḍu, hattu nimiṣa āgilla, āglē śuru māḍde! Ondu kap kuḍidre ēnū āgalla. Koḍu illi."
    en: "See? Not even ten minutes and you've already started! One cup won't do anything. Hand it over."

  - section: "😭 Telling the family"
    learn: "family words: tāta, ajji, māva (mother's brother), muttajji (great-grandmother) · tears: kaṇṇalli nīru · -tidīra (you are becoming) · blessing formulas with -ali"
  - scene: "That evening, the Rao house in Jayanagar. Dinner is over. Amma is clearing the plates; Ajji, now 79, sits in her chair with a shawl; Appa, Kiran and Sam are watching cricket."
  - who: "amma"
    t: "ಶ್ವೇತಾ, ನೀನು ಇವತ್ತು ಸರಿಯಾಗಿ ಊಟಾನೇ ಮಾಡ್ಲಿಲ್ಲ. ಹುಳಿ ನೋಡಿದ ತಕ್ಷಣ ಮುಖ ತಿರುಗಿಸಿದೆ. ಏನಾಯ್ತು?"
    tr: "Shwētā, nīnu ivattu sariyāgi ūṭānē māḍlilla. Huḷi nōḍida takṣaṇa mukha tirugiside. Ēnāytu?"
    en: "Shwetha, you hardly ate tonight. You turned your face away the moment you saw the sambar. What's wrong?"
  - who: "shwe"
    t: "ಅಮ್ಮ, ಸ್ವಲ್ಪ ಕೂತ್ಕೋ. ಅಪ್ಪ, ಟಿವಿ ಆಫ್ ಮಾಡ್ತೀಯಾ? ಎಲ್ಲರಿಗೂ ಒಂದು ವಿಷಯ ಹೇಳ್ಬೇಕು."
    tr: "Amma, svalpa kūtkō. Appa, ṭivi āph māḍtīyā? Ellarigū ondu viṣaya hēḷbēku."
    en: "Amma, sit down for a minute. Appa, could you turn off the TV? I need to tell everyone something."
  - who: "kiran"
    t: "ಆಫ್? ಇಂಡಿಯಾ ಗೆಲ್ಲೋಕೆ ಇನ್ನು ಹನ್ನೆರಡು ರನ್ ಬೇಕು, ಅಕ್ಕ!"
    tr: "Āph? Iṇḍiyā gellōke innu hanneraḍu ran bēku, akka!"
    en: "Off? India needs twelve more runs to win, Akka!"
  - who: "appa"
    t: "ಕಿರಣ್. ಆಫ್ ಮಾಡು. … ಹೇಳಮ್ಮ, ಏನು ವಿಷಯ? ಪ್ರದೀಪ್, ಎಲ್ಲಾ ಆರಾಮ ತಾನೇ?"
    tr: "Kiraṇ. Āph māḍu. … Hēḷamma, ēnu viṣaya? Pradīp, ellā ārāma tānē?"
    en: "Kiran. Turn it off. … Tell us, dear, what is it? Pradeep, everything's fine, isn't it?"
  - who: "pradeep"
    t: "ಎಲ್ಲಾ ಆರಾಮ, ಮಾವ. ತುಂಬಾನೇ ಆರಾಮ, ಅನ್ಸುತ್ತೆ."
    tr: "Ellā ārāma, māva. Tumbānē ārāma, ansutte."
    en: "Everything's fine, Uncle. Very fine, actually, I think."
  - who: "shwe"
    t: "ಇವತ್ತು ಬೆಳಿಗ್ಗೆ ಟೆಸ್ಟ್ ಮಾಡಿದೆ. ಪಾಸಿಟಿವ್ ಬಂತು. ಡಾಕ್ಟ್ರ ಹತ್ರ ಇನ್ನೂ ಹೋಗಿಲ್ಲ, ಆದ್ರೆ… ಅಪ್ಪ, ಅಮ್ಮ, ನೀವು ತಾತ-ಅಜ್ಜಿ ಆಗ್ತಿದೀರ."
    tr: "Ivattu beḷigge ṭesṭ māḍide. Pāsiṭiv bantu. Ḍākṭra hatra innū hōgilla, ādre… Appa, Amma, nīvu tāta-ajji āgtidīra."
    en: "I did a test this morning. It came out positive. We haven't seen a doctor yet, but… Appa, Amma, you're going to be grandparents."
  - who: "amma"
    t: "ಏನು? ಶ್ವೇತಾ… ನಿಜಾನಾ? ಅಯ್ಯೋ, ನನ್ ಕಂದ… ನೋಡಿ, ಕಣ್ಣಲ್ಲಿ ನೀರು ತಾನಾಗೇ ಬರ್ತಿದೆ."
    tr: "Ēnu? Shwētā… nijānā? Ayyō, nan kanda… nōḍi, kaṇṇalli nīru tānāgē bartide."
    en: "What? Shwetha… is it true? Oh, my baby… look at me, the tears are just coming on their own."
  - who: "appa"
    t: "ಲಕ್ಷ್ಮಿ, ಒಳ್ಳೆ ಸುದ್ದಿ ಕೇಳಿ ಯಾರಾದ್ರೂ ಅಳ್ತಾರಾ? … ಶ್ವೇತಾ, ಬಾಮ್ಮ ಇಲ್ಲಿ. ತುಂಬಾ ಖುಷಿ ಆಯ್ತು."
    tr: "Lakshmī, oḷḷe suddi kēḷi yārādrū aḷtārā? … Shwētā, bāmma illi. Tumbā khuṣi āytu."
    en: "Lakshmi, who cries at good news? … (his own voice unsteady) Shwetha, come here, dear. I'm so happy."
  - who: "kiran"
    t: "ಒಂದು ನಿಮಿಷ. ಅಂದ್ರೆ ನಾನು… ಮಾವ ಆಗ್ತೀನಾ? ಇಪ್ಪತ್ತು ವರ್ಷಕ್ಕೇ ಮಾವ!"
    tr: "Ondu nimiṣa. Andre nānu… māva āgtīnā? Ippattu varṣakkē māva!"
    en: "Wait a minute. So I'm going to be… an uncle? An uncle at twenty!"
  - who: "sam"
    t: "ಕಂಗ್ರಾಜುಲೇಶನ್ಸ್, ಶ್ವೇತಾ, ಪ್ರದೀಪ್! ನಮ್ಮ ಸ್ವಿಟ್ಜರ್‌ಲ್ಯಾಂಡ್‌ನಲ್ಲಿ ಇಂಥ ಸುದ್ದಿ ಕೇಳಿದ್ರೆ ಷಾಂಪೇನ್ ತೆಗೀತಾರೆ. ಇಲ್ಲಿ ಏನು ಮಾಡ್ತಾರೆ?"
    tr: "Kangrājulēśans, Shwētā, Pradīp! Namma Sviṭjarlyāṇḍ-nalli intha suddi kēḷidre ṣāmpēn tegītāre. Illi ēnu māḍtāre?"
    en: "Congratulations, Shwetha, Pradeep! Back in Switzerland, news like this means opening champagne. What do people do here?"
  - who: "kiran"
    t: "ಇಲ್ಲಿ ಸ್ವೀಟ್ ಹಂಚ್ತಾರೆ. ಆಮೇಲೆ ಎಲ್ಲರೂ ಸಲಹೆ ಕೊಡೋಕೆ ಶುರು ಮಾಡ್ತಾರೆ. ಸ್ವಲ್ಪ ಕಾಯಿರಿ, ಅಜ್ಜಿ ಈಗ ಶುರು ಮಾಡ್ತಾರೆ, ನೋಡಿ."
    tr: "Illi svīṭ hanchtāre. Āmēle ellarū salahe koḍōke śuru māḍtāre. Svalpa kāyiri, ajji īga śuru māḍtāre, nōḍi."
    en: "Here we hand out sweets. Then everyone starts giving advice. Just wait, Ajji's about to begin, watch."

  - section: "👵 Ajji's blessing and Ajji's rules"
    learn: "prohibitions: -abāradu, -bēḍa · uṣṇa (heating) vs tampu (cooling) foods · pappāyi, anānas, grahaṇa (eclipse) · ibbarige tinnu (eat for two) · -ōvaregū"
  - who: "ajji"
    t: "ಶ್ವೇತಾ, ಬಾ ಕಣೇ ಇಲ್ಲಿ, ನನ್ ಹತ್ರ ಕೂತ್ಕೋ. ತಲೆ ಮೇಲೆ ಕೈ ಇಡ್ತೀನಿ. ದೇವರು ನಿನ್ನನ್ನೂ ಮಗೂನೂ ಚೆನ್ನಾಗಿಟ್ಟಿರಲಿ."
    tr: "Shwētā, bā kaṇē illi, nan hatra kūtkō. Tale mēle kai iḍtīni. Dēvaru ninnannū magūnū chennāgiṭṭirali."
    en: "Shwetha, come here, girl, sit by me. Let me put my hand on your head. May God keep you and the baby well."
  - who: "shwe"
    t: "ಅಜ್ಜಿ, ನೀನು ಮುತ್ತಜ್ಜಿ ಆಗ್ತೀಯ, ಗೊತ್ತಾ?"
    tr: "Ajji, nīnu muttajji āgtīya, gottā?"
    en: "Ajji, you're going to be a great-grandmother, you know?"
  - who: "ajji"
    t: "ಮುತ್ತಜ್ಜಿ… ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷ ಬದುಕಿದ್ದಕ್ಕೂ ಸಾರ್ಥಕ ಆಯ್ತು. ಆ ಮಗೂನ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ. ಈಗ್ಲೇ ಹೇಳಿಬಿಡ್ತೀನಿ."
    tr: "Muttajji… eppattombattu varṣa badukiddakkū sārthaka āytu. Ā magūna kaiyalli ettikoḷḷōvaregū nānu ellū hōgalla. Īglē hēḷibiḍtīni."
    en: "A great-grandmother… seventy-nine years of living have been worth it. I'm not going anywhere until I've held that baby in my arms. I'm telling you that right now."
  - who: "amma"
    t: "ಅಮ್ಮ, ಆ ಮಾತು ಯಾಕೆ ಈಗ? ಇವತ್ತು ಒಳ್ಳೆ ದಿನ."
    tr: "Amma, ā mātu yāke īga? Ivattu oḷḷe dina."
    en: "Amma, why talk like that now? Today is a good day."
  - who: "ajji"
    t: "ಸರಿ, ಸರಿ. ಈಗ ಕೇಳು ಶ್ವೇತಾ. ಇವತ್ತಿಂದ ಪಪ್ಪಾಯಿ ಮುಟ್ಟಬಾರದು. ಅನಾನಸ್ ಕೂಡ ಬೇಡ. ಎರಡೂ ಉಷ್ಣ, ಹೊಟ್ಟೇಲಿರೋ ಮಗೂಗೆ ಒಳ್ಳೇದಲ್ಲ."
    tr: "Sari, sari. Īga kēḷu Shwētā. Ivattinda pappāyi muṭṭabāradu. Anānas kūḍa bēḍa. Eraḍū uṣṇa, hoṭṭēlirō magūge oḷḷēdalla."
    en: "All right, all right. Now listen, Shwetha. From today, you're not to touch papaya. No pineapple either. Both are heating; they're not good for the baby in your belly."
  - who: "ajji"
    t: "ಇನ್ನೊಂದು. ಈಗ ನೀನು ಒಬ್ಬಳಲ್ಲ, ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು. ದಿನಾ ತುಪ್ಪ, ಹಾಲು, ನೆನೆಸಿದ ಬಾದಾಮಿ. ಮತ್ತೆ ಈ ಒಂಬತ್ತು ತಿಂಗಳಲ್ಲಿ ಯಾವಾಗ ಗ್ರಹಣ ಬಂದ್ರೂ, ಆವತ್ತು ಹೊರಗೆ ಕಾಲು ಇಡಬಾರದು, ಚಾಕು ಹಿಡಿದು ಏನೂ ಕತ್ತರಿಸಬಾರದು."
    tr: "Innondu. Īga nīnu obbaḷalla, ibbarige tinnabēku. Dinā tuppa, hālu, neneside bādāmi. Matte ī ombattu tingaḷalli yāvāga grahaṇa bandrū, āvattu horage kālu iḍabāradu, chāku hiḍidu ēnū kattarisabāradu."
    en: "Another thing. You're not one person now, you have to eat for two. Ghee, milk and soaked almonds every day. And whenever there's an eclipse in these nine months, that day you mustn't set foot outside, and you mustn't pick up a knife and cut anything."
  - who: "sam"
    t: "ಅಜ್ಜಿ, ಒಂದು ಪ್ರಶ್ನೆ. ಉಷ್ಣ ಅಂದ್ರೆ ಬಿಸಿ ಅಂತಾನಾ? ಪಪ್ಪಾಯಿ ಫ್ರಿಜ್‌ನಿಂದ ತೆಗೆದ್ರೆ ತಣ್ಣಗೇ ಇರುತ್ತಲ್ಲ."
    tr: "Ajji, ondu praśne. Uṣṇa andre bisi antānā? Pappāyi phrij-ninda tegedre taṇṇagē iruttalla."
    en: "Ajji, one question. Does “heating” mean hot? Papaya straight from the fridge is cold."
  - who: "ajji"
    t: "ಅಯ್ಯೋ ಸ್ಯಾಮ್, ಮುಟ್ಟಿದಾಗ ಬಿಸಿ ಅಂತಲ್ಲ. ತಿಂದ ಮೇಲೆ ಮೈಯಲ್ಲಿ ಉಷ್ಣ ಆಗುತ್ತೆ. ಮಜ್ಜಿಗೆ, ಎಳನೀರು ತಂಪು. ನಿಮ್ ದೇಶದಲ್ಲಿ ಇದೆಲ್ಲಾ ಯಾರೂ ಹೇಳಲ್ವಾ?"
    tr: "Ayyō Sām, muṭṭidāga bisi antalla. Tinda mēle maiyalli uṣṇa āgutte. Majjige, eḷanīru tampu. Nim dēśadalli idellā yārū hēḷalvā?"
    en: "Oh, Sam, not hot to the touch. It makes heat in the body after you eat it. Buttermilk and tender coconut are cooling. Doesn't anyone tell you these things in your country?"
  - who: "sam"
    t: "ನಮ್ಮಲ್ಲಿ ಡಾಕ್ಟ್ರು ಹೇಳ್ತಾರೆ, ಅಜ್ಜಿ ಅಲ್ಲ. ಹಸಿ ಹಾಲಿನ ಚೀಸ್ ತಿನ್ನಬಾರದು, ವೈನ್ ಕುಡೀಬಾರದು, ಅಂತ."
    tr: "Nammalli ḍākṭru hēḷtāre, ajji alla. Hasi hālina chīs tinnabāradu, vain kuḍībāradu, anta."
    en: "Back home the doctor tells you, not the grandmother. Don't eat raw-milk cheese, don't drink wine, that sort of thing."
  - who: "shwe"
    t: "ಅಜ್ಜಿ, ನೀನು ಹೇಳಿದ್ದೆಲ್ಲಾ ಫೋನ್‌ನಲ್ಲಿ ಬರ್ಕೊಂಡಿದೀನಿ. ಡಾಕ್ಟ್ರನ್ನ ಒಂದೊಂದಾಗಿ ಕೇಳ್ತೀನಿ. ಅವರು ಓಕೆ ಅಂದ್ರೆ ನಿನ್ ಮಾತು, ಬೇಡ ಅಂದ್ರೆ ಅವರ ಮಾತು. ಸರಿನಾ?"
    tr: "Ajji, nīnu hēḷiddellā phōn-nalli barkoṇḍidīni. Ḍākṭranna ondondāgi kēḷtīni. Avaru ōke andre nin mātu, bēḍa andre avara mātu. Sarinā?"
    en: "Ajji, I've noted everything you said on my phone. I'll ask the doctor one by one. If she says okay, your word goes; if she says no, hers does. Deal?"
  - who: "ajji"
    t: "ನೋಡಿದ್ಯಾ ಲಕ್ಷ್ಮಿ, ಈಗಿನ ಹುಡುಗೀರು! ಅಜ್ಜಿ ಮಾತಿಗೂ ಸೆಕೆಂಡ್ ಒಪೀನಿಯನ್. … ಆಯ್ತು ಕಣೇ, ಡಾಕ್ಟ್ರನ್ನೇ ಕೇಳು. ಆದ್ರೆ ಗ್ರಹಣದ ವಿಷಯದಲ್ಲಿ ಮಾತ್ರ ನನ್ ಮಾತು ಕೇಳು."
    tr: "Nōḍidyā Lakshmī, īgina huḍugīru! Ajji mātigū sekeṇḍ opīniyan. … Āytu kaṇē, ḍākṭrannē kēḷu. Ādre grahaṇada viṣayadalli mātra nan mātu kēḷu."
    en: "Did you see that, Lakshmi? Girls these days! Even Grandma's word needs a second opinion. … Fine, girl, ask the doctor. But on the eclipse, at least, listen to me."
  - who: "amma"
    t: "ಶ್ವೇತಾ, ನಿನ್ ಅತ್ತೆ-ಮಾವನಿಗೆ ಹೇಳಿದ್ರಾ? ಅವರಿಗೂ ಬೇಗ ಹೇಳ್ಬೇಕು. ನಮಗೆ ಮೊದಲು ಹೇಳಿದ್ರಿ ಅಂತ ಗೊತ್ತಾದ್ರೆ ಅವರಿಗೆ ಬೇಜಾರಾಗುತ್ತೆ."
    tr: "Shwētā, nin atte-māvanige hēḷidrā? Avarigū bēga hēḷbēku. Namage modalu hēḷidri anta gottādre avarige bējārāgutte."
    en: "Shwetha, have you told your in-laws? They need to hear soon too. If they find out you told us first, they'll be hurt."
  - who: "pradeep"
    t: "ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಫೋನ್ ಮಾಡ್ತೀವಿ, ಅತ್ತೆ. ನಿಜ ಹೇಳ್ಬೇಕು ಅಂದ್ರೆ… ಅಮ್ಮ ಹೇಗೆ ರಿಯಾಕ್ಟ್ ಮಾಡ್ತಾರೋ ಅಂತ ನನಗೆ ಸ್ವಲ್ಪ ಟೆನ್ಶನ್."
    tr: "Nāḷe beḷigge phōn māḍtīvi, atte. Nija hēḷbēku andre… amma hēge riyākṭ māḍtārō anta nanage svalpa ṭenśan."
    en: "We'll call tomorrow morning, Aunty. To be honest… I'm a bit nervous about how my mother will react."
  - who: "appa"
    t: "ಟೆನ್ಶನ್ ಯಾಕೆ? ಹಳೇದೆಲ್ಲಾ ಮುಗೀತು. ಈ ಮಗು ಬರ್ತಿರೋದು ಎರಡೂ ಮನೆಗೆ. ಧೈರ್ಯವಾಗಿ ಹೇಳು."
    tr: "Ṭenśan yāke? Haḷēdellā mugītu. Ī magu bartirōdu eraḍū manege. Dhairyavāgi hēḷu."
    en: "Why nervous? The old business is over. This baby is coming to both houses. Tell them with confidence."

  - section: "☎️ Sumitra's careful call"
    learn: "careful phone politeness · hesitations and half-sentences · blessing: huḍuga āgli, huḍugi āgli, ārōgyavāgirli · apology vocabulary: tappāytu, bējāru, saṅkōcha"
  - scene: "Sunday morning, 8 March. Back in the JP Nagar flat, Pradeep calls his parents on speaker. His mother picks up on the first ring."
  - who: "sumitra"
    t: "ಹಲೋ, ಪ್ರದೀಪ? ಇಷ್ಟು ಬೆಳಿಗ್ಗೆ ಫೋನ್? ಎಲ್ಲಾ ಸರಿ ತಾನೇ? ಶ್ವೇತಾ ಹೇಗಿದ್ದಾಳೆ?"
    tr: "Halō, Pradīpa? Iṣṭu beḷigge phōn? Ellā sari tānē? Shwētā hēgiddāḷe?"
    en: "Hello, Pradeep? A call this early? Is everything all right? How is Shwetha?"
  - who: "pradeep"
    t: "ಎಲ್ಲಾ ಸರಿ, ಅಮ್ಮ. ಸ್ಪೀಕರ್‌ನಲ್ಲಿದ್ದೀಯ, ಶ್ವೇತಾನೂ ಇಲ್ಲೇ ಇದ್ದಾಳೆ. ಅಪ್ಪನ್ನೂ ಕರಿ, ಒಂದು ವಿಷಯ ಹೇಳ್ಬೇಕು."
    tr: "Ellā sari, amma. Spīkar-nalliddīya, Shwētānū illē iddāḷe. Appannū kari, ondu viṣaya hēḷbēku."
    en: "Everything's fine, Amma. You're on speaker; Shwetha is right here. Call Appa too, we have something to tell you."
  - who: "shankar"
    t: "ಹೇಳಪ್ಪ, ನಾನೂ ಇಲ್ಲೇ ಇದ್ದೀನಿ."
    tr: "Hēḷappa, nānū illē iddīni."
    en: "Go on, son, I'm here too."
  - who: "shwe"
    t: "ನಮಸ್ಕಾರ ಅತ್ತೆ, ನಮಸ್ಕಾರ ಮಾವ. … ನಾವು ಅಪ್ಪ-ಅಮ್ಮ ಆಗ್ತಿದೀವಿ. ನಿನ್ನೆ ಟೆಸ್ಟ್ ಮಾಡಿದೆ. ಡಾಕ್ಟ್ರು ಎರಡು ವಾರ ಬಿಟ್ಟು ಸ್ಕ್ಯಾನ್‌ಗೆ ಬನ್ನಿ ಅಂದಿದಾರೆ."
    tr: "Namaskāra atte, namaskāra māva. … Nāvu appa-amma āgtidīvi. Ninne ṭesṭ māḍide. Ḍākṭru eraḍu vāra biṭṭu skyān-ge banni andidāre."
    en: "Hello, Atte, hello, Mava. … We're going to be parents. I did the test yesterday. The clinic told us to come for a scan in two weeks."
  - who: "sumitra"
    t: "…ಶ್ವೇತಾ… ತುಂಬಾ ಸಂತೋಷ ಆಯ್ತಮ್ಮ. ದೇವರು ಒಳ್ಳೇದು ಮಾಡ್ಲಿ. ಹುಡುಗ ಆಗ್ಲಿ, ಹುಡುಗಿ ಆಗ್ಲಿ, ಆರೋಗ್ಯವಾಗಿರ್ಲಿ. ಅಷ್ಟೇ ಸಾಕು."
    tr: "…Shwētā… tumbā santōṣa āytamma. Dēvaru oḷḷēdu māḍli. Huḍuga āgli, huḍugi āgli, ārōgyavāgirli. Aṣṭē sāku."
    en: "(after a silence, softly) …Shwetha… I'm so happy, dear. May God bless you. Boy or girl, let it be healthy. That's all we need."
  - who: "sumitra"
    t: "ನಿಮ್ಮ ಅಪ್ಪ-ಅಮ್ಮನಿಗೆ ಹೇಳಿದ್ರಾ? ಅವರು… ನಮ್ಮ ಬಗ್ಗೆ ಏನಾದ್ರೂ ಅಂದ್ರಾ?"
    tr: "Nimma appa-ammanige hēḷidrā? Avaru… namma bagge ēnādrū andrā?"
    en: "Have you told your parents? Did they… say anything about us?"
  - who: "shwe"
    t: "ನಿನ್ನೆ ಹೇಳಿದ್ವಿ. ಅಮ್ಮನೇ ಮೊದಲು “ಅತ್ತೆ-ಮಾವನಿಗೆ ಹೇಳಿದ್ರಾ?” ಅಂತ ಕೇಳಿದ್ರು."
    tr: "Ninne hēḷidvi. Ammanē modalu “atte-māvanige hēḷidrā?” anta kēḷidru."
    en: "We told them yesterday. Amma was the first to ask, “Have you told your in-laws?”"
  - who: "sumitra"
    t: "ಹೌದಾ… ಲಕ್ಷ್ಮಿ ಅವರದ್ದು ದೊಡ್ಡ ಮನಸ್ಸು. ಅವತ್ತು ನಾವು ನಿಮ್ಮ ಮನೆಯಲ್ಲಿ ನಡ್ಕೊಂಡ ರೀತಿ… ಇಲ್ಲ, ಅದನ್ನ ಫೋನ್‌ನಲ್ಲಿ ಹೇಳೋದಲ್ಲ. ಅವರ ಎದುರಿಗೇ ಹೇಳ್ಬೇಕು."
    tr: "Haudā… Lakshmī avaraddu doḍḍa manassu. Avattu nāvu nimma maneyalli naḍkoṇḍa rīti… illa, adanna phōn-nalli hēḷōdalla. Avara edurigē hēḷbēku."
    en: "Really… Lakshmi has a big heart. The way we behaved in your house that day… no, that's not something to say over the phone. I need to say it to her face."
  - who: "shankar"
    t: "ಶ್ವೇತಾ, ಮಗಳೇ. ನಮ್ಮಿಂದ ಏನು ಬೇಕಾದ್ರೂ ಕೇಳು. ಆಸ್ಪತ್ರೆ, ಓಡಾಟ, ಯಾವುದಕ್ಕೂ ಸಂಕೋಚ ಪಡ್ಬೇಡ."
    tr: "Shwētā, magaḷē. Namminda ēnu bēkādrū kēḷu. Āspatre, ōḍāṭa, yāvudakkū saṅkōcha paḍbēḍa."
    en: "Shwetha, my girl. Ask us for anything. Hospital, running around, anything at all; don't hesitate."
  - who: "shwe"
    t: "ಥ್ಯಾಂಕ್ಸ್ ಮಾವ. ಸದ್ಯಕ್ಕೆ ನಿಮ್ಮ ಆಶೀರ್ವಾದ ಸಾಕು."
    tr: "Thyāṅks māva. Sadyakke nimma āśīrvāda sāku."
    en: "Thank you, Mava. For now, your blessings are enough."
  - who: "sumitra"
    t: "ಒಂದು ಮಾತು, ಕಣಮ್ಮ. ನಾನು ಹಳೇ ಕಾಲದವಳು, ಏನೇನೋ ಹೇಳ್ಬೇಕು ಅನ್ಸುತ್ತೆ. ನಾನು ಹೇಳಿದ್ದು ನಿಂಗೆ ಇಷ್ಟ ಆಗ್ಲಿಲ್ಲ ಅಂದ್ರೆ ಮುಖಕ್ಕೇ ಹೇಳಿಬಿಡು. ನಾನು ಬೇಜಾರು ಮಾಡ್ಕೊಳ್ಳಲ್ಲ."
    tr: "Ondu mātu, kaṇamma. Nānu haḷē kāladavaḷu, ēnēnō hēḷbēku ansutte. Nānu hēḷiddu ninge iṣṭa āglilla andre mukhakkē hēḷibiḍu. Nānu bējāru māḍkoḷḷalla."
    en: "One thing, dear. I'm from the old days; I'll feel like saying all sorts of things. If you don't like something I say, tell me straight to my face. I won't take offence."
  - who: "shwe"
    t: "ಅತ್ತೆ, ಅಜ್ಜಿ ಆಗ್ಲೇ ಪಪ್ಪಾಯಿ ನಿಷೇಧ ಮಾಡಿದಾರೆ. ನೀವೂ ಒಂದು ಲಿಸ್ಟ್ ಕಳ್ಸಿ, ಎರಡನ್ನೂ ಡಾಕ್ಟ್ರಿಗೆ ಒಟ್ಟಿಗೆ ತೋರಿಸ್ತೀನಿ."
    tr: "Atte, ajji āglē pappāyi niṣēdha māḍidāre. Nīvū ondu lisṭ kaḷsi, eraḍannū ḍākṭrige oṭṭige tōristīni."
    en: "Atte, Ajji has already banned papaya. Send me your list too; I'll show both to the doctor together."
  - who: "sumitra"
    t: "ನನ್ ಲಿಸ್ಟ್ ಚಿಕ್ಕದು, ಕಣಮ್ಮ. ಹೊತ್ತು ಹೊತ್ತಿಗೆ ಊಟ, ಒಳ್ಳೆ ನಿದ್ದೆ, ಮನಸ್ಸಿಗೆ ಟೆನ್ಶನ್ ಇಲ್ಲದೆ ಇರೋದು. ಅಷ್ಟೇ."
    tr: "Nan lisṭ chikkadu, kaṇamma. Hottu hottige ūṭa, oḷḷe nidde, manassige ṭenśan illade irōdu. Aṣṭē."
    en: "(laughing a little) My list is short, dear. Meals on time, good sleep, and no stress on your mind. That's all."

  - section: "🩺 First visit to Dr. Usha Rao"
    learn: "the doctor's grammar: -bēku, -bāradu, tagōbēḍi · weeks and dates: āru vāra, ḍyū ḍēṭ, -inda … -ra oḷage · causative māḍisi (get it done) · warning signs with -idre / -ādre · garbhakōśa, heppu, mātre, chīṭi"
  - scene: "Thursday, 19 March. A gynaecology clinic in JP Nagar. Dr. Usha Rao, in her fifties, has just done a quick ultrasound and taken Shwetha's blood pressure. Pradeep sits beside Shwetha with a notebook open."
  - who: "gyn"
    t: "ಕಂಗ್ರಾಜುಲೇಶನ್ಸ್, ಶ್ವೇತಾ. ಸ್ಕ್ಯಾನ್‌ನಲ್ಲಿ ಎಲ್ಲಾ ಚೆನ್ನಾಗಿ ಕಾಣ್ತಿದೆ. ಒಂದೇ ಮಗು, ಗರ್ಭಕೋಶದ ಒಳಗೇ ಇದೆ, ಹಾರ್ಟ್‌ಬೀಟ್ ಕೂಡ ಬಂದಿದೆ. ಈಗ ನಿಮಗೆ ಆರು ವಾರ."
    tr: "Kangrājulēśans, Shwētā. Skyān-nalli ellā chennāgi kāṇtide. Ondē magu, garbhakōśada oḷagē ide, hārṭbīṭ kūḍa bandide. Īga nimage āru vāra."
    en: "Congratulations, Shwetha. Everything looks good on the scan. A single baby, inside the uterus where it should be, and there's already a heartbeat. You're six weeks along."
  - who: "shwe"
    t: "ಹಾರ್ಟ್‌ಬೀಟ್? ಇಷ್ಟು ಬೇಗ? ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿ ಆ ಚಿಕ್ಕ ಚುಕ್ಕೆ ಮಿನುಗ್ತಾ ಇತ್ತಲ್ಲ, ಅದೇನಾ?"
    tr: "Hārṭbīṭ? Iṣṭu bēga? Skrīn-nalli ā chikka chukke minugtā ittalla, adēnā?"
    en: "A heartbeat? So soon? That little dot flickering on the screen, was that it?"
  - who: "gyn"
    t: "ಹೌದು, ಅದೇ. ನೀವು ಫೋನ್ ಮಾಡಿದಾಗ ನಮ್ ರಿಸೆಪ್ಶನ್‌ನವರು ಎರಡು ವಾರ ಕಾಯಿರಿ ಅಂತ ಯಾಕೆ ಹೇಳಿದ್ರು ಅಂತ ಈಗ ಗೊತ್ತಾಯ್ತಾ? ಆರು ವಾರಕ್ಕಿಂತ ಮುಂಚೆ ಹಾರ್ಟ್‌ಬೀಟ್ ಸರಿಯಾಗಿ ಕಾಣಿಸಲ್ಲ, ಸುಮ್ಮನೆ ಟೆನ್ಶನ್ ಆಗುತ್ತೆ."
    tr: "Haudu, adē. Nīvu phōn māḍidāga nam risepśan-navaru eraḍu vāra kāyiri anta yāke hēḷidru anta īga gottāytā? Āru vārakkinta munche hārṭbīṭ sariyāgi kāṇisalla, summane ṭenśan āgutte."
    en: "Yes, that's it. Now you know why our reception told you to wait two weeks when you called? Before six weeks the heartbeat often doesn't show clearly, and people panic for nothing."
  - who: "pradeep"
    t: "ಡಾಕ್ಟ್ರೇ, ಡ್ಯೂ ಡೇಟ್ ಯಾವಾಗ ಅಂತ ಹೇಳ್ಬಹುದಾ?"
    tr: "Ḍākṭrē, ḍyū ḍēṭ yāvāga anta hēḷbahudā?"
    en: "Doctor, can you tell us when the due date is?"
  - who: "gyn"
    t: "ಕೊನೆಯ ಪೀರಿಯಡ್ ಶುರು ಆಗಿದ್ದು ಫೆಬ್ರವರಿ ಮೂರು ಅಂದ್ರಿ. ಅದರಿಂದ ಲೆಕ್ಕ ಹಾಕಿದ್ರೆ ಡ್ಯೂ ಡೇಟ್ ನವೆಂಬರ್ ಹತ್ತು. ಆದ್ರೆ ಅದೇ ದಿನ ಡೆಲಿವರಿ ಆಗುತ್ತೆ ಅಂತಲ್ಲ. ಎರಡು ವಾರ ಮುಂಚೆನೂ ಆಗಬಹುದು, ಒಂದು ವಾರ ಆಮೇಲೂ ಆಗಬಹುದು."
    tr: "Koneya pīriyaḍ śuru āgiddu Pebravari mūru andri. Adarinda lekka hākidre ḍyū ḍēṭ Navembar hattu. Ādre adē dina ḍelivari āgutte antalla. Eraḍu vāra munchenū āgabahudu, ondu vāra āmēlū āgabahudu."
    en: "You said your last period started on the third of February. Counting from that, the due date is the tenth of November. But that doesn't mean the baby comes that day. It could be two weeks earlier, or a week later."
  - who: "shwe"
    t: "ನವೆಂಬರ್… ದೀಪಾವಳಿ ಹತ್ರ. ಸರಿ ಡಾಕ್ಟ್ರೇ, ಈಗ ನಾನು ಏನೇನು ಮಾಡ್ಬೇಕು?"
    tr: "Navembar… Dīpāvaḷi hatra. Sari ḍākṭrē, īga nānu ēnēnu māḍbēku?"
    en: "November… close to Deepavali. All right, Doctor, what do I need to do now?"
  - who: "gyn"
    t: "ಮೊದಲು ಮಾತ್ರೆ. ಫೋಲಿಕ್ ಆಸಿಡ್ ದಿನಾ ಒಂದು. ಮೂರು ತಿಂಗಳು ಮುಗಿಯೋವರೆಗೂ ಒಂದು ದಿನಾನೂ ತಪ್ಪಿಸಬಾರದು. ಮಗುವಿನ ಮೆದುಳು, ಬೆನ್ನುಹುರಿ ಸರಿಯಾಗಿ ಬೆಳೆಯೋಕೆ ಇದು ತುಂಬಾ ಮುಖ್ಯ."
    tr: "Modalu mātre. Phōlik āsiḍ dinā ondu. Mūru tingaḷu mugiyōvaregū ondu dinānū tappisabāradu. Maguvina meduḷu, bennuhuri sariyāgi beḷeyōke idu tumbā mukhya."
    en: "First, tablets. Folic acid, one a day. Don't miss a single day until the first three months are over. It's very important for the baby's brain and spinal cord to develop properly."
  - who: "gyn"
    t: "ನಾಲ್ಕನೇ ತಿಂಗಳಿಂದ ಐರನ್, ಕ್ಯಾಲ್ಸಿಯಂ ಮಾತ್ರೆ ಶುರು ಮಾಡ್ತೀವಿ. ಒಂದು ವಿಷಯ ಈಗ್ಲೇ ಬರ್ಕೊಳ್ಳಿ: ಐರನ್, ಕ್ಯಾಲ್ಸಿಯಂ ಎರಡೂ ಒಟ್ಟಿಗೆ ತಗೋಬಾರದು. ಒಂದು ಬೆಳಿಗ್ಗೆ, ಇನ್ನೊಂದು ರಾತ್ರಿ."
    tr: "Nālkanē tingaḷinda airan, kyālsiyam mātre śuru māḍtīvi. Ondu viṣaya īglē barkoḷḷi: airan, kyālsiyam eraḍū oṭṭige tagōbāradu. Ondu beḷigge, innondu rātri."
    en: "From the fourth month we'll start iron and calcium tablets. Write one thing down now: never take iron and calcium together. One in the morning, the other at night."
  - who: "pradeep"
    t: "ಬರ್ಕೊಂಡೆ. ಐರನ್ ಬೆಳಿಗ್ಗೆ, ಕ್ಯಾಲ್ಸಿಯಂ ರಾತ್ರಿ. ಊಟಕ್ಕೆ ಮುಂಚೆನಾ, ಊಟ ಆದ್ಮೇಲಾ?"
    tr: "Barkoṇḍe. Airan beḷigge, kyālsiyam rātri. Ūṭakke munchenā, ūṭa ādmēlā?"
    en: "Got it. Iron in the morning, calcium at night. Before food or after?"
  - who: "gyn"
    t: "ಅದನ್ನ ಮಾತ್ರೆ ಬರೆದು ಕೊಡುವಾಗ ಚೀಟಿಯಲ್ಲೇ ಬರೀತೀನಿ. ಈಗ ಟೆಸ್ಟ್‌ಗಳು. ಇವತ್ತೇ ಬ್ಲಡ್ ಟೆಸ್ಟ್ ಮಾಡಿಸಿ: ಹೀಮೋಗ್ಲೋಬಿನ್, ಬ್ಲಡ್ ಗ್ರೂಪ್, ಶುಗರ್, ಥೈರಾಯ್ಡ್, ಎಚ್‌ಐವಿ, ಹೆಪಟೈಟಿಸ್ ಬಿ, ಜೊತೆಗೆ ಯೂರಿನ್ ಟೆಸ್ಟ್. ಇದೆಲ್ಲಾ ರೂಟೀನ್, ಎಲ್ಲಾ ಗರ್ಭಿಣಿಯರಿಗೂ ಮಾಡ್ತೀವಿ. ಭಯ ಪಡ್ಬೇಡಿ."
    tr: "Adanna mātre baredu koḍuvāga chīṭiyallē barītīni. Īga ṭesṭ-gaḷu. Ivattē blaḍ ṭesṭ māḍisi: hīmōglōbin, blaḍ grūp, śugar, thairāyḍ, ech-ai-vi, hepaṭaiṭis bi, jotege yūrin ṭesṭ. Idellā rūṭīn, ellā garbhiṇiyarigū māḍtīvi. Bhaya paḍbēḍi."
    en: "I'll write that on the prescription when I give you the tablets. Now, tests. Get your blood tests done today: haemoglobin, blood group, sugar, thyroid, HIV, hepatitis B, plus a urine test. It's all routine; we do it for every pregnant woman. Don't be alarmed."
  - who: "shwe"
    t: "ಎಚ್‌ಐವಿ ಕೂಡ? … ಸರಿ. ಬಿಪಿ ಎಷ್ಟಿತ್ತು ಡಾಕ್ಟ್ರೇ?"
    tr: "Ech-ai-vi kūḍa? … Sari. Bi-pi eṣṭittu ḍākṭrē?"
    en: "HIV too? … Okay. What was my BP, Doctor?"
  - who: "gyn"
    t: "ನೂರಾ ಹತ್ತು ಬೈ ಎಪ್ಪತ್ತು, ಚೆನ್ನಾಗಿದೆ. ತೂಕ ಐವತ್ತೆಂಟು ಕೆಜಿ. ಪ್ರತಿ ಸಲ ಬಂದಾಗ ಬಿಪಿ, ತೂಕ ಎರಡೂ ನೋಡ್ತೀವಿ. ಪ್ರೆಗ್ನೆನ್ಸಿಯಲ್ಲಿ ಬಿಪಿ ಜಾಸ್ತಿ ಆದ್ರೆ ಅಮ್ಮನಿಗೂ ಮಗುವಿಗೂ ರಿಸ್ಕ್."
    tr: "Nūrā hattu bai eppattu, chennāgide. Tūka aivatteṇṭu keji. Prati sala bandāga bi-pi, tūka eraḍū nōḍtīvi. Pregnensiyalli bi-pi jāsti ādre ammanigū maguvigū risk."
    en: "A hundred and ten over seventy. That's good. Weight, fifty-eight kilos. We'll check both BP and weight at every visit. If BP goes up in pregnancy, it's a risk for both mother and baby."
  - who: "gyn"
    t: "ಇನ್ನೊಂದು ವಿಷಯ. ನಿಮ್ಮ ಪ್ರೆಗ್ನೆನ್ಸಿನ ಸರ್ಕಾರದ ಸಿಸ್ಟಮ್‌ನಲ್ಲೂ ರಿಜಿಸ್ಟರ್ ಮಾಡಿಸ್ಬೇಕು. ಅದಕ್ಕೆ ಎಎನ್‌ಸಿ ರಿಜಿಸ್ಟ್ರೇಶನ್ ಅಂತಾರೆ. ಹತ್ತಿರದ ಹೆಲ್ತ್ ಸೆಂಟರ್‌ನಲ್ಲಿ ತಾಯಿ ಕಾರ್ಡ್ ಕೊಡ್ತಾರೆ. ಎಲ್ಲಾ ಚೆಕಪ್, ಇಂಜೆಕ್ಷನ್ ಅದರಲ್ಲಿ ದಾಖಲಾಗುತ್ತೆ."
    tr: "Innondu viṣaya. Nimma pregnensina sarkārada sisṭam-nallū rijisṭar māḍisbēku. Adakke e-en-si rijisṭrēśan antāre. Hattirada helth seṇṭar-nalli tāyi kārḍ koḍtāre. Ellā chekap, injekṣan adaralli dākhalāgutte."
    en: "One more thing. Your pregnancy should also be registered in the government system. That's called ANC registration. The nearest health centre gives you a Thayi card, the mother card. Every check-up and injection gets recorded in it."
  - who: "shwe"
    t: "ತಾಯಿ ಕಾರ್ಡ್? ನಾವು ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ ತೋರಿಸ್ತಿದೀವಲ್ಲ, ಅದು ನಮಗೂ ಬೇಕಾ?"
    tr: "Tāyi kārḍ? Nāvu praivēṭ-nalli tōristidīvalla, adu namagū bēkā?"
    en: "A Thayi card? We're seeing a private doctor, do we need it too?"
  - who: "gyn"
    t: "ಮಾಡಿಸ್ಕೊಳ್ಳಿ ಅಂತ ನಾನು ಹೇಳ್ತೀನಿ. ನಂಬರ್ ಸಿಗುತ್ತೆ, ನಿಮ್ಮ ಚೆಕಪ್, ಮುಂದೆ ಮಗುವಿನ ವ್ಯಾಕ್ಸಿನ್ ದಾಖಲೆ ಎಲ್ಲಾ ಒಂದೇ ಕಡೆ ಇರುತ್ತೆ. ಟಿಡಿ ಇಂಜೆಕ್ಷನ್ ಮೊದಲ ಡೋಸ್ ಕೂಡ ಅಲ್ಲೇ ಹಾಕಿಸ್ಕೊಳ್ಳಬಹುದು. ಇಲ್ಲಾಂದ್ರೆ ನಾನೇ ಹಾಕ್ತೀನಿ."
    tr: "Māḍiskoḷḷi anta nānu hēḷtīni. Nambar sigutte, nimma chekap, munde maguvina vyāksin dākhale ellā ondē kaḍe irutte. Ṭi-ḍi injekṣan modala ḍōs kūḍa allē hākiskoḷḷabahudu. Illāndre nānē hāktīni."
    en: "My advice is to get it. You get a number, and your check-ups and later the baby's vaccination record are all in one place. You can get the first Td injection there as well. Otherwise I'll give it here."
  - who: "gyn"
    t: "ಮುಂದಿನ ದೊಡ್ಡ ಹೆಜ್ಜೆ ಎನ್‌ಟಿ ಸ್ಕ್ಯಾನ್. ಹನ್ನೊಂದರಿಂದ ಹದಿನಾಲ್ಕು ವಾರದ ಒಳಗೆ ಮಾಡಿಸ್ಬೇಕು. ನಿಮಗೆ ಏಪ್ರಿಲ್ ಕೊನೆ ವಾರ ಸರಿ ಆಗುತ್ತೆ. ಅದರ ಜೊತೆ ಡಬಲ್ ಮಾರ್ಕರ್ ಅನ್ನೋ ಬ್ಲಡ್ ಟೆಸ್ಟ್. ಡೌನ್ ಸಿಂಡ್ರೋಮ್ ತರಹದ ತೊಂದರೆಗಳ ರಿಸ್ಕ್ ಎಷ್ಟಿದೆ ಅಂತ ಅದರಲ್ಲಿ ಗೊತ್ತಾಗುತ್ತೆ."
    tr: "Mundina doḍḍa hejje en-ṭi skyān. Hannondarinda hadinālku vārada oḷage māḍisbēku. Nimage Ēpril kone vāra sari āgutte. Adara jote ḍabal mārkar annō blaḍ ṭesṭ. Ḍaun sinḍrōm tarahada tondaregaḷa risk eṣṭide anta adaralli gottāgutte."
    en: "The next big step is the NT scan. It has to be done between eleven and fourteen weeks; for you, the last week of April will be right. Along with it, a blood test called the double marker. Together they show how high the risk is of problems like Down syndrome."
  - who: "shwe"
    t: "ಡಾಕ್ಟ್ರೇ, ನಮ್ಮಜ್ಜಿ ಒಂದು ಲಿಸ್ಟ್ ಕೊಟ್ಟಿದಾರೆ. ಪಪ್ಪಾಯಿ, ಅನಾನಸ್ ತಿನ್ನಬಾರದು, ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು, ಗ್ರಹಣದ ದಿನ ಹೊರಗೆ ಹೋಗಬಾರದು… ಇದರಲ್ಲಿ ಎಷ್ಟು ನಿಜ?"
    tr: "Ḍākṭrē, nammajji ondu lisṭ koṭṭidāre. Pappāyi, anānas tinnabāradu, ibbarige tinnabēku, grahaṇada dina horage hōgabāradu… idaralli eṣṭu nija?"
    en: "Doctor, my grandmother has given me a list. No papaya or pineapple, eat for two, don't go out on an eclipse day… how much of it is true?"
  - who: "gyn"
    t: "ಪ್ರತಿ ಅಜ್ಜಿನೂ ಇದೇ ಲಿಸ್ಟ್ ಕೊಡ್ತಾರೆ! ಹಸಿ ಪಪ್ಪಾಯಿ, ಅಂದ್ರೆ ಕಾಯಿ, ಬೇಡ. ಚೆನ್ನಾಗಿ ಹಣ್ಣಾದ ಪಪ್ಪಾಯಿ ಸ್ವಲ್ಪ ತಿಂದ್ರೆ ತೊಂದರೆ ಇಲ್ಲ. ಅನಾನಸ್ ಕೂಡ ಸ್ವಲ್ಪ ತಿಂದ್ರೆ ಪರವಾಗಿಲ್ಲ."
    tr: "Prati ajjinū idē lisṭ koḍtāre! Hasi pappāyi, andre kāyi, bēḍa. Chennāgi haṇṇāda pappāyi svalpa tindre tondare illa. Anānas kūḍa svalpa tindre paravāgilla."
    en: "(smiling) Every grandmother gives the same list! Raw papaya, I mean the green unripe kind, avoid that. A little well-ripened papaya is no problem. A little pineapple is fine too."
  - who: "gyn"
    t: "ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು ಅನ್ನೋದು ತಪ್ಪು. ಮೊದಲ ಮೂರು ತಿಂಗಳು ಜಾಸ್ತಿ ಏನೂ ಬೇಡ, ಆಮೇಲೆ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ ಅಷ್ಟೇ. ತುಪ್ಪ, ಸಿಹಿ ಜಾಸ್ತಿ ತಿಂದ್ರೆ ತೂಕ ಏರುತ್ತೆ, ಶುಗರ್ ರಿಸ್ಕ್ ಬರುತ್ತೆ. ಗ್ರಹಣ ಅಂದ್ರಾ? ಅದು ನಿಮ್ಮಿಷ್ಟ. ಒಂದು ದಿನ ಮನೇಲಿದ್ದು ಅಜ್ಜಿ ಮನಸ್ಸಿಗೆ ಸಮಾಧಾನ ಆದ್ರೆ ಯಾರಿಗೂ ನಷ್ಟ ಇಲ್ಲ."
    tr: "Ibbarige tinnabēku annōdu tappu. Modala mūru tingaḷu jāsti ēnū bēḍa, āmēle svalpa jāsti aṣṭē. Tuppa, sihi jāsti tindre tūka ērutte, śugar risk barutte. Grahaṇa andrā? Adu nimmiṣṭa. Ondu dina manēliddu ajji manassige samādhāna ādre yārigū naṣṭa illa."
    en: "“Eat for two” is wrong. Nothing extra in the first three months, and only a little more after that. Too much ghee and sweets means weight gain and a risk of sugar problems. The eclipse? That's up to you. If staying home for one day puts your grandmother's mind at ease, nobody loses anything."
  - who: "pradeep"
    t: "ಕಾಫಿ ಕುಡೀಬಹುದಾ, ಡಾಕ್ಟ್ರೇ? ಇವಳು ಕಾಫಿ ಇಲ್ಲದೆ ಬದುಕಲ್ಲ."
    tr: "Kāphi kuḍībahudā, ḍākṭrē? Ivaḷu kāphi illade badukalla."
    en: "Can she drink coffee, Doctor? She can't survive without it."
  - who: "gyn"
    t: "ದಿನಕ್ಕೆ ಒಂದು-ಎರಡು ಕಪ್ ಓಕೆ. ಆದ್ರೆ ಆಲ್ಕೋಹಾಲ್, ಸಿಗರೇಟ್ ಹೊಗೆ, ಡಾಕ್ಟ್ರು ಹೇಳದ ಮಾತ್ರೆ, ಇದೆಲ್ಲಾ ಸಂಪೂರ್ಣ ಬೇಡ. ತಲೆನೋವು ಅಂತ ಮೆಡಿಕಲ್ ಶಾಪ್‌ನಿಂದ ಏನೋ ತಂದು ತಗೋಬೇಡಿ. ಮೊದಲು ನನಗೆ ಫೋನ್ ಮಾಡಿ."
    tr: "Dinakke ondu-eraḍu kap ōke. Ādre ālkōhāl, sigarēṭ hoge, ḍākṭru hēḷada mātre, idellā sampūrṇa bēḍa. Talenōvu anta meḍikal śāp-ninda ēnō tandu tagōbēḍi. Modalu nanage phōn māḍi."
    en: "One or two cups a day is okay. But alcohol, cigarette smoke and any tablet a doctor hasn't prescribed: absolutely none of that. Don't pick something up at the pharmacy for a headache. Call me first."
  - who: "gyn"
    t: "ಕೊನೆಯದಾಗಿ, ಇದು ತುಂಬಾ ಮುಖ್ಯ. ಬ್ಲೀಡಿಂಗ್ ಆದ್ರೆ, ಹೊಟ್ಟೆ ನೋವು ಜಾಸ್ತಿ ಆದ್ರೆ, ಜ್ವರ ಬಂದ್ರೆ, ಅಥವಾ ನೀರು ಕುಡಿದ್ರೂ ವಾಂತಿ ಆಗ್ತಿದ್ರೆ… ಕಾಯಬೇಡಿ. ರಾತ್ರಿ ಎಷ್ಟೇ ಹೊತ್ತಾಗಿರಲಿ, ತಕ್ಷಣ ಬನ್ನಿ."
    tr: "Koneyadāgi, idu tumbā mukhya. Blīḍiṅg ādre, hoṭṭe nōvu jāsti ādre, jvara bandre, athavā nīru kuḍidrū vānti āgtidre… kāyabēḍi. Rātri eṣṭē hottāgirali, takṣaṇa banni."
    en: "Lastly, and this is very important. If there's bleeding, if the stomach pain gets bad, if you get a fever, or if you're vomiting even after sipping water… don't wait. However late at night it is, come immediately."
  - who: "shwe"
    t: "ಕೊನೆ ಪ್ರಶ್ನೆ, ಡಾಕ್ಟ್ರೇ. ನಾನು ಡೇಟಾ ಇಂಜಿನಿಯರ್, ಟೀಮ್ ಲೀಡ್. ದಿನಕ್ಕೆ ಹತ್ತು ಗಂಟೆ ಲ್ಯಾಪ್‌ಟಾಪ್ ಮುಂದೆ, ರಾತ್ರಿ ಅಮೆರಿಕಾ ಕ್ಲೈಂಟ್ ಜೊತೆ ಕಾಲ್. ಈ ಕೆಲಸ ಮುಂದುವರಿಸಬಹುದಾ?"
    tr: "Kone praśne, ḍākṭrē. Nānu ḍēṭā injiniyar, ṭīm līḍ. Dinakke hattu gaṇṭe lyāpṭāp munde, rātri Amerikā klaiṇṭ jote kāl. Ī kelasa munduvarisabahudā?"
    en: "Last question, Doctor. I'm a data engineer, a team lead. Ten hours a day at the laptop, and night calls with an American client. Can I carry on with this work?"
  - who: "gyn"
    t: "ಖಂಡಿತ ಮುಂದುವರಿಸಬಹುದು. ಪ್ರೆಗ್ನೆನ್ಸಿ ಕಾಯಿಲೆ ಅಲ್ಲ. ಆದ್ರೆ ಪ್ರತಿ ಗಂಟೆಗೆ ಎದ್ದು ಸ್ವಲ್ಪ ನಡೀರಿ, ನೀರು ಕುಡೀರಿ, ಏಳು-ಎಂಟು ಗಂಟೆ ನಿದ್ದೆ ಮಾಡಿ. ರಾತ್ರಿ ಹನ್ನೆರಡು ಗಂಟೆ ಕಾಲ್‌ಗಳನ್ನ ಮಾತ್ರ ಕಮ್ಮಿ ಮಾಡ್ಕೊಳ್ಳಿ. ರಿಪೋರ್ಟ್ ಬಂದ ಮೇಲೆ ತಗೊಂಡು ಬನ್ನಿ."
    tr: "Khaṇḍita munduvarisabahudu. Pregnensi kāyile alla. Ādre prati gaṇṭege eddu svalpa naḍīri, nīru kuḍīri, ēḷu-eṇṭu gaṇṭe nidde māḍi. Rātri hanneraḍu gaṇṭe kāl-gaḷanna mātra kammi māḍkoḷḷi. Ripōrṭ banda mēle tagoṇḍu banni."
    en: "Of course you can. Pregnancy isn't an illness. But get up and walk a little every hour, drink water, and sleep seven or eight hours. Just cut down on those midnight calls. Bring the reports once they're ready."

  - section: "💻 In the car: the fear about work"
    learn: "worries and fears: bhaya, ṭenśan, ansutte · hakku (a right), kānūnu prakāra (according to law) · -aṣṭaralli (by the time) · sympathetic teasing"
  - scene: "In the car outside the clinic. Pradeep starts the engine, then turns it off again. Shwetha is staring at the black-and-white scan printout."
  - who: "pradeep"
    t: "ಏನು ಯೋಚನೆ ಮಾಡ್ತಿದೀಯ? ಡಾಕ್ಟ್ರು ಎಲ್ಲಾ ಚೆನ್ನಾಗಿದೆ ಅಂದ್ರಲ್ಲ."
    tr: "Ēnu yōchane māḍtidīya? Ḍākṭru ellā chennāgide andralla."
    en: "What are you thinking about? The doctor said everything's fine."
  - who: "shwe"
    t: "ಮಗುವಿನ ಬಗ್ಗೆ ಅಲ್ಲ. ಆಫೀಸ್ ಬಗ್ಗೆ. ಹೋದ ತಿಂಗಳಷ್ಟೇ ನನಗೆ ಟೀಮ್ ಲೀಡ್ ಆಗಿ ಪ್ರಮೋಷನ್ ಸಿಕ್ತು. ಈಗ ಪ್ರೆಗ್ನೆಂಟ್ ಅಂತ ಹೇಳಿದ್ರೆ ಏನು ಅಂದ್ಕೊಳ್ತಾರೋ."
    tr: "Maguvina bagge alla. Āphīs bagge. Hōda tingaḷaṣṭē nanage ṭīm līḍ āgi pramōṣan siktu. Īga pregneṇṭ anta hēḷidre ēnu andkoḷḷtārō."
    en: "Not about the baby. About the office. I only got promoted to team lead last month. If I tell them I'm pregnant now, who knows what they'll think."
  - who: "pradeep"
    t: "ಏನು ಅಂದ್ಕೊಳ್ತಾರೆ? ಕಾನೂನು ಪ್ರಕಾರ ಮೆಟರ್ನಿಟಿ ಲೀವ್ ನಿನ್ನ ಹಕ್ಕು. ಅದಕ್ಕೋಸ್ಕರ ಯಾರೂ ನಿನ್ನನ್ನ ಕೆಲಸದಿಂದ ತೆಗೆಯೋಕಾಗಲ್ಲ."
    tr: "Ēnu andkoḷḷtāre? Kānūnu prakāra meṭarniṭi līv ninna hakku. Adakkōskara yārū ninnanna kelasadinda tegeyōkāgalla."
    en: "What would they think? By law, maternity leave is your right. Nobody can fire you for that."
  - who: "shwe"
    t: "ತೆಗೆಯಲ್ಲ, ಗೊತ್ತು. ಆದ್ರೆ ಸದ್ದಿಲ್ಲದೆ ಒಳ್ಳೆ ಪ್ರಾಜೆಕ್ಟ್ ಬೇರೆಯವರಿಗೆ ಕೊಡ್ತಾರೆ. ಅಪ್ರೈಸಲ್‌ನಲ್ಲಿ “ಈ ವರ್ಷ ಹೇಗೂ ಲೀವ್‌ನಲ್ಲಿ ಇರ್ತಾಳೆ” ಅಂತಾರೆ. ನನ್ ಹಳೇ ಟೀಮ್‌ನಲ್ಲಿ ಒಬ್ಬಳಿಗೆ ಹಾಗೇ ಆಯ್ತು."
    tr: "Tegeyalla, gottu. Ādre saddillade oḷḷe prājekṭ bēreyavarige koḍtāre. Apraisal-nalli “ī varṣa hēgū līv-nalli irtāḷe” antāre. Nan haḷē ṭīm-nalli obbaḷige hāgē āytu."
    en: "They won't fire me, I know. But they'll quietly give the good projects to someone else. At appraisal time they'll say, “She'll be on leave this year anyway.” That's exactly what happened to a woman on my old team."
  - who: "pradeep"
    t: "ಆಗಬಹುದು, ಸುಳ್ಳು ಹೇಳಲ್ಲ. ಆದ್ರೆ ನಿನ್ ಮ್ಯಾನೇಜರ್ ನಿಖಿಲ್ ಹಾಗೆ ಮಾಡೋ ಮನುಷ್ಯ ಅಂತ ನಿಂಗೆ ಅನ್ಸುತ್ತಾ?"
    tr: "Āgabahudu, suḷḷu hēḷalla. Ādre nin myānējar Nikhil hāge māḍō manuṣya anta ninge ansuttā?"
    en: "It could happen, I won't lie. But do you think your manager Nikhil is the kind of person who'd do that?"
  - who: "shwe"
    t: "ಗೊತ್ತಿಲ್ಲ. ನಿಖಿಲ್ ಒಳ್ಳೆಯವರು, ಆದ್ರೆ ಅವರ ಮೇಲೂ ಪ್ರೆಶರ್ ಇರುತ್ತೆ. ಎನ್‌ಟಿ ಸ್ಕ್ಯಾನ್ ಆಗೋವರೆಗೂ ಆಫೀಸ್‌ನಲ್ಲಿ ಯಾರಿಗೂ ಹೇಳಲ್ಲ. ಅಷ್ಟರಲ್ಲಿ ಮೂರು ತಿಂಗಳೂ ಮುಗಿದಿರುತ್ತೆ."
    tr: "Gottilla. Nikhil oḷḷeyavaru, ādre avara mēlū preśar irutte. En-ṭi skyān āgōvaregū āphīs-nalli yārigū hēḷalla. Aṣṭaralli mūru tingaḷū mugidirutte."
    en: "I don't know. Nikhil is a good man, but he's under pressure too. I won't tell anyone at work until the NT scan is done. By then the first three months will be over anyway."
  - who: "pradeep"
    t: "ಸರಿ. ಇನ್ನೊಂದು ವಿಷಯ: ನೀನು ಒಬ್ಬಳೇ ಎಲ್ಲಾ ಹೊತ್ತುಕೊಳ್ಳಬೇಕಿಲ್ಲ. ನಾನು ಹೇಗೂ ಮನೆಯಿಂದ ಕೆಲಸ ಮಾಡ್ತೀನಿ. ಅಡುಗೆ, ಡಾಕ್ಟ್ರು, ಟೆಸ್ಟ್, ಆ ಓಡಾಟ ಎಲ್ಲಾ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ."
    tr: "Sari. Innondu viṣaya: nīnu obbaḷē ellā hottukoḷḷabēkilla. Nānu hēgū maneyinda kelasa māḍtīni. Aḍuge, ḍākṭru, ṭesṭ, ā ōḍāṭa ellā nānu nōḍkoḷḷtīni."
    en: "Fine. One more thing: you don't have to carry all this alone. I work from home anyway. Cooking, doctors, tests, all that running around, I'll handle it."
  - who: "shwe"
    t: "ಅಡುಗೆ? ನೀನು? ನಿನ್ ಉಪ್ಪಿಟ್ಟು ತಿಂದ್ರೆ ವಾಂತಿ ಪ್ರೆಗ್ನೆನ್ಸಿಯಿಂದ ಬರ್ತಿದ್ಯೋ ನಿನ್ ಅಡುಗೆಯಿಂದ ಬರ್ತಿದ್ಯೋ ಗೊತ್ತಾಗಲ್ಲ!"
    tr: "Aḍuge? Nīnu? Nin uppiṭṭu tindre vānti pregnensiyinda bartidyō nin aḍugeyinda bartidyō gottāgalla!"
    en: "Cooking? You? After your upma I won't know if I'm throwing up because of the pregnancy or because of your cooking!"
  - who: "pradeep"
    t: "ಕಲಿತೀನಿ! ಯೂಟ್ಯೂಬ್ ಇದೆ, ಅತ್ತೆ ಇದ್ದಾರೆ, ಒಂಬತ್ತು ತಿಂಗಳು ಟೈಮ್ ಇದೆ. … ಈಗ ಮನೆಗೆ ಹೋಗೋಣ, ಮೇಡಂ. ದಾರಿಯಲ್ಲಿ ಫಾರ್ಮಸಿ ಹತ್ರ ನಿಲ್ಲಿಸ್ತೀನಿ, ಫೋಲಿಕ್ ಆಸಿಡ್ ಇವತ್ತೇ ಶುರು."
    tr: "Kalitīni! Yūṭyūb ide, atte iddāre, ombattu tingaḷu ṭaim ide. … Īga manege hōgōṇa, mēḍam. Dāriyalli phārmasi hatra nillistīni, phōlik āsiḍ ivattē śuru."
    en: "I'll learn! There's YouTube, there's your mother, and I have nine months. … Now let's go home, madam. I'll stop at the pharmacy on the way; the folic acid starts today."

  - chapter: "Chapter 2 — The night of the attack"
  - section: "🌧 “It's only gas”"
    learn: "dative experiencer for symptoms: ajjige ede uri āgtide · gyās, bhāra, bevaru, jum antide (tingling) · -tiddāga (while …) · -irbēku (must be)"
  - scene: "Five months later. Shwetha is now twenty-seven weeks pregnant, in her seventh month; the NT scan in April and the Level-2 anomaly scan in June both came back normal. Tuesday, 11 August 2026, twenty to ten at night. Heavy monsoon rain over Jayanagar. Dinner is over. Appa is on the sofa with bank papers, Kiran is studying for his final-year exams, and Sam has just come home from work, soaked. Ajji sits on her bed in the front room, rubbing her chest."
  - who: "sam"
    t: "ನಮಸ್ಕಾರ ಅಜ್ಜಿ. ಈ ಮಳೆಯಲ್ಲಿ ಸಿಲ್ಕ್ ಬೋರ್ಡ್‌ನಿಂದ ಬರೋಕೆ ಒಂದೂವರೆ ಗಂಟೆ ಆಯ್ತು. … ಅಜ್ಜಿ? ಯಾಕೆ ಎದೆ ಉಜ್ಜಿಕೊಳ್ತಿದೀರ?"
    tr: "Namaskāra ajji. Ī maḷeyalli Silk Bōrḍ-ninda barōke ondūvare gaṇṭe āytu. … Ajji? Yāke ede ujjikoḷḷtidīra?"
    en: "Good evening, Ajji. It took me an hour and a half to get back from Silk Board in this rain. … Ajji? Why are you rubbing your chest?"
  - who: "ajji"
    t: "ಏನಿಲ್ಲ ಸ್ಯಾಮ್. ಮಳೆ ಅಂತ ಸಂಜೆ ಎರಡು ಬೋಂಡಾ ತಿಂದೆ. ಗ್ಯಾಸ್ ಆಗಿರ್ಬೇಕು. ಎದೆ ಹತ್ರ ಸ್ವಲ್ಪ ಉರಿ, ಸ್ವಲ್ಪ ಭಾರ, ಅಷ್ಟೇ."
    tr: "Ēnilla Sām. Maḷe anta sanje eraḍu bōṇḍā tinde. Gyās āgirbēku. Ede hatra svalpa uri, svalpa bhāra, aṣṭē."
    en: "It's nothing, Sam. Because of the rain I ate a couple of bondas this evening. It must be gas. A little burning near the chest, a little heaviness, that's all."
  - who: "amma"
    t: "ಅದಕ್ಕೇ ಹೇಳಿದ್ದು, ಎಣ್ಣೆ ತಿಂಡಿ ಬೇಡ ಅಂತ. ಇರಿ, ಜೀರಿಗೆ ನೀರು ಮಾಡ್ಕೊಡ್ತೀನಿ. ಕುಡಿದ್ರೆ ಸರಿ ಹೋಗುತ್ತೆ."
    tr: "Adakkē hēḷiddu, eṇṇe tiṇḍi bēḍa anta. Iri, jīrige nīru māḍkoḍtīni. Kuḍidre sari hōgutte."
    en: "(from the kitchen) That's exactly why I said no fried snacks. Wait, I'll make you some cumin water. Drink it and you'll feel better."
  - who: "sam"
    t: "ಅಜ್ಜಿ, ಎಷ್ಟು ಹೊತ್ತಿಂದ ಹೀಗಾಗ್ತಿದೆ?"
    tr: "Ajji, eṣṭu hottinda hīgāgtide?"
    en: "Ajji, how long has this been going on?"
  - who: "ajji"
    t: "ಅರ್ಧ ಗಂಟೆ ಆಯ್ತೇನೋ. ಟಿವಿ ಸೀರಿಯಲ್ ನೋಡ್ತಿದ್ದಾಗ ಶುರು ಆಯ್ತು. ಹೋಗುತ್ತೆ ಬಿಡು. ವಯಸ್ಸಾದ ಮೇಲೆ ಇದೆಲ್ಲಾ ಮಾಮೂಲು."
    tr: "Ardha gaṇṭe āytēnō. Ṭivi sīriyal nōḍtiddāga śuru āytu. Hōgutte biḍu. Vayassāda mēle idellā māmūlu."
    en: "Maybe half an hour. It started while I was watching my TV serial. It'll pass, never mind. At my age all this is normal."
  - who: "sam"
    t: "ಅಜ್ಜಿ, ಹೋದ ತಿಂಗಳು ಮೆಟ್ಟಿಲು ಹತ್ತುವಾಗಲೂ ಎದೆ ಭಾರ ಆಗುತ್ತೆ ಅಂದಿದ್ರಲ್ಲ? ಇದೂ ಅದೇ ಥರಾನಾ?"
    tr: "Ajji, hōda tingaḷu meṭṭilu hattuvāgalū ede bhāra āgutte andidralla? Idū adē tharānā?"
    en: "Ajji, last month you said your chest felt heavy when you climbed the stairs, didn't you? Is this the same kind of thing?"
  - who: "ajji"
    t: "ಅದು ಮೆಟ್ಟಿಲಿಂದ, ಸ್ಯಾಮ್. ರಮೇಶ ಕೂಡ “ವಯಸ್ಸು, ಅಮ್ಮ” ಅಂತ ನಕ್ಕ. ಎರಡು ನಿಮಿಷ ಕೂತ್ಕೊಂಡ್ರೆ ಹೋಗ್ತಿತ್ತು. ಇದು ಬೋಂಡದ ಗ್ಯಾಸ್, ಅಷ್ಟೇ."
    tr: "Adu meṭṭilinda, Sām. Ramēsha kūḍa “vayassu, amma” anta nakka. Eraḍu nimiṣa kūtkoṇḍre hōgtittu. Idu bōṇḍada gyās, aṣṭē."
    en: "That was the stairs, Sam. Even Ramesh laughed and said, “It's age, Amma.” It went away if I sat down for two minutes. This is just gas from the bondas."
  - who: "sam"
    t: "ಅಜ್ಜಿ, ನಿಮ್ಮ ಹಣೆ ಎಲ್ಲಾ ಬೆವರಿದೆ. ಫ್ಯಾನ್ ಫುಲ್ ಸ್ಪೀಡ್‌ನಲ್ಲಿದೆ, ಹೊರಗೆ ಮಳೆ. ನಿಮಗೆ ಸೆಕೆ ಆಗ್ತಿದ್ಯಾ?"
    tr: "Ajji, nimma haṇe ellā bevaride. Phyān phul spīḍ-nallide, horage maḷe. Nimage seke āgtidyā?"
    en: "(looking more closely) Ajji, your forehead is all sweaty. The fan is on full speed and it's raining outside. Are you feeling hot?"
  - who: "ajji"
    t: "ಸೆಕೆ ಅಲ್ಲ… ಮೈ ತಣ್ಣಗಿದೆ, ಆದ್ರೂ ಬೆವರು ಬರ್ತಿದೆ. ವಿಚಿತ್ರ."
    tr: "Seke alla… mai taṇṇagide, ādrū bevaru bartide. Vichitra."
    en: "Not hot… my body is cold, but I'm still sweating. Strange."
  - who: "amma"
    t: "ತಗೊಳ್ಳಿ ಅಮ್ಮ, ಜೀರಿಗೆ ನೀರು. ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಕುಡೀರಿ."
    tr: "Tagoḷḷi amma, jīrige nīru. Svalpa svalpa kuḍīri."
    en: "Here, Amma, cumin water. Sip it slowly."
  - who: "ajji"
    t: "ಲಕ್ಷ್ಮಿ… ಈ ಎಡಗೈ ಯಾಕೋ ಜುಮ್ ಅಂತಿದೆ. ಭುಜದಿಂದ ಕೆಳಗೆ ಯಾರೋ ಎಳೀತಿರೋ ಹಾಗಿದೆ."
    tr: "Lakshmī… ī eḍagai yākō jum antide. Bhujadinda keḷage yārō eḷītirō hāgide."
    en: "(takes a sip, puts the glass down and grips her left arm) Lakshmi… this left arm feels numb and tingly. It's as if someone is pulling it down from the shoulder."
  - who: "sam"
    t: "ಅಂಕಲ್! ಅಂಕಲ್, ಇಲ್ಲಿ ಬನ್ನಿ. ಬೇಗ!"
    tr: "Aṅkal! Aṅkal, illi banni. Bēga!"
    en: "Uncle! Uncle, come here. Quickly!"

  - section: "💔 Not gas"
    learn: "describing the attack: ede nōvu, kallu iṭṭa hāge (like a stone placed on it), usiru kaṭṭu · urgent commands: phōn māḍu, kūrisi, malagbēḍi · -irabahudu (it might be) · hārṭ aṭyāk / hṛdayāghāta"
  - who: "appa"
    t: "ಏನಾಯ್ತು, ಸ್ಯಾಮ್? … ಅಮ್ಮ! ಏನಾಗ್ತಿದೆ ನಿಂಗೆ?"
    tr: "Ēnāytu, Sām? … Amma! Ēnāgtide ninge?"
    en: "What happened, Sam? … Amma! What's happening to you?"
  - who: "ajji"
    t: "ಎದೆ ಮೇಲೆ… ಯಾರೋ ಕಲ್ಲು ಇಟ್ಟ ಹಾಗಿದೆ, ರಮೇಶ. ಉಸಿರು ತಗೊಳ್ಳೋಕೆ ಆಗ್ತಿಲ್ಲ."
    tr: "Ede mēle… yārō kallu iṭṭa hāgide, Ramēsha. Usiru tagoḷḷōke āgtilla."
    en: "It's like… someone has put a stone on my chest, Ramesh. I can't get my breath."
  - who: "amma"
    t: "ಅಯ್ಯೋ ದೇವ್ರೇ! ರೀ, ಏನು ಮಾಡೋದು? ಏನು ಮಾಡೋದು ರೀ?"
    tr: "Ayyō dēvrē! Rī, ēnu māḍōdu? Ēnu māḍōdu rī?"
    en: "Oh God! What do we do? What do we do?"
  - who: "sam"
    t: "ಆಂಟಿ, ಎದೆ ನೋವು, ಎಡಗೈ, ತಣ್ಣನೆ ಬೆವರು… ನಮ್ಮ ಆಫೀಸ್ ಫಸ್ಟ್-ಏಡ್ ಟ್ರೇನಿಂಗ್‌ನಲ್ಲಿ ಹೇಳಿದ್ರು. ಇದು ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿರಬಹುದು. ಈಗಲೇ ಆಂಬುಲೆನ್ಸ್ ಕರೀಬೇಕು."
    tr: "Āṇṭi, ede nōvu, eḍagai, taṇṇane bevaru… namma āphīs phasṭ-ēḍ ṭrēniṅg-nalli hēḷidru. Idu hārṭ aṭyāk āgirabahudu. Īgalē āmbulens karībēku."
    en: "Aunty, chest pain, the left arm, cold sweat… they taught us this in first-aid training at the office. This could be a heart attack. We need to call an ambulance right now."
  - who: "ajji"
    t: "ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಏನೂ ಇಲ್ಲ… ಗ್ಯಾಸ್ ಅಷ್ಟೇ… ಯಾರನ್ನೂ ಕರೀಬೇಡಿ. ರಾತ್ರಿ ಹೊತ್ತು ರಂಪ ಮಾಡ್ಬೇಡಿ."
    tr: "Hārṭ aṭyāk ēnū illa… gyās aṣṭē… yārannū karībēḍi. Rātri hottu rampa māḍbēḍi."
    en: "It's no heart attack… just gas… don't call anyone. Don't make a scene in the middle of the night."
  - who: "appa"
    t: "ಅಮ್ಮ, ಸುಮ್ಮನಿರು. ಕಿರಣ್! ಕಿರಣ್, ಬೇಗ ಬಾ! ನಾನು ಕಾರ್ ಕೀ ತಗೋತೀನಿ, ನಾವೇ ಕರ್ಕೊಂಡು ಹೋಗೋಣ."
    tr: "Amma, summaniru. Kiraṇ! Kiraṇ, bēga bā! Nānu kār kī tagōtīni, nāvē karkoṇḍu hōgōṇa."
    en: "Amma, hush. Kiran! Kiran, come quick! I'll get the car keys; we'll take her ourselves."
  - who: "kiran"
    t: "ಅಪ್ಪ, ಬೇಡ! ಈ ಮಳೆಯಲ್ಲಿ ಎಲ್ಲಾ ರೋಡ್ ಜಾಮ್ ಆಗಿರುತ್ತೆ. ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಆಕ್ಸಿಜನ್ ಇರುತ್ತೆ, ಇಸಿಜಿ ಇರುತ್ತೆ, ಸೈರನ್ ಕೇಳಿದ್ರೆ ಜನ ದಾರಿ ಬಿಡ್ತಾರೆ. ನಾನು ನೂರಾ ಎಂಟಕ್ಕೆ ಕಾಲ್ ಮಾಡ್ತೀನಿ."
    tr: "Appa, bēḍa! Ī maḷeyalli ellā rōḍ jām āgirutte. Āmbulens-nalli āksijan irutte, isiji irutte, sairan kēḷidre jana dāri biḍtāre. Nānu nūrā eṇṭakke kāl māḍtīni."
    en: "Appa, no! In this rain every road will be jammed. The ambulance has oxygen and an ECG, and people make way when they hear the siren. I'm calling 108."
  - who: "appa"
    t: "ಸರಿ, ಸರಿ, ಮಾಡು! ಬೇಗ!"
    tr: "Sari, sari, māḍu! Bēga!"
    en: "All right, all right, do it! Quickly!"
  - who: "amma"
    t: "ಅಮ್ಮ, ಸ್ವಲ್ಪ ಮಲಗಿಕೊಳ್ಳಿ. ಮಲಗಿದ್ರೆ ಆರಾಮ ಅನ್ಸುತ್ತೆ…"
    tr: "Amma, svalpa malagikoḷḷi. Malagidre ārāma ansutte…"
    en: "Amma, lie down a little. You'll feel easier lying down…"
  - who: "ajji"
    t: "ಬೇಡ… ಮಲಗಿದ್ರೆ ಇನ್ನೂ ಉಸಿರು ಕಟ್ಟುತ್ತೆ. ಕೂತೇ ಇರ್ತೀನಿ."
    tr: "Bēḍa… malagidre innū usiru kaṭṭutte. Kūtē irtīni."
    en: "No… lying down makes the breathlessness worse. I'll stay sitting up."

  - section: "📞 The 108 call"
    learn: "emergency phone talk: aḍres, lyāṇḍmārk, vayassu, prajñe ide? (is she conscious?) · operator's instructions: kūrisi, naḍesabāradu, ēnū koḍabēḍi · conditional -idre, negative -ade · -aṣṭaralli (in the meantime)"
  - scene: "Kiran dials 108 and puts the phone on speaker. A short recorded message in Kannada and English, then a calm woman's voice."
  - who: "operator"
    t: "ನಮಸ್ಕಾರ, ನೂರಾ ಎಂಟು ಆರೋಗ್ಯ ಕವಚ. ಹೇಳಿ, ಏನು ಎಮರ್ಜೆನ್ಸಿ?"
    tr: "Namaskāra, nūrā eṇṭu Ārōgya Kavacha. Hēḷi, ēnu emarjensi?"
    en: "Hello, 108 Arogya Kavacha. Go ahead, what's the emergency?"
  - who: "kiran"
    t: "ಮೇಡಂ, ಆಂಬುಲೆನ್ಸ್ ಬೇಕು, ಬೇಗ. ನಮ್ಮಜ್ಜಿಗೆ ಎದೆ ನೋವು, ತುಂಬಾ ಬೆವರ್ತಿದ್ದಾರೆ, ಎಡಗೈ ಜುಮ್ ಅಂತಿದೆ ಅಂತಿದ್ದಾರೆ. ಉಸಿರಾಡೋಕೂ ಕಷ್ಟ ಆಗ್ತಿದೆ."
    tr: "Mēḍam, āmbulens bēku, bēga. Nammajjige ede nōvu, tumbā bevartiddāre, eḍagai jum antide antiddāre. Usirāḍōkū kaṣṭa āgtide."
    en: "Madam, we need an ambulance, quickly. My grandmother has chest pain, she's sweating a lot, she says her left arm is numb. She's finding it hard to breathe too."
  - who: "operator"
    t: "ಗಾಬರಿ ಆಗ್ಬೇಡಿ. ಆಂಬುಲೆನ್ಸ್ ಕಳಿಸೋಕೆ ನನಗೆ ಕೆಲವು ಡೀಟೇಲ್ಸ್ ಬೇಕು. ನಿಮ್ಮ ಹೆಸರು, ಪೇಶಂಟ್ ಹೆಸರು, ವಯಸ್ಸು ಹೇಳಿ."
    tr: "Gābari āgbēḍi. Āmbulens kaḷisōke nanage kelavu ḍīṭēls bēku. Nimma hesaru, pēśaṇṭ hesaru, vayassu hēḷi."
    en: "Don't panic. I need a few details to send the ambulance. Tell me your name, the patient's name and age."
  - who: "kiran"
    t: "ನಾನು ಕಿರಣ್. ಪೇಶಂಟ್ ಸರಸ್ವತಮ್ಮ, ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷ."
    tr: "Nānu Kiraṇ. Pēśaṇṭ Sarasvatamma, eppattombattu varṣa."
    en: "I'm Kiran. The patient is Saraswathamma, seventy-nine."
  - who: "operator"
    t: "ಅವರಿಗೆ ಪ್ರಜ್ಞೆ ಇದ್ಯಾ? ನೀವು ಮಾತಾಡಿಸಿದ್ರೆ ಉತ್ತರ ಕೊಡ್ತಿದ್ದಾರಾ?"
    tr: "Avarige prajñe idyā? Nīvu mātāḍisidre uttara koḍtiddārā?"
    en: "Is she conscious? Does she answer when you talk to her?"
  - who: "kiran"
    t: "ಹೌದು, ಮಾತಾಡ್ತಿದ್ದಾರೆ, ಕೂತ್ಕೊಂಡಿದ್ದಾರೆ. ಆದ್ರೆ ಮುಖ ಬಿಳಿಚಿಕೊಂಡಿದೆ."
    tr: "Haudu, mātāḍtiddāre, kūtkoṇḍiddāre. Ādre mukha biḷichikoṇḍide."
    en: "Yes, she's talking, she's sitting up. But her face has gone pale."
  - who: "operator"
    t: "ಸರಿ. ಅಡ್ರೆಸ್ ಹೇಳಿ, ನಿಧಾನವಾಗಿ, ಸ್ಪಷ್ಟವಾಗಿ."
    tr: "Sari. Aḍres hēḷi, nidhānavāgi, spaṣṭavāgi."
    en: "Okay. Tell me the address, slowly and clearly."
  - who: "kiran"
    t: "ನಂಬರ್ ಇಪ್ಪತ್ತಮೂರು, ಹತ್ತನೇ ಕ್ರಾಸ್, ಮೂರನೇ ಬ್ಲಾಕ್, ಜಯನಗರ."
    tr: "Nambar ippattamūru, hattanē krās, mūranē blāk, Jayanagara."
    en: "Number twenty-three, Tenth Cross, Third Block, Jayanagar."
  - who: "operator"
    t: "ಹತ್ರ ಯಾವುದಾದ್ರೂ ಲ್ಯಾಂಡ್‌ಮಾರ್ಕ್ ಇದ್ಯಾ? ದೇವಸ್ಥಾನ, ಸ್ಕೂಲ್, ದೊಡ್ಡ ಅಂಗಡಿ?"
    tr: "Hatra yāvudādrū lyāṇḍmārk idyā? Dēvasthāna, skūl, doḍḍa aṅgaḍi?"
    en: "Is there any landmark nearby? A temple, a school, a big shop?"
  - who: "kiran"
    t: "ಕ್ರಾಸ್ ಶುರು ಆಗೋ ಕಡೆ ಒಂದು ಗಣಪತಿ ದೇವಸ್ಥಾನ ಇದೆ. ಅಲ್ಲಿಂದ ನಾಲ್ಕನೇ ಮನೆ, ನೀಲಿ ಗೇಟ್."
    tr: "Krās śuru āgō kaḍe ondu Gaṇapati dēvasthāna ide. Allinda nālkanē mane, nīli gēṭ."
    en: "There's a Ganapati temple where the cross road begins. Fourth house from there, blue gate."
  - who: "operator"
    t: "ಓಕೆ, ಲೊಕೇಶನ್ ಸಿಕ್ತು. ಹತ್ತಿರದ ಆಂಬುಲೆನ್ಸ್‌ಗೆ ಕೇಸ್ ಹಾಕಿದೀನಿ. ಹದಿನೈದು-ಇಪ್ಪತ್ತು ನಿಮಿಷ ಆಗಬಹುದು. ಮಳೆ ಇರೋದ್ರಿಂದ ಸ್ವಲ್ಪ ತಡ ಆದ್ರೂ ಆಗಬಹುದು."
    tr: "Ōke, lokēśan siktu. Hattirada āmbulens-ge kēs hākidīni. Hadinaidu-ippattu nimiṣa āgabahudu. Maḷe irōdrinda svalpa taḍa ādrū āgabahudu."
    en: "Okay, I have the location. I've assigned the case to the nearest ambulance. It may take fifteen to twenty minutes. With the rain, it could be a little later."
  - who: "kiran"
    t: "ಇಪ್ಪತ್ತು ನಿಮಿಷ? ಮೇಡಂ, ಅಷ್ಟು ಹೊತ್ತು…"
    tr: "Ippattu nimiṣa? Mēḍam, aṣṭu hottu…"
    en: "Twenty minutes? Madam, that long…"
  - who: "operator"
    t: "ನಿಮ್ಮ ಟೆನ್ಶನ್ ಅರ್ಥ ಆಗುತ್ತೆ. ಅಷ್ಟರಲ್ಲಿ ನೀವು ಏನು ಮಾಡ್ಬೇಕು ಅಂತ ಹೇಳ್ತೀನಿ, ಕೇಳಿ. ಅವರನ್ನ ಆರಾಮವಾಗಿ ಕೂರಿಸಿ, ಬೆನ್ನಿಗೆ ದಿಂಬು ಇಡಿ. ನಡೆಸಬಾರದು. ಬಾತ್‌ರೂಮ್‌ಗೂ ನಡೆದುಕೊಂಡು ಹೋಗೋದು ಬೇಡ."
    tr: "Nimma ṭenśan artha āgutte. Aṣṭaralli nīvu ēnu māḍbēku anta hēḷtīni, kēḷi. Avaranna ārāmavāgi kūrisi, bennige dimbu iḍi. Naḍesabāradu. Bāthrūm-gū naḍedukoṇḍu hōgōdu bēḍa."
    en: "I understand you're worried. Meanwhile, I'll tell you what to do, listen. Sit her comfortably and put a pillow behind her back. Don't make her walk. Not even to the bathroom."
  - who: "operator"
    t: "ಬಿಗಿಯಾದ ಬಟ್ಟೆ ಇದ್ರೆ ಸಡಿಲ ಮಾಡಿ, ಕಿಟಕಿ ತೆಗೀರಿ. ಊಟ, ಕಾಫಿ, ಏನೂ ಕೊಡಬೇಡಿ. ಮನೇಲಿ ಆಸ್ಪಿರಿನ್ ಮಾತ್ರೆ ಇದ್ಯಾ?"
    tr: "Bigiyāda baṭṭe idre saḍila māḍi, kiṭaki tegīri. Ūṭa, kāphi, ēnū koḍabēḍi. Manēli āspirin mātre idyā?"
    en: "If her clothes are tight, loosen them, and open a window. Don't give her any food or coffee, nothing. Do you have aspirin tablets at home?"
  - who: "kiran"
    t: "ಆಸ್ಪಿರಿನ್… ಇಲ್ಲ ಅನ್ಸುತ್ತೆ. ಅಜ್ಜಿಗೆ ಬಿಪಿ, ಶುಗರ್ ಇದೆ, ಹತ್ತು ವರ್ಷದಿಂದ ಮಾತ್ರೆ ತಗೋತಿದ್ದಾರೆ. ಸಾರ್ಬಿಟ್ರೇಟ್ ಅಂತ ಏನೋ ನಾಲಿಗೆ ಕೆಳಗೆ ಇಡ್ತಾರೆ ಅಂತ ಕೇಳಿದೀನಿ. ಅದು ಕೊಡ್ಲಾ?"
    tr: "Āspirin… illa ansutte. Ajjige bi-pi, śugar ide, hattu varṣadinda mātre tagōtiddāre. Sārbiṭrēṭ anta ēnō nālige keḷage iḍtāre anta kēḷidīni. Adu koḍlā?"
    en: "Aspirin… I don't think so. Ajji has BP and sugar; she's been on tablets for ten years. I've heard people put something called Sorbitrate under the tongue. Should I give her that?"
  - who: "operator"
    t: "ಬೇಡ. ನೀವಾಗಿ ಯಾವ ಮಾತ್ರೆನೂ ಕೊಡಬೇಡಿ. ಕೆಲವು ಮಾತ್ರೆಯಿಂದ ಬಿಪಿ ತುಂಬಾ ಕಡಿಮೆ ಆಗಬಹುದು. ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಎಲ್ಲಾ ಇರುತ್ತೆ, ಅವರು ಡಾಕ್ಟ್ರನ್ನ ಕೇಳಿ ಕೊಡ್ತಾರೆ. ಅವರ ಮಾತ್ರೆ ಡಬ್ಬ, ಹಳೇ ರಿಪೋರ್ಟ್ ಎಲ್ಲಾ ರೆಡಿ ಇಟ್ಕೊಳ್ಳಿ."
    tr: "Bēḍa. Nīvāgi yāva mātrenū koḍabēḍi. Kelavu mātreyinda bi-pi tumbā kaḍime āgabahudu. Āmbulens-nalli ellā irutte, avaru ḍākṭranna kēḷi koḍtāre. Avara mātre ḍabba, haḷē ripōrṭ ellā reḍi iṭkoḷḷi."
    en: "No. Don't give her any tablet on your own. Some tablets can drop the BP badly. The ambulance has everything; they'll check with a doctor and give it. Keep her medicine box and old reports ready."
  - who: "operator"
    t: "ಒಂದು ವೇಳೆ ಅವರು ಪ್ರಜ್ಞೆ ತಪ್ಪಿದ್ರೆ, ಉಸಿರು ನಿಂತ ಹಾಗೆ ಅನ್ನಿಸಿದ್ರೆ, ತಕ್ಷಣ ಇದೇ ನಂಬರ್‌ಗೆ ಮತ್ತೆ ಕಾಲ್ ಮಾಡಿ. ಸಿಪಿಆರ್ ಹೇಗೆ ಮಾಡೋದು ಅಂತ ನಾನು ಫೋನ್‌ನಲ್ಲೇ ಹೇಳ್ಕೊಡ್ತೀನಿ."
    tr: "Ondu vēḷe avaru prajñe tappidre, usiru ninta hāge annisidre, takṣaṇa idē nambar-ge matte kāl māḍi. Si-pi-ār hēge māḍōdu anta nānu phōn-nallē hēḷkoḍtīni."
    en: "If she loses consciousness, or if it seems her breathing has stopped, call this number again immediately. I'll talk you through how to do CPR over the phone."
  - who: "operator"
    t: "ಆಂಬುಲೆನ್ಸ್‌ನವರು ಈ ನಂಬರ್‌ಗೆ ಕಾಲ್ ಮಾಡ್ತಾರೆ, ಫೋನ್ ಫ್ರೀ ಇಟ್ಕೊಳ್ಳಿ. ಯಾರಾದ್ರೂ ಒಬ್ಬರು ಗೇಟ್ ಹತ್ರ ನಿಂತ್ಕೊಳ್ಳಿ, ಹೊರಗಿನ ಲೈಟ್ ಹಾಕಿಡಿ. ಧೈರ್ಯವಾಗಿರಿ, ಸಹಾಯ ಬರ್ತಿದೆ."
    tr: "Āmbulens-navaru ī nambar-ge kāl māḍtāre, phōn phrī iṭkoḷḷi. Yārādrū obbaru gēṭ hatra nintkoḷḷi, horagina laiṭ hākiḍi. Dhairyavāgiri, sahāya bartide."
    en: "The ambulance crew will call this number, so keep the line free. Have someone stand at the gate, and switch the outside light on. Stay strong, help is on its way."
  - who: "kiran"
    t: "ಸರಿ ಮೇಡಂ. ಥ್ಯಾಂಕ್ಯೂ… ಥ್ಯಾಂಕ್ಯೂ."
    tr: "Sari mēḍam. Thyāṅkyū… thyāṅkyū."
    en: "Okay, madam. Thank you… thank you."

  - section: "⏳ Twenty long minutes"
    learn: "comforting: samādhāna māḍko, ēnū āgalla, dhairya · Vimala's practical checklist · shielding family: ... ge hēḷbēḍa · ಮಾತು ಕೊಡು (give one's word)"
  - scene: "Appa holds his mother's hand. Amma goes to the puja shelf, comes back, goes again; she can't keep still. Sam stands at the gate in the rain with an umbrella and a torch. The neighbour's door opens."
  - who: "vimala"
    t: "ಲಕ್ಷ್ಮಿ! ಏನಾಯ್ತು? ಸ್ಯಾಮ್ ಮಳೆಯಲ್ಲಿ ಟಾರ್ಚ್ ಹಿಡ್ಕೊಂಡು ನಿಂತಿರೋದು ನೋಡಿ ಓಡಿ ಬಂದೆ. ಅಜ್ಜಿಗಾ?"
    tr: "Lakshmī! Ēnāytu? Sām maḷeyalli ṭārch hiḍkoṇḍu nintirōdu nōḍi ōḍi bande. Ajjigā?"
    en: "Lakshmi! What happened? I saw Sam standing in the rain with a torch and came running. Is it Ajji?"
  - who: "amma"
    t: "ವಿಮಲಾ… ಅಮ್ಮನಿಗೆ ಎದೆ ನೋವು. ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಇರಬಹುದು ಅಂತ ಸ್ಯಾಮ್ ಹೇಳ್ತಿದ್ದಾನೆ. ಆಂಬುಲೆನ್ಸ್ ಇನ್ನೂ ಬಂದಿಲ್ಲ. ನನ್ ಕೈಕಾಲು ನಡುಗ್ತಿದೆ."
    tr: "Vimalā… ammanige ede nōvu. Hārṭ aṭyāk irabahudu anta Sām hēḷtiddāne. Āmbulens innū bandilla. Nan kaikālu naḍugtide."
    en: "Vimala… Amma has chest pain. Sam says it might be a heart attack. The ambulance still hasn't come. My hands and legs are shaking."
  - who: "vimala"
    t: "ಏನೂ ಆಗಲ್ಲ, ಸಮಾಧಾನ ಮಾಡ್ಕೋ. ನಮ್ಮ ಯಜಮಾನರಿಗೆ ಹೋದ ವರ್ಷ ಇದೇ ಆಯ್ತು, ನೆನಪಿದ್ಯಾ? ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿಸಿದ್ವಿ. ಈಗ ದಿನಾ ಲಾಲ್‌ಬಾಗ್‌ನಲ್ಲಿ ವಾಕಿಂಗ್ ಮಾಡ್ತಾರೆ."
    tr: "Ēnū āgalla, samādhāna māḍkō. Namma yajamānarige hōda varṣa idē āytu, nenapidyā? Samayakke sariyāgi āspatrege sērisidvi. Īga dinā Lālbāg-nalli vākiṅg māḍtāre."
    en: "Nothing will happen, calm down. The same thing happened to my husband last year, remember? We got him to hospital in time. Now he walks in Lalbagh every day."
  - who: "vimala"
    t: "ಮನೆ ಬೀಗ, ಬೆಳಿಗ್ಗೆ ಹಾಲು, ಎಲ್ಲಾ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ. ನೀನು ಅಜ್ಜಿ ಆಧಾರ್ ಕಾರ್ಡ್, ಮಾತ್ರೆ ಡಬ್ಬ, ಹಳೇ ರಿಪೋರ್ಟ್ ಎಲ್ಲಾ ಒಂದು ಬ್ಯಾಗ್‌ಗೆ ಹಾಕು. ಆಸ್ಪತ್ರೇಲಿ ಮೊದಲು ಕೇಳೋದೇ ಅದು. ಕೈಯಲ್ಲಿ ದುಡ್ಡು ಇದ್ಯಾ?"
    tr: "Mane bīga, beḷigge hālu, ellā nānu nōḍkoḷḷtīni. Nīnu ajji Ādhār kārḍ, mātre ḍabba, haḷē ripōrṭ ellā ondu byāg-ge hāku. Āspatrēli modalu kēḷōdē adu. Kaiyalli duḍḍu idyā?"
    en: "Locking the house, the morning milk, I'll handle all that. You put Ajji's Aadhaar card, her medicine box and her old reports in one bag. That's the first thing the hospital asks for. Do you have money on you?"
  - who: "appa"
    t: "ಕಾರ್ಡ್ ಇದೆ, ಯುಪಿಐ ಇದೆ. … ಅಮ್ಮ, ನನ್ ಕಡೆ ನೋಡು. ಇನ್ನೇನು ಆಂಬುಲೆನ್ಸ್ ಬರುತ್ತೆ."
    tr: "Kārḍ ide, yu-pi-ai ide. … Amma, nan kaḍe nōḍu. Innēnu āmbulens barutte."
    en: "I have my card and UPI. … Amma, look at me. The ambulance will be here any minute."
  - who: "ajji"
    t: "ರಮೇಶ… ಶ್ವೇತಾಗೆ ಹೇಳ್ಬೇಡ. ಹೊಟ್ಟೇಲಿ ಮಗು ಇದೆ. ಗಾಬರಿ ಆಗ್ತಾಳೆ, ರಾತ್ರಿಯೆಲ್ಲಾ ಅಳ್ತಾಳೆ."
    tr: "Ramēsha… Shwētāge hēḷbēḍa. Hoṭṭēli magu ide. Gābari āgtāḷe, rātriyellā aḷtāḷe."
    en: "Ramesh… don't tell Shwetha. She has a baby in her belly. She'll panic and cry all night."
  - who: "appa"
    t: "ಸರಿ ಅಮ್ಮ, ಈಗ ಹೇಳಲ್ಲ. ನೀನು ಮಾತಾಡ್ಬೇಡ. ನಿಧಾನಕ್ಕೆ ಉಸಿರು ತಗೋ."
    tr: "Sari amma, īga hēḷalla. Nīnu mātāḍbēḍa. Nidhānakke usiru tagō."
    en: "All right, Amma, I won't tell her now. Don't talk. Just breathe slowly."
  - who: "ajji"
    t: "ನಾನು ಮಾತು ಕೊಟ್ಟಿದೀನಿ ಕಣೋ, ಮರಿಮಗೂನ ಎತ್ಕೊಳ್ಳೋವರೆಗೂ ಹೋಗಲ್ಲ ಅಂತ. ಹೆದರ್ಬೇಡ."
    tr: "Nānu mātu koṭṭidīni kaṇō, marimagūna etkoḷḷōvaregū hōgalla anta. Hedarbēḍa."
    en: "I've given my word, son: I'm not going until I've held my great-grandchild. Don't be afraid."
  - who: "kiran"
    t: "ಹಲೋ? ಹೌದು, ನಾನೇ ಕಾಲ್ ಮಾಡಿದ್ದು. … ಗಣಪತಿ ದೇವಸ್ಥಾನ ದಾಟಿದ್ರಾ? ಸರಿ, ಎಡಕ್ಕೆ ತಿರುಗಿ. ಗೇಟ್ ಹತ್ರ ಒಬ್ಬರು ಟಾರ್ಚ್ ಹಿಡ್ಕೊಂಡು ನಿಂತಿದ್ದಾರೆ… ಹೌದು, ಬಿಳಿ ಹುಡುಗ, ಅವರೇ!"
    tr: "Halō? Haudu, nānē kāl māḍiddu. … Gaṇapati dēvasthāna dāṭidrā? Sari, eḍakke tirugi. Gēṭ hatra obbaru ṭārch hiḍkoṇḍu nintiddāre… haudu, biḷi huḍuga, avarē!"
    en: "(his phone rings) Hello? Yes, I'm the one who called. … Have you passed the Ganapati temple? Okay, turn left. Someone's standing at the gate with a torch… yes, the white guy, that's him!"
  - who: "sam"
    t: "ಕಿರಣ್! ಸೈರನ್ ಕೇಳಿಸ್ತಿದೆ! ಬಂತು!"
    tr: "Kiraṇ! Sairan kēḷistide! Bantu!"
    en: "(shouting from the gate) Kiran! I can hear the siren! It's here!"

  - section: "🚑 Manjunath and the ambulance"
    learn: "EMT questions: yāvāga śuru āytu?, yāva mātre?, hinde āpparēṣan āgittā? · āksijan hāktīni, isiji tegītīni · samaya tumbā mukhya (time is critical) · Hrudaya Jyothi scheme · -īgalē (right now)"
  - scene: "Two men in uniform come in with a folding carry-chair. The older one, about forty, speaks first."
  - who: "emt"
    t: "ನಮಸ್ಕಾರ, ನಾನು ಮಂಜುನಾಥ್, ಇಎಂಟಿ. ಅಜ್ಜಿ, ನಮಸ್ಕಾರ. ಹೆದರ್ಬೇಡಿ, ನಾವು ಬಂದಿದೀವಿ. ನೋವು ಎಲ್ಲಿದೆ? ಕೈ ಇಟ್ಟು ತೋರಿಸಿ."
    tr: "Namaskāra, nānu Manjunāth, i-em-ṭi. Ajji, namaskāra. Hedarbēḍi, nāvu bandidīvi. Nōvu ellide? Kai iṭṭu tōrisi."
    en: "Hello, I'm Manjunath, the EMT. Hello, Ajji. Don't be scared, we're here now. Where is the pain? Show me with your hand."
  - who: "ajji"
    t: "ಇಲ್ಲಿ… ಇಡೀ ಎದೆ… ಎಡಗೈ… ದವಡೆ ಹತ್ರಾನೂ."
    tr: "Illi… iḍī ede… eḍagai… davaḍe hatrānū."
    en: "(pressing her fist to the middle of her chest) Here… the whole chest… the left arm… near the jaw too."
  - who: "emt"
    t: "ಯಾವಾಗ ಶುರು ಆಯ್ತು? ಕರೆಕ್ಟ್ ಟೈಮ್ ಗೊತ್ತಾ?"
    tr: "Yāvāga śuru āytu? Karekṭ ṭaim gottā?"
    en: "When did it start? Do you know the exact time?"
  - who: "sam"
    t: "ಸೀರಿಯಲ್ ಶುರು ಆದಾಗ ಅಂತ ಅಜ್ಜಿ ಹೇಳಿದ್ರು, ಅಂದ್ರೆ ಒಂಬತ್ತು ಗಂಟೆ ಹತ್ರ. ಈಗ ಹತ್ತೂ ಕಾಲು."
    tr: "Sīriyal śuru ādāga anta ajji hēḷidru, andre ombattu gaṇṭe hatra. Īga hattū kālu."
    en: "Ajji said it started when her serial began, so around nine. It's quarter past ten now."
  - who: "emt"
    t: "ಅಂದ್ರೆ ಒಂದು ಗಂಟೆಗಿಂತ ಜಾಸ್ತಿ ಆಗಿದೆ. ಟೈಮ್ ವೇಸ್ಟ್ ಮಾಡೋದು ಬೇಡ. ಹರೀಶ್, ಸ್ಯಾಚುರೇಷನ್ ನೋಡು. … ತೊಂಬತ್ತೊಂದು. ಅಜ್ಜಿ, ಮೂಗಿಗೆ ಆಕ್ಸಿಜನ್ ಹಾಕ್ತೀನಿ. ಸ್ವಲ್ಪ ತಣ್ಣಗೆ ಅನ್ಸುತ್ತೆ ಅಷ್ಟೇ."
    tr: "Andre ondu gaṇṭeginta jāsti āgide. Ṭaim vēsṭ māḍōdu bēḍa. Harīś, syāchurēṣan nōḍu. … Tombattondu. Ajji, mūgige āksijan hāktīni. Svalpa taṇṇage ansutte aṣṭē."
    en: "So it's been more than an hour. No time to waste. Harish, check her saturation. … Ninety-one. Ajji, I'm putting oxygen in your nose. It'll feel a bit cold, that's all."
  - who: "emt"
    t: "ಮನೇಲಿ ಯಾವ ಮಾತ್ರೆ ತಗೋತಾರೆ? ರಕ್ತ ತೆಳ್ಳಗೆ ಮಾಡೋ ಮಾತ್ರೆ ಏನಾದ್ರೂ ಇದ್ಯಾ? ಹಿಂದೆ ಸ್ಟ್ರೋಕ್, ಆಪರೇಷನ್, ಹೊಟ್ಟೇಲಿ ಅಲ್ಸರ್, ಏನಾದ್ರೂ ಆಗಿತ್ತಾ?"
    tr: "Manēli yāva mātre tagōtāre? Rakta teḷḷage māḍō mātre ēnādrū idyā? Hinde sṭrōk, āpparēṣan, hoṭṭēli alsar, ēnādrū āgittā?"
    en: "Which tablets does she take at home? Anything that thins the blood? Has she ever had a stroke, an operation, a stomach ulcer, anything like that?"
  - who: "appa"
    t: "ಬಿಪಿಗೆ ಒಂದು, ಶುಗರ್‌ಗೆ ಎರಡು. ಇಗೋ, ಡಬ್ಬ. ಸ್ಟ್ರೋಕ್ ಆಗಿಲ್ಲ. ಆಪರೇಷನ್ ಅಂದ್ರೆ ಎಂಟು ವರ್ಷದ ಹಿಂದೆ ಕಣ್ಣಿನ ಕ್ಯಾಟರಾಕ್ಟ್ ಅಷ್ಟೇ."
    tr: "Bi-pige ondu, śugar-ge eraḍu. Igō, ḍabba. Sṭrōk āgilla. Āpparēṣan andre eṇṭu varṣada hinde kaṇṇina kyāṭarākṭ aṣṭē."
    en: "One for BP, two for sugar. Here's the box. No stroke. The only operation was cataract surgery eight years ago."
  - who: "emt"
    t: "ಸರಿ. ಅಜ್ಜಿ, ನೀವು ನಡೀಬೇಡಿ. ಈ ಚೇರ್‌ನಲ್ಲಿ ಕೂರಿಸಿ ನಾವೇ ಎತ್ಕೊಂಡು ಹೋಗ್ತೀವಿ. ಇಸಿಜಿ ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲೇ ತೆಗೀತೀನಿ. ಸಾರ್, ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಒಬ್ಬರಿಗೆ ಮಾತ್ರ ಜಾಗ. ಪೇಶಂಟ್ ಬಗ್ಗೆ ಎಲ್ಲಾ ಗೊತ್ತಿರೋರು, ಸೈನ್ ಮಾಡೋರು ಬನ್ನಿ."
    tr: "Sari. Ajji, nīvu naḍībēḍi. Ī chēr-nalli kūrisi nāvē etkoṇḍu hōgtīvi. Isiji āmbulens-nallē tegītīni. Sār, āmbulens-nalli obbarige mātra jāga. Pēśaṇṭ bagge ellā gottirōru, sain māḍōru banni."
    en: "Okay. Ajji, don't walk. We'll sit you in this chair and carry you. I'll do the ECG in the ambulance. Sir, there's room for only one person in the ambulance. Whoever knows everything about the patient and can sign, come along."
  - who: "appa"
    t: "ನಾನು ಬರ್ತೀನಿ. ಲಕ್ಷ್ಮಿ, ನೀನು ಕಿರಣ್, ಸ್ಯಾಮ್ ಜೊತೆ ಕಾರ್‌ನಲ್ಲಿ ಹಿಂದೆ ಬಾ. ಬ್ಯಾಗ್ ಮರೀಬೇಡ."
    tr: "Nānu bartīni. Lakshmī, nīnu Kiraṇ, Sām jote kār-nalli hinde bā. Byāg marībēḍa."
    en: "I'll come. Lakshmi, follow behind in the car with Kiran and Sam. Don't forget the bag."
  - who: "sam"
    t: "ನಾನು ಡ್ರೈವ್ ಮಾಡ್ತೀನಿ, ಅಂಕಲ್. ಜಯದೇವಕ್ಕೆ ತಾನೇ?"
    tr: "Nānu ḍraiv māḍtīni, aṅkal. Jayadēvakke tānē?"
    en: "I'll drive, Uncle. It's Jayadeva, right?"
  - who: "emt"
    t: "ಹೇಳ್ತೀನಿ, ಮೊದಲು ಇಸಿಜಿ ನೋಡೋಣ. ಆಂಬುಲೆನ್ಸ್ ನಂಬರ್ ಫೋಟೋ ತಗೊಳ್ಳಿ, ಹಿಂದೆನೇ ಬನ್ನಿ."
    tr: "Hēḷtīni, modalu isiji nōḍōṇa. Āmbulens nambar phōṭō tagoḷḷi, hindenē banni."
    en: "I'll tell you; let's see the ECG first. Take a photo of the ambulance number and follow right behind."
  - scene: "Inside the ambulance, siren on, rain lashing the windscreen. Manjunath sticks electrodes on Ajji's chest and looks at the small screen, then at his phone."
  - who: "emt"
    t: "ಇಸಿಜಿ ಬಂತು. ಇದನ್ನ ನಮ್ಮ ಕಂಟ್ರೋಲ್ ರೂಮ್ ಡಾಕ್ಟ್ರಿಗೆ ಕಳಿಸಿದೀನಿ. … ಸಾರ್, ಅವರು ಹೇಳ್ತಿದ್ದಾರೆ, ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿರೋ ಹಾಗಿದೆ ಅಂತ. ಡಾಕ್ಟ್ರು ಹೇಳಿದ ಹಾಗೆ ಆಸ್ಪಿರಿನ್ ಕೊಡ್ತೀನಿ. ಅಜ್ಜಿ, ಈ ಮಾತ್ರೆ ನುಂಗಬೇಡಿ, ಅಗಿದು ತಿನ್ನಿ."
    tr: "Isiji bantu. Idanna namma kaṇṭrōl rūm ḍākṭrige kaḷisidīni. … Sār, avaru hēḷtiddāre, hārṭ aṭyāk āgirō hāgide anta. Ḍākṭru hēḷida hāge āspirin koḍtīni. Ajji, ī mātre nuṅgabēḍi, agidu tinni."
    en: "The ECG is done. I've sent it to the doctor at our control room. … Sir, he says it looks like a heart attack. On the doctor's instructions I'm giving her aspirin. Ajji, don't swallow this tablet whole, chew it."
  - who: "appa"
    t: "ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್… ಮಂಜುನಾಥ್ ಅವರೇ, ಜೀವಕ್ಕೆ ಏನೂ ಅಪಾಯ ಇಲ್ಲ ತಾನೇ? ನಿಜ ಹೇಳಿ."
    tr: "Hārṭ aṭyāk… Manjunāth avarē, jīvakke ēnū apāya illa tānē? Nija hēḷi."
    en: "A heart attack… Manjunath, there's no danger to her life, is there? Tell me the truth."
  - who: "emt"
    t: "ಸಾರ್, ನಾನು ಡಾಕ್ಟ್ರಲ್ಲ. ಆದ್ರೆ ಒಂದು ಹೇಳ್ತೀನಿ: ಇಂಥ ಕೇಸ್‌ನಲ್ಲಿ ಸಮಯ ತುಂಬಾ ಮುಖ್ಯ. ನೀವು ಗ್ಯಾಸ್ ಅಂತ ಬೆಳಿಗ್ಗೆವರೆಗೂ ಕಾಯಲಿಲ್ಲ. ತುಂಬಾ ಜನ ಕಾಯ್ತಾರೆ. ಅದೇ ದೊಡ್ಡ ವಿಷಯ."
    tr: "Sār, nānu ḍākṭralla. Ādre ondu hēḷtīni: intha kēs-nalli samaya tumbā mukhya. Nīvu gyās anta beḷiggevaregū kāyalilla. Tumbā jana kāytāre. Adē doḍḍa viṣaya."
    en: "Sir, I'm not a doctor. But I'll tell you one thing: in cases like this, time matters most. You didn't sit waiting till morning thinking it was gas. A lot of people do. That counts for a great deal."
  - who: "appa"
    t: "ನೇರವಾಗಿ ಜಯದೇವಕ್ಕೆ ಯಾಕೆ ಹೋಗ್ತಿಲ್ಲ? ಅದು ಇಲ್ಲೇ ಮೂರು-ನಾಲ್ಕು ಕಿಲೋಮೀಟರ್."
    tr: "Nēravāgi Jayadēvakke yāke hōgtilla? Adu illē mūru-nālku kilōmīṭar."
    en: "Why aren't we going straight to Jayadeva? It's only three or four kilometres from here."
  - who: "emt"
    t: "ಡೈರಿ ಸರ್ಕಲ್ ಹತ್ರ ಮೊಣಕಾಲುದ್ದ ನೀರು ನಿಂತಿದೆ, ಟ್ರಾಫಿಕ್ ಮುಂದೆ ಹೋಗ್ತಾನೇ ಇಲ್ಲ ಅಂತ ಕಂಟ್ರೋಲ್ ರೂಮ್ ಹೇಳ್ತಿದೆ. ಹತ್ತಿರದ ಸರ್ಕಾರಿ ಆಸ್ಪತ್ರೆ ಹೃದಯ ಜ್ಯೋತಿ ಸ್ಕೀಮ್‌ನಲ್ಲಿದೆ. ಅಲ್ಲಿ ತಕ್ಷಣ ಹೆಪ್ಪು ಕರಗಿಸೋ ಇಂಜೆಕ್ಷನ್ ಕೊಡ್ತಾರೆ, ಆಮೇಲೆ ಅಲ್ಲಿಂದಾನೇ ಜಯದೇವಕ್ಕೆ ಶಿಫ್ಟ್ ಮಾಡ್ತಾರೆ. ಡಾಕ್ಟ್ರೇ ಹಾಗೆ ಹೇಳಿದ್ರು."
    tr: "Ḍairi Sarkal hatra moṇakāludda nīru nintide, ṭrāphik munde hōgtānē illa anta kaṇṭrōl rūm hēḷtide. Hattirada sarkāri āspatre Hṛdaya Jyōti skīm-nallide. Alli takṣaṇa heppu karagisō injekṣan koḍtāre, āmēle allindānē Jayadēvakke śiphṭ māḍtāre. Ḍākṭrē hāge hēḷidru."
    en: "The control room says there's knee-deep water at Dairy Circle and the traffic isn't moving at all. The nearest government hospital is part of the Hrudaya Jyothi scheme. They'll give a clot-dissolving injection there straight away, and then shift her to Jayadeva from there. That's what the doctor told us to do."
  - who: "ajji"
    t: "ಹೃದಯ ಜ್ಯೋತಿ… ಪುನೀತ್ ಹೆಸರಿನ ಸ್ಕೀಮ್ ಅಲ್ವಾ ಅದು? ಪಾಪ, ಆ ಹುಡುಗ… ನಲವತ್ತಾರು ವರ್ಷಕ್ಕೇ…"
    tr: "Hṛdaya Jyōti… Punīt hesarina skīm alvā adu? Pāpa, ā huḍuga… nalavattāru varṣakkē…"
    en: "(weakly) Hrudaya Jyothi… that's the scheme named after Puneeth, isn't it? Poor boy… only forty-six…"
  - who: "emt"
    t: "ಹೌದು ಅಜ್ಜಿ, ಅಪ್ಪು ಹೆಸರಿನದ್ದೇ. ಈಗ ನೀವು ಮಾತಾಡ್ಬೇಡಿ, ಆಕ್ಸಿಜನ್ ತಗೊಳ್ಳಿ. ಉಳಿದಿದ್ದೆಲ್ಲಾ ನಾವು ನೋಡ್ಕೊಳ್ತೀವಿ."
    tr: "Haudu ajji, Appu hesarinaddē. Īga nīvu mātāḍbēḍi, āksijan tagoḷḷi. Uḷididdellā nāvu nōḍkoḷḷtīvi."
    en: "Yes, Ajji, it's named after Appu. Now don't talk; just take the oxygen. We'll take care of everything else."

  - section: "🏥 The emergency room: Dr. Anand"
    learn: "ER formulas: nīvu pēśaṇṭ-ge ēnāgbēku? (how are you related?) · explaining risk: -abahudu, -adidre (if not …) · eṣṭu bēga … aṣṭu (the sooner … the more) · heppu (clot), raktanāḷa (blood vessel), ucita (free) · consent form: spoken vs written register"
  - scene: "Twenty to eleven. The emergency room of a government hospital near Jayanagar: bright tube lights, a crowded corridor, monitors beeping. Ajji lies on a trolley bed. Amma, Kiran and Sam have just arrived. A young doctor with tired eyes comes out holding a strip of ECG paper."
  - who: "erdoc"
    t: "ಸರಸ್ವತಮ್ಮ ಅವರ ಕಡೆಯವರು ಯಾರು? ನೀವು ಪೇಶಂಟ್‌ಗೆ ಏನಾಗ್ಬೇಕು?"
    tr: "Sarasvatamma avara kaḍeyavaru yāru? Nīvu pēśaṇṭ-ge ēnāgbēku?"
    en: "Who's with Saraswathamma? How are you related to the patient?"
  - who: "appa"
    t: "ನಾನು ಮಗ, ಸಾರ್. ರಮೇಶ್. ಇವರು ನನ್ನ ಹೆಂಡತಿ, ಇವನು ಮಗ. ಡಾಕ್ಟ್ರೇ, ಅಮ್ಮ ಹೇಗಿದ್ದಾರೆ?"
    tr: "Nānu maga, sār. Ramēsh. Ivaru nanna heṇḍati, ivanu maga. Ḍākṭrē, amma hēgiddāre?"
    en: "I'm her son, sir. Ramesh. This is my wife, and this is my son. Doctor, how is my mother?"
  - who: "erdoc"
    t: "ನಾನು ಡಾಕ್ಟರ್ ಆನಂದ್, ಎಮರ್ಜೆನ್ಸಿ ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು. ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ, ಆಮೇಲೆ ಏನು ಬೇಕಾದ್ರೂ ಕೇಳಿ. ಇಸಿಜಿ ನೋಡಿದ್ವಿ. ಅವರಿಗೆ ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿದೆ. ನಾವು ಇದಕ್ಕೆ ಸ್ಟೆಮಿ ಅಂತೀವಿ."
    tr: "Nānu Ḍākṭar Ānand, emarjensi ḍyūṭi ḍākṭru. Nēravāgi hēḷtīni, āmēle ēnu bēkādrū kēḷi. Isiji nōḍidvi. Avarige hārṭ aṭyāk āgide. Nāvu idakke sṭemi antīvi."
    en: "I'm Dr. Anand, the emergency duty doctor. I'll be direct, and then you can ask me anything. We've looked at the ECG. She has had a heart attack. We call this type a STEMI."
  - who: "erdoc"
    t: "ಹೃದಯಕ್ಕೆ ರಕ್ತ ಕೊಡೋ ಒಂದು ರಕ್ತನಾಳದಲ್ಲಿ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟಿ ಪೂರ್ತಿ ಬ್ಲಾಕ್ ಆಗಿದೆ. ಹೃದಯದ ಆ ಭಾಗಕ್ಕೆ ರಕ್ತ ಹೋಗ್ತಿಲ್ಲ. ಎಷ್ಟು ಬೇಗ ಆ ಬ್ಲಾಕ್ ತೆಗೀತೀವೋ, ಅಷ್ಟು ಹೃದಯ ಉಳಿಯುತ್ತೆ."
    tr: "Hṛdayakke rakta koḍō ondu raktanāḷadalli rakta heppugaṭṭi pūrti blāk āgide. Hṛdayada ā bhāgakke rakta hōgtilla. Eṣṭu bēga ā blāk tegītīvō, aṣṭu hṛdaya uḷiyutte."
    en: "In one of the blood vessels that supplies the heart, the blood has clotted and blocked it completely. No blood is reaching that part of the heart. The sooner we open that block, the more of the heart we save."
  - who: "amma"
    t: "ಡಾಕ್ಟ್ರೇ, ಅವರು ಗ್ಯಾಸ್ ಅಂತ ಹೇಳ್ತಿದ್ರು… ನಾನು ಜೀರಿಗೆ ನೀರು ಕೊಟ್ಟೆ… ನನ್ನಿಂದ ತಪ್ಪಾಯ್ತಾ?"
    tr: "Ḍākṭrē, avaru gyās anta hēḷtidru… nānu jīrige nīru koṭṭe… nanninda tappāytā?"
    en: "Doctor, she kept saying it was gas… I gave her cumin water… did I do something wrong?"
  - who: "erdoc"
    t: "ಇಲ್ಲ ಮೇಡಂ, ನೀವೇನೂ ತಪ್ಪು ಮಾಡಿಲ್ಲ. ವಯಸ್ಸಾದವರಲ್ಲಿ, ಹೆಂಗಸರಲ್ಲಿ, ಶುಗರ್ ಇರೋರಲ್ಲಿ ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ತುಂಬಾ ಸಲ ಗ್ಯಾಸ್ ತರಾನೇ ಕಾಣಿಸುತ್ತೆ. ನೀವು ಎರಡು ಗಂಟೆ ಒಳಗೆ ಕರ್ಕೊಂಡು ಬಂದ್ರಿ. ಅದು ಒಳ್ಳೇದು."
    tr: "Illa mēḍam, nīvēnū tappu māḍilla. Vayassādavaralli, heṅgasaralli, śugar irōralli hārṭ aṭyāk tumbā sala gyās tarānē kāṇisutte. Nīvu eraḍu gaṇṭe oḷage karkoṇḍu bandri. Adu oḷḷēdu."
    en: "No, madam, you did nothing wrong. In older people, in women and in diabetics, a heart attack very often looks just like gas. You brought her within two hours. That's good."
  - who: "erdoc"
    t: "ಈಗ ಪ್ಲಾನ್ ಕೇಳಿ. ಹೃದಯ ಜ್ಯೋತಿ ಯೋಜನೆಯಲ್ಲಿ ಟೆನೆಕ್ಟಿಪ್ಲೇಸ್ ಅನ್ನೋ ಇಂಜೆಕ್ಷನ್ ಕೊಡ್ತೀವಿ. ಅದು ರಕ್ತನಾಳದಲ್ಲಿರೋ ಹೆಪ್ಪನ್ನ ಕರಗಿಸುತ್ತೆ. ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ ಈ ಒಂದು ಇಂಜೆಕ್ಷನ್‌ಗೇ ಮೂವತ್ತು-ನಲವತ್ತು ಸಾವಿರ ಆಗುತ್ತೆ. ಇಲ್ಲಿ ಉಚಿತ."
    tr: "Īga plān kēḷi. Hṛdaya Jyōti yōjaneyalli ṭenekṭiplēs annō injekṣan koḍtīvi. Adu raktanāḷadallirō heppanna karagisutte. Praivēṭ-nalli ī ondu injekṣan-gē mūvattu-nalavattu sāvira āgutte. Illi uchita."
    en: "Now listen to the plan. Under the Hrudaya Jyothi scheme, we give an injection called tenecteplase. It dissolves the clot in the blood vessel. In a private hospital this one injection alone costs thirty to forty thousand. Here it's free."
  - who: "appa"
    t: "ದುಡ್ಡಿನ ವಿಷಯ ಬಿಡಿ, ಸಾರ್. ಇಂಜೆಕ್ಷನ್‌ನಿಂದ ಏನಾದ್ರೂ ರಿಸ್ಕ್ ಇದ್ಯಾ?"
    tr: "Duḍḍina viṣaya biḍi, sār. Injekṣan-ninda ēnādrū risk idyā?"
    en: "Forget the money, sir. Is there any risk from the injection?"
  - who: "erdoc"
    t: "ಇದೆ, ಮುಚ್ಚಿಡಲ್ಲ. ರಕ್ತ ಕರಗಿಸೋ ಔಷಧಿ ಅಲ್ವಾ, ಅದಕ್ಕೆ ಎಲ್ಲಾದ್ರೂ ಬ್ಲೀಡಿಂಗ್ ಆಗಬಹುದು. ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷದಲ್ಲಿ ಆ ರಿಸ್ಕ್ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಅಪರೂಪಕ್ಕೆ ತಲೆಯೊಳಗೂ ಆಗಬಹುದು. ಆದ್ರೆ ಇಂಜೆಕ್ಷನ್ ಕೊಡದಿದ್ರೆ, ಹೃದಯದ ಆ ಭಾಗ ಹಾಳಾಗೋ ರಿಸ್ಕ್ ಅದಕ್ಕಿಂತ ತುಂಬಾ ಜಾಸ್ತಿ."
    tr: "Ide, muchchiḍalla. Rakta karagisō auṣadhi alvā, adakke ellādrū blīḍiṅg āgabahudu. Eppattombattu varṣadalli ā risk svalpa jāsti. Aparūpakke taleyoḷagū āgabahudu. Ādre injekṣan koḍadidre, hṛdayada ā bhāga hāḷāgō risk adakkinta tumbā jāsti."
    en: "There is; I won't hide it. It's a clot-dissolving drug, so there can be bleeding somewhere. At seventy-nine that risk is a little higher. Rarely, it can even happen inside the head. But if we don't give the injection, the risk of that part of the heart being permanently damaged is much, much higher."
  - who: "kiran"
    t: "ಇಂಜೆಕ್ಷನ್ ಕೊಟ್ಟ ಮೇಲೆ ಎಲ್ಲಾ ಸರಿ ಹೋಗುತ್ತಾ? ಆಮೇಲೆ ಮನೆಗೆ ಕರ್ಕೊಂಡು ಹೋಗಬಹುದಾ?"
    tr: "Injekṣan koṭṭa mēle ellā sari hōguttā? Āmēle manege karkoṇḍu hōgabahudā?"
    en: "Will everything be fine after the injection? Can we take her home after that?"
  - who: "erdoc"
    t: "ಇಲ್ಲ, ಇದು ಮೊದಲ ಹೆಜ್ಜೆ ಅಷ್ಟೇ. ಇಂಜೆಕ್ಷನ್ ಆದ ತಕ್ಷಣ ಜಯದೇವಕ್ಕೆ ರೆಫರ್ ಮಾಡ್ತೀವಿ. ಅಲ್ಲಿ ಆಂಜಿಯೋಗ್ರಾಮ್ ಮಾಡಿ ಬ್ಲಾಕ್ ಎಲ್ಲಿದೆ, ಎಷ್ಟಿದೆ ಅಂತ ನೋಡ್ತಾರೆ. ಬೇಕಾದ್ರೆ ಸ್ಟೆಂಟ್ ಹಾಕ್ತಾರೆ. ಅದೇ ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಕಳಿಸ್ತೀವಿ. ಜಯದೇವಕ್ಕೆ ನಾವೇ ಫೋನ್ ಮಾಡಿ ಇಸಿಜಿ ಕಳಿಸಿರ್ತೀವಿ."
    tr: "Illa, idu modala hejje aṣṭē. Injekṣan āda takṣaṇa Jayadēvakke rephar māḍtīvi. Alli āñjiyōgrām māḍi blāk ellide, eṣṭide anta nōḍtāre. Bēkādre sṭeṇṭ hāktāre. Adē āmbulens-nalli kaḷistīvi. Jayadēvakke nāvē phōn māḍi isiji kaḷisirtīvi."
    en: "No, this is only the first step. As soon as the injection is done, we'll refer her to Jayadeva. There they'll do an angiogram to see where the block is and how bad. If needed, they'll put in a stent. We'll send her in the same ambulance. We'll have called Jayadeva and sent them the ECG ourselves."
  - who: "erdoc"
    t: "ಈ ಕನ್ಸೆಂಟ್ ಫಾರ್ಮ್ ನೋಡಿ, ಕನ್ನಡ-ಇಂಗ್ಲಿಷ್ ಎರಡರಲ್ಲೂ ಇದೆ. ನಾನು ಈಗ ಹೇಳಿದ್ದೇ ಇದರಲ್ಲಿ ಬರೆದಿದೆ. ಪೇಶಂಟ್ ಸೈನ್ ಮಾಡ್ತಾರೆ, ನೀವೂ ಹತ್ತಿರದ ಸಂಬಂಧಿಯಾಗಿ ಸೈನ್ ಮಾಡ್ಬೇಕು. ಬೇಗ, ಪ್ಲೀಸ್."
    tr: "Ī kanseṇṭ phārm nōḍi, Kannaḍa-iṅgliṣ eraḍarallū ide. Nānu īga hēḷiddē idaralli baredide. Pēśaṇṭ sain māḍtāre, nīvū hattirada sambandhiyāgi sain māḍbēku. Bēga, plīs."
    en: "Look at this consent form; it's in both Kannada and English. What I just told you is what's written here. The patient will sign, and you need to sign too, as next of kin. Quickly, please."
  - who: "appa"
    t: "ಸಾರ್, ಕೈ ನಡುಗ್ತಿದೆ… ಅಕ್ಷರ ಕಾಣಿಸ್ತಿಲ್ಲ. ಕಿರಣ್, ನೀನು ಸ್ವಲ್ಪ ಓದು."
    tr: "Sār, kai naḍugtide… akṣara kāṇistilla. Kiraṇ, nīnu svalpa ōdu."
    en: "(holding the pen, unable to steady it) Sir, my hand is shaking… I can't see the letters. Kiran, you read it."
  - who: "kiran"
    t: "“ರೋಗಿಗೆ ತೀವ್ರ ಹೃದಯಾಘಾತ ಆಗಿರುವುದರಿಂದ ಥ್ರಾಂಬೊಲಿಸಿಸ್ ಚಿಕಿತ್ಸೆ ನೀಡಲಾಗುವುದು. ಈ ಚಿಕಿತ್ಸೆಯಲ್ಲಿ ರಕ್ತಸ್ರಾವದ ಅಪಾಯ ಇರುತ್ತದೆ ಎಂದು ನಮಗೆ ವಿವರಿಸಲಾಗಿದೆ…” ಅಪ್ಪ, ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ದೇ ಇದೆ. ಸೈನ್ ಮಾಡು."
    tr: "“Rōgige tīvra hṛdayāghāta āgiruvudarinda thrāmbolisis chikitse nīḍalāguvudu. Ī chikitseyalli raktasrāvada apāya iruttade endu namage vivarisalāgide…” Appa, ḍākṭru hēḷiddē ide. Sain māḍu."
    en: "“As the patient has suffered a severe heart attack, thrombolysis treatment will be administered. It has been explained to us that this treatment carries a risk of bleeding…” Appa, it's exactly what the doctor said. Sign it."
  - who: "appa"
    t: "ತಗೊಳ್ಳಿ, ಸಾರ್. ಡಾಕ್ಟ್ರೇ… ನಮ್ಮಮ್ಮ… ಉಳೀತಾರಾ?"
    tr: "Tagoḷḷi, sār. Ḍākṭrē… nammamma… uḷītārā?"
    en: "(signing) Here, sir. Doctor… my mother… will she make it?"
  - who: "erdoc"
    t: "ಈಗ ಬಿಪಿ ಸ್ಟೇಬಲ್ ಆಗಿದೆ, ಮಾತಾಡ್ತಿದ್ದಾರೆ. ಅದು ಒಳ್ಳೆ ಲಕ್ಷಣ. ಗ್ಯಾರಂಟಿ ಕೊಡೋಕಾಗಲ್ಲ, ಸಾರ್. ಆದ್ರೆ ನಮ್ಮ ಕೈಲಾದಷ್ಟು ಎಲ್ಲಾ ಮಾಡ್ತೀವಿ. ಮುಂದಿನ ಕೆಲವು ಗಂಟೆ ತುಂಬಾ ಮುಖ್ಯ."
    tr: "Īga bi-pi sṭēbal āgide, mātāḍtiddāre. Adu oḷḷe lakṣaṇa. Gyāraṇṭi koḍōkāgalla, sār. Ādre namma kailādaṣṭu ellā māḍtīvi. Mundina kelavu gaṇṭe tumbā mukhya."
    en: "Her BP is stable now and she's talking. That's a good sign. I can't give you a guarantee, sir. But we'll do everything in our power. The next few hours are very important."

  - section: "📱 Telling Shwetha"
    learn: "breaking bad news gently: modalu kūtkō, dīrghavāgi usiru tagō · hearsay -ante (stēbal ante) · don't rush: ōḍi barbēḍa · promise: āṇe · relaying a message with … anta hēḷu"
  - scene: "Twenty past eleven. Ajji has had the injection and is being readied for the transfer to Jayadeva. In the corridor, Appa looks at his phone: three missed calls from Shwetha."
  - who: "appa"
    t: "ಕಿರಣ್, ಶ್ವೇತಾ ಮೂರು ಸಲ ಫೋನ್ ಮಾಡಿದ್ದಾಳೆ. ಯಾರೋ ಹೇಳಿರ್ಬೇಕು. ಅಮ್ಮ ಬೇಡ ಅಂದಿದ್ರು, ಆದ್ರೆ ಮುಚ್ಚಿಟ್ರೆ ಇನ್ನೂ ಕೆಟ್ಟದು."
    tr: "Kiraṇ, Shwētā mūru sala phōn māḍiddāḷe. Yārō hēḷirbēku. Amma bēḍa andidru, ādre muchchiṭre innū keṭṭadu."
    en: "Kiran, Shwetha has called three times. Someone must have told her. Amma said not to, but hiding it would be worse."
  - who: "kiran"
    t: "ನಾನು ಮಾತಾಡ್ತೀನಿ, ಅಪ್ಪ. ನೀನು ಮಾತಾಡಿದ್ರೆ ನಿನ್ ಧ್ವನಿ ಕೇಳಿನೇ ಅವಳು ಇನ್ನೂ ಹೆದರ್ತಾಳೆ."
    tr: "Nānu mātāḍtīni, appa. Nīnu mātāḍidre nin dhvani kēḷinē avaḷu innū hedartāḷe."
    en: "I'll talk to her, Appa. If you do, just hearing your voice will scare her even more."
  - who: "shwe"
    t: "ಕಿರಣ್! ಏನಾಗ್ತಿದೆ? ವಿಮಲಾ ಆಂಟಿ ಸೊಸೆ ಇನ್‌ಸ್ಟಾ ಸ್ಟೋರಿಲಿ ನಮ್ಮ ಮನೆ ಮುಂದೆ ಆಂಬುಲೆನ್ಸ್ ಫೋಟೋ ಹಾಕಿದ್ದಾಳೆ! ಅಜ್ಜಿಗೆ ಏನಾಯ್ತು? ನಿಜ ಹೇಳು!"
    tr: "Kiraṇ! Ēnāgtide? Vimalā āṇṭi sose insṭā sṭōrili namma mane munde āmbulens phōṭō hākiddāḷe! Ajjige ēnāytu? Nija hēḷu!"
    en: "(on the phone) Kiran! What's going on? Vimala Aunty's daughter-in-law has posted a photo of an ambulance outside our house on her Insta story! What happened to Ajji? Tell me the truth!"
  - who: "kiran"
    t: "ಅಕ್ಕ, ಮೊದಲು ಕೂತ್ಕೋ. ದೀರ್ಘವಾಗಿ ಉಸಿರು ತಗೋ. … ಅಜ್ಜಿಗೆ ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿದೆ. ಆದ್ರೆ ಕೇಳು: ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ಆಸ್ಪತ್ರೆಗೆ ಬಂದ್ವಿ. ಇಂಜೆಕ್ಷನ್ ಕೊಟ್ಟಿದ್ದಾರೆ, ಮಾತಾಡ್ತಿದ್ದಾರೆ. ಬಿಪಿ ಸ್ಟೇಬಲ್ ಅಂತೆ."
    tr: "Akka, modalu kūtkō. Dīrghavāgi usiru tagō. … Ajjige hārṭ aṭyāk āgide. Ādre kēḷu: samayakke sariyāgi āspatrege bandvi. Injekṣan koṭṭiddāre, mātāḍtiddāre. Bi-pi sṭēbal ante."
    en: "Akka, sit down first. Take a deep breath. … Ajji has had a heart attack. But listen: we got to the hospital in time. They've given her an injection, and she's talking. The doctor says her BP is stable."
  - who: "shwe"
    t: "ಅಯ್ಯೋ… ಅಜ್ಜಿ… ನಾನು ಈಗಲೇ ಬರ್ತೀನಿ. ಪ್ರದೀಪ್, ಕಾರ್ ಕೀ ತಗೋ…"
    tr: "Ayyō… ajji… nānu īgalē bartīni. Pradīp, kār kī tagō…"
    en: "Oh no… Ajji… I'm coming right now. Pradeep, get the car keys…"
  - who: "kiran"
    t: "ಬೇಡ ಅಕ್ಕ, ಪ್ಲೀಸ್. ಈಗ ಅಜ್ಜಿನ ಜಯದೇವಕ್ಕೆ ಶಿಫ್ಟ್ ಮಾಡ್ತಿದ್ದಾರೆ. ನೀನು ಬಂದ್ರೂ ಒಳಗೆ ಬಿಡಲ್ಲ, ರಾತ್ರಿಯೆಲ್ಲಾ ಕಾರಿಡಾರ್‌ನಲ್ಲಿ ನಿಂತಿರ್ತೀಯ. ನಿನ್ ಹೊಟ್ಟೇಲಿರೋ ಮಗೂಗೆ ಅದು ಒಳ್ಳೇದಲ್ಲ."
    tr: "Bēḍa akka, plīs. Īga ajjina Jayadēvakke śiphṭ māḍtiddāre. Nīnu bandrū oḷage biḍalla, rātriyellā kāriḍār-nalli nintirtīya. Nin hoṭṭēlirō magūge adu oḷḷēdalla."
    en: "No, Akka, please. They're shifting Ajji to Jayadeva now. Even if you come, they won't let you in; you'll be standing in a corridor all night. That's not good for the baby you're carrying."
  - who: "pradeep"
    t: "ಕಿರಣ್, ನಾನು ಪ್ರದೀಪ್, ಸ್ಪೀಕರ್‌ನಲ್ಲಿದ್ದೀನಿ. ನಾನು ಈಗ ಜಯದೇವಕ್ಕೆ ಬರ್ತೀನಿ, ಮಾವನ ಜೊತೆ ಇರ್ತೀನಿ. ಶ್ವೇತಾ ಮನೇಲಿರ್ತಾಳೆ. ಬೆಳಿಗ್ಗೆ ನಾನೇ ಅವಳನ್ನ ಕರ್ಕೊಂಡು ಬರ್ತೀನಿ. ಸರಿನಾ, ಶ್ವೇತಾ?"
    tr: "Kiraṇ, nānu Pradīp, spīkar-nalliddīni. Nānu īga Jayadēvakke bartīni, māvana jote irtīni. Shwētā manēlirtāḷe. Beḷigge nānē avaḷanna karkoṇḍu bartīni. Sarinā, Shwētā?"
    en: "Kiran, it's Pradeep, I'm on speaker. I'll come to Jayadeva now and stay with your father. Shwetha will stay home. In the morning I'll bring her myself. All right, Shwetha?"
  - who: "shwe"
    t: "…ಸರಿ. ಆದ್ರೆ ಪ್ರತಿ ಅರ್ಧ ಗಂಟೆಗೆ ಮೆಸೇಜ್ ಮಾಡ್ಬೇಕು, ಆಣೆ. ಕಿರಣ್… ಅಜ್ಜಿಗೆ ಹೇಳು, ನಾನು ಕಾಯ್ತಿದ್ದೀನಿ ಅಂತ. ನಾವಿಬ್ರೂ ಕಾಯ್ತಿದ್ದೀವಿ ಅಂತ."
    tr: "…Sari. Ādre prati ardha gaṇṭege mesēj māḍbēku, āṇe. Kiraṇ… ajjige hēḷu, nānu kāytiddīni anta. Nāvibrū kāytiddīvi anta."
    en: "(crying) …Okay. But you message me every half hour, promise. Kiran… tell Ajji I'm waiting for her. Tell her we're both waiting."
  - who: "appa"
    t: "ಶ್ವೇತಾ, ಮಗಳೇ… ಅಜ್ಜಿ ನಿನಗೆ ಒಂದು ಮಾತು ಹೇಳಿ ಅಂದ್ರು: “ಮರಿಮಗೂನ ಎತ್ಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ.” ನೀನು ಸಮಾಧಾನವಾಗಿ ಮಲಗು, ಮಗಳೇ."
    tr: "Shwētā, magaḷē… ajji ninage ondu mātu hēḷi andru: “Marimagūna etkoḷḷōvaregū nānu ellū hōgalla.” Nīnu samādhānavāgi malagu, magaḷē."
    en: "(taking the phone) Shwetha, my girl… Ajji asked me to give you a message: “I'm not going anywhere until I've held my great-grandchild.” Now try to sleep, my dear."
  - who: "emt"
    t: "ಸಾರ್, ಪೇಶಂಟ್ ರೆಡಿ. ಜಯದೇವಕ್ಕೆ ಹೊರಡ್ತಿದ್ದೀವಿ. ಒಬ್ಬರು ಬನ್ನಿ, ಬೇಗ."
    tr: "Sār, pēśaṇṭ reḍi. Jayadēvakke horaḍtiddīvi. Obbaru banni, bēga."
    en: "Sir, the patient is ready. We're leaving for Jayadeva. One of you come, quickly."
  - who: "appa"
    t: "ಬಂದೆ. ಲಕ್ಷ್ಮಿ, ಕಿರಣ್, ಸ್ಯಾಮ್, ಹಿಂದೆನೇ ಬನ್ನಿ. … ದೇವರೇ, ಕಾಪಾಡಪ್ಪ."
    tr: "Bande. Lakshmī, Kiraṇ, Sām, hindenē banni. … Dēvarē, kāpāḍappa."
    en: "Coming. Lakshmi, Kiran, Sam, follow right behind. … God, please protect her."
