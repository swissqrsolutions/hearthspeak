title:
  t: "ಹಳೆ ಗೆಳೆಯರ ಪಯಣ"
  tr: "Haḷe geḷeyara payaṇa"
  en: "The old friends' trip"
intro: "Eight engineering-college friends from the 2010 batch, now 34, take a road trip from Bengaluru to Chitradurga, Hampi, Dharwad and Gokarna in December 2026. Fast friends' Kannada with slang and Kanglish, six regional accents, cricket, cinema, politics, a divorce, a bounced cheque, old love and real apologies."
