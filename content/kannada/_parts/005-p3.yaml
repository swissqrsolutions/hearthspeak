lines:
  - chapter: "Chapter 7 — The season"
  - section: "The weekend farmer"
    learn: "offering help: holada kelasa ēnideyō hēḷu, māḍtīni · the nursery and the canal: sasimaḍi, nāṭi, kūḷe kabbu, kaṭṭu paddhati · rural commands: barigālalli bā, hiṅge hiḍkō · habitual past: appa haṅgē māḍtidru · first blisters: kaige guḷḷe bandide"
  - scene: "Saturday, 6 June 2026, half past six in the morning. Bettahalli. Suresh's car stops at the gate. He wears an old shirt and a dhoti and carries a pair of rubber boots in a plastic bag; Rakshith, still sleepy, gets out of the back. Mahadeva is in the cattle shed, milking."
  - who: mahadeva
    t: "ಅಣ್ಣ? ಇಷ್ಟು ಬೆಳಿಗ್ಗೆ? ಕೋರ್ಟಿಂದ ಏನಾದ್ರೂ ಕಾಗದ ಬಂತಾ?"
    tr: "Aṇṇa? Iṣṭu beḷigge? Kōrṭinda ēnādrū kāgada bantā?"
    en: "Anna? This early? Has some paper come from the court?"
  - who: suresh
    t: "ಯಾವ ಕಾಗದಾನೂ ಇಲ್ಲ. ಇನ್ಮೇಲೆ ಪ್ರತಿ ಶನಿವಾರ-ಭಾನುವಾರ ಬರ್ತೀನಿ ಅಂತ ತೀರ್ಮಾನ ಮಾಡಿದೀನಿ. ಹೊಲದ ಕೆಲಸ ಏನಿದೆಯೋ ಹೇಳು, ಮಾಡ್ತೀನಿ."
    tr: "Yāva kāgadānū illa. Inmēle prati Śanivāra-Bhānuvāra bartīni anta tīrmāna māḍidīni. Holada kelasa ēnideyō hēḷu, māḍtīni."
    en: "No paper at all. I've decided I'll come every Saturday and Sunday from now on. Tell me whatever work there is in the fields, and I'll do it."
  - who: mahadeva
    t: "ನೀನಾ? ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರು ಗದ್ದೆಗೆ ಇಳೀತಾರಾ? ಕೋರ್ಟಲ್ಲಿ ‘ನಾನೂ ಬೇಸಾಯ ಮಾಡ್ದೆ’ ಅಂತ ಹೇಳೋಕೆ ಸಾಕ್ಷಿ ಮಾಡ್ಕಳ್ತಿದೀಯಾ?"
    tr: "Nīnā? Byāṅk myānējaru gaddege iḷītārā? Kōrṭalli ‘nānū bēsāya māḍde’ anta hēḷōke sākṣi māḍkaḷtidīyā?"
    en: "You? A bank manager stepping down into the wet field? Are you collecting evidence so you can tell the court 'I farmed too'?"
  - who: suresh
    t: "ಕೋರ್ಟಲ್ಲಿ ನಾನು ಏನೂ ಕೇಳ್ತಿಲ್ಲ, ಮಹದೇವ. ಆದ್ರೆ ಇಪ್ಪತ್ತು ವರ್ಷ ನೀನೊಬ್ಬನೇ ಹೊತ್ತಿದ್ದನ್ನ ನಾನು ಒಂದು ದಿನಾನೂ ಹೊತ್ತಿಲ್ಲ. ಪಾಲಿನ ಮಾತಾಡೋಕೆ ಮುಂಚೆ ಆ ಭಾರ ಎಷ್ಟು ಅಂತ ನನಗೆ ಗೊತ್ತಾಗ್ಬೇಕು."
    tr: "Kōrṭalli nānu ēnū kēḷtilla, Mahadēva. Ādre ippattu varṣa nīnobbanē hottiddanna nānu ondu dinānū hottilla. Pālina mātāḍōke mun̄ce ā bhāra eṣṭu anta nanage gottāgbēku."
    en: "I'm not asking for anything in court, Mahadeva. But what you carried alone for twenty years, I haven't carried for a single day. Before anyone talks about shares, I need to know how heavy that load is."
  - who: avva
    t: "ಬಂದವನನ್ನ ಬಾಗಿಲಲ್ಲೇ ನಿಲ್ಲಿಸಿ ಪ್ರಶ್ನೆ ಕೇಳ್ತೀಯಾ ಮಹದೇವ? ಮೊದ್ಲು ಕಾಫಿ ಕುಡೀಲಿ. ಆಮೇಲೆ ಬೇಕಾದ್ರೆ ಗುದ್ದಲಿ ಕೊಡು."
    tr: "Bandavananna bāgilallē nillisi praśne kēḷtīyā Mahadēva? Modlu kāphi kuḍīli. Āmēle bēkādre guddali koḍu."
    en: "(from the veranda) Are you going to keep him standing at the door and question him, Mahadeva? Let him drink his coffee first. Then give him a spade if you like."
  - who: mahadeva
    t: "ಸರಿ. ಕಾಫಿ ಆದ್ಮೇಲೆ ಸಸಿಮಡಿ ಹತ್ರ ಬಾ. ಬೂಟು ಬೇಡ, ಕೆಸರಲ್ಲಿ ಹೂತ್ಕಂಡು ಹೋಗುತ್ತೆ. ಬರಿಗಾಲಲ್ಲಿ ಬಾ."
    tr: "Sari. Kāphi ādmēle sasimaḍi hatra bā. Būṭu bēḍa, kesaralli hūtkaṇḍu hōgutte. Barigālalli bā."
    en: "All right. After coffee, come to the nursery bed. No boots — they'll sink in the mud. Come barefoot."
  - scene: "An hour later. Beside the canal, on the one-acre strip of survey 112 where the old cane was cut in May, Mahadeva has raised a small nursery bed of paddy seedlings. The rest of the wet land is green with young cane."
  - who: suresh
    t: "ಇಲ್ಲಿ ಕಬ್ಬು ಇತ್ತಲ್ಲ? ಈಗ ಭತ್ತ ಯಾಕೆ?"
    tr: "Illi kabbu ittalla? Īga bhatta yāke?"
    en: "Wasn't there cane here? Why paddy now?"
  - who: mahadeva
    t: "ಮೇ ತಿಂಗಳಲ್ಲಿ ಈ ಒಂದು ಎಕರೆ ಕಬ್ಬು ಕಡಿದ್ವಿ. ಮೂರು ವರ್ಷ ಕೂಳೆ ಕಬ್ಬು ಬಿಟ್ಟಿದ್ವಿ, ಮಣ್ಣು ಸುಸ್ತಾಗಿದೆ. ಒಂದು ಬೆಳೆ ಭತ್ತ ಹಾಕಿದ್ರೆ ಮಣ್ಣಿಗೂ ವಿಶ್ರಾಂತಿ, ಮನೆಗೂ ವರ್ಷದ ಅಕ್ಕಿ. ಅಪ್ಪ ಯಾವಾಗ್ಲೂ ಹಂಗೇ ಮಾಡ್ತಿದ್ರು."
    tr: "Mē tiṅgaḷalli ī ondu ekare kabbu kaḍidvi. Mūru varṣa kūḷe kabbu biṭṭidvi, maṇṇu sustāgide. Ondu beḷe bhatta hākidre maṇṇigū viśrānti, manegū varṣada akki. Appa yāvāglū haṅgē māḍtidru."
    en: "In May we cut the cane on this one acre. We'd let it grow back as ratoon for three years; the soil is tired. Put in one crop of paddy, and the soil gets a rest and the house gets a year's rice. Appa always did it that way."
  - who: rakshith
    t: "ಚಿಕ್ಕಪ್ಪ, ‘ಕೂಳೆ ಕಬ್ಬು’ ಅಂದ್ರೆ ಏನು? ನಂಗೆ ಹಳ್ಳಿ ಪದಗಳು ಇನ್ನೂ ಪೂರ್ತಿ ಅರ್ಥ ಆಗಲ್ಲ."
    tr: "Cikkappa, ‘kūḷe kabbu’ andre ēnu? Naṅge haḷḷi padagaḷu innū pūrti artha āgalla."
    en: "Chikkappa, what does 'koole kabbu' mean? I still don't fully understand village words."
  - who: mahadeva
    t: "ಕಬ್ಬು ಕಡಿದ ಮೇಲೆ ಬುಡ ಮಣ್ಣಲ್ಲೇ ಇರುತ್ತೆ. ಅದಕ್ಕೆ ನೀರು, ಗೊಬ್ಬರ ಕೊಟ್ರೆ ಮತ್ತೆ ಚಿಗುರುತ್ತೆ — ಹೊಸ ಬೀಜ ಬೇಕಿಲ್ಲ. ಅದೇ ಕೂಳೆ. ಖರ್ಚು ಕಮ್ಮಿ, ಆದ್ರೆ ಪ್ರತಿ ವರ್ಷ ಇಳುವರಿ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಕಮ್ಮಿ ಆಗುತ್ತೆ. ನಮ್ಮಂಗೇ — ವಯಸ್ಸಾದಂಗೆ."
    tr: "Kabbu kaḍida mēle buḍa maṇṇallē irutte. Adakke nīru, gobbara koṭre matte cigurutte — hosa bīja bēkilla. Adē kūḷe. Kharcu kammi, ādre prati varṣa iḷuvari svalpa svalpa kammi āgutte. Nammaṅgē — vayassādaṅge."
    en: "When the cane is cut, the stump stays in the soil. Give it water and fertiliser and it sprouts again — no new seed needed. That's the ratoon. Less expense, but every year the yield drops a little. Just like us — as we get older."
  - who: suresh
    t: "ನಾಟಿ ಯಾವಾಗ? ಸಸಿ ಚೆನ್ನಾಗಿ ಬಂದಿದೆ."
    tr: "Nāṭi yāvāga? Sasi cennāgi bandide."
    en: "When's the transplanting? The seedlings have come up well."
  - who: mahadeva
    t: "ಅದು ನಮ್ಮ ಕೈಲಿಲ್ಲ. ನಾಲೆಗೆ ನೀರು ಬಿಟ್ಟಾಗ. ಕೆಆರ್‌ಎಸ್ ತುಂಬಿದ್ರೆ ವಿಶ್ವೇಶ್ವರಯ್ಯ ನಾಲೆಗೆ ಜುಲೈನಲ್ಲಿ ನೀರು ಬರುತ್ತೆ ಅಂತಾರೆ. ಅದೂ ಕಟ್ಟು ಪದ್ಧತಿಯಲ್ಲಿ — ಕೆಲವು ದಿನ ನೀರು, ಕೆಲವು ದಿನ ಇಲ್ಲ. ಅಷ್ಟರಲ್ಲಿ ತಮಿಳುನಾಡಿಗೆ ಎಷ್ಟು ಬಿಡ್ಬೇಕು ಅಂತ ದೆಹಲಿಯಲ್ಲಿ ಮೀಟಿಂಗು. ನಮ್ಮ ಸಸಿ ಕಾಯ್ತಾ ಇರುತ್ತೆ."
    tr: "Adu namma kaililla. Nālege nīru biṭṭāga. Ke-Ār-Es tumbidre Viśvēśvarayya nālege Julai-nalli nīru barutte antāre. Adū kaṭṭu paddhatiyalli — kelavu dina nīru, kelavu dina illa. Aṣṭaralli Tamiḷunāḍige eṣṭu biḍbēku anta Dehaliyalli mīṭiṅgu. Namma sasi kāytā irutte."
    en: "That's not in our hands. It's when they release water into the canal. If KRS fills, they say water will come down the Visvesvaraya Canal in July. And even then by rotation — some days water, some days none. Meanwhile there are meetings in Delhi about how much must go to Tamil Nadu. And our seedlings sit here waiting."
  - who: suresh
    t: "ಬ್ಯಾಂಕಲ್ಲಿ ನಾನು ರೈತರ ಸಾಲದ ಫೈಲ್ ನೋಡ್ತೀನಿ — ‘ಬೆಳೆ: ಭತ್ತ, ನೀರಾವರಿ: ನಾಲೆ’ ಅಂತ ಒಂದು ಕಾಲಂ. ಆ ಒಂದು ಕಾಲಂ ಹಿಂದೆ ಇಷ್ಟು ಕಾಯೋದಿದೆ ಅಂತ ನಂಗೆ ಯಾವತ್ತೂ ಅನ್ನಿಸಿರಲಿಲ್ಲ."
    tr: "Byāṅkalli nānu raitara sālada phail nōḍtīni — ‘beḷe: bhatta, nīrāvari: nāle’ anta ondu kālam. Ā ondu kālam hinde iṣṭu kāyōdide anta naṅge yāvattū annisiralilla."
    en: "At the bank I look at farmers' loan files — there's one column: 'Crop: paddy. Irrigation: canal.' It never once struck me how much waiting lies behind that one column."
  - who: mahadeva
    t: "ಕಾಲಂನಲ್ಲಿ ಕಾಯೋದು ಕಾಣ್ಸಲ್ಲ ಕಣಣ್ಣ. ತಗೋ, ಈ ಬದುವಿನ ಕಳೆ ಕಿತ್ತು ಹಾಕು. ಕುಡುಗೋಲು ಹಿಂಗೆ ಹಿಡ್ಕೋ — ಇಲ್ಲಾಂದ್ರೆ ಬೆರಳು ಹೋಗುತ್ತೆ."
    tr: "Kālam-nalli kāyōdu kāṇsalla kaṇaṇṇa. Tagō, ī baduvina kaḷe kittu hāku. Kuḍugōlu hiṅge hiḍkō — illāndre beraḷu hōgutte."
    en: "Waiting doesn't show in a column, Anna. Here — pull the weeds off this bund. Hold the sickle like this, or you'll lose a finger."
  - scene: "Noon. Suresh straightens his back with a groan. His palms are red; a blister has risen at the base of his thumb."
  - who: rakshith
    t: "ಅಪ್ಪ, ನಿನ್ನ ಕೈಗೆ ಗುಳ್ಳೆ ಬಂದಿದೆ! ಜಿಮ್‌ನಲ್ಲೂ ಹೀಗಾಗಲ್ಲ."
    tr: "Appa, ninna kaige guḷḷe bandide! Jim-nallū hīgāgalla."
    en: "Appa, you've got a blister on your hand! Even the gym doesn't do that."
  - who: mahadeva
    t: "ಮೊದಲ ದಿನ ಎಲ್ರಿಗೂ ಬರುತ್ತೆ. ಹದಿನೈದು ವರ್ಷದವನಾಗಿದ್ದಾಗ ನಂಗೂ ಬಂದಿತ್ತು. ಅಪ್ಪ ಹರಳೆಣ್ಣೆ ಹಚ್ಚಿ ‘ನಾಳೆ ಮತ್ತೆ ಬಾ’ ಅಂದಿದ್ರು. … ನೀನೂ ನಾಳೆ ಬರ್ತೀಯಾ ಅಣ್ಣ?"
    tr: "Modala dina ellrigū barutte. Hadinaidu varṣadavanāgiddāga naṅgū bandittu. Appa haraḷeṇṇe hacci ‘nāḷe matte bā’ andidru. … Nīnū nāḷe bartīyā aṇṇa?"
    en: "Everyone gets one the first day. I got one too, when I was fifteen. Appa rubbed castor oil on it and said, 'Come again tomorrow.' … Will you come tomorrow too, Anna?"
  - who: suresh
    t: "ನಾಳೆ ಮಾತ್ರ ಅಲ್ಲ. ಈ ಬೆಳೆ ಕೊಯ್ಲು ಆಗೋವರೆಗೂ ಬರ್ತೀನಿ. ಆಮೇಲೆ ಏನಾಗುತ್ತೋ ನೋಡೋಣ."
    tr: "Nāḷe mātra alla. Ī beḷe koylu āgōvaregū bartīni. Āmēle ēnāguttō nōḍōṇa."
    en: "Not just tomorrow. I'll keep coming until this crop is harvested. After that, we'll see what happens."
  - who: mahadeva
    t: "ನೋಡೋಣ."
    tr: "Nōḍōṇa."
    en: "(not looking up, but his voice has softened) We'll see."

  - section: "The field officer"
    learn: "the mill's terms: kabbina nōndaṇi, kaṭāvu ādēśa, rikavari, tūka · prices: nyāyasammata mattu lābhadāyaka bele (ephārpi), kviṇṭālige, ṭannige, kaṭāvu-sāgaṇe kharcu kaḷedu · law vs practice: hadinālku dinadoḷage pāvati, baḍḍi sērisi · an honest official: nānu hēḷōdu kāgadadalli irōdu mātra · consent: oppige patra"
  - scene: "Saturday, 18 July 2026. The rain has come in fits and starts; KRS is filling. A young man on a motorbike, with a tablet in a plastic cover and a sugar factory ID card on a ribbon, stops on the cart track beside survey 112. He is the field officer who registers cane and fixes the cutting schedule."
  - who: millman
    t: "ನಮಸ್ಕಾರ. ನಾನು ಕಾರ್ಖಾನೆಯ ಕ್ಷೇತ್ರ ಅಧಿಕಾರಿ, ಪ್ರದೀಪ್. ಸರ್ವೆ ನಂಬರ್ ನೂರಾ ಹನ್ನೆರಡರ ಕಬ್ಬಿನ ನೋಂದಣಿ ಪರಿಶೀಲನೆಗೆ ಬಂದಿದೀನಿ. ಚನ್ನೇಗೌಡರ ಹೆಸರಲ್ಲಿ ನೋಂದಣಿ ಇತ್ತು — ಅವರು…"
    tr: "Namaskāra. Nānu kārkhāneya kṣētra adhikāri, Pradīp. Sarve nambar nūrā hanneraḍara kabbina nōndaṇi pariśīlanege bandidīni. Cannēgauḍara hesaralli nōndaṇi ittu — avaru…"
    en: "Namaskara. I'm the factory's field officer, Pradeep. I've come to check the cane registration for survey number one hundred and twelve. The registration was in Channegowda's name — he…"
  - who: mahadeva
    t: "ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಹೋದ್ರು ಸಾರ್. ಈಗ ಪಹಣಿಯಲ್ಲಿ ನಾವು ನಾಲ್ಕು ಜನದ ಹೆಸರಿದೆ. ಬೇಸಾಯ ನಾನು ಮಾಡ್ತೀನಿ — ತಹಸೀಲ್ದಾರ್ ಆರ್ಡರಲ್ಲೂ ಬರೆದಿದೆ, ಕೋರ್ಟೂ ಅದನ್ನೇ ಹೇಳಿದೆ."
    tr: "Ḍisembar-nalli hōdru sār. Īga pahaṇiyalli nāvu nālku janada hesaride. Bēsāya nānu māḍtīni — tahasīldār ārḍarallū baredide, kōrṭū adannē hēḷide."
    en: "He passed away in December, sir. Now the RTC has all four of our names. I'm the one who farms — it's written in the Tahsildar's order, and the court has said the same."
  - who: millman
    t: "ಹಾಗಾದ್ರೆ ನೋಂದಣಿಯನ್ನ ನಿಮ್ಮ ಹೆಸರಿಗೆ ಬದಲಾಯಿಸಬೇಕು. ಹೊಸ ಪಹಣಿ, ಮರಣ ಪ್ರಮಾಣಪತ್ರ, ಉಳಿದ ವಾರಸುದಾರರ ಒಪ್ಪಿಗೆ ಪತ್ರ, ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ಪಾಸ್‌ಬುಕ್ — ಹಣ ನೇರ ಖಾತೆಗೆ ಹೋಗೋದು. ಒಪ್ಪಿಗೆ ಪತ್ರ ಇಲ್ಲದಿದ್ರೆ ಕಾರ್ಖಾನೆ ಹಣ ಯಾರ ಖಾತೆಗೆ ಹಾಕ್ಬೇಕು ಅಂತ ಗೊಂದಲ ಆಗುತ್ತೆ."
    tr: "Hāgādre nōndaṇiyanna nimma hesarige badalāyisabēku. Hosa pahaṇi, maraṇa pramāṇapatra, uḷida vārasudārara oppige patra, nimma byāṅk pās-buk — haṇa nēra khātege hōgōdu. Oppige patra illadidre kārkhāne haṇa yāra khātege hākbēku anta gondala āgutte."
    en: "Then the registration has to be changed to your name. The new RTC, the death certificate, a consent letter from the other heirs, your bank passbook — the money goes straight into the account. Without the consent letter there'll be confusion over whose account the factory should pay into."
  - who: suresh
    t: "ಒಪ್ಪಿಗೆ ಪತ್ರಕ್ಕೆ ನಾನು ಇವತ್ತೇ ಸಹಿ ಹಾಕ್ತೀನಿ. ಅವ್ವನೂ ಹೆಬ್ಬೆಟ್ಟು ಒತ್ತುತ್ತಾಳೆ. ತಂಗಿ ಮೈಸೂರಲ್ಲಿದಾಳೆ — ಅವಳನ್ನ ನಾನು ಕೇಳ್ತೀನಿ."
    tr: "Oppige patrakke nānu ivattē sahi hāktīni. Avvanū hebbeṭṭu ottuttāḷe. Taṅgi Maisūrallidāḷe — avaḷanna nānu kēḷtīni."
    en: "I'll sign the consent letter today. Avva will give her thumbprint too. My sister is in Mysuru — I'll ask her."
  - who: mahadeva
    t: "ಅವಳು ಕೊಡ್ತಾಳಾ? ಕೋರ್ಟಲ್ಲಿ ಕೇಸ್ ಹಾಕಿದೋಳು?"
    tr: "Avaḷu koḍtāḷā? Kōrṭalli kēs hākidōḷu?"
    en: "(low, to Suresh) Will she give it? The one who filed a case in court?"
  - who: suresh
    t: "ಕೇಳಿ ನೋಡೋಣ. ಕೇಳದೇನೇ ‘ಕೊಡಲ್ಲ’ ಅಂತ ನಾವೇ ತೀರ್ಮಾನ ಮಾಡೋದು ಬೇಡ."
    tr: "Kēḷi nōḍōṇa. Kēḷadēnē ‘koḍalla’ anta nāvē tīrmāna māḍōdu bēḍa."
    en: "Let's ask and see. Let's not decide 'she won't' for her without even asking."
  - who: rakshith
    t: "ಸಾರ್, ಒಂದು ಪ್ರಶ್ನೆ. ಕಬ್ಬಿಗೆ ಬೆಲೆ ಯಾರು ತೀರ್ಮಾನ ಮಾಡ್ತಾರೆ? ಕಾರ್ಖಾನೆನಾ, ಸರ್ಕಾರಾನಾ?"
    tr: "Sār, ondu praśne. Kabbige bele yāru tīrmāna māḍtāre? Kārkhānenā, sarkārānā?"
    en: "Sir, one question. Who decides the price of cane? The factory or the government?"
  - who: millman
    t: "ಒಳ್ಳೆ ಪ್ರಶ್ನೆ. ಕೇಂದ್ರ ಸರ್ಕಾರ ಪ್ರತಿ ವರ್ಷ ‘ನ್ಯಾಯಸಮ್ಮತ ಮತ್ತು ಲಾಭದಾಯಕ ಬೆಲೆ’ — ಎಫ್‌ಆರ್‌ಪಿ — ನಿಗದಿ ಮಾಡುತ್ತೆ. ಕಳೆದ ಹಂಗಾಮಿಗೆ ಕ್ವಿಂಟಾಲಿಗೆ ಮುನ್ನೂರ ಐವತ್ತೈದು ರೂಪಾಯಿ, ಅಂದ್ರೆ ಟನ್ನಿಗೆ ಮೂರು ಸಾವಿರದ ಐನೂರ ಐವತ್ತು — ಹತ್ತು ಪಾಯಿಂಟ್ ಎರಡೈದು ಪರ್ಸೆಂಟ್ ರಿಕವರಿಗೆ. ರಿಕವರಿ ಅಂದ್ರೆ ಒಂದು ಟನ್ ಕಬ್ಬಿನಿಂದ ಎಷ್ಟು ಸಕ್ಕರೆ ಬರುತ್ತೆ ಅನ್ನೋದು. ರಿಕವರಿ ಜಾಸ್ತಿ ಆದ್ರೆ ಬೆಲೆ ಜಾಸ್ತಿ, ಕಮ್ಮಿ ಆದ್ರೆ ಕಮ್ಮಿ."
    tr: "Oḷḷe praśne. Kēndra sarkāra prati varṣa ‘nyāyasammata mattu lābhadāyaka bele’ — ephārpi — nigadi māḍutte. Kaḷeda haṅgāmige kviṇṭālige munnūra aivattaidu rūpāyi, andre ṭannige mūru sāvirada ainūra aivattu — hattu pāyiṇṭ eraḍaidu parsenṭ rikavarige. Rikavari andre ondu ṭan kabbininda eṣṭu sakkare barutte annōdu. Rikavari jāsti ādre bele jāsti, kammi ādre kammi."
    en: "Good question. Every year the central government fixes the 'fair and remunerative price' — the FRP. For last season it was three hundred and fifty-five rupees a quintal — three thousand five hundred and fifty a tonne — at a recovery of ten point two five percent. Recovery means how much sugar comes out of a tonne of cane. Higher recovery, higher price; lower recovery, lower price."
  - who: mahadeva
    t: "ಮತ್ತೆ ರಾಜ್ಯ ಸರ್ಕಾರದ ಮೂರು ಸಾವಿರದ ಮುನ್ನೂರು? ಕಳೆದ ನವೆಂಬರ್‌ನಲ್ಲಿ ಬೆಳಗಾವಿ ಕಡೆ ರೈತರು ರಸ್ತೆಗೆ ಇಳಿದಾಗ ಮುಖ್ಯಮಂತ್ರಿಗಳು ಘೋಷಣೆ ಮಾಡಿದ್ರಲ್ಲ? ಅದು ನಮಗೂ ಸಿಗುತ್ತಾ, ಇಲ್ಲಾ ಉತ್ತರ ಕರ್ನಾಟಕಕ್ಕೆ ಮಾತ್ರಾನಾ?"
    tr: "Matte rājya sarkārada mūru sāvirada munnūru? Kaḷeda Navembar-nalli Beḷagāvi kaḍe raitaru rastege iḷidāga mukhyamantrigaḷu ghōṣaṇe māḍidralla? Adu namagū siguttā, illā uttara Karnāṭakakke mātrānā?"
    en: "And the state government's three thousand three hundred? Last November, when the farmers took to the roads round Belagavi, didn't the Chief Minister announce it? Do we get that too, or is it only for North Karnataka?"
  - who: millman
    t: "ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ, ಗೌಡ್ರೇ. ಆ ಮೂರು ಸಾವಿರದ ಮುನ್ನೂರು ಹನ್ನೊಂದೂಕಾಲು ಪರ್ಸೆಂಟ್ ರಿಕವರಿಗೆ, ಕಟಾವು-ಸಾಗಣೆ ಖರ್ಚು ಕಳೆದು ಅಂತ ನಮಗೆ ತಿಳಿಸಿದ್ರು. ನಮ್ಮ ಕಡೆ ರಿಕವರಿ ಅಷ್ಟು ಬರಲ್ಲ. ಮಂಡ್ಯದ ಕಾರ್ಖಾನೆಗಳು ಎಷ್ಟು ಕೊಡ್ತಾವೆ ಅನ್ನೋದು ಇನ್ನೂ ಸ್ಪಷ್ಟ ಇಲ್ಲ. ನಾನು ಹೇಳೋದು ಕಾಗದದಲ್ಲಿ ಇರೋದು ಮಾತ್ರ — ಆಮೇಲೆ ‘ಪ್ರದೀಪ್ ಹೇಳಿದ್ರು’ ಅಂತ ಹಿಡ್ಕೋಬೇಡಿ."
    tr: "Nēravāgi hēḷtīni, gauḍrē. Ā mūru sāvirada munnūru hannondūkālu parsenṭ rikavarige, kaṭāvu-sāgaṇe kharcu kaḷedu anta namage tiḷisidru. Namma kaḍe rikavari aṣṭu baralla. Maṇḍyada kārkhānegaḷu eṣṭu koḍtāve annōdu innū spaṣṭa illa. Nānu hēḷōdu kāgadadalli irōdu mātra — āmēle ‘Pradīp hēḷidru’ anta hiḍkōbēḍi."
    en: "I'll be straight with you, Gowdre. That three thousand three hundred is for eleven and a quarter percent recovery, after deducting harvesting and transport — that's what we were told. Recovery around here doesn't come that high. How much the Mandya factories will actually pay still isn't clear. I only tell you what's on paper — don't hold me to it later saying 'Pradeep said so'."
  - who: suresh
    t: "ಇನ್ನೊಂದು ವಿಷಯ ಸಾರ್. ಕಾನೂನು ಪ್ರಕಾರ ಕಬ್ಬು ಕೊಟ್ಟು ಹದಿನಾಲ್ಕು ದಿನದೊಳಗೆ ಹಣ ಪಾವತಿ ಆಗ್ಬೇಕು ಅಲ್ವಾ? ತಡ ಆದ್ರೆ ಬಡ್ಡಿ ಸೇರಿಸಿ ಕೊಡ್ಬೇಕು. ಕಳೆದ ಸಲದ ಕಬ್ಬಿನ ಹಣ ಅಪ್ಪ ತೀರಿಕೊಂಡಾಗ್ಲೂ ಬಂದಿರಲಿಲ್ಲ."
    tr: "Innondu viṣaya sār. Kānūnu prakāra kabbu koṭṭu hadinālku dinadoḷage haṇa pāvati āgbēku alvā? Taḍa ādre baḍḍi sērisi koḍbēku. Kaḷeda salada kabbina haṇa appa tīrikoṇḍāglū bandiralilla."
    en: "One more thing, sir. By law, payment has to be made within fourteen days of supplying the cane, doesn't it? If it's late, they must pay interest on top. The money for the last lot of cane hadn't come even when Appa died."
  - who: millman
    t: "ನಿಜ. ಕಾನೂನು ಹದಿನಾಲ್ಕು ದಿನ ಅನ್ನುತ್ತೆ. ಆದ್ರೆ ಸಕ್ಕರೆ ಮಾರಾಟ ಆಗಿಲ್ಲ, ಬಾಯ್ಲರ್ ಕೆಟ್ಟು ಅರೆಯೋದು ನಿಂತಿತ್ತು, ಕರೆಂಟ್ ಬಿಲ್ ಬಾಕಿ — ಹೀಗೆ ನೂರು ಕಾರಣ. ನಾನು ಕೆಲಸ ಮಾಡೋ ಕಾರ್ಖಾನೆ ಬಗ್ಗೆ ಕೆಟ್ಟದಾಗಿ ಮಾತಾಡಬಾರದು. ಆದ್ರೆ ನಾನೂ ರೈತನ ಮಗ, ಸಾರ್. ನಮ್ಮಪ್ಪಾನೂ ಕಬ್ಬಿನ ಹಣಕ್ಕೆ ಆರು ತಿಂಗಳು ಕಾದಿದ್ರು."
    tr: "Nija. Kānūnu hadinālku dina annutte. Ādre sakkare mārāṭa āgilla, bāylar keṭṭu areyōdu nintittu, kareṇṭ bil bāki — hīge nūru kāraṇa. Nānu kelasa māḍō kārkhāne bagge keṭṭadāgi mātāḍabāradu. Ādre nānū raitana maga, sār. Nammappānū kabbina haṇakke āru tiṅgaḷu kādidru."
    en: "True. The law says fourteen days. But the sugar hasn't sold, the boiler broke down and crushing stopped, the electricity bill is in arrears — a hundred reasons. I shouldn't speak ill of the factory I work for. But I'm a farmer's son too, sir. My own father waited six months for his cane money."
  - who: mahadeva
    t: "ಕಟಾವು ಯಾವಾಗ ಸಾರ್? ಈ ಎರಡೂವರೆ ಎಕರೆ ಕಬ್ಬಿಗೆ ಅಕ್ಟೋಬರ್‌ಗೆ ಹದಿನಾಲ್ಕು ತಿಂಗಳು ಆಗುತ್ತೆ. ಜಾಸ್ತಿ ದಿನ ನಿಂತ್ರೆ ಕಬ್ಬು ಒಣಗಿ ತೂಕ ಕಮ್ಮಿ ಆಗುತ್ತೆ."
    tr: "Kaṭāvu yāvāga sār? Ī eraḍūvare ekare kabbige Akṭōbar-ge hadinālku tiṅgaḷu āgutte. Jāsti dina nintre kabbu oṇagi tūka kammi āgutte."
    en: "When's the harvest, sir? This two and a half acres of cane will be fourteen months old by October. If it stands too long, the cane dries out and loses weight."
  - who: millman
    t: "ಅಕ್ಟೋಬರ್ ಕೊನೆ ವಾರಕ್ಕೆ ಕಟಾವು ಆದೇಶ ಹಾಕೋಕೆ ಪ್ರಯತ್ನ ಮಾಡ್ತೀನಿ. ಆದ್ರೆ ಕಡಿಯೋಕೆ ಆಳು ನೀವೇ ಹುಡುಕ್ಕೋಬೇಕು, ಇಲ್ಲಾ ಕಟಾವು ಯಂತ್ರ ಬಾಡಿಗೆಗೆ ತಗೋಬೇಕು. ಈಗ ಹಳ್ಳಿಗಳಲ್ಲಿ ಆಳುಗಳೇ ಸಿಗಲ್ಲ — ಹುಡುಗರೆಲ್ಲಾ ಬೆಂಗಳೂರಲ್ಲಿ ಕ್ಯಾಬ್ ಓಡಿಸ್ತಿದಾರೆ."
    tr: "Akṭōbar kone vārakke kaṭāvu ādēśa hākōke prayatna māḍtīni. Ādre kaḍiyōke āḷu nīvē huḍukkōbēku, illā kaṭāvu yantra bāḍigege tagōbēku. Īga haḷḷigaḷalli āḷugaḷē sigalla — huḍugarellā Beṅgaḷūralli kyāb ōḍistidāre."
    en: "I'll try to put in the harvest order for the last week of October. But you'll have to find cutters yourselves, or hire a harvester. You can't get labourers in the villages now — the young men are all driving cabs in Bengaluru."
  - who: rakshith
    t: "ಅಂದ್ರೆ ಕಬ್ಬು ಬೆಳೆಯೋದು ಒಂದು ಕಷ್ಟ, ಕಡಿಯೋದು ಇನ್ನೊಂದು ಕಷ್ಟ, ಹಣ ಬರೋದು ಮೂರನೇ ಕಷ್ಟ."
    tr: "Andre kabbu beḷeyōdu ondu kaṣṭa, kaḍiyōdu innondu kaṣṭa, haṇa barōdu mūranē kaṣṭa."
    en: "So growing the cane is one struggle, cutting it is another, and getting paid is the third."
  - who: millman
    t: "ನಾಲ್ಕನೇದೂ ಇದೆ ತಮ್ಮ — ಮಳೆ. ಅದು ಯಾರ ಸುತ್ತೋಲೆಗೂ ಸಿಗಲ್ಲ. ಬರ್ತೀನಿ ಗೌಡ್ರೇ. ಒಪ್ಪಿಗೆ ಪತ್ರ ಬೇಗ ಕಳಿಸಿ."
    tr: "Nālkanēdū ide tamma — maḷe. Adu yāra suttōlegū sigalla. Bartīni gauḍrē. Oppige patra bēga kaḷisi."
    en: "There's a fourth one too, young man — the rain. That doesn't obey anybody's circular. I'll be off, Gowdre. Send the consent letter soon."
  - scene: "That evening Suresh calls Shobha and puts the phone on speaker. Mahadeva, filling the cattle trough, pretends not to listen."
  - who: shobha
    t: "ಒಪ್ಪಿಗೆ ಪತ್ರಾನಾ? … ಅಣ್ಣ, ಕಬ್ಬಿನ ಹಣ ಬೆವರು ಸುರಿಸಿದವನ ಖಾತೆಗೆ ಹೋಗ್ಬೇಕು. ಅದರಲ್ಲಿ ನನಗೆ ಯಾವ ತಕರಾರೂ ಇಲ್ಲ. ನಾಳೆ ವಕೀಲರಿಗೆ ತೋರಿಸಿ, ಸಹಿ ಹಾಕಿ ಕಳಿಸ್ತೀನಿ — ಕೇಸಿಗೆ ತೊಂದರೆ ಆಗಬಾರ್ದು, ಅಷ್ಟೇ."
    tr: "Oppige patrānā? … Aṇṇa, kabbina haṇa bevaru surisidavana khātege hōgbēku. Adaralli nanage yāva takarārū illa. Nāḷe vakīlarige tōrisi, sahi hāki kaḷistīni — kēsige tondare āgabārdu, aṣṭē."
    en: "A consent letter? … Anna, the cane money should go into the account of the man who sweated for it. I have no objection to that at all. Tomorrow I'll show it to the lawyer, sign it and send it — it just mustn't harm the case, that's all."
  - who: mahadeva
    t: "ಕೇಳಿದ್ಯಾ ಗೌರಿ? ‘ಬೆವರು ಸುರಿಸಿದವನು’ ಅಂದ್ಲು."
    tr: "Kēḷidyā Gauri? ‘Bevaru surisidavanu’ andlu."
    en: "(to the cow, after the call ends) Did you hear that, Gauri? 'The man who sweated for it,' she said."

  - section: "Night water"
    learn: "a court notice: mundūḍalāgide, pīṭhāsīna adhikārigaḷu, svīkarisalāgide, jaṇṭi arji · night irrigation: badu oḍedide, nīru kaṭṭōdu, namma sarati · the failed borewell: ārunūrā aivattu aḍi, ondu hani nīrū barlilla, battōytu · admitting fault: adu nanna tappu, kēḷiskoḷḷalilla · proposing peace: alli hōgōṇa, Śōbhā oppidre"
  - scene: "Friday, 14 August 2026. The Maddur court complex. The cause list is pinned to the notice board; beside the number of Shobha's suit is one word in red ink. Suresh and Mahadeva have come together, on Mahadeva's motorbike. Advocate Nagendra reads the board."
  - who: lawyer
    t: "‘ಮುಂದೂಡಲಾಗಿದೆ.’ ಪೀಠಾಸೀನ ಅಧಿಕಾರಿಗಳು ತರಬೇತಿಗೆ ಹೋಗಿದಾರೆ. ಲಿಖಿತ ಹೇಳಿಕೆಗಳನ್ನ ಕಚೇರಿಯಲ್ಲಿ ಸ್ವೀಕರಿಸಲಾಗಿದೆ. ಮುಂದಿನ ದಿನಾಂಕ ನವೆಂಬರ್ ಇಪ್ಪತ್ತೇಳು."
    tr: "‘Mundūḍalāgide.’ Pīṭhāsīna adhikārigaḷu tarabētige hōgidāre. Likhita hēḷikegaḷanna kacēriyalli svīkarisalāgide. Mundina dināṅka Navembar ippattēḷu."
    en: "'Adjourned.' The presiding officer has gone for training. The written statements have been received at the office. Next date: the twenty-seventh of November."
  - who: mahadeva
    t: "ಮೂರು ತಿಂಗಳು ಕಾದು, ಒಂದು ಪದ. ‘ಮುಂದೂಡಲಾಗಿದೆ.’ ಇದಕ್ಕೆ ನಾನು ನಾಟಿ ಮಾಡಿದ ಗದ್ದೆ ಬಿಟ್ಟು ಬಂದೆ."
    tr: "Mūru tiṅgaḷu kādu, ondu pada. ‘Mundūḍalāgide.’ Idakke nānu nāṭi māḍida gadde biṭṭu bande."
    en: "Three months of waiting, and one word. 'Adjourned.' For this I left a freshly planted field and came."
  - who: lawyer
    t: "ಮೊದಲ ವರ್ಷ ಹೀಗೇ, ಮಹದೇವ ಅವರೇ. ಬೇಸರ ಮಾಡ್ಕೋಬೇಡಿ — ನಿಮ್ಮ ವಕೀಲರಿಗೂ ನನಗೂ ಇದು ಹೊಸದಲ್ಲ. ಆದ್ರೆ ಒಂದು ಗಮನಿಸಿದೆ: ಇವತ್ತು ನೀವಿಬ್ರೂ ಒಂದೇ ಬೈಕಲ್ಲಿ ಬಂದ್ರಿ."
    tr: "Modala varṣa hīgē, Mahadēva avarē. Bēsara māḍkōbēḍi — nimma vakīlarigū nanagū idu hosadalla. Ādre ondu gamaniside: ivattu nīvibbrū ondē baikalli bandri."
    en: "The first year goes like this, Mr Mahadeva. Don't be disheartened — it's nothing new to your lawyer or to me. But I noticed one thing: today the two of you came on one motorbike."
  - who: suresh
    t: "ಬಸ್ಸು ತಪ್ಪಿತು ಸಾರ್, ಅಷ್ಟೇ."
    tr: "Bassu tappitu sār, aṣṭē."
    en: "(a little embarrassed) I missed the bus, sir, that's all."
  - who: lawyer
    t: "ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದಲ್ಲಿ ಎಷ್ಟೋ ಜನ ‘ಬಸ್ಸು ತಪ್ಪಿತು’ ಅಂತ ಶುರು ಮಾಡಿ ರಾಜಿ ಆಗಿದಾರೆ. ಯೋಚನೆ ಮಾಡಿ. ಮುಂದಿನ ದಿನಾಂಕಕ್ಕೆ ಮುಂಚೆ ಮೂರೂ ಜನ ಒಪ್ಪಿ ಜಂಟಿ ಅರ್ಜಿ ಕೊಟ್ರೆ, ಕೋರ್ಟು ಕೇಸನ್ನ ಲೋಕ ಅದಾಲತ್‌ಗೆ ಕಳಿಸಬಹುದು."
    tr: "Ippatteraḍu varṣadalli eṣṭō jana ‘bassu tappitu’ anta śuru māḍi rāji āgidāre. Yōcane māḍi. Mundina dināṅkakke mun̄ce mūrū jana oppi jaṇṭi arji koṭre, kōrṭu kēsanna Lōka Adālat-ge kaḷisabahudu."
    en: "In twenty-two years I've seen plenty of people begin with 'I missed the bus' and end up settling. Think about it. If all three of you agree and file a joint application before the next date, the court can send the case to the Lok Adalat."
  - scene: "Sunday, 16 August 2026, two in the morning. The canal water reached Bettahalli's branch channel on Friday; tonight is the family's turn. Torchlight, frogs, the sound of running water. The brothers stand ankle-deep in the transplanted paddy."
  - who: mahadeva
    t: "ಆ ಕಡೆ ಬದು ಒಡೆದಿದೆ ಅಣ್ಣ, ನೀರು ಪಕ್ಕದವರ ಗದ್ದೆಗೆ ಹೋಗ್ತಿದೆ! ಮಣ್ಣು ಹಾಕು, ಬೇಗ!"
    tr: "Ā kaḍe badu oḍedide aṇṇa, nīru pakkadavara gaddege hōgtide! Maṇṇu hāku, bēga!"
    en: "The bund's broken over there, Anna — the water's running into the neighbour's field! Throw some earth on it, quick!"
  - who: suresh
    t: "ಆಯ್ತು… ನಿಂತ್ಕೊಳ್ತು. ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ನೀರು ಕಟ್ಟೋದು — ಇದನ್ನ ನೀನು ಇಪ್ಪತ್ತು ವರ್ಷ ಮಾಡಿದ್ಯಾ?"
    tr: "Āytu… nintkoḷtu. Rātri eraḍu gaṇṭege nīru kaṭṭōdu — idanna nīnu ippattu varṣa māḍidyā?"
    en: "Done… it's holding. Watering at two in the morning — you did this for twenty years?"
  - who: mahadeva
    t: "ನಮ್ಮ ಸರತಿ ರಾತ್ರಿ ಬಂದ್ರೆ ರಾತ್ರಿ, ಮಧ್ಯಾಹ್ನ ಬಂದ್ರೆ ಮಧ್ಯಾಹ್ನ. ನಾಲೆ ನಮ್ಮ ನಿದ್ದೆ ಕೇಳಲ್ಲ. ಸರತಿ ತಪ್ಪಿದ್ರೆ ಮುಂದಿನ ಕಟ್ಟು ಬರೋವರೆಗೆ ಪೈರು ಬಾಯಿ ಬಿಟ್ಕಂಡು ಕಾಯ್ಬೇಕು."
    tr: "Namma sarati rātri bandre rātri, madhyāhna bandre madhyāhna. Nāle namma nidde kēḷalla. Sarati tappidre mundina kaṭṭu barōvarege pairu bāyi biṭkaṇḍu kāybēku."
    en: "If our turn comes at night, it's night; if it comes at noon, it's noon. The canal doesn't ask about our sleep. Miss your turn, and the crop has to wait with its mouth open till the next rotation."
  - who: suresh
    t: "ಬೋರ್‌ವೆಲ್‌ನಲ್ಲಿ ನೀರು ಸಿಕ್ಕಿದ್ರೆ ಈ ಕಾಯೋದು ತಪ್ಪುತ್ತಿತ್ತು ಅಂತ ಅನ್ಕೊಂಡಿದ್ದೆ. … ಆರುನೂರಾ ಐವತ್ತು ಅಡಿ, ಮಹದೇವ. ಒಂದು ಹನಿ ನೀರೂ ಬರ್ಲಿಲ್ಲ. ಬರೀ ಧೂಳು."
    tr: "Bōrvel-nalli nīru sikkidre ī kāyōdu tapputtittu anta ankoṇḍidde. … Ārunūrā aivattu aḍi, Mahadēva. Ondu hani nīrū barlilla. Barī dhūḷu."
    en: "I'd thought that if the borewell struck water, all this waiting would end. … Six hundred and fifty feet, Mahadeva. Not one drop of water came up. Only dust."
  - who: mahadeva
    t: "ನಾನು ಮೊದಲೇ ಹೇಳಿದ್ದೆ. ಆ ಹೊಲದ ಕೆಳಗೆ ಕಲ್ಲು. ಪಕ್ಕದ ಫಾರ್ಮ್‌ಹೌಸ್‌ನವರು ಏಳುನೂರು ಅಡಿ ಕೊರೆಸಿದಾಗಲೇ ನಮ್ಮ ಹಳೇ ಬಾವಿ ಬತ್ತೋಯ್ತು. ಭೂಮಿತಾಯಿ ‘ಇಲ್ಲ’ ಅಂದ್ರೆ ಇಲ್ಲ, ಅಣ್ಣ. ಒಂದು ಲಕ್ಷದ ಹತ್ತಿರ ನಿನ್ನ ದುಡ್ಡು ಮಣ್ಣಲ್ಲಿ ಹೋಯ್ತು."
    tr: "Nānu modalē hēḷidde. Ā holada keḷage kallu. Pakkada phārm-haus-navaru ēḷunūru aḍi koresidāgalē namma haḷē bāvi battōytu. Bhūmitāyi ‘illa’ andre illa, aṇṇa. Ondu lakṣada hattira ninna duḍḍu maṇṇalli hōytu."
    en: "I told you beforehand. Under that field there's rock. When the farmhouse people next door drilled seven hundred feet, our old well dried up. When Mother Earth says 'no', it's no, Anna. Close to a lakh of your money has gone into the ground."
  - who: suresh
    t: "ದುಡ್ಡು ಹೋಯ್ತು, ಹೋಗ್ಲಿ. ನೀನು ‘ಬೇಡ’ ಅಂದಾಗ ನಾನು ಕೇಳಿಸ್ಕೊಳ್ಳಲಿಲ್ಲ — ಅದು ನನ್ನ ತಪ್ಪು. ಬ್ಯಾಂಕಲ್ಲಿ ಕೂತು ‘ನಾನೇ ಸರಿ’ ಅನ್ನೋ ಅಭ್ಯಾಸ, ಅದನ್ನ ಹೊಲಕ್ಕೂ ತಂದೆ."
    tr: "Duḍḍu hōytu, hōgli. Nīnu ‘bēḍa’ andāga nānu kēḷiskoḷḷalilla — adu nanna tappu. Byāṅkalli kūtu ‘nānē sari’ annō abhyāsa, adanna holakkū tande."
    en: "The money's gone — let it go. When you said 'don't', I didn't listen — that was my mistake. The habit of sitting in a bank thinking 'I'm always right' — I brought that to the field too."
  - who: mahadeva
    t: "ಅಣ್ಣ… ನೀನು ತಪ್ಪು ಒಪ್ಪಿಕೊಳ್ಳೋದು ನಾನು ನೋಡ್ತಿರೋದು ಇದು ಎರಡನೇ ಸಲ. ಮೊದಲನೇದು ಪಂಚಾಯ್ತಿ ರಾತ್ರಿ, ಶೋಭಾ ಮದುವೆ ವಿಷಯದಲ್ಲಿ."
    tr: "Aṇṇa… nīnu tappu oppikoḷḷōdu nānu nōḍtirōdu idu eraḍanē sala. Modalanēdu pan̄cāyti rātri, Śōbhā maduve viṣayadalli."
    en: "Anna… this is only the second time I've seen you admit a mistake. The first was the night of the panchayati, over Shobha's wedding."
  - who: suresh
    t: "ಮೂರನೇದೂ ಇದೆ. ಶುಕ್ರವಾರ ಆ ಕೆಂಪು ಶಾಯಿಯ ಒಂದು ಪದ ನೋಡಿದ ಮೇಲೆ ಅರ್ಥ ಆಯ್ತು — ನಾಗೇಂದ್ರ ಅವರು ಹೇಳಿದ ಹಾಗೇ ಆಗ್ತಿದೆ. ವರ್ಷಕ್ಕೆ ಮೂರು ದಿನಾಂಕ, ಹತ್ತು ವರ್ಷಕ್ಕೆ ಮೂವತ್ತು. ಮಹದೇವ, ನಾನು ಆ ಕೇಸಲ್ಲಿ ಸುಮ್ನೆ ನಿಂತಿದ್ದೇ ತಪ್ಪು. ಅಣ್ಣ ಆಗಿ ನಾನು ಮೊದಲೇ ನಿಮ್ಮಿಬ್ರನ್ನೂ ಕೂರಿಸ್ಬೇಕಿತ್ತು."
    tr: "Mūranēdū ide. Śukravāra ā kempu śāyiya ondu pada nōḍida mēle artha āytu — Nāgēndra avaru hēḷida hāgē āgtide. Varṣakke mūru dināṅka, hattu varṣakke mūvattu. Mahadēva, nānu ā kēsalli sumne nintiddē tappu. Aṇṇa āgi nānu modalē nimmibbrannū kūrisbēkittu."
    en: "There's a third, too. After seeing that one word in red ink on Friday, I understood — it's going exactly the way Nagendra said. Three dates a year; thirty in ten years. Mahadeva, my just standing by silently in that case was itself a mistake. As the eldest, I should have sat the two of you down long ago."
  - who: mahadeva
    t: "ಅಣ್ಣ, ನಾನೊಂದು ಹೇಳ್ಲಾ? ಮೂರು ತಿಂಗಳಿಂದ ನೀನು ಪ್ರತಿ ಶನಿವಾರ ಬರ್ತಿದೀಯ. ಕಳೆ ಕಿತ್ತೆ, ನಾಟಿ ಮಾಡ್ದೆ, ಬೋರ್‌ಗೆ ದುಡ್ಡು ಹಾಕ್ದೆ, ಈಗ ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಕೆಸರಲ್ಲಿ ನಿಂತಿದೀಯ. ಯಾರಿಗಾಗಿ? ಪಾಲಿಗಾಗಿ ಅಲ್ಲ ಅಂತ ನನಗೀಗ ಗೊತ್ತು."
    tr: "Aṇṇa, nānondu hēḷlā? Mūru tiṅgaḷinda nīnu prati Śanivāra bartidīya. Kaḷe kitte, nāṭi māḍde, bōr-ge duḍḍu hākde, īga rātri eraḍu gaṇṭege kesaralli nintidīya. Yārigāgi? Pāligāgi alla anta nanagīga gottu."
    en: "Anna, may I say something? For three months you've come every Saturday. You pulled weeds, you transplanted, you put money into the borewell, and now you're standing in the mud at two in the morning. For whom? Now I know it isn't for a share."
  - who: suresh
    t: "ಅಪ್ಪನ ದಿನಚರಿ ಓದಿದ ಮೇಲೆ ನನಗೆ ಒಂದು ಅರ್ಥ ಆಯ್ತು, ಮಹದೇವ. ‘ಜಮೀನು ಮಾರಲ್ಲ’ ಅಂತ ಅಪ್ಪ ನಡುವಿನ ಯಾವುದೋ ಪುಟದಲ್ಲಿ ಬರೆದಿದ್ರು. ಆದ್ರೆ ‘ಮೂರೂ ಮಕ್ಕಳು ಒಟ್ಟಿಗೆ ಉಣ್ಣಬೇಕು’ ಅಂತ ಕೊನೇ ಪುಟದಲ್ಲಿ ಬರೆದಿದ್ರು. ಕೊನೇ ಪುಟದಲ್ಲಿ ಬರೆಯೋದೇ ಮನುಷ್ಯನ ಕೊನೇ ಆಸೆ."
    tr: "Appana dinacari ōdida mēle nanage ondu artha āytu, Mahadēva. ‘Jamīnu māralla’ anta appa naḍuvina yāvudō puṭadalli baredidru. Ādre ‘mūrū makkaḷu oṭṭige uṇṇabēku’ anta konē puṭadalli baredidru. Konē puṭadalli bareyōdē manuṣyana konē āse."
    en: "After reading Appa's diary I understood one thing, Mahadeva. Appa wrote 'I will not sell the land' somewhere in the middle pages. But on the very last page he wrote that all three children must eat together. What a man writes on the last page is his last wish."
  - who: mahadeva
    t: "… ಮೇ ತಿಂಗಳಲ್ಲಿ ಜಡ್ಜ್ ಸಾಹೇಬ್ರು ‘ಮಧ್ಯಸ್ಥಿಕೆಗೆ ಹೋಗ್ತೀರಾ’ ಅಂತ ಕೇಳಿದಾಗ ‘ಈಗ ಬೇಡ’ ಅಂದಿದ್ದು ನನ್ನ ಕಡೆಯವರು. ಆಗ ನಂಗೆ ಹೆದರಿಕೆ ಇತ್ತು — ರಾಜಿ ಅಂದ್ರೆ ನಾನು ಸೋತೆ ಅಂತ. … ಲೋಕ ಅದಾಲತ್ ಅಂತ ನಾಗೇಂದ್ರ ಅವರು ಹೇಳಿದ್ರಲ್ಲ? ಅಲ್ಲಿಗೆ ಹೋಗೋಣ ಅಣ್ಣ. ಶೋಭಾ ಒಪ್ಪಿದ್ರೆ."
    tr: "… Mē tiṅgaḷalli jaḍj sāhēbru ‘madhyasthikege hōgtīrā’ anta kēḷidāga ‘īga bēḍa’ andiddu nanna kaḍeyavaru. Āga naṅge hedarike ittu — rāji andre nānu sōte anta. … Lōka Adālat anta Nāgēndra avaru hēḷidralla? Allige hōgōṇa aṇṇa. Śōbhā oppidre."
    en: "(after a long silence) … In May, when the judge asked 'will you go to mediation?', it was my side that said 'not now'. Back then I was afraid — that a compromise meant I'd lost. … That Lok Adalat Nagendra talked about? Let's go there, Anna. If Shobha agrees."
  - who: suresh
    t: "ಇದನ್ನ ಹೇಳೋಕೆ ರಾತ್ರಿ ಎರಡು ಗಂಟೆ, ಮೊಣಕಾಲುವರೆಗೂ ಕೆಸರು ಬೇಕಾಯ್ತು ನೋಡು."
    tr: "Idanna hēḷōke rātri eraḍu gaṇṭe, moṇakāluvaregū kesaru bēkāytu nōḍu."
    en: "(laughing softly) Look at that — it took two in the morning and mud up to our knees for you to say it."
  - who: mahadeva
    t: "ಹಗಲಲ್ಲಿ ಹೇಳಿದ್ರೆ ಊರೆಲ್ಲಾ ಕೇಳುತ್ತೆ. ರಾತ್ರಿ ಕಪ್ಪೆಗಳು ಮಾತ್ರ. ನಾಳೆ ಶೋಭಂಗೆ ನೀನೇ ಫೋನ್ ಮಾಡು. ನಾನು ಮಾಡಿದ್ರೆ ಮತ್ತೆ ಜಗಳ ಆಗುತ್ತೆ."
    tr: "Hagalalli hēḷidre ūrellā kēḷutte. Rātri kappegaḷu mātra. Nāḷe Śōbhaṅge nīnē phōn māḍu. Nānu māḍidre matte jagaḷa āgutte."
    en: "Say it in daylight and the whole village hears. At night there are only the frogs. Tomorrow you phone Shobha. If I do it, we'll only end up fighting again."
  - scene: "Monday evening. Shobha, just off her shift, calls back from the bus stop outside her hospital in Mysuru."
  - who: shobha
    t: "ಲೋಕ ಅದಾಲತ್? ಮಹದೇವಾನೇ ಹೇಳಿದ್ನಾ? … ಅಣ್ಣ, ನನಗೆ ಬೇಕಾಗಿದ್ದು ಗೆಲುವಲ್ಲ, ನನ್ನ ಹೆಸರು. ಆ ಹೆಸರು ಕಾಗದದಲ್ಲಿ ಉಳಿಯೋ ಹಾಗಿದ್ರೆ ನಾನು ಬರ್ತೀನಿ. ನಾಗೇಂದ್ರ ಅವರಿಗೆ ಹೇಳ್ತೀನಿ — ಮುಂದಿನ ದಿನಾಂಕದಲ್ಲಿ ಮೂರೂ ಜನ ಸೇರಿ ಜಂಟಿ ಅರ್ಜಿ ಹಾಕೋಣ ಅಂತ."
    tr: "Lōka Adālat? Mahadēvānē hēḷidnā? … Aṇṇa, nanage bēkāgiddu geluvalla, nanna hesaru. Ā hesaru kāgadadalli uḷiyō hāgidre nānu bartīni. Nāgēndra avarige hēḷtīni — mundina dināṅkadalli mūrū jana sēri jaṇṭi arji hākōṇa anta."
    en: "The Lok Adalat? Mahadeva himself said that? … Anna, what I wanted was never victory — it was my name. If that name stays on the paper, I'll come. I'll tell Nagendra — at the next date, let the three of us file a joint application together."

  - section: "Milk before sunrise"
    learn: "dairy words: hālu kare, karu, gabba, hālina saṅgha, phyāṭ nōḍi bele, prōtsāhadhana · frequency: hadinaidu dinakkondsala, varṣakkondsala · naming: nīnē iḍu, mommaga iṭṭa hesaru · habitual past: hāḍu hēḷtidru, nintkaḷtittu"
  - scene: "Saturday, 24 October 2026, quarter past five in the morning. Dasara is just over. In the cattle shed Rakshith, in a sweater, sits on a low stool beside Gauri while Mahadeva shows him how to milk. The calf, ten months old now, nudges the boy's shoulder."
  - who: mahadeva
    t: "ಮೊದ್ಲು ಕರುಗೆ ಸ್ವಲ್ಪ ಕುಡಿಯೋಕೆ ಬಿಡು. ಕರು ಮೊಲೆಗೆ ಬಾಯಿ ಹಾಕಿದ್ರೆ ಹಸು ಹಾಲು ಇಳಿಸುತ್ತೆ. ಆಮೇಲೆ ಕರುನ ಕಟ್ಟು, ನೀನು ಕರೆ."
    tr: "Modlu karuge svalpa kuḍiyōke biḍu. Karu molege bāyi hākidre hasu hālu iḷisutte. Āmēle karuna kaṭṭu, nīnu kare."
    en: "First let the calf drink a little. When the calf puts its mouth to the udder, the cow lets her milk down. Then tie up the calf, and you milk."
  - who: rakshith
    t: "ಚಿಕ್ಕಪ್ಪ, ಹೆಬ್ಬೆರಳು ಮತ್ತೆ ಮೊದಲ ಬೆರಳಿಂದ ಒತ್ತಿ ಕೆಳಗೆ ಎಳೆಯೋದಾ? … ಬಂತು! ಬಂತು!"
    tr: "Cikkappa, hebberaḷu matte modala beraḷinda otti keḷage eḷeyōdā? … Bantu! Bantu!"
    en: "Chikkappa, you squeeze with your thumb and first finger and pull down? … It's coming! It's coming!"
  - who: mahadeva
    t: "ಕೂಗಬೇಡ, ಗೌರಿ ಹೆದರ್ಕೊಳ್ಳುತ್ತೆ. ಹಸುಗೆ ಗಲಾಟೆ ಆಗಲ್ಲ. ನಿಮ್ಮ ತಾತ ಹಾಲು ಕರೆಯೋವಾಗ ಹಾಡು ಹೇಳ್ತಿದ್ರು — ಮೆತ್ತಗೆ. ಹಸು ಕಣ್ಣು ಮುಚ್ಕಂಡು ನಿಂತ್ಕಳ್ತಿತ್ತು."
    tr: "Kūgabēḍa, Gauri hedarkoḷḷutte. Hasuge galāṭe āgalla. Nimma tāta hālu kareyōvāga hāḍu hēḷtidru — mettage. Hasu kaṇṇu muckaṇḍu nintkaḷtittu."
    en: "Don't shout, Gauri will take fright. Cows can't stand noise. Your Thatha used to sing while he milked — softly. The cow would stand there with her eyes closed."
  - who: rakshith
    t: "ದಿನಕ್ಕೆ ಎಷ್ಟು ಲೀಟರ್ ಬರುತ್ತೆ? ಡೈರಿಯವರು ಎಷ್ಟು ಕೊಡ್ತಾರೆ?"
    tr: "Dinakke eṣṭu līṭar barutte? Ḍairiyavaru eṣṭu koḍtāre?"
    en: "How many litres does she give a day? How much does the dairy pay?"
  - who: mahadeva
    t: "ಗೌರಿ ಎರಡು ಹೊತ್ತು ಸೇರಿ ಹತ್ತು-ಹನ್ನೆರಡು ಲೀಟರ್. ಇನ್ನೊಂದು ಹಸು ಈಗ ಗಬ್ಬ, ಹಾಲು ನಿಂತಿದೆ. ಊರಿನ ಹಾಲಿನ ಸಂಘದಲ್ಲಿ ಫ್ಯಾಟ್ ನೋಡಿ ಲೀಟರಿಗೆ ಬೆಲೆ. ಸರ್ಕಾರದ ಪ್ರೋತ್ಸಾಹಧನ ಬೇರೆ — ಅದು ಕೆಲವು ಸಲ ತಿಂಗಳುಗಟ್ಲೆ ತಡ. ಆದ್ರೆ ಸಂಘದ ಹಣ ಹದಿನೈದು ದಿನಕ್ಕೊಂದ್ಸಲ ಬರುತ್ತೆ. ಕಬ್ಬು ವರ್ಷಕ್ಕೊಂದ್ಸಲ ಬಾಗಿಲು ತಟ್ಟುತ್ತೆ, ಹಸು ಹದಿನೈದು ದಿನಕ್ಕೊಂದ್ಸಲ. ಮನೆ ನಡೆಯೋದು ಹಸುವಿಂದ."
    tr: "Gauri eraḍu hottu sēri hattu-hanneraḍu līṭar. Innondu hasu īga gabba, hālu nintide. Ūrina hālina saṅghadalli phyāṭ nōḍi līṭarige bele. Sarkārada prōtsāhadhana bēre — adu kelavu sala tiṅgaḷugaṭle taḍa. Ādre saṅghada haṇa hadinaidu dinakkondsala barutte. Kabbu varṣakkondsala bāgilu taṭṭutte, hasu hadinaidu dinakkondsala. Mane naḍeyōdu hasuvinda."
    en: "Gauri gives ten or twelve litres, morning and evening together. The other cow is in calf and has gone dry. At the village milk society the price per litre depends on the fat. The government's incentive comes separately — and sometimes that's months late. But the society pays every fifteen days. Cane knocks on the door once a year; the cow, every fifteen days. It's the cow that keeps the house running."
  - who: rakshith
    t: "ಈ ಕರುಗೆ ಹೆಸರೇ ಇಲ್ಲ ಅಲ್ವಾ? ಹತ್ತು ತಿಂಗಳಾಯ್ತು. ತಾತ ಹೋದ ವಾರಾನೇ ಹುಟ್ಟಿದ್ದು."
    tr: "Ī karuge hesarē illa alvā? Hattu tiṅgaḷāytu. Tāta hōda vārānē huṭṭiddu."
    en: "This calf doesn't even have a name, does she? It's been ten months. She was born the very week Thatha died."
  - who: mahadeva
    t: "ಆ ಗದ್ದಲದಲ್ಲಿ ಯಾರಿಗೆ ಹೆಸರು ನೆನಪಾಗುತ್ತೆ? ನೀನೇ ಇಡು. ಮೊಮ್ಮಗ ಇಟ್ಟ ಹೆಸರು."
    tr: "Ā gaddaladalli yārige hesaru nenapāgutte? Nīnē iḍu. Mommaga iṭṭa hesaru."
    en: "In all that turmoil, who'd have thought of a name? You give her one. A name from the grandson."
  - who: rakshith
    t: "ಕಾವೇರಿ. ನಾಲೆ ನೀರಿಗೆ ನಾವೆಲ್ಲಾ ಕಾಯ್ತಿದ್ವಲ್ಲ — ಅದಕ್ಕೆ."
    tr: "Kāvēri. Nāle nīrige nāvellā kāytidvalla — adakke."
    en: "Kaveri. Because all of us kept waiting for the canal water."
  - who: avva
    t: "ಕಾವೇರಿ… ಒಳ್ಳೆ ಹೆಸರು. ನಮ್ಮ ಮನೆ ಮಗಳ ಹಾಗೆ — ಬಂದ್ರೆ ಬೆಳೆ, ಬರ್ದಿದ್ರೆ ಕಾಯೋದು."
    tr: "Kāvēri… oḷḷe hesaru. Namma mane magaḷa hāge — bandre beḷe, bardidre kāyōdu."
    en: "(from the doorway) Kaveri… a good name. Like a daughter of our house — when she comes, there's a harvest; when she doesn't, there's waiting."

  - section: "The harvester and the weighbridge"
    learn: "labour shortage: āḷugaḷu siklē ilvā, muṅgaḍa tagoṇḍu hōdru, kūli koṭrū baralla · hiring a machine: kaṭāvu yantra, guttigedāra, ṭannige iṣṭu anta bāḍige · the queue: tūkada cīṭi, rasa oṇagutte, tūka iḷiyutte · estimating: ekarege nalavattu bandre, āgabahudu, andkoṇḍrū"
  - scene: "Wednesday, 28 October 2026. The harvest order has come. Suresh has taken three days' leave. At dawn a hired cane harvester — a huge green machine on tracks — crawls down the cart track, followed by two tractors with trailers."
  - who: suresh
    t: "ಆಳುಗಳು ಸಿಕ್ಲೇ ಇಲ್ವಾ, ಮಹದೇವ?"
    tr: "Āḷugaḷu siklē ilvā, Mahadēva?"
    en: "Couldn't you find any cutters at all, Mahadeva?"
  - who: mahadeva
    t: "ಬೆಳಗಾವಿ ಕಡೆಯಿಂದ ಒಂದು ಗ್ಯಾಂಗ್ ಬರ್ತೀವಿ ಅಂದಿದ್ರು. ಮುಂಗಡ ತಗೊಂಡು ಬೇರೆ ಊರಿಗೆ ಹೋದ್ರು. ನಮ್ಮೂರಲ್ಲಿ ಕಬ್ಬು ಕಡಿಯೋರು ನಾಲ್ಕು ಜನ ಇದಾರೆ, ಎಲ್ರೂ ಅರವತ್ತು ದಾಟಿದೋರು. ದಿನಕ್ಕೆ ಆರುನೂರು-ಏಳುನೂರು ಕೂಲಿ ಕೊಟ್ರೂ ಹುಡುಗರು ಬರಲ್ಲ. ಅದಕ್ಕೇ ಈ ಯಂತ್ರ."
    tr: "Beḷagāvi kaḍeyinda ondu gyāṅg bartīvi andidru. Muṅgaḍa tagoṇḍu bēre ūrige hōdru. Nammūralli kabbu kaḍiyōru nālku jana idāre, ellrū aravattu dāṭidōru. Dinakke ārunūru-ēḷunūru kūli koṭrū huḍugaru baralla. Adakkē ī yantra."
    en: "A gang from the Belagavi side said they'd come. They took an advance and went to another village. In our village there are four men who can cut cane, all past sixty. Even at six or seven hundred a day, the young lads won't come. That's why this machine."
  - who: rakshith
    t: "ಇದು ಒಂದು ಕೋಟಿ ರೂಪಾಯಿ ಯಂತ್ರ ಅಂತ ಡ್ರೈವರ್ ಹೇಳಿದ್ರು! ಯಾರದು ಇದು?"
    tr: "Idu ondu kōṭi rūpāyi yantra anta ḍraivar hēḷidru! Yāradu idu?"
    en: "The driver said this is a one-crore machine! Whose is it?"
  - who: mahadeva
    t: "ಮದ್ದೂರಿನ ಒಬ್ಬ ಗುತ್ತಿಗೆದಾರರದ್ದು. ನಮ್ಮಂಥೋರು ಕೊಳ್ಳೋಕಾಗುತ್ತಾ? ಟನ್ನಿಗೆ ಇಷ್ಟು ಅಂತ ಬಾಡಿಗೆ. ಯಂತ್ರ ಒಂದು ದಿನದಲ್ಲಿ ಮುಗಿಸುತ್ತೆ, ಆಳುಗಳಿಗೆ ಒಂದು ವಾರ. ಆದ್ರೆ ಯಂತ್ರ ಬುಡಾನ ಸ್ವಲ್ಪ ಎತ್ತರದಲ್ಲಿ ಕಡಿಯುತ್ತೆ, ಕೂಳೆಗೆ ಅಷ್ಟು ಒಳ್ಳೇದಲ್ಲ ಅಂತಾರೆ. ಏನು ಮಾಡೋದು — ಆಳು ಇಲ್ದಿದ್ರೆ ಯಂತ್ರ, ಯಂತ್ರ ಇಲ್ದಿದ್ರೆ ಕಬ್ಬು ಗದ್ದೆಯಲ್ಲೇ ಒಣಗುತ್ತೆ."
    tr: "Maddūrina obba guttigedāraraddu. Nammanthōru koḷḷōkāguttā? Ṭannige iṣṭu anta bāḍige. Yantra ondu dinadalli mugisutte, āḷugaḷige ondu vāra. Ādre yantra buḍāna svalpa ettaradalli kaḍiyutte, kūḷege aṣṭu oḷḷēdalla antāre. Ēnu māḍōdu — āḷu ildidre yantra, yantra ildidre kabbu gaddeyallē oṇagutte."
    en: "It belongs to a contractor in Maddur. Can people like us buy one? He charges so much a tonne. The machine finishes in a day; labourers would take a week. But it cuts the stumps a bit high, and they say that isn't so good for the ratoon. What can you do — no labour, then the machine; no machine, then the cane dries in the field."
  - scene: "Afternoon. The weighbridge outside the factory gate. A long line of tractors and a few bullock carts heaped with cane stretches down the road. Suresh and Mahadeva wait beside their trailer."
  - who: suresh
    t: "ಎಷ್ಟು ಹೊತ್ತಿಂದ ಈ ಸಾಲಲ್ಲಿ ನಿಂತಿದೀವಿ? ಐದು ಗಂಟೆ!"
    tr: "Eṣṭu hottinda ī sālalli nintidīvi? Aidu gaṇṭe!"
    en: "How long have we been standing in this line? Five hours!"
  - who: mahadeva
    t: "ಇದು ಕಮ್ಮಿ. ಬಾಯ್ಲರ್ ಕೆಟ್ಟಾಗ ಮೂರು ದಿನ ನಿಂತಿದ್ದೆ, ಟ್ರ್ಯಾಕ್ಟರ್ ಕೆಳಗೆ ಮಲಗಿ. ಕಬ್ಬು ಕಡಿದ ಮೇಲೆ ಪ್ರತಿ ಗಂಟೆಗೂ ರಸ ಒಣಗುತ್ತೆ, ತೂಕ ಇಳಿಯುತ್ತೆ. ಕಾಯೋದು ನಾವು, ನಷ್ಟಾನೂ ನಮ್ಗೇ."
    tr: "Idu kammi. Bāylar keṭṭāga mūru dina nintidde, ṭryākṭar keḷage malagi. Kabbu kaḍida mēle prati gaṇṭegū rasa oṇagutte, tūka iḷiyutte. Kāyōdu nāvu, naṣṭānū namgē."
    en: "This is nothing. When the boiler broke down I stood here three days, sleeping under the tractor. Once cane is cut, every hour the juice dries and the weight drops. We do the waiting, and the loss is ours as well."
  - who: suresh
    t: "ತೂಕದ ಚೀಟಿ ಕೊಡು, ನೋಡ್ತೀನಿ. … ಈ ಟ್ರಾಲಿ ಹನ್ನೆರಡು ಟನ್ನು. ಎರಡೂವರೆ ಎಕರೆಗೆ ಒಟ್ಟು ಎಷ್ಟು ಆಗಬಹುದು?"
    tr: "Tūkada cīṭi koḍu, nōḍtīni. … Ī ṭrāli hanneraḍu ṭannu. Eraḍūvare ekarege oṭṭu eṣṭu āgabahudu?"
    en: "Give me the weighbridge slip, let me see. … This trailer's twelve tonnes. How much might the two and a half acres come to altogether?"
  - who: mahadeva
    t: "ಎಕರೆಗೆ ನಲವತ್ತು ಬಂದ್ರೆ ನೂರು ಟನ್. ಈ ಸಲ ಮಳೆ ಚೆನ್ನಾಗಿತ್ತು, ನಾಲೆ ನೀರೂ ಬಂತು — ನೂರಾ ಹತ್ತು ಆಗಬಹುದು. ಟನ್ನಿಗೆ ಮೂರೂವರೆ ಸಾವಿರ ಅಂದ್ಕೊಂಡ್ರೂ ನಾಲ್ಕು ಲಕ್ಷದ ಹತ್ತಿರ. ಕಟಾವು, ಸಾಗಣೆ, ಗೊಬ್ಬರ, ಸಾಲ ಎಲ್ಲಾ ಕಳೆದ ಮೇಲೆ ಕೈಗೆ ಎಷ್ಟು ಉಳಿಯುತ್ತೆ ಅಂತ ನೀನೇ ಲೆಕ್ಕ ಹಾಕು, ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರೇ."
    tr: "Ekarege nalavattu bandre nūru ṭan. Ī sala maḷe cennāgittu, nāle nīrū bantu — nūrā hattu āgabahudu. Ṭannige mūrūvare sāvira andkoṇḍrū nālku lakṣada hattira. Kaṭāvu, sāgaṇe, gobbara, sāla ellā kaḷeda mēle kaige eṣṭu uḷiyutte anta nīnē lekka hāku, byāṅk myānējarē."
    en: "If it's forty an acre, a hundred tonnes. The rain was good this time and the canal water came too — it might be a hundred and ten. Even at three and a half thousand a tonne, that's close to four lakh. After harvesting, transport, fertiliser and the loan, you work out what's left in hand, Mr Bank Manager."
  - who: suresh
    t: "ಲೆಕ್ಕ ಹಾಕೋದು ಸುಲಭ. ಇಡೀ ವರ್ಷ ಕಾಯೋದು ಕಷ್ಟ. ಮೀನಾ ಮಾರ್ಚ್‌ನಲ್ಲಿ ಬರೆದ ಅಂಕಿಗಳು ಸರಿ ಇದ್ವು, ಮಹದೇವ. ಆದ್ರೆ ಆ ಅಂಕಿಗಳಲ್ಲಿ ಈ ಐದು ಗಂಟೆಯ ಸಾಲು ಇರ್ಲಿಲ್ಲ."
    tr: "Lekka hākōdu sulabha. Iḍī varṣa kāyōdu kaṣṭa. Mīnā Mārc-nalli bareda aṅkigaḷu sari idvu, Mahadēva. Ādre ā aṅkigaḷalli ī aidu gaṇṭeya sālu irlilla."
    en: "Doing the sums is easy. Waiting a whole year is hard. The figures Meena wrote down in March were right, Mahadeva. But this five-hour queue wasn't in them."

  - section: "The money comes"
    learn: "payment: khātege jame āgide, ippattamūru dinakke bantu · clearing a debt: sāla tīristīni, bēbāki pramāṇapatra · a changed refusal: kōpadinda alla · a mother's comparison: āru tiṅgaḷa hinde … ivattu … · counterfactual praise: nimmappa iddidre … antidru"
  - scene: "Friday, 20 November 2026, evening. Suresh, Meena and Rakshith have come for the weekend. As the family sits down to eat on the veranda, a message beeps on Mahadeva's old phone."
  - who: mahadeva
    t: "ಅಣ್ಣ… ನೋಡು. ‘ನಿಮ್ಮ ಖಾತೆಗೆ ಮೂರು ಲಕ್ಷದ ಎಂಬತ್ತೆರಡು ಸಾವಿರ ರೂಪಾಯಿ ಜಮೆ ಆಗಿದೆ.’ ಕಾರ್ಖಾನೆ ಹಣ! ಇಪ್ಪತ್ತಮೂರು ದಿನಕ್ಕೆ ಬಂತು."
    tr: "Aṇṇa… nōḍu. ‘Nimma khātege mūru lakṣada embatteraḍu sāvira rūpāyi jame āgide.’ Kārkhāne haṇa! Ippattamūru dinakke bantu."
    en: "Anna… look. 'Three lakh eighty-two thousand rupees has been credited to your account.' The factory money! It came in twenty-three days."
  - who: meena
    t: "ಕಾನೂನು ಹದಿನಾಲ್ಕು ದಿನ ಅನ್ನುತ್ತೆ, ನಾವು ಇಪ್ಪತ್ತಮೂರು ದಿನಕ್ಕೆ ಬಂತು ಅಂತ ಖುಷಿ ಪಡ್ತಿದೀವಿ. ಹೀಗೇ ಅಭ್ಯಾಸ ಮಾಡಿಸ್ಬಿಟ್ಟಿದಾರೆ ನೋಡಿ."
    tr: "Kānūnu hadinālku dina annutte, nāvu ippattamūru dinakke bantu anta khuṣi paḍtidīvi. Hīgē abhyāsa māḍisbiṭṭidāre nōḍi."
    en: "The law says fourteen days, and here we are celebrating because it came in twenty-three. That's how well they've trained us, you see."
  - who: mahadeva
    t: "ಕಳೆದ ಸಲದ್ದು ಏಳು ತಿಂಗಳಿಗೆ ಬಂದಿತ್ತು, ಅತ್ತಿಗೆ. ಇದು ಹಬ್ಬ. … ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಮೊದ್ಲು ಸಂಘಕ್ಕೆ ಹೋಗಿ ಅಪ್ಪನ ಹೆಸರಲ್ಲಿರೋ ಆ ಒಂದು ಲಕ್ಷದ ಅರವತ್ತು ಸಾವಿರ ಸಾಲ ತೀರಿಸ್ತೀನಿ. ಬೇಬಾಕಿ ಪ್ರಮಾಣಪತ್ರ ತಗೊಂಡು ಅಪ್ಪನ ಫೋಟೋ ಮುಂದೆ ಇಡ್ತೀನಿ."
    tr: "Kaḷeda saladdu ēḷu tiṅgaḷige bandittu, attige. Idu habba. … Nāḷe beḷigge modlu saṅghakke hōgi appana hesarallirō ā ondu lakṣada aravattu sāvira sāla tīristīni. Bēbāki pramāṇapatra tagoṇḍu appana phōṭō munde iḍtīni."
    en: "The last lot took seven months, Attige. This is a festival. … Tomorrow morning, first thing, I'll go to the society and clear that one lakh sixty thousand loan in Appa's name. I'll get the no-dues certificate and put it in front of Appa's photo."
  - who: suresh
    t: "ಆ ಸಾಲ ನಾಲ್ಕು ಜನದ್ದು ಅಂತ ನಾನು ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಹೇಳಿದ್ದೆ. ನೆನಪಿದೆಯಾ? ಅರ್ಧ ನಾನು ಕೊಡ್ತೀನಿ."
    tr: "Ā sāla nālku janaddu anta nānu Ḍisembar-nalli hēḷidde. Nenapideyā? Ardha nānu koḍtīni."
    en: "Back in December I said that loan belonged to all four of us. Remember? I'll pay half."
  - who: mahadeva
    t: "ಬೇಡ ಅಣ್ಣ. ಅವತ್ತು ಆ ಮಾತು ಕೇಳಿ ನಂಗೆ ತುಂಬಾ ಕೋಪ ಬಂದಿತ್ತು — ‘ಸಾಲ ತೀರಿಸೋದು ನಾನು, ಜಮೀನು ಮಾತ್ರ ನಾಲ್ಕು ಜನದ್ದಾ’ ಅಂತ. ಈ ಸಲಾನೂ ತೀರಿಸೋದು ನಾನೇ. ಆದ್ರೆ ಕೋಪದಿಂದ ಅಲ್ಲ. ಈ ಕಬ್ಬಲ್ಲಿ ನಿನ್ನ ಗುಳ್ಳೆ ಬಂದ ಕೈನೂ ಇದೆ. ಅಷ್ಟು ಸಾಕು."
    tr: "Bēḍa aṇṇa. Avattu ā mātu kēḷi naṅge tumbā kōpa bandittu — ‘sāla tīrisōdu nānu, jamīnu mātra nālku janaddā’ anta. Ī salānū tīrisōdu nānē. Ādre kōpadinda alla. Ī kabballi ninna guḷḷe banda kainū ide. Aṣṭu sāku."
    en: "No, Anna. Back then, hearing that made me furious — 'I repay the loan, but the land belongs to all four?' This time too, I'm the one who'll repay it. But not out of anger. Your blistered hand is in this cane as well. That's enough for me."
  - who: meena
    t: "ಶೋಭಾಗೂ ಹೇಳು ಮಹದೇವ. ಒಪ್ಪಿಗೆ ಪತ್ರ ಕೊಟ್ಟಿದ್ದು ಅವಳೇ ತಾನೇ?"
    tr: "Śōbhāgū hēḷu Mahadēva. Oppige patra koṭṭiddu avaḷē tānē?"
    en: "Tell Shobha too, Mahadeva. She's the one who gave the consent letter, isn't she?"
  - who: mahadeva
    t: "‘ಕಬ್ಬಿನ ಹಣ ಬಂತು. ಸಾಲ ನಾಳೆ ತೀರುತ್ತೆ. ಮಹದೇವ.’ … ಕಳಿಸಿದೆ. … ಉತ್ತರ ಬಂತು: ‘ಒಳ್ಳೆ ಸುದ್ದಿ. ಅವ್ವನಿಗೆ ಒಂದು ಸೀರೆ ತಗೊಂಡು ಹೋಗು. ಹಣ ನಾನು ಕೊಡ್ತೀನಿ.’"
    tr: "‘Kabbina haṇa bantu. Sāla nāḷe tīrutte. Mahadēva.’ … Kaḷiside. … Uttara bantu: ‘Oḷḷe suddi. Avvanige ondu sīre tagoṇḍu hōgu. Haṇa nānu koḍtīni.’"
    en: "(typing slowly, reading aloud) 'Cane money has come. Loan gets cleared tomorrow. Mahadeva.' … Sent. … (a minute later) A reply: 'Good news. Buy Avva a sari. I'll pay for it.'"
  - who: avva
    t: "ಮಹದೇವ, ಸುರೇಶ — ಇಲ್ಲಿ ಕೂರಿ, ಊಟ ಮಾಡಿ. ಆರು ತಿಂಗಳ ಹಿಂದೆ ನೀವಿಬ್ರು ಒಂದೇ ಬದುವಿನ ಮೇಲೆ ಆರಡಿ ದೂರ ನಡೀತಿದ್ರಿ. ಇವತ್ತು ಅಕ್ಕಪಕ್ಕ ಎಲೆ ಹಾಕ್ಕಂಡು ಕೂತಿದೀರಿ. ನಿಮ್ಮಪ್ಪ ಇದ್ದಿದ್ರೆ ‘ಕಬ್ಬಿಗಿಂತ ಸಿಹಿ ಬೆಳೆ ಬೆಳೆದ್ರಿ’ ಅಂತಿದ್ರು."
    tr: "Mahadēva, Surēśa — illi kūri, ūṭa māḍi. Āru tiṅgaḷa hinde nīvibbru ondē baduvina mēle āraḍi dūra naḍītidri. Ivattu akkapakka ele hākkaṇḍu kūtidīri. Nimmappa iddidre ‘kabbiginta sihi beḷe beḷedri’ antidru."
    en: "Mahadeva, Suresha — sit here and eat. Six months ago the two of you walked along the same bund six feet apart. Today you're sitting with your leaves side by side. If your father were here, he'd have said, 'You've grown a crop sweeter than cane.'"
  - who: rakshith
    t: "ಅಜ್ಜಿ, ನಾನು ಈ ಆರು ತಿಂಗಳಲ್ಲಿ ಏನು ಕಲಿತೆ ಗೊತ್ತಾ? ಕೂಳೆ, ಕಟ್ಟು ಪದ್ಧತಿ, ಫ್ಯಾಟ್, ರಿಕವರಿ… ಆದ್ರೆ ದೊಡ್ಡ ಪಾಠ ಅದಲ್ಲ. ಅಪ್ಪ ‘ನನ್ನ ತಪ್ಪು’ ಅಂತ ಹೇಳೋದು ಕಲಿತ. ಚಿಕ್ಕಪ್ಪ ‘ಬಾ’ ಅಂತ ಹೇಳೋದು ಕಲಿತ."
    tr: "Ajji, nānu ī āru tiṅgaḷalli ēnu kalite gottā? Kūḷe, kaṭṭu paddhati, phyāṭ, rikavari… ādre doḍḍa pāṭha adalla. Appa ‘nanna tappu’ anta hēḷōdu kalita. Cikkappa ‘bā’ anta hēḷōdu kalita."
    en: "Ajji, do you know what I learnt in these six months? Ratoon, canal rotation, milk fat, recovery… but that's not the big lesson. Appa learnt to say 'my mistake'. Chikkappa learnt to say 'come'."
  - who: mahadeva
    t: "ಏಯ್, ದೊಡ್ಡವರ ಬಗ್ಗೆ ಹಿಂಗೆ ಮಾತಾಡ್ತಾರಾ? … ತಿನ್ನು. ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಕಾವೇರಿಗೆ ಹುಲ್ಲು ಹಾಕ್ಬೇಕು ನೀನು."
    tr: "Ēy, doḍḍavara bagge hiṅge mātāḍtārā? … Tinnu. Nāḷe beḷigge aidakke Kāvērige hullu hākbēku nīnu."
    en: "(trying not to smile) Hey, is that any way to talk about your elders? … Eat. Tomorrow at five you've got to give Kaveri her hay."
  - who: meena
    t: "ಮುಂದಿನ ಶುಕ್ರವಾರ ಕೋರ್ಟಲ್ಲಿ ಜಂಟಿ ಅರ್ಜಿ ಕೊಡ್ತೀವಿ. ನಾಗೇಂದ್ರ ಅವರು ಹೇಳಿದ್ರು — ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ರಾಷ್ಟ್ರೀಯ ಲೋಕ ಅದಾಲತ್ ಇದೆಯಂತೆ, ಅದಕ್ಕೆ ಹಾಕಿಸ್ತಾರಂತೆ. ಅದರ ಮಧ್ಯೆ ಭಾನುವಾರ ಜಾತ್ರೆ. ಶೋಭಾ ಬರ್ತಾಳಂತೆ, ಅವ್ವ."
    tr: "Mundina Śukravāra kōrṭalli jaṇṭi arji koḍtīvi. Nāgēndra avaru hēḷidru — Ḍisembar-nalli rāṣṭrīya Lōka Adālat ideyante, adakke hākistārante. Adara madhye Bhānuvāra jātre. Śōbhā bartāḷante, avva."
    en: "Next Friday we give the joint application in court. Nagendra says there's a National Lok Adalat in December, and he'll get the case listed there. In between, the jatre is on Sunday. Shobha says she's coming, Avva."
  - who: avva
    t: "ಬರ್ತಾಳಾ? … ಹಾಗಾದ್ರೆ ನಾನು ಅಮ್ಮನಿಗೆ ಹರಕೆ ತೀರಿಸ್ತೀನಿ. ಅವರು ಹೋದ ರಾತ್ರಿ ಹೊತ್ತ ಹರಕೆ — ‘ನನ್ನ ಮೂರೂ ಮಕ್ಳು ಒಟ್ಟಿಗೆ ನಿನ್ನ ತೇರು ಎಳೆಯೋ ಹಾಗೆ ಮಾಡು ತಾಯಿ’ ಅಂತ."
    tr: "Bartāḷā? … Hāgādre nānu ammanige harake tīristīni. Avaru hōda rātri hotta harake — ‘nanna mūrū makḷu oṭṭige ninna tēru eḷeyō hāge māḍu tāyi’ anta."
    en: "She's coming? … Then I'll fulfil my vow to the Goddess. The vow I made the night he died — 'Mother, let all three of my children pull your chariot together.'"

  - chapter: "Chapter 8 — The jatre"
  - section: "The chariot"
    learn: "the jatre: tēru, hagga, davana, bāḷehaṇṇu esītāre, tamaṭe, ḍoḷḷu, pūjā kuṇita, prasāda · a vow: harake hottidde, harake tīristīni · mourning: varṣa tumbilla, sūtaka · awkward greetings: … bandyā · teasing: appana haṭha pūrti ninagē bandide · pulling together: ellrū ondē kaḍe eḷībēku"
  - scene: "Sunday, 29 November 2026. The jatre of Bettadamma, Bettahalli's village goddess. Since morning the lanes have been full: tamate and dollu drums, bangle stalls, a giant wheel by the tank, families home from Bengaluru and Mysuru. The tall wooden chariot stands before the temple, hung with flowers and coloured cloth; thick ropes lie on the ground in front of it. Shobha steps off the Mysuru bus at the crossroads, where Avva, Meena and Rakshith are waiting."
  - who: shobha
    t: "ಅವ್ವಾ! ಎಷ್ಟು ಜನ! ನಾನು ಕೊನೆಯ ಸಲ ಜಾತ್ರೆಗೆ ಬಂದಿದ್ದು ಮದುವೆಗೆ ಮುಂಚೆ — ಹದಿನಾರು ವರ್ಷ ಆಯ್ತು."
    tr: "Avvā! Eṣṭu jana! Nānu koneya sala jātrege bandiddu maduvege mun̄ce — hadināru varṣa āytu."
    en: "Avva! So many people! The last time I came to the jatre was before my wedding — sixteen years ago."
  - who: avva
    t: "ಬಾ ಕಣವ್ವ. ಬಸ್ಸಲ್ಲಿ ನಿಂತ್ಕಂಡೇ ಬಂದ್ಯಾ? ಮುಖ ಬಾಡೋಗಿದೆ. … ನೋಡು, ಆ ಬಳೆ ಅಂಗಡಿ ಇನ್ನೂ ಅಲ್ಲೇ ಇದೆ. ಚಿಕ್ಕೋಳಿದ್ದಾಗ ನೀನು ಅಲ್ಲಿ ಹಸಿರು ಬಳೆಗೆ ಅತ್ತು ಗಲಾಟೆ ಮಾಡಿದ್ದೆ."
    tr: "Bā kaṇavva. Bassalli nintkaṇḍē bandyā? Mukha bāḍōgide. … Nōḍu, ā baḷe aṅgaḍi innū allē ide. Cikkōḷiddāga nīnu alli hasiru baḷege attu galāṭe māḍidde."
    en: "Come, my girl. Did you stand all the way on the bus? Your face has wilted. … Look, that bangle stall is still in the same spot. When you were little you cried and made a scene there for green bangles."
  - who: shobha
    t: "ನೆನಪಿದೆ. ಅಪ್ಪ ಕೊನೆಗೆ ಎರಡು ಡಜನ್ ಕೊಡಿಸಿದ್ರು. … ಮಹದೇವ ಎಲ್ಲಿ?"
    tr: "Nenapide. Appa konege eraḍu ḍajan koḍisidru. … Mahadēva elli?"
    en: "I remember. In the end Appa bought me two dozen. … Where's Mahadeva?"
  - who: avva
    t: "ತೇರಿನ ಹತ್ರ. ಊರಿನ ಹುಡುಗರ ಜೊತೆ ಹಗ್ಗ ಸರಿ ಮಾಡ್ತಿದಾನೆ. ಪ್ರತಿ ವರ್ಷ ಮುಂದಿನ ಹಗ್ಗ ಹಿಡಿಯೋದು ನಮ್ಮ ಮನೆಯವರು — ನಿಮ್ಮ ತಾತನ ಕಾಲದಿಂದ."
    tr: "Tērina hatra. Ūrina huḍugara jote hagga sari māḍtidāne. Prati varṣa mundina hagga hiḍiyōdu namma maneyavaru — nimma tātana kāladinda."
    en: "By the chariot. He's setting the ropes right with the village lads. Every year it's our family that holds the front rope — since your grandfather's time."
  - who: rakshith
    t: "ಅಜ್ಜಿ, ಆ ಜನ ತೇರಿನ ಮೇಲೆ ಬಾಳೆಹಣ್ಣು ಯಾಕೆ ಎಸೀತಿದಾರೆ? ಮತ್ತೆ ಆ ಹಸಿರು ಎಲೆ ಏನು?"
    tr: "Ajji, ā jana tērina mēle bāḷehaṇṇu yāke esītidāre? Matte ā hasiru ele ēnu?"
    en: "Ajji, why are those people throwing bananas at the chariot? And what's that green leaf?"
  - who: avva
    t: "ಅದು ದವನ, ಕಂದ. ಘಮ ಘಮ ಅನ್ನುತ್ತೆ. ಹರಕೆ ಹೊತ್ತೋರು, ಬೆಳೆ ಚೆನ್ನಾಗಿ ಬಂದೋರು ತೇರಿಗೆ ಬಾಳೆಹಣ್ಣು, ದವನ ಎಸೀತಾರೆ — ‘ತಾಯಿ, ನೀನು ಕೊಟ್ಟಿದ್ದರಲ್ಲಿ ಒಂದು ಪಾಲು ನಿನಗೆ’ ಅಂತ. ಕೆಳಗೆ ಬಿದ್ದ ಹಣ್ಣು ಪ್ರಸಾದ, ಮಕ್ಕಳು ಆರಿಸ್ಕಂಡು ತಿಂತಾರೆ."
    tr: "Adu davana, kanda. Ghama ghama annutte. Harake hottōru, beḷe cennāgi bandōru tērige bāḷehaṇṇu, davana esītāre — ‘tāyi, nīnu koṭṭiddaralli ondu pālu ninage’ anta. Keḷage bidda haṇṇu prasāda, makkaḷu āriskaṇḍu tintāre."
    en: "That's davana, child. Smell how fragrant it is. People who made vows, people whose crops did well, throw bananas and davana at the chariot — 'Mother, of what you gave us, a share for you.' The fruit that falls is prasada; the children pick it up and eat it."
  - who: rakshith
    t: "ದೇವಿಗೂ ಪಾಲು! ಈ ಊರಲ್ಲಿ ಎಲ್ಲಾ ಮಾತೂ ಕೊನೆಗೆ ಪಾಲಿಗೇ ಬಂದು ನಿಲ್ಲುತ್ತೆ."
    tr: "Dēvigū pālu! Ī ūralli ellā mātū konege pāligē bandu nillutte."
    en: "A share for the Goddess too! In this village every conversation ends up at shares."
  - who: meena
    t: "ರಕ್ಷಿತ್!"
    tr: "Rakṣit!"
    en: "(warning) Rakshith!"
  - who: avva
    t: "ಇರ್ಲಿ ಬಿಡವ್ವ, ಹುಡುಗ ಸರಿಯಾಗೇ ಹೇಳಿದ. ಪಾಲು ಕೊಡೋದು ಕಲಿತ್ರೆ ಪಾಲು ಕೇಳೋ ಜಗಳ ಕಮ್ಮಿ ಆಗುತ್ತೆ."
    tr: "Irli biḍavva, huḍuga sariyāgē hēḷida. Pālu koḍōdu kalitre pālu kēḷō jagaḷa kammi āgutte."
    en: "Let him be, dear — the boy's right. Learn to give a share, and there are fewer fights over asking for one."
  - scene: "In front of the chariot. The drummers beat the tamate; a pooja kunitha dancer turns slowly, a tall decorated frame balanced on his head without his hands. Mahadeva, a towel tied round his head, straightens up from the rope when he sees Shobha."
  - who: mahadeva
    t: "… ಬಂದ್ಯಾ."
    tr: "… Bandyā."
    en: "… You came."
  - who: shobha
    t: "ಬಂದೆ. ಅವ್ವನ ಹರಕೆ ಅಂತ ಅಣ್ಣ ಹೇಳಿದ. … ಸಾಲ ತೀರಿಸಿದ್ಯಂತೆ. ಒಳ್ಳೇದಾಯ್ತು."
    tr: "Bande. Avvana harake anta aṇṇa hēḷida. … Sāla tīrisidyante. Oḷḷēdāytu."
    en: "I came. Anna said it was Avva's vow. … I hear you've cleared the loan. That's good."
  - who: mahadeva
    t: "ಅವ್ವನ ಸೀರೆ ಇನ್ನೂ ತಗೊಂಡಿಲ್ಲ. ನೀನೇ ಆರಿಸು, ಇಲ್ಲೇ ಜಾತ್ರೆಯಲ್ಲಿ. ನನಗೆ ಬಣ್ಣ ಗೊತ್ತಾಗಲ್ಲ."
    tr: "Avvana sīre innū tagoṇḍilla. Nīnē ārisu, illē jātreyalli. Nanage baṇṇa gottāgalla."
    en: "I haven't bought Avva's sari yet. You choose it, here at the fair. I'm no good with colours."
  - who: shobha
    t: "ಸರಿ. ಆದ್ರೆ ದುಡ್ಡು ನಾನೇ ಕೊಡೋದು. ಹೇಳಿದೀನಲ್ಲ."
    tr: "Sari. Ādre duḍḍu nānē koḍōdu. Hēḷidīnalla."
    en: "All right. But I'm paying. I said so, didn't I?"
  - who: mahadeva
    t: "ಅದೇ — ಆ ಹಠ. ಅಪ್ಪನ ಹಠ ಪೂರ್ತಿ ನಿನಗೇ ಬಂದಿದೆ."
    tr: "Adē — ā haṭha. Appana haṭha pūrti ninagē bandide."
    en: "There it is — that stubbornness. You got every bit of Appa's stubbornness."
  - who: shobha
    t: "ಮತ್ತೆ ನಿನಗೆ? ಅಪ್ಪನ ಹಠ ಅರ್ಧ, ಅವ್ವನ ಹಠ ಅರ್ಧ."
    tr: "Matte ninage? Appana haṭha ardha, avvana haṭha ardha."
    en: "And you? Half Appa's stubbornness, half Avva's."
  - scene: "Avva laughs for the first time in months. The priest comes down the temple steps with a brass plate of burning camphor. He sees Avva and stops."
  - who: priest
    t: "ಪುಟ್ಟಮ್ಮನವರೇ, ಬನ್ನಿ. ಗೌಡ್ರು ಹೋದ ಮೇಲೆ ಇದು ಮೊದಲ ಜಾತ್ರೆ. ನಿಮ್ಮ ಮನೆಯಲ್ಲಿ ಇನ್ನೂ ವರ್ಷ ತುಂಬಿಲ್ಲ, ಹಬ್ಬ ಮಾಡಲ್ಲ ಅಂತ ಗೊತ್ತು. ಆದ್ರೆ ಅಮ್ಮನ ಸೇವೆಗೆ ಸೂತಕ ಅಡ್ಡ ಬರಲ್ಲ ಅಂತ ನಮ್ಮ ಹಿರಿಯರು ಹೇಳ್ತಿದ್ರು. ಹರಕೆ ಹೊತ್ತಿದ್ರಂತಲ್ಲ?"
    tr: "Puṭṭammanavarē, banni. Gauḍru hōda mēle idu modala jātre. Nimma maneyalli innū varṣa tumbilla, habba māḍalla anta gottu. Ādre ammana sēvege sūtaka aḍḍa baralla anta namma hiriyaru hēḷtidru. Harake hottidrantalla?"
    en: "Come, Puttamma-avare. This is the first jatre since Gowdru passed away. I know the year isn't yet complete in your house, and you won't celebrate festivals. But our elders used to say mourning does not stand in the way of serving the Goddess. I hear you made a vow?"
  - who: avva
    t: "ಹೌದು ಸ್ವಾಮಿ. ಅವರು ಹೋದ ರಾತ್ರಿ ಅಮ್ಮನ ಹತ್ರ ಬೇಡ್ಕಂಡಿದ್ದೆ — ನನ್ನ ಮೂರು ಮಕ್ಳು ಒಟ್ಟಿಗೆ ತೇರು ಎಳೀಬೇಕು ಅಂತ. ಆಮೇಲೆ ಮಕ್ಳು ಕೋರ್ಟಿಗೆ ಹೋದ್ರು. ಹರಕೆ ತೀರೋದೇ ಇಲ್ಲ ಅನ್ಕೊಂಡಿದ್ದೆ."
    tr: "Haudu svāmi. Avaru hōda rātri ammana hatra bēḍkaṇḍidde — nanna mūru makḷu oṭṭige tēru eḷībēku anta. Āmēle makḷu kōrṭige hōdru. Harake tīrōdē illa ankoṇḍidde."
    en: "Yes, Swami. The night he died, I begged the Goddess — that my three children should pull her chariot together. Then the children went to court. I thought the vow would never be fulfilled."
  - who: priest
    t: "ಹರಕೆ ತೀರೋದು ಕೈಗಳಿಂದ ಅಲ್ಲ ಅಮ್ಮ, ಮನಸ್ಸಿಂದ. … ಮಕ್ಕಳೇ, ಮುಂದಿನ ಹಗ್ಗದಲ್ಲಿ ಮೂರೂ ಜನ ಒಂದೇ ಕಡೆ ನಿಲ್ಲಿ. ಹಗ್ಗದ ಒಂದು ತುದಿ ಅಮ್ಮನ ತೇರಿಗೆ ಕಟ್ಟಿದೆ, ಇನ್ನೊಂದು ತುದಿ ಊರಿನ ಎಲ್ಲರ ಕೈಲಿದೆ. ಯಾರೂ ವಿರುದ್ಧ ಕಡೆಗೆ ಎಳೆಯಲ್ಲ — ತೇರು ಮುಂದೆ ಹೋಗೋದು ಹಾಗೇ."
    tr: "Harake tīrōdu kaigaḷinda alla amma, manassinda. … Makkaḷē, mundina haggadalli mūrū jana ondē kaḍe nilli. Haggada ondu tudi ammana tērige kaṭṭide, innondu tudi ūrina ellara kailide. Yārū viruddha kaḍege eḷeyalla — tēru munde hōgōdu hāgē."
    en: "A vow isn't fulfilled by the hands, Amma, but by the heart. … Children, stand together on the same side of the front rope. One end of the rope is tied to the Goddess's chariot; the other is in the hands of the whole village. Nobody pulls the opposite way — that's the only way a chariot moves forward."
  - scene: "The priest breaks a coconut before the great wheel. A roar goes up from the crowd. The three siblings take the front rope side by side — Suresh, Shobha, Mahadeva — with Rakshith just behind. The chariot creaks, shudders and begins to roll. Bananas and davana rain down on it."
  - who: mahadeva
    t: "ಎಲ್ರೂ ಒಟ್ಟಿಗೆ — ಒಂದು, ಎರಡು, ಮೂರು — ಎಳೀರಿ!"
    tr: "Ellrū oṭṭige — ondu, eraḍu, mūru — eḷīri!"
    en: "Everyone together — one, two, three — pull!"
  - who: rakshith
    t: "ಉಘೇ ಉಘೇ ಬೆಟ್ಟದಮ್ಮ! … ಅಪ್ಪ, ಇದು ಎಷ್ಟು ಭಾರ! ಸಾವಿರ ಜನ ಎಳೀತಿದಾರೆ, ಆದ್ರೂ ನಿಧಾನವಾಗಿ ಹೋಗ್ತಿದೆ."
    tr: "Ughē ughē Beṭṭadamma! … Appa, idu eṣṭu bhāra! Sāvira jana eḷītidāre, ādrū nidhānavāgi hōgtide."
    en: "Ughe, ughe, Bettadamma! … Appa, it's so heavy! A thousand people are pulling, and still it moves slowly."
  - who: suresh
    t: "ಅದಕ್ಕೇ ಎಲ್ಲರೂ ಒಂದೇ ಕಡೆ ಎಳೀಬೇಕು ಅಂದ್ರು ಪೂಜಾರಿಗಳು. ಕುಟುಂಬಾನೂ ಹಾಗೇ, ಕಂದ — ಭಾರ, ನಿಧಾನ, ಆದ್ರೆ ಎಲ್ರೂ ಎಳೆದ್ರೆ ಮುಂದೆ ಹೋಗುತ್ತೆ."
    tr: "Adakkē ellarū ondē kaḍe eḷībēku andru pūjārigaḷu. Kuṭumbānū hāgē, kanda — bhāra, nidhāna, ādre ellrū eḷedre munde hōgutte."
    en: "That's why the priest said everyone must pull the same way. A family's like that too, son — heavy, slow, but if everyone pulls, it moves."
  - who: shobha
    t: "ಅವ್ವನ್ನ ನೋಡು — ಅಳ್ತಿದಾಳೆ."
    tr: "Avvanna nōḍu — aḷtidāḷe."
    en: "(glancing back) Look at Avva — she's crying."
  - who: avva
    t: "ಅಳ್ತಿಲ್ಲ ಕಣವ್ವ. ದವನದ ಘಾಟು ಕಣ್ಣಿಗೆ ಹೊಡೀತು. … ಎಳೀರಿ, ಎಳೀರಿ, ನಿಲ್ಲಿಸ್ಬೇಡಿ."
    tr: "Aḷtilla kaṇavva. Davanada ghāṭu kaṇṇige hoḍītu. … Eḷīri, eḷīri, nillisbēḍi."
    en: "(wiping her eyes with the end of her sari) I'm not crying, girl. The davana got into my eyes. … Pull, pull, don't stop."

  - section: "Fire and prasada"
    learn: "the fire-walk: koṇḍa, keṇḍa, upavāsa, vrata, pūjārigaḷa anumati, suṭṭa gāya · the priest's counsel: haṇa eṇisōdu sulabha, manassu eṇisōdu kaṣṭa · habitual past: modala bellada accu tandu koḍtidru · a married daughter's distance: tavarige atithi āgōdu nidhānavāgi āgutte · the fair: tiḷi baṇṇada hatti sīre, hasiru baḷe, jilēbi, kaḍlepuri"
  - scene: "Evening. Behind the temple, in a fenced square, a long pit of embers glows — the konda, for the fire-walk at dawn. Men who have kept a vow and fasted are being blessed. The priest sits on the temple steps handing out prasada; Suresh, Mahadeva and Rakshith sit on the step below him."
  - who: rakshith
    t: "ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಜನ ಈ ಕೆಂಡದ ಮೇಲೆ ನಡೀತಾರಾ? ಚಿಕ್ಕಪ್ಪ, ನೀನು ಯಾವತ್ತಾದ್ರೂ ನಡೆದಿದ್ಯಾ?"
    tr: "Nāḷe beḷigge jana ī keṇḍada mēle naḍītārā? Cikkappa, nīnu yāvattādrū naḍedidyā?"
    en: "Tomorrow morning people walk over these embers? Chikkappa, have you ever done it?"
  - who: mahadeva
    t: "ಒಂದೇ ಸಲ. ಎರಡು ಸಾವಿರದ ಆರರಲ್ಲಿ ಅಪ್ಪನ ಕಾಲು ಮುರಿದಾಗ ಹರಕೆ ಹೊತ್ತಿದ್ದೆ. ಒಂದು ವಾರ ಉಪವಾಸ, ವ್ರತ. … ಆದ್ರೆ ನೀನು ಯಾವತ್ತೂ ಇದನ್ನ ಆಟಕ್ಕೆ ಮಾಡ್ಬಾರ್ದು. ವ್ರತ ಮಾಡಿದೋರು, ಪೂಜಾರಿಗಳ ಅನುಮತಿ ಇರೋರು ಮಾತ್ರ. ಪ್ರತಿ ವರ್ಷ ಯಾರಿಗಾದ್ರೂ ಸುಟ್ಟ ಗಾಯ ಆಗುತ್ತೆ."
    tr: "Ondē sala. Eraḍu sāvirada āraralli appana kālu muridāga harake hottidde. Ondu vāra upavāsa, vrata. … Ādre nīnu yāvattū idanna āṭakke māḍbārdu. Vrata māḍidōru, pūjārigaḷa anumati irōru mātra. Prati varṣa yārigādrū suṭṭa gāya āgutte."
    en: "Just once. In two thousand six, when Appa broke his leg, I made a vow. A week of fasting and observances. … But don't you ever do it for fun. Only those who've kept the vow and have the priest's permission. Every year somebody gets burnt."
  - who: priest
    t: "ಮಹದೇವ ಸರಿಯಾಗಿ ಹೇಳಿದ. ಕೊಂಡ ಧೈರ್ಯ ತೋರಿಸೋ ಜಾಗ ಅಲ್ಲ, ಶ್ರದ್ಧೆ ತೋರಿಸೋ ಜಾಗ. … ತಗೊಳ್ಳಿ, ಪ್ರಸಾದ. ಸುರೇಶ, ನಿಮ್ಮಪ್ಪ ಪ್ರತಿ ವರ್ಷ ಕೊಯ್ಲಾದ ಮೇಲೆ ಮೊದಲ ಬೆಲ್ಲದ ಅಚ್ಚು, ಮೊದಲ ರಾಗಿ ತೆನೆ ಅಮ್ಮನಿಗೆ ತಂದು ಕೊಡ್ತಿದ್ರು. ನಲವತ್ತು ವರ್ಷ ಒಂದ್ಸಲಾನೂ ತಪ್ಪಿಸಲಿಲ್ಲ."
    tr: "Mahadēva sariyāgi hēḷida. Koṇḍa dhairya tōrisō jāga alla, śraddhe tōrisō jāga. … Tagoḷḷi, prasāda. Surēśa, nimmappa prati varṣa koylāda mēle modala bellada accu, modala rāgi tene ammanige tandu koḍtidru. Nalavattu varṣa ondsalānū tappisalilla."
    en: "Mahadeva's right. The fire pit isn't a place to show courage; it's a place to show devotion. … Here, take the prasada. Suresha, every year after the harvest your father used to bring the Goddess the first block of jaggery and the first ear of ragi. In forty years he never once missed."
  - who: mahadeva
    t: "ಈ ಸಲ ರಾಗಿ ಕೊಯ್ಲು ಮುಂದಿನ ವಾರ ಸ್ವಾಮಿ. ಮೊದಲ ತೆನೆ ನಾನೇ ತರ್ತೀನಿ."
    tr: "Ī sala rāgi koylu mundina vāra svāmi. Modala tene nānē tartīni."
    en: "This year the ragi harvest is next week, Swami. I'll bring the first ear myself."
  - who: priest
    t: "ಒಳ್ಳೇದು. … ಒಂದು ಮಾತು ಹೇಳ್ಲಾ? ಊರಲ್ಲಿ ಸುದ್ದಿ ಇದೆ — ನೀವು ಲೋಕ ಅದಾಲತ್‌ಗೆ ಹೋಗ್ತಿದೀರಿ ಅಂತ. ನಾನು ಪೂಜಾರಿ, ನನಗೆ ಕಾನೂನು ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ಮೂವತ್ತು ವರ್ಷದಿಂದ ಈ ಮೆಟ್ಟಿಲ ಮೇಲೆ ಕೂತು ಎಷ್ಟೋ ಮನೆಗಳು ಒಡೆಯೋದು ನೋಡಿದೀನಿ. ಹಣ ಎಣಿಸೋದು ಸುಲಭ. ಮನಸ್ಸು ಎಣಿಸೋದು ಕಷ್ಟ. ಅಲ್ಲಿ ಹೋದಾಗ ಎಕರೆ-ಗುಂಟೆ ಜೊತೆಗೆ ಮನಸ್ಸನ್ನೂ ಅಳೀರಿ."
    tr: "Oḷḷēdu. … Ondu mātu hēḷlā? Ūralli suddi ide — nīvu Lōka Adālat-ge hōgtidīri anta. Nānu pūjāri, nanage kānūnu gottilla. Ādre mūvattu varṣadinda ī meṭṭila mēle kūtu eṣṭō manegaḷu oḍeyōdu nōḍidīni. Haṇa eṇisōdu sulabha. Manassu eṇisōdu kaṣṭa. Alli hōdāga ekare-guṇṭe jotege manassannū aḷīri."
    en: "Good. … May I say one thing? There's talk in the village that you're going to the Lok Adalat. I'm a priest; I don't know the law. But sitting on these steps for thirty years I've watched so many families break apart. Counting money is easy. Counting hearts is hard. When you go there, measure the hearts along with the acres and guntas."
  - who: suresh
    t: "ನೆನಪಿಟ್ಕೊಳ್ತೀವಿ ಸ್ವಾಮಿ."
    tr: "Nenapiṭkoḷtīvi svāmi."
    en: "We'll remember that, Swami."
  - scene: "The fair, after dark. Under strings of bulbs, Shobha and Rakshith walk between the stalls. Shobha holds a folded sari up to the light; Rakshith carries a paper cone of kadlepuri and a packet of jilebi."
  - who: shobha
    t: "ಈ ತಿಳಿ ಬಣ್ಣದ ಹತ್ತಿ ಸೀರೆ ಅವ್ವನಿಗೆ ಹೇಗಿರುತ್ತೆ, ರಕ್ಷಿತ್? ಅವ್ವ ರೇಷ್ಮೆ ಉಡಲ್ಲ, ಹತ್ತಿಯೇ ಬೇಕು. ಹಸಿರು ಬಳೇನೂ ತಗೊಂಡೆ — ನಿಮ್ಮಮ್ಮನಿಗೊಂದು ಜೊತೆ, ನನಗೊಂದು ಜೊತೆ."
    tr: "Ī tiḷi baṇṇada hatti sīre avvanige hēgirutte, Rakṣit? Avva rēṣme uḍalla, hattiyē bēku. Hasiru baḷēnū tagoṇḍe — nimmammanigondu jote, nanagondu jote."
    en: "How will this pale cotton sari look on Avva, Rakshith? Avva doesn't wear silk; it has to be cotton. And I bought green bangles — a set for your mother, a set for me."
  - who: rakshith
    t: "ಅತ್ತೆ, ಹದಿನಾರು ವರ್ಷದಿಂದ ನೀನು ಜಾತ್ರೆಗೆ ಯಾಕೆ ಬರ್ಲಿಲ್ಲ?"
    tr: "Atte, hadināru varṣadinda nīnu jātrege yāke barlilla?"
    en: "Atte, why didn't you come to the jatre for sixteen years?"
  - who: shobha
    t: "ಮೊದಲು ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ರಜೆ ಸಿಗ್ತಿರ್ಲಿಲ್ಲ. ಆಮೇಲೆ ಅಭ್ಯಾಸ ಆಯ್ತು — ಬರದೇ ಇರೋದು. ಮದುವೆಯಾದ ಹೆಣ್ಣುಮಗಳು ತವರಿಗೆ ‘ಅತಿಥಿ’ ಆಗೋದು ನಿಧಾನವಾಗಿ ಆಗುತ್ತೆ, ರಕ್ಷಿತ್. ಯಾರೂ ಬಾಗಿಲು ಮುಚ್ಚಲ್ಲ. ನಾವೇ ಬರೋದು ಕಮ್ಮಿ ಮಾಡ್ತೀವಿ. ಆಮೇಲೆ ಒಂದು ದಿನ ಜಮೀನಿನ ಕಾಗದದಲ್ಲಿ ಹೆಸರೇ ಇರಲ್ಲ."
    tr: "Modalu āspatreyalli raje sigtirlilla. Āmēle abhyāsa āytu — baradē irōdu. Maduveyāda heṇṇumagaḷu tavarige ‘atithi’ āgōdu nidhānavāgi āgutte, Rakṣit. Yārū bāgilu muccalla. Nāvē barōdu kammi māḍtīvi. Āmēle ondu dina jamīnina kāgadadalli hesarē iralla."
    en: "At first I couldn't get leave from the hospital. Then it became a habit — not coming. A married daughter turns into a 'guest' in her parents' home slowly, Rakshith. Nobody shuts the door. We ourselves come less and less. And then one day your name isn't even on the land papers."
  - who: rakshith
    t: "ಅದಕ್ಕೇ ಕೇಸ್ ಹಾಕಿದ್ಯಾ?"
    tr: "Adakkē kēs hākidyā?"
    en: "Is that why you filed the case?"
  - who: shobha
    t: "ಅದಕ್ಕೇ. ಹಣಕ್ಕಲ್ಲ. ‘ನಾನೂ ಈ ಮನೆಯವಳು’ ಅಂತ ಬರೆದಿರೋ ಒಂದು ಕಾಗದಕ್ಕೆ. … ಜಿಲೇಬಿ ಕೊಡು, ತಣ್ಣಗಾಗ್ತಿದೆ."
    tr: "Adakkē. Haṇakkalla. ‘Nānū ī maneyavaḷu’ anta baredirō ondu kāgadakke. … Jilēbi koḍu, taṇṇagāgtide."
    en: "That's why. Not for money. For one piece of paper that says 'I belong to this house too'. … Give me a jilebi, they're getting cold."

  - section: "A night in the yard"
    learn: "night talk: nidde barlilvā, ellrū illi kūri · shared memories: nenapideyā … malagtidvi, hēḷtidda · saying what you want: nanage bēkāgiddu …, maṇṇu nanage bēḍa, haṇada rūpadalli · generosity: lekka sari māḍtidīni, ippattu varṣada bāki · a mother's terms: nānu irōvaregū nanna hesarallirali, uyilu barestīni · dictation: bari kaṇavva"
  - scene: "Past midnight. The drums have stopped; only the generator of the giant wheel still hums down by the tank. In the yard of the house Avva sits on a mat under the open sky. One by one her children come out — none of them can sleep."
  - who: avva
    t: "ನಿದ್ದೆ ಬರ್ಲಿಲ್ವಾ? ಬನ್ನಿ, ಎಲ್ರೂ ಇಲ್ಲಿ ಕೂರಿ. ಇವತ್ತು ಮೂರೂ ಜನ ಒಟ್ಟಿಗೆ ಕೂತಿದೀರಿ — ಕೋರ್ಟಿನ ಬೆಂಚಲ್ಲ, ನಮ್ಮ ಅಂಗಳ."
    tr: "Nidde barlilvā? Banni, ellrū illi kūri. Ivattu mūrū jana oṭṭige kūtidīri — kōrṭina beṇcalla, namma aṅgaḷa."
    en: "Couldn't sleep? Come, all of you, sit here. Tonight the three of you are sitting together — not on a court bench, in our own yard."
  - who: shobha
    t: "ಅವ್ವ, ನೆನಪಿದೆಯಾ? ಬೇಸಿಗೆಯಲ್ಲಿ ನಾವು ಮೂವರೂ ಇಲ್ಲೇ ಚಾಪೆ ಹಾಸ್ಕೊಂಡು ಮಲಗ್ತಿದ್ವಿ. ಅಣ್ಣ ನಕ್ಷತ್ರಗಳ ಹೆಸರು ಹೇಳ್ತಿದ್ದ, ಮಹದೇವ ದೆವ್ವದ ಕಥೆ ಹೇಳಿ ನನ್ನ ಹೆದರಿಸ್ತಿದ್ದ."
    tr: "Avva, nenapideyā? Bēsigeyalli nāvu mūvarū illē cāpe hāskoṇḍu malagtidvi. Aṇṇa nakṣatragaḷa hesaru hēḷtidda, Mahadēva devvada kathe hēḷi nanna hedaristidda."
    en: "Avva, do you remember? In summer the three of us used to spread our mats right here and sleep. Anna would name the stars, and Mahadeva would tell ghost stories to frighten me."
  - who: mahadeva
    t: "ನೀನು ಹೆದರಿ ಅಪ್ಪನ ಹತ್ರ ಓಡೋಗ್ತಿದ್ದೆ. ಮಾರನೇ ದಿನ ಬೈಸ್ಕೊಳ್ತಿದ್ದಿದ್ದು ನಾನು."
    tr: "Nīnu hedari appana hatra ōḍōgtidde. Māranē dina baiskoḷtiddiddu nānu."
    en: "You'd get scared and run to Appa. And the next day I'd be the one getting scolded."
  - who: avva
    t: "ಅವತ್ತೂ ಹಂಗೇ, ಇವತ್ತೂ ಹಂಗೇ. … ಕೇಳಿ. ಹನ್ನೆರಡನೇ ತಾರೀಖು ನೀವು ಆ ಅದಾಲತ್‌ಗೆ ಹೋಗ್ತೀರಿ. ಅಲ್ಲಿ ವಕೀಲರು ಮಾತಾಡ್ತಾರೆ, ಜಡ್ಜ್ ಸಾಹೇಬ್ರು ಮಾತಾಡ್ತಾರೆ. ಅದಕ್ಕೂ ಮುಂಚೆ ಒಂದ್ಸಲ ಒಬ್ಬೊಬ್ಬರಾಗಿ ಹೇಳಿ — ನಿಜವಾಗ್ಲೂ ನಿಮಗೆ ಏನು ಬೇಕು? ವಕೀಲರ ಭಾಷೆಯಲ್ಲಿ ಅಲ್ಲ. ನಿಮ್ಮವ್ವನ ಭಾಷೆಯಲ್ಲಿ."
    tr: "Avattū haṅgē, ivattū haṅgē. … Kēḷi. Hanneraḍanē tārīkhu nīvu ā Adālat-ge hōgtīri. Alli vakīlaru mātāḍtāre, jaḍj sāhēbru mātāḍtāre. Adakkū mun̄ce ondsala obbobbarāgi hēḷi — nijavāglū nimage ēnu bēku? Vakīlara bhāṣeyalli alla. Nimmavvana bhāṣeyalli."
    en: "It was like that then, and it's like that now. … Listen. On the twelfth you go to that Adalat. There the lawyers will talk, the judge will talk. Before that, tell me once, one at a time — what do you truly want? Not in the lawyers' language. In your mother's."
  - who: mahadeva
    t: "ನಾನೇ ಮೊದಲು ಹೇಳ್ತೀನಿ. ನನಗೆ ಗದ್ದೆ ಬೇಕು, ಅವ್ವ — ಪೂರ್ತಿ ಮೂರೂವರೆ ಎಕರೆ, ತುಂಡು ಮಾಡದೆ. ಮತ್ತೆ ಈ ಮನೆ, ಕೊಟ್ಟಿಗೆ. ಗದ್ದೆ ತುಂಡಾದ್ರೆ ನಾಲೆ ನೀರು ಹಂಚೋದೇ ಜಗಳ ಆಗುತ್ತೆ. ಅದಕ್ಕೆ ಬದಲಾಗಿ ಏನು ಕೇಳಿದ್ರೂ ಕೊಡ್ತೀನಿ — ಸಾಲ ಇದ್ರೆ ಅದೂ ನನ್ನದು. ಆದ್ರೆ ನನ್ ಹತ್ರ ಲಕ್ಷಗಟ್ಲೆ ನಗದು ಇಲ್ಲ, ಅದು ಎಲ್ರಿಗೂ ಗೊತ್ತು."
    tr: "Nānē modalu hēḷtīni. Nanage gadde bēku, avva — pūrti mūrūvare ekare, tuṇḍu māḍade. Matte ī mane, koṭṭige. Gadde tuṇḍādre nāle nīru han̄cōdē jagaḷa āgutte. Adakke badalāgi ēnu kēḷidrū koḍtīni — sāla idre adū nannadu. Ādre nan hatra lakṣagaṭle nagadu illa, adu ellrigū gottu."
    en: "I'll say it first. I want the wet land, Avva — all three and a half acres, without cutting it up. And this house, and the cattle shed. If the wet land is split, even sharing out the canal water becomes a fight. In return I'll give whatever's asked — if there's any loan, that's mine too. But I don't have lakhs in cash; everybody knows that."
  - who: shobha
    t: "ನನಗೆ ಮೊದಲು ಬೇಕಾಗಿದ್ದು ನನ್ನ ಹೆಸರು. ಅದು ಪಹಣಿಯಲ್ಲಿ ಬಂತು. ಈಗ… ನಿಜ ಹೇಳ್ಬೇಕು ಅಂದ್ರೆ, ಮೈಸೂರಲ್ಲಿ ನಾವು ಹತ್ತು ವರ್ಷದಿಂದ ಬಾಡಿಗೆ ಮನೆಯಲ್ಲಿದೀವಿ. ಒಂದು ಸಣ್ಣ ಮನೆ ನಮ್ಮದು ಅಂತ ಆಗ್ಬೇಕು ಅನ್ನೋ ಆಸೆ ಇದೆ. ಮಣ್ಣು ನನಗೆ ಬೇಡ — ನಾನು ಬೇಸಾಯ ಮಾಡಲ್ಲ. ನನ್ನ ಪಾಲು ಹಣದ ರೂಪದಲ್ಲಿ ಬಂದ್ರೆ ಸಾಕು. ಆದ್ರೆ ಅದು ಮಹದೇವನ ಗದ್ದೆ ಮಾರಿ ಅಲ್ಲ."
    tr: "Nanage modalu bēkāgiddu nanna hesaru. Adu pahaṇiyalli bantu. Īga… nija hēḷbēku andre, Maisūralli nāvu hattu varṣadinda bāḍige maneyallidīvi. Ondu saṇṇa mane nammadu anta āgbēku annō āse ide. Maṇṇu nanage bēḍa — nānu bēsāya māḍalla. Nanna pālu haṇada rūpadalli bandre sāku. Ādre adu Mahadēvana gadde māri alla."
    en: "What I wanted first was my name. That's come into the RTC. Now… if I'm honest, in Mysuru we've lived in a rented house for ten years. I've always wished for one small house that's our own. I don't need soil — I won't farm. If my share comes as money, that's enough. But not by selling Mahadeva's wet land."
  - who: suresh
    t: "ನನ್ನ ಸರತಿ. ನನಗೆ ಏನೂ ಬೇಡ. ಬ್ಯಾಂಕ್ ಕೆಲಸ ಇದೆ, ಮನೆ ಇದೆ — ಸಾಲದ ಮನೆ ಆದ್ರೂ. ಅಪ್ಪ ನನ್ನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ದೇ ನನ್ನ ಪಾಲು. ನನ್ನ ಭಾಗವನ್ನ ಅವ್ವನ ಹೆಸರಿಗೆ ಬರೆದುಬಿಡ್ತೀನಿ. ಅವ್ವ ಇರೋವರೆಗೂ ಅದು ಅವಳದು — ಯಾರ ಮುಂದೆಯೂ ಅವಳು ಕೈ ಚಾಚಬಾರದು."
    tr: "Nanna sarati. Nanage ēnū bēḍa. Byāṅk kelasa ide, mane ide — sālada mane ādrū. Appa nanna ōdige ettu māriddē nanna pālu. Nanna bhāgavanna avvana hesarige baredubiḍtīni. Avva irōvaregū adu avaḷadu — yāra mundeyū avaḷu kai cācabāradu."
    en: "My turn. I don't want anything. I have my bank job, I have a house — a house on a loan, but still. Appa selling the bullocks for my studies was my share. I'll write my portion over to Avva's name. As long as Avva lives, it's hers — she should never have to hold out her hand to anyone."
  - who: mahadeva
    t: "ಅಣ್ಣ… ಅದು ಜಾಸ್ತಿ ಆಯ್ತು."
    tr: "Aṇṇa… adu jāsti āytu."
    en: "Anna… that's too much."
  - who: suresh
    t: "ಜಾಸ್ತಿ ಅಲ್ಲ. ಲೆಕ್ಕ ಸರಿ ಮಾಡ್ತಿದೀನಿ. ಇಪ್ಪತ್ತು ವರ್ಷದ ಬಾಕಿ ಇದೆ."
    tr: "Jāsti alla. Lekka sari māḍtidīni. Ippattu varṣada bāki ide."
    en: "Not too much. I'm settling accounts. There are twenty years of arrears."
  - who: shobha
    t: "ಅಣ್ಣ, ಅತ್ತಿಗೆನ ಕೇಳಿದ್ಯಾ? ಅದು ರಕ್ಷಿತ್‌ನ ಪಾಲೂ ಹೌದು."
    tr: "Aṇṇa, attigena kēḷidyā? Adu Rakṣit-na pālū haudu."
    en: "Anna, did you ask Attige? It's Rakshith's share too."
  - who: suresh
    t: "ಕೇಳಿದೆ. ಮೀನಾ ಒಂದೇ ಮಾತು ಹೇಳಿದ್ಲು — ‘ಮಾರ್ಚ್‌ನಲ್ಲಿ ಅಂಕಿ ಬರೆದೋಳು ನಾನು. ಆ ಅಂಕಿಗಳಲ್ಲಿ ಅವ್ವನ ಮುಪ್ಪಿನ ಕಾಲ ಇರ್ಲಿಲ್ಲ. ಅದನ್ನ ಸೇರಿಸಿ.’ ರಕ್ಷಿತ್‌ನನ್ನೂ ಕೇಳಿದೆ. ‘ನಂಗೆ ಜಮೀನು ಬೇಡ, ಚಿಕ್ಕಪ್ಪನ ಮನೆಗೆ ಬರೋ ದಾರಿ ಮುಚ್ಚಬಾರದು, ಅಷ್ಟೇ’ ಅಂದ."
    tr: "Kēḷide. Mīnā ondē mātu hēḷidlu — ‘Mārc-nalli aṅki baredōḷu nānu. Ā aṅkigaḷalli avvana muppina kāla irlilla. Adanna sērisi.’ Rakṣit-nannū kēḷide. ‘Naṅge jamīnu bēḍa, cikkappana manege barō dāri muccabāradu, aṣṭē’ anda."
    en: "I did. Meena said just one thing: 'I'm the one who wrote the figures in March. Avva's old age wasn't in those figures. Put it in.' I asked Rakshith too. He said, 'I don't want land. Just don't let the road to Chikkappa's house close, that's all.'"
  - who: avva
    t: "ಈಗ ನನ್ನ ಮಾತು ಕೇಳಿ. ನನಗೆ ಜಮೀನು ಬೇಡ — ಎಪ್ಪತ್ತು ವರ್ಷದವಳು ಜಮೀನು ತಗೊಂಡು ಏನು ಮಾಡ್ಲಿ? ಆದ್ರೆ ಆ ಹುಣಸೆ ಮರದ ಹೊಲ… ನಿಮ್ಮಪ್ಪ ಅಲ್ಲಿ ಮಲಗಿದಾರೆ. ಆ ಭಾಗ ನಾನು ಇರೋವರೆಗೂ ನನ್ನ ಹೆಸರಲ್ಲಿರಲಿ. ಮಹದೇವ ಅಲ್ಲಿ ರಾಗಿ ಬೆಳೀಲಿ. ನಾನು ಹೋದ ಮೇಲೆ ಅದು ಯಾರಿಗೆ ಅಂತ ಉಯಿಲು ಬರೆಸ್ತೀನಿ — ನಿಮ್ಮಪ್ಪ ಬರೆಸಲಿಲ್ಲ, ಅದಕ್ಕೇ ಇಷ್ಟೆಲ್ಲಾ ಆಯ್ತು."
    tr: "Īga nanna mātu kēḷi. Nanage jamīnu bēḍa — eppattu varṣadavaḷu jamīnu tagoṇḍu ēnu māḍli? Ādre ā huṇase marada hola… nimmappa alli malagidāre. Ā bhāga nānu irōvaregū nanna hesarallirali. Mahadēva alli rāgi beḷīli. Nānu hōda mēle adu yārige anta uyilu barestīni — nimmappa baresalilla, adakkē iṣṭellā āytu."
    en: "Now listen to me. I don't want land — what would a woman of seventy do with land? But that field with the tamarind tree… your father lies there. Let that part stay in my name as long as I live. Let Mahadeva grow ragi on it. Who gets it after I'm gone, I'll have written in a will — your father never had one written, and that's why all this happened."
  - who: shobha
    t: "ಮತ್ತೆ ನನ್ನ ಹಣ ಎಲ್ಲಿಂದ? ಮಹದೇವನ ಹತ್ರ ನಗದು ಇಲ್ಲ."
    tr: "Matte nanna haṇa ellinda? Mahadēvana hatra nagadu illa."
    en: "Then where does my money come from? Mahadeva has no cash."
  - who: mahadeva
    t: "ಒಣ ಹೊಲದ ಅರ್ಧ — ಹುಣಸೆ ಮರ ಇಲ್ಲದ ಕಡೆ, ರಸ್ತೆ ಪಕ್ಕದ್ದು. ಪಕ್ಕದ ನಿಂಗೇಗೌಡ್ರು ಎರಡು ವರ್ಷದಿಂದ ಕೇಳ್ತಿದಾರೆ — ಅವರ ಹೊಲಕ್ಕೆ ಅಂಟ್ಕೊಂಡಿದೆ. ಅವರು ರೈತರು, ಬ್ರೋಕರ್ ಅಲ್ಲ, ಫಾರ್ಮ್‌ಹೌಸ್ ಕಟ್ಟಲ್ಲ. ಅದನ್ನ ಮಾರಿ ಬಂದ ಹಣ ಪೂರ್ತಿ ನಿನಗೆ."
    tr: "Oṇa holada ardha — huṇase mara illada kaḍe, raste pakkaddu. Pakkada Niṅgēgauḍru eraḍu varṣadinda kēḷtidāre — avara holakke aṇṭkoṇḍide. Avaru raitaru, brōkar alla, phārm-haus kaṭṭalla. Adanna māri banda haṇa pūrti ninage."
    en: "Half the dry field — the side without the tamarind tree, by the road. Our neighbour Ningegowda has been asking for it for two years — it adjoins his field. He's a farmer, not a broker; he won't build a farmhouse. Every rupee from selling it goes to you."
  - who: shobha
    t: "ಮಾರಾಟ? ‘ಜಮೀನು ಮಾರಲ್ಲ’ ಅಂತ ಅಪ್ಪ ಬರೆದಿದ್ರಲ್ಲ, ಮಹದೇವ? ಆ ಮಾತನ್ನ ಮೊದಲು ಹೇಳಿದ್ದೇ ನೀನು."
    tr: "Mārāṭa? ‘Jamīnu māralla’ anta appa baredidralla, Mahadēva? Ā mātanna modalu hēḷiddē nīnu."
    en: "Selling? Didn't Appa write 'I will not sell the land', Mahadeva? You were the first one to quote it."
  - who: mahadeva
    t: "ಹೌದು. ಅಪ್ಪ ಬದುಕಿದ್ದಾಗ ಮಾರ್ಲಿಲ್ಲ. ಆದ್ರೆ ಅಪ್ಪಾನೇ ನಿನ್ನ ಮದುವೆಗೆ ಸಾಲ ಮಾಡಿದ್ರು, ಅಣ್ಣನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ರು. ಮಕ್ಕಳಿಗಾಗಿ ಕೊಡೋದು ಅಪ್ಪನಿಗೆ ಗೊತ್ತಿತ್ತು. ಒಂದೂಕಾಲು ಎಕರೆ ಹೋದ್ರೆ ಹೋಗ್ಲಿ — ತಂಗಿ ಕಣ್ಣೀರು ಹಾಕ್ಕೊಂಡು ಕೋರ್ಟಿಗೆ ಅಲೆಯೋದಕ್ಕಿಂತ ಅದು ಸಾವಿರ ಪಾಲು ವಾಸಿ."
    tr: "Haudu. Appa badukiddāga mārlilla. Ādre appānē ninna maduvege sāla māḍidru, aṇṇana ōdige ettu māridru. Makkaḷigāgi koḍōdu appanige gottittu. Ondūkālu ekare hōdre hōgli — taṅgi kaṇṇīru hākkoṇḍu kōrṭige aleyōdakkinta adu sāvira pālu vāsi."
    en: "Yes. While Appa lived, he didn't sell. But Appa himself borrowed for your wedding and sold the bullocks for Anna's studies. Appa knew how to give for his children. If one and a quarter acres goes, let it go — that's a thousand times better than my sister trailing round the courts in tears."
  - who: shobha
    t: "… ಮಹದೇವ."
    tr: "… Mahadēva."
    en: "(her voice breaking) … Mahadeva."
  - who: avva
    t: "ಸಾಕು, ಸಾಕು. ಇದನ್ನೆಲ್ಲಾ ಹನ್ನೆರಡನೇ ತಾರೀಖು ಜಡ್ಜ್ ಸಾಹೇಬ್ರ ಮುಂದೆ ಮತ್ತೆ ಹೇಳಿ. ಇವತ್ತು ರಾತ್ರಿ ಹೇಳಿದ್ದು ಅಮ್ಮನ ಮುಂದೆ ಹೇಳಿದ ಹಾಗೆ. … ನಿಮ್ಮಪ್ಪನ ದಿನಚರಿ ತಗೊಂಡು ಬಾ ಮಹದೇವ. ಇವತ್ತಿನ ದಿನ ಅದರಲ್ಲಿ ಬರೀಬೇಕು."
    tr: "Sāku, sāku. Idannellā hanneraḍanē tārīkhu jaḍj sāhēbra munde matte hēḷi. Ivattu rātri hēḷiddu ammana munde hēḷida hāge. … Nimmappana dinacari tagoṇḍu bā Mahadēva. Ivattina dina adaralli barībēku."
    en: "Enough, enough. Say all this again before the judge on the twelfth. What you said tonight, you've said as if before the Goddess. … Bring your father's diary, Mahadeva. Today has to be written in it."
  - who: mahadeva
    t: "ಯಾರು ಬರೀತಾರೆ, ಅವ್ವ? ನಿನಗೆ ಬರೆಯೋಕೆ ಬರಲ್ಲ."
    tr: "Yāru barītāre, avva? Ninage bareyōke baralla."
    en: "Who'll write it, Avva? You can't write."
  - who: avva
    t: "ನಾನು ಹೇಳ್ತೀನಿ, ಶೋಭಾ ಬರೀಲಿ. ಮನೆ ಮಗಳ ಕೈಬರಹ ಆ ಪುಸ್ತಕದಲ್ಲಿ ಒಂದು ಸಲನಾದ್ರೂ ಇರ್ಬೇಕು. … ಬರಿ ಕಣವ್ವ: ‘ಜಾತ್ರೆ ರಾತ್ರಿ. ಮೂರೂ ಮಕ್ಳು ಅಂಗಳದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಕೂತಿದ್ರು. ಇನ್ನು ಒಟ್ಟಿಗೆ ಉಣ್ಣೋದು ಒಂದೇ ಬಾಕಿ.’"
    tr: "Nānu hēḷtīni, Śōbhā barīli. Mane magaḷa kaibaraha ā pustakadalli ondu salanādrū irbēku. … Bari kaṇavva: ‘Jātre rātri. Mūrū makḷu aṅgaḷadalli oṭṭige kūtidru. Innu oṭṭige uṇṇōdu ondē bāki.’"
    en: "I'll say it; let Shobha write. The daughter of the house must have her handwriting in that book at least once. … Write, my girl: 'Night of the jatre. All three children sat together in the yard. Only eating together still remains.'"

  - chapter: "Chapter 9 — Lok Adalat"
  - section: "Bench number three"
    learn: "the conciliator's opening: idu kōrṭ alla, yārū gellalla, yārū sōlalla · three points of law: aitīrpu ḍikrige samāna, mēlmanavi illa, nyāyālaya śulka vāpas · inviting each side: kāgadadallirō bēḍike alla, nimma manassallirōdu · wording matters: paḍediruttāre vs biṭṭukoṭṭiruttāre · testing a decision: bhāvōdvēgadalli tagoṇḍa tīrmānavā? · testimony: ottaḍa hākiddu obrē"
  - scene: "Saturday, 12 December 2026. The National Lok Adalat at the Maddur court complex. In a first-floor hall, tables have been set out as 'benches', each with a numbered placard. Bench three: a retired district judge with silver hair, and beside him a woman advocate as member. On 27 November the court had referred the suit here on the family's joint application. Shobha sits with Advocate Nagendra; Mahadeva with his lawyer; Suresh and Meena; Avva with her legal-aid lawyer. This week the family marked one year since Thatha's death."
  - who: conciliator
    t: "ಎಲ್ಲರಿಗೂ ನಮಸ್ಕಾರ. ಕೂತ್ಕೊಳ್ಳಿ — ಅಮ್ಮ, ನೀವು ಈ ಕುರ್ಚಿಯಲ್ಲಿ, ಫ್ಯಾನ್ ಕೆಳಗೆ. ಮೊದಲು ಒಂದು ವಿಷಯ ಸ್ಪಷ್ಟ ಮಾಡ್ತೀನಿ. ಇದು ಕೋರ್ಟ್ ಅಲ್ಲ. ಇಲ್ಲಿ ಯಾರೂ ಗೆಲ್ಲಲ್ಲ, ಯಾರೂ ಸೋಲಲ್ಲ. ನಾನು ತೀರ್ಪು ಕೊಡೋಕೆ ಕೂತಿಲ್ಲ; ನೀವೇ ಒಂದು ತೀರ್ಮಾನಕ್ಕೆ ಬರೋಕೆ ಸಹಾಯ ಮಾಡೋಕೆ ಕೂತಿದೀನಿ."
    tr: "Ellarigū namaskāra. Kūtkoḷḷi — amma, nīvu ī kurciyalli, phyān keḷage. Modalu ondu viṣaya spaṣṭa māḍtīni. Idu kōrṭ alla. Illi yārū gellalla, yārū sōlalla. Nānu tīrpu koḍōke kūtilla; nīvē ondu tīrmānakke barōke sahāya māḍōke kūtidīni."
    en: "Namaskara, everyone. Please sit — Amma, you take this chair, under the fan. First let me make one thing clear. This is not a court. Here nobody wins and nobody loses. I'm not sitting here to give a verdict; I'm here to help you reach a decision yourselves."
  - who: conciliator
    t: "ಕಾನೂನಿನ ಮೂರು ಮಾತು ಮಾತ್ರ. ಒಂದು: ನೀವು ಒಪ್ಪಿ ಸಹಿ ಹಾಕಿದ ರಾಜಿಯ ಮೇಲೆ ಇಲ್ಲಿ ಕೊಡುವ ಐತೀರ್ಪು ಸಿವಿಲ್ ನ್ಯಾಯಾಲಯದ ಡಿಕ್ರಿಗೆ ಸಮಾನ. ಎರಡು: ಅದರ ವಿರುದ್ಧ ಮೇಲ್ಮನವಿ ಇಲ್ಲ — ಅದೇ ಕೊನೆ. ಮೂರು: ದಾವೆಗೆ ಕಟ್ಟಿದ ನ್ಯಾಯಾಲಯ ಶುಲ್ಕ ವಾಪಸ್ ಸಿಗುತ್ತೆ. ಒಪ್ಪಿಗೆ ಆಗದಿದ್ರೆ ಕೇಸ್ ಮತ್ತೆ ಕೋರ್ಟಿಗೇ ಹೋಗುತ್ತೆ, ನಿಮಗೆ ಏನೂ ನಷ್ಟ ಇಲ್ಲ. ಯಾರ ಮೇಲೂ ಒತ್ತಡ ಇಲ್ಲ."
    tr: "Kānūnina mūru mātu mātra. Ondu: nīvu oppi sahi hākida rājiya mēle illi koḍuva aitīrpu sivil nyāyālayada ḍikrige samāna. Eraḍu: adara viruddha mēlmanavi illa — adē kone. Mūru: dāvege kaṭṭida nyāyālaya śulka vāpas sigutte. Oppige āgadidre kēs matte kōrṭigē hōgutte, nimage ēnū naṣṭa illa. Yāra mēlū ottaḍa illa."
    en: "Just three points of law. One: the award made here on a compromise you agree to and sign is equal to a civil court decree. Two: there's no appeal against it — it's final. Three: the court fee paid on the suit is refunded. If you don't agree, the case simply goes back to the court and you lose nothing. There's no pressure on anyone."
  - who: conciliator
    t: "ದಾವೆ ಹಾಕಿದವರು ನೀವು, ಶೋಭಾ ಅವರೇ. ಮೊದಲು ನೀವೇ ಹೇಳಿ — ಕಾಗದದಲ್ಲಿರೋ ಬೇಡಿಕೆ ಅಲ್ಲ, ನಿಮ್ಮ ಮನಸ್ಸಲ್ಲಿರೋದು."
    tr: "Dāve hākidavaru nīvu, Śōbhā avarē. Modalu nīvē hēḷi — kāgadadallirō bēḍike alla, nimma manassallirōdu."
    en: "You filed the suit, Ms Shobha. You speak first — not the claim on paper, but what's in your heart."
  - who: shobha
    t: "ಸಾರ್, ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಅಪ್ಪ ಹೋದಾಗ ವಂಶವೃಕ್ಷದಲ್ಲಿ ನನ್ನ ಹೆಸರೇ ಇರ್ಲಿಲ್ಲ. ಊರಲ್ಲಿ ‘ಮದುವೆ ಖರ್ಚೇ ಅವಳ ಪಾಲು’ ಅಂದ್ರು. ನಾನು ದಾವೆ ಹಾಕಿದ್ದು ನನ್ನ ಅಣ್ಣ-ತಮ್ಮನ ವಿರುದ್ಧ ಅಲ್ಲ — ಆ ಮಾತಿನ ವಿರುದ್ಧ. ಈಗ ತಹಸೀಲ್ದಾರ್ ಆದೇಶದಿಂದ ಪಹಣಿಯಲ್ಲಿ ನನ್ನ ಹೆಸರಿದೆ. ನನಗೆ ಮಣ್ಣು ಬೇಡ; ನ್ಯಾಯವಾದ ಪಾಲು ಹಣದ ರೂಪದಲ್ಲಿ ಸಾಕು. ಮತ್ತೆ ಒಂದು: ರಾಜಿ ಕಾಗದದಲ್ಲಿ ‘ಚನ್ನೇಗೌಡರ ಮಗಳು ಶೋಭಾ ತಮ್ಮ ಪಾಲು ಪಡೆದಿರುತ್ತಾರೆ’ ಅಂತ ಬರೀಬೇಕು. ‘ಬಿಟ್ಟುಕೊಟ್ಟಿರುತ್ತಾರೆ’ ಅಂತ ಅಲ್ಲ."
    tr: "Sār, Ḍisembar-nalli appa hōdāga vaṁśavṛkṣadalli nanna hesarē irlilla. Ūralli ‘maduve kharcē avaḷa pālu’ andru. Nānu dāve hākiddu nanna aṇṇa-tammana viruddha alla — ā mātina viruddha. Īga tahasīldār ādēśadinda pahaṇiyalli nanna hesaride. Nanage maṇṇu bēḍa; nyāyavāda pālu haṇada rūpadalli sāku. Matte ondu: rāji kāgadadalli ‘Cannēgauḍara magaḷu Śōbhā tamma pālu paḍediruttāre’ anta barībēku. ‘Biṭṭukoṭṭiruttāre’ anta alla."
    en: "Sir, when Appa died in December my name wasn't even in the family tree. In the village they said, 'Her wedding expenses were her share.' I didn't file the suit against my brothers — I filed it against that sentence. Now, by the Tahsildar's order, my name is in the RTC. I don't need soil; a fair share in money is enough. And one more thing: the compromise must say 'Shobha, daughter of Channegowda, has received her share'. Not 'has given it up'."
  - who: conciliator
    t: "ಒಳ್ಳೆ ಅಂಶ. ‘ಪಡೆದಿರುತ್ತಾರೆ’ ಅಂತಲೇ ಬರೆಯೋಣ. … ಮಹದೇವ ಅವರೇ, ನೀವು."
    tr: "Oḷḷe aṁśa. ‘Paḍediruttāre’ antalē bareyōṇa. … Mahadēva avarē, nīvu."
    en: "A good point. We'll write 'has received', exactly so. … Mr Mahadeva, your turn."
  - who: mahadeva
    t: "ಸಾರ್, ನನಗೆ ದೊಡ್ಡ ಮಾತು ಬರಲ್ಲ. ಇಪ್ಪತ್ತು ವರ್ಷ ಆ ಗದ್ದೆಯಲ್ಲಿ ದುಡಿದೀನಿ. ಮೇ ತಿಂಗಳಲ್ಲಿ ನಾನೇ ತಡೆಯಾಜ್ಞೆ ಕೇಳಿದ್ದೆ, ಮಧ್ಯಸ್ಥಿಕೆಗೆ ‘ಬೇಡ’ ಅಂದಿದ್ದೆ. ಆಗ ನನ್ನ ಭಯ ಒಂದೇ — ಗದ್ದೆ ತುಂಡಾಗುತ್ತೆ, ನನ್ನ ಕೆಲಸ ಹೋಗುತ್ತೆ ಅಂತ. ಈ ವರ್ಷ ನನ್ನ ಅಣ್ಣ ಪ್ರತಿ ಶನಿವಾರ ಬಂದು ಕೆಸರಲ್ಲಿ ನಿಂತ. ನನ್ನ ತಂಗಿ ಕಬ್ಬಿನ ಹಣ ನನ್ನ ಖಾತೆಗೆ ಹೋಗಲಿ ಅಂತ ಸಹಿ ಹಾಕಿದ್ಲು. ಈಗ ನನ್ನ ಭಯ ಬೇರೆ — ಇವತ್ತು ರಾಜಿ ಆಗದಿದ್ರೆ ಈ ವರ್ಷ ಕಟ್ಟಿದ್ದೆಲ್ಲಾ ಮತ್ತೆ ಒಡೆದುಹೋಗುತ್ತೆ ಅಂತ."
    tr: "Sār, nanage doḍḍa mātu baralla. Ippattu varṣa ā gaddeyalli duḍidīni. Mē tiṅgaḷalli nānē taḍeyājñe kēḷidde, madhyasthikege ‘bēḍa’ andidde. Āga nanna bhaya ondē — gadde tuṇḍāgutte, nanna kelasa hōgutte anta. Ī varṣa nanna aṇṇa prati Śanivāra bandu kesaralli ninta. Nanna taṅgi kabbina haṇa nanna khātege hōgali anta sahi hākidlu. Īga nanna bhaya bēre — ivattu rāji āgadidre ī varṣa kaṭṭiddellā matte oḍeduhōgutte anta."
    en: "Sir, I'm not good with big words. I've toiled on that wet land for twenty years. In May it was I who asked for the injunction and said 'no' to mediation. Back then I had one fear — that the land would be cut up and my work would be gone. This year my brother came every Saturday and stood in the mud. My sister signed so that the cane money could go into my account. Now my fear is different — that if there's no settlement today, everything we've built this year will break again."
  - who: conciliator
    t: "ನಿಮ್ಮ ಪ್ರಸ್ತಾಪ?"
    tr: "Nimma prastāpa?"
    en: "Your proposal?"
  - who: mahadeva
    t: "ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡು — ಮೂರು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆ ಗದ್ದೆ, ಮನೆ, ಕೊಟ್ಟಿಗೆ ನನಗೆ. ಅಪ್ಪನ ಹೆಸರಲ್ಲಿದ್ದ ಸಂಘದ ಸಾಲ ಒಂದು ಲಕ್ಷ ಅರವತ್ತು ಸಾವಿರ ನಾನು ಈಗಾಗಲೇ ತೀರಿಸಿದೀನಿ — ಇಗೋ ಬೇಬಾಕಿ ಪ್ರಮಾಣಪತ್ರ. ಶೋಭಾಳ ಪಾಲಿಗೆ ಸರ್ವೆ ನಂಬರ್ ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದರ ಅರ್ಧ — ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ. ಅದನ್ನ ಮಾರಿ ಬರೋ ಹಣ ಪೂರ್ತಿ ಅವಳದು."
    tr: "Sarve nambar nūra hanneraḍu, hissā eraḍu — mūru ekare ippattu guṇṭe gadde, mane, koṭṭige nanage. Appana hesaralidda saṅghada sāla ondu lakṣa aravattu sāvira nānu īgāgalē tīrisidīni — igō bēbāki pramāṇapatra. Śōbhāḷa pālige sarve nambar embattēḷu, hissā ondara ardha — ondu ekare hattu guṇṭe. Adanna māri barō haṇa pūrti avaḷadu."
    en: "Survey number one hundred and twelve, hissa two — the three acres twenty guntas of wet land, the house and the cattle shed to me. The society loan of one lakh sixty thousand in Appa's name I've already repaid — here's the no-dues certificate. For Shobha's share, half of survey number eighty-seven, hissa one — one acre ten guntas. All the money from selling it is hers."
  - who: conciliator
    t: "ಸುರೇಶ್ ಅವರೇ?"
    tr: "Surēś avarē?"
    en: "Mr Suresh?"
  - who: suresh
    t: "ಸಾರ್, ನಾನು ಎರಡನೇ ಪ್ರತಿವಾದಿ, ಹಿರಿಯ ಮಗ. ನನ್ನ ಪಾಲು ನನಗೆ ಬೇಡ. ಉಳಿದ ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ — ಹುಣಸೆ ಮರ, ನಮ್ಮಪ್ಪನ ಸಮಾಧಿ ಇರೋ ಭಾಗ — ನನ್ನ ಪಾಲು, ಅವ್ವನ ಪಾಲು ಸೇರಿ ಅವ್ವನ ಹೆಸರಿಗೆ ಆಗಲಿ. ಅವಳು ಇರೋವರೆಗೂ ಅದರ ಬೆಳೆ, ಆದಾಯ ಅವಳದು. ಮಹದೇವ ಅದನ್ನ ಬೇಸಾಯ ಮಾಡಿ ಅವಳಿಗೆ ಕೊಡ್ತಾನೆ."
    tr: "Sār, nānu eraḍanē prativādi, hiriya maga. Nanna pālu nanage bēḍa. Uḷida ondu ekare hattu guṇṭe — huṇase mara, nammappana samādhi irō bhāga — nanna pālu, avvana pālu sēri avvana hesarige āgali. Avaḷu irōvaregū adara beḷe, ādāya avaḷadu. Mahadēva adanna bēsāya māḍi avaḷige koḍtāne."
    en: "Sir, I'm the second defendant, the eldest son. I don't want my share. Let the remaining one acre ten guntas — the part with the tamarind tree and our father's grave — go into Avva's name, my share and hers together. As long as she lives, its crop and income are hers. Mahadeva will farm it and give her what it yields."
  - who: conciliator
    t: "ಒಂದು ಪ್ರಶ್ನೆ, ಸುರೇಶ್ ಅವರೇ. ಇದು ಭಾವೋದ್ವೇಗದಲ್ಲಿ ತಗೊಂಡ ತೀರ್ಮಾನವಾ? ಐತೀರ್ಪಿಗೆ ಮೇಲ್ಮನವಿ ಇಲ್ಲ ಅಂತ ಹೇಳಿದೆ. ಹತ್ತು ವರ್ಷ ಆದ್ಮೇಲೆ ನಿಮ್ಮ ಮಗ ‘ನನ್ನ ಅಪ್ಪನ ಪಾಲು ಎಲ್ಲಿ?’ ಅಂತ ಕೇಳಿದ್ರೆ?"
    tr: "Ondu praśne, Surēś avarē. Idu bhāvōdvēgadalli tagoṇḍa tīrmānavā? Aitīrpige mēlmanavi illa anta hēḷide. Hattu varṣa ādmēle nimma maga ‘nanna appana pālu elli?’ anta kēḷidre?"
    en: "One question, Mr Suresh. Is this a decision taken in a moment of emotion? I've told you there's no appeal against the award. What if, ten years from now, your son asks, 'Where is my father's share?'"
  - who: suresh
    t: "ಅವನು ಇಲ್ಲೇ ಇದಾನೆ ಸಾರ್, ಹೊರಗಿನ ಬೆಂಚಿನ ಮೇಲೆ. ಅವನನ್ನ ಕೇಳಿದೀನಿ. ನನ್ನ ಹೆಂಡತಿಯನ್ನೂ ಕೇಳಿದೀನಿ — ಅವಳು ಇಲ್ಲೇ ಕೂತಿದಾಳೆ. ಮೂರು ತಿಂಗಳು ಯೋಚನೆ ಮಾಡಿದೀನಿ — ಆರುನೂರಾ ಐವತ್ತು ಅಡಿಯ ಒಣ ಬೋರ್‌ವೆಲ್ ಹತ್ರ ನಿಂತು, ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಕೆಸರಲ್ಲಿ ನಿಂತು. ಇದು ಭಾವೋದ್ವೇಗ ಅಲ್ಲ ಸಾರ್. ಇದು ಲೆಕ್ಕ."
    tr: "Avanu illē idāne sār, horagina beṇcina mēle. Avananna kēḷidīni. Nanna heṇḍatiyannū kēḷidīni — avaḷu illē kūtidāḷe. Mūru tiṅgaḷu yōcane māḍidīni — ārunūrā aivattu aḍiya oṇa bōrvel hatra nintu, rātri eraḍu gaṇṭege kesaralli nintu. Idu bhāvōdvēga alla sār. Idu lekka."
    en: "He's right here, sir, on the bench outside. I've asked him. I've asked my wife too — she's sitting right here. I've thought about it for three months — standing beside a dry six-hundred-and-fifty-foot borewell, standing in mud at two in the morning. This isn't emotion, sir. It's accounting."
  - who: meena
    t: "ಸಾರ್, ಮನೆಯಲ್ಲಿ ಅಂಕಿ-ಸಂಖ್ಯೆ ನೋಡೋಳು ನಾನು. ನಮಗೆ ಬೆಂಗಳೂರಲ್ಲಿ ಸಂಬಳ ಇದೆ, ಮನೆ ಸಾಲ ಹತ್ತು ವರ್ಷದಲ್ಲಿ ಮುಗಿಯುತ್ತೆ. ಅವ್ವನಿಗೆ ವಯಸ್ಸು ಎಪ್ಪತ್ತು, ಅವರ ಸ್ವಂತ ಅಂತ ಏನೂ ಇಲ್ಲ. ಈ ತೀರ್ಮಾನಕ್ಕೆ ನಮ್ಮ ಪೂರ್ತಿ ಒಪ್ಪಿಗೆ ಇದೆ."
    tr: "Sār, maneyalli aṅki-saṅkhye nōḍōḷu nānu. Namage Beṅgaḷūralli sambaḷa ide, mane sāla hattu varṣadalli mugiyutte. Avvanige vayassu eppattu, avara svanta anta ēnū illa. Ī tīrmānakke namma pūrti oppige ide."
    en: "Sir, I'm the one who looks after the figures at home. We have salaries in Bengaluru; the house loan ends in ten years. Avva is seventy and has nothing of her own. We agree to this decision completely."
  - who: conciliator
    t: "ಹೊರಗೆ ಕೂತಿರೋ ಆ ಹುಡುಗನ್ನ ಕರೀರಿ. ಮುಂದಿನ ತಲೆಮಾರು ಏನು ಹೇಳುತ್ತೆ ಅಂತ ಕೇಳೋಣ — ಕಾನೂನಿಗಲ್ಲ, ನನ್ನ ಸಮಾಧಾನಕ್ಕೆ."
    tr: "Horage kūtirō ā huḍuganna karīri. Mundina talemāru ēnu hēḷutte anta kēḷōṇa — kānūnigalla, nanna samādhānakke."
    en: "Call in that boy sitting outside. Let's hear what the next generation says — not for the law, for my own peace of mind."
  - who: rakshith
    t: "ನಮಸ್ಕಾರ ಸಾರ್. ನಾನು ರಕ್ಷಿತ್, ಸೆಕೆಂಡ್ ಪಿಯುಸಿ."
    tr: "Namaskāra sār. Nānu Rakṣit, sekeṇḍ Pi-Yu-Si."
    en: "Namaskara, sir. I'm Rakshith, in second PUC."
  - who: conciliator
    t: "ನಿಮ್ಮಪ್ಪ ತಮ್ಮ ಪಾಲು ಬಿಡ್ತಿದಾರೆ. ನಾಳೆ ಅದು ನಿನಗೆ ಸಿಗಲ್ಲ. ನಿನಗೆ ಬೇಜಾರಿಲ್ವಾ?"
    tr: "Nimmappa tamma pālu biḍtidāre. Nāḷe adu ninage sigalla. Ninage bējārilvā?"
    en: "Your father is giving up his share. One day it won't come to you. Doesn't that upset you?"
  - who: rakshith
    t: "ಸಾರ್, ಈ ವರ್ಷ ನಾನು ಹಸು ಕರೆಯೋದು, ಕೂಳೆ ಕಬ್ಬು, ನಾಲೆಯ ಕಟ್ಟು ಪದ್ಧತಿ ಕಲಿತೆ. ಅದು ಯಾವ ಪಹಣಿಯಲ್ಲೂ ಬರಲ್ಲ, ಆದ್ರೂ ಅದು ನನ್ನದು. ನನಗೆ ಬೇಕಾಗಿರೋದು ಒಂದೇ — ನಾನು ಬಂದಾಗ ಚಿಕ್ಕಪ್ಪನ ಮನೆ ಬಾಗಿಲು ತೆಗೆದಿರಬೇಕು, ಕಾವೇರಿ ನನ್ನ ಗುರುತು ಹಿಡೀಬೇಕು. ಕಾವೇರಿ ನಮ್ಮ ಕರು, ಸಾರ್."
    tr: "Sār, ī varṣa nānu hasu kareyōdu, kūḷe kabbu, nāleya kaṭṭu paddhati kalite. Adu yāva pahaṇiyallū baralla, ādrū adu nannadu. Nanage bēkāgirōdu ondē — nānu bandāga cikkappana mane bāgilu tegedirabēku, Kāvēri nanna gurutu hiḍībēku. Kāvēri namma karu, sār."
    en: "Sir, this year I learnt to milk a cow, about ratoon cane, the canal rotation. None of that shows up in any RTC, but it's mine. I want just one thing — when I come, Chikkappa's door should be open and Kaveri should recognise me. Kaveri's our calf, sir."
  - who: conciliator
    t: "… ಅದನ್ನ ದಾಖಲಿಸಿಕೊಳ್ಳೋ ಅಗತ್ಯ ಇಲ್ಲ. ಆದ್ರೆ ನಾನು ಮರೆಯೋದಿಲ್ಲ. … ಅಮ್ಮ, ಈಗ ನೀವು. ನಿಮಗೂ ಒಬ್ಬ ವಕೀಲರಿದಾರೆ, ಆದ್ರೆ ನಾನು ನಿಮ್ಮ ಬಾಯಿಂದಲೇ ಕೇಳ್ಬೇಕು. ಯಾರಾದ್ರೂ ನಿಮ್ಮ ಮೇಲೆ ಒತ್ತಡ ಹಾಕಿದಾರಾ?"
    tr: "… Adanna dākhalisikoḷḷō agatya illa. Ādre nānu mareyōdilla. … Amma, īga nīvu. Nimagū obba vakīlaridāre, ādre nānu nimma bāyindalē kēḷbēku. Yārādrū nimma mēle ottaḍa hākidārā?"
    en: "(after a moment) … There's no need to record that. But I won't forget it. … Amma, now you. You have a lawyer of your own, but I must hear it from your own mouth. Has anyone put pressure on you?"
  - who: avva
    t: "ಒತ್ತಡ ಹಾಕಿದ್ದು ಒಬ್ರೇ ಸ್ವಾಮಿ — ನನ್ನ ಯಜಮಾನ್ರು. ದಿನಚರಿಯ ಕೊನೇ ಪುಟದಲ್ಲಿ. ‘ಮೂರೂ ಮಕ್ಳು ಒಟ್ಟಿಗೆ ಉಣ್ಣೋದು ನೋಡ್ಬೇಕು’ ಅಂತ. ಅವರು ನೋಡ್ಲಿಲ್ಲ. ನಾನಾದ್ರೂ ನೋಡ್ಬೇಕು. … ಸ್ವಾಮಿ, ನನಗೆ ಓದೋಕೆ ಬರಲ್ಲ. ಆದ್ರೆ ನನ್ನ ಮಕ್ಳ ಮುಖ ಓದೋಕೆ ಬರುತ್ತೆ. ಇವತ್ತು ಮೂರೂ ಮುಖದಲ್ಲಿ ಕೋಪ ಇಲ್ಲ. ಅಷ್ಟೇ ನನಗೆ ಸಾಕು."
    tr: "Ottaḍa hākiddu obrē svāmi — nanna yajamānru. Dinacariya konē puṭadalli. ‘Mūrū makḷu oṭṭige uṇṇōdu nōḍbēku’ anta. Avaru nōḍlilla. Nānādrū nōḍbēku. … Svāmi, nanage ōdōke baralla. Ādre nanna makḷa mukha ōdōke barutte. Ivattu mūrū mukhadalli kōpa illa. Aṣṭē nanage sāku."
    en: "Only one person has pressured me, Swami — my husband. On the last page of his diary: 'I must see all three children eating together.' He didn't live to see it. At least I must. … Swami, I can't read. But I can read my children's faces. Today there's no anger in any of the three. That's all I need."
  - who: conciliator
    t: "… ಮೂವತ್ತೈದು ವರ್ಷ ನ್ಯಾಯಾಧೀಶನಾಗಿದ್ದೆ, ಅಮ್ಮ. ಇಷ್ಟು ಒಳ್ಳೆ ಸಾಕ್ಷಿ ಹೇಳಿಕೆ ಕೇಳಿರಲಿಲ್ಲ. ನನ್ನ ಅಪ್ಪ ಮತ್ತೆ ಚಿಕ್ಕಪ್ಪ ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ ಒಂದು ವಿಭಾಗದ ದಾವೆ ನಡೆಸಿದ್ರು. ಡಿಕ್ರಿ ಬಂದಾಗ ಇಬ್ರೂ ಬದುಕಿರಲಿಲ್ಲ. ನಿವೃತ್ತಿ ಆದ ಮೇಲೆ ನಾನು ಈ ಬೆಂಚಲ್ಲಿ ಕೂತಿರೋದು ಅದಕ್ಕೇ."
    tr: "… Mūvattaidu varṣa nyāyādhīśanāgidde, amma. Iṣṭu oḷḷe sākṣi hēḷike kēḷiralilla. Nanna appa matte cikkappa ippatteraḍu varṣa ondu vibhāgada dāve naḍesidru. Ḍikri bandāga ibbrū badukiralilla. Nivṛtti āda mēle nānu ī beṇcalli kūtirōdu adakkē."
    en: "… I was a judge for thirty-five years, Amma. I never heard better testimony. My own father and his younger brother fought a partition suit for twenty-two years. When the decree came, neither of them was alive. That's why, after retiring, I sit on this bench."

  - section: "Testing the terms"
    learn: "the arithmetic of fairness: kānūnina prakāra samapālu, mārgasūci bele, brōkar bele, raita raitanige koḍō bele · free consent: svaiccheyinda, yāva ottaḍavū illade, avasara illa · protecting the weak: jīvanaparyanta vāsada hakku, dāriya hakku · formal award language: oppiruttāre, sēratakkaddu, teravugoḷisalāgide, ityarthapaḍisalāgide, marupāvati māḍatakkaddu"
  - who: conciliator
    t: "ಈಗ ಲೆಕ್ಕ. ಶೋಭಾ ಅವರೇ, ಕಾನೂನಿನ ಪ್ರಕಾರ ನಾಲ್ವರಿಗೂ ಸಮಪಾಲು — ಅಂದ್ರೆ ಆರು ಎಕರೆಯಲ್ಲಿ ಒಂದೂವರೆ ಎಕರೆಯ ಬೆಲೆ ನಿಮ್ಮದು. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಒಬ್ಬ ಬ್ರೋಕರ್ ಹೇಳಿದ ರೇಟಿನಲ್ಲಿ ಲೆಕ್ಕ ಹಾಕಿದ್ರೆ ಅದು ಎಪ್ಪತ್ತು ಲಕ್ಷಕ್ಕಿಂತ ಜಾಸ್ತಿ. ಒಣ ಹೊಲದ ಒಂದೂಕಾಲು ಎಕರೆಗೆ ಎಷ್ಟು ಬರುತ್ತೆ?"
    tr: "Īga lekka. Śōbhā avarē, kānūnina prakāra nālvarigū samapālu — andre āru ekareyalli ondūvare ekareya bele nimmadu. Mārc-nalli obba brōkar hēḷida rēṭinalli lekka hākidre adu eppattu lakṣakkinta jāsti. Oṇa holada ondūkālu ekarege eṣṭu barutte?"
    en: "Now the figures. Ms Shobha, under the law all four of you have equal shares — so the value of one and a half acres out of the six is yours. At the rate a broker quoted in March, that's over seventy lakh. What will one and a quarter acres of dry field fetch?"
  - who: lawyer
    t: "ಸಾರ್, ನಿಂಗೇಗೌಡರು ಎಕರೆಗೆ ಮೂವತ್ತಾರು ಲಕ್ಷ ಕೊಡೋಕೆ ಒಪ್ಪಿದಾರೆ — ಒಟ್ಟು ನಲವತ್ತೈದು ಲಕ್ಷ. ಇದು ಆ ಭಾಗದ ಮಾರ್ಗಸೂಚಿ ಬೆಲೆಗಿಂತ ಜಾಸ್ತಿ, ಆದ್ರೆ ಬ್ರೋಕರ್ ಹೇಳಿದ ಬೆಲೆಗಿಂತ ಕಮ್ಮಿ. ಬ್ರೋಕರ್ ಬೆಲೆ ಭೂ ಪರಿವರ್ತನೆಯ ಆಸೆಯ ಬೆಲೆ; ಇದು ರೈತ ರೈತನಿಗೆ ಕೊಡೋ ಬೆಲೆ. ಹಣ ಪೂರ್ತಿ ಬ್ಯಾಂಕ್ ಮೂಲಕ, ನೇರವಾಗಿ ಶೋಭಾ ಅವರ ಖಾತೆಗೆ."
    tr: "Sār, Niṅgēgauḍaru ekarege mūvattāru lakṣa koḍōke oppidāre — oṭṭu nalavattaidu lakṣa. Idu ā bhāgada mārgasūci belegintā jāsti, ādre brōkar hēḷida belegintā kammi. Brōkar bele bhū parivartaneya āseya bele; idu raita raitanige koḍō bele. Haṇa pūrti byāṅk mūlaka, nēravāgi Śōbhā avara khātege."
    en: "Sir, Ningegowda has agreed to pay thirty-six lakh an acre — forty-five lakh in all. That's above the guidance value for that area, but below the broker's price. The broker's price was the price of hoped-for conversion; this is the price one farmer pays another. All of it through the bank, straight into Ms Shobha's account."
  - who: conciliator
    t: "ಇನ್ನೊಂದು ಪ್ರಶ್ನೆ. ನಿಂಗೇಗೌಡರು ನಾಳೆ ಮನಸ್ಸು ಬದಲಾಯಿಸಿದ್ರೆ? ಐತೀರ್ಪು ಒಬ್ಬ ಹೊರಗಿನ ವ್ಯಕ್ತಿಯ ಮಾತಿನ ಮೇಲೆ ನಿಲ್ಲಬಾರದು."
    tr: "Innondu praśne. Niṅgēgauḍaru nāḷe manassu badalāyisidre? Aitīrpu obba horagina vyaktiya mātina mēle nillabāradu."
    en: "Another question. What if Ningegowda changes his mind tomorrow? An award mustn't rest on the word of an outsider."
  - who: lawyer
    t: "ಅದಕ್ಕೇ ಸಾರ್, ಶೋಭಾ ಅವರ ಹೆಸರಿಗೆ ಬರೋದು ಭೂಮಿ — ಹಣ ಅಲ್ಲ. ಅವರು ಯಾರಿಗೆ ಬೇಕಾದ್ರೂ ಮಾರಬಹುದು, ಇಲ್ಲಾ ಇಟ್ಕೊಳ್ಳಬಹುದು. ನಿಂಗೇಗೌಡರು ಐತೀರ್ಪು ಆದ ಮೇಲೆ, ಸರಿಯಾದ ಕರಾರು ಮಾಡ್ಕೊಂಡು, ಐದು ಲಕ್ಷ ಮುಂಗಡ ಕೊಡೋಕೆ ಸಿದ್ಧರಿದಾರೆ."
    tr: "Adakkē sār, Śōbhā avara hesarige barōdu bhūmi — haṇa alla. Avaru yārige bēkādrū mārabahudu, illā iṭkoḷḷabahudu. Niṅgēgauḍaru aitīrpu āda mēle, sariyāda karāru māḍkoṇḍu, aidu lakṣa muṅgaḍa koḍōke siddharidāre."
    en: "That's exactly why, sir, what comes into Ms Shobha's name is land — not money. She can sell it to anyone she likes, or keep it. Once the award is made, Ningegowda is ready to pay five lakh in advance under a proper agreement."
  - who: conciliator
    t: "ಸರಿ. ಶೋಭಾ ಅವರೇ, ನಲವತ್ತೈದು ಮತ್ತು ಎಪ್ಪತ್ತು — ವ್ಯತ್ಯಾಸ ದೊಡ್ಡದು. ನಾನು ಇದನ್ನ ಕೇಳಲೇಬೇಕು: ನೀವು ಇದಕ್ಕೆ ಸ್ವಇಚ್ಛೆಯಿಂದ, ಯಾವ ಒತ್ತಡವೂ ಇಲ್ಲದೆ ಒಪ್ತೀರಾ? ಹೆಣ್ಣುಮಕ್ಕಳು ‘ಮನೆ ಶಾಂತಿಗಾಗಿ’ ಅಂತ ಕಮ್ಮಿಗೆ ಒಪ್ಪೋದು ನಾನು ಸಾಕಷ್ಟು ನೋಡಿದೀನಿ. ಅದು ಇಲ್ಲಿ ಆಗಬಾರದು."
    tr: "Sari. Śōbhā avarē, nalavattaidu mattu eppattu — vyatyāsa doḍḍadu. Nānu idanna kēḷalēbēku: nīvu idakke svaiccheyinda, yāva ottaḍavū illade optīrā? Heṇṇumakkaḷu ‘mane śāntigāgi’ anta kammige oppōdu nānu sākaṣṭu nōḍidīni. Adu illi āgabāradu."
    en: "Good. Ms Shobha, forty-five and seventy — that's a big difference. I have to ask: do you agree to this of your own free will, under no pressure? I've seen plenty of daughters accept less 'for the sake of peace at home'. That must not happen here."
  - who: shobha
    t: "ಸಾರ್, ಒಂದು ವಿಷಯ ಮುಚ್ಚಿಡಲ್ಲ. ನನ್ನ ಯಜಮಾನ್ರು ನಿನ್ನೆ ರಾತ್ರಿ ಹೇಳಿದ್ರು — ‘ಎಪ್ಪತ್ತು ಲಕ್ಷದ ಹಕ್ಕು ಬಿಟ್ಟು ನಲವತ್ತೈದಕ್ಕೆ ಒಪ್ತೀಯಾ? ನಿನ್ನ ತವರಿನವರು ಮತ್ತೆ ನಿನಗೆ ಮೋಸ ಮಾಡ್ತಿದಾರೆ’ ಅಂತ. ಮನೆಯಲ್ಲಿ ಜಗಳ ಆಯ್ತು."
    tr: "Sār, ondu viṣaya mucciḍalla. Nanna yajamānru ninne rātri hēḷidru — ‘eppattu lakṣada hakku biṭṭu nalavattaidakke optīyā? Ninna tavarinavaru matte ninage mōsa māḍtidāre’ anta. Maneyalli jagaḷa āytu."
    en: "Sir, I won't hide one thing. Last night my husband said, 'You're giving up a claim worth seventy lakh and settling for forty-five? Your family is cheating you all over again.' We quarrelled at home."
  - who: conciliator
    t: "ಅವರ ಭಯ ಅರ್ಥ ಆಗುತ್ತೆ. ಆದ್ರೆ ಕಾನೂನಿನಲ್ಲಿ ಈ ಪಾಲು ನಿಮ್ಮದು, ಅವರದಲ್ಲ — ತೀರ್ಮಾನಾನೂ ನಿಮ್ಮದೇ. ಬೇಕಾದ್ರೆ ಇವತ್ತು ಸಹಿ ಹಾಕದೆ ಮುಂದಿನ ಲೋಕ ಅದಾಲತ್‌ವರೆಗೆ ಯೋಚನೆ ಮಾಡಬಹುದು. ಯಾವ ಅವಸರಾನೂ ಇಲ್ಲ."
    tr: "Avara bhaya artha āgutte. Ādre kānūninalli ī pālu nimmadu, avaradalla — tīrmānānū nimmadē. Bēkādre ivattu sahi hākade mundina Lōka Adālat-varege yōcane māḍabahudu. Yāva avasarānū illa."
    en: "I understand his fear. But in law this share is yours, not his — and so is the decision. If you wish, you can leave without signing today and think it over until the next Lok Adalat. There's no hurry at all."
  - who: shobha
    t: "ಇಲ್ಲ ಸಾರ್. ಅವರಿಗೆ ನಾನು ಒಂದೇ ಮಾತು ಹೇಳಿದೆ — ‘ಮೋಸ ಮಾಡೋರು ತಮ್ಮ ಪಾಲು ಬಿಟ್ಟುಕೊಡಲ್ಲ. ನನ್ನ ಅಣ್ಣ ತನ್ನದು ಪೂರ್ತಿ ಬಿಡ್ತಿದಾನೆ.’ ಮಹದೇವನಿಗೆ ಜಾಸ್ತಿ ಸಿಗ್ತಿದೆ, ನಿಜ. ಆದ್ರೆ ಆ ಜಾಸ್ತಿಯನ್ನ ಅವನು ಇಪ್ಪತ್ತು ವರ್ಷ ಮುಂಚೆಯೇ ದುಡಿದಿದಾನೆ — ತಹಸೀಲ್ದಾರ್ ಮೇಡಂ ಅವತ್ತೇ ಹೇಳಿದ್ರು, ಅವನ ದುಡಿಮೆ ಲೆಕ್ಕಕ್ಕೆ ಬರಬಹುದು ಅಂತ. ಹೌದು ಸಾರ್, ಸ್ವಇಚ್ಛೆಯಿಂದ ಒಪ್ತೀನಿ. … ಬೆಳಿಗ್ಗೆ ನನ್ನ ಯಜಮಾನ್ರೇ ಬಸ್ ಹತ್ತಿಸಿ ‘ಹುಷಾರು’ ಅಂದ್ರು."
    tr: "Illa sār. Avarige nānu ondē mātu hēḷide — ‘mōsa māḍōru tamma pālu biṭṭukoḍalla. Nanna aṇṇa tannadu pūrti biḍtidāne.’ Mahadēvanige jāsti sigtide, nija. Ādre ā jāstiyanna avanu ippattu varṣa mun̄ceyē duḍididāne — tahasīldār mēḍam avattē hēḷidru, avana duḍime lekkakke barabahudu anta. Haudu sār, svaiccheyinda optīni. … Beḷigge nanna yajamānrē bas hattisi ‘huṣāru’ andru."
    en: "No, sir. I told him just one thing: 'People who cheat don't give up their own share. My elder brother is giving up all of his.' Mahadeva is getting more, it's true. But he earned that 'more' twenty years in advance — the Tahsildar madam said so that very day, that his labour might be taken into account. Yes, sir, I agree of my own free will. … And this morning it was my husband himself who put me on the bus and said, 'Take care.'"
  - who: conciliator
    t: "ದಾಖಲಿಸಿಕೊಂಡೆ. … ಇನ್ನೊಂದು ಸೂಕ್ಷ್ಮ ವಿಷಯ. ಸುರೇಶ್ ಅವರ ಭಾಗ ಅಮ್ಮನಿಗೆ ‘ಅವರು ಇರೋವರೆಗೂ’ ಅಂದ್ರಿ. ಅಮ್ಮನ ನಂತರ ಅದು ಯಾರಿಗೆ ಅನ್ನೋದು ಸ್ಪಷ್ಟ ಇರ್ಬೇಕು, ಇಲ್ಲದಿದ್ರೆ ಮುಂದಿನ ತಲೆಮಾರಿಗೆ ಇನ್ನೊಂದು ದಾವೆ ಬಿಟ್ಟು ಹೋಗ್ತೀರಿ. ಎರಡು ದಾರಿ: ಒಂದು, ಆ ಭಾಗ ಅಮ್ಮನಿಗೆ ಪೂರ್ಣ ಹಕ್ಕಿನಿಂದ — ಆಮೇಲೆ ಅವರು ಉಯಿಲು ಮಾಡಬಹುದು. ಎರಡು, ಅಮ್ಮನಿಗೆ ಜೀವಿತಾವಧಿ ಹಕ್ಕು, ನಂತರ ಯಾರಿಗೆ ಅಂತ ಇವತ್ತೇ ಬರೆಯೋದು."
    tr: "Dākhalisikoṇḍe. … Innondu sūkṣma viṣaya. Surēś avara bhāga ammanige ‘avaru irōvaregū’ andri. Ammana nantara adu yārige annōdu spaṣṭa irbēku, illadidre mundina talemārige innondu dāve biṭṭu hōgtīri. Eraḍu dāri: ondu, ā bhāga ammanige pūrṇa hakkininda — āmēle avaru uyilu māḍabahudu. Eraḍu, ammanige jīvitāvadhi hakku, nantara yārige anta ivattē bareyōdu."
    en: "Noted. … One more delicate matter. You said Mr Suresh's portion goes to Amma 'for as long as she lives'. Who gets it after her must be clear, or you'll leave the next generation another lawsuit. There are two ways: one, that portion goes to Amma absolutely — then she can make a will. Two, Amma has a life interest, and you write down today who gets it after."
  - who: avva
    t: "ಉಯಿಲು ಬರೆಸ್ತೀನಿ ಅಂದಿದ್ದೆ ಸ್ವಾಮಿ. ಬೇಡ — ಕಾಗದ ಎರಡಾದ್ರೆ ಜಗಳಾನೂ ಎರಡಾಗುತ್ತೆ. ನನ್ನ ಮಕ್ಕಳ ಮುಂದೆ ಇವತ್ತೇ ಹೇಳ್ತೀನಿ: ನಾನು ಹೋದ ಮೇಲೆ ಆ ಹುಣಸೆ ಮರದ ಹೊಲ ಮಹದೇವನಿಗೆ. ಅವನೇ ಅದನ್ನ ಉಳ್ತಾನೆ, ಅವನೇ ಅಪ್ಪನ ಸಮಾಧಿಗೆ ದೀಪ ಹಚ್ತಾನೆ. ಆದ್ರೆ ಒಂದು ಕಂಡಿಷನ್: ಆ ಸಮಾಧಿ ಹತ್ರ ಬರೋಕೆ ಸುರೇಶಂಗೂ ಶೋಭಂಗೂ ಅವರ ಮಕ್ಕಳಿಗೂ ಯಾವತ್ತೂ ದಾರಿ ಇರ್ಬೇಕು. ಅದನ್ನ ಬರೀರಿ."
    tr: "Uyilu barestīni andidde svāmi. Bēḍa — kāgada eraḍādre jagaḷānū eraḍāgutte. Nanna makkaḷa munde ivattē hēḷtīni: nānu hōda mēle ā huṇase marada hola Mahadēvanige. Avanē adanna uḷtāne, avanē appana samādhige dīpa hactāne. Ādre ondu kaṇḍiṣan: ā samādhi hatra barōke Surēśaṅgū Śōbhaṅgū avara makkaḷigū yāvattū dāri irbēku. Adanna barīri."
    en: "I'd said I'd have a will written, Swami. No — two papers mean two quarrels. I'll say it today, in front of my children: after I'm gone, the tamarind field goes to Mahadeva. He's the one who'll plough it; he's the one who'll light the lamp at his father's grave. But one condition: Suresha and Shobha and their children must always have a path to come to that grave. Write that down."
  - who: mahadeva
    t: "ಅವ್ವ… ದಾರಿ ಮಾತ್ರ ಅಲ್ಲ. ಪ್ರತಿ ಸಂಕ್ರಾಂತಿಗೆ ಊಟಾನೂ ಇರುತ್ತೆ. ಅದನ್ನೂ ಬರೀರಿ ಸಾರ್."
    tr: "Avva… dāri mātra alla. Prati Saṅkrāntige ūṭānū irutte. Adannū barīri sār."
    en: "Avva… not just a path. There'll be a meal every Sankranti too. Write that as well, sir."
  - who: conciliator
    t: "ಊಟವನ್ನ ಐತೀರ್ಪಲ್ಲಿ ಬರೆಯೋಕಾಗಲ್ಲ, ಮಹದೇವ ಅವರೇ — ಯಾವ ನ್ಯಾಯಾಲಯವೂ ಅದನ್ನ ಜಾರಿ ಮಾಡೋಕಾಗಲ್ಲ. ಅದು ನಿಮ್ಮ ಮನಸ್ಸಲ್ಲೇ ಇರಲಿ. ದಾರಿಯ ಹಕ್ಕನ್ನ ಬರೀತೀನಿ. ಇನ್ನೊಂದು ಅಂಶ ನಾನೇ ಸೇರಿಸ್ತೀನಿ: ಮನೆ ಮಹದೇವ ಅವರಿಗೆ, ಆದ್ರೆ ಅಮ್ಮನಿಗೆ ಅದೇ ಮನೆಯಲ್ಲಿ ಜೀವನಪರ್ಯಂತ ವಾಸ ಮಾಡುವ ಹಕ್ಕು. ಐವತ್ತೆರಡು ವರ್ಷ ಆ ಅಂಗಳ ಗುಡಿಸಿದವರು ಯಾರ ದಯೆಯಲ್ಲೂ ಇರಬಾರದು."
    tr: "Ūṭavanna aitīrpalli bareyōkāgalla, Mahadēva avarē — yāva nyāyālayavū adanna jāri māḍōkāgalla. Adu nimma manassallē irali. Dāriya hakkanna barītīni. Innondu aṁśa nānē sēristīni: mane Mahadēva avarige, ādre ammanige adē maneyalli jīvanaparyanta vāsa māḍuva hakku. Aivatteraḍu varṣa ā aṅgaḷa guḍisidavaru yāra dayeyallū irabāradu."
    en: "(smiling) A meal can't be written into an award, Mr Mahadeva — no court can enforce it. Let that stay in your hearts. I'll write in the right of way. And I'll add one point myself: the house goes to Mahadeva, but Amma has the right to live in that same house for the rest of her life. Someone who swept that yard for fifty-two years must not live at anyone's mercy."
  - who: mahadeva
    t: "ಬರೀರಿ ಸಾರ್. ಆದ್ರೆ ಆ ಮನೆ ಅವ್ವನದು, ನಾನು ಅದರಲ್ಲಿ ವಾಸ ಮಾಡೋನು ಅಷ್ಟೇ ಅಂತ ನನಗೆ ಗೊತ್ತು."
    tr: "Barīri sār. Ādre ā mane avvanadu, nānu adaralli vāsa māḍōnu aṣṭē anta nanage gottu."
    en: "Write it, sir. But I know the house is Avva's, and I'm only the one who lives in it."
  - scene: "An hour later. The typist has prepared the compromise petition. The conciliator reads out the main terms slowly, in formal Kannada."
  - who: conciliator
    t: "‘ಎಲ್ಲ ಪಕ್ಷಕಾರರು ಈ ಕೆಳಗಿನ ಷರತ್ತುಗಳಿಗೆ ಸ್ವಇಚ್ಛೆಯಿಂದ ಒಪ್ಪಿರುತ್ತಾರೆ. ಒಂದು: ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡರ ಮೂರು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆ ಜಮೀನು ಮತ್ತು ವಾಸದ ಮನೆ ಮೂರನೇ ಪ್ರತಿವಾದಿ ಮಹದೇವ ಅವರಿಗೆ ಸೇರತಕ್ಕದ್ದು. ಮೊದಲನೇ ಪ್ರತಿವಾದಿ ಪುಟ್ಟಮ್ಮ ಅವರಿಗೆ ಆ ಮನೆಯಲ್ಲಿ ಜೀವನಪರ್ಯಂತ ವಾಸಿಸುವ ಹಕ್ಕು ಇರತಕ್ಕದ್ದು. ಮೃತ ಚನ್ನೇಗೌಡರ ಹೆಸರಿನ ಸಹಕಾರ ಸಂಘದ ಬೆಳೆ ಸಾಲವನ್ನು ಮಹದೇವ ಅವರು ಪೂರ್ಣವಾಗಿ ತೀರಿಸಿರುತ್ತಾರೆ.’"
    tr: "‘Ella pakṣakāraru ī keḷagina ṣarattugaḷige svaiccheyinda oppiruttāre. Ondu: sarve nambar nūra hanneraḍu, hissā eraḍara mūru ekare ippattu guṇṭe jamīnu mattu vāsada mane mūranē prativādi Mahadēva avarige sēratakkaddu. Modalanē prativādi Puṭṭamma avarige ā maneyalli jīvanaparyanta vāsisuva hakku iratakkaddu. Mṛta Cannēgauḍara hesarina sahakāra saṅghada beḷe sālavannu Mahadēva avaru pūrṇavāgi tīrisiruttāre.’"
    en: "(reading) 'All the parties have freely agreed to the following terms. One: the land in survey number one hundred and twelve, hissa two, measuring three acres twenty guntas, together with the dwelling house, shall belong to the third defendant, Mahadeva. The first defendant, Puttamma, shall have the right to reside in that house for life. Mahadeva has fully repaid the cooperative society crop loan standing in the name of the late Channegowda.'"
  - who: conciliator
    t: "‘ಎರಡು: ಸರ್ವೆ ನಂಬರ್ ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದರ ಎರಡು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆಯನ್ನು ಎರಡು ಸಮ ಭಾಗ ಮಾಡತಕ್ಕದ್ದು. ರಸ್ತೆ ಕಡೆಯ ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ ವಾದಿ ಶೋಭಾ ಅವರಿಗೆ ಸೇರತಕ್ಕದ್ದು; ಅವರು ತಮ್ಮ ಪಾಲನ್ನು ಪಡೆದಿರುತ್ತಾರೆ. ಆ ಭಾಗವನ್ನು ಅವರು ಮಾರಾಟ ಮಾಡುವುದಕ್ಕೆ ಉಳಿದ ಪಕ್ಷಕಾರರ ಯಾವುದೇ ಆಕ್ಷೇಪಣೆ ಇರುವುದಿಲ್ಲ.’"
    tr: "‘Eraḍu: sarve nambar embattēḷu, hissā ondara eraḍu ekare ippattu guṇṭeyannu eraḍu sama bhāga māḍatakkaddu. Raste kaḍeya ondu ekare hattu guṇṭe vādi Śōbhā avarige sēratakkaddu; avaru tamma pālannu paḍediruttāre. Ā bhāgavannu avaru mārāṭa māḍuvudakke uḷida pakṣakārara yāvudē ākṣēpaṇe iruvudilla.’"
    en: "'Two: the two acres twenty guntas in survey number eighty-seven, hissa one, shall be divided into two equal parts. The one acre ten guntas on the road side shall belong to the plaintiff, Shobha; she has received her share. The remaining parties shall have no objection whatsoever to her selling that portion.'"
  - who: conciliator
    t: "‘ಮೂರು: ಉಳಿದ ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ — ಹುಣಸೆ ಮರ ಮತ್ತು ಸಮಾಧಿ ಇರುವ ಭಾಗ — ಪುಟ್ಟಮ್ಮ ಅವರಿಗೆ ಅವರ ಜೀವಿತಾವಧಿಯವರೆಗೆ ಸೇರತಕ್ಕದ್ದು. ಎರಡನೇ ಪ್ರತಿವಾದಿ ಸುರೇಶ ಅವರು ಇದಕ್ಕಾಗಿ ತಮ್ಮ ಪಾಲಿನ ಹಕ್ಕನ್ನು ಯಾವುದೇ ಪ್ರತಿಫಲವಿಲ್ಲದೆ ಬಿಟ್ಟುಕೊಟ್ಟಿರುತ್ತಾರೆ. ಪುಟ್ಟಮ್ಮ ಅವರ ನಂತರ ಆ ಭಾಗ ಮಹದೇವ ಅವರಿಗೆ ಸೇರತಕ್ಕದ್ದು. ಸಮಾಧಿಗೆ ಹೋಗಲು ಕುಟುಂಬದ ಎಲ್ಲರಿಗೂ ದಾರಿಯ ಹಕ್ಕು ಶಾಶ್ವತವಾಗಿ ಇರತಕ್ಕದ್ದು.’"
    tr: "‘Mūru: uḷida ondu ekare hattu guṇṭe — huṇase mara mattu samādhi iruva bhāga — Puṭṭamma avarige avara jīvitāvadhiyavarege sēratakkaddu. Eraḍanē prativādi Surēśa avaru idakkāgi tamma pālina hakkannu yāvudē pratiphalavillade biṭṭukoṭṭiruttāre. Puṭṭamma avara nantara ā bhāga Mahadēva avarige sēratakkaddu. Samādhige hōgalu kuṭumbada ellarigū dāriya hakku śāśvatavāgi iratakkaddu.’"
    en: "'Three: the remaining one acre ten guntas — the portion with the tamarind tree and the grave — shall belong to Puttamma for her lifetime. The second defendant, Suresha, has relinquished his share for this purpose without any consideration. After Puttamma, that portion shall go to Mahadeva. Every member of the family shall have a permanent right of way to the grave.'"
  - who: conciliator
    t: "‘ನಾಲ್ಕು: ದಿನಾಂಕ ಇಪ್ಪತ್ತು ಮೇ ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರರ ಮಧ್ಯಂತರ ಆದೇಶವನ್ನು ತೆರವುಗೊಳಿಸಲಾಗಿದೆ. ದಾವೆಯನ್ನು ರಾಜಿಯಲ್ಲಿ ಇತ್ಯರ್ಥಪಡಿಸಲಾಗಿದೆ. ವಾದಿಯವರು ಪಾವತಿಸಿದ ನ್ಯಾಯಾಲಯ ಶುಲ್ಕವನ್ನು ನಿಯಮಾನುಸಾರ ಮರುಪಾವತಿ ಮಾಡತಕ್ಕದ್ದು.’ … ಒಪ್ಪಿಗೆ ಇದ್ರೆ ಎಲ್ಲರೂ ಸಹಿ ಹಾಕಿ. ಅಮ್ಮ, ನಿಮ್ಮ ಹೆಬ್ಬೆಟ್ಟು ಇಲ್ಲಿ."
    tr: "‘Nālku: dināṅka ippattu Mē eraḍu sāvirada ippattārara madhyantara ādēśavannu teravugoḷisalāgide. Dāveyannu rājiyalli ityarthapaḍisalāgide. Vādiyavaru pāvatisida nyāyālaya śulkavannu niyamānusāra marupāvati māḍatakkaddu.’ … Oppige idre ellarū sahi hāki. Amma, nimma hebbeṭṭu illi."
    en: "'Four: the interim order dated the twentieth of May, two thousand twenty-six, is vacated. The suit is disposed of by compromise. The court fee paid by the plaintiff shall be refunded according to the rules.' … If you agree, everyone please sign. Amma, your thumbprint here."
  - scene: "One by one they sign. Avva presses her inked thumb beside her name and looks at the mark for a long time."
  - who: avva
    t: "ಐವತ್ತೆರಡು ವರ್ಷದಲ್ಲಿ ಎಷ್ಟೋ ಕಾಗದಕ್ಕೆ ಹೆಬ್ಬೆಟ್ಟು ಒತ್ತಿದೀನಿ — ಸಾಲಕ್ಕೆ, ರೇಷನ್‌ಗೆ, ಸಮನ್ಸ್‌ಗೆ. ಖುಷಿಯಿಂದ ಒತ್ತಿದ್ದು ಇದೇ ಮೊದಲ ಸಲ."
    tr: "Aivatteraḍu varṣadalli eṣṭō kāgadakke hebbeṭṭu ottidīni — sālakke, rēṣan-ge, samans-ge. Khuṣiyinda ottiddu idē modala sala."
    en: "In fifty-two years I've pressed my thumb on so many papers — for loans, for rations, for the summons. This is the first time I've pressed it gladly."
  - who: shobha
    t: "ವಕೀಲರೇ, ಕೋರ್ಟ್ ಶುಲ್ಕ ಎಷ್ಟು ವಾಪಸ್ ಬರುತ್ತೆ?"
    tr: "Vakīlarē, kōrṭ śulka eṣṭu vāpas barutte?"
    en: "Sir, how much of the court fee comes back?"
  - who: lawyer
    t: "ನೀವು ಜಂಟಿ ಸ್ವಾಧೀನ ಅಂತ ಹೇಳಿದ್ರಿಂದ ಕಟ್ಟಿದ್ದೇ ಕೆಲವು ನೂರು ರೂಪಾಯಿ, ಶೋಭಾ ಅವರೇ. ಅದು ವಾಪಸ್ ಬರುತ್ತೆ — ಸ್ವಲ್ಪ ಕಾಗದ ಕೆಲಸ, ಸ್ವಲ್ಪ ಕಾಯೋದು. ಜಾತ್ರೆಯಲ್ಲಿ ಜಿಲೇಬಿಗೆ ಸಾಕಾಗುತ್ತೆ. … ಆದ್ರೆ ಇವತ್ತು ವಾಪಸ್ ಬಂದಿದ್ದು ಶುಲ್ಕ ಮಾತ್ರ ಅಲ್ಲ, ಅಲ್ವಾ?"
    tr: "Nīvu jaṇṭi svādhīna anta hēḷidrinda kaṭṭiddē kelavu nūru rūpāyi, Śōbhā avarē. Adu vāpas barutte — svalpa kāgada kelasa, svalpa kāyōdu. Jātreyalli jilēbige sākāgutte. … Ādre ivattu vāpas bandiddu śulka mātra alla, alvā?"
    en: "Since you pleaded joint possession, you only paid a few hundred rupees, Ms Shobha. That comes back — a bit of paperwork, a bit of waiting. Enough for jilebi at the jatre. … But it isn't only the fee that came back today, is it?"
  - who: shobha
    t: "ಇಲ್ಲ ಸಾರ್. ನನ್ನ ತವರು ವಾಪಸ್ ಬಂತು."
    tr: "Illa sār. Nanna tavaru vāpas bantu."
    en: "No, sir. My parents' home came back to me."
  - who: lawyer
    t: "ಮೇ ತಿಂಗಳಲ್ಲಿ ನಾನು ಹೇಳಿದ ಮಾತು ನೆನಪಿದೆಯಾ ಸುರೇಶ್ ಅವರೇ? ಅಣ್ಣ-ತಮ್ಮಂದಿರು ಮೊದಲ ದಿನ ಒಂದೇ ಕಾರಲ್ಲಿ, ಹತ್ತನೇ ಸಲ ಮುಖ ನೋಡಲ್ಲ ಅಂತ. ನಿಮ್ಮ ಮನೆಯವರು ಅದನ್ನ ಉಲ್ಟಾ ಮಾಡಿದ್ರಿ — ಮೊದಲ ದಿನ ಮೂರು ಮೂಲೆ, ಕೊನೆಯ ದಿನ ಒಂದೇ ಬೆಂಚು. ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದಲ್ಲಿ ಇದು ಅಪರೂಪ."
    tr: "Mē tiṅgaḷalli nānu hēḷida mātu nenapideyā Surēś avarē? Aṇṇa-tammandiru modala dina ondē kāralli, hattanē sala mukha nōḍalla anta. Nimma maneyavaru adanna ulṭā māḍidri — modala dina mūru mūle, koneya dina ondē beṇcu. Ippatteraḍu varṣadalli idu aparūpa."
    en: "Do you remember what I told you in May, Mr Suresh? That brothers come in one car on the first day and won't look at each other by the tenth. Your family turned it upside down — three corners on the first day, one bench on the last. In twenty-two years, that's rare."
  - scene: "Outside, on the court steps, in the winter sun. Mahadeva starts his motorbike, then switches it off again."
  - who: mahadeva
    t: "ಶೋಭಾ, ಬಸ್ ಸ್ಟ್ಯಾಂಡ್‌ವರೆಗೆ ಬೈಕಲ್ಲಿ ಬಿಡ್ತೀನಿ. ಹತ್ತು."
    tr: "Śōbhā, bas sṭyāṇḍ-varege baikalli biḍtīni. Hattu."
    en: "Shobha, I'll drop you at the bus stand on the bike. Get on."
  - who: shobha
    t: "ಮಾರ್ಚ್‌ನಲ್ಲಿ ಪಂಚಾಯ್ತಿಯಲ್ಲಿ ಹೇಳಿದ್ದೆ — ‘ಊರಲ್ಲೇ ಇದ್ದಿದ್ರೆ ಆ ಬೈಕ್ ಹಿಂದೆ ನಾನೂ ಕೂತಿರ್ತಿದ್ದೆ’ ಅಂತ. ಈಗ ಕೂರ್ತಿದೀನಿ. ನಿಧಾನವಾಗಿ ಓಡಿಸು."
    tr: "Mārc-nalli pan̄cāytiyalli hēḷidde — ‘ūrallē iddidre ā baik hinde nānū kūtirtidde’ anta. Īga kūrtidīni. Nidhānavāgi ōḍisu."
    en: "In March, at the panchayati, I said, 'If I'd stayed in the village, I'd have been on the back of that bike too.' Now I'm getting on. Ride slowly."
  - who: mahadeva
    t: "ಅಪ್ಪನ್ನ ಕೂರಿಸ್ಕೊಂಡು ಹೋಗ್ತಿದ್ದ ಹಾಗೇ ಓಡಿಸ್ತೀನಿ. ಹುಷಾರಾಗಿ."
    tr: "Appanna kūriskoṇḍu hōgtidda hāgē ōḍistīni. Huṣārāgi."
    en: "I'll ride the way I used to with Appa on the back. Carefully."
  - who: avva
    t: "ಸಂಕ್ರಾಂತಿಗೆ ಬರ್ತೀಯಲ್ಲ ಕಣವ್ವ? ನಿಮ್ಮಪ್ಪ ಕೊನೆ ದಿನ ಕೇಳಿದ್ದು ಅದೇ — ‘ಶೋಭಾ ಸಂಕ್ರಾಂತಿಗೆ ಬರ್ತಾಳಾ?’ ಅಂತ."
    tr: "Saṅkrāntige bartīyalla kaṇavva? Nimmappa kone dina kēḷiddu adē — ‘Śōbhā Saṅkrāntige bartāḷā?’ anta."
    en: "You'll come for Sankranti, won't you, girl? That's the very thing your father asked on his last day — 'Will Shobha come for Sankranti?'"
  - who: shobha
    t: "ಬರ್ತೀನಿ ಅವ್ವ. ಎಳ್ಳು-ಬೆಲ್ಲ ನಾನೇ ಮಾಡ್ಕೊಂಡು ತರ್ತೀನಿ — ಅಪ್ಪನಿಗೆ ಇಷ್ಟ ಆಗ್ತಿದ್ದ ಹಾಗೆ, ಕೊಬ್ಬರಿ ಜಾಸ್ತಿ."
    tr: "Bartīni avva. Eḷḷu-bella nānē māḍkoṇḍu tartīni — appanige iṣṭa āgtidda hāge, kobbari jāsti."
    en: "I'll come, Avva. I'll make the ellu-bella myself and bring it — the way Appa liked it, with extra copra."

  - section: "Stones and papers"
    learn: "after the award: aitīrpina dṛḍhīkṛta prati, vibhāga patra nōndaṇi, Kāvēri tantrāṁśa, i-sṭāmp, mudrāṅka śulka · the survey: hannondu-i nakṣe, pōḍi, hissā, gaḍi kallu, Mōjiṇi, guṇṭe = mūvattamūru aḍi × mūvattamūru aḍi · mutation: khāte badalāvaṇe, tiḷuvaḷike patra, ākṣēpaṇe avadhi · honesty: rasīdi illada kharcu bēḍa"
  - scene: "Tuesday, 29 December 2026. The dry field, survey 87. A surveyor from the land records office is stretching a measuring chain across the stubble of the harvested ragi; Siddaraju, the Village Accountant, stands by with a file under his arm. The family watches from the bund. Ningegowda, the neighbour, waits by his own field with his son."
  - who: va
    t: "ನಮಸ್ಕಾರ ಅಮ್ಮ. ಜನವರಿಯಲ್ಲಿ ನಿಮ್ಮ ಮನೆಯವರು ನನ್ನ ಕೊಠಡಿಯಲ್ಲಿ ಜಗಳ ಆಡಿದ್ರು. ಇವತ್ತು ಎಲ್ಲರೂ ಒಂದೇ ಬದುವಿನ ಮೇಲೆ ನಿಂತಿದೀರಿ. ಸರ್ಕಾರಿ ಕೆಲಸದಲ್ಲಿ ಇಂಥ ದಿನ ಅಪರೂಪ."
    tr: "Namaskāra amma. Janavariyalli nimma maneyavaru nanna koṭhaḍiyalli jagaḷa āḍidru. Ivattu ellarū ondē baduvina mēle nintidīri. Sarkāri kelasadalli intha dina aparūpa."
    en: "Namaskara, Amma. In January your family quarrelled in my office. Today you're all standing on the same bund. Days like this are rare in government work."
  - who: suresh
    t: "ಸಿದ್ದರಾಜು ಅವರೇ, ಮುಂದಿನ ಹೆಜ್ಜೆಗಳು ಏನು? ನಾಗೇಂದ್ರ ಅವರು ಐತೀರ್ಪಿನ ದೃಢೀಕೃತ ಪ್ರತಿ ಕೊಟ್ಟಿದಾರೆ. ಜೊತೆಗೆ ಸಬ್-ರಿಜಿಸ್ಟ್ರಾರ್ ಕಚೇರಿಯಲ್ಲಿ ವಿಭಾಗ ಪತ್ರಾನೂ ನೋಂದಣಿ ಮಾಡಿಸಿ ಅಂದಿದಾರೆ — ಮುಂದೆ ಬ್ಯಾಂಕ್ ಸಾಲಕ್ಕೋ ಮಾರಾಟಕ್ಕೋ ಯಾವ ತಕರಾರೂ ಬರಬಾರದು ಅಂತ."
    tr: "Siddarāju avarē, mundina hejjegaḷu ēnu? Nāgēndra avaru aitīrpina dṛḍhīkṛta prati koṭṭidāre. Jotege sab-rijisṭrār kacēriyalli vibhāga patrānū nōndaṇi māḍisi andidāre — munde byāṅk sālakkō mārāṭakkō yāva takarārū barabāradu anta."
    en: "Mr Siddaraju, what are the next steps? Nagendra has given us the certified copy of the award. He's also advised us to register a partition deed at the Sub-Registrar's office — so that no objection crops up later over a bank loan or the sale."
  - who: va
    t: "ಸರಿಯಾದ ಸಲಹೆ. ಕ್ರಮ ಹೀಗೆ: ಮೊದಲು ಈ ಅಳತೆ. ಸರ್ವೇಯರ್ ಹನ್ನೊಂದು-ಇ ನಕ್ಷೆ ಮಾಡ್ತಾರೆ — ಅದಿಲ್ಲದೆ ಸರ್ವೆ ನಂಬರಿನ ಒಂದು ಭಾಗಕ್ಕೆ ನೋಂದಣಿ ಆಗಲ್ಲ. ಆಮೇಲೆ ವಿಭಾಗ ಪತ್ರ — ಕಾವೇರಿ ತಂತ್ರಾಂಶದಲ್ಲಿ, ಇ-ಸ್ಟಾಂಪ್ ಮೂಲಕ. ಮುದ್ರಾಂಕ ಶುಲ್ಕ ಪ್ರತಿ ಪಾಲಿಗೆ ಒಂದು ಸಣ್ಣ ನಿಗದಿತ ಮೊತ್ತ; ನೋಂದಣಿ ಶುಲ್ಕ, ವಕೀಲರ ಫೀಸೇ ದೊಡ್ಡದು. ಆಮೇಲೆ ಮೋಜಿಣಿಯಲ್ಲಿ ಪೋಡಿ — ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದು ಎರಡು ತುಂಡಾಗಿ, ಒಂದು-ಎ, ಒಂದು-ಬಿ ಅಂತ ಹೊಸ ಹಿಸ್ಸಾ ನಂಬರ್. ಕೊನೆಗೆ ನನ್ನ ಕಡೆ ಖಾತೆ ಬದಲಾವಣೆ — ಎಲ್ಲರಿಗೂ ತಿಳುವಳಿಕೆ ಪತ್ರ, ಆಕ್ಷೇಪಣೆ ಅವಧಿ ಮುಗಿದ ಮೇಲೆ ಹೊಸ ಪಹಣಿ."
    tr: "Sariyāda salahe. Krama hīge: modalu ī aḷate. Sarvēyar hannondu-i nakṣe māḍtāre — adillade sarve nambarina ondu bhāgakke nōndaṇi āgalla. Āmēle vibhāga patra — Kāvēri tantrāṁśadalli, i-sṭāmp mūlaka. Mudrāṅka śulka prati pālige ondu saṇṇa nigadita motta; nōndaṇi śulka, vakīlara phīsē doḍḍadu. Āmēle Mōjiṇiyalli pōḍi — embattēḷu, hissā ondu eraḍu tuṇḍāgi, ondu-e, ondu-bi anta hosa hissā nambar. Konege nanna kaḍe khāte badalāvaṇe — ellarigū tiḷuvaḷike patra, ākṣēpaṇe avadhi mugida mēle hosa pahaṇi."
    en: "Sound advice. The order is this: first, this measurement. The surveyor draws the 11E sketch — without it, part of a survey number can't be registered. Then the partition deed — on the Kaveri software, with an e-stamp. The stamp duty is a small fixed amount per share; the registration fee and the lawyer's fee are the bigger costs. Then the podi through Mojini — eighty-seven, hissa one, splits in two, with new hissa numbers one-A and one-B. Finally, on my side, the mutation — a notice to everyone, and once the objection period is over, the new RTC."
  - who: rakshith
    t: "ಸಿದ್ದರಾಜು ಅವರೇ, ಗುಂಟೆ ಅಂದ್ರೆ ನಿಜವಾಗ್ಲೂ ಎಷ್ಟು ಜಾಗ? ಇಡೀ ವರ್ಷ ಕೇಳ್ತಿದೀನಿ, ಯಾರೂ ಸರಿಯಾಗಿ ಹೇಳಿಲ್ಲ."
    tr: "Siddarāju avarē, guṇṭe andre nijavāglū eṣṭu jāga? Iḍī varṣa kēḷtidīni, yārū sariyāgi hēḷilla."
    en: "Mr Siddaraju, how much land is a gunta, really? I've been hearing the word all year and nobody's told me properly."
  - who: va
    t: "ಒಂದು ಗುಂಟೆ ಅಂದ್ರೆ ಮೂವತ್ತಮೂರು ಅಡಿ ಉದ್ದ, ಮೂವತ್ತಮೂರು ಅಡಿ ಅಗಲ — ಸಾವಿರದ ಎಂಬತ್ತೊಂಬತ್ತು ಚದರ ಅಡಿ. ನಲವತ್ತು ಗುಂಟೆ ಒಂದು ಎಕರೆ. ಆ ಸರ್ವೇಯರ್ ಹಿಡಿದಿರೋ ಸರಪಳಿ ಒಂದು ಗುಂಟೆಯ ಒಂದು ಬದಿಯಷ್ಟೇ ಉದ್ದ ಇರುತ್ತೆ. ನಿಮ್ಮ ಬೆಂಗಳೂರಿನ ಮೂವತ್ತು-ನಲವತ್ತು ಸೈಟು ಒಂದು ಗುಂಟೆಗಿಂತ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ."
    tr: "Ondu guṇṭe andre mūvattamūru aḍi udda, mūvattamūru aḍi agala — sāvirada embattombattu cadara aḍi. Nalavattu guṇṭe ondu ekare. Ā sarvēyar hiḍidirō sarapaḷi ondu guṇṭeya ondu badiyaṣṭē udda irutte. Nimma Beṅgaḷūrina mūvattu-nalavattu saiṭu ondu guṇṭeginta svalpa jāsti."
    en: "A gunta is thirty-three feet long and thirty-three feet wide — one thousand and eighty-nine square feet. Forty guntas make an acre. The chain the surveyor's holding is exactly as long as one side of a gunta. One of your Bengaluru thirty-by-forty sites is a little more than a gunta."
  - who: avva
    t: "ಆ ಹುಣಸೆ ಮರ ನನ್ನ ಭಾಗದಲ್ಲೇ ಬರ್ಬೇಕು ಸ್ವಾಮಿ. ಸರಪಳಿ ಎಳೆಯೋವಾಗ ಮರದ ಬೇರು ಕೂಡ ಆ ಕಡೆ ಹೋಗಬಾರದು."
    tr: "Ā huṇase mara nanna bhāgadallē barbēku svāmi. Sarapaḷi eḷeyōvāga marada bēru kūḍa ā kaḍe hōgabāradu."
    en: "That tamarind tree must fall in my part, sir. When they stretch the chain, not even a root of it should go to the other side."
  - who: va
    t: "ಹೆದರಬೇಡಿ ಅಮ್ಮ. ಮರದಿಂದ ಇಪ್ಪತ್ತು ಅಡಿ ಆಚೆ ಗಡಿ ಕಲ್ಲು ನೆಡೋಣ ಅಂತ ಎರಡೂ ಕಡೆಯವರು ಒಪ್ಪಿದಾರೆ. ಬೇರಿಗೆ ಗಡಿ ಗೊತ್ತಾಗಲ್ಲ, ಆದ್ರೆ ಕಾಗದಕ್ಕೆ ಗೊತ್ತಾಗುತ್ತೆ."
    tr: "Hedarabēḍi amma. Maradinda ippattu aḍi āce gaḍi kallu neḍōṇa anta eraḍū kaḍeyavaru oppidāre. Bērige gaḍi gottāgalla, ādre kāgadakke gottāgutte."
    en: "Don't worry, Amma. Both sides have agreed to set the boundary stone twenty feet beyond the tree. Roots don't know about boundaries, but paper does."
  - who: shobha
    t: "ಸಿದ್ದರಾಜು ಅವರೇ, ಹೊಸ ಪಹಣಿ ಯಾವಾಗ ಬರುತ್ತೆ? ನಿಂಗೇಗೌಡರ ಜೊತೆ ಕ್ರಯಪತ್ರ ಮಾಡೋಕೆ ಅದು ಬೇಕಲ್ಲ."
    tr: "Siddarāju avarē, hosa pahaṇi yāvāga barutte? Niṅgēgauḍara jote krayapatra māḍōke adu bēkalla."
    en: "Mr Siddaraju, when will the new RTC come? I'll need it to do the sale deed with Ningegowda."
  - who: va
    t: "ನಿಜ ಹೇಳ್ತೀನಿ ಮೇಡಂ — ಪೋಡಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಎರಡು-ಮೂರು ತಿಂಗಳು ಹಿಡಿಯುತ್ತೆ. ಸರ್ವೇಯರ್‌ಗಳು ಕಮ್ಮಿ, ಅರ್ಜಿ ಜಾಸ್ತಿ. ಸರ್ವರ್ ಕೈಕೊಟ್ರೆ ಇನ್ನೂ ತಡ. ಆದ್ರೆ ಯಾರಾದ್ರೂ ‘ಬೇಗ ಮಾಡಿಸ್ಕೊಡ್ತೀನಿ, ಸ್ವಲ್ಪ ಖರ್ಚಾಗುತ್ತೆ’ ಅಂದ್ರೆ, ‘ರಸೀದಿ ಇಲ್ಲದ ಖರ್ಚು ಬೇಡ’ ಅಂತ ಹೇಳಿ ನನ್ನ ಹತ್ರ ಬನ್ನಿ."
    tr: "Nija hēḷtīni mēḍam — pōḍige sāmānyavāgi eraḍu-mūru tiṅgaḷu hiḍiyutte. Sarvēyargaḷu kammi, arji jāsti. Sarvar kaikoṭre innū taḍa. Ādre yārādrū ‘bēga māḍiskoḍtīni, svalpa kharcāgutte’ andre, ‘rasīdi illada kharcu bēḍa’ anta hēḷi nanna hatra banni."
    en: "I'll be honest, madam — a podi usually takes two or three months. Few surveyors, lots of applications. If the server lets us down, longer still. But if anyone says, 'I'll get it done fast, it'll cost a little', tell them 'no expense without a receipt' and come to me."
  - who: mahadeva
    t: "ಸಾರ್, ಮನೆಗೆ ಬನ್ನಿ, ಕಾಫಿ ಕುಡಿದು ಹೋಗಿ. ಜನವರಿಯಲ್ಲಿ ನಿಮ್ಮ ಕೊಠಡಿಯಲ್ಲಿ ನಾನು ಜೋರಾಗಿ ಮಾತಾಡಿದ್ದೆ. ಕ್ಷಮಿಸಿ."
    tr: "Sār, manege banni, kāphi kuḍidu hōgi. Janavariyalli nimma koṭhaḍiyalli nānu jōrāgi mātāḍidde. Kṣamisi."
    en: "Sir, come to the house and have some coffee before you go. In January I raised my voice in your office. Forgive me."
  - who: va
    t: "ಕಾಫಿ ಕುಡೀತೀನಿ, ಕ್ಷಮೆ ಬೇಡ. ನನ್ನ ಕೊಠಡಿಯಲ್ಲಿ ದಿನಕ್ಕೆ ಹತ್ತು ಜನ ಜೋರಾಗಿ ಮಾತಾಡ್ತಾರೆ, ಮಹದೇವ ಅವರೇ. ಎಲ್ಲರಿಗೂ ಭೂಮಿಯ ಬಗ್ಗೆ ಭಯ. ನಿಮ್ಮ ಮನೆಯಲ್ಲಿ ಆ ಭಯ ಹೋಯ್ತು — ಅಷ್ಟೇ ಸಾಕು."
    tr: "Kāphi kuḍītīni, kṣame bēḍa. Nanna koṭhaḍiyalli dinakke hattu jana jōrāgi mātāḍtāre, Mahadēva avarē. Ellarigū bhūmiya bagge bhaya. Nimma maneyalli ā bhaya hōytu — aṣṭē sāku."
    en: "I'll have the coffee; no need for forgiveness. Ten people a day raise their voices in my office, Mr Mahadeva. Everyone is afraid about land. In your house that fear has gone — that's enough."

  - chapter: "Chapter 10 — Sankranti"
  - section: "Sesame and jaggery"
    learn: "Sankranti words: eḷḷu-bella, huride eḷḷu, kaḍlebīja, hurigaḍale, kobbari, sakkare accu, ālemane · the formula: eḷḷu-bella tindu oḷḷe mātāḍi · a long-awaited apology: … biṭṭiddu nānu, adu tappu, kṣamisu · proverb-like wisdom: sihi sumne baralla · habitual past: prati Saṅkrāntige … māḍtidru"
  - scene: "Sankranti, mid-January 2027. The year of mourning is over, and for the first time since Thatha's death the house in Bettahalli keeps a festival. A rangoli covers the swept yard; two cane stalks are tied at the door. Avva wears the pale cotton sari from the jatre. Shobha came on the last bus last night with a steel box. Thatha's garlanded photograph watches from the hall."
  - who: shobha
    t: "ಅವ್ವ, ಎಳ್ಳು-ಬೆಲ್ಲ ನೋಡು — ಹುರಿದ ಎಳ್ಳು, ಕಡ್ಲೆಬೀಜ, ಹುರಿಗಡಲೆ, ಕೊಬ್ಬರಿ, ಬೆಲ್ಲದ ಚೂರು. ಕೊಬ್ಬರಿ ಜಾಸ್ತಿ — ಅಪ್ಪನಿಗೆ ಇಷ್ಟ ಆಗ್ತಿದ್ದ ಹಾಗೆ. ಸಕ್ಕರೆ ಅಚ್ಚು ಮೈಸೂರಿಂದ ತಂದೆ."
    tr: "Avva, eḷḷu-bella nōḍu — huride eḷḷu, kaḍlebīja, hurigaḍale, kobbari, bellada cūru. Kobbari jāsti — appanige iṣṭa āgtidda hāge. Sakkare accu Maisūrinda tande."
    en: "Avva, look at the ellu-bella — roasted sesame, groundnuts, fried gram, copra, bits of jaggery. Extra copra — the way Appa liked it. I brought the sugar figurines from Mysuru."
  - who: avva
    t: "ಬೆಲ್ಲ ಎಲ್ಲಿಂದು ಕಣವ್ವ? ಘಮ ಬೇರೆ ಇದೆ."
    tr: "Bella ellindu kaṇavva? Ghama bēre ide."
    en: "Where's the jaggery from, girl? It smells different."
  - who: mahadeva
    t: "ಆ ಬೆಲ್ಲ ನಮ್ಮ ಗದ್ದೆಯದು, ಅವ್ವ. ಯಂತ್ರ ಬಿಟ್ಟು ಹೋಗಿದ್ದ ಬದುವಿನ ಎರಡು ಸಾಲು ಕಬ್ಬನ್ನ ಕೈಯಲ್ಲಿ ಕಡಿದು ಪಕ್ಕದೂರಿನ ಆಲೆಮನೆಗೆ ಕೊಟ್ಟಿದ್ದೆ. ಆಲೆಮನೆಗಳೂ ಈಗ ಕಮ್ಮಿ ಆಗ್ತಿವೆ — ಆಳು ಸಿಗಲ್ಲ, ಖರ್ಚು ಜಾಸ್ತಿ. ಅಲ್ಲಿ ಮಾಡಿದ ಹತ್ತು ಕೆಜಿ ಬೆಲ್ಲದಲ್ಲಿ ಒಂದು ಕೆಜಿ ಶೋಭಂಗೆ ಕಳಿಸಿದ್ದೆ."
    tr: "Ā bella namma gaddeyadu, avva. Yantra biṭṭu hōgidda baduvina eraḍu sālu kabbanna kaiyalli kaḍidu pakkadūrina ālemanege koṭṭidde. Ālemanegaḷū īga kammi āgtive — āḷu sigalla, kharcu jāsti. Alli māḍida hattu keji belladalli ondu keji Śōbhaṅge kaḷisidde."
    en: "That jaggery is from our own wet land, Avva. The machine had left two rows of cane along the bund; I cut them by hand and gave them to the jaggery unit in the next village. Those units are dwindling too — no labour, high costs. Of the ten kilos of jaggery they made, I'd sent one kilo to Shobha."
  - who: avva
    t: "ಮೊದಲ ಅಚ್ಚು ಅಮ್ಮನಿಗೆ ಕೊಟ್ಯಾ ಮಹದೇವ? ಪೂಜಾರಿಗಳು ಹೇಳಿದ್ರಲ್ಲ."
    tr: "Modala accu ammanige koṭyā Mahadēva? Pūjārigaḷu hēḷidralla."
    en: "Did you give the first block to the Goddess, Mahadeva? As the priest said?"
  - who: mahadeva
    t: "ಕೊಟ್ಟೆ ಅವ್ವ. ರಾಗಿಯ ಮೊದಲ ತೆನೆ, ಬೆಲ್ಲದ ಮೊದಲ ಅಚ್ಚು — ಎರಡೂ. ಅಪ್ಪನ ನಲವತ್ತು ವರ್ಷದ ಲೆಕ್ಕ ತಪ್ಪಲಿಲ್ಲ."
    tr: "Koṭṭe avva. Rāgiya modala tene, bellada modala accu — eraḍū. Appana nalavattu varṣada lekka tappalilla."
    en: "I did, Avva. The first ear of ragi and the first block of jaggery — both. Appa's forty-year record wasn't broken."
  - who: rakshith
    t: "ಅತ್ತೆ, ‘ಎಳ್ಳು ಬೀರೋದು’ ಅಂದ್ರೆ ಏನು? ಅಮ್ಮ ಬೆಂಗಳೂರಲ್ಲಿ ಅಪಾರ್ಟ್‌ಮೆಂಟ್‌ನಲ್ಲಿ ಡಬ್ಬಿಗಳಲ್ಲಿ ಹಂಚ್ತಾಳೆ, ಆದ್ರೆ ಅದರ ಹೆಸರು ನನಗೆ ಗೊತ್ತಿರಲಿಲ್ಲ."
    tr: "Atte, ‘eḷḷu bīrōdu’ andre ēnu? Amma Beṅgaḷūralli apārṭmeṇṭ-nalli ḍabbigaḷalli han̄ctāḷe, ādre adara hesaru nanage gottiralilla."
    en: "Atte, what does 'ellu beerodu' mean? Amma hands it out in little boxes in our apartment block in Bengaluru, but I never knew what it was called."
  - who: shobha
    t: "ಇದೇ — ಎಳ್ಳು ಬೀರೋದು. ಸಂಜೆ ಹೆಣ್ಣುಮಕ್ಕಳು, ಮಕ್ಕಳು ಹೊಸ ಬಟ್ಟೆ ಹಾಕ್ಕೊಂಡು ಮನೆ ಮನೆಗೆ ಹೋಗಿ ಎಳ್ಳು-ಬೆಲ್ಲ, ಸಕ್ಕರೆ ಅಚ್ಚು, ಒಂದು ಬಾಳೆಹಣ್ಣು, ಒಂದು ಕಬ್ಬಿನ ತುಂಡು ಕೊಡ್ತಾರೆ. ಕೊಡೋವಾಗ ಒಂದು ಮಾತು ಹೇಳ್ಬೇಕು — ‘ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡಿ.’"
    tr: "Idē — eḷḷu bīrōdu. Sañje heṇṇumakkaḷu, makkaḷu hosa baṭṭe hākkoṇḍu mane manege hōgi eḷḷu-bella, sakkare accu, ondu bāḷehaṇṇu, ondu kabbina tuṇḍu koḍtāre. Koḍōvāga ondu mātu hēḷbēku — ‘eḷḷu-bella tindu oḷḷe mātāḍi.’"
    en: "This — this is ellu beerodu. In the evening the women and children put on new clothes and go from house to house, giving ellu-bella, a sugar figurine, a banana and a piece of cane. And as you give it you must say: 'Eat sesame and jaggery, and speak sweetly.'"
  - who: rakshith
    t: "‘ಒಳ್ಳೆ ಮಾತಾಡಿ’… ಈ ವರ್ಷದ ನಮ್ಮ ಮನೆಗೆ ಇದಕ್ಕಿಂತ ಸರಿಯಾದ ಹಬ್ಬ ಇಲ್ಲ."
    tr: "‘Oḷḷe mātāḍi’… ī varṣada namma manege idakkinta sariyāda habba illa."
    en: "'Speak sweetly'… after the year our family's had, there couldn't be a better festival."
  - who: meena
    t: "ಮೊದಲ ಎಳ್ಳು ಯಾರಿಗೆ, ಶೋಭಾ? ಸಂಪ್ರದಾಯ ಏನು?"
    tr: "Modala eḷḷu yārige, Śōbhā? Sampradāya ēnu?"
    en: "Who gets the first ellu, Shobha? What's the custom?"
  - who: shobha
    t: "ಸಂಪ್ರದಾಯ ಗೊತ್ತಿಲ್ಲ ಅತ್ತಿಗೆ. ಆದ್ರೆ ನನ್ನ ಮನಸ್ಸು ಹೇಳ್ತಿದೆ. … ಮಹದೇವ, ತಗೋ. ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡು. ಕೋರ್ಟಿನ ಕಾಗದಗಳಲ್ಲಿ ನಿನ್ನ ಹೆಸರು ‘ಮೂರನೇ ಪ್ರತಿವಾದಿ’ ಅಂತ ಇತ್ತು. ಆ ಪದ ಓದಿದಾಗೆಲ್ಲಾ ನನಗೆ ತುಂಬಾ ನೋವಾಗ್ತಿತ್ತು."
    tr: "Sampradāya gottilla attige. Ādre nanna manassu hēḷtide. … Mahadēva, tagō. Eḷḷu-bella tindu oḷḷe mātāḍu. Kōrṭina kāgadagaḷalli ninna hesaru ‘mūranē prativādi’ anta ittu. Ā pada ōdidāgellā nanage tumbā nōvāgtittu."
    en: "I don't know the custom, Attige. But my heart says this. … Mahadeva, take it. Eat sesame and jaggery and speak sweetly. In the court papers your name was 'third defendant'. Every time I read that word, it hurt me terribly."
  - who: mahadeva
    t: "ತಗೊಂಡೆ. ಒಳ್ಳೆ ಮಾತು ಹೇಳ್ತೀನಿ — ಆದ್ರೆ ನನಗೆ ದೊಡ್ಡ ಮಾತು ಬರಲ್ಲ ಅಂತ ನಿನಗೆ ಗೊತ್ತು. … ಶೋಭಾ, ವಂಶವೃಕ್ಷದಲ್ಲಿ ನಿನ್ನ ಹೆಸರು ಬಿಟ್ಟಿದ್ದು ನಾನು. ಬೇಕು ಅಂತ ಅಲ್ಲ — ಆದ್ರೆ ‘ಅವಳು ಕೇಳಲ್ಲ’ ಅಂತ ಮನಸ್ಸಲ್ಲಿ ಅನ್ಕೊಂಡಿದ್ದೆ. ಅದು ತಪ್ಪು. ಕ್ಷಮಿಸು."
    tr: "Tagoṇḍe. Oḷḷe mātu hēḷtīni — ādre nanage doḍḍa mātu baralla anta ninage gottu. … Śōbhā, vaṁśavṛkṣadalli ninna hesaru biṭṭiddu nānu. Bēku anta alla — ādre ‘avaḷu kēḷalla’ anta manassalli ankoṇḍidde. Adu tappu. Kṣamisu."
    en: "I've taken it. I'll say something sweet — but you know I'm no good with big words. … Shobha, I'm the one who left your name out of the family tree. Not on purpose — but somewhere in my mind I'd assumed 'she won't ask'. That was wrong. Forgive me."
  - who: shobha
    t: "… ಇಷ್ಟು ಸಿಹಿ ಮಾತು ಕೇಳೋಕೆ ಒಂದು ವರ್ಷ, ಒಂದು ದಾವೆ, ಒಂದು ಜಾತ್ರೆ ಬೇಕಾಯ್ತು ನೋಡು."
    tr: "… Iṣṭu sihi mātu kēḷōke ondu varṣa, ondu dāve, ondu jātre bēkāytu nōḍu."
    en: "(laughing through tears) … Look at that — it took a year, a lawsuit and a jatre to hear something this sweet."
  - who: avva
    t: "ಬೆಲ್ಲ ಆಗೋಕೂ ಕಬ್ಬು ಹದಿನಾಲ್ಕು ತಿಂಗಳು ಗದ್ದೆಯಲ್ಲಿ ನಿಲ್ಲಬೇಕು, ಆಮೇಲೆ ಬೆಂಕಿಯಲ್ಲಿ ಕುದೀಬೇಕು ಕಣವ್ವ. ಸಿಹಿ ಸುಮ್ನೆ ಬರಲ್ಲ."
    tr: "Bella āgōkū kabbu hadinālku tiṅgaḷu gaddeyalli nillabēku, āmēle beṅkiyalli kudībēku kaṇavva. Sihi sumne baralla."
    en: "Even to become jaggery, cane has to stand fourteen months in the field and then boil over a fire, my girl. Sweetness doesn't come for nothing."
  - who: suresh
    t: "ಅವ್ವ, ನಿನಗೆ. … ‘ಒಳ್ಳೆ ಮಾತಾಡು’ ಅಂತ ನಿನಗೆ ಹೇಳೋ ಅಗತ್ಯ ಇಲ್ಲ. ಈ ವರ್ಷ ಒಂದು ಕಹಿ ಮಾತೂ ಆಡದೇ ಇದ್ದೋಳು ನೀನೊಬ್ಬಳೇ."
    tr: "Avva, ninage. … ‘Oḷḷe mātāḍu’ anta ninage hēḷō agatya illa. Ī varṣa ondu kahi mātū āḍadē iddōḷu nīnobbaḷē."
    en: "(holding out ellu-bella) Avva, for you. … There's no need to tell you to 'speak sweetly'. You're the only one who didn't say a single bitter word all year."
  - who: avva
    t: "ಆಡಿದೀನಿ ಕಣಪ್ಪ, ಮನಸ್ಸಲ್ಲಿ. ದೇವ್ರು ಬಾಯಿಗೆ ಬೀಗ ಹಾಕಿದ್ದ, ಅಷ್ಟೇ."
    tr: "Āḍidīni kaṇappa, manassalli. Dēvru bāyige bīga hākidda, aṣṭē."
    en: "I said plenty, son — in my heart. God had put a lock on my mouth, that's all."

  - section: "Painted horns"
    learn: "decorating cattle: kombige baṇṇa, gejje, hūvina hāra, mai toḷedu siṅgarisu, huggi tinisu · the fire ritual and its risks: kiccu hāyisōdu, gāya āytu, paśuvaidyaru bēḍa antāre · promises kept: … kalistīni andidde, ondu āytu · future plans: kṛṣi viśvavidyālayakke arji hākbēku antidīni"
  - scene: "Late morning. The cattle have been washed in the canal. In front of the cattle shed Rakshith kneels beside Kaveri, now a year old, with a tin of white paint and a brush; Mahadeva holds the calf's head. Gauri, already painted, stands by with a garland of marigolds."
  - who: mahadeva
    t: "ಹಿಂಗೆ — ಕೊಂಬಿನ ಬುಡದಿಂದ ತುದಿಗೆ, ಒಂದೇ ದಿಕ್ಕಿಗೆ ಬ್ರಶ್ ಎಳಿ. ಮೊದಲು ಬಿಳಿ, ಒಣಗಿದ ಮೇಲೆ ಕೆಂಪು. ಕಾವೇರಿಗೆ ಇದು ಮೊದಲ ಹಬ್ಬ, ಅವಳ ಕೊಂಬು ಇನ್ನೂ ಸಣ್ಣದು — ನಿಧಾನ."
    tr: "Hiṅge — kombina buḍadinda tudige, ondē dikkige braś eḷi. Modalu biḷi, oṇagida mēle kempu. Kāvērige idu modala habba, avaḷa kombu innū saṇṇadu — nidhāna."
    en: "Like this — draw the brush from the base of the horn to the tip, in one direction. White first, red once it's dry. This is Kaveri's first festival and her horns are still small — gently."
  - who: rakshith
    t: "ಚಿಕ್ಕಪ್ಪ, ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ತಾತನ ಸಮಾಧಿ ಹತ್ರ ನೀನು ಹೇಳಿದ್ದೆ — ‘ದನಗಳ ಕೊಂಬಿಗೆ ಬಣ್ಣ ಹಚ್ಚೋದು ಅಷ್ಟೇ ಅಲ್ಲ, ನೇಗಿಲು ಹಿಡಿಯೋದೂ ಕಲಿಸ್ತೀನಿ’ ಅಂತ. ಒಂದು ಆಯ್ತು."
    tr: "Cikkappa, Ḍisembar-nalli tātana samādhi hatra nīnu hēḷidde — ‘danagaḷa kombige baṇṇa haccōdu aṣṭē alla, nēgilu hiḍiyōdū kalistīni’ anta. Ondu āytu."
    en: "Chikkappa, that December, by Thatha's grave, you said, 'Not just painting the cattle's horns — I'll teach you to hold a plough too.' That's one done."
  - who: mahadeva
    t: "ನೇಗಿಲು ಮುಂದಿನ ಮುಂಗಾರಿಗೆ. ಮನೆಯಲ್ಲಿ ಎತ್ತು ಇಲ್ಲ, ಈಗ ಎಲ್ಲಾ ಟ್ರ್ಯಾಕ್ಟರ್ ಬಾಡಿಗೆ. ಆದ್ರೆ ತಾತನ ಕಾಲದ ನೇಗಿಲು ಕೊಟ್ಟಿಗೆ ಅಟ್ಟದ ಮೇಲಿದೆ. ಅದನ್ನ ಇಳಿಸಿ, ಪಕ್ಕದ ಮನೆಯ ಎತ್ತು ಕೇಳಿ, ಒಂದು ಸಾಲು ಉಳೋಣ — ನಿನಗೋಸ್ಕರ."
    tr: "Nēgilu mundina muṅgārige. Maneyalli ettu illa, īga ellā ṭryākṭar bāḍige. Ādre tātana kālada nēgilu koṭṭige aṭṭada mēlide. Adanna iḷisi, pakkada maneya ettu kēḷi, ondu sālu uḷōṇa — ninagōskara."
    en: "The plough will be next monsoon. We've no bullocks in the house — it's all hired tractors now. But Thatha's old plough is up in the loft of the cattle shed. We'll bring it down, borrow the neighbour's bullocks and plough one furrow — just for you."
  - who: rakshith
    t: "ಇನ್ನೊಂದು ವಿಷಯ ನಿನಗೆ ಮೊದಲು ಹೇಳ್ತೀನಿ ಚಿಕ್ಕಪ್ಪ — ಅಪ್ಪನಿಗೂ ಇನ್ನೂ ಹೇಳಿಲ್ಲ. ಪಿಯುಸಿ ಆದ್ಮೇಲೆ ನಾನು ಕೃಷಿ ವಿಶ್ವವಿದ್ಯಾಲಯಕ್ಕೆ ಅರ್ಜಿ ಹಾಕ್ಬೇಕು ಅಂತಿದೀನಿ. ಬಿಎಸ್ಸಿ ಕೃಷಿ."
    tr: "Innondu viṣaya ninage modalu hēḷtīni cikkappa — appanigū innū hēḷilla. Pi-Yu-Si ādmēle nānu kṛṣi viśvavidyālayakke arji hākbēku antidīni. Bi-Es-Si kṛṣi."
    en: "I'll tell you something else first, Chikkappa — I haven't even told Appa yet. After PUC I want to apply to the agricultural university. A BSc in agriculture."
  - who: mahadeva
    t: "ನೀನಾ? ಬೆಂಗಳೂರಿನ ಹುಡುಗ, ಕೃಷಿ ಓದ್ತೀಯಾ? … ಓದು. ಆದ್ರೆ ಒಂದು ಮಾತು: ಓದಿ ಆಫೀಸಲ್ಲಿ ಕೂತು ರೈತರಿಗೆ ‘ಇದು ಮಾಡಿ, ಅದು ಮಾಡಿ’ ಅಂತ ಹೇಳೋಕೆ ಮುಂಚೆ ವರ್ಷಕ್ಕೊಂದ್ಸಲ ಇಲ್ಲಿ ಬಂದು ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ನೀರು ಕಟ್ಟು. ಆಗ ನಿನ್ನ ಸಲಹೆ ಕೇಳೋಕೆ ನಾನೇ ಮೊದಲು ಬರ್ತೀನಿ."
    tr: "Nīnā? Beṅgaḷūrina huḍuga, kṛṣi ōdtīyā? … Ōdu. Ādre ondu mātu: ōdi āphīsalli kūtu raitarige ‘idu māḍi, adu māḍi’ anta hēḷōke mun̄ce varṣakkondsala illi bandu rātri eraḍu gaṇṭege nīru kaṭṭu. Āga ninna salahe kēḷōke nānē modalu bartīni."
    en: "You? A Bengaluru boy, studying agriculture? … Study. But one thing: before you sit in an office telling farmers 'do this, do that', come here once a year and water the field at two in the morning. Then I'll be the first to come asking your advice."
  - who: rakshith
    t: "ಆಣೆ. … ಕಿಚ್ಚು ಹಾಯಿಸೋದು ಇವತ್ತು ಮಾಡ್ತೀರಾ? ಫೋನಲ್ಲಿ ವಿಡಿಯೋ ನೋಡಿದೆ — ಬೆಂಕಿ ಮೇಲೆ ದನಗಳು ಹಾರ್ತಾವೆ."
    tr: "Āṇe. … Kiccu hāyisōdu ivattu māḍtīrā? Phōnalli viḍiyō nōḍide — beṅki mēle danagaḷu hārtāve."
    en: "I swear. … Are you doing the kichchu today? I saw a video on my phone — the cattle jump over fire."
  - who: mahadeva
    t: "ಊರ ಬೀದಿಯಲ್ಲಿ ಕೆಲವರು ಮಾಡ್ತಾರೆ. ಹುಲ್ಲಿಗೆ ಬೆಂಕಿ ಹಚ್ಚಿ ದನಗಳನ್ನ ಅದರ ಮೇಲೆ ಓಡಿಸ್ತಾರೆ — ರೋಗ-ರುಜಿನ ಹೋಗ್ಲಿ ಅಂತ ನಂಬಿಕೆ. ಆದ್ರೆ ಎರಡು ವರ್ಷದ ಹಿಂದೆ ಮಂಡ್ಯ ಕಡೆ ದನಗಳಿಗೂ ಜನಕ್ಕೂ ಗಾಯ ಆಯ್ತು; ಪಶುವೈದ್ಯರೂ ಬೇಡ ಅಂತಾರೆ. ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಒಂದೇ ನಿಯಮ: ಮೈ ತೊಳೆದು, ಸಿಂಗರಿಸಿ, ಹುಗ್ಗಿ ತಿನಿಸಿ, ಆರತಿ ಎತ್ತೋದು. ಬೆಂಕಿ ಆರತಿ ತಟ್ಟೆಯಲ್ಲಿ ಮಾತ್ರ."
    tr: "Ūra bīdiyalli kelavaru māḍtāre. Hullige beṅki hacci danagaḷanna adara mēle ōḍistāre — rōga-rujina hōgli anta nambike. Ādre eraḍu varṣada hinde Maṇḍya kaḍe danagaḷigū janakkū gāya āytu; paśuvaidyarū bēḍa antāre. Namma maneyalli ondē niyama: mai toḷedu, siṅgarisi, huggi tinisi, ārati ettōdu. Beṅki ārati taṭṭeyalli mātra."
    en: "Some people do it in the village street. They set straw alight and run the cattle over it — the belief is that it drives away sickness. But two years ago, around Mandya, both cattle and people were hurt, and the vets say don't. In our house there's one rule: wash them, decorate them, feed them huggi and wave the lamp before them. The only fire is on the arati plate."
  - who: rakshith
    t: "ಗೌರಿಗೆ ಕೆಂಪು, ಕಾವೇರಿಗೆ ನೀಲಿ. ಗೆಜ್ಜೆ ಎಲ್ಲಿದೆ ಚಿಕ್ಕಪ್ಪ?"
    tr: "Gaurige kempu, Kāvērige nīli. Gejje ellide cikkappa?"
    en: "Red for Gauri, blue for Kaveri. Where are the bells, Chikkappa?"
  - who: avva
    t: "ಗೆಜ್ಜೆ ಟ್ರಂಕಿನಲ್ಲಿದೆ — ನಾನು ಈ ಮನೆಗೆ ತಂದ ಆ ಟ್ರಂಕು. ನಿಮ್ಮ ತಾತ ಪ್ರತಿ ಸಂಕ್ರಾಂತಿಗೆ ಅದನ್ನ ತೆಗೆದು ಹೊಳಪು ಮಾಡ್ತಿದ್ರು. ಕಳೆದ ವರ್ಷ ಯಾರೂ ತೆಗೀಲಿಲ್ಲ."
    tr: "Gejje ṭraṅkinallide — nānu ī manege tanda ā ṭraṅku. Nimma tāta prati Saṅkrāntige adanna tegedu hoḷapu māḍtidru. Kaḷeda varṣa yārū tegīlilla."
    en: "(from the doorway) The bells are in the trunk — the trunk I brought to this house. Your Thatha used to take them out and polish them every Sankranti. Last year nobody took them out."
  - who: rakshith
    t: "ಈ ವರ್ಷ ನಾನು ತೆಗೀತೀನಿ ಅಜ್ಜಿ."
    tr: "Ī varṣa nānu tegītīni ajji."
    en: "This year I'll take them out, Ajji."

  - section: "The meal in the yard"
    learn: "festival food: huggi, rāgi mudde, avarekāḷu sāru, bassāru · news in brief: vibhāga patra nōndaṇi āytu, pōḍige arji hōgide, muṅgaḍa koṭṭidāre, karāru āgide · serving: nānu baḍistīni, ele hāki · reading and writing the diary: koneya puṭa ōdu, nīnu nōḍiddanna bari · closing a debt: bāki tīritu"
  - scene: "Afternoon. Banana leaves are laid on mats in the yard, under the open sky."
  - who: avva
    t: "ಎಲೆ ಹಾಕಿ. ಅಂಗಳದಲ್ಲೇ. ಒಳಗೆ ಬೇಡ — ಇವತ್ತು ಅಂಗಳದಲ್ಲೇ ಊಟ."
    tr: "Ele hāki. Aṅgaḷadallē. Oḷage bēḍa — ivattu aṅgaḷadallē ūṭa."
    en: "Lay the leaves. Here in the yard. Not inside — today we eat in the yard."
  - who: meena
    t: "ಹುಗ್ಗಿ, ರಾಗಿ ಮುದ್ದೆ, ಅವರೆಕಾಳು ಸಾರು, ಬಸ್ಸಾರು, ಎಳ್ಳು-ಬೆಲ್ಲ, ಕಬ್ಬು… ಅವ್ವ, ಅಡುಗೆ ಎಲ್ಲಾ ನಿಮ್ಮ ಮಗಳದು. ನಾನು ಬರೀ ತೆಂಗಿನಕಾಯಿ ತುರಿದಿದ್ದು."
    tr: "Huggi, rāgi mudde, avarekāḷu sāru, bassāru, eḷḷu-bella, kabbu… Avva, aḍuge ellā nimma magaḷadu. Nānu barī teṅginakāyi turididdu."
    en: "Huggi, ragi mudde, field-bean saaru, bassaaru, ellu-bella, cane… Avva, all the cooking is your daughter's. All I did was grate the coconut."
  - who: suresh
    t: "ಅವ್ವ, ಒಂದು ಸುದ್ದಿ. ಕಳೆದ ಗುರುವಾರ ಮದ್ದೂರಿನ ಉಪನೋಂದಣಾಧಿಕಾರಿ ಕಚೇರಿಯಲ್ಲಿ ವಿಭಾಗ ಪತ್ರ ನೋಂದಣಿ ಆಯ್ತು — ಅಲ್ಲಿ ಕ್ಯಾಮರಾ ಮುಂದೆ ನಿನ್ನ ಹೆಬ್ಬೆಟ್ಟು ತಗೊಂಡ್ರಲ್ಲ, ಅದೇ. ಪೋಡಿಗೆ ಅರ್ಜಿ ಹೋಗಿದೆ. ಸಿದ್ದರಾಜು ಅವರು ಹೇಳಿದ ಹಾಗೆ ಹೊಸ ಪಹಣಿ ಮಾರ್ಚ್-ಏಪ್ರಿಲ್ ಹೊತ್ತಿಗೆ ಬರಬಹುದು."
    tr: "Avva, ondu suddi. Kaḷeda Guruvāra Maddūrina upanōndaṇādhikāri kacēriyalli vibhāga patra nōndaṇi āytu — alli kyāmarā munde ninna hebbeṭṭu tagoṇḍralla, adē. Pōḍige arji hōgide. Siddarāju avaru hēḷida hāge hosa pahaṇi Mārc-Ēpril hottige barabahudu."
    en: "Avva, some news. Last Thursday the partition deed was registered at the Sub-Registrar's office in Maddur — that's where they took your thumbprint in front of the camera. The podi application has gone in. As Siddaraju said, the new RTC may come around March or April."
  - who: shobha
    t: "ನಿಂಗೇಗೌಡರು ಐದು ಲಕ್ಷ ಮುಂಗಡ ಕೊಟ್ಟಿದಾರೆ, ಕರಾರು ಆಗಿದೆ. ಹೊಸ ಪಹಣಿ ಬಂದ ತಕ್ಷಣ ಕ್ರಯಪತ್ರ. ಮೈಸೂರಲ್ಲಿ ಬೋಗಾದಿ ಹತ್ರ ಒಂದು ಸಣ್ಣ ಮನೆ ನೋಡಿದೀವಿ — ಎರಡು ರೂಮು, ಒಂದು ಸಣ್ಣ ಅಂಗಳ. ಅಂಗಳ ಇರ್ಲೇಬೇಕು ಅಂತ ನಾನೇ ಹಠ ಹಿಡಿದೆ."
    tr: "Niṅgēgauḍaru aidu lakṣa muṅgaḍa koṭṭidāre, karāru āgide. Hosa pahaṇi banda takṣaṇa krayapatra. Maisūralli Bōgādi hatra ondu saṇṇa mane nōḍidīvi — eraḍu rūmu, ondu saṇṇa aṅgaḷa. Aṅgaḷa irlēbēku anta nānē haṭha hiḍide."
    en: "Ningegowda has paid five lakh in advance; the agreement is signed. As soon as the new RTC comes, the sale deed. In Mysuru we've seen a small house near Bogadi — two rooms and a little yard. I was the one who insisted it must have a yard."
  - who: mahadeva
    t: "ಆ ಅಂಗಳಕ್ಕೆ ತುಳಸಿ ಕಟ್ಟೆ ನಾನು ಮಾಡಿಸ್ಕೊಡ್ತೀನಿ — ನಮ್ಮೂರ ಕಲ್ಲಿನಲ್ಲಿ."
    tr: "Ā aṅgaḷakke tuḷasi kaṭṭe nānu māḍiskoḍtīni — nammūra kallinalli."
    en: "I'll have a tulasi stand made for that yard — out of our village's stone."
  - who: avva
    t: "ಮೂರೂ ಜನ ಕೂತ್ರಾ? ಸುರೇಶ ಈ ಕಡೆ, ಶೋಭಾ ಮಧ್ಯ, ಮಹದೇವ ಆ ಕಡೆ. ನಾನು ಬಡಿಸ್ತೀನಿ."
    tr: "Mūrū jana kūtrā? Surēśa ī kaḍe, Śōbhā madhya, Mahadēva ā kaḍe. Nānu baḍistīni."
    en: "Are all three of you sitting? Suresha on this side, Shobha in the middle, Mahadeva on that side. I'll serve."
  - who: shobha
    t: "ಅವ್ವ, ನೀನೂ ಕೂರು. ಇವತ್ತು ನಾನು ಬಡಿಸ್ತೀನಿ — ಕೋರ್ಟಲ್ಲಿ ನೀನು ರೊಟ್ಟಿ ಹಂಚಿದ್ದೆ, ಇವತ್ತು ನನ್ನ ಸರತಿ."
    tr: "Avva, nīnū kūru. Ivattu nānu baḍistīni — kōrṭalli nīnu roṭṭi han̄cidde, ivattu nanna sarati."
    en: "Avva, you sit too. Today I'll serve — you shared out the rotti in court; today it's my turn."
  - who: avva
    t: "ಇಲ್ಲ ಕಣವ್ವ. ಇವತ್ತು ನಾನು ಕೂರಲ್ಲ. ನಿಮ್ಮಪ್ಪ ನೋಡ್ಬೇಕು ಅಂದಿದ್ದನ್ನ ನಾನು ನಿಂತ್ಕೊಂಡು ನೋಡ್ಬೇಕು."
    tr: "Illa kaṇavva. Ivattu nānu kūralla. Nimmappa nōḍbēku andiddanna nānu nintkoṇḍu nōḍbēku."
    en: "No, my girl. Today I won't sit. What your father wanted to see, I must stand and see."
  - scene: "The three siblings sit cross-legged in the yard, banana leaves before them; Avva serves. Meena and Rakshith sit a little apart on the veranda step. For a while nobody speaks; there is only the sound of eating, and the bells on the cattle."
  - who: avva
    t: "… ರಕ್ಷಿತ್, ಆ ದಿನಚರಿ ತಗೊಂಡು ಬಾ ಕಂದ. ಕೊನೇ ಪುಟ ಓದು."
    tr: "… Rakṣit, ā dinacari tagoṇḍu bā kanda. Konē puṭa ōdu."
    en: "… Rakshith, bring the diary, child. Read the last page."
  - who: rakshith
    t: "‘ನನ್ನ ಮೂರು ಮಕ್ಕಳೂ ಮೂರು ಕಡೆ ಇದ್ದಾರೆ. ಒಂದು ದಿನ ಈ ಮನೆ ಅಂಗಳದಲ್ಲಿ ಮೂವರೂ ಒಟ್ಟಿಗೆ ಕೂತು ಊಟ ಮಾಡೋದು ನೋಡ್ಬೇಕು.’ … ಅದರ ಕೆಳಗೆ ಅತ್ತೆಯ ಕೈಬರಹ: ‘ಜಾತ್ರೆ ರಾತ್ರಿ. ಮೂರೂ ಮಕ್ಳು ಅಂಗಳದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಕೂತಿದ್ರು. ಇನ್ನು ಒಟ್ಟಿಗೆ ಉಣ್ಣೋದು ಒಂದೇ ಬಾಕಿ.’"
    tr: "‘Nanna mūru makkaḷū mūru kaḍe iddāre. Ondu dina ī mane aṅgaḷadalli mūvarū oṭṭige kūtu ūṭa māḍōdu nōḍbēku.’ … Adara keḷage atteya kaibaraha: ‘Jātre rātri. Mūrū makḷu aṅgaḷadalli oṭṭige kūtidru. Innu oṭṭige uṇṇōdu ondē bāki.’"
    en: "'My three children are in three different places. One day I must see all three of them sitting together and eating in the yard of this house.' … And under it, in Atte's handwriting: 'Night of the jatre. All three children sat together in the yard. Only eating together still remains.'"
  - who: avva
    t: "ಈಗ ನೀನು ಬರಿ, ಕಂದ. ತಾತನ ಮೊಮ್ಮಗನ ಕೈಬರಹ. ನಾನು ಹೇಳಿದ್ದನ್ನಲ್ಲ — ನೀನು ನೋಡಿದ್ದನ್ನ."
    tr: "Īga nīnu bari, kanda. Tātana mommagana kaibaraha. Nānu hēḷiddannalla — nīnu nōḍiddanna."
    en: "Now you write, child. In Thatha's grandson's hand. Not what I tell you — what you saw."
  - who: rakshith
    t: "‘ಸಂಕ್ರಾಂತಿ, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೇಳು. ಇವತ್ತು ಮೂರೂ ಮಕ್ಕಳು ಈ ಅಂಗಳದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಕೂತು ಉಂಡ್ರು. ಅಜ್ಜಿ ನಿಂತು ಬಡಿಸಿದ್ರು. ಯಾರೂ ಲೆಕ್ಕ ಹಾಕಲಿಲ್ಲ. ತಾತ, ನಿಮ್ಮ ಬಾಕಿ ತೀರಿತು.’"
    tr: "‘Saṅkrānti, eraḍu sāvirada ippattēḷu. Ivattu mūrū makkaḷu ī aṅgaḷadalli oṭṭige kūtu uṇḍru. Ajji nintu baḍisidru. Yārū lekka hākalilla. Tāta, nimma bāki tīritu.’"
    en: "(writing slowly, then reading it out) 'Sankranti, two thousand twenty-seven. Today all three children sat together in this yard and ate. Ajji stood and served. Nobody counted anything. Thatha, your account is settled.'"
  - who: suresh
    t: "‘ಬಾಕಿ ತೀರಿತು’… ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಮಗ ನೋಡು."
    tr: "‘Bāki tīritu’… byāṅk myānējar maga nōḍu."
    en: "(his voice thick) 'Account settled'… spoken like a bank manager's son."
  - who: mahadeva
    t: "ಸಂಘದ ಬೇಬಾಕಿ ಪ್ರಮಾಣಪತ್ರಕ್ಕಿಂತ ಇದು ದೊಡ್ಡ ಪ್ರಮಾಣಪತ್ರ, ಅಣ್ಣ."
    tr: "Saṅghada bēbāki pramāṇapatrakkinta idu doḍḍa pramāṇapatra, aṇṇa."
    en: "That's a bigger certificate than the society's no-dues certificate, Anna."
  - who: shobha
    t: "ಅವ್ವ… ಈಗಲಾದ್ರೂ ಕೂರು. ಬಾಕಿ ತೀರಿತಲ್ಲ."
    tr: "Avva… īgalādrū kūru. Bāki tīritalla."
    en: "Avva… sit down now, at least. The account's settled, isn't it?"
  - who: avva
    t: "ಕೂರ್ತೀನಿ. … ಸುರೇಶ, ಸಂಜೆ ರಕ್ಷಿತ್ ಜೊತೆ ಹೋಗಿ ಒಂದು ಹಿಡಿ ಎಳ್ಳು-ಬೆಲ್ಲ ಹುಣಸೆ ಮರದ ಹತ್ರ ಇಟ್ಟು ಬಾ. ಅವರಿಗೂ ಒಂದು ಪಾಲು."
    tr: "Kūrtīni. … Surēśa, sañje Rakṣit jote hōgi ondu hiḍi eḷḷu-bella huṇase marada hatra iṭṭu bā. Avarigū ondu pālu."
    en: "I'll sit. … Suresha, this evening go with Rakshith and leave a handful of ellu-bella under the tamarind tree. A share for him too."

  - section: "Visitors"
    learn: "giving ellu: eḷḷu-bella tagoḷḷi, oḷḷe mātāḍi · an elder's reflection: nānu sōte, bīja avattē bittiddu, kānūnē haṅgaite, kūḍi bāḷidare svarga sukha · the broker's last visit: vyāpārakkalla, āṇe · defending a choice: ā bele nānē tīrmāna māḍiddu, gēṭu alla raita irtāne"
  - scene: "Late afternoon. Shobha and Rakshith, carrying a tray of ellu-bella, go along the lane to the peepul platform. Old Thimmegowda sits there in a fresh white shirt, a shawl over his shoulders."
  - who: shobha
    t: "ತಿಮ್ಮಣ್ಣ, ಎಳ್ಳು-ಬೆಲ್ಲ ತಗೊಳ್ಳಿ. ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡಿ."
    tr: "Timmaṇṇa, eḷḷu-bella tagoḷḷi. Eḷḷu-bella tindu oḷḷe mātāḍi."
    en: "Thimmanna, have some ellu-bella. Eat sesame and jaggery and speak sweetly."
  - who: elder
    t: "ಬಾಮ್ಮ, ಬಾ. ಚನ್ನೇಗೌಡನ ಮಗಳು ಎಳ್ಳು ಬೀರೋಕೆ ಬಂದ್ಲು ಅಂದ್ರೆ ಊರಿಗೆ ಸಂಕ್ರಾಂತಿ ಬಂತು ಅಂತ ಲೆಕ್ಕ. … ಮಾರ್ಚ್‌ನಲ್ಲಿ ಇದೇ ಕಟ್ಟೆ ಮೇಲೆ ನಾನು ಸೋತೆ ಕಣಮ್ಮ. ನಿಮ್ಮನ್ನ ಒಂದು ಮಾಡೋಕೆ ಆಗ್ಲಿಲ್ಲ."
    tr: "Bāmma, bā. Cannēgauḍana magaḷu eḷḷu bīrōke bandlu andre ūrige Saṅkrānti bantu anta lekka. … Mārc-nalli idē kaṭṭe mēle nānu sōte kaṇamma. Nimmanna ondu māḍōke āglilla."
    en: "Come, child, come. When Channegowda's daughter comes round with ellu, the village knows Sankranti has truly arrived. … In March, on this very platform, I failed, my dear. I couldn't bring you together."
  - who: shobha
    t: "ಸೋಲಲಿಲ್ಲ ತಿಮ್ಮಣ್ಣ. ಅವತ್ತು ಅವ್ವ ಮೊದಲ ಸಲ ಊರಿನ ಮುಂದೆ ತನ್ನ ಆಸೆ ಹೇಳಿದ್ರು. ಬೀಜ ಅವತ್ತೇ ಬಿತ್ತಿದ್ದು. ಬೆಳೆ ಈಗ ಬಂತು, ಅಷ್ಟೇ."
    tr: "Sōlalilla Timmaṇṇa. Avattu avva modala sala ūrina munde tanna āse hēḷidru. Bīja avattē bittiddu. Beḷe īga bantu, aṣṭē."
    en: "You didn't fail, Thimmanna. That night Avva spoke her wish in front of the village for the first time. The seed was sown that night. The crop has only come up now."
  - who: elder
    t: "ಹೂಂ. ನಮ್ಮ ಕಾಲದಲ್ಲಿ ಹೆಣ್ಮಕ್ಕಳು ಪಾಲು ಕೇಳ್ತಿರ್ಲಿಲ್ಲ; ಕೇಳಿದ್ರೆ ಊರು ಬೈತಿತ್ತು. ಈಗ ಕಾನೂನೇ ಹಂಗೈತೆ — ಒಳ್ಳೇದೇ ಆಯ್ತು ಅನ್ಸುತ್ತೆ. ಆದ್ರೆ ಮುದುಕನ ಒಂದು ಮಾತು ಕೇಳು: ಕಾನೂನು ಪಾಲು ಕೊಡುತ್ತೆ, ಕುಟುಂಬ ಕೊಡಲ್ಲ. ಕುಟುಂಬ ಉಳಿಸ್ಕೊಳ್ಳೋದು ನಿಮ್ಮ ಕೈಲೇ ಐತೆ. ಕೂಡಿ ಬಾಳಿದರೆ ಸ್ವರ್ಗ ಸುಖ ಅಂತಾರಲ್ಲ — ಅದು."
    tr: "Hūṁ. Namma kāladalli heṇmakkaḷu pālu kēḷtirlilla; kēḷidre ūru baitittu. Īga kānūnē haṅgaite — oḷḷēdē āytu ansutte. Ādre mudukana ondu mātu kēḷu: kānūnu pālu koḍutte, kuṭumba koḍalla. Kuṭumba uḷiskoḷḷōdu nimma kailē aite. Kūḍi bāḷidare svarga sukha antāralla — adu."
    en: "Hm. In our day daughters didn't ask for a share; if they did, the village scolded them. Now the law itself says so — and I think that's turned out for the good. But hear one word from an old man: the law gives you a share; it doesn't give you a family. Keeping the family is in your own hands. 'Living together is the joy of heaven,' as they say — that."
  - who: rakshith
    t: "ತಾತ, ನಿಮಗೂ ಸಕ್ಕರೆ ಅಚ್ಚು. … ಇದು ಆನೆ ಆಕಾರ."
    tr: "Tāta, nimagū sakkare accu. … Idu āne ākāra."
    en: "Thatha, a sugar figurine for you too. … This one's an elephant."
  - who: elder
    t: "ನೀನು ಆ ಬೆಂಗಳೂರು ಹುಡುಗ ಅಲ್ವಾ? ಕೃಷಿ ಓದ್ತೀಯಂತೆ — ಬೆಳಿಗ್ಗೆಯಿಂದ ಊರೆಲ್ಲಾ ಇದೇ ಸುದ್ದಿ. ಓದು ಕಣಪ್ಪ. ಓದಿ ಮುಗಿದ ಮೇಲೆ ಈ ಕಟ್ಟೆಗೆ ಬಂದು ನಮಗೂ ಹೇಳು — ಕಮ್ಮಿ ನೀರಲ್ಲಿ ಕಬ್ಬು ಹೆಂಗೆ ಬೆಳೆಯೋದು ಅಂತ."
    tr: "Nīnu ā Beṅgaḷūru huḍuga alvā? Kṛṣi ōdtīyante — beḷiggeyinda ūrellā idē suddi. Ōdu kaṇappa. Ōdi mugida mēle ī kaṭṭege bandu namagū hēḷu — kammi nīralli kabbu heṅge beḷeyōdu anta."
    en: "You're that Bengaluru boy, aren't you? They say you're going to study agriculture — the whole village has been talking of nothing else since morning. Study, lad. And when you've finished, come to this platform and tell us too — how to grow cane on less water."
  - scene: "Back at the house, a white SUV has stopped at the gate. Manjunath the broker gets out, holding a box of sugar figurines."
  - who: broker
    t: "ಸಂಕ್ರಾಂತಿ ಶುಭಾಶಯಗಳು ಸಾರ್, ಅಮ್ಮಾವ್ರೇ. ಎಳ್ಳು-ಬೆಲ್ಲ ಕೊಡೋಕೆ ಬಂದೆ, ವ್ಯಾಪಾರಕ್ಕಲ್ಲ — ಆಣೆ. … ಆದ್ರೂ ಕೇಳಿದೆ, ಲೋಕ ಅದಾಲತ್‌ನಲ್ಲಿ ರಾಜಿ ಆಯ್ತಂತೆ, ಒಣ ಹೊಲದ ಅರ್ಧ ನಿಂಗೇಗೌಡ್ರಿಗೆ ಮೂವತ್ತಾರಕ್ಕೆ ಹೋಗ್ತಿದೆಯಂತೆ. ನನ್ನ ಪಾರ್ಟಿ ನಲವತ್ತು ಕೊಡ್ತಿತ್ತು ಸಾರ್!"
    tr: "Saṅkrānti śubhāśayagaḷu sār, ammāvrē. Eḷḷu-bella koḍōke bande, vyāpārakkalla — āṇe. … Ādrū kēḷide, Lōka Adālat-nalli rāji āytante, oṇa holada ardha Niṅgēgauḍrige mūvattārakke hōgtideyante. Nanna pārṭi nalavattu koḍtittu sār!"
    en: "Happy Sankranti, sir, Ammavre. I've come to give ellu-bella, not for business — I swear. … Still, I heard there was a settlement at the Lok Adalat, and half the dry field is going to Ningegowda at thirty-six. My party would have paid forty, sir!"
  - who: shobha
    t: "ಆ ವ್ಯತ್ಯಾಸ ನನ್ನ ಪಾಲಿಂದ ಹೋಗಿದ್ದು, ಮಂಜುನಾಥ್ ಅವರೇ — ಸುಮಾರು ಐದು ಲಕ್ಷ. ಅದಕ್ಕೆ ಬದಲಾಗಿ ನನ್ನ ತಮ್ಮನ ಹೊಲದ ಪಕ್ಕದಲ್ಲಿ ಗೇಟು ಅಲ್ಲ, ರೈತ ಇರ್ತಾನೆ. ನಾಳೆ ಅವನ ದನ ಆ ಬದುವಿನ ಮೇಲೆ ಮೇದ್ರೆ ಯಾರೂ ವಾಚ್‌ಮನ್ ಕಳಿಸಲ್ಲ. ಆ ಬೆಲೆ ನಾನೇ ತೀರ್ಮಾನ ಮಾಡಿದ್ದು."
    tr: "Ā vyatyāsa nanna pālinda hōgiddu, Man̄junāth avarē — sumāru aidu lakṣa. Adakke badalāgi nanna tammana holada pakkadalli gēṭu alla, raita irtāne. Nāḷe avana dana ā baduvina mēle mēdre yārū vāc-man kaḷisalla. Ā bele nānē tīrmāna māḍiddu."
    en: "That difference came out of my share, Mr Manjunath — about five lakh. In return, next to my brother's land there'll be a farmer, not a gate. If his cattle graze on that bund tomorrow, nobody will send a watchman. I chose that price myself."
  - who: broker
    t: "… ಸರಿ ಮೇಡಂ. ನನ್ನ ಇಪ್ಪತ್ತು ವರ್ಷದ ವ್ಯಾಪಾರದಲ್ಲಿ ಕಮ್ಮಿ ಬೆಲೆಗೆ ಖುಷಿಯಾಗಿ ಮಾರಿದ ಮೊದಲ ಪಾರ್ಟಿ ನೀವು. ತಗೊಳ್ಳಿ, ಸಕ್ಕರೆ ಅಚ್ಚು. ವ್ಯಾಪಾರ ಇಲ್ದಿದ್ರೂ ಸಂಕ್ರಾಂತಿ ಇದೆಯಲ್ಲ."
    tr: "… Sari mēḍam. Nanna ippattu varṣada vyāpāradalli kammi belege khuṣiyāgi mārida modala pārṭi nīvu. Tagoḷḷi, sakkare accu. Vyāpāra ildidrū Saṅkrānti ideyalla."
    en: "(after a pause) … All right, madam. In twenty years of business, you're the first party I've seen sell happily for less. Here, have the sugar figurines. Even without a deal, it's still Sankranti."
  - who: avva
    t: "ಬಾ ಮಂಜುನಾಥ, ಕಾಫಿ ಕುಡಿದು ಹೋಗು. ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡು — ಇವತ್ತು ರೇಟಿನ ಮಾತು ಬೇಡ."
    tr: "Bā Man̄junātha, kāphi kuḍidu hōgu. Eḷḷu-bella tindu oḷḷe mātāḍu — ivattu rēṭina mātu bēḍa."
    en: "Come, Manjunatha, have coffee before you go. Eat ellu-bella and speak sweetly — no talk of rates today."

  - section: "Under the tamarind tree"
    learn: "a father's reflection: prāmāṇikavāgi hēḷtīni, manassu allāḍitu · paradox: kelavu āstigaḷanna han̄cidre kammi āgutte, kelavanna biṭṭukoṭre jāsti āgutte · the diary reinterpreted: makkaḷigāgi jamīnu, jamīnigāgi makkaḷalla · a banker's metaphor: idakkinta doḍḍa baḍḍi yāva byāṅkū koḍalla · three rules to remember: heṇṇumakkaḷa hesaru, bevarina bele, modalu aṅgaḷakke"
  - scene: "Evening. Suresh and Rakshith walk out along the cart track to the dry field. The ragi stubble is pale gold; a new boundary stone, still bright with fresh-cut edges, stands twenty feet from the tamarind tree. Under the tree is Thatha's grave."
  - who: rakshith
    t: "ಅಪ್ಪ, ಅಲ್ಲಿ ನೋಡು — ಹೊಸ ಗಡಿ ಕಲ್ಲು. ಮರದಿಂದ ಇಪ್ಪತ್ತು ಅಡಿ. ಅಜ್ಜಿ ಹೇಳಿದ ಹಾಗೇ."
    tr: "Appa, alli nōḍu — hosa gaḍi kallu. Maradinda ippattu aḍi. Ajji hēḷida hāgē."
    en: "Appa, look there — the new boundary stone. Twenty feet from the tree. Just as Ajji said."
  - who: suresh
    t: "ಹೂಂ. ಒಂದು ಕಲ್ಲು, ಒಂದು ವರ್ಷ. … ಎಳ್ಳು-ಬೆಲ್ಲ ಇಲ್ಲಿಡು, ಸಮಾಧಿ ಮೇಲೆ. ತಾತನಿಗೂ ಒಂದು ಪಾಲು."
    tr: "Hūṁ. Ondu kallu, ondu varṣa. … Eḷḷu-bella illiḍu, samādhi mēle. Tātanigū ondu pālu."
    en: "Hm. One stone, one year. … Put the ellu-bella here, on the grave. A share for Thatha too."
  - who: rakshith
    t: "ಅಪ್ಪ, ಒಂದು ಪ್ರಶ್ನೆ ಕೇಳ್ಲಾ? ನೀನು ನಿನ್ನ ಪಾಲು ಬಿಟ್ಟಿದ್ದಕ್ಕೆ ಯಾವತ್ತಾದ್ರೂ ಪಶ್ಚಾತ್ತಾಪ ಆಗುತ್ತಾ? ಆ ಬ್ರೋಕರ್ ಹೇಳಿದ ಎಪ್ಪತ್ತು ಲಕ್ಷ… ನಮ್ಮ ಮನೆ ಸಾಲ ಒಂದೇ ದಿನದಲ್ಲಿ ಮುಗೀತಿತ್ತು."
    tr: "Appa, ondu praśne kēḷlā? Nīnu ninna pālu biṭṭiddakke yāvattādrū paścāttāpa āguttā? Ā brōkar hēḷida eppattu lakṣa… namma mane sāla ondē dinadalli mugītittu."
    en: "Appa, can I ask you something? Will you ever regret giving up your share? The seventy lakh that broker talked about… our house loan would have been gone in a single day."
  - who: suresh
    t: "ಪ್ರಾಮಾಣಿಕವಾಗಿ ಹೇಳ್ತೀನಿ, ಕಂದ. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಆ ಅಂಕಿ ಕೇಳಿದಾಗ ನನ್ನ ಮನಸ್ಸೂ ಒಂದು ಕ್ಷಣ ಅಲ್ಲಾಡಿತು. ಮನುಷ್ಯ ಅಂದ್ಮೇಲೆ ಆಸೆ ಇರುತ್ತೆ. ಆದ್ರೆ ಈ ವರ್ಷ ನಾನು ಒಂದು ಲೆಕ್ಕ ಕಲಿತೆ — ಬ್ಯಾಂಕಲ್ಲಿ ಇಪ್ಪತ್ತು ವರ್ಷ ಕೆಲಸ ಮಾಡಿದ್ರೂ ಕಲಿಯದ ಲೆಕ್ಕ. ಕೆಲವು ಆಸ್ತಿಗಳನ್ನ ಹಂಚಿದ್ರೆ ಕಮ್ಮಿ ಆಗುತ್ತೆ. ಕೆಲವನ್ನ ಬಿಟ್ಟುಕೊಟ್ರೆ ಜಾಸ್ತಿ ಆಗುತ್ತೆ."
    tr: "Prāmāṇikavāgi hēḷtīni, kanda. Mārc-nalli ā aṅki kēḷidāga nanna manassū ondu kṣaṇa allāḍitu. Manuṣya andmēle āse irutte. Ādre ī varṣa nānu ondu lekka kalite — byāṅkalli ippattu varṣa kelasa māḍidrū kaliyada lekka. Kelavu āstigaḷanna han̄cidre kammi āgutte. Kelavanna biṭṭukoṭre jāsti āgutte."
    en: "I'll tell you honestly, son. In March, when I heard that figure, my mind wavered for a moment too. We're human; there's always desire. But this year I learnt a kind of arithmetic — one that twenty years in a bank never taught me. Some wealth shrinks when you divide it. Some grows when you give it away."
  - who: rakshith
    t: "ಅಂದ್ರೆ?"
    tr: "Andre?"
    en: "Meaning?"
  - who: suresh
    t: "ನೋಡು. ನಾನು ಆ ಒಂದೂಕಾಲು ಎಕರೆ ಇಟ್ಕೊಂಡಿದ್ರೆ ನನ್ನ ಹೆಸರಲ್ಲಿ ಒಂದು ಪಹಣಿ ಇರ್ತಿತ್ತು. ಬಿಟ್ಟುಕೊಟ್ಟೆ — ಈಗ ನನಗೆ ಮತ್ತೆ ಒಬ್ಬ ತಮ್ಮ ಇದಾನೆ, ಒಬ್ಬ ತಂಗಿ ಇದಾಳೆ, ನಿನಗೆ ಒಂದು ಊರು ಇದೆ, ಅವ್ವನಿಗೆ ನೆಮ್ಮದಿ ಇದೆ. ಯಾವ ಉಪನೋಂದಣಾಧಿಕಾರಿಯೂ ಇದನ್ನ ನೋಂದಣಿ ಮಾಡಲ್ಲ. ಆದ್ರೆ ನಿಜವಾದ ಆಸ್ತಿ ಇದೇ."
    tr: "Nōḍu. Nānu ā ondūkālu ekare iṭkoṇḍidre nanna hesaralli ondu pahaṇi irtittu. Biṭṭukoṭṭe — īga nanage matte obba tamma idāne, obba taṅgi idāḷe, ninage ondu ūru ide, avvanige nemmadi ide. Yāva upanōndaṇādhikāriyū idanna nōndaṇi māḍalla. Ādre nijavāda āsti idē."
    en: "Look. If I'd kept that one and a quarter acres, there'd be an RTC in my name. I gave it up — and now I have a brother again, and a sister; you have a village; Avva has peace of mind. No Sub-Registrar will ever register that. But that is the real property."
  - who: rakshith
    t: "ತಾತ ‘ಜಮೀನು ಮಾರಲ್ಲ’ ಅಂತ ಬರೆದಿದ್ರು. ಈಗ ಒಂದೂಕಾಲು ಎಕರೆ ಮಾರ್ತಿದೀವಿ. ತಾತನಿಗೆ ಬೇಜಾರಾಗಲ್ವಾ?"
    tr: "Tāta ‘jamīnu māralla’ anta baredidru. Īga ondūkālu ekare mārtidīvi. Tātanige bējārāgalvā?"
    en: "Thatha wrote 'I will not sell the land'. Now we're selling one and a quarter acres. Wouldn't Thatha be upset?"
  - who: suresh
    t: "ನಾನೂ ಅದನ್ನೇ ಯೋಚನೆ ಮಾಡಿದೆ. ಆಮೇಲೆ ದಿನಚರಿಯ ಇನ್ನೊಂದು ಪುಟ ನೆನಪಾಯ್ತು — ‘ಮಗಳು ಸಂತೋಷವಾಗಿ ಗಂಡನ ಮನೆಗೆ ಹೋದ್ಲು. ಸಾಲ ಮೂರು ವರ್ಷದಲ್ಲಿ ತೀರಿಸ್ತೀನಿ.’ ತಾತ ಜಮೀನು ಉಳಿಸಿದ್ದು ಮಕ್ಕಳಿಗಾಗಿ — ಜಮೀನಿಗಾಗಿ ಮಕ್ಕಳನ್ನ ಕಳ್ಕೊಳ್ಳೋಕೆ ಅಲ್ಲ. ಆ ವ್ಯತ್ಯಾಸ ಅರ್ಥ ಆಗೋಕೆ ನನಗೆ ನಲವತ್ತೈದು ವರ್ಷ ಬೇಕಾಯ್ತು."
    tr: "Nānū adannē yōcane māḍide. Āmēle dinacariya innondu puṭa nenapāytu — ‘Magaḷu santōṣavāgi gaṇḍana manege hōdlu. Sāla mūru varṣadalli tīristīni.’ Tāta jamīnu uḷisiddu makkaḷigāgi — jamīnigāgi makkaḷanna kaḷkoḷḷōke alla. Ā vyatyāsa artha āgōke nanage nalavattaidu varṣa bēkāytu."
    en: "I wondered the same thing. Then I remembered another page of the diary: 'My daughter went happily to her husband's home. I will clear the debt in three years.' Thatha kept the land for his children — not to lose his children for the sake of the land. It took me forty-five years to understand that difference."
  - who: rakshith
    t: "ಅಪ್ಪ, ನಾನು ಕೃಷಿ ಓದ್ಬೇಕು ಅಂತಿದೀನಿ. ಚಿಕ್ಕಪ್ಪನಿಗೆ ಮೊದಲು ಹೇಳ್ದೆ. ನಿನಗೆ ಬೇಜಾರಾಯ್ತಾ — ಇಂಜಿನಿಯರಿಂಗ್ ಅಲ್ಲ ಅಂತ?"
    tr: "Appa, nānu kṛṣi ōdbēku antidīni. Cikkappanige modalu hēḷde. Ninage bējārāytā — iñjiniyariṅg alla anta?"
    en: "Appa, I want to study agriculture. I told Chikkappa first. Are you upset — that it isn't engineering?"
  - who: suresh
    t: "ಬೇಜಾರಾ? … ಸುಮಾರು ಮೂವತ್ತು ವರ್ಷದ ಹಿಂದೆ ನಿಮ್ಮ ತಾತ ಎತ್ತು ಮಾರಿ ನನ್ನನ್ನ ಈ ಊರಿಂದ ಹೊರಗೆ ಓದೋಕೆ ಕಳಿಸಿದ್ರು. ಇವತ್ತು ನನ್ನ ಮಗ ಅದೇ ಊರಿಗೆ ವಾಪಸ್ ಬರೋ ದಾರಿ ಹುಡುಕ್ತಿದಾನೆ. ಇದಕ್ಕಿಂತ ದೊಡ್ಡ ಬಡ್ಡಿ ಯಾವ ಬ್ಯಾಂಕೂ ಕೊಡಲ್ಲ, ಕಂದ."
    tr: "Bējārā? … Sumāru mūvattu varṣada hinde nimma tāta ettu māri nannanna ī ūrinda horage ōdōke kaḷisidru. Ivattu nanna maga adē ūrige vāpas barō dāri huḍuktidāne. Idakkinta doḍḍa baḍḍi yāva byāṅkū koḍalla, kanda."
    en: "Upset? … Nearly thirty years ago your Thatha sold his bullocks to send me out of this village to study. Today my son is looking for the road back to the same village. No bank pays a bigger interest than that, son."
  - who: suresh
    t: "ಕೇಳು, ರಕ್ಷಿತ್. ಒಂದು ದಿನ ನಾನೂ ಇರಲ್ಲ, ನಿಮ್ಮ ಚಿಕ್ಕಪ್ಪನೂ ಇರಲ್ಲ. ಆಗ ಯಾರಾದ್ರೂ ಕಾಗದ ಹಿಡ್ಕೊಂಡು ‘ಇದು ನನ್ನ ಪಾಲು’ ಅಂತ ಬರ್ತಾರೆ — ಅದು ಸಹಜ, ಕಾನೂನು ಕೊಟ್ಟಿರೋ ಹಕ್ಕು. ಆ ದಿನ ಮೂರು ವಿಷಯ ನೆನಪಿಟ್ಕೋ. ಒಂದು: ಹೆಣ್ಣುಮಕ್ಕಳ ಹೆಸರು ಯಾವ ಕಾಗದದಿಂದಲೂ ಬಿಟ್ಟು ಹೋಗಬಾರದು. ಎರಡು: ಮಣ್ಣಲ್ಲಿ ದುಡಿದವನ ಬೆವರಿಗೂ ಒಂದು ಬೆಲೆ ಇದೆ, ಅದು ಯಾವ ಮಾರ್ಗಸೂಚಿ ಬೆಲೆಯಲ್ಲೂ ಇರಲ್ಲ. ಮೂರು: ಮೊದಲು ಕೋರ್ಟಿಗಲ್ಲ, ಅಂಗಳಕ್ಕೆ ಹೋಗು. ಎಲೆ ಹಾಕು, ಎಲ್ಲರನ್ನೂ ಕೂರಿಸು, ಆಮೇಲೆ ಮಾತಾಡು."
    tr: "Kēḷu, Rakṣit. Ondu dina nānū iralla, nimma cikkappanū iralla. Āga yārādrū kāgada hiḍkoṇḍu ‘idu nanna pālu’ anta bartāre — adu sahaja, kānūnu koṭṭirō hakku. Ā dina mūru viṣaya nenapiṭkō. Ondu: heṇṇumakkaḷa hesaru yāva kāgadadindalū biṭṭu hōgabāradu. Eraḍu: maṇṇalli duḍidavana bevarigū ondu bele ide, adu yāva mārgasūci beleyallū iralla. Mūru: modalu kōrṭigalla, aṅgaḷakke hōgu. Ele hāku, ellarannū kūrisu, āmēle mātāḍu."
    en: "Listen, Rakshith. One day I won't be here, and nor will your Chikkappa. Then someone will come holding a paper and saying 'this is my share' — that's natural; it's a right the law has given. On that day, remember three things. One: no daughter's name must ever be left off any paper. Two: the sweat of the one who toiled in the soil has a value too, and you won't find it in any guidance value. Three: go first not to the court, but to the yard. Lay the leaves, sit everyone down, and then talk."
  - who: rakshith
    t: "ಮೂರನೇದು ಅಜ್ಜಿಯ ಕಾನೂನು."
    tr: "Mūranēdu ajjiya kānūnu."
    en: "The third one is Ajji's law."
  - who: suresh
    t: "ಹೌದು. ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಅದೇ ಸುಪ್ರೀಂ ಕೋರ್ಟು. … ನಡಿ, ಕತ್ತಲಾಗ್ತಿದೆ. ಕಾವೇರಿಗೆ ಹುಲ್ಲು ಹಾಕೋ ಸಮಯ. ನಾಳೆ ಬೆಂಗಳೂರಿಗೆ ಹೊರಡೋ ಮುಂಚೆ ಒಂದ್ಸಲ ಗದ್ದೆಗೆ ಹೋಗಿ ಬರೋಣ — ಮಹದೇವ ಹೊಸ ಕೂಳೆಗೆ ನೀರು ಕಟ್ಟಬೇಕಂತೆ."
    tr: "Haudu. Namma maneyalli adē suprīm kōrṭu. … Naḍi, kattalāgtide. Kāvērige hullu hākō samaya. Nāḷe Beṅgaḷūrige horaḍō mun̄ce ondsala gaddege hōgi barōṇa — Mahadēva hosa kūḷege nīru kaṭṭabēkante."
    en: "Yes. In our house, that's the Supreme Court. … Come on, it's getting dark. Time to give Kaveri her hay. Tomorrow, before we leave for Bengaluru, let's go to the wet land once — Mahadeva says the new ratoon needs watering."
  - scene: "They walk back along the cart track as the sun sets over the cane. Behind them, on the grave under the tamarind tree, lies a small heap of ellu-bella. Ahead, in the yard, Avva has lit the lamp before Thatha's photograph; Shobha and Mahadeva are arguing cheerfully over how much sugar goes in the coffee."
  - who: avva
    t: "ಬಂದ್ರಾ? ಕೈಕಾಲು ತೊಳ್ಕೊಂಡು ಬನ್ನಿ, ಎಲ್ರೂ ಒಟ್ಟಿಗೆ ಕಾಫಿ ಕುಡಿಯೋಣ. … ನೋಡಿ — ಒಂದು ವರ್ಷದ ಮೇಲೆ ಈ ಮನೆ ಮತ್ತೆ ತುಂಬಿದೆ."
    tr: "Bandrā? Kaikālu toḷkoṇḍu banni, ellrū oṭṭige kāphi kuḍiyōṇa. … Nōḍi — ondu varṣada mēle ī mane matte tumbide."
    en: "You're back? Wash your hands and feet and come; let's all have coffee together. … Look — after a whole year, this house is full again."
