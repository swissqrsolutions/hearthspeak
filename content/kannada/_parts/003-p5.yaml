lines:
  - chapter: "Chapter 8 — The first weeks"
  - section: "🌙 Three in the morning"
    learn: "dative experiencer: nange nōvāgtide, avaḷige hasivu · hālu kuḍisu (to feed milk) · causative tēgu barisu (to burp a baby) · cīpu (to suckle) · odde (wet) · counting ḍaipars"
  - scene: "Day five after the birth: Sunday, 15 November, three in the morning, the first night home at the Rao house in Jayanagar. The baby has been crying for an hour. Shwetha sits propped up on pillows, one hand pressed to her stomach where the stitches are. Pradeep, who stayed the night, is asleep in a chair."
  - { who: shwe, t: "ಪ್ರದೀಪ್, ಏಳು. ಇವಳು ಒಂದು ಗಂಟೆಯಿಂದ ಅಳ್ತಾನೇ ಇದ್ದಾಳೆ. ನಂಗೆ ಏನು ಮಾಡ್ಬೇಕು ಅಂತಾನೇ ಗೊತ್ತಾಗ್ತಿಲ್ಲ.", tr: "Pradīp, ēḷu. Ivaḷu ondu gaṇṭeyinda aḷtānē iddāḷe. Nange ēnu māḍbēku antānē gottāgtilla.", en: "Pradeep, get up. She's been crying for an hour. I just don't know what to do." }
  - { who: pradeep, t: "ಹಾ… ಹಾ, ಎದ್ದೆ. ಹಸಿವಾಗಿರಬಹುದಾ? ಈಗ ತಾನೇ ಹಾಲು ಕುಡಿಸಿದ್ಯಲ್ಲಾ?", tr: "Hā… hā, edde. Hasivāgirabahudā? Īga tānē hālu kuḍisidyallā?", en: "Huh... yes, I'm up. Could she be hungry? Didn't you just feed her?" }
  - { who: shwe, t: "ಕುಡಿಸೋಕೆ ಟ್ರೈ ಮಾಡಿದೆ. ಸರಿಯಾಗಿ ಹಿಡ್ಕೊಳ್ತಿಲ್ಲ. ಎರಡು ನಿಮಿಷ ಚೀಪ್ತಾಳೆ, ಆಮೇಲೆ ಬಿಟ್ಟು ಮತ್ತೆ ಅಳ್ತಾಳೆ. ನಂಗೆ ತುಂಬಾ ನೋವಾಗ್ತಿದೆ.", tr: "Kuḍisōke ṭrai māḍide. Sariyāgi hiḍkoḷtilla. Eraḍu nimiṣa cīptāḷe, āmēle biṭṭu matte aḷtāḷe. Nange tumbā nōvāgtide.", en: "I tried to feed her. She isn't latching properly. She sucks for two minutes, then lets go and cries again. It hurts me so much." }
  - { who: pradeep, t: "ಹೊಲಿಗೆ ನೋವಾ, ಇಲ್ಲಾ…?", tr: "Holige nōvā, illā…?", en: "Is it the stitches hurting, or...?" }
  - { who: shwe, t: "ಎರಡೂ. ಕೂತ್ಕೊಂಡ್ರೆ ಹೊಟ್ಟೆ ಎಳೆಯುತ್ತೆ, ಅವಳು ಕುಡಿಯೋವಾಗ ಎದೆ ಉರಿಯುತ್ತೆ. ಹಾಲು ಸಾಕಾಗ್ತಿಲ್ವೇನೋ ಅನ್ಸುತ್ತೆ. ನಾನು ಸರಿಯಾದ ಅಮ್ಮ ಅಲ್ಲ ಅನ್ಸುತ್ತೆ.", tr: "Eraḍū. Kūtkoṇḍre hoṭṭe eḷeyutte, avaḷu kuḍiyōvāga ede uriyutte. Hālu sākāgtilvēnō ansutte. Nānu sariyāda amma alla ansutte.", en: "Both. When I sit, my stomach pulls; when she feeds, my breast burns. I feel the milk isn't enough. I feel like I'm not a proper mother." }
  - { who: pradeep, t: "ಹಾಗೆಲ್ಲಾ ಹೇಳ್ಬೇಡ. ಐದು ದಿನ ಆಗಿದೆ ಅಷ್ಟೇ. ಅವಳಿಗೂ ಹೊಸದು, ನಿಂಗೂ ಹೊಸದು, ನಂಗಂತೂ ಎಲ್ಲಾ ಹೊಸದು. ಇರು, ಅತ್ತೆನ ಎಬ್ಬಿಸ್ತೀನಿ.", tr: "Hāgellā hēḷbēḍa. Aidu dina āgide aṣṭē. Avaḷigū hosadu, ningū hosadu, nangantū ellā hosadu. Iru, attena ebbistīni.", en: "Don't say things like that. It's only been five days. It's new for her, new for you, and for me everything is new. Wait, I'll wake your mother." }
  - scene: "Before he reaches the door, Amma comes in, hair loose, a shawl around her shoulders."
  - { who: amma, t: "ನಾನು ಎದ್ದೇ ಇದ್ದೆ, ಅಳು ಕೇಳ್ತಿತ್ತು. ಕೊಡು ಇಲ್ಲಿ. ಮೊದಲು ತೇಗು ಬರಿಸೋಣ. ಹೊಟ್ಟೆಯಲ್ಲಿ ಗಾಳಿ ಇದ್ರೂ ಮಕ್ಕಳು ಹೀಗೇ ಅಳ್ತಾರೆ.", tr: "Nānu eddē idde, aḷu kēḷtittu. Koḍu illi. Modalu tēgu barisōṇa. Hoṭṭeyalli gāḷi idrū makkaḷu hīgē aḷtāre.", en: "I was already up, I could hear the crying. Give her here. Let's burp her first. Babies cry like this even when there's just air in the tummy." }
  - scene: "Amma lays the baby against her shoulder and pats her back. A small burp. The crying softens into hiccups."
  - { who: amma, t: "ನೋಡಿದ್ಯಾ? ಈಗ ಕೇಳು, ಶ್ವೇತಾ. ಮಗುನ ಹೊಟ್ಟೆಗೆ ಹೊಟ್ಟೆ ತಾಗೋ ಹಾಗೆ ಹತ್ತಿರ ಹಿಡ್ಕೋ. ಬಾಯಿ ದೊಡ್ಡದಾಗಿ ತೆಗೆದಾಗ ತಕ್ಷಣ ಎಳ್ಕೋ. ಬರೀ ತುದಿ ಹಿಡ್ಕೊಂಡ್ರೆ ನಿಂಗೆ ನೋವು, ಅವಳಿಗೆ ಹಾಲು ಬರಲ್ಲ.", tr: "Nōḍidyā? Īga kēḷu, Shwētā. Maguna hoṭṭege hoṭṭe tāgō hāge hattira hiḍkō. Bāyi doḍḍadāgi tegedāga takṣaṇa eḷkō. Barī tudi hiḍkoṇḍre ninge nōvu, avaḷige hālu baralla.", en: "See? Now listen, Shwetha. Hold the baby close, tummy to tummy. When she opens her mouth wide, bring her in quickly. If she only takes the tip, it hurts you and she gets no milk." }
  - { who: shwe, t: "ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ನರ್ಸ್ ಕೂಡ ಇದನ್ನೇ ಹೇಳಿದ್ರು. ಅಲ್ಲಿ ಸುಲಭ ಅನ್ನಿಸ್ತು. ಇಲ್ಲಿ ರಾತ್ರಿ ಮೂರು ಗಂಟೆಗೆ ಎಲ್ಲಾ ಮರೆತು ಹೋಗುತ್ತೆ.", tr: "Āspatreyalli nars kūḍa idannē hēḷidru. Alli sulabha annistu. Illi rātri mūru gaṇṭege ellā maretu hōgutte.", en: "The nurse at the hospital said exactly this. There it seemed easy. Here, at three in the morning, I forget everything." }
  - { who: amma, t: "ಎಲ್ರಿಗೂ ಹಾಗೇ ಆಗುತ್ತೆ ಕಣೇ. ನೀನು ಹುಟ್ಟಿದಾಗ ಮೊದಲ ವಾರ ಪೂರ್ತಿ ನಾನು ಅಳ್ತಾನೇ ಇದ್ದೆ. ಹಾಲು ಸರಿಯಾಗಿ ಬರೋಕೆ ಮೂರು-ನಾಲ್ಕು ದಿನ ಬೇಕು. ಮಗು ಚೀಪಿದಷ್ಟೂ ಜಾಸ್ತಿ ಬರುತ್ತೆ.", tr: "Elrigū hāgē āgutte kaṇē. Nīnu huṭṭidāga modala vāra pūrti nānu aḷtānē idde. Hālu sariyāgi barōke mūru-nālku dina bēku. Magu cīpidaṣṭū jāsti barutte.", en: "It happens to everyone, dear. When you were born, I cried the whole first week. The milk needs three or four days to come in properly. The more the baby suckles, the more comes." }
  - { who: pradeep, t: "ಸ್ವಲ್ಪ ಡಬ್ಬಿ ಹಾಲು ಕೊಡೋಣ್ವಾ? ಇವಳ ಹೊಟ್ಟೆ ತುಂಬ್ಲಿ, ಶ್ವೇತಾ ಸ್ವಲ್ಪ ಮಲಗ್ಲಿ.", tr: "Svalpa ḍabbi hālu koḍōṇvā? Ivaḷa hoṭṭe tumbli, Shwētā svalpa malagli.", en: "Shall we give her a little formula? Let her tummy fill up, and let Shwetha sleep a bit." }
  - { who: amma, t: "ಡಾಕ್ಟ್ರನ್ನ ಕೇಳದೆ ಬೇಡ. ಮಗು ದಿನಕ್ಕೆ ಆರು-ಏಳು ಸಲ ಒದ್ದೆ ಮಾಡ್ತಿದ್ರೆ ಹಾಲು ಸಾಕಾಗ್ತಿದೆ ಅಂತ ಅರ್ಥ ಅಂತ ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ರು. ಇವತ್ತು ಎಷ್ಟು ಡೈಪರ್ ಆಯ್ತು?", tr: "Ḍākṭranna kēḷade bēḍa. Magu dinakke āru-ēḷu sala odde māḍtidre hālu sākāgtide anta artha anta ḍākṭru hēḷidru. Ivattu eṣṭu ḍaipar āytu?", en: "Not without asking the doctor. The doctor said if the baby wets six or seven times a day, it means the milk is enough. How many diapers today?" }
  - { who: pradeep, t: "ಒಂದು ನಿಮಿಷ, ಫೋನ್‌ನಲ್ಲಿ ಬರೆದಿಟ್ಟಿದ್ದೀನಿ. ಬೆಳಿಗ್ಗೆಯಿಂದ ಏಳು ಸಲ ಒದ್ದೆ, ಎರಡು ಸಲ ಕಕ್ಕ. ಟೈಮ್ ಸಮೇತ.", tr: "Ondu nimiṣa, phōn-nalli barediṭṭiddīni. Beḷiggeyinda ēḷu sala odde, eraḍu sala kakka. Ṭaim samēta.", en: "(with a tired smile) One minute, I've noted it on my phone. Since morning, seven wet, two dirty. With the times." }
  - { who: amma, t: "ಇಂಜಿನಿಯರ್ ಅಳಿಯ ಅಂದ್ರೆ ಹೀಗೇ! ಸರಿ, ಹಾಲು ಸಾಕಾಗ್ತಿದೆ. ಈಗ ಇನ್ನೊಂದು ಸಲ ಪ್ರಯತ್ನ ಮಾಡು. ನಾನು ಇಲ್ಲೇ ಕೂತಿರ್ತೀನಿ.", tr: "Iñjiniyar aḷiya andre hīgē! Sari, hālu sākāgtide. Īga innondu sala prayatna māḍu. Nānu illē kūtirtīni.", en: "That's an engineer son-in-law for you! Fine, the milk is enough. Now try once more. I'll sit right here." }
  - scene: "This time the baby latches. For a while the only sound is small, steady swallowing. Shwetha leans her head back, tears on her face, half laughing."
  - { who: shwe, t: "ಕುಡೀತಿದ್ದಾಳೆ… ಅಮ್ಮಾ, ಕುಡೀತಿದ್ದಾಳೆ.", tr: "Kuḍītiddāḷe… Ammā, kuḍītiddāḷe.", en: "She's drinking... Amma, she's drinking." }

  - section: "🛁 Ajji's rules"
    learn: "bāṇantana words: bāṇanti, bisinīru snāna, sabbasige, eṇṇe haccu, uṣṇa / tampu · prohibitions -bāradu / -bēḍa · reported speech -ante (apparently) · bāyārike (thirst)"
  - scene: "Day six, mid-morning. Ajji sits in her chair in the hall with her pill box. Amma brings Shwetha a plate: dill rasam, garlic, rice with ghee. Kiran is on the sofa with his laptop. The ceiling fan is on."
  - { who: ajji, t: "ಶ್ವೇತಾ, ತಲೆಗೆ ಬಟ್ಟೆ ಯಾಕೆ ಕಟ್ಟಿಲ್ಲ? ಕಿವಿಗೆ ಹತ್ತಿ ಇಟ್ಕೋ. ಬಾಣಂತಿಗೆ ಗಾಳಿ ಸೋಕಬಾರದು. ಕಿರಣ್, ಫ್ಯಾನ್ ಆಫ್ ಮಾಡು.", tr: "Shwētā, talege baṭṭe yāke kaṭṭilla? Kivige hatti iṭkō. Bāṇantige gāḷi sōkabāradu. Kiraṇ, fyān āph māḍu.", en: "Shwetha, why haven't you tied a cloth round your head? Put cotton in your ears. A new mother mustn't be touched by the wind. Kiran, switch off the fan." }
  - { who: kiran, t: "ಅಜ್ಜಿ, ಹೊರಗೆ ಇಪ್ಪತ್ತೆಂಟು ಡಿಗ್ರಿ ಇದೆ. ಅಕ್ಕ ಬೆವರ್ತಿದ್ದಾಳೆ.", tr: "Ajji, horage ippatteṇṭu ḍigri ide. Akka bevartiddāḷe.", en: "Ajji, it's twenty-eight degrees outside. Akka is sweating." }
  - { who: ajji, t: "ಬೆವರಲಿ. ಬೆವರಿದ್ರೆ ಒಳ್ಳೇದು. ನಾವೆಲ್ಲಾ ಮೂರು ತಿಂಗಳು ಕೋಣೆಯಿಂದ ಹೊರಗೆ ಬರ್ತಿರಲಿಲ್ಲ. ದಿನಾ ಮೈಗೆ ಎಣ್ಣೆ, ಸುಡೋ ಬಿಸಿನೀರು ಸ್ನಾನ. ಅದಕ್ಕೇ ಈ ವಯಸ್ಸಲ್ಲೂ ನನ್ನ ಸೊಂಟ ಗಟ್ಟಿ ಇದೆ.", tr: "Bevarali. Bevaridre oḷḷēdu. Nāvellā mūru tingaḷu kōṇeyinda horage bartiralilla. Dinā maige eṇṇe, suḍō bisinīru snāna. Adakkē ī vayassallū nanna soṇṭa gaṭṭi ide.", en: "Let her sweat. Sweating is good. We didn't come out of the room for three months. Oil on the body every day and a scalding hot bath. That's why my back is still strong at this age." }
  - { who: amma, t: "ಅತ್ತೆ, ಸ್ನಾನದ ವಿಷಯದಲ್ಲಿ ನಾನೂ ನಿಮ್ ಕಡೆನೇ. ಆದ್ರೆ ಇವಳಿಗೆ ಆಪರೇಷನ್ ಆಗಿದೆ. ಹೊಟ್ಟೆ ಮೇಲೆ ಹೊಲಿಗೆ ಇದೆ. ಸುಡೋ ನೀರು, ಎಣ್ಣೆ ಮಸಾಜ್ ಎಲ್ಲಾ ಅಲ್ಲಿಗೆ ಬೇಡ ಅಂತ ನರ್ಸ್ ಹೇಳಿದ್ರು.", tr: "Atte, snānada viṣayadalli nānū nim kaḍenē. Ādre ivaḷige āparēṣan āgide. Hoṭṭe mēle holige ide. Suḍō nīru, eṇṇe masāj ellā allige bēḍa anta nars hēḷidru.", en: "Atte, on the bath I'm on your side too. But she's had an operation. There are stitches on her stomach. The nurse said no scalding water or oil massage there." }
  - { who: ajji, t: "ಹೊಲಿಗೆ ಮೇಲೆ ಯಾರು ಎಣ್ಣೆ ಹಾಕ್ತಾರೆ? ಬೆನ್ನಿಗೆ, ಕಾಲಿಗೆ ಹಚ್ಚೋಣ. ಮತ್ತೆ ನೀರು ಜಾಸ್ತಿ ಕುಡೀಬೇಡ, ಹೊಟ್ಟೆ ಬರುತ್ತೆ. ಬಿಸಿ ಬಿಸಿ ಸಬ್ಬಸಿಗೆ ಸಾರು, ಬೆಳ್ಳುಳ್ಳಿ, ತುಪ್ಪದ ಅನ್ನ. ಮೊಸರು, ಹಣ್ಣು ತಂಪು, ಬೇಡ.", tr: "Holige mēle yāru eṇṇe hāktāre? Bennige, kālige haccōṇa. Matte nīru jāsti kuḍībēḍa, hoṭṭe barutte. Bisi bisi sabbasige sāru, beḷḷuḷḷi, tuppada anna. Mosaru, haṇṇu tampu, bēḍa.", en: "Who puts oil on stitches? We'll rub it on her back and legs. And don't drink much water, you'll get a belly. Piping hot dill rasam, garlic, rice with ghee. Curd and fruit are cooling — no." }
  - { who: shwe, t: "ಅಜ್ಜಿ, ನಂಗೆ ತುಂಬಾ ಬಾಯಾರಿಕೆ ಆಗ್ತಿದೆ. ಹಾಲು ಕೊಡೋವಾಗ ಬಾಯಿ ಒಣಗಿ ಹೋಗುತ್ತೆ. ಒಂದು ಲೋಟ ನೀರಿಗೂ ಪರ್ಮಿಷನ್ ಬೇಕಾ?", tr: "Ajji, nange tumbā bāyārike āgtide. Hālu koḍōvāga bāyi oṇagi hōgutte. Ondu lōṭa nīrigū parmiṣan bēkā?", en: "Ajji, I'm so thirsty. My mouth goes dry when I'm feeding. Do I need permission even for a glass of water?" }
  - scene: "Vimala Aunty appears at the open door with a steel box."
  - { who: vimala, t: "ಬಾಗಿಲು ತೆಗೆದೇ ಇತ್ತು, ನಾನೇ ಒಳಗೆ ಬಂದೆ! ಬಾಣಂತಿಗೆ ಅಂಟಿನ ಉಂಡೆ ತಂದಿದ್ದೀನಿ. ನಮ್ ಸೊಸೆಗೂ ಇದನ್ನೇ ಮಾಡಿದ್ದೆ, ಎರಡು ತಿಂಗಳಲ್ಲಿ ಮೈ ತುಂಬ್ಕೊಂಡ್ಳು.", tr: "Bāgilu tegedē ittu, nānē oḷage bande! Bāṇantige aṇṭina uṇḍe tandiddīni. Nam sosegū idannē māḍidde, eraḍu tingaḷalli mai tumbkoṇḍḷu.", en: "The door was open, so I came straight in! I've brought gum laddus for the new mother. I made the same for my daughter-in-law — in two months she'd filled out nicely." }
  - { who: vimala, t: "ಆದ್ರೆ ಒಂದು ವಿಷಯ ಕೇಳಿ. ನೀರು ಕೊಡಬೇಡಿ ಅಂತ ನಮ್ಮತ್ತೆನೂ ಹೇಳ್ತಿದ್ರು. ಆಮೇಲೆ ನಮ್ ಸೊಸೆಯ ಡಾಕ್ಟ್ರು ಚೆನ್ನಾಗಿ ಬೈದ್ರಂತೆ, ನೀರು ಕಮ್ಮಿ ಆದ್ರೆ ಹಾಲು ಕಮ್ಮಿ ಆಗುತ್ತೆ ಅಂತ. ಈಗಿನ ಕಾಲ ಬೇರೆ, ಸರಸ್ವತಮ್ಮ.", tr: "Ādre ondu viṣaya kēḷi. Nīru koḍabēḍi anta nammattenū hēḷtidru. Āmēle nam soseya ḍākṭru cennāgi baidrante, nīru kammi ādre hālu kammi āgutte anta. Īgina kāla bēre, Sarasvatamma.", en: "But listen to this. My mother-in-law also used to say don't give water. Then apparently my daughter-in-law's doctor gave them a proper scolding — said less water means less milk. Times are different now, Saraswathamma." }
  - { who: ajji, t: "ಹೂಂ. ನಾಳೆ ಉಷಾ ಡಾಕ್ಟ್ರ ಹತ್ರ ಹೋಗ್ತೀರಲ್ಲ? ನಾನೂ ಬರ್ತೀನಿ. ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳ್ತೀನಿ.", tr: "Hūṃ. Nāḷe Uṣā ḍākṭra hatra hōgtīralla? Nānū bartīni. Avara bāyindalē kēḷtīni.", en: "Hm. You're going to Dr. Usha tomorrow, aren't you? I'm coming too. I'll hear it from her own mouth." }

  - section: "🩺 Dr. Usha: stitches, water and tears"
    learn: "wound care: holige, gāya, kīvu, jvara, hepputaṭṭu (clot) · -bahudu vs -bāradu · polite disagreement: nimma anubhava mukhya, ādre… · talking about feelings: kāraṇa illade aḷu baratte"
  - scene: "Day seven. Dr. Usha Rao's clinic, the post-operative check. Pradeep waits outside with the baby. Shwetha comes in with Amma and, slowly, Ajji."
  - { who: gyn, t: "ಬನ್ನಿ ಶ್ವೇತಾ. ಅಜ್ಜಿನೂ ಬಂದಿದ್ದಾರಾ! ಹಾರ್ಟ್ ಹೇಗಿದೆ ಅಜ್ಜಿ? ಮರಿಮೊಮ್ಮಗಳ ಮುಖ ನೋಡಿ ಬಿಪಿ ಸರಿಹೋಗಿರಬೇಕು.", tr: "Banni Shwētā. Ajjinū bandiddārā! Hārṭ hēgide ajji? Marimommagaḷa mukha nōḍi bi-pi sarihōgirabēku.", en: "Come in, Shwetha. Ajji has come too! How's the heart, Ajji? Seeing your great-granddaughter's face must have fixed your BP." }
  - { who: ajji, t: "ನೋಡಿದ್ದೀನಿ ಡಾಕ್ಟ್ರೇ, ದೂರದಿಂದ. ಎತ್ಕೊಳ್ಳೋಕೆ ಇನ್ನೂ ಧೈರ್ಯ ಬಂದಿಲ್ಲ.", tr: "Nōḍiddīni ḍākṭrē, dūradinda. Etkoḷḷōke innū dhairya bandilla.", en: "I've seen her, doctor — from a distance. I still haven't found the courage to hold her." }
  - { who: gyn, t: "ಹೊಲಿಗೆ ನೋಡೋಣ, ಮಲಗಿ… ಚೆನ್ನಾಗಿ ಒಣಗ್ತಿದೆ. ಕೆಂಪಾಗಿಲ್ಲ, ಕೀವು ಇಲ್ಲ. ಇವು ಕರಗೋ ಹೊಲಿಗೆ, ತೆಗೆಯೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ.", tr: "Holige nōḍōṇa, malagi… Cennāgi oṇagtide. Kempāgilla, kīvu illa. Ivu karagō holige, tegeyō avaśyakate illa.", en: "Let's look at the stitches — lie down... It's drying nicely. No redness, no pus. These are dissolving stitches; there's no need to remove them." }
  - { who: shwe, t: "ಡಾಕ್ಟ್ರೇ, ಕೆಮ್ಮಿದ್ರೂ, ನಕ್ಕರೂ ನೋವಾಗುತ್ತೆ. ಒಳಗೆ ಏನಾದ್ರೂ ಬಿಚ್ಚಿ ಹೋಗುತ್ತಾ ಅಂತ ಭಯ.", tr: "Ḍākṭrē, kemmidrū, nakkarū nōvāgutte. Oḷage ēnādrū bicci hōguttā anta bhaya.", en: "Doctor, it hurts even when I cough or laugh. I'm scared something inside will come open." }
  - { who: gyn, t: "ಆ ಭಯ ಎಲ್ರಿಗೂ ಇರುತ್ತೆ. ಕೆಮ್ಮುವಾಗ ಒಂದು ದಿಂಬು ಹೊಟ್ಟೆಗೆ ಒತ್ತಿ ಹಿಡ್ಕೊಳ್ಳಿ. ಆರು ವಾರ ಭಾರ ಎತ್ತಬಾರದು, ಮಗುವಿಗಿಂತ ಭಾರ ಏನೂ ಬೇಡ. ಆದ್ರೆ ಮಲಗೇ ಇರಬಾರದು. ದಿನಾ ಮನೇಲೇ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ನಡೀಬೇಕು, ಇಲ್ಲಾಂದ್ರೆ ಕಾಲಲ್ಲಿ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟೋ ಅಪಾಯ ಇರುತ್ತೆ.", tr: "Ā bhaya elrigū irutte. Kemmuvāga ondu dimbu hoṭṭege otti hiḍkoḷḷi. Āru vāra bhāra ettabāradu, maguviginta bhāra ēnū bēḍa. Ādre malagē irabāradu. Dinā manēlē svalpa svalpa naḍībēku, illāndre kālalli rakta heppugaṭṭō apāya irutte.", en: "Everyone has that fear. When you cough, press a pillow to your stomach. For six weeks, no lifting — nothing heavier than the baby. But you mustn't just lie down either. Walk a little every day at home, otherwise there's a risk of blood clots in the legs." }
  - { who: gyn, t: "ಜ್ವರ ಬಂದ್ರೆ, ಹೊಲಿಗೆಯಿಂದ ಕೀವು ಅಥವಾ ವಾಸನೆ ಬಂದ್ರೆ, ಬ್ಲೀಡಿಂಗ್ ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಜಾಸ್ತಿ ಆದ್ರೆ, ಅಥವಾ ಒಂದು ಕಾಲು ಊದ್ಕೊಂಡು ನೋವಾದ್ರೆ, ಕಾಯಬೇಡಿ. ತಕ್ಷಣ ಫೋನ್ ಮಾಡಿ.", tr: "Jvara bandre, holigeyinda kīvu athavā vāsane bandre, blīḍiṅg iddakkiddante jāsti ādre, athavā ondu kālu ūdkoṇḍu nōvādre, kāyabēḍi. Takṣaṇa phōn māḍi.", en: "If you get a fever, if there's pus or a smell from the stitches, if the bleeding suddenly gets heavier, or if one leg swells and hurts — don't wait. Call immediately." }
  - { who: amma, t: "ಡಾಕ್ಟ್ರೇ, ಸ್ನಾನದ ಬಗ್ಗೆ ಕೇಳ್ಬೇಕಿತ್ತು. ನಮ್ ಮನೇಲಿ ಬಾಣಂತಿಗೆ ಬಿಸಿನೀರು ಸ್ನಾನ, ಎಣ್ಣೆ ಹಚ್ಚೋದು ಎಲ್ಲಾ ಪದ್ಧತಿ. ಮಾಡ್ಬಹುದಾ?", tr: "Ḍākṭrē, snānada bagge kēḷbēkittu. Nam manēli bāṇantige bisinīru snāna, eṇṇe haccōdu ellā paddhati. Māḍbahudā?", en: "Doctor, I wanted to ask about bathing. In our house a hot bath and oil for the new mother are the custom. Can we do it?" }
  - { who: gyn, t: "ಮಾಡ್ಬಹುದು. ಹದವಾದ ಬಿಸಿನೀರು, ಸುಡೋದು ಬೇಡ. ಹೊಲಿಗೆ ಮೇಲೆ ಸೋಪ್ ನೀರು ಹರಿದು ಹೋದ್ರೆ ತೊಂದರೆ ಇಲ್ಲ, ಆದ್ರೆ ಉಜ್ಜಬಾರದು. ಆಮೇಲೆ ಮೆತ್ತಗೆ ಒತ್ತಿ ಒಣಗಿಸಿ. ಬೆನ್ನಿಗೆ, ಕಾಲಿಗೆ ಎಣ್ಣೆ ಮಸಾಜ್ ಒಳ್ಳೇದೇ. ಹೊಟ್ಟೆ ಮೇಲೆ ಮಾತ್ರ ಬೇಡ.", tr: "Māḍbahudu. Hadavāda bisinīru, suḍōdu bēḍa. Holige mēle sōp nīru haridu hōdre tondare illa, ādre ujjabāradu. Āmēle mettage otti oṇagisi. Bennige, kālige eṇṇe masāj oḷḷēdē. Hoṭṭe mēle mātra bēḍa.", en: "You can. Comfortably warm water, not scalding. Soapy water running over the stitches is fine, but don't scrub. Then pat it dry gently. An oil massage on the back and legs is good. Just not on the stomach." }
  - { who: ajji, t: "ನೀರಿನ ವಿಷಯ ಏನು? ನಮ್ ಕಾಲದಲ್ಲಿ ಬಾಣಂತಿಗೆ ಲೋಟದಲ್ಲಿ ಅಳೆದು ಕೊಡ್ತಿದ್ವಿ. ಜಾಸ್ತಿ ಕುಡಿದ್ರೆ ಹೊಟ್ಟೆ ಬರುತ್ತೆ, ಗಾಯ ಒಣಗಲ್ಲ ಅಂತಿದ್ರು.", tr: "Nīrina viṣaya ēnu? Nam kāladalli bāṇantige lōṭadalli aḷedu koḍtidvi. Jāsti kuḍidre hoṭṭe barutte, gāya oṇagalla antidru.", en: "And the water? In our day we measured it out to the new mother by the glass. They said if she drank a lot she'd get a belly and the wound wouldn't dry." }
  - { who: gyn, t: "ಅಜ್ಜಿ, ನಿಮ್ಮ ಕಾಲದ ಬಾಣಂತಿಯರು ಎಷ್ಟು ಕಷ್ಟಪಟ್ರು ಅಂತ ನಂಗೆ ಗೊತ್ತು. ಆದ್ರೆ ಈ ಒಂದು ವಿಷಯದಲ್ಲಿ ನಾನು ಒಪ್ಪಲ್ಲ. ಹಾಲು ಚೆನ್ನಾಗಿ ಬರ್ಬೇಕು ಅಂದ್ರೆ ಬಾಣಂತಿ ನೀರು ಚೆನ್ನಾಗಿ ಕುಡೀಬೇಕು, ದಿನಕ್ಕೆ ಎರಡೂವರೆ-ಮೂರು ಲೀಟರ್. ನೀರು ಕಮ್ಮಿ ಆದ್ರೆ ಮಲಬದ್ಧತೆ, ಯೂರಿನ್ ಇನ್ಫೆಕ್ಷನ್, ಹೊಲಿಗೆ ಮೇಲೆ ಒತ್ತಡ, ಎಲ್ಲಾ ಬರುತ್ತೆ.", tr: "Ajji, nimma kālada bāṇantiyaru eṣṭu kaṣṭapaṭru anta nange gottu. Ādre ī ondu viṣayadalli nānu oppalla. Hālu cennāgi barbēku andre bāṇanti nīru cennāgi kuḍībēku, dinakke eraḍūvare-mūru līṭar. Nīru kammi ādre malabaddhate, yūrin inphekṣan, holige mēle ottaḍa, ellā barutte.", en: "Ajji, I know how much new mothers suffered in your day. But on this one point I don't agree. If the milk is to come well, the new mother must drink plenty of water — two and a half to three litres a day. Too little water brings constipation, urine infections, strain on the stitches, all of it." }
  - { who: ajji, t: "ಹಾಗಾದ್ರೆ ತಣ್ಣೀರು ಬೇಡ. ಕಾಯಿಸಿ ಆರಿಸಿದ ಬೆಚ್ಚಗಿನ ನೀರು. ಅದನ್ನಾದ್ರೂ ಒಪ್ತೀರಾ?", tr: "Hāgādre taṇṇīru bēḍa. Kāyisi ārisida beccagina nīru. Adannādrū optīrā?", en: "Then not cold water. Boiled and cooled, lukewarm. Will you at least agree to that?" }
  - { who: gyn, t: "ಸಂತೋಷವಾಗಿ ಒಪ್ತೀನಿ! ಸಬ್ಬಸಿಗೆ, ಮೆಂತ್ಯ, ಬೆಳ್ಳುಳ್ಳಿ, ತುಪ್ಪ ಎಲ್ಲಾ ಕೊಡಿ, ಒಳ್ಳೇದು. ಜೊತೆಗೆ ಹಣ್ಣು, ಮೊಸರು, ಬೇಳೆ, ಮೊಳಕೆ ಕಾಳು ತಿಂದ್ರೆ ಇನ್ನೂ ಒಳ್ಳೇದು. ಐರನ್, ಕ್ಯಾಲ್ಸಿಯಂ ಮಾತ್ರೆ ಮೂರು ತಿಂಗಳು ಮುಂದುವರಿಸಿ.", tr: "Santōṣavāgi optīni! Sabbasige, mentya, beḷḷuḷḷi, tuppa ellā koḍi, oḷḷēdu. Jotege haṇṇu, mosaru, bēḷe, moḷake kāḷu tindre innū oḷḷēdu. Airan, kyālsiyam mātre mūru tingaḷu munduvarisi.", en: "(smiling) Gladly! Give her dill, fenugreek, garlic, ghee — all good. If she also eats fruit, curd, dal and sprouts, even better. Continue the iron and calcium tablets for three months." }
  - { who: amma, t: "ಡಾಕ್ಟ್ರೇ, ಹಾಲು ಕುಡಿಸೋದು ತುಂಬಾ ಕಷ್ಟ ಆಗ್ತಿದೆ. ರಾತ್ರಿ ಇವಳು ತುಂಬಾ ಅಳ್ತಾಳೆ. ಇಬ್ರೂ… ಶ್ವೇತಾನೂ.", tr: "Ḍākṭrē, hālu kuḍisōdu tumbā kaṣṭa āgtide. Rātri ivaḷu tumbā aḷtāḷe. Ibrū… Shwētānū.", en: "Doctor, feeding has been very hard. At night she cries a lot. Both of them... Shwetha too." }
  - { who: gyn, t: "ಶ್ವೇತಾ, ನನ್ನ ಕಡೆ ನೋಡಿ. ಹೇಗಿದ್ದೀರಾ? ಮಗು ಬಗ್ಗೆ ಅಲ್ಲ. ನೀವು ಹೇಗಿದ್ದೀರಾ?", tr: "Shwētā, nanna kaḍe nōḍi. Hēgiddīrā? Magu bagge alla. Nīvu hēgiddīrā?", en: "Shwetha, look at me. How are you? Not the baby. How are *you*?" }
  - { who: shwe, t: "ಗೊತ್ತಿಲ್ಲ ಡಾಕ್ಟ್ರೇ. ಎಲ್ರೂ ಖುಷಿಯಾಗಿದ್ದಾರೆ. ನಾನೂ ಖುಷಿಯಾಗಿರ್ಬೇಕು. ಆದ್ರೆ ಕಾರಣ ಇಲ್ಲದೆ ಅಳು ಬರುತ್ತೆ. ಸಣ್ಣ ವಿಷಯಕ್ಕೂ ಸಿಟ್ಟು ಬರುತ್ತೆ. ಆಮೇಲೆ ಅದಕ್ಕೂ ಗಿಲ್ಟ್ ಆಗುತ್ತೆ.", tr: "Gottilla ḍākṭrē. Elrū khuṣiyāgiddāre. Nānū khuṣiyāgirbēku. Ādre kāraṇa illade aḷu barutte. Saṇṇa viṣayakkū siṭṭu barutte. Āmēle adakkū gilṭ āgutte.", en: "I don't know, doctor. Everyone is happy. I should be happy too. But I cry for no reason. I get angry over small things. And then I feel guilty about that too." }
  - { who: gyn, t: "ಇದಕ್ಕೆ ಬೇಬಿ ಬ್ಲೂಸ್ ಅಂತಾರೆ. ಹೆರಿಗೆ ಆದ ಮೇಲೆ ತುಂಬಾ ತಾಯಂದಿರಿಗೆ ಆಗುತ್ತೆ. ಹಾರ್ಮೋನ್ ಬದಲಾವಣೆ, ನಿದ್ದೆ ಇಲ್ಲದಿರೋದು, ಆಪರೇಷನ್ ನೋವು, ಎಲ್ಲಾ ಸೇರಿ. ಇದು ನಿಮ್ಮ ತಪ್ಪಲ್ಲ. ನೀವು ಕೆಟ್ಟ ಅಮ್ಮ ಅಂತಾನೂ ಅಲ್ಲ.", tr: "Idakke bēbi blūs antāre. Herige āda mēle tumbā tāyandirige āgutte. Hārmōn badalāvaṇe, nidde illadirōdu, āparēṣan nōvu, ellā sēri. Idu nimma tappalla. Nīvu keṭṭa amma antānū alla.", en: "This is called the baby blues. Lots of mothers get it after delivery. Hormone changes, no sleep, the pain of the operation — all of it together. It isn't your fault. And it doesn't mean you're a bad mother." }
  - { who: gyn, t: "ಸಾಮಾನ್ಯವಾಗಿ ಎರಡು ವಾರದೊಳಗೆ ಕಮ್ಮಿ ಆಗುತ್ತೆ. ಆದ್ರೆ ಎರಡು ವಾರ ಆದ್ಮೇಲೂ ಹೀಗೇ ಇದ್ರೆ, ಏನೂ ಬೇಡ ಅನ್ನಿಸಿದ್ರೆ, ಮಗುನ ನೋಡ್ಕೊಳ್ಳೋಕೆ ಆಗಲ್ಲ ಅನ್ನಿಸಿದ್ರೆ, ಅಥವಾ ನಿಮಗೆ ನೀವೇ ಏನಾದ್ರೂ ಮಾಡ್ಕೊಳ್ಳೋ ಯೋಚನೆ ಬಂದ್ರೆ, ಅದು ಡಿಪ್ರೆಷನ್ ಆಗಿರಬಹುದು. ಆಗ ನಾಚಿಕೆ ಇಲ್ಲದೆ ನಂಗೆ ಹೇಳಲೇಬೇಕು. ಅದಕ್ಕೂ ಚಿಕಿತ್ಸೆ ಇದೆ.", tr: "Sāmānyavāgi eraḍu vāradoḷage kammi āgutte. Ādre eraḍu vāra ādmēlū hīgē idre, ēnū bēḍa annisidre, maguna nōḍkoḷḷōke āgalla annisidre, athavā nimage nīvē ēnādrū māḍkoḷḷō yōcane bandre, adu ḍipreṣan āgirabahudu. Āga nācike illade nange hēḷalēbēku. Adakkū cikitse ide.", en: "Usually it eases within two weeks. But if it's still like this after two weeks, if nothing seems worth it, if you feel you can't look after the baby, or if you have thoughts of harming yourself — that may be depression. Then you must tell me, with no shame at all. There's treatment for that too." }
  - { who: gyn, t: "ಮನೆಯವರಿಗೂ ಒಂದು ಮಾತು. ಇವರಿಗೆ ದಿನಕ್ಕೆ ಒಂದು ಸಲವಾದ್ರೂ ನಾಲ್ಕು ಗಂಟೆ ಒಟ್ಟಿಗೆ ನಿದ್ದೆ ಸಿಗೋ ಹಾಗೆ ನೋಡ್ಕೊಳ್ಳಿ. ಎದೆಹಾಲು ಪಂಪ್ ಮಾಡಿ ಬಾಟಲ್‌ನಲ್ಲಿ ಇಟ್ರೆ, ರಾತ್ರಿ ಒಂದು ಫೀಡ್ ಪ್ರದೀಪ್ ಕೊಡ್ಬಹುದು. ನಮ್ ಲ್ಯಾಕ್ಟೇಶನ್ ನರ್ಸ್ ಹೊರಗಿದ್ದಾರೆ, ಹೇಗೆ ಹಿಡ್ಕೋಬೇಕು ಅಂತ ತೋರಿಸ್ತಾರೆ.", tr: "Maneyavarigū ondu mātu. Ivarige dinakke ondu salavādrū nālku gaṇṭe oṭṭige nidde sigō hāge nōḍkoḷḷi. Edehālu pamp māḍi bāṭal-nalli iṭre, rātri ondu phīḍ Pradīp koḍbahudu. Nam lyākṭēśan nars horagiddāre, hēge hiḍkōbēku anta tōristāre.", en: "(to Amma and Ajji) A word for the family too. Make sure she gets at least one stretch of four hours' sleep a day. If she pumps breast milk into a bottle, Pradeep can give one feed at night. Our lactation nurse is outside; she'll show you how to hold the baby." }
  - { who: ajji, t: "ಡಾಕ್ಟ್ರೇ, ನಮ್ ಕಾಲದಲ್ಲಿ ಇದಕ್ಕೆ ಹೆಸರೇ ಇರಲಿಲ್ಲ. ಬಾಣಂತಿ ಅತ್ತರೆ “ಹಠ” ಅಂತಿದ್ರು. ಒಳ್ಳೇದಾಯ್ತು, ಈಗಲಾದ್ರೂ ಹೆಸರಿದೆ.", tr: "Ḍākṭrē, nam kāladalli idakke hesarē iralilla. Bāṇanti attare “haṭha” antidru. Oḷḷēdāytu, īgalādrū hesaride.", en: "Doctor, in our time this didn't even have a name. If a new mother cried, they called it “stubbornness”. It's good that at least now it has a name." }

  - scene: "On the way out, they stop at Dr. Farhan's room next door. He weighs the baby while Pradeep holds his breath."
  - { who: paed, t: "ಎರಡು ಕೆಜಿ ಏಳುನೂರ ಐವತ್ತು. ಹುಟ್ಟಿದಾಗ ಎರಡು ಕೆಜಿ ಒಂಬೈನೂರು ಇತ್ತು. ಗಾಬರಿ ಆಗಬೇಡಿ, ಮೊದಲ ವಾರ ಸ್ವಲ್ಪ ತೂಕ ಕಮ್ಮಿ ಆಗೋದು ಸಾಮಾನ್ಯ. ಎರಡು ವಾರದೊಳಗೆ ಮತ್ತೆ ಹುಟ್ಟಿದಾಗಿನ ತೂಕಕ್ಕೆ ಬರಬೇಕು.", tr: "Eraḍu keji ēḷunūra aivattu. Huṭṭidāga eraḍu keji ombainūru ittu. Gābari āgabēḍi, modala vāra svalpa tūka kammi āgōdu sāmānya. Eraḍu vāradoḷage matte huṭṭidāgina tūkakke barabēku.", en: "Two kilos seven hundred and fifty. She was two kilos nine hundred at birth. Don't panic — losing a little weight in the first week is normal. Within two weeks she should be back to her birth weight." }
  - { who: shwe, t: "ಹಾಗಾದ್ರೆ ಡಬ್ಬಿ ಹಾಲು ಬೇಡ ಅಲ್ವಾ ಡಾಕ್ಟ್ರೇ?", tr: "Hāgādre ḍabbi hālu bēḍa alvā ḍākṭrē?", en: "So she doesn't need formula, doctor?" }
  - { who: paed, t: "ಈಗ ಬೇಡ. ದಿನಕ್ಕೆ ಎಂಟರಿಂದ ಹನ್ನೆರಡು ಸಲ, ಅವಳು ಕೇಳಿದಾಗೆಲ್ಲಾ ಕುಡಿಸಿ. ಆರು ತಿಂಗಳು ಎದೆಹಾಲು ಮಾತ್ರ, ನೀರು ಕೂಡ ಬೇಡ. ಕಣ್ಣು, ಮೈ ಹಳದಿ ಆದ್ರೆ, ಅಥವಾ ಹಾಲು ಕುಡಿಯೋದು ನಿಲ್ಲಿಸಿದ್ರೆ, ತಕ್ಷಣ ಕರ್ಕೊಂಡು ಬನ್ನಿ.", tr: "Īga bēḍa. Dinakke eṇṭarinda hanneraḍu sala, avaḷu kēḷidāgellā kuḍisi. Āru tiṅgaḷu edehālu mātra, nīru kūḍa bēḍa. Kaṇṇu, mai haḷadi ādre, athavā hālu kuḍiyōdu nillisidre, takṣaṇa karkoṇḍu banni.", en: "Not now. Feed her eight to twelve times a day, whenever she asks. Only breast milk for six months — not even water. If her eyes or skin turn yellow, or if she stops feeding, bring her in straight away." }
  - { who: ajji, t: "ನೀರು ಕೂಡ ಬೇಡವಾ? ಅಮ್ಮನಿಗೆ ಮೂರು ಲೀಟರ್, ಮಗೂಗೆ ಒಂದು ಹನಿನೂ ಇಲ್ಲ. ಈ ಕಾಲದ ಲೆಕ್ಕಾನೇ ಬೇರೆ!", tr: "Nīru kūḍa bēḍavā? Ammanige mūru līṭar, magūge ondu haninū illa. Ī kālada lekkānē bēre!", en: "Not even water? Three litres for the mother and not a drop for the baby. The sums are different these days!" }

  - section: "🍼 Pradeep's night shift"
    learn: "baby care: bāṭal, pamp, tēgu, suttu (to swaddle) · -ōṣṭralli (by the time …) · -bēku / -bāradu for instructions · habitual past -ttiralilla (never used to)"
  - scene: "Day eight, one in the morning. Shwetha has been asleep since ten. In the kitchen, Pradeep warms a small bottle of expressed milk in a bowl of hot water, the baby on his shoulder. Sam comes in from a late shift."
  - { who: sam, t: "ಪ್ರದೀಪ್? ಒಂದು ಗಂಟೆ ಆಯ್ತು. ನೀನು ಇನ್ನೂ ಮಲಗಿಲ್ವಾ?", tr: "Pradīp? Ondu gaṇṭe āytu. Nīnu innū malagilvā?", en: "Pradeep? It's one o'clock. You're still not asleep?" }
  - { who: pradeep, t: "ಇವತ್ತು ನನ್ ಡ್ಯೂಟಿ. ಶ್ವೇತಾ ಹತ್ತು ಗಂಟೆಗೆ ಮಲಗಿದ್ಲು. ಐದು ದಿನದಲ್ಲಿ ಮೊದಲ ಸಲ ಸರಿಯಾದ ನಿದ್ದೆ. ಅವಳು ಏಳೋಷ್ಟರಲ್ಲಿ ಇವಳಿಗೆ ಹಾಲು ಕುಡಿಸಿ, ತೇಗು ಬರಿಸಿ, ಮಲಗಿಸಬೇಕು.", tr: "Ivattu nan ḍyūṭi. Shwētā hattu gaṇṭege malagidlu. Aidu dinadalli modala sala sariyāda nidde. Avaḷu ēḷōṣṭaralli ivaḷige hālu kuḍisi, tēgu barisi, malagisabēku.", en: "Tonight's my shift. Shwetha went to sleep at ten — her first real sleep in five days. Before she wakes up, I have to feed this one, burp her and get her to sleep." }
  - { who: sam, t: "ಬಾಟಲ್ ಹಾಲು? ಡಬ್ಬಿ ಹಾಲಾ?", tr: "Bāṭal hālu? Ḍabbi hālā?", en: "A bottle? Formula?" }
  - { who: pradeep, t: "ಇಲ್ಲ, ಸಂಜೆ ಶ್ವೇತಾನೇ ಪಂಪ್ ಮಾಡಿ ಇಟ್ಟಿದ್ದು. ಫ್ರಿಜ್‌ನಲ್ಲಿ ಇಟ್ರೆ ಕೆಡಲ್ಲ ಅಂತ ನರ್ಸ್ ಹೇಳಿದ್ರು. ಆದ್ರೆ ನೇರವಾಗಿ ಕುದಿಸಬಾರದು, ಮೈಕ್ರೋವೇವ್ ಕೂಡ ಬೇಡ. ಹೀಗೆ ಬಿಸಿನೀರಿನ ಬಟ್ಟಲಲ್ಲಿ ಇಟ್ಟು ಬೆಚ್ಚಗೆ ಮಾಡಬೇಕು.", tr: "Illa, sañje Shwētānē pamp māḍi iṭṭiddu. Phrij-nalli iṭre keḍalla anta nars hēḷidru. Ādre nēravāgi kudisabāradu, maikrōvēv kūḍa bēḍa. Hīge bisinīrina baṭṭalalli iṭṭu beccage māḍabēku.", en: "No, Shwetha pumped it this evening. The nurse said it won't spoil in the fridge. But you mustn't boil it directly, and no microwave either. You warm it like this, standing in a bowl of hot water." }
  - { who: sam, t: "ನೀನು ಎಕ್ಸ್‌ಪರ್ಟ್ ಆಗಿಬಿಟ್ಟಿದ್ದೀಯಾ.", tr: "Nīnu ekspart āgibiṭṭiddīyā.", en: "You've become an expert." }
  - { who: pradeep, t: "ಎಕ್ಸ್‌ಪರ್ಟ್? ಮೊದಲ ದಿನ ಡೈಪರ್ ಹಿಂದೆ-ಮುಂದೆ ಹಾಕಿದ್ದೆ. ಅತ್ತೆ ನಕ್ಕು ನಕ್ಕು ಸುಸ್ತಾದ್ರು. ಸುತ್ತೋದು ಇನ್ನೂ ಬರಲ್ಲ. ನಾನು ಬಟ್ಟೆ ಸುತ್ತಿದ್ರೆ ಐದು ನಿಮಿಷದಲ್ಲಿ ಒಂದು ಕೈ ಹೊರಗೆ ಬರುತ್ತೆ.", tr: "Ekspart? Modala dina ḍaipar hinde-munde hākidde. Atte nakku nakku sustādru. Suttōdu innū baralla. Nānu baṭṭe suttidre aidu nimiṣadalli ondu kai horage barutte.", en: "Expert? On the first day I put the diaper on back to front. My mother-in-law laughed till she was worn out. I still can't swaddle. When I wrap her, one hand pops out within five minutes." }
  - scene: "The baby finishes the bottle. Pradeep lifts her to his shoulder the way Amma showed him and pats her back. Nothing. He keeps patting."
  - { who: sam, t: "ಭಯ ಆಗುತ್ತಾ? ಇಷ್ಟು ಚಿಕ್ಕ ಮಗುನ ಎತ್ಕೊಳ್ಳೋಕೆ?", tr: "Bhaya āguttā? Iṣṭu cikka maguna etkoḷḷōke?", en: "Are you scared? Holding a baby this small?" }
  - { who: pradeep, t: "ಪ್ರತಿ ಸಲ. ಕತ್ತು ಸರಿಯಾಗಿ ಹಿಡ್ಕೊಂಡಿದ್ದೀನಾ, ತುಂಬಾ ಗಟ್ಟಿಯಾಗಿ ಹಿಡ್ಕೊಂಡಿದ್ದೀನಾ… ಒಂದು ವಿಷಯ ಹೇಳ್ಲಾ, ಸ್ಯಾಮ್? ಸಿಯಾಟಲ್‌ನಲ್ಲಿ ಪ್ರೊಡಕ್ಷನ್ ಸರ್ವರ್ ಡೌನ್ ಆದಾಗಲೂ ನಂಗೆ ಇಷ್ಟು ಟೆನ್ಷನ್ ಆಗ್ತಿರಲಿಲ್ಲ. ಆದ್ರೆ ಇಷ್ಟು ಖುಷಿನೂ ಯಾವತ್ತೂ ಆಗಿರಲಿಲ್ಲ.", tr: "Prati sala. Kattu sariyāgi hiḍkoṇḍiddīnā, tumbā gaṭṭiyāgi hiḍkoṇḍiddīnā… Ondu viṣaya hēḷlā, Sām? Siyāṭal-nalli prōḍakṣan sarvar ḍaun ādāgalū nange iṣṭu ṭenṣan āgtiralilla. Ādre iṣṭu khuṣinū yāvattū āgiralilla.", en: "Every time. Am I holding the neck right, am I holding her too tight... Shall I tell you something, Sam? Even when a production server went down in Seattle, I never got this tense. But I was never this happy either." }
  - scene: "A small, loud burp. Both men laugh under their breath."
  - { who: pradeep, t: "ಬಂತು! ತೇಗು ಬಂತು! ಈಗ ಮಲಗು ಮಗಳೇ. ನಿಮ್ಮಮ್ಮನ್ನ ಎಬ್ಬಿಸಬೇಡ.", tr: "Bantu! Tēgu bantu! Īga malagu magaḷē. Nimmammanna ebbisabēḍa.", en: "There it is! The burp! Now go to sleep, my girl. Don't wake your mother." }

  - section: "👵 Ajji holds her"
    learn: "muttajji, marimommagaḷu · dhairya (courage) · past habitual -ttidde (I used to …) · -ōvaregū (until) · blessings: cennāgiru, nūru varṣa sukhavāgi bāḷu"
  - scene: "Day nine, late afternoon. Winter sunlight in Ajji's room. Shwetha, who slept well last night, carries the baby in slowly, one hand on her stitches. Ajji is sitting on her bed with her prayer beads."
  - { who: shwe, t: "ಅಜ್ಜಿ, ಒಂಬತ್ತು ದಿನ ಆಯ್ತು. ಇವತ್ತು ತಪ್ಪಿಸ್ಕೊಳ್ಳೋಕೆ ಬಿಡಲ್ಲ. ನಿಮ್ಮ ಮರಿಮೊಮ್ಮಗಳನ್ನ ನೀವು ಎತ್ಕೋಬೇಕು.", tr: "Ajji, ombattu dina āytu. Ivattu tappiskoḷḷōke biḍalla. Nimma marimommagaḷanna nīvu etkōbēku.", en: "Ajji, it's been nine days. Today I won't let you escape. You have to hold your great-granddaughter." }
  - { who: ajji, t: "ಬೇಡ ಕಣೇ. ನನ್ ಕೈ ನಡುಗುತ್ತೆ. ಬಿಪಿ ಮಾತ್ರೆಯಿಂದ ಒಮ್ಮೊಮ್ಮೆ ತಲೆ ಸುತ್ತುತ್ತೆ. ಬೀಳಿಸಿಬಿಟ್ರೆ? ನಾನು ದೂರದಿಂದ ನೋಡ್ತೀನಿ, ಅಷ್ಟೇ ಸಾಕು.", tr: "Bēḍa kaṇē. Nan kai naḍugutte. Bi-pi mātreyinda ommomme tale suttutte. Bīḷisibiṭre? Nānu dūradinda nōḍtīni, aṣṭē sāku.", en: "No, dear. My hands shake. The BP tablets make me dizzy sometimes. What if I drop her? I'll watch from a distance. That's enough for me." }
  - { who: shwe, t: "ಆಗಸ್ಟ್‌ನಲ್ಲಿ ನೀವು ಐಸಿಯುನಲ್ಲಿದ್ದಾಗ ನಾನು ದೇವರ ಹತ್ರ ಒಂದೇ ಒಂದು ಕೇಳಿದ್ದೆ, ಅಜ್ಜಿ. ನೀವು ಇವಳನ್ನ ಎತ್ಕೋಬೇಕು ಅಂತ. ದೂರದಿಂದ ಅಲ್ಲ. ಒರಗಿ ಕೂತ್ಕೊಳ್ಳಿ, ದಿಂಬು ಇಡ್ತೀನಿ. ನಾನು ಪಕ್ಕದಲ್ಲೇ ಇರ್ತೀನಿ.", tr: "Āgasṭ-nalli nīvu ai-si-yu-nalliddāga nānu dēvara hatra ondē ondu kēḷidde, ajji. Nīvu ivaḷanna etkōbēku anta. Dūradinda alla. Oragi kūtkoḷḷi, dimbu iḍtīni. Nānu pakkadallē irtīni.", en: "In August, when you were in the ICU, I asked God for just one thing, Ajji — that you would hold her. Not from a distance. Lean back, I'll put a pillow. I'll be right beside you." }
  - scene: "Shwetha puts a pillow on Ajji's lap, lays the baby on it, and guides Ajji's hands under the small head. For a moment Ajji does not breathe."
  - { who: ajji, t: "ಅಯ್ಯೋ… ಎಷ್ಟು ಹಗುರ. ಹತ್ತಿ ಉಂಡೆ ಥರ. ನೋಡು, ನೋಡು, ಕಣ್ಣು ಬಿಟ್ಳು. ನನ್ನನ್ನೇ ನೋಡ್ತಿದ್ದಾಳೆ.", tr: "Ayyō… eṣṭu hagura. Hatti uṇḍe thara. Nōḍu, nōḍu, kaṇṇu biṭḷu. Nannannē nōḍtiddāḷe.", en: "Oh... how light. Like a ball of cotton. Look, look, she's opened her eyes. She's looking right at me." }
  - { who: shwe, t: "ಇವಳಿಗೆ ನಿಮ್ಮ ಮೂಗು ಬಂದಿದೆ ಅಂತ ಅಮ್ಮ ಹೇಳ್ತಾಳೆ.", tr: "Ivaḷige nimma mūgu bandide anta amma hēḷtāḷe.", en: "Amma says she's got your nose." }
  - { who: ajji, t: "ಅಯ್ಯೋ ಪಾಪ! ಮಗೂಗೆ ಯಾಕೆ ಅಂಥಾ ಶಿಕ್ಷೆ?", tr: "Ayyō pāpa! Magūge yāke anthā śikṣe?", en: "(laughing through tears) Oh, poor thing! Why punish the baby like that?" }
  - { who: ajji, t: "ಶ್ವೇತಾ, ನಿಮ್ಮಪ್ಪ ಹುಟ್ಟಿದಾಗ ನಂಗೆ ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ. ಊರಿನ ಮನೆ. ಕರೆಂಟ್ ಇರಲಿಲ್ಲ, ಡಾಕ್ಟ್ರು ಇರಲಿಲ್ಲ, ಸೂಲಗಿತ್ತಿ ಬಂದಿದ್ಲು. ಮೂರು ತಿಂಗಳು ಕತ್ತಲೆ ಕೋಣೆ. ರಾತ್ರಿ ಎಲ್ರೂ ಮಲಗಿದ ಮೇಲೆ ನಾನು ಒಬ್ಬಳೇ ಅಳ್ತಿದ್ದೆ. ಯಾಕೆ ಅಂತ ನಂಗೂ ಗೊತ್ತಿರಲಿಲ್ಲ.", tr: "Shwētā, nimmappa huṭṭidāga nange ippatteraḍu varṣa. Ūrina mane. Karaṇṭ iralilla, ḍākṭru iralilla, sūlagitti bandidlu. Mūru tingaḷu kattale kōṇe. Rātri elrū malagida mēle nānu obbaḷē aḷtidde. Yāke anta nangū gottiralilla.", en: "Shwetha, when your father was born I was twenty-two. Our house in the village. No electricity, no doctor — the midwife came. Three months in a dark room. At night, after everyone was asleep, I used to cry alone. I didn't know why myself." }
  - { who: ajji, t: "ಯಾರಿಗೂ ಹೇಳಲಿಲ್ಲ. ಹೇಳಿದ್ರೆ ಏನಂತಾರೋ ಅಂತ ಭಯ. ಒಂದು ರಾತ್ರಿ ನಿಮ್ ತಾತ ನೋಡಿಬಿಟ್ರು. ಏನೂ ಕೇಳಲಿಲ್ಲ. ಸುಮ್ಮನೆ ಪಕ್ಕದಲ್ಲಿ ಕೂತು ಬೆಳಿಗ್ಗೆವರೆಗೂ ಮಗುನ ಎತ್ಕೊಂಡಿದ್ರು. ಅವತ್ತಿಂದ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಸರಿ ಹೋಯ್ತು.", tr: "Yārigū hēḷalilla. Hēḷidre ēnantārō anta bhaya. Ondu rātri nim tāta nōḍibiṭru. Ēnū kēḷalilla. Summane pakkadalli kūtu beḷiggevaregū maguna etkoṇḍidru. Avattinda svalpa svalpa sari hōytu.", en: "I didn't tell anyone. I was afraid of what they'd say. One night your grandfather saw me. He didn't ask anything. He just sat beside me and held the baby until morning. From that day, little by little, it got better." }
  - { who: shwe, t: "ಅಜ್ಜಿ… ನಂಗೂ ಹಾಗೇ ಆಗ್ತಿದೆ. ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ದು ಕೇಳಿ ಸ್ವಲ್ಪ ಸಮಾಧಾನ ಆಯ್ತು. ಆದ್ರೆ ನಿಮ್ಮ ಬಾಯಿಂದ ಕೇಳಿದ ಮೇಲೆ ನಾನು ಒಬ್ಬಳೇ ಅಲ್ಲ ಅನ್ನಿಸ್ತಿದೆ.", tr: "Ajji… nangū hāgē āgtide. Ḍākṭru hēḷiddu kēḷi svalpa samādhāna āytu. Ādre nimma bāyinda kēḷida mēle nānu obbaḷē alla annistide.", en: "Ajji... it's happening to me too. What the doctor said comforted me a little. But hearing it from you, I feel I'm not the only one." }
  - { who: ajji, t: "ನೀನು ಒಬ್ಬಳಲ್ಲ. ಈ ಮನೇಲಿ ಯಾರೂ ಒಬ್ಬರಲ್ಲ. ಅಳು ಬಂದ್ರೆ ಅಳು, ಆದ್ರೆ ಮುಚ್ಚಿಡಬೇಡ. ರಾತ್ರಿ ನಿದ್ದೆ ಬರದಿದ್ರೆ ನನ್ ಕೋಣೆಗೆ ಬಾ. ನಂಗೂ ನಿದ್ದೆ ಕಮ್ಮಿ. ಮುದುಕಿ ಅಲ್ವಾ.", tr: "Nīnu obbaḷalla. Ī manēli yārū obbaralla. Aḷu bandre aḷu, ādre mucciḍabēḍa. Rātri nidde baradidre nan kōṇege bā. Nangū nidde kammi. Muduki alvā.", en: "You're not alone. Nobody in this house is alone. If you need to cry, cry — but don't hide it. If you can't sleep at night, come to my room. I hardly sleep either. I'm an old woman, aren't I." }
  - scene: "Ajji bends, slowly, and touches her forehead to the baby's."
  - { who: ajji, t: "ದೇವರೇ, ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಆ ರಾತ್ರಿ ನಿನ್ ಹತ್ರ ಬೇಡ್ಕೊಂಡಿದ್ದೆ. ಇವಳ ಮುಖ ನೋಡೋವರೆಗೂ ನನ್ನ ಕರ್ಕೊಂಡು ಹೋಗಬೇಡ ಅಂತ. ನೀನು ಕೇಳಿಸ್ಕೊಂಡೆ. ಇನ್ನು ನಿನ್ನಿಷ್ಟ.", tr: "Dēvarē, āspatreyalli ā rātri nin hatra bēḍkoṇḍidde. Ivaḷa mukha nōḍōvaregū nanna karkoṇḍu hōgabēḍa anta. Nīnu kēḷiskoṇḍe. Innu ninniṣṭa.", en: "God, that night in the hospital I begged you not to take me until I had seen her face. You listened. From now on, as you wish." }
  - scene: "The baby's tiny fingers close around Ajji's finger and hold on."
  - { who: ajji, t: "ಓ… ನೋಡು, ಹಿಡ್ಕೊಂಡ್ಳು. ಬಿಡ್ತಾನೇ ಇಲ್ಲ. ಸರಿ ಸರಿ, ದೇವರೇ, ನಾನು ಹೇಳಿದ್ದು ವಾಪಸ್. ಇವಳು ನನ್ನ “ಅಜ್ಜಿ” ಅಂತ ಕರೆಯೋವರೆಗೂ ಇರ್ತೀನಿ.", tr: "Ō… nōḍu, hiḍkoṇḍḷu. Biḍtānē illa. Sari sari, dēvarē, nānu hēḷiddu vāpas. Ivaḷu nanna “ajji” anta kareyōvaregū irtīni.", en: "Oh... look, she's holding on. She won't let go. All right, all right, God, I take back what I said. I'll stay until she calls me “Ajji”." }
  - { who: shwe, t: "ಅಷ್ಟೇ ಅಲ್ಲ. ಅವಳ ಮದುವೆಯಲ್ಲಿ ಅಕ್ಷತೆ ಹಾಕೋವರೆಗೂ.", tr: "Aṣṭē alla. Avaḷa maduveyalli akṣate hākōvaregū.", en: "Not just that. Until you throw the blessing rice at her wedding." }
  - { who: ajji, t: "ಆಸೆ ನೋಡು ಇವಳಿಗೆ! ಹೂಂ… ನೋಡೋಣ. ಚೆನ್ನಾಗಿರು ಮಗೂ. ನೂರು ವರ್ಷ ಸುಖವಾಗಿ ಬಾಳು.", tr: "Āse nōḍu ivaḷige! Hūṃ… nōḍōṇa. Cennāgiru magū. Nūru varṣa sukhavāgi bāḷu.", en: "Listen to her, so greedy! Hm... we'll see. Be well, little one. Live a hundred happy years." }

  - chapter: "Chapter 9 — A name for the baby"
  - section: "📜 Meenakshi or Meera?"
    learn: "nakṣatra, akṣara, hesariḍu (to name) · reported speech: -ante, anta hēḷidru · comparing: idakkinta oḷḷe … · compromising: ondu kelasa māḍōṇa, eraḍū iḍōṇa"
  - scene: "Day ten, evening. The whole Rao household around the dining table. Appa has come back from the temple with a slip of paper from the purohit."
  - { who: appa, t: "ಪುರೋಹಿತರು ಜಾತಕ ನೋಡಿದ್ರು. ಮಘಾ ನಕ್ಷತ್ರ ಅಂತೆ. ಹೆಸರು ಮ, ಮಿ, ಮು, ಮೆ, ಈ ಅಕ್ಷರಗಳಲ್ಲಿ ಶುರು ಆದ್ರೆ ಒಳ್ಳೇದು ಅಂತ ಹೇಳಿದ್ರು.", tr: "Purōhitaru jātaka nōḍidru. Maghā nakṣatra ante. Hesaru ma, mi, mu, me, ī akṣaragaḷalli śuru ādre oḷḷēdu anta hēḷidru.", en: "The purohit looked at the horoscope. It's Magha nakshatra, apparently. He said it's good if the name starts with one of these syllables: ma, mi, mu, me." }
  - { who: ajji, t: "ಮಿ ಅಂದ್ಮೇಲೆ ಇನ್ನೇನು? ಮೀನಾಕ್ಷಿ. ನನ್ನ ಅಮ್ಮನ ಹೆಸರು. ಮಧುರೆ ಮೀನಾಕ್ಷಿ ಅಮ್ಮನವರ ಹೆಸರು. ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಹೆಸರು ಎಲ್ಲಿ ಸಿಗುತ್ತೆ?", tr: "Mi andmēle innēnu? Mīnākṣi. Nanna ammana hesaru. Madhure Mīnākṣi ammanavara hesaru. Idakkinta oḷḷe hesaru elli sigutte?", en: "If it's mi, what else? Meenakshi. My mother's name. The name of the goddess Meenakshi of Madurai. Where will you find a better name than that?" }
  - { who: kiran, t: "ಅಜ್ಜಿ, ಸ್ಕೂಲ್‌ನಲ್ಲಿ ಎಲ್ರೂ ಅವಳನ್ನ “ಮೀನು” ಅಂತ ಕರೀತಾರೆ. ಮೀನು ಅಂದ್ರೆ ಫಿಶ್!", tr: "Ajji, skūl-nalli elrū avaḷanna “mīnu” anta karītāre. Mīnu andre phiś!", en: "Ajji, everyone at school will call her “Meenu”. Meenu means fish!" }
  - { who: ajji, t: "ಮೀನು ಆದ್ರೆ ಏನಾಯ್ತು? ಮೀನಿನ ಥರ ಕಣ್ಣು ಅಂತಾನೇ ಮೀನಾಕ್ಷಿ ಅರ್ಥ. ದೊಡ್ಡ ಸುಂದರ ಕಣ್ಣು. ನೋಡು ಅವಳ ಕಣ್ಣು.", tr: "Mīnu ādre ēnāytu? Mīnina thara kaṇṇu antānē Mīnākṣi artha. Doḍḍa sundara kaṇṇu. Nōḍu avaḷa kaṇṇu.", en: "So what if it's fish? That's exactly what Meenakshi means — eyes shaped like a fish. Big, beautiful eyes. Look at her eyes." }
  - { who: shwe, t: "ಅಜ್ಜಿ, ಹೆಸರು ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ. ಆದ್ರೆ ನಾನು, ಪ್ರದೀಪ್ ಬೇರೆ ಯೋಚನೆ ಮಾಡಿದ್ವಿ. “ಮೀರಾ”. ಚಿಕ್ಕದು, ಯಾರು ಬೇಕಾದ್ರೂ ಸುಲಭವಾಗಿ ಹೇಳಬಹುದು. ನಾಳೆ ಅವಳು ಹೊರದೇಶದಲ್ಲಿ ಓದಿದ್ರೂ ಯಾರೂ ತಪ್ಪಾಗಿ ಕರೆಯಲ್ಲ.", tr: "Ajji, hesaru tumbā cennāgide. Ādre nānu, Pradīp bēre yōcane māḍidvi. “Mīrā”. Cikkadu, yāru bēkādrū sulabhavāgi hēḷabahudu. Nāḷe avaḷu horadēśadalli ōdidrū yārū tappāgi kareyalla.", en: "Ajji, it's a lovely name. But Pradeep and I had another idea: “Meera”. It's short, anyone can say it easily. Even if she studies abroad one day, nobody will get it wrong." }
  - { who: sam, t: "ಒಂದು ವರ್ಷದ ಹಿಂದೆ “ಸರಸ್ವತಮ್ಮ” ಅನ್ನೋಕೆ ನಂಗೆ ಐದು ನಿಮಿಷ ಬೇಕಾಗ್ತಿತ್ತು. ಈಗ ಸುಲಭವಾಗಿ ಹೇಳ್ತೀನಿ. ಜನ ಕಲೀತಾರೆ, ಶ್ವೇತಾ.", tr: "Ondu varṣada hinde “Sarasvatamma” annōke nange aidu nimiṣa bēkāgtittu. Īga sulabhavāgi hēḷtīni. Jana kalītāre, Shwētā.", en: "A year ago it took me five minutes to say “Saraswathamma”. Now I say it easily. People learn, Shwetha." }
  - { who: ajji, t: "ನೋಡಿದ್ಯಾ! ಸ್ವಿಸ್ ಹುಡುಗ ನನ್ ಕಡೆ.", tr: "Nōḍidyā! Svis huḍuga nan kaḍe.", en: "See that! The Swiss boy is on my side." }
  - { who: pradeep, t: "ಅಜ್ಜಿ, ಮೀರಾ ಕೂಡ ಹೊಸ ಹೆಸರಲ್ಲ. ಮೀರಾಬಾಯಿ ಕೃಷ್ಣನ ಭಕ್ತೆ, ಐನೂರು ವರ್ಷದ ಹಿಂದಿನವರು. ಯಾರು ಏನೇ ಅಂದ್ರೂ ಅವರು ತಮಗೆ ಸರಿ ಅನ್ನಿಸಿದ್ದನ್ನೇ ಮಾಡಿದ್ರು. ನಮ್ ಮಗಳೂ ಹಾಗೇ ಆಗ್ಲಿ ಅಂತ ಆಸೆ.", tr: "Ajji, Mīrā kūḍa hosa hesaralla. Mīrābāyi Kṛṣṇana bhakte, ainūru varṣada hindinavaru. Yāru ēnē andrū avaru tamage sari annisiddannē māḍidru. Nam magaḷū hāgē āgli anta āse.", en: "Ajji, Meera isn't a new name either. Meerabai was a devotee of Krishna, five hundred years ago. Whatever anyone said, she did what she felt was right. We'd like our daughter to be like that." }
  - { who: ajji, t: "ಯಾರು ಏನೇ ಅಂದ್ರೂ? ಮುತ್ತಜ್ಜಿ ಅಂದ್ರೂ? ಅದೇ ನನ್ನ ಭಯ!", tr: "Yāru ēnē andrū? Muttajji andrū? Adē nanna bhaya!", en: "Whatever anyone said? Even her great-grandmother? That's exactly what I'm afraid of!" }
  - { who: amma, t: "ಒಂದು ಕೆಲಸ ಮಾಡೋಣ. ಎಷ್ಟೋ ಮನೆಗಳಲ್ಲಿ ಎರಡು ಹೆಸರು ಇಡ್ತಾರೆ. ಒಂದು ನಕ್ಷತ್ರದ ಹೆಸರು, ಪೂಜೆ, ಶಾಸ್ತ್ರಕ್ಕೆ. ಇನ್ನೊಂದು ಕರೆಯೋ ಹೆಸರು, ಸ್ಕೂಲ್‌ಗೆ, ಸರ್ಟಿಫಿಕೇಟ್‌ಗೆ.", tr: "Ondu kelasa māḍōṇa. Eṣṭō manegaḷalli eraḍu hesaru iḍtāre. Ondu nakṣatrada hesaru, pūje, śāstrakke. Innondu kareyō hesaru, skūlge, sarṭiphikēṭge.", en: "Let's do one thing. Lots of families give two names. One is the nakshatra name, for pujas and rituals. The other is the name she's called by, for school and certificates." }
  - { who: appa, t: "ಹೌದು. ನನಗೂ ಎರಡು ಹೆಸರಿವೆ. ಜಾತಕದಲ್ಲಿ ನಾನು “ವೆಂಕಟರಮಣ”. ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಮೂವತ್ತು ವರ್ಷದಿಂದ ರಮೇಶ್.", tr: "Haudu. Nanagū eraḍu hesarive. Jātakadalli nānu “Veṅkaṭaramaṇa”. Byāṅk-nalli mūvattu varṣadinda Ramēsh.", en: "That's right. I have two names myself. In my horoscope I'm “Venkataramana”. At the bank I've been Ramesh for thirty years." }
  - { who: kiran, t: "ಏನು? ಅಪ್ಪಾ, ಇಪ್ಪತ್ತು ವರ್ಷದಲ್ಲಿ ಇದು ನಂಗೆ ಇವತ್ತೇ ಗೊತ್ತಾಗ್ತಿರೋದು!", tr: "Ēnu? Appā, ippattu varṣadalli idu nange ivattē gottāgtirōdu!", en: "What? Appa, twenty years and I'm only finding this out today!" }
  - { who: ajji, t: "ಸರಿ. ಕಿವಿಯಲ್ಲಿ ಮೊದಲು ಮೀನಾಕ್ಷಿ ಅಂತ ಹೇಳ್ಬೇಕು. ಆಮೇಲೆ ನೀವು ಏನು ಬೇಕಾದ್ರೂ ಕರೀರಿ. ನಾನು ಮಾತ್ರ “ಮೀನು” ಅಂತಾನೇ ಕರೆಯೋದು. ಕಿರಣ್, ಏನಾದ್ರೂ ತಕರಾರು ಇದ್ಯಾ?", tr: "Sari. Kiviyalli modalu Mīnākṣi anta hēḷbēku. Āmēle nīvu ēnu bēkādrū karīri. Nānu mātra “Mīnu” antānē kareyōdu. Kiraṇ, ēnādrū takarāru idyā?", en: "Fine. Meenakshi must be said into her ear first. After that, call her whatever you like. But I'll call her “Meenu” and nothing else. Kiran, any objection?" }
  - { who: kiran, t: "ಇಲ್ಲ ಅಜ್ಜಿ. ನಿಮ್ ಜೊತೆ ಯಾರು ವಾದ ಮಾಡ್ತಾರೆ?", tr: "Illa ajji. Nim jote yāru vāda māḍtāre?", en: "No, Ajji. Who would argue with you?" }
  - { who: shwe, t: "ಮೀರಾ ಮೀನಾಕ್ಷಿ. ಮುಂದೆ ಯಾವುದು ಬೇಕು ಅಂತ ಅವಳೇ ಆರಿಸ್ಕೊಳ್ಳಲಿ.", tr: "Mīrā Mīnākṣi. Munde yāvudu bēku anta avaḷē āriskoḷḷali.", en: "Meera Meenakshi. Later on she can choose for herself which one she wants." }

  - section: "🪔 The eleventh day"
    learn: "ritual words: nāmakaraṇa, puṇyāha, sūtaka, muhūrta, maṇe, akki, uṅgura · respectful address: -avarē, svāmi · making amends: nācike, hañcikoḷḷu (to share)"
  - scene: "Day eleven: Saturday, 21 November. The hall of the Rao house is hung with mango leaves and marigolds. A wooden cradle, wound with jasmine, hangs from a hook in the ceiling. Sumitra and Shankar arrive early with fruit, a new frock and a small velvet box."
  - { who: sumitra, t: "ಲಕ್ಷ್ಮಿ ಅವರೇ, ಎಲ್ಲಿ ನಮ್ ಮೊಮ್ಮಗಳು? ರಾತ್ರಿ ಪೂರ್ತಿ ನಿದ್ದೆ ಬರಲಿಲ್ಲ, ಬೆಳಿಗ್ಗೆ ಆಗೋದನ್ನೇ ಕಾಯ್ತಿದ್ದೆ.", tr: "Lakshmī avarē, elli nam mommagaḷu? Rātri pūrti nidde baralilla, beḷigge āgōdannē kāytidde.", en: "Lakshmi, where's our granddaughter? I couldn't sleep all night; I was just waiting for morning." }
  - { who: amma, t: "ಬನ್ನಿ ಸುಮಿತ್ರಾ, ಬನ್ನಿ ಶಂಕರ್ ಅವರೇ. ಒಳಗೆ ಅಮ್ಮನ ಜೊತೆ ಇದ್ದಾಳೆ. ಹೊಸ ಬಟ್ಟೆ ಹಾಕ್ತಿದ್ದೀವಿ.", tr: "Banni Sumitrā, banni Śaṅkar avarē. Oḷage ammana jote iddāḷe. Hosa baṭṭe hāktiddīvi.", en: "Come in, Sumitra, come in, Shankar. She's inside with her mother. We're putting her new clothes on." }
  - { who: sumitra, t: "ಇದು ಬೆಳ್ಳಿ ಕಾಲ್ಗೆಜ್ಜೆ, ಪುಟ್ಟ ಕೈಬಳೆ. ಲಕ್ಷ್ಮಿ ಅವರೇ, ಒಂದು ವರ್ಷದ ಹಿಂದೆ ಇದೇ ಮನೆಗೆ ಬೇರೆ ಮನಸ್ಸಿನಿಂದ ಬಂದಿದ್ದೆ. ಇವತ್ತು ಬರಿಗೈಯಲ್ಲಿ ಬಂದಿದ್ರೂ ನೀವು ಬಾಗಿಲು ತೆಗೀತಿದ್ರಿ ಅಂತ ಗೊತ್ತು. ಅದಕ್ಕೇ ಇದು ಉಡುಗೊರೆ ಅಲ್ಲ. ಪ್ರೀತಿ.", tr: "Idu beḷḷi kālgejje, puṭṭa kaibaḷe. Lakshmī avarē, ondu varṣada hinde idē manege bēre manassininda bandidde. Ivattu barigaiyalli bandidrū nīvu bāgilu tegītidri anta gottu. Adakkē idu uḍugore alla. Prīti.", en: "(handing over the box) Silver anklets and a tiny bangle. Lakshmi, a year ago I came to this same house with a different heart. I know that today you'd have opened the door even if I'd come empty-handed. That's why this isn't a gift. It's love." }
  - { who: amma, t: "ಅದೆಲ್ಲಾ ಮುಗಿದ ಕಥೆ, ಸುಮಿತ್ರಾ. ಜಯದೇವದಲ್ಲಿ ಆ ರಾತ್ರಿ ನೀವು ಊಟ ತಂದಾಗಲೇ ಮುಗೀತು. ಇವತ್ತು ನಾವಿಬ್ರೂ ಅಜ್ಜಿಯರು, ಅಷ್ಟೇ.", tr: "Adellā mugida kathe, Sumitrā. Jayadēvadalli ā rātri nīvu ūṭa tandāgalē mugītu. Ivattu nāvibrū ajjiyaru, aṣṭē.", en: "That's a closed story, Sumitra. It ended that night at Jayadeva when you brought food. Today we're both just grandmothers, that's all." }
  - { who: shankar, t: "ರಮೇಶ್ ಅವರೇ, ನಮ್ ಕಡೆ ಮೊದಲ ಹೆರಿಗೆ ತವರು ಮನೆಯವರ ಖರ್ಚು ಅಂತ ಪದ್ಧತಿ. ಸೀಮಂತದ ದಿನ ಆ ಪದ್ಧತಿನ ನಾವೆಲ್ಲಾ ಸೇರಿ ಬದಲಾಯಿಸಿದ್ವಿ, ಆಸ್ಪತ್ರೆ ಬಿಲ್ ಮಕ್ಕಳೇ ಕಟ್ಟಿದ್ರು. ಆದ್ರೆ ಒಂದು ವರ್ಷದ ಹಿಂದೆ ನಾವು ನಿಮ್ಮಿಂದ ಏನೇನು ಕೇಳಿದ್ವಿ ಅಂತ ನೆನೆಸಿಕೊಂಡ್ರೆ ಇನ್ನೂ ನಾಚಿಕೆ ಆಗುತ್ತೆ. ಇವತ್ತಿನ ನಾಮಕರಣದ ಖರ್ಚೂ ನಾವು ಹಂಚ್ಕೊಳ್ತೀವಿ. ಬೇಡ ಅನ್ಬೇಡಿ.", tr: "Ramēsh avarē, nam kaḍe modala herige tavaru maneyavara kharcu anta paddhati. Sīmantada dina ā paddhatina nāvellā sēri badalāyisidvi, āspatre bil makkaḷē kaṭṭidru. Ādre ondu varṣada hinde nāvu nimminda ēnēnu kēḷidvi anta nenesikoṇḍre innū nācike āgutte. Ivattina nāmakaraṇada kharcū nāvu hañckoḷtīvi. Bēḍa anbēḍi.", en: "(quietly, to Appa) Ramesh, among us the custom is that the girl's family pays for the first delivery. At the seemantha we all changed that custom together, and the children paid the hospital themselves. But when I remember what we asked of you a year ago, I'm still ashamed. Let us share the cost of today's naming too. Please don't say no." }
  - { who: appa, t: "ಶಂಕರ್ ಅವರೇ, ಹಂಚ್ಕೊಳ್ಳೋಣ. ಖರ್ಚು ಮಾತ್ರ ಅಲ್ಲ, ಈ ಮಗೂನೂ. ಅವಳಿಗೆ ಎರಡು ಮನೆ, ನಾಲ್ಕು ಅಜ್ಜ-ಅಜ್ಜಿ, ಒಬ್ಬ ಮುತ್ತಜ್ಜಿ. ಅದಕ್ಕಿಂತ ದೊಡ್ಡ ಆಸ್ತಿ ಬೇಕಾ?", tr: "Śaṅkar avarē, hañckoḷḷōṇa. Kharcu mātra alla, ī magūnū. Avaḷige eraḍu mane, nālku ajja-ajji, obba muttajji. Adakkinta doḍḍa āsti bēkā?", en: "Shankar, let's share. Not just the costs — this child too. She has two homes, four grandparents and a great-grandmother. What greater wealth could she need?" }
  - scene: "Ten o'clock. The purohit has lit the lamp and set out plates of rice, turmeric and flowers. Pradeep and Shwetha sit before him with the baby."
  - { who: purohit, t: "ಮುಹೂರ್ತ ಹತ್ತೂವರೆಗೆ. ತಂದೆ-ತಾಯಿ ಮಗುನ ತಗೊಂಡು ಮಣೆ ಮೇಲೆ ಕೂತ್ಕೊಳ್ಳಿ. ಮಗಳೇ, ನಿಮಗೆ ಆಪರೇಷನ್ ಆಗಿದೆ ಅಂತ ಗೊತ್ತು. ನೆಲದ ಮೇಲೆ ಕಷ್ಟ ಆದ್ರೆ ಕುರ್ಚಿ ಮೇಲೇ ಕೂತ್ಕೊಳ್ಳಿ. ದೇವರು ಬೇಜಾರು ಮಾಡ್ಕೊಳ್ಳಲ್ಲ.", tr: "Muhūrta hattūvarege. Tande-tāyi maguna tagoṇḍu maṇe mēle kūtkoḷḷi. Magaḷē, nimage āparēṣan āgide anta gottu. Nelada mēle kaṣṭa ādre kurci mēlē kūtkoḷḷi. Dēvaru bējāru māḍkoḷḷalla.", en: "The auspicious time is half past ten. Father and mother, take the baby and sit on the low wooden seat. Daughter, I know you've had an operation. If the floor is hard for you, sit on a chair. God won't mind." }
  - { who: shwe, t: "ಧನ್ಯವಾದ ಸ್ವಾಮಿ. ಕುರ್ಚಿನೇ ಸರಿ.", tr: "Dhanyavāda svāmi. Kurcinē sari.", en: "Thank you, sir. The chair is better." }
  - { who: purohit, t: "ಮೊದಲು ಪುಣ್ಯಾಹ, ಮನೆ ಶುದ್ಧಿ. ಇವತ್ತಿಗೆ ಹನ್ನೊಂದನೇ ದಿನ, ಸೂತಕ ಮುಗೀತು. ಈಗ ಈ ತಟ್ಟೆಯಲ್ಲಿ ಅಕ್ಕಿ ಹರಡಿ. ತಂದೆ ಉಂಗುರದಿಂದ ಅಕ್ಕಿ ಮೇಲೆ ಹೆಸರು ಬರೀಬೇಕು.", tr: "Modalu puṇyāha, mane śuddhi. Ivattige hannondanē dina, sūtaka mugītu. Īga ī taṭṭeyalli akki haraḍi. Tande uṅguradinda akki mēle hesaru barībēku.", en: "First the punyaha, the purification of the house. Today is the eleventh day; the birth impurity is over. Now spread rice on this plate. The father writes the name in the rice with a ring." }
  - scene: "Shankar slips off his gold ring and hands it to his son. Pradeep writes slowly in the rice. Kiran holds up his phone to film it."
  - { who: purohit, t: "ಈಗ ಮಗುವಿನ ಬಲ ಕಿವಿಯಲ್ಲಿ ಮೂರು ಸಲ ಹೆಸರು ಹೇಳಿ. ಮೊದಲು ನಕ್ಷತ್ರದ ಹೆಸರು, ಆಮೇಲೆ ಕರೆಯೋ ಹೆಸರು.", tr: "Īga maguvina bala kiviyalli mūru sala hesaru hēḷi. Modalu nakṣatrada hesaru, āmēle kareyō hesaru.", en: "Now say the name three times into the baby's right ear. First the nakshatra name, then the name she'll be called by." }
  - { who: pradeep, t: "ಮೀನಾಕ್ಷಿ… ಮೀನಾಕ್ಷಿ… ಮೀನಾಕ್ಷಿ. ಮೀರಾ… ಮೀರಾ… ಮೀರಾ.", tr: "Mīnākṣi… Mīnākṣi… Mīnākṣi. Mīrā… Mīrā… Mīrā.", en: "(whispering) Meenakshi... Meenakshi... Meenakshi. Meera... Meera... Meera." }
  - { who: purohit, t: "ಈಗ ಹಿರಿಯರೆಲ್ಲಾ ಅಕ್ಷತೆ ಹಾಕಿ ಆಶೀರ್ವಾದ ಮಾಡಿ.", tr: "Īga hiriyarellā akṣate hāki āśīrvāda māḍi.", en: "Now let all the elders throw the blessing rice and give their blessings." }
  - { who: sumitra, t: "ಆಯುಷ್ಯ, ಆರೋಗ್ಯ, ವಿದ್ಯೆ ಎಲ್ಲಾ ಸಿಗ್ಲಿ, ಮೀರಾ. ದೊಡ್ಡವಳಾಗಿ ಎರಡೂ ಮನೆಗೆ ಹೆಸರು ತಗೊಂಡು ಬಾ.", tr: "Āyuṣya, ārōgya, vidye ellā sigli, Mīrā. Doḍḍavaḷāgi eraḍū manege hesaru tagoṇḍu bā.", en: "May you have long life, health and learning, Meera. Grow up and bring a good name to both your homes." }
  - { who: shankar, t: "ಚೆನ್ನಾಗಿ ಓದು, ಮಗೂ. ಯಾರ ಮುಂದೂ ತಲೆ ತಗ್ಗಿಸೋ ಕೆಲಸ ಮಾಡಬೇಡ. ನಾವು ಮಾಡಿದ ತಪ್ಪನ್ನ ನಿನ್ನ ಕಾಲದಲ್ಲಿ ಯಾರೂ ಮಾಡದೇ ಇರಲಿ.", tr: "Cennāgi ōdu, magū. Yāra mundū tale taggisō kelasa māḍabēḍa. Nāvu māḍida tappanna ninna kāladalli yārū māḍadē irali.", en: "Study well, little one. Never do anything that makes you hang your head before anyone. And in your time, may nobody make the mistake we made." }

  - section: "🎶 The cradle"
    learn: "toṭṭilu śāstra · jōguḷa (lullaby) · tūgu (to rock, swing) · koṭṭe / tagoṇḍe (given / taken) · wishes with -ali / -li"
  - scene: "The women gather round the cradle. Vimala Aunty, in her best silk sari, takes charge."
  - { who: vimala, t: "ಮೊದಲು ತೊಟ್ಟಿಲಲ್ಲಿ ಗುಂಡುಕಲ್ಲು ಇಡಬೇಕು, ಮಗು ಕಲ್ಲಿನ ಥರ ಗಟ್ಟಿಯಾಗಿ ಬೆಳೀಲಿ ಅಂತ. ಆಮೇಲೆ ತೊಟ್ಟಿಲ ಕೆಳಗಿಂದ ಮಗುನ ಒಬ್ಬರಿಂದ ಒಬ್ಬರಿಗೆ ಕೊಡಬೇಕು. ನಮ್ ಕಡೆ ಹೀಗೇ ಮಾಡೋದು.", tr: "Modalu toṭṭilalli guṇḍukallu iḍabēku, magu kallina thara gaṭṭiyāgi beḷīli anta. Āmēle toṭṭila keḷaginda maguna obbarinda obbarige koḍabēku. Nam kaḍe hīgē māḍōdu.", en: "First a round grinding stone goes into the cradle, so the baby grows up strong as stone. Then the baby is passed from one person to another under the cradle. That's how we do it in our parts." }
  - { who: sumitra, t: "ನಾನು “ಕೊಟ್ಟೆ” ಅಂತ ಕೊಡ್ತೀನಿ, ನೀವು “ತಗೊಂಡೆ” ಅಂತ ತಗೊಳ್ಳಿ, ಲಕ್ಷ್ಮಿ ಅವರೇ. ಮೂರು ಸಲ.", tr: "Nānu “koṭṭe” anta koḍtīni, nīvu “tagoṇḍe” anta tagoḷḷi, Lakshmī avarē. Mūru sala.", en: "I'll pass her saying “given”, and you take her saying “taken”, Lakshmi. Three times." }
  - scene: "Sumitra and Amma pass the baby to each other under the swaying cradle, three times. Then Amma lays her inside. The baby looks up at the jasmine and, for once, does not cry."
  - { who: amma, t: "ಅತ್ತೆ, ಜೋಗುಳ ನೀವೇ ಹಾಡಿ. ಶ್ವೇತಾಗೂ ಕಿರಣ್‌ಗೂ ನೀವೇ ಹಾಡಿದ್ದು.", tr: "Atte, jōguḷa nīvē hāḍi. Shwētāgū Kiraṇgū nīvē hāḍiddu.", en: "Atte, you sing the lullaby. You're the one who sang it for Shwetha and Kiran." }
  - { who: ajji, t: "ಧ್ವನಿ ಮೊದಲಿನ ಹಾಗಿಲ್ಲ… ಆದ್ರೂ ಹಾಡ್ತೀನಿ. ಜೋ ಜೋ ಶ್ರೀ ಕೃಷ್ಣ ಪರಮಾನಂದ… ಜೋ ಜೋ ಗೋಪಿಯ ಕಂದ ಮುಕುಂದ…", tr: "Dhvani modalina hāgilla… ādrū hāḍtīni. Jō jō Śrī Kṛṣṇa paramānanda… jō jō gōpiya kanda Mukunda…", en: "My voice isn't what it was... but I'll sing. (singing) Hush, hush, Sri Krishna, highest joy... hush, hush, Gopi's little one, Mukunda..." }
  - scene: "Ajji sings two verses in her thin, steady voice while Amma rocks the cradle. Sumitra wipes her eyes with the end of her sari. At the back of the room, Sam has lowered his phone."
  - { who: sam, t: "ನಾನು ಇಲ್ಲಿಗೆ ಬಂದ ಮೊದಲ ದಿನ ಅಜ್ಜಿ ಕೇಳಿದ ಮೊದಲ ಪ್ರಶ್ನೆ “ಊಟ ಆಯ್ತಾ?”. ಇವತ್ತು ಇದು… ಇದನ್ನ ನಾನು ಯಾವತ್ತೂ ಮರೆಯಲ್ಲ.", tr: "Nānu illige banda modala dina ajji kēḷida modala praśne “ūṭa āytā?”. Ivattu idu… idanna nānu yāvattū mareyalla.", en: "(quietly, to Kiran) The first question Ajji asked me on my first day here was “Have you eaten?”. And today, this... I'll never forget this." }
  - { who: kiran, t: "ಆಗಸ್ಟ್‌ನಲ್ಲಿ ಆ ರಾತ್ರಿ ಆಂಬುಲೆನ್ಸ್ ನಮ್ ಗೇಟ್ ಹತ್ರ ನಿಂತಾಗ, ಈ ದಿನ ಬರುತ್ತೆ ಅಂತ ನಾನು ಅಂದ್ಕೊಂಡಿರಲಿಲ್ಲ, ಸ್ಯಾಮ್.", tr: "Āgasṭ-nalli ā rātri āmbulens nam gēṭ hatra nintāga, ī dina barutte anta nānu andkoṇḍiralilla, Sām.", en: "That night in August, when the ambulance stood at our gate, I didn't think this day would ever come, Sam." }

  - section: "🌳 Three generations"
    learn: "talemāru (generation) · then and now: -ttidru / īga … · relative clauses: herige āda heṇṇu · last wishes: -ōdu bēḍa, -ali, -ōvāga"
  - scene: "Afternoon. The lunch on banana leaves is over. The guests sit around the cradle on mats and chairs. Ajji taps her steel tumbler with a spoon."
  - { who: ajji, t: "ಎಲ್ರೂ ಸ್ವಲ್ಪ ಕೂತ್ಕೊಳ್ಳಿ. ಈ ಮುದುಕಿ ಎರಡು ಮಾತು ಹೇಳ್ಬೇಕು. ಆಮೇಲೆ ನಾನು ಮಲಗ್ಬೇಕು, ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ದಾರೆ.", tr: "Elrū svalpa kūtkoḷḷi. Ī muduki eraḍu mātu hēḷbēku. Āmēle nānu malagbēku, ḍākṭru hēḷiddāre.", en: "Everyone sit down a moment. This old woman has a few words to say. After that I have to lie down — doctor's orders." }
  - { who: ajji, t: "ಮೂರು ತಿಂಗಳ ಹಿಂದೆ ನಾನು ಜಯದೇವದಲ್ಲಿ ಮಲಗಿದ್ದೆ. ಎದೆ ಮೇಲೆ ವೈರ್, ಕೈಗೆ ಸೂಜಿ. ಆಗ ಒಂದೇ ಯೋಚನೆ: ಈ ಮಗುನ ನೋಡ್ತೀನೋ ಇಲ್ವೋ. ಇವತ್ತು ಅವಳ ತೊಟ್ಟಿಲು ತೂಗಿದ್ದೀನಿ. ದೇವರಿಗೂ, ಡಾಕ್ಟ್ರಿಗೂ, ನಿಮಗೆಲ್ಲಾ ಕೈ ಮುಗೀತೀನಿ.", tr: "Mūru tiṅgaḷa hinde nānu Jayadēvadalli malagidde. Ede mēle vair, kaige sūji. Āga ondē yōcane: ī maguna nōḍtīnō ilvō. Ivattu avaḷa toṭṭilu tūgiddīni. Dēvarigū, ḍākṭrigū, nimagellā kai mugītīni.", en: "Three months ago I was lying in Jayadeva. Wires on my chest, a needle in my arm. Only one thought then: will I see this child or not. Today I have rocked her cradle. I fold my hands to God, to the doctors, and to all of you." }
  - { who: ajji, t: "ನನ್ನ ಕಾಲದಲ್ಲಿ ಹೆಣ್ಣು ಮಗು ಹುಟ್ಟಿದ್ರೆ ಕೆಲವು ಮನೆಗಳಲ್ಲಿ ಮುಖ ಸಪ್ಪಗೆ ಮಾಡ್ತಿದ್ರು. ಹುಟ್ಟಿದ ದಿನವೇ ವರದಕ್ಷಿಣೆ ಲೆಕ್ಕ ಹಾಕ್ತಿದ್ರು. ಅದನ್ನೆಲ್ಲಾ ನಾನು ಕಣ್ಣಾರೆ ನೋಡಿದ್ದೀನಿ.", tr: "Nanna kāladalli heṇṇu magu huṭṭidre kelavu manegaḷalli mukha sappage māḍtidru. Huṭṭida dinavē varadakṣiṇe lekka hāktidru. Adannellā nānu kaṇṇāre nōḍiddīni.", en: "In my time, in some houses, faces fell when a girl was born. They'd start counting the dowry on the very day she was born. I've seen all that with my own eyes." }
  - { who: ajji, t: "ಲಕ್ಷ್ಮಿ ಕಾಲದಲ್ಲಿ ಹೆಣ್ಣು ಮಕ್ಕಳು ಓದೋಕೆ ಶುರು ಮಾಡಿದ್ರು, ಆದ್ರೆ ಕೆಲಸಕ್ಕೆ ಹೋಗೋಕೆ ಎಲ್ರೂ ಬಿಡ್ತಿರಲಿಲ್ಲ. ಶ್ವೇತಾ ಕಾಲದಲ್ಲಿ ಅವಳು ಒಂದು ಟೀಮ್ ನಡೆಸ್ತಾಳೆ, ಅವಳ ಗಂಡ ರಾತ್ರಿ ಮಗುವಿಗೆ ಬಾಟಲ್ ಕೊಡ್ತಾನೆ. ಮೂರು ತಲೆಮಾರು, ಮೂರು ಪ್ರಪಂಚ.", tr: "Lakshmī kāladalli heṇṇu makkaḷu ōdōke śuru māḍidru, ādre kelasakke hōgōke elrū biḍtiralilla. Shwētā kāladalli avaḷu ondu ṭīm naḍestāḷe, avaḷa gaṇḍa rātri maguvige bāṭal koḍtāne. Mūru talemāru, mūru prapañca.", en: "In Lakshmi's time girls began to study, but not everyone let them go out to work. In Shwetha's time she runs a team, and her husband gives the baby a bottle at night. Three generations, three worlds." }
  - { who: ajji, t: "ಆದ್ರೆ ಒಂದು ವಿಷಯ ಬದಲಾಗಿಲ್ಲ. ಹೆರಿಗೆ ಆದ ಹೆಣ್ಣಿಗೆ ಮನೆಯವರ ಕೈ ಬೇಕು. ನಾನು ಒಬ್ಬಳೇ ಕೂತು ಅತ್ತಿದ್ದೆ. ಶ್ವೇತಾ ಒಬ್ಬಳೇ ಅಳೋದು ಬೇಡ. ಮೀರಾ ಯಾವತ್ತೂ ಒಬ್ಬಳೇ ಅಳೋದು ಬೇಡ. ಅಷ್ಟೇ ನನ್ನ ಆಸೆ.", tr: "Ādre ondu viṣaya badalāgilla. Herige āda heṇṇige maneyavara kai bēku. Nānu obbaḷē kūtu attidde. Shwētā obbaḷē aḷōdu bēḍa. Mīrā yāvattū obbaḷē aḷōdu bēḍa. Aṣṭē nanna āse.", en: "But one thing hasn't changed. A woman who has just given birth needs her family's hands. I sat and cried alone. Shwetha must not cry alone. Meera must never cry alone. That is all I wish for." }
  - { who: ajji, t: "ಸುಮಿತ್ರಾ, ಶಂಕರ್, ನಾವು ಹಳಬರು ಎಷ್ಟೋ ತಪ್ಪು ಮಾಡಿದ್ದೀವಿ. ನಾನೂ ಮಾಡಿದ್ದೀನಿ. ತಪ್ಪು ಒಪ್ಕೊಂಡು ಮುಂದೆ ಬರೋದೇ ದೊಡ್ಡತನ. ನೀವು ಅದನ್ನ ಮಾಡಿದ್ರಿ. ಈ ಮಗು ಎರಡು ಮನೆಗಳ ಮಧ್ಯೆ ಸೇತುವೆ.", tr: "Sumitrā, Śaṅkar, nāvu haḷabaru eṣṭō tappu māḍiddīvi. Nānū māḍiddīni. Tappu opkoṇḍu munde barōdē doḍḍatana. Nīvu adanna māḍidri. Ī magu eraḍu manegaḷa madhye sētuve.", en: "Sumitra, Shankar, we old people have made many mistakes. I have too. Admitting a mistake and moving on — that is true greatness. You did that. This child is a bridge between two homes." }
  - { who: shankar, t: "ಅಮ್ಮಾ, ನಿಮ್ಮ ಮಾತೇ ನಮಗೆ ಆಶೀರ್ವಾದ.", tr: "Ammā, nimma mātē namage āśīrvāda.", en: "(his voice thick) Amma, your words are our blessing." }
  - { who: ajji, t: "ಮತ್ತೆ ನನ್ನ ಮರಿಮೊಮ್ಮಗಳಿಗೆ… ಮೀರಾ, ಮೀನು, ಮೀನಾಕ್ಷಿ, ಯಾವ ಹೆಸರಾದ್ರೂ ಸರಿ. ಓದು, ಪ್ರಪಂಚ ನೋಡು, ನಿನಗೆ ಸರಿ ಅನ್ನಿಸಿದ್ದನ್ನ ಮಾಡು. ಆದ್ರೆ ಎಲ್ಲಿ ಹೋದ್ರೂ ಈ ಮನೆಯ ದಾರಿ ಮರೀಬೇಡ. ತವರು ಮನೆ ಬಾಗಿಲು ಯಾವಾಗ್ಲೂ ತೆಗೆದೇ ಇರುತ್ತೆ.", tr: "Matte nanna marimommagaḷige… Mīrā, Mīnu, Mīnākṣi, yāva hesarādrū sari. Ōdu, prapañca nōḍu, ninage sari annisiddanna māḍu. Ādre elli hōdrū ī maneya dāri marībēḍa. Tavaru mane bāgilu yāvāglū tegedē irutte.", en: "And to my great-granddaughter... Meera, Meenu, Meenakshi — whatever the name. Study, see the world, do what you feel is right. But wherever you go, don't forget the way to this house. The door of your mother's home will always be open." }
  - { who: shwe, t: "ಅಜ್ಜಿ, ಈ ಮಾತನ್ನ ನೀವು ಅವಳಿಗೆ ಮತ್ತೆ ಹೇಳಬೇಕು. ಅವಳಿಗೆ ಅರ್ಥ ಆಗೋವಷ್ಟು ದೊಡ್ಡವಳಾದಾಗ. ನಿಮ್ಮ ಬಾಯಿಂದಲೇ.", tr: "Ajji, ī mātanna nīvu avaḷige matte hēḷabēku. Avaḷige artha āgōvaṣṭu doḍḍavaḷādāga. Nimma bāyindalē.", en: "Ajji, you'll have to say this to her again — when she's old enough to understand. From your own mouth." }
  - { who: ajji, t: "ದೇವರ ದಯೆ ಇದ್ರೆ ಹೇಳ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ… ನೀನು ಹೇಳು. ನೀನು ಹೇಳೋವಾಗ ನಾನು ಅಲ್ಲೇ ಇರ್ತೀನಿ, ಕಣೇ.", tr: "Dēvara daye idre hēḷtīni. Illāndre… nīnu hēḷu. Nīnu hēḷōvāga nānu allē irtīni, kaṇē.", en: "If God is kind, I'll tell her myself. If not... you tell her. When you tell her, I'll be right there, dear." }
  - scene: "Nobody speaks. In the cradle, the baby yawns, pushes one small fist out of her new frock and falls asleep. Amma gives the cradle one more gentle push."
  - { who: amma, t: "ಜೋ ಜೋ… ಮಲಗು ಮೀರಾ. ನಾವೆಲ್ಲಾ ಇಲ್ಲೇ ಇದ್ದೀವಿ.", tr: "Jō jō… malagu Mīrā. Nāvellā illē iddīvi.", en: "Hush, hush... sleep, Meera. We're all right here." }
