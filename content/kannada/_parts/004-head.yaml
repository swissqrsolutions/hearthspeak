level: "B2 → B2+ · ~1 h 30 min"
title:
  t: "ನಮ್ಮ ದರ್ಶಿನಿ"
  tr: "Namma darshini"
  en: "Our darshini"
intro: "Mahesh Upadhya, a hotel supervisor from Udupi, opens a small standing restaurant in Jayanagar with his wife Kavya, his mother and his cousin Nitin. One real year, October 2025 to November 2026: the money and the MUDRA loan, the shop space, every licence, the kitchen and suppliers, the team, opening day, the March 2026 gas crisis, the wage order, the delivery apps, an inspector, a chain café next door and the one-year accounts."
