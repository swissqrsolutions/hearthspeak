lang: kannada
num: 3
level: "B2 → B2+ · ~1 h 30 min"
title:
  t: "ಮೂರು ತಲೆಮಾರು"
  tr: "Mūru talemāru"
  en: "Three generations"
intro: "One year after Lesson 1. Shwetha married Pradeep without a rupee of dowry, and in February 2026 she finds out she is pregnant. In August, Ajji collapses with a heart attack. This lesson follows the Rao family through doctors, the 108 ambulance, Jayadeva hospital, insurance desks, maternity leave, the seemantha, a difficult delivery and the naming ceremony — and Ajji's fight to hold her great-grandchild. Sam still lives with them, now speaking good Kannada."
