lines:
  - chapter: Chapter 4 — The lawyer and the purchase
  - section: 🤝 The deal is agreed — on one condition
    learn: 'hearsay -ante (apparently) · ‘only if’: -idre mātra · a proverb about patience'
  - scene: Sunday night, the family's rented flat in Vijayanagar. Ravi puts down the phone after a call from Lokesh.
  - who: ravi
    t: ಲೋಕೇಶ್ ಫೋನ್ ಮಾಡಿದ್ರು. ಚಂದ್ರಶೇಖರ್ ಅವರು ಬುಧವಾರದೊಳಗೆ ಎಲ್ಲಾ ಪೇಪರ್ಸ್ ಕಳಿಸ್ತಾರಂತೆ, ಹತ್ತು ದಿನ ಬೇರೆ ಯಾರಿಗೂ ಸೈಟು ತೋರಿಸಲ್ವಂತೆ. ಆದ್ರೆ ನನ್ನ ಕಂಡೀಷನ್ ಬದಲಾಗಲ್ಲ — ಲಾಯರ್ ಕ್ಲಿಯರ್ ಮಾಡಿದ್ರೆ ಮಾತ್ರ ಮುಂದೆ ಹೋಗೋದು.
    tr: Lōkēsh phōn māḍidru. Chandrashēkar avaru budhavāradoḷage ellā pēpars kaḷistārante, hattu dina bēre yārigū saiṭu tōrisalvante. Ādre nanna kanḍīṣan badalāgalla — lāyar kliyar māḍidre mātra munde hōgōdu.
    en: 'Lokesh called. Apparently Chandrashekar will send all the papers by Wednesday, and he won''t show the site to anyone else for ten days. But my condition doesn''t change: we go ahead only if the lawyer clears it.'
  - who: deepa
    t: ಸರಿಯಾದ ಕಂಡೀಷನ್. ನಿನ್ನ ಕಲೀಗ್ ಹೇಳಿದ ಆ ವಕೀಲರು, ರಾಘವೇಂದ್ರ ರಾವ್ — ಪ್ರಾಪರ್ಟಿ ಡಾಕ್ಯುಮೆಂಟ್ಸ್ ತುಂಬಾ ಸೂಕ್ಷ್ಮವಾಗಿ ನೋಡ್ತಾರಂತೆ, ಅಲ್ವಾ?
    tr: Sariyāda kanḍīṣan. Ninna kalīg hēḷida ā vakīlaru, Rāghavēndra Rāv — prāparṭi ḍākyumenṭs tumbā sūkṣmavāgi nōḍtārante, alvā?
    en: The right condition. That lawyer your colleague mentioned, Raghavendra Rao — apparently he goes through property documents very carefully, doesn't he?
  - who: appa
    t: ಒಳ್ಳೇದು. ‘ನಿಧಾನವೇ ಪ್ರಧಾನ’ ಅಂತಾರೆ. ಬೆಳಿಗ್ಗೆ ಸೈಟು ನೋಡೋಕೆ ಚೆನ್ನಾಗಿತ್ತು. ಈಗ ಪೇಪರ್ ಕೂಡ ಅಷ್ಟೇ ಚೆನ್ನಾಗಿದ್ಯಾ ಅಂತ ನಿಧಾನವಾಗಿ ನೋಡೋಣ.
    tr: Oḷḷēdu. ‘Nidhānavē pradhāna’ antāre. Beḷigge saiṭu nōḍōke chennāgittu. Īga pēpar kūḍa aṣṭē chennāgidyā anta nidhānavāgi nōḍōṇa.
    en: Good. They say, ‘Slow and steady is what counts.’ This morning the site looked fine. Now let's take our time and see whether the papers are just as fine.
  - who: amma
    t: ಲಾಯರ್ ಫೀಸ್ ಎಷ್ಟು ಆಗುತ್ತೋ ಏನೋ…
    tr: Lāyar phīs eṣṭu āguttō ēnō…
    en: Who knows how much the lawyer's fee will be…
  - who: ravi
    t: ಹದಿನೈದು-ಇಪ್ಪತ್ತು ಸಾವಿರ ಆಗ್ಬೋದು ಅಮ್ಮ. ಐವತ್ತು ಲಕ್ಷದ ವ್ಯವಹಾರದಲ್ಲಿ ಅದು ಖರ್ಚು ಅಲ್ಲ, ಇನ್ಶೂರೆನ್ಸ್.
    tr: Hadinaidu-ippattu sāvira āgbōdu amma. Aivattu lakṣada vyavahāradalli adu kharchu alla, inshūrens.
    en: Maybe fifteen or twenty thousand, Amma. In a fifty-lakh deal that's not an expense — it's insurance.
  - who: deepa
    t: ಬುಧವಾರ ಜೆರಾಕ್ಸ್ ಬಂದ ತಕ್ಷಣ ಲಾಯರ್‌ಗೆ ಕಳಿಸು. ಗುರುವಾರದೊಳಗೆ ಅವರು ಓದಿರ್ತಾರೆ. ಒರಿಜಿನಲ್ಸ್ ಅವರ ಆಫೀಸ್‌ನಲ್ಲೇ ನೋಡೋಣ.
    tr: Budhavāra jerāks banda takṣaṇa lāyar-ge kaḷisu. Guruvāradoḷage avaru ōdirtāre. Orijinals avara āphīsnallē nōḍōṇa.
    en: The moment the photocopies come on Wednesday, send them to the lawyer. He'll have read them by Thursday. We'll look at the originals at his office.
  - section: ⚖️ Thirty years on paper
    learn: 'title vocabulary: mūla patra, ṛṇabhāra pramāṇapatra, bhū parivartane · tracing a chain: yārinda yārige · counterfactual -iddidre … -tirlilla'
  - scene: 'Thursday evening. Advocate Raghavendra Rao''s office in Basavanagudi: shelves of files tied with red tape, a slow ceiling fan. Ravi and Deepa sit across the desk from him.'
  - who: lawyer
    t: 'ಬನ್ನಿ, ಕೂತ್ಕೊಳ್ಳಿ. ನೀವು ಕಳಿಸಿದ ಕಾಪಿ ಎಲ್ಲಾ ನೋಡಿದೀನಿ. ಮೊದಲು ಒಂದು ಮಾತು: ಸೈಟು ಚೆನ್ನಾಗಿದೆಯಾ ಇಲ್ವಾ ಅಂತ ನಾನು ಹೇಳಲ್ಲ. ಟೈಟಲ್ ಕ್ಲೀನ್ ಆಗಿದೆಯಾ ಅಂತ ಮಾತ್ರ ಹೇಳ್ತೀನಿ.'
    tr: 'Banni, kūtkoḷḷi. Nīvu kaḷisida kāpi ellā nōḍidīni. Modalu ondu mātu: saiṭu chennāgideyā ilvā anta nānu hēḷalla. Ṭaiṭal klīn āgideyā anta mātra hēḷtīni.'
    en: 'Come, sit down. I''ve gone through all the copies you sent. First, one thing: I won''t tell you whether the site is good or not. I''ll only tell you whether the title is clean.'
  - who: ravi
    t: ನಮಗೆ ಬೇಕಾಗಿರೋದು ಅದೇ ಸಾರ್. ಟೈಟಲ್ ಅಂದ್ರೆ ನಿಖರವಾಗಿ ಏನೇನು ನೋಡ್ತೀರಿ?
    tr: Namage bēkāgirōdu adē sār. Ṭaiṭal andre nikharavāgi ēnēnu nōḍtīri?
    en: That's exactly what we need, sir. When you say ‘title’, what exactly do you check?
  - who: lawyer
    t: ಮೂವತ್ತು ವರ್ಷದ ಸರಪಳಿ. ಈ ಜಮೀನು ಮೂವತ್ತು ವರ್ಷದಲ್ಲಿ ಯಾರಿಂದ ಯಾರಿಗೆ ಹೋಯ್ತು, ಪ್ರತಿ ಸಲ ಸರಿಯಾದ ಕ್ರಯಪತ್ರ ಆಗಿದೆಯಾ, ಮಧ್ಯದಲ್ಲಿ ಯಾರಾದ್ರೂ ಇನ್ನೂ ಹಕ್ಕು ಕೇಳೋ ಸಾಧ್ಯತೆ ಇದೆಯಾ — ಇದೆಲ್ಲಾ.
    tr: Mūvattu varṣada sarapaḷi. Ī jamīnu mūvattu varṣadalli yārinda yārige hōytu, prati sala sariyāda krayapatra āgideyā, madhyadalli yārādrū innū hakku kēḷō sādhyate ideyā — idellā.
    en: The thirty-year chain. Who this land passed from and to over thirty years, whether there was a proper sale deed every time, whether anyone along the way could still claim a right — all of that.
  - who: lawyer
    t: ನೋಡಿ. ಸರ್ವೆ ನಂಬರ್ ನಲವತ್ತೇಳು, ಕೊಮ್ಮಘಟ್ಟ ಗ್ರಾಮ. ತೊಂಬತ್ತರ ದಶಕದಲ್ಲಿ ಇದು ಮುನಿಯಪ್ಪ ಅನ್ನೋ ರೈತರ ಕೃಷಿ ಜಮೀನು. ತೊಂಬತ್ತಾರರಲ್ಲಿ ಅವರ ಮಕ್ಕಳ ಮಧ್ಯೆ ಭಾಗ ಆಯ್ತು. ಆ ವಿಭಾಗ ಪತ್ರ ರಿಜಿಸ್ಟರ್ ಆಗಿದೆ.
    tr: Nōḍi. Sarve nambar nalavattēḷu, Kommaghaṭṭa grāma. Tombattara dashakadalli idu Muniyappa annō raitara kṛṣi jamīnu. Tombattāraralli avara makkaḷa madhye bhāga āytu. Ā vibhāga patra rijisṭar āgide.
    en: Look. Survey number forty-seven, Kommaghatta village. In the nineties this was farmland belonging to a farmer called Muniyappa. In '96 it was partitioned among his children. That partition deed is registered.
  - who: lawyer
    t: ಎರಡು ಸಾವಿರದ ನಾಲ್ಕರಲ್ಲಿ ಒಬ್ಬ ಡೆವಲಪರ್ ಅದನ್ನ ಕೊಂಡ್ಕೊಂಡ್ರು. ಐದರಲ್ಲಿ ಡಿಸಿ ಕನ್ವರ್ಷನ್ — ಅಂದ್ರೆ ಭೂ ಪರಿವರ್ತನೆ ಆದೇಶ — ಕೃಷಿ ಜಮೀನು ವಸತಿ ಉದ್ದೇಶಕ್ಕೆ ಬದಲಾಯ್ತು. ಆರರಲ್ಲಿ ಬಿಎಂಆರ್‌ಡಿಎ ಲೇಔಟ್ ಪ್ಲಾನ್ ಅಪ್ರೂವ್ ಮಾಡ್ತು.
    tr: Eraḍu sāvirada nālkaralli obba ḍevalapar adanna konḍkonḍru. Aidaralli ḍisi kanvarṣan — andre bhū parivartane ādēsha — kṛṣi jamīnu vasati uddēshakke badalāytu. Āraralli bi-em-ār-ḍi-e lē-auṭ plān aprūv māḍtu.
    en: In 2004 a developer bought it. In 2005 came the DC conversion — the land-conversion order — which changed it from farmland to residential use. In 2006 BMRDA approved the layout plan.
  - who: lawyer
    t: ಚಂದ್ರಶೇಖರ್ ಅವರು ಎರಡು ಸಾವಿರದ ಏಳರಲ್ಲಿ ಡೆವಲಪರ್ ಹತ್ರ ಈ ಸೈಟು ಕೊಂಡ್ಕೊಂಡ್ರು. ಅದೇ ಅವರ ಮೂಲ ಪತ್ರ, ಮದರ್ ಡೀಡ್. ಅದರಲ್ಲಿರೋ ಚಕ್ಕುಬಂದಿ — ನಾಲ್ಕೂ ದಿಕ್ಕಿನ ಗಡಿ — ಸರ್ವೇ ಸ್ಕೆಚ್‌ಗೆ ಸರಿಯಾಗಿ ಹೊಂದುತ್ತೆ.
    tr: Chandrashēkar avaru eraḍu sāvirada ēḷaralli ḍevalapar hatra ī saiṭu konḍkonḍru. Adē avara mūla patra, madar ḍīḍ. Adarallirō chakkubandi — nālkū dikkina gaḍi — sarvē skech-ge sariyāgi hondutte.
    en: Chandrashekar bought this site from the developer in 2007. That's his original deed — the mother deed. The boundaries it lists, on all four sides, match the survey sketch exactly.
  - who: deepa
    t: ಡೆವಲಪರ್ ಹತ್ರ ತಗೊಂಡಿದಾರೆ ಅಂದ್ರೆ, ಆ ಡೆವಲಪರ್‌ಗೆ ಸೈಟು ಮಾರೋ ಹಕ್ಕು ಆಗ ಇತ್ತಾ ಅಂತಾನೂ ನೋಡ್ಬೇಕಲ್ವಾ ಸಾರ್?
    tr: Ḍevalapar hatra tagonḍidāre andre, ā ḍevalaparge saiṭu mārō hakku āga ittā antānū nōḍbēkalvā sār?
    en: If he bought it from a developer, shouldn't we also check whether the developer had the right to sell sites at that point, sir?
  - who: lawyer
    t: ಸರಿಯಾದ ಪ್ರಶ್ನೆ ಮೇಡಂ. ಅದಕ್ಕೇ ರಿಲೀಸ್ ಆರ್ಡರ್ ನೋಡಿದೆ. ಬಿಎಂಆರ್‌ಡಿಎ ಲೇಔಟ್ ಸೈಟುಗಳನ್ನ ಹಂತ ಹಂತವಾಗಿ ಬಿಡುಗಡೆ ಮಾಡುತ್ತೆ. ನಿಮ್ಮ ಸೈಟು ನಂಬರ್ ಎರಡನೇ ಬಿಡುಗಡೆ ಆದೇಶದಲ್ಲಿದೆ. ಅಂದ್ರೆ ಆ ಮಾರಾಟ ಕಾನೂನುಬದ್ಧ.
    tr: Sariyāda prashne mēḍam. Adakkē rilīs ārḍar nōḍide. Bi-em-ār-ḍi-e lē-auṭ saiṭugaḷanna hanta hantavāgi biḍugaḍe māḍutte. Nimma saiṭu nambar eraḍanē biḍugaḍe ādēshadallide. Andre ā mārāṭa kānūnubaddha.
    en: The right question, ma'am. That's why I checked the release order. BMRDA releases a layout's sites in stages. Your site number is in the second release order. So that sale was legal.
  - who: lawyer
    t: 'ಇನ್ನೊಂದು: ಈ ಸೈಟು ಪಾರ್ಕ್ ಜಾಗದಲ್ಲೂ ಇಲ್ಲ, ಸಿಎ ಸೈಟ್ ಜಾಗದಲ್ಲೂ ಇಲ್ಲ. ಅಪ್ರೂವ್ಡ್ ಪ್ಲಾನ್‌ನಲ್ಲಿ ಇದನ್ನ ವಸತಿ ನಿವೇಶನ ಅಂತಾನೇ ತೋರಿಸಿದಾರೆ. ಕೆರೆ ಬಫರ್, ರಾಜಕಾಲುವೆ — ಯಾವುದೂ ಹತ್ರ ಇಲ್ಲ.'
    tr: 'Innondu: ī saiṭu pārk jāgadallū illa, si-e saiṭ jāgadallū illa. Aprūvḍ plānnalli idanna vasati nivēshana antānē tōrisidāre. Kere baphar, rājakāluve — yāvudū hatra illa.'
    en: 'Another thing: this site isn''t on land meant for a park, or for a civic-amenity site. The approved plan shows it as a residential plot. Lake buffer, storm-water drain — nothing of the kind nearby.'
  - who: ravi
    t: ಸಾರ್, ಇನ್ನೊಂದು ವಿಷಯ. ನಾವು ಅಳತೆ ಮಾಡಿದಾಗ ನಲವತ್ತೆಂಟನೇ ನಂಬರ್ ಕಡೆ ಮೂವತ್ತೊಂಬತ್ತೂವರೆ ಅಡಿ ಮಾತ್ರ ಬಂತು. ಎರಡು ಸಾವಿರದ ಹದಿನಾರರಲ್ಲಿ ಆ ಕಡೆಯವರ ಜೊತೆ ಗಡಿ ತಕರಾರು ಆಗಿತ್ತಂತೆ.
    tr: Sār, innondu viṣaya. Nāvu aḷate māḍidāga nalavatteṇṭanē nambar kaḍe mūvattombattūvare aḍi mātra bantu. Eraḍu sāvirada hadināraralli ā kaḍeyavara jote gaḍi takarāru āgittante.
    en: Sir, one more thing. When we measured, the side next to number forty-eight came to only thirty-nine and a half feet. Apparently there was a boundary dispute with the people on that side in 2016.
  - who: lawyer
    t: ಅದನ್ನೂ ನೋಡಿದೀನಿ. ಸರ್ವೇ ಸ್ಕೆಚ್, ಎರಡೂ ಕಡೆಯವರು ಸಹಿ ಹಾಕಿರೋ ರಾಜಿ ಪತ್ರ — ಎರಡೂ ಇವೆ. ಯಾವ ಕೋರ್ಟ್‌ನಲ್ಲೂ ಕೇಸ್ ಇಲ್ಲ, ಇ-ಕೋರ್ಟ್ಸ್‌ನಲ್ಲಿ ನಾನೇ ಹುಡುಕಿದೆ. ಮಂಗಳವಾರ ಸರ್ವೇಯರ್ ಬಂದು ಸ್ಕೆಚ್ ಪ್ರಕಾರ ಕಲ್ಲನ್ನ ಮತ್ತೆ ನೆಟ್ಟಿದಾರೆ. ಈಗ ಪೂರ್ತಿ ನಲವತ್ತು ಅಡಿ.
    tr: Adannū nōḍidīni. Sarvē skech, eraḍū kaḍeyavaru sahi hākirō rāji patra — eraḍū ive. Yāva kōrṭnallū kēs illa, I-kōrṭsnalli nānē huḍukide. Maṅgaḷavāra sarvēyar bandu skech prakāra kallanna matte neṭṭidāre. Īga pūrti nalavattu aḍi.
    en: I've looked at that too. The survey sketch and the settlement letter signed by both sides — both are here. There's no case in any court; I searched eCourts myself. On Tuesday a surveyor came and reset the stone as per the sketch. It's a full forty feet now.
  - who: ravi
    t: ಸಮಾಧಾನ ಆಯ್ತು. ಈಗ ಇಸಿ ಬಗ್ಗೆ ಹೇಳಿ ಸಾರ್. ‘ಫಾರ್ಮ್ ಹದಿನೈದು’ ಅಂತ ಬಂದಿದೆ. ಅದು ಕೆಟ್ಟದಾ?
    tr: Samādhāna āytu. Īga isi bagge hēḷi sār. ‘Phārm hadinaidu’ anta bandide. Adu keṭṭadā?
    en: That's a relief. Now tell us about the EC, sir. It says ‘Form 15’. Is that bad?
  - who: lawyer
    t: ಭಯ ಬೇಡ. ಋಣಭಾರ ಪ್ರಮಾಣಪತ್ರ ಅಂದ್ರೆ ಆ ಆಸ್ತಿ ಮೇಲೆ ನೋಂದಣಿ ಆದ ಎಲ್ಲಾ ವ್ಯವಹಾರಗಳ ಪಟ್ಟಿ. ಏನೂ ವ್ಯವಹಾರ ಇಲ್ಲದಿದ್ರೆ ಫಾರ್ಮ್ ಹದಿನಾರು. ಏನಾದ್ರೂ ಇದ್ರೆ ಫಾರ್ಮ್ ಹದಿನೈದು. ಒಂದು ಸಲ ಮಾರಾಟ ಆಗಿರೋ ಸೈಟಿಗೆ ಯಾವಾಗ್ಲೂ ಹದಿನೈದೇ ಬರೋದು.
    tr: Bhaya bēḍa. Ṛṇabhāra pramāṇapatra andre ā āsti mēle nōndaṇi āda ellā vyavahāragaḷa paṭṭi. Ēnū vyavahāra illadidre phārm hadināru. Ēnādrū idre phārm hadinaidu. Ondu sala mārāṭa āgirō saiṭige yāvāglū hadinaidē barōdu.
    en: Don't be afraid. An encumbrance certificate is a list of every registered transaction on the property. If there are none, it's Form 16. If there are any, Form 15. A site that has been sold even once will always get Form 15.
  - who: lawyer
    t: ಆದ್ರೆ ಇದರಲ್ಲಿ ಒಂದು ಎಂಟ್ರಿ ನನ್ನ ಕಣ್ಣಿಗೆ ಬಿತ್ತು. ಎರಡು ಸಾವಿರದ ಹದಿನಾರರಲ್ಲಿ ಚಂದ್ರಶೇಖರ್ ಅವರು ಈ ಸೈಟನ್ನ ಒಂದು ಕೋ-ಆಪರೇಟಿವ್ ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಅಡಮಾನ ಇಟ್ಟು ಸಾಲ ತಗೊಂಡಿದ್ರು.
    tr: Ādre idaralli ondu enṭri nanna kaṇṇige bittu. Eraḍu sāvirada hadināraralli Chandrashēkar avaru ī saiṭanna ondu kō-āparēṭiv byānknalli aḍamāna iṭṭu sāla tagonḍidru.
    en: But one entry caught my eye. In 2016 Chandrashekar mortgaged this site with a cooperative bank and took a loan.
  - who: deepa
    t: ಅಯ್ಯೋ. ಆ ಸಾಲ ಇನ್ನೂ ಬಾಕಿ ಇದ್ರೆ?
    tr: Ayyō. Ā sāla innū bāki idre?
    en: Oh no. What if that loan is still outstanding?
  - who: lawyer
    t: ಅದನ್ನೇ ನಾನು ಅವರಿಗೆ ಕೇಳಿದೆ. ಇಪ್ಪತ್ತೊಂದರಲ್ಲೇ ಸಾಲ ತೀರಿಸಿದೀನಿ ಅಂತಾರೆ. ಆದ್ರೆ ಬಾಯಿಮಾತು ಸಾಲದು. ಬ್ಯಾಂಕಿನ ನೋ-ಡ್ಯೂಸ್ ಪತ್ರ, ಮತ್ತೆ ರಿಜಿಸ್ಟರ್ ಆದ ಬಿಡುಗಡೆ ಪತ್ರ — ರಿಲೀಸ್ ಡೀಡ್ — ಎರಡೂ ತರೋಕೆ ಹೇಳಿದೀನಿ.
    tr: Adannē nānu avarige kēḷide. Ippattondarallē sāla tīrisidīni antāre. Ādre bāyimātu sāladu. Byānkina nō-ḍyūs patra, matte rijisṭar āda biḍugaḍe patra — rilīs ḍīḍ — eraḍū tarōke hēḷidīni.
    en: 'That''s exactly what I asked him. He says he cleared the loan back in 2021. But word of mouth isn''t enough. I''ve told him to bring both: the bank''s no-dues letter and the registered release deed.'
  - who: ravi
    t: ಅದು ಸಿಗದಿದ್ರೆ ಏನಾಗುತ್ತೆ ಸಾರ್?
    tr: Adu sigadidre ēnāgutte sār?
    en: And if he can't produce it, sir, what happens?
  - who: lawyer
    t: ಆಗ ರೆಕಾರ್ಡ್‌ನಲ್ಲಿ ಆ ಸೈಟು ಇನ್ನೂ ಅಡಮಾನದಲ್ಲೇ ಇರುತ್ತೆ. ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ಲೋನ್ ಕೊಡಲ್ಲ, ಮುಂದೆ ನೀವು ಮಾರಬೇಕಾದ್ರೂ ತೊಂದರೆ. ಆ ಪೇಪರ್ ಕೈಗೆ ಸಿಗೋವರೆಗೂ ಒಂದು ರೂಪಾಯಿನೂ ಕೊಡ್ಬೇಡಿ.
    tr: Āga rekārḍnalli ā saiṭu innū aḍamānadallē irutte. Nimma byānk lōn koḍalla, munde nīvu mārabēkādrū tondare. Ā pēpar kaige sigōvaregū ondu rūpāyinū koḍbēḍi.
    en: Then the records will still show the site as mortgaged. Your bank won't lend, and even if you want to sell it one day, there'll be trouble. Until that paper is in your hand, don't pay a single rupee.
  - scene: Four days later. The same office. The lawyer holds up two freshly copied sheets.
  - who: lawyer
    t: ರಿಲೀಸ್ ಡೀಡ್ ಬಂತು. ಇಪ್ಪತ್ತೊಂದರಲ್ಲೇ ರಿಜಿಸ್ಟರ್ ಆಗಿತ್ತು. ಅವರು ಕಾಪಿ ಕಳ್ಕೊಂಡಿದ್ರು, ಅಷ್ಟೆ. ಕಾವೇರಿ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ನಾನೇ ಚೆಕ್ ಮಾಡಿದೆ. ಸರಿ ಇದೆ.
    tr: Rilīs ḍīḍ bantu. Ippattondarallē rijisṭar āgittu. Avaru kāpi kaḷkonḍidru, aṣṭe. Kāvēri pōrṭalnalli nānē chek māḍide. Sari ide.
    en: The release deed has arrived. It was registered back in 2021. He had simply lost his copy, that's all. I checked it on the Kaveri portal myself. It's in order.
  - who: lawyer
    t: ಈಗ ಖಾತೆ. ಇ-ಖಾತಾ ಚಂದ್ರಶೇಖರ್ ಅವರ ಹೆಸರಲ್ಲೇ ಇದೆ — ಎ-ಖಾತಾ, ವೆರಿಫೈಡ್. ಆಸ್ತಿ ತೆರಿಗೆ ಇಪ್ಪತ್ನಾಲ್ಕು-ಇಪ್ಪತ್ತೈದರವರೆಗೂ ಕಟ್ಟಿದಾರೆ, ರಸೀದಿಗಳಿವೆ. ಇ-ಖಾತಾ ಇಲ್ದೆ ಈಗ ಸಬ್-ರಿಜಿಸ್ಟ್ರಾರ್ ರಿಜಿಸ್ಟ್ರೇಷನ್ನೇ ಮಾಡಲ್ಲ, ಗೊತ್ತಲ್ವಾ?
    tr: Īga khāte. I-khātā Chandrashēkar avara hesarallē ide — e-khātā, verifaiḍ. Āsti terige ippatnālku-ippattaidaravaregū kaṭṭidāre, rasīdigaḷive. I-khātā ilde īga sab-rijisṭrār rijisṭrēṣannē māḍalla, gottalvā?
    en: Now the khata. The e-khata is in Chandrashekar's own name — A-khata, verified. He's paid property tax up to 2024–25, and the receipts are there. These days the Sub-Registrar won't register anything without an e-khata, you know that?
  - who: ravi
    t: ಗೊತ್ತು ಸಾರ್. ಕೊನೆಯ ಪ್ರಶ್ನೆ — ಅವರ ಮಕ್ಕಳು? ಮುಂದೆ ಯಾರಾದ್ರೂ ‘ಇದು ನಮ್ಮಪ್ಪನ ಆಸ್ತಿ, ಇದರಲ್ಲಿ ನಮ್ಮ ಪಾಲು ಇದೆ’ ಅಂತ ಬಂದ್ರೆ?
    tr: Gottu sār. Koneya prashne — avara makkaḷu? Munde yārādrū ‘idu nammappana āsti, idaralli namma pālu ide’ anta bandre?
    en: I know, sir. Last question — his children? What if someday someone turns up saying, ‘This was our father's property, we have a share in it’?
  - who: lawyer
    t: ಕಾನೂನು ಪ್ರಕಾರ ಇದು ಅವರ ಸ್ವಯಾರ್ಜಿತ ಆಸ್ತಿ — ಅವರೇ ತಮ್ಮ ಸಂಪಾದನೆಯಿಂದ ಕೊಂಡಿದ್ದು. ಆದ್ರೂ ನಾನು ರಿಸ್ಕ್ ತಗೊಳ್ಳಲ್ಲ. ಅವರ ಇಬ್ಬರು ಗಂಡುಮಕ್ಕಳೂ ಕ್ರಯಪತ್ರದಲ್ಲಿ ಒಪ್ಪಿಗೆದಾರರಾಗಿ ಸಹಿ ಹಾಕ್ಬೇಕು. ಅವರು ಒಪ್ಪಿದಾರೆ.
    tr: Kānūnu prakāra idu avara svayārjita āsti — avarē tamma sampādaneyinda koṇḍiddu. Ādrū nānu risk tagoḷḷalla. Avara ibbaru gaṇḍumakkaḷū krayapatradalli oppigedārarāgi sahi hākbēku. Avaru oppidāre.
    en: Legally this is his self-acquired property — he bought it with his own earnings. Even so, I don't take risks. Both his sons must also sign the sale deed as consenting parties. They've agreed.
  - who: deepa
    t: ಮಗಳು? ಅವರಿಗೆ ಒಬ್ಬ ಮಗಳೂ ಇದಾರೆ ಅಂತ ಲೋಕೇಶ್ ಹೇಳಿದ್ರು.
    tr: Magaḷu? Avarige obba magaḷū idāre anta Lōkēsh hēḷidru.
    en: And the daughter? Lokesh said he has a daughter too.
  - who: lawyer
    t: ಆಕೆ ಈಗ ಆಸ್ಪತ್ರೆಯಲ್ಲಿದಾರೆ. ಹಾಗಾಗಿ ಆಕೆಯ ಒಪ್ಪಿಗೆ ಪತ್ರಕ್ಕೆ ನೋಟರಿ ಮಾಡಿಸಿ ತರ್ತಾರೆ. ಅದನ್ನ ನನ್ನ ಫೈಲ್‌ನಲ್ಲಿ ಇಟ್ಕೊಳ್ತೀನಿ.
    tr: Āke īga āspatreyallidāre. Hāgāgi ākeya oppige patrakke nōṭari māḍisi tartāre. Adanna nanna phailnalli iṭkoḷtīni.
    en: She's in hospital at the moment. So they'll bring her consent letter, notarised. I'll keep it on my file.
  - who: lawyer
    t: 'ನನ್ನ ಅಭಿಪ್ರಾಯ: ಟೈಟಲ್ ಕ್ಲಿಯರ್. ಲಿಖಿತವಾಗಿ ಲೀಗಲ್ ಒಪಿನಿಯನ್ ಕೊಡ್ತೀನಿ. ನಿಮ್ಮ ಬ್ಯಾಂಕಿನವರೂ ಅವರ ಪ್ಯಾನೆಲ್ ಲಾಯರ್ ಕೈಯಲ್ಲಿ ಇನ್ನೊಂದು ಸಲ ಚೆಕ್ ಮಾಡಿಸ್ತಾರೆ. ಅದೂ ಒಳ್ಳೇದೇ — ಎರಡು ಜೊತೆ ಕಣ್ಣು.'
    tr: 'Nanna abhiprāya: ṭaiṭal kliyar. Likhitavāgi līgal opiniyan koḍtīni. Nimma byānkinavarū avara pyānel lāyar kaiyalli innondu sala chek māḍistāre. Adū oḷḷēdē — eraḍu jote kaṇṇu.'
    en: 'My opinion: the title is clear. I''ll give you a written legal opinion. Your bank will also have its panel lawyer check everything once more. That''s a good thing too — two pairs of eyes.'
  - who: ravi
    t: ಇದೆಲ್ಲಾ ನೋಡದೆ ಅಡ್ವಾನ್ಸ್ ಕೊಟ್ಟಿದ್ದಿದ್ರೆ, ಆ ಅಡಮಾನದ ವಿಷಯ ನಮಗೆ ಗೊತ್ತೇ ಆಗ್ತಿರ್ಲಿಲ್ಲ.
    tr: Idellā nōḍade aḍvāns koṭṭiddidre, ā aḍamānada viṣaya namage gottē āgtirlilla.
    en: If we'd paid the advance without checking all this, we'd never even have known about that mortgage.
  - who: lawyer
    t: 'ಅದಕ್ಕೇ ಹಿರಿಯರು ಹೇಳೋದು: ‘ಆತುರಗಾರನಿಗೆ ಬುದ್ಧಿ ಮಟ್ಟ.’ ಸರಿ, ಈಗ ಅಗ್ರಿಮೆಂಟ್ ಡ್ರಾಫ್ಟ್ ಮಾಡೋಣ.'
    tr: 'Adakkē hiriyaru hēḷōdu: ‘Āturagāranige buddhi maṭṭa.’ Sari, īga agrimenṭ ḍrāphṭ māḍōṇa.'
    en: That's why the elders say, ‘The hasty man has little sense.’ Right, now let's draft the agreement.
  - section: 📝 The sale agreement and the advance
    learn: 'kraya karāru · reading a document aloud (bookish -uttāre) · conditions: hinde saridre · why no cash: -ōdrinda'
  - scene: A week later, the lawyer's office again. Chandrashekar comes with his elder son; Lokesh is there too. The agreement is printed on e-stamp paper.
  - who: lawyer
    t: ಎಲ್ರೂ ಬಂದಿದೀರಿ, ಒಳ್ಳೇದು. ಕ್ರಯ ಕರಾರು ಪತ್ರದ ಮುಖ್ಯ ಅಂಶಗಳನ್ನ ಓದ್ತೀನಿ. ಏನಾದ್ರೂ ಸಂದೇಹ ಇದ್ರೆ ಅಲ್ಲೇ ನಿಲ್ಲಿಸಿ ಕೇಳಿ.
    tr: Elrū bandidīri, oḷḷēdu. Kraya karāru patrada mukhya amshagaḷanna ōdtīni. Ēnādrū sandēha idre allē nillisi kēḷi.
    en: Everyone's here, good. I'll read out the main points of the sale agreement. If anything is unclear, stop me right there and ask.
  - who: lawyer
    t: “ಮಾರಾಟಗಾರರು ಸದರಿ ನಿವೇಶನವನ್ನು ಐವತ್ತಮೂರು ಲಕ್ಷದ ಐವತ್ತು ಸಾವಿರ ರೂಪಾಯಿಗಳಿಗೆ ಮಾರಾಟ ಮಾಡಲು ಒಪ್ಪಿರುತ್ತಾರೆ. ಖರೀದಿದಾರರು ಇಂದು ಐದು ಲಕ್ಷ ರೂಪಾಯಿಗಳನ್ನು ಮುಂಗಡವಾಗಿ ಬ್ಯಾಂಕ್ ವರ್ಗಾವಣೆ ಮೂಲಕ ಪಾವತಿಸುತ್ತಾರೆ.”
    tr: “Mārāṭagāraru sadari nivēshanavannu aivattamūru lakṣada aivattu sāvira rūpāyigaḷige mārāṭa māḍalu oppiruttāre. Kharīdidāraru indu aidu lakṣa rūpāyigaḷannu muṅgaḍavāgi byānk vargāvaṇe mūlaka pāvatisuttāre.”
    en: (reading) “The vendor has agreed to sell the said site for fifty-three lakh fifty thousand rupees. The purchaser shall this day pay five lakh rupees as advance by bank transfer.”
  - who: lawyer
    t: ಬಾಕಿ ನಲವತ್ತೆಂಟೂವರೆ ಲಕ್ಷ ರಿಜಿಸ್ಟ್ರೇಷನ್ ದಿನ. ಅದರಲ್ಲಿ ಬ್ಯಾಂಕ್ ಲೋನ್ ನೇರವಾಗಿ ಚಂದ್ರಶೇಖರ್ ಅವರ ಅಕೌಂಟಿಗೆ ಹೋಗುತ್ತೆ, ಉಳಿದಿದ್ದನ್ನ ರವಿ ಅವರು ಆರ್‌ಟಿಜಿಎಸ್ ಮಾಡ್ತಾರೆ. ಅವಧಿ ಅರವತ್ತು ದಿನ.
    tr: Bāki nalavatteṇṭūvare lakṣa rijisṭrēṣan dina. Adaralli byānk lōn nēravāgi Chandrashēkar avara akaunṭige hōgutte, uḷididdanna Ravi avaru ār-ṭi-ji-es māḍtāre. Avadhi aravattu dina.
    en: The balance of forty-eight and a half lakh is paid on the day of registration. The bank loan part goes straight into Chandrashekar's account, and Ravi sends the rest by RTGS. The time limit is sixty days.
  - who: seller
    t: ಅರವತ್ತು ದಿನ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ ಆಯ್ತು ಸಾರ್. ನನಗೆ ದುಡ್ಡು ಬೇಗ ಬೇಕಾಗಿತ್ತು. ನಲವತ್ತೈದು ದಿನದಲ್ಲಿ ಮಾಡೋಕೆ ಆಗುತ್ತಾ?
    tr: Aravattu dina svalpa jāsti āytu sār. Nanage duḍḍu bēga bēkāgittu. Nalavattaidu dinadalli māḍōke āguttā?
    en: Sixty days is a bit long, sir. I need the money soon. Could it be done in forty-five days?
  - who: ravi
    t: ಸಾರ್, ಬ್ಯಾಂಕ್ ಸ್ಯಾಂಕ್ಷನ್ ಕೊನೆಯ ಹಂತದಲ್ಲಿದೆ. ನಲವತ್ತೈದು ದಿನ ಅಂತ ಇಟ್ಕೊಳ್ಳೋಣ, ನಾನು ಪೂರ್ತಿ ಪ್ರಯತ್ನ ಮಾಡ್ತೀನಿ. ಆದ್ರೆ ಬ್ಯಾಂಕ್ ತಡ ಮಾಡಿದ್ರೆ ಹದಿನೈದು ದಿನ ಎಕ್ಸ್‌ಟೆನ್ಷನ್ ಕೊಡ್ಬೇಕು.
    tr: Sār, byānk syānkṣan koneya hantadallide. Nalavattaidu dina anta iṭkoḷḷōṇa, nānu pūrti prayatna māḍtīni. Ādre byānk taḍa māḍidre hadinaidu dina eksṭenṣan koḍbēku.
    en: Sir, the bank sanction is in its last stage. Let's put forty-five days, and I'll do my very best. But if the bank is late, you'll have to give me a fifteen-day extension.
  - who: seller
    t: ಆಯ್ತು. ನನಗೆ ಒಪ್ಪಿಗೆ.
    tr: Āytu. Nanage oppige.
    en: All right. I agree.
  - who: lawyer
    t: 'ಹಾಗಾದ್ರೆ ಹಾಗೇ ಬರೀತೀನಿ. ಈಗ ಮುಖ್ಯವಾದ ಷರತ್ತು: ಮಾರಾಟಗಾರರು ಹಿಂದೆ ಸರಿದ್ರೆ, ಮುಂಗಡದ ಜೊತೆಗೆ ಅಷ್ಟೇ ಮೊತ್ತ ದಂಡವಾಗಿ ವಾಪಸ್ ಕೊಡ್ಬೇಕು. ಖರೀದಿದಾರರು ಹಿಂದೆ ಸರಿದ್ರೆ, ಮುಂಗಡದಲ್ಲಿ ಒಂದು ಲಕ್ಷ ಕಳ್ಕೊಳ್ತಾರೆ.'
    tr: 'Hāgādre hāgē barītīni. Īga mukhyavāda ṣarattu: mārāṭagāraru hinde saridre, muṅgaḍada jotege aṣṭē motta danḍavāgi vāpas koḍbēku. Kharīdidāraru hinde saridre, muṅgaḍadalli ondu lakṣa kaḷkoḷtāre.'
    en: 'Then I''ll write it that way. Now the important clause: if the seller backs out, he must return the advance plus the same amount again as a penalty. If the buyer backs out, he loses one lakh of the advance.'
  - who: lawyer
    t: 'ಇನ್ನೊಂದು: ಐವತ್ತು ಲಕ್ಷ ಅಥವಾ ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಬೆಲೆಯ ಆಸ್ತಿ ಆಗಿರೋದ್ರಿಂದ, ರವಿ ಅವರು ಒಂದು ಪರ್ಸೆಂಟ್ ಟಿಡಿಎಸ್ ಹಿಡ್ಕೊಂಡು ಇನ್‌ಕಮ್ ಟ್ಯಾಕ್ಸ್ ಇಲಾಖೆಗೆ ಕಟ್ಬೇಕು. ಚಂದ್ರಶೇಖರ್ ಅವರಿಗೆ ಅದು ಅವರ ಟ್ಯಾಕ್ಸ್‌ನಲ್ಲಿ ಕ್ರೆಡಿಟ್ ಆಗುತ್ತೆ.'
    tr: 'Innondu: aivattu lakṣa athavā adakkinta jāsti beleya āsti āgirōdrinda, Ravi avaru ondu parsenṭ ṭi-ḍi-es hiḍkonḍu inkam ṭyāks ilākhege kaṭbēku. Chandrashēkar avarige adu avara ṭyāksnalli kreḍiṭ āgutte.'
    en: 'One more thing: because the property is worth fifty lakh or more, Ravi must withhold one percent as TDS and pay it to the Income Tax Department. Chandrashekar gets it credited against his own tax.'
  - who: broker
    t: ಸಾರ್, ಒಂದು ಸಣ್ಣ ಸಜೆಷನ್. ಅಡ್ವಾನ್ಸ್‌ನಲ್ಲಿ ಸ್ವಲ್ಪ ಕ್ಯಾಶ್ ಆಗಿ ಕೊಟ್ರೆ ಎಲ್ರಿಗೂ ಸುಲಭ. ಓನರ್‌ಗೂ ತಕ್ಷಣ ಕೈಗೆ ಸಿಗುತ್ತೆ. ಎಲ್ರೂ ಹಾಗೇ ಮಾಡ್ತಾರೆ.
    tr: Sār, ondu saṇṇa sajeṣan. Aḍvānsnalli svalpa kyāsh āgi koṭre elrigū sulabha. Ōnargū takṣaṇa kaige sigutte. Elrū hāgē māḍtāre.
    en: Sir, a small suggestion. If part of the advance is paid in cash, it's easier for everyone. The owner gets it in hand straight away. Everybody does it that way.
  - who: lawyer
    t: ಲೋಕೇಶ್ ಅವರೇ, ಎಲ್ರೂ ಮಾಡ್ತಾರೆ ಅಂದ ತಕ್ಷಣ ಅದು ಸರಿ ಆಗಲ್ಲ. ಕ್ಯಾಶ್‌ಗೆ ಪ್ರೂಫ್ ಇರಲ್ಲ. ಮುಂದೆ ಜಗಳ ಆದ್ರೆ ಕೋರ್ಟ್‌ನಲ್ಲಿ ತೋರಿಸೋಕೆ ಏನೂ ಇರಲ್ಲ. ಆಸ್ತಿ ವ್ಯವಹಾರದಲ್ಲಿ ಇಷ್ಟು ದೊಡ್ಡ ಮೊತ್ತ ಕ್ಯಾಶ್‌ನಲ್ಲಿ ತಗೊಳ್ಳೋದು ಕಾನೂನಿಗೂ ವಿರುದ್ಧ.
    tr: Lōkēsh avarē, elrū māḍtāre anda takṣaṇa adu sari āgalla. Kyāshge prūph iralla. Munde jagaḷa ādre kōrṭnalli tōrisōke ēnū iralla. Āsti vyavahāradalli iṣṭu doḍḍa motta kyāshnalli tagoḷḷōdu kānūnigū viruddha.
    en: Lokesh, just because everybody does it doesn't make it right. Cash leaves no proof. If there's a dispute later, there's nothing to show in court. And taking that big an amount in cash in a property deal is against the law as well.
  - who: ravi
    t: ನನ್ನ ನಿಲುವೂ ಅದೇ. ಪ್ರತಿ ರೂಪಾಯಿ ಬ್ಯಾಂಕ್ ಮೂಲಕ. ಚಂದ್ರಶೇಖರ್ ಸಾರ್, ನಿಮ್ಮ ಅಕೌಂಟ್ ನಂಬರ್, ಐಎಫ್‌ಎಸ್‌ಸಿ ಕೊಡ್ತೀರಾ?
    tr: Nanna niluvū adē. Prati rūpāyi byānk mūlaka. Chandrashēkar sār, nimma akaunṭ nambar, ai-eph-es-si koḍtīrā?
    en: That's my position too. Every rupee through the bank. Chandrashekar sir, could you give me your account number and IFSC?
  - who: seller
    t: ಇಗೋ, ಪಾಸ್‌ಬುಕ್ ಕಾಪಿ. ನನ್ನ ಹೆಸರಲ್ಲೇ ಇರೋ ಅಕೌಂಟ್.
    tr: Igō, pāsbuk kāpi. Nanna hesarallē irō akaunṭ.
    en: Here, a copy of my passbook. The account is in my own name.
  - scene: Ravi opens his banking app and types carefully. A minute later, Chandrashekar's phone buzzes.
  - who: ravi
    t: ಐದು ಲಕ್ಷ ಆರ್‌ಟಿಜಿಎಸ್ ಆಯ್ತು. ಯುಟಿಆರ್ ನಂಬರ್ ಇದು — ಅಗ್ರಿಮೆಂಟ್‌ನಲ್ಲಿ ಬರೆದುಬಿಡಿ ಸಾರ್.
    tr: Aidu lakṣa ār-ṭi-ji-es āytu. Yu-ṭi-ār nambar idu — agrimenṭnalli baredubiḍi sār.
    en: Five lakh sent by RTGS. Here's the UTR number — please write it into the agreement, sir.
  - who: seller
    t: ಮೆಸೇಜ್ ಬಂತು. ಸರಿ ಇದೆ.
    tr: Mesēj bantu. Sari ide.
    en: The message has come. It's correct.
  - who: lawyer
    t: ಸಾಕ್ಷಿಗಳು ಇಲ್ಲಿ ಸಹಿ ಹಾಕಿ. ಈ ಅಗ್ರಿಮೆಂಟ್ ರಿಜಿಸ್ಟರ್ ಆಗಲ್ಲ, ಆದ್ರೆ ಇ-ಸ್ಟ್ಯಾಂಪ್ ಪೇಪರ್ ಮೇಲೆ ಇರೋದ್ರಿಂದ ಅದಕ್ಕೆ ಬೆಲೆ ಇದೆ. ನಲವತ್ತೈದು ದಿನದ ಲೆಕ್ಕ ಇವತ್ತಿಂದ ಶುರು.
    tr: Sākṣigaḷu illi sahi hāki. Ī agrimenṭ rijisṭar āgalla, ādre i-sṭyāmp pēpar mēle irōdrinda adakke bele ide. Nalavattaidu dinada lekka ivattinda shuru.
    en: Witnesses, sign here. This agreement won't be registered, but because it's on e-stamp paper it carries weight. The forty-five-day count starts today.
  - section: 🏦 The loan is sanctioned
    learn: sāla mañjūru āytu · interest and EMI in numbers · -ida takṣaṇa (as soon as) · -ōvaregū (until)
  - scene: Ten days later. Canara Bank, Vijayanagar branch. Vandana slides a sanction letter across the desk to Ravi and Deepa.
  - who: bank
    t: ರವಿ ಅವರೇ, ಒಳ್ಳೆ ಸುದ್ದಿ. ನಿಮ್ಮ ಕಾಂಪೋಸಿಟ್ ಲೋನ್ ಮಂಜೂರಾಗಿದೆ. ನಮ್ಮ ಪ್ಯಾನೆಲ್ ಲಾಯರ್ ಲೀಗಲ್ ಒಪಿನಿಯನ್ ಕೊಟ್ಟಿದಾರೆ, ನಮ್ಮ ವ್ಯಾಲ್ಯುಯರ್ ಸೈಟಿಗೆ ಹೋಗಿ ಟೆಕ್ನಿಕಲ್ ರಿಪೋರ್ಟ್ ಕೊಟ್ಟಿದಾರೆ.
    tr: Ravi avarē, oḷḷe suddi. Nimma kāmpōsiṭ lōn mañjūrāgide. Namma pyānel lāyar līgal opiniyan koṭṭidāre, namma vyālyuyar saiṭige hōgi ṭeknikal ripōrṭ koṭṭidāre.
    en: Ravi, good news. Your composite loan has been sanctioned. Our panel lawyer has given the legal opinion, and our valuer has visited the site and submitted the technical report.
  - who: bank
    t: ಸೈಟಿಗೆ ನಲವತ್ತು ಲಕ್ಷ — ಬೆಲೆಯ ಸುಮಾರು ಎಪ್ಪತ್ತೈದು ಪರ್ಸೆಂಟ್. ಕನ್‌ಸ್ಟ್ರಕ್ಷನ್ ಭಾಗ ಪ್ಲಾನ್ ಅಪ್ರೂವಲ್ ಆದ ಮೇಲೆ ಹಂತ ಹಂತವಾಗಿ ಬಿಡುಗಡೆ ಆಗುತ್ತೆ. ಮೂರು ವರ್ಷದೊಳಗೆ ಮನೆ ಕೆಲಸ ಶುರು ಆಗ್ಬೇಕು, ನೆನಪಿರಲಿ.
    tr: Saiṭige nalavattu lakṣa — beleya sumāru eppattaidu parsenṭ. Kanstrakṣan bhāga plān aprūval āda mēle hanta hantavāgi biḍugaḍe āgutte. Mūru varṣadoḷage mane kelasa shuru āgbēku, nenapirali.
    en: 'Forty lakh for the site — about seventy-five percent of the price. The construction part is released stage by stage once the plan is approved. Remember: work on the house has to start within three years.'
  - who: deepa
    t: ಬಡ್ಡಿ ದರ ಎಷ್ಟು ಮೇಡಂ? ಫಿಕ್ಸ್ಡಾ, ಫ್ಲೋಟಿಂಗಾ?
    tr: Baḍḍi dara eṣṭu mēḍam? Phiksḍā, phlōṭingā?
    en: What's the interest rate, ma'am? Fixed or floating?
  - who: bank
    t: ಫ್ಲೋಟಿಂಗ್, ರೆಪೋ ರೇಟ್‌ಗೆ ಲಿಂಕ್ ಆಗಿದೆ. ಈಗ ಸುಮಾರು ಎಂಟೂವರೆ ಪರ್ಸೆಂಟ್. ಇಪ್ಪತ್ತು ವರ್ಷಕ್ಕೆ ನಲವತ್ತು ಲಕ್ಷದ ಇಎಂಐ ಸುಮಾರು ಮೂವತ್ತೈದು ಸಾವಿರ. ಆರ್‌ಬಿಐ ರೆಪೋ ಇಳಿಸಿದ್ರೆ ನಿಮ್ಮ ಬಡ್ಡಿನೂ ಇಳಿಯುತ್ತೆ, ಏರಿಸಿದ್ರೆ ಏರುತ್ತೆ.
    tr: Phlōṭing, repō rēṭge link āgide. Īga sumāru eṇṭūvare parsenṭ. Ippattu varṣakke nalavattu lakṣada i-em-ai sumāru mūvattaidu sāvira. Ār-bi-ai repō iḷisidre nimma baḍḍinū iḷiyutte, ērisidre ērutte.
    en: Floating, linked to the repo rate. Right now about eight and a half percent. Over twenty years, the EMI on forty lakh comes to about thirty-five thousand. If the RBI cuts the repo rate, your interest comes down; if it raises it, it goes up.
  - who: ravi
    t: ಸಾಲದ ಹಣ ಹೇಗೆ ಬರುತ್ತೆ ಮೇಡಂ? ನನ್ನ ಅಕೌಂಟಿಗಾ?
    tr: Sālada haṇa hēge barutte mēḍam? Nanna akaunṭigā?
    en: How will the loan money come, ma'am? Into my account?
  - who: bank
    t: ಇಲ್ಲ. ಸೈಟಿನ ಸಾಲ ನೇರವಾಗಿ ಮಾರಾಟಗಾರರ ಹೆಸರಲ್ಲಿ ಡಿಡಿ. ರಿಜಿಸ್ಟ್ರೇಷನ್ ದಿನ ಬೆಳಿಗ್ಗೆ ತಗೊಂಡು ಹೋಗಿ, ಸಬ್-ರಿಜಿಸ್ಟ್ರಾರ್ ಎದುರಲ್ಲೇ ಕೊಡಿ. ರಿಜಿಸ್ಟ್ರೇಷನ್ ಆದ ತಕ್ಷಣ ಒರಿಜಿನಲ್ ಕ್ರಯಪತ್ರ ನಮಗೆ ಬರ್ಬೇಕು. ಸಾಲ ತೀರೋವರೆಗೂ ಅದು ಬ್ಯಾಂಕ್ ಹತ್ರಾನೇ ಇರುತ್ತೆ.
    tr: Illa. Saiṭina sāla nēravāgi mārāṭagārara hesaralli ḍiḍi. Rijisṭrēṣan dina beḷigge tagonḍu hōgi, sab-rijisṭrār edurallē koḍi. Rijisṭrēṣan āda takṣaṇa orijinal krayapatra namage barbēku. Sāla tīrōvaregū adu byānk hatrānē irutte.
    en: No. The site loan goes directly as a demand draft in the seller's name. Collect it on the morning of the registration and hand it over in front of the Sub-Registrar. As soon as the deed is registered, the original must come to us. It stays with the bank until the loan is repaid.
  - who: bank
    t: 'ಒಂದು ಮಾತು: ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ, ರಿಜಿಸ್ಟ್ರೇಷನ್ ಫೀ — ಇವಕ್ಕೆ ಬ್ಯಾಂಕ್ ಸಾಲ ಕೊಡಲ್ಲ. ಅದು ಪೂರ್ತಿ ನಿಮ್ಮ ಸ್ವಂತ ದುಡ್ಡು.'
    tr: 'Ondu mātu: sṭyāmp ḍyūṭi, rijisṭrēṣan phī — ivakke byānk sāla koḍalla. Adu pūrti nimma svanta duḍḍu.'
    en: 'One thing: stamp duty and the registration fee — the bank doesn''t lend for those. That''s entirely your own money.'
  - who: deepa
    t: ಐವತ್ತಮೂರೂವರೆಯಲ್ಲಿ ನಲವತ್ತು ಬ್ಯಾಂಕ್. ಹದಿಮೂರೂವರೆ ನಮ್ದು — ಅದರಲ್ಲಿ ಐದು ಆಗಲೇ ಕೊಟ್ಟಾಯ್ತು. ಮೇಲೆ ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ ಸುಮಾರು ಮೂರೂವರೆ, ಲೋಕೇಶ್ ಕಮಿಷನ್, ಲಾಯರ್ ಫೀಸ್… ಹದಿನೆಂಟು ಲಕ್ಷದಲ್ಲಿ ಉಳಿಯೋದು ಒಂದು ಲಕ್ಷಕ್ಕಿಂತ ಕಮ್ಮಿ.
    tr: Aivattamūrūvareyalli nalavattu byānk. Hadimūrūvare namdu — adaralli aidu āgalē koṭṭāytu. Mēle sṭyāmp ḍyūṭi sumāru mūrūvare, Lōkēsh kamiṣan, lāyar phīs… hadineṇṭu lakṣadalli uḷiyōdu ondu lakṣakkinta kammi.
    en: 'Of fifty-three and a half, forty is the bank''s. Thirteen and a half is ours — and five of that is already paid. On top: stamp duty about three and a half, Lokesh''s commission, the lawyer''s fee… Out of eighteen lakh, less than one lakh will be left.'
  - who: ravi
    t: ಗೊತ್ತು. ಆರು ವರ್ಷದ ಉಳಿತಾಯ ಎಲ್ಲಾ ಈ ಮಣ್ಣಿಗೇ ಹೋಗುತ್ತೆ. ಮನೆಗೆ ಲೋನ್‌ನ ಎರಡನೇ ಭಾಗ ಇದೆ — ಆದ್ರೆ ಉಳಿದಿದ್ದು ಎಲ್ಲಿಂದ ಅಂತ ಇನ್ನೂ ಯೋಚನೆ ಮಾಡ್ಬೇಕು.
    tr: Gottu. Āru varṣada uḷitāya ellā ī maṇṇigē hōgutte. Manege lōnna eraḍanē bhāga ide — ādre uḷididdu ellinda anta innū yōchane māḍbēku.
    en: I know. Six years of savings all go into this piece of earth. For the house there's the second part of the loan — but where the rest comes from, we still have to work out.
  - who: bank
    t: 'ಅದಕ್ಕೇ ನನ್ನ ಸಲಹೆ: ಆದಷ್ಟು ಬೇಗ ಆರು ತಿಂಗಳ ಇಎಂಐ ಅಷ್ಟು ಎಮರ್ಜೆನ್ಸಿ ಫಂಡ್ ಮತ್ತೆ ಕೂಡಿಡಿ. ಈಗ ಸಹಿ — ಇಲ್ಲಿ, ಇಲ್ಲಿ, ಮತ್ತೆ ಇಲ್ಲಿ.'
    tr: 'Adakkē nanna salahe: ādaṣṭu bēga āru tiṅgaḷa i-em-ai aṣṭu emarjensi phanḍ matte kūḍiḍi. Īga sahi — illi, illi, matte illi.'
    en: 'That''s why my advice is: as soon as you can, build up an emergency fund again worth six months of EMIs. Now, signatures — here, here, and here.'
  - section: 🏛️ At the Sub-Registrar's office
    learn: mudrāṅka shulka, nōndaṇi shulka, mārgasūchi dara · percentages · a polite refusal · bookish -lāgide when a document is read out
  - scene: 'Monday, 10 March 2025, ten in the morning. The Sub-Registrar''s office in Kengeri: a crowded corridor, a token screen, people clutching files. Ravi, Deepa and Appa meet the document writer at his small counter outside.'
  - who: clerk
    t: ನಮಸ್ಕಾರ ರವಿ ಅವರೇ. ಡ್ರಾಫ್ಟ್ ಡೀಡ್ ಕಾವೇರಿ ಟೂ ಪಾಯಿಂಟ್ ಓನಲ್ಲಿ ಅಪ್ಲೋಡ್ ಆಗಿದೆ, ಆಫೀಸ್‌ನವರು ಡೇಟಾ ಚೆಕ್ ಮಾಡಿದಾರೆ. ಹನ್ನೊಂದೂವರೆಗೆ ಸ್ಲಾಟ್ ಬುಕ್ ಆಗಿದೆ. ಫೀಸ್ ಎಲ್ಲಾ ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ಕಟ್ಟಿದೀರಿ.
    tr: Namaskāra Ravi avarē. Ḍrāphṭ ḍīḍ Kāvēri ṭū pāyinṭ ōnalli aplōḍ āgide, āphīsnavaru ḍēṭā chek māḍidāre. Hannondūvarege slāṭ buk āgide. Phīs ellā ānlainnallē kaṭṭidīri.
    en: Good morning, Ravi. The draft deed is uploaded on Kaveri 2.0, and the office has checked the data. The slot is booked for eleven-thirty. You've paid all the fees online.
  - who: ravi
    t: ಹೌದು. ಒಂದು ಸಲ ಲೆಕ್ಕ ಸರಿಯಾಗಿ ಹೇಳ್ಕೊಡಿ, ನಮ್ಮ ತಂದೆಯವರಿಗೂ ಅರ್ಥ ಆಗ್ಲಿ.
    tr: Haudu. Ondu sala lekka sariyāgi hēḷkoḍi, namma tandeyavarigū artha āgli.
    en: Yes. Could you explain the calculation once properly, so my father understands too?
  - who: clerk
    t: ನೋಡಿ ಸಾರ್. ಮೊದಲು ಮಾರ್ಗಸೂಚಿ ದರ — ಗೈಡೆನ್ಸ್ ವ್ಯಾಲ್ಯೂ. ಆ ಏರಿಯಾದಲ್ಲಿ ಸರ್ಕಾರದ ದರ ಸ್ಕ್ವೇರ್ ಫೀಟ್‌ಗೆ ಮೂರು ಸಾವಿರದ ಎಂಟುನೂರು. ಸಾವಿರದ ಇನ್ನೂರು ಅಡಿಗೆ ನಲವತ್ತೈದು ಲಕ್ಷದ ಅರವತ್ತು ಸಾವಿರ.
    tr: Nōḍi sār. Modalu mārgasūchi dara — gaiḍens vyālyū. Ā ēriyādalli sarkārada dara skvēr phīṭge mūru sāvirada eṇṭunūru. Sāvirada innūru aḍige nalavattaidu lakṣada aravattu sāvira.
    en: Look, sir. First, the guidance value — the government's rate. In that area it's three thousand eight hundred per square foot. For twelve hundred square feet, that's forty-five lakh sixty thousand.
  - who: clerk
    t: ನಿಮ್ಮ ಸೇಲ್ ಪ್ರೈಸ್ ಐವತ್ತಮೂರೂವರೆ — ಅದು ಜಾಸ್ತಿ. ಯಾವುದು ಜಾಸ್ತಿನೋ ಅದರ ಮೇಲೆ ಡ್ಯೂಟಿ. ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ ಐದು ಪರ್ಸೆಂಟ್ — ಎರಡು ಲಕ್ಷದ ಅರವತ್ತೇಳು ಸಾವಿರದ ಐನೂರು. ರಿಜಿಸ್ಟ್ರೇಷನ್ ಫೀ ಒಂದು ಪರ್ಸೆಂಟ್ — ಐವತ್ತಮೂರು ಸಾವಿರದ ಐನೂರು. ಮೇಲೆ ಸೆಸ್, ಸರ್‌ಚಾರ್ಜ್. ಎಲ್ಲಾ ಸೇರಿ ಸುಮಾರು ಆರು ಪಾಯಿಂಟ್ ಆರು ಪರ್ಸೆಂಟ್ — ಮೂರೂವರೆ ಲಕ್ಷ ಹತ್ರ.
    tr: Nimma sēl prais aivattamūrūvare — adu jāsti. Yāvudu jāstinō adara mēle ḍyūṭi. Sṭyāmp ḍyūṭi aidu parsenṭ — eraḍu lakṣada aravattēḷu sāvirada ainūru. Rijisṭrēṣan phī ondu parsenṭ — aivattamūru sāvirada ainūru. Mēle ses, sarchārj. Ellā sēri sumāru āru pāyinṭ āru parsenṭ — mūrūvare lakṣa hatra.
    en: 'Your sale price is fifty-three and a half — that''s higher. Duty is charged on whichever is higher. Stamp duty at five percent: two lakh sixty-seven thousand five hundred. Registration fee at one percent: fifty-three thousand five hundred. Then cess and surcharge on top. All together about six point six percent — close to three and a half lakh.'
  - who: appa
    t: ಡಾಕ್ಯುಮೆಂಟ್‌ನಲ್ಲಿ ನಲವತ್ತೈದು ಲಕ್ಷ ಅಂತ ತೋರಿಸಿದ್ರೆ ಡ್ಯೂಟಿ ಕಮ್ಮಿ ಆಗ್ತಿತ್ತಲ್ವಾ?
    tr: Ḍākyumenṭnalli nalavattaidu lakṣa anta tōrisidre ḍyūṭi kammi āgtittalvā?
    en: If the document showed forty-five lakh, the duty would have been less, wouldn't it?
  - who: ravi
    t: ಆಗ್ತಿತ್ತು ಅಪ್ಪ. ಆದ್ರೆ ಉಳಿದ ಎಂಟು ಲಕ್ಷ ಕಪ್ಪು ಹಣ ಆಗ್ತಿತ್ತು. ಬ್ಯಾಂಕ್ ಲೋನೂ ಕಮ್ಮಿ ಬರ್ತಿತ್ತು, ಮುಂದೆ ಮಾರಿದಾಗ ಟ್ಯಾಕ್ಸ್ ಜಾಸ್ತಿ ಆಗ್ತಿತ್ತು. ಉಳಿತಾಯ ಅಲ್ಲ, ತೊಂದರೆ ಅದು.
    tr: Āgtittu appa. Ādre uḷida eṇṭu lakṣa kappu haṇa āgtittu. Byānk lōnū kammi bartittu, munde māridāga ṭyāks jāsti āgtittu. Uḷitāya alla, tondare adu.
    en: It would have, Appa. But the other eight lakh would have become black money. The bank loan would have been smaller too, and when we sell one day the tax would be higher. That's not saving — that's trouble.
  - scene: Eleven-thirty passes. Then twelve. The token screen is stuck on the same number. The document writer leans in and lowers his voice.
  - who: clerk
    t: ಸಾರ್, ಇವತ್ತು ತುಂಬಾ ರಶ್. ನಿಮ್ಮ ನಂಬರ್ ಬರೋಕೆ ಇನ್ನೂ ಮೂರು-ನಾಲ್ಕು ಗಂಟೆ ಆಗ್ಬೋದು. ಸ್ವಲ್ಪ… ನೋಡ್ಕೊಂಡ್ರೆ, ಒಳಗೆ ಮಾತಾಡಿ ನಿಮ್ಮನ್ನ ಮುಂಚೆ ಕರೆಸ್ತೀನಿ. ಎಲ್ರೂ ಕೊಡ್ತಾರೆ — ಟೀ-ಕಾಫಿ ಖರ್ಚು ಅಷ್ಟೆ.
    tr: Sār, ivattu tumbā rash. Nimma nambar barōke innū mūru-nālku gaṇṭe āgbōdu. Svalpa… nōḍkonḍre, oḷage mātāḍi nimmanna muñche karestīni. Elrū koḍtāre — ṭī-kāphi kharchu aṣṭe.
    en: Sir, it's very crowded today. Your number might take another three or four hours. If you… took care of things a little, I'd have a word inside and get you called earlier. Everyone gives something — just tea-and-coffee money.
  - who: ravi
    t: ಬೇಡ ಸಾರ್. ನಮ್ಮ ಸ್ಲಾಟ್ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಬುಕ್ ಆಗಿದೆ, ಫೀಸ್ ಎಲ್ಲಾ ರಸೀದಿ ಸಮೇತ ಕಟ್ಟಿದೀನಿ. ನಂಬರ್ ಬರೋವರೆಗೂ ಕಾಯ್ತೀವಿ.
    tr: Bēḍa sār. Namma slāṭ ānlainnalli buk āgide, phīs ellā rasīdi samēta kaṭṭidīni. Nambar barōvaregū kāytīvi.
    en: No thank you, sir. Our slot is booked online and I've paid every fee with a receipt. We'll wait until our number comes.
  - who: clerk
    t: ನಿಮ್ ಇಷ್ಟ ಸಾರ್. ಆಮೇಲೆ ಊಟದ ಟೈಮ್ ಬರುತ್ತೆ, ಇನ್ನೂ ಲೇಟ್ ಆಗುತ್ತೆ ಅಷ್ಟೆ.
    tr: Nim iṣṭa sār. Āmēle ūṭada ṭaim barutte, innū lēṭ āgutte aṣṭe.
    en: As you wish, sir. Then the lunch break comes, and it'll get even later, that's all.
  - who: ravi
    t: ಪರವಾಗಿಲ್ಲ. ಲೇಟ್ ಆದ್ರೂ ಸರಿ, ಕೆಲಸ ನಿಯಮ ಪ್ರಕಾರ ಆಗ್ಲಿ.
    tr: Paravāgilla. Lēṭ ādrū sari, kelasa niyama prakāra āgli.
    en: That's fine. Even if it's late, let the work be done by the rules.
  - who: appa
    t: ಸರಿಯಾಗಿ ಹೇಳ್ದೆ ಕಣೋ. ಮೂವತ್ತೆರಡು ವರ್ಷ ಬಸ್ಸಲ್ಲಿ ಟಿಕೆಟ್ ಹರಿದೆ, ಒಂದು ದಿನಾನೂ ಲೆಕ್ಕ ತಪ್ಪಿಸಿಲ್ಲ. ‘ತಾಳಿದವನು ಬಾಳಿಯಾನು.’
    tr: Sariyāgi hēḷde kaṇō. Mūvatteraḍu varṣa bassalli ṭikeṭ haride, ondu dinānū lekka tappisilla. ‘Tāḷidavanu bāḷiyānu.’
    en: Well said, son. Thirty-two years I tore tickets on the bus and never once fiddled the accounts. ‘He who is patient will prosper.’
  - scene: At ten to four, the speaker finally calls their token. Inside, Sub-Registrar Latha sits behind a monitor with a webcam and a fingerprint reader. Chandrashekar and his two sons sit on one side; Ravi, with the witnesses Appa and Lokesh, on the other.
  - who: subreg
    t: ಕೂತ್ಕೊಳ್ಳಿ. ಮಾರಾಟಗಾರರು — ಚಂದ್ರಶೇಖರ್ ಅವರೇ, ಮೊದಲು ಆಧಾರ್ ಇ-ಕೆವೈಸಿ. ಈ ಡಿವೈಸ್ ಮೇಲೆ ಬೆರಳು ಇಡಿ. ಈಗ ಕ್ಯಾಮೆರಾ ಕಡೆ ನೋಡಿ.
    tr: Kūtkoḷḷi. Mārāṭagāraru — Chandrashēkar avarē, modalu ādhār i-ke-vai-si. Ī ḍivais mēle beraḷu iḍi. Īga kyāmerā kaḍe nōḍi.
    en: Please sit. The seller — Mr Chandrashekar, first the Aadhaar e-KYC. Place your finger on this device. Now look at the camera.
  - who: subreg
    t: ಹಿಂದೆ ಬೇರೆಯವರ ಹೆಸರಲ್ಲಿ ನಕಲಿ ರಿಜಿಸ್ಟ್ರೇಷನ್ ಆಗ್ತಿತ್ತು. ಈಗ ಬೆರಳಚ್ಚು, ಫೋಟೋ, ಆಧಾರ್ ಎಲ್ಲಾ ಹೊಂದಬೇಕು. ಹಾಗಾಗಿ ಅದು ತುಂಬಾ ಕಷ್ಟ.
    tr: Hinde bēreyavara hesaralli nakali rijisṭrēṣan āgtittu. Īga beraḷachchu, phōṭō, ādhār ellā hondabēku. Hāgāgi adu tumbā kaṣṭa.
    en: In the past, fake registrations used to happen in other people's names. Now the fingerprint, photo and Aadhaar all have to match. So that has become very difficult.
  - who: subreg
    t: ನೀವು ಈ ನಿವೇಶನವನ್ನ ಯಾರ ಒತ್ತಡವೂ ಇಲ್ಲದೆ, ನಿಮ್ಮ ಸ್ವಂತ ಇಚ್ಛೆಯಿಂದ ಮಾರ್ತಿದೀರಾ?
    tr: Nīvu ī nivēshanavanna yāra ottaḍavū illade, nimma svanta ichchheyinda mārtidīrā?
    en: Are you selling this site of your own free will, without pressure from anyone?
  - who: seller
    t: ಹೌದು ಮೇಡಂ. ನನ್ನ ಇಷ್ಟದಿಂದಲೇ.
    tr: Haudu mēḍam. Nanna iṣṭadindalē.
    en: Yes, madam. Entirely of my own will.
  - who: subreg
    t: ಐದು ಲಕ್ಷ ಮುಂಗಡ ಬಂದಿದೆ ಅಂತ ಇದೆ. ಬಾಕಿ ಹೇಗೆ ಪಾವತಿ?
    tr: Aidu lakṣa muṅgaḍa bandide anta ide. Bāki hēge pāvati?
    en: It says an advance of five lakh has been received. How is the balance being paid?
  - who: ravi
    t: ನಲವತ್ತು ಲಕ್ಷ ಕೆನರಾ ಬ್ಯಾಂಕ್ ಡಿಡಿ, ಇದೋ. ಉಳಿದ ಏಳು ಲಕ್ಷದ ತೊಂಬತ್ತಾರು ಸಾವಿರದ ಐನೂರು ಬೆಳಿಗ್ಗೆ ಆರ್‌ಟಿಜಿಎಸ್ ಮಾಡಿದೀನಿ ಮೇಡಂ. ಒಂದು ಪರ್ಸೆಂಟ್ ಟಿಡಿಎಸ್ ಐವತ್ತಮೂರು ಸಾವಿರದ ಐನೂರು ಕಟ್ಟಿದೀನಿ, ಅದರ ರಸೀದಿ ಇಲ್ಲಿದೆ.
    tr: Nalavattu lakṣa Kenarā byānk ḍiḍi, idō. Uḷida ēḷu lakṣada tombattāru sāvirada ainūru beḷigge ār-ṭi-ji-es māḍidīni mēḍam. Ondu parsenṭ ṭi-ḍi-es aivattamūru sāvirada ainūru kaṭṭidīni, adara rasīdi illide.
    en: Forty lakh as a Canara Bank demand draft — here it is. The remaining seven lakh ninety-six thousand five hundred I sent by RTGS this morning, madam. I've paid one percent TDS, fifty-three thousand five hundred; here's the receipt.
  - who: subreg
    t: ಸರಿ. ಅವರ ಮಕ್ಕಳು ಒಪ್ಪಿಗೆದಾರರಾಗಿ ಸಹಿ ಹಾಕಿದಾರೆ. ಸಾಕ್ಷಿಗಳು — ನಾಗರಾಜ್ ಮತ್ತು ಲೋಕೇಶ್ — ನೀವಿಬ್ರೂ ಇವರನ್ನ ಗುರುತಿಸ್ತೀರಾ?
    tr: Sari. Avara makkaḷu oppigedārarāgi sahi hākidāre. Sākṣigaḷu — Nāgarāj mattu Lōkēsh — nīvibrū ivaranna gurutistīrā?
    en: Good. His children have signed as consenting parties. Witnesses — Nagaraj and Lokesh — do you both identify these people?
  - who: appa
    t: ಹೌದು ಮೇಡಂ. ಖರೀದಿದಾರ ನನ್ನ ಮಗ. ಮಾರಾಟಗಾರರನ್ನ ಮೂರು ಸಲ ಭೇಟಿ ಮಾಡಿದೀನಿ.
    tr: Haudu mēḍam. Kharīdidāra nanna maga. Mārāṭagāraranna mūru sala bhēṭi māḍidīni.
    en: Yes, madam. The buyer is my son. I've met the seller three times.
  - who: subreg
    t: “ಈ ಕ್ರಯಪತ್ರವನ್ನು ಇಂದು ನೋಂದಣಿ ಮಾಡಲಾಗಿದೆ. ಕ್ರಯದ ಮೊತ್ತ ಸಂಪೂರ್ಣವಾಗಿ ಪಾವತಿಯಾಗಿದೆ ಎಂದು ಮಾರಾಟಗಾರರು ಒಪ್ಪಿಕೊಂಡಿರುತ್ತಾರೆ.”
    tr: “Ī krayapatravannu indu nōndaṇi māḍalāgide. Krayada motta sampūrṇavāgi pāvatiyāgide endu mārāṭagāraru oppikonḍiruttāre.”
    en: (reading) “This sale deed has been registered today. The vendor has acknowledged that the sale consideration has been paid in full.”
  - who: subreg
    t: ಸ್ಕ್ಯಾನ್ ಆದ ಕಾಪಿ ಕಾವೇರಿಯಲ್ಲಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡ್ಕೊಳ್ಳಿ. ಒರಿಜಿನಲ್ ಸಂಜೆ ಕೌಂಟರ್‌ನಲ್ಲಿ ಸಿಗುತ್ತೆ. ಅಭಿನಂದನೆಗಳು — ಇವತ್ತಿಂದ ಈ ನಿವೇಶನ ನಿಮ್ಮದು.
    tr: Skyān āda kāpi Kāvēriyalli ḍaunlōḍ māḍkoḷḷi. Orijinal sañje kaunṭarnalli sigutte. Abhinandanegaḷu — ivattinda ī nivēshana nimmadu.
    en: Download the scanned copy from Kaveri. You'll get the original at the counter this evening. Congratulations — from today, this site is yours.
  - who: ravi
    t: ತುಂಬಾ ಧನ್ಯವಾದ ಮೇಡಂ.
    tr: Tumbā dhanyavāda mēḍam.
    en: Thank you very much, madam.
  - section: 🌇 Chandrashekar's story
    learn: speaking of loss · -bēku anta āse (the wish to …) · blessings with -li · ‘I give you my word’
  - scene: Outside on the steps, the evening light is fading. Chandrashekar holds the bank receipt and stands still for a long moment before he speaks.
  - who: seller
    t: ರವಿ ಅವರೇ, ಒಂದು ಮಾತು ಹೇಳ್ಬೇಕು. ಈ ಸೈಟು ಎರಡು ಸಾವಿರದ ಏಳರಲ್ಲಿ ನನ್ನ ಹೆಂಡತಿ ಜೊತೆ ಹೋಗಿ ತಗೊಂಡಿದ್ದು. ಅಲ್ಲೊಂದು ಚಿಕ್ಕ ಮನೆ ಕಟ್ಟಿಸ್ಬೇಕು ಅಂತ ಅವಳ ಆಸೆ.
    tr: Ravi avarē, ondu mātu hēḷbēku. Ī saiṭu eraḍu sāvirada ēḷaralli nanna heṇḍati jote hōgi tagonḍiddu. Allondu chikka mane kaṭṭisbēku anta avaḷa āse.
    en: Ravi, there's something I want to say. I bought this site in 2007 — I went with my wife. Her wish was to have a small house built there.
  - who: seller
    t: ಅವಳು ಹೋಗಿ ಆರು ವರ್ಷ ಆಯ್ತು. ಈಗ ನನ್ನ ಮಗಳಿಗೆ ಕಿಡ್ನಿ ಟ್ರಾನ್ಸ್‌ಪ್ಲಾಂಟ್ ಆಗ್ಬೇಕು. ಆಸ್ಪತ್ರೆ ಖರ್ಚು ಇಪ್ಪತ್ತೈದು ಲಕ್ಷ ದಾಟುತ್ತೆ. ಅದಕ್ಕೇ ಮಾರಿದೆ… ಇಲ್ದಿದ್ರೆ ಯಾವತ್ತೂ ಮಾರ್ತಿರ್ಲಿಲ್ಲ.
    tr: Avaḷu hōgi āru varṣa āytu. Īga nanna magaḷige kiḍni ṭrānsplānṭ āgbēku. Āspatre kharchu ippattaidu lakṣa dāṭutte. Adakkē māride… ildidre yāvattū mārtirlilla.
    en: She passed away six years ago. Now my daughter needs a kidney transplant. The hospital costs will cross twenty-five lakh. That's why I sold… otherwise I never would have.
  - who: ravi
    t: ಸಾರ್… ನಮಗೆ ಗೊತ್ತೇ ಇರ್ಲಿಲ್ಲ. ನಿಮ್ಮ ಮಗಳು ಬೇಗ ಹುಷಾರಾಗ್ಲಿ. ಏನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾದ್ರೆ — ರಕ್ತ, ಓಡಾಟ, ಏನೇ ಆಗ್ಲಿ — ಒಂದು ಫೋನ್ ಮಾಡಿ.
    tr: Sār… namage gottē irlilla. Nimma magaḷu bēga huṣārāgli. Ēnādrū sahāya bēkādre — rakta, ōḍāṭa, ēnē āgli — ondu phōn māḍi.
    en: Sir… we had no idea. May your daughter get well soon. If you need any help — blood, running around, anything at all — just give me a call.
  - who: appa
    t: ದುಡ್ಡು ಸರಿಯಾದ ಕಡೆಗೇ ಹೋಗ್ತಿದೆ ಸ್ವಾಮಿ. ದೇವರು ನಿಮ್ಮ ಮಗಳಿಗೆ ಒಳ್ಳೇದು ಮಾಡ್ಲಿ.
    tr: Duḍḍu sariyāda kaḍegē hōgtide svāmi. Dēvaru nimma magaḷige oḷḷēdu māḍli.
    en: The money is going to the right place, sir. May God be good to your daughter.
  - who: seller
    t: ಒಂದೇ ಕೇಳಿಕೆ. ಮನೆ ಕಟ್ಟಿಸಿದ ಮೇಲೆ ಗೃಹಪ್ರವೇಶಕ್ಕೆ ನನ್ನನ್ನ ಕರೀರಿ. ಅವಳ ಕನಸು ಬೇರೆಯವರ ಕೈಯಲ್ಲಾದ್ರೂ ನಿಜ ಆಗೋದನ್ನ ನೋಡ್ಬೇಕು.
    tr: Ondē kēḷike. Mane kaṭṭisida mēle gṛhapravēshakke nannanna karīri. Avaḷa kanasu bēreyavara kaiyallādrū nija āgōdanna nōḍbēku.
    en: Just one request. When the house is built, invite me to the housewarming. I want to see her dream come true — even if it's in someone else's hands.
  - who: ravi
    t: ಖಂಡಿತ ಸಾರ್. ಮೊದಲ ಆಮಂತ್ರಣ ನಿಮಗೇ. ಮಾತು ಕೊಡ್ತೀನಿ.
    tr: Khanḍita sār. Modala āmantraṇa nimagē. Mātu koḍtīni.
    en: Of course, sir. The first invitation will be yours. I give you my word.
  - section: 📲 The khata in Ravi's name
    learn: 'khātā vargāvaṇe · passive with āgu: anumōdane āgide · -ida mēle (after) · a discount: riyāyiti'
  - scene: Early April 2025. Dinner at the flat in Vijayanagar. Ravi's phone pings and he reads the message twice.
  - who: ravi
    t: 'ಮೆಸೇಜ್ ಬಂತು! ಇ-ಆಸ್ತಿಯಿಂದ — ಖಾತಾ ವರ್ಗಾವಣೆಗೆ ಅನುಮೋದನೆ ಆಗಿದೆ. ಹೊಸ ಇ-ಖಾತಾದಲ್ಲಿ ಮಾಲೀಕರ ಹೆಸರು: ರವಿ ಕುಮಾರ್.'
    tr: 'Mesēj bantu! I-āstiyinda — khātā vargāvaṇege anumōdane āgide. Hosa i-khātādalli mālīkara hesaru: Ravi Kumār.'
    en: A message! From e-Aasthi — the khata transfer has been approved. On the new e-khata, the owner's name is Ravi Kumar.
  - who: deepa
    t: ಮೂರೇ ವಾರದಲ್ಲಿ? ರಿಜಿಸ್ಟ್ರೇಷನ್ ಆದ ಮೇಲೆ ಕಾವೇರಿಯಿಂದ ಡೀಟೇಲ್ಸ್ ತಾನಾಗೇ ಇ-ಆಸ್ತಿಗೆ ಹೋಗುತ್ತೆ ಅಂತ ಲಾಯರ್ ಹೇಳಿದ್ರು. ಆದ್ರೂ ನಾಲ್ಕು ಸಲ ಆಫೀಸಿಗೆ ಅಲೀಬೇಕಾಗುತ್ತೆ ಅಂದ್ಕೊಂಡಿದ್ದೆ.
    tr: Mūrē vāradalli? Rijisṭrēṣan āda mēle Kāvēriyinda ḍīṭēls tānāgē i-āstige hōgutte anta lāyar hēḷidru. Ādrū nālku sala āphīsige alībēkāgutte andkonḍidde.
    en: In just three weeks? The lawyer did say that after registration the details go from Kaveri to e-Aasthi automatically. Still, I thought you'd have to trudge to the office four times.
  - who: ravi
    t: ಒಂದೇ ಸಲ ಹೋಗಿದ್ದೆ — ಕ್ರಯಪತ್ರ, ಹಳೇ ಟ್ಯಾಕ್ಸ್ ರಸೀದಿ ಅಪ್ಲೋಡ್ ಆಗಿಲ್ಲ ಅಂದ್ರು. ಅಲ್ಲೇ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ ಕೊಟ್ಟೆ. ಅಷ್ಟೇ.
    tr: Ondē sala hōgidde — krayapatra, haḷē ṭyāks rasīdi aplōḍ āgilla andru. Allē skyān māḍi koṭṭe. Aṣṭē.
    en: I went just once — they said the sale deed and the old tax receipt hadn't been uploaded. I had them scanned right there and handed them in. That was it.
  - who: ravi
    t: 'ಮುಂದಿನ ಕೆಲಸ: ಈ ವರ್ಷದ ಆಸ್ತಿ ತೆರಿಗೆ ನನ್ನ ಹೆಸರಲ್ಲಿ ಕಟ್ಟೋದು. ಏಪ್ರಿಲ್‌ನಲ್ಲೇ ಕಟ್ಟಿದ್ರೆ ಐದು ಪರ್ಸೆಂಟ್ ರಿಯಾಯಿತಿ.'
    tr: 'Mundina kelasa: ī varṣada āsti terige nanna hesaralli kaṭṭōdu. Ēprilnallē kaṭṭidre aidu parsenṭ riyāyiti.'
    en: 'Next job: pay this year''s property tax in my own name. If it''s paid in April itself, there''s a five percent discount.'
  - who: amma
    t: ಅಂದ್ರೆ… ಈಗ ಆ ಮಣ್ಣು ನಿಜವಾಗ್ಲೂ ನಮ್ದು?
    tr: Andre… īga ā maṇṇu nijavāglū namdu?
    en: So… now that piece of earth is really ours?
  - who: ravi
    t: ಹೌದಮ್ಮ. ಕಾಗದದ ಮೇಲೂ, ಕಂಪ್ಯೂಟರ್‌ನಲ್ಲೂ — ನಮ್ದು.
    tr: Haudamma. Kāgadada mēlū, kampyūṭarnallū — namdu.
    en: Yes, Amma. On paper and in the computer — ours.
  - who: appa
    t: ಸೈಟು ಆಯ್ತು. ಈಗ ಮನೆ. ‘ಮನೆ ಕಟ್ಟಿ ನೋಡು, ಮದುವೆ ಮಾಡಿ ನೋಡು’ ಅಂತಾರೆ. ನಿಜವಾದ ಪರೀಕ್ಷೆ ಈಗ ಶುರು.
    tr: Saiṭu āytu. Īga mane. ‘Mane kaṭṭi nōḍu, maduve māḍi nōḍu’ antāre. Nijavāda parīkṣe īga shuru.
    en: The site is done. Now the house. They say, ‘Build a house and see; hold a wedding and see.’ The real test starts now.
  - who: ananya
    t: ಅಪ್ಪಾ, ಹೊಸ ಮನೇಲಿ ನನಗೆ ಓದೋಕೆ ಒಂದು ಟೇಬಲ್ ಜಾಗ ಇರುತ್ತಾ?
    tr: Appā, hosa manēli nanage ōdōke ondu ṭēbal jāga iruttā?
    en: Appa, in the new house will there be a place for my study table?
  - who: ravi
    t: ಅದನ್ನ ಆರ್ಕಿಟೆಕ್ಟ್ ಆಂಟಿನೇ ಕೇಳೋಣ ಪುಟ್ಟಿ. ಮುಂದಿನ ವಾರ ಅವರನ್ನ ಭೇಟಿ ಮಾಡ್ತಿದೀವಿ.
    tr: Adanna ārkiṭekṭ ānṭinē kēḷōṇa puṭṭi. Mundina vāra avaranna bhēṭi māḍtidīvi.
    en: Let's ask the architect aunty that, sweetheart. We're meeting her next week.
  - chapter: Chapter 5 — The architect and the plan approval
  - section: 📐 The architect's rules
    learn: 'setback, FAR, mahaḍi (storey) · -bāradu (must not) · area arithmetic · because: yākandre'
  - scene: Mid-April 2025. Pallavi Hegde's small studio in Rajarajeshwari Nagar. A survey sketch of the 30×40 site is pinned to the board. Ravi and Deepa sit at her drawing table.
  - who: architect
    t: ಬನ್ನಿ ರವಿ ಅವರೇ, ದೀಪಾ ಅವರೇ. ಸರ್ವೆ ಸ್ಕೆಚ್, ಕ್ರಯಪತ್ರ, ಇ-ಖಾತಾ ಎಲ್ಲಾ ನೋಡಿದೆ. ಮೊದಲು ನಿಮ್ಮ ಮನಸ್ಸಲ್ಲಿ ಏನಿದೆ ಅಂತ ಹೇಳಿ. ಆಮೇಲೆ ರೂಲ್ಸ್ ಏನು ಅನುಮತಿಸುತ್ತೆ ಅಂತ ನಾನು ಹೇಳ್ತೀನಿ.
    tr: Banni Ravi avarē, Dīpā avarē. Sarve skech, krayapatra, i-khātā ellā nōḍide. Modalu nimma manassalli ēnide anta hēḷi. Āmēle rūls ēnu anumatisutte anta nānu hēḷtīni.
    en: Come in, Ravi, Deepa. I've looked at the survey sketch, the sale deed and the e-khata. First tell me what you have in mind. Then I'll tell you what the rules allow.
  - who: ravi
    t: ಕೆಳಗೆ ಕಾರ್ ಪಾರ್ಕಿಂಗ್. ಅದರ ಮೇಲೆ ನಮ್ಮ ಮನೆ. ಮೇಲಿನ ಎರಡು ಮಹಡಿ ಬಾಡಿಗೆಗೆ — ಎರಡು ಟೂ-ಬಿಎಚ್‌ಕೆ. ಬಾಡಿಗೆಯಿಂದ ಇಎಂಐಗೆ ಸ್ವಲ್ಪ ಸಹಾಯ ಆಗ್ಲಿ ಅಂತ.
    tr: Keḷage kār pārking. Adara mēle namma mane. Mēlina eraḍu mahaḍi bāḍigege — eraḍu ṭū-bi-ech-ke. Bāḍigeyinda i-em-aige svalpa sahāya āgli anta.
    en: Car parking at the bottom. Our home above it. The two floors above that for rent — two 2BHKs. So the rent can help a little with the EMI.
  - who: architect
    t: ಸ್ಟಿಲ್ಟ್ ಪ್ಲಸ್ ಗ್ರೌಂಡ್ ಪ್ಲಸ್ ಟು. ಮೂವತ್ತು-ನಲವತ್ತು ಸೈಟಿಗೆ ಅದು ಸಾಧ್ಯ. ಆದ್ರೆ ಮೊದಲು ರೂಲ್ಸ್ ಅರ್ಥ ಮಾಡ್ಕೊಳ್ಳಿ, ಯಾಕಂದ್ರೆ ಇಡೀ ಪ್ಲಾನ್ ಅದರ ಮೇಲೆ ನಿಂತಿರುತ್ತೆ.
    tr: Sṭilṭ plas graunḍ plas ṭū. Mūvattu-nalavattu saiṭige adu sādhya. Ādre modalu rūls artha māḍkoḷḷi, yākandre iḍī plān adara mēle nintirutte.
    en: Stilt plus ground plus two. On a thirty-by-forty site that's possible. But first understand the rules, because the whole plan rests on them.
  - who: architect
    t: ಮೊದಲನೇದು ಸೆಟ್‌ಬ್ಯಾಕ್ — ಸೈಟಿನ ಸುತ್ತ ಖಾಲಿ ಬಿಡ್ಬೇಕಾದ ಜಾಗ. ರಸ್ತೆ ಕಡೆ ಜಾಸ್ತಿ, ಹಿಂದೆ ಮತ್ತೆ ಪಕ್ಕದಲ್ಲಿ ಕಮ್ಮಿ. ಗಾಳಿ, ಬೆಳಕು, ಫೈರ್ ಸೇಫ್ಟಿ — ಎಲ್ಲದಕ್ಕೂ ಅದು ಬೇಕು. ಪಕ್ಕದ ಮನೆ ಗೋಡೆಗೆ ಅಂಟಿಸಿ ಕಟ್ಟಬಾರದು.
    tr: Modalanēdu seṭbyāk — saiṭina sutta khāli biḍbēkāda jāga. Raste kaḍe jāsti, hinde matte pakkadalli kammi. Gāḷi, beḷaku, phair sēphṭi — elladakkū adu bēku. Pakkada mane gōḍege anṭisi kaṭṭabāradu.
    en: The first is the setback — the open space you must leave around the site. More on the road side, less at the back and the sides. It's needed for air, light, fire safety — everything. You must not build right up against the neighbour's wall.
  - who: deepa
    t: ಎಷ್ಟು ಬಿಡ್ಬೇಕು ಮೇಡಂ?
    tr: Eṣṭu biḍbēku mēḍam?
    en: How much do we have to leave, ma'am?
  - who: architect
    t: ಈ ಸೈಜಿಗೆ ಮುಂದೆ ಸುಮಾರು ಒಂದರಿಂದ ಒಂದೂವರೆ ಮೀಟರ್, ಹಿಂದೆ-ಪಕ್ಕ ಸುಮಾರು ಒಂದು ಮೀಟರ್. ಸಣ್ಣ ಸೈಟುಗಳಿಗೆ ಸರ್ಕಾರ ಹೊಸ ರೂಲ್ಸ್ ತರೋ ಯೋಚನೆಯಲ್ಲಿದೆ ಅಂತ ಸುದ್ದಿ ಇದೆ. ಹಾಗಾಗಿ ಕರೆಕ್ಟ್ ನಂಬರ್ ಡ್ರಾಯಿಂಗ್ ಮಾಡುವಾಗ ಆ ದಿನದ ಬೈಲಾ ನೋಡಿ ಹಾಕ್ತೀನಿ.
    tr: Ī saijige munde sumāru ondarinda ondūvare mīṭar, hinde-pakka sumāru ondu mīṭar. Saṇṇa saiṭugaḷige sarkāra hosa rūls tarō yōchaneyallide anta suddi ide. Hāgāgi karekṭ nambar ḍrāying māḍuvāga ā dinada bailā nōḍi hāktīni.
    en: For this size, roughly one to one and a half metres in front, and about one metre at the back and sides. There's news that the government is thinking of new rules for small plots. So I'll put in the exact figures from the bye-laws in force on the day I draw.
  - who: architect
    t: ಎರಡನೇದು ಎಫ್‌ಎಆರ್ — ಫ್ಲೋರ್ ಏರಿಯಾ ರೇಶಿಯೋ. ನಿಮ್ಮ ರಸ್ತೆ ಮೂವತ್ತು ಅಡಿ, ಹಾಗಾಗಿ ಎಫ್‌ಎಆರ್ ಒನ್ ಪಾಯಿಂಟ್ ಸೆವೆಂಟಿಫೈವ್. ಅಂದ್ರೆ ಸಾವಿರದ ಇನ್ನೂರು ಚದರಡಿ ಸೈಟಿನ ಮೇಲೆ ಎಲ್ಲಾ ಮಹಡಿ ಸೇರಿ ಎರಡು ಸಾವಿರದ ನೂರು ಚದರಡಿ. ಸ್ಟಿಲ್ಟ್ ಪಾರ್ಕಿಂಗ್ ಆ ಲೆಕ್ಕಕ್ಕೆ ಬರಲ್ಲ.
    tr: Eraḍanēdu eph-e-ār — phlōr ēriyā rēshiyō. Nimma raste mūvattu aḍi, hāgāgi eph-e-ār van pāyinṭ sevenṭiphaiv. Andre sāvirada innūru chadaraḍi saiṭina mēle ellā mahaḍi sēri eraḍu sāvirada nūru chadaraḍi. Sṭilṭ pārking ā lekkakke baralla.
    en: The second is FAR — floor area ratio. Your road is thirty feet, so the FAR is one point seven five. That means on a twelve-hundred-square-foot site, all floors together can total twenty-one hundred square feet. The stilt parking doesn't count towards that.
  - who: ravi
    t: ಮೂರು ಮಹಡಿಗೆ ಎರಡು ಸಾವಿರದ ನೂರು ಅಂದ್ರೆ… ಒಂದೊಂದು ಮಹಡಿ ಸುಮಾರು ಏಳುನೂರು ಚದರಡಿ. ಅದು ಚಿಕ್ಕದಾಯ್ತಲ್ವಾ ಮೇಡಂ? ನಮ್ಮ ಲೇಔಟ್‌ನಲ್ಲಿ ಎಲ್ರೂ ಒಂದೊಂದು ಫ್ಲೋರ್ ಒಂಬೈನೂರು-ಸಾವಿರ ಅಡಿ ಕಟ್ತಿದಾರೆ.
    tr: Mūru mahaḍige eraḍu sāvirada nūru andre… ondondu mahaḍi sumāru ēḷunūru chadaraḍi. Adu chikkadāytalvā mēḍam? Namma lē-auṭnalli elrū ondondu phlōr ombainūru-sāvira aḍi kaṭtidāre.
    en: Twenty-one hundred for three floors means… about seven hundred square feet per floor. Isn't that small, ma'am? In our layout everyone is building nine hundred to a thousand feet per floor.
  - who: architect
    t: ಕಟ್ತಿದಾರೆ, ನಿಜ. ಪ್ಲಾನ್‌ನಲ್ಲಿ ಒಂದು ತೋರಿಸ್ತಾರೆ, ಸೈಟಲ್ಲಿ ಇನ್ನೊಂದು ಕಟ್ತಾರೆ. ಆದ್ರೆ ಈ ಏಪ್ರಿಲ್‌ನಿಂದ ಬೆಸ್ಕಾಂ ಓಸಿ ಇಲ್ಲದೆ ಪರ್ಮನೆಂಟ್ ಕನೆಕ್ಷನ್ ಕೊಡ್ತಿಲ್ಲ. ಪ್ಲಾನ್‌ಗೆ ವಿರುದ್ಧವಾಗಿ ಕಟ್ಟಿದ್ರೆ ಓಸಿ ಸಿಗೋದು ಕಷ್ಟ. ಕರೆಂಟ್ ಇಲ್ಲದ ಮನೆಗೆ ಯಾರು ಬಾಡಿಗೆಗೆ ಬರ್ತಾರೆ?
    tr: Kaṭtidāre, nija. Plānnalli ondu tōristāre, saiṭalli innondu kaṭtāre. Ādre ī Ēprilninda Beskām ō-si illade parmanenṭ kanekṣan koḍtilla. Plānge viruddhavāgi kaṭṭidre ō-si sigōdu kaṣṭa. Karenṭ illada manege yāru bāḍigege bartāre?
    en: They are, it's true. They show one thing on the plan and build another on the site. But since this April, BESCOM hasn't been giving permanent connections without an OC. If you build against the plan, getting an OC is hard. And who will rent a house with no electricity?
  - who: deepa
    t: ಅಂದ್ರೆ ಎಕ್ಸ್‌ಟ್ರಾ ಇನ್ನೂರು ಅಡಿಗೋಸ್ಕರ ಇಡೀ ಮನೆನೇ ರಿಸ್ಕ್‌ಗೆ ಹಾಕಿದ ಹಾಗೆ.
    tr: Andre eksṭrā innūru aḍigōskara iḍī manenē riskge hākida hāge.
    en: So for an extra two hundred feet, we'd be putting the whole house at risk.
  - who: ravi
    t: ಬೇಡ. ಪ್ಲಾನ್ ಏನು ಹೇಳುತ್ತೋ ಅಷ್ಟೇ ಕಟ್ಟಿಸೋಣ. ಏಳುನೂರು ಅಡಿಯಲ್ಲಿ ಒಳ್ಳೆ ಟೂ-ಬಿಎಚ್‌ಕೆ ಡಿಸೈನ್ ಮಾಡ್ಕೊಡಿ ಮೇಡಂ. ಅದೇ ನಿಮ್ಮ ಕಲೆ.
    tr: Bēḍa. Plān ēnu hēḷuttō aṣṭē kaṭṭisōṇa. Ēḷunūru aḍiyalli oḷḷe ṭū-bi-ech-ke ḍisain māḍkoḍi mēḍam. Adē nimma kale.
    en: No. Let's have built only what the plan says. Design us a good 2BHK in seven hundred feet, ma'am. That's where your skill comes in.
  - who: architect
    t: ಚಾಲೆಂಜ್ ಒಪ್ಕೊಂಡೆ. ಎರಡು ಬೆಡ್‌ರೂಮ್, ಹಾಲ್, ಕಿಚನ್, ಎರಡು ಬಾತ್‌ರೂಮ್ — ಸರಿಯಾಗಿ ಪ್ಲಾನ್ ಮಾಡಿದ್ರೆ ಆರಾಮಾಗಿ ಬರುತ್ತೆ. ವೇಸ್ಟ್ ಆಗೋ ಕಾರಿಡಾರ್ ತೆಗೆದ್ರೆ ಸಾಕು.
    tr: Chālenj opkonḍe. Eraḍu beḍrūm, hāl, kichan, eraḍu bātrūm — sariyāgi plān māḍidre ārāmāgi barutte. Vēsṭ āgō kāriḍār tegedre sāku.
    en: Challenge accepted. Two bedrooms, a hall, a kitchen, two bathrooms — planned properly, it fits comfortably. You just have to get rid of wasted corridors.
  - section: 🧭 Vastu meets the drawing board
    learn: 'directions: īshānya, āgnēya, nairṛtya · compromise: -ādrū paravāgilla · ‘the price is…’: bele ēnu andre'
  - scene: Two weeks later. Pallavi brings the first sketches to the family's flat. Amma and Appa sit closest to the table; Ananya kneels on a chair.
  - who: architect
    t: ಆಂಟಿ, ನಿಮ್ಮ ಮಾತು ನೆನಪಿದೆ. ಸೈಟು ಪೂರ್ವಾಭಿಮುಖ, ಮುಖ್ಯ ಬಾಗಿಲು ಪೂರ್ವಕ್ಕೆ. ದೇವರ ಮನೆ ಈಶಾನ್ಯದಲ್ಲಿ, ಅಡುಗೆ ಮನೆ ಆಗ್ನೇಯದಲ್ಲಿ, ನಿಮ್ಮ ಬೆಡ್‌ರೂಮ್ ನೈಋತ್ಯದಲ್ಲಿ.
    tr: Ānṭi, nimma mātu nenapide. Saiṭu pūrvābhimukha, mukhya bāgilu pūrvakke. Dēvara mane īshānyadalli, aḍuge mane āgnēyadalli, nimma beḍrūm nairṛtyadalli.
    en: Aunty, I remember what you said. The site faces east, so the main door faces east. The puja room in the north-east, the kitchen in the south-east, your bedroom in the south-west.
  - who: amma
    t: ಒಳ್ಳೇದು. ಸಂಪ್ ಎಲ್ಲಿ? ನೀರು ಈಶಾನ್ಯದಲ್ಲೇ ಇರ್ಬೇಕು.
    tr: Oḷḷēdu. Samp elli? Nīru īshānyadallē irbēku.
    en: Good. Where's the sump? Water must be in the north-east.
  - who: architect
    t: ಸಂಪ್ ಈಶಾನ್ಯದಲ್ಲೇ, ಸ್ಟಿಲ್ಟ್ ಕೆಳಗೆ — ಹತ್ತು ಸಾವಿರ ಲೀಟರ್. ಓವರ್‌ಹೆಡ್ ಟ್ಯಾಂಕ್ ನೈಋತ್ಯದಲ್ಲಿ, ಎಲ್ಲಕ್ಕಿಂತ ಎತ್ತರದಲ್ಲಿ. ವಾಸ್ತುಗೂ ಸರಿ, ನಲ್ಲಿಯಲ್ಲಿ ಪ್ರೆಷರ್‌ಗೂ ಸರಿ.
    tr: Samp īshānyadallē, sṭilṭ keḷage — hattu sāvira līṭar. Ōvarheḍ ṭyānk nairṛtyadalli, ellakkinta ettaradalli. Vāstugū sari, nalliyalli preṣargū sari.
    en: The sump is in the north-east, under the stilt — ten thousand litres. The overhead tank in the south-west, the highest point of all. Right for Vastu, and right for the pressure in the taps.
  - who: amma
    t: ಆದ್ರೆ ಈ ಮೆಟ್ಟಿಲು ಈಶಾನ್ಯದ ಹತ್ರಾನೇ ಇದೆಯಲ್ಲ? ಈಶಾನ್ಯದಲ್ಲಿ ಭಾರ ಇರಬಾರದು ಅಂತಾರೆ.
    tr: Ādre ī meṭṭilu īshānyada hatrānē ideyalla? Īshānyadalli bhāra irabāradu antāre.
    en: But this staircase is right next to the north-east, isn't it? They say there shouldn't be any weight in the north-east.
  - who: architect
    t: ನಿಜ ಆಂಟಿ. ಬಾಡಿಗೆದಾರರು ನಿಮ್ಮ ಮನೆ ಮುಂದೆ ಹಾದು ಹೋಗದೆ ಇರಲಿ ಅಂತ ಗೇಟ್ ಹತ್ರ ಇಟ್ಟಿದ್ದೆ. ದಕ್ಷಿಣದ ಗೋಡೆ ಪಕ್ಕಕ್ಕೆ ಹಾಕಿದ್ರೆ ವಾಸ್ತುಗೂ ಸರಿ, ಪ್ರೈವಸಿನೂ ಉಳಿಯುತ್ತೆ. ಆದ್ರೆ ಅದರ ಬೆಲೆ ಏನು ಅಂದ್ರೆ — ನಿಮ್ಮ ಅಡುಗೆ ಮನೆ ಎರಡು ಅಡಿ ಚಿಕ್ಕದಾಗುತ್ತೆ.
    tr: Nija ānṭi. Bāḍigedāraru nimma mane munde hādu hōgade irali anta gēṭ hatra iṭṭidde. Dakṣiṇada gōḍe pakkakke hākidre vāstugū sari, praivasinū uḷiyutte. Ādre adara bele ēnu andre — nimma aḍuge mane eraḍu aḍi chikkadāgutte.
    en: True, aunty. I'd put it near the gate so the tenants wouldn't have to walk past your front door. If I move it along the south wall, it's right for Vastu and the privacy stays too. But the price is this — your kitchen becomes two feet smaller.
  - who: amma
    t: ಅಡುಗೆ ಮನೆ ಚಿಕ್ಕದಾದ್ರೂ ಪರವಾಗಿಲ್ಲ. ಈಶಾನ್ಯ ಹಗುರವಾಗಿರ್ಲಿ.
    tr: Aḍuge mane chikkadādrū paravāgilla. Īshānya haguravāgirli.
    en: Never mind if the kitchen is smaller. Let the north-east stay light.
  - who: deepa
    t: ಅತ್ತೆ, ಆ ಅಡುಗೆ ಮನೇಲಿ ಜಾಸ್ತಿ ಹೊತ್ತು ಇರೋದು ನಾನು! ಎರಡು ಅಡಿ ಹೋದ್ರೆ ಫ್ರಿಜ್ ಎಲ್ಲಿ ಇಡೋದು?
    tr: Atte, ā aḍuge manēli jāsti hottu irōdu nānu! Eraḍu aḍi hōdre phrij elli iḍōdu?
    en: Atte, I'm the one who spends the most time in that kitchen! If two feet go, where do I put the fridge?
  - who: architect
    t: ಫ್ರಿಜ್‌ಗೆ ಡೈನಿಂಗ್ ಪಕ್ಕ ಗೋಡೆಯಲ್ಲಿ ಒಂದು ಗೂಡು ಮಾಡ್ತೀನಿ ದೀಪಾ ಅವರೇ. ಅಡುಗೆ ಮನೆಯಲ್ಲಿ ಎಲ್-ಶೇಪ್ ಕಟ್ಟೆ, ಮೇಲೆ ಪೂರ್ತಿ ಕಬೋರ್ಡ್. ಜಾಗ ಕಮ್ಮಿ ಆದ್ರೂ ಉಪಯೋಗ ಕಮ್ಮಿ ಆಗಲ್ಲ.
    tr: Phrijge ḍaining pakka gōḍeyalli ondu gūḍu māḍtīni Dīpā avarē. Aḍuge maneyalli el-shēp kaṭṭe, mēle pūrti kabōrḍ. Jāga kammi ādrū upayōga kammi āgalla.
    en: I'll make a recess in the wall next to the dining area for the fridge, Deepa. An L-shaped counter in the kitchen, with full cupboards above. Less space, but no less use.
  - who: appa
    t: ನಮ್ಮ ಮನೇಲಿ ‘ಎತ್ತು ಏರಿಗೆಳೆದರೆ ಕೋಣ ನೀರಿಗೆಳೀತು’ ಅನ್ನೋ ಹಾಗಿತ್ತು. ನೀವು ಎರಡನ್ನೂ ಒಂದೇ ದಾರಿಗೆ ತಂದ್ರಿ ಮೇಡಂ.
    tr: Namma manēli ‘ettu ērigeḷedare kōṇa nīrigeḷītu’ annō hāgittu. Nīvu eraḍannū ondē dārige tandri mēḍam.
    en: In our house it was like the saying, ‘The ox pulls up the bank, the buffalo pulls into the water.’ You've brought both onto the same path, ma'am.
  - who: architect
    t: 'ಇನ್ನೊಂದು ಕಡ್ಡಾಯ ವಿಷಯ: ಮಳೆನೀರು ಕೊಯ್ಲು. ಮೂವತ್ತು-ನಲವತ್ತು ಸೈಟಿಗೆ ಅದು ಕಾನೂನು ಪ್ರಕಾರ ಕಡ್ಡಾಯ. ಟೆರೇಸ್ ನೀರು ಫಿಲ್ಟರ್ ಮೂಲಕ ಸಂಪಿಗೆ, ಹೆಚ್ಚಾದ ನೀರು ಇಂಗುಗುಂಡಿಗೆ — ಭೂಮಿ ಒಳಗೆ ಇಳಿಯೋ ಹಾಗೆ.'
    tr: 'Innondu kaḍḍāya viṣaya: maḷenīru koylu. Mūvattu-nalavattu saiṭige adu kānūnu prakāra kaḍḍāya. Ṭerēs nīru philṭar mūlaka sampige, hechchāda nīru iṅguguṇḍige — bhūmi oḷage iḷiyō hāge.'
    en: 'One more compulsory thing: rainwater harvesting. For a thirty-by-forty site it''s required by law. Terrace water goes through a filter into the sump, and the overflow into a recharge pit — so it soaks back into the ground.'
  - who: deepa
    t: ಮಾಡದಿದ್ರೆ ಏನಾಗುತ್ತೆ?
    tr: Māḍadidre ēnāgutte?
    en: And if we don't?
  - who: architect
    t: ಜಲಮಂಡಳಿ ದಂಡ ಹಾಕುತ್ತೆ — ಅದರ ವಿವರ ಅವರೇ ಹೇಳ್ತಾರೆ. ಆದ್ರೆ ದಂಡಕ್ಕಿಂತ ಮುಖ್ಯ — ಕೆಂಗೇರಿ ಕಡೆ ಬೇಸಿಗೆಯಲ್ಲಿ ಬೋರ್‌ವೆಲ್ ಒಣಗುತ್ತೆ. ಪ್ರತಿ ಮಳೆ ಹನಿ ಉಳಿಸಿದ್ರೆ ಟ್ಯಾಂಕರ್ ಖರ್ಚು ಕಮ್ಮಿ.
    tr: Jalamanḍaḷi danḍa hākutte — adara vivara avarē hēḷtāre. Ādre danḍakkinta mukhya — Kengēri kaḍe bēsigeyalli bōrvel oṇagutte. Prati maḷe hani uḷisidre ṭyānkar kharchu kammi.
    en: The water board fines you — they'll give you the details themselves. But more important than any fine — around Kengeri, borewells dry up in summer. Save every drop of rain and you spend less on tankers.
  - who: appa
    t: ‘ಹನಿ ಹನಿ ಗೂಡಿದರೆ ಹಳ್ಳ.’ ಇಷ್ಟು ವರ್ಷ ದುಡ್ಡಿಗೆ ಹೇಳ್ತಿದ್ದೆ. ಈಗ ನಿಜವಾದ ಹನಿಗೇ ಹೇಳ್ಬೋದು.
    tr: ‘Hani hani gūḍidare haḷḷa.’ Iṣṭu varṣa duḍḍige hēḷtidde. Īga nijavāda hanigē hēḷbōdu.
    en: ‘Drop by drop, a stream.’ All these years I said it about money. Now I can say it about real drops.
  - who: ananya
    t: ಪಲ್ಲವಿ ಆಂಟಿ, ನನ್ ಟೇಬಲ್ ಎಲ್ಲಿ?
    tr: Pallavi ānṭi, nan ṭēbal elli?
    en: Pallavi aunty, where's my table?
  - who: architect
    t: ಇಲ್ಲಿ ನೋಡು — ಪೂರ್ವದ ಕಿಟಕಿ ಪಕ್ಕ ನಿನ್ನ ಓದೋ ಮೂಲೆ. ಬೆಳಿಗ್ಗೆ ಮೊದಲ ಬಿಸಿಲು ನಿನ್ನ ಪುಸ್ತಕದ ಮೇಲೇ ಬೀಳುತ್ತೆ.
    tr: Illi nōḍu — pūrvada kiṭaki pakka ninna ōdō mūle. Beḷigge modala bisilu ninna pustakada mēlē bīḷutte.
    en: Look here — your study corner, next to the east window. The first morning sun will fall right on your books.
  - section: 🧪 Engineer, soil and fees
    learn: 'causatives: māḍisu, kaṭṭisu · listing costs · careful uncertainty: spaṣṭavāgi hēḷalla, -ante'
  - scene: The same evening, after Amma and Appa have gone to rest. Pallavi spreads a checklist on the table.
  - who: ravi
    t: ಮೇಡಂ, ಮುಂದಿನ ಹೆಜ್ಜೆ ಏನು? ಪ್ಲಾನ್ ಅಪ್ರೂವಲ್‌ಗೆ ಯಾವಾಗ ಹಾಕೋದು?
    tr: Mēḍam, mundina hejje ēnu? Plān aprūvalge yāvāga hākōdu?
    en: Ma'am, what's the next step? When do we apply for plan approval?
  - who: architect
    t: 'ಅದಕ್ಕೂ ಮುಂಚೆ ಎರಡು ಕೆಲಸ. ಒಂದು: ಮಣ್ಣು ಪರೀಕ್ಷೆ ಮಾಡಿಸ್ಬೇಕು — ಸಾಯಿಲ್ ಟೆಸ್ಟ್. ಮಣ್ಣು ಎಷ್ಟು ಭಾರ ತಡೆಯುತ್ತೆ ಅಂತ ಗೊತ್ತಾದ್ರೇನೇ ಫೌಂಡೇಶನ್ ಎಷ್ಟು ಆಳ ಅಂತ ಹೇಳೋಕಾಗೋದು. ಹದಿನೈದು-ಇಪ್ಪತ್ತು ಸಾವಿರ ಆಗುತ್ತೆ.'
    tr: 'Adakkū muñche eraḍu kelasa. Ondu: maṇṇu parīkṣe māḍisbēku — sāyil ṭesṭ. Maṇṇu eṣṭu bhāra taḍeyutte anta gottādrēnē phaunḍēshan eṣṭu āḷa anta hēḷōkāgōdu. Hadinaidu-ippattu sāvira āgutte.'
    en: 'Two things before that. One: we must get a soil test done. Only once we know how much load the soil can bear can anyone say how deep the foundation must go. It costs fifteen to twenty thousand.'
  - who: architect
    t: 'ಎರಡು: ಸ್ಟ್ರಕ್ಚರಲ್ ಎಂಜಿನಿಯರ್. ನಾನು ಮನೆಯ ರೂಪ, ಜಾಗ ಡಿಸೈನ್ ಮಾಡ್ತೀನಿ. ಕಾಲಂ ಎಷ್ಟು ದಪ್ಪ, ಕಂಬಿ ಎಷ್ಟು, ಸ್ಲ್ಯಾಬ್ ಎಷ್ಟು ಇಂಚು — ಅದು ಅವರ ಲೆಕ್ಕ. ಅವರ ಸ್ಟ್ರಕ್ಚರಲ್ ಸ್ಟೆಬಿಲಿಟಿ ಸರ್ಟಿಫಿಕೇಟ್ ಅಪ್ರೂವಲ್‌ಗೂ ಬೇಕು.'
    tr: 'Eraḍu: sṭrakcharal enjiniyar. Nānu maneya rūpa, jāga ḍisain māḍtīni. Kālam eṣṭu dappa, kambi eṣṭu, slyāb eṣṭu iñchu — adu avara lekka. Avara sṭrakcharal sṭebiliṭi sarṭiphikēṭ aprūvalgū bēku.'
    en: 'Two: a structural engineer. I design the shape of the house and the spaces. How thick the columns are, how much steel, how many inches the slab — that''s his calculation. His structural stability certificate is also needed for the approval.'
  - who: deepa
    t: ನಿಮ್ಮ ಫೀಸ್ ಎಷ್ಟು ಮೇಡಂ? ನೇರವಾಗಿ ಕೇಳ್ತಿದೀನಿ, ಬೇಜಾರ್ ಮಾಡ್ಕೋಬೇಡಿ.
    tr: Nimma phīs eṣṭu mēḍam? Nēravāgi kēḷtidīni, bējār māḍkōbēḍi.
    en: What's your fee, ma'am? I'm asking directly — please don't mind.
  - who: architect
    t: ನೇರವಾಗಿ ಕೇಳೋದೇ ಒಳ್ಳೇದು. ಪ್ಲಾನ್, ಅಪ್ರೂವಲ್ ಡ್ರಾಯಿಂಗ್ಸ್, ವರ್ಕಿಂಗ್ ಡ್ರಾಯಿಂಗ್ಸ್, ಕೆಲಸದ ಸಮಯದಲ್ಲಿ ಆರು ಸೈಟ್ ವಿಸಿಟ್ — ಎಲ್ಲಾ ಸೇರಿ ಒಂದು ಲಕ್ಷದ ಅರವತ್ತು ಸಾವಿರ. ಸ್ಟ್ರಕ್ಚರಲ್ ಎಂಜಿನಿಯರ್ ಫೀಸ್ ಬೇರೆ, ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಸಾವಿರ.
    tr: Nēravāgi kēḷōdē oḷḷēdu. Plān, aprūval ḍrāyings, varking ḍrāyings, kelasada samayadalli āru saiṭ visiṭ — ellā sēri ondu lakṣada aravattu sāvira. Sṭrakcharal enjiniyar phīs bēre, sumāru ippattaidu sāvira.
    en: Asking directly is best. The plan, approval drawings, working drawings, and six site visits during construction — one lakh sixty thousand altogether. The structural engineer's fee is separate, about twenty-five thousand.
  - who: ravi
    t: ಆನ್‌ಲೈನ್ ಅಪ್ರೂವಲ್ ಬಗ್ಗೆ ಕೇಳಿದ್ದೆ — ‘ನಂಬಿಕೆ ನಕ್ಷೆ’ ಅಂತ. ಆರ್ಕಿಟೆಕ್ಟ್ ಸರ್ಟಿಫೈ ಮಾಡಿದ್ರೆ ತಕ್ಷಣ ಅಪ್ರೂವಲ್ ಸಿಗುತ್ತಂತೆ. ನಿಜಾನಾ?
    tr: Ānlain aprūval bagge kēḷidde — ‘Nambike Nakṣe’ anta. Ārkiṭekṭ sarṭiphai māḍidre takṣaṇa aprūval siguttante. Nijānā?
    en: I'd heard about an online approval — ‘Nambike Nakshe’. Apparently if the architect certifies the plan, you get approval instantly. Is that true?
  - who: architect
    t: ಸ್ಕೀಮ್ ಅನೌನ್ಸ್ ಆಗಿದ್ದು ನಿಜ — ಸಣ್ಣ ಸೈಟುಗಳಿಗೆ ನಂಬಿಕೆಯ ಮೇಲೆ ತಾತ್ಕಾಲಿಕ ಅನುಮತಿ. ಆದ್ರೆ ಪ್ರಾಕ್ಟೀಸ್‌ನಲ್ಲಿ ಅದು ಹೇಗೆ ನಡೀತಿದೆ, ಯಾವ ಫೈಲ್ ಯಾವ ದಾರಿಯಲ್ಲಿ ಹೋಗುತ್ತೆ ಅಂತ ನಾನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಲ್ಲ. ಪ್ರತಿ ತಿಂಗಳು ಏನಾದ್ರೂ ಬದಲಾಗ್ತಿದೆ.
    tr: Skīm anauns āgiddu nija — saṇṇa saiṭugaḷige nambikeya mēle tātkālika anumati. Ādre prākṭīsnalli adu hēge naḍītide, yāva phail yāva dāriyalli hōgutte anta nānu spaṣṭavāgi hēḷalla. Prati tiṅgaḷu ēnādrū badalāgtide.
    en: It's true the scheme was announced — provisional permission for small plots, based on trust. But how it's actually working in practice, which file goes down which route — I won't claim to know for certain. Something changes every month.
  - who: architect
    t: 'ನನ್ನ ಸಲಹೆ: ಪೂರ್ತಿ ಸರಿಯಾದ ಡ್ರಾಯಿಂಗ್ಸ್ ಹಾಕೋಣ, ಸರಿಯಾದ ದಾರಿಯಲ್ಲಿ. ಬೇಗ ಸಿಕ್ಕ ಅನುಮತಿ ಆಮೇಲೆ ಇನ್ಸ್‌ಪೆಕ್ಷನ್‌ನಲ್ಲಿ ಪ್ರಶ್ನೆಗೆ ಬಂದ್ರೆ ಇನ್ನೂ ದೊಡ್ಡ ತೊಂದರೆ. ಡಾಕ್ಯುಮೆಂಟ್ಸ್ ಲಿಸ್ಟ್ ಇದು — ಕ್ರಯಪತ್ರ, ಇ-ಖಾತಾ, ಈ ವರ್ಷದ ಟ್ಯಾಕ್ಸ್ ರಸೀದಿ ನಿಮ್ಮ ಹೆಸರಲ್ಲಿ, ಸರ್ವೆ ಸ್ಕೆಚ್, ಸೈಟ್ ಫೋಟೋಸ್.'
    tr: 'Nanna salahe: pūrti sariyāda ḍrāyings hākōṇa, sariyāda dāriyalli. Bēga sikka anumati āmēle inspekṣannalli prashnege bandre innū doḍḍa tondare. Ḍākyumenṭs lisṭ idu — krayapatra, i-khātā, ī varṣada ṭyāks rasīdi nimma hesaralli, sarve skech, saiṭ phōṭōs.'
    en: 'My advice: let''s submit fully correct drawings, the proper way. If a quick permission gets questioned later at an inspection, the trouble is even bigger. Here''s the document list — sale deed, e-khata, this year''s tax receipt in your name, survey sketch, site photos.'
  - who: architect
    t: ಒಳ್ಳೆ ವಿಷಯ ಅಂದ್ರೆ ನಿಮ್ಮ ಇ-ಖಾತಾ ಈಗಾಗಲೇ ನಿಮ್ಮ ಹೆಸರಲ್ಲಿದೆ. ಮುಂದೆ ಇ-ಖಾತಾ ಇಲ್ಲದೆ ಪ್ಲಾನ್ ಅಪ್ರೂವಲ್ ಕೊಡಲ್ಲ ಅಂತ ಪಾಲಿಕೆ ಹೇಳ್ತಿದೆಯಂತೆ. ಪಾಲಿಕೆ ಫೀ — ಸ್ಕ್ರೂಟಿನಿ ಫೀ, ಲೈಸೆನ್ಸ್ ಫೀ, ಕಟ್ಟಡ ವೆಚ್ಚದ ಒಂದು ಪರ್ಸೆಂಟ್ ಕಾರ್ಮಿಕ ಕಲ್ಯಾಣ ಸೆಸ್ — ಒಂದರಿಂದ ಒಂದೂವರೆ ಲಕ್ಷ ಇಟ್ಕೊಳ್ಳಿ. ಸರಿಯಾದ ಮೊತ್ತ ಡಿಮ್ಯಾಂಡ್ ನೋಟಿಸ್‌ನಲ್ಲಿ ಬರುತ್ತೆ.
    tr: Oḷḷe viṣaya andre nimma i-khātā īgāgalē nimma hesarallide. Munde i-khātā illade plān aprūval koḍalla anta pālike hēḷtideyante. Pālike phī — skrūṭini phī, laisens phī, kaṭṭaḍa vechchada ondu parsenṭ kārmika kalyāṇa ses — ondarinda ondūvare lakṣa iṭkoḷḷi. Sariyāda motta ḍimyānḍ nōṭisnalli barutte.
    en: The good thing is that your e-khata is already in your name. Apparently the corporation says that soon it won't give plan approval without an e-khata. The corporation's fees — scrutiny fee, licence fee, a labour-welfare cess of one percent of the building cost — budget one to one and a half lakh. The exact amount comes in the demand notice.
  - who: deepa
    t: ಬರೆದುಕೊಂಡೆ. ಸಾಯಿಲ್ ಟೆಸ್ಟ್ ಇಪ್ಪತ್ತು, ಎಂಜಿನಿಯರ್ ಇಪ್ಪತ್ತೈದು, ನೀವು ಒಂದು-ಅರವತ್ತು, ಪಾಲಿಕೆ ಒಂದೂವರೆ… ಒಂದು ಇಟ್ಟಿಗೆನೂ ಇಟ್ಟಿಲ್ಲ, ಆಗಲೇ ಮೂರೂವರೆ ಲಕ್ಷ ದಾಟಿತು.
    tr: Baredukonḍe. Sāyil ṭesṭ ippattu, enjiniyar ippattaidu, nīvu ondu-aravattu, pālike ondūvare… ondu iṭṭigenū iṭṭilla, āgalē mūrūvare lakṣa dāṭitu.
    en: Noted. Soil test twenty, engineer twenty-five, you one-sixty, the corporation one and a half… Not a single brick laid, and we've already crossed three and a half lakh.
  - who: architect
    t: ಅದಕ್ಕೇ ಮೊದಲ ದಿನವೇ ಪೂರ್ತಿ ಲೆಕ್ಕ ಹೇಳ್ತೀನಿ. ಆಮೇಲೆ ಆಶ್ಚರ್ಯ ಆಗಬಾರದು.
    tr: Adakkē modala dinavē pūrti lekka hēḷtīni. Āmēle āshcharya āgabāradu.
    en: That's why I give the full account on the very first day. There shouldn't be surprises later.
  - who: ravi
    t: ನಮ್ಮ ಉಳಿತಾಯ ಎಲ್ಲಾ ಸೈಟಿಗೇ ಹೋಯ್ತು. ಅದಕ್ಕೇ ನನ್ನ ಪಿಎಫ್‌ನಿಂದ ಅಡ್ವಾನ್ಸ್‌ಗೆ ಅರ್ಜಿ ಹಾಕಿದೀನಿ. ಮನೆ ಕಟ್ಟಿಸೋಕೆ ಅಂದ್ರೆ ಪಿಎಫ್‌ನಲ್ಲಿ ಸ್ವಲ್ಪ ಭಾಗ ತೆಗೆಯೋಕೆ ಅವಕಾಶ ಇದೆ.
    tr: Namma uḷitāya ellā saiṭigē hōytu. Adakkē nanna pi-ephninda aḍvānsge arji hākidīni. Mane kaṭṭisōke andre pi-ephnalli swalpa bhāga tegeyōke avakāsha ide.
    en: All our savings went into the site. That's why I've applied for an advance from my PF. If it's for building a house, you're allowed to take out part of it.
  - section: 🏢 At the BBMP zonal office
    learn: 'office register: korate, sthaḷa parishīlane, beṭarmenṭ shulka · requests: tiḷkoḷḷōke bande, māḍiskoḷḷi · ‘tell me now’: hēḷibiḍi'
  - scene: Late May 2025. The BBMP Rajarajeshwari Nagar zonal office. Pallavi submitted the application online two weeks ago; yesterday an SMS said ‘shortfall’. Ravi has waited forty minutes outside the cabin of Assistant Executive Engineer Sathish, a thick file on his lap.
  - who: ravi
    t: ನಮಸ್ಕಾರ ಸಾರ್. ನಾನು ರವಿ ಕುಮಾರ್. ಕೆಂಗೇರಿ ಹತ್ರ ಸೈಟು, ಪ್ಲಾನ್ ಅಪ್ರೂವಲ್ ಅಪ್ಲಿಕೇಶನ್. ನಿನ್ನೆ ‘ಶಾರ್ಟ್‌ಫಾಲ್’ ಅಂತ ಮೆಸೇಜ್ ಬಂತು. ಏನು ಕೊರತೆ ಅಂತ ತಿಳ್ಕೊಳ್ಳೋಕೆ ಬಂದೆ.
    tr: Namaskāra sār. Nānu Ravi Kumār. Kengēri hatra saiṭu, plān aprūval aplikēshan. Ninne ‘shārṭphāl’ anta mesēj bantu. Ēnu korate anta tiḷkoḷḷōke bande.
    en: Good afternoon, sir. I'm Ravi Kumar. A site near Kengeri, plan approval application. Yesterday I got a ‘shortfall’ message. I've come to find out what's missing.
  - who: aee
    t: ಕೂತ್ಕೊಳ್ಳಿ. ಅಪ್ಲಿಕೇಶನ್ ನಂಬರ್ ಹೇಳಿ… ಹಾ, ಸಿಕ್ತು. ಸ್ಟಿಲ್ಟ್ ಪ್ಲಸ್ ಗ್ರೌಂಡ್ ಪ್ಲಸ್ ಟು, ರೆಸಿಡೆನ್ಶಿಯಲ್, ಮೂರು ಯೂನಿಟ್. ಆರ್ಕಿಟೆಕ್ಟ್ ಪಲ್ಲವಿ ಹೆಗ್ಡೆ. ಡ್ರಾಯಿಂಗ್ ಚೆನ್ನಾಗಿದೆ, ಎಫ್‌ಎಆರ್ ಒಳಗೇ ಇದೆ, ಸೆಟ್‌ಬ್ಯಾಕ್ ಸರಿ ಇದೆ.
    tr: Kūtkoḷḷi. Aplikēshan nambar hēḷi… hā, siktu. Sṭilṭ plas graunḍ plas ṭū, resiḍenshiyal, mūru yūniṭ. Ārkiṭekṭ Pallavi Hegḍe. Ḍrāying chennāgide, eph-e-ār oḷagē ide, seṭbyāk sari ide.
    en: Sit down. Tell me the application number… ah, here it is. Stilt plus ground plus two, residential, three units. Architect Pallavi Hegde. The drawing is good, within FAR, setbacks correct.
  - who: aee
    t: ಸಮಸ್ಯೆ ಡ್ರಾಯಿಂಗ್‌ನಲ್ಲಿ ಅಲ್ಲ, ಡಾಕ್ಯುಮೆಂಟ್‌ನಲ್ಲಿ. ಕ್ರಯಪತ್ರ ಇದೆ, ಇ-ಖಾತಾ ಇದೆ, ಸರ್ವೆ ಸ್ಕೆಚ್, ಸ್ಟ್ರಕ್ಚರಲ್ ಸರ್ಟಿಫಿಕೇಟ್ ಇದೆ. ಆದ್ರೆ ಅಪ್ಲೋಡ್ ಆಗಿರೋದು ಇಪ್ಪತ್ನಾಲ್ಕು-ಇಪ್ಪತ್ತೈದರ ಟ್ಯಾಕ್ಸ್ ರಸೀದಿ, ಹಳೇ ಓನರ್ ಹೆಸರಲ್ಲಿ. ಈ ವರ್ಷದ್ದು, ನಿಮ್ಮ ಹೆಸರಲ್ಲಿ — ಇಲ್ಲ.
    tr: Samasye ḍrāyingnalli alla, ḍākyumenṭnalli. Krayapatra ide, i-khātā ide, sarve skech, sṭrakcharal sarṭiphikēṭ ide. Ādre aplōḍ āgirōdu ippatnālku-ippattaidara ṭyāks rasīdi, haḷē ōnar hesaralli. Ī varṣaddu, nimma hesaralli — illa.
    en: The problem isn't the drawing; it's the documents. Sale deed — there. E-khata — there. Survey sketch, structural certificate — there. But what's been uploaded is the 2024–25 tax receipt, in the old owner's name. This year's, in your name — isn't there.
  - who: ravi
    t: ಸಾರ್, ನಾನು ಏಪ್ರಿಲ್‌ನಲ್ಲೇ ಕಟ್ಟಿದೀನಿ, ಐದು ಪರ್ಸೆಂಟ್ ರಿಯಾಯಿತಿನೂ ಸಿಕ್ತು. ಫೋನ್‌ನಲ್ಲಿ ಪೇಮೆಂಟ್ ಮೆಸೇಜ್ ಇದೆ, ನೋಡಿ.
    tr: Sār, nānu Ēprilnallē kaṭṭidīni, aidu parsenṭ riyāyitinū siktu. Phōnnalli pēmenṭ mesēj ide, nōḍi.
    en: Sir, I paid it in April itself — I even got the five percent discount. The payment message is on my phone, look.
  - who: aee
    t: ನಾನು ನಂಬ್ತೀನಿ ರವಿ ಅವರೇ. ಆದ್ರೆ ಫೈಲ್ ನಂಬಲ್ಲ. ಸಿಸ್ಟಮ್‌ಗೆ ರಸೀದಿಯ ಪಿಡಿಎಫ್ ಬೇಕು, ಬ್ಯಾಂಕ್ ಎಸ್‌ಎಂಎಸ್ ಪ್ರೂಫ್ ಆಗಲ್ಲ. ಪ್ರಾಪರ್ಟಿ ಟ್ಯಾಕ್ಸ್ ಪೋರ್ಟಲ್‌ನಿಂದ ರಸೀದಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ, ಆರ್ಕಿಟೆಕ್ಟ್ ಲಾಗಿನ್‌ನಲ್ಲಿ ಮತ್ತೆ ಅಪ್ಲೋಡ್ ಮಾಡಿಸಿ.
    tr: Nānu nambtīni Ravi avarē. Ādre phail namballa. Sisṭamge rasīdiya pi-ḍi-eph bēku, byānk es-em-es prūph āgalla. Prāparṭi ṭyāks pōrṭalninda rasīdi ḍaunlōḍ māḍi, ārkiṭekṭ lāginnalli matte aplōḍ māḍisi.
    en: I believe you, Ravi. But the file doesn't. The system needs the receipt as a PDF; a bank SMS isn't proof. Download the receipt from the property-tax portal and have it uploaded again through the architect's login.
  - who: ravi
    t: ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ರಸೀದಿ ಡೌನ್‌ಲೋಡ್ ಆಗ್ತಿಲ್ಲ ಸಾರ್. ಮೂರು ವಾರದಿಂದ ‘ರಸೀದಿ ಜನರೇಟ್ ಆಗ್ತಿದೆ’ ಅಂತಾನೇ ತೋರಿಸ್ತಿದೆ.
    tr: Pōrṭalnalli rasīdi ḍaunlōḍ āgtilla sār. Mūru vāradinda ‘rasīdi janarēṭ āgtide’ antānē tōristide.
    en: The receipt won't download from the portal, sir. For three weeks it's just been saying ‘receipt being generated’.
  - who: aee
    t: ಹೌದು, ಈ ತೊಂದರೆ ಕೆಲವರಿಗೆ ಆಗ್ತಿದೆ. ಖಾತಾ ಟ್ರಾನ್ಸ್‌ಫರ್ ಆದ ಹೊಸ ಆಸ್ತಿಗಳಲ್ಲಿ ಪೇಮೆಂಟ್ ಲಿಂಕ್ ಆಗೋಕೆ ಟೈಮ್ ತಗೊಳ್ಳುತ್ತೆ. ಕೆಳಗಡೆ ರೆವಿನ್ಯೂ ಸೆಕ್ಷನ್‌ಗೆ ಹೋಗಿ, ಎಆರ್‌ಒ ಅವರ ಕೈಯಲ್ಲಿ ಮ್ಯಾನುಯಲ್ ಆಗಿ ಲಿಂಕ್ ಮಾಡಿಸ್ಕೊಳ್ಳಿ.
    tr: Haudu, ī tondare kelavarige āgtide. Khātā ṭrānsphar āda hosa āstigaḷalli pēmenṭ link āgōke ṭaim tagoḷḷutte. Keḷagaḍe revinyū sekṣange hōgi, e-ār-ō avara kaiyalli myānuyal āgi link māḍiskoḷḷi.
    en: Yes, some people are having this problem. For properties where the khata has just been transferred, the payment takes time to link. Go downstairs to the revenue section and get the ARO to link it manually.
  - who: ravi
    t: ಇವತ್ತೇ ಆಗುತ್ತಾ ಸಾರ್? ಆಫೀಸಿಂದ ಅರ್ಧ ದಿನ ರಜೆ ತಗೊಂಡು ಬಂದಿದೀನಿ.
    tr: Ivattē āguttā sār? Āphīsinda ardha dina raje tagonḍu bandidīni.
    en: Can it be done today, sir? I've taken half a day's leave from work to come.
  - who: aee
    t: ಇವತ್ತು ಎಆರ್‌ಒ ಅವರು ಮೀಟಿಂಗ್‌ಗೆ ಹೋಗಿದಾರೆ. ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಹತ್ತೂವರೆಗೆ ಬನ್ನಿ. ಬೇಜಾರ್ ಮಾಡ್ಕೋಬೇಡಿ — ನಿಮ್ಮ ಫೈಲ್‌ನಲ್ಲಿ ಉಳಿದಿದ್ದೆಲ್ಲಾ ಸರಿಯಾಗಿದೆ.
    tr: Ivattu e-ār-ō avaru mīṭiṅge hōgidāre. Nāḷe beḷigge hattūvarege banni. Bējār māḍkōbēḍi — nimma phailnalli uḷididdellā sariyāgide.
    en: The ARO has gone to a meeting today. Come tomorrow morning at ten-thirty. Don't be upset — everything else in your file is in order.
  - who: ravi
    t: ಸರಿ ಸಾರ್. ಇನ್ನೇನಾದ್ರೂ ಕಮ್ಮಿ ಇದ್ರೆ ಈಗಲೇ ಹೇಳಿಬಿಡಿ. ಮೂರನೇ ಸಲ ಬರೋ ಹಾಗಾಗಬಾರದು.
    tr: Sari sār. Innēnādrū kammi idre īgalē hēḷibiḍi. Mūranē sala barō hāgāgabāradu.
    en: All right, sir. If anything else is missing, please tell me now. I don't want to have to come a third time.
  - who: aee
    t: 'ಸರಿಯಾದ ಪ್ರಶ್ನೆ. ಇನ್ನೆರಡು ವಿಷಯ. ಒಂದು: ಸ್ಥಳ ಪರಿಶೀಲನೆ. ನಾವು ಸೈಟಿಗೆ ಬಂದು ಅಳತೆ, ರಸ್ತೆ ಅಗಲ, ಸೈಟಲ್ಲಿ ಈಗ ಏನಾದ್ರೂ ಕಟ್ಟಡ ಇದೆಯಾ — ಎಲ್ಲಾ ನೋಡ್ತೀವಿ, ಜಿಯೋ-ಟ್ಯಾಗ್ ಫೋಟೋ ತಗೊಳ್ತೀವಿ. ನೀವು ಅಥವಾ ನಿಮ್ಮ ಆರ್ಕಿಟೆಕ್ಟ್ ಅಲ್ಲಿರ್ಬೇಕು.'
    tr: 'Sariyāda prashne. Inneraḍu viṣaya. Ondu: sthaḷa parishīlane. Nāvu saiṭige bandu aḷate, raste agala, saiṭalli īga ēnādrū kaṭṭaḍa ideyā — ellā nōḍtīvi, jiyō-ṭyāg phōṭō tagoḷtīvi. Nīvu athavā nimma ārkiṭekṭ allirbēku.'
    en: 'Good question. Two more things. One: the site inspection. We come to the site and check the measurements, the road width, whether there''s any existing structure — everything — and take geo-tagged photos. You or your architect must be there.'
  - who: aee
    t: 'ಎರಡು: ಬೆಟರ್‌ಮೆಂಟ್ ಶುಲ್ಕ. ಲೇಔಟ್‌ಗೆ ಅದು ಕಟ್ಟಿಲ್ಲದಿದ್ರೆ ಪ್ಲಾನ್ ಟೈಮಲ್ಲಿ ಕಟ್ಟಿಸ್ಕೊಳ್ತೀವಿ. ನಿಮ್ಮದು ಎ-ಖಾತಾ — ಬೆಟರ್‌ಮೆಂಟ್ ಈಗಾಗಲೇ ಕಟ್ಟಿ ಆಗಿದೆ ಅಂತ ರೆಕಾರ್ಡ್ ತೋರಿಸ್ತಿದೆ. ಅದು ನಿಮಗೆ ಉಳಿತಾಯ.'
    tr: 'Eraḍu: beṭarmenṭ shulka. Lē-auṭge adu kaṭṭilladidre plān ṭaimalli kaṭṭiskoḷtīvi. Nimmadu e-khātā — beṭarmenṭ īgāgalē kaṭṭi āgide anta rekārḍ tōristide. Adu nimage uḷitāya.'
    en: 'Two: the betterment fee. If it hasn''t been paid for a layout, we collect it at the plan stage. Yours is an A-khata — the records show betterment has already been paid. That''s a saving for you.'
  - who: ravi
    t: ಅದು ಒಳ್ಳೆ ಸುದ್ದಿ. ಅಪ್ರೂವಲ್‌ಗೆ ಒಟ್ಟು ಎಷ್ಟು ದಿನ ಆಗುತ್ತೆ ಸಾರ್?
    tr: Adu oḷḷe suddi. Aprūvalge oṭṭu eṣṭu dina āgutte sār?
    en: That's good news. How long will the approval take altogether, sir?
  - who: aee
    t: ರೂಲ್ಸ್ ಪ್ರಕಾರ ಎಲ್ಲಾ ಸರಿ ಇದ್ರೆ ಮೂವತ್ತು ಕೆಲಸದ ದಿನದೊಳಗೆ ತೀರ್ಮಾನ ಆಗ್ಬೇಕು. ರಸೀದಿ ನಾಳೆ ಲಿಂಕ್ ಆದ್ರೆ, ಇನ್ಸ್‌ಪೆಕ್ಷನ್ ಮುಂದಿನ ವಾರ, ಆಮೇಲೆ ಡಿಮ್ಯಾಂಡ್ ನೋಟಿಸ್. ಫೀ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಕಟ್ಟಿದ ಮೇಲೆ ಸ್ಯಾಂಕ್ಷನ್ ಪ್ಲಾನ್ ನೀವೇ ಡೌನ್‌ಲೋಡ್ ಮಾಡ್ಕೋಬಹುದು.
    tr: Rūls prakāra ellā sari idre mūvattu kelasada dinadoḷage tīrmāna āgbēku. Rasīdi nāḷe link ādre, inspekṣan mundina vāra, āmēle ḍimyānḍ nōṭis. Phī ānlainnalli kaṭṭida mēle syānkṣan plān nīvē ḍaunlōḍ māḍkōbahudu.
    en: Under the rules, if everything is in order, a decision should come within thirty working days. If the receipt gets linked tomorrow, the inspection is next week, then the demand notice. Once you pay the fee online, you can download the sanctioned plan yourself.
  - who: aee
    t: ಪ್ರತಿ ಹಂತ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಟ್ರ್ಯಾಕ್ ಮಾಡಬಹುದು — ಫೈಲ್ ಈಗ ಯಾರ ಟೇಬಲ್ ಮೇಲಿದೆ ಅಂತಾನೂ ತೋರಿಸುತ್ತೆ. ಹಿಂದೆ ಹಾಗಿರ್ಲಿಲ್ಲ.
    tr: Prati hanta ānlainnalli ṭryāk māḍabahudu — phail īga yāra ṭēbal mēlide antānū tōrisutte. Hinde hāgirlilla.
    en: You can track every stage online — it even shows whose desk the file is on right now. It wasn't like that before.
  - section: 🔁 The second visit and the inspection
    learn: 'reporting done tasks: māḍkoṭru · warnings: ondu aḍinū munde barabāradu · -ida mēle, -idāga (when)'
  - scene: Next morning. The ARO arrives at noon, not ten-thirty — but links the receipt in ten minutes. By one o'clock Ravi is back upstairs in Sathish's cabin.
  - who: ravi
    t: ಸಾರ್, ರಸೀದಿ ಲಿಂಕ್ ಆಯ್ತು. ಎಆರ್‌ಒ ಅವರು ಹನ್ನೆರಡು ಗಂಟೆಗೆ ಬಂದ್ರು, ಆದ್ರೆ ಹತ್ತೇ ನಿಮಿಷದಲ್ಲಿ ಮಾಡ್ಕೊಟ್ರು. ಪಲ್ಲವಿ ಮೇಡಂ ಈಗಷ್ಟೇ ಅಪ್ಲೋಡ್ ಮಾಡಿದ್ರು.
    tr: Sār, rasīdi link āytu. E-ār-ō avaru hanneraḍu gaṇṭege bandru, ādre hattē nimiṣadalli māḍkoṭru. Pallavi mēḍam īgaṣṭē aplōḍ māḍidru.
    en: Sir, the receipt is linked. The ARO came at twelve, but he did it for me in just ten minutes. Pallavi ma'am has just uploaded it.
  - who: aee
    t: ಹೌದು, ಇಲ್ಲಿ ಕಾಣ್ತಿದೆ. ಶಾರ್ಟ್‌ಫಾಲ್ ಕ್ಲಿಯರ್. ಹಿಂಬರಹದಲ್ಲಿ ‘ದಾಖಲೆಗಳು ಸರಿಯಾಗಿವೆ’ ಅಂತ ಬರೆದು ಮುಂದೆ ಕಳಿಸ್ತೀನಿ. ಗುರುವಾರ ಬೆಳಿಗ್ಗೆ ಹನ್ನೊಂದಕ್ಕೆ ಇನ್ಸ್‌ಪೆಕ್ಷನ್.
    tr: Haudu, illi kāṇtide. Shārṭphāl kliyar. Hinbarahadalli ‘dākhalegaḷu sariyāgive’ anta baredu munde kaḷistīni. Guruvāra beḷigge hannondakke inspekṣan.
    en: Yes, I can see it here. Shortfall cleared. I'll note ‘documents in order’ in my endorsement and send it forward. Inspection on Thursday at eleven in the morning.
  - scene: Thursday, at the site near Kengeri. Ravi and Pallavi wait beside the empty plot. Sathish arrives on time with a measuring tape and a tablet.
  - who: aee
    t: ಮುಂದೆ ಮೂವತ್ತು, ಹಿಂದೆ ಮೂವತ್ತು, ಉದ್ದ ನಲವತ್ತು. ಸರಿ. ರಸ್ತೆ ಒಂಬತ್ತು ಮೀಟರ್ — ಮೂವತ್ತು ಅಡಿ. ಸೈಟು ಖಾಲಿ, ಯಾವ ಕಟ್ಟಡಾನೂ ಇಲ್ಲ. ಆದ್ರೆ ಆ ಮೂಲೆಯಲ್ಲಿ ಫುಟ್‌ಪಾತ್ ಮೇಲೆ ಒಂದು ಹೊಂಗೆ ಮರ ಇದೆ.
    tr: Munde mūvattu, hinde mūvattu, udda nalavattu. Sari. Raste ombattu mīṭar — mūvattu aḍi. Saiṭu khāli, yāva kaṭṭaḍānū illa. Ādre ā mūleyalli phuṭpāt mēle ondu honge mara ide.
    en: Thirty in front, thirty at the back, forty deep. Correct. Road nine metres — thirty feet. The site is empty, no structure at all. But there's a honge tree on the footpath in that corner.
  - who: architect
    t: ಹೌದು ಸಾರ್, ಪ್ಲಾನ್‌ನಲ್ಲಿ ತೋರಿಸಿದೀನಿ. ಗೇಟ್ ಅದರಿಂದ ದೂರ, ಈಶಾನ್ಯದ ಕಡೆ ಇಟ್ಟಿದೀನಿ. ಮರ ಕಡಿಯೋ ಪ್ರಶ್ನೆನೇ ಇಲ್ಲ.
    tr: Haudu sār, plānnalli tōrisidīni. Gēṭ adarinda dūra, īshānyada kaḍe iṭṭidīni. Mara kaḍiyō prashnenē illa.
    en: Yes sir, I've shown it on the plan. I've placed the gate away from it, towards the north-east. There's no question of cutting the tree.
  - who: aee
    t: ಒಳ್ಳೇದು. ಮರ ಕಡಿಯೋಕೆ ಬೇರೆ ಅನುಮತಿ ಬೇಕು, ಸುಲಭವಾಗಿ ಸಿಗಲ್ಲ. ಮಳೆನೀರಿನ ಇಂಗುಗುಂಡಿ ಇಲ್ಲಿ ಬರುತ್ತೆ ಅಲ್ವಾ? ಸರಿ.
    tr: Oḷḷēdu. Mara kaḍiyōke bēre anumati bēku, sulabhavāgi sigalla. Maḷenīrina iṅguguṇḍi illi barutte alvā? Sari.
    en: Good. Cutting a tree needs a separate permission, and it isn't easily given. The rainwater recharge pit comes here, doesn't it? Fine.
  - who: aee
    t: ರವಿ ಅವರೇ, ಒಂದು ಮಾತು ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ. ಸ್ಯಾಂಕ್ಷನ್ ಆದ ಮೇಲೆ ಪ್ಲಾನ್ ಪ್ರಕಾರವೇ ಕಟ್ಟಿಸಿ. ಸೆಟ್‌ಬ್ಯಾಕ್‌ನಲ್ಲಿ ಒಂದು ಅಡಿನೂ ಮುಂದೆ ಬರಬಾರದು. ಪ್ಲಿಂತ್ ಹಂತ ತಲುಪಿದಾಗ ನಮಗೆ ತಿಳಿಸ್ಬೇಕು — ನಾವು ಬಂದು ನೋಡ್ತೀವಿ.
    tr: Ravi avarē, ondu mātu nēravāgi hēḷtīni. Syānkṣan āda mēle plān prakāravē kaṭṭisi. Seṭbyāknalli ondu aḍinū munde barabāradu. Plinth hanta talupidāga namage tiḷisbēku — nāvu bandu nōḍtīvi.
    en: Ravi, let me tell you something plainly. Once it's sanctioned, have it built exactly as per the plan. Not a single foot into the setback. When you reach plinth level you must inform us — we'll come and check.
  - who: aee
    t: ಈ ಏರಿಯಾದಲ್ಲಿ ತುಂಬಾ ಜನ ಡೀವಿಯೇಷನ್ ಮಾಡಿ, ಈಗ ಓಸಿ ಇಲ್ಲದೆ, ಕರೆಂಟ್ ಕನೆಕ್ಷನ್ ಇಲ್ಲದೆ ಒದ್ದಾಡ್ತಿದಾರೆ. ಸಾವಿರದ ಇನ್ನೂರು ಅಡಿ ಸೈಟುಗಳಿಗೆ ಸರ್ಕಾರ ಏನಾದ್ರೂ ರಿಲೀಫ್ ಕೊಡುತ್ತೆ ಅಂತ ಮಾತಿದೆ. ಆದ್ರೆ ಇನ್ನೂ ಏನೂ ಸ್ಪಷ್ಟ ಆಗಿಲ್ಲ.
    tr: Ī ēriyādalli tumbā jana ḍīviyēṣan māḍi, īga ō-si illade, karenṭ kanekṣan illade oddāḍtidāre. Sāvirada innūru aḍi saiṭugaḷige sarkāra ēnādrū rilīph koḍutte anta mātide. Ādre innū ēnū spaṣṭa āgilla.
    en: In this area lots of people built deviations, and now they're struggling with no OC and no power connection. There's talk that the government may give some relief for twelve-hundred-square-foot sites. But nothing is clear yet.
  - who: ravi
    t: ಅರ್ಥ ಆಯ್ತು ಸಾರ್. ಪ್ಲಾನ್‌ನಲ್ಲಿ ಏನಿದೆಯೋ ಅದೇ ಸೈಟಲ್ಲಿ ಇರುತ್ತೆ. ನಿಮ್ಮ ಸಹಾಯಕ್ಕೆ ಧನ್ಯವಾದ.
    tr: Artha āytu sār. Plānnalli ēnideyō adē saiṭalli irutte. Nimma sahāyakke dhanyavāda.
    en: Understood, sir. Whatever is on the plan is what will be on the site. Thank you for your help.
  - who: aee
    t: ಸಹಾಯ ಏನಿಲ್ಲ, ನನ್ನ ಕೆಲಸ ಮಾಡಿದೀನಿ. ನಿಮ್ಮ ಆರ್ಕಿಟೆಕ್ಟ್ ಡ್ರಾಯಿಂಗ್ ಸರಿಯಾಗಿ ಮಾಡಿದ್ರು, ನೀವು ಡಾಕ್ಯುಮೆಂಟ್ ಸರಿಯಾಗಿ ಇಟ್ಕೊಂಡಿದ್ರಿ. ಎಲ್ರೂ ಹೀಗಿದ್ರೆ ನಮ್ಮ ಕೆಲಸಾನೂ ಸುಲಭ ಆಗುತ್ತೆ.
    tr: Sahāya ēnilla, nanna kelasa māḍidīni. Nimma ārkiṭekṭ ḍrāying sariyāgi māḍidru, nīvu ḍākyumenṭ sariyāgi iṭkonḍidri. Elrū hīgidre namma kelasānū sulabha āgutte.
    en: It's not help — I've done my job. Your architect drew it properly, and you kept your documents in order. If everyone were like this, our work would be easier too.
  - section: ✅ The plan is sanctioned
    learn: 'mañjūrāti · ‘within the estimate’: lekkadoḷagē · looking ahead: mundina sṭāp'
  - scene: Mid-June 2025. Evening at the flat. Ravi's laptop is open on the dining table and the whole family crowds around the screen.
  - who: ravi
    t: ಬಂತು! ಡಿಮ್ಯಾಂಡ್ ನೋಟಿಸ್‌ನ ಫೀ — ಒಂದು ಲಕ್ಷದ ಹದಿನೆಂಟು ಸಾವಿರ — ನಿನ್ನೆ ಕಟ್ಟಿದ್ದೆ. ಈಗ ಸ್ಯಾಂಕ್ಷನ್ಡ್ ಪ್ಲಾನ್ ಡೌನ್‌ಲೋಡ್ ಆಯ್ತು. ನೋಡಿ — ಕೆಳಗೆ ಡಿಜಿಟಲ್ ಸಹಿ, ಕ್ಯೂಆರ್ ಕೋಡ್, ಮಂಜೂರಾತಿ ನಂಬರ್.
    tr: Bantu! Ḍimyānḍ nōṭisna phī — ondu lakṣada hadineṇṭu sāvira — ninne kaṭṭidde. Īga syānkṣanḍ plān ḍaunlōḍ āytu. Nōḍi — keḷage ḍijiṭal sahi, kyū-ār kōḍ, mañjūrāti nambar.
    en: It's here! I paid the demand-notice fee — one lakh eighteen thousand — yesterday. Now the sanctioned plan has downloaded. Look — at the bottom, the digital signature, the QR code, the sanction number.
  - who: deepa
    t: ಪಲ್ಲವಿ ಒಂದರಿಂದ ಒಂದೂವರೆ ಅಂದಿದ್ರು. ಬಂದಿದ್ದು ಒಂದು-ಹದಿನೆಂಟು. ಲೆಕ್ಕದೊಳಗೇ ಇದೆ — ಈ ಇಡೀ ಪ್ರಯಾಣದಲ್ಲಿ ಮೊದಲ ಸಲ!
    tr: Pallavi ondarinda ondūvare andidru. Bandiddu ondu-hadineṇṭu. Lekkadoḷagē ide — ī iḍī prayāṇadalli modala sala!
    en: Pallavi said one to one and a half. It came to one-eighteen. Within the estimate — for the first time on this whole journey!
  - who: amma
    t: ಅಂದ್ರೆ ಈಗ ಭೂಮಿ ಪೂಜೆ ಮಾಡ್ಬೋದಾ? ಶಾಸ್ತ್ರಿಗಳ ಹತ್ರ ಮುಹೂರ್ತ ಕೇಳ್ತೀನಿ.
    tr: Andre īga bhūmi pūje māḍbōdā? Shāstrigaḷa hatra muhūrta kēḷtīni.
    en: So can we do the bhoomi puja now? I'll ask Shastri-ji for an auspicious time.
  - who: ravi
    t: ಮಾಡ್ಬೋದು ಅಮ್ಮ. ಆದ್ರೆ ಕೆಲಸ ಶುರು ಮಾಡೋಕೆ ಮುಂಚೆ ಕರೆಂಟ್ ಬೇಕು — ಟೆಂಪರರಿ ಕನೆಕ್ಷನ್. ಮುಂದಿನ ಸ್ಟಾಪ್ ಬೆಸ್ಕಾಂ.
    tr: Māḍbōdu amma. Ādre kelasa shuru māḍōke muñche karenṭ bēku — ṭemparari kanekṣan. Mundina sṭāp Beskām.
    en: 'We can, Amma. But before work starts we need electricity — a temporary connection. Next stop: BESCOM.'
  - who: appa
    t: ಪಾಲಿಕೆ ಆಯ್ತು, ಈಗ ಬೆಸ್ಕಾಂ, ಆಮೇಲೆ ನೀರು. ನನ್ನ ಹಳೇ ಬಸ್ ರೂಟ್‌ಗಿಂತ ಜಾಸ್ತಿ ಸ್ಟಾಪ್ ಇವೆ ಈ ದಾರಿಯಲ್ಲಿ.
    tr: Pālike āytu, īga Beskām, āmēle nīru. Nanna haḷē bas rūṭginta jāsti sṭāp ive ī dāriyalli.
    en: The corporation's done, now BESCOM, then water. This road has more stops than my old bus route.
  - who: ravi
    t: ಇರ್ಲಿ ಅಪ್ಪ. ದಾರಿ ಉದ್ದ ಆದ್ರೂ, ಸರಿಯಾದ ದಾರಿ.
    tr: Irli appa. Dāri udda ādrū, sariyāda dāri.
    en: Let it, Appa. The road may be long, but it's the right road.
