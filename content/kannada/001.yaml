# Kannada — Lesson 1 (one continuous story, A1 → B2)
lang: kannada
num: 1
level: A1 → B2 · ~1 hour
title:
  t: ಹೊಸ ಮನೆ
  tr: Hosa mane
  en: The new home
intro: 'Sam, 28, from Switzerland, has a new IT job in Bengaluru and takes a room as a **paying guest (PG)** with the Rao family in Jayanagar: Appa, Amma, Ajji, their son Kiran and their daughter Shwetha. This is Sam''s first weekend in the house, from Friday evening to Sunday night: food, family, the market, work life, neighbours, an arranged-marriage visit and a fight about dowry. The talk starts very simple and grows into full-speed native conversation.'
