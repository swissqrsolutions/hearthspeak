# Kannada — Episode 1 of the "Mane" (Home) story
lang: kannada
num: 1
level: "A1 → B2 · ~1 hour"
title:
  t: ಹೊಸ ಮನೆ
  tr: Hosa mane
  en: The new home
intro: >
  Sam, 28, from Switzerland, has a new IT job in Bengaluru. Instead of a lonely flat, Sam takes a room
  as a **paying guest (PG)** with the Rao family in Jayanagar. It's a busy house: Appa, Amma, Ajji,
  their son Kiran and their daughter Shwetha. Tonight is Sam's first evening there.

# voice = edge-tts voice; pitch/rate shape each character
speakers:
  sam:   { name: Sam,                 voice: kn-IN-GaganNeural, pitch: "+0Hz",  rate: "-5%" }
  appa:  { name: Appa · Ramesh,       voice: kn-IN-GaganNeural, pitch: "-14Hz", rate: "-8%" }
  amma:  { name: Amma · Lakshmi,      voice: kn-IN-SapnaNeural, pitch: "-6Hz",  rate: "-5%" }
  shwe:  { name: Shwetha,             voice: kn-IN-SapnaNeural, pitch: "+4Hz",  rate: "+0%" }
  kiran: { name: Kiran,               voice: kn-IN-GaganNeural, pitch: "+10Hz", rate: "+8%" }
  ajji:  { name: Ajji,                voice: kn-IN-SapnaNeural, pitch: "-20Hz", rate: "-18%" }

lines:
  - scene: At the gate of the Rao house, 7 p.m. Sam rings the bell.
  - { who: sam,  t: "ನಮಸ್ಕಾರ! ನಾನು ಸ್ಯಾಮ್. ಪಿಜಿ ರೂಮ್ ಬಗ್ಗೆ ಫೋನ್ ಮಾಡಿದ್ದೆ.", tr: "Namaskāra! Nānu Sām. PG room bagge phōn māḍidde.", en: "Hello! I'm Sam. I called about the PG room." }
  - { who: appa, t: "ಓ, ಬನ್ನಿ ಬನ್ನಿ! ನಾನು ರಮೇಶ್. ಒಳಗೆ ಬನ್ನಿ.", tr: "Ō, banni banni! Nānu Ramēsh. Oḷage banni.", en: "Oh, come, come! I'm Ramesh. Please come in." }
  - { who: appa, t: "ಶೂ ಇಲ್ಲೇ ಬಿಡಿ.", tr: "Shū illē biḍi.", en: "Leave your shoes right here." }
  - { who: sam,  t: "ಓ, ಸಾರಿ! ಸರಿ, ಸರಿ.", tr: "Ō, sāri! Sari, sari.", en: "Oh, sorry! Okay, okay." }
  - { who: appa, t: "ಲಕ್ಷ್ಮೀ! ಹುಡುಗ ಬಂದ, ನೋಡು!", tr: "Lakshmī! Huḍuga banda, nōḍu!", en: "Lakshmi! The boy is here, come and see!" }

  - scene: The living room. A ceiling fan, a TV playing the news, jasmine in a steel vase.
  - { who: amma, t: "ಬನ್ನಿ, ಕೂತ್ಕೊಳ್ಳಿ. ಕಾಫಿ ಕುಡೀತೀರಾ?", tr: "Banni, kūtkoḷḷi. Kāfi kuḍītīrā?", en: "Come, sit down. Will you have some coffee?" }
  - { who: sam,  t: "ಹೂಂ, ಸ್ವಲ್ಪ. ಥ್ಯಾಂಕ್ಸ್.", tr: "Hūṃ, swalpa. Thanks.", en: "Yes, a little. Thanks." }
  - { who: amma, t: "ಸಕ್ಕರೆ ಎಷ್ಟು?", tr: "Sakkare eṣṭu?", en: "How much sugar?" }
  - { who: sam,  t: "ಕಮ್ಮಿ, ಪ್ಲೀಸ್.", tr: "Kammi, please.", en: "Not much, please." }
  - { who: amma, t: "ಸರಿ. ನೀವು ಎಲ್ಲಿಂದ ಬಂದಿದೀರಾ?", tr: "Sari. Nīvu ellinda bandidīrā?", en: "Okay. Where have you come from?" }
  - { who: sam,  t: "ಸ್ವಿಟ್ಜರ್ಲ್ಯಾಂಡಿಂದ. ಇಲ್ಲಿ ಒಂದು ಐಟಿ ಕಂಪನೀಲಿ ಕೆಲಸ.", tr: "Switzerland-inda. Illi ondu IT kampanīli kelsa.", en: "From Switzerland. I work at an IT company here." }
  - { who: appa, t: "ಓಹೋ, ಸ್ವಿಟ್ಜರ್ಲ್ಯಾಂಡ್! ಚಾಕಲೇಟ್ ದೇಶ!", tr: "Ōhō, Switzerland! Chocolate dēsha!", en: "Oho, Switzerland! The land of chocolate!" }

  - scene: The door bangs open. Kiran, 19, walks in, sweaty, carrying a cricket bat.
  - { who: kiran, t: "ಅಪ್ಪಾ, ನನ್ ಬ್ಯಾಟ್ ಗ್ರಿಪ್ ಎಲ್ಲಿ? … ಓ, ಹಾಯ್!", tr: "Appā, nan bat grip elli? … Ō, hāy!", en: "Dad, where's my bat grip? … Oh, hi!" }
  - { who: appa, t: "ಇವನು ನನ್ ಮಗ, ಕಿರಣ್. ಕಾಲೇಜಲ್ಲಿ ಓದ್ತಿದಾನೆ… ಅಂದ್ರೆ, ಕ್ರಿಕೆಟ್ ಆಡ್ತಿದಾನೆ.", tr: "Ivanu nan maga, Kiraṇ. Kālējalli ōdtidāne… andre, krikeṭ āḍtidāne.", en: "This is my son, Kiran. He's studying in college… I mean, he's playing cricket." }
  - { who: kiran, t: "ಅಪ್ಪಾ! … ಹಾಯ್ ಬ್ರೋ. ನೀವು ಆರ್‌ಸಿಬಿ ಫ್ಯಾನಾ?", tr: "Appā! … Hāy bro. Nīvu RCB fan-ā?", en: "Dad! … Hi bro. Are you an RCB fan?" }
  - { who: sam,  t: "ಆರ್‌ಸಿಬಿ ಅಂದ್ರೆ ಏನು?", tr: "RCB andre ēnu?", en: "What's RCB?" }
  - { who: kiran, t: "ಅಯ್ಯೋ! ಬ್ರೋ, ಇವತ್ತೇ ನಿಮಗೆ ಆರ್‌ಸಿಬಿ ಕ್ಲಾಸ್!", tr: "Ayyō! Bro, ivattē nimge RCB klās!", en: "Ayyo! Bro, you're getting an RCB lesson tonight!" }

  - scene: Shwetha, 26, comes home from work with a laptop bag and her office ID card still round her neck.
  - { who: shwe, t: "ಅಮ್ಮಾ, ನಾನು ಬಂದೆ! ತುಂಬಾ ಟ್ರಾಫಿಕ್ ಇತ್ತು.", tr: "Ammā, nānu bande! Tumbā ṭrāfik ittu.", en: "Mum, I'm home! The traffic was terrible." }
  - { who: amma, t: "ಇವಳು ಶ್ವೇತಾ, ನನ್ ಮಗಳು. ಇವಳೂ ಐಟಿ.", tr: "Ivaḷu Shwētā, nan magaḷu. Ivaḷū IT.", en: "This is Shwetha, my daughter. She's in IT too." }
  - { who: shwe, t: "ಹಾಯ್! ನೀವೇನಾ ಹೊಸ ಪಿಜಿ?", tr: "Hāy! Nīvēnā hosa PG?", en: "Hi! So you're the new PG?" }
  - { who: sam,  t: "ಹೌದು. ನಾನು ಸ್ಯಾಮ್. ಕನ್ನಡ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಕಲೀತಾ ಇದೀನಿ.", tr: "Haudu. Nānu Sām. Kannaḍa swalpa swalpa kalītā idīni.", en: "Yes. I'm Sam. I'm learning Kannada, little by little." }
  - { who: shwe, t: "ವಾವ್, ಸೂಪರ್! ಬೆಂಗಳೂರಲ್ಲಿ ಎಲ್ರೂ ಇಂಗ್ಲಿಷ್ ಮಾತಾಡ್ತಾರೆ. ನೀವು ನೋಡಿದ್ರೆ ಕನ್ನಡ ಕಲೀತಿದೀರಿ!", tr: "Vāv, sūpar! Bengaḷūralli ellrū English mātāḍtāre. Nīvu nōḍidre Kannaḍa kalītidīri!", en: "Wow, great! Everyone in Bengaluru speaks English. And look at you, learning Kannada!" }

  - scene: A slow voice comes from the back room. Ajji, 78, appears, leaning on the door frame.
  - { who: ajji, t: "ಯಾರೋ ಅದು? ಏನು ಗಲಾಟೆ?", tr: "Yārō adu? Ēnu galāṭe?", en: "Who's that? What's all this noise?" }
  - { who: shwe, t: "ಅಜ್ಜಿ, ಹೊಸ ಪಿಜಿ ಬಂದಿದಾರೆ. ಸ್ವಿಟ್ಜರ್ಲ್ಯಾಂಡಿಂದ!", tr: "Ajji, hosa PG bandidāre. Switzerland-inda!", en: "Ajji, the new PG has arrived. From Switzerland!" }
  - { who: sam,  t: "ನಮಸ್ಕಾರ, ಅಜ್ಜಿ.", tr: "Namaskāra, Ajji.", en: "Hello, Ajji." }
  - { who: ajji, t: "ಚೆನ್ನಾಗಿರಪ್ಪ. ಊಟ ಆಯ್ತಾ?", tr: "Chennāgirappa. Ūṭa āytā?", en: "Bless you, dear. Have you eaten?" }
  - { who: sam,  t: "ಇಲ್ಲ, ಇನ್ನೂ ಇಲ್ಲ.", tr: "Illa, innū illa.", en: "No, not yet." }
  - { who: ajji, t: "ಅಯ್ಯೋ! ಲಕ್ಷ್ಮೀ, ಇವನಿಗೆ ಊಟ ಹಾಕು!", tr: "Ayyō! Lakshmī, ivanige ūṭa hāku!", en: "Oh dear! Lakshmi, give the boy some food!" }
  - { who: ajji, t: "ನಿನಗೆ ಮದುವೆ ಆಗಿದ್ಯಾ?", tr: "Ninge maduve āgidyā?", en: "Are you married?" }
  - { who: sam,  t: "ಇಲ್ಲ, ಅಜ್ಜಿ.", tr: "Illa, Ajji.", en: "No, Ajji." }
  - { who: ajji, t: "ಎಷ್ಟು ವಯಸ್ಸು?", tr: "Eṣṭu vayassu?", en: "How old are you?" }
  - { who: sam,  t: "ಇಪ್ಪತ್ತೆಂಟು.", tr: "Ippattenṭu.", en: "Twenty-eight." }
  - { who: ajji, t: "ಇಪ್ಪತ್ತೆಂಟು, ಇನ್ನೂ ಮದುವೆ ಇಲ್ಲ! ಇಲ್ಲೂ ನೋಡು, ನಮ್ ಶ್ವೇತಾಗೂ ಇಪ್ಪತ್ತಾರು ಆಯ್ತು…", tr: "Ippattenṭu, innū maduve illa! Illū nōḍu, nam Shwētāgū ippattāru āytu…", en: "Twenty-eight and still not married! And look here, our Shwetha has turned twenty-six too…" }
  - { who: shwe, t: "ಅಜ್ಜೀ! ಮತ್ತೆ ಶುರು ಮಾಡ್ಬೇಡ!", tr: "Ajjī! Matte shuru māḍbēḍa!", en: "Ajji! Don't start that again!" }
  - { who: kiran, t: "ಶುರು ಆಯ್ತು… ಮದುವೆ ಎಪಿಸೋಡ್!", tr: "Shuru āytu… maduve episode!", en: "Here we go… the marriage episode!" }

  - scene: Dinner. Everyone sits at the dining table. Amma serves from steel vessels.
  - { who: amma, t: "ಬನ್ನಿ, ಊಟಕ್ಕೆ. ಇವತ್ತು ಬಿಸಿಬೇಳೆಬಾತ್.", tr: "Banni, ūṭakke. Ivattu bisibēḷebāt.", en: "Come and eat. Tonight it's bisibele bath." }
  - { who: sam,  t: "ಬಿಸಿ… ಏನು?", tr: "Bisi… ēnu?", en: "Bisi… what?" }
  - { who: kiran, t: "ಬಿಸಿಬೇಳೆಬಾತ್! ಕರ್ನಾಟಕದ ಸ್ಪೆಷಲ್. ಸ್ವಲ್ಪ ಖಾರ, ಹುಷಾರು!", tr: "Bisibēḷebāt! Karnāṭakada special. Swalpa khāra, huṣāru!", en: "Bisibele bath! A Karnataka special. It's a bit spicy, careful!" }
  - { who: sam,  t: "ಆಹ್… ಖಾರ! ಆದ್ರೆ ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ!", tr: "Āh… khāra! Ādre tumbā chennāgide!", en: "Ah… spicy! But it's really good!" }
  - { who: amma, t: "ಇನ್ನೂ ಸ್ವಲ್ಪ ಹಾಕ್ಲಾ?", tr: "Innū swalpa hāklā?", en: "Shall I give you a bit more?" }
  - { who: sam,  t: "ಸಾಕು, ಸಾಕು! ಹೊಟ್ಟೆ ತುಂಬಿತು.", tr: "Sāku, sāku! Hoṭṭe tumbitu.", en: "Enough, enough! I'm full." }
  - { who: amma, t: "ಅಯ್ಯೋ, ಏನೂ ತಿಂದೇ ಇಲ್ಲ! ಸ್ವಲ್ಪ ಮೊಸರನ್ನ ಆದ್ರೂ ತಗೊಳ್ಳಿ.", tr: "Ayyō, ēnū tindē illa! Swalpa mosaranna ādrū tagoḷḷi.", en: "Ayyo, you've hardly eaten! At least have a little curd rice." }
  - { who: appa, t: "ಸ್ಯಾಮ್, ಇದು ಕರ್ನಾಟಕ. ಇಲ್ಲಿ ‘ಸಾಕು’ ಅಂದ್ರೆ ‘ಇನ್ನೂ ಸ್ವಲ್ಪ’!", tr: "Sām, idu Karnāṭaka. Illi ‘sāku’ andre ‘innū swalpa’!", en: "Sam, this is Karnataka. Here ‘enough’ means ‘a little more’!" }

  - scene: Later. Sam is in his room, but the walls are thin. In the hall, Amma talks to Shwetha.
  - { who: amma, t: "ಶ್ವೇತಾ, ಭಾನುವಾರ ಹುಡುಗನ ಮನೆಯವರು ಬರ್ತಾರೆ.", tr: "Shwētā, Bhānuvāra huḍugana maneyavaru bartāre.", en: "Shwetha, the boy's family is coming on Sunday." }
  - { who: shwe, t: "ಅಮ್ಮಾ, ನಾನು ಈಗ ಮದುವೆ ಆಗಲ್ಲ!", tr: "Ammā, nānu īga maduve āgalla!", en: "Mum, I'm not getting married now!" }
  - { who: amma, t: "ಬರೀ ನೋಡು, ಅಷ್ಟೇ. ಒಳ್ಳೆ ಫ್ಯಾಮಿಲಿ. ಹುಡುಗ ಅಮೆರಿಕಾದಲ್ಲಿ ಇದಾನೆ.", tr: "Barī nōḍu, aṣṭē. Oḷḷe family. Huḍuga Amerikādalli idāne.", en: "Just meet him, that's all. Good family. The boy lives in America." }
  - { who: shwe, t: "ಅಮೆರಿಕ… ಅವ್ರು ಏನೇನು ಕೇಳ್ತಾರೋ, ಯಾರಿಗೆ ಗೊತ್ತು.", tr: "Amerika… avru ēnēnu kēḷtārō, yārige gottu.", en: "America… who knows what all they'll ask for." }
  - { who: ajji, t: "ಅದೇ ನನ್ ಭಯ, ಮಗೂ.", tr: "Adē nan bhaya, magū.", en: "That's exactly what I'm afraid of, child." }
  - { who: sam,  t: "‘ಏನೇನು ಕೇಳ್ತಾರೆ’? … ನನಗೆ ಗೊತ್ತಿಲ್ಲ.", tr: "‘Ēnēnu kēḷtāre’? … Nange gottilla.", en: "‘What will they ask for’? … I don't understand." }

  - scene: Kiran knocks on Sam's door on his way to bed.
  - { who: kiran, t: "ಗುಡ್ ನೈಟ್ ಬ್ರೋ! ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಐದೂವರೆಗೆ ಹಾಲಿನವನು ಬರ್ತಾನೆ. ಬೆಲ್ ಜೋರಾಗಿ ಹೊಡೀತಾನೆ!", tr: "Good night bro! Nāḷe beḷigge aidūvarege hālinavanu bartāne. Bell jōrāgi hoḍītāne!", en: "Good night bro! Tomorrow at half past five the milkman comes. He rings the bell really loudly!" }
  - { who: sam,  t: "ಐದೂವರೆ?! ಅಯ್ಯೋ!", tr: "Aidūvare?! Ayyō!", en: "Half past five?! Ayyo!" }

