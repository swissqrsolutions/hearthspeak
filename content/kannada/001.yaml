# Kannada — Lesson 1
lang: kannada
num: 1
level: A1 · Stage 1 (Survival)
title:
  t: ಹೊಸ ನೇಬರ್
  tr: Hosa neighbour
  en: The new neighbour
scene: >
  Sam, who is from Switzerland, has just moved into a flat in Jayanagar, Bengaluru.
  On the stairs Sam meets the neighbour, Shwetha. Her grandmother, Ajji, is
  listening from the doorway with a steel tumbler of coffee in her hand…

speakers:
  sam:  { name: Sam,     voice: male }
  shwe: { name: Shwetha, voice: female }

# You play Sam in the role-play.
you: sam

lines:
  - who: sam
    t: ನಮಸ್ಕಾರ! ನಾನು ಸ್ಯಾಮ್. ಹೊಸ ನೇಬರ್.
    tr: Namaskāra! Nānu Sām. Hosa neighbour.
    lit: Greetings! I Sam. New neighbour.
    en: Hello! I'm Sam, the new neighbour.
  - who: shwe
    t: ಓ, ನಮಸ್ಕಾರ! ನನ್ ಹೆಸ್ರು ಶ್ವೇತಾ. ನೀವು ಎಲ್ಲಿಂದ?
    tr: Ō, namaskāra! Nan hesru Shwētā. Nīvu ellinda?
    lit: Oh, greetings! My name Shwetha. You where-from?
    en: Oh, hello! My name's Shwetha. Where are you from?
  - who: sam
    t: ಸ್ವಿಟ್ಜರ್ಲ್ಯಾಂಡಿಂದ.
    tr: Switzerland-inda.
    lit: Switzerland-from.
    en: From Switzerland.
  - who: shwe
    t: ಅಯ್ಯೋ, ಅಷ್ಟು ದೂರದಿಂದ! ಕನ್ನಡ ಗೊತ್ತಾ?
    tr: Ayyō, aṣṭu dūradinda! Kannaḍa gottā?
    lit: Ayyo, that-much far-from! Kannada known-?
    en: Wow, from so far away! Do you know Kannada?
  - who: sam
    t: ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ. ಕಲೀತಾ ಇದೀನಿ.
    tr: Swalpa swalpa. Kalītā idīni.
    lit: Little little. Learning I-am.
    en: A little bit. I'm learning.
  - who: shwe
    t: ಸೂಪರ್! ಬನ್ನಿ, ಕಾಫಿ ಕುಡೀರಿ.
    tr: Sūpar! Banni, kāfi kuḍīri.
    lit: Super! Come (polite), coffee drink (polite).
    en: Great! Come in, have some coffee.
  - who: sam
    t: ಓಕೆ, ಥ್ಯಾಂಕ್ಸ್!
    tr: Ōke, thanks!
    lit: OK, thanks!
    en: OK, thanks!

notes:
  - ref: 1
    md: >
      **ನಮಸ್ಕಾರ namaskāra** is the all-purpose respectful *hello*, usually said with
      palms together. Stretch the long vowels: na-mas-**kaa**-ra. In Kannada, long and short vowels
      change meaning, so always respect the macron (ā, ī, ū, ē, ō).
  - ref: 1
    md: >
      **ನಾನು nānu** = *I*. Kannada has **no word for "am/is/are"** in sentences like this:
      *Nānu Sām* = "I Sam" = I'm Sam.
  - ref: 1
    md: >
      **ಹೊಸ hosa** = new. *Neighbour* is English, which is perfectly normal in Bengaluru.
      Mixing English nouns into Kannada (**Kanglish**) is how natives speak. The "pure" word
      *nereyavaru* sounds bookish in a city flat.
  - ref: 2
    md: >
      **ನನ್ ಹೆಸ್ರು nan hesru** = my name. Books write *nanna hesaru*, but people say
      *nan hesru*. This course always teaches the **spoken** form first and shows the book form in brackets.
  - ref: 2
    md: >
      **ನೀವು nīvu** = *you*, the respectful form (strangers, elders, shopkeepers, anyone you're unsure about).
      **ನೀನು nīnu** is the intimate form (close friends, children). When in doubt, use *nīvu*.
  - ref: 2
    md: >
      **ಎಲ್ಲಿಂದ ellinda** = *from where*: **elli** (where) + **-inda** (from). Kannada glues small
      words **onto the end**: *Bengaḷūr-inda* = from Bengaluru, *Mysūr-inda* = from Mysuru.
      Think of a train: the main word is the engine, and the small endings are carriages hooked behind it.
  - ref: 4
    md: >
      **ಅಯ್ಯೋ ayyō**: the great Kannada exclamation, for surprise, pity, shock or sympathy.
      **ಅಷ್ಟು aṣṭu** = that much / so. **ದೂರ dūra** = far → *dūra-dinda* = from far.
  - ref: 4
    md: >
      **ಗೊತ್ತು gottu** = *(is) known*. **Add -ā to any sentence to make a yes/no question:**
      *gottu* (I know) → *gottā?* (do you know?). There's no "do/does" to worry about.
  - ref: 5
    md: >
      **ಸ್ವಲ್ಪ swalpa** = a little. Doubling it (*swalpa swalpa*) softens it: "just a bit".
      **ಕಲೀತಾ ಇದೀನಿ kalītā idīni** = I am learning. Learn it as one block for now; lesson 9 opens it up
      (*-tā idīni* = I am …-ing).
  - ref: 6
    md: >
      **ಬನ್ನಿ banni** = come (polite). **ಕುಡೀರಿ kuḍīri** = drink (polite). The polite command ends in **-ri/-i**.
      *Banni* at the door is an invitation, not a question: you go in.

culture: >
  **Filter coffee** (*kāfi*) is the heartbeat of a Bengaluru home: strong decoction, hot milk and sugar,
  "pulled" between a steel tumbler and a *davara* bowl to make froth. Being offered coffee on your first
  meeting is a warm welcome, and politely accepting is the right move. Elders like Ajji will be
  delighted by even *swalpa swalpa* Kannada. Many Bengaluru residents switch to English or Hindi
  for foreigners, so **staying in Kannada** ("Kannaḍa-dalli mātāḍi, please!") is how you'll get practice.

