texting:
  - { from: shwe, msg: "Hi Sam! Welcome to Bengaluru 😊 Ajji coffee ready ide, banni ☕" }
  - { from: sam,  msg: "Namaskara Shwetha! Bartini 👍 Kannada swalpa swalpa kalitha idini 😅" }
  - { from: shwe, msg: "Super! 👌" }
texting_note: >
  On WhatsApp, Kannadigas type Kannada in **Latin letters** with no macrons and loose spelling:
  *idini, kalitha, bartini* ("I'll come"). *ide* = "is (there)".

mission: >
  Say **"Namaskāra! Nānu ___. Kannaḍa swalpa swalpa gottu."** to one Kannada speaker this week
  (a colleague, a restaurant, an online tandem partner). Or record yourself saying Sam's lines in
  **Your turn**, then compare with the native audio.

# Ajji's explanation: en = spoken by the English narrator; t = Kannada clip; pause = seconds of silence
ajji:
  - en: "Come, sit, sit. I am Ajji, which means grandmother. Shwetha is my granddaughter. You just heard Sam say his first Kannada words. Let me explain them to you slowly, the way I taught my own grandchildren."
  - en: "The first word is:"
  - t: ನಮಸ್ಕಾರ
  - en: "Namaskaara. It means hello, a respectful hello. Say it with me."
  - pause: 2
  - t: ನಮಸ್ಕಾರ
  - pause: 2
  - en: "Did you hear the long aa at the end? Na-mas-kaaa-ra. In Kannada we stretch long vowels like a lazy cat in the sun. Long or short can change the meaning, so take your time."
  - en: "Next, Sam said:"
  - t: ನಾನು ಸ್ಯಾಮ್
  - en: "Naanu means I. And here is a beautiful thing, my dear: there is no word for am. You simply say: I, Sam. Naanu Sam. If your name is Peter: Naanu Peter. Try it with your own name now."
  - pause: 3
  - en: "Then he said hosa neighbour. Hosa means new. And neighbour, well, that is English! In Bengaluru we mix English into Kannada all the time. People call it Kanglish. An English word inside a Kannada sentence is not a mistake. It is exactly how we talk."
  - en: "Now Shwetha answered:"
  - t: ನನ್ ಹೆಸ್ರು ಶ್ವೇತಾ
  - en: "Nan hesru, my name. In books you will see nanna hesaru, but in the street we swallow the little vowels: nan hesru. I will always teach you how people really speak, and I will show you the book form only on the side."
  - en: "Then she asked:"
  - t: ನೀವು ಎಲ್ಲಿಂದ?
  - en: "Neevu means you, the respectful you. For a stranger, an elder or a shopkeeper, always say neevu. For your close friend or a small child, you say neenu. If you are not sure, say neevu. Nobody ever got angry at too much respect."
  - en: "Ellinda means from where. Elli is where. And inda means from. Now listen carefully, because this is the secret of Kannada. English says: from Switzerland. Kannada says: Switzerland, from. The little word comes at the end, hooked on like the carriage of a train. Bengaluru from:"
  - t: ಬೆಂಗಳೂರಿಂದ
  - en: "Mysuru from:"
  - t: ಮೈಸೂರಿಂದ
  - en: "So where are you from? Say your country, then inda."
  - pause: 3
  - en: "When Shwetha heard Switzerland, she said:"
  - t: ಅಯ್ಯೋ, ಅಷ್ಟು ದೂರದಿಂದ!
  - en: "Ayyo! This is our favourite word. Surprise, pity, shock, sympathy: ayyo for everything. Say it with feeling, like an auntie who just heard the price of tomatoes."
  - pause: 2
  - en: "Then the important question:"
  - t: ಕನ್ನಡ ಗೊತ್ತಾ?
  - en: "Gottu means known. Kannada gottu: Kannada is known to me, so I know Kannada. Now here is the magic. Put a long aa at the end, and it becomes a question. Gottu, I know. Gottaa? Do you know? Any sentence, add aa, and you are asking. No do, no does, nothing else."
  - en: "And Sam gave the golden answer:"
  - t: ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ. ಕಲೀತಾ ಇದೀನಿ.
  - en: "Swalpa swalpa, a little, a little. Kaleetaa ideeni, I am learning. Keep this sentence in your pocket like a sweet. Every Kannadiga who hears it will smile at you. Say it with me."
  - pause: 3
  - t: ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ. ಕಲೀತಾ ಇದೀನಿ.
  - pause: 3
  - en: "And at the end, Shwetha said:"
  - t: ಬನ್ನಿ, ಕಾಫಿ ಕುಡೀರಿ.
  - en: "Banni, come. Kaapi kudeeri, drink coffee. Both are polite commands. They end in ri or i when you are being respectful. And when somebody in Karnataka says banni at the door, it is not really a question. You come in, you sit, you drink the coffee. Our filter coffee is strong, sweet and frothy, and it is poured from high up, like this."
  - en: "That is lesson one, my dear. Tomorrow, listen to the dialogue again before you read anything. Then play Your turn and speak Sam's part out loud. Slowly, slowly. Swalpa swalpa. The language will settle in your ear like an old song."
