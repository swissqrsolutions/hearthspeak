    tr: Skvēr fīṭ-ge eraḍu sāvirada eṇṭunūru mātra, mēḍam. Mūvattu-nalavattu saiṭu mūvatmūru lakṣa aravattu sāvira. Kengērigintha ippattu lakṣa kammi!
    en: Only two thousand eight hundred a square foot, madam. A thirty-by-forty plot comes to thirty-three lakh sixty thousand. Twenty lakh less than Kengeri!
  - who: deepa
    t: ಮೂವತ್ಮೂರು ಲಕ್ಷ ಅಂದ್ರೆ ಲೋನ್ ತುಂಬಾ ಕಮ್ಮಿ ಸಾಕು…
    tr: Mūvatmūru lakṣa andre lōn tumbā kammi sāku…
