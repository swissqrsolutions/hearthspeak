  - who: bescom
    t: ಪರವಾಗಿಲ್ಲ, ಎಲ್ಲಾ ರೆಡಿ ಮಾಡ್ಕೊಂಡೇ ಬಂದಿದೀರಿ. ಹೆಚ್ಚಿನವರು ಅರ್ಧ ಪೇಪರ್ ತಗೊಂಡು ಬಂದು ಮೂರು ಸಲ ಅಲೀತಾರೆ. ಈಗ ಅಪ್ಲಿಕೇಶನ್ ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ಹಾಕ್ಬೇಕು — ಬೆಸ್ಕಾಂ ಮಿತ್ರ ಆ್ಯಪ್ ಅಥವಾ ಪೋರ್ಟಲ್. ಇಲ್ಲಿ ಕೌಂಟರ್‌ನಲ್ಲೂ ಹೆಲ್ಪ್ ಮಾಡ್ತಾರೆ.
    tr: Paravāgilla, ellā reḍi māḍkonḍē bandidīri. Heccinavaru ardha pēpar tagonḍu bandu mūru sala alītāre. Īga aplikēshan ānlainnallē hākbēku — BESCOM Mitra ap athavā pōrṭal. Illi kauṇṭarnallū help māḍtāre.
    en: Not bad — you've come with everything ready. Most people bring half the papers and end up making three trips. These days the application has to be filed online — the BESCOM Mithra app or the portal. They'll help you at the counter here too.
  - who: ravi
    t: ಸಾರ್, ಲೋಡ್ ಎಷ್ಟು ಹಾಕ್ಬೇಕು? ನನಗೆ ಐಡಿಯಾ ಇಲ್ಲ.
    tr: Sār, lōḍ eṣṭu hākbēku? Nanage aiḍiyā illa.
    en: Sir, how much load should I apply for? I have no idea.
  - who: bescom
    t: ಕನ್‌ಸ್ಟ್ರಕ್ಷನ್‌ಗೆ ತ್ರೀ-ಫೇಸ್ ತಗೊಳ್ಳಿ. ಮಿಕ್ಸರ್, ವೈಬ್ರೇಟರ್, ವೆಲ್ಡಿಂಗ್ ಎಲ್ಲಾ ಒಟ್ಟಿಗೆ ಓಡಿದ್ರೆ ಸಿಂಗಲ್-ಫೇಸ್ ತಡ್ಕೊಳ್ಳಲ್ಲ. ಸಾಮಾನ್ಯವಾಗಿ ಐದರಿಂದ ಹತ್ತು ಕಿಲೋವ್ಯಾಟ್ ತಗೊಳ್ತಾರೆ. ನಿಮ್ ಕಾಂಟ್ರಾಕ್ಟರ್ ಹತ್ರ ಮೆಷೀನ್ ಲಿಸ್ಟ್ ಕೇಳಿ, ಅದರ ಪ್ರಕಾರ ಹಾಕಿ.
    tr: Kanstrakṣan-ge thrī-phēs tagoḷḷi. Miksar, vaibrēṭar, velḍiṅg ellā oṭṭige ōḍidre siṅgal-phēs taḍkoḷḷalla. Sāmānyavāgi aidarinda hattu kilōvyāṭ tagoḷtāre. Nim kānṭrākṭar hatra meṣīn lisṭ kēḷi, adara prakāra hāki.
    en: For construction, take three-phase. If the mixer, vibrator and welding all run together, single-phase won't cope. People usually take five to ten kilowatts. Ask your contractor for a list of machines and apply accordingly.
  - who: bescom
    t: ಇನ್ನೊಂದು ವಿಷಯ. ಈ ವರ್ಷದಿಂದ ಹೊಸ ಮತ್ತು ಟೆಂಪರರಿ ಕನೆಕ್ಷನ್‌ಗೆ ಸ್ಮಾರ್ಟ್ ಮೀಟರ್ ಕಡ್ಡಾಯ. ಟೆಂಪರರಿಗೆ ಪ್ರೀಪೇಯ್ಡ್ ಸ್ಮಾರ್ಟ್ ಮೀಟರ್ — ಮೊಬೈಲ್ ರೀಚಾರ್ಜ್ ಥರ. ಮೊದಲು ದುಡ್ಡು ಹಾಕ್ಬೇಕು, ಆಮೇಲೆ ಕರೆಂಟ್.
    tr: Innondu viṣaya. Ī varṣadinda hosa mattu ṭemparari kanekṣan-ge smārṭ mīṭar kaḍḍāya. Ṭempararige prīpeyḍ smārṭ mīṭar — mobail rīchārj thara. Modalu duḍḍu hākbēku, āmēle karaṇṭ.
    en: One more thing. From this year a smart meter is compulsory for new and temporary connections. For temporary ones it's a prepaid smart meter — like a mobile recharge. First you put money in, then you get power.
  - who: ravi
    t: ಬ್ಯಾಲೆನ್ಸ್ ಮುಗಿದ್ರೆ?
    tr: Byālens mugidre?
    en: And if the balance runs out?
  - who: bescom
    t: ಕರೆಂಟ್ ತಾನಾಗೇ ಕಟ್ ಆಗುತ್ತೆ. ಮಿನಿಮಮ್ ರೀಚಾರ್ಜ್ ನೂರು ರೂಪಾಯಿ. ಸ್ಲ್ಯಾಬ್ ಹಾಕೋ ದಿನ ಬ್ಯಾಲೆನ್ಸ್ ಸೊನ್ನೆ ಆದ್ರೆ ವೈಬ್ರೇಟರ್ ನಿಂತ್ಹೋಗುತ್ತೆ, ಕಾಂಕ್ರೀಟ್ ಹಾಳಾಗುತ್ತೆ. ಅದಕ್ಕೆ ಯಾವಾಗ್ಲೂ ಸ್ವಲ್ಪ ಜಾಸ್ತಿನೇ ರೀಚಾರ್ಜ್ ಮಾಡಿಟ್ಟಿರಿ.
    tr: Karaṇṭ tānāgē kaṭ āgutte. Minimam rīchārj nūru rūpāyi. Slyāb hākō dina byālens sonne ādre vaibrēṭar ninthōgutte, kānkrīṭ hāḷāgutte. Adakke yāvāglū swalpa jāstinē rīchārj māḍiṭṭiri.
    en: The power cuts off by itself. The minimum recharge is a hundred rupees. If the balance hits zero on slab-casting day, the vibrator stops and the concrete is ruined. So always keep a little extra recharged.
  - who: ravi
    t: ಮೀಟರ್ ನೀವೇ ಕೊಡ್ತೀರಾ, ಅಥವಾ ನಾವೇ ತಗೋಬೇಕಾ? ಬೆಲೆ ಎಷ್ಟಾಗುತ್ತೆ?
    tr: Mīṭar nīvē koḍtīrā, athavā nāvē tagōbēkā? Bele eṣṭāgutte?
    en: Do you supply the meter, or do we have to buy it ourselves? What will it cost?
  - who: bescom
    t: ಬೆಸ್ಕಾಂ ಅಪ್ರೂವ್ ಮಾಡಿರೋ ವೆಂಡರ್ ಹತ್ರ ನೀವೇ ತಗೋಬೇಕು. ತ್ರೀ-ಫೇಸ್ ಸ್ಮಾರ್ಟ್ ಮೀಟರ್ ಸುಮಾರು ಎಂಟು ಸಾವಿರದ ಎಂಟುನೂರ ಎಂಬತ್ತು; ಸಿಂಗಲ್-ಫೇಸ್ ಸುಮಾರು ಐದು ಸಾವಿರ. ಹಳೇ ಮೀಟರ್‌ಗೆ ಹೋಲಿಸಿದ್ರೆ ಜಾಸ್ತಿ, ಗೊತ್ತು. ಜನ ಇದರ ಬಗ್ಗೆ ಕೋರ್ಟ್‌ಗೂ ಹೋಗಿದಾರೆ. ಆದ್ರೆ ಸದ್ಯಕ್ಕೆ ನಮಗೆ ಬಂದಿರೋ ಆದೇಶ ಇದೇ.
    tr: BESCOM aprūv māḍirō veṇḍar hatra nīvē tagōbēku. Thrī-phēs smārṭ mīṭar sumāru eṇṭu sāvirada eṇṭunūra embattu; siṅgal-phēs sumāru aidu sāvira. Haḷē mīṭarge hōlisidre jāsti, gottu. Jana idara bagge kōrṭgū hōgidāre. Ādre sadyakke namage bandirō ādēsha idē.
    en: You buy it yourself from a BESCOM-approved vendor. A three-phase smart meter is about eight thousand eight hundred and eighty; single-phase about five thousand. It's more than the old meters, I know. People have even gone to court over it. But for now, this is the order we've been given.
  - who: ravi
    t: ಸರಿ ಸಾರ್. ಕನೆಕ್ಷನ್‌ಗೆ ಬೇರೆ ಏನಾದ್ರೂ ಚಾರ್ಜ್ ಇದ್ಯಾ?
    tr: Sari sār. Kanekṣan-ge bēre ēnādrū chārj idyā?
    en: Fine, sir. Are there any other charges for the connection?
  - who: bescom
    t: 'ಅಪ್ಲಿಕೇಶನ್ ಫೀ, ಸೆಕ್ಯೂರಿಟಿ ಡೆಪಾಸಿಟ್, ಸರ್ವಿಸ್ ಲೈನ್ ಚಾರ್ಜ್ — ಎಲ್ಲಾ ಆನ್‌ಲೈನ್ ಡಿಮ್ಯಾಂಡ್ ನೋಟಿಸ್‌ನಲ್ಲಿ ಬರುತ್ತೆ, ಅಲ್ಲೇ ಕಟ್ಟಿ, ರಸೀದಿ ಸಿಗುತ್ತೆ. ಒಂದು ವಿಷಯ ನೆನಪಿಡಿ: ಟೆಂಪರರಿ ಟ್ಯಾರಿಫ್ ಮನೆ ಟ್ಯಾರಿಫ್‌ಗಿಂತ ಜಾಸ್ತಿ. ಯೂನಿಟ್‌ಗೆ ಜಾಸ್ತಿ ಬೀಳುತ್ತೆ.'
    tr: 'Aplikēshan fī, sekyūriṭi ḍepāsiṭ, sarvis lain chārj — ellā ānlain ḍimyānḍ nōṭisnalli barutte, allē kaṭṭi, rasīdi sigutte. Ondu viṣaya nenapiḍi: ṭemparari ṭyārif mane ṭyārif-ginta jāsti. Yūniṭge jāsti bīḷutte.'
    en: 'Application fee, security deposit, service-line charge — it all comes in the online demand notice; pay it there and you get a receipt. Remember one thing: the temporary tariff is higher than the domestic one. You pay more per unit.'
