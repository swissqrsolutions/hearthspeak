title:
  t: ರವಿಯ ಮನೆ
  tr: Raviya mane
  en: Ravi's house
intro: 'Ravi Kumar, 34, and his wife Deepa have saved for six years. Now they want their own house in Bengaluru. This lesson follows them for eighteen months: the bank, the broker, site visits, the lawyer and the Sub-Registrar, the architect and plan approval, BESCOM and BWSSB, the contractor and the mestri, one hard year of construction, and finally the tenants. Family talk is informal; offices and professionals are more formal. It builds on every word from Lesson 1 and adds the language of money, property, government offices and building.'
