    t: ಸಿಟಿಜನ್ ಚಾರ್ಟರ್‌ನಲ್ಲಿ ಏಳು ದಿನದಲ್ಲಿ ಸ್ಯಾಂಕ್ಷನ್, ಮೂವತ್ತು ದಿನದಲ್ಲಿ ಕನೆಕ್ಷನ್ ಅಂತ ಇದೆ. ಟೆಂಪರರಿಗೂ ಅಷ್ಟೇ ಟೈಮ್ ಆಗುತ್ತಾ?
    tr: Siṭijan chārṭarnalli ēḷu dinadalli syāṅkṣan, mūvattu dinadalli kanekṣan anta ide. Ṭempararigū aṣṭē ṭaim āguttā?
    en: The citizen charter says sanction within seven days and connection within thirty. Will the temporary one take about that long too?
  - who: bescom
    t: ಪೇಪರ್ ಎಲ್ಲಾ ಸರಿ ಇದ್ರೆ ಟೆಂಪರರಿ ಅದಕ್ಕಿಂತ ಬೇಗ ಆಗುತ್ತೆ. ಫೀಲ್ಡ್ ಇನ್ಸ್‌ಪೆಕ್ಷನ್‌ಗೆ ನಮ್ ಜೆಇ ಬರ್ತಾರೆ, ಕಂಬದಿಂದ ಸೈಟಿಗೆ ಎಷ್ಟು ದೂರ ಅಂತ ನೋಡ್ತಾರೆ. ಕಂಬ ದೂರ ಇದ್ರೆ, ಅಥವಾ ಟ್ರಾನ್ಸ್‌ಫಾರ್ಮರ್ ಓವರ್‌ಲೋಡ್ ಇದ್ರೆ, ಸ್ವಲ್ಪ ತಡ ಆಗ್ಬೋದು. ಆದ್ರೆ ಟೆಂಪರರಿ ಬಗ್ಗೆ ತಲೆ ಕೆಡಿಸ್ಕೋಬೇಡಿ.
    tr: Pēpar ellā sari idre ṭemparari adakkinta bēga āgutte. Fīlḍ inspekṣan-ge nam JE bartāre, kambadinda saiṭige eṣṭu dūra anta nōḍtāre. Kamba dūra idre, athavā ṭrānsfārmar ōvarlōḍ idre, swalpa taḍa āgbōdu. Ādre ṭemparari bagge tale keḍiskōbēḍi.
    en: If the papers are all in order, the temporary one goes faster than that. Our JE comes for a field inspection and checks how far the site is from the pole. If the pole is far, or the transformer is overloaded, it may take a bit longer. But don't worry about the temporary connection.
