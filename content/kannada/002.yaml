lines:
  - chapter: Chapter 1 — Eighteen lakhs
  - section: 🧮 The kitchen-table budget
    learn: 'money words: sambaḷa, kharchu, uḷitāya, lekka · thousands and lakhs · habitual past -ttidde (I used to …) · causative kaṭṭisu (have a house built)'
  - scene: January 2025, a Sunday night. A rented two-bedroom flat in Vijayanagar. Ananya is asleep. Ravi and Deepa sit at the kitchen table with a notebook, a calculator and two cups of tea.
  - who: deepa
    t: ಸರಿ, ಇವತ್ತು ಲೆಕ್ಕ ಮುಗಿಸೋಣ. ಎಷ್ಟು ದಿನ ಅಂತ “ಮುಂದಿನ ವಾರ, ಮುಂದಿನ ವಾರ” ಅಂತೀಯ?
    tr: Sari, ivattu lekka mugisōṇa. Eṣṭu dina anta “mundina vāra, mundina vāra” antīya?
    en: Right, let's finish the accounts tonight. How long are you going to keep saying “next week, next week”?
  - who: ravi
    t: ಆಯ್ತು, ಆಯ್ತು. ನೋಟ್‌ಬುಕ್ ಕೊಡು. ಮೊದಲು ಸಂಬಳ. ನನ್ನ ಕೈಗೆ ಬರೋದು ತಿಂಗಳಿಗೆ ತೊಂಬತ್ತೆಂಟು ಸಾವಿರ.
    tr: Āytu, āytu. Nōṭbuk koḍu. Modalu sambaḷa. Nanna kaige barōdu tingaḷige tombatteṇṭu sāvira.
    en: Okay, okay. Give me the notebook. Salary first. What I take home is ninety-eight thousand a month.
  - who: deepa
    t: ನನ್ನದು ನಲವತ್ತಾರು ಸಾವಿರ. ಈ ವರ್ಷ ಸ್ಕೂಲ್‌ನಲ್ಲಿ ಹೈಕ್ ಇಲ್ಲ ಅಂತ ಪ್ರಿನ್ಸಿಪಾಲ್ ಹೇಳಿದ್ರು. ಒಟ್ಟು ಒಂದು ಲಕ್ಷ ನಲವತ್ನಾಲ್ಕು ಸಾವಿರ.
    tr: Nannadu nalavattāru sāvira. Ī varṣa skūl-nalli haik illa anta prinsipāl hēḷidru. Oṭṭu ondu lakṣa nalavatnālku sāvira.
    en: Mine is forty-six thousand. The principal said there's no raise at school this year. Altogether, one lakh forty-four thousand.
  - who: ravi
    t: ಈಗ ಖರ್ಚು. ಬಾಡಿಗೆ ಇಪ್ಪತ್ತೆರಡು ಸಾವಿರ. ದಿನಸಿ, ಹಾಲು, ಕರೆಂಟ್ ಬಿಲ್, ಮನೆ ಖರ್ಚು ಎಲ್ಲಾ ಸೇರಿ ಸುಮಾರು ಮೂವತ್ತೈದು.
    tr: Īga kharchu. Bāḍige ippatteraḍu sāvira. Dinasi, hālu, karaṇṭ bil, mane kharchu ellā sēri sumāru mūvattaidu.
    en: Now the expenses. Rent is twenty-two thousand. Groceries, milk, the electricity bill, household costs, all together about thirty-five.
  - who: deepa
    t: ಅನನ್ಯಾ ಸ್ಕೂಲ್ ಫೀಸ್ ಮರೀಬೇಡ. ವರ್ಷಕ್ಕೆ ತೊಂಬತ್ತು ಸಾವಿರ, ಅಂದ್ರೆ ತಿಂಗಳಿಗೆ ಏಳೂವರೆ ಸಾವಿರ. ಸ್ಕೂಲ್ ವ್ಯಾನ್ ಬೇರೆ.
    tr: Ananyā skūl fīs marībēḍa. Varṣakke tombattu sāvira, andre tingaḷige ēḷūvare sāvira. Skūl vyān bēre.
    en: Don't forget Ananya's school fees. Ninety thousand a year, so seven and a half thousand a month. And the school van on top of that.
  - who: ravi
    t: ಅಪ್ಪನ ಮಾತ್ರೆ, ಅಮ್ಮನ ಡಾಕ್ಟರ್, ಪೆಟ್ರೋಲ್, ಇನ್ಶೂರೆನ್ಸ್… ಎಲ್ಲಾ ಕಳೆದ್ರೆ ತಿಂಗಳಿಗೆ ಉಳಿಯೋದು ಸುಮಾರು ನಲವತ್ತು ಸಾವಿರ.
    tr: Appana mātre, ammana ḍākṭar, peṭrōl, inśūrens… ellā kaḷedre tingaḷige uḷiyōdu sumāru nalavattu sāvira.
    en: Appa's tablets, Amma's doctor, petrol, insurance… take all that out, and what's left each month is about forty thousand.
  - who: deepa
    t: ನಲವತ್ತು ಈಗ. ಟ್ವೆಂಟಿ-ನೈನ್‌ಟೀನ್‌ನಲ್ಲಿ ಶುರು ಮಾಡಿದಾಗ ಹದಿನೈದು ಸಾವಿರ ಉಳಿಸೋದೂ ಕಷ್ಟ ಆಗ್ತಿತ್ತು, ನೆನಪಿದ್ಯಾ?
    tr: Nalavattu īga. Ṭwenṭi-nainṭīn-nalli śuru māḍidāga hadinaidu sāvira uḷisōdū kaṣṭa āgtittu, nenapidyā?
    en: Forty now. When we started in 2019, even saving fifteen thousand was a struggle. Remember?
  - who: ravi
    t: ನೆನಪಿದೆ. ಅನನ್ಯಾಗೆ ಆಗ ಒಂದು ವರ್ಷ. ಆಗ್ಲೇ ಅಂದ್ಕೊಂಡ್ವಿ, ಒಂದಲ್ಲ ಒಂದು ದಿನ ನಮ್ಮದೇ ಮನೆ ಕಟ್ಟಿಸ್ಬೇಕು ಅಂತ.
    tr: Nenapide. Ananyāge āga ondu varṣa. Āglē andkoṇḍvi, ondalla ondu dina nammadē mane kaṭṭisbēku anta.
    en: I remember. Ananya was one. That's when we decided that one day we'd have our own house built.
  - who: deepa
    t: “ಕಟ್ಟಿಸ್ಬೇಕು”, ಸರಿಯಾದ ಪದ. ನಾವೇ ಕಟ್ಟಲ್ಲ, ಕಟ್ಟಿಸ್ತೀವಿ. ಇಟ್ಟಿಗೆ ಹೊರೋದು ನಿನ್ನ ಕೈಯಲ್ಲಿ ಆಗಲ್ಲ.
    tr: “Kaṭṭisbēku”, sariyāda pada. Nāvē kaṭṭalla, kaṭṭistīvi. Iṭṭige horōdu ninna kaiyalli āgalla.
    en: “Have it built” is the right word. We won't build it ourselves, we'll have it built. You couldn't carry bricks if your life depended on it.
  - who: ravi
    t: ಸರಿ ಟೀಚರ್. ಈಗ ಉಳಿತಾಯ. ಎಫ್‌ಡಿಯಲ್ಲಿ ಒಂಬತ್ತು ಲಕ್ಷ ಇದೆ. ಆರ್‌ಡಿ ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಮುಗೀತು, ನಾಲ್ಕೂವರೆ ಲಕ್ಷ ಬಂತು.
    tr: Sari ṭīchar. Īga uḷitāya. Ef-ḍiyalli ombattu lakṣa ide. Ār-ḍi ḍisembar-nalli mugītu, nālkūvare lakṣa bantu.
    en: Yes, teacher. Now the savings. There's nine lakh in the FD. The RD matured in December and paid out four and a half lakh.
  - who: deepa
    t: ಮತ್ತೆ ನನ್ನ ಚೀಟಿ ದುಡ್ಡು ಮೂರು ಲಕ್ಷ. ಸೇವಿಂಗ್ಸ್ ಅಕೌಂಟ್‌ನಲ್ಲಿ ಒಂದೂವರೆ. ಒಟ್ಟು… ಹದಿನೆಂಟು ಲಕ್ಷ.
    tr: Matte nanna chīṭi duḍḍu mūru lakṣa. Sēvings akauṇṭ-nalli ondūvare. Oṭṭu… hadineṇṭu lakṣa.
    en: Then my chit-fund money, three lakh. One and a half in the savings account. Total… eighteen lakh.
  - who: ravi
    t: ಹದಿನೆಂಟು ಲಕ್ಷ. ಆರು ವರ್ಷದ ದುಡಿಮೆ, ಒಂದೇ ಪೇಜ್‌ನಲ್ಲಿ.
    tr: Hadineṇṭu lakṣa. Āru varṣada duḍime, ondē pēj-nalli.
    en: Eighteen lakh. Six years of hard work, on a single page.
  - who: deepa
    t: ಆ ಚೀಟಿ ಸುಲಭ ಆಗಿರ್ಲಿಲ್ಲ. ಪ್ರತಿ ತಿಂಗಳು ಹತ್ತು ಸಾವಿರ ಕಟ್ತಿದ್ದೆ. ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಹರಾಜಿನಲ್ಲಿ ಕೂಗಿ ತಗೊಂಡೆ. ಸ್ವಲ್ಪ ಲಾಸ್ ಆಯ್ತು, ಆದ್ರೂ ದುಡ್ಡು ಕೈಗೆ ಬಂತು.
    tr: Ā chīṭi sulabha āgirlilla. Prati tingaḷu hattu sāvira kaṭtidde. Ḍisembar-nalli harājinalli kūgi tagoṇḍe. Swalpa lās āytu, ādrū duḍḍu kaige bantu.
    en: That chit fund wasn't easy. I used to pay ten thousand every month. In December I bid for the pot at the auction and took it. I lost a little, but the money is in hand.
  - who: ravi
    t: ನಿಜ ಹೇಳ್ಲಾ? ಆ ಚೀಟಿ ಬಗ್ಗೆ ನನಗೆ ಯಾವಾಗ್ಲೂ ಭಯ ಇತ್ತು. ಮಾಗಡಿ ರೋಡ್‌ನಲ್ಲಿ ಒಬ್ಬ ಚೀಟಿ ನಡೆಸೋನು ಎಲ್ಲರ ದುಡ್ಡು ತಗೊಂಡು ಓಡ್ಹೋದ ಅಂತ ಸುದ್ದಿ ಬಂದಿತ್ತಲ್ಲ.
    tr: Nija hēḷlā? Ā chīṭi bagge nanage yāvāglū bhaya ittu. Māgaḍi Rōḍ-nalli obba chīṭi naḍesōnu ellara duḍḍu tagoṇḍu ōḍhōda anta suddi bandittalla.
    en: Shall I be honest? That chit fund always scared me. Remember the news about the chit organiser on Magadi Road who ran off with everyone's money?
  - who: deepa
    t: ಅದಕ್ಕೇ ರಿಜಿಸ್ಟರ್ ಆಗಿರೋ ಚಿಟ್ ಕಂಪನಿಗೆ ಮಾತ್ರ ಸೇರಿದ್ದು. ಪ್ರತಿ ಕಂತಿಗೂ ರಸೀದಿ ಕೊಡ್ತಿದ್ರು.
    tr: Adakkē rijisṭar āgirō chiṭ kampanige mātra sēriddu. Prati kantigū rasīdi koḍtidru.
    en: That's exactly why I only joined a registered chit company. They gave a receipt for every instalment.
  - who: deepa
    t: ಮತ್ತೆ ನನ್ನ ಒಡವೆ ಇದೆ, ಸುಮಾರು ನೂರು ಗ್ರಾಮ್ ಚಿನ್ನ. ಬೇಕಾದ್ರೆ ಗೋಲ್ಡ್ ಲೋನ್…
    tr: Matte nanna oḍave ide, sumāru nūru grām chinna. Bēkādre gōlḍ lōn…
    en: And there's my jewellery, about a hundred grams of gold. If we need to, a gold loan…
  - who: ravi
    t: ಬೇಡ, ದೀಪಾ. ಆ ಚಿನ್ನ ಮುಟ್ಟೋದು ಬೇಡ. ಅದು ನಿಮ್ಮಮ್ಮ ನಿನಗೆ ಕೊಟ್ಟಿದ್ದು. ಬೇರೆ ದಾರಿನೇ ಇಲ್ಲ ಅಂದ್ರೆ ಮಾತ್ರ.
    tr: Bēḍa, Dīpā. Ā chinna muṭṭōdu bēḍa. Adu nimmamma ninage koṭṭiddu. Bēre dārinē illa andre mātra.
    en: No, Deepa. Let's not touch that gold. Your mother gave it to you. Only if there's no other way.
  - who: deepa
    t: ಸರಿ. ಈಗ ಮುಖ್ಯ ಪ್ರಶ್ನೆ. ಹದಿನೆಂಟು ಲಕ್ಷಕ್ಕೆ ಬೆಂಗಳೂರಲ್ಲಿ ಸೈಟು ಸಿಗುತ್ತಾ? ಕೆಂಗೇರಿ ಕಡೆ ಮೂವತ್ತು-ನಲವತ್ತು ಸೈಟಿಗೆ ಐವತ್ತು ಲಕ್ಷದ ಮೇಲೆ ಹೇಳ್ತಿದಾರೆ.
    tr: Sari. Īga mukhya praśne. Hadineṇṭu lakṣakke Bengaḷūralli saiṭu siguttā? Kengēri kaḍe mūvattu-nalavattu saiṭige aivattu lakṣada mēle hēḷtidāre.
    en: Fine. Now the real question. Can we get a plot in Bengaluru for eighteen lakh? Out Kengeri way they're asking over fifty lakh for a thirty-by-forty site.
  - who: ravi
    t: ಸಿಗಲ್ಲ. ಅದಕ್ಕೇ ಲೋನ್ ತಗೋಬೇಕು. ಪ್ರತಿ ತಿಂಗಳು ಇಪ್ಪತ್ತೆರಡು ಸಾವಿರ ಬಾಡಿಗೆ ಹಾಗೇ ಹೋಗ್ತಿದೆ. ಅದೇ ದುಡ್ಡು ಇಎಂಐಗೆ ಹೋದ್ರೆ ಕೊನೆಗೆ ಒಂದು ಆಸ್ತಿ ನಮ್ಮ ಕೈಯಲ್ಲಿರುತ್ತೆ.
    tr: Sigalla. Adakkē lōn tagōbēku. Prati tingaḷu ippatteraḍu sāvira bāḍige hāgē hōgtide. Adē duḍḍu Ī-Em-Aige hōdre konege ondu āsti namma kaiyallirutte.
    en: No, we can't. That's why we need a loan. Twenty-two thousand in rent just disappears every month. If that same money went into an EMI, at the end we'd own a property.
  - who: deepa
    t: ಅದು ನಿಜ. ಆದ್ರೆ ಇಎಂಐ ಇಪ್ಪತ್ತೆರಡು ಸಾವಿರ ಅಲ್ಲ, ಅದರ ಎರಡರಷ್ಟು ಆಗಬಹುದು. ಮತ್ತೆ ಮನೆ ಕಟ್ಟಿಸೋವರೆಗೂ ಬಾಡಿಗೆನೂ ಕಟ್ಬೇಕು. ಎರಡೂ ಒಟ್ಟಿಗೆ.
    tr: Adu nija. Ādre Ī-Em-Ai ippatteraḍu sāvira alla, adara eraḍaraṣṭu āgabahudu. Matte mane kaṭṭisōvaregū bāḍigenū kaṭbēku. Eraḍū oṭṭige.
    en: True. But the EMI won't be twenty-two thousand. It could be twice that. And until the house is built, we'll have to keep paying rent too. Both at once.
  - who: ravi
    t: ಗೊತ್ತು. ಅದಕ್ಕೇ ನಾಳೆ ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ತಗೊಂಡಿದೀನಿ. ಆದ್ರೆ ಮೊದಲು… ಅಪ್ಪನಿಗೆ ಹೇಳ್ಬೇಕು.
    tr: Gottu. Adakkē nāḷe byānk-nalli apāyinṭmenṭ tagoṇḍidīni. Ādre modalu… appanige hēḷbēku.
    en: I know. That's why I've booked an appointment at the bank tomorrow. But first… we have to tell Appa.
  - who: deepa
    t: “ಲೋನ್” ಅನ್ನೋ ಪದ ಕೇಳಿದ ತಕ್ಷಣ ಅವರ ಮುಖ ನೋಡು.
    tr: “Lōn” annō pada kēḷida takṣaṇa avara mukha nōḍu.
    en: Watch his face the moment he hears the word “loan”.
  - section: 👴 Appa and the fear of debt
    learn: proverbs (gāde) · “even if” -ādrū · “until” -ōvaregū · nīvu to parents · sāla (loan) vs baḍḍi (interest)
  - scene: Appa comes out of the bedroom for a glass of water and sees the notebook. Amma follows him.
  - who: appa
    t: ಇಷ್ಟು ರಾತ್ರಿ ಏನು ಲೆಕ್ಕ ಹಾಕ್ತಿದೀರಿ? ಯಾರಿಗಾದ್ರೂ ದುಡ್ಡು ಕೊಡ್ಬೇಕಾ?
    tr: Iṣṭu rātri ēnu lekka hāktidīri? Yārigādrū duḍḍu koḍbēkā?
    en: What are you two calculating so late at night? Do we owe someone money?
  - who: ravi
    t: ಇಲ್ಲಪ್ಪ. ಕೂತ್ಕೊಳ್ಳಿ. ನಾವು ಒಂದು ಸೈಟು ತಗೊಂಡು ಮನೆ ಕಟ್ಟಿಸ್ಬೇಕು ಅಂತ ಇದೀವಿ. ಹದಿನೆಂಟು ಲಕ್ಷ ಕೂಡಿಟ್ಟಿದೀವಿ.
    tr: Illappa. Kūtkoḷḷi. Nāvu ondu saiṭu tagoṇḍu mane kaṭṭisbēku anta idīvi. Hadineṇṭu lakṣa kūḍiṭṭidīvi.
    en: No, Appa. Sit down. We're planning to buy a plot and have a house built. We've put aside eighteen lakh.
  - who: amma
    t: ಸ್ವಂತ ಮನೆ? ದೇವರೇ! ಈ ಮಾತು ಕೇಳೋಕೆ ಎಷ್ಟು ವರ್ಷದಿಂದ ಕಾಯ್ತಿದೀನಿ.
    tr: Swanta mane? Dēvarē! Ī mātu kēḷōke eṣṭu varṣadinda kāytidīni.
    en: Our own house? Oh God! How many years I've waited to hear those words.
  - who: appa
    t: ಹದಿನೆಂಟು ಲಕ್ಷಕ್ಕೆ ಸೈಟು ಎಲ್ಲಿ ಸಿಗುತ್ತೆ? ಉಳಿದಿದ್ದು ಎಲ್ಲಿಂದ? … ಸಾಲನಾ?
    tr: Hadineṇṭu lakṣakke saiṭu elli sigutte? Uḷididdu ellinda? … Sālanā?
    en: Where will you find a plot for eighteen lakh? Where does the rest come from? … A loan?
  - who: ravi
    t: ಹೌದಪ್ಪ, ಬ್ಯಾಂಕ್ ಲೋನ್. ಇಪ್ಪತ್ತು ವರ್ಷಕ್ಕೆ.
    tr: Haudappa, byānk lōn. Ippattu varṣakke.
    en: Yes, Appa, a bank loan. Over twenty years.
  - who: appa
    t: ಇಪ್ಪತ್ತು ವರ್ಷ! ನಾನು ಮೂವತ್ತೆರಡು ವರ್ಷ ಕೆಎಸ್‌ಆರ್‌ಟಿಸಿ ಬಸ್‌ನಲ್ಲಿ ಟಿಕೆಟ್ ಕೊಟ್ಟೆ. ಒಂದೇ ಸಲ ಸಾಲ ಮಾಡಿದ್ದು, ನಿನ್ನ ಕಾಲೇಜ್ ಫೀಸ್‌ಗೆ. ಅದನ್ನ ತೀರಿಸೋವರೆಗೂ ನಾಲ್ಕು ವರ್ಷ ನನಗೆ ನಿದ್ದೆ ಬರ್ಲಿಲ್ಲ.
    tr: Ippattu varṣa! Nānu mūvatteraḍu varṣa Ke-Es-Ār-Ṭi-Si bas-nalli ṭikeṭ koṭṭe. Ondē sala sāla māḍiddu, ninna kālēj fīs-ge. Adanna tīrisōvaregū nālku varṣa nanage nidde barlilla.
    en: Twenty years! For thirty-two years I issued tickets on KSRTC buses. I borrowed only once, for your college fees. Until I'd paid it back, I couldn't sleep properly for four years.
  - who: ravi
    t: ಗೊತ್ತಪ್ಪ. ಆದ್ರೆ ಅದು ಬಡ್ಡಿ ಸಾಹುಕಾರನ ಹತ್ರ ತಗೊಂಡಿದ್ದು, ನೂರಕ್ಕೆ ತಿಂಗಳಿಗೆ ಮೂರು ರೂಪಾಯಿ ಬಡ್ಡಿ. ಇದು ಬ್ಯಾಂಕ್. ವರ್ಷಕ್ಕೆ ಸುಮಾರು ಎಂಟೂವರೆ ಪರ್ಸೆಂಟ್, ಎಲ್ಲಾ ಪೇಪರ್ ಮೇಲೆ.
    tr: Gottappa. Ādre adu baḍḍi sāhukārana hatra tagoṇḍiddu, nūrakke tingaḷige mūru rūpāyi baḍḍi. Idu byānk. Varṣakke sumāru eṇṭūvare parsenṭ, ellā pēpar mēle.
    en: I know, Appa. But that was from a moneylender, three rupees a month on every hundred. This is a bank. About eight and a half percent a year, and everything on paper.
  - who: appa
    t: ಬಡ್ಡಿ ಕಡಿಮೆ ಆದ್ರೂ ಸಾಲ ಸಾಲನೇ, ಮಗ. ನಿನ್ನ ಕೆಲಸ ಹೋದ್ರೆ? ಕೋವಿಡ್ ಟೈಮ್‌ನಲ್ಲಿ ನಿನ್ನ ಸಂಬಳ ಕಟ್ ಆಗಿದ್ದು ಮರೆತುಬಿಟ್ಯಾ?
    tr: Baḍḍi kaḍime ādrū sāla sālanē, maga. Ninna kelasa hōdre? Kōviḍ ṭaim-nalli ninna sambaḷa kaṭ āgiddu maretubiṭyā?
    en: Low interest or not, a loan is still a loan, son. What if you lose your job? Have you forgotten how your salary was cut during Covid?
  - who: deepa
    t: ಮರೆತಿಲ್ಲ, ಮಾವ. ಅದಕ್ಕೇ ಲೋನ್ ಇಬ್ರ ಹೆಸರಲ್ಲೂ ತಗೊಳ್ತೀವಿ. ಮತ್ತೆ ಆರು ತಿಂಗಳ ಇಎಂಐ ಅಷ್ಟು ದುಡ್ಡು ಯಾವಾಗ್ಲೂ ಬೇರೆ ಇಟ್ಟಿರ್ತೀವಿ, ಅದನ್ನ ಮುಟ್ಟಲ್ಲ.
    tr: Maretilla, māva. Adakkē lōn ibra hesarallū tagoḷtīvi. Matte āru tingaḷa Ī-Em-Ai aṣṭu duḍḍu yāvāglū bēre iṭṭirtīvi, adanna muṭṭalla.
    en: I haven't forgotten, Mava. That's why we'll take the loan in both our names. And we'll always keep six months' worth of EMIs aside and never touch it.
  - who: appa
    t: 'ಹ್ಮ್. ನಮ್ಮಪ್ಪ ಒಂದು ಮಾತು ಹೇಳ್ತಿದ್ರು: “ಹನಿ ಹನಿ ಗೂಡಿದರೆ ಹಳ್ಳ, ತೆನೆ ತೆನೆ ಗೂಡಿದರೆ ಬಳ್ಳ.”'
    tr: 'Hm. Nammappa ondu mātu hēḷtidru: “Hani hani gūḍidare haḷḷa, tene tene gūḍidare baḷḷa.”'
    en: 'Hmm. My father used to say: “Drop by drop, a stream; ear by ear of grain, a full measure.”'
  - who: appa
    t: ನೀವು ಆರು ವರ್ಷ ಹನಿ ಹನಿ ಕೂಡಿಟ್ಟಿದೀರಿ. ಅದು ಸಣ್ಣ ವಿಷಯ ಅಲ್ಲ, ನನಗೆ ಹೆಮ್ಮೆ ಇದೆ. ಆದ್ರೆ ಹಳ್ಳ ತುಂಬೋ ಮುಂಚೆ ಸಮುದ್ರಕ್ಕೆ ಹಾರಬೇಡಿ.
    tr: Nīvu āru varṣa hani hani kūḍiṭṭidīri. Adu saṇṇa viṣaya alla, nanage hemme ide. Ādre haḷḷa tumbō munche samudrakke hārabēḍi.
    en: You two have saved drop by drop for six years. That's no small thing, and I'm proud of you. But don't jump into the sea before the stream is full.
  - who: ravi
    t: ಅದಕ್ಕೇ ಮೊದಲು ಬ್ಯಾಂಕ್‌ಗೆ ಹೋಗಿ ಎಷ್ಟು ಲೋನ್ ಸಿಗುತ್ತೆ, ಇಎಂಐ ಎಷ್ಟು ಆಗುತ್ತೆ ಅಂತ ಕೇಳ್ತೀನಿ. ಆಮೇಲೆ ತೀರ್ಮಾನ.
    tr: Adakkē modalu byānk-ge hōgi eṣṭu lōn sigutte, Ī-Em-Ai eṣṭu āgutte anta kēḷtīni. Āmēle tīrmāna.
    en: That's why I'll go to the bank first and ask how much we can borrow and what the EMI would be. Then we decide.
  - who: amma
    t: ಸೈಟು ನೋಡೋವಾಗ ನಾನೂ ಬರ್ತೀನಿ. ಪೂರ್ವಕ್ಕೆ ಮುಖ ಇರಬೇಕು, ಅದನ್ನ ಮೊದಲು ನೋಡಿ. ವಾಸ್ತು ಸರಿ ಇಲ್ಲದ ಮನೇಲಿ ನೆಮ್ಮದಿ ಇರಲ್ಲ.
    tr: Saiṭu nōḍōvāga nānū bartīni. Pūrvakke mukha irabēku, adanna modalu nōḍi. Vāstu sari illada manēli nemmadi iralla.
    en: When you go to see plots, I'm coming too. It has to face east, so check that first. A house with bad Vastu never has peace.
  - who: deepa
    t: ಅತ್ತೆ, ಈಸ್ಟ್ ಫೇಸಿಂಗ್ ಸೈಟಿಗೆ ಸ್ಕ್ವೇರ್ ಫೀಟ್‌ಗೆ ಇನ್ನೂರು-ಮುನ್ನೂರು ರೂಪಾಯಿ ಜಾಸ್ತಿ ಹೇಳ್ತಾರೆ. ಸಾವಿರದ ಇನ್ನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್ ಅಂದ್ರೆ ಸುಮಾರು ಮೂರು ಲಕ್ಷ ಜಾಸ್ತಿ.
    tr: Atte, īsṭ phēsing saiṭige skvēr fīṭ-ge innūru-munnūru rūpāyi jāsti hēḷtāre. Sāvirada innūru skvēr fīṭ andre sumāru mūru lakṣa jāsti.
    en: Atte, east-facing plots cost two or three hundred rupees more per square foot. On twelve hundred square feet, that's about three lakh extra.
  - who: amma
    t: ಇಪ್ಪತ್ತು ವರ್ಷದ ನೆಮ್ಮದಿಗೆ ಮೂರು ಲಕ್ಷ. ಅದು ಜಾಸ್ತಿ ಅಲ್ಲ.
    tr: Ippattu varṣada nemmadige mūru lakṣa. Adu jāsti alla.
    en: Three lakh for twenty years of peace of mind. That's not too much.
  - who: appa
    t: ನೋಡಿದ್ಯಾ ರವಿ? ಸೈಟು ಇನ್ನೂ ನೋಡಿಲ್ಲ, ಆಗ್ಲೇ ಎತ್ತು ಏರಿಗೆಳೀತು, ಕೋಣ ನೀರಿಗೆಳೀತು. ಒಬ್ರಿಗೆ ವಾಸ್ತು, ಒಬ್ರಿಗೆ ಲೆಕ್ಕ.
    tr: Nōḍidyā Ravi? Saiṭu innū nōḍilla, āglē ettu ērigeḷītu, kōṇa nīrigeḷītu. Obrige vāstu, obrige lekka.
    en: See that, Ravi? We haven't even seen a plot, and already the ox pulls up the bank while the buffalo pulls into the water. One cares about Vastu, the other about numbers.
  - who: ravi
    t: ಎರಡೂ ಬೇಕು, ಅಪ್ಪ. ವಾಸ್ತುನೂ, ಲೆಕ್ಕನೂ. ನಾಳೆ ಬ್ಯಾಂಕ್‌ನಿಂದ ಬಂದ ಮೇಲೆ ಎಲ್ಲಾ ಕೂತು ಮಾತಾಡೋಣ.
    tr: Eraḍū bēku, appa. Vāstunū, lekkanū. Nāḷe byānk-ninda banda mēle ellā kūtu mātāḍōṇa.
    en: We need both, Appa. The Vastu and the numbers. When I'm back from the bank tomorrow, we'll all sit down and talk.
  - section: 🏦 At Canara Bank
    learn: 'formal requests (bēkāgittu, tiḷkoḷḷōke bandvi) · loan words: plot loan, composite loan, down payment, CIBIL, EMI · percentages · “whichever is lower” (yāvudu kamminō)'
  - scene: Monday, eleven in the morning. A Canara Bank branch in Vijayanagar. Ravi and Deepa sit across the desk from Vandana, the home-loan officer.
  - who: bank
    t: ನಮಸ್ಕಾರ, ಕೂತ್ಕೊಳ್ಳಿ. ಹೇಳಿ ಸಾರ್, ಏನು ಸಹಾಯ ಆಗಬೇಕು?
    tr: Namaskāra, kūtkoḷḷi. Hēḷi sār, ēnu sahāya āgabēku?
    en: Good morning, please sit down. Tell me, sir, how can I help?
  - who: ravi
    t: ನಮಸ್ಕಾರ ಮೇಡಂ. ಒಂದು ಸೈಟು ತಗೊಂಡು ಮನೆ ಕಟ್ಟಿಸೋಕೆ ನಮಗೆ ಲೋನ್ ಬೇಕಾಗಿತ್ತು. ಪ್ರೋಸೆಸ್ ಏನು, ಎಷ್ಟು ಸಿಗುತ್ತೆ ಅಂತ ತಿಳ್ಕೊಳ್ಳೋಕೆ ಬಂದ್ವಿ.
    tr: Namaskāra mēḍam. Ondu saiṭu tagoṇḍu mane kaṭṭisōke namage lōn bēkāgittu. Prōses ēnu, eṣṭu sigutte anta tiḷkoḷḷōke bandvi.
    en: Good morning, madam. We need a loan to buy a plot and have a house built. We've come to find out the process and how much we could get.
  - who: bank
    t: ಒಳ್ಳೇದು. ಮೊದಲು ಒಂದು ವಿಷಯ ಕ್ಲಿಯರ್ ಮಾಡ್ತೀನಿ. ಸೈಟಿಗೆ ಲೋನ್ ಕೊಡೋದು ಅಪ್ರೂವ್ಡ್ ಲೇಔಟ್‌ನಲ್ಲಿ ಮಾತ್ರ. ಬಿಡಿಎ, ಬಿಎಂಆರ್‌ಡಿಎ, ಅಥವಾ ಬೇರೆ ಪ್ಲಾನಿಂಗ್ ಅಥಾರಿಟಿ ಅನುಮೋದನೆ ಇರಬೇಕು.
    tr: Oḷḷēdu. Modalu ondu viṣaya kliyar māḍtīni. Saiṭige lōn koḍōdu aprūvḍ lēauṭ-nalli mātra. Bi-Ḍi-E, Bi-Em-Ār-Ḍi-E, athavā bēre plāning athāriṭi anumōdane irabēku.
    en: Good. First let me make one thing clear. We give plot loans only in approved layouts. The layout must have approval from the BDA, the BMRDA or another planning authority.
  - who: deepa
    t: ರೆವಿನ್ಯೂ ಸೈಟು, ಬಿ-ಖಾತಾ ಸೈಟು ಆದ್ರೆ?
    tr: Revinyū saiṭu, Bi-khātā saiṭu ādre?
    en: And if it's a revenue site, or a B-khata site?
  - who: bank
    t: ಅಂಥ ಸೈಟಿಗೆ ನಮ್ಮ ಬ್ಯಾಂಕ್ ಲೋನ್ ಕೊಡಲ್ಲ, ಮೇಡಂ. ಕೆಲವು ಫೈನಾನ್ಸ್ ಕಂಪನಿಗಳು ಕೊಡ್ತಾರೆ, ಆದ್ರೆ ಬಡ್ಡಿನೂ ಜಾಸ್ತಿ, ರಿಸ್ಕ್ ಕೂಡ ಜಾಸ್ತಿ. ಬ್ರೋಕರ್‌ಗಳು “ಲೋನ್ ಸಿಗುತ್ತೆ” ಅಂತಾರೆ, ನಂಬಬೇಡಿ.
    tr: Antha saiṭige namma byānk lōn koḍalla, mēḍam. Kelavu faināns kampanigaḷu koḍtāre, ādre baḍḍinū jāsti, risk kūḍa jāsti. Brōkar-gaḷu “lōn sigutte” antāre, nambabēḍi.
    en: Our bank doesn't lend on sites like that, madam. Some finance companies do, but the interest is higher and so is the risk. Brokers will tell you “you'll get a loan”. Don't believe them.
  - who: ravi
    t: ಸರಿ. ಸೈಟಿನ ಬೆಲೆಯಲ್ಲಿ ಎಷ್ಟು ಪರ್ಸೆಂಟ್ ಲೋನ್ ಸಿಗುತ್ತೆ?
    tr: Sari. Saiṭina beleyalli eṣṭu parsenṭ lōn sigutte?
    en: Right. What percentage of the plot price can we borrow?
  - who: bank
    t: ಪ್ಲಾಟ್ ಲೋನ್‌ಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಎಪ್ಪತ್ತರಿಂದ ಎಪ್ಪತ್ತೈದು ಪರ್ಸೆಂಟ್. ಅದೂ ಸೇಲ್ ಡೀಡ್ ವ್ಯಾಲ್ಯೂ ಅಥವಾ ನಮ್ಮ ಎಂಜಿನಿಯರ್ ಮಾಡೋ ವ್ಯಾಲ್ಯುಯೇಶನ್, ಯಾವುದು ಕಮ್ಮಿನೋ ಅದರ ಮೇಲೆ. ಉಳಿದ ಇಪ್ಪತ್ತೈದು-ಮೂವತ್ತು ಪರ್ಸೆಂಟ್ ನೀವು ಡೌನ್ ಪೇಮೆಂಟ್ ಕೊಡಬೇಕು.
    tr: Plāṭ lōn-ge sāmānyavāgi eppattarinda eppattaidu parsenṭ. Adū sēl ḍīḍ vyālyū athavā namma enjiniyar māḍō vyālyuyēśan, yāvudu kamminō adara mēle. Uḷida ippattaidu-mūvattu parsenṭ nīvu ḍaun pēmenṭ koḍabēku.
    en: For a plot loan, usually seventy to seventy-five percent. And that's calculated on the sale-deed value or our engineer's valuation, whichever is lower. You pay the remaining twenty-five to thirty percent as the down payment.
  - who: bank
    t: ಇನ್ನೊಂದು. ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ, ರಿಜಿಸ್ಟ್ರೇಷನ್ ಫೀ, ಬ್ರೋಕರ್ ಕಮಿಷನ್, ಇವೆಲ್ಲಾ ಲೋನ್‌ನಲ್ಲಿ ಬರಲ್ಲ. ಅದು ನಿಮ್ಮ ಕೈಯಿಂದಲೇ ಹೋಗಬೇಕು.
    tr: Innondu. Sṭyāmp ḍyūṭi, rijisṭrēśan fī, brōkar kamiśan, ivellā lōn-nalli baralla. Adu nimma kaiyindalē hōgabēku.
    en: 'One more thing. Stamp duty, the registration fee, the broker''s commission: none of that is covered by the loan. It has to come out of your own pocket.'
  - who: deepa
    t: ಅಂದ್ರೆ ಐವತ್ತು ಲಕ್ಷದ ಸೈಟು ಆದ್ರೆ ಹನ್ನೆರಡೂವರೆ ಲಕ್ಷ ಡೌನ್ ಪೇಮೆಂಟ್, ಜೊತೆಗೆ ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ ಮೂರು-ಮೂರೂವರೆ ಲಕ್ಷ. ಹದಿನೆಂಟರಲ್ಲಿ ಹದಿನಾರು ಹೋಯ್ತು.
    tr: Andre aivattu lakṣada saiṭu ādre hanneraḍūvare lakṣa ḍaun pēmenṭ, jotege sṭyāmp ḍyūṭi mūru-mūrūvare lakṣa. Hadineṇṭaralli hadināru hōytu.
    en: '(quietly) So for a fifty-lakh plot: twelve and a half lakh down payment, plus three to three and a half lakh in stamp duty. Sixteen of our eighteen, gone.'
  - who: ravi
    t: ಮೇಡಂ, ಸೈಟು ತಗೊಂಡ ಮೇಲೆ ಮನೆ ಕಟ್ಟಿಸೋಕೆ ಬೇರೆ ಲೋನ್ ತಗೋಬೇಕಾ?
    tr: Mēḍam, saiṭu tagoṇḍa mēle mane kaṭṭisōke bēre lōn tagōbēkā?
    en: Madam, after we buy the plot, do we need a separate loan to build the house?
  - who: bank
    t: ಬೇಡ. ನಿಮಗೆ ಕಾಂಪೋಸಿಟ್ ಲೋನ್ ಸರಿಯಾಗುತ್ತೆ. ಒಂದೇ ಲೋನ್, ಎರಡು ಭಾಗ. ಮೊದಲು ಸೈಟಿನ ದುಡ್ಡು ನಾವೇ ನೇರವಾಗಿ ಸೆಲ್ಲರ್ ಅಕೌಂಟ್‌ಗೆ ಹಾಕ್ತೀವಿ. ಆಮೇಲೆ ಮನೆ ಕಟ್ಟೋವಾಗ ಸ್ಟೇಜ್ ಪ್ರಕಾರ, ಫೌಂಡೇಶನ್, ಸ್ಲ್ಯಾಬ್, ಫಿನಿಶಿಂಗ್, ಕಂತುಗಳಲ್ಲಿ ರಿಲೀಸ್ ಮಾಡ್ತೀವಿ.
    tr: Bēḍa. Nimage kāmpōsiṭ lōn sariyāgutte. Ondē lōn, eraḍu bhāga. Modalu saiṭina duḍḍu nāvē nēravāgi sellar akauṇṭ-ge hāktīvi. Āmēle mane kaṭṭōvāga sṭēj prakāra, phaunḍēśan, slyāb, phiniśing, kantugaḷalli rilīs māḍtīvi.
    en: 'No. A composite loan would suit you. One loan, two parts. First we pay the plot money directly into the seller''s account. Then, while the house is going up, we release money in instalments stage by stage: foundation, slab, finishing.'
  - who: bank
    t: ಆದ್ರೆ ಒಂದು ಷರತ್ತು ಇದೆ. ಸೈಟು ತಗೊಂಡು ಸುಮಾರು ಮೂರು ವರ್ಷದ ಒಳಗೆ ಮನೆ ಕೆಲಸ ಶುರು ಆಗಬೇಕು. ಮತ್ತೆ, ಮನೆ ಕಟ್ಟಿ ಮುಗಿಯೋವರೆಗೂ ಸೈಟಿನ ಬಡ್ಡಿಗೆ ಟ್ಯಾಕ್ಸ್ ಬೆನಿಫಿಟ್ ಸಿಗಲ್ಲ, ಅದೂ ಗೊತ್ತಿರಲಿ.
    tr: Ādre ondu ṣarattu ide. Saiṭu tagoṇḍu sumāru mūru varṣada oḷage mane kelasa śuru āgabēku. Matte, mane kaṭṭi mugiyōvaregū saiṭina baḍḍige ṭyāks benifiṭ sigalla, adū gottirali.
    en: But there's a condition. Construction has to start within about three years of buying the plot. And you should know that until the house is finished, there's no tax benefit on the plot interest.
  - who: deepa
    t: ಎಷ್ಟು ಲೋನ್ ಕೊಡ್ಬೇಕು ಅಂತ ಹೇಗೆ ಡಿಸೈಡ್ ಮಾಡ್ತೀರಿ? ನಮ್ಮ ಸಂಬಳದ ಮೇಲೇನಾ?
    tr: Eṣṭu lōn koḍbēku anta hēge ḍisaiḍ māḍtīri? Namma sambaḷada mēlēnā?
    en: How do you decide how much to lend us? Is it based on our salaries?
  - who: bank
    t: 'ಹೌದು. ಸಂಬಳ, ವಯಸ್ಸು, ಈಗಾಗಲೇ ಇರೋ ಸಾಲ, ಮತ್ತೆ ಸಿಬಿಲ್ ಸ್ಕೋರ್. ಸಿಬಿಲ್ ಅಂದ್ರೆ ನಿಮ್ಮ ಕ್ರೆಡಿಟ್ ಹಿಸ್ಟರಿ: ಕ್ರೆಡಿಟ್ ಕಾರ್ಡ್ ಬಿಲ್, ಇಎಂಐ ಎಲ್ಲಾ ಟೈಮ್‌ಗೆ ಕಟ್ಟಿದೀರಾ ಇಲ್ವಾ ಅಂತ. ಏಳುನೂರೈವತ್ತರ ಮೇಲೆ ಇದ್ರೆ ಒಳ್ಳೇದು.'
    tr: 'Haudu. Sambaḷa, vayassu, īgāgalē irō sāla, matte Sibil skōr. Sibil andre nimma kreḍiṭ hisṭari: kreḍiṭ kārḍ bil, Ī-Em-Ai ellā ṭaim-ge kaṭṭidīrā ilvā anta. Ēḷunūraivattara mēle idre oḷḷēdu.'
    en: 'Yes. Salary, age, any existing loans, and your CIBIL score. CIBIL is your credit history: whether you''ve paid credit-card bills and EMIs on time. Above seven hundred and fifty is good.'
  - who: bank
    t: ನಿಮ್ಮ ಪ್ಯಾನ್ ಕೊಡಿ, ಚೆಕ್ ಮಾಡ್ತೀನಿ… ರವಿ ಅವರೇ, ನಿಮ್ಮದು ಏಳುನೂರ ಎಂಬತ್ತೆರಡು. ದೀಪಾ ಅವರದು ಏಳುನೂರ ಅರವತ್ತೈದು. ಇಬ್ರದೂ ಚೆನ್ನಾಗಿದೆ.
    tr: Nimma pyān koḍi, chek māḍtīni… Ravi avarē, nimmadu ēḷunūra embatteraḍu. Dīpā avaradu ēḷunūra aravattaidu. Ibradū chennāgide.
    en: Give me your PANs and I'll check… Ravi, yours is seven eighty-two. Deepa, yours is seven sixty-five. Both good.
  - who: ravi
    t: ಹಾಗಾದ್ರೆ ನಮಗೆ ಒಟ್ಟು ಎಷ್ಟು ಸಿಗಬಹುದು?
    tr: Hāgādre namage oṭṭu eṣṭu sigabahudu?
    en: So how much could we get in total?
  - who: bank
    t: ಇಬ್ರ ಸಂಬಳ ಸೇರಿ ಒಂದು ಲಕ್ಷ ನಲವತ್ನಾಲ್ಕು ಸಾವಿರ, ಬೇರೆ ಯಾವ ಇಎಂಐನೂ ಇಲ್ಲ. ಇಪ್ಪತ್ತು ವರ್ಷಕ್ಕೆ ಸುಮಾರು ಎಪ್ಪತ್ತು ಲಕ್ಷದವರೆಗೂ ಎಲಿಜಿಬಿಲಿಟಿ ಬರುತ್ತೆ. ಅಂದ್ರೆ ಸೈಟಿಗೆ ನಲವತ್ತು ಲಕ್ಷದವರೆಗೆ, ಉಳಿದಿದ್ದು ಮನೆಗೆ.
    tr: Ibra sambaḷa sēri ondu lakṣa nalavatnālku sāvira, bēre yāva Ī-Em-Ainū illa. Ippattu varṣakke sumāru eppattu lakṣadavaregū elijibiliṭi barutte. Andre saiṭige nalavattu lakṣadavarege, uḷididdu manege.
    en: Your two salaries together come to one lakh forty-four thousand, with no other EMIs. Over twenty years you're eligible for up to about seventy lakh. That means up to forty lakh for the plot, and the rest for the house.
  - who: deepa
    t: ಎಪ್ಪತ್ತು ಲಕ್ಷ ಪೂರ್ತಿ ತಗೊಂಡ್ರೆ ಇಎಂಐ ಎಷ್ಟು?
    tr: Eppattu lakṣa pūrti tagoṇḍre Ī-Em-Ai eṣṭu?
    en: If we take the full seventy lakh, what's the EMI?
  - who: bank
    t: 'ಈಗಿನ ರೇಟ್‌ನಲ್ಲಿ ಸುಮಾರು ಅರವತ್ತು ಸಾವಿರದ ಏಳುನೂರು. ಆದ್ರೆ ಇದು ಫ್ಲೋಟಿಂಗ್ ರೇಟ್. ಆರ್‌ಬಿಐ ರೆಪೋ ರೇಟ್ ಬದಲಾದ್ರೆ ನಿಮ್ಮ ಬಡ್ಡಿನೂ ಬದಲಾಗುತ್ತೆ. ನನ್ನ ಸಲಹೆ: ಎಲಿಜಿಬಿಲಿಟಿ ಎಷ್ಟಿದೆ ಅನ್ನೋದಕ್ಕಿಂತ, ನೀವು ಆರಾಮಾಗಿ ಎಷ್ಟು ಕಟ್ಟಬಹುದು ಅನ್ನೋದು ಮುಖ್ಯ.'
    tr: 'Īgina rēṭ-nalli sumāru aravattu sāvirada ēḷunūru. Ādre idu phlōṭing rēṭ. Ār-Bi-Ai repō rēṭ badalādre nimma baḍḍinū badalāgutte. Nanna salahe: elijibiliṭi eṣṭide annōdakkinta, nīvu ārāmāgi eṣṭu kaṭṭabahudu annōdu mukhya.'
    en: 'At today''s rate, about sixty thousand seven hundred. But this is a floating rate: if the RBI changes the repo rate, your interest changes too. My advice: what matters isn''t how much you''re eligible for, but how much you can comfortably pay.'
  - who: ravi
    t: ಡಾಕ್ಯುಮೆಂಟ್ಸ್ ಏನೇನು ಬೇಕು, ಮೇಡಂ?
    tr: Ḍākyumenṭs ēnēnu bēku, mēḍam?
    en: What documents do you need, madam?
  - who: bank
    t: ಇಬ್ರದೂ ಆಧಾರ್, ಪ್ಯಾನ್, ಕೊನೆ ಆರು ತಿಂಗಳ ಸ್ಯಾಲರಿ ಸ್ಲಿಪ್, ಬ್ಯಾಂಕ್ ಸ್ಟೇಟ್‌ಮೆಂಟ್, ಎರಡು ವರ್ಷದ ಫಾರ್ಮ್ ಸಿಕ್ಸ್‌ಟೀನ್ ಅಥವಾ ಐಟಿಆರ್. ಸೈಟು ಫೈನಲ್ ಆದ ಮೇಲೆ ಅದರ ಎಲ್ಲಾ ದಾಖಲೆಗಳು. ನಮ್ಮ ಲಾಯರ್ ಲೀಗಲ್ ವೆರಿಫಿಕೇಶನ್ ಮಾಡ್ತಾರೆ, ನಮ್ಮ ಎಂಜಿನಿಯರ್ ಬಂದು ಸೈಟು ನೋಡ್ತಾರೆ.
    tr: Ibradū Ādhār, Pyān, kone āru tingaḷa syālari slip, byānk sṭēṭmenṭ, eraḍu varṣada phārm siksṭīn athavā Ai-Ṭi-Ār. Saiṭu phainal āda mēle adara ellā dākhalegaḷu. Namma lāyar līgal verifikēśan māḍtāre, namma enjiniyar bandu saiṭu nōḍtāre.
    en: Aadhaar and PAN for both of you, the last six months' salary slips, bank statements, and two years of Form 16 or income-tax returns. Once the plot is final, all its documents. Our lawyer does the legal verification, and our engineer comes to inspect the site.
  - who: bank
    t: ಒಂದು ಸಲಹೆ, ಸಾರ್. ಯಾವ ಸೈಟಿಗೂ ಅಡ್ವಾನ್ಸ್ ಕೊಡೋ ಮುಂಚೆ ದಾಖಲೆಗಳ ಕಾಪಿ ನಮಗೆ ತೋರಿಸಿ. ಆಮೇಲೆ ಲೋನ್ ಸಿಗಲ್ಲ ಅಂದ್ರೆ ಅಡ್ವಾನ್ಸ್ ವಾಪಸ್ ಬರೋದು ಕಷ್ಟ.
    tr: Ondu salahe, sār. Yāva saiṭigū aḍvāns koḍō munche dākhalegaḷa kāpi namage tōrisi. Āmēle lōn sigalla andre aḍvāns vāpas barōdu kaṣṭa.
    en: One piece of advice, sir. Before you pay an advance on any plot, show us copies of the documents. If the loan falls through later, getting the advance back is hard.
  - who: ravi
    t: ತುಂಬಾ ಉಪಕಾರ ಆಯ್ತು, ಮೇಡಂ. ಸೈಟು ನೋಡಿ ಬರ್ತೀವಿ.
    tr: Tumbā upakāra āytu, mēḍam. Saiṭu nōḍi bartīvi.
    en: That's been a great help, madam. We'll go and look at plots and come back.
  - scene: Outside on the pavement, in the noise of the Vijayanagar traffic.
  - who: deepa
    t: ಅರವತ್ತು ಸಾವಿರ ಇಎಂಐ, ಜೊತೆಗೆ ಇಪ್ಪತ್ತೆರಡು ಸಾವಿರ ಬಾಡಿಗೆ… ಮನೆ ಮುಗಿಯೋವರೆಗೂ ಹೊರಗೆ ಊಟ, ಸಿನಿಮಾ ಎಲ್ಲಾ ಮರೆತುಬಿಡಬೇಕು.
    tr: Aravattu sāvira Ī-Em-Ai, jotege ippatteraḍu sāvira bāḍige… mane mugiyōvaregū horage ūṭa, sinimā ellā maretubiḍabēku.
    en: Sixty thousand in EMI, plus twenty-two thousand in rent… until the house is finished, we can forget about eating out, films, all of it.
  - who: ravi
    t: ಮೊದಲ ದಿನದಿಂದಲೇ ಪೂರ್ತಿ ಅರವತ್ತು ಅಲ್ಲ. ಬ್ಯಾಂಕ್ ಎಷ್ಟು ರಿಲೀಸ್ ಮಾಡುತ್ತೋ ಅಷ್ಟಕ್ಕೆ ಮಾತ್ರ ಬಡ್ಡಿ. ಆದ್ರೂ… ಹೌದು, ಕೆಲವು ವರ್ಷ ಟೈಟ್ ಆಗುತ್ತೆ.
    tr: Modala dinadindalē pūrti aravattu alla. Byānk eṣṭu rilīs māḍuttō aṣṭakke mātra baḍḍi. Ādrū… haudu, kelavu varṣa ṭaiṭ āgutte.
    en: Not the full sixty from day one. We only pay interest on what the bank has released. Still… yes, things will be tight for a few years.
  - who: deepa
    t: ಟೈಟ್ ಆದ್ರೂ ಪರವಾಗಿಲ್ಲ. ನಮ್ಮ ಮನೆ ಅಂದ್ರೆ ನಮ್ಮ ಮನೆ.
    tr: Ṭaiṭ ādrū paravāgilla. Namma mane andre namma mane.
    en: Tight is fine. Our own house is our own house.
