  - who: ravi
    t: ಆಗಿದೆ ಸಾರ್. ಇದು ಬಿಬಿಎಂಪಿ ಸ್ಯಾಂಕ್ಷನ್ ಕಾಪಿ — ಸ್ಟಿಲ್ಟ್ ಪ್ಲಸ್ ಗ್ರೌಂಡ್ ಪ್ಲಸ್ ಟು. ಜೊತೆಗೆ ಸೇಲ್ ಡೀಡ್, ಇ-ಖಾತಾ, ಟ್ಯಾಕ್ಸ್ ರಸೀದಿ, ಆಧಾರ್ ಎಲ್ಲಾ ತಂದಿದೀನಿ.
    tr: Āgide sār. Idu BBMP syāṅkṣan kāpi — sṭilṭ plas graunḍ plas ṭu. Jotege sēl ḍīḍ, i-khātā, ṭyāks rasīdi, Ādhār ellā tandidīni.
