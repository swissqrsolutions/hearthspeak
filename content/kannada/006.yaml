lines:
  - chapter: Chapter 1 — The group chat wakes up
  - section: Six in one room, two on the phone
    learn: 'reunion talk: eṣṭu varṣa āytu, gurtē sikkalla, ēn samāchāra · mock-honorifics between friends: ḍākṭru sāhēbru, mēḍam avru · speakerphone: kēḷistā?, kaṭ āytu · four accents in one minute: ಉಂಟು (coast), ಐತಿ (north), -ರಿ (Dharwad), ಯಪ್ಪಾ (Kalaburagi)'
  - scene: Saturday, 28 November 2026, 8:30 at night. Arjun's flat in Jayanagar 4th Block, Bengaluru. Takeaway boxes from a darshini cover the low table. Arjun, Shruti, Deepa, Ramya, Kaveri and Prakash, who is in Bengaluru for a week of teacher training, sit on the floor around a phone. Naveen in Udupi and Imran in Kalaburagi are on speaker.
  - who: arjun
    t: ಸರಿ, ಎಲ್ರೂ ಇದೀರಾ? ನವೀನ್, ಇಮ್ರಾನ್, ಸ್ಪೀಕರ್ ಆನ್ ಇದೆ. ಕೇಳಿಸ್ತಿದ್ಯಾ ಮಗಾ?
    tr: Sari, ellrū idīrā? Navīn, Imrān, spīkar ān ide. Kēḷistidyā magā?
    en: Right, is everyone here? Naveen, Imran, you're on speaker. Can you hear us, guys?
  - who: naveen
    t: ಕೇಳ್ತದೆ ಮಾರಾಯ, ಜೋರಾಗೇ ಕೇಳ್ತದೆ. ಇಲ್ಲಿ ಹೋಟೆಲ್ ಕೌಂಟರ್‌ನಲ್ಲಿ ಉಂಟು ನಾನು, ಗಿರಾಕಿಗಳೆಲ್ಲ ನನ್ನನ್ನೇ ನೋಡ್ತಾ ಉಂಟು.
    tr: Kēḷtade mārāya, jōrāgē kēḷtade. Illi hōṭel kauṇṭar-nalli uṇṭu nānu, girākigaḷella nannannē nōḍtā uṇṭu.
    en: I can hear you, maraya, loud and clear. I'm at the hotel counter here, and all the customers are staring at me.
  - who: imran
    t: ನಂಗೂ ಕೇಳಾಕತ್ತೈತಿ ಯಪ್ಪಾ. ಆದ್ರ ಹತ್ತು ನಿಮಿಷ ಅಷ್ಟೇ. ಕ್ಯಾಶುವಾಲ್ಟಿಯಿಂದ ಕರೆ ಬಂದ್ರ ಓಡ್ಬೇಕು, ನೈಟ್ ಡ್ಯೂಟಿ ಐತಿ.
    tr: Naṅgū kēḷākattaiti yappā. Ādra hattu nimiṣa aṣṭē. Kyāśuvālṭiyinda kare bandra ōḍbēku, naiṭ ḍyūṭi aiti.
    en: I can hear you too, yappa. But ten minutes, that's all. If casualty calls, I have to run. I'm on night duty.
  - who: ramya
    t: ಡಾಕ್ಟ್ರು ಸಾಹೇಬ್ರು ನಮಗೆ ಹತ್ತು ನಿಮಿಷ ಕೊಟ್ರಲ್ಲಾ, ಅದೇ ಬ್ರೇಕಿಂಗ್ ನ್ಯೂಸ್! ನಾನು ರೆಕಾರ್ಡ್ ಮಾಡ್ತಿದೀನಿ, ಎಲ್ರೂ ಕ್ಯಾಮೆರಾ ನೋಡಿ ಕೈ ಬೀಸಿ.
    tr: Ḍākṭru sāhēbru namage hattu nimiṣa koṭrallā, adē brēkiṅg nyūs! Nānu rekārḍ māḍtidīni, ellrū kyāmerā nōḍi kai bīsi.
    en: The Doctor Sahib has granted us ten whole minutes — that's the breaking news! I'm recording; everyone look at the camera and wave.
  - who: kaveri
    t: ರಮ್ಯಾ, ಊಟದ ಡಬ್ಬಗಳ ಮುಂದೆ ಕ್ಯಾಮೆರಾ ಬೇಡ, ಪ್ಲೀಸ್. ಮೊದಲು ವಿಷಯಕ್ಕೆ ಬರೋಣ. ಅರ್ಜುನ್, ಎಂಟು ವರ್ಷದಿಂದ ಸತ್ತು ಬಿದ್ದಿದ್ದ ಗ್ರೂಪ್‌ಗೆ ಒಂದು ರಾತ್ರಿ ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಮೆಸೇಜ್ ಹಾಕಿದ್ದು ಯಾಕೆ?
    tr: Ramyā, ūṭada ḍabbagaḷa munde kyāmerā bēḍa, plīs. Modalu viṣayakke barōṇa. Arjun, eṇṭu varṣadinda sattu biddidda grūp-ge ondu rātri iddakkiddante mesēj hākiddu yāke?
    en: Ramya, no camera in front of the food boxes, please. Let's get to the point first. Arjun, why did you suddenly message a group that's been dead for eight years, one random night?
  - who: arjun
    t: ಯಾಕೆ ಅಂದ್ರೆ… ಸುಮ್ನೆ. ಕಾಲೇಜಿಗೆ ಸೇರಿ ಹದಿನಾರು ವರ್ಷ ಆಯ್ತು. ಈಗ ಎಲ್ರಿಗೂ ಮೂವತ್ನಾಲ್ಕು. ಇನ್ನೂ ಕಾದ್ರೆ ನಾವು ಮತ್ತೆ ಸಿಗೋದು ಯಾರದೋ ಮದುವೆಯಲ್ಲಿ, ಇಲ್ಲಾಂದ್ರೆ ಯಾರದೋ ಸಾವಲ್ಲಿ. ಅದು ಬೇಡ ಅನ್ನಿಸ್ತು.
    tr: Yāke andre… sumne. Kālējige sēri hadināru varṣa āytu. Īga ellrigū mūvatnālku. Innū kādre nāvu matte sigōdu yāradō maduveyalli, illāndre yāradō sāvalli. Adu bēḍa annistu.
    en: Why… just like that. It's sixteen years since we joined college. Everyone's thirty-four now. If we wait any longer, the next time we meet will be at somebody's wedding, or somebody's funeral. I didn't want that.
  - who: shruti
    t: ಓಹೋ, ಅರ್ಜುನ್ ರಾವ್ ಫಿಲಾಸಫಿ ಶುರು ಮಾಡಿದ್ರು. ಸ್ಟಾರ್ಟಪ್ ಫೌಂಡರ್ ಅವರಿಗೆ ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಹಳೆ ಗೆಳೆಯರ ನೆನಪಾಯ್ತು ನೋಡಿ.
    tr: Ōhō, Arjun Rāv philāsaphi śuru māḍidru. Sṭārṭap phauṇḍar avarige iddakkiddante haḷe geḷeyara nenapāytu nōḍi.
    en: Oho, Arjun Rao has started philosophising. Look at that — the startup founder suddenly remembered his old friends.
  - who: arjun
    t: ಶ್ರುತಿ, ಪ್ಲೀಸ್. ಇವತ್ತು ಕಾಲು ಎಳೀಬೇಡ. ಒಂದ್ಸಲ ಸೀರಿಯಸ್ಸಾಗಿ ಹೇಳ್ತಿದೀನಿ.
    tr: Śruti, plīs. Ivattu kālu eḷībēḍa. Ondsala sīriyassāgi hēḷtidīni.
    en: Shruti, please. Don't pull my leg tonight. For once I'm saying something seriously.
  - who: prakash
    t: ಖರೇ ಹೇಳಿದ್ರಿ ಅರ್ಜುನ್. ನಾನು ಧಾರವಾಡದಿಂದ ಟ್ರೇನಿಂಗ್‌ಗೆ ಬಂದೇನಿ ಅಂತ ಗ್ರೂಪ್‌ನಲ್ಲಿ ಹಾಕಿದಾಗ ಯಾರೂ ಉತ್ತರ ಕೊಟ್ಟಿರ್ಲಿಲ್ಲ. ನೀವು ಮೆಸೇಜ್ ಹಾಕಿದ ಕೂಡ್ಲೇ ಐವತ್ತು ರಿಪ್ಲೈ ಬಂದ್ವು.
    tr: Kharē hēḷidri Arjun. Nānu Dhāravāḍadinda ṭrēniṅg-ge bandēni anta grūp-nalli hākidāga yārū uttara koṭṭirlilla. Nīvu mesēj hākida kūḍlē aivattu riplai bandvu.
    en: That's true, Arjun. When I posted in the group that I'd come from Dharwad for a training, nobody replied. The moment you posted, fifty replies came in.
  - who: deepa
    t: ಅಯ್ಯೋ ಪ್ರಕಾಶ್, ಬೇಜಾರು ಮಾಡ್ಕೋಬೇಡ ಕಣೋ. ಆ ಗ್ರೂಪ್ ಮ್ಯೂಟ್‌ನಲ್ಲಿತ್ತು ಅಷ್ಟೇ. ನಿನ್ ಮೆಸೇಜ್ ನಾನು ನೋಡಿದ್ದೆ, ಉತ್ತರ ಕೊಡೋಕೆ ಮರೆತುಹೋಯ್ತು.
    tr: Ayyō Prakāś, bējāru māḍkōbēḍa kaṇō. Ā grūp myūṭ-nallittu aṣṭē. Nin mesēj nānu nōḍidde, uttara koḍōke maretuhōytu.
    en: Oh, Prakash, don't feel bad. The group was on mute, that's all. I did see your message; I just forgot to reply.
  - who: prakash
    t: ಆತು ಬಿಡ್ರಿ ದೀಪಾ. ಹಂಗೇನಿಲ್ಲ. ಬೆಂಗಳೂರಿನ ಜನ ಭಾಳ ಬ್ಯುಸಿ, ಗೊತ್ತೈತಿ.
    tr: Ātu biḍri Dīpā. Haṅgēnilla. Beṅgaḷūrina jana bhāḷa byusi, gottaiti.
    en: Never mind, Deepa. It's nothing. Bengaluru people are very busy, I know.
  - section: Dates, leave, kids and money
    learn: 'planning: plyān phiks māḍōṇa, rajā sikkalla, aḍjast māḍtīni · conditionals: rajā sikkidre bartīni, maḷe bandrū hōgōṇa · sharing costs: kharcu hañcikoḷḷōṇa, peṭrōl, ṭōl, hōmsṭē · a hint of edge: ninna hatra duḍḍu jāsti uṇṭalvā?'
  - scene: 'Arjun opens a map on the television. A route is drawn in red: Bengaluru, Chitradurga, Hampi, Dharwad, Gokarna, and back.'
  - who: arjun
    t: ನೋಡಿ, ಪ್ಲ್ಯಾನ್ ಇದು. ಡಿಸೆಂಬರ್ ನಾಲ್ಕು ಶುಕ್ರವಾರ ಬೆಳಗ್ಗೆ ಹೊರಡೋದು. ಚಿತ್ರದುರ್ಗ, ಹಂಪಿ, ಧಾರವಾಡ, ಗೋಕರ್ಣ. ಒಂಬತ್ತನೇ ತಾರೀಖು ರಾತ್ರಿ ವಾಪಸ್. ಆರು ದಿನ, ಸುಮಾರು ಸಾವಿರದ ಮುನ್ನೂರು ಕಿಲೋಮೀಟರ್.
    tr: Nōḍi, plyān idu. Ḍisembar nālku śukravāra beḷagge horaḍōdu. Chitradurga, Hampi, Dhāravāḍa, Gōkarṇa. Ombattanē tārīkhu rātri vāpas. Āru dina, sumāru sāvirada munnūru kilōmīṭar.
    en: Look, here's the plan. We leave on Friday morning, the fourth of December. Chitradurga, Hampi, Dharwad, Gokarna. Back on the night of the ninth. Six days, about thirteen hundred kilometres.
  - who: imran
    t: ಆರು ದಿನ? ಯಪ್ಪಾ, ನಮ್ ಡಿಸ್ಟ್ರಿಕ್ಟ್ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಆರು ಗಂಟೆ ರಜೆ ಸಿಗೋದೇ ಕಷ್ಟ. ಡಿಸ್ಟ್ರಿಕ್ಟ್ ಸರ್ಜನ್ ಹತ್ರ ಅರ್ಜಿ ಹಾಕ್ಬೇಕು, ಬದಲಿ ಡಾಕ್ಟರ್ ಹುಡುಕ್ಬೇಕು. ಈ ಚಳಿಗಾಲದಾಗ ಜ್ವರದ ಕೇಸ್ ಭಾಳ ಅದಾವು.
    tr: Āru dina? Yappā, nam ḍisṭrikṭ āspatreyalli āru gaṇṭe raje sigōdē kaṣṭa. Ḍisṭrikṭ sarjan hatra arji hākbēku, badali ḍākṭar huḍukbēku. Ī chaḷigāladāga jvarada kēs bhāḷa adāvu.
    en: Six days? Yappa, in our district hospital even six hours off is hard to get. I'd have to apply to the District Surgeon and find a doctor to cover for me. This winter there are lots of fever cases.
  - who: kaveri
    t: ಇಮ್ರಾನ್, ಕಳೆದ ವರ್ಷ ನೀನು ಎಷ್ಟು ದಿನ ರಜೆ ತಗೊಂಡೆ? ನಿಜ ಹೇಳು.
    tr: Imrān, kaḷeda varṣa nīnu eṣṭu dina raje tagoṇḍe? Nija hēḷu.
    en: Imran, how many days of leave did you take last year? Tell the truth.
  - who: imran
    t: ನಿಜ ಹೇಳ್ಲಾ? ಎರಡು ದಿನ. ಅದೂ ನಮ್ ಅಬ್ಬಾಜಾನ್ ಆಪರೇಷನ್‌ಗೆ.
    tr: Nija hēḷlā? Eraḍu dina. Adū nam abbājān āparēṣan-ge.
    en: The truth? Two days. And that was for my father's operation.
  - who: kaveri
    t: ಹಾಗಾದ್ರೆ ಇದು ರಜೆ ಅಲ್ಲ, ಚಿಕಿತ್ಸೆ. ಡಾಕ್ಟರ್‌ಗೂ ಒಬ್ಬ ಡಾಕ್ಟರ್ ಬೇಕು. ಅರ್ಜಿ ನಾಳೆನೇ ಹಾಕು. ಬೇಕಿದ್ರೆ ನಾನೇ ಡ್ರಾಫ್ಟ್ ಮಾಡಿ ಕೊಡ್ತೀನಿ.
    tr: Hāgādre idu raje alla, chikitse. Ḍākṭar-gū obba ḍākṭar bēku. Arji nāḷenē hāku. Bēkidre nānē ḍrāphṭ māḍi koḍtīni.
    en: Then this isn't leave, it's treatment. Even a doctor needs a doctor. Put in the application tomorrow itself. If you want, I'll draft it for you.
  - who: imran
    t: ವಕೀಲರು ಅರ್ಜಿ ಬರೆದ್ರ ಸರ್ಜನ್ ಸಾಹೇಬ್ರು ಹೆದರಿ ರಜೆ ಕೊಡ್ತಾರ ನೋಡು! ಆತು, ಪ್ರಯತ್ನ ಮಾಡ್ತೇನಿ. ಫಿಕರ್ ಮಾಡಬ್ಯಾಡ್ರಿ.
    tr: Vakīlaru arji baredra sarjan sāhēbru hedari raje koḍtāra nōḍu! Ātu, prayatna māḍtēni. Phikar māḍabyāḍri.
    en: If a lawyer writes the application, the Surgeon Sahib will get scared and grant the leave, you'll see! All right, I'll try. Don't worry.
  - who: shruti
    t: ನನ್ ಕಥೆ ಬೇರೆ. ಆದ್ಯಾಗೆ ಏಳು ವರ್ಷ, ಇಶಾನ್‌ಗೆ ನಾಲ್ಕು. ವಿಕ್ರಮ್ ಹತ್ರ ಮಾತಾಡಿದೆ. ಅವರು ಮನೆಯಿಂದ ಕೆಲಸ ಮಾಡ್ತಾರಂತೆ, ಅತ್ತೆ ಮಲ್ಲೇಶ್ವರಕ್ಕೆ ಬರ್ತಾರೆ. ಆರು ವರ್ಷದಲ್ಲಿ ಇದೇ ಮೊದಲ ಸಲ ನಾನು ಮಕ್ಕಳಿಲ್ಲದೆ ಎಲ್ಲಾದ್ರೂ ಹೋಗ್ತಿರೋದು.
    tr: Nan kathe bēre. Ādyāge ēḷu varṣa, Iśān-ge nālku. Vikram hatra mātāḍide. Avaru maneyinda kelasa māḍtārante, atte Mallēśvarakke bartāre. Āru varṣadalli idē modala sala nānu makkaḷillade ellādrū hōgtirōdu.
    en: My story is different. Aadya is seven, Ishaan is four. I talked to Vikram. He says he'll work from home, and my mother-in-law is coming over to Malleshwaram. In six years this is the first time I'm going anywhere without the kids.
  - who: deepa
    t: ಸೂಪರ್ ಕಣೇ ಶ್ರುತಿ. ನೀನು ಅದಕ್ಕೆ ಅರ್ಹಳು. ನಂಗೆ ಏನೂ ಪ್ರಾಬ್ಲಮ್ ಇಲ್ಲ, ಲ್ಯಾಪ್‌ಟಾಪ್ ತಗೊಂಡ್ ಬರ್ತೀನಿ. ಎಲ್ಲಿಂದ ಬೇಕಾದ್ರೂ ಕೆಲಸ ಮಾಡ್ಬೋದು.
    tr: Sūpar kaṇē Śruti. Nīnu adakke arhaḷu. Naṅge ēnū prābḷam illa, lyāp-ṭāp tagoṇḍ bartīni. Ellinda bēkādrū kelasa māḍbōdu.
    en: Super, Shruti. You deserve it. No problem for me, I'll bring my laptop. I can work from anywhere.
  - who: ramya
    t: ದೀಪಾ, ರೋಹಿತ್ ಬರಲ್ವಾ? ಕಳೆದ ಸಲ ಅವನು ನಮ್ ಜೊತೆ ಕೂರ್ಗ್‌ಗೆ ಬಂದಿದ್ದ ಅಲ್ವಾ?
    tr: Dīpā, Rōhit baralvā? Kaḷeda sala avanu nam jote Kūrg-ge bandidda alvā?
    en: Deepa, isn't Rohit coming? Last time he came with us to Coorg, didn't he?
  - who: deepa
    t: ಅವನಿಗೆ… ಕೆಲಸ ಇದೆ. ಈ ಸಲ ಬರೋಕಾಗಲ್ಲ. ಅದನ್ನ ಬಿಡು, ಊಟ ಮುಂದೆ ಬರ್ಲಿ.
    tr: Avanige… kelasa ide. Ī sala barōkāgalla. Adanna biḍu, ūṭa munde barli.
    en: He's… got work. He can't come this time. Leave that — pass the food over.
  - scene: Shruti and Kaveri glance at each other. Nobody asks again.
  - who: naveen
    t: ಸರಿ, ಈಗ ದುಡ್ಡಿನ ವಿಷಯ. ಹೋಮ್‌ಸ್ಟೇ, ಪೆಟ್ರೋಲ್, ಟೋಲ್, ಊಟ. ಎಂಟು ಜನ. ಎಲ್ಲಾ ಸಮಾನವಾಗಿ ಹಂಚ್ಕೊಳ್ಳುವ. ಒಬ್ಬರಿಗೆ ಹದಿನೈದು ಸಾವಿರ ಆಗಬಹುದು ಅಂತ ನನ್ನ ಲೆಕ್ಕ.
    tr: Sari, īga duḍḍina viṣaya. Hōmsṭē, peṭrōl, ṭōl, ūṭa. Eṇṭu jana. Ellā samānavāgi hañchkoḷḷuva. Obbarige hadinaidu sāvira āgabahudu anta nanna lekka.
    en: Right, now the money. Homestays, petrol, tolls, food. Eight people. Let's split everything equally. My estimate is it'll come to about fifteen thousand each.
  - who: arjun
    t: ಏನ್ ಮಗಾ, ಹದಿನೈದು ಸಾವಿರಕ್ಕೆ ಲೆಕ್ಕ ಯಾಕೆ? ಹೋಮ್‌ಸ್ಟೇ ಎಲ್ಲಾ ನಾನೇ ಬುಕ್ ಮಾಡ್ತೀನಿ, ಕಂಪನಿ ಕಾರ್ಡ್‌ನಲ್ಲಿ. ನೀವು ಸುಮ್ನೆ ಬನ್ನಿ.
    tr: Ēn magā, hadinaidu sāvirakke lekka yāke? Hōmsṭē ellā nānē buk māḍtīni, kampani kārḍ-nalli. Nīvu sumne banni.
    en: Come on, maga, why bother with accounts over fifteen thousand? I'll book all the homestays myself, on the company card. You lot just come.
  - who: naveen
    t: ಕಂಪನಿ ಕಾರ್ಡ್ ಉಂಟಾ? ಓಹೋ. ಬೇಡ ಮಾರಾಯ. ಎಲ್ಲರೂ ಅವರವರ ಪಾಲು ಕೊಡುವ. ಲೆಕ್ಕ ಸರಿ ಇದ್ರೆ ಸ್ನೇಹ ಸರಿ ಇರ್ತದೆ.
    tr: Kampani kārḍ uṇṭā? Ōhō. Bēḍa mārāya. Ellarū avaravara pālu koḍuva. Lekka sari idre snēha sari irtade.
    en: There's a company card, is there? Oho. No, maraya. Let everyone pay their own share. When the accounts are straight, the friendship stays straight.
  - who: ramya
    t: ಅದು ಉಡುಪಿ ಹೋಟೆಲ್ ಮಾಲೀಕನ ಫಿಲಾಸಫಿ. ಕ್ಯಾಶ್ ಕೌಂಟರ್‌ನಿಂದಲೇ ಬಂದಿದೆ!
    tr: Adu Uḍupi hōṭel mālīkana philāsaphi. Kyāś kauṇṭar-nindalē bandide!
    en: That's an Udupi hotel owner's philosophy. Straight from the cash counter!
  - who: arjun
    t: ಸರಿ ಸರಿ, ನವೀನ್ ಹೇಳಿದ ಹಾಗೇ ಆಗ್ಲಿ. ನಾನು ಒಂದು ಸ್ಪ್ಲಿಟ್ ಆ್ಯಪ್‌ನಲ್ಲಿ ಗ್ರೂಪ್ ಮಾಡ್ತೀನಿ. ಯಾರು ಏನು ಖರ್ಚು ಮಾಡಿದ್ರೂ ಅಲ್ಲಿ ಹಾಕಿ.
    tr: Sari sari, Navīn hēḷida hāgē āgli. Nānu ondu split āyp-nalli grūp māḍtīni. Yāru ēnu kharchu māḍidrū alli hāki.
    en: Fine, fine, let it be as Naveen says. I'll make a group on a bill-splitting app. Whoever spends anything, put it in there.
  - who: kaveri
    t: ನಾನು ಹೈಕೋರ್ಟ್‌ನಲ್ಲಿ ಮೂರು ಮ್ಯಾಟರ್‌ಗಳನ್ನ ಜೂನಿಯರ್‌ಗೆ ಕೊಡ್ಬೇಕು. ಆದ್ರೆ ಬರ್ತೀನಿ. ನಮ್ಮ ಐನ್ ಮನೆಯಲ್ಲಿ ಪುತ್ತರಿ ಹತ್ರ ಬರ್ತಿದೆ, ಅಮ್ಮ ಕೋಪ ಮಾಡ್ಕೊಳ್ತಾರೆ. ಅದನ್ನ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ.
    tr: Nānu Haikōrṭ-nalli mūru myāṭar-gaḷanna jūniyar-ge koḍbēku. Ādre bartīni. Namma ain maneyalli Puttari hatra bartide, amma kōpa māḍkoḷtāre. Adanna nānu nōḍkoḷtīni.
    en: I'll have to hand three High Court matters to my junior. But I'll come. Puttari is coming up at our ancestral house, and Amma will be cross. I'll handle that.
  - section: Where life has taken us
    learn: 'catching up: ēn samāchāra?, kelasa hēgide?, innū alliyē idīya? · tech talk in Kanglish: lē-āph, ṭīm kaṭ, e-ai ējeṇṭs, phaṇḍiṅg, ranvē · hospital talk: ōpi-ḍi, ḍyūṭi, iṁṭarn illa · putting a brave face on: ellā sūpar, nō ṭeṇṣan'
  - who: kaveri
    t: ಸರಿ, ಪ್ಲ್ಯಾನ್ ಆಯ್ತು. ಈಗ ನಿಜವಾದ ಸಮಾಚಾರ. ಇಮ್ರಾನ್, ಆಸ್ಪತ್ರೆ ಹೇಗಿದೆ? ಕಳೆದ ಸಲ ಫೋನ್‌ನಲ್ಲಿ ನೀನು ತುಂಬಾ ಸುಸ್ತಾಗಿದ್ದ ಹಾಗೆ ಕೇಳಿಸ್ತಿತ್ತು.
    tr: Sari, plyān āytu. Īga nijavāda samāchāra. Imrān, āspatre hēgide? Kaḷeda sala phōn-nalli nīnu tumbā sustāgidda hāge kēḷistittu.
    en: Right, the plan's done. Now the real news. Imran, how's the hospital? Last time on the phone you sounded very tired.
  - who: imran
    t: ಹ್ಯಾಂಗ ಹೇಳ್ಲಿ? ದಿನಾ ಮುನ್ನೂರು ಓಪಿಡಿ ಪೇಷಂಟ್. ಡಾಕ್ಟರ್‌ಗಳು ನಾಲ್ಕು ಜನ, ಬೇಕಾಗಿದ್ದು ಹತ್ತು. ಆರಾಮ ಅದೇನಿ ಅಂತ ಹೇಳತೇನಿ, ಆದ್ರ ಅದು ಪೂರ್ತಿ ಖರೇ ಅಲ್ಲ. ಅದನ್ನ ಟ್ರಿಪ್‌ನಾಗ ಮಾತಾಡೋಣು.
    tr: Hyāṅga hēḷli? Dinā munnūru ō-pi-ḍi pēṣaṇṭ. Ḍākṭar-gaḷu nālku jana, bēkāgiddu hattu. Ārāma adēni anta hēḷatēni, ādra adu pūrti kharē alla. Adanna ṭrip-nāga mātāḍōṇu.
    en: How do I put it? Three hundred outpatients a day. Four doctors, when ten are needed. I say I'm fine, but that's not entirely true. Let's talk about it on the trip.
  - who: deepa
    t: ನಮ್ ಕಂಪನಿಯಲ್ಲಿ ಉಲ್ಟಾ. ಕೆಲಸ ಕಡಿಮೆ, ಭಯ ಜಾಸ್ತಿ. ಈ ವರ್ಷ ಎರಡು ಸಲ ಲೇಆಫ್ ಆಯ್ತು. ನನ್ನ ಟೀಮ್‌ನಲ್ಲಿ ಹನ್ನೆರಡು ಜನ ಇದ್ರು, ಈಗ ಐದು. ಉಳಿದ ಕೆಲಸ ಎಐ ಏಜೆಂಟ್ಸ್ ಮಾಡ್ತಾವೆ ಅಂತ ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್ ಹೇಳುತ್ತೆ.
    tr: Nam kampaniyalli ulṭā. Kelasa kaḍime, bhaya jāsti. Ī varṣa eraḍu sala lē-āph āytu. Nanna ṭīm-nalli hanneraḍu jana idru, īga aidu. Uḷida kelasa e-ai ējeṇṭs māḍtāve anta myānēj-meṇṭ hēḷutte.
    en: In my company it's the opposite. Less work, more fear. There were two rounds of layoffs this year. My team had twelve people; now it's five. Management says AI agents will do the rest of the work.
  - who: ramya
    t: ನಮ್ ಚಾನೆಲ್‌ನಲ್ಲೂ ಅದೇ ಕಥೆ. ಈಗ ಸುದ್ದಿಗಿಂತ ‘ವ್ಯೂಸ್’ ಮುಖ್ಯ. ಅದು ಬಿಡಿ. ಅರ್ಜುನ್, ನಿನ್ ಸ್ಟಾರ್ಟಪ್ ಹೇಗಿದೆ? ಜುಲೈನಲ್ಲಿ ಅರವತ್ತರಲ್ಲಿ ಮೂವತ್ತೇಳು ಜನರನ್ನ ತೆಗೆದ್ರಿ ಅಂತ ಲಿಂಕ್ಡ್‌ಇನ್‌ನಲ್ಲಿ ನೋಡಿದ್ದೆ.
    tr: Nam chānel-nallū adē kathe. Īga suddiginta ‘vyūs’ mukhya. Adu biḍi. Arjun, nin sṭārṭap hēgide? Julainalli aravattaralli mūvattēḷu janaranna tegedri anta Liṅkḍ-in-nalli nōḍidde.
    en: Same story in our channel. Now ‘views’ matter more than news. Never mind that. Arjun, how's your startup? I saw on LinkedIn that in July you let thirty-seven of your sixty people go.
  - who: arjun
    t: ಹೂಂ, ಅದು ಕಷ್ಟದ ತೀರ್ಮಾನ. ಬರ್ನ್ ರೇಟ್ ಕಡಿಮೆ ಮಾಡ್ಬೇಕಿತ್ತು. ಈಗ ಎಲ್ಲಾ ಕಂಟ್ರೋಲ್‌ನಲ್ಲಿದೆ. ಹೊಸ ಫಂಡಿಂಗ್ ಮಾತುಕತೆ ನಡೀತಿದೆ. ನೋ ಟೆನ್ಷನ್.
    tr: Hūṁ, adu kaṣṭada tīrmāna. Barn rēṭ kaḍime māḍbēkittu. Īga ellā kaṇṭrōl-nallide. Hosa phaṇḍiṅg mātukate naḍītide. Nō ṭenṣan.
    en: Mm, that was a hard decision. We had to cut the burn rate. Everything's under control now. New funding talks are on. No tension.
  - who: naveen
    t: ‘ನೋ ಟೆನ್ಷನ್’. ಒಳ್ಳೆದು ಮಾರಾಯ. ಕೇಳಿ ಖುಷಿ ಆಯ್ತು.
    tr: ‘Nō ṭenṣan’. Oḷḷedu mārāya. Kēḷi khuṣi āytu.
    en: ‘No tension.’ Good, maraya. Glad to hear it.
  - scene: Something in Naveen's voice makes Kaveri look up from her plate. Arjun is already talking about something else.
  - section: Slang, then and now
    learn: '2010 slang: sakkat, bombāṭ, chindi, kirik, sīn illa, buruḍe biḍu · 2026 words in Kannada script: vaib, krinj, ḍelulu · teasing age: aṅkal āgbiṭṭe, hoṭṭe nōḍu, hattu gaṇṭege nidde · emphatic -ē and -ū: nīnē hēḷde!, nānū bartīni'
  - who: ramya
    t: ಒಂದು ನಿಮಿಷ. ನೆನಪಿದ್ಯಾ, ಕಾಲೇಜಲ್ಲಿ ನಾವು ಪ್ರತಿ ಮಾತಿಗೂ ‘ಸಕ್ಕತ್’, ‘ಬೊಂಬಾಟ್’, ‘ಚಿಂದಿ’ ಅಂತಿದ್ವಿ. ಕ್ಯಾಂಟೀನ್ ಸಮೋಸ ಕೂಡ ಚಿಂದಿ!
    tr: Ondu nimiṣa. Nenapidyā, kālējalli nāvu prati mātigū ‘sakkat’, ‘bombāṭ’, ‘chindi’ antidvi. Kyāṇṭīn samōsa kūḍa chindi!
    en: One minute. Remember how in college we said ‘sakkat’, ‘bombaat’, ‘chindi’ about everything? Even the canteen samosa was ‘chindi’!
  - who: shruti
    t: ಈಗ ನನ್ ಮಗಳು ಎಲ್ಲದಕ್ಕೂ ‘ವೈಬ್’ ಅಂತಾಳೆ. ಏಳು ವರ್ಷದ ಹುಡುಗಿ, ‘ಅಮ್ಮ, ಈ ಉಪ್ಪಿಟ್ಟು ವೈಬ್ ಇಲ್ಲ’ ಅಂತಾಳೆ. ಉಪ್ಪಿಟ್ಟಿಗೆ ವೈಬ್ ಎಲ್ಲಿಂದ ಬರ್ಬೇಕು?
    tr: Īga nan magaḷu elladakkū ‘vaib’ antāḷe. Ēḷu varṣada huḍugi, ‘amma, ī uppiṭṭu vaib illa’ antāḷe. Uppiṭṭige vaib ellinda barbēku?
    en: Now my daughter says ‘vibe’ about everything. A seven-year-old, and she says, ‘Amma, this upma has no vibe.’ Where's upma supposed to get a vibe from?
  - who: arjun
    t: ನನ್ ಆಫೀಸಲ್ಲಿ ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದ ಹುಡುಗ್ರು ನನ್ ಪ್ರೆಸೆಂಟೇಷನ್ ನೋಡಿ ‘ಕ್ರಿಂಜ್’ ಅಂದ್ರು. ಅವತ್ತೇ ಗೊತ್ತಾಯ್ತು, ನಾನು ಅಂಕಲ್ ಆಗ್ಬಿಟ್ಟೆ ಅಂತ.
    tr: Nan āphīsalli ippatteraḍu varṣada huḍugru nan prezeṇṭēṣan nōḍi ‘krinj’ andru. Avattē gottāytu, nānu aṅkal āgbiṭṭe anta.
    en: In my office, twenty-two-year-olds looked at my presentation and called it ‘cringe’. That day I knew I'd become an uncle.
  - who: naveen
    t: ಆಫೀಸ್ ಉಂಟಲ್ವಾ ನಿನಗೆ, ಅದೇ ದೊಡ್ಡದು. ನಮ್ಮಲ್ಲಿ ಹುಡುಗರು ‘ಮಾರಾಯ’ ಬಿಟ್ಟು ‘ಬ್ರೋ’ ಅಂತಾರೆ. ನನ್ನ ಅಪ್ಪನಿಗೂ ‘ಬ್ರೋ, ಬಿಲ್ ಕೊಡಿ’ ಅಂದ ಒಬ್ಬ ಹುಡುಗ!
    tr: Āphīs uṇṭalvā ninage, adē doḍḍadu. Nammalli huḍugaru ‘mārāya’ biṭṭu ‘brō’ antāre. Nanna appanigū ‘brō, bil koḍi’ anda obba huḍuga!
    en: At least you have an office, that's something. Where I am, the boys have dropped ‘maraya’ for ‘bro’. One kid even said to my father, ‘Bro, give the bill!’
  - who: imran
    t: ನಮ್ ಕಡೆ ಇನ್ನೂ ‘ಏನಪಾ, ಹ್ಯಾಂಗ ಅದಿ’ ನಡೀತೈತಿ. ಕಲಬುರಗಿ ಬಿಸಿಲು ಹಂಗೇ ಐತಿ, ಭಾಷಾನೂ ಹಂಗೇ ಐತಿ. ಏನೂ ಬದಲಾಗಿಲ್ಲ.
    tr: Nam kaḍe innū ‘ēnapā, hyāṅga adi’ naḍītaiti. Kalaburagi bisilu haṅgē aiti, bhāṣānū haṅgē aiti. Ēnū badalāgilla.
    en: Back home we still go ‘Enapa, hyanga adi’. The Kalaburagi heat is the same as ever, and so is the language. Nothing's changed.
  - who: prakash
    t: ಹೌದ್ರಿ, ಉತ್ತರ ಕರ್ನಾಟಕದಾಗ ಮಾತು ಹಳೇದೇ. ನನ್ ಸಾಲೀ ಹುಡುಗರು ಇನ್‌ಸ್ಟಾಗ್ರಾಮ್ ನೋಡಿ ‘ಡೆಲುಲು’ ಅಂತಾರ. ನಾ ಮೊದಲು ಅದು ಯಾವುದೋ ರೋಗ ಅಂತ ತಿಳಕೊಂಡಿದ್ದೆ.
    tr: Haudri, uttara Karnāṭakadāga mātu haḷēdē. Nan sālī huḍugaru Insṭāgrām nōḍi ‘ḍelulu’ antāra. Nā modalu adu yāvudō rōga anta tiḷakoṇḍidde.
    en: Yes, in North Karnataka the talk is still the old kind. The kids in my school watch Instagram and say ‘delulu’. At first I thought it was some disease.
  - who: deepa
    t: ಅದು ‘ಡೆಲ್ಯೂಷನಲ್’ ಅಂತ, ಪ್ರಕಾಶ್. ಅಂದ್ರೆ ಕನಸಲ್ಲಿ ಬದುಕೋದು. ನಾವು ಹೇಳ್ತಿದ್ವಲ್ಲಾ, ‘ಬುರುಡೆ ಬಿಡ್ಬೇಡ’ ಅಂತ, ಸುಮಾರು ಅದೇ.
    tr: Adu ‘ḍelyūṣanal’ anta, Prakāś. Andre kanasalli badukōdu. Nāvu hēḷtidvallā, ‘buruḍe biḍbēḍa’ anta, sumāru adē.
    en: It's from ‘delusional’, Prakash. Living in a dream, basically. Like we used to say, ‘stop spinning yarns’ — roughly that.
  - who: kaveri
    t: ಹದಿನಾರು ವರ್ಷ ಆದ್ರೂ ಅರ್ಜುನ್ ಬುರುಡೆ ಮಾತ್ರ ಬದಲಾಗಿಲ್ಲ. ಅದಕ್ಕೆ ಯಾವ ಹೊಸ ಪದನೂ ಬೇಕಾಗಿಲ್ಲ.
    tr: Hadināru varṣa ādrū Arjun buruḍe mātra badalāgilla. Adakke yāva hosa padanū bēkāgilla.
    en: Sixteen years on, the only thing that hasn't changed is Arjun's tall tales. Those don't need any new word.
  - who: arjun
    t: ಹೂಂ ಮತ್ತೆ! ಎಲ್ರೂ ಸೇರಿ ನನ್ನನ್ನೇ ಬಕ್ರಾ ಮಾಡಿ. ಆಯ್ತು, ಇವತ್ತು ನಾನೇ ಬಕ್ರಾ.
    tr: Hūṁ matte! Ellrū sēri nannannē bakrā māḍi. Āytu, ivattu nānē bakrā.
    en: Yeah, right! Go on, all of you, make me the fall guy. Fine, tonight I'm the scapegoat.
  - who: ramya
    t: ನೆನಪಿದ್ಯಾ, ಮೂರನೇ ವರ್ಷದಲ್ಲಿ ನಾವು ಎಂಟೂ ಜನ ಗೋಕರ್ಣಕ್ಕೆ ಹೋಗಿದ್ವಿ? ನವೀನ್ ರಾತ್ರಿ ಬೀಚ್‌ನಲ್ಲಿ ಮಲಗಿ, ಬೆಳಗ್ಗೆ ಅಲೆ ಬಂದು ಅವನ ಚಪ್ಪಲಿ ತಗೊಂಡು ಹೋಯ್ತು!
    tr: Nenapidyā, mūranē varṣadalli nāvu eṇṭū jana Gōkarṇakke hōgidvi? Navīn rātri bīch-nalli malagi, beḷagge ale bandu avana chappali tagoṇḍu hōytu!
    en: Remember, in third year all eight of us went to Gokarna? Naveen slept on the beach at night, and in the morning a wave came and took his slippers!
  - who: naveen
    t: ಒಂದು ಚಪ್ಪಲಿ ಮಾತ್ರ. ಇನ್ನೊಂದು ಇವತ್ತಿಗೂ ನನ್ನ ಹತ್ರ ಉಂಟು. ಸಮುದ್ರಕ್ಕೆ ನನ್ನ ಮೇಲೆ ಅರ್ಧ ಪ್ರೀತಿ.
    tr: Ondu chappali mātra. Innondu ivattigū nanna hatra uṇṭu. Samudrakke nanna mēle ardha prīti.
    en: Only one slipper. I still have the other one today. The sea only half loves me.
  - who: deepa
    t: ಅದೇ ನಮ್ಮ ಕೊನೆಯ ಪೂರ್ತಿ ಗ್ಯಾಂಗ್ ಟ್ರಿಪ್ ಅಲ್ವಾ? ಆಮೇಲೆ… ಏನೇನೋ ಆಯ್ತು.
    tr: Adē namma koneya pūrti gyāṅg ṭrip alvā? Āmēle… ēnēnō āytu.
    en: That was our last full-gang trip, wasn't it? After that… all sorts of things happened.
  - scene: A short silence. Shruti looks at her phone. Arjun looks at the ceiling.
  - who: kaveri
    t: ಹಾಗಾದ್ರೆ ಈ ಸಲ ಗೋಕರ್ಣ ಮುಗಿಸದೇ ಇದ್ದ ಕೆಲಸ ಮುಗಿಸೋಕೆ. ನವೀನ್, ಎರಡೂ ಚಪ್ಪಲಿ ಕಟ್ಟಿಕೊಂಡು ಮಲಗು.
    tr: Hāgādre ī sala Gōkarṇa mugisadē idda kelasa mugisōke. Navīn, eraḍū chappali kaṭṭikoṇḍu malagu.
    en: Then this time Gokarna is for finishing unfinished business. Naveen, sleep with both slippers tied on.
  - section: Ee sala cup namdu — and the fourth of June
    learn: 'cricket banter: chēs māḍidru, phiniśar, ī sala kap namdu · a sudden change of tone: sambhrama durantavāytu, kālttuḷita, hannondu jana · reporting what one saw: nānē alli idde, nōḍide, marelikke āgalla · the 2026 title, hedged: kēḷde, ī sala mauna'
  - who: arjun
    t: ಏನೇ ಹೇಳಿ, ಈ ವರ್ಷ ಒಂದು ವಿಷಯಕ್ಕೆ ನಾವು ಪುಣ್ಯವಂತರು. ಆರ್‌ಸಿಬಿ ಬ್ಯಾಕ್ ಟು ಬ್ಯಾಕ್! ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೈದು, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರು. ಹದಿನೆಂಟು ವರ್ಷ ‘ಈ ಸಲ ಕಪ್ ನಮ್ದೇ’ ಅಂದ್ವಿ, ಈಗ ಎರಡು ಕಪ್ ನಮ್ದು!
    tr: Ēnē hēḷi, ī varṣa ondu viṣayakke nāvu puṇyavantaru. Ār-si-bi byāk ṭu byāk! Eraḍu sāvirada ippattaidu, eraḍu sāvirada ippattāru. Hadineṇṭu varṣa ‘ī sala kap namdē’ andvi, īga eraḍu kap namdu!
    en: Say what you like, this year we're lucky on one count. RCB, back to back! 2025, 2026. For eighteen years we said ‘this time the cup is ours’, and now two cups are ours!
  - who: imran
    t: ಮೇ ಮೂವತ್ತೊಂದು ರಾತ್ರಿ ಫೈನಲ್ ನೋಡಾಕ ವಾರ್ಡ್‌ನಾಗ ನರ್ಸ್‌ಗಳ ಜೊತೆ ಮೊಬೈಲ್ ಹಿಡ್ಕೊಂಡು ನಿಂತಿದ್ದೆ. ಗುಜರಾತ್ ಮೇಲೆ ಐದು ವಿಕೆಟ್‌ನಿಂದ ಗೆದ್ದಾಗ ಒಬ್ಬ ಪೇಷಂಟ್ ಭೀ ಬೆಡ್ ಮೇಲೆ ಕುಣಿದ!
    tr: Mē mūvattondu rātri phainal nōḍāka vārḍ-nāga nars-gaḷa jote mobail hiḍkoṇḍu nintidde. Gujarāt mēle aidu vikeṭ-ninda geddāga obba pēṣaṇṭ bhī beḍ mēle kuṇida!
    en: On the night of May thirty-first I stood in the ward holding my phone with the nurses to watch the final. When we beat Gujarat by five wickets, even a patient danced on his bed!
  - who: naveen
    t: ಕೊಹ್ಲಿ ಇಪ್ಪತ್ತೈದು ಬಾಲ್‌ನಲ್ಲಿ ಫಿಫ್ಟಿ ಹೊಡೆದಾಗ ನನ್ನ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಎಲ್ಲರಿಗೂ ಫ್ರೀ ಐಸ್‌ಕ್ರೀಮ್ ಕೊಟ್ಟೆ. ಅಪ್ಪ ಲೆಕ್ಕ ನೋಡಿ ಎರಡು ದಿನ ಮಾತಾಡ್ಲಿಲ್ಲ.
    tr: Kohli ippattaidu bāl-nalli phiphṭi hoḍedāga nanna hōṭel-nalli ellarigū phrī ais-krīm koṭṭe. Appa lekka nōḍi eraḍu dina mātāḍlilla.
    en: When Kohli hit a fifty off twenty-five balls, I gave free ice cream to everyone in my hotel. Appa saw the accounts and didn't speak to me for two days.
  - who: shruti
    t: ಈ ಸಲ ಬೆಂಗಳೂರಲ್ಲಿ ದೊಡ್ಡ ಮೆರವಣಿಗೆ ಏನೂ ಮಾಡ್ಲಿಲ್ಲ ಅಲ್ವಾ? ಸ್ವಲ್ಪ ಮೌನವಾಗೇ ಆಚರಿಸಿದ್ರು ಅಂತ ಕೇಳ್ದೆ.
    tr: Ī sala Beṅgaḷūralli doḍḍa meravaṇige ēnū māḍlilla alvā? Svalpa maunavāgē ācharisidru anta kēḷde.
    en: This time there was no big parade in Bengaluru, was there? I heard they celebrated a bit quietly.
  - scene: Ramya lowers her phone and stops recording.
  - who: ramya
    t: ಹೂಂ. ಕಳೆದ ವರ್ಷದ ನಂತರ ಯಾರಿಗೆ ತಾನೇ ಧೈರ್ಯ ಇರುತ್ತೆ? ಜೂನ್ ನಾಲ್ಕು, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೈದು. ನಾನು ಆ ದಿನ ಚಿನ್ನಸ್ವಾಮಿ ಗೇಟ್ ಹತ್ರ ಲೈವ್ ಮಾಡ್ತಿದ್ದೆ.
    tr: Hūṁ. Kaḷeda varṣada nantara yārige tānē dhairya irutte? Jūn nālku, eraḍu sāvirada ippattaidu. Nānu ā dina Chinnasvāmi gēṭ hatra laiv māḍtidde.
    en: Mm. After last year, who would have the nerve? June the fourth, 2025. That day I was doing a live report near the Chinnaswamy gate.
  - who: deepa
    t: ನೀನು ಅಲ್ಲಿದ್ದೆಯಾ? ನಂಗೆ ಗೊತ್ತೇ ಇರ್ಲಿಲ್ಲ, ರಮ್ಯಾ.
    tr: Nīnu allidde-yā? Naṅge gottē irlilla, Ramyā.
    en: You were there? I never knew, Ramya.
  - who: ramya
    t: ಎರಡು ಲಕ್ಷಕ್ಕೂ ಜಾಸ್ತಿ ಜನ ಬಂದಿದ್ರು ಅಂತ ಹೇಳ್ತಾರೆ. ಒಂದು ಕಡೆ ಹಾಡು, ಕುಣಿತ. ಇನ್ನೊಂದು ಕಡೆ ಗೇಟ್ ಹತ್ರ ಕಾಲ್ತುಳಿತ. ಹನ್ನೊಂದು ಜನ ಸತ್ತರು. ಒಬ್ಬ ಹುಡುಗಿಯ ಅಪ್ಪ ನನ್ ಮೈಕ್ ಮುಂದೆ ಅತ್ತರು. ಆ ಮುಖ ಇವತ್ತಿಗೂ ಮರೆಯೋಕಾಗಿಲ್ಲ.
    tr: Eraḍu lakṣakkū jāsti jana bandidru anta hēḷtāre. Ondu kaḍe hāḍu, kuṇita. Innondu kaḍe gēṭ hatra kālttuḷita. Hannondu jana sattaru. Obba huḍugiya appa nan maik munde attaru. Ā mukha ivattigū mareyōkāgilla.
    en: They say more than two lakh people came. On one side, songs and dancing. On the other, a stampede at the gates. Eleven people died. One girl's father wept in front of my microphone. I still can't forget that face.
  - who: kaveri
    t: ಆಮೇಲೆ ನ್ಯಾಯಮೂರ್ತಿ ಡಿ’ಕುನ್ಹಾ ಆಯೋಗ ವರದಿ ಕೊಟ್ಟಿತು. ಪೊಲೀಸ್ ವ್ಯವಸ್ಥೆ ವಿಫಲ ಆಯ್ತು, ಆಯೋಜಕರ ಘೋಷಣೆಗಳು ಬೇಜವಾಬ್ದಾರಿ ಆಗಿದ್ವು, ಸ್ಟೇಡಿಯಂ ದೊಡ್ಡ ಜನಸಂದಣಿಗೆ ಸುರಕ್ಷಿತ ಅಲ್ಲ ಅಂತ. ವರದಿ ಸ್ಪಷ್ಟವಾಗಿತ್ತು. ಆದ್ರೆ ಹೋದ ಜೀವ ವಾಪಸ್ ಬರಲ್ಲ.
    tr: Āmēle nyāyamūrti Ḍi’kunhā āyōga varadi koṭṭitu. Polīs vyavasthe viphala āytu, āyōjakara ghōṣaṇegaḷu bējavābdāri āgidvu, sṭēḍiyaṁ doḍḍa janasandaṇige surakṣita alla anta. Varadi spaṣṭavāgittu. Ādre hōda jīva vāpas baralla.
    en: Later the Justice D'Cunha commission submitted its report. The police arrangements failed, the organisers' announcements were reckless, and the stadium is not safe for huge crowds. The report was clear. But the lives that were lost don't come back.
  - who: arjun
    t: ಅದಕ್ಕೇ ಈ ಸಲ ಕಪ್ ಗೆದ್ದಾಗ ಖುಷಿ ಆಯ್ತು, ಆದ್ರೆ ಪೂರ್ತಿ ಖುಷಿ ಆಗ್ಲಿಲ್ಲ. ಒಳಗೆ ಎಲ್ಲೋ ಒಂದು ಮುಳ್ಳು ಚುಚ್ಚುತ್ತಿತ್ತು.
    tr: Adakkē ī sala kap geddāga khuṣi āytu, ādre pūrti khuṣi āglilla. Oḷage ellō ondu muḷḷu chuchchuttittu.
    en: That's why, when we won the cup this time, I was happy, but not completely happy. Somewhere inside, a thorn was pricking.
  - who: prakash
    t: ಹೌದು. ಸಂಭ್ರಮ ಮಾಡೋದು ತಪ್ಪಲ್ಲ, ಆದ್ರ ಜನರ ಜೀವಕ್ಕಿಂತ ಕಪ್ ದೊಡ್ಡದಲ್ಲ. ನನ್ ಸಾಲ್ಯಾಗ ಮಕ್ಕಳಿಗೆ ಅದನ್ನೇ ಹೇಳಿದೆ.
    tr: Haudu. Sambhrama māḍōdu tappalla, ādra janara jīvakkinta kap doḍḍadalla. Nan sālyāga makkaḷige adannē hēḷide.
    en: Yes. Celebrating isn't wrong, but no cup is bigger than people's lives. That's exactly what I told the children in my school.
  - who: imran
    t: ಆ ರಾತ್ರಿ ನನ್ನ ಬ್ಯಾಚ್‌ಮೇಟ್ ಬೌರಿಂಗ್ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಡ್ಯೂಟಿ ಮೇಲಿದ್ದ. ಬೆಳಗಿನವರೆಗೆ ಒಂದು ಮಾತೂ ಆಡ್ಲಿಲ್ಲ ಅಂತ ಹೇಳಿದ. ಸರಿ, ಸಾಕು, ಜರಾ ಮನಸ್ಸು ಹಗುರ ಮಾಡೋಣ. ಕಾರ್ ವಿಷಯ ಹೇಳ್ರಿ.
    tr: Ā rātri nanna byāch-mēṭ Bauriṅg āspatreyalli ḍyūṭi mēlidda. Beḷaginavarege ondu mātū āḍlilla anta hēḷida. Sari, sāku, jarā manassu hagura māḍōṇa. Kār viṣaya hēḷri.
    en: That night a batchmate of mine was on duty at Bowring Hospital. He told me he didn't say a word until morning. All right, enough; let's lighten our hearts a little. Tell me about the cars.
  - section: Two cars, one invitation
    learn: 'who sits where: munde kūrtīni, hindgaḍe aḍjast māḍkoḷi, ḍraivar badalāyisōṇa · Dharwad hospitality: nam manige barri, avva kāytāḷa, pēḍa illade kaḷisōdilla · a promise: mātu koṭṭīni'
  - who: arjun
    t: ಎರಡು ಕಾರ್. ನನ್ ಕಾರಲ್ಲಿ ನಾನು, ಶ್ರುತಿ, ಪ್ರಕಾಶ್, ಇಮ್ರಾನ್. ನವೀನ್ ಮೂರನೇ ತಾರೀಖು ರಾತ್ರಿ ಉಡುಪಿಯಿಂದ ಕಾರ್ ತಗೊಂಡ್ ಬರ್ತಾನೆ. ಅವನ ಕಾರಲ್ಲಿ ದೀಪಾ, ಕಾವೇರಿ, ರಮ್ಯಾ.
    tr: Eraḍu kār. Nan kāralli nānu, Śruti, Prakāś, Imrān. Navīn mūranē tārīkhu rātri Uḍupiyinda kār tagoṇḍ bartāne. Avana kāralli Dīpā, Kāvēri, Ramyā.
    en: 'Two cars. In my car: me, Shruti, Prakash, Imran. Naveen drives up from Udupi on the night of the third. In his car: Deepa, Kaveri, Ramya.'
  - who: shruti
    t: ನಾನು ನಿನ್ ಕಾರಲ್ಲಿ ಯಾಕೆ? ಈ ಲಿಸ್ಟ್ ಯಾರು ಮಾಡಿದ್ದು?
    tr: Nānu nin kāralli yāke? Ī lisṭ yāru māḍiddu?
    en: Why am I in your car? Who made this list?
  - who: arjun
    t: ಮಲ್ಲೇಶ್ವರ ನನ್ ದಾರಿಯಲ್ಲೇ ಬರುತ್ತೆ, ಅಷ್ಟೇ. ಬೇರೆ ಏನೂ ಅರ್ಥ ಇಲ್ಲ. ಬೇಕಿದ್ರೆ ಬದಲಾಯಿಸೋಣ.
    tr: Mallēśvara nan dāriyallē barutte, aṣṭē. Bēre ēnū artha illa. Bēkidre badalāyisōṇa.
    en: Malleshwaram is on my way, that's all. There's no other meaning to it. We can change it if you want.
  - who: shruti
    t: ಬೇಡ, ಇರ್ಲಿ. ಮೊದಲನೇ ದಿನದಿಂದಲೇ ಕಿರಿಕ್ ಬೇಡ.
    tr: Bēḍa, irli. Modalanē dinadindalē kirik bēḍa.
    en: No, leave it. Let's not have trouble from day one.
  - scene: Ramya catches the look between them and quietly raises her phone again. Kaveri pushes it down.
  - who: naveen
    t: ನನ್ನ ಕಾರಲ್ಲಿ ಮೂರು ಮಹಿಳೆಯರು, ಒಬ್ಬ ವಕೀಲೆ, ಒಬ್ಬ ಪತ್ರಕರ್ತೆ. ದೇವರೇ, ನನ್ನ ಡ್ರೈವಿಂಗ್ ಬಗ್ಗೆ ವರದಿ ಬರ್ತದೆ, ಕೇಸೂ ಬೀಳ್ತದೆ!
    tr: Nanna kāralli mūru mahiḷeyaru, obba vakīle, obba patrakarte. Dēvarē, nanna ḍraiviṅg bagge varadi bartade, kēsū bīḷtade!
    en: In my car, three women — one a lawyer, one a journalist. God help me, there'll be a news report on my driving, and a court case too!
  - who: kaveri
    t: ನೀನು ನೂರಿಪ್ಪತ್ತು ದಾಟದಿದ್ರೆ ಯಾವ ಕೇಸೂ ಇಲ್ಲ, ನವೀನ್. ಹೈವೇಯಲ್ಲಿ ಸ್ಪೀಡ್ ಕ್ಯಾಮೆರಾಗಳಿವೆ, ಗೊತ್ತಲ್ವಾ.
    tr: Nīnu nūrippattu dāṭadidre yāva kēsū illa, Navīn. Haivēyalli spīḍ kyāmerāgaḷive, gottalvā.
    en: If you don't cross a hundred and twenty, there's no case, Naveen. There are speed cameras on the highway, you know.
  - who: prakash
    t: ಒಂದು ಮಾತು ಹೇಳ್ಲೇನ್ರಿ? ಆರನೇ ತಾರೀಖು ನಾವು ಧಾರವಾಡದ ದಾರಿಯಾಗ ಇರ್ತೇವಿ. ಆ ರಾತ್ರಿ ಹೋಟ್ಲಾ ಬ್ಯಾಡ. ಎಲ್ಲಾರೂ ಸಪ್ತಾಪುರದಾಗ ನಮ್ ಮನಿಗೆ ಬರ್ರಿ.
    tr: Ondu mātu hēḷlēnri? Āranē tārīkhu nāvu Dhāravāḍada dāriyāga irtēvi. Ā rātri hōṭlā byāḍa. Ellārū Saptāpuradāga nam manige barri.
    en: May I say something? On the sixth we'll be on the Dharwad road. No hotel that night. All of you, come to our home in Saptapur.
  - who: deepa
    t: ಎಂಟು ಜನ, ಪ್ರಕಾಶ್? ನಿಮ್ಮ ಅಮ್ಮನಿಗೆ ಕಷ್ಟ ಆಗಲ್ವಾ?
    tr: Eṇṭu jana, Prakāś? Nimma ammanige kaṣṭa āgalvā?
    en: Eight people, Prakash? Won't it be hard on your mother?
  - who: prakash
    t: ಕಷ್ಟ? ನಮ್ ಅವ್ವಗ ನೀವು ಬರಲಿಲ್ಲಂದ್ರ ಕಷ್ಟ ಆಗತೈತಿ. ಜೋಳದ ರೊಟ್ಟಿ, ಎಣ್ಣಿಗಾಯಿ, ಪೇಡ. ಪೇಡ ಇಲ್ಲದೆ ಅವ್ವ ಯಾರನ್ನೂ ಕಳಿಸೂದಿಲ್ಲ. ನಾ ಇವತ್ತೇ ಫೋನ್ ಮಾಡಿ ಹೇಳ್ತೇನಿ.
    tr: Kaṣṭa? Nam avvaga nīvu baralillandra kaṣṭa āgataiti. Jōḷada roṭṭi, eṇṇigāyi, pēḍa. Pēḍa illade avva yārannū kaḷisūdilla. Nā ivattē phōn māḍi hēḷtēni.
    en: Hard? It'll be hard on my Avva if you don't come. Jowar rotti, stuffed brinjal, peda. Avva doesn't let anyone leave without peda. I'll phone her and tell her tonight.
  - who: arjun
    t: ಡನ್! ಪ್ರಕಾಶ್ ಮನೆಯಲ್ಲಿ ಒಂದು ರಾತ್ರಿ. ಅಮ್ಮನ ಕೈಯಡುಗೆ. ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಹೋಮ್‌ಸ್ಟೇ ಎಲ್ಲಿ ಸಿಗುತ್ತೆ ಮಗಾ!
    tr: Ḍan! Prakāś maneyalli ondu rātri. Ammana kaiyaḍuge. Idakkinta oḷḷe hōmsṭē elli sigutte magā!
    en: Done! One night at Prakash's place. His mother's cooking. Where would you find a better homestay, maga!
  - who: imran
    t: ನಾನು ಮೂರನೇ ತಾರೀಖು ರಾತ್ರಿ ಕಲಬುರಗಿಯಿಂದ ಟ್ರೇನ್ ಹತ್ತತೇನಿ. ಯಶವಂತಪುರಕ್ಕೆ ಬೆಳಗ್ಗೆ ನಾಲ್ಕೂವರೆಗೆ ಬರ್ತೇನಿ. ರಜೆ ಸಿಕ್ಕರ. ಸಿಗದಿದ್ರೂ ಬರ್ತೇನಿ ಅಂತ ಅನ್ಸತೈತಿ.
    tr: Nānu mūranē tārīkhu rātri Kalaburagiyinda ṭrēn hattatēni. Yaśavantapurakke beḷagge nālkūvarege bartēni. Raje sikkara. Sigadidrū bartēni anta ansataiti.
    en: I'll catch the train from Kalaburagi on the night of the third. I'll reach Yeshwanthpur at half past four in the morning. If I get leave. I think I'll come even if I don't.
  - who: naveen
    t: ಸರಿ, ನಾನು ಹೋಗ್ಬೇಕು, ಊಟದ ಗಿರಾಕಿ ಬಂದ್ರು. ಅರ್ಜುನ್… ಬರುವಾಗ ಸಿಗುವ. ಒಂದೆರಡು ವಿಷಯ ಮಾತಾಡ್ಲಿಕ್ಕೆ ಉಂಟು.
    tr: Sari, nānu hōgbēku, ūṭada girāki bandru. Arjun… baruvāga siguva. Onderaḍu viṣaya mātāḍlikke uṇṭu.
    en: Right, I have to go — the dinner customers are here. Arjun… we'll meet when I come. There are one or two things to talk about.
  - who: arjun
    t: ಹಾಂ… ಹೌದು, ಖಂಡಿತ. ಸಿಗೋಣ. ಡ್ರೈವ್ ಸೇಫ್ ಮಗಾ.
    tr: Hāṁ… haudu, khaṇḍita. Sigōṇa. Ḍraiv sēph magā.
    en: Hm… yes, of course. We'll meet. Drive safe, maga.
  - scene: The call cuts. Arjun puts the phone face down on the table and is quiet for a moment longer than anyone expects.
  - who: ramya
    t: ಸರಿ, ಗ್ರೂಪ್‌ಗೆ ಹೆಸರು ಬದಲಾಯಿಸ್ತೀನಿ. ‘ಎರಡು ಸಾವಿರದ ಹತ್ತು ಗ್ಯಾಂಗ್ — ಮತ್ತೆ ರಸ್ತೆಗೆ’. ಯಾರಿಗಾದ್ರೂ ಆಕ್ಷೇಪ ಉಂಟಾ?
    tr: Sari, grūp-ge hesaru badalāyistīni. ‘Eraḍu sāvirada hattu gyāṅg — matte rastege’. Yārigādrū ākṣēpa uṇṭā?
    en: Right, I'm changing the group's name. ‘The 2010 Gang — Back on the Road’. Any objections?
  - who: kaveri
    t: ಆಕ್ಷೇಪ ಇಲ್ಲ, ಆದ್ರೆ ಒಂದು ಷರತ್ತು. ಯಾರನ್ನೂ ಅವರ ಅನುಮತಿ ಇಲ್ಲದೆ ವಿಡಿಯೋ ಹಾಕ್ಬಾರ್ದು. ಇದು ವಕೀಲೆಯ ಸಲಹೆ, ಉಚಿತವಾಗಿ.
    tr: Ākṣēpa illa, ādre ondu ṣarattu. Yārannū avara anumati illade viḍiyō hākbārdu. Idu vakīleya salahe, uchitavāgi.
    en: No objection, but one condition. Nobody's video goes up without their permission. That's legal advice, free of charge.
  - who: deepa
    t: ಒಪ್ಪಿಗೆ. ಎಲ್ಲಾ ಮುಗಿದ್ಮೇಲೆ ನಾನೇ ನೋಡಿ ಹೇಳ್ತೀನಿ ಯಾವುದು ಹಾಕ್ಬೋದು ಅಂತ.
    tr: Oppige. Ellā mugidmēle nānē nōḍi hēḷtīni yāvudu hākbōdu anta.
    en: Agreed. When it's all over, I'll look myself and say which ones can go up.
  - who: shruti
    t: ಸರಿ ಹಾಗಾದ್ರೆ. ನಾಲ್ಕನೇ ತಾರೀಖು, ಬೆಳಗ್ಗೆ ಐದು ಗಂಟೆ. ಅರ್ಜುನ್, ಈ ಸಲ ಲೇಟ್ ಮಾಡಿದ್ರೆ ನಾನು ಕಾಯಲ್ಲ. ಆ ಕಾಲ ಮುಗಿದುಹೋಯ್ತು.
    tr: Sari hāgādre. Nālkanē tārīkhu, beḷagge aidu gaṇṭe. Arjun, ī sala lēṭ māḍidre nānu kāyalla. Ā kāla mugiduhōytu.
    en: All right then. The fourth, five in the morning. Arjun, if you're late this time, I won't wait. Those days are over.
  - scene: Nobody laughs. Arjun nods. Outside, a late bus to the metro groans past on the main road.
  - chapter: Chapter 2 — Leaving at dawn
  - section: Five in the morning
    learn: 'early-morning calls: eddyā?, keḷage bā, aidu nimiṣa, gēṭ hatra iddīni · surprise at punctuality: nambōkē āgtilla · picking someone up at a station: plāṭphārm nambar, mukhya bāgilu · Kalaburagi speech: jaldi bā, iḷadēni, antāna'
  - scene: Friday, 4 December 2026, 4:52 a.m. Malleshwaram, 8th Cross. The street is dark and cold, about seventeen degrees. A milk van passes. Shruti stands at her gate with a small bag and a flask. Arjun's grey SUV is already waiting, its engine running.
  - who: shruti
    t: ನಾಲ್ಕು ಐವತ್ತೆರಡು? ಅರ್ಜುನ್ ರಾವ್ ಐದು ಗಂಟೆಗೆ ಮುಂಚೆ ಬಂದಿದ್ದಾನೆ? ನಂಬೋಕೇ ಆಗ್ತಿಲ್ಲ.
    tr: Nālku aivatteraḍu? Arjun Rāv aidu gaṇṭege muñche bandiddāne? Nambōkē āgtilla.
    en: Four fifty-two? Arjun Rao has come before five o'clock? I can't believe it.
  - who: arjun
    t: ಹದಿನಾಲ್ಕು ವರ್ಷದಲ್ಲಿ ಜನ ಬದಲಾಗ್ತಾರೆ, ಶ್ರುತಿ. ನಾನು ನಾಲ್ಕೂ ಕಾಲಿಗೆ ಮನೆ ಬಿಟ್ಟೆ. ಬಾ, ಬ್ಯಾಗ್ ಹಿಂದೆ ಇಡ್ತೀನಿ.
    tr: Hadinālku varṣadalli jana badalāgtāre, Śruti. Nānu nālkū kālige mane biṭṭe. Bā, byāg hinde iḍtīni.
    en: People change in fourteen years, Shruti. I left home at a quarter past four. Come, I'll put your bag in the back.
  - who: shruti
    t: ಬೇಡ, ನಾನೇ ಇಡ್ತೀನಿ. ಈ ಫ್ಲಾಸ್ಕ್‌ನಲ್ಲಿ ಫಿಲ್ಟರ್ ಕಾಫಿ ಇದೆ. ಅತ್ತೆ ಎದ್ದು ಮಾಡಿ ಕೊಟ್ರು. ‘ದಾರೀಲಿ ಎಲ್ರಿಗೂ ಕೊಡು’ ಅಂದ್ರು.
    tr: Bēḍa, nānē iḍtīni. Ī phlāsk-nalli philṭar kāphi ide. Atte eddu māḍi koṭru. ‘Dārīli ellrigū koḍu’ andru.
    en: No, I'll put it in myself. There's filter coffee in this flask. My mother-in-law got up and made it. She said, ‘Give everyone some on the way.’
  - who: arjun
    t: ನಿನ್ ಅತ್ತೆಗೆ ನನ್ ಕಡೆಯಿಂದ ಥ್ಯಾಂಕ್ಸ್ ಹೇಳು. ಮಕ್ಕಳು ಮಲಗಿದ್ದಾರಾ?
    tr: Nin attege nan kaḍeyinda thyāṅks hēḷu. Makkaḷu malagiddārā?
    en: Say thanks to your mother-in-law from me. Are the kids asleep?
  - who: shruti
    t: ಆದ್ಯಾ ಎದ್ದಿದ್ಲು. ‘ಅಮ್ಮ, ನೀನು ವಾಪಸ್ ಬರ್ತೀಯಾ ತಾನೇ?’ ಅಂತ ಕೇಳಿದ್ಲು. ಆರು ದಿನದ ಟ್ರಿಪ್‌ಗೆ ಹೋಗ್ತಿರೋ ಅಮ್ಮನಿಗೆ ಎಂಥಾ ಪ್ರಶ್ನೆ ನೋಡು. ಹೊರಡು, ಇಲ್ಲಾಂದ್ರೆ ನಾನು ಇಳಿದುಬಿಡ್ತೀನಿ.
    tr: Ādyā eddidlu. ‘Amma, nīnu vāpas bartīyā tānē?’ anta kēḷidlu. Āru dinada ṭrip-ge hōgtirō ammanige enthā praśne nōḍu. Horaḍu, illāndre nānu iḷidubiḍtīni.
    en: Aadya woke up. She asked, ‘Amma, you will come back, won't you?’ What a question to ask a mother going on a six-day trip. Drive, or I'll get out.
  - scene: 4:58 a.m. A training hostel in Basavanagudi. Prakash is already outside with a cloth bag and a steel tiffin box tied with string.
  - who: prakash
    t: ನಮಸ್ಕಾರ್ರೀ. ನಾ ನಾಲ್ಕೂವರೆಗೇ ಎದ್ದು ಸ್ನಾನ ಮಾಡಿ ಕುಂತಿದ್ದೆ. ಈ ಡಬ್ಬಿಯಾಗ ಅವ್ವ ಕಳಿಸಿದ ಶೇಂಗಾ ಹೋಳಿಗಿ ಐತಿ. ದಾರಿಯಾಗ ತಿನ್ನೋಣು.
    tr: Namaskārrī. Nā nālkūvaregē eddu snāna māḍi kuntidde. Ī ḍabbiyāga avva kaḷisida śēṅgā hōḷigi aiti. Dāriyāga tinnōṇu.
    en: Namaskara. I was up at half past four, bathed and sitting ready. In this box there's peanut holige that Avva sent. We'll eat it on the way.
  - who: arjun
    t: ಶೇಂಗಾ ಹೋಳಿಗೆ? ಪ್ರಕಾಶ್, ನೀನು ಗೆದ್ದೆ. ಈ ಟ್ರಿಪ್‌ನ ಮೊದಲ ಹೀರೋ ನಿಮ್ಮ ಅಮ್ಮ.
    tr: Śēṅgā hōḷige? Prakāś, nīnu gedde. Ī ṭrip-na modala hīrō nimma amma.
    en: Peanut holige? Prakash, you win. The first hero of this trip is your mother.
  - scene: 5:20 a.m. Yeshwanthpur railway station. The overnight train from Kalaburagi is late. Arjun's phone rings through the car speaker.
  - who: imran
    t: ಅರ್ಜುನ್, ಎಲ್ಲಿದೀಯಪಾ? ಟ್ರೇನ್ ನಲವತ್ತು ನಿಮಿಷ ತಡ ಆತು. ನಾ ಈಗ ಪ್ಲಾಟ್‌ಫಾರ್ಮ್ ಆರರಾಗ ಇಳದೇನಿ. ಜಲ್ದಿ ಬಾ, ಇಲ್ಲಿ ಆಟೋದವರು ನನ್ನ ಸುತ್ತ ನಿಂತಾರ.
    tr: Arjun, ellidīyapā? Ṭrēn nalavattu nimiṣa taḍa ātu. Nā īga plāṭphārm ārarāga iḷadēni. Jaldi bā, illi āṭōdavaru nanna sutta nintāra.
    en: Arjun, where are you, man? The train was forty minutes late. I've just got off on platform six. Come quick, the auto drivers are standing all around me here.
  - who: arjun
    t: ಹೊರಗಿನ ಪಾರ್ಕಿಂಗ್‌ನಲ್ಲಿದೀನಿ, ಮುಖ್ಯ ಬಾಗಿಲ ಎದುರು. ಬೂದು ಬಣ್ಣದ ಕಾರ್. ಆಟೋದವ್ರಿಗೆ ‘ಬೇಡ ಗುರು, ಗಾಡಿ ಬಂದಿದೆ’ ಅಂತ ಹೇಳು.
    tr: Horagina pārkiṅg-nallidīni, mukhya bāgila eduru. Būdu baṇṇada kār. Āṭōdavrige ‘bēḍa guru, gāḍi bandide’ anta hēḷu.
    en: I'm in the parking outside, opposite the main entrance. A grey car. Tell the auto guys, ‘No thanks, boss, my ride's here.’
  - who: imran
    t: ಹೇಳಿದೆ. ಒಬ್ಬ ‘ಸಾರ್, ಏರ್‌ಪೋರ್ಟ್ ಆರ್ನೂರು’ ಅಂತಾನ. ನಾ ಏರ್‌ಪೋರ್ಟ್‌ಗೆ ಹೋಗಾಕತ್ತಿಲ್ಲ ಅಂದ್ರ ‘ಹಂಗಾದ್ರ ನಾನೂರು’ ಅಂತಾನ! ಬೆಂಗಳೂರು ಬದಲಾಗೇ ಇಲ್ಲ.
    tr: Hēḷide. Obba ‘sār, ēr-pōrṭ ārnūru’ antāna. Nā ēr-pōrṭ-ge hōgākattilla andra ‘haṅgādra nānūru’ antāna! Beṅgaḷūru badalāgē illa.
    en: I did. One says, ‘Sir, airport, six hundred.’ I tell him I'm not going to the airport, and he says, ‘Then four hundred!’ Bengaluru hasn't changed at all.
  - scene: 5:31 a.m. Imran climbs in with a backpack, a stethoscope sticking out of the side pocket. He hugs Prakash across the seat.
  - who: imran
    t: ಪ್ರಕಾಶಾ! ಹ್ಯಾಂಗ ಅದಿ? ಶ್ರುತಿ, ನಮಸ್ಕಾರ. ಅರ್ಜುನ್, ನಿನ್ ಹೊಟ್ಟೆ ನೋಡಿದ್ರ ಸ್ಟಾರ್ಟಪ್ ಚೆನ್ನಾಗಿ ನಡೀತೈತಿ ಅನ್ಸತೈತಿ!
    tr: Prakāśā! Hyāṅga adi? Śruti, namaskāra. Arjun, nin hoṭṭe nōḍidra sṭārṭap chennāgi naḍītaiti ansataiti!
    en: Prakasha! How are you? Shruti, namaskara. Arjun, looking at your belly, the startup must be doing very well!
  - who: arjun
    t: ಡಾಕ್ಟ್ರೇ, ಕಾರ್ ಹತ್ತಿದ ಕೂಡ್ಲೇ ಡಯಾಗ್ನೋಸಿಸ್ ಶುರು ಮಾಡ್ಬೇಡಿ. ಸೀಟ್ ಬೆಲ್ಟ್ ಹಾಕಿ. ನವೀನ್ ಕಾರ್ ಆಗ್ಲೇ ನೆಲಮಂಗಲ ದಾಟಿದೆಯಂತೆ.
    tr: Ḍākṭrē, kār hattida kūḍlē ḍayāgnōsis śuru māḍbēḍi. Sīṭ belṭ hāki. Navīn kār āglē Nelamaṅgala dāṭideyante.
    en: Doctor, don't start a diagnosis the moment you get in the car. Put on your seat belt. Naveen's car has already crossed Nelamangala, apparently.
  - section: Tumakuru road and thatte idli
    learn: 'highway words: ṭōl, ānyuyal pās, haivē · a slip in tense: irtittu (used to be) vs ide · ordering at a roadside stop: eṇṭu plēṭ, beṇṇe hāki, chaṭni jāsti · praising food: bombāṭ, bāyāga karagataiti, bhāḷa chalō aiti · town pride: Uḍupiyalli idakkinta oḷḷe uṇṭu'
  - scene: 6:40 a.m. NH-48 past Nelamangala. Mist over the fields. The FASTag beeps at a toll plaza.
  - who: imran
    t: ಈ ಟೋಲ್ ಎಷ್ಟು ಕಟ್ ಆತು? ಜುಲೈನಾಗ ಮತ್ತ ರೇಟ್ ಹೆಚ್ಚಿಸ್ಯಾರ ಅಂತ ಓದಿದ್ದೆ.
    tr: Ī ṭōl eṣṭu kaṭ ātu? Julaināga matta rēṭ heccisyāra anta ōdidde.
    en: How much did this toll take? I read they raised the rates again in July.
  - who: arjun
    t: ನಾನು ಆನ್ಯುಯಲ್ ಪಾಸ್ ತಗೊಂಡಿದೀನಿ. ಮೂರು ಸಾವಿರ ರೂಪಾಯಿ, ಇನ್ನೂರು ಟ್ರಿಪ್. ಆಗಾಗ ತುಮಕೂರು ಕಡೆ ಕ್ಲೈಂಟ್ ಮೀಟಿಂಗ್ ಇರ್ತಿತ್ತು, ಅದಕ್ಕೆ.
    tr: Nānu ānyuyal pās tagoṇḍidīni. Mūru sāvira rūpāyi, innūru ṭrip. Āgāga Tumakūru kaḍe klaiṇṭ mīṭiṅg irtittu, adakke.
    en: I've got the annual pass. Three thousand rupees, two hundred trips. I used to have client meetings out towards Tumakuru now and then, that's why.
  - who: shruti
    t: ‘ಇರ್ತಿತ್ತು’? ಈಗ ಇಲ್ವಾ?
    tr: ‘Irtittu’? Īga ilvā?
    en: ‘Used to’? Not any more?
  - who: arjun
    t: ಈಗ… ಎಲ್ಲಾ ಆನ್‌ಲೈನ್. ಜೂಮ್ ಕಾಲ್. ಅದು ಬಿಡು. ಕ್ಯಾತಸಂದ್ರ ಬಂತು, ತಟ್ಟೆ ಇಡ್ಲಿ!
    tr: Īga… ellā ān-lain. Jūm kāl. Adu biḍu. Kyātasandra bantu, taṭṭe iḍli!
    en: Now… it's all online. Zoom calls. Forget it. Here's Kyathsandra — thatte idli!
  - scene: 7:05 a.m. A roadside idli hotel at Kyathsandra, near Tumakuru. Naveen's white car is already parked. Steam rises from the big flat idli plates. The eight are together for the first time in eight years.
  - who: naveen
    t: ಬಂದ್ರಾ ಮಾರಾಯ್ರೆ! ಅರ್ಧ ಗಂಟೆಯಿಂದ ಕಾಯ್ತಾ ಉಂಟು. ಪ್ರಕಾಶ್, ಇಮ್ರಾನ್! ಬನ್ನಿ ಇಲ್ಲಿ!
    tr: Bandrā mārāyre! Ardha gaṇṭeyinda kāytā uṇṭu. Prakāś, Imrān! Banni illi!
    en: You've come, my dears! We've been waiting half an hour. Prakash, Imran! Come here!
  - scene: Naveen hugs Prakash and Imran hard. He gives Arjun a short handshake and turns to the counter.
  - who: ramya
    t: ಎಂತ ಮರ್ರೆ, ಎಂಟು ವರ್ಷ ಆದ ಮೇಲೆ ಮೊದಲ ಫೋಟೋ! ಎಲ್ರೂ ಇಡ್ಲಿ ಮುಂದೆ ನಿಂತ್ಕೊಳ್ಳಿ. ಅರ್ಜುನ್, ನೀನು ಮಧ್ಯ ಬಾ. ನವೀನ್, ಹತ್ರ ಬಾ ಮರ್ರೆ!
    tr: Enta marre, eṇṭu varṣa āda mēle modala phōṭō! Ellrū iḍli munde nintkoḷḷi. Arjun, nīnu madhya bā. Navīn, hatra bā marre!
    en: What's this — the first photo in eight years! Everyone stand in front of the idlis. Arjun, you come to the middle. Naveen, come closer, man!
  - who: kaveri
    t: ಫೋಟೋ ಆಮೇಲೆ, ರಮ್ಯಾ. ಇಡ್ಲಿ ತಣ್ಣಗಾದ್ರೆ ಅದು ತಟ್ಟೆ ಇಡ್ಲಿ ಅಲ್ಲ, ಬರೀ ತಟ್ಟೆ.
    tr: Phōṭō āmēle, Ramyā. Iḍli taṇṇagādre adu taṭṭe iḍli alla, barī taṭṭe.
    en: Photo later, Ramya. If the idli goes cold, it isn't thatte idli any more — just the thatte, the plate.
  - who: arjun
    t: ಅಣ್ಣಾ, ಎಂಟು ಪ್ಲೇಟ್ ತಟ್ಟೆ ಇಡ್ಲಿ, ಬೆಣ್ಣೆ ಹಾಕಿ. ಚಟ್ನಿ ಜಾಸ್ತಿ. ಮತ್ತೆ ಎಂಟು ಕಾಫಿ.
    tr: Aṇṇā, eṇṭu plēṭ taṭṭe iḍli, beṇṇe hāki. Chaṭni jāsti. Matte eṇṭu kāphi.
    en: Anna, eight plates of thatte idli, with butter. Extra chutney. And eight coffees.
  - who: deepa
    t: ನಂಗೆ ಕಾಫಿ ಬೇಡ, ಟೀ. ಸಕ್ಕರೆ ಕಮ್ಮಿ. ರಾತ್ರಿ ನಿದ್ದೆ ಸರಿ ಆಗ್ಲಿಲ್ಲ.
    tr: Naṅge kāphi bēḍa, ṭī. Sakkare kammi. Rātri nidde sari āglilla.
    en: No coffee for me — tea. Less sugar. I didn't sleep well last night.
  - who: shruti
    t: ಯಾಕೆ ದೀಪಾ? ಮೈಸೂರಿನಿಂದ ರಾತ್ರಿನೇ ಬಂದ್ಯಾ?
    tr: Yāke Dīpā? Maisūrininda rātrinē bandyā?
    en: Why, Deepa? Did you come back from Mysuru last night?
  - who: deepa
    t: ಹೂಂ, ಸ್ವಲ್ಪ ಕೆಲಸ ಇತ್ತು ಅಲ್ಲಿ. ತಡ ಆಯ್ತು. ಏನಿಲ್ಲ.
    tr: Hūṁ, svalpa kelasa ittu alli. Taḍa āytu. Ēnilla.
    en: Mm, I had some work there. It got late. It's nothing.
  - scene: The idlis arrive, soft, as wide as a saucer, a cube of butter melting on each.
  - who: prakash
    t: ಆಹಾ! ಇದು ಭಾಳ ಛಲೋ ಐತಿ. ಬಾಯಾಗ ಕರಗತೈತಿ. ನಮ್ ಕಡೆ ಇಡ್ಲಿ ಇಷ್ಟು ಮೆತ್ತಗೆ ಸಿಗೂದಿಲ್ಲ.
    tr: Āhā! Idu bhāḷa chalō aiti. Bāyāga karagataiti. Nam kaḍe iḍli iṣṭu mettage sigūdilla.
    en: Aha! This is really good. It melts in the mouth. Back home you don't get idli this soft.
  - who: naveen
    t: ಉಡುಪಿಯಲ್ಲಿ ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಇಡ್ಲಿ ಉಂಟು. ಆದ್ರೆ ಹೈವೇ ಮೇಲೆ ಇದು ಬೊಂಬಾಟೇ. ಒಪ್ಪಿಕೊಳ್ತೇನೆ.
    tr: Uḍupiyalli idakkinta oḷḷe iḍli uṇṭu. Ādre haivē mēle idu bombāṭē. Oppikoḷtēne.
    en: In Udupi there's better idli than this. But for the highway, this is fantastic. I'll admit that.
  - who: imran
    t: ಉಡುಪಿಯವರು ತಮ್ಮ ಊರಿನ ಇಡ್ಲಿ ಬಿಟ್ಟು ಯಾವುದನ್ನೂ ಪೂರ್ತಿ ಹೊಗಳೂದಿಲ್ಲ. ಇದು ವೈದ್ಯಕೀಯವಾಗಿ ಸಾಬೀತಾದ ವಿಷಯ.
    tr: Uḍupiyavaru tamma ūrina iḍli biṭṭu yāvudannū pūrti hogaḷūdilla. Idu vaidyakīyavāgi sābītāda viṣaya.
    en: Udupi people never fully praise any idli except their own town's. That's a medically proven fact.
  - who: naveen
    t: ಡಾಕ್ಟ್ರೇ, ನೀವು ಕಲಬುರಗಿ ರೊಟ್ಟಿ ಬಗ್ಗೆ ಮಾತಾಡುವಾಗ ನಾನೂ ಹೀಗೇ ಹೇಳ್ತೇನೆ, ನೆನಪಿಟ್ಕೊಳ್ಳಿ.
    tr: Ḍākṭrē, nīvu Kalaburagi roṭṭi bagge mātāḍuvāga nānū hīgē hēḷtēne, nenapiṭkoḷḷi.
    en: Doctor, when you start talking about Kalaburagi rotti, I'll say the same thing — remember that.
  - who: imran
    t: ಒಂದು ಪ್ರಸ್ತಾವ. ಚಿತ್ರದುರ್ಗ ಆದ ಮೇಲೆ ದಾವಣಗೆರೆಗೆ ಹೋಗಿ ಬೆಣ್ಣೆ ದೋಸೆ ತಿನ್ನೋಣು. ಬೆಣ್ಣೆ ದೋಸೆ ತಿನ್ನದೆ ಉತ್ತರ ಕರ್ನಾಟಕಕ್ಕೆ ಹೋಗೋದು ಪಾಪ.
    tr: Ondu prastāva. Chitradurga āda mēle Dāvaṇagerege hōgi beṇṇe dōse tinnōṇu. Beṇṇe dōse tinnade uttara Karnāṭakakke hōgōdu pāpa.
    en: A proposal. After Chitradurga, let's go to Davanagere and eat benne dose. Going to North Karnataka without eating benne dose is a sin.
  - who: prakash
    t: ದಾವಣಗೆರೆ ಹಂಪಿ ದಾರಿಯಾಗ ಇಲ್ರೀ ಡಾಕ್ಟ್ರೇ. ಅದು ಹುಬ್ಬಳ್ಳಿ ಹೈವೇ ಮ್ಯಾಲ ಐತಿ. ಚಿತ್ರದುರ್ಗದಿಂದ ಅರವತ್ತು ಕಿಲೋಮೀಟರ್ ಉಲ್ಟಾ ಹೋಗಬೇಕು, ಮತ್ತ ವಾಪಸ್.
    tr: Dāvaṇagere Hampi dāriyāga illrī ḍākṭrē. Adu Hubbaḷḷi haivē myāla aiti. Chitradurgadinda aravattu kilōmīṭar ulṭā hōgabēku, matta vāpas.
    en: Davanagere isn't on the Hampi road, Doctor. It's on the Hubballi highway. From Chitradurga you'd have to go sixty kilometres the other way, and then come back.
  - who: arjun
    t: ನೂರಿಪ್ಪತ್ತು ಕಿಲೋಮೀಟರ್ ಒಂದು ದೋಸೆಗೆ? ಸೀನ್ ಇಲ್ಲ ಗುರು. ಕತ್ತಲಾಗೋದ್ರೊಳಗೆ ಹಂಪಿ ಮುಟ್ಟಬೇಕು.
    tr: Nūrippattu kilōmīṭar ondu dōsege? Sīn illa guru. Kattalāgōdroḷage Hampi muṭṭabēku.
    en: A hundred and twenty kilometres for one dosa? No chance, boss. We have to reach Hampi before dark.
  - who: naveen
    t: ದೋಸೆಗೋಸ್ಕರ ನೂರಿಪ್ಪತ್ತು ಕಿಲೋಮೀಟರ್ ಹೋಗುವುದು ತಪ್ಪಲ್ಲ ಮಾರಾಯ. ಉಡುಪಿಯವರು ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಹೋಗ್ತಾರೆ. ಆದ್ರೆ ಈ ಸಲ ಬೇಡ. ವಾಪಸ್ ಬರುವಾಗ ನೋಡುವ.
    tr: Dōsegōskara nūrippattu kilōmīṭar hōguvudu tappalla mārāya. Uḍupiyavaru adakkinta jāsti hōgtāre. Ādre ī sala bēḍa. Vāpas baruvāga nōḍuva.
    en: Going a hundred and twenty kilometres for a dosa isn't wrong, maraya. Udupi people go further than that. But not this time. Let's see on the way back.
  - who: imran
    t: 'ಆತು. ಆದ್ರ ಬರೆದು ಇಡ್ರಿ: ಬೆಣ್ಣೆ ದೋಸೆ ಬಾಕಿ ಐತಿ. ಕಾವೇರಿ, ಇದು ಒಪ್ಪಂದ.'
    tr: 'Ātu. Ādra baredu iḍri: beṇṇe dōse bāki aiti. Kāvēri, idu oppanda.'
    en: 'Fine. But write it down: benne dose is pending. Kaveri, this is a contract.'
  - who: kaveri
    t: ದಾಖಲಿಸಲಾಗಿದೆ. ಬೆಣ್ಣೆ ದೋಸೆ ಬಾಕಿ. ಬಡ್ಡಿ ಸಮೇತ.
    tr: Dākhalisalāgide. Beṇṇe dōse bāki. Baḍḍi samēta.
    en: Recorded. Benne dose outstanding. With interest.
  - scene: At the counter, Arjun takes out his phone to pay for everyone. Naveen's hand is already there with cash.
  - who: arjun
    t: ಅಣ್ಣಾ, ಎಲ್ಲಾದ್ದೂ ಸೇರಿ ಎಷ್ಟಾಯ್ತು? ಯುಪಿಐ ಮಾಡ್ತೀನಿ, ಸ್ಕ್ಯಾನರ್ ತೋರಿಸಿ.
    tr: Aṇṇā, ellāddū sēri eṣṭāytu? Yu-pi-ai māḍtīni, skyānar tōrisi.
    en: Anna, how much for everything together? I'll pay by UPI — show me the scanner.
  - who: naveen
    t: ಬೇಡ ಮಾರಾಯ. ನಮ್ಮ ಕಾರಿನ ನಾಲ್ಕು ಪ್ಲೇಟ್ ನಾನು ಕೊಡ್ತೇನೆ, ನಿನ್ನ ಕಾರಿನದ್ದು ನೀನು ಕೊಡು. ಆಮೇಲೆ ಆ್ಯಪ್‌ನಲ್ಲಿ ಹಾಕುವ.
    tr: Bēḍa mārāya. Namma kārina nālku plēṭ nānu koḍtēne, ninna kārinaddu nīnu koḍu. Āmēle āyp-nalli hākuva.
    en: No, maraya. I'll pay for the four plates from our car; you pay for yours. We'll put it in the app later.
  - who: arjun
    t: ಏನ್ ಮಗಾ, ಇನ್ನೂರು ರೂಪಾಯಿ ಇಡ್ಲಿಗೆ ಇಷ್ಟು ಲೆಕ್ಕನಾ? ಕೋರ್ಟ್ ಕೇಸ್ ತರ ಮಾಡ್ತಿದೀಯಲ್ಲ.
    tr: Ēn magā, innūru rūpāyi iḍlige iṣṭu lekkanā? Kōrṭ kēs tara māḍtidīyalla.
    en: Come on, maga, this much accounting over two hundred rupees of idli? You're making it sound like a court case.
  - who: naveen
    t: ಸಣ್ಣ ಲೆಕ್ಕ ಸರಿ ಇದ್ರೆನೇ ದೊಡ್ಡ ಲೆಕ್ಕ ಸರಿ ಇರ್ತದೆ. ಹೋಟೆಲ್ ನಡೆಸುವವನಿಗೆ ಅದೇ ಮೊದಲ ಪಾಠ.
    tr: Saṇṇa lekka sari idrenē doḍḍa lekka sari irtade. Hōṭel naḍesuvavanige adē modala pāṭha.
    en: Only when the small accounts are straight do the big ones stay straight. That's the first lesson for anyone who runs a hotel.
  - scene: He pays in cash, counts the change twice, and walks out to the cars without waiting. Kaveri, drying her hands at the tap, has heard every word.
  - who: kaveri
    t: ನವೀನ್ ಯಾವಾಗಿಂದ ಇಷ್ಟು ಕಟ್ಟುನಿಟ್ಟು ಆದ? ಕಾಲೇಜಲ್ಲಿ ಕ್ಯಾಂಟೀನ್ ಬಿಲ್ ಎಲ್ಲಾ ಅವನೇ ಕೊಡ್ತಿದ್ದ.
    tr: Navīn yāvāginda iṣṭu kaṭṭuniṭṭu āda? Kālējalli kyāṇṭīn bil ellā avanē koḍtidda.
    en: Since when has Naveen become this strict? In college he used to pay everybody's canteen bill.
  - who: deepa
    t: ದುಬೈ ಮನುಷ್ಯನ್ನ ಬದಲಾಯಿಸುತ್ತೆ ಅಂತಾರೆ. ಅಥವಾ ಬೇರೆ ಏನೋ ಇರ್ಬೋದು. ನಮಗ್ಯಾಕೆ, ಬಿಡು.
    tr: Dubai manuṣyanna badalāyisutte antāre. Athavā bēre ēnō irbōdu. Namagyāke, biḍu.
    en: They say Dubai changes a person. Or it could be something else. Why should we bother? Leave it.
  - who: kaveri
    t: ‘ನಮಗ್ಯಾಕೆ’ ಅನ್ನೋದು ಕೋರ್ಟಲ್ಲಿ ನಡೆಯಲ್ಲ, ದೀಪಾ. ಆದ್ರೆ ಸ್ನೇಹದಲ್ಲಿ ಕೆಲವೊಮ್ಮೆ ಅದೇ ಸರಿ. ಸದ್ಯಕ್ಕೆ.
    tr: ‘Namagyāke’ annōdu kōrṭalli naḍeyalla, Dīpā. Ādre snēhadalli kelavomme adē sari. Sadyakke.
    en: ‘Why should we bother’ doesn't work in court, Deepa. But in friendship it's sometimes the right thing. For now.
  - section: 'The car playlist: old films, new films'
    learn: 'film talk: blāk-basṭar, pyān-iṇḍiyā, phasṭ ḍē phasṭ śō, kathenē illa, bilḍap · cinema facts, dated: Kāntāra adhyāya ondu, eṇṭu nūru kōṭi, Ṭāksik nirāśe · respect: Appu, Rājkumār, kaṇṇu dāna · a lawyer''s caution: kēs kōrṭ-nallide, kānūnu ellrigū ondē'
  - scene: 8:10 a.m. Back on NH-48, past Tumakuru. In Arjun's car the playlist moves to ‘Anisuthide’ from Mungaru Male. Ramya calls from Naveen's car and stays on speaker.
  - who: shruti
    t: ಅಯ್ಯೋ, ಈ ಹಾಡು! ಎರಡು ಸಾವಿರದ ಆರು. ನಾವು ಹೈಸ್ಕೂಲ್‌ನಲ್ಲಿದ್ವಿ. ಮಳೆ ಬಂದ್ರೆ ಸಾಕು, ಎಲ್ರೂ ಇದನ್ನೇ ಹಾಡ್ತಿದ್ರು.
    tr: Ayyō, ī hāḍu! Eraḍu sāvirada āru. Nāvu haiskūl-nallidvi. Maḷe bandre sāku, ellrū idannē hāḍtidru.
    en: Oh, this song! 2006. We were in high school. The minute it rained, everyone would sing this.
  - who: arjun
    t: ಆವಾಗಿನ ಸಿನಿಮಾಗಳಲ್ಲಿ ಕಥೆ ಇತ್ತು, ಹಾಡು ಇತ್ತು. ಈಗ ಎಲ್ಲಾ ಪ್ಯಾನ್-ಇಂಡಿಯಾ. ಐದು ಭಾಷೆ, ಐನೂರು ಕೋಟಿ ಬಜೆಟ್, ಕಥೆ ಎಲ್ಲಿ ಅಂತ ಕೇಳಿದ್ರೆ ಯಾರಿಗೂ ಗೊತ್ತಿಲ್ಲ.
    tr: Āvāgina sinimāgaḷalli kathe ittu, hāḍu ittu. Īga ellā pyān-iṇḍiyā. Aidu bhāṣe, ainūru kōṭi bajeṭ, kathe elli anta kēḷidre yārigū gottilla.
    en: The films back then had a story, they had songs. Now everything's pan-India. Five languages, a five-hundred-crore budget, and if you ask where the story is, nobody knows.
  - who: ramya
    t: ಏಯ್, ಅದು ಸುಳ್ಳು! ಕಾಂತಾರ ಅಧ್ಯಾಯ ಒಂದು ನೋಡು. ಕಳೆದ ವರ್ಷ ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಬಂತು. ಸುಮಾರು ಎಂಟು ನೂರು ಕೋಟಿ. ಕೆಜಿಎಫ್ ಎರಡರ ನಂತರ ಕನ್ನಡದ ಎರಡನೇ ದೊಡ್ಡ ಸಿನಿಮಾ. ಅದರಲ್ಲಿ ಕಥೆ ಇರ್ಲಿಲ್ವಾ?
    tr: Ēy, adu suḷḷu! Kāntāra adhyāya ondu nōḍu. Kaḷeda varṣa akṭōbar-nalli bantu. Sumāru eṇṭu nūru kōṭi. Ke-ji-eph eraḍara nantara Kannaḍada eraḍanē doḍḍa sinimā. Adaralli kathe irlilvā?
    en: 'Hey, that''s not true! Look at Kantara: Chapter 1. It came out in October last year. Around eight hundred crore. The second-biggest Kannada film after KGF 2. Didn''t that have a story?'
  - who: arjun
    t: ಕಾಂತಾರ ಬೇರೆ. ಅದು ನೆಲದ ಕಥೆ. ನಾನು ಹೇಳ್ತಿರೋದು ಆ ಬಿಲ್ಡಪ್ ಸಿನಿಮಾಗಳ ಬಗ್ಗೆ. ಉದಾಹರಣೆಗೆ ಆಗಸ್ಟ್‌ನಲ್ಲಿ ಬಂದ ‘ಟಾಕ್ಸಿಕ್’.
    tr: Kāntāra bēre. Adu nelada kathe. Nānu hēḷtirōdu ā bilḍap sinimāgaḷa bagge. Udāharaṇege āgasṭ-nalli banda ‘Ṭāksik’.
    en: Kantara's different. It's a story of the soil. I'm talking about those hype films. Like ‘Toxic’, which came out in August.
  - who: imran
    t: ಟಾಕ್ಸಿಕ್ ನಾನು ಕಲಬುರಗಿಯಾಗ ಫಸ್ಟ್ ಡೇ ಫಸ್ಟ್ ಶೋ ನೋಡಿದೆ. ಮೊದಲ ದಿನ ನೂರು ಕೋಟಿ ಅಂದ್ರು. ಎರಡನೇ ದಿನ ಥಿಯೇಟರ್ ಖಾಲಿ. ಯಶ್ ಅಂದ್ರ ನಂಗ ಇಷ್ಟ, ಆದ್ರ ಈ ಸಲ ನಿರಾಶೆ ಆತು ಯಪ್ಪಾ.
    tr: Ṭāksik nānu Kalaburagiyāga phasṭ ḍē phasṭ śō nōḍide. Modala dina nūru kōṭi andru. Eraḍanē dina thiyēṭar khāli. Yaś andra naṅga iṣṭa, ādra ī sala nirāśe ātu yappā.
    en: I saw Toxic first day, first show, in Kalaburagi. They said a hundred crore on day one. On day two, the theatre was empty. I like Yash, but this time I was disappointed, yappa.
  - who: prakash
    t: ನನಗ ಹಳೇ ಸಿನಿಮಾನೇ ಇಷ್ಟ್ರಿ. ರಾಜ್‌ಕುಮಾರ್ ಅವರ ‘ಬಂಗಾರದ ಮನುಷ್ಯ’. ನಮ್ ಅಪ್ಪಾಜಿ ಅದನ್ನ ಹತ್ತು ಸಲ ನೋಡ್ಯಾರ. ಅದರಾಗ ಹೀರೋ ಹೊಡೆದಾಟ ಮಾಡಂಗಿಲ್ಲ, ಹೊಲ ಉಳತಾನ, ಊರು ಕಟ್ಟತಾನ.
    tr: Nanaga haḷē sinimānē iṣṭri. Rājkumār avara ‘Baṅgārada Manuṣya’. Nam appāji adanna hattu sala nōḍyāra. Adarāga hīrō hoḍedāṭa māḍaṅgilla, hola uḷatāna, ūru kaṭṭatāna.
    en: I like the old films. Rajkumar's ‘Bangarada Manushya’. My father has seen it ten times. In it the hero doesn't fight; he ploughs the field, he builds the village.
  - who: shruti
    t: ರಾಜ್‌ಕುಮಾರ್ ಅಂದ್ರೆ ನೆನಪಾಯ್ತು. ಅಕ್ಟೋಬರ್ ಇಪ್ಪತ್ತೊಂಬತ್ತಕ್ಕೆ ಅಪ್ಪು ಹೋಗಿ ಐದು ವರ್ಷ ಆಯ್ತು. ನಮ್ಮ ಮಲ್ಲೇಶ್ವರದಲ್ಲಿ ಹುಡುಗರು ಕಣ್ಣು ದಾನದ ಕ್ಯಾಂಪ್ ಮಾಡಿದ್ರು. ನಾನೂ ಫಾರ್ಮ್ ತುಂಬಿದೆ.
    tr: Rājkumār andre nenapāytu. Akṭōbar ippattombattakke Appu hōgi aidu varṣa āytu. Namma Mallēśvaradalli huḍugaru kaṇṇu dānada kyāmp māḍidru. Nānū phārm tumbide.
    en: Speaking of Rajkumar — on October twenty-ninth it was five years since Appu passed. In our Malleshwaram the boys held an eye-donation camp. I filled in the form too.
  - who: imran
    t: ಅಪ್ಪು ಹೋದ ಮೇಲೆ ನಮ್ ಆಸ್ಪತ್ರೆಗೂ ಕಣ್ಣು ದಾನದ ಫಾರ್ಮ್ ಭಾಳ ಬಂದ್ವು. ಒಬ್ಬ ಮನುಷ್ಯ ಹೋದ ಮೇಲೂ ಇಷ್ಟು ಜನಕ್ಕೆ ಬೆಳಕು ಕೊಡ್ತಾನ ಅಂದ್ರ, ಅದು ನಿಜವಾದ ಹೀರೋ.
    tr: Appu hōda mēle nam āspatregū kaṇṇu dānada phārm bhāḷa bandvu. Obba manuṣya hōda mēlū iṣṭu janakke beḷaku koḍtāna andra, adu nijavāda hīrō.
    en: After Appu passed, lots of eye-donation forms came to our hospital too. If a man gives light to so many people even after he's gone, that's a real hero.
  - who: ramya
    t: ಹೀರೋ ಅಂದ್ರೆ… ದರ್ಶನ್ ಕೇಸ್ ಬಗ್ಗೆ ಯಾರಿಗೂ ಅಭಿಪ್ರಾಯ ಇಲ್ವಾ? ಮೇ ತಿಂಗಳಲ್ಲಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಮತ್ತೆ ಬೇಲ್ ಕೊಡ್ಲಿಲ್ಲ. ಟ್ರಯಲ್ ಬೇಗ ಮುಗಿಸಿ ಅಂತ ಹೇಳಿದೆ.
    tr: Hīrō andre… Darśan kēs bagge yārigū abhiprāya ilvā? Mē tiṅgaḷalli Suprīṁ Kōrṭ matte bēl koḍlilla. Ṭrayal bēga mugisi anta hēḷide.
    en: Speaking of heroes… does nobody have an opinion on the Darshan case? In May the Supreme Court refused bail again. It said to finish the trial quickly.
  - who: arjun
    t: ರಮ್ಯಾ, ನೀನು ಟಿವಿ ಸ್ಟುಡಿಯೋದಲ್ಲಿಲ್ಲ. ಬೆಳಗ್ಗೆ ಎಂಟು ಗಂಟೆಗೆ ಪ್ರೈಮ್ ಟೈಮ್ ಡಿಬೇಟ್ ಬೇಡ.
    tr: Ramyā, nīnu ṭivi sṭuḍiyōdallilla. Beḷagge eṇṭu gaṇṭege praim ṭaim ḍibēṭ bēḍa.
    en: Ramya, you're not in a TV studio. No prime-time debate at eight in the morning.
  - who: kaveri
    t: ನನ್ನ ಅಭಿಪ್ರಾಯ ಚಿಕ್ಕದು. ಕೇಸ್ ಕೋರ್ಟ್‌ನಲ್ಲಿದೆ. ಆರೋಪ ಸಾಬೀತಾಗೋವರೆಗೆ ಯಾರೂ ಅಪರಾಧಿ ಅಲ್ಲ. ಆದ್ರೆ ಸ್ಟಾರ್ ಅಂತ ವಿಶೇಷ ರಿಯಾಯಿತಿನೂ ಇಲ್ಲ. ಕಾನೂನು ಎಲ್ರಿಗೂ ಒಂದೇ.
    tr: Nanna abhiprāya chikkadu. Kēs kōrṭ-nallide. Ārōpa sābītāgōvarege yārū aparādhi alla. Ādre sṭār anta viśēṣa riyāyitinū illa. Kānūnu ellrigū ondē.
    en: My opinion is short. The case is in court. Nobody is guilty until the charge is proved. But there's no special discount for being a star, either. The law is the same for everyone.
  - who: ramya
    t: ವಕೀಲೆ ಮೇಡಂ ತೀರ್ಪು ಕೊಟ್ಟಾಯ್ತು. ಸರಿ, ನೆಟ್‌ವರ್ಕ್ ಹೋಗ್ತಿದೆ… ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ಸಿಗುವ…
    tr: Vakīle mēḍam tīrpu koṭṭāytu. Sari, neṭ-vark hōgtide… Chitradurgadalli siguva…
    en: Madam Lawyer has delivered her verdict. Okay, the network's going… see you at Chitradurga…
  - scene: The call drops. Prakash and Imran doze off in the back row, heads tilted together. For a few kilometres it is only Arjun and Shruti awake in front.
  - who: arjun
    t: ಆದ್ಯಾ, ಇಶಾನ್… ಫೋಟೋ ಇದ್ರೆ ತೋರಿಸು. ನಿನ್ ಇನ್‌ಸ್ಟಾ ಪ್ರೈವೇಟ್, ನಾನು ಯಾವತ್ತೂ ನೋಡಿಲ್ಲ.
    tr: Ādyā, Iśān… phōṭō idre tōrisu. Nin Insṭā praivēṭ, nānu yāvattū nōḍilla.
    en: Aadya, Ishaan… show me a photo if you have one. Your Insta's private; I've never seen them.
  - who: shruti
    t: ಅದಕ್ಕೇ ಪ್ರೈವೇಟ್. ತಗೋ, ಇದು ಆದ್ಯಾ, ಸ್ಕೂಲ್ ಡೇ ಡ್ಯಾನ್ಸ್. ಇದು ಇಶಾನ್, ಅಪ್ಪನ ಕನ್ನಡಕ ಹಾಕ್ಕೊಂಡು.
    tr: Adakkē praivēṭ. Tagō, idu Ādyā, skūl ḍē ḍyāns. Idu Iśān, appana kannaḍaka hākkoṇḍu.
    en: That's why it's private. Here — this is Aadya, her school-day dance. This is Ishaan, wearing his dad's glasses.
  - who: arjun
    t: ಆದ್ಯಾ ಥೇಟ್ ನಿನ್ನ ಹಾಗೇ ಇದಾಳೆ. ಅದೇ ಕಣ್ಣು, ಅದೇ ‘ನನ್ನ ದಾರಿ ಬಿಡು’ ನಗು.
    tr: Ādyā thēṭ ninna hāgē idāḷe. Adē kaṇṇu, adē ‘nanna dāri biḍu’ nagu.
    en: Aadya looks exactly like you. The same eyes, the same ‘get out of my way’ smile.
  - who: shruti
    t: ನಿನ್ನ ಅಮ್ಮ ಹೇಗಿದಾರೆ? ಜಯನಗರದ ಮನೆಯಲ್ಲೇ ಇದಾರಾ?
    tr: Ninna amma hēgidāre? Jayanagarada maneyallē idārā?
    en: How's your mother? Is she still in the Jayanagar house?
  - who: arjun
    t: ಹೂಂ. ಮಂಡಿ ನೋವು, ಆದ್ರೂ ದಿನಾ ಬೆಳಗ್ಗೆ ಮಾರ್ಕೆಟ್‌ಗೆ ಹೋಗ್ತಾರೆ. ಅವರು ಈಗಲೂ ಕೇಳ್ತಾರೆ, ‘ಆ ಮಲ್ಲೇಶ್ವರದ ಹುಡುಗಿ ಹೇಗಿದಾಳೆ’ ಅಂತ.
    tr: Hūṁ. Maṇḍi nōvu, ādrū dinā beḷagge mārkeṭ-ge hōgtāre. Avaru īgalū kēḷtāre, ‘ā Mallēśvarada huḍugi hēgidāḷe’ anta.
    en: Mm. Bad knees, but she still goes to the market every morning. She still asks, ‘How's that Malleshwaram girl?’
  - who: shruti
    t: ಹೇಳು, ‘ಆ ಹುಡುಗಿಗೆ ಮೂವತ್ನಾಲ್ಕು ವರ್ಷ, ಎರಡು ಮಕ್ಕಳು, ಚೆನ್ನಾಗಿದಾಳೆ’ ಅಂತ. ರಸ್ತೆ ನೋಡು, ಅರ್ಜುನ್.
    tr: Hēḷu, ‘ā huḍugige mūvatnālku varṣa, eraḍu makkaḷu, chennāgidāḷe’ anta. Raste nōḍu, Arjun.
    en: Tell her, ‘That girl is thirty-four, has two children, and is fine.’ Watch the road, Arjun.
  - who: arjun
    t: ಹೇಳ್ತೀನಿ. ಆದ್ರೆ ಅಮ್ಮ ನಂಬಲ್ಲ. ‘ಆ ಹುಡುಗಿನ ಕಳ್ಕೊಂಡಿದ್ದು ನಿನ್ನ ಸ್ವಂತ ತಪ್ಪು’ ಅಂತ ಇವತ್ತಿಗೂ ಹೇಳ್ತಾರೆ.
    tr: Hēḷtīni. Ādre amma namballa. ‘Ā huḍugina kaḷkoṇḍiddu ninna svanta tappu’ anta ivattigū hēḷtāre.
    en: I'll tell her. But Amma won't believe it. To this day she says, ‘Losing that girl was your own fault.’
  - who: shruti
    t: ನಿಮ್ ಮನೇಲಿ ಯಾವಾಗ್ಲೂ ಬುದ್ಧಿ ಇದ್ದಿದ್ದು ನಿಮ್ಮಮ್ಮನಿಗೆ ಮಾತ್ರ. ರೋಡ್ ನೋಡು ಅಂದೆ.
    tr: Nim manēli yāvāglū buddhi iddiddu nimmammanige mātra. Rōḍ nōḍu ande.
    en: In your house, the only one with any sense was always your mother. I said, watch the road.
  - scene: Imran wakes up with a start as the car hits a speed breaker. Prakash opens his eyes and looks out at the fields.
  - section: Politics in the back seat
    learn: 'arguing: ondu nimiṣa, nan mātu mugisli, ond maṭṭige opputtīni ādre…, tappu tiḷkōbēḍa · Karnataka politics, dated: Ḍi.Ke. Śivakumār, jūn mūrakke si-eṁ · the guarantees: Śakti, Gr̥halakṣmi, bāki kantu · the caste survey: varadi, mīsalāti, jāri · Dharwad -ri: illri, mātāḍli; ending: rājakīya sāku'
  - scene: 9:00 a.m. Past Sira. Sun on the windscreen, the road straight and wide. A billboard with the Chief Minister's face goes by.
  - who: arjun
    t: ನೋಡು, ಡಿ.ಕೆ. ಶಿವಕುಮಾರ್ ಫೋಟೋ ಎಲ್ಲಾ ಕಡೆ. ಜೂನ್ ಮೂರಕ್ಕೆ ಸಿಎಂ ಆದ್ರು. ಆರು ತಿಂಗಳಲ್ಲಿ ಬೋರ್ಡ್‌ಗಳು ಮಾತ್ರ ಬದಲಾಗಿವೆ. ಬೆಂಗಳೂರು ರಸ್ತೆ ಹಾಗೇ ಇದೆ.
    tr: Nōḍu, Ḍi.Ke. Śivakumār phōṭō ellā kaḍe. Jūn mūrakke si-eṁ ādru. Āru tiṅgaḷalli bōrḍ-gaḷu mātra badalāgive. Beṅgaḷūru raste hāgē ide.
    en: Look, D.K. Shivakumar's photo everywhere. He became CM on the third of June. In six months only the boards have changed. Bengaluru's roads are exactly the same.
  - who: imran
    t: ಬೆಂಗಳೂರು ರಸ್ತೆ? ಯಪ್ಪಾ, ನೀವು ಹದಿನೇಳು ಸಾವಿರ ಕೋಟಿ ಟನಲ್ ರೋಡ್ ಬಗ್ಗೆ ಜಗಳ ಆಡ್ತೀರಿ. ನಮ್ ಕಡೆ ತಾಲೂಕು ಆಸ್ಪತ್ರೆಗೆ ಹೋಗೋ ರಸ್ತೆನೇ ಸರಿ ಇಲ್ಲ. ಆಂಬುಲೆನ್ಸ್ ಒಳಗೇ ಹೆರಿಗೆ ಆಗೈತಿ, ನಾನೇ ನೋಡೇನಿ.
    tr: Beṅgaḷūru raste? Yappā, nīvu hadinēḷu sāvira kōṭi ṭanal rōḍ bagge jagaḷa āḍtīri. Nam kaḍe tālūku āspatrege hōgō rastenē sari illa. Āmbulens oḷagē herige āgaiti, nānē nōḍēni.
    en: Bengaluru's roads? Yappa, you people fight about a seventeen-thousand-crore tunnel road. Where I live, even the road to the taluk hospital is broken. A baby has been born inside an ambulance — I've seen it myself.
  - who: arjun
    t: ಒಂದು ನಿಮಿಷ, ನನ್ ಮಾತು ಮುಗಿಸ್ಲಿ. ನಾನೂ ಟನಲ್ ರೋಡ್ ಪರ ಇಲ್ಲ. ಅದರ ಬಗ್ಗೆ ಹೈಕೋರ್ಟ್‌ನಲ್ಲಿ ಪಿಐಎಲ್ ಇದೆ ಅಂತ ಓದಿದೆ. ನನ್ ಪಾಯಿಂಟ್ ಅಂದ್ರೆ, ಬೆಂಗಳೂರು ರಾಜ್ಯಕ್ಕೆ ದುಡ್ಡು ಕೊಡುತ್ತೆ, ಆದ್ರೆ ನಮಗೆ ಫುಟ್‌ಪಾತ್ ಕೂಡ ಇಲ್ಲ.
    tr: Ondu nimiṣa, nan mātu mugisli. Nānū ṭanal rōḍ para illa. Adara bagge Haikōrṭ-nalli pi-ai-el ide anta ōdide. Nan pāyiṇṭ andre, Beṅgaḷūru rājyakke duḍḍu koḍutte, ādre namage phuṭ-pāth kūḍa illa.
    en: One minute, let me finish. I'm not for the tunnel road either. I read there's a PIL about it in the High Court. My point is, Bengaluru gives the state its money, and we don't even have footpaths.
  - who: imran
    t: ಮತ್ತ ಅದೇ ‘ನಾವು ದುಡ್ಡು ಕೊಡ್ತೇವಿ’ ಮಾತು. ಕಲಬುರಗಿಯ ಹುಡುಗರು ನಿಮ್ ಬೆಂಗಳೂರಾಗ ಸೆಕ್ಯೂರಿಟಿ, ಡೆಲಿವರಿ ಕೆಲಸ ಮಾಡಿ ಆ ದುಡ್ಡು ದುಡಿದು ಕೊಡ್ತಾರ. ಅದನ್ನ ಭೀ ಲೆಕ್ಕಕ್ಕೆ ಹಾಕ್ರಿ.
    tr: Matta adē ‘nāvu duḍḍu koḍtēvi’ mātu. Kalaburagiya huḍugaru nim Beṅgaḷūrāga sekyūriṭi, ḍelivari kelasa māḍi ā duḍḍu duḍidu koḍtāra. Adanna bhī lekkakke hākri.
    en: There it is again — ‘we pay the money’. Boys from Kalaburagi earn that money for you, working security and delivery jobs in your Bengaluru. Count that too.
  - who: shruti
    t: ಸರಿ ಸರಿ, ಇಬ್ರೂ ಸ್ವಲ್ಪ ಸಮಾಧಾನ. ನಾನು ಒಂದು ಹೇಳ್ತೀನಿ. ಶಕ್ತಿ ಯೋಜನೆ ಬಂದ ಮೇಲೆ ನಮ್ಮ ಮನೆ ಕೆಲಸದ ಲಕ್ಷ್ಮಮ್ಮ ಫ್ರೀ ಬಸ್‌ನಲ್ಲಿ ತಿಂಗಳಿಗೆ ಸಾವಿರ ರೂಪಾಯಿ ಉಳಿಸ್ತಾರೆ. ಅದು ಅವರಿಗೆ ದೊಡ್ಡ ವಿಷಯ.
    tr: Sari sari, ibrū svalpa samādhāna. Nānu ondu hēḷtīni. Śakti yōjane banda mēle namma mane kelasada Lakṣmamma phrī bas-nalli tiṅgaḷige sāvira rūpāyi uḷistāre. Adu avarige doḍḍa viṣaya.
    en: Okay, okay, both of you calm down a little. Let me say one thing. Since the Shakti scheme came, Lakshmamma, who works in our house, saves a thousand rupees a month on the free bus. For her that's a big deal.
  - who: prakash
    t: ಶಕ್ತಿ ಛಲೋ ಐತಿ, ಖರೆ. ನಮ್ ಅವ್ವ ಭೀ ಹುಬ್ಬಳ್ಳಿಗೆ ಫ್ರೀ ಬಸ್ಸಿನ್ಯಾಗ ಹೋಗತಾರ. ಆದ್ರ ಗೃಹಲಕ್ಷ್ಮಿ ದುಡ್ಡು ಮೂರು ತಿಂಗಳು ಬರಲಿಲ್ಲ. ಈ ತಿಂಗಳ ಸುರುವಿಗೆ ಬಾಕಿ ಕಂತು ಒಟ್ಟಿಗೆ ಬಂತು ಅಂತ ಕೇಳಿದೆ. ಅವ್ವ ದಿನಾ ಬ್ಯಾಂಕ್ ಮೆಸೇಜ್ ನೋಡತಿದ್ರು.
    tr: Śakti chalō aiti, khare. Nam avva bhī Hubbaḷḷige phrī bassinyāga hōgatāra. Ādra Gr̥halakṣmi duḍḍu mūru tiṅgaḷu baralilla. Ī tiṅgaḷa suruvige bāki kantu oṭṭige bantu anta kēḷide. Avva dinā byāṅk mesēj nōḍatidru.
    en: Shakti is good, true. My Avva also goes to Hubballi on the free bus. But the Gruha Lakshmi money didn't come for three months. I heard the pending instalments came together at the start of the month. Avva was checking her bank messages every day.
  - who: arjun
    t: ಅದೇ ನಾನು ಹೇಳೋದು. ಗ್ಯಾರಂಟಿಗೆ ದುಡ್ಡು ಹೋಗುತ್ತೆ, ರಸ್ತೆಗೆ ದುಡ್ಡಿಲ್ಲ. ಎಲ್ಲಾ ಪಾರ್ಟಿನೂ ಒಂದೇ ಗುರು. ವೋಟಿಗೋಸ್ಕರ ಏನು ಬೇಕಾದ್ರೂ ಮಾಡ್ತಾರೆ.
    tr: Adē nānu hēḷōdu. Gyāraṇṭige duḍḍu hōgutte, rastege duḍḍilla. Ellā pārṭinū ondē guru. Vōṭigōskara ēnu bēkādrū māḍtāre.
    en: That's exactly what I'm saying. The money goes to the guarantees, and there's none for roads. All parties are the same, boss. They'll do anything for votes.
  - scene: Prakash, who has been looking out of the window, turns around.
  - who: prakash
    t: ಅರ್ಜುನ್, ತಪ್ಪು ತಿಳ್ಕೋಬ್ಯಾಡ್ರಿ. ಎರಡು ಸಾವಿರ ರೂಪಾಯಿ ನಿಮಗ ಒಂದು ಡಿನ್ನರ್. ನಮ್ ಅವ್ವಗ ಅದು ಒಂದು ತಿಂಗಳ ಔಷಧ. ನೀವು ಅದನ್ನ ‘ವೋಟಿಗೋಸ್ಕರ’ ಅಂತೀರಿ. ಅವ್ವ ಅದನ್ನ ‘ಮರ್ಯಾದೆ’ ಅಂತಾರ.
    tr: Arjun, tappu tiḷkōbyāḍri. Eraḍu sāvira rūpāyi nimaga ondu ḍinnar. Nam avvaga adu ondu tiṅgaḷa auṣadha. Nīvu adanna ‘vōṭigōskara’ antīri. Avva adanna ‘maryāde’ antāra.
    en: Arjun, don't take this wrongly. Two thousand rupees is one dinner for you. For my Avva it's a month of medicine. You call it ‘for votes’. Avva calls it ‘dignity’.
  - who: arjun
    t: ಸರಿ, ಒಂದ್ ಮಟ್ಟಿಗೆ ಒಪ್ಪುತ್ತೀನಿ. ಆದ್ರೆ ಜಾತಿ ಸಮೀಕ್ಷೆ ವಿಷಯ ನೋಡು. ವರದಿ ಮೇ ತಿಂಗಳಲ್ಲಿ ಕೊಟ್ರು, ಹೊಸ ಸರ್ಕಾರ ಜಾರಿ ಮಾಡ್ತೀವಿ ಅಂತಿದೆ. ಮೀಸಲಾತಿ ಇನ್ನೂ ಜಾಸ್ತಿ ಮಾಡ್ತಾರಂತೆ. ಹೀಗೇ ಆದ್ರೆ ಮೆರಿಟ್‌ಗೆ ಬೆಲೆ ಎಲ್ಲಿ?
    tr: Sari, ond maṭṭige opputtīni. Ādre jāti samīkṣe viṣaya nōḍu. Varadi Mē tiṅgaḷalli koṭru, hosa sarkāra jāri māḍtīvi antide. Mīsalāti innū jāsti māḍtārante. Hīgē ādre meriṭ-ge bele elli?
    en: All right, I agree up to a point. But look at the caste survey. The report came in May, and the new government says it'll implement it. Apparently they'll raise the reservation further. If it goes on like this, where's the value of merit?
  - who: shruti
    t: ಅರ್ಜುನ್, ಬೇಡ. ಈ ವಿಷಯ ಕಾರಲ್ಲಿ ಬೇಡ.
    tr: Arjun, bēḍa. Ī viṣaya kāralli bēḍa.
    en: Arjun, don't. Not this topic, not in the car.
  - who: prakash
    t: ಇಲ್ರಿ, ಮಾತಾಡ್ಲಿ. ಮೆರಿಟ್. ಛಲೋ ಶಬ್ದ. ಜಯನಗರದಾಗ ಹುಟ್ಟಿ, ಇಂಗ್ಲಿಷ್ ಸ್ಕೂಲ್, ಟ್ಯೂಷನ್, ಕೋಚಿಂಗ್, ಕಾರು. ಅದು ಮೆರಿಟ್. ಹಳ್ಳಿ ಸಾಲ್ಯಾಗ ಕಂದೀಲು ಬೆಳಕಿನಾಗ ಓದಿದ್ದು, ಅದು ಏನು? ಅದಕ್ಕ ಏನು ಹೆಸರು?
    tr: Illri, mātāḍli. Meriṭ. Chalō śabda. Jayanagaradāga huṭṭi, iṅgliṣ skūl, ṭyūṣan, kōchiṅg, kāru. Adu meriṭ. Haḷḷi sālyāga kandīlu beḷakināga ōdiddu, adu ēnu? Adakka ēnu hesaru?
    en: No, let him talk. Merit. A fine word. Born in Jayanagar, English school, tuition, coaching, a car. That's merit. Studying in a village school by the light of a kerosene lamp — what's that? What do you call that?
  - scene: Silence. Only the tyres on the road. Imran puts a hand on Prakash's shoulder.
  - who: imran
    t: ಪ್ರಕಾಶಾ, ಬಿಡಪಾ. ಅರ್ಜುನ್ ಬೆಂಗಳೂರಿನ ಗುಳ್ಳೆಯಾಗ ಇರ್ತಾನ, ಅವನಿಗೆ ಗೊತ್ತಿಲ್ಲ. ಅರ್ಜುನ್, ನೀನು ಒಂದು ಸಲ ನಮ್ ಕಡೆ ಹಳ್ಳಿಗಳಿಗೆ ಬಾ. ಆಮೇಲೆ ಮೆರಿಟ್ ಬಗ್ಗೆ ಮಾತಾಡು.
    tr: Prakāśā, biḍapā. Arjun Beṅgaḷūrina guḷḷeyāga irtāna, avanige gottilla. Arjun, nīnu ondu sala nam kaḍe haḷḷigaḷige bā. Āmēle meriṭ bagge mātāḍu.
    en: Prakasha, let it go, man. Arjun lives in the Bengaluru bubble; he doesn't know. Arjun, come once to the villages on our side. Then talk about merit.
  - who: arjun
    t: ಸರಿ, ಸರಿ. ಸಾರಿ, ಪ್ರಕಾಶ್. ನಾನು ಆ ಅರ್ಥದಲ್ಲಿ ಹೇಳ್ಲಿಲ್ಲ. ರಾಜಕೀಯ ಸಾಕು. ಪ್ರಕಾಶ್, ನೀನು ಕೆಎಎಸ್ ಬರೀತಿದ್ದೆಯಲ್ವಾ? ಏನಾಯ್ತು?
    tr: Sari, sari. Sāri, Prakāś. Nānu ā arthadalli hēḷlilla. Rājakīya sāku. Prakāś, nīnu Ke-e-es barītiddeyalvā? Ēnāytu?
    en: Okay, okay. Sorry, Prakash. I didn't mean it that way. Enough politics. Prakash, you were writing the KAS exam, weren't you? What happened?
  - who: prakash
    t: ಅದರ ಬಗ್ಗೆ ಇವತ್ತು ಬ್ಯಾಡ್ರಿ. ಧಾರವಾಡಕ್ಕೆ ಬಂದಾಗ ಹೇಳ್ತೇನಿ. ಈಗ ಹೋಳಿಗಿ ತಿನ್ರಿ.
    tr: Adara bagge ivattu byāḍri. Dhāravāḍakke bandāga hēḷtēni. Īga hōḷigi tinri.
    en: Not about that today. I'll tell you when we get to Dharwad. Now eat some holige.
  - scene: He opens the steel box and passes it around. Shruti pours coffee from the flask into four paper cups. The argument sits in the car with them, quiet, like a fifth passenger.
  - who: shruti
    t: ಹಿರಿಯೂರು ದಾಟಿದ್ರೆ ಇನ್ನು ನಲವತ್ತು ಕಿಲೋಮೀಟರ್. ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ಎಲ್ರೂ ಹೊಸದಾಗಿ ಶುರು ಮಾಡೋಣ, ಆಯ್ತಾ?
    tr: Hiriyūru dāṭidre innu nalavattu kilōmīṭar. Chitradurgadalli ellrū hosadāgi śuru māḍōṇa, āytā?
    en: After Hiriyur it's another forty kilometres. At Chitradurga let's all start fresh, okay?
  - who: imran
    t: 'ಡಾಕ್ಟರ್ ಸಲಹೆ: ಹೋಳಿಗಿ ತಿಂದ ಮೇಲೆ ಜಗಳ ಆಡಾಕ ಆಗೂದಿಲ್ಲ. ರಕ್ತದಾಗ ಸಕ್ಕರೆ ಜಾಸ್ತಿ ಆಗತೈತಿ, ಸಿಟ್ಟು ಕಡಿಮಿ ಆಗತೈತಿ.'
    tr: 'Ḍākṭar salahe: hōḷigi tinda mēle jagaḷa āḍāka āgūdilla. Raktadāga sakkare jāsti āgataiti, siṭṭu kaḍimi āgataiti.'
    en: 'Doctor''s advice: after holige, you can''t fight. The sugar in your blood goes up, and the anger comes down.'
  - who: prakash
    t: ಅದು ಯಾವ ಮೆಡಿಕಲ್ ಪುಸ್ತಕದಾಗ ಐತ್ರೀ ಡಾಕ್ಟ್ರೇ?
    tr: Adu yāva meḍikal pustakadāga aitrī ḍākṭrē?
    en: Which medical book is that in, Doctor?
  - who: imran
    t: ಕಲಬುರಗಿ ವೈದ್ಯಶಾಸ್ತ್ರ, ಮೊದಲ ಅಧ್ಯಾಯ. ನಾನೇ ಬರೆದೇನಿ.
    tr: Kalaburagi vaidyaśāstra, modala adhyāya. Nānē baredēni.
    en: Kalaburagi Medicine, Chapter One. I wrote it myself.
  - scene: Prakash laughs for the first time since Sira. Ahead, the low granite hills of Chitradurga rise out of the plain.
  - who: shruti
    t: ಪ್ರಕಾಶ್, ಟ್ರೇನಿಂಗ್ ಹೇಗಿತ್ತು? ಒಂದು ವಾರ ಪೂರ್ತಿ ಬೆಂಗಳೂರಲ್ಲಿ.
    tr: Prakāś, ṭrēniṅg hēgittu? Ondu vāra pūrti Beṅgaḷūralli.
    en: Prakash, how was the training? A whole week in Bengaluru.
  - who: prakash
    t: ಟ್ರೇನಿಂಗ್ ಛಲೋ ಇತ್ತ್ರಿ. ಸ್ಮಾರ್ಟ್ ಕ್ಲಾಸ್, ಡಿಜಿಟಲ್ ಬೋರ್ಡ್ ಎಲ್ಲಾ ಹೇಳಿಕೊಟ್ರು. ಆದ್ರ ನಮ್ ಸಾಲ್ಯಾಗ ದಿನಕ್ಕ ನಾಕು ತಾಸು ಕರೆಂಟ್ ಇರಂಗಿಲ್ಲ. ಮೂರು ಮಾಸ್ತರ ಜಾಗ ಖಾಲಿ ಅವ. ಗಣಿತ, ವಿಜ್ಞಾನ, ಕೆಲವು ಸಲ ಇಂಗ್ಲೀಷ್ ಕೂಡ ನಾನೇ ಕಲಿಸ್ತೇನಿ.
    tr: Ṭrēniṅg chalō ittri. Smārṭ klās, ḍijiṭal bōrḍ ellā hēḷikoṭru. Ādra nam sālyāga dinakka nāku tāsu kareṇṭ iraṅgilla. Mūru māstara jāga khāli ava. Gaṇita, vijñāna, kelavu sala iṅglīṣ kūḍa nānē kalistēni.
    en: The training was good. They taught us smart classes, digital boards, all that. But in my school there's no power for four hours a day. Three teaching posts are vacant. Maths, science, sometimes even English — I teach them all myself.
  - who: shruti
    t: ಇಂಗ್ಲೀಷ್ ಕೂಡ ನೀನೇನಾ?
    tr: Iṅglīṣ kūḍa nīnēnā?
    en: English too — you?
  - who: prakash
    t: ಹೌದ್ರಿ. ನಮ್ಮಂಥವರ ಇಂಗ್ಲೀಷ್ ಕೇಳಿ ಬೆಂಗಳೂರಿನವ್ರು ನಗ್ತಾರ. ಆದ್ರ ಹಳ್ಳಿ ಹುಡುಗರಿಗೆ ಅದೇ ಮೊದಲ ಬಾಗಿಲು. ಬಾಗಿಲು ಚಿಕ್ಕದಿದ್ರೂ ಬಾಗಿಲೇ.
    tr: Haudri. Nammanthavara iṅglīṣ kēḷi Beṅgaḷūrinavru nagtāra. Ādra haḷḷi huḍugarige adē modala bāgilu. Bāgilu chikkadidrū bāgilē.
    en: Yes. Bengaluru people laugh when they hear the English of people like us. But for village kids it's the first door. Even a small door is a door.
  - who: imran
    t: ಖರೇ ಮಾತು. ನಮ್ ಕಡೆ ಹುಡುಗರಿಗೆ ಆ ಬಾಗಿಲು ತೆಗಿಯಾಕ ನಿನ್ನಂಥ ಮಾಸ್ತರ ಬೇಕು ಯಪ್ಪಾ.
    tr: Kharē mātu. Nam kaḍe huḍugarige ā bāgilu tegiyāka ninnantha māstara bēku yappā.
    en: That's the truth. Kids on our side need a teacher like you to open that door, yappa.
  - scene: Arjun, at the wheel, hears the word 'laugh' and, for once, says nothing.
  - chapter: Chapter 3 — Chitradurga fort
  - section: The seven-ringed fort
    learn: 'history words: kōṭe, ēḷu suttu, batēri, heb-bāgilu, pāḷēgāraru, kallu · reading a notice aloud (bookish -ide/-ttade): illi dhūmapāna niṣēdhisalāgide · a teacher''s way of telling: kēḷri, ondu kathe aiti · teasing a teacher: mēṣṭru śuru māḍidru'
  - scene: 11:00 a.m. Chitradurga fort. Huge rounded granite boulders, walls winding over the hill in ring after ring. The December sun is already sharp. The two cars park near the main gate; schoolchildren in blue uniforms stream past in a line.
  - who: ramya
    t: ಎಂತ ಚಂದ ಮರ್ರೆ! ಇದನ್ನ ಡ್ರೋನ್‌ನಲ್ಲಿ ಶೂಟ್ ಮಾಡ್ಬೇಕಿತ್ತು. ಬಂಡೆ ಮೇಲೆ ಬಂಡೆ, ಅದರ ಮೇಲೆ ಗೋಡೆ!
    tr: Enta chanda marre! Idanna ḍrōn-nalli śūṭ māḍbēkittu. Baṇḍe mēle baṇḍe, adara mēle gōḍe!
    en: How beautiful, man! I should have shot this with a drone. Boulder on boulder, and a wall on top of that!
  - who: kaveri
    t: ಡ್ರೋನ್ ಇಲ್ಲಿ ಅನುಮತಿ ಇಲ್ಲದೆ ಹಾರಿಸಬಾರದು, ರಮ್ಯಾ. ಬೋರ್ಡ್ ನೋಡು. ‘ಇದು ಕೇಂದ್ರ ಸಂರಕ್ಷಿತ ಸ್ಮಾರಕ. ಇಲ್ಲಿ ಹಾನಿ ಮಾಡುವುದು ಶಿಕ್ಷಾರ್ಹ ಅಪರಾಧವಾಗಿರುತ್ತದೆ.’
    tr: Ḍrōn illi anumati illade hārisabāradu, Ramyā. Bōrḍ nōḍu. ‘Idu kēndra saṁrakṣita smāraka. Illi hāni māḍuvudu śikṣārha aparādhavāgiruttade.’
    en: You can't fly a drone here without permission, Ramya. Look at the board. ‘This is a centrally protected monument. Damaging it is a punishable offence.’
  - who: naveen
    t: ವಕೀಲೆ ಬೋರ್ಡ್ ಓದಿದ್ರೆ ಅದೂ ಕೋರ್ಟ್ ತೀರ್ಪಿನ ಹಾಗೇ ಕೇಳ್ತದೆ ಮಾರಾಯ.
    tr: Vakīle bōrḍ ōdidre adū kōrṭ tīrpina hāgē kēḷtade mārāya.
    en: When the lawyer reads a board, even that sounds like a court verdict, maraya.
  - who: prakash
    t: ಈ ಕೋಟೆಗೆ ‘ಏಳು ಸುತ್ತಿನ ಕೋಟೆ’ ಅಂತಾರ್ರಿ. ಏಳು ಸುತ್ತು ಗೋಡೆ. ಹದಿನೇಳನೇ, ಹದಿನೆಂಟನೇ ಶತಮಾನದಾಗ ನಾಯಕರು, ಅಂದ್ರ ಪಾಳೇಗಾರರು, ಇದನ್ನ ಭಾಳ ಗಟ್ಟಿ ಮಾಡಿದ್ರು. ಕೊನೆಯ ದೊರೆ ಮದಕರಿ ನಾಯಕ.
    tr: Ī kōṭege ‘ēḷu suttina kōṭe’ antārri. Ēḷu suttu gōḍe. Hadinēḷanē, hadineṇṭanē śatamānadāga nāyakaru, andra pāḷēgāraru, idanna bhāḷa gaṭṭi māḍidru. Koneya dore Madakari Nāyaka.
    en: They call this fort ‘the fort of seven rings’. Seven rings of walls. In the seventeenth and eighteenth centuries the Nayakas — the palegars — made it very strong. The last ruler was Madakari Nayaka.
  - who: arjun
    t: ಓಹೋ, ಮೇಷ್ಟ್ರು ಕ್ಲಾಸ್ ಶುರು ಮಾಡಿದ್ರು. ಎಲ್ರೂ ಸಾಲಾಗಿ ನಿಂತ್ಕೊಳ್ಳಿ, ಹಾಜರಾತಿ ತಗೋತಾರೆ.
    tr: Ōhō, mēṣṭru klās śuru māḍidru. Ellrū sālāgi nintkoḷḷi, hājarāti tagōtāre.
    en: Oho, the schoolmaster has started his class. Everyone line up, he's taking attendance.
  - who: deepa
    t: ಅರ್ಜುನ್, ಸುಮ್ನಿರು. ಪ್ರಕಾಶ್, ನೀನು ಹೇಳು. ನಾನು ಇಲ್ಲಿಗೆ ಶಾಲೆಯ ಪ್ರವಾಸದಲ್ಲಿ ಬಂದಿದ್ದೆ, ಎಲ್ಲಾ ಮರೆತುಹೋಗಿದೆ.
    tr: Arjun, sumniru. Prakāś, nīnu hēḷu. Nānu illige śāleya pravāsadalli bandidde, ellā maretuhōgide.
    en: Arjun, be quiet. Prakash, you tell it. I came here on a school trip, and I've forgotten everything.
  - who: prakash
    t: ನೋಡ್ರಿ, ಈ ಗೋಡೆಗಳಿಗೆ ಸಿಮೆಂಟ್ ಇಲ್ಲ. ದೊಡ್ಡ ದೊಡ್ಡ ಕಲ್ಲುಗಳನ್ನ ಒಂದರ ಮೇಲೊಂದು ಕೂರಿಸ್ಯಾರ. ಮುನ್ನೂರು ವರ್ಷ ಆತು, ಇನ್ನೂ ನಿಂತಾವ. ಬೆಂಗಳೂರಿನ ಫ್ಲೈಓವರ್ ಹತ್ತು ವರ್ಷ ನಿಲ್ಲೂದಿಲ್ಲ.
    tr: Nōḍri, ī gōḍegaḷige simeṇṭ illa. Doḍḍa doḍḍa kallugaḷanna ondara mēlondu kūrisyāra. Munnūru varṣa ātu, innū nintāva. Beṅgaḷūrina phlai-ōvar hattu varṣa nillūdilla.
    en: Look, these walls have no cement. They set huge stones one on top of another. Three hundred years, and they're still standing. A Bengaluru flyover doesn't last ten.
  - who: imran
    t: ಬರೋಬ್ಬರಿ ಹೇಳಿದಿ ನೋಡು! ಇದು ನಿಜವಾದ ಎಂಜಿನಿಯರಿಂಗ್. ನಾವು ಎಂಟು ಜನ ಎಂಜಿನಿಯರಿಂಗ್ ಓದೇವಿ, ಒಂದು ಗೋಡೆ ಭೀ ಕಟ್ಟಿಲ್ಲ.
    tr: Barōbbari hēḷidi nōḍu! Idu nijavāda eñjiniyariṅg. Nāvu eṇṭu jana eñjiniyariṅg ōdēvi, ondu gōḍe bhī kaṭṭilla.
    en: Spot on! This is real engineering. Eight of us studied engineering, and not one of us has built even a wall.
  - who: shruti
    t: ನೀನು ಎಂಜಿನಿಯರಿಂಗ್ ಬಿಟ್ಟು ಡಾಕ್ಟರ್ ಆದೆ, ಇಮ್ರಾನ್. ನಾನು ಐಟಿ ಬಿಟ್ಟು ಅಮ್ಮ ಆದೆ. ಪ್ರಕಾಶ್ ಮೇಷ್ಟ್ರು ಆದ. ನಮ್ಮಲ್ಲಿ ಎಂಜಿನಿಯರ್ ಅಂತ ಉಳಿದಿರೋದು ದೀಪಾ ಒಬ್ಬಳೇ.
    tr: Nīnu eñjiniyariṅg biṭṭu ḍākṭar āde, Imrān. Nānu ai-ṭi biṭṭu amma āde. Prakāś mēṣṭru āda. Nammalli eñjiniyar anta uḷidirōdu Dīpā obbaḷē.
    en: You left engineering and became a doctor, Imran. I left IT and became a mother. Prakash became a teacher. The only one of us still an engineer is Deepa.
  - who: deepa
    t: ಎಂಜಿನಿಯರ್ ಅಲ್ಲ ಕಣೇ, ಕೋಡ್ ಬರೆಯೋ ಮೆಷಿನ್. ಅದೂ ಈಗ ಎಐ ಬರೆದುಕೊಡುತ್ತೆ. ಸರಿ, ಪ್ರಕಾಶ್, ಮುಂದೆ?
    tr: Eñjiniyar alla kaṇē, kōḍ bareyō meṣin. Adū īga e-ai baredukoḍutte. Sari, Prakāś, munde?
    en: Not an engineer — a code-writing machine. And now AI writes even that. Okay, Prakash, what next?
  - section: Onake Obavva's window
    learn: 'telling a legend: oṁdu dina…, āga…, konege… · the story''s words: onake (pestle), kiṇḍi (narrow opening), sainikaru, vīravanite, kāvalu · past habitual and sequence: baruttiddaru, hoḍedu ellegidaḷu · reported thought: ‘yārigū gottāgabāradu’ anta'
  - scene: 11:40 a.m. A narrow cleft between two boulders, just wide enough for one person to crawl through. A painted board above it reads ‘Onake Obavvana Kindi’. The schoolchildren crowd around it.
  - who: prakash
    t: ಇದು ಓಬವ್ವನ ಕಿಂಡಿ. ಕೇಳ್ರಿ. ಹೈದರ್ ಅಲಿಯ ಸೈನ್ಯ ಈ ಕೋಟೆಯನ್ನ ಸುತ್ತುವರಿದಿತ್ತು. ಒಳಗೆ ಬರಾಕ ದಾರಿ ಸಿಗ್ಲಿಲ್ಲ. ಆಗ ಅವರಿಗೆ ಈ ಸಣ್ಣ ಕಿಂಡಿ ಕಾಣಿಸ್ತು.
    tr: Idu Ōbavvana kiṇḍi. Kēḷri. Haidar Aliya sainya ī kōṭeyanna suttuvariditti. Oḷage barāka dāri siglilla. Āga avarige ī saṇṇa kiṇḍi kāṇistu.
    en: This is Obavva's window. Listen. Hyder Ali's army had surrounded this fort. They couldn't find a way in. Then they spotted this narrow opening.
  - who: prakash
    t: ಈ ಕಿಂಡಿಯ ಕಾವಲು ಕಹಳೆ ಮದ್ದಹನುಮಪ್ಪನದು. ಅವನು ಮಧ್ಯಾಹ್ನ ಊಟಕ್ಕೆ ಮನಿಗೆ ಹೋಗಿದ್ದ. ಅವನ ಹೆಂಡತಿ ಓಬವ್ವ ನೀರು ತರಾಕ ಬಂದಾಗ ಕಿಂಡಿಯಿಂದ ಸೈನಿಕರು ಒಬ್ಬೊಬ್ಬರಾಗಿ ಒಳಗೆ ಬರೋದು ನೋಡಿದ್ಲು.
    tr: Ī kiṇḍiya kāvalu Kahaḷe Maddahanumappanadu. Avanu madhyāhna ūṭakke manige hōgidda. Avana heṇḍati Ōbavva nīru tarāka bandāga kiṇḍiyinda sainikaru obbobbarāgi oḷage barōdu nōḍidlu.
    en: Guarding this window was Kahale Maddahanumappa's duty. He had gone home for his midday meal. His wife Obavva came to fetch water and saw soldiers coming through the window one by one.
  - who: ramya
    t: ಆಮೇಲೆ? ಗಂಡನನ್ನ ಕರೀಲಿಲ್ವಾ?
    tr: Āmēle? Gaṇḍananna karīlilvā?
    en: And then? Didn't she call her husband?
  - who: prakash
    t: ಕರೆದ್ರ ಸೈನಿಕರಿಗೆ ಗೊತ್ತಾಗತೈತಿ. ಅದಕ್ಕ ಅವಳು ಮನಿಯಾಗಿನ ಒನಕಿ ತಗೊಂಡು ಕಿಂಡಿ ಪಕ್ಕ ನಿಂತ್ಲು. ಒಬ್ಬೊಬ್ಬ ಸೈನಿಕ ತಲೆ ಹೊರಗೆ ಹಾಕಿದ ಕೂಡ್ಲೇ ಒಂದೇ ಏಟು. ಹಿಂಗ ನೂರಾರು ಜನರನ್ನ ಎದುರಿಸಿದ್ಲು ಅಂತ ಜನಪದ ಹೇಳತೈತಿ.
    tr: Karedra sainikarige gottāgataiti. Adakka avaḷu maniyāgina onaki tagoṇḍu kiṇḍi pakka nintlu. Obbobba sainika tale horage hākida kūḍlē ondē ēṭu. Hiṅga nūrāru janaranna edurisidlu anta janapada hēḷataiti.
    en: If she called out, the soldiers would know. So she took the grain pestle from her house and stood beside the opening. The moment each soldier put his head through — one blow. The folk tradition says she faced hundreds of them like that.
  - who: kaveri
    t: ಎಷ್ಟು ಜನ ಅನ್ನೋದು ಇತಿಹಾಸಕಾರರಲ್ಲಿ ಚರ್ಚೆ ಇದೆ ಅಂತ ಓದಿದ್ದೆ. ಆದ್ರೆ ಕಥೆಯ ಅರ್ಥ ಸ್ಪಷ್ಟ. ಕತ್ತಿ ಇರ್ಲಿಲ್ಲ, ಸೇನೆ ಇರ್ಲಿಲ್ಲ. ಮನೆಯ ಒನಕೆ, ಮತ್ತೆ ಧೈರ್ಯ.
    tr: Eṣṭu jana annōdu itihāsakāraralli charche ide anta ōdidde. Ādre katheya artha spaṣṭa. Katti irlilla, sēne irlilla. Maneya onake, matte dhairya.
    en: I'd read that historians debate how many there were. But the meaning of the story is clear. She had no sword, no army. A household pestle, and courage.
  - who: shruti
    t: ಒಂದು ಮನೆ ಕೆಲಸದ ಸಾಮಾನು ಆಯುಧ ಆಯ್ತು. ಆದ್ಯಾಗೆ ಈ ಕಥೆ ಹೇಳ್ಬೇಕು. ಅವಳು ಎಲ್ಲಾ ಪ್ರಿನ್ಸೆಸ್ ಕಥೆ ಕೇಳ್ತಾಳೆ.
    tr: Ondu mane kelasada sāmānu āyudha āytu. Ādyāge ī kathe hēḷbēku. Avaḷu ellā prinses kathe kēḷtāḷe.
    en: A household tool became a weapon. I must tell Aadya this story. All she hears are princess stories.
  - who: prakash
    t: ನನ್ ಸಾಲ್ಯಾಗ ಪ್ರತಿ ವರ್ಷ ನವೆಂಬರ್ ಹನ್ನೊಂದಕ್ಕೆ ಓಬವ್ವ ಜಯಂತಿ ಮಾಡ್ತೇವಿ. ಹೆಣ್ಣುಮಕ್ಕಳು ಒನಕಿ ಹಿಡಕೊಂಡು ನಾಟಕ ಮಾಡ್ತಾರ. ಭಾಳ ಜೋರಾಗಿ ಮಾಡ್ತಾರ್ರಿ, ಹುಡುಗರು ಹೆದರ್ತಾರ.
    tr: Nan sālyāga prati varṣa Navembar hannondakke Ōbavva jayanti māḍtēvi. Heṇṇumakkaḷu onaki hiḍakoṇḍu nāṭaka māḍtāra. Bhāḷa jōrāgi māḍtārri, huḍugaru hedartāra.
    en: In my school we celebrate Obavva Jayanti every year on the eleventh of November. The girls put on a play holding pestles. They do it really fiercely — the boys get scared.
  - section: The joke
    learn: 'mimicry and mockery: aṇaku, kāpi māḍu, gēli māḍu, haḷḷi bhāṣe · the moment the laughter stops: naguvu nintu hōytu, mukha baṇṇa badalāytu · a teacher''s quiet pain: makkaḷige hēḷtēni…, ivattu nanna geḷeyara munde'
  - scene: Arjun steps up onto a rock in front of the kindi, takes a stick for a pestle, puts on a heavy, exaggerated imitation of Prakash's Dharwad speech, and performs for the group and the school children.
  - who: arjun
    t: ಕೇಳ್ರೀ, ಕೇಳ್ರೀ ಮಕ್ಕಳ್ರೀ! ಓಬವ್ವ ಒನಕಿ ತಗೊಂಡಾಳ್ರೀ, ಹೈದರ್ ಅಲಿ ಬಂದಾನ್ರೀ, ಯಾಕ್ರೀ ಬಂದ್ರೀ ಅಂದಾಳ್ರೀ, ಢಣ್ ಅಂತ ಹೊಡದಾಳ್ರೀ! ಭಾಳ ಛಲೋ ಐತ್ರೀ!
    tr: Kēḷrī, kēḷrī makkaḷrī! Ōbavva onaki tagoṇḍāḷrī, Haidar Ali bandānrī, yākrī bandrī andāḷrī, ḍhaṇ anta hoḍadāḷrī! Bhāḷa chalō aitrī!
    en: Listen-ree, listen-ree, children-ree! Obavva took the pestle-ree, Hyder Ali came-ree, ‘Why'd you come-ree?’ she said-ree, and bang, she hit him-ree! Very nice it is-ree!
  - scene: A few of the schoolchildren giggle. Ramya laughs behind her phone. Naveen snorts once. Then Arjun drops the stick and goes on in his normal voice.
  - who: arjun
    t: ನಾಲ್ಕು ವರ್ಷ ಕಾಲೇಜಲ್ಲಿ ಇವನು ಹೀಗೇ ಮಾತಾಡ್ತಿದ್ದ, ಗೊತ್ತಾ? ವೈವಾದಲ್ಲಿ ಎಕ್ಸ್‌ಟರ್ನಲ್ ‘ಯಾವ ಹಳ್ಳಿಯಪ್ಪಾ ನೀನು’ ಅಂತ ಕೇಳಿದ್ರು. ಇನ್ನೂ ಹಾಗೇ ಇದಾನೆ. ಮೇಷ್ಟ್ರು ಆದ್ಮೇಲೆ ಮಕ್ಕಳಿಗೂ ಇದೇ ಭಾಷೆ ಕಲಿಸ್ತಿದಾನೆ!
    tr: Nālku varṣa kālējalli ivanu hīgē mātāḍtidda, gottā? Vaivādalli ekstarnal ‘yāva haḷḷiyappā nīnu’ anta kēḷidru. Innū hāgē idāne. Mēṣṭru ādmēle makkaḷigū idē bhāṣe kalistidāne!
    en: For all his college years he talked just like this, you know? In the viva the external examiner asked him, ‘Which village are you from?’ He's still the same. Now he's a teacher, he's teaching the kids this same language!
  - scene: Nobody laughs now. Ramya lowers the phone. Prakash stands very still beside the boulder.
  - who: prakash
    t: ಮುಗೀತೇನ್ರಿ, ಅರ್ಜುನ್?
    tr: Mugītēnri, Arjun?
    en: Are you finished, Arjun?
  - who: arjun
    t: ಏಯ್, ಜೋಕ್ ಮಗಾ. ಕಾಲೇಜಲ್ಲಿ ನಾವು ಹೀಗೇ ಆಡ್ತಿದ್ವಿ ಅಲ್ವಾ? ನೀನೇ ನಗ್ತಿದ್ದೆ.
    tr: Ēy, jōk magā. Kālējalli nāvu hīgē āḍtidvi alvā? Nīnē nagtidde.
    en: Hey, it's a joke, maga. We used to do this in college, didn't we? You used to laugh yourself.
  - who: prakash
    t: ನಗ್ತಿದ್ದೆ. ಯಾಕಂದ್ರ ಹದಿನೆಂಟು ವರ್ಷದ ಹುಡುಗ, ಹಾಸ್ಟೆಲ್‌ನಾಗ ಒಬ್ಬನೇ, ಬೇರೆ ದಾರಿ ಇರ್ಲಿಲ್ಲ. ನೀವು ನಗತಿದ್ರಿ, ನಾನೂ ನಗತಿದ್ದೆ. ರಾತ್ರಿ ರೂಮಿನ್ಯಾಗ ‘ಬೆಂಗಳೂರು ಕನ್ನಡ’ ಪ್ರಾಕ್ಟೀಸ್ ಮಾಡತಿದ್ದೆ. ನಿಮಗ ಗೊತ್ತಿರ್ಲಿಲ್ಲ.
    tr: Nagtidde. Yākandra hadineṇṭu varṣada huḍuga, hāsṭel-nāga obbanē, bēre dāri irlilla. Nīvu nagatidri, nānū nagatidde. Rātri rūminyāga ‘Beṅgaḷūru Kannaḍa’ prākṭīs māḍatidde. Nimaga gottirlilla.
    en: I laughed. Because I was an eighteen-year-old boy, alone in the hostel, with no other choice. You laughed, so I laughed too. At night in my room I used to practise ‘Bengaluru Kannada’. You didn't know that.
  - who: prakash
    t: ಈಗ ನಾನು ಸಾಲ್ಯಾಗ ಮಕ್ಕಳಿಗೆ ಹೇಳ್ತೇನಿ, ‘ನಿಮ್ಮ ಮಾತಿನ ಬಗ್ಗೆ ನಾಚಿಕೆ ಪಡಬ್ಯಾಡ್ರಿ’ ಅಂತ. ಇವತ್ತು ನನ್ ಗೆಳೆಯರ ಮುಂದೆ, ಆ ಮಕ್ಕಳ ಮುಂದೆ, ನಾನೇ ಒಂದು ಜೋಕ್ ಆದೆ. ಆತು. ಛಲೋ ಆತು.
    tr: Īga nānu sālyāga makkaḷige hēḷtēni, ‘nimma mātina bagge nāchike paḍabyāḍri’ anta. Ivattu nan geḷeyara munde, ā makkaḷa munde, nānē ondu jōk āde. Ātu. Chalō ātu.
    en: Now in my school I tell the children, ‘Don't be ashamed of the way you speak.’ Today, in front of my friends, in front of those children, I became the joke. Fine. That's just fine.
  - scene: He turns and walks up the stone steps towards the next ring of the wall without looking back. The schoolteacher leading the children quickly moves them on.
  - section: No dialect is lesser
    learn: 'answering seriously: tamāṣe alla idu, ondu mātu hēḷtīni kēḷu · dignity of speech: yāva bhāṣeyū kīḷalla, uccāraṇe, prādēśika bhāṣe · facts as arguments: Bēndre, Jñānapīṭha, Dhāravāḍada Kannaḍa · Kalaburagi: avamāna, ijjat, āru tiṅgaḷu mātāḍlilla'
  - who: imran
    t: ಅರ್ಜುನ್, ಒಂದು ಮಾತು ಹೇಳ್ತೇನಿ, ಕೇಳು. ಎಂಬಿಬಿಎಸ್ ಮೊದಲ ವರ್ಷ, ಬೆಂಗಳೂರಾಗ. ನಾನು ಕ್ಲಾಸ್‌ನಾಗ ಒಂದು ಪ್ರಶ್ನೆಗೆ ಉತ್ತರ ಕೊಟ್ಟೆ. ಮೂವತ್ತು ಜನ ನಕ್ಕರು, ನನ್ ಉತ್ತರಕ್ಕಲ್ಲ, ನನ್ ‘ಐತಿ’ಗೆ.
    tr: Arjun, ondu mātu hēḷtēni, kēḷu. Em-bi-bi-es modala varṣa, Beṅgaḷūrāga. Nānu klās-nāga ondu praśnege uttara koṭṭe. Mūvattu jana nakkaru, nan uttarakkalla, nan ‘aiti’ge.
    en: Arjun, let me tell you something; listen. First year of MBBS, in Bengaluru. I answered a question in class. Thirty people laughed — not at my answer, at my ‘aiti’.
  - who: imran
    t: ಆಮೇಲೆ ಆರು ತಿಂಗಳು ನಾನು ಕ್ಲಾಸ್‌ನಾಗ ಬಾಯಿ ಬಿಡಲಿಲ್ಲ. ಆರು ತಿಂಗಳು. ಗೊತ್ತಿದ್ದ ಉತ್ತರಾನೂ ಹೇಳಲಿಲ್ಲ. ಒಂದು ನಗು ಒಬ್ಬ ಮನುಷ್ಯನ ಬಾಯಿ ಮುಚ್ಚಿಸಬಹುದು. ನಾನು ಡಾಕ್ಟರ್, ಇದು ನನ್ ಡಯಾಗ್ನೋಸಿಸ್.
    tr: Āmēle āru tiṅgaḷu nānu klās-nāga bāyi biḍalilla. Āru tiṅgaḷu. Gottidda uttarānū hēḷalilla. Ondu nagu obba manuṣyana bāyi mucchisabahudu. Nānu ḍākṭar, idu nan ḍayāgnōsis.
    en: After that, for six months I didn't open my mouth in class. Six months. I didn't give even the answers I knew. One laugh can shut a person's mouth. I'm a doctor; that's my diagnosis.
  - who: arjun
    t: ಇಮ್ರಾನ್, ಅದು ಬೇರೆ. ಅವರು ಅಪರಿಚಿತರು. ನಾವು ಗೆಳೆಯರು. ಗೆಳೆಯರ ಮಧ್ಯೆ ಸ್ವಲ್ಪ ಕಾಲೆಳಿಯೋದು ತಪ್ಪಾ?
    tr: Imrān, adu bēre. Avaru aparichitaru. Nāvu geḷeyaru. Geḷeyara madhye svalpa kāleḷiyōdu tappā?
    en: Imran, that's different. They were strangers. We're friends. Is it wrong to pull a friend's leg a little?
  - who: kaveri
    t: ಕಾಲೆಳಿಯೋದು ತಪ್ಪಲ್ಲ, ಅರ್ಜುನ್. ಆದ್ರೆ ನೀನು ಎಳೆದದ್ದು ಅವನ ಕಾಲಲ್ಲ, ಅವನ ಊರು. ಅವನ ಅಮ್ಮನ ಮಾತು. ಅವನ ಮಕ್ಕಳ ಮಾತು. ‘ಹಳ್ಳಿ ಭಾಷೆ’ ಅಂದೆ ನೀನು. ಅದು ಜೋಕ್ ಅಲ್ಲ, ಅದು ತೀರ್ಪು.
    tr: Kāleḷiyōdu tappalla, Arjun. Ādre nīnu eḷedaddu avana kālalla, avana ūru. Avana ammana mātu. Avana makkaḷa mātu. ‘Haḷḷi bhāṣe’ ande nīnu. Adu jōk alla, adu tīrpu.
    en: Pulling a leg isn't wrong, Arjun. But what you pulled wasn't his leg — it was his hometown. His mother's speech. His students' speech. ‘Village language,’ you said. That's not a joke, that's a verdict.
  - who: kaveri
    t: ನನ್ನ ಕನ್ನಡಕ್ಕೂ ಕೊಡವ ಉಚ್ಚಾರಣೆ ಇದೆ. ಕೋರ್ಟ್‌ನಲ್ಲಿ ಒಬ್ಬ ಹಿರಿಯ ವಕೀಲರು ‘ಮೇಡಂ, ನೀವು ಕನ್ನಡ ಎಲ್ಲಿ ಕಲಿತಿರಿ?’ ಅಂತ ಕೇಳಿದ್ರು. ನಾನು ‘ನನ್ನ ಅಜ್ಜಿಯಿಂದ’ ಅಂದೆ. ಅವರ ಬಾಯಿ ಮುಚ್ಚಿತು.
    tr: Nanna Kannaḍakkū Koḍava uchchāraṇe ide. Kōrṭ-nalli obba hiriya vakīlaru ‘mēḍam, nīvu Kannaḍa elli kalitiri?’ anta kēḷidru. Nānu ‘nanna ajjiyinda’ ande. Avara bāyi mucchitu.
    en: My Kannada has a Kodava accent too. In court a senior advocate once asked, ‘Madam, where did you learn Kannada?’ I said, ‘From my grandmother.’ That shut him up.
  - who: kaveri
    t: ಒಂದು ವಿಷಯ ನೆನಪಿಡು. ದ.ರಾ. ಬೇಂದ್ರೆ ಬರೆದದ್ದು ಧಾರವಾಡದ ಕನ್ನಡದಲ್ಲಿ. ಜ್ಞಾನಪೀಠ ಬಂತು ಅವರಿಗೆ. ‘ಸ್ಟ್ಯಾಂಡರ್ಡ್ ಕನ್ನಡ’ ಅನ್ನೋದು ಮೈಸೂರು-ಬೆಂಗಳೂರಿನ ಅಧಿಕಾರದ ಭಾಷೆ ಅಷ್ಟೇ. ಯಾವ ಪ್ರಾದೇಶಿಕ ಮಾತೂ ಕೀಳಲ್ಲ.
    tr: Ondu viṣaya nenapiḍu. Da.Rā. Bēndre baredaddu Dhāravāḍada Kannaḍadalli. Jñānapīṭha bantu avarige. ‘Sṭyāṇḍarḍ Kannaḍa’ annōdu Maisūru-Beṅgaḷūrina adhikārada bhāṣe aṣṭē. Yāva prādēśika mātū kīḷalla.
    en: Remember one thing. D.R. Bendre wrote in Dharwad Kannada. He got the Jnanpith. What we call ‘standard Kannada’ is just the language of Mysuru–Bengaluru power. No regional speech is lesser.
  - who: deepa
    t: ನಾನೂ ಒಂದು ಒಪ್ಪಿಕೊಳ್ಳಬೇಕು. ಮೈಸೂರಲ್ಲಿ ಚಿಕ್ಕಂದಿನಿಂದ ‘ನಮ್ಮ ಕನ್ನಡವೇ ಶುದ್ಧ’ ಅಂತ ಕೇಳಿ ಬೆಳೆದೆ. ಅದು ಹೆಮ್ಮೆ ಅಂತ ಅಂದ್ಕೊಂಡಿದ್ದೆ. ಈಗ ಅನ್ಸುತ್ತೆ, ಅದು ಸ್ವಲ್ಪ ಅಹಂಕಾರನೂ ಹೌದು.
    tr: Nānū ondu oppikoḷḷabēku. Maisūralli chikkandininda ‘namma Kannaḍavē śuddha’ anta kēḷi beḷede. Adu hemme anta andkoṇḍidde. Īga ansutte, adu svalpa ahaṅkāranū haudu.
    en: I have to admit something too. In Mysuru I grew up hearing, ‘Our Kannada is the pure one.’ I thought that was pride. Now I feel it's a bit of arrogance too.
  - who: ramya
    t: ನನಗೆ ಚಾನೆಲ್‌ಗೆ ಸೇರಿದ ಮೊದಲ ವಾರ ಬಾಸ್ ಹೇಳಿದ್ರು, ‘ಆನ್ ಏರ್ ‘ಹೋತೆ, ಬತ್ತೆ’ ಎಲ್ಲಾ ಬೇಡ, ಬೆಂಗಳೂರು ಕನ್ನಡ ಮಾತಾಡು’ ಅಂತ. ಹನ್ನೆರಡು ವರ್ಷ ಆಯ್ತು, ಟಿವಿಯಲ್ಲಿ ನನ್ನ ಊರಿನ ಮಾತು ಒಂದು ಸಲನೂ ಆಡಿಲ್ಲ. ಮನೆಗೆ ಫೋನ್ ಮಾಡಿದಾಗ ಮಾತ್ರ ನಾನು ನಾನಾಗ್ತೇನೆ.
    tr: Nanage chānel-ge sērida modala vāra bās hēḷidru, ‘ān ēr ‘hōte, batte’ ellā bēḍa, Beṅgaḷūru Kannaḍa mātāḍu’ anta. Hanneraḍu varṣa āytu, ṭiviyalli nanna ūrina mātu ondu salanū āḍilla. Manege phōn māḍidāga mātra nānu nānāgtēne.
    en: The first week I joined the channel, my boss said, ‘On air, none of this hote, batte — speak Bengaluru Kannada.’ Twelve years now, and I've never once spoken my hometown's language on TV. Only when I call home do I become myself.
  - who: shruti
    t: ಮತ್ತೆ ನಮ್ಮ ಬೆಂಗಳೂರು ಕನ್ನಡಕ್ಕೆ ಹಳೆ ಪಂಡಿತರು ‘ಕಂಗ್ಲಿಷ್, ಕನ್ನಡನೇ ಅಲ್ಲ’ ಅಂತಾರೆ. ಎಲ್ಲರೂ ಯಾರನ್ನಾದ್ರೂ ಕೀಳಾಗಿ ನೋಡ್ತಾರೆ. ಅದೇ ತಮಾಷೆ.
    tr: Matte namma Beṅgaḷūru Kannaḍakke haḷe paṇḍitaru ‘Kaṅgliṣ, Kannaḍanē alla’ antāre. Ellarū yārannādrū kīḷāgi nōḍtāre. Adē tamāṣe.
    en: And the old scholars call our Bengaluru Kannada ‘Kanglish — not Kannada at all.’ Everybody looks down on somebody. That's the joke.
  - who: naveen
    t: ನಮ್ಮ ಮಂಗಳೂರು ಕನ್ನಡ ಕೇಳಿ ಬೆಂಗಳೂರಲ್ಲಿ ‘ಮಲಯಾಳಿನಾ?’ ಅಂತ ಕೇಳ್ತಾರೆ ಮಾರಾಯ. ಪ್ರತಿ ಸಲ ನಗ್ತೇನೆ. ಆದ್ರೆ ಒಳಗೆ ಸ್ವಲ್ಪ ಚುಚ್ಚುತ್ತದೆ.
    tr: Namma Maṅgaḷūru Kannaḍa kēḷi Beṅgaḷūralli ‘Malayāḷinā?’ anta kēḷtāre mārāya. Prati sala nagtēne. Ādre oḷage svalpa chuchchuttade.
    en: When people in Bengaluru hear our Mangaluru Kannada, they ask, ‘Are you Malayali?’, maraya. I laugh every time. But inside, it pricks a little.
  - who: imran
    t: ನೋಡ್ರಿ, ಎಲ್ಲಾರೂ ನಗ್ತೇವಿ, ಎಲ್ಲಾರಿಗೂ ಚುಚ್ಚತೈತಿ. ಯಾರೂ ಬಾಯಿಬಿಟ್ಟು ಹೇಳಂಗಿಲ್ಲ, ಅಷ್ಟೇ.
    tr: Nōḍri, ellārū nagtēvi, ellārigū chuchchataiti. Yārū bāyibiṭṭu hēḷaṅgilla, aṣṭē.
    en: See, we all laugh, and it pricks all of us. Nobody says it out loud, that's all.
  - section: The first real fight
    learn: 'getting defensive: sumne jōk māḍde, ellrū ōvar sensiṭiv, ivāga ēnū mātāḍōke āgalla · taking sides: nānu Prakāśna kaḍe, nīnu tappu māḍde · rhetorical questions: nānēn kolle māḍidīna?, ēn māḍbēku īga, kāl hiḍībēkā? · calming: svalpa samādhāna, ellrū ondu nimiṣa'
  - who: arjun
    t: ಓಕೆ, ಓಕೆ, ಸಾಕು! ಎಲ್ರೂ ಸೇರಿ ನನ್ನ ಮೇಲೆ ಕೇಸ್ ಹಾಕಿ. ಒಂದು ಜೋಕ್ ಮಾಡಿದೆ, ನಾನೇನ್ ಕೊಲೆ ಮಾಡಿದೀನಾ? ಈಗ ಎಲ್ರೂ ಓವರ್ ಸೆನ್ಸಿಟಿವ್. ಏನೂ ಮಾತಾಡೋಕೇ ಆಗಲ್ಲ.
    tr: Ōke, ōke, sāku! Ellrū sēri nanna mēle kēs hāki. Ondu jōk māḍide, nānēn kole māḍidīnā? Īga ellrū ōvar sensiṭiv. Ēnū mātāḍōkē āgalla.
    en: Okay, okay, enough! Go on, all of you, file a case against me. I made one joke — did I commit murder? Everyone's oversensitive these days. You can't say anything any more.
  - who: shruti
    t: ಅರ್ಜುನ್, ನೀನು ಯಾವಾಗ್ಲೂ ಹೀಗೇ. ಯಾರಿಗಾದ್ರೂ ನೋವಾದ್ರೆ ತಪ್ಪು ಅವರದ್ದು, ಯಾಕಂದ್ರೆ ಅವರು ‘ಸೆನ್ಸಿಟಿವ್’. ಹದಿನಾಲ್ಕು ವರ್ಷ ಆದ್ರೂ ಈ ಬುದ್ಧಿ ಬದಲಾಗಿಲ್ಲ.
    tr: Arjun, nīnu yāvāglū hīgē. Yārigādrū nōvādre tappu avaraddu, yākandre avaru ‘sensiṭiv’. Hadinālku varṣa ādrū ī buddhi badalāgilla.
    en: Arjun, you're always like this. If someone gets hurt, it's their fault, because they're ‘sensitive’. Fourteen years, and this habit hasn't changed.
  - who: arjun
    t: ಓಹೋ, ಈಗ ಅದಕ್ಕೂ ಇದಕ್ಕೂ ಸಂಬಂಧ ಬಂತಾ? ಶ್ರುತಿ, ಹಳೆಯ ಲೆಕ್ಕ ಇಲ್ಲಿ ಬೇಡ.
    tr: Ōhō, īga adakkū idakkū sambandha bantā? Śruti, haḷeya lekka illi bēḍa.
    en: Oho, so now there's a connection between that and this? Shruti, don't settle old accounts here.
  - who: shruti
    t: ನಾನು ಯಾವ ಲೆಕ್ಕನೂ ಹೇಳ್ಲಿಲ್ಲ. ನೀನೇ ಅಂದ್ಕೊಂಡೆ.
    tr: Nānu yāva lekkanū hēḷlilla. Nīnē andkoṇḍe.
    en: I didn't mention any account. You thought of it yourself.
  - who: naveen
    t: ಅರ್ಜುನ್, ನಾನೂ ನಕ್ಕೆ, ಮೊದಲಿಗೆ. ಅದಕ್ಕೆ ನಂಗೂ ನಾಚಿಕೆ ಆಗ್ತದೆ. ಆದ್ರೆ ನಿನಗೆ ಎಲ್ಲವೂ ಜೋಕ್, ಎಲ್ಲವೂ ಸುಲಭ. ಬೇರೆಯವರಿಗೆ ಅದರ ಬೆಲೆ ಎಷ್ಟು ಅಂತ ನೀನು ಯಾವತ್ತೂ ಯೋಚನೆ ಮಾಡುದಿಲ್ಲ.
    tr: Arjun, nānū nakke, modalige. Adakke naṅgū nāchike āgtade. Ādre ninage ellavū jōk, ellavū sulabha. Bēreyavarige adara bele eṣṭu anta nīnu yāvattū yōchane māḍudilla.
    en: Arjun, I laughed too, at first. I'm ashamed of that. But for you, everything's a joke, everything's easy. You never think what it costs other people.
  - scene: Arjun looks at Naveen for a second too long. Naveen doesn't look away.
  - who: arjun
    t: ‘ಬೆಲೆ’? ಏನು ಹೇಳ್ಬೇಕು ಅಂತಿದೀಯ ನವೀನ್? ನೇರವಾಗಿ ಹೇಳು.
    tr: ‘Bele’? Ēnu hēḷbēku antidīya Navīn? Nēravāgi hēḷu.
    en: ‘What it costs’? What are you trying to say, Naveen? Say it straight.
  - who: naveen
    t: ಏನೂ ಇಲ್ಲ. ಇವತ್ತು ವಿಷಯ ಪ್ರಕಾಶ್. ಅಷ್ಟೇ.
    tr: Ēnū illa. Ivattu viṣaya Prakāś. Aṣṭē.
    en: Nothing. Today the subject is Prakash. That's all.
  - who: deepa
    t: ಪ್ಲೀಸ್, ಎಲ್ರೂ ಒಂದು ನಿಮಿಷ ಸುಮ್ನಿರಿ. ಎಂಟು ವರ್ಷದ ಮೇಲೆ ಎಲ್ರೂ ಒಟ್ಟಿಗೆ ಸಿಕ್ಕಿದೀವಿ. ಮೊದಲ ದಿನವೇ ಇಷ್ಟು ಜಗಳ ಬೇಕಾ? ಅರ್ಜುನ್, ನೀನು ಹೋಗಿ ಪ್ರಕಾಶ್ ಹತ್ರ ಮಾತಾಡು. ನಾವೆಲ್ಲ ಇಲ್ಲೇ ಇರ್ತೀವಿ.
    tr: Plīs, ellrū ondu nimiṣa sumniri. Eṇṭu varṣada mēle ellrū oṭṭige sikkidīvi. Modala dinavē iṣṭu jagaḷa bēkā? Arjun, nīnu hōgi Prakāś hatra mātāḍu. Nāvella illē irtīvi.
    en: Please, everyone, be quiet for one minute. All of us together for the first time in eight years. Do we need this much fighting on the very first day? Arjun, go and talk to Prakash. The rest of us will stay right here.
  - who: arjun
    t: ಏನ್ ಮಾತಾಡ್ಬೇಕು? ಹೋಗಿ ಕಾಲು ಹಿಡೀಬೇಕಾ?
    tr: Ēn mātāḍbēku? Hōgi kālu hiḍībēkā?
    en: Talk about what? Should I go and fall at his feet?
  - who: imran
    t: ಕಾಲು ಹಿಡೀಬ್ಯಾಡ. ಕೈ ಹಿಡಿ. ಅಷ್ಟು ಸಾಕು. ಆದ್ರ ಮನಸಿನಿಂದ ಹಿಡಿ, ಅರ್ಜುನ್. ನಾಟಕ ಬ್ಯಾಡ.
    tr: Kālu hiḍībyāḍa. Kai hiḍi. Aṣṭu sāku. Ādra manasininda hiḍi, Arjun. Nāṭaka byāḍa.
    en: Don't hold his feet. Hold his hand. That's enough. But do it from the heart, Arjun. No drama.
  - scene: Arjun breathes out hard, shoves his hands into his pockets, and climbs the steps after Prakash. Ramya has stopped filming. She puts her phone in her bag.
  - scene: The fourth ring of the wall. Prakash sits on the warm parapet, looking down at the town. Arjun arrives, out of breath, and stands a few feet away.
  - who: arjun
    t: ಪ್ರಕಾಶ್… ಎಷ್ಟು ಮೆಟ್ಟಿಲು ಮಗಾ ಇಲ್ಲಿ. ಉಸಿರೇ ಹೋಯ್ತು.
    tr: Prakāś… eṣṭu meṭṭilu magā illi. Usirē hōytu.
    en: Prakash… so many steps up here, maga. I'm completely out of breath.
  - who: prakash
    t: ಏಳು ಸುತ್ತಿನ ಕೋಟಿ ಅಲ್ಲೇನ್ರಿ. ಒಂದೊಂದು ಸುತ್ತು ಹತ್ತೂದು ಸುಲಭ ಅಲ್ಲ. ಮನುಷ್ಯನ ಮನಸ್ಸೂ ಹಂಗೇ.
    tr: Ēḷu suttina kōṭi allēnri. Ondondu suttu hattūdu sulabha alla. Manuṣyana manassū haṅgē.
    en: It's the seven-ringed fort, isn't it. Climbing each ring isn't easy. A man's mind is the same.
  - who: arjun
    t: ಕೆಳಗೆ ಎಲ್ರೂ ಸೇರಿ ನನ್ನನ್ನ ವಿಲನ್ ಮಾಡಿದ್ರು. ಒಂದು ಜೋಕ್‌ಗೆ ಇಷ್ಟೆಲ್ಲಾ. ನೀನಾದ್ರೂ ಹೇಳು, ನಾನು ಕೆಟ್ಟವನಾ?
    tr: Keḷage ellrū sēri nannanna vilan māḍidru. Ondu jōk-ge iṣṭellā. Nīnādrū hēḷu, nānu keṭṭavanā?
    en: Down there they all ganged up and made me the villain. All this over one joke. You tell me, at least — am I a bad person?
  - who: prakash
    t: ನೋಡ್ರಿ, ಮತ್ತ ನಿಮ್ ಬಗ್ಗೆನೇ ಕೇಳಾಕತ್ತೀರಿ. ಕೆಟ್ಟವ್ರು ಅಂತ ನಾ ಹೇಳಿಲ್ಲ. ನೋವಾತು ಅಂತ ಹೇಳಿದೆ. ಎರಡೂ ಒಂದೇ ಅಲ್ಲ.
    tr: Nōḍri, matta nim baggenē kēḷākattīri. Keṭṭavru anta nā hēḷilla. Nōvātu anta hēḷide. Eraḍū ondē alla.
    en: See, you're asking about yourself again. I never said you're bad. I said it hurt. The two aren't the same.
  - who: arjun
    t: ನೀನು ರಾತ್ರಿ ರೂಮಲ್ಲಿ ಬೆಂಗಳೂರು ಕನ್ನಡ ಪ್ರ್ಯಾಕ್ಟೀಸ್ ಮಾಡ್ತಿದ್ದೆ ಅಂದ್ಯಲ್ಲ… ನಿಜವಾಗ್ಲೂ? ನನಗೆ ಗೊತ್ತೇ ಇರ್ಲಿಲ್ಲ.
    tr: Nīnu rātri rūmalli Beṅgaḷūru Kannaḍa pryākṭīs māḍtidde andyalla… nijavāglū? Nanage gottē irlilla.
    en: You said you used to practise Bengaluru Kannada in your room at night… really? I never knew.
  - who: prakash
    t: ಗೊತ್ತಾಗಾಕ ನೀವು ಒಮ್ಮೆನೂ ಕೇಳಿರಲಿಲ್ಲ. ನಾಕು ವರ್ಷದಾಗ ಒಮ್ಮೆನೂ.
    tr: Gottāgāka nīvu ommenū kēḷiralilla. Nāku varṣadāga ommenū.
    en: For you to know, you'd have had to ask. Not once in four years.
  - who: arjun
    t: ಸರಿ… ಕೆಳಗೆ ಊಟಕ್ಕೆ ಬಾ. ಎಲ್ರ ಮುಂದೆ ಏನೋ ಹೇಳ್ತೀನಿ.
    tr: Sari… keḷage ūṭakke bā. Ellra munde ēnō hēḷtīni.
    en: Okay… come down for lunch. I'll say something in front of everyone.
  - who: prakash
    t: ಎಲ್ಲಾರ ಮುಂದ ಹೇಳೂದು ಮುಖ್ಯ ಅಲ್ಲ. ಏನು ಹೇಳ್ತೀರಿ ಅನ್ನೂದು ಮುಖ್ಯ. ನಡೀರಿ.
    tr: Ellāra munda hēḷūdu mukhya alla. Ēnu hēḷtīri annūdu mukhya. Naḍīri.
    en: Saying it in front of everyone isn't what matters. What you say is what matters. Let's go.
  - section: Lunch and a half-apology
    learn: 'North-Karnataka meal words: jōḷada roṭṭi, eṇṇigāyi, śēṅgā chaṭni, mosaru, khānāvaḷi · mandakki-menasinakāyi · the conditional non-apology: ninage bējārāgidre sāri · the real thing, by contrast: nānu tappu māḍde · cool politeness: ātu biḍri, ūṭa māḍōṇu, paravāgilla'
  - scene: '1:30 p.m. A small khanavali at the foot of the fort. Steel plates on a long table: jowar rotti, stuffed brinjal, a green leafy palya, peanut chutney powder, curd. A side plate of mandakki with fried green chillies. Arjun and Prakash come in last, a few steps apart.'
  - who: naveen
    t: ಬನ್ನಿ ಬನ್ನಿ, ರೊಟ್ಟಿ ತಣ್ಣಗಾಗ್ತದೆ. ಪ್ರಕಾಶ್, ನೀನು ಇಲ್ಲಿ ಕೂತ್ಕೋ, ನನ್ನ ಪಕ್ಕ.
    tr: Banni banni, roṭṭi taṇṇagāgtade. Prakāś, nīnu illi kūtkō, nanna pakka.
    en: Come, come, the rotti is getting cold. Prakash, you sit here, next to me.
  - who: arjun
    t: ಎಲ್ರೂ ಕೇಳಿ. ಮತ್ತೆ ಪ್ರಕಾಶ್… ಮೇಲೆ ಆಗಿದ್ದು… ನಿನಗೆ ಬೇಜಾರಾಗಿದ್ರೆ ಸಾರಿ, ಮಗಾ. ನಾನು ಕೆಟ್ಟ ಉದ್ದೇಶದಿಂದ ಮಾಡ್ಲಿಲ್ಲ. ನಿಂಗೆ ಗೊತ್ತಲ್ವಾ, ನಾನು ಹಾಗೇ.
    tr: Ellrū kēḷi. Matte Prakāś… mēle āgiddu… ninage bējārāgidre sāri, magā. Nānu keṭṭa uddēśadinda māḍlilla. Niṅge gottalvā, nānu hāgē.
    en: Listen, everyone. And Prakash… what happened up there… if you felt bad, sorry, maga. I didn't do it with bad intentions. You know me — that's just how I am.
  - who: prakash
    t: ಆತು ಬಿಡ್ರಿ. ಪರವಾಗಿಲ್ಲ. ಊಟ ಮಾಡೋಣು.
    tr: Ātu biḍri. Paravāgilla. Ūṭa māḍōṇu.
    en: That's fine. Never mind. Let's eat.
  - scene: He says it politely, with a small smile, and passes Arjun the chutney powder without meeting his eyes.
  - who: kaveri
    t: ‘ಬೇಜಾರಾಗಿದ್ರೆ ಸಾರಿ’. ಕೋರ್ಟ್‌ನಲ್ಲಿ ಇದನ್ನ ‘ಷರತ್ತುಬದ್ಧ ಕ್ಷಮೆ’ ಅಂತೀವಿ. ತಪ್ಪು ಒಪ್ಪಿಕೊಳ್ಳೋದಿಲ್ಲ, ಆದ್ರೆ ಕ್ಷಮೆ ಕೇಳಿದ ಹಾಗೆ ಕಾಣುತ್ತೆ.
    tr: ‘Bējārāgidre sāri’. Kōrṭ-nalli idanna ‘ṣarattubaddha kṣame’ antīvi. Tappu oppikoḷḷōdilla, ādre kṣame kēḷida hāge kāṇutte.
    en: ‘Sorry if you felt bad.’ In court we call that a ‘conditional apology’. It doesn't admit the wrong, but it looks like an apology.
  - who: arjun
    t: ಕಾವೇರಿ, ಪ್ಲೀಸ್. ಊಟದ ಟೇಬಲ್ ಕೋರ್ಟ್ ಅಲ್ಲ.
    tr: Kāvēri, plīs. Ūṭada ṭēbal kōrṭ alla.
    en: Kaveri, please. The lunch table is not a courtroom.
  - who: kaveri
    t: ಸರಿ. ತೀರ್ಪು ಮುಂದಕ್ಕೆ ಹಾಕಲಾಗಿದೆ. ಮುಂದಿನ ದಿನಾಂಕ ಆಮೇಲೆ.
    tr: Sari. Tīrpu mundakke hākalāgide. Mundina dināṅka āmēle.
    en: Fine. Judgment reserved. Next date to be announced.
  - who: imran
    t: ಈ ರೊಟ್ಟಿ ನೋಡ್ರಿ. ಕಲಬುರಗಿ ರೊಟ್ಟಿ ಇದಕ್ಕಿಂತ ತೆಳ್ಳಗೆ, ಗಟ್ಟಿ. ಆದ್ರ ಈ ಎಣ್ಣಿಗಾಯಿ ಮಸ್ತ್ ಐತಿ. ನವೀನ್, ನೋಡು, ನಾನು ಬೇರೆ ಊರಿನ ಊಟ ಹೊಗಳಾಕತ್ತೇನಿ!
    tr: Ī roṭṭi nōḍri. Kalaburagi roṭṭi idakkinta teḷḷage, gaṭṭi. Ādra ī eṇṇigāyi mast aiti. Navīn, nōḍu, nānu bēre ūrina ūṭa hogaḷākattēni!
    en: Look at this rotti. Kalaburagi rotti is thinner than this, and crisper. But this stuffed brinjal is superb. Naveen, look — I'm praising another town's food!
  - who: naveen
    t: ದಾಖಲೆ ಮಾಡ್ಕೊಳ್ಳಿ, ಕಾವೇರಿ. ಸಾಕ್ಷಿ ಉಂಟು.
    tr: Dākhale māḍkoḷḷi, Kāvēri. Sākṣi uṇṭu.
    en: Put it on record, Kaveri. There's a witness.
  - who: deepa
    t: ಈ ಮಂಡಕ್ಕಿ ಮೆಣಸಿನಕಾಯಿ ಸೂಪರ್. ಚಿತ್ರದುರ್ಗದ ಸ್ಪೆಷಲ್ ಅಂತ ಹೋಟೆಲ್ ಅಣ್ಣ ಹೇಳಿದ್ರು.
    tr: Ī maṇḍakki meṇasinakāyi sūpar. Chitradurgada speṣal anta hōṭel aṇṇa hēḷidru.
    en: This mandakki with chillies is super. The hotel anna said it's a Chitradurga special.
  - who: prakash
    t: ನಮ್ ಕಡೆ ಹುಬ್ಬಳ್ಳಿಯಾಗ ಇದಕ್ಕ ಗಿರ್ಮಿಟ್ ಅಂತೇವಿ, ಸ್ವಲ್ಪ ಬೇರೆ ತರ. ನಾಳೆ ನಾಡಿದ್ದು ತಿನಿಸ್ತೇನಿ. ಮಿರ್ಚಿ ಜೊತೆ.
    tr: Nam kaḍe Hubbaḷḷiyāga idakka girmiṭ antēvi, svalpa bēre tara. Nāḷe nāḍiddu tinistēni. Mirchi jote.
    en: On our side, in Hubballi, we have girmit — a bit different. I'll make you eat it in a day or two. With mirchi bajji.
  - who: shruti
    t: ಪ್ರಕಾಶ್, ಈ ಟ್ರಿಪ್ ಮುಗಿಯೋ ಹೊತ್ತಿಗೆ ನಾವೆಲ್ಲ ಐದು ಕೆಜಿ ಜಾಸ್ತಿ ಆಗ್ತೀವಿ.
    tr: Prakāś, ī ṭrip mugiyō hottige nāvella aidu keji jāsti āgtīvi.
    en: Prakash, by the time this trip is over we'll all be five kilos heavier.
  - scene: A little laughter returns. Deepa quietly puts a second rotti on Prakash's plate. Ramya eats in silence, her phone face down.
  - who: ramya
    t: ಪ್ರಕಾಶ್, ಮೇಲೆ ನಾನು ವಿಡಿಯೋ ಮಾಡ್ತಿದ್ದೆ. ಅದನ್ನ ಡಿಲೀಟ್ ಮಾಡಿದೀನಿ. ನಿನ್ನ ಮುಂದೇನೇ ಮಾಡ್ತೀನಿ, ನೋಡು. ಸಾರಿ. ನಾನೂ ನಕ್ಕೆ.
    tr: Prakāś, mēle nānu viḍiyō māḍtidde. Adanna ḍilīṭ māḍidīni. Ninna mundēnē māḍtīni, nōḍu. Sāri. Nānū nakke.
    en: Prakash, up there I was filming. I've deleted it. I'll do it right in front of you, look. Sorry. I laughed too.
  - who: prakash
    t: ಥ್ಯಾಂಕ್ಸ್ ರಮ್ಯಾ. ಅದು ಸಾರಿ ಅಂದ್ರ. ‘ನಾನೂ ನಕ್ಕೆ’. ಅಷ್ಟೇ ಸಾಕು.
    tr: Thyāṅks Ramyā. Adu sāri andra. ‘Nānū nakke’. Aṣṭē sāku.
    en: Thanks, Ramya. That's what a sorry is. ‘I laughed too.’ That's all it takes.
  - scene: Arjun hears it. He looks at his plate and tears his rotti into small pieces without eating.
  - who: prakash
    t: ಅರ್ಜುನ್ ಅವರೇ, ಆ ಚಟ್ನಿಪುಡಿ ಇನ್ನಷ್ಟು ಕೊಡ್ರಿ.
    tr: Arjun avarē, ā caṭnipuḍi innaṣṭu koḍri.
    en: Arjun-avare, pass me a little more of that chutney powder.
  - scene: Arjun freezes at the word 'avare'. In college it was always 'Le, Arjuna'. He passes the bowl.
  - who: arjun
    t: ‘ಅವರೇ’? ಏನಿದು ಪ್ರಕಾಶ್, ಹೊಸ ಮರ್ಯಾದೆ?
    tr: ‘Avarē’? Ēnidu Prakāś, hosa maryāde?
    en: ‘Avare’? What's this, Prakash — some new respect?
  - who: prakash
    t: ಎಲ್ಲಾರಿಗೂ ಮರ್ಯಾದಿ ಕೊಡಬೇಕು ಅಂತ ನಮ್ಮವ್ವ ಕಲಿಸ್ಯಾಳ್ರಿ. ಹಳ್ಳಿ ಮಾತಾದ್ರೂ ಅಷ್ಟು ಅದಕ್ಕ ಗೊತ್ತೈತಿ.
    tr: Ellārigū maryādi koḍabēku anta nammavva kalisyāḷri. Haḷḷi mātādrū aṣṭu adakka gottaiti.
    en: My Avva taught me to give everyone respect. It may be village talk, but it knows that much.
  - scene: Nobody says anything. Naveen quietly pushes the rotti basket towards Prakash.
  - scene: 3:15 p.m. Outside the khanavali. Arjun stands by the cars, kicking at the gravel. Kaveri comes out and stands beside him.
  - who: kaveri
    t: ಅರ್ಜುನ್, ಕೋರ್ಟ್ ಇಲ್ಲ, ಗೆಳತಿಯಾಗಿ ಹೇಳ್ತೀನಿ. ನಿಜವಾದ ಕ್ಷಮೆಗೆ ಮೂರು ಭಾಗ. ‘ನಾನು ತಪ್ಪು ಮಾಡಿದೆ’. ‘ಇದರಿಂದ ನಿನಗೆ ನೋವಾಯ್ತು ಅಂತ ಗೊತ್ತು’. ‘ಮತ್ತೆ ಹೀಗೆ ಮಾಡಲ್ಲ’. ‘ಆಗಿದ್ರೆ’ ಅನ್ನೋ ಪದ ಅದರಲ್ಲಿ ಇಲ್ಲ.
    tr: Arjun, kōrṭ illa, geḷatiyāgi hēḷtīni. Nijavāda kṣamege mūru bhāga. ‘Nānu tappu māḍide’. ‘Idarinda ninage nōvāytu anta gottu’. ‘Matte hīge māḍalla’. ‘Āgidre’ annō pada adaralli illa.
    en: Arjun, no court now; I'm saying this as a friend. A real apology has three parts. ‘I was wrong.’ ‘I know it hurt you.’ ‘I won't do it again.’ The word ‘if’ isn't in it.
  - who: arjun
    t: ಗೊತ್ತು ಕಾವೇರಿ. ಗೊತ್ತು. ಆದ್ರೆ ಇವತ್ತು ಆಗಲ್ಲ. ಈಗ ನನ್ನ ತಲೇಲಿ ಬೇರೆ ಏನೇನೋ ಇದೆ.
    tr: Gottu Kāvēri. Gottu. Ādre ivattu āgalla. Īga nanna talēli bēre ēnēnō ide.
    en: I know, Kaveri. I know. But not today. There's all sorts of other stuff in my head right now.
  - who: kaveri
    t: ಬೇರೆ ಏನು?
    tr: Bēre ēnu?
    en: Other stuff like what?
  - who: arjun
    t: ಏನಿಲ್ಲ. ಕೆಲಸ. ಬಿಡು.
    tr: Ēnilla. Kelasa. Biḍu.
    en: Nothing. Work. Leave it.
  - scene: Kaveri looks at him for a long moment, like a lawyer at a witness who has just said less than he knows. Then she lets it go.
  - scene: Imran comes out of the khanavali, wiping his hands on his handkerchief, and leans on the car beside Arjun.
  - who: imran
    t: ಅರ್ಜುನ್, ಮ್ಯಾಲೆ ನಾ ಜೋರಾಗಿ ಮಾತಾಡಿದೆ. ಆದ್ರ ಒಂದು ಮಾತು ಕೇಳು. ಆ ಸಾಲಿ ಹುಡುಗರು ನಕ್ಕಿದ್ದು ನೋಡಿದಿ? ಅವರ ಮನ್ಯಾಗೂ ಅಜ್ಜಿ-ಅಜ್ಜ ಹಂಗೇ ಮಾತಾಡ್ತಾರ. ಇವತ್ತು ಆ ಮಕ್ಕಳು ಏನು ಕಲಿತವು?
    tr: Arjun, myāle nā jōrāgi mātāḍide. Ādra ondu mātu kēḷu. Ā sāli huḍugaru nakkiddu nōḍidi? Avara manyāgū ajji-ajja haṅgē mātāḍtāra. Ivattu ā makkaḷu ēnu kalitavu?
    en: Arjun, I spoke loudly up there. But listen to one thing. Did you see those schoolkids laughing? At home their own grandparents talk just like that. What did those children learn today?
  - who: arjun
    t: …ತಮ್ಮ ಅಜ್ಜಿ ಮಾತು ತಮಾಷೆ ಅಂತ.
    tr: …tamma ajji mātu tamāṣe anta.
    en: …that their grandmother's speech is a joke.
  - who: imran
    t: ಅದೇ. ಅದಕ್ಕೇ ಈ ನೋವು ದೊಡ್ಡದು. ಹೋಗ್ಲಿ, ನಡಿ, ಹೊತ್ತಾತು.
    tr: Adē. Adakkē ī nōvu doḍḍadu. Hōgli, naḍi, hottātu.
    en: Exactly. That's why this hurt is a big one. Anyway, come on, it's getting late.
  - section: Who drives the night road
    learn: 'planning the next leg: innu mūru gaṇṭe, katḷāguvudrolage, rātri ḍraiv · offering and refusing help: nānu ōḍistīni, susthāgide, ninna kāru oḷḷe uddadu · switching seats: nānu ā kārige hōgtīni, sīṭ badalāyisōṇa'
  - scene: 4:30 p.m. The car park. The sun is low and orange behind the fort walls. Naveen rubs his eyes.
  - who: naveen
    t: ನಿನ್ನೆ ಉಡುಪಿಯಿಂದ ಎಂಟು ಗಂಟೆ ಓಡಿಸಿದೆ, ಇವತ್ತು ಮೂರು ಗಂಟೆ. ಕಣ್ಣು ಮುಚ್ಚಿ ಹೋಗ್ತಾ ಉಂಟು. ಹಂಪಿಗೆ ಇನ್ನೂ ಮೂರು ಗಂಟೆ, ಕತ್ತಲೆಯಲ್ಲಿ.
    tr: Ninne Uḍupiyinda eṇṭu gaṇṭe ōḍiside, ivattu mūru gaṇṭe. Kaṇṇu mucchi hōgtā uṇṭu. Hampige innū mūru gaṇṭe, kattaleyalli.
    en: Yesterday I drove eight hours from Udupi, and three more today. My eyes are closing. Hampi is another three hours, in the dark.
  - who: kaveri
    t: ನಾನು ಓಡಿಸ್ತೀನಿ. ಹತ್ತು ವರ್ಷದಿಂದ ಕೊಡಗಿನ ಘಾಟ್ ರಸ್ತೆಯಲ್ಲಿ ಓಡಿಸ್ತಿದೀನಿ. ಈ ಹೈವೇ ಅದಕ್ಕಿಂತ ಸುಲಭ. ನವೀನ್, ನೀನು ಮಲಗು.
    tr: Nānu ōḍistīni. Hattu varṣadinda Koḍagina ghāṭ rasteyalli ōḍistidīni. Ī haivē adakkinta sulabha. Navīn, nīnu malagu.
    en: I'll drive. I've been driving on the Kodagu ghat roads for ten years. This highway is easier than that. Naveen, you sleep.
  - who: naveen
    t: ಸರಿ. ಆದ್ರೆ ನಾನು ಅರ್ಜುನ್ ಕಾರಲ್ಲಿ ಬರ್ತೇನೆ. ಅದರ ಕೊನೆ ಸೀಟು ಉದ್ದ ಉಂಟು, ಕಾಲು ಚಾಚಿ ಮಲಗಬಹುದು.
    tr: Sari. Ādre nānu Arjun kāralli bartēne. Adara kone sīṭu udda uṇṭu, kālu chāchi malagabahudu.
    en: All right. But I'll come in Arjun's car. Its last row is long — I can stretch my legs out and sleep.
  - who: shruti
    t: ಹಾಗಾದ್ರೆ ನಾನು ಕಾವೇರಿ ಕಾರಿಗೆ ಹೋಗ್ತೀನಿ. ದೀಪಾ ಜೊತೆ ಕೂತ್ಕೋತೀನಿ. ರಮ್ಯಾ, ನೀನು ಅರ್ಜುನ್ ಕಾರಲ್ಲಿ ಹೋಗು, ಬೇಕಾದಷ್ಟು ಶೂಟ್ ಮಾಡು.
    tr: Hāgādre nānu Kāvēri kārige hōgtīni. Dīpā jote kūtkōtīni. Ramyā, nīnu Arjun kāralli hōgu, bēkādaṣṭu śūṭ māḍu.
    en: Then I'll go in Kaveri's car. I'll sit with Deepa. Ramya, you go in Arjun's car and shoot as much as you like.
  - who: arjun
    t: ಸರಿ. ಯಾರಿಗೆ ಎಲ್ಲಿ ಬೇಕೋ ಅಲ್ಲಿ ಕೂತ್ಕೊಳ್ಳಿ. ನನ್ ಕಾರಲ್ಲಿ ಜಾಗ ಇದೆ. ಏಳು ಗಂಟೆಗೆ ಹೊಸಪೇಟೆ, ಎಂಟೂವರೆಗೆ ಹಂಪಿ.
    tr: Sari. Yārige elli bēkō alli kūtkoḷḷi. Nan kāralli jāga ide. Ēḷu gaṇṭege Hosapēṭe, eṇṭūvarege Hampi.
    en: Fine. Sit wherever you want. There's room in my car. Hosapete by seven, Hampi by half past eight.
  - scene: Prakash climbs silently into the middle row of Arjun's car beside Imran and puts in his earphones. Naveen stretches out in the back row. In the other car, Kaveri adjusts the mirrors; Shruti and Deepa sit together in the back. The two cars pull out onto the highway as the fort turns dark against the sky.
  - chapter: Chapter 4 — The night road
  - section: Three women, one car, the dark highway
    learn: 'night driving: hai-bīm, ḍip māḍu, lārigaḷu, ḍaivarṣan · talking about a fight afterwards: avanu hāgē, yāvattū badalāglilla, nānū jāsti mātāḍbiṭṭe · noticing a friend''s silence: ninne inda ēnō bēre tara idīya'
  - scene: 6:20 p.m. NH-50 towards Hosapete. Full dark. Lorries loaded with sugarcane and iron ore crawl in the left lane. Kaveri drives with both hands on the wheel; Shruti and Deepa sit in the back of Naveen's white car. Arjun's tail lights glow a kilometre ahead.
  - who: kaveri
    t: ಎದುರಿಂದ ಬರೋ ಲಾರಿಗಳು ಹೈ-ಬೀಮ್ ಡಿಪ್ ಮಾಡಲ್ಲ. ಕಣ್ಣಿಗೆ ನೇರ ಹೊಡೆಯುತ್ತೆ. ಶ್ರುತಿ, ಸ್ವಲ್ಪ ಎಡಗಡೆ ನೋಡ್ತಿರು, ಬೈಕ್‌ಗಳು ಲೈಟ್ ಇಲ್ಲದೆ ಬರ್ತವೆ.
    tr: Edurinda barō lārigaḷu hai-bīm ḍip māḍalla. Kaṇṇige nēra hoḍeyutte. Śruti, svalpa eḍagaḍe nōḍtiru, baik-gaḷu laiṭ illade bartave.
    en: The oncoming lorries don't dip their high beams. It hits you straight in the eyes. Shruti, keep an eye on the left; bikes come along without lights.
  - who: shruti
    t: ನೋಡ್ತಿದೀನಿ. ಕಾವೇರಿ, ನೀನು ಇಲ್ಲದಿದ್ರೆ ಇವತ್ತು ನಾನು ಆ ಕಾರಲ್ಲೇ ಮೂರು ಗಂಟೆ ಕೂರಬೇಕಿತ್ತು. ಅರ್ಜುನ್ ಪಕ್ಕ. ಆ ಮೌನ ತಡ್ಕೊಳ್ಳೋಕಾಗ್ತಿರ್ಲಿಲ್ಲ.
    tr: Nōḍtidīni. Kāvēri, nīnu illadidre ivattu nānu ā kārallē mūru gaṇṭe kūrabēkittu. Arjun pakka. Ā mauna taḍkoḷḷōkāgtirlilla.
    en: I'm watching. Kaveri, if it weren't for you, I'd have had to sit in that car for three hours tonight. Next to Arjun. I couldn't have stood that silence.
  - who: kaveri
    t: ನೀನು ಇವತ್ತು ಸ್ವಲ್ಪ ಜಾಸ್ತಿನೇ ಹೇಳಿದೆ ಅವನಿಗೆ. ‘ಹದಿನಾಲ್ಕು ವರ್ಷ’ ಅಂದಾಗ ಎಲ್ರಿಗೂ ಅರ್ಥ ಆಯ್ತು ನೀನು ಯಾವುದರ ಬಗ್ಗೆ ಮಾತಾಡ್ತಿದೀಯ ಅಂತ.
    tr: Nīnu ivattu svalpa jāstinē hēḷide avanige. ‘Hadinālku varṣa’ andāga ellrigū artha āytu nīnu yāvudara bagge mātāḍtidīya anta.
    en: You said a bit too much to him today. When you said ‘fourteen years’, everyone understood what you were talking about.
  - who: shruti
    t: ಗೊತ್ತು. ನಾನೂ ಜಾಸ್ತಿ ಮಾತಾಡ್ಬಿಟ್ಟೆ. ಆದ್ರೆ ಅವನ ಆ ಮುಖ… ‘ನನಗೆ ಏನೂ ತಾಗಲ್ಲ’ ಅನ್ನೋ ಮುಖ. ಆವತ್ತೂ ಅದೇ ಮುಖ ಇತ್ತು. ಬಿಡು, ಅದು ಇವತ್ತಿನ ವಿಷಯ ಅಲ್ಲ.
    tr: Gottu. Nānū jāsti mātāḍbiṭṭe. Ādre avana ā mukha… ‘nanage ēnū tāgalla’ annō mukha. Āvattū adē mukha ittu. Biḍu, adu ivattina viṣaya alla.
    en: I know. I said too much as well. But that face of his… the ‘nothing touches me’ face. He had the same face back then too. Leave it, that's not today's subject.
  - scene: Deepa has been looking out of the window at the black fields. Her phone lights up in her lap; she turns it face down.
  - who: shruti
    t: ದೀಪಾ, ನೀನು ನಿನ್ನೆಯಿಂದ ಏನೋ ಬೇರೆ ತರ ಇದೀಯ. ಊಟ ಸರಿಯಾಗಿ ಮಾಡ್ಲಿಲ್ಲ, ನಗೋದೂ ಅರ್ಧ. ಆರೋಗ್ಯ ಸರಿ ಇದ್ಯಾ?
    tr: Dīpā, nīnu ninneyinda ēnō bēre tara idīya. Ūṭa sariyāgi māḍlilla, nagōdū ardha. Ārōgya sari idyā?
    en: Deepa, you've been different since yesterday. You didn't eat properly, you only half-laugh. Are you well?
  - who: deepa
    t: ಆರೋಗ್ಯ ಚೆನ್ನಾಗಿದೆ ಕಣೇ. ಸುಮ್ನೆ ಸುಸ್ತು.
    tr: Ārōgya chennāgide kaṇē. Sumne sustu.
    en: My health is fine. I'm just tired.
  - who: shruti
    t: ಕಾವೇರಿ, ಪುತ್ತರಿಗೆ ಊರಿಗೆ ಹೋಗದೆ ಇಲ್ಲಿ ಬಂದ್ಯಲ್ಲಾ, ಅಮ್ಮ ಏನಂದ್ರು?
    tr: Kāvēri, Puttarige ūrige hōgade illi bandyallā, amma ēnandru?
    en: Kaveri, you came here instead of going home for Puttari — what did your mother say?
  - who: kaveri
    t: ಅಮ್ಮ ಎರಡು ವಿಷಯ ಹೇಳಿದ್ರು. ಒಂದು, ‘ಹಬ್ಬಕ್ಕೆ ಬರಲ್ಲ’. ಎರಡು, ‘ಮೂವತ್ನಾಲ್ಕು ವರ್ಷ ಆಯ್ತು, ಮದುವೆಗೂ ಬರಲ್ಲ’. ಪ್ರತಿ ಫೋನ್ ಕಾಲ್ ಒಂದು ಕ್ರಾಸ್-ಎಕ್ಸಾಮಿನೇಷನ್.
    tr: Amma eraḍu viṣaya hēḷidru. Ondu, ‘habbakke baralla’. Eraḍu, ‘mūvatnālku varṣa āytu, maduvegū baralla’. Prati phōn kāl ondu krās-eksāminēṣan.
    en: 'Amma said two things. One: ‘You won''t come for the festival.’ Two: ‘You''re thirty-four and you won''t come to your own wedding either.’ Every phone call is a cross-examination.'
  - who: shruti
    t: ನೀನು ಏನು ಉತ್ತರ ಕೊಡ್ತೀಯ?
    tr: Nīnu ēnu uttara koḍtīya?
    en: What do you answer?
  - who: kaveri
    t: ‘ಆಕ್ಷೇಪಣೆ, ಮಾನ್ಯರೇ. ಪ್ರಶ್ನೆ ಅಪ್ರಸ್ತುತ’ ಅಂತೀನಿ. ಅಮ್ಮ ಫೋನ್ ಇಡ್ತಾರೆ. ಮುಂದಿನ ವಾರ ಮತ್ತೆ ಅದೇ ವಿಚಾರಣೆ.
    tr: ‘Ākṣēpaṇe, mān'yarē. Praśne aprastuta’ antīni. Amma phōn iḍtāre. Mundina vāra matte adē vichāraṇe.
    en: I say, ‘Objection, Your Honour. The question is irrelevant.’ Amma hangs up. Next week, the same hearing again.
  - scene: Shruti laughs. Deepa smiles faintly at the window. Then the torches of a check post appear ahead.
  - section: The check post
    learn: 'formal register with police: namaskāra sār, khaṇḍita, tōristīni, idē sār · documents: lais-ens, ār-si, inśūrens, pi-yu-si, ḍiji-lākar · the officer''s speech: gāḍi sāiḍige hāki, ellinda bartidīri?, mālīkaru yāru? · procedures: brīth anālaisar, ūdi, hinde sīṭ belṭ kaḍḍāya'
  - scene: 7:05 p.m. A police check post a few kilometres before Hosapete. Orange barricades narrow the road to one lane. A jeep with a blue light, three constables with torches, and a sub-inspector in a khaki sweater. A torch waves the white car to the side.
  - who: police
    t: ನಮಸ್ಕಾರ ಮೇಡಂ. ಗಾಡಿ ಸ್ವಲ್ಪ ಸೈಡಿಗೆ ಹಾಕಿ, ಇಂಜಿನ್ ಆಫ್ ಮಾಡಿ. ಒಳಗಿನ ಲೈಟ್ ಆನ್ ಮಾಡಿ.
    tr: Namaskāra mēḍam. Gāḍi svalpa sāiḍige hāki, iñjin āph māḍi. Oḷagina laiṭ ān māḍi.
    en: Good evening, madam. Pull the vehicle to the side, please, switch off the engine. Switch on the inside light.
  - who: kaveri
    t: ನಮಸ್ಕಾರ ಸಾರ್. ಮಾಡಿದೀನಿ. ಏನು ತೋರಿಸಬೇಕು ಹೇಳಿ.
    tr: Namaskāra sār. Māḍidīni. Ēnu tōrisabēku hēḷi.
    en: Good evening, sir. Done. Tell me what I need to show you.
  - who: police
    t: ನಿಮ್ಮ ಡ್ರೈವಿಂಗ್ ಲೈಸೆನ್ಸ್, ಗಾಡಿಯ ಆರ್‌ಸಿ, ಇನ್ಶೂರೆನ್ಸ್, ಪಿಯುಸಿ. ಡಿಜಿಲಾಕರ್‌ನಲ್ಲಿ ಇದ್ರೂ ನಡೆಯುತ್ತೆ.
    tr: Nimma ḍraiviṅg laisens, gāḍiya ār-si, inśūrens, pi-yu-si. Ḍiji-lākar-nalli idrū naḍeyutte.
    en: Your driving licence, the vehicle's RC, insurance and PUC. It's fine if they're in DigiLocker.
  - who: kaveri
    t: ಲೈಸೆನ್ಸ್ ಇದು, ಒರಿಜಿನಲ್. ಗಾಡಿಯ ಪೇಪರ್ಸ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್‌ನಲ್ಲಿವೆ. ಒಂದು ನಿಮಿಷ… ಇಲ್ಲಿ ಆರ್‌ಸಿ ಇದೆ, ಇನ್ಶೂರೆನ್ಸ್ ಮುಂದಿನ ಮಾರ್ಚ್‌ವರೆಗೆ ಇದೆ, ಪಿಯುಸಿ ಸೆಪ್ಟೆಂಬರ್‌ನಲ್ಲಿ ಮಾಡಿಸಿದ್ದು.
    tr: Laisens idu, orijinal. Gāḍiya pēpars ḍyāś-bōrḍ-nallive. Ondu nimiṣa… illi ār-si ide, inśūrens mundina mārch-varege ide, pi-yu-si sepṭembar-nalli māḍisiddu.
    en: Here's the licence, the original. The vehicle papers are in the dashboard. One minute… here's the RC, the insurance is valid till next March, the PUC was done in September.
  - who: police
    t: ಗಾಡಿ ಉಡುಪಿ ರಿಜಿಸ್ಟ್ರೇಷನ್, ನವೀನ್ ಶೆಟ್ಟಿ ಅವರ ಹೆಸರಲ್ಲಿದೆ. ನೀವು ಮಾಲೀಕರಲ್ಲ. ಮಾಲೀಕರು ಎಲ್ಲಿದ್ದಾರೆ? ಅವರ ಜೊತೆ ನಿಮಗೇನು ಸಂಬಂಧ?
    tr: Gāḍi Uḍupi rijisṭrēṣan, Navīn Śeṭṭi avara hesarallide. Nīvu mālīkaralla. Mālīkaru elliddāre? Avara jote nimagēnu sambandha?
    en: The vehicle has an Udupi registration, in the name of one Naveen Shetty. You're not the owner. Where is the owner? What's your relationship with him?
  - who: kaveri
    t: ನವೀನ್ ಶೆಟ್ಟಿ ನಮ್ಮ ಕಾಲೇಜು ಗೆಳೆಯ, ಸಾರ್. ಅವರು ಸುಸ್ತಾಗಿದ್ರು, ಅದಕ್ಕೆ ನಾನು ಓಡಿಸ್ತಿದೀನಿ. ಅವರು ಮುಂದಿನ ಕಾರಲ್ಲಿದ್ದಾರೆ, ಬೂದು ಬಣ್ಣದ ಎಸ್‌ಯುವಿ. ಈಗಲೇ ಫೋನ್ ಮಾಡಿ ಮಾತಾಡಿಸ್ತೀನಿ.
    tr: Navīn Śeṭṭi namma kālēju geḷeya, sār. Avaru sustāgidru, adakke nānu ōḍistidīni. Avaru mundina kāralliddāre, būdu baṇṇada es-yu-vi. Īgalē phōn māḍi mātāḍistīni.
    en: Naveen Shetty is our college friend, sir. He was exhausted, so I'm driving. He's in the car ahead, a grey SUV. I'll call him right now and you can speak to him.
  - who: police
    t: ಮಾಡಿ. ಸ್ಪೀಕರ್‌ನಲ್ಲಿ ಹಾಕಿ.
    tr: Māḍi. Spīkar-nalli hāki.
    en: Do that. Put it on speaker.
  - scene: Kaveri dials. It rings for a long time. Then Ramya answers, whispering.
  - who: ramya
    t: ಹಲೋ ಕಾವೇರಿ? ನವೀನ್ ಗೊರಕೆ ಹೊಡೀತಾ ಉಂಟು ಮರ್ರೆ. ಎಂತ ಆಯ್ತು?
    tr: Halō Kāvēri? Navīn gorake hoḍītā uṇṭu marre. Enta āytu?
    en: Hello, Kaveri? Naveen's snoring away, man. What's happened?
  - who: kaveri
    t: ರಮ್ಯಾ, ಪೊಲೀಸ್ ಚೆಕ್ ಪೋಸ್ಟ್. ಏನೂ ಸಮಸ್ಯೆ ಇಲ್ಲ, ಆದ್ರೆ ನವೀನ್‌ನ ಎಬ್ಬಿಸು. ಇನ್ಸ್‌ಪೆಕ್ಟರ್ ಅವರು ಮಾಲೀಕರ ಜೊತೆ ಮಾತಾಡ್ಬೇಕಂತೆ.
    tr: Ramyā, polīs chek pōsṭ. Ēnū samasye illa, ādre Navīn-na ebbisu. Inspekṭar avaru mālīkara jote mātāḍbēkante.
    en: Ramya, it's a police check post. No problem at all, but wake Naveen up. The inspector needs to speak to the owner.
  - who: naveen
    t: ಹಾಂ… ಹಲೋ? ನಮಸ್ಕಾರ ಸಾರ್. ನಾನು ನವೀನ್ ಶೆಟ್ಟಿ. ಹೌದು ಸಾರ್, ಅದು ನನ್ನ ಗಾಡಿ. ನಾನೇ ಅವರಿಗೆ ಓಡಿಸ್ಲಿಕ್ಕೆ ಹೇಳಿದ್ದು. ಬೇಕಾದ್ರೆ ನಾವು ವಾಪಸ್ ಬರ್ತೇವೆ.
    tr: Hāṁ… halō? Namaskāra sār. Nānu Navīn Śeṭṭi. Haudu sār, adu nanna gāḍi. Nānē avarige ōḍislikke hēḷiddu. Bēkādre nāvu vāpas bartēve.
    en: Hm… hello? Good evening, sir. I'm Naveen Shetty. Yes, sir, that's my vehicle. I asked her to drive it myself. If you need us to, we'll turn back.
  - who: police
    t: ಬೇಡ, ಪರವಾಗಿಲ್ಲ. ಮಾಲೀಕರ ಒಪ್ಪಿಗೆ ಇದೆ, ಲೈಸೆನ್ಸ್ ಸರಿ ಇದೆ. ಥ್ಯಾಂಕ್ಯೂ ಸಾರ್. ನೀವು ಮಲಗಿ.
    tr: Bēḍa, paravāgilla. Mālīkara oppige ide, laisens sari ide. Thyāṅkyū sār. Nīvu malagi.
    en: No need, it's all right. The owner has consented, and the licence is in order. Thank you, sir. You can go back to sleep.
  - scene: The call ends. The officer shines his torch over the back seat.
  - who: police
    t: ಮೇಡಂ, ಎಲ್ಲಿಂದ ಬರ್ತಿದೀರಿ, ಎಲ್ಲಿಗೆ ಹೋಗ್ತಿದೀರಿ?
    tr: Mēḍam, ellinda bartidīri, ellige hōgtidīri?
    en: Madam, where are you coming from, and where are you going?
  - who: kaveri
    t: ಬೆಂಗಳೂರಿನಿಂದ, ಸಾರ್. ಇವತ್ತು ಚಿತ್ರದುರ್ಗ ನೋಡ್ಕೊಂಡು ಬಂದ್ವಿ. ಇವತ್ತು ರಾತ್ರಿ ಕಮಲಾಪುರದಲ್ಲಿ ಹೋಮ್‌ಸ್ಟೇ. ನಾಳೆ ಹಂಪಿ, ಆಮೇಲೆ ಧಾರವಾಡ, ಗೋಕರ್ಣ. ಹಳೆ ಕಾಲೇಜು ಗೆಳೆಯರ ಪ್ರವಾಸ.
    tr: Beṅgaḷūrininda, sār. Ivattu Chitradurga nōḍkoṇḍu bandvi. Ivattu rātri Kamalāpuradalli hōmsṭē. Nāḷe Hampi, āmēle Dhāravāḍa, Gōkarṇa. Haḷe kālēju geḷeyara pravāsa.
    en: From Bengaluru, sir. We saw Chitradurga today. Tonight we're at a homestay in Kamalapur. Tomorrow Hampi, then Dharwad and Gokarna. A trip of old college friends.
  - who: police
    t: ಸರಿ. ಡಿಕ್ಕಿ ತೆಗೀರಿ ಒಂದ್ಸಲ. ಈ ರಸ್ತೆಯಲ್ಲಿ ರಾತ್ರಿ ಹೊತ್ತು ಮದ್ಯ, ಮರಳು ಎಲ್ಲಾ ಸಾಗಣೆ ಆಗುತ್ತೆ. ಎಲ್ಲಾ ಗಾಡಿನೂ ಚೆಕ್ ಮಾಡ್ತೀವಿ. ಬೇಜಾರು ಮಾಡ್ಕೋಬೇಡಿ.
    tr: Sari. Ḍikki tegīri ondsala. Ī rasteyalli rātri hottu madya, maraḷu ellā sāgaṇe āgutte. Ellā gāḍinū chek māḍtīvi. Bējāru māḍkōbēḍi.
    en: All right. Open the boot once, please. Liquor, sand, all sorts of things get transported on this road at night. We check every vehicle. Please don't mind.
  - who: kaveri
    t: ಖಂಡಿತ ಸಾರ್. ನಿಮ್ಮ ಕೆಲಸ ನೀವು ಮಾಡ್ತಿದೀರಿ. ಮೂರು ಬ್ಯಾಗ್, ಒಂದು ನೀರಿನ ಕ್ಯಾನ್, ಒಂದು ಡಬ್ಬದಲ್ಲಿ ಹೋಳಿಗೆ. ಬೇಕಾದ್ರೆ ಒಂದು ತಗೊಳ್ಳಿ.
    tr: Khaṇḍita sār. Nimma kelasa nīvu māḍtidīri. Mūru byāg, ondu nīrina kyān, ondu ḍabbadalli hōḷige. Bēkādre ondu tagoḷḷi.
    en: Of course, sir. You're doing your job. Three bags, a water can, and holige in a box. Do take one if you like.
  - who: police
    t: ಇಲ್ಲ ಮೇಡಂ, ಡ್ಯೂಟಿಯಲ್ಲಿದೀನಿ. ಇನ್ನೊಂದು ವಿಷಯ, ಡ್ರೈವರ್‌ಗೆ ಬ್ರೀತ್ ಅನಲೈಸರ್ ಟೆಸ್ಟ್. ಇದು ಎಲ್ಲರಿಗೂ ಕಡ್ಡಾಯ. ಈ ಪೈಪ್‌ಗೆ ಜೋರಾಗಿ ಊದಿ.
    tr: Illa mēḍam, ḍyūṭiyallidīni. Innondu viṣaya, ḍraivar-ge brīth anālaisar ṭesṭ. Idu ellarigū kaḍḍāya. Ī paip-ge jōrāgi ūdi.
    en: 'No, madam, I''m on duty. One more thing: a breath analyser test for the driver. It''s compulsory for everyone. Blow hard into this pipe.'
  - scene: Kaveri blows. The little machine beeps. The officer reads the screen under his torch.
  - who: police
    t: ಸೊನ್ನೆ. ಸರಿ. ಹಿಂದೆ ಕೂತವರು ಸೀಟ್ ಬೆಲ್ಟ್ ಹಾಕಿಲ್ಲ. ಹಿಂದಿನ ಸೀಟಿಗೂ ಬೆಲ್ಟ್ ಕಡ್ಡಾಯ, ಮೇಡಂ. ಹೈವೇಯಲ್ಲಿ ಒಂದು ಆಕ್ಸಿಡೆಂಟ್ ಆದ್ರೆ ಹಿಂದಿನವರೇ ಮುಂದೆ ಹಾರ್ತಾರೆ. ನಾನು ದಿನಾ ನೋಡ್ತೀನಿ.
    tr: Sonne. Sari. Hinde kūtavaru sīṭ belṭ hākilla. Hindina sīṭigū belṭ kaḍḍāya, mēḍam. Haivēyalli ondu āksiḍeṇṭ ādre hindinavarē munde hārtāre. Nānu dinā nōḍtīni.
    en: Zero. Fine. The people in the back aren't wearing seat belts. Belts are compulsory in the rear seats too, madam. In an accident on the highway, it's the people in the back who fly forward. I see it every day.
  - who: shruti
    t: ಸಾರಿ ಸಾರ್, ಈಗಲೇ ಹಾಕ್ತೀವಿ. ತಪ್ಪಾಯ್ತು.
    tr: Sāri sār, īgalē hāktīvi. Tappāytu.
    en: Sorry, sir, we'll put them on right away. Our mistake.
  - who: police
    t: ಈ ಸಲ ಎಚ್ಚರಿಕೆ ಅಷ್ಟೇ, ದಂಡ ಹಾಕಲ್ಲ. ಮೇಡಂ, ನೀವು ಏನು ಕೆಲಸ ಮಾಡ್ತೀರಿ? ಪೇಪರ್ಸ್ ಎಲ್ಲಾ ಇಷ್ಟು ಸರಿಯಾಗಿ ಇಟ್ಟಿದೀರಿ.
    tr: Ī sala eccharike aṣṭē, daṇḍa hākalla. Mēḍam, nīvu ēnu kelasa māḍtīri? Pēpars ellā iṣṭu sariyāgi iṭṭidīri.
    en: This time it's just a warning; no fine. Madam, what do you do for a living? You've kept all the papers so neatly.
  - who: kaveri
    t: ನಾನು ವಕೀಲೆ, ಸಾರ್. ಹೈಕೋರ್ಟ್‌ನಲ್ಲಿ ಪ್ರಾಕ್ಟೀಸ್ ಮಾಡ್ತೀನಿ.
    tr: Nānu vakīle, sār. Haikōrṭ-nalli prākṭīs māḍtīni.
    en: I'm an advocate, sir. I practise at the High Court.
  - who: police
    t: ಓಹೋ, ಹೈಕೋರ್ಟ್ ವಕೀಲರಾ? ಮೊದಲೇ ಯಾಕೆ ಹೇಳ್ಲಿಲ್ಲ ಮೇಡಂ?
    tr: Ōhō, Haikōrṭ vakīlarā? Modalē yāke hēḷlilla mēḍam?
    en: Oho, a High Court advocate? Why didn't you say so at the start, madam?
  - who: kaveri
    t: ಯಾಕಂದ್ರೆ ಅದರಿಂದ ಏನೂ ಬದಲಾಗಬಾರದು, ಸಾರ್. ನಿಯಮ ಎಲ್ಲರಿಗೂ ಒಂದೇ. ನೀವು ಸರಿಯಾಗಿ ಚೆಕ್ ಮಾಡಿದ್ರಿ, ಸೌಜನ್ಯದಿಂದ ಮಾತಾಡಿದ್ರಿ. ಅದಕ್ಕೆ ಧನ್ಯವಾದ.
    tr: Yākandre adarinda ēnū badalāgabāradu, sār. Niyama ellarigū ondē. Nīvu sariyāgi chek māḍidri, saujanyadinda mātāḍidri. Adakke dhanyavāda.
    en: Because it shouldn't change anything, sir. The rules are the same for everyone. You checked properly, and you spoke courteously. Thank you for that.
  - who: police
    t: ಸರಿ ಮೇಡಂ. ಮುಂದೆ ಹೊಸಪೇಟೆ ಬೈಪಾಸ್ ಹತ್ರ ರಸ್ತೆ ಕೆಲಸ ನಡೀತಿದೆ, ಡೈವರ್ಶನ್ ಇದೆ. ನಿಧಾನವಾಗಿ ಹೋಗಿ. ಕಮಲಾಪುರಕ್ಕೆ ಎಡಕ್ಕೆ ತಿರುಗಿ. ಹ್ಯಾಪಿ ಜರ್ನಿ.
    tr: Sari mēḍam. Munde Hosapēṭe baipās hatra raste kelasa naḍītide, ḍaivarṣan ide. Nidhānavāgi hōgi. Kamalāpurakke eḍakke tirugi. Hyāpi jarni.
    en: Very well, madam. Ahead, near the Hosapete bypass, there's road work and a diversion. Go slowly. Turn left for Kamalapur. Happy journey.
  - scene: The barricade lifts. Kaveri pulls back onto the road. For a minute nobody says anything; then Shruti laughs softly.
  - who: shruti
    t: ‘ಮೊದಲೇ ಯಾಕೆ ಹೇಳ್ಲಿಲ್ಲ’! ನೀನು ಹೇಳಿದ್ರೆ ಅವರು ಡಿಕ್ಕಿನೇ ತೆಗೆಸ್ತಿರ್ಲಿಲ್ಲ.
    tr: ‘Modalē yāke hēḷlilla’! Nīnu hēḷidre avaru ḍikkinē tegestirlilla.
    en: ‘Why didn't you say so at the start’! If you'd said it, he wouldn't even have opened the boot.
  - who: kaveri
    t: ಅದಕ್ಕೇ ಹೇಳ್ಲಿಲ್ಲ. ಅವರ ಕೆಲಸ ಕಷ್ಟದ್ದು. ಚಳಿಯಲ್ಲಿ ರಾತ್ರಿ ಇಡೀ ರಸ್ತೆ ಮೇಲೆ ನಿಲ್ಲಬೇಕು. ಸರಿಯಾಗಿ ಮಾಡೋರಿಗೆ ಗೌರವ ಕೊಡಬೇಕು.
    tr: Adakkē hēḷlilla. Avara kelasa kaṣṭaddu. Chaḷiyalli rātri iḍī raste mēle nillabēku. Sariyāgi māḍōrige gaurava koḍabēku.
    en: That's exactly why I didn't. His job is hard. He has to stand on the road all night in the cold. Those who do it properly deserve respect.
  - section: What Deepa carries
    learn: 'breaking difficult news: ondu viṣaya hēḷbēku, yārigū hēḷilla innū · divorce vocabulary: phyāmili kōrṭ, parasapara oppigeya vichchēdana, jaṇṭi arji, bērebēre irōdu · no villain: yārū keṭṭavaralla, ibrū sōtvi · comforting: nānidīni kaṇē, aḷu paravāgilla, ninna tappalla'
  - scene: 7:40 p.m. The road is quieter now, past the diversion. Deepa speaks without turning from the window.
  - who: deepa
    t: ಶ್ರುತಿ, ನೀನು ಕೇಳಿದ್ಯಲ್ಲಾ, ಮೈಸೂರಲ್ಲಿ ಏನು ಕೆಲಸ ಇತ್ತು ಅಂತ. ನಿನ್ನೆ ಮೈಸೂರಿನ ಫ್ಯಾಮಿಲಿ ಕೋರ್ಟ್‌ನಲ್ಲಿದ್ದೆ.
    tr: Śruti, nīnu kēḷidyallā, Maisūralli ēnu kelasa ittu anta. Ninne Maisūrina phyāmili kōrṭ-nallidde.
    en: Shruti, you asked what work I had in Mysuru. Yesterday I was at the family court in Mysuru.
  - scene: Shruti turns fully towards her. Kaveri's eyes go to the rear-view mirror and back to the road.
  - who: deepa
    t: ನಾನು ಮತ್ತೆ ರೋಹಿತ್ ಡಿವೋರ್ಸ್‌ಗೆ ಅರ್ಜಿ ಹಾಕಿದೀವಿ. ಪರಸ್ಪರ ಒಪ್ಪಿಗೆಯಿಂದ. ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಫೈಲ್ ಮಾಡಿದ್ವಿ. ಮದುವೆ ಆಗಿದ್ದು ಮೈಸೂರಲ್ಲಿ, ಅದಕ್ಕೆ ಅಲ್ಲೇ.
    tr: Nānu matte Rōhit ḍivōrs-ge arji hākidīvi. Paraspara oppigeyinda. Akṭōbar-nalli phail māḍidvi. Maduve āgiddu Maisūralli, adakke allē.
    en: Rohit and I have applied for a divorce. By mutual consent. We filed in October. We got married in Mysuru, so it's there.
  - who: shruti
    t: ದೀಪಾ… ಅಯ್ಯೋ, ಕಣೇ. ಯಾವಾಗಿಂದ ಇದೆಲ್ಲಾ? ನೀನು ಒಂದು ಮಾತೂ ಹೇಳ್ಲಿಲ್ಲ.
    tr: Dīpā… ayyō, kaṇē. Yāvāginda idellā? Nīnu ondu mātū hēḷlilla.
    en: Deepa… oh, my dear. Since when has all this been going on? You never said a word.
  - who: deepa
    t: ಕಳೆದ ವರ್ಷ ಸೆಪ್ಟೆಂಬರ್‌ನಿಂದ ಬೇರೆಬೇರೆ ಇದೀವಿ. ಅವನು ಕೋರಮಂಗಲದ ಫ್ಲ್ಯಾಟ್‌ನಲ್ಲಿ, ನಾನು ಒಂದು ಪಿಜಿ ತರ ಸಣ್ಣ ಮನೆಯಲ್ಲಿ. ಹೇಳೋಕೆ ಏನಿತ್ತು? ‘ನನ್ನ ಮದುವೆ ಮುಗೀತು’ ಅಂತ ಗ್ರೂಪ್‌ನಲ್ಲಿ ಹಾಕ್ಬೇಕಿತ್ತಾ?
    tr: Kaḷeda varṣa sepṭembar-ninda bērebēre idīvi. Avanu Kōramaṅgalada phlyāṭ-nalli, nānu ondu pi-ji tara saṇṇa maneyalli. Hēḷōke ēnittu? ‘Nanna maduve mugītu’ anta grūp-nalli hākbēkittā?
    en: We've been living apart since September last year. He's in the Koramangala flat, I'm in a small place, like a PG. What was there to say? Should I have posted ‘My marriage is over’ in the group?
  - who: shruti
    t: ಗ್ರೂಪ್‌ನಲ್ಲಿ ಅಲ್ಲ. ನನಗೆ. ಒಂದು ಫೋನ್. ಅಷ್ಟೇ ಸಾಕಿತ್ತು. ಸರಿ, ಈಗ ಹೇಳ್ತಿದೀಯಲ್ಲಾ. ಏನಾಯ್ತು? ಅವನು ಏನಾದ್ರೂ…
    tr: Grūp-nalli alla. Nanage. Ondu phōn. Aṣṭē sākittu. Sari, īga hēḷtidīyallā. Ēnāytu? Avanu ēnādrū…
    en: Not in the group. To me. One phone call. That would have been enough. All right, you're telling me now. What happened? Did he do something…
  - who: deepa
    t: ಇಲ್ಲ, ಇಲ್ಲ. ಅವನು ಕೆಟ್ಟವನಲ್ಲ. ಹೊಡೆದಿಲ್ಲ, ಮೋಸ ಮಾಡಿಲ್ಲ. ಅದೇ ಕಷ್ಟ. ಯಾರೂ ವಿಲನ್ ಇಲ್ಲ. ಇಬ್ರೂ ದಿನಾ ಹದಿನಾಲ್ಕು ಗಂಟೆ ಕೆಲಸ, ವೀಕೆಂಡ್‌ನಲ್ಲಿ ಇಬ್ರೂ ಲ್ಯಾಪ್‌ಟಾಪ್ ಮುಂದೆ. ಒಂದೇ ಮನೆಯಲ್ಲಿ ಇಬ್ರು ಅಪರಿಚಿತರು. ಒಂದು ದಿನ ಅವನೇ ಹೇಳಿದ, ‘ದೀಪಾ, ನಾವು ಸ್ನೇಹಿತರಾಗಿ ಉಳಿಯೋಣ, ಗಂಡ-ಹೆಂಡತಿಯಾಗಿ ಅಲ್ಲ’ ಅಂತ. ನಾನು ಅಳಲಿಲ್ಲ. ಯಾಕಂದ್ರೆ ನಾನೂ ಅದನ್ನೇ ಯೋಚಿಸ್ತಿದ್ದೆ.
    tr: Illa, illa. Avanu keṭṭavanalla. Hoḍedilla, mōsa māḍilla. Adē kaṣṭa. Yārū vilan illa. Ibrū dinā hadinālku gaṇṭe kelasa, vīkeṇḍ-nalli ibrū lyāp-ṭāp munde. Ondē maneyalli ibru aparichitaru. Ondu dina avanē hēḷida, ‘Dīpā, nāvu snēhitarāgi uḷiyōṇa, gaṇḍa-heṇḍatiyāgi alla’ anta. Nānu aḷalilla. Yākandre nānū adannē yōchistidde.
    en: 'No, no. He''s not a bad man. He never hit me, never cheated. That''s what makes it hard. There''s no villain. Both of us working fourteen hours a day, both in front of laptops at the weekend. Two strangers in one house. One day he said it himself: ‘Deepa, let''s stay friends — not husband and wife.’ I didn''t cry. Because I''d been thinking the same thing.'
  - who: deepa
    t: ಜಗಳ ಆಡ್ಲಿಲ್ಲ, ಯಾರ ಮೇಲೂ ಕೇಸ್ ಹಾಕ್ಲಿಲ್ಲ. ಸುಮ್ನೆ… ಇಬ್ರೂ ಸೋತ್ವಿ ಅನ್ಸುತ್ತೆ. ‘ಮ್ಯೂಚುವಲ್ ಕನ್ಸೆಂಟ್’ ಅಂದ್ರೆ ಅದೇ.
    tr: Jagaḷa āḍlilla, yāra mēlū kēs hāklilla. Sumne… ibrū sōtvi ansutte. ‘Myūchuval kanseṇṭ’ andre adē.
    en: We didn't fight, nobody filed a case against anyone. Just… I think we both lost. That's what ‘mutual consent’ means.
  - scene: Her voice breaks on the last word. Shruti unbuckles, then remembers the officer and buckles up again, and reaches across to hold Deepa's hand instead.
  - who: shruti
    t: ಅಳು, ಪರವಾಗಿಲ್ಲ. ಎಲ್ಲಾ ಒಳಗೇ ಇಟ್ಕೋಬೇಡ. ನಾನಿದೀನಿ ಕಣೇ. ನೀನು ಒಬ್ಬಳೇ ಅಂತ ಅನ್ಕೋಬೇಡ.
    tr: Aḷu, paravāgilla. Ellā oḷagē iṭkōbēḍa. Nānidīni kaṇē. Nīnu obbaḷē anta ankōbēḍa.
    en: Cry, it's all right. Don't keep it all inside. I'm here. Don't think you're alone.
  - who: deepa
    t: ನಿನ್ನೆ ಕೋರ್ಟ್‌ನಿಂದ ಹೊರಗೆ ಬಂದ್ಮೇಲೆ ಕಾರಲ್ಲಿ ಕುವೆಂಪುನಗರದ ನಮ್ಮ ಮನೆ ರಸ್ತೆ ದಾಟಿದೆ. ಅಮ್ಮ ಬಾಲ್ಕನಿಯಲ್ಲಿ ಬಟ್ಟೆ ಒಣಗಿಸ್ತಿದ್ರು. ನಾನು ನಿಲ್ಲಿಸ್ಲಿಲ್ಲ, ಶ್ರುತಿ. ಅಮ್ಮ-ಅಪ್ಪನಿಗೆ ಇನ್ನೂ ಗೊತ್ತಿಲ್ಲ. ಯಾರಿಗೂ ಗೊತ್ತಿಲ್ಲ.
    tr: Ninne kōrṭ-ninda horage bandmēle kāralli Kuvempunagarada namma mane raste dāṭide. Amma bālkaniyalli baṭṭe oṇagistidru. Nānu nillislilla, Śruti. Amma-appanige innū gottilla. Yārigū gottilla.
    en: Yesterday, after I came out of court, I drove past our street in Kuvempunagar. Amma was drying clothes on the balcony. I didn't stop, Shruti. Amma and Appa still don't know. Nobody knows.
  - who: shruti
    t: ಯಾಕೆ ಹೇಳ್ಲಿಲ್ಲ ಅವರಿಗೆ?
    tr: Yāke hēḷlilla avarige?
    en: Why haven't you told them?
  - who: deepa
    t: ಅಪ್ಪನಿಗೆ ಕಳೆದ ವರ್ಷ ಬೈಪಾಸ್ ಸರ್ಜರಿ ಆಯ್ತು. ಅಮ್ಮ ಪ್ರತಿ ಹಬ್ಬಕ್ಕೂ ‘ಮೊಮ್ಮಗು ಯಾವಾಗ’ ಅಂತ ಕೇಳ್ತಾರೆ. ‘ನಮ್ಮ ಮನೆತನದಲ್ಲಿ ಯಾರೂ ಡಿವೋರ್ಸ್ ಆಗಿಲ್ಲ’ ಅನ್ನೋ ಮಾತು ಕೇಳೋಕೆ ನನಗೆ ಶಕ್ತಿ ಇಲ್ಲ. ಇನ್ನೂ ಇಲ್ಲ.
    tr: Appanige kaḷeda varṣa baipās sarjari āytu. Amma prati habbakkū ‘mommagu yāvāga’ anta kēḷtāre. ‘Namma manetanadalli yārū ḍivōrs āgilla’ annō mātu kēḷōke nanage śakti illa. Innū illa.
    en: Appa had bypass surgery last year. Amma asks at every festival, ‘When's the grandchild?’ I don't have the strength to hear the words ‘Nobody in our family has ever divorced.’ Not yet.
  - section: Kaveri explains, carefully
    learn: 'the law in plain words: Hindū vivāha kāyde, ondu varṣa bērebēre, modala mōṣan, āru tiṅgaḷu kāyuvike, eraḍanē mōṣan · hedging like a lawyer: sāmān''yavāgi, prati kēs bēre, khachitavāgi hēḷalla, pēpars nōḍade · waiver: suprīṁ kōrṭ, 2017, kelavu sandarbhagaḷalli manna māḍbahudu · settlement: strīdhana, jīvanāṁśa, ellā arjiyallē'
  - who: deepa
    t: ಕಾವೇರಿ, ನೀನು ಸುಮ್ಮನಿದೀಯ. ನೀನು ವಕೀಲೆ. ನನ್ನ ವಕೀಲರು ಏನೇನೋ ಹೇಳ್ತಾರೆ, ನನಗೆ ಅರ್ಧ ಅರ್ಥ ಆಗಲ್ಲ. ನಿಜವಾಗಲೂ ಎಷ್ಟು ದಿನ ಆಗುತ್ತೆ ಇದು?
    tr: Kāvēri, nīnu summanidīya. Nīnu vakīle. Nanna vakīlaru ēnēnō hēḷtāre, nanage ardha artha āgalla. Nijavāgalū eṣṭu dina āgutte idu?
    en: Kaveri, you're quiet. You're a lawyer. My lawyer says all sorts of things and I understand half of it. Honestly, how long will this take?
  - who: kaveri
    t: ಮೊದಲು ಒಂದು ಮಾತು. ಇಲ್ಲಿ ನಾನು ನಿನ್ನ ಗೆಳತಿ, ನಿನ್ನ ವಕೀಲೆ ಅಲ್ಲ. ನಿನ್ನ ಪೇಪರ್ಸ್ ನೋಡದೆ ಯಾವುದನ್ನೂ ಖಚಿತವಾಗಿ ಹೇಳಲ್ಲ. ಸಾಮಾನ್ಯವಾಗಿ ಏನು ನಡೆಯುತ್ತೆ ಅಂತ ಸರಳವಾಗಿ ಹೇಳ್ತೀನಿ. ಸರಿನಾ?
    tr: Modalu ondu mātu. Illi nānu ninna geḷati, ninna vakīle alla. Ninna pēpars nōḍade yāvudannū khachitavāgi hēḷalla. Sāmān'yavāgi ēnu naḍeyutte anta saraḷavāgi hēḷtīni. Sarinā?
    en: First, one thing. Here I'm your friend, not your lawyer. Without seeing your papers I won't say anything for certain. I'll tell you simply what generally happens. All right?
  - who: deepa
    t: ಸರಿ. ಅಷ್ಟೇ ಬೇಕು.
    tr: Sari. Aṣṭē bēku.
    en: All right. That's all I need.
  - who: kaveri
    t: ಹಿಂದೂ ವಿವಾಹ ಕಾಯ್ದೆಯ ಹದಿಮೂರು-ಬಿ ಸೆಕ್ಷನ್. ಗಂಡ-ಹೆಂಡತಿ ಕನಿಷ್ಠ ಒಂದು ವರ್ಷ ಬೇರೆಬೇರೆ ಇದ್ದಿರಬೇಕು. ಆಮೇಲೆ ಇಬ್ರೂ ಸೇರಿ ಜಂಟಿ ಅರ್ಜಿ ಹಾಕ್ತೀರಿ. ಅದು ಮೊದಲ ಮೋಷನ್. ನೀವು ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಮಾಡಿದ್ದು ಅದೇ.
    tr: Hindū vivāha kāydeya hadimūru-bi sekṣan. Gaṇḍa-heṇḍati kaniṣṭha ondu varṣa bērebēre iddirabēku. Āmēle ibrū sēri jaṇṭi arji hāktīri. Adu modala mōṣan. Nīvu akṭōbar-nalli māḍiddu adē.
    en: Section 13B of the Hindu Marriage Act. The husband and wife must have lived separately for at least one year. Then the two of you file a joint petition together. That's the first motion. That's what you did in October.
  - who: kaveri
    t: ಅದಾದ ಮೇಲೆ ಕಾನೂನು ಆರು ತಿಂಗಳು ಕಾಯಿರಿ ಅನ್ನುತ್ತೆ. ಅದನ್ನ ‘ಕೂಲಿಂಗ್ ಪೀರಿಯಡ್’ ಅಂತಾರೆ. ಮನಸ್ಸು ಬದಲಾಗುತ್ತಾ ನೋಡೋಕೆ. ಆಮೇಲೆ ಎರಡನೇ ಮೋಷನ್. ಇಬ್ರೂ ಮತ್ತೆ ಕೋರ್ಟ್‌ಗೆ ಬಂದು ‘ಹೌದು, ನಮ್ಮ ನಿರ್ಧಾರ ಬದಲಾಗಿಲ್ಲ’ ಅಂತ ಹೇಳ್ತೀರಿ. ಆಮೇಲೆ ಡಿಕ್ರಿ.
    tr: Adāda mēle kānūnu āru tiṅgaḷu kāyiri annutte. Adanna ‘kūliṅg pīriyaḍ’ antāre. Manassu badalāguttā nōḍōke. Āmēle eraḍanē mōṣan. Ibrū matte kōrṭ-ge bandu ‘haudu, namma nirdhāra badalāgilla’ anta hēḷtīri. Āmēle ḍikri.
    en: After that, the law says wait six months. They call it the ‘cooling period’. To see if your minds change. Then the second motion. You both come back to court and say, ‘Yes, our decision hasn't changed.’ Then the decree.
  - who: deepa
    t: ಅಂದ್ರೆ ಏಪ್ರಿಲ್‌ವರೆಗೆ ಹೀಗೇ ಕಾಯ್ಬೇಕಾ? ಆರು ತಿಂಗಳು ಮತ್ತೆ ಮತ್ತೆ ಇದನ್ನೇ ಯೋಚಿಸ್ತಾ?
    tr: Andre Ēpril-varege hīgē kāybēkā? Āru tiṅgaḷu matte matte idannē yōchistā?
    en: So I have to wait like this till April? Six months of thinking about this over and over?
  - who: kaveri
    t: ಯಾವಾಗ್ಲೂ ಅಲ್ಲ. ಎರಡು ಸಾವಿರದ ಹದಿನೇಳರಲ್ಲಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಒಂದು ತೀರ್ಪಲ್ಲಿ ಹೇಳಿದೆ, ಈ ಆರು ತಿಂಗಳು ಕಡ್ಡಾಯ ಅಲ್ಲ, ಕೆಲವು ಸಂದರ್ಭಗಳಲ್ಲಿ ಕೋರ್ಟ್ ಅದನ್ನ ಮನ್ನಾ ಮಾಡಬಹುದು ಅಂತ.
    tr: Yāvāglū alla. Eraḍu sāvirada hadinēḷaralli Suprīṁ Kōrṭ ondu tīrpalli hēḷide, ī āru tiṅgaḷu kaḍḍāya alla, kelavu sandarbhagaḷalli kōrṭ adanna mannā māḍabahudu anta.
    en: Not always. In 2017 the Supreme Court said in a judgment that these six months aren't mandatory — that in some situations the court may waive them.
  - who: kaveri
    t: ಆದ್ರೆ ಷರತ್ತುಗಳಿವೆ. ಸಾಮಾನ್ಯವಾಗಿ ಒಟ್ಟು ಒಂದೂವರೆ ವರ್ಷಕ್ಕಿಂತ ಜಾಸ್ತಿ ಬೇರೆ ಇದ್ದಿರಬೇಕು, ರಾಜಿ ಪ್ರಯತ್ನ ವಿಫಲ ಆಗಿರಬೇಕು, ಜೀವನಾಂಶ, ಸ್ತ್ರೀಧನ, ಆಸ್ತಿ ಎಲ್ಲಾ ಇತ್ಯರ್ಥ ಆಗಿರಬೇಕು. ಕೇಳಿದ ತಕ್ಷಣ ಸಿಗಲ್ಲ. ಅದು ಕೋರ್ಟ್‌ನ ವಿವೇಚನೆ. ಪ್ರತಿ ಕೇಸ್ ಬೇರೆ.
    tr: Ādre ṣarattugaḷive. Sāmān'yavāgi oṭṭu ondūvare varṣakkinta jāsti bēre iddirabēku, rāji prayatna viphala āgirabēku, jīvanāṁśa, strīdhana, āsti ellā ityartha āgirabēku. Kēḷida takṣaṇa sigalla. Adu kōrṭ-na vivēchane. Prati kēs bēre.
    en: But there are conditions. Usually you must have lived apart for more than a year and a half in all, attempts at reconciliation must have failed, and maintenance, stridhan and property must all be settled. You don't get it just for asking. It's the court's discretion. Every case is different.
  - who: deepa
    t: ಸೆಪ್ಟೆಂಬರ್‌ನಿಂದ ಲೆಕ್ಕ ಹಾಕಿದ್ರೆ ಮಾರ್ಚ್‌ಗೆ ಒಂದೂವರೆ ವರ್ಷ. ಎಲ್ಲಾ ಮಾತಾಡ್ಕೊಂಡಿದೀವಿ. ನಾನು ಜೀವನಾಂಶ ಏನೂ ಕೇಳಿಲ್ಲ. ನನ್ನ ಒಡವೆ ನನಗೆ. ಫ್ಲ್ಯಾಟ್ ಮಾರಿ ಅರ್ಧ ಅರ್ಧ. ಮಕ್ಕಳಿಲ್ಲ, ಅದಕ್ಕೆ ಕಸ್ಟಡಿ ಪ್ರಶ್ನೆನೇ ಇಲ್ಲ.
    tr: Sepṭembar-ninda lekka hākidre Mārch-ge ondūvare varṣa. Ellā mātāḍkoṇḍidīvi. Nānu jīvanāṁśa ēnū kēḷilla. Nanna oḍave nanage. Phlyāṭ māri ardha ardha. Makkaḷilla, adakke kasṭaḍi praśnenē illa.
    en: Counting from September, it'll be a year and a half by March. We've talked everything through. I haven't asked for any maintenance. My jewellery comes to me. We sell the flat and split it half and half. There are no children, so there's no question of custody.
  - who: kaveri
    t: ಹಾಗಾದ್ರೆ ನಿನ್ನ ವಕೀಲರ ಜೊತೆ ಮನ್ನಾ ಅರ್ಜಿ ಬಗ್ಗೆ ಮಾತಾಡು. ಆಗಬಹುದು, ಆಗದೆನೂ ಇರಬಹುದು. ಒಂದು ವಿಷಯ ಮಾತ್ರ ಖಚಿತವಾಗಿ ಹೇಳ್ತೀನಿ, ಈ ಒಪ್ಪಂದ ಎಲ್ಲಾ ಬರಹದಲ್ಲಿ ಇರಲಿ. ಬಾಯಿಮಾತು ಬೇಡ. ಎಷ್ಟೇ ಒಳ್ಳೆಯವನಾದ್ರೂ.
    tr: Hāgādre ninna vakīlara jote mannā arji bagge mātāḍu. Āgabahudu, āgadenū irabahudu. Ondu viṣaya mātra khachitavāgi hēḷtīni, ī oppanda ellā barahadalli irali. Bāyimātu bēḍa. Eṣṭē oḷḷeyavanādrū.
    en: 'Then talk to your lawyer about a waiver application. It may work, it may not. One thing I''ll say for certain: put this whole agreement in writing. No verbal promises. However good a man he is.'
  - who: deepa
    t: ಥ್ಯಾಂಕ್ಸ್ ಕಾವೇರಿ. ನನ್ನ ವಕೀಲರು ಒಂದು ಗಂಟೆ ಮಾತಾಡಿದ್ರು. ನೀನು ಐದು ನಿಮಿಷದಲ್ಲಿ ಅರ್ಥ ಮಾಡಿಸಿದೆ.
    tr: Thyāṅks Kāvēri. Nanna vakīlaru ondu gaṇṭe mātāḍidru. Nīnu aidu nimiṣadalli artha māḍiside.
    en: Thanks, Kaveri. My lawyer talked for an hour. You made me understand in five minutes.
  - who: kaveri
    t: ಅವರು ಫೀಸ್ ತಗೋತಾರೆ, ಅದಕ್ಕೆ ಒಂದು ಗಂಟೆ. ನಾನು ಉಚಿತ, ಅದಕ್ಕೆ ಐದು ನಿಮಿಷ.
    tr: Avaru phīs tagōtāre, adakke ondu gaṇṭe. Nānu uchita, adakke aidu nimiṣa.
    en: He charges a fee, hence an hour. I'm free, hence five minutes.
  - scene: Deepa laughs, wet-eyed. Shruti still has her hand.
  - section: Between the three of us
    learn: 'asking for secrecy: yārigū hēḷbēḍi, namma mūrara madhye irli · promising: mātu koḍtīni, āṇe · the right time: sariyāda samaya bandāga nānē hēḷtīni · gratitude: hagura āytu'
  - who: deepa
    t: ಒಂದು ಕೇಳ್ತೀನಿ. ಇದು ನಮ್ಮ ಮೂರರ ಮಧ್ಯೆನೇ ಇರಲಿ. ಹುಡುಗರಿಗೆ ಬೇಡ. ರಮ್ಯಾಗಂತೂ ಬೇಡ, ಅವಳು ಪ್ರೀತಿಯಿಂದಲೇ ಕ್ಯಾಮೆರಾ ಮುಂದೆ ಕೇಳಿಬಿಡ್ತಾಳೆ. ಸರಿಯಾದ ಸಮಯ ಬಂದಾಗ ನಾನೇ ಹೇಳ್ತೀನಿ.
    tr: Ondu kēḷtīni. Idu namma mūrara madhyenē irali. Huḍugarige bēḍa. Ramyāgantū bēḍa, avaḷu prītiyindalē kyāmerā munde kēḷibiḍtāḷe. Sariyāda samaya bandāga nānē hēḷtīni.
    en: I'm asking one thing. Let this stay between the three of us. Not the boys. And definitely not Ramya — she'd ask me in front of the camera, out of pure love. When the right time comes, I'll tell them myself.
  - who: shruti
    t: ಮಾತು ಕೊಡ್ತೀನಿ. ಯಾರಿಗೂ ಹೇಳಲ್ಲ.
    tr: Mātu koḍtīni. Yārigū hēḷalla.
    en: I give you my word. I won't tell anyone.
  - who: kaveri
    t: ವಕೀಲೆ ಮತ್ತೆ ಗೆಳತಿ, ಎರಡೂ ಆಗಿ ಮಾತು ಕೊಡ್ತೀನಿ. ಗೌಪ್ಯತೆ ನನ್ನ ವೃತ್ತಿ.
    tr: Vakīle matte geḷati, eraḍū āgi mātu koḍtīni. Gaupyate nanna vr̥tti.
    en: As a lawyer and as a friend, both, I give you my word. Confidentiality is my profession.
  - who: deepa
    t: ಹದಿನೈದು ತಿಂಗಳಿಂದ ಇದನ್ನ ಎದೆಯ ಮೇಲೆ ಕಲ್ಲಿನ ತರ ಹೊತ್ತಿದ್ದೆ. ಈಗ ಸ್ವಲ್ಪ ಹಗುರ ಆಯ್ತು. ಈ ಟ್ರಿಪ್‌ಗೆ ಬರದೇ ಇದ್ದಿದ್ರೆ…
    tr: Hadinaidu tiṅgaḷinda idanna edeya mēle kallina tara hottidde. Īga svalpa hagura āytu. Ī ṭrip-ge baradē iddidre…
    en: For fifteen months I've carried this like a stone on my chest. Now it's a little lighter. If I hadn't come on this trip…
  - who: shruti
    t: ಬಂದ್ಯಲ್ಲಾ. ಅಷ್ಟೇ ಮುಖ್ಯ.
    tr: Bandyallā. Aṣṭē mukhya.
    en: But you came. That's all that matters.
  - who: kaveri
    t: ಒಂದು ಪ್ರಾಕ್ಟಿಕಲ್ ವಿಷಯ. ಈ ಆರು ದಿನದಲ್ಲಿ ಕೋರ್ಟ್ ಕೆಲಸ ಏನಾದ್ರೂ ಇದ್ಯಾ? ನಿನ್ನ ಲಾಯರ್ ಫೋನ್ ಮಾಡಿದ್ರೆ?
    tr: Ondu prākṭikal viṣaya. Ī āru dinadalli kōrṭ kelasa ēnādrū idyā? Ninna lāyar phōn māḍidre?
    en: One practical thing. Is there any court work in these six days? What if your lawyer calls?
  - who: deepa
    t: ಮುಂದಿನ ಡೇಟ್ ಜನವರಿಯಲ್ಲಿ. ಸದ್ಯಕ್ಕೆ ಸೈನ್ ಮಾಡಬೇಕಾದ ಪೇಪರ್ ಎಲ್ಲಾ ಆಗಿದೆ. ಈ ಆರು ದಿನ ನಾನು ಯಾರ ಹೆಂಡತಿನೂ ಅಲ್ಲ, ಯಾರ ಕೇಸೂ ಅಲ್ಲ. ಬರೀ ದೀಪಾ.
    tr: Mundina ḍēṭ janavariyalli. Sadyakke sain māḍabēkāda pēpar ellā āgide. Ī āru dina nānu yāra heṇḍatinū alla, yāra kēsū alla. Barī Dīpā.
    en: The next date is in January. All the papers that needed signing for now are done. For these six days I'm nobody's wife and nobody's case. Just Deepa.
  - who: shruti
    t: ಬರೀ ದೀಪಾ. ಅದೇ ಸಾಕು. ಸರಿ, ಈಗ ಒಂದು ಹಾಡು ಹಾಕೋಣ. ಕಾವೇರಿ, ನಿನ್ ಫೋನ್‌ನಲ್ಲಿ ಏನಿದೆ?
    tr: Barī Dīpā. Adē sāku. Sari, īga ondu hāḍu hākōṇa. Kāvēri, nin phōn-nalli ēnide?
    en: Just Deepa. That's enough. Right, let's put a song on. Kaveri, what's on your phone?
  - who: kaveri
    t: ಕೊಡವ ವಾಲಗ, ಇಲ್ಲಾಂದ್ರೆ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ತೀರ್ಪುಗಳ ಬಗ್ಗೆ ಒಂದು ಪಾಡ್‌ಕಾಸ್ಟ್. ಆರಿಸಿಕೊಳ್ಳಿ.
    tr: Koḍava vālaga, illāndre Suprīṁ Kōrṭ tīrpugaḷa bagge ondu pāḍ-kāsṭ. Ārisikoḷḷi.
    en: Kodava valaga music, or a podcast about Supreme Court judgments. Take your pick.
  - who: deepa
    t: ವಾಲಗ! ಪ್ಲೀಸ್, ವಾಲಗನೇ.
    tr: Vālaga! Plīs, vālaganē.
    en: Valaga! Please — the valaga.
  - scene: 'Meanwhile, a kilometre ahead in Arjun''s car: Naveen asleep again in the back row, Prakash with his earphones in, eyes closed. Imran and Ramya talk in low voices. Arjun''s phone lights up on its dashboard mount. A message. He reads it at a red signal and turns the screen off.'
  - who: ramya
    t: ಯಾರದ್ದು ಮರ್ರೆ, ರಾತ್ರಿ ಎಂಟು ಗಂಟೆಗೆ? ಆಫೀಸಾ?
    tr: Yāraddu marre, rātri eṇṭu gaṇṭege? Āphīsā?
    en: Who's that, man, at eight at night? The office?
  - who: arjun
    t: ಹೂಂ. ಒಬ್ಬ ಇನ್ವೆಸ್ಟರ್. ಏನಿಲ್ಲ. ಸೋಮವಾರ ನೋಡ್ಕೊಳ್ತೀನಿ.
    tr: Hūṁ. Obba invesṭar. Ēnilla. Sōmavāra nōḍkoḷtīni.
    en: Mm. An investor. It's nothing. I'll deal with it on Monday.
  - who: imran
    t: ನಿನ್ ಮುಖ ನೋಡಿದ್ರ ‘ಏನಿಲ್ಲ’ ಅನ್ನಿಸೂದಿಲ್ಲ ಯಪ್ಪಾ. ಬಿಪಿ ಚೆಕ್ ಮಾಡ್ಲೇನು?
    tr: Nin mukha nōḍidra ‘ēnilla’ annisūdilla yappā. Bi-pi chek māḍlēnu?
    en: Looking at your face, it doesn't seem like ‘nothing’, yappa. Shall I check your BP?
  - who: arjun
    t: ಡಾಕ್ಟ್ರೇ, ನಿಮ್ ಸ್ಟೆತಸ್ಕೋಪ್ ಬ್ಯಾಗ್‌ನಲ್ಲೇ ಇರಲಿ. ಕಮಲಾಪುರ ಬಂತು. ಎಲ್ರನ್ನೂ ಎಬ್ಬಿಸಿ.
    tr: Ḍākṭrē, nim sṭetaskōp byāg-nallē irali. Kamalāpura bantu. Ellrannū ebbisi.
    en: Doctor, keep your stethoscope in your bag. Here's Kamalapur. Wake everyone up.
  - scene: Prakash takes out one earphone. He has heard everything.
  - who: prakash
    t: ಡಾಕ್ಟ್ರೇ, ಬಿಪಿ ಚೆಕ್ ಮಾಡೋದಾದ್ರ ಎಲ್ಲಾರಿಗೂ ಮಾಡು. ಇವತ್ತು ಎಲ್ಲಾರದೂ ಸ್ವಲ್ಪ ಜಾಸ್ತಿನೇ ಐತಿ.
    tr: Ḍākṭrē, bi-pi chek māḍōdādra ellārigū māḍu. Ivattu ellāradū svalpa jāstinē aiti.
    en: Doctor, if you're checking BP, check everyone's. Today everyone's is a little high.
  - who: ramya
    t: ಪ್ರಕಾಶ್, ಮಧ್ಯಾಹ್ನದ ವಿಷಯ… ನೀನು ಇನ್ನೂ ಬೇಜಾರಲ್ಲಿ ಇದೀಯಾ?
    tr: Prakāś, madhyāhnada viṣaya… nīnu innū bējāralli idīyā?
    en: Prakash, about this afternoon… are you still upset?
  - who: prakash
    t: ಬೇಜಾರು ಅಲ್ಲ, ರಮ್ಯಾ. ಒಂದು ಹಳೇ ಗಾಯ ತೆರೆದಂಗ ಆತು ಅಷ್ಟೇ. ಗಾಯ ಒಂದು ದಿನದಾಗ ಒಣಗಂಗಿಲ್ಲ. ಡಾಕ್ಟರ್‌ಗೆ ಕೇಳು.
    tr: Bējāru alla, Ramyā. Ondu haḷē gāya teredaṅga ātu aṣṭē. Gāya ondu dinadāga oṇagaṅgilla. Ḍākṭar-ge kēḷu.
    en: It's not being upset, Ramya. It's as if an old wound opened, that's all. A wound doesn't heal in one day. Ask the doctor.
  - who: imran
    t: ಖರೇ. ಮೊದಲು ಸ್ವಚ್ಛ ಮಾಡಬೇಕು, ಆಮೇಲೆ ಸಮಯ ಕೊಡಬೇಕು. ಡ್ರೆಸ್ಸಿಂಗ್ ಮಾಡೋರು ಮಾತ್ರ ಸರಿಯಾದವರಾಗಿರಬೇಕು.
    tr: Kharē. Modalu svachchha māḍabēku, āmēle samaya koḍabēku. Ḍressiṅg māḍōru mātra sariyādavarāgirabēku.
    en: True. First you have to clean it, then give it time. Only the person who dresses it has to be the right one.
  - scene: Arjun's eyes go to the rear-view mirror, to Prakash, and back to the road. From the back row, Naveen, who is not quite asleep, says nothing.
  - who: ramya
    t: ನವೀನ್, ನೀನು ನಿದ್ದೆ ಮಾಡ್ತಿಲ್ಲ ಅಂತ ಗೊತ್ತು. ಕಣ್ಣು ಮುಚ್ಕೊಂಡು ಎಲ್ಲಾ ಕೇಳ್ತಿದೀಯಾ ಅಲ್ವಾ?
    tr: Navīn, nīnu nidde māḍtilla anta gottu. Kaṇṇu muchkoṇḍu ellā kēḷtidīyā alvā?
    en: Naveen, I know you're not asleep. You're listening to everything with your eyes shut, aren't you?
  - who: naveen
    t: ಕೇಳ್ತಾ ಉಂಟು. ಹೋಟೆಲ್ ಕೌಂಟರ್‌ನಲ್ಲಿ ಕೂತು ಕೂತು ಅಭ್ಯಾಸ. ಕಣ್ಣು ಮುಚ್ಚಿದ್ರೂ ಕಿವಿ ತೆರೆದೇ ಇರ್ತದೆ.
    tr: Kēḷtā uṇṭu. Hōṭel kauṇṭar-nalli kūtu kūtu abhyāsa. Kaṇṇu mucchidrū kivi teredē irtade.
    en: I'm listening. A habit from years of sitting at the hotel counter. Even with my eyes shut, my ears stay open.
  - who: arjun
    t: ಹಾಗಾದ್ರೆ ಕಿವಿಗೂ ಸ್ವಲ್ಪ ರೆಸ್ಟ್ ಕೊಡು ಮಗಾ. ನಾಳೆ ಬೇಗ ಏಳ್ಬೇಕು.
    tr: Hāgādre kivigū svalpa resṭ koḍu magā. Nāḷe bēga ēḷbēku.
    en: Then give your ears a rest too, maga. We have to be up early tomorrow.
  - who: naveen
    t: ನಾನು ಬೇಗ ಏಳ್ತೇನೆ. ನೀನು ನಿನ್ನ ಮೆಸೇಜುಗಳಿಗೆ ಬೇಗ ಉತ್ತರ ಕೊಡು. ಕೆಲವರು ಕಾಯ್ತಾ ಇರ್ತಾರೆ, ಗೊತ್ತುಂಟಲ್ವಾ.
    tr: Nānu bēga ēḷtēne. Nīnu ninna mesējugaḷige bēga uttara koḍu. Kelavaru kāytā irtāre, gottuṇṭalvā.
    en: I'll be up early. You answer your messages early. Some people are kept waiting — you know that, don't you.
  - scene: Arjun's hands tighten on the wheel. Ramya looks from one to the other and, for once, does not ask.
  - scene: 9:10 p.m. A homestay at the edge of Kamalapur, under a dark hill of boulders. The two cars pull in a minute apart. Stars, cold air, the smell of woodsmoke. Shruti gets out with her arm around Deepa; Kaveri carries Deepa's bag. Nobody in the other car notices anything.
  - chapter: Chapter 5 — Hampi
  - section: Morning call from Dharwad
    learn: 'an elder on the phone: ēnappā, ellārū āramāgiddāra?, ūṭa āyta? · Dharwad hospitality: eṇṭu manshyāra aḍigi, khāra kaḍimi, pēḍa tandiṭṭēni · a son''s patience: haudavva, ātavva, chintī māḍbyāḍa'
  - scene: Saturday, 5 December 2026, 7:15 a.m. The homestay veranda in Kamalapur. Mist sits on the boulder hills. The owner's boy brings idli-vada and tea in steel tumblers. Prakash's phone rings; he puts it on speaker so everyone can greet his mother.
  - who: amma
    t: ಏನಪ್ಪಾ ಪ್ರಕಾಶಾ, ಎದ್ದೀಯೇನು? ಎಲ್ಲಾರೂ ಆರಾಮದಾರ? ಚಳಿ ಭಾಳ ಐತೇನು ಅಲ್ಲಿ?
    tr: Ēnappā Prakāśā, eddīyēnu? Ellārū ārāmadāra? Chaḷi bhāḷa aitēnu alli?
    en: Well, Prakasha, are you up? Is everyone well? Is it very cold there?
  - who: prakash
    t: ಹೌದವ್ವ, ಎಲ್ಲಾರೂ ಆರಾಮ ಅದೇವಿ. ನೋಡು, ಎಲ್ಲಾರೂ ಇಲ್ಲೇ ಕುಂತಾರ, ಸ್ಪೀಕರ್ ಹಾಕೇನಿ. ನಿನಗ ನಮಸ್ಕಾರ ಹೇಳತಾರ.
    tr: Haudavva, ellārū ārāma adēvi. Nōḍu, ellārū illē kuntāra, spīkar hākēni. Ninaga namaskāra hēḷatāra.
    en: Yes, Avva, we're all well. Look, everyone's sitting right here; I've put you on speaker. They're saying namaskara to you.
  - who: deepa
    t: ನಮಸ್ಕಾರ ಅಮ್ಮ! ನಾನು ದೀಪಾ, ಮೈಸೂರು. ನಾಳೆ ನಿಮ್ಮ ಮನೆಗೆ ಬರ್ತಿದೀವಿ. ತುಂಬಾ ತೊಂದರೆ ಕೊಡ್ತಿದೀವಿ, ಕ್ಷಮಿಸಿ.
    tr: Namaskāra amma! Nānu Dīpā, Maisūru. Nāḷe nimma manege bartidīvi. Tumbā tondare koḍtidīvi, kṣamisi.
    en: Namaskara, Amma! I'm Deepa, from Mysuru. We're coming to your house tomorrow. We're giving you so much trouble — please forgive us.
  - who: amma
    t: ತೊಂದರೆ ಏನವ್ವ? ಮನಿಗೆ ಮಕ್ಕಳು ಬರೋದು ತೊಂದರೆನಾ? ಎಂಟು ಮಂದಿಗೆ ರೊಟ್ಟಿ ಹಿಟ್ಟು ಕಲಸಿ ಇಟ್ಟೇನಿ. ಯಾರಿಗೆ ಖಾರ ಕಡಿಮಿ ಬೇಕು, ಈಗಲೇ ಹೇಳರಿ.
    tr: Tondare ēnavva? Manige makkaḷu barōdu tondarenā? Eṇṭu mandige roṭṭi hiṭṭu kalasi iṭṭēni. Yārige khāra kaḍimi bēku, īgalē hēḷari.
    en: What trouble, child? Is it trouble when children come home? I've already got the rotti flour ready for eight. Whoever wants it less spicy, tell me now.
  - who: arjun
    t: ನಮಸ್ಕಾರ ಅಮ್ಮ, ನಾನು ಅರ್ಜುನ್. ಬೆಂಗಳೂರು. ನನಗೆ ಖಾರ ಸ್ವಲ್ಪ ಕಡಿಮೆ, ಪ್ಲೀಸ್.
    tr: Namaskāra amma, nānu Arjun. Beṅgaḷūru. Nanage khāra svalpa kaḍime, plīs.
    en: Namaskara, Amma, I'm Arjun. From Bengaluru. A little less spicy for me, please.
  - who: amma
    t: ಆತಪ್ಪ. ಬೆಂಗಳೂರಿನವರಿಗೆ ಖಾರ ಕಡಿಮಿ, ಗೊತ್ತೈತಿ. ಪ್ರಕಾಶ ನಿನ್ನ ಬಗ್ಗೆ ಭಾಳ ಹೇಳತಿದ್ದ, ಕಾಲೇಜಿನ್ಯಾಗ. ಬರ್ರಿ, ಎಲ್ಲಾರೂ ಬರ್ರಿ. ಪೇಡ ತಂದಿಟ್ಟೇನಿ.
    tr: Ātappa. Beṅgaḷūrinavarige khāra kaḍimi, gottaiti. Prakāśa ninna bagge bhāḷa hēḷatidda, kālējinyāga. Barri, ellārū barri. Pēḍa tandiṭṭēni.
    en: All right, son. Less spice for the Bengaluru folk, I know. Prakash used to talk about you a lot, in his college days. Come, all of you, come. I've brought the peda already.
  - scene: Arjun glances at Prakash. Prakash is looking at the phone, not at him.
  - who: prakash
    t: ಆತವ್ವ, ಇಡತೇನಿ. ಚಿಂತಿ ಮಾಡಬ್ಯಾಡ. ನಾಳೆ ಮಧ್ಯಾಹ್ನದೊಳಗ ಬರತೇವಿ.
    tr: Ātavva, iḍatēni. Chinti māḍabyāḍa. Nāḷe madhyāhnadoḷaga baratēvi.
    en: All right, Avva, I'll hang up. Don't worry. We'll be there by tomorrow afternoon.
  - who: arjun
    t: ನವೀನ್, ಇವತ್ತಿನ ಹೋಮ್‌ಸ್ಟೇ ಅಡ್ವಾನ್ಸ್ ನಾನು ಕೊಟ್ಟಿದೀನಿ, ಆ್ಯಪ್‌ನಲ್ಲಿ ಹಾಕಿದೀನಿ. ಇವತ್ತು ನನ್ ಕಾರಲ್ಲಿ ಬಾ, ಸ್ವಲ್ಪ ಮಾತಾಡೋಣ.
    tr: Navīn, ivattina hōmsṭē aḍvāns nānu koṭṭidīni, āyp-nalli hākidīni. Ivattu nan kāralli bā, svalpa mātāḍōṇa.
    en: Naveen, I've paid today's homestay advance and put it in the app. Come in my car today; let's talk a bit.
  - who: naveen
    t: ಆ್ಯಪ್‌ನಲ್ಲಿ ನೋಡಿದೆ. ನನ್ನ ಪಾಲು ಕ್ಯಾಶ್‌ನಲ್ಲಿ ಕೊಡ್ತೇನೆ. ಇವತ್ತು ಕಾರ್ ಬೇಡ, ಎಲ್ಲಾ ಹತ್ರವೇ ಉಂಟು. ಮಾತು… ಆಮೇಲೆ.
    tr: Āyp-nalli nōḍide. Nanna pālu kyāś-nalli koḍtēne. Ivattu kār bēḍa, ellā hatravē uṇṭu. Mātu… āmēle.
    en: I saw it in the app. I'll give you my share in cash. No car needed today, everything's close by. The talk… later.
  - scene: Naveen gets up and goes to wash his tumbler. Kaveri and Imran exchange a look across the table.
  - section: The guide at Virupaksha
    learn: 'formal heritage register: ivattu nāvu nōḍuttiruvudu…, endu hēḷalāguttade, nirmisalāyitu, saṁrakṣisalāgide · history words: sāmrājya, rājadhāni, dore, gōpura, maṇṭapa, sthāpane, patana · respectful requests: dayaviṭṭu, muṭṭabēḍi, chappali horage biḍi · numbers as years: sāvirada munnūra mūvattāru'
  - scene: 8:30 a.m. In front of the tall eastern gopura of the Virupaksha temple in Hampi. A licensed guide in a white shirt with an identity card on a lanyard greets them. Pilgrims, a temple bell, the smell of camphor.
  - who: guide
    t: ನಮಸ್ಕಾರ. ನನ್ನ ಹೆಸರು ಬಸವರಾಜ. ನಾನು ಪ್ರವಾಸೋದ್ಯಮ ಇಲಾಖೆಯ ಪರವಾನಗಿ ಪಡೆದ ಮಾರ್ಗದರ್ಶಿ. ಇದು ನನ್ನ ಗುರುತಿನ ಚೀಟಿ. ಶುಲ್ಕ ಸರ್ಕಾರ ನಿಗದಿಪಡಿಸಿದ ದರದಂತೆ. ಮೊದಲು ಹಣ ಕೊಡಬೇಕಾಗಿಲ್ಲ, ಪ್ರವಾಸ ಮುಗಿದ ಮೇಲೆ ಕೊಡಿ.
    tr: Namaskāra. Nanna hesaru Basavarāja. Nānu pravāsōdyama ilākheya paravānagi paḍeda mārgadarśi. Idu nanna gurutina chīṭi. Śulka sarkāra nigadipaḍisida daradante. Modalu haṇa koḍabēkāgilla, pravāsa mugida mēle koḍi.
    en: Namaskara. My name is Basavaraja. I am a guide licensed by the Tourism Department. This is my identity card. The fee is as per the government-fixed rate. You need not pay in advance; pay when the tour is over.
  - who: kaveri
    t: ಧನ್ಯವಾದ ಸಾರ್. ನೀವು ಕಾರ್ಡ್ ತೋರಿಸಿದ್ದು ಒಳ್ಳೆಯದಾಯ್ತು.
    tr: Dhanyavāda sār. Nīvu kārḍ tōrisiddu oḷḷeyadāytu.
    en: Thank you, sir. It's good that you showed us your card.
  - who: guide
    t: ನೀವು ಈಗ ನಿಂತಿರುವುದು ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯದ ಮುಂದೆ. ಇದು ಹಂಪಿಯ ಜೀವಂತ ದೇವಾಲಯ. ಇಲ್ಲಿನ ಬಹುತೇಕ ಸ್ಮಾರಕಗಳು ಪಾಳುಬಿದ್ದಿವೆ, ಆದರೆ ಇಲ್ಲಿ ಪೂಜೆ ಎಂದೂ ನಿಂತಿಲ್ಲ. ಏಳನೇ ಶತಮಾನದಿಂದಲೇ ಇಲ್ಲಿ ಪೂಜೆ ನಡೆಯುತ್ತಿತ್ತು ಎಂದು ಹೇಳಲಾಗುತ್ತದೆ.
    tr: Nīvu īga nintiruvudu Virūpākṣa dēvālayada munde. Idu Hampiya jīvanta dēvālaya. Illina bahutēka smārakagaḷu pāḷubiddive, ādare illi pūje endū nintilla. Ēḷanē śatamānadindalē illi pūje naḍeyuttittu endu hēḷalāguttade.
    en: You are now standing in front of the Virupaksha temple. This is Hampi's living temple. Most of the monuments here lie in ruins, but worship here has never stopped. It is said that worship was going on here as early as the seventh century.
  - who: ramya
    t: ಸಾರ್, ಒಂದು ನಿಮಿಷ. ನಾನು ರೆಕಾರ್ಡ್ ಮಾಡ್ಬೋದಾ? ಒಂದು ವ್ಲಾಗ್‌ಗೆ.
    tr: Sār, ondu nimiṣa. Nānu rekārḍ māḍbōdā? Ondu vlāg-ge.
    en: Sir, one minute. May I record? It's for a vlog.
  - who: guide
    t: ಹೊರಗೆ ಮಾಡಬಹುದು ಮೇಡಂ. ಗರ್ಭಗುಡಿಯ ಒಳಗೆ ಕ್ಯಾಮೆರಾ ನಿಷೇಧ. ಅಲ್ಲಿ ದಯವಿಟ್ಟು ಫೋನ್ ಒಳಗಿಡಿ.
    tr: Horage māḍabahudu mēḍam. Garbhaguḍiya oḷage kyāmerā niṣēdha. Alli dayaviṭṭu phōn oḷagiḍi.
    en: Outside you may, madam. Cameras are prohibited inside the sanctum. There, kindly put your phone away.
  - who: guide
    t: ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸಾವಿರದ ಮುನ್ನೂರ ಮೂವತ್ತಾರರಲ್ಲಿ ಹರಿಹರ ಮತ್ತು ಬುಕ್ಕ ಎಂಬ ಸಹೋದರರು ಸ್ಥಾಪಿಸಿದರು ಎಂದು ಇತಿಹಾಸ ಹೇಳುತ್ತದೆ. ಸುಮಾರು ಇನ್ನೂರ ಮೂವತ್ತು ವರ್ಷ ಈ ಹಂಪಿ ಅದರ ರಾಜಧಾನಿ. ಆ ಕಾಲದಲ್ಲಿ ಪ್ರಪಂಚದ ಅತಿ ದೊಡ್ಡ ನಗರಗಳಲ್ಲಿ ಇದೂ ಒಂದು.
    tr: Vijayanagara sāmrājyavannu sāvirada munnūra mūvattāraralli Harihara mattu Bukka emba sahōdararu sthāpisidaru endu itihāsa hēḷuttade. Sumāru innūra mūvattu varṣa ī Hampi adara rājadhāni. Ā kāladalli prapañchada ati doḍḍa nagaragaḷalli idū ondu.
    en: History tells us that the Vijayanagara empire was founded in 1336 by two brothers, Harihara and Bukka. For about two hundred and thirty years this Hampi was its capital. In that age it was one of the largest cities in the world.
  - who: imran
    t: ಸಾರ್, ಕೃಷ್ಣದೇವರಾಯರ ಕಾಲ ಇದರ ಸುವರ್ಣಯುಗ ಅಂತಾರಲ್ಲ, ಅದು ಯಾವಾಗ?
    tr: Sār, Kr̥ṣṇadēvarāyara kāla idara suvarṇayuga antāralla, adu yāvāga?
    en: Sir, they say Krishnadevaraya's time was its golden age — when was that?
  - who: guide
    t: ಒಳ್ಳೆಯ ಪ್ರಶ್ನೆ. ಕೃಷ್ಣದೇವರಾಯರು ಸಾವಿರದ ಐನೂರ ಒಂಬತ್ತರಿಂದ ಸುಮಾರು ಇಪ್ಪತ್ತು ವರ್ಷ ಆಳಿದರು. ಈ ದೇವಾಲಯದ ಒಳಗಿನ ರಂಗಮಂಟಪವನ್ನು ಅವರ ಪಟ್ಟಾಭಿಷೇಕದ ಸಂದರ್ಭದಲ್ಲಿ ಕಟ್ಟಿಸಿದರು ಎಂದು ಶಾಸನ ಹೇಳುತ್ತದೆ. ಒಳಗೆ ಹೋದಾಗ ತೋರಿಸುತ್ತೇನೆ.
    tr: Oḷḷeya praśne. Kr̥ṣṇadēvarāyaru sāvirada ainūra ombattarinda sumāru ippattu varṣa āḷidaru. Ī dēvālayada oḷagina raṅgamaṇṭapavannu avara paṭṭābhiṣēkada sandarbhadalli kaṭṭisidaru endu śāsana hēḷuttade. Oḷage hōdāga tōrisuttēne.
    en: A good question. Krishnadevaraya ruled for about twenty years from 1509. An inscription says he had the ranga-mantapa inside this temple built at the time of his coronation. I will show you when we go in.
  - scene: Inside, the guide leads them to a small dark chamber at the back. On the wall, through a narrow opening, an upside-down image of the great gopura appears in soft light.
  - who: guide
    t: ಈಗ ಗೋಡೆಯನ್ನು ನೋಡಿ. ಹೊರಗಿನ ಗೋಪುರದ ಚಿತ್ರ ತಲೆಕೆಳಗಾಗಿ ಕಾಣುತ್ತಿದೆ. ಒಂದು ಸಣ್ಣ ಕಿಂಡಿಯಿಂದ ಬೆಳಕು ಬಂದು ಈ ಚಿತ್ರ ಮೂಡುತ್ತದೆ. ಇದನ್ನು ಪಿನ್‌ಹೋಲ್ ಕ್ಯಾಮೆರಾ ತತ್ವ ಎನ್ನುತ್ತಾರೆ. ನಮ್ಮ ಶಿಲ್ಪಿಗಳಿಗೆ ಇದು ಐನೂರು ವರ್ಷಗಳ ಹಿಂದೆಯೇ ತಿಳಿದಿತ್ತು.
    tr: Īga gōḍeyannu nōḍi. Horagina gōpurada chitra talekeḷagāgi kāṇuttide. Ondu saṇṇa kiṇḍiyinda beḷaku bandu ī chitra mūḍuttade. Idannu pin-hōl kyāmerā tatva ennuttāre. Namma śilpigaḷige idu ainūru varṣagaḷa hindeyē tiḷidittu.
    en: Now look at the wall. The image of the gopura outside appears upside down. Light comes through a small opening and forms this picture. This is called the pinhole-camera principle. Our sculptors knew it five hundred years ago.
  - who: prakash
    t: ನನ್ ಸಾಲೀ ಮಕ್ಕಳಿಗೆ ಭೌತಶಾಸ್ತ್ರದಾಗ ಇದನ್ನ ಪಾಠ ಮಾಡತೇನಿ. ಮುಂದಿನ ವರ್ಷ ಅವರನ್ನ ಇಲ್ಲಿಗೆ ಕರಕೊಂಡು ಬರಬೇಕು. ಪುಸ್ತಕಕ್ಕಿಂತ ಈ ಗೋಡೆ ದೊಡ್ಡ ಮೇಷ್ಟ್ರು.
    tr: Nan sālī makkaḷige bhautaśāstradāga idanna pāṭha māḍatēni. Mundina varṣa avaranna illige karakoṇḍu barabēku. Pustakakkinta ī gōḍe doḍḍa mēṣṭru.
    en: I teach this to my school kids in physics. Next year I must bring them here. This wall is a better teacher than any textbook.
  - section: Ruins, a battle, a collapse
    learn: 'telling the fall: yuddha, sōlu, nagaravannu lūṭi māḍidaru, āru tiṅgaḷu · heritage and care: yunesko viśva paraṁpare tāṇa, kusiyitu, punaśchētana · the guide''s polite warnings: kambagaḷannu muṭṭabēḍi, hattabēḍi · the ₹50 note: aivattu rūpāyi nōṭina mēle'
  - scene: 10:15 a.m. Outside, along the old bazaar street. A long row of stone pavilions, some of them propped with steel supports and fenced off.
  - who: guide
    t: ಇವು ಸಾಲು ಮಂಟಪಗಳು. ಹಿಂದೆ ಇಲ್ಲಿ ವ್ಯಾಪಾರಿಗಳು ಮುತ್ತು, ರತ್ನ, ಕುದುರೆ ಮಾರುತ್ತಿದ್ದರು ಎಂದು ವಿದೇಶಿ ಪ್ರವಾಸಿಗರು ಬರೆದಿದ್ದಾರೆ. ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ನಾಲ್ಕರ ಮೇ ತಿಂಗಳಲ್ಲಿ ಭಾರಿ ಮಳೆಗೆ ಈ ಮಂಟಪದ ಒಂದು ಭಾಗ ಕುಸಿಯಿತು. ಅದಕ್ಕೇ ಬೇಲಿ ಹಾಕಿದ್ದಾರೆ. ದಯವಿಟ್ಟು ಒಳಗೆ ಹೋಗಬೇಡಿ.
    tr: Ivu sālu maṇṭapagaḷu. Hinde illi vyāpārigaḷu muttu, ratna, kudure māruttiddaru endu vidēśi pravāsigaru barediddāre. Eraḍu sāvirada ippatnālkara Mē tiṅgaḷalli bhāri maḷege ī maṇṭapada ondu bhāga kusiyitu. Adakkē bēli hākiddāre. Dayaviṭṭu oḷage hōgabēḍi.
    en: These are the row pavilions. Foreign travellers wrote that merchants here once sold pearls, gems and horses. In May 2024 part of this pavilion collapsed in heavy rain. That is why it is fenced. Kindly do not go inside.
  - who: naveen
    t: ಐನೂರು ವರ್ಷ ಯುದ್ಧ, ಬಿಸಿಲು ತಡ್ಕೊಂಡು ನಿಂತಿತ್ತು. ಒಂದು ಮಳೆಗೆ ಬಿತ್ತು. ಎಂತ ಹೇಳುವುದು ಮಾರಾಯ.
    tr: Ainūru varṣa yuddha, bisilu taḍkoṇḍu nintittu. Ondu maḷege bittu. Enta hēḷuvudu mārāya.
    en: It stood through five hundred years of war and sun. And fell in one rain. What can you say, maraya.
  - who: guide
    t: ನಿಜ ಸಾರ್. ಸಂರಕ್ಷಣೆ ನಿರಂತರ ಕೆಲಸ. ಹಂಪಿಗೆ ಸಾವಿರದ ಒಂಬೈನೂರ ಎಂಬತ್ತಾರರಲ್ಲಿ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆ ತಾಣದ ಸ್ಥಾನ ಸಿಕ್ಕಿತು. ಆದರೆ ಪಟ್ಟಿಯಲ್ಲಿ ಹೆಸರು ಇದ್ದರೆ ಸಾಲದು, ಪ್ರತಿ ವರ್ಷ ಹಣ, ಕೆಲಸಗಾರರು, ಕಾಳಜಿ ಬೇಕು.
    tr: Nija sār. Saṁrakṣaṇe nirantara kelasa. Hampige sāvirada ombainūra embattāraralli Yuneskō viśva paraṁpare tāṇada sthāna sikkitu. Ādare paṭṭiyalli hesaru iddare sāladu, prati varṣa haṇa, kelasagāraru, kāḷaji bēku.
    en: True, sir. Conservation is continuous work. Hampi became a UNESCO World Heritage Site in 1986. But having a name on a list is not enough; every year it needs money, workers and care.
  - who: shruti
    t: ಸಾರ್, ಇಷ್ಟು ದೊಡ್ಡ ನಗರ ಹೇಗೆ ಹೀಗೆ ಪಾಳು ಬಿತ್ತು?
    tr: Sār, iṣṭu doḍḍa nagara hēge hīge pāḷu bittu?
    en: Sir, how did such a great city fall into ruins like this?
  - who: guide
    t: ಸಾವಿರದ ಐನೂರ ಅರವತ್ತೈದರಲ್ಲಿ ತಾಳಿಕೋಟೆ ಯುದ್ಧ ನಡೆಯಿತು. ಕೆಲವರು ಅದನ್ನು ರಕ್ಕಸ-ತಂಗಡಿ ಯುದ್ಧ ಎನ್ನುತ್ತಾರೆ. ಡೆಕ್ಕನ್ ಸುಲ್ತಾನರ ಒಗ್ಗೂಡಿದ ಸೈನ್ಯದ ಎದುರು ವಿಜಯನಗರ ಸೋತಿತು. ಅದರ ನಂತರ ಹಲವು ತಿಂಗಳು ನಗರವನ್ನು ಲೂಟಿ ಮಾಡಿ ಸುಟ್ಟರು ಎಂದು ದಾಖಲೆಗಳು ಹೇಳುತ್ತವೆ. ನೀವು ನೋಡುತ್ತಿರುವ ಒಡೆದ ಕಂಬಗಳು ಆ ಕಥೆಯನ್ನೇ ಹೇಳುತ್ತವೆ.
    tr: Sāvirada ainūra aravattaidaralli Tāḷikōṭe yuddha naḍeyitu. Kelavaru adannu Rakkasa-Taṅgaḍi yuddha ennuttāre. Ḍekkan sultānara oggūḍida sainyada eduru Vijayanagara sōtitu. Adara nantara halavu tiṅgaḷu nagaravannu lūṭi māḍi suṭṭaru endu dākhalegaḷu hēḷuttave. Nīvu nōḍuttiruva oḍeda kambagaḷu ā katheyannē hēḷuttave.
    en: In 1565 the battle of Talikota was fought. Some call it the battle of Rakkasa-Tangadi. Vijayanagara was defeated by the combined army of the Deccan Sultans. The records say that for many months after that, the city was looted and burned. The broken pillars you are looking at tell that very story.
  - who: imran
    t: ಅದು ನಮ್ ಕಡೆ ಇತಿಹಾಸ ಭೀ. ಬಹಮನಿ ಸುಲ್ತಾನರ ಮೊದಲ ರಾಜಧಾನಿ ಕಲಬುರಗಿನೇ. ಸಾಲೀ ಪುಸ್ತಕದಾಗ ಒಬ್ಬರು ಹೀರೋ, ಒಬ್ಬರು ವಿಲನ್. ಆದ್ರ ಯುದ್ಧದಾಗ ಸತ್ತೋರು ಎರಡೂ ಕಡೆ ಸಾಮಾನ್ಯ ಜನಾನೇ, ಸಾರ್.
    tr: Adu nam kaḍe itihāsa bhī. Bahamani sultānara modala rājadhāni Kalaburaginē. Sālī pustakadāga obbaru hīrō, obbaru vilan. Ādra yuddhadāga sattōru eraḍū kaḍe sāmān'ya janānē, sār.
    en: That's my side's history too. The first capital of the Bahmani sultans was Kalaburagi itself. In schoolbooks one side is the hero and the other the villain. But the ones who died in war, on both sides, were ordinary people, sir.
  - who: guide
    t: ತುಂಬಾ ಸರಿಯಾದ ಮಾತು ಡಾಕ್ಟರೇ. ನಾನು ಪ್ರವಾಸಿಗರಿಗೆ ಇದನ್ನೇ ಹೇಳಲು ಪ್ರಯತ್ನಿಸುತ್ತೇನೆ. ಇತಿಹಾಸ ದ್ವೇಷ ಕಲಿಸಬಾರದು, ಎಚ್ಚರಿಕೆ ಕಲಿಸಬೇಕು.
    tr: Tumbā sariyāda mātu ḍākṭarē. Nānu pravāsigarige idannē hēḷalu prayatnisuttēne. Itihāsa dvēṣa kalisabāradu, eccharike kalisabēku.
    en: A very true word, Doctor. That is exactly what I try to tell visitors. History should not teach hatred; it should teach caution.
  - scene: 11:30 a.m. The Vittala temple. The stone chariot stands in the courtyard, its stone wheels worn smooth.
  - who: guide
    t: ಇದು ಕಲ್ಲಿನ ರಥ. ಐವತ್ತು ರೂಪಾಯಿ ನೋಟಿನ ಹಿಂಭಾಗದಲ್ಲಿ ಇದರ ಚಿತ್ರ ಇದೆ, ನೋಡಿ. ಆ ಮಂಟಪದ ಕಂಬಗಳನ್ನು ತಟ್ಟಿದರೆ ಸಂಗೀತದ ಸ್ವರ ಬರುತ್ತಿತ್ತು. ಈಗ ಹಾನಿ ತಪ್ಪಿಸಲು ಕಂಬಗಳನ್ನು ಮುಟ್ಟುವುದನ್ನು ನಿಷೇಧಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ದೂರದಿಂದಲೇ ನೋಡಿ.
    tr: Idu kallina ratha. Aivattu rūpāyi nōṭina hiṁbhāgadalli idara chitra ide, nōḍi. Ā maṇṭapada kambagaḷannu taṭṭidare saṅgītada svara baruttittu. Īga hāni tappisalu kambagaḷannu muṭṭuvudannu niṣēdhisalāgide. Dayaviṭṭu dūradindalē nōḍi.
    en: This is the stone chariot. Its picture is on the back of the fifty-rupee note — see. If you tapped the pillars of that pavilion, musical notes would come out. Now, to prevent damage, touching the pillars is prohibited. Kindly look from a distance.
  - who: ramya
    t: ನವೀನ್, ನಿನ್ ಪರ್ಸ್‌ನಲ್ಲಿ ಐವತ್ತು ರೂಪಾಯಿ ನೋಟ್ ಉಂಟಾ? ರಥದ ಮುಂದೆ ನೋಟ್ ಹಿಡ್ಕೊಂಡು ಒಂದು ಶಾಟ್! ಬತ್ತೆ, ಬತ್ತೆ, ಇಲ್ಲೇ ನಿಲ್ಲು!
    tr: Navīn, nin pars-nalli aivattu rūpāyi nōṭ uṇṭā? Rathada munde nōṭ hiḍkoṇḍu ondu śāṭ! Batte, batte, illē nillu!
    en: Naveen, have you got a fifty-rupee note in your wallet? One shot holding the note in front of the chariot! I'm coming, I'm coming, stay right there!
  - who: naveen
    t: ಉಂಟು. ದುಬೈಯಿಂದ ಬಂದಾಗಿಂದ ಪರ್ಸ್‌ನಲ್ಲಿ ಕ್ಯಾಶ್ ಇಟ್ಟುಕೊಳ್ಳುವ ಅಭ್ಯಾಸ. ಕಾರ್ಡ್, ಚೆಕ್ ಮೇಲೆ ನಂಬಿಕೆ ಕಮ್ಮಿ.
    tr: Uṇṭu. Dubaiyinda bandāginda pars-nalli kyāś iṭṭukoḷḷuva abhyāsa. Kārḍ, chek mēle nambike kammi.
    en: I have. Ever since I came back from Dubai, I've had the habit of keeping cash in my wallet. Less faith in cards and cheques.
  - scene: He says it lightly, holding the note up for Ramya. Arjun, standing a few steps behind, turns away to look at the chariot's wheels.
  - scene: 12:20 p.m. Leaving the Vittala temple. Arjun falls into step with Prakash on the stone path.
  - who: arjun
    t: ಪ್ರಕಾಶ್, ಆ ಪಿನ್‌ಹೋಲ್ ಕ್ಯಾಮೆರಾ ವಿಷಯ ನೀನು ಮಕ್ಕಳಿಗೆ ಪಾಠ ಮಾಡ್ತೀಯ ಅಂದೆಯಲ್ಲಾ. ನಿನ್ನ ಸ್ಕೂಲ್ ಟ್ರಿಪ್‌ಗೆ ಬಸ್ ಖರ್ಚು ನಾನು ಕೊಡ್ತೀನಿ. ಸುಮ್ನೆ, ಒಂದು ಸಹಾಯ.
    tr: Prakāś, ā pin-hōl kyāmerā viṣaya nīnu makkaḷige pāṭha māḍtīya andeyallā. Ninna skūl ṭrip-ge bas kharchu nānu koḍtīni. Sumne, ondu sahāya.
    en: Prakash, you said you teach the kids about the pinhole camera. I'll pay the bus costs for your school trip. Just like that, as a help.
  - who: prakash
    t: ಥ್ಯಾಂಕ್ಸ್ರೀ. ಆದ್ರ ಸಾಲೀ ಟ್ರಿಪ್‌ಗೆ ಇಲಾಖೆಯ ಅನುದಾನ ಐತಿ, ಊರಿನ ಜನಾನೂ ಕೊಡತಾರ. ನಿಮ್ಮ ದುಡ್ಡು ನಿಮ್ಮ ಹತ್ರನೇ ಇರಲಿ.
    tr: Thyāṅksrī. Ādra sālī ṭrip-ge ilākheya anudāna aiti, ūrina janānū koḍatāra. Nimma duḍḍu nimma hatranē irali.
    en: Thank you. But there's a department grant for school trips, and the village people contribute too. Keep your money with you.
  - who: arjun
    t: ದುಡ್ಡಿನಿಂದ ಎಲ್ಲಾ ಸರಿ ಮಾಡ್ತೀನಿ ಅಂತ ಅಲ್ಲ, ಪ್ರಕಾಶ್. ನಾನು…
    tr: Duḍḍininda ellā sari māḍtīni anta alla, Prakāś. Nānu…
    en: It's not that I think I can fix everything with money, Prakash. I…
  - who: prakash
    t: ಗೊತ್ತೈತ್ರೀ. ಹೊತ್ತು ಬಂದಾಗ ಮಾತಾಡೋಣು. ಈಗ ಹರಿಗೋಲು ಕಾಯಾಕತ್ತಾವ.
    tr: Gottaitrī. Hottu bandāga mātāḍōṇu. Īga harigōlu kāyākattāva.
    en: I know. We'll talk when the time comes. Right now the coracles are waiting.
  - scene: He walks ahead to join Imran. Arjun slows down until he is walking alone at the back.
  - section: The coracle and the Dubai years
    learn: 'on the river: harigōlu, tuḍupu, tirugisu, nīru kammi · the dam, dated: kraisṭ gēṭ, kocchikoṇḍu hōytu, mūvattamūru hosa gēṭ · working abroad: gal''ph, kyāmp, rūmnalli eṇṭu jana, ūrige duḍḍu kaḷisu · loneliness and pride: obbanē, aḷalikkū samaya illa, pratiyondu dirhamge bevaru'
  - scene: 1:30 p.m. The Tungabhadra near the Hampi ghats. Round bamboo coracles sealed with tar spin slowly on the green water among the boulders. The guide has come along to arrange the boats. They go two and three to a coracle; Naveen, Imran and Ramya share one.
  - who: guide
    t: ಈ ದೋಣಿಗೆ ಹರಿಗೋಲು ಅನ್ನುತ್ತಾರೆ. ಬಿದಿರಿನಿಂದ ಮಾಡಿದ್ದು. ಈ ವರ್ಷ ನದಿಯಲ್ಲಿ ನೀರು ಚೆನ್ನಾಗಿದೆ. ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ನಾಲ್ಕರಲ್ಲಿ ತುಂಗಭದ್ರಾ ಅಣೆಕಟ್ಟಿನ ಒಂದು ಕ್ರಸ್ಟ್ ಗೇಟ್ ಕೊಚ್ಚಿಕೊಂಡು ಹೋಗಿತ್ತು. ಆಮೇಲೆ ಎಲ್ಲಾ ಮೂವತ್ತಮೂರು ಗೇಟುಗಳನ್ನೂ ಹೊಸದಾಗಿ ಹಾಕಿದರು. ಈ ಜೂನ್‌ನಲ್ಲಿ ಉದ್ಘಾಟನೆ ಆಯಿತು.
    tr: Ī dōṇige harigōlu annuttāre. Bidirininda māḍiddu. Ī varṣa nadiyalli nīru chennāgide. Eraḍu sāvirada ippatnālkaralli Tuṅgabhadrā aṇekaṭṭina ondu krasṭ gēṭ kocchikoṇḍu hōgittu. Āmēle ellā mūvattamūru gēṭugaḷannū hosadāgi hākidaru. Ī Jūn-nalli udghāṭane āyitu.
    en: This boat is called a harigolu — a coracle. It's made of bamboo. This year there's good water in the river. In 2024 one crest gate of the Tungabhadra dam was washed away. Later they put in all thirty-three gates new. They were inaugurated this June.
  - who: imran
    t: ಆ ವರ್ಷ ರಾಯಚೂರು, ಕೊಪ್ಪಳದ ರೈತರು ಒಂದು ಬೆಳೆ ಕಳಕೊಂಡ್ರು ಅಂತ ಓದಿದ್ದೆ. ಒಂದು ಗೇಟ್, ಲಕ್ಷ ಜನರ ಹೊಟ್ಟೆ.
    tr: Ā varṣa Rāyachūru, Koppaḷada raitaru ondu beḷe kaḷakoṇḍru anta ōdidde. Ondu gēṭ, lakṣa janara hoṭṭe.
    en: I read that farmers in Raichur and Koppal lost a crop that year. One gate — and the stomachs of a lakh people.
  - scene: The coracle spins. Ramya films the boulders turning around them. Naveen trails his hand in the water.
  - who: ramya
    t: ನವೀನ್, ನೀನು ದುಬೈ ಬಗ್ಗೆ ಯಾವತ್ತೂ ಹೇಳೇ ಇಲ್ಲ. ಆರು ವರ್ಷ ಅಲ್ವಾ? ಕ್ಯಾಮೆರಾ ಆಫ್ ಮಾಡ್ತೇನೆ, ಹೇಳು.
    tr: Navīn, nīnu Dubai bagge yāvattū hēḷē illa. Āru varṣa alvā? Kyāmerā āph māḍtēne, hēḷu.
    en: Naveen, you've never once talked about Dubai. It was six years, wasn't it? I'll switch the camera off — tell us.
  - who: naveen
    t: ಆರು ವರ್ಷ. ಎರಡು ಸಾವಿರದ ಹದಿನಾಲ್ಕರಿಂದ ಇಪ್ಪತ್ತರವರೆಗೆ. ಒಂದು ದೊಡ್ಡ ಹೋಟೆಲ್‌ನ ಕಿಚನ್‌ನಲ್ಲಿ, ಆಮೇಲೆ ಎಫ್ ಅಂಡ್ ಬಿ ಸೂಪರ್‌ವೈಸರ್. ಹೊರಗೆ ನೋಡಿದವರಿಗೆ ದುಬೈ ಅಂದ್ರೆ ಬಂಗಾರ, ಕಾರು, ಬುರ್ಜ್ ಖಲೀಫಾ. ನಮಗೆ ದುಬೈ ಅಂದ್ರೆ ಒಂದು ರೂಮಲ್ಲಿ ಆರು ಜನ, ಹದಿನಾಲ್ಕು ಗಂಟೆ ಡ್ಯೂಟಿ.
    tr: Āru varṣa. Eraḍu sāvirada hadinālkarinda ippattaravarege. Ondu doḍḍa hōṭel-na kichan-nalli, āmēle eph aṇḍ bi sūpar-vaisar. Horage nōḍidavarige Dubai andre baṅgāra, kāru, Burj Khalīphā. Namage Dubai andre ondu rūmalli āru jana, hadinālku gaṇṭe ḍyūṭi.
    en: Six years. From 2014 to 2020. In the kitchen of a big hotel, and later as an F&B supervisor. To people looking from outside, Dubai means gold, cars, the Burj Khalifa. To us Dubai meant six people in one room and fourteen-hour shifts.
  - who: imran
    t: ಮನಿ ನೆನಪಾಗತಿತ್ತೇನಪಾ?
    tr: Mani nenapāgatittēnapā?
    en: Did you miss home, man?
  - who: naveen
    t: ನೆನಪಾಗ್ತಿತ್ತು ಅಂತ ಹೇಳುವುದು ಸಣ್ಣ ಮಾತು. ಅಮ್ಮನ ಮೀನು ಸಾರು ವಾಸನೆ ಕನಸಲ್ಲಿ ಬರ್ತಿತ್ತು. ಆದ್ರೆ ಅಳಲಿಕ್ಕೂ ಸಮಯ ಇರ್ಲಿಲ್ಲ. ಪ್ರತಿ ತಿಂಗಳು ಸಂಬಳ ಬಂದ ದಿನ ಮನೆಗೆ ಕಳಿಸುವುದು, ಉಳಿದದ್ದು ಬ್ಯಾಂಕಲ್ಲಿ. ಆರು ವರ್ಷದ ಉಳಿತಾಯ. ಪ್ರತಿಯೊಂದು ದಿರ್ಹಮ್‌ಗೂ ಬೆವರು ಉಂಟು.
    tr: Nenapāgtittu anta hēḷuvudu saṇṇa mātu. Ammana mīnu sāru vāsane kanasalli bartittu. Ādre aḷalikkū samaya irlilla. Prati tiṅgaḷu saṁbaḷa banda dina manege kaḷisuvudu, uḷidaddu byāṅkalli. Āru varṣada uḷitāya. Pratiyondu dirham-gū bevaru uṇṭu.
    en: ‘Missed it’ is too small a word. The smell of Amma's fish curry used to come to me in my dreams. But there wasn't even time to cry. Every month, on payday, send money home, and the rest into the bank. Six years of savings. There's sweat on every single dirham.
  - who: ramya
    t: ಮತ್ತೆ ವಾಪಸ್ ಯಾಕೆ ಬಂದೆ?
    tr: Matte vāpas yāke bande?
    en: Then why did you come back?
  - who: naveen
    t: ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತು. ಕೋವಿಡ್. ಹೋಟೆಲ್ ಮುಚ್ಚಿತು. ಅದೇ ತಿಂಗಳು ಅಪ್ಪನಿಗೆ ಸ್ಟ್ರೋಕ್ ಆಯ್ತು. ವಂದೇ ಭಾರತ್ ವಿಮಾನದಲ್ಲಿ ಮಂಗಳೂರಿಗೆ ಬಂದೆ. ಆಮೇಲೆ ವಾಪಸ್ ಹೋಗಲಿಲ್ಲ. ಅಪ್ಪನ ಹೋಟೆಲ್ ನನ್ನ ಕೈಗೆ ಬಂತು. ಈಗ ನಾನೇ ಕ್ಯಾಶ್ ಕೌಂಟರ್, ನಾನೇ ಕಿಚನ್.
    tr: Eraḍu sāvirada ippattu. Kōviḍ. Hōṭel mucchitu. Adē tiṅgaḷu appanige sṭrōk āytu. Vandē Bhārat vimānadalli Maṅgaḷūrige bande. Āmēle vāpas hōgalilla. Appana hōṭel nanna kaige bantu. Īga nānē kyāś kauṇṭar, nānē kichan.
    en: 2020. Covid. The hotel shut. That same month Appa had a stroke. I came to Mangaluru on a Vande Bharat flight. I never went back. Appa's hotel came into my hands. Now I'm the cash counter and the kitchen both.
  - who: imran
    t: ನಮ್ ಕಲಬುರಗಿಯ ಸುಮಾರು ಹುಡುಗರು ಸೌದಿ, ದುಬೈಗೆ ಹೋಗ್ಯಾರ. ಬಂದಾಗ ಎಲ್ಲಾರೂ ‘ಭಾಳ ಛಲೋ ಐತಿ’ ಅಂತಾರ. ಯಾರೂ ನಿನ್ನಂಗ ನಿಜ ಹೇಳಂಗಿಲ್ಲ.
    tr: Nam Kalaburagiya sumāru huḍugaru Saudi, Dubaige hōgyāra. Bandāga ellārū ‘bhāḷa chalō aiti’ antāra. Yārū ninnaṅga nija hēḷaṅgilla.
    en: Lots of boys from our Kalaburagi have gone to Saudi and Dubai. When they come back, they all say, ‘It's really great.’ Nobody tells the truth like you do.
  - who: naveen
    t: ನಿಜ ಹೇಳಿದ್ರೆ ಮನೆಯವರು ಅಳ್ತಾರೆ, ಅದಕ್ಕೆ ಯಾರೂ ಹೇಳುದಿಲ್ಲ. ಅದಕ್ಕೇ ಆ ದುಡ್ಡಿನ ಬೆಲೆ ನನಗೆ ಗೊತ್ತು. ಯಾರಾದ್ರೂ ಅದನ್ನ ಹಗುರವಾಗಿ ತಗೊಂಡ್ರೆ…
    tr: Nija hēḷidre maneyavaru aḷtāre, adakke yārū hēḷudilla. Adakkē ā duḍḍina bele nanage gottu. Yārādrū adanna haguravāgi tagoṇḍre…
    en: If you tell the truth, your family cries, so nobody does. That's why I know the value of that money. If anyone takes it lightly…
  - scene: He stops. He looks across the water at the other coracle, where Arjun sits with Shruti and Deepa, laughing at something. Naveen doesn't finish the sentence.
  - who: ramya
    t: ಯಾರಾದ್ರೂ ಹಗುರವಾಗಿ ತಗೊಂಡ್ರೆ ಎಂತ?
    tr: Yārādrū haguravāgi tagoṇḍre enta?
    en: If anyone takes it lightly, what?
  - who: naveen
    t: ಏನಿಲ್ಲ. ಸುಮ್ಮನೆ ಹೇಳಿದೆ. ಹರಿಗೋಲು ತಿರುಗ್ತಾ ಇದೆ, ನನ್ನ ತಲೆನೂ ತಿರುಗ್ತಾ ಇದೆ. ದಡಕ್ಕೆ ಹೋಗುವ.
    tr: Ēnilla. Summane hēḷide. Harigōlu tirugtā ide, nanna talenū tirugtā ide. Daḍakke hōguva.
    en: Nothing. I was just talking. The coracle's spinning, and so is my head. Let's go to the bank.
  - scene: On the bank, while the others pay the boatmen, Imran falls into step beside Kaveri.
  - who: imran
    t: ಕಾವೇರಿ, ನೀನು ಗಮನಿಸಿದ್ಯಾ? ನವೀನ್ ಅರ್ಜುನ್ ಜೊತೆ ಸರಿಯಾಗಿ ಮಾತಾಡ್ತಿಲ್ಲ. ಬೆಳಗ್ಗೆ ಕಾರ್ ಬೇಡ ಅಂದ, ಈಗ ‘ಚೆಕ್ ಮೇಲೆ ನಂಬಿಕೆ ಇಲ್ಲ’ ಅಂದ. ಏನೋ ಐತಿ.
    tr: Kāvēri, nīnu gamanisidyā? Navīn Arjun jote sariyāgi mātāḍtilla. Beḷagge kār bēḍa anda, īga ‘chek mēle nambike illa’ anda. Ēnō aiti.
    en: Kaveri, have you noticed? Naveen isn't talking properly with Arjun. This morning he said no to the car, and just now, ‘no faith in cheques’. Something's going on.
  - who: kaveri
    t: ಗಮನಿಸಿದೆ. ಆದ್ರೆ ಊಹೆಯ ಮೇಲೆ ಏನೂ ಹೇಳಬಾರದು. ಅವರಿಬ್ಬರೇ ಹೇಳೋವರೆಗೆ ನಾವು ಕಾಯೋಣ. ಸಾಕ್ಷಿ ಇಲ್ಲದೆ ತೀರ್ಪು ಇಲ್ಲ.
    tr: Gamaniside. Ādre ūheya mēle ēnū hēḷabāradu. Avaribbarē hēḷōvarege nāvu kāyōṇa. Sākṣi illade tīrpu illa.
    en: I've noticed. But you shouldn't say anything on a guess. Let's wait until the two of them say it themselves. No verdict without evidence.
  - section: Sunset at Hemakuta
    learn: 'the view: sūryāsta, baṇḍegaḷa mēle keṁpu beḷaku, gāḷi taṇṇage · finally alone: ondu nimiṣa mātāḍbōdā?, illi bēḍa · the past: āvattu nīnu hēḷade hōde, nanage bēre yārindalō gottāytu · refusal with a promise: īga alla, samudrada hatra'
  - scene: 5:30 p.m. Hemakuta hill above the Virupaksha temple. Small ancient shrines on bare granite. Dozens of tourists sit waiting for the sunset. The guide has said goodbye and been paid. The eight spread out over the warm rock.
  - who: deepa
    t: ನೋಡಿ, ಬಂಡೆಗಳೆಲ್ಲಾ ಕೆಂಪಾಗ್ತಿವೆ. ಐನೂರು ವರ್ಷದ ಹಿಂದೆ ಇಲ್ಲಿ ಕೂತವರೂ ಇದೇ ಸೂರ್ಯನ್ನ ನೋಡಿದ್ರು ಅಲ್ವಾ.
    tr: Nōḍi, baṇḍegaḷellā keṁpāgtive. Ainūru varṣada hinde illi kūtavarū idē sūryanna nōḍidru alvā.
    en: Look, all the boulders are turning red. The people who sat here five hundred years ago watched this same sun, didn't they.
  - who: prakash
    t: ಖರೇ. ರಾಜರು ಹೋದ್ರು, ಸಾಮ್ರಾಜ್ಯ ಹೋತು. ಸೂರ್ಯ ಮಾತ್ರ ದಿನಾ ಬರತಾನ, ಹೋಗತಾನ. ಯಾರಿಗೂ ಕಾಯಂಗಿಲ್ಲ.
    tr: Kharē. Rājaru hōdru, sāmrājya hōtu. Sūrya mātra dinā baratāna, hōgatāna. Yārigū kāyaṅgilla.
    en: True. The kings went, the empire went. Only the sun comes and goes every day. He doesn't wait for anyone.
  - who: deepa
    t: ಶ್ರುತಿ, ಕಾವೇರಿ… ನಿನ್ನೆ ರಾತ್ರಿ ಥ್ಯಾಂಕ್ಸ್. ಇವತ್ತು ಬೆಳಗ್ಗೆ ಎದ್ದಾಗ ಎಷ್ಟೋ ತಿಂಗಳ ನಂತರ ಎದೆ ಭಾರ ಇರಲಿಲ್ಲ.
    tr: Śruti, Kāvēri… ninne rātri thyāṅks. Ivattu beḷagge eddāga eṣṭō tiṅgaḷa nantara ede bhāra iralilla.
    en: Shruti, Kaveri… thank you for last night. When I woke up this morning, for the first time in months my chest didn't feel heavy.
  - who: kaveri
    t: ಒಳ್ಳೆದು. ಒಂದೊಂದೇ ಹೆಜ್ಜೆ. ಇವತ್ತು ಸೂರ್ಯಾಸ್ತ ನೋಡು, ಅಷ್ಟು ಸಾಕು. ಕೋರ್ಟ್ ಸೋಮವಾರದ ವಿಷಯ.
    tr: Oḷḷedu. Ondondē hejje. Ivattu sūryāsta nōḍu, aṣṭu sāku. Kōrṭ sōmavārada viṣaya.
    en: Good. One step at a time. Today, watch the sunset; that's enough. Court is a Monday matter.
  - scene: Ramya sets up her phone on a small tripod for a time-lapse. Arjun gets up and walks over to where Shruti sits alone on a ledge, a little apart.
  - who: arjun
    t: ಶ್ರುತಿ, ಒಂದು ನಿಮಿಷ ಮಾತಾಡ್ಬೋದಾ?
    tr: Śruti, ondu nimiṣa mātāḍbōdā?
    en: Shruti, can we talk for a minute?
  - who: shruti
    t: ಕೂತ್ಕೋ. ಸೂರ್ಯ ಮುಳುಗೋವರೆಗೆ ಸಮಯ ಇದೆ.
    tr: Kūtkō. Sūrya muḷugōvarege samaya ide.
    en: Sit. There's time until the sun goes down.
  - who: arjun
    t: ನಿನ್ನೆ ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ನೀನು ‘ಹದಿನಾಲ್ಕು ವರ್ಷ’ ಅಂದೆ. ಅದು ಎರಡು ಸಾವಿರದ ಹನ್ನೆರಡರ ಬಗ್ಗೆ ಅಂತ ನನಗೆ ಗೊತ್ತು. ಪುಣೆ ಆಫರ್. ನಾನು ಅದರ ಬಗ್ಗೆ ಯಾವತ್ತೂ ಸರಿಯಾಗಿ…
    tr: Ninne Chitradurgadalli nīnu ‘hadinālku varṣa’ ande. Adu eraḍu sāvirada hanneraḍara bagge anta nanage gottu. Puṇe āphar. Nānu adara bagge yāvattū sariyāgi…
    en: Yesterday at Chitradurga you said ‘fourteen years’. I know that was about 2012. The Pune offer. I never properly…
  - who: shruti
    t: ನೀನು ಪುಣೆಗೆ ಹೋಗಿದ್ದು ತಪ್ಪಲ್ಲ, ಅರ್ಜುನ್. ಒಳ್ಳೆ ಅವಕಾಶ ಇತ್ತು. ತಪ್ಪು ಅದಲ್ಲ. ನೀನು ನನಗೆ ಹೇಳದೆ ಹೋದೆ. ನನಗೆ ನಿನ್ನ ರೂಮ್‌ಮೇಟ್‌ನಿಂದ ಗೊತ್ತಾಯ್ತು, ನೀನು ರೈಲು ಹತ್ತಿದ ಮೇಲೆ.
    tr: Nīnu Puṇege hōgiddu tappalla, Arjun. Oḷḷe avakāśa ittu. Tappu adalla. Nīnu nanage hēḷade hōde. Nanage ninna rūm-mēṭ-ninda gottāytu, nīnu railu hattida mēle.
    en: Going to Pune wasn't wrong, Arjun. It was a good opportunity. That's not the wrong. You went without telling me. I found out from your roommate — after you'd boarded the train.
  - who: arjun
    t: ಗೊತ್ತು. ಹೇಳಿದ್ರೆ ನೀನು ‘ಹೋಗಬೇಡ’ ಅಂತೀಯ ಅಂತ ಹೆದರಿದೆ. ನೀನು ‘ಹೋಗಬೇಡ’ ಅಂದಿದ್ರೆ ನಾನು ಹೋಗ್ತಿರ್ಲಿಲ್ಲ. ಅದಕ್ಕೇ ಹೇಳ್ಲಿಲ್ಲ. ಅದು ಹೇಡಿತನ. ಈಗ ಅರ್ಥ ಆಗುತ್ತೆ. ಶ್ರುತಿ, ನಾನು…
    tr: Gottu. Hēḷidre nīnu ‘hōgabēḍa’ antīya anta hedaride. Nīnu ‘hōgabēḍa’ andidre nānu hōgtirlilla. Adakkē hēḷlilla. Adu hēḍitana. Īga artha āgutte. Śruti, nānu…
    en: I know. I was afraid that if I told you, you'd say, ‘Don't go.’ And if you'd said ‘Don't go’, I wouldn't have gone. That's why I didn't tell you. It was cowardice. I understand that now. Shruti, I…
  - scene: Shruti raises a hand, gently, without looking at him. The lower edge of the sun touches the hills.
  - who: shruti
    t: ಈಗ ಅಲ್ಲ, ಅರ್ಜುನ್. ಇಲ್ಲಿ ಅಲ್ಲ. ಇಲ್ಲಿ ಎಲ್ರೂ ಇದಾರೆ, ರಮ್ಯಾ ಕ್ಯಾಮೆರಾ ಇದೆ, ನನ್ನ ತಲೇಲಿ ದೀಪಾ, ಪ್ರಕಾಶ್, ಎಲ್ಲಾ ಇದಾರೆ. ಸಮುದ್ರದ ಹತ್ರ. ಗೋಕರ್ಣದಲ್ಲಿ. ಆವಾಗ ನಾನೂ ಹೇಳ್ಬೇಕಾದ್ದು ಹೇಳ್ತೀನಿ.
    tr: Īga alla, Arjun. Illi alla. Illi ellrū idāre, Ramyā kyāmerā ide, nanna talēli Dīpā, Prakāś, ellā idāre. Samudrada hatra. Gōkarṇadalli. Āvāga nānū hēḷbēkāddu hēḷtīni.
    en: Not now, Arjun. Not here. Everyone's here, Ramya's camera is here, and my head is full of Deepa, Prakash, everything. At the sea. In Gokarna. Then I'll say what I have to say too.
  - who: arjun
    t: ನೀನೂ? ನೀನೇನು ಹೇಳ್ಬೇಕು?
    tr: Nīnū? Nīnēnu hēḷbēku?
    en: You too? What do you have to say?
  - who: shruti
    t: ಸಮುದ್ರದ ಹತ್ರ ಅಂದೆ. ಈಗ ಸೂರ್ಯ ನೋಡು. ಹದಿನಾಲ್ಕು ವರ್ಷ ಕಾದಿದೀವಿ, ಇನ್ನು ಮೂರು ದಿನ ಕಾಯೋಕಾಗಲ್ವಾ?
    tr: Samudrada hatra ande. Īga sūrya nōḍu. Hadinālku varṣa kādidīvi, innu mūru dina kāyōkāgalvā?
    en: I said at the sea. Now look at the sun. We've waited fourteen years — can't we wait three more days?
  - scene: They sit side by side without speaking as the sun goes down behind the boulders. Twenty metres away, Ramya's phone on its tripod records the whole sunset, and two small figures on a ledge.
  - section: Dinner, cash, and a cool ‘-ri’
    learn: 'café talk: ḍinnar, banāna pyānkēk, nimbe sōḍa, bil · paying separately: nanna pālu nānē koḍtēne, ninna kārḍ bēḍa · -ri as distance, not respect: Arjun-ge ‘rī’ antidīya · tomorrow''s plan: beḷagge ēḷakke horaḍōṇa, avva kāytāḷa, hiṁdina sīṭugaḷu'
  - scene: 8:00 p.m. A small rooftop café near Hampi village. Fairy lights, floor cushions, a temple's lit gopura in the distance. Thalis, lemon sodas, one plate of banana pancakes that Ramya insists is ‘part of the Hampi experience’.
  - who: ramya
    t: ಎಲ್ರೂ ನೋಡಿ, ಸನ್‌ಸೆಟ್ ಟೈಮ್-ಲ್ಯಾಪ್ಸ್! ಮೂವತ್ತು ಸೆಕೆಂಡ್‌ನಲ್ಲಿ ಒಂದು ಗಂಟೆ. ಎಂತ ಚಂದ ಉಂಟು ಮರ್ರೆ!
    tr: Ellrū nōḍi, san-seṭ ṭaim-lyāps! Mūvattu sekeṇḍ-nalli ondu gaṇṭe. Enta chanda uṇṭu marre!
    en: Everyone, look — the sunset time-lapse! An hour in thirty seconds. Isn't it beautiful, man!
  - who: imran
    t: ನಿಲ್ಲಿಸು, ನಿಲ್ಲಿಸು. ಅಲ್ಲಿ ಮೂಲೆಯಾಗ ಎರಡು ಜನ ಕುಂತಾರಲ್ಲ, ಅವರು ಯಾರು?
    tr: Nillisu, nillisu. Alli mūleyāga eraḍu jana kuntāralla, avaru yāru?
    en: Stop, stop. Those two people sitting in the corner there — who are they?
  - who: kaveri
    t: ಇಮ್ರಾನ್. ಊಟ ಮಾಡು.
    tr: Imrān. Ūṭa māḍu.
    en: Imran. Eat your dinner.
  - scene: Shruti looks down at her plate. Arjun reaches for the water jug. Ramya quickly swipes to the next video.
  - who: arjun
    t: ಪ್ರಕಾಶ್, ಈ ಪಲ್ಯ ಚೆನ್ನಾಗಿದೆ, ಸ್ವಲ್ಪ ಹಾಕ್ಕೋ. ನಾಳೆ ನಿಮ್ಮ ಅಮ್ಮನ ಊಟಕ್ಕೆ ಮುಂಚೆ ಅಭ್ಯಾಸ.
    tr: Prakāś, ī palya chennāgide, svalpa hākkō. Nāḷe nimma ammana ūṭakke muñche abhyāsa.
    en: Prakash, this palya is good, have some. Practice before your mother's meal tomorrow.
  - who: prakash
    t: ಥ್ಯಾಂಕ್ಸ್ರೀ, ಅರ್ಜುನ್ ಅವರೇ. ಸಾಕಾತ್ರಿ. ನೀವು ತಗೋರಿ.
    tr: Thyāṅksrī, Arjun avarē. Sākātri. Nīvu tagōri.
    en: Thank you, Arjun-avare. I've had enough. You have it.
  - scene: A small pause at the table. Imran puts his spoon down.
  - who: imran
    t: ಪ್ರಕಾಶಾ, ಕಾಲೇಜಿನ್ಯಾಗ ನೀನು ಅವನಿಗೆ ‘ಲೇ ಅರ್ಜುನಾ’ ಅಂತಿದ್ದಿ. ಈಗ ‘ಅರ್ಜುನ್ ಅವರೇ’, ‘ತಗೋರಿ’. ನಮ್ ಕಡೆ ‘ರೀ’ ಮರ್ಯಾದೆಗೆ. ಆದ್ರ ಇದು ಮರ್ಯಾದೆ ಅಲ್ಲ, ಇದು ದೂರ.
    tr: Prakāśā, kālējinyāga nīnu avanige ‘lē Arjunā’ antiddi. Īga ‘Arjun avarē’, ‘tagōri’. Nam kaḍe ‘rī’ maryādege. Ādra idu maryāde alla, idu dūra.
    en: Prakasha, in college you used to call him ‘Le, Arjuna’. Now it's ‘Arjun-avare’ and ‘have it-ree’. Where we come from, ‘ree’ is for respect. But this isn't respect, this is distance.
  - who: prakash
    t: ದೂರಾನೂ ಒಂದು ಮರ್ಯಾದೆನೇ, ಡಾಕ್ಟ್ರೇ. ಎಲ್ಲಾರಿಗೂ ಅವರವರ ಜಾಗ. ಊಟ ತಣ್ಣಗಾಗತೈತಿ.
    tr: Dūrānū ondu maryādenē, ḍākṭrē. Ellārigū avaravara jāga. Ūṭa taṇṇagāgataiti.
    en: Distance is a kind of respect too, Doctor. Everyone has their own place. The food's getting cold.
  - scene: Arjun opens his mouth, then closes it. He passes the palya to Deepa instead.
  - who: deepa
    t: ನಾಳೆ ಧಾರವಾಡದಲ್ಲಿ ಪ್ರಕಾಶ್ ಮನೆಯಲ್ಲಿ ಎಲ್ರೂ ಚೆನ್ನಾಗಿರೋಣ, ಆಯ್ತಾ? ಅವರ ಅಮ್ಮ ಬೆಳಗ್ಗೆ ಫೋನ್‌ನಲ್ಲಿ ಎಷ್ಟು ಖುಷಿಯಾಗಿದ್ರು. ಅವರ ಮುಂದೆ ಯಾವ ಜಗಳನೂ ಬೇಡ.
    tr: Nāḷe Dhāravāḍadalli Prakāś maneyalli ellrū chennāgirōṇa, āytā? Avara amma beḷagge phōn-nalli eṣṭu khuṣiyāgidru. Avara munde yāva jagaḷanū bēḍa.
    en: Tomorrow in Dharwad, at Prakash's house, let's all be good, okay? His mother was so happy on the phone this morning. No fights of any kind in front of her.
  - who: prakash
    t: ಅವ್ವನ ಮುಂದೆ ಜಗಳ ಆಡಾಕ ಯಾರಿಗೂ ಧೈರ್ಯ ಇಲ್ಲ, ದೀಪಾ. ಒನಕಿ ಓಬವ್ವನ ಕೈಯಾಗ ಮಾತ್ರ ಇರಂಗಿಲ್ಲ.
    tr: Avvana munde jagaḷa āḍāka yārigū dhairya illa, Dīpā. Onaki Ōbavvana kaiyāga mātra iraṅgilla.
    en: Nobody has the nerve to fight in front of Avva, Deepa. The pestle isn't only in Obavva's hands.
  - who: naveen
    t: ರಮ್ಯಾ, ನೀನು ಇಡೀ ದಿನ ಶೂಟ್ ಮಾಡ್ತಾ ಉಂಟು. ಈ ವ್ಲಾಗ್ ನಿಜವಾಗಲೂ ಎಲ್ಲಿ ಹಾಕ್ತೀಯ? ನಿನ್ನ ಚಾನೆಲ್‌ನಲ್ಲಾ?
    tr: Ramyā, nīnu iḍī dina śūṭ māḍtā uṇṭu. Ī vlāg nijavāgalū elli hāktīya? Ninna chānel-nallā?
    en: Ramya, you've been shooting all day. Where are you really going to put this vlog? On your channel?
  - who: ramya
    t: ಚಾನೆಲ್‌ನಲ್ಲಿ ಅಲ್ಲ ಮರ್ರೆ. ಅಲ್ಲಿ ಇದಕ್ಕೆ ಜಾಗ ಇಲ್ಲ, ಅಲ್ಲಿ ಜಗಳಕ್ಕೆ ಮಾತ್ರ ಜಾಗ. ಇದು ನನ್ನದು. ಎಲ್ಲಿ ಹಾಕ್ತೇನೆ ಅಂತ… ಆಮೇಲೆ ಹೇಳ್ತೆ.
    tr: Chānel-nalli alla marre. Alli idakke jāga illa, alli jagaḷakke mātra jāga. Idu nannadu. Elli hāktēne anta… āmēle hēḷte.
    en: Not on the channel, man. There's no room for this there; there's only room for fights there. This is mine. Where I'll put it… I'll tell you later.
  - scene: Everyone laughs, Arjun too, a beat late. The waiter brings the bill. Arjun reaches for it with his card.
  - who: arjun
    t: ಇದು ನನ್ ಕಡೆಯಿಂದ. ಇವತ್ತು ಹಂಪಿ ದಿನ. ಯಾರೂ ಜಗಳ ಮಾಡ್ಬೇಡಿ.
    tr: Idu nan kaḍeyinda. Ivattu Hampi dina. Yārū jagaḷa māḍbēḍi.
    en: This one's on me. Today is Hampi day. Nobody argue.
  - who: naveen
    t: ಬೇಡ. ಬಿಲ್ ಎಂಟು ಭಾಗ ಮಾಡು. ನನ್ನ ಪಾಲು ಇದು, ಕ್ಯಾಶ್. ನಿನ್ನ ಕಾರ್ಡ್ ನಿನ್ನ ಹತ್ರವೇ ಇರಲಿ, ಅರ್ಜುನ್. ಬೇರೆ ಕಡೆ ಬೇಕಾಗಬಹುದು.
    tr: Bēḍa. Bil eṇṭu bhāga māḍu. Nanna pālu idu, kyāś. Ninna kārḍ ninna hatravē irali, Arjun. Bēre kaḍe bēkāgabahudu.
    en: No. Split the bill eight ways. Here's my share, in cash. Keep your card with you, Arjun. You might need it somewhere else.
  - scene: He puts the notes on the table and gets up to look at the view. Arjun stays seated, the card still in his hand. Kaveri and Imran exchange a second look. Deepa notices it too.
  - who: shruti
    t: ಸರಿ. ನಾಳೆ ಬೆಳಗ್ಗೆ ಏಳು ಗಂಟೆಗೆ ಹೊರಡೋಣ. ಕಾರ್‌ಗಳು ಮೊದಲಿನ ಹಾಗೇ. ನಾನು ಅರ್ಜುನ್ ಕಾರಲ್ಲಿ, ಪ್ರಕಾಶ್, ಇಮ್ರಾನ್ ಜೊತೆ. ನವೀನ್ ತನ್ನ ಕಾರ್ ಓಡಿಸ್ಲಿ, ದೀಪಾ, ಕಾವೇರಿ, ರಮ್ಯಾ ಜೊತೆ.
    tr: Sari. Nāḷe beḷagge ēḷu gaṇṭege horaḍōṇa. Kār-gaḷu modalina hāgē. Nānu Arjun kāralli, Prakāś, Imrān jote. Navīn tanna kār ōḍisli, Dīpā, Kāvēri, Ramyā jote.
    en: Right. Let's leave at seven tomorrow morning. The cars as before. I'll be in Arjun's car with Prakash and Imran. Naveen drives his own car, with Deepa, Kaveri and Ramya.
  - who: prakash
    t: ಹೊಸಪೇಟೆ, ಕೊಪ್ಪಳ, ಗದಗ, ಹುಬ್ಬಳ್ಳಿ. ಸುಮಾರು ಮೂರು-ನಾಲ್ಕು ತಾಸು. ಸಪ್ತಾಪುರದಾಗ ಅವ್ವ ಬಾಗಿಲಲ್ಲಿ ನಿಂತಿರತಾಳ. ತಡ ಮಾಡಬ್ಯಾಡ್ರಿ.
    tr: Hosapēṭe, Koppaḷa, Gadaga, Hubbaḷḷi. Sumāru mūru-nālku tāsu. Saptāpuradāga avva bāgilalli nintiratāḷa. Taḍa māḍabyāḍri.
    en: Hosapete, Koppal, Gadag, Hubballi. About three or four hours. In Saptapur, Avva will be standing at the door. Don't be late.
  - who: arjun
    t: ನಾಲ್ಕೂ ಐವತ್ತಕ್ಕೇ ರೆಡಿ ಇರ್ತೀನಿ. ಗೊತ್ತಲ್ವಾ, ಜನ ಬದಲಾಗ್ತಾರೆ.
    tr: Nālkū aivattakkē reḍi irtīni. Gottalvā, jana badalāgtāre.
    en: I'll be ready at four-fifty. You know — people change.
  - who: shruti
    t: ನೋಡೋಣ.
    tr: Nōḍōṇa.
    en: We'll see.
  - scene: The café's lights go off one by one. Below, Hampi's boulders are dark shapes under the stars. Eight friends walk back to the cars in twos and threes, Naveen ahead alone, Prakash beside Imran, Shruti between Deepa and Kaveri, Arjun last.
  - chapter: Chapter 6 — Dharwad
  - section: Leaving Hampi
    learn: 'loading the cars: ḍikki, nānē hāktēne, ninna kāru nōḍkō · noticing a chill: ēnō ide, eraḍu padakkinta jāsti mātāḍilla, polite distance: Arjun avarē, chalō aitri · Dharwad on the phone: elli muṭṭīri, lagūna barri, barākattāra · a doctor on leave: rajādāga adēni, ādrū phōn ettatēni'
  - scene: Sunday, 6 December 2026, seven in the morning. Outside the homestay in Kamalapur, mist on the boulders. The two cars are being loaded. Arjun reaches for Naveen's suitcase.
  - who: arjun
    t: ಕೊಡು ಮಗಾ, ಆ ಸೂಟ್‌ಕೇಸ್ ನಾನು ಡಿಕ್ಕಿಗೆ ಹಾಕ್ತೀನಿ. ನಿನ್ನೆ ಹೇಮಕೂಟ ಹತ್ತಿ ಮಂಡಿ ನೋಯ್ತಿದೆ ಅಂದಿದ್ದೆ ಅಲ್ವಾ?
    tr: Koḍu magā, ā sūṭkēs nānu ḍikkige hāktīni. Ninne Hēmakūṭa hatti maṇḍi nōytide andidde alvā?
    en: Give it here, man, I'll put that suitcase in the boot. Didn't you say yesterday your knee hurt after climbing Hemakuta?
  - who: naveen
    t: ಬೇಡ. ನಾನೇ ಹಾಕ್ತೇನೆ. ನನ್ನ ಕಾರು, ನನ್ನ ಡಿಕ್ಕಿ. ನೀನು ನಿನ್ನ ಕಾರು ನೋಡ್ಕೋ ಮಾರಾಯ.
    tr: Bēḍa. Nānē hāktēne. Nanna kāru, nanna ḍikki. Nīnu ninna kāru nōḍkō mārāya.
    en: No. I'll do it myself. My car, my boot. You look after your own car, mārāya.
  - who: ramya
    t: ಕಾವೇರಿ, ನೋಡಿದ್ಯಾ? ಮೂರು ದಿನದಿಂದ ನವೀನ್ ಅರ್ಜುನ್ ಜೊತೆ ಎರಡು ಪದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಮಾತಾಡಿಲ್ಲ. ಏನೋ ಇದೆ.
    tr: Kāvēri, nōḍidyā? Mūru dinadinda Navīn Arjun jote eraḍu padakkinta jāsti mātāḍilla. Ēnō ide.
    en: Kaveri, did you see that? For three days Naveen hasn't said more than two words to Arjun. Something's up.
  - who: kaveri
    t: ಇದ್ದರೂ ಅದು ಅವರಿಬ್ಬರ ವಿಷಯ, ರಮ್ಯಾ. ಮೊದಲು ಆ ಕ್ಯಾಮೆರಾ ಆಫ್ ಮಾಡು. ಎಲ್ಲವನ್ನೂ ವ್ಲಾಗ್‌ಗೆ ಹಾಕೋಕಾಗಲ್ಲ.
    tr: Iddarū adu avaribbara viṣaya, Ramyā. Modalu ā kyāmerā āph māḍu. Ellavannū vlāg-ge hākōkāgalla.
    en: Even if there is, it's between the two of them, Ramya. First switch that camera off. Not everything can go into a vlog.
  - who: ramya
    t: ಆಫ್ ಆಯ್ತು, ವಕೀಲರೇ. ಆದ್ರೆ ಹನ್ನೆರಡು ವರ್ಷ ನ್ಯೂಸ್‌ರೂಮಲ್ಲಿ ಇದ್ದ ಮೂಗು ಇದು. ಸ್ಟೋರಿ ವಾಸನೆ ಬರ್ತಿದೆ ಮರ್ರೆ.
    tr: Āph āytu, vakīlarē. Ādre hanneraḍu varṣa nyūs-rūmalli idda mūgu idu. Sṭōri vāsane bartide marre.
    en: It's off, Counsel. But this nose spent twelve years in a newsroom. I can smell a story, marre.
  - who: shruti
    t: ಅಂದಹಾಗೆ, ಅರ್ಜುನ್ ಇವತ್ತು ಆರು ಐವತ್ತಕ್ಕೇ ಕಾರ್ ಹತ್ರ ರೆಡಿ ಇದ್ದ. ಹತ್ತು ನಿಮಿಷ ಮುಂಚೆ.
    tr: Andahāge, Arjun ivattu āru aivattakkē kār hatra reḍi idda. Hattu nimiṣa muñche.
    en: By the way, Arjun was ready at the car at six-fifty today. Ten minutes early.
  - who: arjun
    t: ನಿನ್ನೆ ಹೇಳಿದ್ನಲ್ಲ, ಜನ ಬದಲಾಗ್ತಾರೆ.
    tr: Ninne hēḷidnalla, jana badalāgtāre.
    en: I told you last night — people change.
  - who: shruti
    t: ಒಂದು ದಿನದ ರೆಕಾರ್ಡ್ ನೋಡಿ ಜಡ್ಜ್‌ಮೆಂಟ್ ಕೊಡೋಕಾಗಲ್ಲ. ಕಾವೇರಿನೇ ಹಾಗೆ ಹೇಳ್ತಾಳೆ. ಹತ್ತು, ಹೊರಡೋಣ.
    tr: Ondu dinada rekārḍ nōḍi jaḍjmeṇṭ koḍōkāgalla. Kāvērinē hāge hēḷtāḷe. Hattu, horaḍōṇa.
    en: You can't give a judgment on one day's record. Kaveri would say so herself. Get in, let's go.
  - scene: Arjun's car, on the Koppal road. Shruti in front, Prakash and Imran behind. Prakash's phone rings; he puts his mother on speaker.
  - who: amma
    t: ಪ್ರಕಾಶಾ, ಎಲ್ಲಿಗೆ ಮುಟ್ಟೀರಿ? ಎಂಟು ಮಂದಿಗೆ ರೊಟ್ಟಿ ಹಿಟ್ಟು ಕಲಸಿ ಇಟ್ಟೇನಿ. ಬೆಂಗಳೂರಿನವರಿಗೆ ಕಡಿಮಿ ಖಾರದ್ದು ಬ್ಯಾರೆ ಮಾಡೇನಿ, ಹೇಳಿದ್ಹಂಗ.
    tr: Prakāśā, ellige muṭṭīri? Eṇṭu mandige roṭṭi hiṭṭu kalasi iṭṭēni. Beṅgaḷūrinavarige kaḍimi khāraddu byāre māḍēni, hēḷidhaṅga.
    en: Prakasha, how far have you got? I've kneaded rotti dough for eight. And I've made a less-spicy lot separately for the Bengaluru folk, like I said.
  - who: prakash
    t: ಆತವ್ವಾ. ಈಗಷ್ಟೇ ಹಂಪಿ ಬಿಟ್ಟೇವಿ. ಕೊಪ್ಪಳ, ಗದಗ ದಾಟಿ ಒಂದು ಗಂಟೆಗೆ ಮನಿ ಮುಟ್ಟತೇವಿ. ಭಾಳ ಗಡಿಬಿಡಿ ಮಾಡಬ್ಯಾಡ, ಆರಾಮ ಇರು.
    tr: Ātavvā. Īgaṣṭē Hampi biṭṭēvi. Koppaḷa, Gadaga dāṭi ondu gaṇṭege mani muṭṭatēvi. Bhāḷa gaḍibiḍi māḍabyāḍa, ārāma iru.
    en: All right, Avva. We've only just left Hampi. We'll cross Koppal and Gadag and be home by one. Don't rush around too much, take it easy.
  - who: amma
    t: ಗಡಿಬಿಡಿ ಏನ್ ಬಂತು? ನನ್ ಮಗನ ದೋಸ್ತರು ಮೊದಲನೇ ಸಲ ಮನಿಗೆ ಬರಾಕತ್ತಾರ. ಎಣ್ಣಗಾಯಿ ಮಾಡತೇನಿ, ಶೇಂಗಾ ಚಟ್ನಿ ಆಗ್ಲೇ ಕುಟ್ಟಿ ಇಟ್ಟೇನಿ. ಲಗೂನ ಬರ್ರಿ.
    tr: Gaḍibiḍi ēn bantu? Nan magana dōstaru modalanē sala manige barākattāra. Eṇṇagāyi māḍatēni, śēṅgā caṭni āglē kuṭṭi iṭṭēni. Lagūna barri.
    en: What rush? My son's friends are coming to our house for the first time. I'm making stuffed brinjal, and I've already pounded the peanut chutney. Come quickly.
  - who: imran
    t: ಅವ್ವಾ, ನಾ ಇಮ್ರಾನ್ ರೀ, ಕಲಬುರಗಿಯಾಂವ. ಜೋಳದ ರೊಟ್ಟಿ ಅಂದ್ರ ನಾ ಎಲ್ಲಾರಕ್ಕಿಂತ ಮೊದಲು ಬರ್ತೇನಿ. ಖಡಕ್ ರೊಟ್ಟಿ ಐತಿ ಏನ್ರಿ?
    tr: Avvā, nā Imrān rī, Kalaburagiyāṃva. Jōḷada roṭṭi andra nā ellārakkinta modalu bartēni. Khaḍak roṭṭi aiti ēnri?
    en: Avva, it's Imran, the one from Kalaburagi. For jowar rotti I'll be the first to arrive. Is there crisp khadak rotti?
  - who: amma
    t: ಕಲಬುರಗಿಯವ್ರಾ? ಮತ್ತೇನ್, ಖಡಕ್ ರೊಟ್ಟಿನೂ ಐತಿ, ಮೆತ್ತನ್ನ ರೊಟ್ಟಿನೂ ಐತಿ. ನೀ ಡಾಕ್ಟ್ರು ಅಂತ ಪ್ರಕಾಶ ಹೇಳಿದ್ದ. ಬಾರಪ್ಪಾ, ನನ್ ಮೊಣಕಾಲು ನೋವಿಗೆ ಏನರೆ ಹೇಳುವಂತಿ.
    tr: Kalaburagiyavrā? Mattēn, khaḍak roṭṭinū aiti, mettanna roṭṭinū aiti. Nī ḍākṭru anta Prakāśa hēḷidda. Bārappā, nan moṇakālu nōvige ēnare hēḷuvanti.
    en: From Kalaburagi? Of course, there's crisp rotti and soft rotti both. Prakash told me you're a doctor. Come, son, you can tell me something for my knee pain.
  - who: prakash
    t: ಆತು ಅವ್ವಾ, ಇಡು ಈಗ. ಡ್ರೈವ್ ಮಾಡೋವ್ರಿಗೆ ತೊಂದರಿ ಆಗ್ತದ.
    tr: Ātu avvā, iḍu īga. Ḍraiv māḍōvrige tondari āgtada.
    en: All right, Avva, hang up now. It's distracting for the driver.
  - who: arjun
    t: ನಿಮ್ಮಮ್ಮ ಸಕ್ಕತ್ ಸ್ವೀಟ್ ಗುರು. ‘ಲಗೂನ ಬರ್ರಿ’ — ಕೇಳೋಕೇ ಎಷ್ಟು ಚೆನ್ನಾಗಿದೆ.
    tr: Nimmamma sakkat svīṭ guru. ‘Lagūna barri’ — kēḷōkē eṣṭu cennāgide.
    en: Your mother's really sweet, man. ‘Lagūna barri’ — it sounds so lovely.
  - who: prakash
    t: ಹೂಂ. ಛಲೋ ಐತ್ರಿ, ಅರ್ಜುನ್ ಅವರೇ.
    tr: Hūṃ. Chalō aitri, Arjun avarē.
    en: Hm. It is nice, Arjun-avare.
  - scene: A silence. Arjun looks at Prakash in the mirror; Prakash looks out of the window at the sunflower fields.
  - who: imran
    t: ಏನಪಾ, ಏಸಿ ಆಫ್ ಮಾಡು. ಕಾರಿನ್ಯಾಗ ವಾತಾವರಣ ಆಗ್ಲೇ ಭಾಳ ತಣ್ಣಗ ಐತಿ.
    tr: Ēnapā, ēsi āph māḍu. Kārinyāga vātāvaraṇa āglē bhāḷa taṇṇaga aiti.
    en: Hey, switch the AC off. The atmosphere in this car is chilly enough already.
  - who: shruti
    t: ಡಾಕ್ಟ್ರೇ, ನಿಮ್ ಡಯಾಗ್ನೋಸಿಸ್ ಯಾವಾಗ್ಲೂ ಕರೆಕ್ಟ್. ಅರ್ಜುನ್, ರೋಡ್ ನೋಡು, ಬೈಪಾಸ್‌ನಲ್ಲಿ ಲಾರಿಗಳು ಬೇಜಾನ್ ಇವೆ.
    tr: Ḍākṭrē, nim ḍayāgnōsis yāvāglū karekṭ. Arjun, rōḍ nōḍu, baipās-nalli lārigaḷu bējān ive.
    en: Doctor, your diagnosis is always right. Arjun, watch the road, there are loads of lorries on the bypass.
  - scene: Imran's phone buzzes. He answers at once, his voice changing into the ward voice.
  - who: imran
    t: ಹಲೋ… ಹಾಂ ಸಿಸ್ಟರ್, ಹೇಳ್ರಿ. ಬೆಡ್ ನಂಬರ್ ಹನ್ನೆರಡು? ಸ್ಯಾಚುರೇಷನ್ ಎಷ್ಟು ಐತಿ? ತೊಂಬತ್ತೆರಡಾ? ಎರಡು ಲೀಟರ್ ಆಕ್ಸಿಜನ್ ಕೊಡ್ರಿ, ಡ್ಯೂಟಿ ಡಾಕ್ಟರ್‌ಗೆ ನಾ ಹೇಳೀನಿ ಅಂತ ಹೇಳ್ರಿ. ಏನರೆ ಆದ್ರ ಮತ್ತೆ ಕಾಲ್ ಮಾಡ್ರಿ.
    tr: Halō… hāṃ sisṭar, hēḷri. Beḍ nambar hanneraḍu? Syācurēṣan eṣṭu aiti? Tombatteraḍā? Eraḍu līṭar āksijan koḍri, ḍyūṭi ḍākṭar-ge nā hēḷīni anta hēḷri. Ēnare ādra matte kāl māḍri.
    en: Hello… yes, Sister, tell me. Bed number twelve? What's the saturation? Ninety-two? Give two litres of oxygen and tell the duty doctor I said so. If anything happens, call me again.
  - who: shruti
    t: ರಜೆಯಲ್ಲೂ ಫೋನಾ? ಇಮ್ರಾನ್, ನಿನ್ನೆಯಿಂದ ಇದು ಐದನೇ ಕಾಲ್.
    tr: Rajeyallū phōnā? Imrān, ninneyinda idu aidanē kāl.
    en: Phone calls even on leave? Imran, this is the fifth call since yesterday.
  - who: imran
    t: ಏನ್ ಮಾಡೂದು ಶ್ರುತಿ. ನಮ್ ಜಿಲ್ಲಾ ಆಸ್ಪತ್ರಿ ಮೆಡಿಸಿನ್ ವಾರ್ಡಿಗೆ ಇಬ್ರೇ ಡಾಕ್ಟರು. ನಾ ಎತ್ತಲಿಲ್ಲಂದ್ರ ಯಾರ ಎತ್ತತಾರ? ಬಿಡು, ಅದರ ಕತಿ ಆಮೇಲೆ.
    tr: Ēn māḍūdu Śruti. Nam jillā āspatri meḍisin vārḍige ibrē ḍākṭaru. Nā ettalillandra yāra ettatāra? Biḍu, adara kati āmēle.
    en: What can I do, Shruti? Our district hospital has only two doctors for the medicine ward. If I don't pick up, who will? Leave it, that story's for later.
  - section: Amma's kitchen
    learn: 'a North Karnataka welcome: barri, kāl toḷakoṇḍu oḷaga barri, kundri, uṇri · the meal: jōḷada roṭṭi (khaḍak / mettanna), eṇṇagāyi, kāḷu palya, śēṅgā caṭni, uḷḷāgaḍḍi · Dharwad pedha and the GI tag · a guest is god: manige bandavru dēvru iddaṅga · a mother''s proverb: saṇṇa uriyāga bēyisidranē ruci'
  - scene: One o'clock. Saptapur, Dharwad. An old two-storey house with a tulsi pot in the yard and a neem tree over the gate. Prakash's mother waits at the door with a plate of kumkum and a small lamp.
  - who: amma
    t: ಬರ್ರಿ ಬರ್ರಿ! ಕಾರು ಇಲ್ಲೇ ನಿಲ್ಲಿಸ್ರಿ. ಕಾಲು ತೊಳಕೊಂಡು ಒಳಗ ಬರ್ರಿ. ಎವ್ವಾ, ಎಷ್ಟು ಮಂದಿ! ಮನಿ ತುಂಬಿ ಹೋತು.
    tr: Barri barri! Kāru illē nillisri. Kālu toḷakoṇḍu oḷaga barri. Evvā, eṣṭu mandi! Mani tumbi hōtu.
    en: Come in, come in! Park the car right here. Wash your feet and come inside. My goodness, so many of you! The house is full.
  - who: deepa
    t: ನಮಸ್ಕಾರ ಆಂಟಿ. ನಿನ್ನೆ ಫೋನಲ್ಲಿ ಮಾತಾಡಿದ ದೀಪಾ ನಾನೇ. ನೋಡಿ, ಹೇಳಿದ ಹಾಗೇ ತೊಂದರೆ ಕೊಡೋಕೆ ಎಂಟೂ ಜನ ಬಂದ್ಬಿಟ್ವಿ.
    tr: Namaskāra āṇṭi. Ninne phōnalli mātāḍida Dīpā nānē. Nōḍi, hēḷida hāgē tondare koḍōke eṇṭū jana bandbiṭvi.
    en: Namaskara, Auntie. I'm Deepa — the one from the phone yesterday. See, all eight of us have turned up to give you the trouble I warned you about.
  - who: amma
    t: ಫೋನಿನ್ಯಾಗೂ ಹೇಳಿದ್ನೆಲ್ಲವ್ವಾ, ತೊಂದರಿ ಏನೂ ಇಲ್ಲ. ಮನಿಗೆ ಬಂದವ್ರು ದೇವ್ರು ಇದ್ದಂಗ. ಕುಂದ್ರರಿ, ಮೊದಲು ಉಣ್ರಿ, ಮಾತು ಆಮೇಲೆ.
    tr: Phōninyāgū hēḷidnellavvā, tondari ēnū illa. Manige bandavru dēvru iddaṅga. Kundrari, modalu uṇri, mātu āmēle.
    en: Didn't I tell you on the phone, dear? No trouble at all. Whoever comes to the house is like God. Sit down, eat first, talk later.
  - who: naveen
    t: ಅಮ್ಮಾ, ಇದು ಉಡುಪಿಯಿಂದ ತಂದ ಸ್ವಲ್ಪ ಗೋಡಂಬಿ ಉಂಟು. ನಮ್ಮ ಹೋಟೆಲ್ ಹತ್ತಿರದ ಫ್ಯಾಕ್ಟರಿಯದ್ದು. ನಿಮಗೆ.
    tr: Ammā, idu Uḍupiyinda tanda svalpa gōḍambi uṇṭu. Namma hōṭel hattirada phyākṭariyaddu. Nimage.
    en: Amma, here's a little cashew I brought from Udupi. From the factory near our hotel. For you.
  - who: amma
    t: ಯಾಕಪ್ಪಾ ಇದೆಲ್ಲಾ? ಆದ್ರೂ ಛಲೋ ಮಾಡಿದಿ. ತಗೋ, ಮೊದಲು ಬಾಯಿ ಸಿಹಿ ಮಾಡ್ಕೋ. ಧಾರವಾಡ ಪೇಡೆ, ಠಾಕೂರರ ಅಂಗಡಿಂದ ನಿನ್ನೆನೇ ತರಿಸಿ ಇಟ್ಟೇನಿ.
    tr: Yākappā idellā? Ādrū chalō māḍidi. Tagō, modalu bāyi sihi māḍkō. Dhāravāḍa pēḍe, Ṭhākūrara aṅgaḍinda ninnenē tarisi iṭṭēni.
    en: Why all this, son? Still, that was kind of you. Here, sweeten your mouth first. Dharwad pedha — I had it fetched from Thakur's shop yesterday.
  - who: ramya
    t: ಅಬ್ಬಾ! ಎಂತ ಮರ್ರೆ ಈ ಪೇಡೆ! ಬಾಯಿಗೆ ಹಾಕುದೇ ತಡ, ಕರಗಿ ಹೋಯ್ತ್. ಇನ್ನೊಂದು ಕೊಡಿ ಆಂಟಿ, ಕ್ಯಾಮೆರಾಕ್ಕೆ ಅಲ್ಲ, ನನಗೇ.
    tr: Abbā! Enta marre ī pēḍe! Bāyige hākudē taḍa, karagi hōyt. Innondu koḍi āṇṭi, kyāmerākke alla, nanagē.
    en: Wow! What a pedha, marre! The moment it touches your tongue, it melts. Give me another one, Auntie — not for the camera, for me.
  - who: kaveri
    t: ಜಿಐ ಟ್ಯಾಗ್ ಸುಮ್ಮನೆ ಸಿಕ್ಕಿಲ್ಲ. ಎರಡು ಸಾವಿರದ ಏಳರಲ್ಲಿ ಬಂದಿದ್ದು, ಅಲ್ವಾ ಪ್ರಕಾಶ್?
    tr: Ji-ai ṭyāg summane sikkilla. Eraḍu sāvirada ēḷaralli bandiddu, alvā Prakāś?
    en: It didn't get the GI tag for nothing. That came in 2007, didn't it, Prakash?
  - who: prakash
    t: ಹೌದ್ರಿ. ನೋಡ್ರಿ, ಲಾಯರ್ ಮೇಡಂಗೆ ಪೇಡೆದೂ ಜಡ್ಜ್‌ಮೆಂಟ್ ಡೇಟ್ ಗೊತ್ತೈತಿ!
    tr: Haudri. Nōḍri, lāyar mēḍaṃge pēḍedū jaḍjmeṇṭ ḍēṭ gottaiti!
    en: Yes. Look at that — our lawyer madam even knows the judgment date for the pedha!
  - scene: The friends sit on a long mat in the hall. Plates are set down. Amma serves, refusing all help.
  - who: amma
    t: ಇದು ಖಡಕ್ ರೊಟ್ಟಿ, ಇದು ಬಿಸಿ ರೊಟ್ಟಿ. ಎಣ್ಣಗಾಯಿ, ಕಾಳು ಪಲ್ಯ, ಶೇಂಗಾ ಚಟ್ನಿ, ಮೊಸರು, ಉಳ್ಳಾಗಡ್ಡಿ. ನಾಚಿಕಿ ಮಾಡಬ್ಯಾಡ್ರಿ, ಕೈಯಿಂದ ಮುರಿದು ಉಣ್ರಿ.
    tr: Idu khaḍak roṭṭi, idu bisi roṭṭi. Eṇṇagāyi, kāḷu palya, śēṅgā caṭni, mosaru, uḷḷāgaḍḍi. Nāciki māḍabyāḍri, kaiyinda muridu uṇri.
    en: This is crisp rotti, this is hot rotti. Stuffed brinjal, sprouted-gram curry, peanut chutney, curd, raw onion. Don't be shy — break it with your hands and eat.
  - who: arjun
    t: ಆಂಟಿ, ಎಣ್ಣಗಾಯಿ ಬೊಂಬಾಟ್! ಬೆಂಗಳೂರಲ್ಲಿ ನಾರ್ತ್ ಕರ್ನಾಟಕ ಮೆಸ್ ಅಂತ ಹೋಗ್ತೀವಿ, ಆದ್ರೆ ಈ ರುಚಿ ಎಲ್ಲೂ ಸಿಗಲ್ಲ.
    tr: Āṇṭi, eṇṇagāyi bombāṭ! Beṅgaḷūralli nārth Karnāṭaka mes anta hōgtīvi, ādre ī ruci ellū sigalla.
    en: Auntie, the brinjal is fantastic! In Bengaluru we go to 'North Karnataka mess' places, but you never get this taste.
  - who: amma
    t: ಅಂದ್ರ ಫೋನಿನ್ಯಾಗ ಕಡಿಮಿ ಖಾರ ಕೇಳಿದಾಂವ ನೀನೇ, ಅರ್ಜುನಾ? ದೊಡ್ಡ ಕಂಪನಿ ಮಾಡಿದಾಂವ? ಕಾಲೇಜಿನ್ಯಾಗ ನೀನೇ ನನ್ ಮಗಂಗ ಇಂಗ್ಲೀಷ್ ಮಾತಾಡೂದು ಕಲಿಸಿದಿ ಅಂತ ಪ್ರಕಾಶ ಹೇಳ್ತಿದ್ದ.
    tr: Andra phōninyāga kaḍimi khāra kēḷidāṃva nīnē, Arjunā? Doḍḍa kampani māḍidāṃva? Kālējinyāga nīnē nan magaṅga iṅglīṣ mātāḍūdu kalisidi anta Prakāśa hēḷtidda.
    en: So you're the one who asked for less spice on the phone, Arjun? The one who built the big company? Prakash used to say it was you who taught my son to speak English in college.
  - scene: Arjun stops eating. Prakash keeps his eyes on his plate.
  - who: arjun
    t: ಹಾಂ… ಹೌದು ಆಂಟಿ. ಆದ್ರೆ ನಿಜ ಹೇಳ್ಬೇಕು ಅಂದ್ರೆ, ಅವ್ನು ನನಗೆ ಕಲಿಸಿದ್ದೇ ಜಾಸ್ತಿ.
    tr: Hāṃ… haudu āṇṭi. Ādre nija hēḷbēku andre, avnu nanage kalisiddē jāsti.
    en: Uh… yes, Auntie. But to tell you the truth, he taught me far more.
  - who: amma
    t: ಕಂಪನಿ ಹೆಂಗ ನಡದೈತಿ? ಎಷ್ಟು ಮಂದಿ ಕೆಲಸ ಮಾಡ್ತಾರ ನಿನ್ ಕೆಳಗ?
    tr: Kampani heṅga naḍadaiti? Eṣṭu mandi kelasa māḍtāra nin keḷaga?
    en: How is the company doing? How many people work under you?
  - who: arjun
    t: ನಡೀತಿದೆ ಆಂಟಿ… ಇಪ್ಪತ್ತು-ಇಪ್ಪತ್ತೈದು ಜನ ಇದ್ದಾರೆ.
    tr: Naḍītide āṇṭi… ippattu-ippattaidu jana iddāre.
    en: It's going, Auntie… there are twenty, twenty-five people.
  - who: naveen
    t: ನಡೀತಿದೆ. ಹೇಗೆ ನಡೀತಿದೆ ಅಂತ ದೇವರಿಗೇ ಗೊತ್ತು.
    tr: Naḍītide. Hēge naḍītide anta dēvarigē gottu.
    en: It's going. How it's going, only God knows.
  - scene: Ramya and Kaveri exchange a look. Amma, not hearing the edge, turns to Deepa.
  - who: amma
    t: ನೀನು ದೀಪಾ ಅಲ್ಲವ್ವಾ? ಮದುವಿ ಆಗೇತಿ? ಯಜಮಾನ್ರು ಬರಲಿಲ್ಲೇನು?
    tr: Nīnu Dīpā allavvā? Maduvi āgēti? Yajamānru baralillēnu?
    en: You're Deepa, aren't you, dear? Are you married? Didn't your husband come?
  - who: deepa
    t: ಅವರು… ಬರೋಕಾಗ್ಲಿಲ್ಲ ಆಂಟಿ. ಕೆಲಸ.
    tr: Avaru… barōkāglilla āṇṭi. Kelasa.
    en: He… couldn't come, Auntie. Work.
  - who: shruti
    t: ಆಂಟಿ, ಈ ಚಟ್ನಿ ಹೇಗೆ ಮಾಡ್ತೀರಿ ಹೇಳಿ? ನಮ್ ಮನೇಲಿ ಶೇಂಗಾ ಹುರಿದ್ರೆ ಯಾವಾಗ್ಲೂ ಸೀದು ಹೋಗುತ್ತೆ.
    tr: Āṇṭi, ī caṭni hēge māḍtīri hēḷi? Nam manēli śēṅgā huridre yāvāglū sīdu hōgutte.
    en: Auntie, tell me how you make this chutney. At our place, whenever we roast peanuts they always burn.
  - who: amma
    t: ಶೇಂಗಾ ಸಣ್ಣ ಉರಿಯಾಗ ಹುರೀಬೇಕವ್ವಾ. ಗಡಿಬಿಡಿ ಮಾಡಿದ್ರ ಸೀದು ಹೋಗ್ತದ. ಆಮೇಲೆ ಬೆಳ್ಳುಳ್ಳಿ, ಖಾರದ ಪುಡಿ, ಉಪ್ಪು ಹಾಕಿ ಒರಳಾಗ ಕುಟ್ಟಬೇಕು, ಮಿಕ್ಸಿ ಅಲ್ಲ. ಜೀವನನೂ ಹಂಗೇ. ಸಣ್ಣ ಉರಿಯಾಗ ಬೇಯಿಸಿದ್ರನೇ ರುಚಿ.
    tr: Śēṅgā saṇṇa uriyāga hurībēkavvā. Gaḍibiḍi māḍidra sīdu hōgtada. Āmēle beḷḷuḷḷi, khārada puḍi, uppu hāki oraḷāga kuṭṭabēku, miksi alla. Jīvananū haṅgē. Saṇṇa uriyāga bēyisidranē ruci.
    en: You must roast peanuts on a low flame, dear. Rush it and they burn. Then garlic, chilli powder, salt, and you pound it in the stone mortar — not the mixie. Life is the same. Only what's cooked on a low flame tastes good.
  - who: deepa
    t: ಸಣ್ಣ ಉರಿಯಲ್ಲಿ… ನೆನಪಿಟ್ಕೋತೀನಿ ಆಂಟಿ.
    tr: Saṇṇa uriyalli… nenapiṭkōtīni āṇṭi.
    en: On a low flame… I'll remember that, Auntie.
  - who: amma
    t: ನೀವಾದ್ರೂ ಇವಂಗ ಹೇಳ್ರಿ, ಇನ್ನೊಮ್ಮೆ ಕೆಎಎಸ್ ಬರೀಲಿ ಅಂತ. ಎರಡು ಸಲ ಆಗಲಿಲ್ಲ ಅಂತ ಪುಸ್ತಕ ಕಟ್ಟಿ ಮ್ಯಾಲೆ ಇಟ್ಟು ಕುಂತಾನ.
    tr: Nīvādrū ivaṅga hēḷri, innomme ke-e-es barīli anta. Eraḍu sala āgalilla anta pustaka kaṭṭi myāle iṭṭu kuntāna.
    en: At least you people tell him to sit the KAS once more. Because it didn't work out twice, he's tied up his books and put them up on the shelf.
  - who: prakash
    t: ಅವ್ವಾ, ಊಟದ ಹೊತ್ತಿನ್ಯಾಗ ಅದ್ಯಾಕ? ನಾ ಮಾಸ್ತರ ಅದೇನಿ. ಅದೂ ಸರ್ಕಾರಿ ನೌಕರಿನೇ.
    tr: Avvā, ūṭada hottinyāga adyāka? Nā māstara adēni. Adū sarkāri naukarinē.
    en: Avva, why bring that up at mealtime? I'm a teacher. That's a government job too.
  - who: amma
    t: ಮಾಸ್ತರ ಆಗಿದ್ದು ಹೆಮ್ಮೆನೇ ಪ್ಪಾ. ಆದ್ರ ನೀ ರಾತ್ರಿ ಎರಡು ಗಂಟೆತನಕ ದೀಪ ಹಚ್ಚಿ ಓದ್ತಿದ್ದದ್ದು ನಾ ನೋಡೇನಿ. ಆ ಕನಸು ನಿಂದು, ನಂದಲ್ಲ.
    tr: Māstara āgiddu hemmenē ppā. Ādra nī rātri eraḍu gaṇṭetanaka dīpa hacci ōdtiddaddu nā nōḍēni. Ā kanasu nindu, nandalla.
    en: Being a teacher is something to be proud of, son. But I've seen you studying with the lamp on till two in the morning. That dream is yours, not mine.
  - who: imran
    t: ಅವ್ವಾ ಬರೋಬ್ಬರಿ ಹೇಳಿದ್ರು ನೋಡಪಾ. ಇದರ ಮ್ಯಾಲೆ ಅಪೀಲ್ ಇಲ್ಲ.
    tr: Avvā barōbbari hēḷidru nōḍapā. Idara myāle apīl illa.
    en: Avva's hit it spot on, you see. There's no appeal against that.
  - section: Girmit on the terrace
    learn: 'evening snacks: girmiṭ, mirci bajji, oggaraṇe · the KPSC exam ladder: prilims, mēns, vyaktitva parīkṣe / iṇṭarvyū, gejeṭeḍ prōbeṣanars · near misses: mūru aṅkadinda tappitu, pāsāgalilla · fear of sounding rural: nan kannaḍa haḷḷi ansutta · a teacher''s pride: nan sāli huḍugi, rāṅk'
  - scene: Five in the evening. The flat roof of the house. Prakash comes up the stairs with two newspaper cones of girmit and a packet of mirchi bajji from the stall at the corner.
  - who: prakash
    t: ತಗೊಳ್ರಿ, ಗಿರ್ಮಿಟ್. ಮಂಡಕ್ಕಿಗೆ ಈರುಳ್ಳಿ, ಟೊಮ್ಯಾಟೋ, ಹುಣಿಸೆ ರಸ, ಮ್ಯಾಲೆ ಶೇವ್. ಜೊತಿಗೆ ಮಿರ್ಚಿ ಬಜ್ಜಿ. ಧಾರವಾಡದ ಸಂಜಿ ಅಂದ್ರ ಇದೇ.
    tr: Tagoḷri, girmiṭ. Maṇḍakkige īruḷḷi, ṭomyāṭō, huṇise rasa, myāle śēv. Jotige mirci bajji. Dhāravāḍada sañji andra idē.
    en: Here, take some girmit. Puffed rice with onion, tomato, tamarind water, sev on top. And mirchi bajji with it. This is what a Dharwad evening means.
  - who: naveen
    t: ನಮ್ಮಲ್ಲಿ ಸಂಜೆ ಗೋಳಿಬಜೆ, ನಿಮ್ಮಲ್ಲಿ ಗಿರ್ಮಿಟ್. ಕರ್ನಾಟಕ ಒಂದೇ ರಾಜ್ಯ ಅಂತ ಹೇಳುವುದು ಸುಲಭ ಮಾರಾಯ, ಹೊಟ್ಟೆಗೆ ಮಾತ್ರ ಮೂವತ್ತು ರಾಜ್ಯ.
    tr: Nammalli sañje gōḷibaje, nimmalli girmiṭ. Karnāṭaka ondē rājya anta hēḷuvudu sulabha mārāya, hoṭṭege mātra mūvattu rājya.
    en: Back home our evening is goli baje, here it's girmit. It's easy to say Karnataka is one state, mārāya — for the stomach it's thirty.
  - who: kaveri
    t: ಪ್ರಕಾಶ್, ಕೆಳಗೆ ಅಮ್ಮ ಹೇಳಿದ್ದು ನಿಜವಾ? ಎರಡು ಸಲ ಎಲ್ಲಿವರೆಗೆ ಹೋಗಿದ್ರಿ?
    tr: Prakāś, keḷage amma hēḷiddu nijavā? Eraḍu sala ellivarege hōgidri?
    en: Prakash, is what Amma said downstairs true? How far did you get, both times?
  - who: prakash
    t: ಮೊದಲನೇ ಸಲ ಪ್ರಿಲಿಮ್ಸ್ ಪಾಸ್ ಆದೆ, ಮೇನ್ಸ್‌ನ್ಯಾಗ ಎಸ್ಸೇ ಪೇಪರ್ ಹಾಳಾತು. ಎರಡನೇ ಸಲ ಮೇನ್ಸ್‌ನೂ ಪಾಸ್ ಆದೆ. ಕೊನೇ ಮೆಟ್ಟಿಲು, ವ್ಯಕ್ತಿತ್ವ ಪರೀಕ್ಷೆ — ಇಂಟರ್‌ವ್ಯೂ. ಅಲ್ಲಿ ಬಿದ್ದೆ.
    tr: Modalanē sala prilims pās āde, mēns-nyāga essē pēpar hāḷātu. Eraḍanē sala mēns-nū pās āde. Konē meṭṭilu, vyaktitva parīkṣe — iṇṭarvyū. Alli bidde.
    en: The first time I cleared the prelims and the essay paper in the mains went bad. The second time I cleared the mains too. The last step, the personality test — the interview. That's where I fell.
  - who: ramya
    t: ಎರಡನೇ ಸಲ ಅಂದ್ರೆ ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ನಾಲ್ಕರ ಪ್ರಿಲಿಮ್ಸಾ? ಕನ್ನಡ ಅನುವಾದದಲ್ಲಿ ತಪ್ಪುಗಳು ಅಂತ ಗಲಾಟೆ ಆಗಿ ಮತ್ತೆ ಪರೀಕ್ಷೆ ಮಾಡಿದ್ರಲ್ಲ, ಅದು? ನಮ್ ಚಾನೆಲ್‌ನಲ್ಲಿ ಒಂದು ವಾರ ಅದೇ ಸ್ಟೋರಿ.
    tr: Eraḍanē sala andre eraḍu sāvirada ippatnālkara prilimsā? Kannaḍa anuvādadalli tappugaḷu anta galāṭe āgi matte parīkṣe māḍidralla, adu? Nam cānel-nalli ondu vāra adē sṭōri.
    en: The second time means the 2024 prelims? The one where there was an uproar over errors in the Kannada translation and they held the exam again? Our channel ran that story for a whole week.
  - who: prakash
    t: ಅದೇ. ಕನ್ನಡದಾಗ ಬರೆಯೋ ನಮ್ಮಂಥವರಿಗೆ ಪ್ರಶ್ನೆನೇ ಅರ್ಥ ಆಗಲಾರದಂಗ ಅನುವಾದ. ಅದನ್ನೂ ದಾಟಿದೆ. ಇಂಟರ್‌ವ್ಯೂನ್ಯಾಗ ಮೂರು-ನಾಕು ಅಂಕದಿಂದ ತಪ್ಪಿತು ಅಂತ ಆಮೇಲೆ ಗೊತ್ತಾತು.
    tr: Adē. Kannaḍadāga bareyō nammanthavarige praśnenē artha āgalāradaṅga anuvāda. Adannū dāṭide. Iṇṭarvyūnyāga mūru-nāku aṅkadinda tappitu anta āmēle gottātu.
    en: That one. A translation so bad that people like us who write in Kannada couldn't even understand the questions. I got past that too. Later I found out I missed it by three or four marks in the interview.
  - who: shruti
    t: ಮೂರು-ನಾಲ್ಕು ಅಂಕ? ಅಯ್ಯೋ… ಇಂಟರ್‌ವ್ಯೂನಲ್ಲಿ ಏನಾಯ್ತು?
    tr: Mūru-nālku aṅka? Ayyō… iṇṭarvyūnalli ēnāytu?
    en: Three or four marks? Oh no… what happened in the interview?
  - who: prakash
    t: 'ಖರೇ ಹೇಳಲೇನು? ಬೋರ್ಡ್ ಮುಂದ ಕುಂತಾಗ ನನ್ ಮನಸ್ಸಿನ್ಯಾಗ ಒಂದೇ ಪ್ರಶ್ನೆ: ಇಂಗ್ಲೀಷ್‌ನ್ಯಾಗ ಉತ್ತರ ಕೊಡ್ಲಾ, ಕನ್ನಡದಾಗಾ? ಕನ್ನಡದಾಗ ಕೊಟ್ರ ನನ್ ಮಾತು ‘ಹಳ್ಳಿ’ ಅನ್ಸತೈತೇನೋ ಅಂತ ಭಯ. ಆ ಗೊಂದಲದಾಗೇ ಅರ್ಧ ಉತ್ತರ ಮರೆತೆ.'
    tr: 'Kharē hēḷalēnu? Bōrḍ munda kuntāga nan manassinyāga ondē praśne: iṅglīṣ-nyāga uttara koḍlā, kannaḍadāgā? Kannaḍadāga koṭra nan mātu ‘haḷḷi’ ansataitēnō anta bhaya. Ā gondaladāgē ardha uttara marete.'
    en: 'Shall I tell you the truth? Sitting in front of the board, there was one question in my head: do I answer in English or in Kannada? If I answer in Kannada, will my speech sound ''village''? I was afraid of that. In that confusion I forgot half my answers.'
  - scene: Nobody looks at Arjun. Arjun looks at the girmit in his hand and says nothing.
  - who: imran
    t: ಯಪ್ಪಾ, ಆ ಭಯ ನಂಗೂ ಗೊತ್ತೈತಿ. ಚಿತ್ರದುರ್ಗದಾಗ ಎಂಬಿಬಿಎಸ್ ಕ್ಲಾಸಿನ ಕಥಿ ಹೇಳಿದ್ನೆಲ್ಲ? ಪೀಜಿಯಾಗೂ ಅದೇ. ಆಮೇಲೆ ಇಂಗ್ಲೀಷ್‌ನ್ಯಾಗೇ ಮಾತಾಡೂದು ಶುರು ಮಾಡಿದೆ. ಸೇಫ್ ಅನ್ನಿಸ್ತಿತ್ತು.
    tr: Yappā, ā bhaya naṅgū gottaiti. Chitradurgadāga em-bi-bi-es klāsina kathi hēḷidnella? Pījiyāgū adē. Āmēle iṅglīṣ-nyāgē mātāḍūdu śuru māḍide. Sēph annistittu.
    en: Man, I know that fear too. I told you the MBBS-class story at Chitradurga, didn't I? Same thing in my PG. After that I started speaking only in English. It felt safe.
  - who: kaveri
    t: ಭಾಷೆ ಸರಿ ಇತ್ತು, ಇಮ್ರಾನ್. ನಗ್ತಿದ್ದವರ ತಿಳುವಳಿಕೆ ಸರಿ ಇರ್ಲಿಲ್ಲ. ಎರಡೂ ಒಂದೇ ಅಲ್ಲ.
    tr: Bhāṣe sari ittu, Imrān. Nagtiddavara tiḷuvaḷike sari irlilla. Eraḍū ondē alla.
    en: There was nothing wrong with the language, Imran. What was wrong was the understanding of the people laughing. The two aren't the same.
  - who: deepa
    t: ಪ್ರಕಾಶ್, ಮೂರನೇ ಸಲ ಬರೀತೀಯಾ? ಅಮ್ಮ ಹೇಳಿದ ಹಾಗೆ, ಆ ಕನಸು ನಿಂದು.
    tr: Prakāś, mūranē sala barītīyā? Amma hēḷida hāge, ā kanasu nindu.
    en: Prakash, will you write it a third time? Like Amma said, that dream is yours.
  - who: prakash
    t: ಗೊತ್ತಿಲ್ಲ ದೀಪಾ. ಮೂವತ್ನಾಲ್ಕು ವರ್ಷ. ಸಾಲಿ, ಮನಿ, ಅವ್ವನ ಆರೋಗ್ಯ… ಮತ್ತೆ ಎರಡು ವರ್ಷ ರಾತ್ರಿ ಎರಡು ಗಂಟೆತನಕ ಓದೋ ಶಕ್ತಿ ಐತೇನೋ ನೋಡಬೇಕು.
    tr: Gottilla Dīpā. Mūvatnālku varṣa. Sāli, mani, avvana ārōgya… matte eraḍu varṣa rātri eraḍu gaṇṭetanaka ōdō śakti aitēnō nōḍabēku.
    en: I don't know, Deepa. I'm thirty-four. School, home, Avva's health… I have to see whether I still have the strength to study till two at night for another two years.
  - who: shruti
    t: ಸರಿ, ಕೆಎಎಸ್ ಬಿಡು ಒಂದು ನಿಮಿಷ. ಮಾಸ್ತರ್ ಆಗಿ ನಿನಗೆ ಏನು ಖುಷಿ ಕೊಡುತ್ತೆ ಅದನ್ನ ಹೇಳು.
    tr: Sari, ke-e-es biḍu ondu nimiṣa. Māstar āgi ninage ēnu khuṣi koḍutte adanna hēḷu.
    en: OK, forget the KAS for a minute. Tell us what makes you happy as a teacher.
  - who: prakash
    t: ಅದಾ? ನನ್ ಸಾಲಿ ಹುಡುಗಿ ಒಬ್ಬಾಕಿ, ಅಪ್ಪ ಗೌಂಡಿ ಕೆಲಸ ಮಾಡ್ತಾನ. ಈ ವರ್ಷ ಎಸ್ಸೆಸ್ಸೆಲ್ಸಿಯಾಗ ಗಣಿತಕ್ಕೆ ನೂರಕ್ಕೆ ನೂರು ತಗೊಂಡ್ಲು. ರಿಸಲ್ಟ್ ದಿನ ಆಕಿ ಅಪ್ಪ ಸಾಲಿಗೆ ಬಂದು ನನ್ ಕಾಲಿಗೆ ಬಿದ್ದ. ಆ ದಿನ ನಾ ಯಾವ ಸಾಹೇಬಗಿಂತ ಕಮ್ಮಿ ಅನ್ನಿಸಲಿಲ್ಲ.
    tr: Adā? Nan sāli huḍugi obbāki, appa gauṇḍi kelasa māḍtāna. Ī varṣa esses-elsiyāga gaṇitakke nūrakke nūru tagoṇḍlu. Risalṭ dina āki appa sālige bandu nan kālige bidda. Ā dina nā yāva sāhēbaginta kammi annisalilla.
    en: That? There's a girl in my school whose father is a mason. This year she got a hundred out of a hundred in maths in the SSLC. On result day her father came to the school and fell at my feet. That day I didn't feel smaller than any officer.
  - who: arjun
    t: ಅದು… ಅದು ಸಕ್ಕತ್ ಆಗಿದೆ ಪ್ರಕಾಶ್. ನಿಜವಾಗ್ಲೂ.
    tr: Adu… adu sakkat āgide Prakāś. Nijavāglū.
    en: That's… that's really something, Prakash. Truly.
  - who: prakash
    t: ಹೂಂ. ಥ್ಯಾಂಕ್ಸ್ ರೀ, ಅರ್ಜುನ್ ಅವರೇ.
    tr: Hūṃ. Thyāṅks rī, Arjun avarē.
    en: Hm. Thank you, Arjun-avare.
  - section: Three in the morning
    learn: 'a doctor''s burnout: suttu dēhakkalla, manassige · symptoms people actually name: nidde bartilla, ede ḍhavaḍhava, kirikiri, yāvudrallū āsakti illa · asking the hard question gently: nēravāgi kēḷtīni, tappu tiḷkōbēḍa · getting help: kaunselar, manōvaidyaru, Ṭeli-Mānas ondu-nālku-nālku-ondu-āru · care from an elder: ariśiṇa hālu, ḍākṭrū manuṣyarē'
  - scene: Past three in the morning. Imran sits alone on the terrace steps, the phone face down beside him. Kaveri comes up with a file she couldn't stop reading; Deepa follows, a shawl around her shoulders.
  - who: kaveri
    t: ಇಮ್ರಾನ್? ಮೂರು ಗಂಟೆ. ಇನ್ನೂ ಮಲಗಿಲ್ವಾ?
    tr: Imrān? Mūru gaṇṭe. Innū malagilvā?
    en: Imran? It's three o'clock. Still not asleep?
  - who: imran
    t: ನಿದ್ದಿ ಬರೂದಿಲ್ಲ ಕಾವೇರಿ. ಆರು ತಿಂಗಳಿಂದ ಹಿಂಗೇ. ಕಣ್ಣು ಮುಚ್ಚಿದ್ರ ವಾರ್ಡ್ ಕಾಣಿಸ್ತದ. ಮಾನಿಟರ್ ಬೀಪ್ ಕೇಳಿಸ್ತದ. ಫೋನ್ ಬಡಿದಿಲ್ಲಂದ್ರೂ ಬಡಿದಂಗ ಅನ್ನಿಸ್ತದ.
    tr: Niddi barūdilla Kāvēri. Āru tiṅgaḷinda hiṅgē. Kaṇṇu muccidra vārḍ kāṇistada. Māniṭar bīp kēḷistada. Phōn baḍidillandrū baḍidaṅga annistada.
    en: Sleep won't come, Kaveri. It's been like this for six months. When I close my eyes I see the ward. I hear the monitor beeping. Even when the phone isn't ringing, it feels like it is.
  - who: deepa
    t: ಏನಾಯ್ತು ಹೇಳು, ಇಮ್ರಾನ್. ನಾವು ಯಾರೂ ಜಡ್ಜ್ ಮಾಡಲ್ಲ.
    tr: Ēnāytu hēḷu, Imrān. Nāvu yārū jaḍj māḍalla.
    en: Tell us what happened, Imran. None of us will judge.
  - who: imran
    t: ದಿನಾ ಓಪಿಡಿಯಾಗ ಮುನ್ನೂರು ಪೇಷಂಟ್, ನಾಕು ಮಂದಿ ಡಾಕ್ಟರು — ಅದು ನಿಮಗ ಗೊತ್ತೈತಿ. ಬ್ಯಾಸಿಗಿಯಾಗ ಬಿಸಿಲು ಹೊಡೆತ, ಮಳಿಗಾಲದಾಗ ಡೆಂಗಿ, ವರ್ಷಪೂರ್ತಿ ಕ್ರಿಮಿನಾಶಕ ಕುಡಿದ ರೈತರು. ಆಗಸ್ಟ್‌ನ್ಯಾಗ ಒಂದೇ ರಾತ್ರಿ ಇಬ್ರು ಹುಡುಗರು ಬಂದ್ರು, ಇಬ್ರೂ ಇಪ್ಪತ್ತರ ಆಸುಪಾಸು. ಒಬ್ಬನ್ನ ಉಳಿಸಿದೆ. ಇನ್ನೊಬ್ಬನ್ನ… ಆಗಲಿಲ್ಲ.
    tr: Dinā ōpiḍiyāga munnūru pēṣaṇṭ, nāku mandi ḍākṭaru — adu nimaga gottaiti. Byāsigiyāga bisilu hoḍeta, maḷigāladāga ḍeṅgi, varṣapūrti krimināśaka kuḍida raitaru. Āgasṭ-nyāga ondē rātri ibru huḍugaru bandru, ibrū ippattara āsupāsu. Obbanna uḷiside. Innobbanna… āgalilla.
    en: Three hundred in OPD every day, four doctors — you know that part. Heatstroke in summer, dengue in the rains, and all year round farmers who've drunk pesticide. In August two boys came in on the same night, both around twenty. I saved one. The other… I couldn't.
  - who: kaveri
    t: ಅದು ನಿನ್ನ ತಪ್ಪಲ್ಲ, ಇಮ್ರಾನ್.
    tr: Adu ninna tappalla, Imrān.
    en: That wasn't your fault, Imran.
  - who: imran
    t: ಗೊತ್ತು. ತಲೆಗೆ ಗೊತ್ತು. ಮನಸ್ಸಿಗೆ ಗೊತ್ತಿಲ್ಲ. ಅದರ ಮಾರನೇ ವಾರ ಒಬ್ಬ ಪೇಷಂಟ್ ಅವ್ವನ ಮ್ಯಾಲೆ ಜೋರಾಗಿ ಚೀರಿದೆ — ಆಕಿ ಪಾಪ, ಬರೇ ‘ರಿಪೋರ್ಟ್ ಯಾವಾಗ’ ಅಂತ ಕೇಳಿದ್ಲು. ಆಮೇಲೆ ವಾಷ್‌ರೂಮಿನ್ಯಾಗ ಹೋಗಿ ಹತ್ತು ನಿಮಿಷ ಅತ್ತೆ. ನಾ ಹಂಗಿದ್ದವ ಅಲ್ಲ ಕಾವೇರಿ.
    tr: Gottu. Talege gottu. Manassige gottilla. Adara māranē vāra obba pēṣaṇṭ avvana myāle jōrāgi cīride — āki pāpa, barē ‘ripōrṭ yāvāga’ anta kēḷidlu. Āmēle vāṣ-rūminyāga hōgi hattu nimiṣa atte. Nā haṅgiddava alla Kāvēri.
    en: I know. My head knows. My heart doesn't. The week after, I shouted at a patient's mother — poor woman, all she asked was 'when will the report come'. Then I went into the washroom and cried for ten minutes. I'm not that kind of person, Kaveri.
  - who: deepa
    t: ಇಮ್ರಾನ್, ಒಂದು ಮಾತು ನೇರವಾಗಿ ಕೇಳ್ತೀನಿ, ತಪ್ಪು ತಿಳ್ಕೋಬೇಡ. ಯಾವತ್ತಾದ್ರೂ ನಿನಗೆ ನೀನೇ ಏನಾದ್ರೂ ಮಾಡ್ಕೋಬೇಕು ಅನ್ನಿಸಿದೆಯಾ?
    tr: Imrān, ondu mātu nēravāgi kēḷtīni, tappu tiḷkōbēḍa. Yāvattādrū ninage nīnē ēnādrū māḍkōbēku annisideyā?
    en: Imran, I'm going to ask you something straight out, don't take it wrongly. Have you ever felt like harming yourself?
  - who: imran
    t: ಇಲ್ಲ ದೀಪಾ. ಆ ತರ ಇಲ್ಲ, ಖರೇ ಹೇಳ್ತೇನಿ. ಆದ್ರ ಬೆಳಿಗ್ಗೆ ಏಳಾಕ ಕಾರಣ ಹುಡುಕಬೇಕಾಗ್ತದ. ಯಾವುದ್ರಾಗೂ ಆಸಕ್ತಿ ಇಲ್ಲ. ಕ್ರಿಕೆಟ್ ನೋಡಿ ಆರು ತಿಂಗಳಾತು — ಆರ್‌ಸಿಬಿ ಎರಡನೇ ಕಪ್ ಗೆದ್ದ ರಾತ್ರಿ ವಾರ್ಡಿನ್ಯಾಗ ನರ್ಸ್‌ಗಳ ಜೊತಿ ಒಂದು ನಿಮಿಷ ಕುಣಿದೆ, ಮರುದಿನ ಬೆಳಿಗ್ಗೆ ಏನೂ ಅನ್ನಿಸಲಿಲ್ಲ. ಆವಾಗಿಂದ ಹಿಂಗೇ.
    tr: Illa Dīpā. Ā tara illa, kharē hēḷtēni. Ādra beḷigge ēḷāka kāraṇa huḍukabēkāgtada. Yāvudrāgū āsakti illa. Krikeṭ nōḍi āru tiṅgaḷātu — Ār-si-bi eraḍanē kap gedda rātri vārḍinyāga nars-gaḷa joti ondu nimiṣa kuṇide, marudina beḷigge ēnū annisalilla. Āvāginda hiṅgē.
    en: No, Deepa. Not like that, I'm telling you honestly. But I have to search for a reason to get up in the morning. Nothing interests me. I haven't watched cricket in six months — the night RCB won their second cup I danced with the nurses in the ward for one minute, and by the next morning I felt nothing. It's been like that ever since.
  - who: kaveri
    t: ಇದು ಸುಸ್ತು ಮಾತ್ರ ಅಲ್ಲ, ಇಮ್ರಾನ್. ನೀನು ಡಾಕ್ಟರ್, ನಿನಗೇ ಗೊತ್ತು ಇದಕ್ಕೆ ಏನು ಹೆಸರು ಅಂತ.
    tr: Idu sustu mātra alla, Imrān. Nīnu ḍākṭar, ninagē gottu idakke ēnu hesaru anta.
    en: This isn't just tiredness, Imran. You're a doctor; you know yourself what this is called.
  - who: imran
    t: ಬರ್ನ್‌ಔಟ್. ಡಿಪ್ರೆಷನ್ ಶುರು ಆಗಿರಬಹುದು. ನಗು ಬರ್ತದ ನೋಡು — ದಿನಾ ಪೇಷಂಟ್‌ಗಳಿಗೆ ಟೆಲಿ-ಮಾನಸ್ ನಂಬರ್ ಬರೆದು ಕೊಡ್ತೇನಿ, ಒಂದು-ನಾಲ್ಕು-ನಾಲ್ಕು-ಒಂದು-ಆರು. ನಾನೇ ಯಾರ ಜೊತೆನೂ ಮಾತಾಡಿಲ್ಲ.
    tr: Barn-auṭ. Ḍipreṣan śuru āgirabahudu. Nagu bartada nōḍu — dinā pēṣaṇṭ-gaḷige Ṭeli-Mānas nambar baredu koḍtēni, ondu-nālku-nālku-ondu-āru. Nānē yāra jotenū mātāḍilla.
    en: 'Burnout. Depression may be starting. It''s funny, you know — every day I write the Tele-MANAS number down for patients: one-four-four-one-six. I''ve never talked to anyone myself.'
  - who: deepa
    t: ನಾನು ಆರು ತಿಂಗಳಿಂದ ಒಬ್ಬ ಕೌನ್ಸೆಲರ್ ಹತ್ರ ಹೋಗ್ತಿದೀನಿ. ವಾರಕ್ಕೊಂದ್ಸಲ. ಅದರಲ್ಲಿ ನಾಚಿಕೆ ಏನೂ ಇಲ್ಲ ಇಮ್ರಾನ್. ಅದಿಲ್ದಿದ್ರೆ ನಾನು ಈ ಟ್ರಿಪ್‌ಗೂ ಬರ್ತಿರ್ಲಿಲ್ಲ.
    tr: Nānu āru tiṅgaḷinda obba kaunselar hatra hōgtidīni. Vārakkondsala. Adaralli nācike ēnū illa Imrān. Adildidre nānu ī ṭrip-gū bartirlilla.
    en: I've been seeing a counsellor for six months. Once a week. There's nothing to be ashamed of in that, Imran. Without it I wouldn't even have come on this trip.
  - who: imran
    t: ನೀನಾ? ಯಾಕ ದೀಪಾ?
    tr: Nīnā? Yāka Dīpā?
    en: You? Why, Deepa?
  - who: deepa
    t: ಅದು ಇನ್ನೊಂದು ದಿನ ಹೇಳ್ತೀನಿ. ಇವತ್ತು ನಿನ್ನ ಸರದಿ.
    tr: Adu innondu dina hēḷtīni. Ivattu ninna saradi.
    en: I'll tell you that another day. Tonight it's your turn.
  - who: kaveri
    t: ಡಾಕ್ಟರ್‌ಗೂ ಡಾಕ್ಟರ್ ಬೇಕು. ಲಾಯರ್‌ಗೂ ಲಾಯರ್ ಬೇಕು. ಬೆಂಗಳೂರಲ್ಲಿ ನಿನ್ನ ಪೀಜಿ ಬ್ಯಾಚ್‌ನಲ್ಲಿ ಯಾರಾದ್ರೂ ಮನೋವೈದ್ಯರು ಇದ್ದಾರಾ?
    tr: Ḍākṭar-gū ḍākṭar bēku. Lāyar-gū lāyar bēku. Beṅgaḷūralli ninna pīji byāc-nalli yārādrū manōvaidyaru iddārā?
    en: A doctor needs a doctor too. A lawyer needs a lawyer. Is there a psychiatrist from your PG batch in Bengaluru?
  - who: imran
    t: ಅದಾಳ. ಸುನೀತಾ, ನಿಮ್ಹಾನ್ಸ್‌ನ್ಯಾಗ. ‘ಯಾವಾಗರೆ ಮಾತಾಡಬೇಕಂದ್ರ ಕಾಲ್ ಮಾಡು’ ಅಂತ ಎರಡು ವರ್ಷದಿಂದ ಹೇಳಾಕತ್ತಾಳ. ನಾ ‘ಆತು ಆತು’ ಅಂತ ಮುಂದ ಹಾಕ್ತಿದ್ದೆ.
    tr: Adāḷa. Sunītā, Nimhāns-nyāga. ‘Yāvāgare mātāḍabēkandra kāl māḍu’ anta eraḍu varṣadinda hēḷākattāḷa. Nā ‘ātu ātu’ anta munda hāktidde.
    en: There is. Sunita, at NIMHANS. For two years she's been saying, 'Call me whenever you need to talk.' I kept putting it off with 'yes, yes'.
  - who: kaveri
    t: ಹಾಗಾದ್ರೆ ಬೆಂಗಳೂರಿಗೆ ವಾಪಸ್ ಹೋದ ಮೇಲೆ ಮೊದಲ ಕೆಲಸ ಅದು. ಪ್ರಾಮಿಸ್?
    tr: Hāgādre Beṅgaḷūrige vāpas hōda mēle modala kelasa adu. Prāmis?
    en: Then that's the first thing you do once we're back in Bengaluru. Promise?
  - who: imran
    t: ಆತು. ಪ್ರಾಮಿಸ್. ಮತ್ತ ರಜಾನೂ ಕೇಳ್ತೇನಿ — ಈ ಸಲ ಖರೇ ರಜಾ, ಫೋನ್ ಸಮೇತ ಬಂದ್.
    tr: Ātu. Prāmis. Matta rajānū kēḷtēni — ī sala kharē rajā, phōn samēta band.
    en: OK. Promise. And I'll ask for leave too — real leave this time, phone switched off and all.
  - scene: A door creaks below. Prakash's mother climbs the stairs slowly, holding three steel tumblers.
  - who: amma
    t: ಯಾಕವ್ವಾ, ನಿದ್ದಿ ಬರವಲ್ತೇನು? ನಾ ಕೆಳಗ ಮಾತು ಕೇಳಿದೆ. ಅರಿಶಿಣ ಹಾಕಿ ಹಾಲು ಕಾಸೇನಿ, ಕುಡೀರಿ.
    tr: Yākavvā, niddi baravaltēnu? Nā keḷaga mātu kēḷide. Ariśiṇa hāki hālu kāsēni, kuḍīri.
    en: What is it, children, can't you sleep? I heard voices from downstairs. I've boiled milk with turmeric — drink it.
  - who: imran
    t: ಅವ್ವಾ, ನೀವ್ಯಾಕ ಎದ್ದೀರಿ? ನಿಮ್ ಮೊಣಕಾಲು…
    tr: Avvā, nīvyāka eddīri? Nim moṇakālu…
    en: Avva, why did you get up? Your knee…
  - who: amma
    t: ಮೊಣಕಾಲು ನೋವು ನನ್ನದು, ಅದು ಹಳೇದು. ನಿನ್ನ ಮುಖದಾಗ ಇರೋ ನೋವು ಹೊಸದು ಪ್ಪಾ. ಡಾಕ್ಟ್ರೂ ಮನುಷ್ಯರೇ. ಮಂದಿನ್ನ ನೋಡ್ಕೊಳ್ಳೋ ಮೊದಲು ನಿನ್ನ ನೀ ನೋಡ್ಕೋ. ಕುಡಿ.
    tr: Moṇakālu nōvu nannadu, adu haḷēdu. Ninna mukhadāga irō nōvu hosadu ppā. Ḍākṭrū manuṣyarē. Mandinna nōḍkoḷḷō modalu ninna nī nōḍkō. Kuḍi.
    en: The knee pain is mine, and it's old. The pain on your face is new, son. Doctors are human too. Before you look after other people, look after yourself. Drink.
  - scene: Imran takes the tumbler with both hands. For the first time in months, he sleeps until eight.
  - chapter: Chapter 7 — The cheque
  - section: Amma's send-off
    learn: 'packing food for the road: butti, dāriyāga uṇri, ḍabbi obbobbarigondu · polite leave-taking: hōgi baratēvi (never just ‘hōgtīvi’), Kundapra hōy batte · a proverb about friendship: dōsti andra hagga iddaṅga, jaggidra gaṇṭu bīḷtada · a blessing: oḷḷēdāgli, artha ādra sāladu, māḍi tōrisu'
  - scene: Monday, 7 December 2026, half past six in the morning. The yard in Saptapur. The cars are packed. Prakash's mother comes out with a cloth bundle and a stack of pedha boxes.
  - who: amma
    t: ಇದು ಬುತ್ತಿ. ಖಡಕ್ ರೊಟ್ಟಿ, ಶೇಂಗಾ ಚಟ್ನಿ, ಉಪ್ಪಿನಕಾಯಿ. ಘಟ್ಟದ ದಾರಿಯಾಗ ಹೋಟ್ಲಾ ಸಿಗಂಗಿಲ್ಲ, ಹಸಿವಾದ್ರ ದಾರಿಯಾಗ ಉಣ್ರಿ. ಪೇಡೆ ಡಬ್ಬಿ ಒಬ್ಬೊಬ್ಬರಿಗೊಂದು.
    tr: Idu butti. Khaḍak roṭṭi, śēṅgā caṭni, uppinakāyi. Ghaṭṭada dāriyāga hōṭlā sigaṅgilla, hasivādra dāriyāga uṇri. Pēḍe ḍabbi obbobbarigondu.
    en: This is a packed meal. Crisp rotti, peanut chutney, pickle. On the ghat road you won't find a hotel, so if you get hungry, eat on the way. One box of pedha each.
  - who: deepa
    t: ಆಂಟಿ, ನೀವು ಎರಡು ದಿನ ನಮಗೋಸ್ಕರ ನಿಂತ್ಕೊಂಡೇ ಇದ್ರಿ. ಹೇಗೆ ಥ್ಯಾಂಕ್ಸ್ ಹೇಳೋದು ಅಂತಾನೇ ಗೊತ್ತಾಗ್ತಿಲ್ಲ.
    tr: Āṇṭi, nīvu eraḍu dina namagōskara nintkoṇḍē idri. Hēge thyāṅks hēḷōdu antānē gottāgtilla.
    en: Auntie, you were on your feet for us for two whole days. I don't even know how to thank you.
  - who: amma
    t: ಥ್ಯಾಂಕ್ಸ್ ಗೀಂಕ್ಸ್ ಬ್ಯಾಡವ್ವಾ. ಮತ್ತೆ ಬರ್ರಿ, ಅಷ್ಟೇ ಸಾಕು. ‘ಹೋಗತೇವಿ’ ಅನಬ್ಯಾಡ್ರಿ, ‘ಹೋಗಿ ಬರತೇವಿ’ ಅನ್ರಿ.
    tr: Thyāṅks gīṅks byāḍavvā. Matte barri, aṣṭē sāku. ‘Hōgatēvi’ anabyāḍri, ‘hōgi baratēvi’ anri.
    en: No need for thanks and all that, dear. Just come again, that's enough. Don't say 'we're going' — say 'we'll go and come back'.
  - who: ramya
    t: ಹೋಗಿ ಬತ್ತೇವೆ ಆಂಟಿ! ನಮ್ ಕುಂದಾಪ್ರದಲ್ಲೂ ಹಾಗೇ — ‘ಹೋಯ್ ಬತ್ತೆ’.
    tr: Hōgi battēve āṇṭi! Nam Kundāpradallū hāgē — ‘hōy batte’.
    en: We'll go and come back, Auntie! It's the same in our Kundapura — 'hoy batte'.
  - scene: Amma stops in front of Arjun, who is closing the boot. She has watched him for two days.
  - who: amma
    t: ಅರ್ಜುನಾ, ಒಂದು ಮಾತು. ದೋಸ್ತಿ ಅಂದ್ರ ಹಗ್ಗ ಇದ್ದಂಗ ಪ್ಪಾ. ಜೋರಾಗಿ ಜಗ್ಗಿದ್ರ ಗಂಟು ಬೀಳ್ತದ. ಬಿಟ್ಟುಬಿಟ್ರ ಸಡಿಲ ಆಗ್ತದ. ಎರಡೂ ಕೈಯಾಗ ಹಿಡಕೊಂಡಿರಬೇಕು.
    tr: Arjunā, ondu mātu. Dōsti andra hagga iddaṅga ppā. Jōrāgi jaggidra gaṇṭu bīḷtada. Biṭṭubiṭra saḍila āgtada. Eraḍū kaiyāga hiḍakoṇḍirabēku.
    en: Arjun, one word. Friendship is like a rope, son. Pull it too hard and it knots. Let go and it goes slack. You have to hold it with both hands.
  - who: arjun
    t: ಹೂಂ ಆಂಟಿ. ಅರ್ಥ ಆಯ್ತು.
    tr: Hūṃ āṇṭi. Artha āytu.
    en: Yes, Auntie. I understand.
  - who: amma
    t: ಅರ್ಥ ಆದ್ರ ಸಾಲದು. ಮಾಡಿ ತೋರಿಸು. ಒಳ್ಳೇದಾಗ್ಲಿ, ಎಲ್ಲಾರಿಗೂ.
    tr: Artha ādra sāladu. Māḍi tōrisu. Oḷḷēdāgli, ellārigū.
    en: Understanding isn't enough. Show it by doing. May all go well for all of you.
  - section: Tea at Yellapur
    learn: 'the ghat road: ghaṭṭa, tiruvu, guḍḍa kusita · a careless offer: ellā nandu, kampani kārḍ, jēbige kai hākbēḍi · the explosion: cek bauns āytu, memō, phaṇḍs in-saphiśiyeṇṭ, hannondu dina ondu phōn illa · taking sides: nī yāvāglū avana para mātāḍti, modalu avana mātū kēḷi, adu anyāyada mātu'
  - scene: Ten in the morning. A tea shop at the edge of the teak forest near Yellapur. Both cars have stopped. Glasses of tea, banana buns in a glass jar, monkeys on the roof.
  - who: naveen
    t: ಇಲ್ಲಿಂದ ಅಂಕೋಲಕ್ಕೆ ಘಟ್ಟ ಇಳಿಯುವುದು. ತಿರುವುಗಳು ಬಾರಿ ಉಂಟು. ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ನಾಲ್ಕರ ಜುಲೈನಲ್ಲಿ ಶಿರೂರಿನ ಹತ್ರ ಗುಡ್ಡ ಕುಸಿದು ಹೈವೇ ಮೇಲೆ ಬಿದ್ದಿತ್ತಲ್ಲ, ನೆನಪುಂಟಾ? ಅದು ಇದೇ ಕಡೆ.
    tr: Illinda Aṅkōlakke ghaṭṭa iḷiyuvudu. Tiruvugaḷu bāri uṇṭu. Eraḍu sāvirada ippatnālkara Julainalli Śirūrina hatra guḍḍa kusidu haivē mēle biddittalla, nenapuṇṭā? Adu idē kaḍe.
    en: From here we go down the ghat to Ankola. Lots of hairpin bends. Remember in July 2024, near Shirur, a hill collapsed onto the highway? That's this side.
  - who: ramya
    t: ನೆನಪಿಲ್ದೆ ಏನು? ಲಾರಿ ಡ್ರೈವರ್ ಅರ್ಜುನ್ ಅವರ ದೇಹ ತಿಂಗಳುಗಟ್ಟಲೆ ಆದ ಮೇಲೆ ಸಿಕ್ಕಿದ್ದು. ಆ ದಿನಗಳಲ್ಲಿ ನಮ್ ಓಬಿ ವ್ಯಾನ್ ಅಲ್ಲೇ ನಿಂತಿತ್ತು.
    tr: Nenapilde ēnu? Lāri ḍraivar Arjun avara dēha tiṅgaḷugaṭṭale āda mēle sikkiddu. Ā dinagaḷalli nam ōbi vyān allē nintittu.
    en: How could I forget? The lorry driver Arjun's body was found only months later. In those days our OB van was parked right there.
  - who: arjun
    t: 'ಸರಿ ಸರಿ, ಸೀರಿಯಸ್ ಮಾತು ಸಾಕು. ಒಂದು ಅನೌನ್ಸ್‌ಮೆಂಟ್: ಗೋಕರ್ಣದ ಹೋಮ್‌ಸ್ಟೇ, ಡೀಸೆಲ್, ಟೋಲ್, ಇವತ್ತು ರಾತ್ರಿ ಫಿಶ್ ಥಾಲಿ — ಎಲ್ಲಾ ನಂದು. ಕಂಪನಿ ಕಾರ್ಡ್ ಇದೆ, ಯಾರೂ ಜೇಬಿಗೆ ಕೈ ಹಾಕ್ಬೇಡಿ.'
    tr: 'Sari sari, sīriyas mātu sāku. Ondu anauns-meṇṭ: Gōkarṇada hōm-sṭē, ḍīsel, ṭōl, ivattu rātri phiś thāli — ellā nandu. Kampani kārḍ ide, yārū jēbige kai hākbēḍi.'
    en: 'OK, OK, enough serious talk. An announcement: the Gokarna homestay, diesel, tolls, tonight''s fish thali — all on me. I''ve got the company card, nobody put a hand in their pocket.'
  - scene: Naveen puts his glass down on the bench. Hard.
  - who: naveen
    t: ಕಂಪನಿ ಕಾರ್ಡಾ? ಯಾವ ಕಂಪನಿ ಮಾರಾಯ? ಯಾವ ಕಂಪನಿಯ ಚೆಕ್ ಹನ್ನೊಂದು ದಿನದ ಹಿಂದೆ ನನ್ನ ಬ್ಯಾಂಕಿನಲ್ಲಿ ಬೌನ್ಸ್ ಆಯ್ತೋ, ಅದೇ ಕಂಪನಿಯ ಕಾರ್ಡಾ?
    tr: Kampani kārḍā? Yāva kampani mārāya? Yāva kampaniya cek hannondu dinada hinde nanna byāṅkinalli bauns āytō, adē kampaniya kārḍā?
    en: The company card? Which company, mārāya? The same company whose cheque bounced at my bank eleven days ago — that company's card?
  - who: naveen
    t: ಹಂಪಿಯಲ್ಲಿ ನಾನು ‘ಕಾರ್ಡ್, ಚೆಕ್ ಮೇಲೆ ನಂಬಿಕೆ ಕಮ್ಮಿ ಆಗಿದೆ’ ಅಂದಿದ್ದೆ. ಯಾರೂ ಯಾಕೆ ಅಂತ ಕೇಳಲಿಲ್ಲ. ಈಗ ಗೊತ್ತಾಯ್ತಾ ಯಾಕೆ ಅಂತ?
    tr: Hampiyalli nānu ‘kārḍ, cek mēle nambike kammi āgide’ andidde. Yārū yāke anta kēḷalilla. Īga gottāytā yāke anta?
    en: At Hampi I said I'd lost faith in cards and cheques. Nobody asked why. Do you see why now?
  - scene: Silence. Even the tea-shop owner stops pouring.
  - who: shruti
    t: ಏನು? ನವೀನ್, ಏನು ಹೇಳ್ತಿದೀಯಾ?
    tr: Ēnu? Navīn, ēnu hēḷtidīyā?
    en: What? Naveen, what are you saying?
  - who: naveen
    t: ಮಾರ್ಚ್‌ನಲ್ಲಿ ಇವನು ರಾತ್ರಿ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ಫೋನ್ ಮಾಡಿದ. ‘ಮಗಾ, ಸ್ಯಾಲರಿ ಕೊಡೋಕೆ ಎಂಟು ಲಕ್ಷ ಕಮ್ಮಿ ಬಿದ್ದಿದೆ, ಆರು ತಿಂಗಳಲ್ಲಿ ವಾಪಸ್.’ ನಾನು ಯೋಚನೆ ಮಾಡ್ಲಿಲ್ಲ. ದುಬೈಯಲ್ಲಿ ಆರು ವರ್ಷ ಕೂಡಿಸಿದ ದುಡ್ಡು, ಮರುದಿನ ಬೆಳಿಗ್ಗೆ ಟ್ರಾನ್ಸ್‌ಫರ್ ಮಾಡಿದೆ.
    tr: Mārc-nalli ivanu rātri hannondu gaṇṭege phōn māḍida. ‘Magā, syālari koḍōke eṇṭu lakṣa kammi biddide, āru tiṅgaḷalli vāpas.’ Nānu yōcane māḍlilla. Dubaiyalli āru varṣa kūḍisida duḍḍu, marudina beḷigge ṭrānsphar māḍide.
    en: In March this man called me at eleven at night. 'Maga, I'm eight lakh short for salaries, you'll have it back in six months.' I didn't think twice. Money I'd saved over six years in Dubai — I transferred it the next morning.
  - who: naveen
    t: ನವೆಂಬರ್ ಇಪ್ಪತ್ತರ ಡೇಟ್ ಹಾಕಿ ಕಂಪನಿ ಚೆಕ್ ಕೊಟ್ಟ. ಇಪ್ಪತ್ನಾಲ್ಕಕ್ಕೆ ಹಾಕಿದೆ. ಇಪ್ಪತ್ತಾರಕ್ಕೆ ಬ್ಯಾಂಕಿನಿಂದ ಮೆಮೋ — ‘ಫಂಡ್ಸ್ ಇನ್‌ಸಫಿಶಿಯೆಂಟ್.’ ಅವತ್ತಿಂದ ಇವತ್ತಿನವರೆಗೆ ಇವನಿಂದ ಒಂದು ಫೋನ್ ಇಲ್ಲ. ಒಂದು ಮೆಸೇಜ್ ಇಲ್ಲ. ಆಮೇಲೆ ಗ್ರೂಪ್‌ನಲ್ಲಿ ‘ಟ್ರಿಪ್ ಹೋಗುವ ಮಗಾ!’
    tr: Navembar ippattara ḍēṭ hāki kampani cek koṭṭa. Ippatnālkakke hākide. Ippattārakke byāṅkininda memō — ‘phaṇḍs in-saphiśiyeṇṭ.’ Avattinda ivattinavarege ivaninda ondu phōn illa. Ondu mesēj illa. Āmēle grūp-nalli ‘ṭrip hōguva magā!’
    en: 'He gave me a company cheque dated 20 November. I deposited it on the 24th. On the 26th, a memo from the bank: ''funds insufficient''. From that day to this, not one call from him. Not one message. And then on the group: ''Let''s go on a trip, maga!'''
  - who: arjun
    t: ನವೀನ್, ಒಂದ್ನಿಮಿಷ, ಕೇಳು. ಒಬ್ಬ ದೊಡ್ಡ ಕ್ಲೈಂಟ್ ಪೇಮೆಂಟ್ ಲೇಟ್ ಆಯ್ತು, ಅದಕ್ಕೆ ಅಕೌಂಟ್‌ನಲ್ಲಿ…
    tr: Navīn, ondnimiṣa, kēḷu. Obba doḍḍa klaiṇṭ pēmeṇṭ lēṭ āytu, adakke akauṇṭ-nalli…
    en: Naveen, one minute, listen. A big client's payment got delayed, so the account…
  - who: naveen
    t: ಕ್ಲೈಂಟ್ ಕತೆ ನನಗೆ ಬೇಡ! ಲೇಟ್ ಆದ್ರೆ ಫೋನ್ ಮಾಡಿ ಹೇಳುದಕ್ಕೆ ಎಷ್ಟು ಖರ್ಚಾಗ್ತದೆ? ಒಂದು ನಿಮಿಷ! ನಾನು ಉಡುಪಿಯಲ್ಲಿ ಬ್ಯಾಂಕ್ ಕೌಂಟರ್ ಮುಂದೆ ಆ ಮೆಮೋ ಹಿಡ್ಕೊಂಡು ನಿಂತಿದ್ದೆ, ಕ್ಯಾಶಿಯರ್ ನನ್ನ ಮುಖ ನೋಡ್ತಿದ್ದ. ನಮ್ಮಪ್ಪನಿಗೆ ಹೋಟೆಲ್ ರಿನೋವೇಷನ್ ಮುಂದಿನ ವರ್ಷ ಅಂತ ಸುಳ್ಳು ಹೇಳಿದೆ.
    tr: Klaiṇṭ kate nanage bēḍa! Lēṭ ādre phōn māḍi hēḷudakke eṣṭu kharcāgtade? Ondu nimiṣa! Nānu Uḍupiyalli byāṅk kauṇṭar munde ā memō hiḍkoṇḍu nintidde, kyāśiyar nanna mukha nōḍtidda. Nammappanige hōṭel rinōvēṣan mundina varṣa anta suḷḷu hēḷide.
    en: I don't want the client story! If it's late, what does it cost to phone and say so? One minute! I stood at the bank counter in Udupi holding that memo while the cashier stared at my face. I lied to my father that the hotel renovation would be next year.
  - who: imran
    t: ಯಪ್ಪಾ… ಎಂಟು ಲಕ್ಷ ಅಂದ್ರ ಜುಜುಬಿ ಅಲ್ಲ ಅರ್ಜುನ್. ಮತ್ತ ಮೂರು ದಿನದಿಂದ ‘ಎಲ್ಲಾ ನಂದು’ ಅಂತ ಬಿಲ್ಡಪ್ ಕೊಡಾಕತ್ತಿದ್ದಿ?
    tr: Yappā… eṇṭu lakṣa andra jujubi alla Arjun. Matta mūru dinadinda ‘ellā nandu’ anta bilḍap koḍākattiddi?
    en: My God… eight lakh isn't small change, Arjun. And for three days you've been hyping yourself up with 'it's all on me'?
  - who: ramya
    t: ಅದಕ್ಕೇ ಮೂರು ದಿನದಿಂದ ಈ ಮೌನ! ನನಗೆ ಗೊತ್ತಿತ್ತು ಏನೋ ಇದೆ ಅಂತ. ಅರ್ಜುನ್, ಇದು ತುಂಬಾ ಚೀಪ್.
    tr: Adakkē mūru dinadinda ī mauna! Nanage gottittu ēnō ide anta. Arjun, idu tumbā cīp.
    en: So that's the reason for three days of silence! I knew something was up. Arjun, this is really cheap.
  - who: shruti
    t: ಒಂದ್ ನಿಮಿಷ ಎಲ್ರೂ. ಇಲ್ಲೇ ಕೋರ್ಟ್ ಶುರು ಮಾಡೋಕೆ ಮುಂಚೆ ಅವನ ಮಾತೂ ಕೇಳಿ. ನಾವು ಎಲ್ರೂ ಒಟ್ಟಿಗೆ ಒಬ್ಬನ ಮೇಲೆ ಬಿದ್ರೆ ಅದು ನ್ಯಾಯ ಅಲ್ಲ.
    tr: Ond nimiṣa ellrū. Illē kōrṭ śuru māḍōke muñce avana mātū kēḷi. Nāvu ellrū oṭṭige obbana mēle bidre adu nyāya alla.
    en: One minute, everyone. Before you start a court right here, hear him out too. If all of us jump on one person together, that's not fair.
  - who: imran
    t: ನೀ ಯಾವಾಗ್ಲೂ ಅವನ ಪರ ಮಾತಾಡ್ತಿ ಶ್ರುತಿ. ಕಾಲೇಜಿನಿಂದ.
    tr: Nī yāvāglū avana para mātāḍti Śruti. Kālējininda.
    en: You always take his side, Shruti. Ever since college.
  - who: shruti
    t: ಅದು ಅನ್ಯಾಯದ ಮಾತು ಇಮ್ರಾನ್. ಕಾಲೇಜಿನಿಂದ ನನಗೆ ಇವನ ಮೇಲೆ ಎಷ್ಟು ಸಿಟ್ಟಿದೆ ಅಂತ ನಿನಗೆ ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೂ ನವೀನ್‌ಗೆ ಅವನ ದುಡ್ಡು ವಾಪಸ್ ಬರಬೇಕು ಅಂದ್ರೆ, ಕೂಗಾಡೋದ್ರಿಂದ ಬರಲ್ಲ.
    tr: Adu anyāyada mātu Imrān. Kālējininda nanage ivana mēle eṣṭu siṭṭide anta ninage gottilla. Ādrū Navīn-ge avana duḍḍu vāpas barabēku andre, kūgāḍōdrinda baralla.
    en: That's unfair, Imran. You have no idea how angry I've been with him since college. But if Naveen is to get his money back, shouting won't bring it.
  - who: deepa
    t: ನವೀನ್, ಕೂತ್ಕೋ ಸ್ವಲ್ಪ. ನೀರು ಕುಡಿ. ನಿನ್ನ ಸಿಟ್ಟು ಸರಿ. ಆದ್ರೆ ಈ ರಸ್ತೆ ಪಕ್ಕ ನಿಂತ್ಕೊಂಡು ಇದು ಮುಗಿಯಲ್ಲ.
    tr: Navīn, kūtkō svalpa. Nīru kuḍi. Ninna siṭṭu sari. Ādre ī raste pakka nintkoṇḍu idu mugiyalla.
    en: Naveen, sit down a bit. Drink some water. Your anger is right. But this won't be settled standing on the side of the road.
  - who: arjun
    t: ನಾನು ಏನೂ ಸಮರ್ಥನೆ ಮಾಡ್ಕೊಳ್ತಿಲ್ಲ. ತಪ್ಪು ನಂದೇ. ಫೋನ್ ಮಾಡ್ಬೇಕಿತ್ತು. ಮಾಡ್ಲಿಲ್ಲ, ಯಾಕಂದ್ರೆ… ಅವನ ಧ್ವನಿ ಕೇಳೋಕೆ ಧೈರ್ಯ ಇರ್ಲಿಲ್ಲ.
    tr: Nānu ēnū samarthane māḍkoḷtilla. Tappu nandē. Phōn māḍbēkittu. Māḍlilla, yākandre… avana dhvani kēḷōke dhairya irlilla.
    en: I'm not defending myself. The fault is mine. I should have called. I didn't, because… I didn't have the courage to hear his voice.
  - who: naveen
    t: ಧೈರ್ಯ ಇರಲಿಲ್ಲ. ಆದ್ರೆ ಟ್ರಿಪ್ ಪ್ಲಾನ್ ಮಾಡುವ ಧೈರ್ಯ ಉಂಟು. ನನ್ನ ಲಾಯರ್ ಸೆಕ್ಷನ್ ನೂರ ಮೂವತ್ತೆಂಟರ ನೋಟಿಸ್ ರೆಡಿ ಮಾಡಿ ಇಟ್ಟಿದ್ದಾರೆ ಗೊತ್ತುಂಟಾ? ‘ಕಳಿಸ್ಲಾ?’ ಅಂತ ಮೂರು ಸಲ ಕೇಳಿದ್ರು. ಮೂರು ಸಲಾನೂ ‘ಬೇಡ, ಅವನು ನನ್ನ ಫ್ರೆಂಡ್’ ಅಂದೆ.
    tr: Dhairya iralilla. Ādre ṭrip plān māḍuva dhairya uṇṭu. Nanna lāyar sekṣan nūra mūvatteṇṭara nōṭis reḍi māḍi iṭṭiddāre gottuṇṭā? ‘Kaḷislā?’ anta mūru sala kēḷidru. Mūru salānū ‘bēḍa, avanu nanna phreṇḍ’ ande.
    en: No courage. But courage enough to plan a trip. Do you know my lawyer has a Section 138 notice drafted and ready? Three times he asked me, 'Shall I send it?' All three times I said, 'No, he's my friend.'
  - section: Section 138
    learn: 'the law, carefully: Negōṣiyabal Insṭrumeṇṭs kāyde, sekṣan nūra mūvatteṇṭu · the clock: memō banda mūvattu dinadoḷage nōṭis, hadinaidu dina haṇa kaṭṭōke, āmēle ondu tiṅgaḷoḷage dūru · the penalty: eraḍu varṣadavarege jailu, cek mottada eraḍaraṣṭu daṇḍa · rāji māḍkoḷḷabahudāda aparādha · hedging like a lawyer: nānu yāra vakīlaḷū alla, dākhale nōḍade khacita alla'
  - scene: Everyone turns to Kaveri. She takes off her sunglasses and speaks slowly, the way she speaks to clients.
  - who: kaveri
    t: ಮೊದಲು ಒಂದು ವಿಷಯ ಸ್ಪಷ್ಟ ಮಾಡ್ತೀನಿ. ನಾನು ಇಲ್ಲಿ ಇಬ್ಬರಲ್ಲಿ ಯಾರ ವಕೀಲಳೂ ಅಲ್ಲ. ಬ್ಯಾಂಕ್ ಮೆಮೋ, ಸಾಲದ ದಾಖಲೆ, ಚೆಕ್ ಯಾವುದನ್ನೂ ನೋಡಿಲ್ಲ. ಹಾಗಾಗಿ ನಾನು ಹೇಳೋದು ಸಾಮಾನ್ಯವಾಗಿ ಕಾನೂನು ಏನು ಅಂತ ಮಾತ್ರ. ಸರಿನಾ?
    tr: Modalu ondu viṣaya spaṣṭa māḍtīni. Nānu illi ibbaralli yāra vakīlaḷū alla. Byāṅk memō, sālada dākhale, cek yāvudannū nōḍilla. Hāgāgi nānu hēḷōdu sāmānyavāgi kānūnu ēnu anta mātra. Sarinā?
    en: Let me make one thing clear first. I'm not either one's lawyer here. I haven't seen the bank memo, the loan papers or the cheque. So all I'm telling you is what the law generally says. Agreed?
  - who: naveen
    t: ಸರಿ. ಹೇಳು.
    tr: Sari. Hēḷu.
    en: Fine. Tell us.
  - who: kaveri
    t: ನೆಗೋಷಿಯಬಲ್ ಇನ್ಸ್ಟ್ರುಮೆಂಟ್ಸ್ ಕಾಯ್ದೆ, ಸೆಕ್ಷನ್ ನೂರ ಮೂವತ್ತೆಂಟು. ಚೆಕ್ ಬೌನ್ಸ್ ಆದ ಮೆಮೋ ಬಂದ ದಿನದಿಂದ ಮೂವತ್ತು ದಿನದೊಳಗೆ ಲೀಗಲ್ ನೋಟಿಸ್ ಕಳಿಸಬೇಕು. ನವೀನ್‌ಗೆ ಮೆಮೋ ಬಂದಿದ್ದು ಇಪ್ಪತ್ತಾರಕ್ಕೆ ಅಂದ್ರೆ, ಇನ್ನೂ ಸಮಯ ಇದೆ.
    tr: Negōṣiyabal insṭrumeṇṭs kāyde, sekṣan nūra mūvatteṇṭu. Cek bauns āda memō banda dinadinda mūvattu dinadoḷage līgal nōṭis kaḷisabēku. Navīn-ge memō bandiddu ippattārakke andre, innū samaya ide.
    en: The Negotiable Instruments Act, Section 138. A legal notice has to go within thirty days of the day the dishonour memo arrives. If Naveen got the memo on the 26th, there's still time.
  - who: kaveri
    t: ನೋಟಿಸ್ ತಲುಪಿದ ಮೇಲೆ ಅರ್ಜುನ್‌ಗೆ ಹದಿನೈದು ದಿನ ಸಿಗುತ್ತೆ, ಹಣ ಕಟ್ಟೋಕೆ. ಕಟ್ಟದಿದ್ರೆ, ಆಮೇಲಿನ ಒಂದು ತಿಂಗಳೊಳಗೆ ನವೀನ್ ಮ್ಯಾಜಿಸ್ಟ್ರೇಟ್ ಕೋರ್ಟಲ್ಲಿ ದೂರು ಹಾಕಬಹುದು. ಇದು ಸಿವಿಲ್ ಕೇಸ್ ಅಲ್ಲ — ಕ್ರಿಮಿನಲ್ ಕೇಸ್.
    tr: Nōṭis talupida mēle Arjun-ge hadinaidu dina sigutte, haṇa kaṭṭōke. Kaṭṭadidre, āmēlina ondu tiṅgaḷoḷage Navīn myājisṭrēṭ kōrṭalli dūru hākabahudu. Idu sivil kēs alla — kriminal kēs.
    en: Once the notice reaches him, Arjun gets fifteen days to pay. If he doesn't, within one month after that Naveen can file a complaint in the magistrate's court. This isn't a civil case — it's a criminal case.
  - who: prakash
    t: ಕ್ರಿಮಿನಲ್ಲಾ? ಅಂದ್ರ ಜೈಲು ಗಿಲು ಅದೇನ್ರಿ ಇದರಾಗ?
    tr: Kriminallā? Andra jailu gilu adēnri idarāga?
    en: Criminal? You mean there's jail and all that in this?
  - who: kaveri
    t: ಕಾನೂನಿನಲ್ಲಿ ಎರಡು ವರ್ಷದವರೆಗೆ ಜೈಲು, ಅಥವಾ ಚೆಕ್ ಮೊತ್ತದ ಎರಡರಷ್ಟು ದಂಡ, ಅಥವಾ ಎರಡೂ ಅಂತ ಇದೆ. ಆದ್ರೆ ಇದು ರಾಜಿ ಮಾಡ್ಕೊಳ್ಳಬಹುದಾದ ಅಪರಾಧ. ನಿಜ ಜೀವನದಲ್ಲಿ ಹೆಚ್ಚಿನ ಕೇಸ್‌ಗಳು ಹಣ ಕೊಟ್ಟು, ರಾಜಿ ಆಗಿ ಮುಗಿಯುತ್ತೆ.
    tr: Kānūninalli eraḍu varṣadavarege jailu, athavā cek mottada eraḍaraṣṭu daṇḍa, athavā eraḍū anta ide. Ādre idu rāji māḍkoḷḷabahudāda aparādha. Nija jīvanadalli heccina kēs-gaḷu haṇa koṭṭu, rāji āgi mugiyutte.
    en: The law says up to two years in jail, or a fine of up to twice the cheque amount, or both. But it's a compoundable offence — it can be settled. In real life most cases end with the money paid and a settlement.
  - who: kaveri
    t: ಇನ್ನೊಂದು. ಕಳೆದ ವರ್ಷ ಸೆಪ್ಟೆಂಬರಲ್ಲಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಚೆಕ್ ಬೌನ್ಸ್ ಕೇಸ್‌ಗಳಿಗೆ ಹೊಸ ಮಾರ್ಗಸೂಚಿ ಕೊಟ್ಟಿದೆ — ಮೊದಲ ಹಂತದಲ್ಲೇ ಹಣ ಕೊಟ್ಟು ಮುಗಿಸಿದ್ರೆ ಖರ್ಚು ಕಮ್ಮಿ ಆಗೋ ಹಾಗೆ. ಎಷ್ಟು ಶೇಕಡಾ ಅಂತ ನನಗೆ ಈಗ ಖಚಿತವಾಗಿ ನೆನಪಿಲ್ಲ, ನೋಡಿ ಹೇಳ್ತೀನಿ.
    tr: Innondu. Kaḷeda varṣa Sepṭembaralli Suprīṃ Kōrṭ cek bauns kēs-gaḷige hosa mārgasūci koṭṭide — modala hantadallē haṇa koṭṭu mugisidre kharcu kammi āgō hāge. Eṣṭu śēkaḍā anta nanage īga khacitavāgi nenapilla, nōḍi hēḷtīni.
    en: One more thing. In September last year the Supreme Court gave new guidelines for cheque-bounce cases — so that if you pay up at the very first stage, the costs are lower. I don't remember the exact percentage right now; I'll check and tell you.
  - who: deepa
    t: ಕಂಪನಿ ಚೆಕ್ ಆಗಿರೋದ್ರಿಂದ ಏನಾದ್ರೂ ವ್ಯತ್ಯಾಸ ಇದೆಯಾ? ಅರ್ಜುನ್ ಸ್ವಂತ ಚೆಕ್ ಅಲ್ಲ ಅಲ್ವಾ?
    tr: Kampani cek āgirōdrinda ēnādrū vyatyāsa ideyā? Arjun svanta cek alla alvā?
    en: Does it make a difference that it's a company cheque? It's not Arjun's personal cheque, is it?
  - who: kaveri
    t: 'ಸಾಮಾನ್ಯವಾಗಿ ಕಂಪನಿ ಮೇಲೂ, ಆ ಸಮಯದಲ್ಲಿ ಕಂಪನಿಯ ವ್ಯವಹಾರಕ್ಕೆ ಜವಾಬ್ದಾರರಾಗಿದ್ದ ಡೈರೆಕ್ಟರ್‌ಗಳ ಮೇಲೂ ಕೇಸ್ ಆಗಬಹುದು. ಅರ್ಜುನ್ ಫೌಂಡರ್, ಚೆಕ್‌ಗೆ ಸಹಿ ಹಾಕಿದ್ದು ಅವನೇ ಆದ್ರೆ… ತಪ್ಪಿಸ್ಕೊಳ್ಳೋದು ಕಷ್ಟ. ಆದ್ರೆ ಮತ್ತೆ ಹೇಳ್ತೀನಿ: ದಾಖಲೆ ನೋಡದೆ ಯಾವುದೂ ಖಚಿತ ಅಲ್ಲ.'
    tr: 'Sāmānyavāgi kampani mēlū, ā samayadalli kampaniya vyavahārakke javābdārarāgidda ḍairekṭar-gaḷa mēlū kēs āgabahudu. Arjun phauṇḍar, cek-ge sahi hākiddu avanē ādre… tappiskoḷḷōdu kaṣṭa. Ādre matte hēḷtīni: dākhale nōḍade yāvudū khacita alla.'
    en: 'Generally a case can be filed against the company, and also against the directors who were in charge of its business at the time. Arjun is the founder; if he''s the one who signed the cheque… it''s hard to escape. But again: without seeing the papers, nothing is certain.'
  - who: kaveri
    t: 'ನನ್ನ ಸಲಹೆ ಕೇಳಿದ್ರೆ — ಕೋರ್ಟ್ ಅಂದ್ರೆ ವರ್ಷಗಟ್ಟಲೆ ಡೇಟ್ ಮೇಲೆ ಡೇಟ್. ನವೀನ್‌ಗೆ ಬೇಕಾಗಿರೋದು ದುಡ್ಡು, ಅರ್ಜುನ್‌ಗೆ ಜೈಲಲ್ಲ. ಬರವಣಿಗೆಯಲ್ಲಿ ಒಂದು ರಾಜಿ ಒಪ್ಪಂದ: ಎಷ್ಟು, ಯಾವಾಗ, ತಪ್ಪಿದ್ರೆ ಏನು. ಅದನ್ನ ನಾನು ಡ್ರಾಫ್ಟ್ ಮಾಡ್ಕೊಡ್ತೀನಿ, ಫೀಸ್ ಇಲ್ಲದೆ.'
    tr: 'Nanna salahe kēḷidre — kōrṭ andre varṣagaṭṭale ḍēṭ mēle ḍēṭ. Navīn-ge bēkāgirōdu duḍḍu, Arjun-ge jailalla. Baravaṇigeyalli ondu rāji oppanda: eṣṭu, yāvāga, tappidre ēnu. Adanna nānu ḍrāphṭ māḍkoḍtīni, phīs illade.'
    en: 'If you ask my advice — court means years of ''date after date''. What Naveen needs is his money, not Arjun in jail. A written settlement agreement: how much, when, and what happens if a payment is missed. I''ll draft it for you, free of charge.'
  - who: ramya
    t: ವಕೀಲರು ಫೀಸ್ ಇಲ್ಲದೆ? ಇದನ್ನ ಬ್ರೇಕಿಂಗ್ ನ್ಯೂಸ್ ಮಾಡ್ಬೇಕು.
    tr: Vakīlaru phīs illade? Idanna brēkiṅg nyūs māḍbēku.
    en: A lawyer working for free? That should be breaking news.
  - who: kaveri
    t: ರಮ್ಯಾ. ಈಗ ಅಲ್ಲ.
    tr: Ramyā. Īga alla.
    en: Ramya. Not now.
  - who: prakash
    t: 'ನಮ್ ಕಡೆ ಒಂದು ಮಾತು ಐತಿ: ಸಾಲ ಕೊಟ್ಟವನ ಸಿಟ್ಟು ಖರೇ, ಸಾಲ ತಗೊಂಡವನ ನಾಚಿಕಿನೂ ಖರೇ. ಎರಡೂ ಖರೇ ಇದ್ದಾಗ, ನಡುವೆ ನಿಂತವರು ಕೂಗಬಾರದು, ಕೇಳಬೇಕು.'
    tr: 'Nam kaḍe ondu mātu aiti: sāla koṭṭavana siṭṭu kharē, sāla tagoṇḍavana nācikinū kharē. Eraḍū kharē iddāga, naḍuve nintavaru kūgabāradu, kēḷabēku.'
    en: 'We have a saying back home: the lender''s anger is real, and the borrower''s shame is real too. When both are real, the people standing in between shouldn''t shout — they should listen.'
  - who: imran
    t: ಹೂಂ… ಬರೋಬ್ಬರಿ. ನಾ ಜರಾ ಜಾಸ್ತಿ ಮಾತಾಡಿದೆ. ಸಾರಿ ಶ್ರುತಿ.
    tr: Hūṃ… barōbbari. Nā jarā jāsti mātāḍide. Sāri Śruti.
    en: Hm… that's right. I said a bit too much. Sorry, Shruti.
  - who: shruti
    t: ಪರವಾಗಿಲ್ಲ. ನಾವೆಲ್ಲಾ ಸುಸ್ತಾಗಿದೀವಿ.
    tr: Paravāgilla. Nāvellā sustāgidīvi.
    en: It's fine. We're all worn out.
  - section: Down the ghat
    learn: 'a forced conversation: ibbarū ondē kārinalli, ōḍi hōgbēḍi · deep apology: ‘sāri’ aṣṭē andre sākāgalla anta gottu · ā nambikege drōha māḍde · kṣamisu anta kēḷōkū mukha illa, ādrū kēḷtidīni · what really hurt: ondu phōnigū bēḍadavanāde · a first repayment: ephḍi brēk māḍtīni, sañjeyoḷage mūru lakṣa · not yet forgiving: kṣamisiddēne anta īga hēḷudilla, Gōkarṇadalli nōḍuva'
  - scene: Kaveri takes Naveen's car keys out of his hand and gives them to Arjun.
  - who: kaveri
    t: ಇವತ್ತು ಸ್ವಲ್ಪ ಬದಲಾವಣೆ. ಅರ್ಜುನ್ ಕಾರಿನಲ್ಲಿ ನಾವು ಆರು ಜನ ಹೋಗ್ತೀವಿ, ಶ್ರುತಿ ಡ್ರೈವ್ ಮಾಡ್ತಾಳೆ. ನವೀನ್ ಕಾರಿನಲ್ಲಿ ನೀವಿಬ್ಬರೇ. ಅಂಕೋಲದವರೆಗೆ ಒಂದೂವರೆ ಗಂಟೆ. ಮಾತಾಡಿ, ಇಲ್ಲಾ ಸುಮ್ಮನಿರಿ — ಆದ್ರೆ ಓಡಿ ಹೋಗ್ಬೇಡಿ.
    tr: Ivattu svalpa badalāvaṇe. Arjun kārinalli nāvu āru jana hōgtīvi, Śruti ḍraiv māḍtāḷe. Navīn kārinalli nīvibbarē. Aṅkōladavarege ondūvare gaṇṭe. Mātāḍi, illā summaniri — ādre ōḍi hōgbēḍi.
    en: A small change today. Six of us go in Arjun's car, Shruti drives. In Naveen's car it's just the two of you. An hour and a half to Ankola. Talk, or stay silent — but don't run away.
  - who: naveen
    t: ಕಾವೇರಿ, ಇದು ಮದುವೆ ಕೌನ್ಸೆಲಿಂಗ್ ಅಲ್ಲ ಮಾರಾಯ್ತಿ.
    tr: Kāvēri, idu maduve kaunseliṅg alla mārāyti.
    en: Kaveri, this isn't marriage counselling, mārāyti.
  - who: kaveri
    t: ಹದಿನಾಲ್ಕು ವರ್ಷದ ದೋಸ್ತಿ ಮದುವೆಗಿಂತ ಕಮ್ಮಿನಾ? ಹೊರಡಿ.
    tr: Hadinālku varṣada dōsti maduveginta kamminā? Horaḍi.
    en: Is a fourteen-year friendship worth less than a marriage? Get going.
  - scene: Naveen's car, going down the ghat. Hairpin bends, a lorry crawling in front. For twenty minutes neither says a word. Arjun drives. Naveen looks at the valley.
  - who: arjun
    t: ನವೀನ್. ನಾನು ಮಾತಾಡ್ತೀನಿ, ನೀನು ಉತ್ತರ ಕೊಡ್ಬೇಕು ಅಂತಿಲ್ಲ.
    tr: Navīn. Nānu mātāḍtīni, nīnu uttara koḍbēku antilla.
    en: Naveen. I'll talk; you don't have to answer.
  - who: naveen
    t: ಹೇಳು.
    tr: Hēḷu.
    en: Say it.
  - who: arjun
    t: ‘ಸಾರಿ’ ಅಷ್ಟೇ ಅಂದ್ರೆ ಸಾಕಾಗಲ್ಲ ಅಂತ ಗೊತ್ತು. ನೀನು ಯೋಚನೆ ಮಾಡದೆ ನನ್ನ ನಂಬಿದೆ. ನಾನು ಆ ನಂಬಿಕೆಗೆ ದ್ರೋಹ ಮಾಡ್ದೆ. ದುಡ್ಡು ಲೇಟ್ ಆಗಿದ್ದು ಒಂದು ತಪ್ಪು. ಹನ್ನೊಂದು ದಿನ ಮುಖ ತಪ್ಪಿಸ್ಕೊಂಡಿದ್ದು ಅದಕ್ಕಿಂತ ದೊಡ್ಡ ತಪ್ಪು.
    tr: ‘Sāri’ aṣṭē andre sākāgalla anta gottu. Nīnu yōcane māḍade nanna nambide. Nānu ā nambikege drōha māḍde. Duḍḍu lēṭ āgiddu ondu tappu. Hannondu dina mukha tappiskoṇḍiddu adakkinta doḍḍa tappu.
    en: I know just saying 'sorry' isn't enough. You trusted me without a second thought. I betrayed that trust. The money being late was one wrong. Hiding my face from you for eleven days was a bigger one.
  - who: naveen
    t: ಹೌದು. ಅದೇ. ನಿನಗೆ ಅರ್ಥ ಆಗ್ತದಾ ಅರ್ಜುನ್? ಎಂಟು ಲಕ್ಷ ಹೋದ ನೋವಿಗಿಂತ, ನಾನು ನಿನಗೆ ಒಂದು ಫೋನಿಗೂ ಬೇಡದವನಾದೆ ಅನ್ನುವ ನೋವು ಜಾಸ್ತಿ. ಕಾಲೇಜಿನಲ್ಲಿ ನಿನ್ನ ಎಕ್ಸಾಮ್ ಫೀಸ್ ಕಟ್ಟುವುದಕ್ಕೆ ನನ್ನ ಬೈಕ್ ಮಾರಿದ್ದೆ, ನೆನಪುಂಟಾ?
    tr: Haudu. Adē. Ninage artha āgtadā Arjun? Eṇṭu lakṣa hōda nōviginta, nānu ninage ondu phōnigū bēḍadavanāde annuva nōvu jāsti. Kālējinalli ninna eksām phīs kaṭṭuvudakke nanna baik māridde, nenapuṇṭā?
    en: Yes. That's it. Do you understand, Arjun? It hurts less that eight lakh is gone than that I became someone not worth even one phone call to you. In college I sold my bike to pay your exam fees — do you remember?
  - who: arjun
    t: ನೆನಪಿದೆ. ಹೀರೋ ಹೋಂಡಾ, ಕೆಂಪು ಬಣ್ಣ. ಹದಿನೆಂಟು ಸಾವಿರ. ನಾನು ಅದನ್ನ ಮೂರು ತಿಂಗಳಲ್ಲಿ ವಾಪಸ್ ಕೊಟ್ಟಿದ್ದೆ.
    tr: Nenapide. Hīrō Hōṇḍā, kempu baṇṇa. Hadineṇṭu sāvira. Nānu adanna mūru tiṅgaḷalli vāpas koṭṭidde.
    en: I remember. A Hero Honda, red. Eighteen thousand. I paid that back in three months.
  - who: naveen
    t: ಕೊಟ್ಟಿದ್ದೆ. ಅವತ್ತಿನ ಅರ್ಜುನ್ ಕೊಡ್ತಿದ್ದ. ಇವತ್ತಿನ ಅರ್ಜುನ್ ಯಾರು ಅಂತ ನನಗೆ ಗೊತ್ತಿಲ್ಲ.
    tr: Koṭṭidde. Avattina Arjun koḍtidda. Ivattina Arjun yāru anta nanage gottilla.
    en: You did. That Arjun used to pay back. I don't know who today's Arjun is.
  - scene: A long bend. Arjun pulls into a lay-by above the valley and switches off the engine.
  - who: arjun
    t: 'ಕ್ಷಮಿಸು ಅಂತ ಕೇಳೋಕೂ ನನಗೆ ಮುಖ ಇಲ್ಲ, ನವೀನ್. ಆದ್ರೂ ಕೇಳ್ತಿದೀನಿ. ಮತ್ತೆ ಬರೀ ಮಾತಲ್ಲ, ಕೆಲಸ: ನನ್ನ ಸ್ವಂತ ಎಫ್‌ಡಿ ಒಂದಿದೆ. ಈಗಲೇ ಫೋನಲ್ಲಿ ಬ್ರೇಕ್ ಮಾಡ್ತೀನಿ. ಇವತ್ತು ಸಂಜೆಯೊಳಗೆ ಮೂರು ಲಕ್ಷ ನಿನ್ನ ಅಕೌಂಟ್‌ಗೆ ಬರುತ್ತೆ.'
    tr: 'Kṣamisu anta kēḷōkū nanage mukha illa, Navīn. Ādrū kēḷtidīni. Matte barī mātalla, kelasa: nanna svanta eph-ḍi ondide. Īgalē phōnalli brēk māḍtīni. Ivattu sañjeyoḷage mūru lakṣa ninna akauṇṭ-ge barutte.'
    en: 'I don''t even have the face to ask you to forgive me, Naveen. But I''m asking anyway. And not just words — action: I have a personal FD. I''ll break it on my phone right now. Three lakh will reach your account by this evening.'
  - who: naveen
    t: ಮತ್ತೆ ಉಳಿದ ಐದು?
    tr: Matte uḷida aidu?
    en: And the remaining five?
  - who: arjun
    t: ಉಳಿದ ಐದು ಲಕ್ಷಕ್ಕೆ ಕಾವೇರಿ ಹೇಳಿದ ಹಾಗೆ ಬರವಣಿಗೆಯಲ್ಲಿ ಒಪ್ಪಂದ. ತಿಂಗಳು ತಿಂಗಳು. ನೀನು ಹೇಳೋ ಕಂಡೀಶನ್ ಎಲ್ಲಾ ಒಪ್ಪಿಕೊಳ್ತೀನಿ. ನೋಟಿಸ್ ಕಳಿಸ್ಬೇಕು ಅನ್ನಿಸಿದ್ರೆ ಕಳಿಸು. ನಾನು ತಡೆಯಲ್ಲ, ಕೋಪಾನೂ ಮಾಡ್ಕೊಳ್ಳಲ್ಲ.
    tr: Uḷida aidu lakṣakke Kāvēri hēḷida hāge baravaṇigeyalli oppanda. Tiṅgaḷu tiṅgaḷu. Nīnu hēḷō kaṇḍīśan ellā oppikoḷtīni. Nōṭis kaḷisbēku annisidre kaḷisu. Nānu taḍeyalla, kōpānū māḍkoḷḷalla.
    en: For the remaining five lakh, a written agreement like Kaveri said. Month by month. I'll accept every condition you set. If you feel you must send the notice, send it. I won't stop you, and I won't be angry either.
  - who: naveen
    t: ಒಂದು ಪ್ರಶ್ನೆ. ನಿಜ ಹೇಳು. ನಿನ್ನ ಕಂಪನಿ ಹೇಗುಂಟು? ಒಂದು ಕ್ಲೈಂಟ್ ಲೇಟ್ ಆದ್ರೆ ಎಂಟು ಲಕ್ಷದ ಚೆಕ್ ಬೌನ್ಸ್ ಆಗುವ ಕಂಪನಿ — ಅದನ್ನ ‘ನಡೀತಿದೆ’ ಅಂತ ಅಮ್ಮನ ಮುಂದೆ ಹೇಳ್ದೆಯಲ್ಲ.
    tr: Ondu praśne. Nija hēḷu. Ninna kampani hēguṇṭu? Ondu klaiṇṭ lēṭ ādre eṇṭu lakṣada cek bauns āguva kampani — adanna ‘naḍītide’ anta ammana munde hēḷdeyalla.
    en: One question. Tell me the truth. How is your company really? A company where one late client makes an eight-lakh cheque bounce — and you told Amma 'it's going'.
  - scene: Arjun grips the steering wheel. A long pause.
  - who: arjun
    t: ಕಷ್ಟದಲ್ಲಿದೆ. ನೀನು ಅಂದ್ಕೊಂಡಿರೋದಕ್ಕಿಂತ ಜಾಸ್ತಿ. ಆದ್ರೆ ಎಲ್ಲಾ ಈಗ ಹೇಳೋಕಾಗಲ್ಲ, ನವೀನ್. ಒಂದು ದಿನ ಕೊಡು. ಎಲ್ಲರ ಮುಂದೆ, ಒಟ್ಟಿಗೇ ಹೇಳ್ತೀನಿ. ಬೇರೆ ಬೇರೆ ಜನಕ್ಕೆ ಬೇರೆ ಬೇರೆ ಕತೆ ಹೇಳೋ ಶಕ್ತಿ ಇನ್ನು ನನಗಿಲ್ಲ.
    tr: Kaṣṭadallide. Nīnu andkoṇḍirōdakkinta jāsti. Ādre ellā īga hēḷōkāgalla, Navīn. Ondu dina koḍu. Ellara munde, oṭṭigē hēḷtīni. Bēre bēre janakke bēre bēre kate hēḷō śakti innu nanagilla.
    en: It's in trouble. More than you think. But I can't tell it all now, Naveen. Give me one day. I'll tell everyone, all together. I don't have the strength any more to tell different stories to different people.
  - who: naveen
    t: ಮತ್ತೆ ಮುಚ್ಚಿಡುವುದಾ?
    tr: Matte mucciḍuvudā?
    en: Hiding things again?
  - who: arjun
    t: ಇಲ್ಲ. ಮುಚ್ಚಿಟ್ಟಿದ್ದು ಸಾಕು. ಒಂದೇ ಒಂದು ದಿನ.
    tr: Illa. Mucciṭṭiddu sāku. Ondē ondu dina.
    en: No. I've hidden enough. Just one day.
  - scene: 'Arjun opens his banking app and breaks the deposit. He shows Naveen the screen: transfer initiated, three lakh rupees. Naveen looks at it for a long time.'
  - who: naveen
    t: ಕ್ಷಮಿಸಿದ್ದೇನೆ ಅಂತ ಈಗ ಹೇಳುದಿಲ್ಲ. ಸುಳ್ಳು ಆಗ್ತದೆ. ನೋಟಿಸ್ ಕಳಿಸುದಿಲ್ಲ ಅಂತನೂ ಹೇಳುದಿಲ್ಲ, ಕಳಿಸ್ತೇನೆ ಅಂತನೂ ಹೇಳುದಿಲ್ಲ. ಗೋಕರ್ಣದಲ್ಲಿ ನೋಡುವ. ಗಾಡಿ ಸ್ಟಾರ್ಟ್ ಮಾಡು. ಅವರು ಅಂಕೋಲದಲ್ಲಿ ಕಾಯ್ತಿದ್ದಾರೆ.
    tr: Kṣamisiddēne anta īga hēḷudilla. Suḷḷu āgtade. Nōṭis kaḷisudilla antanū hēḷudilla, kaḷistēne antanū hēḷudilla. Gōkarṇadalli nōḍuva. Gāḍi sṭārṭ māḍu. Avaru Aṅkōladalli kāytiddāre.
    en: I won't say I've forgiven you now. It would be a lie. I won't say I won't send the notice, and I won't say I will. Let's see at Gokarna. Start the car. They're waiting at Ankola.
  - section: Meanwhile, in the other car
    learn: 'gossip and its limits: lē-āph āda mēle phaṇḍiṅg sikkilla ante · ante-kante bēḍa · a doctor''s eye: mūru rātri eraḍu gaṇṭege bālkaniyalli · seeing both sides: sāiḍ tagoḷḷōdu sulabha, eraḍū kaḍe nillōdu kaṣṭa · a journalist''s choice: ā vīḍiyō ḍilīṭ māḍde'
  - scene: Arjun's car, the same ghat, two bends behind. Shruti drives. Six people, and for a while only the sound of the engine braking on the curves.
  - who: ramya
    t: ಒಂದು ವಿಷಯ ಹೇಳ್ಲಾ? ಸ್ಟಾರ್ಟಪ್ ಬೀಟ್ ನೋಡೋ ನನ್ನ ಕೊಲೀಗ್ ಹೇಳ್ತಿದ್ದ — ಅರ್ಜುನ್ ಕಂಪನಿಗೆ ಲೇಆಫ್ ಆದ ಮೇಲೆ ಮುಂದಿನ ರೌಂಡ್ ಫಂಡಿಂಗ್ ಸಿಕ್ಕಿಲ್ಲ ಅಂತೆ.
    tr: Ondu viṣaya hēḷlā? Sṭārṭap bīṭ nōḍō nanna kolīg hēḷtidda — Arjun kampanige lē-āph āda mēle mundina rauṇḍ phaṇḍiṅg sikkilla ante.
    en: Shall I tell you something? A colleague of mine who covers the startup beat was saying — after the layoffs, Arjun's company apparently didn't get its next round of funding.
  - who: kaveri
    t: ‘ಅಂತೆ.’ ಅಂತೆ-ಕಂತೆ ಬೇಡ ರಮ್ಯಾ. ಅವನೇ ಹೇಳ್ತೀನಿ ಅಂದಿದ್ದಾನೆ. ಅವನ ಬಾಯಿಂದಲೇ ಕೇಳೋಣ.
    tr: ‘Ante.’ Ante-kante bēḍa Ramyā. Avanē hēḷtīni andiddāne. Avana bāyindalē kēḷōṇa.
    en: '''Apparently.'' No hearsay, Ramya. He said he''ll tell us himself. Let''s hear it from his own mouth.'
  - who: imran
    t: ನಾ ಒಂದು ನೋಡೀನಿ, ಅದು ಅಂತೆ ಅಲ್ಲ. ಮೂರು ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಅಂವ ಬಾಲ್ಕನಿಯಾಗ ಕುಂತು ಫೋನ್ ನೋಡಾಕತ್ತಿದ್ದ. ಇ-ಮೇಲ್, ಎಕ್ಸೆಲ್ ಶೀಟ್. ನನಗೂ ನಿದ್ದಿ ಇರಲಿಲ್ಲ, ಅದಕ್ಕೇ ಗೊತ್ತು.
    tr: Nā ondu nōḍīni, adu ante alla. Mūru rātri eraḍu gaṇṭege aṃva bālkaniyāga kuntu phōn nōḍākattidda. I-mēl, eksel śīṭ. Nanagū niddi iralilla, adakkē gottu.
    en: I saw something myself, and that's not hearsay. Three nights running, at two in the morning, he was sitting on the balcony looking at his phone. Emails, Excel sheets. I wasn't sleeping either — that's how I know.
  - who: prakash
    t: ಖರೇ ಹೇಳ್ತೇನಿ. ಚಿತ್ರದುರ್ಗದಾಗ ನನ್ ಮಾತಿಗೆ ನಕ್ಕಾಂವ ಅಂವ. ಇನ್ನೂ ಆ ಸಿಟ್ಟು ಐತಿ. ಆದ್ರ ಇವತ್ತು ಆ ಟೀ ಅಂಗಡಿ ಮುಂದ ಅವನ ಮುಖ ನೋಡಿದ್ರ ಪಾಪ ಅನ್ನಿಸ್ತು. ಮನುಷ್ಯ ಒಳಗಿಂದ ಮುರಿದಾನ.
    tr: Kharē hēḷtēni. Citradurgadāga nan mātige nakkāṃva aṃva. Innū ā siṭṭu aiti. Ādra ivattu ā ṭī aṅgaḍi munda avana mukha nōḍidra pāpa annistu. Manuṣya oḷaginda muridāna.
    en: I'll be honest. He's the one who laughed at the way I talk, at Chitradurga. I'm still angry about that. But seeing his face in front of that tea shop today, I felt sorry for him. The man's broken inside.
  - who: shruti
    t: ಅರ್ಜುನ್ ಯಾವಾಗ್ಲೂ ಹೀಗೇ. ಕಷ್ಟ ಬಂದಾಗ ಸಹಾಯ ಕೇಳಲ್ಲ, ಎಲ್ಲರಿಂದ ದೂರ ಓಡ್ತಾನೆ. ಎರಡು ಸಾವಿರದ ಹನ್ನೆರಡರಲ್ಲೂ ಹಾಗೇ ಮಾಡಿದ್ದ.
    tr: Arjun yāvāglū hīgē. Kaṣṭa bandāga sahāya kēḷalla, ellarinda dūra ōḍtāne. Eraḍu sāvirada hanneraḍarallū hāgē māḍidda.
    en: Arjun's always been like this. When trouble comes he doesn't ask for help — he runs away from everyone. He did the same thing in 2012.
  - who: ramya
    t: ಎರಡು ಸಾವಿರದ ಹನ್ನೆರಡು ಅಂದ್ರೆ… ಪುಣೆ? ಶ್ರುತಿ, ನೀನು ಯಾವತ್ತೂ ಅದರ ಬಗ್ಗೆ…
    tr: Eraḍu sāvirada hanneraḍu andre… Puṇe? Śruti, nīnu yāvattū adara bagge…
    en: 2012 means… Pune? Shruti, you've never once talked about…
  - who: shruti
    t: ಅದು ಸಮುದ್ರದ ಹತ್ರ, ರಮ್ಯಾ. ಈಗ ಅಲ್ಲ. ಈಗ ರೋಡ್ ನೋಡೋಕೆ ಬಿಡಿ, ಮುಂದೆ ಹೇರ್‌ಪಿನ್ ಇದೆ.
    tr: Adu samudrada hatra, Ramyā. Īga alla. Īga rōḍ nōḍōke biḍi, munde hēr-pin ide.
    en: That's for the sea, Ramya. Not now. Now let me watch the road, there's a hairpin coming.
  - who: deepa
    t: ದುಡ್ಡಿನ ವಿಷಯದಲ್ಲಿ ಮೌನ ಎಷ್ಟು ನೋವು ಕೊಡುತ್ತೆ ಅಂತ ನನಗೆ ಗೊತ್ತು. ಜಾಯಿಂಟ್ ಅಕೌಂಟ್‌ನಿಂದ ದುಡ್ಡು ಹೋಗ್ತಿರುತ್ತೆ, ಯಾರೂ ಏನೂ ಹೇಳಲ್ಲ… ನವೀನ್‌ನ ಸಿಟ್ಟು ನನಗೆ ಅರ್ಥ ಆಗುತ್ತೆ.
    tr: Duḍḍina viṣayadalli mauna eṣṭu nōvu koḍutte anta nanage gottu. Jāyiṇṭ akauṇṭ-ninda duḍḍu hōgtirutte, yārū ēnū hēḷalla… Navīn-na siṭṭu nanage artha āgutte.
    en: I know how much silence about money hurts. Money keeps going out of a joint account and nobody says a word… I understand Naveen's anger.
  - scene: Prakash and Imran glance at each other. Kaveri, beside Deepa, quietly takes her hand.
  - who: imran
    t: ದೀಪಾ, ನೀ ರಾತ್ರಿ ‘ಇನ್ನೊಂದು ದಿನ ಹೇಳ್ತೀನಿ’ ಅಂದಿದ್ದು… ಇದೇನಾ?
    tr: Dīpā, nī rātri ‘innondu dina hēḷtīni’ andiddu… idēnā?
    en: Deepa, what you said last night — 'I'll tell you another day'… is it this?
  - who: deepa
    t: ಇದೂ ಹೌದು. ಇನ್ನೊಂದು ದಿನ, ಇಮ್ರಾನ್. ಪ್ರಾಮಿಸ್.
    tr: Idū haudu. Innondu dina, Imrān. Prāmis.
    en: This too, yes. Another day, Imran. Promise.
  - who: kaveri
    t: ನೋಡಿ, ಸೈಡ್ ತಗೊಳ್ಳೋದು ಸುಲಭ. ಎರಡೂ ಕಡೆ ನಿಲ್ಲೋದು ಕಷ್ಟ. ಫ್ರೆಂಡ್ಸ್ ಅಂದ್ರೆ ಎರಡನೇದು. ನವೀನ್ ಜೊತೆ ನ್ಯಾಯ ನಿಲ್ಲುತ್ತೆ. ಅರ್ಜುನ್ ಜೊತೆ ನಾವು ನಿಲ್ಲಬೇಕು.
    tr: Nōḍi, sāiḍ tagoḷḷōdu sulabha. Eraḍū kaḍe nillōdu kaṣṭa. Phreṇḍs andre eraḍanēdu. Navīn jote nyāya nillutte. Arjun jote nāvu nillabēku.
    en: Look, taking sides is easy. Standing on both sides is hard. Friends do the second. Justice will stand with Naveen. We have to stand with Arjun.
  - who: ramya
    t: ಸರಿ. ಮತ್ತೆ ಒಂದು ವಿಷಯ, ವಕೀಲರೇ — ಆ ಟೀ ಅಂಗಡಿಯಲ್ಲಿ ನಡೆದಿದ್ದೆಲ್ಲಾ ನನ್ನ ಫೋನಲ್ಲಿ ರೆಕಾರ್ಡ್ ಆಗಿತ್ತು. ಈಗಷ್ಟೇ ಡಿಲೀಟ್ ಮಾಡ್ದೆ.
    tr: Sari. Matte ondu viṣaya, vakīlarē — ā ṭī aṅgaḍiyalli naḍediddellā nanna phōnalli rekārḍ āgittu. Īgaṣṭē ḍilīṭ māḍde.
    en: OK. And one more thing, Counsel — everything that happened at the tea shop was recorded on my phone. I've just deleted it.
  - who: kaveri
    t: ಗುಡ್. ಹೆಮ್ಮೆ ಆಯ್ತು.
    tr: Guḍ. Hemme āytu.
    en: Good. I'm proud of you.
  - who: ramya
    t: ಹನ್ನೆರಡು ವರ್ಷದಲ್ಲಿ ಮೊದಲ ಸಲ ಕೈಗೆ ಸಿಕ್ಕಿದ ಸ್ಟೋರಿಗೆ ‘ಬೇಡ’ ಅಂದೆ. ಏನೋ ಒಂದು ತರ ಆಗ್ತಿದೆ… ಆದ್ರೆ ಒಳ್ಳೇ ತರ.
    tr: Hanneraḍu varṣadalli modala sala kaige sikkida sṭōrige ‘bēḍa’ ande. Ēnō ondu tara āgtide… ādre oḷḷē tara.
    en: For the first time in twelve years I said 'no' to a story that fell into my hands. I feel strange… but a good kind of strange.
  - who: imran
    t: ಶ್ರುತಿ, ಜರಾ ಹಾಡು ಹಾಕು. ಇಷ್ಟು ಗಂಭೀರ ಇದ್ರ ಘಟ್ಟ ಮುಗಿಯೂದ್ರಾಗ ನನ್ ಬಿಪಿ ಏರ್ತದ.
    tr: Śruti, jarā hāḍu hāku. Iṣṭu gambhīra idra ghaṭṭa mugiyūdrāga nan bipi ērtada.
    en: Shruti, put on some music. If it stays this serious, my BP will be up before the ghat's over.
  - who: shruti
    t: ಸರಿ, ಡಾಕ್ಟರ್ ಆರ್ಡರ್. ‘ಮುಂಗಾರು ಮಳೆ’ ಹಾಕ್ಲಾ?
    tr: Sari, ḍākṭar ārḍar. ‘Muṅgāru Maḷe’ hāklā?
    en: All right, doctor's orders. Shall I put on 'Mungaru Male'?
  - who: ramya
    t: ಬೇಡ ಮರ್ರೆ! ಆ ಹಾಡು ಹಾಕಿದ್ರೆ ಈ ಕಾರಲ್ಲಿ ಎಲ್ರೂ ಅಳ್ತಾರೆ. ಏನಾದ್ರೂ ಕುಣಿಯೋ ಹಾಡು ಹಾಕು.
    tr: Bēḍa marre! Ā hāḍu hākidre ī kāralli ellrū aḷtāre. Ēnādrū kuṇiyō hāḍu hāku.
    en: No, marre! Put that song on and everyone in this car will cry. Put on something you can dance to.
  - scene: Ankola, a junction by the highway. The six are standing beside Arjun's car eating Amma's rotti out of the cloth bundle. Naveen's car pulls in. Naveen gets out first.
  - who: ramya
    t: ಎಂತ ಆಯ್ತ್ ಮರ್ರೆ? ಇಬ್ರೂ ಜೀವಂತ ಇದ್ರಿ, ಸದ್ಯಕ್ಕೆ ಅಷ್ಟು ಸಾಕು.
    tr: Enta āyt marre? Ibrū jīvanta idri, sadyakke aṣṭu sāku.
    en: So what happened, marre? You're both alive — that's enough for now.
  - who: naveen
    t: ಜೀವಂತ ಉಂಟು. ಮೂರು ಲಕ್ಷ ಬರ್ತಾ ಉಂಟು, ಐದು ಬಾಕಿ. ಮಾತು ಇನ್ನೂ ಬಾಕಿ. ಆ ರೊಟ್ಟಿ ಸ್ವಲ್ಪ ಕೊಡಿ, ಹಸಿವಾಗ್ತಿದೆ.
    tr: Jīvanta uṇṭu. Mūru lakṣa bartā uṇṭu, aidu bāki. Mātu innū bāki. Ā roṭṭi svalpa koḍi, hasivāgtide.
    en: Alive, yes. Three lakh is on its way, five is pending. The talking's still pending too. Give me some of that rotti — I'm hungry.
  - who: prakash
    t: ತಗೊಳ್ರಿ. ಅವ್ವ ಹೇಳಿದ್ದು ಖರೇ ಆತು — ಘಟ್ಟದಾಗ ಹೋಟ್ಲಾ ಸಿಗಲಿಲ್ಲ, ಅವಳ ರೊಟ್ಟಿನೇ ಗತಿ.
    tr: Tagoḷri. Avva hēḷiddu kharē ātu — ghaṭṭadāga hōṭlā sigalilla, avaḷa roṭṭinē gati.
    en: Here, take it. What Avva said came true — no hotel on the ghat, her rotti is all we've got.
  - who: arjun
    t: ಪ್ರಕಾಶ್… ನಿಮ್ಮಮ್ಮ ಬೆಳಿಗ್ಗೆ ಹೇಳಿದ ಹಗ್ಗದ ಮಾತು. ಅದು ನನಗೇ ಅಂತ ಗೊತ್ತಿತ್ತು ಅವರಿಗೆ, ಅಲ್ವಾ?
    tr: Prakāś… nimmamma beḷigge hēḷida haggada mātu. Adu nanagē anta gottittu avarige, alvā?
    en: Prakash… what your mother said this morning about the rope. She knew it was meant for me, didn't she?
  - who: prakash
    t: ನನ್ ಅವ್ವಗ ಎಲ್ಲಾ ಗೊತ್ತಾಗ್ತದ್ರಿ, ಅರ್ಜುನ್ ಅವರೇ. ಯಾರೂ ಹೇಳಬೇಕಾಗಿಲ್ಲ.
    tr: Nan avvaga ellā gottāgtadri, Arjun avarē. Yārū hēḷabēkāgilla.
    en: My mother knows everything, Arjun-avare. Nobody has to tell her.
  - chapter: Chapter 8 — Gokarna
  - section: The homestay
    learn: 'coastal welcome: banni mārāyre, rūm reḍi uṇṭu, bisi nīru uṇṭu · beach safety: keṃpu bāvuṭa dāṭbēḍi, laiph-gārḍ uṇṭu, alegaḷu mōsa · the fish thali: baṅguḍe phrai, añjal tavā phrai, sigaḍi sukka, mīnu sāru, kuccalakki anna, sōl-kaḍi · a vegetarian plate: tambuḷi, patroḍe · being recognised: nīvu ṭiviyalli baruvavaralvā?'
  - scene: 'Two in the afternoon. A homestay on the hill above Kudle beach, Gokarna: red laterite walls, a tiled roof, coconut palms, the sea below. The owner, a wiry man in a lungi with a towel on his shoulder, comes down the steps.'
  - who: host
    t: ಬನ್ನಿ ಮಾರಾಯ್ರೆ, ಬನ್ನಿ! ಘಟ್ಟ ಇಳಿದು ಬಂದ್ರಾ? ಸುಸ್ತಾಗಿರ್ತದೆ. ನಾಲ್ಕು ರೂಮ್ ರೆಡಿ ಉಂಟು, ಬಿಸಿ ನೀರು ಉಂಟು, ಸಮುದ್ರ ಕೆಳಗೇ ಉಂಟು. ಬೇರೆ ಎಂತ ಬೇಕು?
    tr: Banni mārāyre, banni! Ghaṭṭa iḷidu bandrā? Sustāgirtade. Nālku rūm reḍi uṇṭu, bisi nīru uṇṭu, samudra keḷagē uṇṭu. Bēre enta bēku?
    en: Come in, come in! Came down the ghat, did you? You must be tired. Four rooms are ready, there's hot water, and the sea is right below. What else do you need?
  - who: naveen
    t: ನಮಸ್ಕಾರ ಅಣ್ಣ. ನಾನು ನವೀನ್, ಉಡುಪಿಯವನು. ಫೋನಲ್ಲಿ ಮಾತಾಡಿದ್ದು ನಾನೇ. ನೀವು ಮೂಲತಃ ಇಲ್ಲಿಯವರಾ?
    tr: Namaskāra aṇṇa. Nānu Navīn, Uḍupiyavanu. Phōnalli mātāḍiddu nānē. Nīvu mūlataḥ illiyavarā?
    en: Namaskara, Anna. I'm Naveen, from Udupi. I'm the one who spoke to you on the phone. Are you from here originally?
  - who: host
    t: ಇಲ್ಲ ಮಾರಾಯ, ನಾನು ಕುಂದಾಪುರದವನು. ಇಪ್ಪತ್ತು ವರ್ಷದ ಹಿಂದೆ ಇಲ್ಲಿಗೆ ಬಂದೆ. ಮೊದಲು ಒಂದು ಚಹಾ ಅಂಗಡಿ, ಈಗ ಈ ಹೋಮ್‌ಸ್ಟೇ. ಸಮುದ್ರ ಬದಲಾಗಿಲ್ಲ, ನಾನು ಬದಲಾದೆ ಅಷ್ಟೇ.
    tr: Illa mārāya, nānu Kundāpuradavanu. Ippattu varṣada hinde illige bande. Modalu ondu cahā aṅgaḍi, īga ī hōm-sṭē. Samudra badalāgilla, nānu badalāde aṣṭē.
    en: No, mārāya, I'm from Kundapura. Came here twenty years ago. First a tea stall, now this homestay. The sea hasn't changed — only I have.
  - who: ramya
    t: ಕುಂದಾಪ್ರನಾ? ಎಂತ ಮರ್ರೆ, ನಾನೂ ಕುಂದಾಪ್ರದವಳೇ! ಕೋಟೇಶ್ವರದ ಹತ್ರ ಮನೆ. ನೀವು ಯಾವ ಕಡೆ?
    tr: Kundāpranā? Enta marre, nānū Kundāpradavaḷē! Kōṭēśvarada hatra mane. Nīvu yāva kaḍe?
    en: Kundapura? No way, marre, I'm from Kundapura too! Our house is near Koteshwara. Which side are you from?
  - who: host
    t: ಬಸ್ರೂರು. ಅಯ್ಯೋ, ಎಷ್ಟು ವರ್ಷ ಆಯ್ತು ನಮ್ಮ ಭಾಷಿ ಕೇಳಿ! ಒಂದು ನಿಮಿಷ… ನೀವು ಟಿವಿಯಲ್ಲಿ ಬರುವವರಲ್ವಾ? ರಾತ್ರಿ ಒಂಬತ್ತು ಗಂಟೆ ಡಿಬೇಟ್‌ನಲ್ಲಿ ಜೋರಾಗಿ ಕೂಗುವವರು?
    tr: Basrūru. Ayyō, eṣṭu varṣa āytu namma bhāṣi kēḷi! Ondu nimiṣa… nīvu ṭiviyalli baruvavaralvā? Rātri ombattu gaṇṭe ḍibēṭ-nalli jōrāgi kūguvavaru?
    en: Basrur. Oh, it's been so many years since I heard our own speech! Wait a minute… aren't you the one on TV? The one who shouts loudly on the nine o'clock debate?
  - scene: The friends burst out laughing. Ramya's smile stays on her face a moment too long.
  - who: ramya
    t: ಹೌದು… ಅವಳೇ. ಕೂಗೋದು ಕೆಲಸದ ಭಾಗ ಅಣ್ಣ.
    tr: Haudu… avaḷē. Kūgōdu kelasada bhāga aṇṇa.
    en: Yes… that's me. Shouting is part of the job, Anna.
  - who: host
    t: 'ಇರಲಿ ಇರಲಿ. ಇಲ್ಲಿ ಕೂಗುವುದು ಸಮುದ್ರ ಮಾತ್ರ. ಒಂದು ವಿಷಯ ಎಲ್ಲರಿಗೂ ಹೇಳ್ತೇನೆ, ಬೇಜಾರು ಮಾಡ್ಕೋಬೇಡಿ: ನೀರಿಗೆ ಇಳಿಯುವಾಗ ಕೆಂಪು ಬಾವುಟ ದಾಟಬೇಡಿ. ಲೈಫ್‌ಗಾರ್ಡ್ ಉಂಟು, ಆದರೆ ಇಲ್ಲಿ ಅಲೆ ಮೋಸ. ಮೇಲೆ ಶಾಂತ, ಕೆಳಗೆ ಎಳೆತ.'
    tr: 'Irali irali. Illi kūguvudu samudra mātra. Ondu viṣaya ellarigū hēḷtēne, bējāru māḍkōbēḍi: nīrige iḷiyuvāga kempu bāvuṭa dāṭabēḍi. Laiph-gārḍ uṇṭu, ādare illi ale mōsa. Mēle śānta, keḷage eḷeta.'
    en: 'Never mind, never mind. Here only the sea shouts. One thing I tell everyone, don''t take it badly: when you go into the water, don''t cross the red flag. There are lifeguards, but the waves here are deceptive. Calm on top, a pull underneath.'
  - who: imran
    t: ಹೌದ್ರಿ ಅಣ್ಣಾರ. ಮುರುಡೇಶ್ವರದಾಗ ಸಾಲಿ ಹುಡುಗಿಯರು ಮುಳುಗಿದ ಸುದ್ದಿ ನೆನಪೈತಿ. ಆಮೇಲೆ ಅಲ್ಲಿ ಬೀಚ್ ಬಂದ್ ಮಾಡಿದ್ರು ಅಲ್ಲ?
    tr: Haudri aṇṇāra. Muruḍēśvaradāga sāli huḍugiyaru muḷugida suddi nenapaiti. Āmēle alli bīc band māḍidru alla?
    en: Yes, Anna. I remember the news of the schoolgirls who drowned at Murudeshwar. Didn't they close the beach there after that?
  - who: host
    t: ಹೌದು, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ನಾಲ್ಕರ ಡಿಸೆಂಬರ್. ಕೋಲಾರದ ಶಾಲೆ ಮಕ್ಕಳು, ಪಾಪ. ಅದಕ್ಕೇ ನಾನು ಎಲ್ಲರಿಗೂ ಹೇಳುವುದು. ಸಮುದ್ರ ನೋಡಲು ಚಂದ, ಆಟಕ್ಕೆ ಅಲ್ಲ.
    tr: Haudu, eraḍu sāvirada ippatnālkara Ḍisembar. Kōlārada śāle makkaḷu, pāpa. Adakkē nānu ellarigū hēḷuvudu. Samudra nōḍalu canda, āṭakke alla.
    en: Yes, December 2024. Schoolchildren from Kolar, poor things. That's why I tell everyone. The sea is beautiful to look at — it's not a toy.
  - scene: Half past two. Lunch on the veranda, on banana leaves. The host and his wife bring dish after dish.
  - who: host
    t: ಇದು ಬಂಗುಡೆ ಫ್ರೈ, ಇದು ಅಂಜಲ್ ತವಾ ಫ್ರೈ, ಸಿಗಡಿ ಸುಕ್ಕ, ಮೀನು ಸಾರು. ಅನ್ನ ಕುಚ್ಚಲಕ್ಕಿ — ಕೆಂಪು ಅಕ್ಕಿ. ಕೊನೆಗೆ ಸೋಲ್‌ಕಡಿ, ಹೊಟ್ಟೆ ತಣ್ಣಗೆ ಮಾಡ್ತದೆ.
    tr: Idu baṅguḍe phrai, idu añjal tavā phrai, sigaḍi sukka, mīnu sāru. Anna kuccalakki — kempu akki. Konege sōl-kaḍi, hoṭṭe taṇṇage māḍtade.
    en: This is mackerel fry, this is seer fish tawa fry, dry prawns, fish curry. The rice is kuchalakki — red boiled rice. And at the end, sol kadhi; it cools the stomach.
  - who: prakash
    t: ಅಣ್ಣಾರ, ನಾ ಮೀನು ತಿನ್ನಂಗಿಲ್ಲ, ಸಸ್ಯಾಹಾರಿ. ಸುಮ್ನ ಅನ್ನ-ಮೊಸರು ಕೊಟ್ರ ಸಾಕು, ತೊಂದರಿ ತಗೋಬ್ಯಾಡ್ರಿ.
    tr: Aṇṇāra, nā mīnu tinnaṅgilla, sasyāhāri. Sumna anna-mosaru koṭra sāku, tondari tagōbyāḍri.
    en: Anna, I don't eat fish, I'm vegetarian. Just give me rice and curd, that's enough — don't go to any trouble.
  - who: host
    t: 'ಅನ್ನ-ಮೊಸರಾ? ನನ್ನ ಮನೆಯಲ್ಲಿ? ಸೀನ್ ಇಲ್ಲ ಮಾರಾಯ! ನಿಮಗೆ ಬೇರೆ ಎಲೆ: ಒಂದೆಲಗದ ತಂಬುಳಿ, ಕೆಸುವಿನ ಎಲೆಯ ಪತ್ರೊಡೆ, ಹಲಸಿನ ಹಪ್ಪಳ. ತಂಬುಳಿ ಉತ್ತರ ಕನ್ನಡದ ಸ್ಪೆಷಲ್.'
    tr: 'Anna-mosarā? Nanna maneyalli? Sīn illa mārāya! Nimage bēre ele: ondelagada tambuḷi, kesuvina eleya patroḍe, halasina happaḷa. Tambuḷi Uttara Kannaḍada speṣal.'
    en: 'Rice and curd? In my house? No way, mārāya! You get your own leaf: tambuli made with brahmi leaves, patrode from colocasia leaves, jackfruit papad. Tambuli is an Uttara Kannada speciality.'
  - who: shruti
    t: ನೆನಪಿದ್ಯಾ? ಥರ್ಡ್ ಇಯರ್ ಟ್ರಿಪ್, ಇದೇ ಗೋಕರ್ಣ. ನಾವು ಎಂಟು ಜನ, ಬಾಡಿಗೆ ಟೆಂಪೋ ಟ್ರಾವೆಲರ್, ಕುಡ್ಲೆ ಬೀಚಲ್ಲಿ ಟೆಂಟ್ — ಮತ್ತೆ ನವೀನ್‌ನ ಒಂದು ಚಪ್ಪಲಿ.
    tr: Nenapidyā? Tharḍ iyar ṭrip, idē Gōkarṇa. Nāvu eṇṭu jana, bāḍige ṭempō ṭrāvelar, Kuḍle bīcalli ṭeṇṭ — matte Navīn-na ondu chappali.
    en: Remember? The third-year trip, this same Gokarna. The eight of us, a hired Tempo Traveller, tents on Kudle beach — and one of Naveen's slippers.
  - who: imran
    t: ನೆನಪಿಲ್ಲದ ಏನು? ಆವಾಗ ನಮ್ ಹತ್ರ ದುಡ್ಡು ಇರಲಿಲ್ಲ, ಬರೇ ಬನ್ ಮತ್ತ ಚಹಾ ಮ್ಯಾಲೆ ಮೂರು ದಿನ. ಈಗ ದುಡ್ಡು ಐತಿ, ಆದ್ರ ಆವಾಗಿನ ನಿದ್ದಿ ಇಲ್ಲ.
    tr: Nenapillada ēnu? Āvāga nam hatra duḍḍu iralilla, barē ban matta cahā myāle mūru dina. Īga duḍḍu aiti, ādra āvāgina niddi illa.
    en: How could I forget? Back then we had no money — three days on buns and tea. Now there's money, but not the sleep we had back then.
  - who: naveen
    t: ಬಂಗುಡೆ ಸರಿಯಾಗಿ ಮಸಾಲೆ ಹಿಡಿದಿದೆ. ನಮ್ಮ ಹೋಟೆಲ್ ಕುಕ್‌ಗೆ ಇದನ್ನ ತೋರಿಸ್ಬೇಕು. ಅರ್ಜುನ್, ಒಂದು ಫೋಟೋ ತೆಗೆ, ಪ್ಲೀಸ್.
    tr: Baṅguḍe sariyāgi masāle hiḍidide. Namma hōṭel kuk-ge idanna tōrisbēku. Arjun, ondu phōṭō tege, plīs.
    en: The mackerel has taken the masala just right. I must show this to our hotel cook. Arjun, take a photo, please.
  - scene: It is the first thing Naveen has asked Arjun for in four days. Arjun takes the photo carefully, twice.
  - who: arjun
    t: ತೆಗೆದೆ. ಎರಡು ಆಂಗಲ್. ಕಳಿಸ್ಲಾ ನಿನಗೆ?
    tr: Tegede. Eraḍu āṅgal. Kaḷislā ninage?
    en: Done. Two angles. Shall I send them to you?
  - who: naveen
    t: ಕಳಿಸು. ಮತ್ತೆ… ಮೂರು ಲಕ್ಷ ಬಂತು. ಈಗಷ್ಟೇ ಮೆಸೇಜ್ ನೋಡಿದೆ.
    tr: Kaḷisu. Matte… mūru lakṣa bantu. Īgaṣṭē mesēj nōḍide.
    en: Send them. And… the three lakh has come. I just saw the message.
  - scene: Arjun nods and lets out a long breath. Kaveri quietly takes out her phone.
  - who: kaveri
    t: ನವೀನ್, ಎಷ್ಟು ಬಂತು, ಯಾವ ದಿನ, ಯಾವ ಅಕೌಂಟಿಂದ — ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ಇಟ್ಕೋ. ಅಗ್ರಿಮೆಂಟ್‌ಗೆ ಬೇಕಾಗುತ್ತೆ.
    tr: Navīn, eṣṭu bantu, yāva dina, yāva akauṇṭinda — skrīn-śāṭ iṭkō. Agrimeṇṭ-ge bēkāgutte.
    en: 'Naveen — how much came, on what date, from which account: keep a screenshot. We''ll need it for the agreement.'
  - who: naveen
    t: ಇಟ್ಟಿದ್ದೇನೆ, ವಕೀಲರೇ. ಹೋಟೆಲ್‌ನವನಿಗೆ ರಸೀದಿ ಇಲ್ಲದೆ ನಿದ್ದೆ ಬರುವುದಿಲ್ಲ.
    tr: Iṭṭiddēne, vakīlarē. Hōṭel-navanige rasīdi illade nidde baruvudilla.
    en: Already done, Counsel. A hotel man can't sleep without a receipt.
  - who: host
    t: ರಸೀದಿ ಮಾತು ಬಂತಲ್ಲ — ನನ್ನ ಹೋಮ್‌ಸ್ಟೇ ಬಿಲ್ ಯಾರ ಹೆಸರಲ್ಲಿ ಮಾಡ್ಲಿ, ಮಾರಾಯ್ರೆ?
    tr: Rasīdi mātu bantalla — nanna hōmsṭē bil yāra hesaralli māḍli, mārāyre?
    en: Since receipts have come up — whose name shall I make the homestay bill out in, folks?
  - who: arjun
    t: ಎಂಟು ಭಾಗ ಮಾಡಿ, ಅಣ್ಣ. ಎಲ್ಲರೂ ಅವರವರ ಪಾಲು. ಈ ಸಲ ಕಂಪನಿ ಕಾರ್ಡ್ ಇಲ್ಲ.
    tr: Eṇṭu bhāga māḍi, aṇṇa. Ellarū avaravara pālu. Ī sala kampani kārḍ illa.
    en: Split it eight ways, Anna. Everyone pays their own share. No company card this time.
  - scene: Naveen looks up from his leaf. For the first time in four days, something like a smile.
  - who: naveen
    t: ಲೆಕ್ಕ ಸರಿ ಇದ್ರೆ…
    tr: Lekka sari idre…
    en: When the accounts are straight…
  - who: ramya
    t: …ಸ್ನೇಹ ಸರಿ ಇರ್ತದೆ! ಉಡುಪಿ ಕ್ಯಾಶ್ ಕೌಂಟರ್ ಫಿಲಾಸಫಿ, ಭಾಗ ಎರಡು!
    tr: …snēha sari irtade! Uḍupi kyāś kauṇṭar philāsaphi, bhāga eraḍu!
    en: …the friendship stays straight! Udupi cash-counter philosophy, part two!
  - section: One sentence, seven Kannadas
    learn: 'the dialect game, one sentence: ūṭa ideyā? → uṇṭā? (coast) · aitēnu? (Dharwad) · adā? (Kalaburagi) · aitā? (Mysuru countryside) · idyā? (Bengaluru) · hurry: bēga / lagūna / jaldi · coastal culture: Yakṣagāna, mēḷa, tirugāṭa, ceṇḍe, Baḍaguttiṭṭu · North Karnataka''s doḍḍāṭa / bayalāṭa · respect for daivārādhane: adu tamāṣe alla'
  - scene: Four in the afternoon. The cliff path from Kudle to Om beach, red earth and cashew bushes. The host walks ahead to show the way. From the top, the bay below curves in two arcs.
  - who: host
    t: ಇದೇ ಓಂ ಬೀಚ್. ಮೇಲಿಂದ ನೋಡಿದ್ರೆ ಓಂಕಾರದ ಆಕಾರ ಉಂಟು — ಎರಡು ಅರ್ಧಚಂದ್ರ ಸೇರಿದ ಹಾಗೆ.
    tr: Idē Ōṃ bīc. Mēlinda nōḍidre ōṅkārada ākāra uṇṭu — eraḍu ardhacandra sērida hāge.
    en: This is Om beach. From up here it has the shape of the Om symbol — like two half-moons joined together.
  - who: imran
    t: ಖರೇನಾ? ನನಗ ಓಂ ಕಾಣಿಸವಲ್ಲದು. ಎರಡು ಇಡ್ಲಿ ಪಕ್ಕ ಪಕ್ಕ ಇಟ್ಟಂಗ ಕಾಣಿಸ್ತದ.
    tr: Kharēnā? Nanaga Ōṃ kāṇisavalladu. Eraḍu iḍli pakka pakka iṭṭaṅga kāṇistada.
    en: Really? I can't see an Om. It looks like two idlis placed side by side.
  - who: ramya
    t: ಇಮ್ರಾನ್, ನಿಂಗೆ ಸಮುದ್ರದಲ್ಲೂ ಊಟನೇ ಕಾಣ್ತ್! ಡಾಕ್ಟರ್ ಆಗಿ ಡಯಟ್ ಬಗ್ಗೆ ಭಾಷಣ ಮಾತ್ರ.
    tr: Imrān, niṅge samudradallū ūṭanē kāṇt! Ḍākṭar āgi ḍayaṭ bagge bhāṣaṇa mātra.
    en: Imran, you see food even in the sea! As a doctor, all you do is lecture people about diets.
  - who: naveen
    t: 'ಒಂದು ಆಟ ಆಡುವ. ಒಂದೇ ವಾಕ್ಯ — ‘ಮನೆಯಲ್ಲಿ ಊಟ ಇದೆಯಾ? ಬೇಗ ಬಾ.’ ಎಲ್ಲರೂ ತಮ್ಮ ತಮ್ಮ ಊರಿನ ಕನ್ನಡದಲ್ಲಿ ಹೇಳಬೇಕು. ನಾನು ಮೊದಲು: ‘ಮನೆಯಲ್ಲಿ ಊಟ ಉಂಟಾ? ಬೇಗ ಬಾ ಮಾರಾಯ.’'
    tr: 'Ondu āṭa āḍuva. Ondē vākya — ‘maneyalli ūṭa ideyā? Bēga bā.’ Ellarū tamma tamma ūrina kannaḍadalli hēḷabēku. Nānu modalu: ‘maneyalli ūṭa uṇṭā? Bēga bā mārāya.’'
    en: 'Let''s play a game. One sentence — ''Is there food at home? Come quickly.'' Everyone says it in the Kannada of their own town. Me first: ''Maneyalli ūṭa uṇṭā? Bēga bā mārāya.'''
  - who: prakash
    t: ಮನ್ಯಾಗ ಊಟ ಐತೇನು? ಲಗೂನ ಬಾರಪಾ.
    tr: Manyāga ūṭa aitēnu? Lagūna bārapā.
    en: '''Manyāga ūṭa aitēnu? Lagūna bārapā.'''
  - who: imran
    t: ಮನ್ಯಾಗ ಊಟ ಅದಾ? ಜಲ್ದಿ ಬಾರಪಾ. ನಮ್ಮಲ್ಲಿ ‘ಜಲ್ದಿ’ ಉರ್ದುದು, ಆದ್ರ ಈಗ ಕನ್ನಡದ್ದೇ ಆಗೇತಿ.
    tr: Manyāga ūṭa adā? Jaldi bārapā. Nammalli ‘jaldi’ urdudu, ādra īga kannaḍaddē āgēti.
    en: '''Manyāga ūṭa adā? Jaldi bārapā.'' Our ''jaldi'' comes from Urdu, but by now it''s become Kannada.'
  - who: deepa
    t: 'ನಮ್ ಮೈಸೂರಿನ ಹಳ್ಳಿ ಕಡೆ: ‘ಮನೇಲಿ ಊಟ ಐತಾ? ಬೇಗ ಬಾರೇ.’ ನಮ್ ಅಜ್ಜಿ ಹಾಗೇ ಮಾತಾಡ್ತಿದ್ರು.'
    tr: 'Nam Maisūrina haḷḷi kaḍe: ‘manēli ūṭa aitā? Bēga bārē.’ Nam ajji hāgē mātāḍtidru.'
    en: 'In the villages around our Mysuru: ''Manēli ūṭa aitā? Bēga bārē.'' My grandmother used to talk like that.'
  - who: ramya
    t: 'ನಂದು: ‘ಮನೆಯಲ್ ಊಟ ಉಂಟಾ? ಬೇಗ್ ಬಾ ಮರ್ರೆ.’ ಅಣ್ಣ, ಸರಿ ಉಂಟಾ?'
    tr: 'Nandu: ‘maneyal ūṭa uṇṭā? Bēg bā marre.’ Aṇṇa, sari uṇṭā?'
    en: 'Mine: ''Maneyal ūṭa uṇṭā? Bēg bā marre.'' Anna, is that right?'
  - who: host
    t: ಸರಿ ಉಂಟು. ಬಸ್ರೂರಲ್ಲಿ ಹೇಳಿದ್ರೆ ಅಜ್ಜಿ ಕರೆದು ಎಲೆ ಹಾಕ್ತಾಳೆ.
    tr: Sari uṇṭu. Basrūralli hēḷidre ajji karedu ele hāktāḷe.
    en: It's right. Say that in Basrur and some grandmother will call you in and lay a leaf for you.
  - who: kaveri
    t: 'ನನ್ನ ಕನ್ನಡ ಸ್ಟ್ಯಾಂಡರ್ಡ್: ‘ಮನೇಲಿ ಊಟ ಇದೆಯಾ?’ ಮನೆ ಭಾಷೆ ಕೊಡವ ತಕ್ಕ್, ಅದು ಬೇರೆ ಭಾಷೆನೇ. ಆದ್ರೆ ಅಲ್ಲೂ ‘ಇದೆ’ಗೆ ಹೆಚ್ಚುಕಡಿಮೆ ‘ಉಂಡ್’ ಅಂತೀವಿ — ನವೀನ್‌ನ ‘ಉಂಟು’ಗೆ ತುಂಬಾ ಹತ್ತಿರ.'
    tr: 'Nanna kannaḍa sṭyāṇḍarḍ: ‘manēli ūṭa ideyā?’ Mane bhāṣe Koḍava takk, adu bēre bhāṣenē. Ādre allū ‘ide’ge heccukaḍime ‘uṇḍ’ antīvi — Navīn-na ‘uṇṭu’ge tumbā hattira.'
    en: 'My Kannada is standard: ''Manēli ūṭa ideyā?'' My home language is Kodava takk, which is a separate language. But there too we say something like ''uṇḍ'' for ''there is'' — very close to Naveen''s ''uṇṭu''.'
  - who: shruti
    t: 'ಮಲ್ಲೇಶ್ವರಂ ವರ್ಷನ್: ‘ಮನೇಲಿ ಊಟ ಇದ್ಯಾ? ಬೇಗ ಬಾ ಮಗಾ.’ ಅಷ್ಟೇ, ನಮ್ಮದು ಬೋರಿಂಗ್.'
    tr: 'Mallēśvaraṃ varṣan: ‘manēli ūṭa idyā? Bēga bā magā.’ Aṣṭē, nammadu bōriṅg.'
    en: 'Malleshwaram version: ''Manēli ūṭa idyā? Bēga bā magā.'' That''s it — ours is boring.'
  - scene: Everyone looks at Arjun. He hesitates, then looks straight at Prakash and says it slowly, carefully, without a trace of a joke.
  - who: arjun
    t: ಮನ್ಯಾಗ ಊಟ ಐತೇನ್ರೀ? ಲಗೂನ ಬರ್ರೀ.
    tr: Manyāga ūṭa aitēnrī? Lagūna barrī.
    en: '''Manyāga ūṭa aitēnrī? Lagūna barrī.'''
  - who: prakash
    t: ಹೂಂ. ಸರಿ ಹೇಳಿದ್ರಿ, ಅರ್ಜುನ್ ಅವರೇ. ‘ರೀ’ ಕೂಡ ಸರಿ ಜಾಗದಾಗ ಐತಿ.
    tr: Hūṃ. Sari hēḷidri, Arjun avarē. ‘Rī’ kūḍa sari jāgadāga aiti.
    en: Hm. You said it right, Arjun-avare. Even the 'rī' is in the right place.
  - who: arjun
    t: ಈ ಸಲ ನಗಿಸೋಕೆ ಅಲ್ಲ ಪ್ರಕಾಶ್. ಕಲಿಯೋಕೆ.
    tr: Ī sala nagisōke alla Prakāś. Kaliyōke.
    en: Not to get a laugh this time, Prakash. To learn.
  - who: prakash
    t: ನೋಡೋಣ್ರಿ.
    tr: Nōḍōṇri.
    en: We'll see.
  - who: naveen
    t: ನೋಡಿ — ಏಳು ಊರು, ಏಳು ರೀತಿ, ಊಟ ಒಂದೇ. ಯಾವುದೂ ತಪ್ಪಲ್ಲ. ಹಸಿವಿಗೆ ಉಚ್ಚಾರಣೆ ಗೊತ್ತಿಲ್ಲ.
    tr: Nōḍi — ēḷu ūru, ēḷu rīti, ūṭa ondē. Yāvudū tappalla. Hasivige uccāraṇe gottilla.
    en: See — seven towns, seven ways, one meal. None of them is wrong. Hunger doesn't care about pronunciation.
  - who: host
    t: ಇವತ್ತು ರಾತ್ರಿ ಪಕ್ಕದ ಊರಲ್ಲಿ ಯಕ್ಷಗಾನ ಉಂಟು. ಬಡಗುತಿಟ್ಟು ಮೇಳ. ತಿರುಗಾಟ ಈಗಷ್ಟೇ ಶುರುವಾಗಿದೆ, ಮೇ ತನಕ ಊರೂರು ತಿರುಗ್ತಾರೆ. ಬೆಳಗಿನ ತನಕ ನಡೀತದೆ.
    tr: Ivattu rātri pakkada ūralli Yakṣagāna uṇṭu. Baḍaguttiṭṭu mēḷa. Tirugāṭa īgaṣṭē śuruvāgide, Mē tanaka ūrūru tirugtāre. Beḷagina tanaka naḍītade.
    en: Tonight there's Yakshagana in the next village. A Badagutittu troupe. The touring season has only just begun — they go from village to village until May. It goes on till dawn.
  - who: naveen
    t: ಸಣ್ಣದಿರುವಾಗ ಅಜ್ಜನ ಹೆಗಲ ಮೇಲೆ ಕೂತು ರಾತ್ರಿಯಿಡೀ ಯಕ್ಷಗಾನ ನೋಡಿದ್ದು ಉಂಟು. ಚೆಂಡೆಯ ಶಬ್ದ ಕೇಳಿದ್ರೆ ಈಗಲೂ ಮೈ ಜುಂ ಅಂತದೆ.
    tr: Saṇṇadiruvāga ajjana hegala mēle kūtu rātriyiḍī Yakṣagāna nōḍiddu uṇṭu. Ceṇḍeya śabda kēḷidre īgalū mai jum antade.
    en: When I was small I watched Yakshagana all night sitting on my grandfather's shoulders. Even now, when I hear the chende drum, I get goosebumps.
  - who: prakash
    t: ನಮ್ ಕಡೆ ದೊಡ್ಡಾಟ, ಬಯಲಾಟ ಅಂತಾರ. ಜಾತ್ರಿಯಾಗ ರಾತ್ರಿಯಿಡೀ. ಎಲ್ಲಾ ಕಡೆ ಒಂದೇ ಕತಿ — ಭೀಮ, ದುರ್ಯೋಧನ — ಬ್ಯಾರೆ ಬ್ಯಾರೆ ಧ್ವನಿಯಾಗ.
    tr: Nam kaḍe doḍḍāṭa, bayalāṭa antāra. Jātriyāga rātriyiḍī. Ellā kaḍe ondē kati — Bhīma, Duryōdhana — byāre byāre dhvaniyāga.
    en: Where we come from they call it doddata, bayalata. All night long at the village fair. The same story everywhere — Bhima, Duryodhana — in different voices.
  - who: arjun
    t: ‘ಕಾಂತಾರ’ ಬಂದ ಮೇಲೆ ಬೆಂಗಳೂರಲ್ಲಿ ಥಿಯೇಟರ್‌ನಲ್ಲಿ ಎಲ್ಲಾರೂ ದೈವದ ಹಾಗೆ ‘ಓ…’ ಅಂತ ಕೂಗೋಕೆ ಶುರು ಮಾಡಿದ್ರು ನೆನಪಿದ್ಯಾ? ನಾನೂ…
    tr: ‘Kāntāra’ banda mēle Beṅgaḷūralli thiyēṭar-nalli ellārū daivada hāge ‘ō…’ anta kūgōke śuru māḍidru nenapidyā? Nānū…
    en: Remember, after 'Kantara' came out, in Bengaluru everyone in the theatres started shouting 'Ooo…' like the daiva? I did too…
  - who: naveen
    t: ಅದು ತಮಾಷೆ ಅಲ್ಲ ಅರ್ಜುನ್. ದೈವಾರಾಧನೆ ನಮ್ಮ ಜನರಿಗೆ ಪೂಜೆ. ಸಿನಿಮಾ ಹಾಲ್‌ನಲ್ಲಿ ಅದರ ನಕಲು ಮಾಡುವ ವಿಡಿಯೋ ನೋಡಿ ನಮ್ಮ ಅಜ್ಜಿ ಅತ್ತಿದ್ರು.
    tr: Adu tamāṣe alla Arjun. Daivārādhane namma janarige pūje. Sinimā hāl-nalli adara nakalu māḍuva viḍiyō nōḍi namma ajji attidru.
    en: That isn't a joke, Arjun. Daiva worship is sacred to our people. My grandmother cried when she saw videos of people imitating it in cinema halls.
  - who: arjun
    t: ಸಾರಿ. ಸರಿ ಹೇಳಿದೆ. ನಕಲು ಮಾಡೋದು ನನ್ನ ಹಳೇ ಕೆಟ್ಟ ಅಭ್ಯಾಸ ಅನ್ಸುತ್ತೆ — ಮಾತಲ್ಲೂ, ಪೂಜೆಯಲ್ಲೂ.
    tr: Sāri. Sari hēḷide. Nakalu māḍōdu nanna haḷē keṭṭa abhyāsa ansutte — mātallū, pūjeyallū.
    en: Sorry. You're right. I think imitating people is an old bad habit of mine — in speech, and in worship too.
  - scene: Prakash glances at Arjun and looks away at the sea. Nobody says anything. The sun is getting low.
  - section: Deepa on the sand
    learn: 'a call she can''t answer: saṅkrāntige bartīrā?, avaru… gottilla amma · breaking down: taḍeyōkāgtilla, ellā oḷagē iṭkoṇḍidde · comforting: nānidīni kaṇē, aḷu paravāgilla, ninna tappalla, ondondē hejje · the facts, plainly: mucyuval kansent, phyāmili kōrṭ, modala arji, kūliṅg pīriyaḍ · fear of ‘people’: jana ēnantāre'
  - scene: Sunset on Kudle beach. Kaveri and Shruti walk at the waterline; the others sit on the sand. Deepa's phone rings. 'Amma' on the screen. She answers with a bright voice.
  - who: deepa
    t: ಹಲೋ ಅಮ್ಮ… ಹೂಂ, ಚೆನ್ನಾಗಿದೀನಿ. ಗೋಕರ್ಣದಲ್ಲಿದೀವಿ, ಸಮುದ್ರ ಸಕ್ಕತ್ ಆಗಿದೆ… ಸಂಕ್ರಾಂತಿಗಾ? ಇಬ್ರೂ ಬರ್ತೀರಾ ಅಂತ ಕೇಳ್ತಿದೀಯಾ? ಅವರು… ಗೊತ್ತಿಲ್ಲ ಅಮ್ಮ. ಅವರಿಗೆ ರಜೆ… ಆಮೇಲೆ ಮಾತಾಡ್ತೀನಿ ಅಮ್ಮ, ಸಿಗ್ನಲ್ ಇಲ್ಲ. ಬೈ.
    tr: Halō amma… hūṃ, cennāgidīni. Gōkarṇadallidīvi, samudra sakkat āgide… Saṅkrāntigā? Ibrū bartīrā anta kēḷtidīyā? Avaru… gottilla amma. Avarige raje… āmēle mātāḍtīni amma, signal illa. Bai.
    en: Hello, Amma… yes, I'm fine. We're in Gokarna, the sea is gorgeous… For Sankranti? You're asking if both of us are coming? He… I don't know, Amma. His leave… I'll talk to you later, Amma, the signal's bad. Bye.
  - scene: She puts the phone face down on the sand. Her shoulders start to shake. Prakash sees it first.
  - who: prakash
    t: ದೀಪಾ? ಏನಾತು? ಮನಿಯಾಗ ಎಲ್ಲಾರೂ ಆರಾಮ ಅದಾರ?
    tr: Dīpā? Ēnātu? Maniyāga ellārū ārāma adāra?
    en: Deepa? What happened? Is everyone all right at home?
  - who: deepa
    t: ಎಲ್ರೂ ಆರಾಮ. ನಾನೇ… ಸಿಗ್ನಲ್ ಇದೆ ಪ್ರಕಾಶ್. ಫುಲ್ ಸಿಗ್ನಲ್ ಇದೆ. ಅಮ್ಮಂಗೆ ಸುಳ್ಳು ಹೇಳಿದೆ. ಒಂದು ವರ್ಷದಿಂದ ಸುಳ್ಳು ಹೇಳ್ತಿದೀನಿ. ಇನ್ನು ತಡೆಯೋಕಾಗ್ತಿಲ್ಲ.
    tr: Ellrū ārāma. Nānē… signal ide Prakāś. Phul signal ide. Ammaṅge suḷḷu hēḷide. Ondu varṣadinda suḷḷu hēḷtidīni. Innu taḍeyōkāgtilla.
    en: Everyone's fine. It's me… there is a signal, Prakash. Full signal. I lied to Amma. I've been lying for a year. I can't hold it in any more.
  - scene: She cries openly now. Kaveri and Shruti run up from the water. Shruti kneels and holds her.
  - who: shruti
    t: ನಾನಿದೀನಿ ಕಣೇ. ಅಳು, ಪರವಾಗಿಲ್ಲ. ಎಲ್ಲಾ ಒಳಗೇ ಇಟ್ಕೋಬೇಡ.
    tr: Nānidīni kaṇē. Aḷu, paravāgilla. Ellā oḷagē iṭkōbēḍa.
    en: I'm here, dear. Cry, it's all right. Don't keep it all inside.
  - who: deepa
    t: ಶ್ರುತಿ, ಕಾವೇರಿ — ನಿಮಗೆ ಗೊತ್ತು. ಉಳಿದವರಿಗೂ ಹೇಳ್ಬಿಡ್ತೀನಿ. ಸಾಕು ಈ ನಾಟಕ.
    tr: Śruti, Kāvēri — nimage gottu. Uḷidavarigū hēḷbiḍtīni. Sāku ī nāṭaka.
    en: Shruti, Kaveri — you two know. I'll tell the others as well. Enough of this act.
  - who: deepa
    t: ನಾನು ಮತ್ತೆ ರೋಹಿತ್ ಡಿವೋರ್ಸ್‌ಗೆ ಫೈಲ್ ಮಾಡಿದೀವಿ. ಮ್ಯೂಚುವಲ್ ಕನ್ಸೆಂಟ್. ಮೈಸೂರು ಫ್ಯಾಮಿಲಿ ಕೋರ್ಟಲ್ಲಿ, ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ. ಕಳೆದ ವರ್ಷ ಸೆಪ್ಟೆಂಬರ್‌ನಿಂದ ಬೇರೆ ಬೇರೆ ಇದೀವಿ. ಟ್ರಿಪ್‌ಗೆ ಬರೋ ಮುಂಚೆ, ಡಿಸೆಂಬರ್ ಮೂರಕ್ಕೆ ಕೋರ್ಟ್ ಡೇಟ್ ಇತ್ತು. ಅಪ್ಪ-ಅಮ್ಮಂಗೆ ಇನ್ನೂ ಗೊತ್ತಿಲ್ಲ.
    tr: Nānu matte Rōhit ḍivōrs-ge phail māḍidīvi. Myūcuval kanseṇṭ. Maisūru phyāmili kōrṭalli, Akṭōbar-nalli. Kaḷeda varṣa Sepṭembar-ninda bēre bēre idīvi. Ṭrip-ge barō muñce, Ḍisembar mūrakke kōrṭ ḍēṭ ittu. Appa-ammaṅge innū gottilla.
    en: Rohit and I have filed for divorce. Mutual consent. In the Mysuru family court, in October. We've lived apart since September last year. Just before the trip, on 3 December, there was a court date. My parents still don't know.
  - who: imran
    t: ಯಾ ಅಲ್ಲಾ… ದೀಪಾ. ರಾತ್ರಿ ನನ್ನ ನಿದ್ದಿ ಬಗ್ಗೆ ಕೇಳಿದಿ, ನಿನ್ನ ಒಳಗ ಇದೆಲ್ಲಾ ಇಟ್ಕೊಂಡು.
    tr: Yā Allā… Dīpā. Rātri nanna niddi bagge kēḷidi, ninna oḷaga idellā iṭkoṇḍu.
    en: Ya Allah… Deepa. Last night you asked about my sleep — carrying all this inside you.
  - who: naveen
    t: ಏನಾಯ್ತು ಅಂತ ಹೇಳ್ಬೇಕು ಅನ್ನಿಸಿದ್ರೆ ಹೇಳು. ಇಲ್ಲಾಂದ್ರೆ ಬೇಡ. ನಾವು ಇಲ್ಲೇ ಕೂತಿರ್ತೇವೆ.
    tr: Ēnāytu anta hēḷbēku annisidre hēḷu. Illāndre bēḍa. Nāvu illē kūtirtēve.
    en: If you feel like telling us what happened, tell us. If not, don't. We'll just sit here with you.
  - who: deepa
    t: 'ದೊಡ್ಡ ಕತೆ ಏನಿಲ್ಲ. ಯಾರೂ ಕೆಟ್ಟವರಲ್ಲ. ಹೊಡೆದಾಟ ಇಲ್ಲ, ಕೇಸ್ ಇಲ್ಲ. ಇಬ್ರೂ ಬೇರೆ ಬೇರೆ ದಿಕ್ಕಿಗೆ ಬೆಳೆದ್ವಿ. ದುಡ್ಡಿನ ವಿಷಯದಲ್ಲಿ ಮುಚ್ಚುಮರೆ, ಮಾತಿಲ್ಲದ ರಾತ್ರಿಗಳು… ಒಂದು ದಿನ ಡೈನಿಂಗ್ ಟೇಬಲ್ ಮುಂದೆ ಕೂತು ಇಬ್ರೂ ಒಟ್ಟಿಗೆ ಹೇಳಿದ್ವಿ: ಸಾಕು. ಇಬ್ರೂ ಸೋತ್ವಿ ಅನ್ಸುತ್ತೆ.'
    tr: 'Doḍḍa kate ēnilla. Yārū keṭṭavaralla. Hoḍedāṭa illa, kēs illa. Ibrū bēre bēre dikkige beḷedvi. Duḍḍina viṣayadalli muccumare, mātillada rātrigaḷu… ondu dina ḍainiṅg ṭēbal munde kūtu ibrū oṭṭige hēḷidvi: sāku. Ibrū sōtvi ansutte.'
    en: 'It''s not a big story. Nobody is a villain. No violence, no police case. We just grew in different directions. Secrecy about money, nights without a word… One day we sat at the dining table and said it together: enough. I think we both lost.'
  - who: kaveri
    t: ಅವಳ ಲಾಯರ್ ಆರು ತಿಂಗಳ ಕೂಲಿಂಗ್ ಪೀರಿಯಡ್ ಮನ್ನಾ ಮಾಡಿ ಅಂತ ಕೇಳ್ತಿದ್ದಾರೆ. ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ತೀರ್ಪಿನ ಪ್ರಕಾರ ಕೆಲವು ಕೇಸ್‌ಗಳಲ್ಲಿ ಅದು ಸಾಧ್ಯ — ಆದ್ರೆ ಕೋರ್ಟ್ ಒಪ್ಪಲೇಬೇಕು ಅಂತೇನಿಲ್ಲ. ಹಾಗಾಗಿ ತಾರೀಖು ಇನ್ನೂ ಖಚಿತ ಇಲ್ಲ.
    tr: Avaḷa lāyar āru tiṅgaḷa kūliṅg pīriyaḍ mannā māḍi anta kēḷtiddāre. Suprīṃ Kōrṭ tīrpina prakāra kelavu kēs-gaḷalli adu sādhya — ādre kōrṭ oppalēbēku antēnilla. Hāgāgi tārīkhu innū khacita illa.
    en: Her lawyer is asking for the six-month cooling-off period to be waived. Under a Supreme Court ruling that's possible in some cases — but the court isn't bound to agree. So there's no fixed date yet.
  - who: ramya
    t: ಮತ್ತೆ ಅಪ್ಪ-ಅಮ್ಮಂಗೆ ಯಾಕೆ ಹೇಳಿಲ್ಲ ದೀಪಾ? ಅವರು ನಿನ್ನ ಕಡೆನೇ ನಿಲ್ತಾರೆ ಅಲ್ವಾ?
    tr: Matte appa-ammaṅge yāke hēḷilla Dīpā? Avaru ninna kaḍenē niltāre alvā?
    en: And why haven't you told your parents, Deepa? They'll stand by you, won't they?
  - who: deepa
    t: ನಿಲ್ತಾರೆ. ಆದ್ರೆ ಮೊದಲು ಅಪ್ಪಂಗೆ ಬಿಪಿ ಏರುತ್ತೆ, ಅಮ್ಮ ‘ಜನ ಏನಂತಾರೆ, ನೆಂಟರಿಗೆ ಏನು ಹೇಳೋದು’ ಅಂತಾರೆ. ನನ್ನ ತಂಗಿ ಮದುವೆ ಮಾತುಕತೆ ನಡೀತಿದೆ. ಅದು ಹಾಳಾದ್ರೆ ನನ್ನಿಂದ ಅಂತ… ಅದೇ ಭಯ.
    tr: Niltāre. Ādre modalu appaṅge bipi ērutte, amma ‘jana ēnantāre, neṇṭarige ēnu hēḷōdu’ antāre. Nanna taṅgi maduve mātukate naḍītide. Adu hāḷādre nanninda anta… adē bhaya.
    en: They will. But first Appa's BP will shoot up, and Amma will say 'What will people say, what do we tell the relatives?' My younger sister's marriage talks are going on. If they fall apart, it'll be because of me… that's the fear.
  - who: ramya
    t: ‘ಜನ ಏನಂತಾರೆ’ — ಇದು ನಮ್ ದೇಶದ ಅತಿ ದೊಡ್ಡ ಕಾಯಿಲೆ. ಡಾಕ್ಟ್ರೇ, ಇದಕ್ಕೆ ಔಷಧಿ ಇದೆಯಾ?
    tr: ‘Jana ēnantāre’ — idu nam dēśada ati doḍḍa kāyile. Ḍākṭrē, idakke auṣadhi ideyā?
    en: '''What will people say'' — that''s the biggest disease in this country. Doctor, is there any medicine for it?'
  - who: imran
    t: 'ಇಲ್ಲ ನೋಡು. ಆದ್ರ ಒಂದು ಗೊತ್ತೈತಿ: ಸುಳ್ಳು ಎಷ್ಟು ದಿನ ಹೊತ್ತಿರ್ತೀವೋ ಅಷ್ಟು ಭಾರ ಆಗ್ತದ. ನಿನ್ ಅಪ್ಪಾಜಿ ಬಿಪಿ ನಾ ನೋಡ್ಕೋತೇನಿ, ಬೇಕಾದ್ರ ಫೋನ್ ಮ್ಯಾಲೆ.'
    tr: 'Illa nōḍu. Ādra ondu gottaiti: suḷḷu eṣṭu dina hottirtīvō aṣṭu bhāra āgtada. Nin appāji bipi nā nōḍkōtēni, bēkādra phōn myāle.'
    en: 'No, there isn''t. But I know one thing: the longer you carry a lie, the heavier it gets. I''ll take care of your father''s BP myself — over the phone if needed.'
  - who: prakash
    t: ದೀಪಾ, ನಿನ್ನೆ ಅವ್ವ ಹೇಳಿದ್ದು ನೆನಪೈತಿ? ಸಣ್ಣ ಉರಿಯಾಗ. ಒಂದೇ ದಿನದಾಗ ಎಲ್ಲಾ ಸರಿ ಮಾಡಬೇಕಂತಿಲ್ಲ. ಮೊದಲು ಅವ್ವಗ ಒಬ್ಬಾಕಿಗೇ ಹೇಳು. ಅವ್ವಂದಿರು ಗಟ್ಟಿ ಇರ್ತಾರ, ನಾವು ಅಂದ್ಕೊಂಡದ್ದಕ್ಕಿಂತ.
    tr: Dīpā, ninne avva hēḷiddu nenapaiti? Saṇṇa uriyāga. Ondē dinadāga ellā sari māḍabēkantilla. Modalu avvaga obbākigē hēḷu. Avvandiru gaṭṭi irtāra, nāvu andkoṇḍaddakkinta.
    en: Deepa, remember what my mother said yesterday? On a low flame. You don't have to fix everything in one day. Tell your mother first, just her alone. Mothers are stronger than we think.
  - who: arjun
    t: ನಿನ್ ತಪ್ಪಲ್ಲ ದೀಪಾ. ಒಂದು ಮದುವೆ ಮುಗಿಯೋದು ಸೋಲಲ್ಲ. ಸುಳ್ಳಿನ ಮೇಲೆ ಅದನ್ನ ನಡೆಸೋದು ಸೋಲು. ನಾನು ಯಾರಿಗೆ ಹೇಳ್ತಿದೀನಿ ನೋಡು — ಸುಳ್ಳಿನ ಮೇಲೆ ಕಂಪನಿ ನಡೆಸ್ತಿರೋನು.
    tr: Nin tappalla Dīpā. Ondu maduve mugiyōdu sōlalla. Suḷḷina mēle adanna naḍesōdu sōlu. Nānu yārige hēḷtidīni nōḍu — suḷḷina mēle kampani naḍestirōnu.
    en: It's not your fault, Deepa. A marriage ending isn't a defeat. Keeping it going on a lie is. And look who's saying this — a man running a company on a lie.
  - scene: Naveen turns to look at Arjun. He says nothing, but he moves a little closer on the sand.
  - who: deepa
    t: ಸರಿ. ಬೆಂಗಳೂರಿಗೆ ಹೋದ ಮೇಲೆ ಅಲ್ಲ, ನಾಳೆ ರಾತ್ರಿನೇ ಅಮ್ಮಂಗೆ ಫೋನ್ ಮಾಡ್ತೀನಿ. ಒಬ್ಬಳೇ ಅಲ್ಲ — ನೀವೆಲ್ಲಾ ಪಕ್ಕದಲ್ಲಿದ್ರೆ.
    tr: Sari. Beṅgaḷūrige hōda mēle alla, nāḷe rātrinē ammaṅge phōn māḍtīni. Obbaḷē alla — nīvellā pakkadallidre.
    en: All right. Not after we get back to Bengaluru — I'll call Amma tomorrow night itself. Not alone — if you're all beside me.
  - who: shruti
    t: ಪಕ್ಕದಲ್ಲೇ ಇರ್ತೀವಿ. ಒಂದೊಂದೇ ಹೆಜ್ಜೆ. ಇವತ್ತಿಗೆ ಇಷ್ಟು ಸಾಕು.
    tr: Pakkadallē irtīvi. Ondondē hejje. Ivattige iṣṭu sāku.
    en: We'll be right beside you. One step at a time. That's enough for today.
  - who: kaveri
    t: ಮತ್ತೆ ಒಂದು ವಿಷಯ, ದೀಪಾ. ನೀನು ಕೋರ್ಟಿಗೆ ಹೋಗಿದ್ದು, ಸಹಿ ಮಾಡಿದ್ದು ಯಾವುದೂ ಅಪರಾಧ ಅಲ್ಲ. ಅದು ಕಾನೂನು ಕೊಟ್ಟ ಹಕ್ಕು. ಅಪರಾಧಿ ತರ ತಲೆ ತಗ್ಗಿಸಬೇಡ.
    tr: Matte ondu viṣaya, Dīpā. Nīnu kōrṭige hōgiddu, sahi māḍiddu yāvudū aparādha alla. Adu kānūnu koṭṭa hakku. Aparādhi tara tale taggisabēḍa.
    en: And one more thing, Deepa. Going to court, signing those papers — none of it is a crime. It's a right the law gives you. Don't hang your head like someone guilty.
  - who: deepa
    t: ಹೂಂ. ಇವತ್ತು ಮೊದಲ ಸಲ ತಲೆ ಎತ್ತಿ ಸಮುದ್ರ ನೋಡ್ತಿದೀನಿ.
    tr: Hūṁ. Ivattu modala sala tale etti samudra nōḍtidīni.
    en: Mm. Today, for the first time, I'm looking at the sea with my head up.
  - section: Ramya's draft
    learn: 'newsroom words: ṭi-ār-pi, braikiṅg, ḍibēṭ, prōḍyūsar, ēṅkar · a story that broke her: kālthuḷita, ‘nimage hēganistide?’ anta kēḷde · quitting: rājīnāme, nōṭīs pīriyaḍ mūru tiṅgaḷu, ḍrāphṭ māḍiṭṭiddēne, kaḷisilla · a new plan: svatantra cānel, ūra kate, ranvē eṇṭu tiṅgaḷu, mosala sponsar · courage by countdown: ondu, eraḍu, mūru — kaḷisibiṭṭe!'
  - scene: Nine at night. The veranda, a kerosene lamp, the sound of waves. The host's wife has brought a jug of warm kashaya. Ramya has been unusually quiet all evening. Kaveri notices.
  - who: kaveri
    t: ರಮ್ಯಾ, ಊಟದ ಹೊತ್ತಿಂದ ಫೋನ್ ಹಿಡ್ಕೊಂಡು ಕೂತಿದೀಯಾ, ಒಂದು ಫೋಟೋನೂ ತೆಗೆದಿಲ್ಲ. ವ್ಲಾಗ್ ರಾಣಿಗೆ ಏನಾಯ್ತು?
    tr: Ramyā, ūṭada hottinda phōn hiḍkoṇḍu kūtidīyā, ondu phōṭōnū tegedilla. Vlāg rāṇige ēnāytu?
    en: Ramya, you've been sitting with your phone since dinner and haven't taken a single photo. What happened to the vlog queen?
  - who: ramya
    t: ಇವತ್ತು ಎಲ್ರೂ ನಿಜ ಹೇಳ್ತಿದ್ದೀರಿ. ನಾನೂ ಹೇಳ್ತೇನೆ. ಈ ಫೋನಲ್ಲಿ ಒಂದು ಇ-ಮೇಲ್ ಉಂಟು. ನನ್ನ ರಾಜೀನಾಮೆ. ಮೂರು ವಾರದಿಂದ ಡ್ರಾಫ್ಟ್‌ನಲ್ಲಿದೆ. ಸೆಂಡ್ ಒತ್ತಿಲ್ಲ.
    tr: Ivattu ellrū nija hēḷtiddīri. Nānū hēḷtēne. Ī phōnalli ondu i-mēl uṇṭu. Nanna rājīnāme. Mūru vāradinda ḍrāphṭ-nallide. Seṇḍ ottilla.
    en: Today everyone's been telling the truth. I'll tell mine too. There's an email on this phone. My resignation. It's been in drafts for three weeks. I haven't pressed send.
  - who: naveen
    t: ರಾಜೀನಾಮೆ? ನೀನು? ಕಾಲೇಜಿನಲ್ಲೇ ‘ನಾನು ನ್ಯೂಸ್ ಆಂಕರ್ ಆಗ್ತೇನೆ’ ಅಂತ ಮೈಕ್ ಇಲ್ಲದೆ ಭಾಷಣ ಮಾಡುತ್ತಿದ್ದವಳು ನೀನು ಮಾರಾಯ್ತಿ!
    tr: Rājīnāme? Nīnu? Kālējinallē ‘nānu nyūs āṅkar āgtēne’ anta maik illade bhāṣaṇa māḍuttiddavaḷu nīnu mārāyti!
    en: Resignation? You? You're the one who used to give speeches without a mic back in college, saying 'I'll be a news anchor', mārāyti!
  - who: ramya
    t: ಆದೆ. ಆಂಕರ್ ಆದೆ. ಆದ್ರೆ ಯಾವುದಕ್ಕೆ ಆದೆ ಅಂತ ಈಗ ಗೊತ್ತಾಗ್ತಿದೆ. ದಿನಾ ರಾತ್ರಿ ಒಂಬತ್ತಕ್ಕೆ ನಾಲ್ಕು ಜನರನ್ನ ಕೂರಿಸಿ ಕೂಗಾಡಿಸೋದು. ಟಿಆರ್‌ಪಿ ಇಳಿದ್ರೆ ಪ್ರೊಡ್ಯೂಸರ್ ಹೇಳ್ತಾರೆ, ‘ಇನ್ನೂ ಜೋರು, ಇನ್ನೂ ಜೋರು.’
    tr: Āde. Āṅkar āde. Ādre yāvudakke āde anta īga gottāgtide. Dinā rātri ombattakke nālku janaranna kūrisi kūgāḍisōdu. Ṭi-ār-pi iḷidre prōḍyūsar hēḷtāre, ‘innū jōru, innū jōru.’
    en: I did. I became an anchor. But only now am I realising what for. Every night at nine, seating four people and making them shout at each other. If the TRP drops, the producer says, 'Louder, louder.'
  - who: shruti
    t: ಏನಾದ್ರೂ ಒಂದು ದಿನ ನಡೀತಾ? ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಯಾಕೆ?
    tr: Ēnādrū ondu dina naḍītā? Iddakkiddante yāke?
    en: Did something happen on one particular day? Why all of a sudden?
  - who: ramya
    t: 'ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಅಲ್ಲ. ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೈದು, ಜೂನ್ ನಾಲ್ಕು. ಚಿನ್ನಸ್ವಾಮಿ ಹತ್ರ ಕಾಲ್ತುಳಿತ. ಹನ್ನೊಂದು ಜನ ಸತ್ರು. ಮಾರನೇ ದಿನ ನನ್ನನ್ನ ಒಬ್ಬ ಹುಡುಗನ ಮನೆಗೆ ಕಳಿಸಿದ್ರು. ಅವನ ಅಮ್ಮನ ಮುಖಕ್ಕೆ ಮೈಕ್ ಹಿಡಿದು ಕೇಳ್ದೆ: ‘ನಿಮಗೆ ಹೇಗನ್ನಿಸ್ತಿದೆ?’'
    tr: 'Iddakkiddante alla. Eraḍu sāvirada ippattaidu, Jūn nālku. Cinnasvāmi hatra kālthuḷita. Hannondu jana satru. Māranē dina nannanna obba huḍugana manege kaḷisidru. Avana ammana mukhakke maik hiḍidu kēḷde: ‘nimage hēgannistide?’'
    en: 'Not all of a sudden. 4 June 2025. The stampede near Chinnaswamy. Eleven people died. The next day they sent me to the home of one of the boys. I held a mic to his mother''s face and asked: ''How do you feel?'''
  - scene: Nobody speaks. The waves fill the silence.
  - who: ramya
    t: ಅವರು ನನ್ನ ಮುಖ ನೋಡಿದ್ರು. ಏನೂ ಹೇಳಲಿಲ್ಲ. ಆ ನೋಟ ಒಂದೂವರೆ ವರ್ಷದಿಂದ ಹೋಗಿಲ್ಲ. ಈ ವರ್ಷ ಆರ್‌ಸಿಬಿ ಮತ್ತೆ ಕಪ್ ಗೆದ್ದಾಗ ಸ್ಟುಡಿಯೋದಲ್ಲಿ ನಾನು ನಗ್ತಾ ‘ಈ ಸಲ ಕಪ್ ನಮ್ದು’ ಅಂತ ಕೂಗ್ತಿದ್ದೆ, ಒಳಗೆ ಆ ಅಮ್ಮನ ಮುಖ.
    tr: Avaru nanna mukha nōḍidru. Ēnū hēḷalilla. Ā nōṭa ondūvare varṣadinda hōgilla. Ī varṣa Ār-si-bi matte kap geddāga sṭuḍiyōdalli nānu nagtā ‘ī sala kap namdu’ anta kūgtidde, oḷage ā ammana mukha.
    en: She looked at my face. She said nothing. That look hasn't left me in a year and a half. This year, when RCB won the cup again, I was laughing and shouting 'ee sala cup namdu' in the studio — and inside, that mother's face.
  - who: deepa
    t: ರಮ್ಯಾ… ಅದು ನಿನ್ನ ಮೇಲೆ ಇಷ್ಟು ದಿನ ಭಾರ ಆಗಿತ್ತಾ?
    tr: Ramyā… adu ninna mēle iṣṭu dina bhāra āgittā?
    en: Ramya… has that been weighing on you all this time?
  - who: ramya
    t: ಹೂಂ. ‘ವ್ಲಾಗ್ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತೆ ಅಂತ ಆಮೇಲೆ ಹೇಳ್ತೀನಿ’ ಅಂದಿದ್ದೆ ಅಲ್ವಾ? ಇಲ್ಲಿಗೆ. ಅದು ವ್ಲಾಗ್ ಅಲ್ಲ — ಪೈಲಟ್. ನನ್ನದೇ ಒಂದು ಸ್ವತಂತ್ರ ಕನ್ನಡ ಚಾನೆಲ್. ‘ಊರ ಕತೆ.’ ಕೂಗಾಟ ಇಲ್ಲ, ಬ್ರೇಕಿಂಗ್ ಇಲ್ಲ. ಪ್ರಕಾಶ್‌ನ ಅಮ್ಮನ ಶೇಂಗಾ ಚಟ್ನಿ, ಇಮ್ರಾನ್‌ನ ವಾರ್ಡ್, ಈ ಅಣ್ಣನ ಚಹಾ ಅಂಗಡಿಯಿಂದ ಹೋಮ್‌ಸ್ಟೇ — ಇಂಥ ಕತೆಗಳು, ಅವರವರ ಭಾಷೆಯಲ್ಲೇ.
    tr: Hūṃ. ‘Vlāg ellige hōgutte anta āmēle hēḷtīni’ andidde alvā? Illige. Adu vlāg alla — pailaṭ. Nannadē ondu svatantra Kannaḍa cānel. ‘Ūra kate.’ Kūgāṭa illa, brēkiṅg illa. Prakāś-na ammana śēṅgā caṭni, Imrān-na vārḍ, ī aṇṇana cahā aṅgaḍiyinda hōm-sṭē — inta kategaḷu, avaravara bhāṣeyallē.
    en: Mm. Remember I said 'I'll tell you later where the vlog is going'? Here. It isn't a vlog — it's a pilot. My own independent Kannada channel. 'Stories of Places'. No shouting, no breaking news. Prakash's mother's peanut chutney, Imran's ward, this Anna's journey from tea stall to homestay — stories like that, each in its own way of speaking.
  - who: arjun
    t: 'ಐಡಿಯಾ ಸಕ್ಕತ್. ಆದ್ರೆ ಫೌಂಡರ್ ಆಗಿ ಒಂದು ಪ್ರಶ್ನೆ ಕೇಳ್ತೀನಿ, ಬೇಜಾರ್ ಮಾಡ್ಕೋಬೇಡ: ರನ್‌ವೇ ಎಷ್ಟಿದೆ? ಅಂದ್ರೆ ಸಂಬಳ ಇಲ್ಲದೆ ಎಷ್ಟು ತಿಂಗಳು ಬದುಕಬಹುದು?'
    tr: 'Aiḍiyā sakkat. Ādre phauṇḍar āgi ondu praśne kēḷtīni, bējār māḍkōbēḍa: ranvē eṣṭide? Andre saṃbaḷa illade eṣṭu tiṅgaḷu badukabahudu?'
    en: 'The idea''s great. But let me ask you one question as a founder, don''t take it badly: how much runway do you have? I mean, how many months can you live without a salary?'
  - who: ramya
    t: ಎಂಟು ತಿಂಗಳು. ಸೇವಿಂಗ್ಸ್ ಲೆಕ್ಕ ಹಾಕಿದೀನಿ. ಆಮೇಲೆ ಸ್ಪಾನ್ಸರ್ ಸಿಗದಿದ್ರೆ ಫ್ರೀಲಾನ್ಸ್ ಮಾಡ್ತೀನಿ. ನೀನು ಫೌಂಡರ್ ಬುದ್ಧಿ ಹೇಳ್ತಿದೀಯಾ ಅರ್ಜುನ್, ಸ್ವಲ್ಪ ವಿಚಿತ್ರ ಅನ್ನಿಸ್ತಿದೆ.
    tr: Eṇṭu tiṅgaḷu. Sēviṅgs lekka hākidīni. Āmēle spānsar sigadidre phrīlāns māḍtīni. Nīnu phauṇḍar buddhi hēḷtidīyā Arjun, svalpa vicitra annistide.
    en: Eight months. I've done the savings sums. After that, if I don't find sponsors, I'll freelance. You giving founder advice, Arjun — it feels a little strange.
  - who: arjun
    t: ಗೊತ್ತು. ಅದಕ್ಕೇ ಹೇಳ್ತಿದೀನಿ. ರನ್‌ವೇ ಮುಗಿಯೋದು ಹೇಗಿರುತ್ತೆ ಅಂತ ನನಗೆ ಚೆನ್ನಾಗಿ ಗೊತ್ತು. ನಾಳೆ ಎಲ್ಲಾ ಹೇಳ್ತೀನಿ.
    tr: Gottu. Adakkē hēḷtidīni. Ranvē mugiyōdu hēgirutte anta nanage cennāgi gottu. Nāḷe ellā hēḷtīni.
    en: I know. That's exactly why I'm saying it. I know very well what it's like when the runway runs out. Tomorrow I'll tell you everything.
  - who: kaveri
    t: 'ಲಾಯರ್ ಆಗಿ ಒಂದು ಪಾಯಿಂಟ್: ನಿನ್ನ ಕಾಂಟ್ರ್ಯಾಕ್ಟ್‌ನಲ್ಲಿ ನೋಟಿಸ್ ಪೀರಿಯಡ್ ಎಷ್ಟು? ಮತ್ತೆ ಬೇರೆ ಚಾನೆಲ್‌ಗೆ ಸೇರಬಾರದು ಅನ್ನೋ ಕ್ಲಾಸ್ ಏನಾದ್ರೂ ಇದೆಯಾ? ಸೆಂಡ್ ಒತ್ತೋ ಮುಂಚೆ ನನಗೆ ಒಂದು ಸಲ ತೋರಿಸು.'
    tr: 'Lāyar āgi ondu pāyiṇṭ: ninna kāṇṭryākṭ-nalli nōṭis pīriyaḍ eṣṭu? Matte bēre cānel-ge sērabāradu annō klās ēnādrū ideyā? Seṇḍ ottō muñce nanage ondu sala tōrisu.'
    en: 'One point as a lawyer: what''s the notice period in your contract? And is there any clause saying you can''t join another channel? Show it to me once before you press send.'
  - who: ramya
    t: ಮೂರು ತಿಂಗಳು ನೋಟಿಸ್. ಬೇರೆ ಚಾನೆಲ್‌ಗೆ ಹೋಗೋ ಹಾಗಿಲ್ಲ ಅಂತ ಇದೆ, ಆದ್ರೆ ಸ್ವಂತ ಯೂಟ್ಯೂಬ್ ಬಗ್ಗೆ ಏನೂ ಇಲ್ಲ. ಮೊನ್ನೆನೇ ಓದಿದೆ, ಮೂರು ಸಲ.
    tr: Mūru tiṅgaḷu nōṭis. Bēre cānel-ge hōgō hāgilla anta ide, ādre svanta yūṭyūb bagge ēnū illa. Monnenē ōdide, mūru sala.
    en: Three months' notice. It says I can't go to another channel, but nothing about my own YouTube. I read it just the other day — three times.
  - who: naveen
    t: ಹಾಗಾದ್ರೆ ಮೊದಲ ಸ್ಪಾನ್ಸರ್ ನಾನು. ‘ಊರ ಕತೆ’ — ಪ್ರತಿ ಎಪಿಸೋಡ್ ಕೊನೆಯಲ್ಲಿ ‘ಉಡುಪಿಯ ಶೆಟ್ಟಿ ಹೋಟೆಲ್‌ನ ಸಹಕಾರದೊಂದಿಗೆ.’ ದುಡ್ಡು ಜಾಸ್ತಿ ಇಲ್ಲ, ಆದರೆ ಊಟ ಫ್ರೀ ಉಂಟು.
    tr: Hāgādre modala spānsar nānu. ‘Ūra kate’ — prati epiśōḍ koneyalli ‘Uḍupiya Śeṭṭi hōṭel-na sahakāradondige.’ Duḍḍu jāsti illa, ādare ūṭa phrī uṇṭu.
    en: Then I'm the first sponsor. 'Ura Kathe' — at the end of every episode, 'with the support of Shetty's Hotel, Udupi'. Not much money, but the meals are free.
  - who: host
    t: ಎರಡನೇ ಸ್ಪಾನ್ಸರ್ ನಾನು ಮಾರಾಯ್ತಿ. ಕುಂದಾಪ್ರದವರು ಒಬ್ಬರಿಗೊಬ್ಬರು ಆಗದಿದ್ರೆ ಮತ್ತೆ ಯಾರು ಆಗ್ತಾರೆ? ನಮ್ ಹೋಮ್‌ಸ್ಟೇ ಎಪಿಸೋಡ್ ಮೊದಲು ಮಾಡಿ.
    tr: Eraḍanē spānsar nānu mārāyti. Kundāpradavaru obbarigobbaru āgadidre matte yāru āgtāre? Nam hōm-sṭē epiśōḍ modalu māḍi.
    en: I'm the second sponsor, my dear. If Kundapura people don't stand by each other, who will? Do our homestay episode first.
  - who: ramya
    t: ಸರಿ. ಸರಿ! ಎಲ್ರೂ ಎಣಿಸಿ. ಮೂರು ಅಂದ ಕೂಡ್ಲೆ ಒತ್ತುತ್ತೇನೆ.
    tr: Sari. Sari! Ellrū eṇisi. Mūru anda kūḍle ottuttēne.
    en: OK. OK! Everyone count. The moment you say three, I'll press it.
  - who: shruti
    t: ಒಂದು… ಎರಡು… ಮೂರು!
    tr: Ondu… eraḍu… mūru!
    en: One… two… three!
  - scene: A soft whoosh from the phone. Ramya stares at the screen, then throws both arms in the air.
  - who: ramya
    t: ಕಳಿಸಿಬಿಟ್ಟೆ ಮರ್ರೆ! ಹೋಯ್ತ್! ಅಬ್ಬಾ… ಕೈ ನಡುಗ್ತಿದೆ, ಆದ್ರೆ ಹನ್ನೆರಡು ವರ್ಷದಲ್ಲಿ ಇಷ್ಟು ಹಗುರ ಯಾವತ್ತೂ ಅನ್ನಿಸಿರಲಿಲ್ಲ.
    tr: Kaḷisibiṭṭe marre! Hōyt! Abbā… kai naḍugtide, ādre hanneraḍu varṣadalli iṣṭu hagura yāvattū annisiralilla.
    en: I've sent it, marre! It's gone! Wow… my hands are shaking, but I've never felt this light in twelve years.
  - who: host
    t: ಸಮುದ್ರದ ಮುಂದೆ ಮಾಡಿದ ನಿರ್ಧಾರ ತಪ್ಪಾಗುವುದಿಲ್ಲ ಅಂತ ನಮ್ಮ ಅಜ್ಜ ಹೇಳ್ತಿದ್ರು. ಕಷಾಯ ಕುಡೀರಿ, ಬಿಸಿ ಉಂಟು.
    tr: Samudrada munde māḍida nirdhāra tappāguvudilla anta namma ajja hēḷtidru. Kaṣāya kuḍīri, bisi uṇṭu.
    en: My grandfather used to say a decision made in front of the sea is never wrong. Drink your kashaya, it's hot.
  - chapter: Chapter 9 — Confessions by the sea
  - section: Deepa calls home
    learn: 'telling a parent: ninage ondu viṣaya hēḷbēku, kūtkō amma · what a mother asks first: modalu ūṭa māḍidyā? · relief: edeya mēlinda kallu iḷidaṅgāytu · reporting what someone said: amma ‘…’ andru, appaṅge nānē hēḷtīni anta hēḷidru'
  - scene: Tuesday, 8 December 2026, eight at night. The beach below the homestay. A hurricane lamp on the sand, eight people in a circle. No moon. Deepa holds her phone; Shruti and Kaveri sit on either side of her.
  - who: deepa
    t: ಅಮ್ಮ… ಹೂಂ, ಊಟ ಆಯ್ತು. ಅಮ್ಮ, ಸ್ವಲ್ಪ ಕೂತ್ಕೋ. ನಿನಗೆ ಒಂದು ವಿಷಯ ಹೇಳ್ಬೇಕು. ಇಲ್ಲ, ನನಗೆ ಏನೂ ಆಗಿಲ್ಲ, ಆರೋಗ್ಯ ಚೆನ್ನಾಗಿದೆ. ಕೇಳು ಅಷ್ಟೇ, ಮಧ್ಯೆ ಮಾತಾಡ್ಬೇಡ…
    tr: Amma… hūṃ, ūṭa āytu. Amma, svalpa kūtkō. Ninage ondu viṣaya hēḷbēku. Illa, nanage ēnū āgilla, ārōgya cennāgide. Kēḷu aṣṭē, madhye mātāḍbēḍa…
    en: Amma… yes, I've eaten. Amma, sit down for a bit. I need to tell you something. No, nothing's happened to me, my health is fine. Just listen, don't interrupt…
  - scene: Deepa walks a little way down the beach. The others watch the lamp, not her. Ten minutes pass. She comes back, wiping her face, and sits down.
  - who: shruti
    t: ಏನಂದ್ರು?
    tr: Ēnandru?
    en: What did she say?
  - who: deepa
    t: 'ಮೊದಲು ಅತ್ತರು. ತುಂಬಾ ಹೊತ್ತು. ಆಮೇಲೆ ಮೂಗು ಒರೆಸ್ಕೊಂಡು ಕೇಳಿದ್ರು: ‘ಒಂದು ವರ್ಷದಿಂದ ಇದನ್ನೆಲ್ಲಾ ಒಬ್ಬಳೇ ಹೊತ್ಕೊಂಡಿದ್ಯಾ? ಮೊದಲು ಹೇಳು, ಸರಿಯಾಗಿ ಊಟ ಮಾಡ್ತಿದ್ಯಾ?’'
    tr: 'Modalu attaru. Tumbā hottu. Āmēle mūgu oreskoṇḍu kēḷidru: ‘Ondu varṣadinda idannellā obbaḷē hotkoṇḍidyā? Modalu hēḷu, sariyāgi ūṭa māḍtidyā?’'
    en: 'First she cried. For a long time. Then she wiped her nose and asked: ''You''ve been carrying all this alone for a year? Tell me first — are you eating properly?'''
  - who: prakash
    t: ನಾ ಹೇಳಿದ್ನಿಲ್ಲ? ಅವ್ವಂದಿರು ಗಟ್ಟಿ ಇರ್ತಾರ.
    tr: Nā hēḷidnilla? Avvandiru gaṭṭi irtāra.
    en: Didn't I tell you? Mothers are strong.
  - who: deepa
    t: ‘ಅಪ್ಪಂಗೆ ನಾನೇ ಹೇಳ್ತೀನಿ, ನೀನು ಭಾನುವಾರ ಮನೆಗೆ ಬಾ. ತಂಗಿ ಮದುವೆ ಆಗೋದಾದ್ರೆ ಆಗುತ್ತೆ, ನಿನ್ನ ನೆಮ್ಮದಿ ಮೊದಲು’ ಅಂದ್ರು. ಎದೆಯ ಮೇಲಿಂದ ಒಂದು ದೊಡ್ಡ ಕಲ್ಲು ಇಳಿದಂಗಾಯ್ತು.
    tr: ‘Appaṅge nānē hēḷtīni, nīnu Bhānuvāra manege bā. Taṅgi maduve āgōdādre āgutte, ninna nemmadi modalu’ andru. Edeya mēlinda ondu doḍḍa kallu iḷidaṅgāytu.
    en: She said, 'I'll tell your father myself; you come home on Sunday. If your sister's wedding is meant to happen, it will happen — your peace of mind comes first.' It feels like a huge stone has been lifted off my chest.
  - who: imran
    t: ಬಿಪಿ ಯಾರದ್ದೂ ಏರಲಿಲ್ಲ. ಡಾಕ್ಟರ್ ಆಗಿ ಹೇಳ್ತೇನಿ — ಇದು ಒಳ್ಳೆ ರಿಪೋರ್ಟ್.
    tr: Bipi yāraddū ēralilla. Ḍākṭar āgi hēḷtēni — idu oḷḷe ripōrṭ.
    en: Nobody's BP went up. Speaking as a doctor — that's a good report.
  - who: ramya
    t: ಮರ್ರೆ, ನಿನ್ನ ಅಮ್ಮನ ನಂಬರ್ ಕೊಡು. ‘ಊರ ಕತೆ’ಗೆ ಅಲ್ಲ — ನನ್ನ ಅಪ್ಪನ ಹತ್ರ ಹೇಗೆ ಹೇಳೋದು ಅಂತ ಅವರ ಹತ್ರ ಟ್ಯೂಷನ್ ತಗೋಬೇಕು.
    tr: Marre, ninna ammana nambar koḍu. ‘Ūra Kate’ge alla — nanna appana hatra hēge hēḷōdu anta avara hatra ṭyūṣan tagōbēku.
    en: Marre, give me your mother's number. Not for ‘Ura Kate’ — I need tuition from her on how to tell my own father something.
  - section: One honest thing
    learn: 'setting rules: ondē niyama, yārū naḍuve māṭāḍbāradu, yārū judge māḍbāradu · confessing: ondu viṣaya hēḷbēku, tumbā dinadinda manassallide · naḍede, nakkidde, nācike āgutte · loneliness abroad: oṇṭitana, eṇṭu jana ondē rūmalli · envy: hoṭṭekiccu, ninna havā · the moon joke: huṇṇime anta plān, amāvāsye hatra'
  - who: ramya
    t: ಅರ್ಜುನ್, ಗ್ರೂಪ್‌ನಲ್ಲಿ ನೀನು ‘ಗೋಕರ್ಣದಲ್ಲಿ ಹುಣ್ಣಿಮೆ ರಾತ್ರಿ’ ಅಂತ ಬರೆದಿದ್ದೆ. ಮೇಲೆ ನೋಡು. ಚಂದ್ರನೇ ಇಲ್ಲ.
    tr: Arjun, grūp-nalli nīnu ‘Gōkarṇadalli huṇṇime rātri’ anta baredidde. Mēle nōḍu. Candranē illa.
    en: Arjun, on the group you wrote 'a full-moon night at Gokarna'. Look up. There's no moon at all.
  - who: kaveri
    t: ಹುಣ್ಣಿಮೆ ಕಳೆದ ತಿಂಗಳೇ ಮುಗೀತು. ಈಗ ಅಮಾವಾಸ್ಯೆ ಹತ್ರ. ನಮ್ಮ ಸಿಇಒ ಅವರ ಪ್ಲಾನಿಂಗ್ ಹೀಗೇ.
    tr: Huṇṇime kaḷeda tiṅgaḷē mugītu. Īga amāvāsye hatra. Namma si-i-o avara plāniṅg hīgē.
    en: The full moon was over last month. It's close to the new moon now. That's our CEO's planning for you.
  - who: arjun
    t: ಗೊತ್ತು. ಆದ್ರೆ ನೋಡಿ — ಚಂದ್ರ ಇಲ್ಲದ ರಾತ್ರಿ ನಕ್ಷತ್ರ ಜಾಸ್ತಿ ಕಾಣುತ್ತೆ. ಇವತ್ತಿಗೆ ಅದೇ ಸರಿ ಅನ್ಸುತ್ತೆ.
    tr: Gottu. Ādre nōḍi — candra illada rātri nakṣatra jāsti kāṇutte. Ivattige adē sari ansutte.
    en: I know. But look — on a night without a moon you see more stars. I think that's right for tonight.
  - who: shruti
    t: ರಮ್ಯಾ — ಫೋನ್?
    tr: Ramyā — phōn?
    en: Ramya — phone?
  - who: ramya
    t: ಬ್ಯಾಗಲ್ಲಿದೆ, ಸ್ವಿಚ್ ಆಫ್. ಇವತ್ತು ರಾತ್ರಿ ರೆಕಾರ್ಡಿಂಗ್ ಇಲ್ಲ, ಬರೀ ಕೇಳೋದು. ‘ಊರ ಕತೆ’ ಕಾಯ್ಲಿ.
    tr: Byāgallide, svich āph. Ivattu rātri rekārḍiṅg illa, barī kēḷōdu. ‘Ūra Kate’ kāyli.
    en: In the bag, switched off. Tonight there's no recording, only listening. ‘Ura Kate’ can wait.
  - who: kaveri
    t: 'ಸರಿ. ಒಂದು ಆಟ. ಪ್ರತಿಯೊಬ್ಬರೂ ಒಂದು ನಿಜ ಹೇಳಬೇಕು — ಯಾರಿಗೂ ಹೇಳದೇ ಇರೋದು. ಒಂದೇ ನಿಯಮ: ಯಾರೂ ನಡುವೆ ಮಾತಾಡಬಾರದು, ಯಾರೂ ಜಡ್ಜ್ ಮಾಡಬಾರದು. ಲಾಯರ್ ಆಗಿ ಮೊದಲು ನಾನೇ ಸಾಕ್ಷಿ ಹೇಳ್ತೀನಿ.'
    tr: 'Sari. Ondu āṭa. Pratiyobbarū ondu nija hēḷabēku — yārigū hēḷadē irōdu. Ondē niyama: yārū naḍuve mātāḍabāradu, yārū jaḍj māḍabāradu. Lāyar āgi modalu nānē sākṣi hēḷtīni.'
    en: 'Right. A game. Everyone has to tell one truth — something they''ve never told anyone. Only one rule: nobody interrupts, nobody judges. As the lawyer, I''ll take the witness stand first.'
  - who: kaveri
    t: ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ನಾನು ಅರ್ಜುನ್‌ಗೆ ‘ಯಾವ ಭಾಷೆನೂ ಕೀಳಲ್ಲ’ ಅಂತ ದೊಡ್ಡ ಭಾಷಣ ಮಾಡ್ದೆ. ನಿಜ ಏನಂದ್ರೆ, ಎರಡು ಸಾವಿರದ ಹತ್ತರಲ್ಲಿ, ಫಸ್ಟ್ ಇಯರ್ ಹಾಸ್ಟೆಲ್‌ನಲ್ಲಿ, ಪ್ರಕಾಶ್ ಮತ್ತೆ ಇಮ್ರಾನ್ ಮಾತಾಡ್ತಿದ್ದಾಗ ನಾನೂ ನಕ್ಕಿದ್ದೆ. ಎಲ್ಲರ ಜೊತೆ. ಆ ನಗು ನನಗೆ ಹದಿನಾರು ವರ್ಷದಿಂದ ನೆನಪಿದೆ. ಅವತ್ತು ನಾನು ಮಾತಾಡಿದ್ದು ಅರ್ಜುನ್‌ಗಿಂತ ಹೆಚ್ಚು ನನಗೇ.
    tr: Citradurgadalli nānu Arjun-ge ‘yāva bhāṣenū kīḷalla’ anta doḍḍa bhāṣaṇa māḍde. Nija ēnandre, eraḍu sāvirada hattaralli, phasṭ iyar hāsṭel-nalli, Prakāś matte Imrān mātāḍtiddāga nānū nakkidde. Ellara jote. Ā nagu nanage hadināru varṣadinda nenapide. Avattu nānu mātāḍiddu Arjun-ginta heccu nanagē.
    en: At Chitradurga I gave Arjun a big speech about how no language is inferior. The truth is, in 2010, in the first-year hostel, when Prakash and Imran talked, I laughed too. Along with everyone. I've remembered that laugh for sixteen years. That day I was speaking to myself more than to Arjun.
  - who: imran
    t: ಕಾವೇರಿ… ನಾವು ಹದಿನೆಂಟು ವರ್ಷದವರು ಇದ್ವಿ. ಎಲ್ಲಾರೂ ನಕ್ಕೀರಿ. ನೀ ಮಾತ್ರ ಹದಿನಾರು ವರ್ಷ ಅದನ್ನ ನೆನಪಿಟ್ಟುಕೊಂಡಿ. ಅದೇ ಫರಕ್.
    tr: Kāvēri… nāvu hadineṇṭu varṣadavaru idvi. Ellārū nakkīri. Nī mātra hadināru varṣa adanna nenapiṭṭukoṇḍi. Adē pharak.
    en: Kaveri… we were eighteen. Everybody laughed. Only you remembered it for sixteen years. That's the difference.
  - who: prakash
    t: ಕಾವೇರಿ, ಅವತ್ತು ನೀ ನಕ್ಕಿದ್ದು ನನಗ ನೆನಪಿಲ್ಲ. ಆದ್ರ ಚಿತ್ರದುರ್ಗದಾಗ ನೀ ಎದ್ದು ನಿಂತು ಮಾತಾಡಿದ್ದು ಜೀವನಪೂರ್ತಿ ನೆನಪಿರ್ತದ.
    tr: Kāvēri, avattu nī nakkiddu nanaga nenapilla. Ādra Citradurgadāga nī eddu nintu mātāḍiddu jīvanapūrti nenapirtada.
    en: Kaveri, I don't remember you laughing back then. But I'll remember all my life that you stood up and spoke at Chitradurga.
  - who: imran
    t: 'ನಂದು ಸಣ್ಣದು, ನಿನ್ನೆ ರಾತ್ರಿ ಎಲ್ಲಾ ಹೇಳೀನಿ. ಹೊಸದು ಇಷ್ಟೇ: ಇವತ್ತು ಬೆಳಿಗ್ಗೆ ಸುನೀತಾಗೆ ಮೆಸೇಜ್ ಮಾಡಿದೆ. ಹದಿನಾರನೇ ತಾರೀಖು ಮೊದಲ ಸೆಷನ್. ಮತ್ತ ಜಿಲ್ಲಾ ಸರ್ಜನ್‌ಗೆ ಹದಿನೈದು ದಿನದ ರಜಾ ಅರ್ಜಿ ಮೇಲ್ ಮಾಡೀನಿ. ಮೊದಲ ಸಲ, ‘ವೈಯಕ್ತಿಕ ಕಾರಣ’ ಅಂತ ಬರೀದೆ ‘ಆರೋಗ್ಯ’ ಅಂತ ಬರೆದೀನಿ.'
    tr: 'Nandu saṇṇadu, ninne rātri ellā hēḷīni. Hosadu iṣṭē: ivattu beḷigge Sunītāge mesēj māḍide. Hadināranē tārīkhu modala seṣan. Matta jillā sarjan-ge hadinaidu dinada rajā arji mēl māḍīni. Modala sala, ‘vaiyaktika kāraṇa’ anta barīde ‘ārōgya’ anta baredīni.'
    en: 'Mine''s small; I told you everything the other night. What''s new is this: this morning I messaged Sunita. The first session is on the 16th. And I''ve emailed a fifteen-day leave application to the district surgeon. For the first time I didn''t write ''personal reasons'' — I wrote ''health''.'
  - who: deepa
    t: ‘ಆರೋಗ್ಯ’ ಅಂತ ಬರೆದಿದ್ದು ದೊಡ್ಡ ವಿಷಯ, ಇಮ್ರಾನ್. ನಾನು ಮೊದಲ ಸಲ ಕೌನ್ಸೆಲರ್‌ಗೆ ಫೋನ್ ಮಾಡೋಕೆ ಮೂರು ವಾರ ತಗೊಂಡೆ. ನಂಬರ್ ಡಯಲ್ ಮಾಡಿ ಕಟ್ ಮಾಡ್ತಿದ್ದೆ.
    tr: ‘Ārōgya’ anta barediddu doḍḍa viṣaya, Imrān. Nānu modala sala kaunselar-ge phōn māḍōke mūru vāra tagoṇḍe. Nambar ḍayal māḍi kaṭ māḍtidde.
    en: Writing ‘health’ is a big thing, Imran. It took me three weeks to phone a counsellor the first time. I kept dialling the number and cutting the call.
  - who: naveen
    t: 'ನಂದು ಎರಡು. ಒಂದು: ದುಬೈಯಲ್ಲಿ ಆರು ವರ್ಷ, ಒಂದು ರೂಮಲ್ಲಿ ಆರು ಜನ — ಕೊರಕಲ್‌ನಲ್ಲಿ ಹೇಳಿದ್ದೆ. ಫೋನಲ್ಲಿ ಮನೆಯವರಿಗೆ ‘ಸಕ್ಕತ್ ಲೈಫ್’ ಅಂತ ಹೇಳ್ತಿದ್ದೆ. ಶುಕ್ರವಾರ ರಾತ್ರಿ ಬಾತ್‌ರೂಮಲ್ಲಿ ಕೂತು ಅಳ್ತಿದ್ದೆ, ಯಾರಿಗೂ ಕೇಳಿಸಬಾರದು ಅಂತ ನಲ್ಲಿ ಬಿಟ್ಟು. ಆ ಎಂಟು ಲಕ್ಷ ಅಂದ್ರೆ ಆ ರಾತ್ರಿಗಳು.'
    tr: 'Nandu eraḍu. Ondu: Dubaiyalli āru varṣa, ondu rūmalli āru jana — korakal-nalli hēḷidde. Phōnalli maneyavarige ‘sakkat laiph’ anta hēḷtidde. Śukravāra rātri bāt-rūmalli kūtu aḷtidde, yārigū kēḷisabāradu anta nalli biṭṭu. Ā eṇṭu lakṣa andre ā rātrigaḷu.'
    en: 'I''ve got two. One: Dubai, six years, six men in one room — I told you that in the coracle. What I didn''t say: on the phone I told my family it was a great life. On Friday nights I''d sit in the bathroom and cry, with the tap running so nobody would hear. That eight lakh — it''s those nights.'
  - who: naveen
    t: 'ಎರಡು: ಕಾಲೇಜಿನಲ್ಲಿ ನನಗೆ ಅರ್ಜುನ್ ಮೇಲೆ ಹೊಟ್ಟೆಕಿಚ್ಚು ಇತ್ತು. ಅವನ ಇಂಗ್ಲೀಷ್, ಅವನ ಹವಾ, ಅವನ ಬೆಂಗಳೂರು. ಅವನು ಸಾಲ ಕೇಳಿದಾಗ ಒಳಗೊಳಗೆ ಖುಷಿಯಾಯ್ತು — ಕೊನೆಗೂ ಅರ್ಜುನ್‌ಗೆ ನಾನು ಬೇಕಾದೆ ಅಂತ. ಅದಕ್ಕೇ ಚೆಕ್ ಬೌನ್ಸ್ ಆದಾಗ ಅಷ್ಟು ನೋವಾಯ್ತು. ನಾಚಿಕೆ ಆಗ್ತದೆ ಹೇಳುವುದಕ್ಕೆ.'
    tr: 'Eraḍu: kālējinalli nanage Arjun mēle hoṭṭekiccu ittu. Avana iṅglīṣ, avana havā, avana Beṅgaḷūru. Avanu sāla kēḷidāga oḷagoḷage khuṣiyāytu — konegū Arjun-ge nānu bēkāde anta. Adakkē cek bauns ādāga aṣṭu nōvāytu. Nācike āgtade hēḷuvudakke.'
    en: 'Two: in college I was jealous of Arjun. His English, his swagger, his Bengaluru. When he asked for the loan, deep down I was glad — at last Arjun needed me. That''s why it hurt so much when the cheque bounced. I''m ashamed to say it.'
  - scene: Arjun opens his mouth. Kaveri raises a finger — no interrupting. He closes it.
  - who: kaveri
    t: ಸಾಕ್ಷಿ ಕಟಕಟೆಯಿಂದ ಇಳಿಯಬಹುದು, ನವೀನ್. ಅಸೂಯೆ ಒಪ್ಪಿಕೊಳ್ಳೋಕೆ ಧೈರ್ಯ ಬೇಕು. ಹೆಚ್ಚಿನವರು ಅದಕ್ಕೆ ‘ತತ್ವ’ ಅಂತ ಹೆಸರಿಡ್ತಾರೆ.
    tr: Sākṣi kaṭakaṭeyinda iḷiyabahudu, Navīn. Asūye oppikoḷḷōke dhairya bēku. Heccinavaru adakke ‘tatva’ anta hesariḍtāre.
    en: The witness may step down, Naveen. It takes courage to admit jealousy. Most people call it ‘principle’ instead.
  - who: prakash
    t: 'ನಮ್ಮವ್ವ ಹೇಳ್ತಾಳ: ಹೊಟ್ಟಿಕಿಚ್ಚು ಮುಚ್ಚಿಟ್ರ ಹುಣ್ಣಾಗ್ತದ, ಬಾಯಿಬಿಟ್ಟು ಹೇಳಿದ್ರ ಮಾಯ್ತದ.'
    tr: 'Nammavva hēḷtāḷa: hoṭṭikiccu mucciṭra huṇṇāgtada, bāyibiṭṭu hēḷidra māytada.'
    en: 'My Avva says: hide jealousy and it turns into a sore; say it out loud and it heals.'
  - who: ramya
    t: 'ನನ್ನದು ನಿನ್ನೆ ಆಯ್ತು. ಹೊಸದು ಒಂದೇ: ರಾಜೀನಾಮೆ ಬಗ್ಗೆ ಅಪ್ಪಯ್ಯಂಗೆ ಇನ್ನೂ ಹೇಳಿಲ್ಲ. ಅವರು ದಿನಾ ರಾತ್ರಿ ಒಂಬತ್ತಕ್ಕೆ ನನ್ನ ಡಿಬೇಟ್ ನೋಡಿ, ಮರುದಿನ ಪೇಟೆಯಲ್ಲಿ ಎಲ್ಲರಿಗೂ ‘ನಮ್ಮ ಮಗಳು’ ಅಂತ ಹೇಳ್ತಾರೆ. ಅವರ ಮುಖ ನೆನೆಸಿಕೊಂಡ್ರೆ ಭಯ ಆಗ್ತದೆ.'
    tr: 'Nannadu ninne āytu. Hosadu ondē: rājīnāme bagge appayyaṅge innū hēḷilla. Avaru dinā rātri ombattakke nanna ḍibēṭ nōḍi, marudina pēṭeyalli ellarigū ‘namma magaḷu’ anta hēḷtāre. Avara mukha nenesikoṇḍre bhaya āgtade.'
    en: 'Mine was yesterday. Only one new thing: I still haven''t told my father about resigning. Every night at nine he watches my debate, and the next day in the market he tells everyone, ''That''s our daughter.'' When I picture his face, I get scared.'
  - who: deepa
    t: ಬೇರೆಯವರಿಗೆ ಔಷಧಿ ಹೇಳೋದು ಸುಲಭ ಅಲ್ವಾ ರಮ್ಯಾ? ನಾನು ನನ್ನ ಅಮ್ಮಂಗೆ ಹೇಳಿದೆ. ನೀನು ನಾಳೆ ನಿನ್ನ ಅಪ್ಪಂಗೆ ಹೇಳು.
    tr: Bēreyavarige auṣadhi hēḷōdu sulabha alvā Ramyā? Nānu nanna ammaṅge hēḷide. Nīnu nāḷe ninna appaṅge hēḷu.
    en: It's easy to prescribe medicine for others, isn't it, Ramya? I told my mother. You tell your father tomorrow.
  - who: ramya
    t: ಸರಿ ಸರಿ. ನನ್ನ ಮದ್ದು ನನಗೇ ವಾಪಸ್ ಬಂತು. ಹೇಳ್ತೆ.
    tr: Sari sari. Nanna maddu nanagē vāpas bantu. Hēḷte.
    en: OK, OK. My own medicine has come back to me. I'll tell him.
  - who: naveen
    t: ರಮ್ಯಾ, ನೋಡ್ತಿರು — ನಾಳೆ ನಿನ್ನ ಅಪ್ಪ ಮಾರ್ಕೆಟ್‌ನಲ್ಲಿ ‘ಅವಳು ನಮ್ಮ ಮಗಳು, ಅವಳದ್ದೇ ಚಾನೆಲ್’ ಅಂತ ಹೇಳ್ತಾರೆ. ಕುಂದಾಪ್ರದವರಿಗೆ ಸ್ವಂತ ಅಂಗಡಿ ಅಂದ್ರೆ ಹೆಮ್ಮೆ ಮಾರಾಯ್ತಿ.
    tr: Ramyā, nōḍtiru — nāḷe ninna appa mārkeṭ-nalli ‘avaḷu namma magaḷu, avaḷaddē chānel’ anta hēḷtāre. Kundāpradavarige svanta aṅgaḍi andre hemme mārāyti.
    en: Ramya, you watch — tomorrow your father will be telling the whole market, ‘That's our daughter, it's her own channel.’ For Kundapura people, your own shop is a matter of pride, mārāyti.
  - who: deepa
    t: 'ನನ್ನ ನಿಜ: ಈ ಒಂದು ವರ್ಷದಲ್ಲಿ ನಾನು ಗಂಡನನ್ನ ಕಳ್ಕೊಂಡಿದ್ದಕ್ಕಿಂತ ನನ್ನನ್ನೇ ಜಾಸ್ತಿ ಕಳ್ಕೊಂಡಿದ್ದೆ. ಮದುವೆಗೆ ಮುಂಚೆ ಹನ್ನೆರಡು ವರ್ಷ ಭರತನಾಟ್ಯ ಮಾಡ್ತಿದ್ದೆ. ಎಂಟು ವರ್ಷದಿಂದ ಗೆಜ್ಜೆ ಕಟ್ಟಿಲ್ಲ. ಮತ್ತೆ ಶುರು ಮಾಡ್ಬೇಕು.'
    tr: 'Nanna nija: ī ondu varṣadalli nānu gaṇḍananna kaḷkoṇḍiddakkinta nannannē jāsti kaḷkoṇḍidde. Maduvege muñce hanneraḍu varṣa Bharatanāṭya māḍtidde. Eṇṭu varṣadinda gejje kaṭṭilla. Matte śuru māḍbēku.'
    en: 'My truth: this past year I lost myself more than I lost a husband. Before my marriage I did Bharatanatyam for twelve years. I haven''t tied on my ankle bells in eight years. I want to start again.'
  - who: shruti
    t: ನಿನ್ನ ಗೆಜ್ಜೆ ಸದ್ದು ನನಗೆ ಇನ್ನೂ ನೆನಪಿದೆ, ದೀಪಾ. ಸೆಕೆಂಡ್ ಇಯರ್ ಕಾಲೇಜ್ ಡೇ, ‘ಕೃಷ್ಣಾ ನೀ ಬೇಗನೆ ಬಾರೋ’. ಇಡೀ ಆಡಿಟೋರಿಯಂ ಎದ್ದು ನಿಂತಿತ್ತು.
    tr: Ninna gejje saddu nanage innū nenapide, Dīpā. Sekeṇḍ iyar kālēj ḍē, ‘Kṛṣṇā nī bēgane bārō’. Iḍī āḍiṭōriyaṁ eddu nintittu.
    en: I still remember the sound of your ankle bells, Deepa. Second-year College Day, ‘Krishna Nee Begane Baaro’. The whole auditorium stood up.
  - who: deepa
    t: ನಿನಗೆ ಅದು ನೆನಪಿದ್ಯಾ? ನನಗೇ ಮರೆತುಹೋಗಿತ್ತು. ಗೆಜ್ಜೆ ಡಬ್ಬ ಮೈಸೂರಿನ ಮನೇಲೇ ಇದೆ. ಭಾನುವಾರ ಹೋದಾಗ ಹೊರಗೆ ತೆಗೀತೀನಿ.
    tr: Ninage adu nenapidyā? Nanagē maretuhōgittu. Gejje ḍabba Maisūrina manēlē ide. Bhānuvāra hōdāga horage tegītīni.
    en: You remember that? I'd forgotten it myself. The box with my bells is at home in Mysuru. When I go on Sunday, I'll take them out.
  - section: Shruti, at the sea
    learn: 'naming an old wound: nanage siṭṭu bandiddu adakkalla, adakke · deciding for someone: nīnu ibbara paravāgi tīrmāna māḍde · forgiving but needing to be heard: kṣamisi tumbā varṣa āytu, ādre ondu sala nīnu kēḷbēkittu · apology formula: āvattu ninna jote nillabēkittu, nillalilla · going back to work: riṭarn-śip, iṇṭarvyū, bhaya āgtide'
  - who: shruti
    t: ನನ್ನ ಸರದಿ. ಹಂಪಿಯಲ್ಲಿ ‘ಸಮುದ್ರದ ಹತ್ರ’ ಅಂದಿದ್ದೆ. ಇದೇ ಸಮುದ್ರ. ಅರ್ಜುನ್, ನೋಡು ಇಲ್ಲಿ, ನನ್ನ ಕಡೆ.
    tr: Nanna saradi. Hampiyalli ‘samudrada hatra’ andidde. Idē samudra. Arjun, nōḍu illi, nanna kaḍe.
    en: My turn. At Hampi I said 'at the sea'. This is the sea. Arjun, look here, at me.
  - who: shruti
    t: 'ಹಂಪಿಯಲ್ಲಿ ಹೇಳಿದ್ದೆ: ಪುಣೆಗೆ ಹೋಗಿದ್ದು ತಪ್ಪಲ್ಲ, ನಾನೇ ಹೋಗು ಅಂತಿದ್ದೆ. ನೀನು ಟ್ರೇನ್ ಹತ್ತಿದ ಮೇಲೆ ನಿನ್ನ ರೂಮ್‌ಮೇಟ್ ಬಾಯಿಂದ ನನಗೆ ಗೊತ್ತಾಯ್ತಲ್ಲ — ಅದು ತಪ್ಪು. ಅವತ್ತು ಹಾಸ್ಟೆಲ್ ಗೇಟ್ ಹತ್ರ ಒಬ್ಳೇ ನಿಂತಿದ್ದೆ.'
    tr: 'Hampiyalli hēḷidde: Puṇege hōgiddu tappalla, nānē hōgu antidde. Nīnu ṭrēn hattida mēle ninna rūm-mēṭ bāyinda nanage gottāytalla — adu tappu. Avattu hāsṭel gēṭ hatra obḷē nintidde.'
    en: 'I said it at Hampi: going to Pune wasn''t the wrong; I''d have told you to go myself. Hearing it from your roommate after you''d boarded the train — that was the wrong. That day I stood alone at the hostel gate.'
  - who: shruti
    t: ನೀನು ಕೇಳಿದ್ರೆ ಬಹುಶಃ ನಾನೂ ಬರ್ತಿದ್ದೆ. ಅಥವಾ ಬರ್ತಿರ್ಲಿಲ್ಲ. ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ನೀನು ಕೇಳ್ಲೇ ಇಲ್ಲ. ನೀನು ಇಬ್ಬರ ಪರವಾಗಿ ನೀನೊಬ್ಬನೇ ತೀರ್ಮಾನ ಮಾಡ್ದೆ. ಮತ್ತೆ ಓಡಿಹೋದೆ. ಈ ವರ್ಷ ನವೀನ್‌ನಿಂದಾನೂ ಹಾಗೇ ಓಡಿದೆ. ಅದೇ ಹಳೇ ಅರ್ಜುನ್.
    tr: Nīnu kēḷidre bahuśaḥ nānū bartidde. Athavā bartirlilla. Gottilla. Ādre nīnu kēḷlē illa. Nīnu ibbara paravāgi nīnobbanē tīrmāna māḍde. Matte ōḍihōde. Ī varṣa Navīn-nindānū hāgē ōḍide. Adē haḷē Arjun.
    en: If you'd asked, maybe I would have come. Or maybe not. I don't know. But you never asked. You decided for both of us, all by yourself. And then you ran. This year you ran from Naveen the same way. The same old Arjun.
  - who: shruti
    t: ನಾನು ನಿನ್ನನ್ನ ಕ್ಷಮಿಸಿ ತುಂಬಾ ವರ್ಷ ಆಯ್ತು. ನನಗೆ ವಿಕ್ರಮ್ ಇದ್ದಾರೆ, ಆದ್ಯಾ, ಇಶಾನ್ ಇದ್ದಾರೆ, ನಾನು ಖುಷಿಯಾಗಿದೀನಿ — ಇದು ಹಳೇ ಪ್ರೀತಿ ಕತೆ ಅಲ್ಲ. ಆದ್ರೆ ಅದು ನೋವು ಕೊಟ್ಟಿತ್ತು ಅಂತ ಒಂದು ಸಲ ನೀನು ನನ್ನ ಬಾಯಿಂದ ಕೇಳಬೇಕಿತ್ತು. ಅಷ್ಟೇ.
    tr: Nānu ninnanna kṣamisi tumbā varṣa āytu. Nanage Vikram iddāre, Ādyā, Iśān iddāre, nānu khuṣiyāgidīni — idu haḷē prīti kate alla. Ādre adu nōvu koṭṭittu anta ondu sala nīnu nanna bāyinda kēḷabēkittu. Aṣṭē.
    en: I forgave you years ago. I have Vikram, I have Aadya and Ishaan, I'm happy — this isn't an old love story. But you needed to hear it once, from my own mouth, that it hurt. That's all.
  - who: arjun
    t: ಕೇಳಿಸ್ಕೊಂಡೆ, ಶ್ರುತಿ. ಆವತ್ತು ನಾನು ನಿನ್ನ ಜೊತೆ ನಿಂತು ಕೇಳಬೇಕಿತ್ತು. ಕೇಳಲಿಲ್ಲ. ‘ಇಲ್ಲ’ ಅಂತೀಯೇನೋ ಅನ್ನೋ ಭಯಕ್ಕೆ ನಿನ್ನ ಆಯ್ಕೆನೇ ಕಿತ್ಕೊಂಡೆ. ಅದು ಹದಿನಾಲ್ಕು ವರ್ಷದಿಂದ ಕಾಡ್ತಿದೆ. ಕ್ಷಮಿಸು.
    tr: Kēḷiskoṇḍe, Śruti. Āvattu nānu ninna jote nintu kēḷabēkittu. Kēḷalilla. ‘Illa’ antīyēnō annō bhayakke ninna āykenē kitkoṇḍe. Adu hadinālku varṣadinda kāḍtide. Kṣamisu.
    en: I've heard it, Shruti. That day I should have stood with you and asked. I didn't. Out of fear that you might say 'no', I took the choice away from you. That has haunted me for fourteen years. Forgive me.
  - who: shruti
    t: 'ಆಯ್ತು. ಮುಗೀತು. ಇನ್ನೊಂದು, ಚಿಕ್ಕದು: ಎರಡು ವಾರದ ಹಿಂದೆ ಒಂದು ಜಿಸಿಸಿಯಲ್ಲಿ ‘ರಿಟರ್ನ್‌ಶಿಪ್’ ಪ್ರೋಗ್ರಾಮ್‌ಗೆ ಅಪ್ಲೈ ಮಾಡಿದೀನಿ — ಬ್ರೇಕ್ ತಗೊಂಡ ಹೆಂಗಸರಿಗೆ. ಡಿಸೆಂಬರ್ ಹದಿನೈದಕ್ಕೆ ಇಂಟರ್‌ವ್ಯೂ. ಏಳು ವರ್ಷ ಆಯ್ತು ಕೋಡ್ ಬರೆದು. ಸಕ್ಕತ್ ಭಯ ಆಗ್ತಿದೆ.'
    tr: 'Āytu. Mugītu. Innondu, cikkadu: eraḍu vārada hinde ondu ji-si-siyalli ‘riṭarn-śip’ prōgrām-ge aplai māḍidīni — brēk tagoṇḍa heṅgasarige. Ḍisembar hadinaidakke iṇṭarvyū. Ēḷu varṣa āytu kōḍ baredu. Sakkat bhaya āgtide.'
    en: 'OK. It''s over. One more, a small one: two weeks ago I applied to a ''returnship'' programme at a GCC — for women coming back after a career break. The interview''s on 15 December. It''s been seven years since I wrote code. I''m terrified.'
  - who: deepa
    t: ಶ್ರುತಿ! ನಮ್ ಬ್ಯಾಚ್‌ನಲ್ಲಿ ಡೇಟಾ ಸ್ಟ್ರಕ್ಚರ್ಸ್‌ಗೆ ಟಾಪ್ ಬಂದವಳು ನೀನು. ನಾಳೆಯಿಂದ ಹದಿನಾಲ್ಕರವರೆಗೆ ಪ್ರತಿ ಸಂಜೆ ನನ್ನ ಜೊತೆ ಮಾಕ್ ಇಂಟರ್‌ವ್ಯೂ. ಫೀಸ್ ಇಲ್ಲ.
    tr: Śruti! Nam byāc-nalli ḍēṭā sṭrakcars-ge ṭāp bandavaḷu nīnu. Nāḷeyinda hadinālkaravarege prati sañje nanna jote mōk iṇṭarvyū. Phīs illa.
    en: Shruti! You topped data structures in our batch. From tomorrow till the 14th, every evening, a mock interview with me. No fee.
  - who: arjun
    t: ಶ್ರುತಿ, ನಿನ್ನ ಸಿ ಪ್ರೋಗ್ರಾಮ್‌ಗಳನ್ನ ನಾನು ಕಾಪಿ ಮಾಡ್ತಿದ್ದೆ, ನೆನಪಿದ್ಯಾ? ಏಳು ವರ್ಷ ಅಲ್ಲ, ಎಪ್ಪತ್ತು ವರ್ಷ ಆದ್ರೂ ಆ ತಲೆ ಎಲ್ಲೂ ಹೋಗಲ್ಲ.
    tr: Śruti, ninna si prōgrām-gaḷanna nānu kāpi māḍtidde, nenapidyā? Ēḷu varṣa alla, eppattu varṣa ādrū ā tale ellū hōgalla.
    en: Shruti, I used to copy your C programs, remember? Not seven years — even seventy wouldn't make that brain go anywhere.
  - who: shruti
    t: ಕಾಪಿ ಮಾಡ್ತಿದ್ದೆ ಅಂತ ಈಗ ಒಪ್ಪಿಕೊಂಡ್ಯಾ? ಹದಿನಾರು ವರ್ಷ ಆದ್ಮೇಲೆ? ಕಾವೇರಿ, ಇದೂ ಒಂದು ಕನ್ಫೆಷನ್, ಬರ್ಕೋ.
    tr: Kāpi māḍtidde anta īga oppikoṇḍyā? Hadināru varṣa ādmēle? Kāvēri, idū ondu kanpheṣan, barkō.
    en: You're admitting now that you copied? After sixteen years? Kaveri, that's a confession too — write it down.
  - who: kaveri
    t: 'ಬರ್ಕೊಂಡೆ. ಆರೋಪಿ ತಪ್ಪು ಒಪ್ಪಿಕೊಂಡಿದ್ದಾನೆ. ಶಿಕ್ಷೆ: ಹದಿನಾಲ್ಕನೇ ತಾರೀಖಿನವರೆಗೆ ಶ್ರುತಿಗೆ ಮಾಕ್ ಇಂಟರ್‌ವ್ಯೂ ಪ್ರಶ್ನೆ ತಯಾರು ಮಾಡೋದು.'
    tr: 'Barkoṇḍe. Ārōpi tappu oppikoṇḍiddāne. Śikṣe: hadinālkanē tārīkhinavarege Śrutige māk iṇṭarvyū praśne tayāru māḍōdu.'
    en: 'Noted. The accused has pleaded guilty. Sentence: preparing mock-interview questions for Shruti until the fourteenth.'
  - section: Arjun's truth
    learn: 'a company closing: kampani muccuttide, bōrḍ tīrmāna, phaṇḍiṅg rauṇḍ kai koṭṭitu, ranvē mugītu · hard choices: eraḍaralli ondu āyke, avaranna āriside · severance and dignity: saṃbaḷa, sevarens, ellarigū kelasa sigō hāge · why he called the trip: sōtavanalla annō janara madhye irabēkittu · forgiveness given: īga hēḷtēne — kṣamisiddēne'
  - who: arjun
    t: ಈಗ ನಂದು. ನವೀನ್‌ಗೆ ‘ಒಂದು ದಿನ ಕೊಡು’ ಅಂದಿದ್ದೆ. ಆ ದಿನ ಇವತ್ತು. ಟ್ರಿಪ್ ಉದ್ದಕ್ಕೂ ನಾನು ‘ನೋ ಟೆನ್ಷನ್, ನೋ ಟೆನ್ಷನ್’ ಅಂತಿದ್ದೆ. ಹಂಪಿ ರಸ್ತೆಯಲ್ಲಿ ಇನ್ವೆಸ್ಟರ್ ಮೆಸೇಜ್ ಬಂದಾಗ ‘ಏನಿಲ್ಲ’ ಅಂದೆ, ನೆನಪಿದ್ಯಾ? ಅದು ಸುಳ್ಳು.
    tr: Īga nandu. Navīn-ge ‘ondu dina koḍu’ andidde. Ā dina ivattu. Ṭrip uddakkū nānu ‘nō ṭenṣan, nō ṭenṣan’ antidde. Hampi rasteyalli invesṭar mesēj bandāga ‘ēnilla’ ande, nenapidyā? Adu suḷḷu.
    en: Now mine. I told Naveen, 'Give me one day.' That day is today. All through the trip I kept saying 'no tension, no tension'. On the night road to Hampi, when the investor's message came, I said 'it's nothing' — remember? That was a lie.
  - who: arjun
    t: ನನ್ನ ಕಂಪನಿ ಮುಚ್ಚುತ್ತಿದೆ. ಸೆಪ್ಟೆಂಬರ್‌ನಲ್ಲಿ ಫಂಡಿಂಗ್ ರೌಂಡ್ ಕೊನೇ ಕ್ಷಣದಲ್ಲಿ ಕೈ ಕೊಟ್ಟಿತು. ನವೆಂಬರ್ ಇಪ್ಪತ್ತೆಂಟಕ್ಕೆ ಬೋರ್ಡ್ ತೀರ್ಮಾನ ಮಾಡ್ತು. ಡಿಸೆಂಬರ್ ಮೂವತ್ತೊಂದಕ್ಕೆ ಆಫೀಸ್ ಬಾಗಿಲು ಹಾಕ್ತೀವಿ. ಅರವತ್ತು ಜನ ಇದ್ದ ಕಂಪನಿ, ಲೇಆಫ್ ಆದ ಮೇಲೆ ಇಪ್ಪತ್ತಮೂರು. ಆ ಇಪ್ಪತ್ತಮೂರು ಜನಕ್ಕೂ ಇನ್ನೂ ಗೊತ್ತಿಲ್ಲ.
    tr: Nanna kampani muccuttide. Sepṭembar-nalli phaṇḍiṅg rauṇḍ konē kṣaṇadalli kai koṭṭitu. Navembar ippatteṇṭakke bōrḍ tīrmāna māḍtu. Ḍisembar mūvattondakke āphīs bāgilu hāktīvi. Aravattu jana idda kampani, lē-āph āda mēle ippattamūru. Ā ippattamūru janakkū innū gottilla.
    en: My company is closing. In September the funding round fell through at the last moment. On 28 November the board decided. On 31 December we shut the office doors. It was a company of sixty people; after the layoffs, twenty-three. Even those twenty-three don't know yet.
  - who: arjun
    t: 'ಚೆಕ್ ಬೌನ್ಸ್ ಆಗಿದ್ದು ಕ್ಲೈಂಟ್‌ನಿಂದ ಅಲ್ಲ, ನವೀನ್. ಅದು ಸುಳ್ಳು. ಅಕೌಂಟಲ್ಲಿ ಉಳಿದಿದ್ದ ದುಡ್ಡು ಎರಡಕ್ಕೆ ಸಾಕಾಗ್ತಿರಲಿಲ್ಲ: ಇಪ್ಪತ್ತಮೂರು ಜನರ ನವೆಂಬರ್ ಸಂಬಳ, ಅಥವಾ ನಿನ್ನ ಚೆಕ್. ನಾನು ಅವರನ್ನ ಆರಿಸಿದೆ. ಅದು ಸರಿನೋ ತಪ್ಪೋ ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ನಿನಗೆ ಹೇಳದೇ ಇದ್ದದ್ದು ಖಂಡಿತ ತಪ್ಪು.'
    tr: 'Cek bauns āgiddu klaiṇṭ-ninda alla, Navīn. Adu suḷḷu. Akauṇṭalli uḷididda duḍḍu eraḍakke sākāgtiralilla: ippattamūru janara Navembar saṃbaḷa, athavā ninna cek. Nānu avaranna āriside. Adu sarinō tappō gottilla. Ādre ninage hēḷadē iddaddu khaṇḍita tappu.'
    en: 'The cheque didn''t bounce because of a client, Naveen. That was a lie. What was left in the account wasn''t enough for both: the November salaries of twenty-three people, or your cheque. I chose them. I don''t know if that was right or wrong. But not telling you was definitely wrong.'
  - who: arjun
    t: ಮತ್ತೆ ಈ ಟ್ರಿಪ್. ಮಜಾಗೆ ಪ್ಲಾನ್ ಮಾಡಿದ್ದಲ್ಲ. ಮೂವತ್ತೊಂದಕ್ಕೆ ಬಾಗಿಲು ಹಾಕೋ ಮುಂಚೆ, ಒಂದು ಸಲ, ನನ್ನನ್ನ ‘ಸೋತವನು’ ಅಂತ ನೋಡದ ಜನರ ಮಧ್ಯೆ ಇರಬೇಕಿತ್ತು. ನನ್ನ ಅಪ್ಪ-ಅಮ್ಮಂಗೂ ಗೊತ್ತಿಲ್ಲ. ನೀವೇ ಮೊದಲು.
    tr: Matte ī ṭrip. Majāge plān māḍiddalla. Mūvattondakke bāgilu hākō muñce, ondu sala, nannanna ‘sōtavanu’ anta nōḍada janara madhye irabēkittu. Nanna appa-ammaṅgū gottilla. Nīvē modalu.
    en: And this trip. I didn't plan it for fun. Before I shut the doors on the 31st, just once, I needed to be among people who didn't see me as a failure. Even my parents don't know. You're the first.
  - scene: The waves come in and go out. Nobody moves for a long moment. Then Naveen gets up, walks around the lamp and sits down next to Arjun.
  - who: naveen
    t: ಸಂಬಳ ಮೊದಲು ಕೊಟ್ಟದ್ದು — ಅದು ಸರಿ ಮಾರಾಯ. ನಾನು ಹೋಟೆಲ್ ನಡೆಸುವವನು. ತಿಂಗಳ ಕೊನೆಗೆ ದುಡ್ಡು ಕಮ್ಮಿ ಆದರೆ ಮೊದಲು ಅಡುಗೆಮನೆ ಹುಡುಗರ ಸಂಬಳ, ಆಮೇಲೆ ನನ್ನ ಸಾಲ. ಅದೇ ನಿಯಮ.
    tr: Saṃbaḷa modalu koṭṭaddu — adu sari mārāya. Nānu hōṭel naḍesuvavanu. Tiṅgaḷa konege duḍḍu kammi ādare modalu aḍugemane huḍugara saṃbaḷa, āmēle nanna sāla. Adē niyama.
    en: Paying the salaries first — that was right, mārāya. I run a hotel. If money is short at the end of the month, the kitchen boys' wages come first, then my own debts. That's the rule.
  - who: naveen
    t: 'ಗಾಡಿಯಲ್ಲಿ ‘ಕ್ಷಮಿಸಿದ್ದೇನೆ ಅಂತ ಈಗ ಹೇಳುದಿಲ್ಲ’ ಅಂದಿದ್ದೆ. ಈಗ ಹೇಳ್ತೇನೆ: ಕ್ಷಮಿಸಿದ್ದೇನೆ. ದುಡ್ಡಿನ ಲೆಕ್ಕ ಬೇರೆ — ಅದು ಕಾವೇರಿಯ ಪೇಪರ್‌ನಲ್ಲಿ. ದೋಸ್ತಿಯ ಲೆಕ್ಕ ಇಲ್ಲಿ, ಇವತ್ತೇ ಮುಗೀತು.'
    tr: 'Gāḍiyalli ‘kṣamisiddēne anta īga hēḷudilla’ andidde. Īga hēḷtēne: kṣamisiddēne. Duḍḍina lekka bēre — adu Kāvēriya pēpar-nalli. Dōstiya lekka illi, ivattē mugītu.'
    en: 'In the car I said, ''I won''t say I''ve forgiven you now.'' Now I''ll say it: I''ve forgiven you. The money account is separate — that''s on Kaveri''s paper. The friendship account is settled here, tonight.'
  - who: arjun
    t: ನವೀನ್… ನಿನ್ನ ಹೊಟ್ಟೆಕಿಚ್ಚಿನ ಬಗ್ಗೆ — ಕಾಲೇಜಿನಲ್ಲಿ ನಿನ್ನ ಬೈಕ್ ಮಾರಿದವನ ಮೇಲೆ ನನಗೂ ಹೊಟ್ಟೆಕಿಚ್ಚು ಇತ್ತು. ಅಂಥ ಮನಸ್ಸು ನನಗಿರ್ಲಿಲ್ಲ.
    tr: Navīn… ninna hoṭṭekiccina bagge — kālējinalli ninna baik māridavana mēle nanagū hoṭṭekiccu ittu. Antha manassu nanagirlilla.
    en: Naveen… about your jealousy — in college I was jealous too, of the guy who sold his bike for me. I never had a heart like that.
  - who: naveen
    t: ಸಾಕು ಡ್ರಾಮಾ. ಬಾ ಇಲ್ಲಿ.
    tr: Sāku ḍrāmā. Bā illi.
    en: Enough drama. Come here.
  - scene: They hug, clumsily, on the sand. Ramya, for once, does not reach for her phone.
  - who: imran
    t: 'ಡಾಕ್ಟರ್ ಪ್ರಶ್ನೆ, ಅರ್ಜುನ್: ಎಷ್ಟು ದಿನದಿಂದ ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಬಾಲ್ಕನಿಯಾಗ ಕುಂತೀ? ನಾ ನೋಡೀನಿ.'
    tr: 'Ḍākṭar praśne, Arjun: eṣṭu dinadinda rātri eraḍu gaṇṭege bālkaniyāga kuntī? Nā nōḍīni.'
    en: 'Doctor''s question, Arjun: how long have you been sitting on the balcony at two in the morning? I''ve seen you.'
  - who: arjun
    t: ಸೆಪ್ಟೆಂಬರ್‌ನಿಂದ. ಮೂರು ತಿಂಗಳು.
    tr: Sepṭembar-ninda. Mūru tiṅgaḷu.
    en: Since September. Three months.
  - who: imran
    t: ಹಂಗಾದ್ರ ಸುನೀತಾ ನಂಬರ್ ನಿನಗೂ ಕೊಡ್ತೇನಿ. ಇದು ಡಾಕ್ಟರ್ ಸಲಹೆ ಅಲ್ಲ, ದೋಸ್ತನ ಆರ್ಡರ್.
    tr: Haṅgādra Sunītā nambar ninagū koḍtēni. Idu ḍākṭar salahe alla, dōstana ārḍar.
    en: Then I'm giving Sunita's number to you too. This isn't a doctor's advice — it's a friend's order.
  - who: kaveri
    t: 'ಒಂದು ಲೀಗಲ್ ಪಾಯಿಂಟ್, ಸಮಾಧಾನಕ್ಕೆ: ಕಂಪನಿ ಮುಚ್ಚೋದು ಅಪರಾಧ ಅಲ್ಲ, ಅರ್ಜುನ್. ಅದಕ್ಕೂ ಒಂದು ಕಾನೂನು ಪ್ರಕ್ರಿಯೆ ಇದೆ — ಬಾಕಿಗಳು, ನೌಕರರ ಹಣ, ಸಾಲಗಾರರು. ಸರಿಯಾದ ಕ್ರಮದಲ್ಲಿ ಮಾಡಿದ್ರೆ ತಲೆ ಎತ್ತಿ ಮುಚ್ಚಬಹುದು. ವಿವರ ಬೆಂಗಳೂರಲ್ಲಿ, ಕಾಗದ ನೋಡಿ.'
    tr: 'Ondu līgal pāyiṇṭ, samādhānakke: kampani muccōdu aparādha alla, Arjun. Adakkū ondu kānūnu prakriye ide — bākigaḷu, naukarara haṇa, sālagāraru. Sariyāda kramadalli māḍidre tale etti muccabahudu. Vivara Beṅgaḷūralli, kāgada nōḍi.'
    en: 'One legal point, for comfort: closing a company isn''t a crime, Arjun. There''s a legal process for it too — dues, employees'' money, creditors. Done in the proper order, you can close it with your head held high. Details in Bengaluru, after I see the papers.'
  - who: shruti
    t: ಮತ್ತೆ ಒಂದು ವಿಷಯ ಗಮನಿಸಿದ್ರಾ? ಈ ಸಲ ಅವನು ಓಡಲಿಲ್ಲ. ಎಲ್ಲರ ಮುಂದೆ ಕೂತು ಹೇಳಿದ.
    tr: Matte ondu viṣaya gamanisidrā? Ī sala avanu ōḍalilla. Ellara munde kūtu hēḷida.
    en: And did you all notice one thing? This time he didn't run. He sat in front of everyone and said it.
  - who: deepa
    t: ಅರ್ಜುನ್, ನಿನ್ನ ಅಪ್ಪ-ಅಮ್ಮಂಗೂ ಹೇಳು. ನನ್ನ ಅಮ್ಮ ಏನು ಕೇಳಿದ್ರು ಅಂತ ಕೇಳಿದ್ಯಲ್ಲ — ‘ಊಟ ಮಾಡಿದ್ಯಾ?’ ನಿಮ್ಮಮ್ಮನೂ ಅದನ್ನೇ ಕೇಳ್ತಾರೆ, ನೋಡ್ತಿರು.
    tr: Arjun, ninna appa-ammaṅgū hēḷu. Nanna amma ēnu kēḷidru anta kēḷidyalla — ‘ūṭa māḍidyā?’ Nimmammanū adannē kēḷtāre, nōḍtiru.
    en: Arjun, tell your parents too. You heard what my mother asked — 'Have you eaten?' Your mother will ask the same thing, you'll see.
  - who: ramya
    t: ಅರ್ಜುನ್, ಒಂದು ಪ್ರಶ್ನೆ — ಜರ್ನಲಿಸ್ಟ್ ಆಗಿ ಅಲ್ಲ, ಗೆಳತಿ ಆಗಿ. ಆ ಇಪ್ಪತ್ಮೂರು ಜನ ಯಾರು ಅಂತ ನಿನಗೆ ಗೊತ್ತಾ? ಹೆಸರು ಮಾತ್ರ ಅಲ್ಲ — ಅವರ ಮನೆ ಕಥೆ?
    tr: Arjun, ondu praśne — jarnalisṭ āgi alla, geḷati āgi. Ā ippatmūru jana yāru anta ninage gottā? Hesaru mātra alla — avara mane kathe?
    en: Arjun, one question — not as a journalist, as a friend. Do you know who those twenty-three are? Not just their names — their stories at home?
  - who: arjun
    t: ಗೊತ್ತು. ನಿಶಾಗೆ ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಡೆಲಿವರಿ. ಕಿರಣ್ ಅಪ್ಪನಿಗೆ ವಾರಕ್ಕೆ ಮೂರು ಸಲ ಡಯಾಲಿಸಿಸ್. ಫೈಸಲ್ ಹೋದ ತಿಂಗಳು ಹೋಮ್ ಲೋನ್ ತಗೊಂಡ. ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಬಾಲ್ಕನಿಯಲ್ಲಿ ನಾನು ನೋಡ್ತಿದ್ದದ್ದು ಎಕ್ಸೆಲ್ ಅಲ್ಲ. ಈ ಹೆಸರುಗಳು.
    tr: Gottu. Niśāge ēpril-nalli ḍelivari. Kiraṇ appanige vārakke mūru sala ḍayālisis. Phaisal hōda tiṅgaḷu hōm lōn tagoṇḍa. Rātri eraḍu gaṇṭege bālkaniyalli nānu nōḍtiddaddu eksel alla. Ī hesarugaḷu.
    en: I do. Nisha's baby is due in April. Kiran's father has dialysis three times a week. Faisal took a home loan last month. What I was staring at on the balcony at two in the morning wasn't Excel. It was these names.
  - who: ramya
    t: ಹಾಗಾದ್ರೆ ನೀನು ಫೇಲ್ಯೂರ್ ಅಲ್ಲ, ಅರ್ಜುನ್. ಸೋತವನಿಗೆ ನಂಬರ್ ಮಾತ್ರ ನೆನಪಿರುತ್ತೆ. ಹೆಸರು ನೆನಪಿಟ್ಕೊಳ್ಳೋನು ಇನ್ನೂ ಮನುಷ್ಯ.
    tr: Hāgādre nīnu phēlyūr alla, Arjun. Sōtavanige nambar mātra nenapirutte. Hesaru nenapiṭkoḷḷōnu innū manuṣya.
    en: Then you're not a failure, Arjun. A man who's given up remembers only numbers. A man who remembers names is still a human being.
  - section: Prakash's answer
    learn: 'answering a hurt with dignity: nī nakkiddu nan mātigalla, nan avvana mātige · hiding one''s dialect: ‘aiti’ biṭṭu ‘ide’ annāka kalite · a real apology vs a conditional one: ‘bējārāgidre sāri’ — adu kṣame alla, tappisikoḷḷōdu · forgiving with a condition: āytu, kṣamiside, ondu kaṇḍīśan · resolve: mūranē sala, Dhāravāḍa kannaḍadāgē uttara'
  - who: prakash
    t: ಎಲ್ಲಾರೂ ಹೇಳಿದ್ರಿ. ನಾನೂ ಒಂದು ಖರೇ ಹೇಳತೇನಿ. ಅರ್ಜುನ್ ಅವರೇ… ಇಲ್ಲ. ಇವತ್ತು ‘ಅವರೇ’ ಬ್ಯಾಡ. ಅರ್ಜುನ್, ಇದು ನಿನಗ.
    tr: Ellārū hēḷidri. Nānū ondu kharē hēḷatēni. Arjun avarē… illa. Ivattu ‘avarē’ byāḍa. Arjun, idu ninaga.
    en: You've all spoken. I'll tell one truth too. Arjun-avare… no. No 'avare' tonight. Arjun, this is for you.
  - who: prakash
    t: ಚಿತ್ರದುರ್ಗದಾಗ ನೀ ನನ್ ಮಾತು ನಕಲ ಮಾಡಿ ಎಲ್ಲಾರ ಮುಂದ ನಗಿಸಿದಿ. ನಿನಗ ಅದು ಜೋಕ್. ಆದ್ರ ನೀ ನಕ್ಕಿದ್ದು ನನ್ ಮಾತಿಗಲ್ಲ. ನನ್ ಅವ್ವನ ಮಾತಿಗೆ. ನಿನಗ ರೊಟ್ಟಿ ಬಡಿಸಿದ ಕೈ ಮಾತಾಡೋ ಭಾಷೆಗೆ. ನನ್ ಸಾಲಿ ಮಕ್ಕಳ ಭಾಷೆಗೆ.
    tr: Citradurgadāga nī nan mātu nakala māḍi ellāra munda nagisidi. Ninaga adu jōk. Ādra nī nakkiddu nan mātigalla. Nan avvana mātige. Ninaga roṭṭi baḍisida kai mātāḍō bhāṣege. Nan sāli makkaḷa bhāṣege.
    en: At Chitradurga you imitated the way I talk and made everyone laugh. To you it was a joke. But you weren't laughing at my speech. You were laughing at my mother's speech. The language of the hands that served you rotti. The language of the children in my school.
  - who: prakash
    t: ಕಾಲೇಜಿನ್ಯಾಗ ನಾಲ್ಕು ವರ್ಷ ನಾ ‘ಐತಿ’ ಬಿಟ್ಟು ‘ಇದೆ’ ಅನ್ನಾಕ ಕಲಿತೆ. ನಿಮ್ಮಂಗ ಆಗಾಕ. ಕೆಎಎಸ್ ಇಂಟರ್‌ವ್ಯೂನ್ಯಾಗ ಸೋತಿದ್ದು ಜ್ಞಾನ ಇಲ್ಲದಕ್ಕಲ್ಲ — ನನ್ನ ನಾನೇ ನಾಚಿಕೊಂಡಿದ್ದಕ್ಕ. ಆ ನಾಚಿಕಿ ಎಲ್ಲಿಂದ ಬಂತು ಅಂತ ಚಿತ್ರದುರ್ಗದಾಗ ಗೊತ್ತಾತು.
    tr: Kālējinyāga nālku varṣa nā ‘aiti’ biṭṭu ‘ide’ annāka kalite. Nimmaṅga āgāka. Ke-e-es iṇṭarvyūnyāga sōtiddu jñāna illadakkalla — nanna nānē nācikoṇḍiddakka. Ā nāciki ellinda bantu anta Citradurgadāga gottātu.
    en: In college, for four years, I trained myself to drop 'aiti' and say 'ide'. To be like you lot. I didn't lose the KAS interview for lack of knowledge — I lost it because I was ashamed of myself. At Chitradurga I found out where that shame came from.
  - who: prakash
    t: ಇನ್ನೊಂದು ಮಾತು. ಕಾಲೇಜಿನ್ಯಾಗ ನೀನು ನನಗ ಇಂಗ್ಲೀಷ್ ಕಲಿಸಿದ್ದು ಖರೇ. ಆ ಉಪಕಾರ ನಾ ಮರತಿಲ್ಲ. ಕಲಿಸಿದ ಕೈಯೇ ಎಲ್ಲಾರನ್ನೂ ನಗಿಸಿದಾಗ ನೋವು ಡಬಲ್ ಆತು.
    tr: Innondu mātu. Kālējinyāga nīnu nanaga iṅglīṣ kalisiddu kharē. Ā upakāra nā maratilla. Kalisida kaiyē ellārannū nagisidāga nōvu ḍabal ātu.
    en: One more thing. It's true you taught me English in college. I haven't forgotten that kindness. When the same hand that taught me made everyone laugh at me, the hurt was double.
  - who: arjun
    t: ಪ್ರಕಾಶ್. ಚಿತ್ರದುರ್ಗದಲ್ಲಿ ನಾನು ‘ನಿನಗೆ ಬೇಜಾರಾಗಿದ್ರೆ ಸಾರಿ’ ಅಂದೆ. ‘ಆಗಿದ್ರೆ’ — ಆ ಒಂದು ಪದ. ಅದು ಕ್ಷಮೆ ಅಲ್ಲ, ತಪ್ಪಿಸ್ಕೊಳ್ಳೋದು. ನಿಮ್ಮಮ್ಮನ ಮನೆಯಲ್ಲಿ, ಅವರು ‘ನೀನೇ ಅವನಿಗೆ ಇಂಗ್ಲೀಷ್ ಕಲಿಸಿದಿ’ ಅಂದಾಗ, ನಾನು ಏನನ್ನ ನಕಲು ಮಾಡಿದೆ ಅಂತ ಅರ್ಥ ಆಯ್ತು. ಆ ಊಟ ನನ್ನ ಗಂಟಲಲ್ಲಿ ಇಳೀಲಿಲ್ಲ.
    tr: Prakāś. Citradurgadalli nānu ‘ninage bējārāgidre sāri’ ande. ‘Āgidre’ — ā ondu pada. Adu kṣame alla, tappiskoḷḷōdu. Nimmammana maneyalli, avaru ‘nīnē avanige iṅglīṣ kaliside’ andāga, nānu ēnanna nakalu māḍide anta artha āytu. Ā ūṭa nanna gaṇṭalalli iḷīlilla.
    en: Prakash. At Chitradurga I said, 'Sorry if you felt bad.' 'If' — that one word. That's not an apology — that's dodging. In your mother's house, when she said 'You're the one who taught him English', I understood what I'd been imitating. That meal stuck in my throat.
  - who: arjun
    t: ನಿನ್ನ ಭಾಷೆನ ನಾನು ಅವಮಾನ ಮಾಡ್ದೆ, ನಿಮ್ಮಮ್ಮನ ಭಾಷೆನ, ನಿನ್ನ ಮಕ್ಕಳ ಭಾಷೆನ. ಇನ್ಮೇಲೆ ಯಾರಾದ್ರೂ ಅದನ್ನ ಮಾಡಿದ್ರೆ ನಾನು ಸುಮ್ಮನಿರಲ್ಲ — ಅದು ನನ್ನ ಮಾತು. ದಯವಿಟ್ಟು ನನ್ನನ್ನ ಕ್ಷಮಿಸು.
    tr: Ninna bhāṣena nānu avamāna māḍde, nimmammana bhāṣena, ninna makkaḷa bhāṣena. Inmēle yārādrū adanna māḍidre nānu summaniralla — adu nanna mātu. Dayaviṭṭu nannanna kṣamisu.
    en: I humiliated your language — your mother's language, your pupils' language. From now on, if anyone does that, I won't keep quiet — that's my word. Please forgive me.
  - who: prakash
    t: ಆತು. ಕ್ಷಮಿಸಿದೆ. ಆದ್ರ ಒಂದು ಕಂಡೀಶನ್ ಐತಿ.
    tr: Ātu. Kṣamiside. Ādra ondu kaṇḍīśan aiti.
    en: All right. I forgive you. But there's one condition.
  - who: arjun
    t: ಏನು ಬೇಕಾದ್ರೂ.
    tr: Ēnu bēkādrū.
    en: Anything.
  - who: prakash
    t: ಮೂರನೇ ಸಲ ಕೆಎಎಸ್ ಬರೀತೇನಿ. ಈ ಸಲ ಇಂಟರ್‌ವ್ಯೂನ್ಯಾಗ ಧಾರವಾಡ ಕನ್ನಡದಾಗೇ ಉತ್ತರ ಕೊಡ್ತೇನಿ, ತಲೆ ಎತ್ತಿ. ನನ್ನ ಮಾಕ್ ಇಂಟರ್‌ವ್ಯೂ ಬೋರ್ಡ್‌ನ್ಯಾಗ ನೀ ಕುಂತಿರಬೇಕು. ಅತಿ ಕಠಿಣ, ಅತಿ ಇಂಗ್ಲೀಷ್ ಸದಸ್ಯ ಆಗಿ. ನಾ ನಿನ್ನ ಮುಂದ ಧಾರವಾಡ ಕನ್ನಡದಾಗ ಗೆಲ್ಲಬೇಕು.
    tr: Mūranē sala ke-e-es barītēni. Ī sala iṇṭarvyūnyāga Dhāravāḍa kannaḍadāgē uttara koḍtēni, tale etti. Nanna mōk iṇṭarvyū bōrḍ-nyāga nī kuntirabēku. Ati kaṭhiṇa, ati iṅglīṣ sadasya āgi. Nā ninna munda Dhāravāḍa kannaḍadāga gellabēku.
    en: I'm going to sit the KAS a third time. This time, in the interview, I'll answer in Dharwad Kannada, head held high. You have to sit on my mock interview board. As the toughest, most English member. I need to beat you in Dharwad Kannada.
  - who: arjun
    t: ಡೀಲ್. ಆದ್ರೆ ನಾನು ಪ್ರಶ್ನೆ ಕೇಳೋದು ಕೂಡ ಧಾರವಾಡ ಕನ್ನಡದಲ್ಲೇ — ಆಗ ನಿಜವಾದ ಪರೀಕ್ಷೆ ನನಗೆ.
    tr: Ḍīl. Ādre nānu praśne kēḷōdu kūḍa Dhāravāḍa kannaḍadallē — āga nijavāda parīkṣe nanage.
    en: Deal. But I'll ask the questions in Dharwad Kannada too — then the real exam will be mine.
  - who: prakash
    t: ಹಂಗಾದ್ರ ನೀ ಫೇಲ್ ಆಗ್ತಿ ಖರೇ. ಬಾರಲೇ ಇಲ್ಲಿ.
    tr: Haṅgādra nī phēl āgti kharē. Bāralē illi.
    en: Then you'll definitely fail. Come here, you.
  - scene: Prakash pulls Arjun into a hug. Imran throws his arms around both of them; then everyone piles in, and someone knocks over the lamp, and they are laughing in the dark.
  - who: imran
    t: ಯಪ್ಪಾ, ಲ್ಯಾಂಪ್ ಬಿತ್ತು! ಯಾರಿಗೂ ಸುಟ್ಟಿಲ್ಲ ತಾನೇ? ಡಾಕ್ಟರ್‌ಗೆ ಇನ್ನೂ ಆರು ದಿನ ಡ್ಯೂಟಿ ಐತಿ.
    tr: Yappā, lyāmp bittu! Yārigū suṭṭilla tānē? Ḍākṭar-ge innū āru dina ḍyūṭi aiti.
    en: Yappa, the lamp's fallen! Nobody's burnt, I hope? The doctor still has six days of duty left.
  - who: prakash
    t: ಸುಟ್ಟಿದ್ದು ಹಳೇ ಸಿಟ್ಟು ಮಾತ್ರ, ಡಾಕ್ಟ್ರೇ. ಗಾಯಕ್ಕ ಈಗ ಸರಿಯಾದ ಕೈಯಿಂದ ಪಟ್ಟಿ ಬಿದ್ದೈತಿ.
    tr: Suṭṭiddu haḷē siṭṭu mātra, Ḍākṭrē. Gāyakka īga sariyāda kaiyinda paṭṭi biddaiti.
    en: Only the old anger got burnt, Doctor. The wound's been dressed now — by the right hand.
  - section: Promises under the stars
    learn: 'making promises: māḍtīni, kaḷistīni, baratēni, ilde irōdilla · dates and deadlines: Śukravāradoḷage, Mārc-nalli, prati tiṅgaḷu · a rule for the group: tondare bandre modalu phōn, āmēle ellā · closing a game: sākṣigaḷu nāvellā'
  - who: kaveri
    t: 'ಕೊನೇ ಸುತ್ತು. ಒಬ್ಬೊಬ್ಬರೂ ಒಂದೇ ವಾಕ್ಯದ ಪ್ರಾಮಿಸ್. ಸಾಕ್ಷಿ ಈ ಸಮುದ್ರ ಮತ್ತೆ ನಾವು ಏಳು ಜನ. ನನ್ನದು: ರಾಜಿ ಒಪ್ಪಂದದ ಡ್ರಾಫ್ಟ್ ಶುಕ್ರವಾರದೊಳಗೆ ನವೀನ್-ಅರ್ಜುನ್‌ಗೆ ಕಳಿಸ್ತೀನಿ. ಮತ್ತೆ ತಿಂಗಳಿಗೊಂದು ಶನಿವಾರ ಕೋರ್ಟ್ ಫೈಲ್ ಮುಟ್ಟಲ್ಲ.'
    tr: 'Konē suttu. Obbobbarū ondē vākyada prāmis. Sākṣi ī samudra matte nāvu ēḷu jana. Nannadu: rāji oppandada ḍrāphṭ Śukravāradoḷage Navīn-Arjun-ge kaḷistīni. Matte tiṅgaḷigondu Śanivāra kōrṭ phail muṭṭalla.'
    en: 'Last round. Everyone makes a one-sentence promise. The witnesses are this sea and the seven of us. Mine: I''ll send the draft settlement to Naveen and Arjun by Friday. And one Saturday a month I won''t touch a court file.'
  - who: imran
    t: ಹದಿನಾರನೇ ತಾರೀಖು ಸುನೀತಾ ಜೊತೆ ಮೊದಲ ಸೆಷನ್. ತಪ್ಪಿಸಿದ್ರ ಕಾವೇರಿ ನನ್ ಮ್ಯಾಲೆ ಕೇಸ್ ಹಾಕಬಹುದು.
    tr: Hadināranē tārīkhu Sunītā jote modala seṣan. Tappisidra Kāvēri nan myāle kēs hākabahudu.
    en: The first session with Sunita on the 16th. If I skip it, Kaveri can file a case against me.
  - who: deepa
    t: ಭಾನುವಾರ ಕುವೆಂಪುನಗರದ ಮನೆಗೆ ಹೋಗಿ ಅಪ್ಪನ ಮುಖ ನೋಡಿ ಮಾತಾಡ್ತೀನಿ. ಫೋನಲ್ಲಿ ಅಲ್ಲ.
    tr: Bhānuvāra Kuvempunagarada manege hōgi appana mukha nōḍi mātāḍtīni. Phōnalli alla.
    en: On Sunday I'll go home to Kuvempunagar and talk to my father face to face. Not on the phone.
  - who: ramya
    t: ‘ಊರ ಕತೆ’ಯ ಮೊದಲ ಎಪಿಸೋಡ್ — ಧಾರವಾಡ, ಪ್ರಕಾಶ್‌ನ ಅಮ್ಮನ ಅಡುಗೆಮನೆ. ಅಮ್ಮ ಒಪ್ಪಿದ್ರೆ.
    tr: ‘Ūra kate’ya modala epiśōḍ — Dhāravāḍa, Prakāś-na ammana aḍugemane. Amma oppidre.
    en: The first episode of 'Ura Kathe' — Dharwad, Prakash's mother's kitchen. If Amma agrees.
  - who: prakash
    t: 'ಅವ್ವ ಒಪ್ಪತಾಳ. ಕ್ಯಾಮೆರಾ ಮುಂದ ಚಟ್ನಿ ಕುಟ್ಟಾಕ ಆಕಿ ಕಾಯಾಕತ್ತಾಳ ಅಂತ ನನಗ ಗೊತ್ತು. ನನ್ನದು: ನಾಳೆ ಮನಿಗೆ ಹೋದ ಕೂಡ್ಲೆ ಶೆಲ್ಫ್ ಮ್ಯಾಲಿನ ಪುಸ್ತಕ ಕೆಳಗ ಇಳಸತೇನಿ.'
    tr: 'Avva oppatāḷa. Kyāmerā munda caṭni kuṭṭāka āki kāyākattāḷa anta nanaga gottu. Nannadu: nāḷe manige hōda kūḍle śelph myālina pustaka keḷaga iḷasatēni.'
    en: 'Avva will agree. I know she''s dying to pound chutney in front of a camera. Mine: tomorrow, as soon as I get home, I''ll bring the books down from the shelf.'
  - who: shruti
    t: ಹದಿನೈದನೇ ತಾರೀಖು ಇಂಟರ್‌ವ್ಯೂಗೆ ಹೋಗ್ತೀನಿ. ಭಯ ಆದ್ರೂ ಹೋಗ್ತೀನಿ.
    tr: Hadinaidanē tārīkhu iṇṭarvyūge hōgtīni. Bhaya ādrū hōgtīni.
    en: On the 15th I'll go to the interview. Even if I'm scared, I'll go.
  - who: naveen
    t: ಮಾರ್ಚ್‌ನಲ್ಲಿ ಹೋಟೆಲ್ ರಿನೋವೇಷನ್. ಅಪ್ಪನಿಗೆ ಹೇಳಿದ ಸುಳ್ಳನ್ನ ನಿಜ ಮಾಡ್ತೇನೆ.
    tr: Mārc-nalli hōṭel rinōvēṣan. Appanige hēḷida suḷḷanna nija māḍtēne.
    en: The hotel renovation in March. I'll turn the lie I told my father into the truth.
  - who: arjun
    t: ಕಂಪನಿಯನ್ನ ಪ್ರಾಮಾಣಿಕವಾಗಿ ಮುಚ್ತೀನಿ. ನಾಳೆ ನಾಡಿದ್ದು ಟೀಮ್‌ಗೆ ಮುಖ ನೋಡಿ ಹೇಳ್ತೀನಿ, ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಪೂರ್ತಿ ಸಂಬಳ, ಸೆವರೆನ್ಸ್, ಮತ್ತೆ ಎಲ್ಲರಿಗೂ ಕೆಲಸ ಸಿಗೋವರೆಗೆ ರೆಫರೆನ್ಸ್. ಮತ್ತೆ ಇನ್ಮೇಲೆ ತೊಂದರೆ ಬಂದ್ರೆ ಮೊದಲು ನಿಮಗೆ ಫೋನ್, ಆಮೇಲೆ ಎಲ್ಲಾ.
    tr: Kampaniyanna prāmāṇikavāgi muctīni. Nāḷe nāḍiddu ṭīm-ge mukha nōḍi hēḷtīni, pratiyobbarigū pūrti saṃbaḷa, sevarens, matte ellarigū kelasa sigōvarege rephareṇs. Matte inmēle tondare bandre modalu nimage phōn, āmēle ellā.
    en: I'll close the company honestly. In the next day or two I'll tell the team face to face — full salary for everyone, severance, and references until every one of them finds a job. And from now on, if trouble comes, I call you first, everything else after.
  - who: naveen
    t: ‘ಮೊದಲು ನಿಮಗೆ ಕಾಲ್’ — ಅದನ್ನ ಬರೆದಿಟ್ಕೋ ಮಾರಾಯ. ಮುಂದಿನ ಸಲ ಮರೆತ್ರೆ ನಾನೇ ಬೆಂಗಳೂರಿಗೆ ಬಂದು ಬಾಗಿಲು ಬಡೀತೇನೆ.
    tr: ‘Modalu nimage kāl’ — adanna barediṭkō mārāya. Mundina sala maretre nānē Beṅgaḷūrige bandu bāgilu baḍītēne.
    en: ‘Call you first’ — write that down, maraya. If you forget next time, I'll come to Bengaluru myself and bang on your door.
  - who: arjun
    t: ಬಾಗಿಲು ಬಡಿಯೋ ಮುಂಚೆ ಒಂದು ಫೋನ್ ಮಾಡು. ಈ ಸಲ ಮೊದಲ ರಿಂಗಿಗೇ ಎತ್ತುತೀನಿ.
    tr: Bāgilu baḍiyō muñche ondu phōn māḍu. Ī sala modala riṅgigē ettutīni.
    en: Phone once before you bang on the door. This time I'll pick up on the first ring.
  - who: kaveri
    t: ದಾಖಲಾಗಿದೆ. ಎಂಟು ಪ್ರಾಮಿಸ್, ಏಳು ಸಾಕ್ಷಿ, ಒಂದು ಸಮುದ್ರ. ಕೋರ್ಟ್ ಮುಂದೂಡಲಾಗಿದೆ — ಮುಂದಿನ ರೀಯೂನಿಯನ್‌ಗೆ.
    tr: Dākhalāgide. Eṇṭu prāmis, ēḷu sākṣi, ondu samudra. Kōrṭ mundūḍalāgide — mundina rīyūniyan-ge.
    en: Recorded. Eight promises, seven witnesses, one sea. The court is adjourned — until the next reunion.
  - chapter: Chapter 10 — The road home
  - section: The terms
    learn: 'a document read aloud (bookish register): ī oppandavannu … naḍuve māḍikoḷḷalāgide, pāvatisatakkaddu, kantugaḷalli, mundāgi tiḷisatakkaddu · amounts: mūru lakṣa svīkarisalāgide, aidu lakṣa, ippattu kantu, aivattu sāvirada kantu · Naveen''s terms: baḍḍi bēḍa, baḍḍi badalu ondu kelasa · Arjun''s pivot: phauṇḍar āgiddavanu naukarige hōgōdā? — ahaṃ biṭṭu oppikoḷtīni'
  - scene: Wednesday, 9 December 2026, six in the morning. The homestay veranda. Bags by the steps, coffee in steel tumblers. Kaveri has her phone in one hand and her reading glasses in the other.
  - who: kaveri
    t: ರಾತ್ರಿ ಒಂದು ಗಂಟೆವರೆಗೆ ಕೂತು ಮುಖ್ಯ ಅಂಶಗಳನ್ನ ಬರೆದೆ. ಪೂರ್ತಿ ಡ್ರಾಫ್ಟ್ ಶುಕ್ರವಾರ. ಈಗ ಓದ್ತೀನಿ, ಇಬ್ಬರೂ ಕೇಳಿ. ಯಾವುದಾದ್ರೂ ತಪ್ಪಿದ್ರೆ ಈಗಲೇ ಹೇಳಿ, ಆಮೇಲೆ ಅಲ್ಲ.
    tr: Rātri ondu gaṇṭevarege kūtu mukhya aṃśagaḷanna barede. Pūrti ḍrāphṭ Śukravāra. Īga ōdtīni, ibbarū kēḷi. Yāvudādrū tappidre īgalē hēḷi, āmēle alla.
    en: I sat up till one last night and wrote down the main points. The full draft on Friday. I'll read it now — both of you listen. If anything's wrong, say so now, not later.
  - who: kaveri
    t: ‘ಈ ಒಪ್ಪಂದವನ್ನು ನವೀನ್ ಶೆಟ್ಟಿ, ಉಡುಪಿ, ಮತ್ತು ಅರ್ಜುನ್ ರಾವ್, ಬೆಂಗಳೂರು, ಇವರ ನಡುವೆ ಮಾಡಿಕೊಳ್ಳಲಾಗಿದೆ. ಒಟ್ಟು ಸಾಲದ ಮೊತ್ತ ಎಂಟು ಲಕ್ಷ ರೂಪಾಯಿಗಳು. ಇದರಲ್ಲಿ ಮೂರು ಲಕ್ಷ ರೂಪಾಯಿಗಳನ್ನು ಡಿಸೆಂಬರ್ ಏಳರಂದು ಸ್ವೀಕರಿಸಲಾಗಿದೆ.’
    tr: ‘Ī oppandavannu Navīn Śeṭṭi, Uḍupi, mattu Arjun Rāv, Beṅgaḷūru, ivara naḍuve māḍikoḷḷalāgide. Oṭṭu sālada motta eṇṭu lakṣa rūpāyigaḷu. Idaralli mūru lakṣa rūpāyigaḷannu Ḍisembar ēḷarandu svīkarisalāgide.’
    en: '''This agreement is made between Naveen Shetty of Udupi and Arjun Rao of Bengaluru. The total amount of the loan is eight lakh rupees. Of this, three lakh rupees were received on the seventh of December.'''
  - who: kaveri
    t: ‘ಉಳಿದ ಐದು ಲಕ್ಷ ರೂಪಾಯಿಗಳನ್ನು ಎರಡನೇ ಪಕ್ಷದವರು ಹತ್ತು ಕಂತುಗಳಲ್ಲಿ, ತಿಂಗಳಿಗೆ ಐವತ್ತು ಸಾವಿರದಂತೆ, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೇಳರ ಫೆಬ್ರವರಿ ಹತ್ತರಿಂದ ಪಾವತಿಸತಕ್ಕದ್ದು. ಯಾವುದೇ ಕಂತು ತಡವಾಗುವುದಾದರೆ, ಅದನ್ನು ಗಡುವಿಗೆ ಮುಂಚಿತವಾಗಿ ಮೊದಲನೇ ಪಕ್ಷದವರಿಗೆ ತಿಳಿಸತಕ್ಕದ್ದು.’
    tr: ‘Uḷida aidu lakṣa rūpāyigaḷannu eraḍanē pakṣadavaru hattu kantugaḷalli, tiṅgaḷige aivattu sāviradante, eraḍu sāvirada ippattēḷara Phebravari hattarinda pāvatisatakkaddu. Yāvudē kantu taḍavāguvudādare, adannu gaḍuvige muñcitavāgi modalanē pakṣadavarige tiḷisatakkaddu.’
    en: '''The remaining five lakh rupees shall be paid by the second party in ten instalments of fifty thousand a month, from the tenth of February 2027. If any instalment is to be delayed, the first party shall be informed of it before the due date.'''
  - who: ramya
    t: ಕಾವೇರಿ, ನೀನು ಹೀಗೆ ಓದ್ತಿದ್ರೆ ಆಲ್ ಇಂಡಿಯಾ ರೇಡಿಯೋ ನ್ಯೂಸ್ ಕೇಳಿದ ಹಾಗಿದೆ. ‘ಪಾವತಿಸತಕ್ಕದ್ದು’!
    tr: Kāvēri, nīnu hīge ōdtidre Āl Iṇḍiyā Rēḍiyō nyūs kēḷida hāgide. ‘Pāvatisatakkaddu’!
    en: Kaveri, when you read like that it sounds like All India Radio news. 'Shall be paid'!
  - who: kaveri
    t: ಕಾಗದದ ಕನ್ನಡ ಹೀಗೇ ಇರಬೇಕು, ರಮ್ಯಾ. ಮಾತಿನ ಕನ್ನಡ ಮನಸ್ಸಿಗೆ, ಕಾಗದದ ಕನ್ನಡ ಕೋರ್ಟಿಗೆ. ನವೀನ್, ನಿನ್ನ ಕಂಡೀಶನ್ ಏನಾದ್ರೂ ಸೇರಿಸ್ಬೇಕಾ?
    tr: Kāgadada kannaḍa hīgē irabēku, Ramyā. Mātina kannaḍa manassige, kāgadada kannaḍa kōrṭige. Navīn, ninna kaṇḍīśan ēnādrū sērisbēkā?
    en: Kannada on paper has to be like this, Ramya. Spoken Kannada is for the heart; paper Kannada is for the court. Naveen, do you want to add any condition of yours?
  - who: naveen
    t: 'ಎರಡು. ಒಂದು: ಬಡ್ಡಿ ಬೇಡ. ಬಡ್ಡಿ ಬದಲು ಒಂದು ಕೆಲಸ — ಮಾರ್ಚ್‌ನಲ್ಲಿ ನಮ್ಮ ಹೋಟೆಲ್ ರಿನೋವೇಷನ್ ಆಗುವಾಗ ಅರ್ಜುನ್ ಒಂದು ವಾರ ಉಡುಪಿಗೆ ಬಂದು ಬುಕ್ಕಿಂಗ್ ಸಾಫ್ಟ್‌ವೇರ್ ಮಾಡಿಕೊಡಬೇಕು. ಫೀಸ್ ಇಲ್ಲದೆ. ಊಟ ಫ್ರೀ ಉಂಟು.'
    tr: 'Eraḍu. Ondu: baḍḍi bēḍa. Baḍḍi badalu ondu kelasa — Mārc-nalli namma hōṭel rinōvēṣan āguvāga Arjun ondu vāra Uḍupige bandu bukkiṅg sāphṭvēr māḍikoḍabēku. Phīs illade. Ūṭa phrī uṇṭu.'
    en: 'Two. One: no interest. Instead of interest, a job — in March, when our hotel is being renovated, Arjun comes to Udupi for a week and builds us booking software. Free of charge. The meals are free.'
  - who: naveen
    t: 'ಎರಡು: ನನ್ನ ಲಾಯರ್‌ಗೆ ಇವತ್ತೇ ಫೋನ್ ಮಾಡಿ ‘ಆ ನೋಟಿಸ್ ಫೈಲ್ ಮುಚ್ಚಿ’ ಅಂತ ಹೇಳ್ತೇನೆ. ಆ ಕಾಗದ ನನ್ನ ಡ್ರಾಯರ್‌ನಲ್ಲಿ ಇರುವುದು ಬೇಡ. ದೋಸ್ತಿ ಮೇಲೆ ನೋಟಿಸ್ ಇಟ್ಟುಕೊಂಡು ಬದುಕುವುದು ಬೇಡ.'
    tr: 'Eraḍu: nanna lāyar-ge ivattē phōn māḍi ‘ā nōṭis phail mucci’ anta hēḷtēne. Ā kāgada nanna ḍrāyar-nalli iruvudu bēḍa. Dōsti mēle nōṭis iṭṭukoṇḍu badukuvudu bēḍa.'
    en: 'Two: today I''ll phone my lawyer and tell him, ''Close that notice file.'' I don''t want that paper in my drawer. I don''t want to live with a notice hanging over a friendship.'
  - who: kaveri
    t: 'ಅದು ನಿನ್ನ ತೀರ್ಮಾನ, ನವೀನ್, ಮತ್ತೆ ಅದು ದೊಡ್ಡ ಮನಸ್ಸು. ಆದ್ರೆ ವಕೀಲೆಯಾಗಿ ಹೇಳ್ತೀನಿ: ನೋಟಿಸ್ ಕಳಿಸದಿದ್ರೂ ಸಾಲ ಸಾಲವೇ, ಅದನ್ನ ವಸೂಲು ಮಾಡೋ ಹಕ್ಕು ನಿನಗೆ ಇರುತ್ತೆ. ಈ ಒಪ್ಪಂದ ಅದಕ್ಕೇ.'
    tr: 'Adu ninna tīrmāna, Navīn, matte adu doḍḍa manassu. Ādre vakīleyāgi hēḷtīni: nōṭis kaḷisadidrū sāla sālavē, adanna vasūlu māḍō hakku ninage irutte. Ī oppanda adakkē.'
    en: 'That''s your decision, Naveen, and it''s big-hearted. But as a lawyer I''ll say this: even without the notice, a loan is still a loan, and you keep the right to recover it. That''s what this agreement is for.'
  - who: arjun
    t: ಎಲ್ಲಾ ಒಪ್ಪಿಗೆ. ಮತ್ತೆ ನನ್ನ ಕಡೆಯಿಂದ ಒಂದು. ಇನ್‌ಸ್ಟಾಲ್‌ಮೆಂಟ್ ಎಲ್ಲಿಂದ ಬರುತ್ತೆ ಅಂತ ನೀವು ಕೇಳಿಲ್ಲ, ನಾನೇ ಹೇಳ್ತೀನಿ. ಒಂದು ಜಿಸಿಸಿಯಿಂದ ಎರಡು ವಾರದ ಹಿಂದೆ ಆಫರ್ ಬಂದಿತ್ತು. ಇಂಜಿನಿಯರಿಂಗ್ ಮ್ಯಾನೇಜರ್. ಉತ್ತರ ಕೊಟ್ಟಿರಲಿಲ್ಲ.
    tr: Ellā oppige. Matte nanna kaḍeyinda ondu. In-sṭāl-meṇṭ ellinda barutte anta nīvu kēḷilla, nānē hēḷtīni. Ondu ji-si-siyinda eraḍu vārada hinde āphar bandittu. Iñjiniyariṅg myānējar. Uttara koṭṭiralilla.
    en: I agree to everything. And one thing from my side. You haven't asked where the instalments will come from, so I'll tell you. Two weeks ago I got an offer from a GCC. Engineering manager. I hadn't replied.
  - who: shruti
    t: ಯಾಕೆ? ಎರಡು ವಾರ? ಅಂಥ ಆಫರ್ ಸಿಗೋದು ಈಗ ಸುಲಭನಾ?
    tr: Yāke? Eraḍu vāra? Antha āphar sigōdu īga sulabhanā?
    en: Why? Two weeks? Is an offer like that easy to come by these days?
  - who: arjun
    t: ಅಹಂ. ‘ಫೌಂಡರ್ ಆಗಿದ್ದವನು ಮತ್ತೆ ನೌಕರಿಗೆ ಹೋಗೋದಾ?’ ಅನ್ನೋ ಅಹಂ. ಇದೇ ನನ್ನ ನಿಜವಾದ ಪಿವೋಟ್ — ಪ್ರಾಡಕ್ಟ್ ಅಲ್ಲ, ತಲೆ. ಇವತ್ತು ಬೆಳಿಗ್ಗೆ ಏಳು ಗಂಟೆಗೆ ‘ಒಪ್ಪಿಕೊಳ್ತೀನಿ’ ಅಂತ ಮೇಲ್ ಕಳಿಸಿದೆ. ಜನವರಿ ಹದಿನೈದರಿಂದ ಕೆಲಸ.
    tr: Ahaṃ. ‘Phauṇḍar āgiddavanu matte naukarige hōgōdā?’ annō ahaṃ. Idē nanna nijavāda pivōṭ — prāḍakṭ alla, tale. Ivattu beḷigge ēḷu gaṇṭege ‘oppikoḷtīni’ anta mēl kaḷiside. Janavari hadinaidarinda kelasa.
    en: Ego. The ego that says, 'A former founder going back to a salaried job?' That's my real pivot — not the product, my head. At seven this morning I sent an email saying 'I accept'. I start on 15 January.
  - who: naveen
    t: ಸಾಕು, ಇನ್ನು ಸಹಿ ಮಾತ್ರ ಬಾಕಿ. ಉಳಿದದ್ದು ಎಲ್ಲಾ ಮುಗೀತು. ಹೊರಡುವ, ಬೆಂಗಳೂರು ದೂರ ಉಂಟು.
    tr: Sāku, innu sahi mātra bāki. Uḷidaddu ellā mugītu. Horaḍuva, Beṅgaḷūru dūra uṇṭu.
    en: Enough — only the signatures are left. Everything else is done. Let's go, Bengaluru is a long way off.
  - who: host
    t: ಹೋಗಿ ಬನ್ನಿ ಮಾರಾಯ್ರೆ. ರಮ್ಯಾ, ಎಪಿಸೋಡ್ ಮರೀಬೇಡಿ — ಕುಂದಾಪ್ರದವರು ಮಾತು ಕೊಟ್ರೆ ಮುಗೀತು.
    tr: Hōgi banni mārāyre. Ramyā, epiśōḍ marībēḍi — Kundāpradavaru mātu koṭre mugītu.
    en: Go well and come again. Ramya, don't forget the episode — once a Kundapura person gives their word, that's that.
  - who: ramya
    t: ಮರೆಯುದಿಲ್ಲ ಅಣ್ಣ. ಜನವರಿಯಲ್ಲಿ ಕ್ಯಾಮೆರಾ ಹಿಡ್ಕೊಂಡು ಬತ್ತೆ. ಹೋಯ್ ಬತ್ತೆ!
    tr: Mareyudilla aṇṇa. Janavariyalli kyāmerā hiḍkoṇḍu batte. Hōy batte!
    en: I won't forget, Anna. I'll come with the camera in January. Hoy batte!
  - section: Goodbye at Hubballi
    learn: 'bus-stand words: plāṭphārm, slīpar bas, sīṭ nambar, horaḍōdu · Hubballi snacks: mirci, girmiṭ, ‘mirci-girmiṭ’ kāmbō · leave approved: rajā mañjūrātu · uncertain news: noṭiphikēśan baratada anta suddi, khacita illa · North Karnataka goodbyes: hōgi barri, matte sigōṇa, kāl māḍtiru'
  - scene: Half past ten. Hubballi, the bus stand. Imran's sleeper bus to Kalaburagi leaves at eleven; Prakash will take a local bus to Dharwad. At a stall outside, a man fries mirchi in a giant kadai.
  - who: prakash
    t: 'ಕೊನೇ ಸಲ ಎಲ್ಲಾರಿಗೂ ನನ್ ಕಡೆಯಿಂದ: ಹುಬ್ಬಳ್ಳಿ ಮಿರ್ಚಿ, ಗಿರ್ಮಿಟ್. ‘ಮಿರ್ಚಿ-ಗಿರ್ಮಿಟ್’ ತಿನ್ನದೆ ಉತ್ತರ ಕರ್ನಾಟಕ ಬಿಟ್ರ ಟ್ರಿಪ್ ಪೂರ್ತಿ ಆಗಂಗಿಲ್ಲ.'
    tr: 'Konē sala ellārigū nan kaḍeyinda: Hubbaḷḷi mirci, girmiṭ. ‘Mirci-girmiṭ’ tinnade uttara Karnāṭaka biṭra ṭrip pūrti āgaṅgilla.'
    en: 'One last treat for everyone, from me: Hubballi mirchi and girmit. If you leave North Karnataka without eating ''mirchi-girmit'', the trip isn''t complete.'
  - scene: Imran's phone pings. He reads the message twice, then holds it up for everyone.
  - who: imran
    t: 'ರಜಾ ಮಂಜೂರಾತು! ಹದಿನೈದು ದಿನ, ಡಿಸೆಂಬರ್ ಹದಿನಾಲ್ಕರಿಂದ. ಜಿಲ್ಲಾ ಸರ್ಜನ್ ಸಾಹೇಬ್ರು ಕೆಳಗ ಒಂದು ಸಾಲು ಬರೆದಾರ: ‘ಟೇಕ್ ಕೇರ್, ಡಾಕ್ಟರ್.’ ಆರು ವರ್ಷದಾಗ ಮೊದಲ ಸಲ.'
    tr: 'Rajā mañjūrātu! Hadinaidu dina, Ḍisembar hadinālkarinda. Jillā sarjan sāhēbru keḷaga ondu sālu baredāra: ‘Ṭēk kēr, ḍākṭar.’ Āru varṣadāga modala sala.'
    en: 'Leave approved! Fifteen days, from 14 December. The district surgeon has written one line at the bottom: ''Take care, doctor.'' The first time in six years.'
  - who: deepa
    t: ಇಮ್ರಾನ್! ನೋಡು, ಕೇಳಿದ್ರೆ ಸಿಗುತ್ತೆ. ಈ ಹದಿನೈದು ದಿನ ವಾರ್ಡ್‌ನಿಂದ ಫೋನ್ ಬಂದ್ರೆ?
    tr: Imrān! Nōḍu, kēḷidre sigutte. Ī hadinaidu dina vārḍ-ninda phōn bandre?
    en: Imran! See — if you ask, you get it. And if the ward calls during these fifteen days?
  - who: imran
    t: ಎತ್ತಂಗಿಲ್ಲ. ಡ್ಯೂಟಿ ಡಾಕ್ಟರ್ ನಂಬರ್ ಸಿಸ್ಟರ್‌ಗೆ ಕೊಟ್ಟೀನಿ. ನಾ ಅಮ್ಮಿ ಮನಿಯಾಗ ಜೋಳದ ರೊಟ್ಟಿ ತಿಂದು ಮಲಕೋತೇನಿ. ಮತ್ತ ಆರು ತಿಂಗಳ ಮ್ಯಾಲೆ ಒಂದು ಕ್ರಿಕೆಟ್ ಮ್ಯಾಚ್ ನೋಡತೇನಿ.
    tr: Ettaṅgilla. Ḍyūṭi ḍākṭar nambar sisṭar-ge koṭṭīni. Nā ammi maniyāga jōḷada roṭṭi tindu malakōtēni. Matta āru tiṅgaḷa myāle ondu krikeṭ myāc nōḍatēni.
    en: I won't answer. I've given the sister the duty doctor's number. I'll eat jowar rotti at my Ammi's house and sleep. And for the first time in six months I'll watch a cricket match.
  - who: kaveri
    t: ಪ್ರಕಾಶ್, ಕೆಎಎಸ್ ಹೊಸ ನೋಟಿಫಿಕೇಶನ್ ಯಾವಾಗ?
    tr: Prakāś, ke-e-es hosa nōṭiphikēśan yāvāga?
    en: Prakash, when is the new KAS notification?
  - who: prakash
    t: ಮುಂದಿನ ವರ್ಷ ಬರತೈತಿ ಅಂತ ಸುದ್ದಿ ಐತಿ, ಆದ್ರ ಖಚಿತ ಇಲ್ಲ. ಕೆಪಿಎಸ್ಸಿ ಕತಿ ನಿಮಗ ಗೊತ್ತಲ್ಲ — ಬರೂತನಕ ನಂಬಬಾರದು. ಆದ್ರ ಓದೂದು ನೋಟಿಫಿಕೇಶನ್‌ಗೆ ಕಾಯಬೇಕಿಲ್ಲ. ಇವತ್ತು ರಾತ್ರಿನೇ ಶುರು.
    tr: Mundina varṣa barataiti anta suddi aiti, ādra khacita illa. Ke-pi-es-si kati nimaga gottalla — barūtanaka nambabāradu. Ādra ōdūdu nōṭiphikēśan-ge kāyabēkilla. Ivattu rātrinē śuru.
    en: There's talk it'll come next year, but nothing's certain. You know the KPSC story — don't believe it until it arrives. But studying doesn't have to wait for the notification. I start tonight.
  - who: ramya
    t: ಮಾಕ್ ಬೋರ್ಡ್‌ನಲ್ಲಿ ನಾನೂ ಇರ್ತೀನಿ. ಹನ್ನೆರಡು ವರ್ಷ ಜನರನ್ನ ಕಠಿಣ ಪ್ರಶ್ನೆ ಕೇಳಿದೀನಿ — ಈ ಸಲ ಒಂದು ಒಳ್ಳೆ ಕೆಲಸಕ್ಕೆ.
    tr: Mōk bōrḍ-nalli nānū irtīni. Hanneraḍu varṣa janaranna kaṭhiṇa praśne kēḷidīni — ī sala ondu oḷḷe kelasakke.
    en: I'll be on the mock board too. I've spent twelve years asking people tough questions — this time it'll be for a good cause.
  - who: arjun
    t: 'ಮೊದಲ ಮಾಕ್ ಇಂಟರ್‌ವ್ಯೂ: ಜನವರಿ ಮೂರು, ಭಾನುವಾರ, ಸಪ್ತಾಪುರದಲ್ಲಿ. ನಾನು ಬರ್ತೀನಿ. ಅಮ್ಮಂಗೆ ಹೇಳು, ಎಣ್ಣಗಾಯಿ ಬೇಕು ಅಂತ.'
    tr: 'Modala mōk iṇṭarvyū: Janavari mūru, Bhānuvāra, Saptāpuradalli. Nānu bartīni. Ammaṅge hēḷu, eṇṇagāyi bēku anta.'
    en: 'The first mock interview: Sunday, 3 January, in Saptapur. I''ll come. Tell Amma I want stuffed brinjal.'
  - who: prakash
    t: ಎಣ್ಣಗಾಯಿ ಸಿಗತೈತಿ, ಆದ್ರ ಮೊದಲು ಪ್ರಶ್ನೆ ಕೇಳಬೇಕು — ಧಾರವಾಡ ಕನ್ನಡದಾಗ. ಒಂದು ‘ಇದೆ’ ಅಂದ್ರ ಒಂದು ಎಣ್ಣಗಾಯಿ ಕಟ್.
    tr: Eṇṇagāyi sigataiti, ādra modalu praśne kēḷabēku — Dhāravāḍa kannaḍadāga. Ondu ‘ide’ andra ondu eṇṇagāyi kaṭ.
    en: You'll get your stuffed brinjal, but first you ask the questions — in Dharwad Kannada. Every time you say 'ide', one brinjal gets cut.
  - who: prakash
    t: ಲೇ ಅರ್ಜುನಾ, ಮೂರನೇ ತಾರೀಖು ಮರೀಬ್ಯಾಡ. ತಡ ಮಾಡಿದ್ರ ಅವ್ವ ಒನಕಿ ಹಿಡ್ಕೊಂಡು ಬಾಗಿಲಾಗ ನಿಂತಿರ್ತಾಳ.
    tr: Lē Arjunā, mūranē tārīkhu marībyāḍa. Taḍa māḍidra avva onaki hiḍkoṇḍu bāgilāga nintirtāḷa.
    en: Le, Arjuna, don't forget the third. If you're late, Avva will be waiting at the door with a pestle.
  - who: imran
    t: 'ಕೇಳಿದ್ರೇನು? ‘ಲೇ ಅರ್ಜುನಾ’ ವಾಪಸ್ ಬಂತು! ಡಿಸ್ಚಾರ್ಜ್ ಸಮರಿ: ಪೇಷಂಟ್ ಪೂರ್ತಿ ಗುಣ ಆಗ್ಯಾನ.'
    tr: 'Kēḷidrēnu? ‘Lē Arjunā’ vāpas bantu! Ḍiscārj samari: pēṣaṇṭ pūrti guṇa āgyāna.'
    en: 'Did you hear that? ‘Le, Arjuna’ is back! Discharge summary: the patient has fully recovered.'
  - who: arjun
    t: ಹೌದು ಡಾಕ್ಟ್ರೇ. ಐದು ದಿನದ ‘ಅವರೇ’ ಟ್ರೀಟ್‌ಮೆಂಟ್ ಸಾಕಾಯ್ತು. ಇನ್ನೊಂದು ದಿನ ಇದ್ರೆ ನಾನೇ ಅಡ್ಮಿಟ್ ಆಗ್ತಿದ್ದೆ.
    tr: Haudu Ḍākṭrē. Aidu dinada ‘avarē’ ṭrīṭmeṇṭ sākāytu. Innondu dina idre nānē aḍmiṭ āgtidde.
    en: Yes, Doctor. Five days of ‘avare’ treatment was plenty. One more day and I'd have had to be admitted myself.
  - scene: The bus conductor shouts 'Kalaburagi!' Imran picks up his bag. They stand in a clumsy circle on the platform.
  - who: imran
    t: ಸರಿ ಯಪ್ಪಾ, ಹೋಗಿ ಬರ್ತೇನಿ. ‘ಹೋಗ್ತೇನಿ’ ಅನ್ನಂಗಿಲ್ಲ, ಅವ್ವ ಹೇಳ್ಯಾರ. ಫೋನ್ ಮಾಡ್ತಿರ್ರಿ. ಮತ್ತ ಯಾರಿಗರೆ ನಿದ್ದಿ ಬರಲಿಲ್ಲಂದ್ರ — ರಾತ್ರಿ ಮೂರು ಗಂಟೆ ಆದ್ರೂ ಸೈ, ನನಗ ಕಾಲ್ ಮಾಡ್ರಿ. ಈ ಸಲ ಡಾಕ್ಟರ್ ಆಗಿ ಅಲ್ಲ, ದೋಸ್ತ ಆಗಿ ಎತ್ತತೇನಿ.
    tr: Sari yappā, hōgi bartēni. ‘Hōgtēni’ annaṅgilla, avva hēḷyāra. Phōn māḍtirri. Matta yārigare niddi baralillandra — rātri mūru gaṇṭe ādrū sai, nanaga kāl māḍri. Ī sala ḍākṭar āgi alla, dōsta āgi ettatēni.
    en: All right, folks, I'll go and come back. I'm not allowed to say 'I'm going' — Avva said so. Keep calling. And if anyone can't sleep — even at three in the morning, fine, call me. This time I'll answer not as a doctor, but as a friend.
  - who: prakash
    t: ಹೋಗಿ ಬಾರಪಾ ಡಾಕ್ಟ್ರೇ. ನಿನ್ನ ನೀ ನೋಡ್ಕೋ — ಅವ್ವನ ಆರ್ಡರ್.
    tr: Hōgi bārapā ḍākṭrē. Ninna nī nōḍkō — avvana ārḍar.
    en: Go and come back, Doctor. Look after yourself — Avva's orders.
  - section: The last stretch
    learn: 'planning a hard conversation: ṭīm-ge hēge hēḷōdu, mukha nōḍi, Zūm alla · rehearsing: ondu sala nanna munde hēḷu · dignity at work: yārannū ‘lē-āph’ anta kareyalla, prati obbarigū rephareṇs · an invitation home: aiyn mane, Koḍagu, Huttari / Puttari, pandi kari · counting the trip: nālku dina, sāvirada nūru kilōmīṭar'
  - scene: Noon. NH-48 south of Hubballi, Arjun's car. Shruti drives; Arjun sits beside her with a notebook. Deepa and Kaveri are in the back. Naveen's car, with Ramya, follows.
  - who: shruti
    t: ಏನ್ ಬರೀತಿದೀಯಾ? ಅರ್ಧ ಗಂಟೆಯಿಂದ ಪೆನ್ ಕಚ್ತಿದೀಯಾ.
    tr: Ēn barītidīyā? Ardha gaṇṭeyinda pen kactidīyā.
    en: What are you writing? You've been chewing that pen for half an hour.
  - who: arjun
    t: ಟೀಮ್‌ಗೆ ಏನು ಹೇಳೋದು ಅಂತ. ಇಪ್ಪತ್ತಮೂರು ಜನ. ಮೊದಲು ‘ಎಲ್ಲರಿಗೂ ಜೂಮ್ ಕಾಲ್’ ಅಂತ ಯೋಚಿಸಿದ್ದೆ. ಬೇಡ. ಹದಿನೈದು ನಿಮಿಷದ ಜೂಮ್ ಕಾಲಲ್ಲಿ ಕೆಲಸ ಕಳ್ಕೊಂಡ ನೋವು ನನಗೆ ನನ್ ಫ್ರೆಂಡ್ಸ್‌ನಿಂದ ಗೊತ್ತು. ಶುಕ್ರವಾರ ಆಫೀಸಲ್ಲಿ, ಎಲ್ಲರ ಮುಖ ನೋಡಿ.
    tr: Ṭīm-ge ēnu hēḷōdu anta. Ippattamūru jana. Modalu ‘ellarigū Zūm kāl’ anta yōcisidde. Bēḍa. Hadinaidu nimiṣada Zūm kālalli kelasa kaḷkoṇḍa nōvu nanage nan phreṇḍs-ninda gottu. Śukravāra āphīsalli, ellara mukha nōḍi.
    en: What to tell the team. Twenty-three people. At first I thought of a Zoom call for everyone. No. I know from my own friends what it's like to lose a job on a fifteen-minute Zoom call. On Friday, in the office, looking everyone in the face.
  - who: kaveri
    t: ಒಂದು ಸಲ ನಮ್ಮ ಮುಂದೆ ಹೇಳು. ರಿಹರ್ಸಲ್. ನಾವು ಮೂವರೂ ನಿನ್ನ ಟೀಮ್ ಅಂತ ಅಂದ್ಕೋ.
    tr: Ondu sala namma munde hēḷu. Riharsal. Nāvu mūvarū ninna ṭīm anta andkō.
    en: Say it in front of us once. A rehearsal. Imagine the three of us are your team.
  - who: arjun
    t: ಸರಿ… ‘ಎಲ್ಲರಿಗೂ ನಮಸ್ಕಾರ. ನಾನು ನಿಮಗೆ ಮೂರು ತಿಂಗಳ ಹಿಂದೆಯೇ ಹೇಳಬೇಕಿದ್ದ ವಿಷಯ ಇವತ್ತು ಹೇಳ್ತಿದೀನಿ. ಕಂಪನಿ ಡಿಸೆಂಬರ್ ಮೂವತ್ತೊಂದಕ್ಕೆ ಮುಚ್ಚುತ್ತೆ. ತಪ್ಪು ನಿಮ್ಮದಲ್ಲ, ನನ್ನದು. ಡಿಸೆಂಬರ್ ಸಂಬಳ ಪೂರ್ತಿ ಬರುತ್ತೆ, ಜೊತೆಗೆ ಎರಡು ತಿಂಗಳ ಸೆವರೆನ್ಸ್. ನಿಮ್ಮಲ್ಲಿ ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಕೆಲಸ ಸಿಗೋವರೆಗೆ ನಾನು ರೆಫರೆನ್ಸ್ ಕಾಲ್ ತಗೋತೀನಿ.’
    tr: Sari… ‘Ellarigū namaskāra. Nānu nimage mūru tiṅgaḷa hindeyē hēḷabēkidda viṣaya ivattu hēḷtidīni. Kampani Ḍisembar mūvattondakke muccutte. Tappu nimmadalla, nannadu. Ḍisembar saṃbaḷa pūrti barutte, jotege eraḍu tiṅgaḷa sevarens. Nimmalli pratiyobbarigū kelasa sigōvarege nānu rephareṇs kāl tagōtīni.’
    en: OK… 'Namaskara, everyone. Today I'm telling you something I should have told you three months ago. The company closes on 31 December. The fault isn't yours, it's mine. December's salary will be paid in full, plus two months' severance. Until every one of you finds a job, I'll take the reference calls myself.'
  - who: deepa
    t: 'ಚೆನ್ನಾಗಿದೆ. ಒಂದು ವಿಷಯ ಸೇರಿಸು: ‘ನಿಮ್ಮ ಜೊತೆ ಕೆಲಸ ಮಾಡಿದ್ದು ನನ್ನ ಹೆಮ್ಮೆ.’ ಕೆಲಸ ಹೋಗುವವರಿಗೆ ದುಡ್ಡಿನಷ್ಟೇ ಆ ಮಾತು ಬೇಕು. ಟೆಕ್‌ನಲ್ಲಿ ಹನ್ನೆರಡು ವರ್ಷ ಇದ್ದೀನಿ, ಎರಡೂ ಕಡೆ ನಿಂತಿದೀನಿ.'
    tr: 'Cennāgide. Ondu viṣaya sērisu: ‘nimma jote kelasa māḍiddu nanna hemme.’ Kelasa hōguvavarige duḍḍinaṣṭē ā mātu bēku. Ṭek-nalli hanneraḍu varṣa iddīni, eraḍū kaḍe nintidīni.'
    en: 'It''s good. Add one thing: ''Working with you has been my pride.'' People losing their jobs need those words as much as the money. I''ve been in tech for twelve years; I''ve stood on both sides.'
  - who: arjun
    t: ಸೇರಿಸ್ತೀನಿ. ಮತ್ತೆ ‘ಲೇಆಫ್’ ಅನ್ನೋ ಪದ ಬಳಸಲ್ಲ. ಅವರು ಸಂಖ್ಯೆ ಅಲ್ಲ, ಜನ.
    tr: Sēristīni. Matte ‘lē-āph’ annō pada baḷasalla. Avaru saṅkhye alla, jana.
    en: I'll add it. And I won't use the word 'layoff'. They're not numbers, they're people.
  - who: kaveri
    t: ಒಂದು ವಿಷಯ ಹೇಳಲಾ? ನಾವು ಎಲ್ಲರೂ ಕೊಡಗಿನ ಊರು ನೋಡೇ ಇಲ್ಲ. ಮುಂದಿನ ಹುತ್ತರಿಗೆ ನಮ್ಮ ಐನ್ ಮನೆಗೆ ಬನ್ನಿ. ಭತ್ತದ ಮೊದಲ ತೆನೆ ಕೊಯ್ಯೋ ಹಬ್ಬ. ಅಮ್ಮ ಪಂದಿ ಕರಿ, ಕಡಂಬುಟ್ಟು ಮಾಡ್ತಾರೆ. ಪ್ರಕಾಶ್‌ಗೆ ಬೇರೆ ಅಡುಗೆ.
    tr: Ondu viṣaya hēḷalā? Nāvu ellarū Koḍagina ūru nōḍē illa. Mundina Huttarige namma ain manege banni. Bhattada modala tene koyyō habba. Amma pandi kari, kaḍambuṭṭu māḍtāre. Prakāś-ge bēre aḍuge.
    en: Can I say something? None of you has ever seen my home in Kodagu. Come to our ancestral house for the next Huttari. It's the festival of cutting the first sheaf of paddy. Amma makes pork curry and kadambuttu. Separate cooking for Prakash.
  - who: shruti
    t: ಡನ್. ಹಂಪಿ, ಧಾರವಾಡ, ಗೋಕರ್ಣ ಆಯ್ತು. ಮುಂದಿನ ವರ್ಷ ಕೊಡಗು. ಅರ್ಜುನ್, ಈ ಸಲ ಪ್ಲಾನ್ ಕಾವೇರಿದು. ನೀನು ಬರೀ ಡ್ರೈವರ್.
    tr: Ḍan. Hampi, Dhāravāḍa, Gōkarṇa āytu. Mundina varṣa Koḍagu. Arjun, ī sala plān Kāvēridu. Nīnu barī ḍraivar.
    en: Done. Hampi, Dharwad, Gokarna — done. Next year, Kodagu. Arjun, this time the plan is Kaveri's. You're just the driver.
  - who: arjun
    t: ಸಂತೋಷದಿಂದ. ಡ್ರೈವರ್ ಆಗೋದು ಸುಲಭ — ಯಾರು ಎಲ್ಲಿ ಹೋಗ್ಬೇಕು ಅಂತ ತೀರ್ಮಾನ ಮಾಡೋದು ಬೇರೆಯವರು.
    tr: Santōṣadinda. Ḍraivar āgōdu sulabha — yāru elli hōgbēku anta tīrmāna māḍōdu bēreyavaru.
    en: Happily. Being the driver is easy — someone else decides where everyone goes.
  - section: Renaming the group
    learn: 'group-chat Kanglish: grūp hesaru badalāysu, aḍmin, ḍisk-ripṣan, pin māḍu · voting: yārige yāvudu? kai etti, ondu vōṭ · callbacks: saṇṇa uri, mundūḍalāgide, uṇṭu-aiti-ide · Davanagere''s benne dose on the way'
  - scene: Two in the afternoon. NH-48, past Haveri. The two cars, six people now, stop at Davanagere for benne dose. Imran and Prakash join on a video call. Over the plates, Shruti takes out her phone.
  - who: ramya
    t: ಮೊದಲ ದಿನ ಕ್ಯಾತಸಂದ್ರದ ಪ್ರಾಮಿಸ್ ನೆನಪಿದ್ಯಾ? ‘ಬೆಣ್ಣೆ ದೋಸೆ ಬಾಕಿ ಇದೆ, ಬಡ್ಡಿ ಸಮೇತ.’ ಡಾಕ್ಟ್ರು ಇಲ್ಲಿಲ್ಲ, ಪ್ರಕಾಶ್ ಇಲ್ಲ, ಆದ್ರೂ ವಿಡಿಯೋ ಕಾಲಲ್ಲಿ ಇದಾರೆ. ಪ್ರಾಮಿಸ್ ಪೂರ್ತಿ!
    tr: Modala dina Kyātasandrada prāmis nenapidyā? ‘Beṇṇe dōse bāki ide, baḍḍi samēta.’ Ḍākṭru illilla, Prakāś illa, ādrū viḍiyō kālalli idāre. Prāmis pūrti!
    en: Remember the promise at Kyathsandra on the first day? 'Benne dose outstanding, with interest.' The doctor isn't here, nor Prakash, but they're both on the video call. Promise kept!
  - who: arjun
    t: ಹದಿನಾರು ವರ್ಷದಲ್ಲಿ ನಾವು ಉಳಿಸಿಕೊಂಡ ಮೊದಲ ಪ್ರಾಮಿಸ್ ಇದೇ ಅನ್ಸುತ್ತೆ. ಬೆಣ್ಣೆ ಜಾಸ್ತಿ ಹಾಕಿ ಅಣ್ಣ!
    tr: Hadināru varṣadalli nāvu uḷisikoṇḍa modala prāmis idē ansutte. Beṇṇe jāsti hāki aṇṇa!
    en: I think that's the first promise we've kept in sixteen years. Extra butter, Anna!
  - who: shruti
    t: ಒಂದು ಕೆಲಸ ಬಾಕಿ ಇದೆ. ಗ್ರೂಪ್‌ಗೆ ಹೊಸ ಹೆಸರು. ಹಳೇ ಹೆಸರು ಎರಡು ಸಾವಿರದ ಹತ್ತರದ್ದು. ನಾವು ಈಗ ಆ ಜನ ಅಲ್ಲ.
    tr: Ondu kelasa bāki ide. Grūp-ge hosa hesaru. Haḷē hesaru eraḍu sāvirada hattaraddu. Nāvu īga ā jana alla.
    en: One job is still pending. A new name for the group. The old name is from 2010. We're not those people any more.
  - who: naveen
    t: ‘ಉಂಟು-ಐತಿ-ಇದೆ.’ ಎಲ್ಲರದ್ದೂ ಸೇರಿ ಉಂಟು.
    tr: ‘Uṇṭu-aiti-ide.’ Ellaraddū sēri uṇṭu.
    en: '''Uṇṭu-aiti-ide.'' Everyone''s in it.'
  - who: kaveri
    t: ‘ಮುಂದೂಡಲಾಗಿದೆ.’ ಮುಂದಿನ ರೀಯೂನಿಯನ್‌ವರೆಗೆ.
    tr: ‘Mundūḍalāgide.’ Mundina rīyūniyan-varege.
    en: '''Adjourned.'' Until the next reunion.'
  - who: ramya
    t: 'ಅಯ್ಯೋ, ಅದು ಕೋರ್ಟ್ ನೋಟಿಸ್ ತರ ಇದೆ ಮರ್ರೆ! ನನ್ನದು: ‘ಬೆಣ್ಣೆ ದೋಸೆ ಬ್ಯಾಚ್.’'
    tr: 'Ayyō, adu kōrṭ nōṭis tara ide marre! Nannadu: ‘beṇṇe dōse byāc.’'
    en: 'Oh no, that sounds like a court notice, marre! Mine: ''The Benne Dose Batch''.'
  - who: deepa
    t: ‘ಸಣ್ಣ ಉರಿ.’ ಪ್ರಕಾಶ್ ಅಮ್ಮನ ಮಾತು. ಎಲ್ಲಾ ಸರಿ ಆಗೋಕೆ ಸಮಯ ಬೇಕು, ಗಡಿಬಿಡಿ ಮಾಡಿದ್ರೆ ಸೀದು ಹೋಗುತ್ತೆ.
    tr: ‘Saṇṇa uri.’ Prakāś ammana mātu. Ellā sari āgōke samaya bēku, gaḍibiḍi māḍidre sīdu hōgutte.
    en: '''Low Flame.'' Prakash''s mother''s words. Everything needs time to come right; rush it and it burns.'
  - who: arjun
    t: ನಾನು ವೋಟ್ ಮಾಡಲ್ಲ. ಈ ಟ್ರಿಪ್‌ನಲ್ಲಿ ನಾನು ಸಾಕಷ್ಟು ತೀರ್ಮಾನ ಎಲ್ಲರ ಪರವಾಗಿ ಮಾಡಿದೀನಿ. ಈ ಸಲ ನೀವು ಹೇಳಿ.
    tr: Nānu vōṭ māḍalla. Ī ṭrip-nalli nānu sākaṣṭu tīrmāna ellara paravāgi māḍidīni. Ī sala nīvu hēḷi.
    en: I'm not voting. I've made enough decisions on everyone's behalf on this trip. This time, you decide.
  - who: shruti
    t: 'ಸರಿ, ಎರಡನ್ನೂ ಸೇರಿಸ್ತೀನಿ. ಹೆಸರು: ‘ಹಳೆ ಗೆಳೆಯರ ಪಯಣ.’ ಡಿಸ್ಕ್ರಿಪ್ಷನ್‌ನಲ್ಲಿ ಎರಡು ನಿಯಮ: ‘ಸಣ್ಣ ಉರಿಯಲ್ಲಿ ಬೇಯಿಸಿ.’ ಮತ್ತೆ ‘ತೊಂದರೆ ಬಂದ್ರೆ ಮೊದಲು ಫೋನ್, ಆಮೇಲೆ ಎಲ್ಲಾ.’'
    tr: 'Sari, eraḍannū sēristīni. Hesaru: ‘Haḷe geḷeyara payaṇa.’ Ḍiskripṣan-nalli eraḍu niyama: ‘saṇṇa uriyalli bēyisi.’ Matte ‘tondare bandre modalu phōn, āmēle ellā.’'
    en: 'OK, I''ll combine them. The name: ''The Old Friends'' Trip''. In the description, two rules: ''Cook on a low flame.'' And ''If trouble comes, call first, everything else after.'''
  - scene: 'Seven phones buzz at once — and an eighth, far away on a sleeper bus near Vijayapura. ''Shruti changed the group name to ಹಳೆ ಗೆಳೆಯರ ಪಯಣ.'' A moment later, a message from Prakash: a photo of a stack of books on a kitchen table, and a voice note from his mother: ''ಮತ್ತೆ ಬರ್ರಿ.'''
  - who: ramya
    t: ಇಮ್ರಾನ್ ಬಸ್ಸಿಂದ ಥಂಬ್ಸ್ ಅಪ್ ಹಾಕಿದ. ಪ್ರಕಾಶ್ ಪುಸ್ತಕದ ಫೋಟೋ. ಅಮ್ಮನ ವಾಯ್ಸ್ ನೋಟ್. ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಕ್ಲೈಮ್ಯಾಕ್ಸ್ ಯಾವ ಸಿನಿಮಾದಲ್ಲೂ ಇಲ್ಲ.
    tr: Imrān bassinda thambs ap hākida. Prakāś pustakada phōṭō. Ammana vāys nōṭ. Idakkinta oḷḷe klaimyāks yāva sinimādallū illa.
    en: Imran's sent a thumbs-up from the bus. Prakash, a photo of his books. Amma's voice note. No film has a better climax than this.
  - section: Coffee in Jayanagar
    learn: 'a learner''s Kannada: svalpa svalpa, iṅglīṣ pada illade, sakkare kammi · which Kannada is ‘right’?: ellānū sari, bhāṣe tappalla, nagōdu tappu · parallels: Svis Jarman, haḷḷigondu uccāra · welcoming a newcomer: nīvū namma gyāṅg, ūrige banni'
  - scene: Eight in the evening. Jayanagar, Bengaluru. Before going up to Arjun's flat, the six stop at a small standing darshini — Sharada Darshini. Under the tube light, a tall young foreigner in an office lanyard is at the counter.
  - who: sam
    t: ಮಹೇಶ್ ಅವರೇ, ಎರಡು ಇಡ್ಲಿ, ಒಂದು ಬೈಟು ಕಾಫಿ, ಸಕ್ಕರೆ ಕಮ್ಮಿ. ಮತ್ತೆ ಮನೆಗೆ ಒಂದು ಪಾರ್ಸೆಲ್ — ಅಜ್ಜಿಗೆ ಚಟ್ನಿ ಜಾಸ್ತಿ, ಇಲ್ಲಾಂದ್ರೆ ನನಗೆ ಬೈತಾರೆ.
    tr: Mahēś avarē, eraḍu iḍli, ondu baiṭu kāphi, sakkare kammi. Matte manege ondu pārsel — ajjige caṭni jāsti, illāndre nanage baitāre.
    en: Mahesh, two idlis, one by-two coffee, less sugar. And a parcel for home — extra chutney for Ajji, otherwise she'll scold me.
  - who: naveen
    t: ಎಂತ ಮಾರಾಯ! ಅವರು ನಮಗಿಂತ ಚೆನ್ನಾಗಿ ಆರ್ಡರ್ ಮಾಡ್ತಿದ್ದಾರೆ. ನೀವು ಎಲ್ಲಿಯವರು ಸಾರ್?
    tr: Enta mārāya! Avaru namaginta cennāgi ārḍar māḍtiddāre. Nīvu elliyavaru sār?
    en: Wow, mārāya! He orders better than we do. Where are you from, sir?
  - who: sam
    t: 'ನಾನು ಸ್ಯಾಮ್, ಸ್ವಿಟ್ಜರ್ಲ್ಯಾಂಡಿನವನು. ಇಲ್ಲೇ ಜಯನಗರದಲ್ಲಿ ರಾವ್ ಅವರ ಮನೆಯಲ್ಲಿ ಪೀಜಿ. ಬೆಂಗಳೂರಿಗೆ ಬಂದ ಮೊದಲ ದಿನ ನನಗೆ ಗೊತ್ತಿದ್ದದ್ದು ಒಂದೇ ವಾಕ್ಯ: ‘ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಕನ್ನಡ.’'
    tr: 'Nānu Syām, Sviṭjarlyāṇḍinavanu. Illē Jayanagaradalli Rāv avara maneyalli pīji. Beṅgaḷūrige banda modala dina nanage gottiddaddu ondē vākya: ‘svalpa svalpa kannaḍa.’'
    en: 'I''m Sam, from Switzerland. I''m a paying guest with the Rao family right here in Jayanagar. On my first day in Bengaluru I knew exactly one sentence: ''A little, little Kannada.'''
  - who: deepa
    t: ಈಗ ‘ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ’ ಅಲ್ಲ. ಯಾರು ಕಲಿಸಿದ್ರು ನಿಮಗೆ?
    tr: Īga ‘svalpa svalpa’ alla. Yāru kalisidru nimage?
    en: It's not 'a little, little' any more. Who taught you?
  - who: sam
    t: ಎಲ್ಲರೂ. ಮನೇಲಿ ಅಜ್ಜಿ, ರಾವ್ ಆಂಟಿಯ ಅಡುಗೆಮನೆ, ಆಟೋ ಡ್ರೈವರ್‌ಗಳು, ಈ ದರ್ಶಿನಿ. ಆದ್ರೆ ನನಗೆ ಒಂದು ಸಮಸ್ಯೆ ಇದೆ, ನೀವು ಹೇಳಬಹುದಾ?
    tr: Ellarū. Manēli ajji, Rāv āṇṭiya aḍugemane, āṭō ḍraivar-gaḷu, ī darśini. Ādre nanage ondu samasye ide, nīvu hēḷabahudā?
    en: Everyone. Ajji at home, Mrs Rao's kitchen, the auto drivers, this darshini. But I have a problem — could you help me?
  - who: kaveri
    t: ಹೇಳಿ.
    tr: Hēḷi.
    en: Go ahead.
  - who: sam
    t: ಆಫೀಸ್‌ನಲ್ಲಿ ಹುಬ್ಬಳ್ಳಿಯ ಕೊಲೀಗ್ ‘ಐತಿ’ ಅಂತಾರೆ. ಮಂಗಳೂರಿನ ಕೊಲೀಗ್ ‘ಉಂಟು’ ಅಂತಾರೆ. ಮನೇಲಿ ಅಜ್ಜಿ ‘ಇದೆ’ ಅಂತಾರೆ. ಯಾವುದು ಸರಿಯಾದ ಕನ್ನಡ? ನಾನು ಯಾವುದನ್ನ ಕಲೀಬೇಕು?
    tr: Āphīs-nalli Hubbaḷḷiya kolīg ‘aiti’ antāre. Maṅgaḷūrina kolīg ‘uṇṭu’ antāre. Manēli ajji ‘ide’ antāre. Yāvudu sariyāda kannaḍa? Nānu yāvudanna kalībēku?
    en: At the office my colleague from Hubballi says 'aiti'. My colleague from Mangaluru says 'uṇṭu'. At home Ajji says 'ide'. Which one is the correct Kannada? Which one should I learn?
  - scene: 'The six friends look at each other. Then, almost together:'
  - who: shruti
    t: ಎಲ್ಲಾನೂ!
    tr: Ellānū!
    en: All of them!
  - who: arjun
    t: 'ಎಲ್ಲಾನೂ ಸರಿ, ಸ್ಯಾಮ್. ‘ಇದೆ’, ‘ಐತಿ’, ‘ಉಂಟು’ — ಮೂರೂ ಕನ್ನಡನೇ. ಯಾರಾದ್ರೂ ನಿಮ್ಮ ಕನ್ನಡ ಕೇಳಿ ನಕ್ಕರೆ, ಅವರಿಗೆ ಹೇಳಿ: ಭಾಷೆ ತಪ್ಪಲ್ಲ, ನಗೋದು ತಪ್ಪು. ಈ ಪಾಠ ಕಲಿಯೋಕೆ ನನಗೆ ಹದಿನಾರು ವರ್ಷ ಮತ್ತೆ ಒಂದು ರೋಡ್ ಟ್ರಿಪ್ ಬೇಕಾಯ್ತು.'
    tr: 'Ellānū sari, Syām. ‘Ide’, ‘aiti’, ‘uṇṭu’ — mūrū kannaḍanē. Yārādrū nimma kannaḍa kēḷi nakkare, avarige hēḷi: bhāṣe tappalla, nagōdu tappu. Ī pāṭha kaliyōke nanage hadināru varṣa matte ondu rōḍ ṭrip bēkāytu.'
    en: 'They''re all right, Sam. ''Ide'', ''aiti'', ''uṇṭu'' — all three are Kannada. If anyone laughs when they hear your Kannada, tell them: the language isn''t wrong, laughing is. It took me sixteen years and one road trip to learn that lesson.'
  - who: sam
    t: ನಮ್ಮ ಸ್ವಿಸ್ ಜರ್ಮನ್‌ನಲ್ಲೂ ಹಾಗೇ. ಹಳ್ಳಿಗೊಂದು ಉಚ್ಚಾರ, ಕಣಿವೆಗೊಂದು ಪದ. ಜೂರಿಕ್‌ನವರು ಬರ್ನ್‌ನವರನ್ನ ನೋಡಿ ನಗ್ತಾರೆ, ಬರ್ನ್‌ನವರು ಜೂರಿಕ್‌ನವರನ್ನ. ಎಲ್ಲಾ ಕಡೆ ಮನುಷ್ಯರು ಒಂದೇ ತರ.
    tr: Namma Svis Jarman-nallū hāgē. Haḷḷigondu uccāra, kaṇivegondu pada. Jūrik-navaru Barn-navaranna nōḍi nagtāre, Barn-navaru Jūrik-navaranna. Ellā kaḍe manuṣyaru ondē tara.
    en: It's the same with our Swiss German. Every village has its own accent, every valley its own words. People from Zurich laugh at people from Bern, and Bern laughs at Zurich. People are the same everywhere.
  - who: ramya
    t: ಸ್ಯಾಮ್, ನನ್ನ ಹೊಸ ಚಾನೆಲ್ ‘ಊರ ಕತೆ’ಗೆ ನಿಮ್ಮ ಕತೆ ಬೇಕು — ಸ್ವಿಟ್ಜರ್ಲ್ಯಾಂಡಿನ ಹುಡುಗ ಜಯನಗರದ ಅಜ್ಜಿಯಿಂದ ಕನ್ನಡ ಕಲಿತ ಕತೆ. ಒಪ್ಪಿಗೆನಾ?
    tr: Syām, nanna hosa cānel ‘Ūra kate’ge nimma kate bēku — Sviṭjarlyāṇḍina huḍuga Jayanagarada ajjiyinda kannaḍa kalita kate. Oppigenā?
    en: Sam, I want your story for my new channel 'Ura Kathe' — the story of a boy from Switzerland who learned Kannada from a Jayanagar grandmother. Do you agree?
  - who: sam
    t: ಒಪ್ಪಿಗೆ. ಆದ್ರೆ ಅಜ್ಜಿನೂ ಕ್ಯಾಮೆರಾ ಮುಂದೆ ಬರಬೇಕು. ಅವರಿಲ್ಲದೆ ನನ್ನ ಕನ್ನಡ ಇಲ್ಲ.
    tr: Oppige. Ādre ajjinū kyāmerā munde barabēku. Avarillade nanna kannaḍa illa.
    en: I agree. But Ajji has to be in front of the camera too. Without her there's no Kannada for me.
  - who: naveen
    t: ಮತ್ತೆ ಉಡುಪಿಗೆ ಬನ್ನಿ ಸ್ಯಾಮ್. ‘ಉಂಟು’ ನಮ್ಮ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಸರಿಯಾಗಿ ಕಲಿಸ್ತೇವೆ. ಊಟ ಫ್ರೀ ಉಂಟು.
    tr: Matte Uḍupige banni Syām. ‘Uṇṭu’ namma hōṭel-nalli sariyāgi kalistēve. Ūṭa phrī uṇṭu.
    en: And come to Udupi, Sam. We'll teach you 'uṇṭu' properly at our hotel. The meals are free.
  - who: kaveri
    t: ನವೀನ್, ನಿನ್ನ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಊಟ ಫ್ರೀ ಇರೋರ ಲಿಸ್ಟ್ ಬೆಳೀತಿದೆ. ಅದನ್ನೂ ಒಪ್ಪಂದದಲ್ಲಿ ಬರೀಬೇಕಾ?
    tr: Navīn, ninna hōṭel-nalli ūṭa phrī irōra lisṭ beḷītide. Adannū oppandadalli barībēkā?
    en: Naveen, the list of people who eat free at your hotel keeps growing. Should I put that in the agreement too?
  - section: The last cup
    learn: 'telling parents: nāḷe beḷigge manege bartīni, ondu viṣaya hēḷbēku · callbacks to the whole course: ūṭa āytā?, hōgi barri, saṇṇa uri · saying goodbye without saying it: matte sigōṇa, mesēj māḍu, grūp-nalli irtīvi · a closing line'
  - scene: Half past nine. Arjun's flat in Jayanagar, where the plan began on a Saturday night in November. Bags on the floor, the balcony door open. Arjun is on the phone to his mother; the others pretend not to listen.
  - who: arjun
    t: ಅಮ್ಮ, ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಮನೆಗೆ ಬರ್ತೀನಿ. ನಿನಗೂ ಅಪ್ಪಂಗೂ ಒಂದು ವಿಷಯ ಹೇಳ್ಬೇಕು… ಇಲ್ಲ ಅಮ್ಮ, ಗಾಬರಿ ಆಗ್ಬೇಡ, ಆರೋಗ್ಯ ಚೆನ್ನಾಗಿದೆ… ಏನು? ಹೂಂ… ಆಯ್ತು ಅಮ್ಮ, ಊಟ ಆಯ್ತು. ಬೆಣ್ಣೆ ದೋಸೆ.
    tr: Amma, nāḷe beḷigge manege bartīni. Ninagū appaṅgū ondu viṣaya hēḷbēku… illa amma, gābari āgbēḍa, ārōgya cennāgide… ēnu? Hūṃ… āytu amma, ūṭa āytu. Beṇṇe dōse.
    en: Amma, I'll come home tomorrow morning. I need to tell you and Appa something… No, Amma, don't panic, my health is fine… What? Yes… yes, Amma, I've eaten. Benne dose.
  - scene: He hangs up. Deepa is smiling at him.
  - who: deepa
    t: ಕೇಳಿದ್ರು ಅಲ್ವಾ? ‘ಊಟ ಆಯ್ತಾ?’ ನಾನು ಹೇಳಿದ್ದೆ.
    tr: Kēḷidru alvā? ‘Ūṭa āytā?’ Nānu hēḷidde.
    en: She asked, didn't she? 'Have you eaten?' I told you so.
  - who: arjun
    t: ಹೂಂ. ಮೊದಲ ಪ್ರಶ್ನೆನೇ ಅದು. ಕಂಪನಿ ಮುಚ್ಚೋದು ನಾಳೆಯ ಕತೆ. ಇವತ್ತು ಊಟ ಆಯ್ತಾ ಇಲ್ವಾ ಅನ್ನೋದೇ ಮುಖ್ಯ.
    tr: Hūṃ. Modala praśnenē adu. Kampani muccōdu nāḷeya kate. Ivattu ūṭa āytā ilvā annōdē mukhya.
    en: Yes. That was the very first question. The company closing is tomorrow's story. Tonight, whether I've eaten is what matters.
  - who: kaveri
    t: ಸರಿ. ನಾನು ಹೊರಡ್ತೀನಿ, ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಹತ್ತೂವರೆಗೆ ಹೈಕೋರ್ಟ್‌ನಲ್ಲಿ ಮ್ಯಾಟರ್ ಇದೆ. ಶುಕ್ರವಾರ ಡ್ರಾಫ್ಟ್. ಎಲ್ಲರೂ… ಹೋಗಿ ಬರ್ತೀನಿ.
    tr: Sari. Nānu horaḍtīni, nāḷe beḷigge hattūvarege haikōrṭ-nalli myāṭar ide. Śukravāra ḍrāphṭ. Ellarū… hōgi bartīni.
    en: Right. I'm off — I have a matter in the High Court at half past ten tomorrow. The draft on Friday. Everyone… I'll go and come back.
  - who: ramya
    t: ನಾನೂ. ನಾಳೆಯಿಂದ ನೋಟಿಸ್ ಪೀರಿಯಡ್, ಮೂರು ತಿಂಗಳು ಕೊನೇ ಸಲ ಕೂಗಬೇಕು. ಆಮೇಲೆ ‘ಊರ ಕತೆ’. ಮತ್ತೆ ಅಪ್ಪಯ್ಯಂಗೆ ಇವತ್ತು ರಾತ್ರಿ ಫೋನ್. ಪ್ರಾಮಿಸ್ ಮಾಡಿದ್ದೆ.
    tr: Nānū. Nāḷeyinda nōṭis pīriyaḍ, mūru tiṅgaḷu konē sala kūgabēku. Āmēle ‘Ūra kate’. Matte appayyaṅge ivattu rātri phōn. Prāmis māḍidde.
    en: Me too. Notice period from tomorrow — three months of shouting, for the last time. Then 'Ura Kathe'. And a call to my father tonight. I promised.
  - who: naveen
    t: ನಾನು ಇವತ್ತು ಇಲ್ಲೇ ಮಲಗ್ತೇನೆ, ನಾಳೆ ಸಪ್ಲೈಯರ್ ಮೀಟಿಂಗ್ ಮುಗಿಸಿ ಉಡುಪಿಗೆ. ಅರ್ಜುನ್, ನಿನ್ನ ಸೋಫಾ ಉಂಟಲ್ಲ?
    tr: Nānu ivattu illē malagtēne, nāḷe saplaiyar mīṭiṅg mugisi Uḍupige. Arjun, ninna sōphā uṇṭalla?
    en: I'll sleep here tonight, and tomorrow after the supplier meeting I head to Udupi. Arjun, there's your sofa, isn't there?
  - who: arjun
    t: ಸೋಫಾ ಅಲ್ಲ, ಬೆಡ್ ನಿನಗೆ. ಸೋಫಾ ನನಗೆ. ಅದು ಕೂಡ ಒಪ್ಪಂದದಲ್ಲಿ ಸೇರಿಸಿ, ಕಾವೇರಿ.
    tr: Sōphā alla, beḍ ninage. Sōphā nanage. Adu kūḍa oppandadalli sērisi, Kāvēri.
    en: Not the sofa — you get the bed. The sofa's mine. Put that in the agreement too, Kaveri.
  - who: shruti
    t: ನಾನು ದೀಪಾನ ನಮ್ ಮನೆಗೆ ಕರ್ಕೊಂಡು ಹೋಗ್ತೀನಿ. ಭಾನುವಾರ ಮೈಸೂರಿಗೆ ನಾನೂ ಜೊತೆಗೆ ಬರ್ತೀನಿ. ಮತ್ತೆ ನಾಳೆಯಿಂದ ಡೇಟಾ ಸ್ಟ್ರಕ್ಚರ್ಸ್ — ದೀಪಾ ಮೇಡಂ ಕ್ಲಾಸ್.
    tr: Nānu Dīpāna nam manege karkoṇḍu hōgtīni. Bhānuvāra Maisūrige nānū jotege bartīni. Matte nāḷeyinda ḍēṭā sṭrakcars — Dīpā mēḍaṃ klās.
    en: I'm taking Deepa home with me. On Sunday I'll go to Mysuru with her. And from tomorrow, data structures — Deepa Madam's class.
  - who: deepa
    t: ಮತ್ತೆ ಜನವರಿಯಿಂದ ಭರತನಾಟ್ಯ ಕ್ಲಾಸ್ — ನಂದು. ಗೆಜ್ಜೆ ಪೆಟ್ಟಿಗೆಯಿಂದ ಹೊರಗೆ ತೆಗೆದಿದೀನಿ ಅಂತ ಅಮ್ಮಂಗೆ ಹೇಳಿದೆ. ಅವರು ಅತ್ತರು, ಈ ಸಲ ಖುಷಿಗೆ.
    tr: Matte Janavariyinda Bharatanāṭya klās — nandu. Gejje peṭṭigeyinda horage tegedidīni anta ammaṅge hēḷide. Avaru attaru, ī sala khuṣige.
    en: And from January, Bharatanatyam class — mine. I told Amma I've taken my ankle bells out of the box. She cried — this time from happiness.
  - scene: They go down the stairs one by one. Arjun and Naveen stand on the balcony and watch the two cars pull out into the Jayanagar night. The darshini's light is still on at the corner.
  - who: naveen
    t: ಒಂದು ವಾರದ ಹಿಂದೆ ಇದೇ ಬಾಲ್ಕನಿಯಲ್ಲಿ ನಿನ್ನ ಜೊತೆ ನಿಲ್ಲುವುದೂ ಆಗ್ತಿರಲಿಲ್ಲ ನನಗೆ.
    tr: Ondu vārada hinde idē bālkaniyalli ninna jote nilluvudū āgtiralilla nanage.
    en: A week ago I couldn't even have stood on this balcony with you.
  - who: arjun
    t: ಗೊತ್ತು. ಎಂಟು ಜನ, ಎಂಟು ಊರು, ಏಳು ತರ ಕನ್ನಡ. ಒಂದು ವಾರ. ನಾನು ಗುಂಪು ಕರೆದಿದ್ದು ನನ್ನ ಕಂಪನಿ ಮುಚ್ಚೋದನ್ನ ಮರೆಯೋಕೆ. ವಾಪಸ್ ಬಂದಿದ್ದು ನನ್ನನ್ನ ನಾನು ಹುಡುಕಿಕೊಂಡು.
    tr: Gottu. Eṇṭu jana, eṇṭu ūru, ēḷu tara kannaḍa. Ondu vāra. Nānu guṃpu karediddu nanna kampani muccōdanna mareyōke. Vāpas bandiddu nannanna nānu huḍukikoṇḍu.
    en: I know. Eight people, eight towns, seven kinds of Kannada. One week. I called the gang together to forget my company closing. I came back having found myself.
  - who: naveen
    t: ಹೂಂ. ಮಾತು ಬೇರೆ ಬೇರೆ ಉಂಟು ಮಾರಾಯ. ಮನಸ್ಸು ಒಂದೇ.
    tr: Hūṃ. Mātu bēre bēre uṇṭu mārāya. Manassu ondē.
    en: Mm. The words are all different, mārāya. The heart is one.
  - scene: 'Below, under the darshini''s tube light, Sam walks home with a parcel of idlis for Ajji, practising under his breath: ''ide… aiti… uṇṭu.'' From a stranger''s first ''svalpa svalpa Kannada'' at a Jayanagar gate to eight old friends arguing, apologising and forgiving in seven kinds of Kannada — every voice in this course has been the same language. Hōgi banni. Go well, and come back.'
