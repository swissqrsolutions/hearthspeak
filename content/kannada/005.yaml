title:
  t: ತಾತನ ಜಮೀನು
  tr: Tātana jamīnu
  en: Grandfather's land
intro: 'When Thatha dies in his village near Maddur, his six acres divide his three children: Suresh, a bank manager in Bengaluru; Mahadeva, who stayed and farmed; and Shobha, a nurse in Mysuru who claims her equal share. One real year, December 2025 to January 2027: the rites, the land records, the elders under the peepul tree, a land broker, a court case, a full farming season, the village jatre, the Lok Adalat and Sankranti.'
