lines:
  - chapter: Chapter 1 — The call
  - section: The phone at midnight
    learn: 'bad news: hōgbiṭṭru, tīrkoṇḍru, innilla, hārṭ aṭyāk · reporting what had happened (past perfect): uṭa māḍi kūtidru, usiru nintōgittu · comforting: dhairya tagō, samādhāna māḍko · first Mandya markers: kaṇaṇṇa, hōgbuṭru, karkaṇḍu, hiḍkaṇḍidde'
  - scene: Tuesday, 9 December 2025, 11:40 at night. Suresh and Meena's flat in Vijayanagar, Bengaluru. The phone rings. It is Mahadeva, Suresh's younger brother, calling from the family's village, Bettahalli, near Maddur in Mandya district.
  - who: suresh
    t: ಹಲೋ… ಮಹದೇವ? ಇಷ್ಟು ರಾತ್ರೀಲಿ? ಏನಾಯ್ತೋ?
    tr: Halō… Mahadēva? Iṣṭu rātrīli? Ēnāytō?
    en: Hello… Mahadeva? At this hour of the night? What's happened?
  - who: mahadeva
    t: ಅಣ್ಣ… ಅಪ್ಪ ಹೋಗ್ಬುಟ್ರು ಕಣಣ್ಣ.
    tr: Aṇṇa… appa hōgbuṭru kaṇaṇṇa.
    en: Anna… Appa is gone, brother.
  - who: suresh
    t: ಏನು? ಏನ್ ಹೇಳ್ತಿದೀಯ? ಸಂಜೆ ತಾನೇ ಫೋನ್‌ನಲ್ಲಿ ನನ್ನ ಜೊತೆ ಮಾತಾಡಿದ್ರು. ಚೆನ್ನಾಗೇ ಇದ್ರು.
    tr: Ēnu? Ēn hēḷtidīya? San̄je tānē phōn-nalli nanna jote mātāḍidru. Cennāgē idru.
    en: What? What are you saying? He spoke to me on the phone only this evening. He was perfectly fine.
  - who: mahadeva
    t: ಊಟ ಮಾಡಿ ಜಗುಲಿ ಮೇಲೆ ಕುಂತಿದ್ರು. ಎದೆ ನೋಯ್ತಾ ಇದೆ ಅಂದ್ರು, ಮೈಯೆಲ್ಲಾ ಬೆವರು. ನಾನು ಕಾರ್‌ನಲ್ಲಿ ಮದ್ದೂರು ಆಸ್ಪತ್ರೆಗೆ ಕರ್ಕಂಡು ಹೋದೆ.
    tr: Ūṭa māḍi jaguli mēle kuntidru. Ede nōytā ide andru, maiyellā bevaru. Nānu kār-nalli Maddūru āspatrege karkaṇḍu hōde.
    en: He'd eaten and was sitting out on the veranda. He said his chest was hurting; he was drenched in sweat. I took him to the Maddur hospital in the car.
  - who: suresh
    t: ಆಮೇಲೆ? ಡಾಕ್ಟರ್ ಏನಂದ್ರು?
    tr: Āmēle? Ḍākṭar ēnandru?
    en: And then? What did the doctor say?
  - who: mahadeva
    t: ಆಸ್ಪತ್ರೆ ಮುಟ್ಟೋ ಮುಂಚೇನೇ ಉಸಿರು ನಿಂತೋಗಿತ್ತು ಅಂತ ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ರು. ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಅಂತೆ. ನಾನು ಸ್ಟೀರಿಂಗ್ ಹಿಡ್ಕಂಡಿದ್ದೆ, ಅವ್ರು ಪಕ್ಕದಲ್ಲೇ ಇದ್ರು… ನಂಗೆ ಗೊತ್ತೇ ಆಗ್ಲಿಲ್ಲ ಕಣಣ್ಣ.
    tr: Āspatre muṭṭō mun̄cēnē usiru nintōgittu anta ḍākṭru hēḷidru. Hārṭ aṭyāk ante. Nānu sṭīriṅg hiḍkaṇḍidde, avru pakkadallē idru… naṅge gottē āglilla kaṇaṇṇa.
    en: The doctor said his breathing had stopped before we even reached the hospital. A heart attack, he says. I was holding the steering wheel, he was right there beside me… and I didn't even know, brother.
  - who: suresh
    t: ಅಯ್ಯೋ… ಮಹದೇವ, ನೀನು ಈಗ ಎಲ್ಲಿದೀಯ? ಅವ್ವ ಹೇಗಿದಾರೆ?
    tr: Ayyō… Mahadēva, nīnu īga ellidīya? Avva hēgidāre?
    en: Oh no… Mahadeva, where are you now? How is Avva?
  - who: mahadeva
    t: ಅಪ್ಪನ್ನ ಮನೆಗೆ ಕರ್ಕಂಡು ಬಂದಿದೀವಿ. ಅವ್ವ ಅಳ್ತಾನೇ ಇದಾರೆ, ಯಾರ್ ಮಾತೂ ಕೇಳ್ತಿಲ್ಲ. ಪಕ್ಕದ್ಮನೆ ಹೆಂಗಸರು ಅವರ ಜೊತೆ ಕುಂತಿದಾರೆ.
    tr: Appanna manege karkaṇḍu bandidīvi. Avva aḷtānē idāre, yār mātū kēḷtilla. Pakkadmane heṅgasaru avara jote kuntidāre.
    en: We've brought Appa home. Avva won't stop crying; she isn't listening to anyone. The women from next door are sitting with her.
  - who: suresh
    t: ಸರಿ, ನಾವು ಈಗಲೇ ಹೊರಡ್ತೀವಿ. ಎರಡು ಗಂಟೆ ಒಳಗೆ ಅಲ್ಲಿರ್ತೀವಿ. ಶೋಭಾಗೆ ಹೇಳಿದ್ಯಾ?
    tr: Sari, nāvu īgalē horaḍtīvi. Eraḍu gaṇṭe oḷage allirtīvi. Śōbhāge hēḷidyā?
    en: All right, we're leaving right now. We'll be there within two hours. Have you told Shobha?
  - who: mahadeva
    t: ಶೋಭಂಗೆ ಇನ್ನೂ ಹೇಳಿಲ್ಲ. ಆಸ್ಪತ್ರೆ ಡ್ಯೂಟೀಲಿ ಇರ್ತಾಳೆ ಅನ್ಸುತ್ತೆ. ನನ್ ಬಾಯಲ್ಲಿ ಮಾತೇ ಬರ್ತಿಲ್ಲ. ನೀನೇ ಹೇಳ್ಬುಡಣ್ಣ.
    tr: Śōbhaṅge innū hēḷilla. Āspatre ḍyūṭīli irtāḷe ansutte. Nan bāyalli mātē bartilla. Nīnē hēḷbuḍaṇṇa.
    en: I haven't told Shobha yet. I think she's on duty at the hospital. The words just won't come out of my mouth. You tell her, Anna.
  - who: suresh
    t: ನಾನು ಹೇಳ್ತೀನಿ. ನೀನು ಧೈರ್ಯ ತಗೋ. ಅವ್ವನ್ನ ಒಬ್ಬರನ್ನೇ ಬಿಡ್ಬೇಡ.
    tr: Nānu hēḷtīni. Nīnu dhairya tagō. Avvanna obbarannē biḍbēḍa.
    en: I'll tell her. Be strong. Don't leave Avva alone.
  - who: mahadeva
    t: ಆಯ್ತು. ಬೇಗ ಬಾ ಕಣಣ್ಣ. ಹುಷಾರಾಗಿ ಓಡ್ಸು, ರಾತ್ರಿ ಹೈವೇಲಿ ಲಾರಿಗಳು ಜಾಸ್ತಿ.
    tr: Āytu. Bēga bā kaṇaṇṇa. Huṣārāgi ōḍsu, rātri haivēli lārigaḷu jāsti.
    en: All right. Come quickly, brother. Drive carefully; there are a lot of lorries on the highway at night.
  - who: meena
    t: ಸುರೇಶ್… ಏನಾಯ್ತು? ನಿಮ್ಮ ಮುಖ ಬಿಳಿಚ್ಕೊಂಡಿದೆ.
    tr: Surēś… ēnāytu? Nimma mukha biḷickoṇḍide.
    en: Suresh… what happened? Your face has gone white.
  - who: suresh
    t: ಅಪ್ಪ ಇನ್ನಿಲ್ಲ, ಮೀನಾ. ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್. ಆಸ್ಪತ್ರೆಗೆ ಕರ್ಕೊಂಡು ಹೋಗೋ ದಾರೀಲೇ ಹೋಗ್ಬಿಟ್ರಂತೆ.
    tr: Appa innilla, Mīnā. Hārṭ aṭyāk. Āspatrege karkoṇḍu hōgō dārīlē hōgbiṭrante.
    en: Appa is no more, Meena. A heart attack. They say he went on the way to the hospital.
  - who: meena
    t: ಅಯ್ಯೋ ದೇವ್ರೇ… ಕಳೆದ ತಿಂಗಳು ನಾವು ಹೋದಾಗ ಗದ್ದೆ ಬದುಗಳ ಮೇಲೆ ನಮಗಿಂತ ಜೋರಾಗಿ ನಡೀತಿದ್ರು.
    tr: Ayyō dēvrē… kaḷeda tiṅgaḷu nāvu hōdāga gadde badugaḷa mēle namaginta jōrāgi naḍītidru.
    en: Oh God… when we went last month, he was striding along the bunds of the paddy fields faster than any of us.
  - who: suresh
    t: ಅದೇ ನಂಬೋಕೇ ಆಗ್ತಿಲ್ಲ. ಎಪ್ಪತ್ನಾಲ್ಕು ವರ್ಷ ಆದ್ರೂ ಒಂದು ದಿನಾನೂ ಆಸ್ಪತ್ರೆಲಿ ಮಲಗಿದವರಲ್ಲ. ಬಿಪಿ ಮಾತ್ರೆ ಕೂಡ ಬೇಡ ಅಂತಿದ್ರು.
    tr: Adē nambōkē āgtilla. Eppatnālku varṣa ādrū ondu dinānū āspatreli malagidavaralla. Bi-pi mātre kūḍa bēḍa antidru.
    en: That's what I can't believe. Seventy-four years old, and he never spent a single day in hospital. He even used to refuse the BP tablets.
  - who: meena
    t: ಒಂದು ನಿಮಿಷ ಕೂತ್ಕೊಳ್ಳಿ. ನೀರು ಕುಡೀರಿ. ಈ ಸ್ಥಿತಿಯಲ್ಲಿ ನೀವು ಡ್ರೈವ್ ಮಾಡೋದು ಬೇಡ. ಬ್ಯಾಗ್ ನಾನು ರೆಡಿ ಮಾಡ್ತೀನಿ.
    tr: Ondu nimiṣa kūtkoḷḷi. Nīru kuḍīri. Ī sthitiyalli nīvu ḍraiv māḍōdu bēḍa. Byāg nānu reḍi māḍtīni.
    en: Sit down for a minute. Drink some water. You shouldn't drive in this state. I'll pack the bag.
  - who: suresh
    t: ಇಲ್ಲ, ನಾನೇ ಓಡಿಸ್ತೀನಿ. ಕೈಗೆ ಏನಾದ್ರೂ ಕೆಲಸ ಬೇಕು, ಇಲ್ಲಾಂದ್ರೆ ತಲೆ ಕೆಟ್ಟೋಗುತ್ತೆ. ರಕ್ಷಿತ್‌ನ ಎಬ್ಬಿಸು.
    tr: Illa, nānē ōḍistīni. Kaige ēnādrū kelasa bēku, illāndre tale keṭṭōgutte. Rakṣit-na ebbisu.
    en: No, I'll drive. My hands need something to do, or I'll go out of my mind. Wake Rakshith.
  - who: rakshith
    t: ಅಪ್ಪಾ? ಇಷ್ಟು ಹೊತ್ತಲ್ಲಿ ಲೈಟ್ ಯಾಕೆ ಹಾಕಿದೀರ? ಏನಾಯ್ತು?
    tr: Appā? Iṣṭu hottalli laiṭ yāke hākidīra? Ēnāytu?
    en: Appa? Why are the lights on at this time? What's going on?
  - who: meena
    t: ರಕ್ಷಿತ್, ತಾತ ತೀರ್ಕೊಂಡ್ರು ಕಣೋ. ನಾವು ಈಗಲೇ ಊರಿಗೆ ಹೋಗ್ಬೇಕು. ಎರಡು ಜೊತೆ ಬಟ್ಟೆ ತಗೋ, ಬಿಳಿ ಶರ್ಟ್ ಇದ್ರೆ ಅದನ್ನೂ ತಗೋ.
    tr: Rakṣit, tāta tīrkoṇḍru kaṇō. Nāvu īgalē ūrige hōgbēku. Eraḍu jote baṭṭe tagō, biḷi śarṭ idre adannū tagō.
    en: Rakshith, Thatha has passed away, dear. We have to go to the village right now. Take two sets of clothes, and a white shirt if you have one.
  - who: rakshith
    t: ತಾತ? ಆದ್ರೆ… ಮುಂದಿನ ತಿಂಗಳು ಸಂಕ್ರಾಂತಿಗೆ ಬಾ, ದನಗಳ ಕೊಂಬಿಗೆ ಬಣ್ಣ ಹಚ್ಚೋದು ಕಲಿಸ್ತೀನಿ ಅಂತ ಹೇಳಿದ್ರು.
    tr: Tāta? Ādre… mundina tiṅgaḷu saṅkrāntige bā, danagaḷa kombige baṇṇa haccōdu kalistīni anta hēḷidru.
    en: Thatha? But… he told me to come next month for Sankranti, he said he'd teach me how to paint the cattle's horns.
  - who: suresh
    t: ಗೊತ್ತು ಕಣೋ. ಈಗ ನಿಂತು ಯೋಚಿಸೋಕೂ ಟೈಮ್ ಇಲ್ಲ. ಬೇಗ ರೆಡಿ ಆಗು. ನಿನ್ನ ಪರೀಕ್ಷೆ ವಿಷಯ ಆಮೇಲೆ ನೋಡೋಣ.
    tr: Gottu kaṇō. Īga nintu yōcisōkū ṭaim illa. Bēga reḍi āgu. Ninna parīkṣe viṣaya āmēle nōḍōṇa.
    en: I know, son. There's no time to stand and think now. Get ready quickly. We'll sort out your exams later.
  - who: suresh
    t: ಶೋಭಾ, ಡ್ಯೂಟೀಲಿದೀಯಾ? … ಇಲ್ಲ, ಕೇಳು. ಒಂದು ನಿಮಿಷ ಎಲ್ಲಾದ್ರೂ ಕೂತ್ಕೊ.
    tr: Śōbhā, ḍyūṭīlidīyā? … Illa, kēḷu. Ondu nimiṣa ellādrū kūtko.
    en: (on the phone) Shobha, are you on duty? … No, listen. Sit down somewhere for a minute.
  - who: shobha
    t: ನೈಟ್ ಡ್ಯೂಟಿ ಅಣ್ಣ, ವಾರ್ಡ್‌ನಲ್ಲಿದೀನಿ. ನೀನು ಇಷ್ಟು ಹೊತ್ತಲ್ಲಿ ಫೋನ್ ಮಾಡಿದ್ಯಾ ಅಂದ್ರೆ… ಅಪ್ಪಂಗೆ ಏನಾದ್ರೂ ಆಯ್ತಾ?
    tr: Naiṭ ḍyūṭi aṇṇa, vārḍ-nallidīni. Nīnu iṣṭu hottalli phōn māḍidyā andre… appaṅge ēnādrū āytā?
    en: Night duty, Anna, I'm on the ward. If you're calling at this hour… has something happened to Appa?
  - who: suresh
    t: ಹೌದು ಶೋಭಾ. ಅಪ್ಪ ಹೋಗ್ಬಿಟ್ರು. ರಾತ್ರಿ ಹತ್ತೂವರೆಗೆ. ಎದೆನೋವು ಬಂತು, ಮಹದೇವ ಮದ್ದೂರಿಗೆ ಕರ್ಕೊಂಡು ಹೋದ, ಆದ್ರೆ ಅಷ್ಟರಲ್ಲಿ ತಡ ಆಗಿತ್ತು.
    tr: Haudu Śōbhā. Appa hōgbiṭru. Rātri hattūvarege. Edenōvu bantu, Mahadēva Maddūrige karkoṇḍu hōda, ādre aṣṭaralli taḍa āgittu.
    en: Yes, Shobha. Appa's gone. At half past ten tonight. He had chest pain; Mahadeva took him to Maddur, but by then it was too late.
  - who: shobha
    t: ಇಲ್ಲ… ಇಲ್ಲ ಅಣ್ಣ. ಕಳೆದ ವಾರ ನಾನೇ ಹೇಳಿದ್ದೆ, ಒಂದು ಇಸಿಜಿ ಮಾಡಿಸ್ಕೊಳ್ಳಿ ಅಂತ. ನಾನು ನರ್ಸ್ ಆಗಿ ಏನು ಪ್ರಯೋಜನ? ನನ್ನ ಸ್ವಂತ ಅಪ್ಪನ ಎದೆನೋವು ಗುರುತಿಸೋಕೆ ಆಗ್ಲಿಲ್ಲ.
    tr: Illa… illa aṇṇa. Kaḷeda vāra nānē hēḷidde, ondu i-si-ji māḍiskoḷḷi anta. Nānu nars āgi ēnu prayōjana? Nanna svanta appana edenōvu gurutisōke āglilla.
    en: No… no, Anna. Only last week I told him to get an ECG done. What use is my being a nurse? I couldn't even recognise my own father's chest pain.
  - who: suresh
    t: ಹಾಗೆ ಹೇಳ್ಬೇಡ. ಅವರು ಯಾರ ಮಾತು ಕೇಳ್ತಿದ್ರು ಹೇಳು? ನೀನು ಮೈಸೂರಿಂದ ಹೇಗೆ ಬರ್ತೀಯ?
    tr: Hāge hēḷbēḍa. Avaru yāra mātu kēḷtidru hēḷu? Nīnu Maisūrinda hēge bartīya?
    en: Don't say that. Tell me, whose advice did he ever take? How will you get here from Mysuru?
  - who: shobha
    t: ನನ್ನ ಗಂಡ ಕಾರ್ ತರ್ತಾರೆ. ಮೈಸೂರಿಂದ ಮದ್ದೂರು ಒಂದು ಗಂಟೆ ಅಷ್ಟೇ. ಬೆಳಕು ಹರಿಯೋ ಮುಂಚೆ ಅಲ್ಲಿರ್ತೀನಿ. ಅವ್ವನ್ನ ನೋಡ್ಕೊಳ್ಳಿ ಅಣ್ಣ, ಪ್ಲೀಸ್.
    tr: Nanna ganḍa kār tartāre. Maisūrinda Maddūru ondu gaṇṭe aṣṭē. Beḷaku hariyō mun̄ce allirtīni. Avvanna nōḍkoḷḷi aṇṇa, plīs.
    en: My husband will bring the car. Mysuru to Maddur is only an hour. I'll be there before daybreak. Look after Avva, Anna, please.
  - section: The expressway at night
    learn: 'habitual past for memories: hēḷtidru, hēḷkoḷḷtidru · past perfect: hogidde, muridittu, bandittu · reasons and consequences: adē varṣa…, adakkē… · how to behave at a death: kālu muṭṭi namaskāra, tumbā bējārāgide'
  - scene: About 1:30 a.m. The Bengaluru–Mysuru expressway, almost empty. Suresh drives; Meena sits beside him; Rakshith is in the back seat, wide awake.
  - who: rakshith
    t: ಅಪ್ಪಾ, ತಾತ ಯಾವಾಗಲೂ ಊರಲ್ಲೇ ಇದ್ರಾ? ಯಾವತ್ತೂ ಬೆಂಗಳೂರಿಗೆ ಬಂದು ಇರ್ಬೇಕು ಅಂತ ಅವರಿಗೆ ಅನ್ಸಿರ್ಲಿಲ್ವಾ?
    tr: Appā, tāta yāvāgalū ūrallē idrā? Yāvattū Beṅgaḷūrige bandu irbēku anta avarige ansirlilvā?
    en: Appa, did Thatha always live in the village? Didn't he ever feel like coming to live in Bengaluru?
  - who: suresh
    t: ಒಂದೇ ಸಲ ಬಂದಿದ್ರು, ನೀನು ಹುಟ್ಟಿದಾಗ. ಹತ್ತು ದಿನ ಇದ್ರು. ಹನ್ನೊಂದನೇ ದಿನ ಬೆಳಿಗ್ಗೆ ಬ್ಯಾಗ್ ಕಟ್ಕೊಂಡು ಬಾಗಿಲಲ್ಲಿ ನಿಂತಿದ್ರು. ‘ಇಲ್ಲಿ ಮಣ್ಣಿನ ವಾಸನೆನೇ ಇಲ್ಲ, ಅಲ್ಲಿ ದನಗಳು ನನ್ನ ಕಾಯ್ತಿರ್ತವೆ’ ಅಂದ್ರು.
    tr: Ondē sala bandidru, nīnu huṭṭidāga. Hattu dina idru. Hannondanē dina beḷigge byāg kaṭkoṇḍu bāgilalli nintidru. ‘Illi maṇṇina vāsanenē illa, alli danagaḷu nanna kāytirtave’ andru.
    en: He came just once, when you were born. He stayed ten days. On the eleventh morning he was standing at the door with his bag packed. 'There's no smell of soil here,' he said, 'and the cattle back there are waiting for me.'
  - who: meena
    t: 'ನಿಮ್ಮಪ್ಪ ಹೇಳ್ತಿದ್ದ ಒಂದು ಮಾತು ನನಗೆ ಇನ್ನೂ ನೆನಪಿದೆ: ‘ನೆಲ ನಮ್ಮನ್ನ ಸಾಕುತ್ತೆ, ಅದಕ್ಕೇ ನಾವು ನೆಲನ ಸಾಕ್ಬೇಕು.’'
    tr: 'Nimmappa hēḷtidda ondu mātu nanage innū nenapide: ‘Nela nammanna sākutte, adakkē nāvu nelana sākbēku.’'
    en: 'I still remember something your father used to say: ''The land feeds us, so we have to take care of the land.'''
  - who: suresh
    t: ಹೌದು. ನಾನು ಬ್ಯಾಂಕ್ ಕೆಲಸಕ್ಕೆ ಬೆಂಗಳೂರಿಗೆ ಹೊರಟಾಗ ಒಂದು ವಾರ ನನ್ನ ಜೊತೆ ಮಾತೇ ಆಡಿರಲಿಲ್ಲ. ಆಮೇಲೆ ಊರಲ್ಲಿ ಎಲ್ಲರ ಮುಂದೆ ‘ನನ್ನ ಮಗ ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್’ ಅಂತ ಹೆಮ್ಮೆಯಿಂದ ಹೇಳ್ಕೊಳ್ತಿದ್ರು.
    tr: Haudu. Nānu byāṅk kelasakke Beṅgaḷūrige horaṭāga ondu vāra nanna jote mātē āḍiralilla. Āmēle ūralli ellara munde ‘nanna maga byāṅk myānējar’ anta hemmeyinda hēḷkoḷḷtidru.
    en: Yes. When I left for the bank job in Bengaluru, he didn't speak to me for a whole week. Later, in front of the whole village, he'd proudly tell everyone, 'My son is a bank manager.'
  - who: rakshith
    t: ಮಹದೇವ ಚಿಕ್ಕಪ್ಪ ಯಾಕೆ ಊರಲ್ಲೇ ಉಳ್ಕೊಂಡ್ರು? ಅವರೂ ಓದಿದ್ರಲ್ವಾ?
    tr: Mahadēva cikkappa yāke ūrallē uḷkoṇḍru? Avarū ōdidralvā?
    en: Why did Mahadeva Chikkappa stay back in the village? He studied too, didn't he?
  - who: suresh
    t: ಅವನು ಪಿಯುಸಿ ಮುಗಿಸಿದ್ದ. ಅದೇ ವರ್ಷ ಅಪ್ಪನ ಕಾಲು ಮುರಿದಿತ್ತು, ಕಬ್ಬು ಕಟಾವಿಗೆ ಬಂದಿತ್ತು. ಯಾರಾದ್ರೂ ಜಮೀನು ನೋಡ್ಕೋಬೇಕಿತ್ತು. ನಾನು ಆಗ್ಲೇ ಬೆಂಗಳೂರಲ್ಲಿದ್ದೆ. ಅವನು ಉಳ್ಕೊಂಡ. ಆಮೇಲೆ ಯಾವತ್ತೂ ಹೊರಗೆ ಬರ್ಲೇ ಇಲ್ಲ.
    tr: Avanu pi-yu-si mugisidda. Adē varṣa appana kālu muridittu, kabbu kaṭāvige bandittu. Yārādrū jamīnu nōḍkōbēkittu. Nānu āglē Beṅgaḷūralliddē. Avanu uḷkoṇḍa. Āmēle yāvattū horage barlē illa.
    en: He had finished his PUC. That same year Appa had broken his leg, and the sugarcane was ready for harvest. Someone had to look after the land. I was already in Bengaluru. He stayed. And after that he never came out.
  - who: meena
    t: ಅದಕ್ಕೇ ಅವರ ಮನಸ್ಸಲ್ಲಿ ಸ್ವಲ್ಪ ನೋವಿದೆ ಅನ್ಸುತ್ತೆ. ಇವತ್ತು ಆ ವಿಷಯ ಏನೂ ಎತ್ತಬೇಡಿ, ಸುರೇಶ್. ಅವರು ಒಬ್ಬರೇ ಅಪ್ಪನ್ನ ಆಸ್ಪತ್ರೆಗೆ ಕರ್ಕೊಂಡು ಹೋಗಿದಾರೆ.
    tr: Adakkē avara manassalli svalpa nōvide ansutte. Ivattu ā viṣaya ēnū ettabēḍi, Surēś. Avaru obbarē appanna āspatrege karkoṇḍu hōgidāre.
    en: That's why I think there's some hurt in his heart. Don't bring any of that up today, Suresh. He took your father to the hospital all on his own.
  - who: suresh
    t: ನಾನ್ಯಾಕೆ ಎತ್ತಲಿ? … ನೋಡು, ಮದ್ದೂರು ಎಕ್ಸಿಟ್ ಬಂತು. ಇನ್ನು ಹದಿನೈದು ಕಿಲೋಮೀಟರ್ ಅಷ್ಟೇ.
    tr: Nānyāke ettali? … Nōḍu, Maddūru eksiṭ bantu. Innu hadinaidu kilōmīṭar aṣṭē.
    en: Why would I bring it up? … Look, here's the Maddur exit. Just fifteen more kilometres.
  - who: rakshith
    t: ಅಪ್ಪಾ, ಅಲ್ಲಿ ಏನು ಮಾಡ್ಬೇಕು, ಏನು ಹೇಳ್ಬೇಕು ಅಂತ ನನಗೆ ಗೊತ್ತಿಲ್ಲ. ಯಾರಾದ್ರೂ ಮಾತಾಡಿಸಿದ್ರೆ?
    tr: Appā, alli ēnu māḍbēku, ēnu hēḷbēku anta nanage gottilla. Yārādrū mātāḍisidre?
    en: Appa, I don't know what to do there or what to say. What if somebody talks to me?
  - who: meena
    t: ಜಾಸ್ತಿ ಮಾತಾಡೋದು ಬೇಡ. ದೊಡ್ಡವರ ಕಾಲು ಮುಟ್ಟಿ ನಮಸ್ಕಾರ ಮಾಡು. ಯಾರಾದ್ರೂ ಏನಾದ್ರೂ ಕೇಳಿದ್ರೆ ‘ಹೌದು, ತುಂಬಾ ಬೇಜಾರಾಗಿದೆ’ ಅಂದ್ರೆ ಸಾಕು. ಅಜ್ಜಿ ಪಕ್ಕ ಕೂತ್ಕೋ, ಅದೇ ದೊಡ್ಡ ಸಹಾಯ.
    tr: Jāsti mātāḍōdu bēḍa. Doḍḍavara kālu muṭṭi namaskāra māḍu. Yārādrū ēnādrū kēḷidre ‘haudu, tumbā bējārāgide’ andre sāku. Ajji pakka kūtkō, adē doḍḍa sahāya.
    en: You don't need to say much. Touch the elders' feet and greet them. If anyone asks you anything, just say, 'Yes, it's very sad.' Sit beside Ajji; that's the biggest help.
  - who: rakshith
    t: ಸರಿ ಅಮ್ಮ. … ಅಪ್ಪಾ, ನೀವು ಇನ್ನೂ ಒಂದು ಸಲಾನೂ ಅತ್ತಿಲ್ಲ.
    tr: Sari amma. … Appā, nīvu innū ondu salānū attilla.
    en: OK, Amma. … Appa, you haven't cried even once yet.
  - who: suresh
    t: ದೊಡ್ಡ ಮಗ ಅಳೋಕೆ ಮುಂಚೆ ಮಾಡ್ಬೇಕಾದ ಕೆಲಸ ಎಲ್ಲಾ ಮುಗಿಸ್ಬೇಕು ಅಂತ ನಮ್ಮಪ್ಪಾನೇ ಹೇಳ್ಕೊಟ್ಟಿದ್ರು, ಕಣೋ. ಅಳೋದು ಆಮೇಲೆ.
    tr: Doḍḍa maga aḷōke mun̄ce māḍbēkāda kelasa ellā mugisbēku anta nammappānē hēḷkoṭṭidru, kaṇō. Aḷōdu āmēle.
    en: My father himself taught me that the eldest son must finish everything that has to be done before he cries, son. The crying comes later.
  - section: The house in Bettahalli
    learn: 'condolence formulas: ātmakke śānti sigli, dēvru śakti koḍli, nāvellā idīvi · Avva''s rural speech: bandyā kaṇappa, kaṇavva, battāḷe · respectful address: Gauḍre, Surēśappa · death words: maṇṇu māḍōdu, cikkōnu, horaṭōda, bāḷida'
  - scene: Before dawn, Wednesday 10 December. The old tiled house in Bettahalli, Maddur taluk. Thatha, Channegowda, lies on a mat in the front hall with a garland of marigolds round his neck and an oil lamp burning by his head. Village women sit around Avva. Men stand in the yard in the cold.
  - who: avva
    t: ಸುರೇಸಾ… ಬಂದ್ಯಾ ಕಣಪ್ಪ… ನೋಡು ನಿಮ್ಮಪ್ಪನ್ನ. ಮಾತೇ ಆಡ್ತಿಲ್ಲ. ‘ಪುಟ್ಟಮ್ಮ, ನಾಳೆ ಬೇಗ ಗದ್ದೆಗೆ ಹೋಗ್ಬೇಕು, ಐದು ಗಂಟೆಗೆ ಎಬ್ಬಿಸು’ ಅಂದಿದ್ರು. ಈಗ ಯಾರ್ನ ಎಬ್ಬಿಸ್ಲಿ?
    tr: Surēsā… bandyā kaṇappa… nōḍu nimmappanna. Mātē āḍtilla. ‘Puṭṭamma, nāḷe bēga gaddege hōgbēku, aidu gaṇṭege ebbisu’ andidru. Īga yārna ebbisli?
    en: Suresha… you've come, my son… look at your father. He won't say a word. He'd told me, 'Puttamma, I have to go to the paddy field early tomorrow, wake me at five.' Whom do I wake now?
  - who: suresh
    t: ಅವ್ವಾ… ನಾನು ಬಂದೆ. ಸಮಾಧಾನ ಮಾಡ್ಕೊ ಅವ್ವ. ನಾವೆಲ್ಲಾ ಇದೀವಿ.
    tr: Avvā… nānu bande. Samādhāna māḍko avva. Nāvellā idīvi.
    en: Avva… I'm here. Try to calm yourself, Avva. We're all here.
  - who: avva
    t: ಐವತ್ತೆರಡು ವರ್ಷ ಕಣಪ್ಪ ಅವರ ಜೊತೆ ಬಾಳಿದೆ. ಹದಿನೆಂಟು ವರ್ಷದವಳಾಗಿ ಈ ಮನೆಗೆ ಕಾಲಿಟ್ಟೆ. ಒಂದು ಮಾತೂ ಹೇಳ್ದೆ ಹೊರಟೋದ್ರು ನೋಡು.
    tr: Aivatteraḍu varṣa kaṇappa avara jote bāḷide. Hadineṇṭu varṣadavaḷāgi ī manege kāliṭṭe. Ondu mātū hēḷde horaṭōdru nōḍu.
    en: Fifty-two years I lived with him, son. I stepped into this house at eighteen. And look, he's gone without saying a single word.
  - who: meena
    t: ಅತ್ತೆ, ಸ್ವಲ್ಪ ನೀರು ಕುಡೀರಿ. ರಾತ್ರಿಯಿಂದ ನೀವು ಏನೂ ತಿಂದಿಲ್ಲ ಅಂತ ಪಕ್ಕದ್ಮನೆ ಅಕ್ಕ ಹೇಳಿದ್ರು.
    tr: Atte, svalpa nīru kuḍīri. Rātriyinda nīvu ēnū tindilla anta pakkadmane akka hēḷidru.
    en: Atte, drink a little water. The lady next door says you haven't eaten anything since last night.
  - who: avva
    t: ತಿನ್ನೋಕೆ ಮನಸ್ಸೇ ಇಲ್ಲ ಕಣವ್ವ. ರಕ್ಷಿತ್ ಬಂದ್ನಾ? ಬಾರಪ್ಪ ಇಲ್ಲಿ. ನಿಮ್ ತಾತ ನಿನ್ನೆ ಕೂಡ ನಿನ್ ಬಗ್ಗೆನೇ ಮಾತಾಡ್ತಿದ್ರು, ‘ನನ್ ಮೊಮ್ಮಗ ಡಾಕ್ಟರ್ ಆಗ್ತಾನೆ’ ಅಂತ.
    tr: Tinnōke manassē illa kaṇavva. Rakṣit bandnā? Bārappa illi. Nim tāta ninne kūḍa nin baggenē mātāḍtidru, ‘nan mommaga ḍākṭar āgtāne’ anta.
    en: 'I''ve no heart to eat, dear. Has Rakshith come? Come here, child. Your grandfather was talking about you just yesterday: ''My grandson is going to be a doctor.'''
  - who: rakshith
    t: ಅಜ್ಜಿ… ನಾನು ಇಲ್ಲೇ ಇದೀನಿ. ನಿಮ್ ಪಕ್ಕಾನೇ ಕೂತ್ಕೋತೀನಿ.
    tr: Ajji… nānu illē idīni. Nim pakkānē kūtkōtīni.
    en: Ajji… I'm right here. I'll sit next to you.
  - who: mahadeva
    t: ಅಣ್ಣ, ಬಂದ್ಯಾ. ಒಳ್ಳೇದಾಯ್ತು. ಊರಿನೋರೆಲ್ಲಾ ರಾತ್ರಿಯಿಂದ ಬತ್ತಾನೇ ಇದಾರೆ. ತಿಮ್ಮೇಗೌಡ್ರು ಬಂದಿದಾರೆ, ಹೊರಗೆ ಕುಂತಿದಾರೆ.
    tr: Aṇṇa, bandyā. Oḷḷēdāytu. Ūrinōrellā rātriyinda battānē idāre. Timmēgauḍru bandidāre, horage kuntidāre.
    en: Anna, you've come. Good. People from the village have been coming all night. Thimmegowda has come; he's sitting outside.
  - who: suresh
    t: ಮಹದೇವ… ನೀನು ರಾತ್ರಿಯೆಲ್ಲಾ ಒಬ್ಬನೇ ಎಲ್ಲಾ ನೋಡ್ಕೊಂಡೆ. ಏನಾದ್ರೂ ತಿಂದ್ಯಾ?
    tr: Mahadēva… nīnu rātriyellā obbanē ellā nōḍkoṇḍe. Ēnādrū tindyā?
    en: (holding his brother) Mahadeva… you handled everything all night on your own. Have you eaten anything?
  - who: mahadeva
    t: ತಿನ್ನೋದು ಆಮೇಲೆ. ಮಣ್ಣು ಮಾಡೋದು ಎಷ್ಟೊತ್ತಿಗೆ ಅಂತ ತೀರ್ಮಾನ ಮಾಡ್ಬೇಕು. ಶೋಭ ಬರೋವರ್ಗೂ ಕಾಯ್ಬೇಕು ಅಲ್ವಾ.
    tr: Tinnōdu āmēle. Maṇṇu māḍōdu eṣṭottige anta tīrmāna māḍbēku. Śōbha barōvargū kāybēku alvā.
    en: Eating can wait. We have to decide what time the burial will be. We have to wait till Shobha comes, don't we.
  - who: elder
    t: ಸುರೇಶಪ್ಪ, ಬಾ ಇಲ್ಲಿ. … ಚನ್ನೇಗೌಡ ನನಗಿಂತ ನಾಲ್ಕು ವರ್ಷ ಚಿಕ್ಕೋನು. ನಾನು ಇನ್ನೂ ಕೋಲು ಹಿಡ್ಕಂಡು ಕುಂತಿದೀನಿ, ಅವ್ನು ಮುಂಚೆನೇ ಹೊರಟೋದ. ದೇವರ ಲೆಕ್ಕ ಯಾರಿಗೂ ಅರ್ಥ ಆಗಲ್ಲ.
    tr: Surēśappa, bā illi. … Cannēgauḍa nanaginta nālku varṣa cikkōnu. Nānu innū kōlu hiḍkaṇḍu kuntidīni, avnu mun̄cenē horaṭōda. Dēvara lekka yārigū artha āgalla.
    en: Suresh, my boy, come here. … Channegowda was four years younger than me. I'm still sitting here holding my stick, and he's gone ahead of me. Nobody understands God's accounts.
  - who: suresh
    t: ನಮಸ್ಕಾರ ತಿಮ್ಮೇಗೌಡ್ರೇ. ನೀವು ಬಂದಿದ್ದು ಅಪ್ಪಂಗೆ ಸಿಕ್ಕಿದ ಗೌರವ. ಅವರು ಯಾವಾಗಲೂ ‘ಏನೇ ಇದ್ರೂ ತಿಮ್ಮಣ್ಣನ್ನ ಕೇಳಿ ಮಾಡು’ ಅಂತಿದ್ರು.
    tr: Namaskāra Timmēgauḍrē. Nīvu bandiddu appaṅge sikkida gaurava. Avaru yāvāgalū ‘ēnē idrū Timmaṇṇanna kēḷi māḍu’ antidru.
    en: Namaskara, Thimmegowda. Your coming here is an honour to Appa. He always used to say, 'Whatever it is, ask Thimmanna before you do it.'
  - who: elder
    t: ಅವ್ನ ಆತ್ಮಕ್ಕೆ ಶಾಂತಿ ಸಿಗ್ಲಿ. ನಿಮ್ಮವ್ವಂಗೆ ದೇವ್ರು ಶಕ್ತಿ ಕೊಡ್ಲಿ. ಇವತ್ತು ದುಃಖದ ದಿನ, ಆದ್ರೆ ಮಾಡ್ಬೇಕಾದ್ದು ಸರಿಯಾಗಿ ಮಾಡ್ಬೇಕು. ಹೊತ್ತು ಮೀರೋದು ಬೇಡ, ಮಧ್ಯಾಹ್ನದೊಳಗೆ ಮಣ್ಣು ಮಾಡಿ.
    tr: Avna ātmakke śānti sigli. Nimmavvaṅge dēvru śakti koḍli. Ivattu duḥkhada dina, ādre māḍbēkāddu sariyāgi māḍbēku. Hottu mīrōdu bēḍa, madhyāhnadoḷage maṇṇu māḍi.
    en: May his soul find peace. May God give your mother strength. Today is a day of grief, but what must be done has to be done properly. Don't let it get late; finish the burial before midday.
  - who: mahadeva
    t: ಅಪ್ಪ ಮುಂಚೇನೇ ಹೇಳಿದ್ರು, ‘ನನ್ನ ನಮ್ಮ ಹೊಲದಲ್ಲೇ, ಆ ಹುಣಸೆ ಮರದ ಕೆಳಗೆ ಮಲಗಿಸಿ’ ಅಂತ. ಅದನ್ನೇ ಮಾಡ್ತೀವಿ.
    tr: Appa mun̄cēnē hēḷidru, ‘nanna namma holadallē, ā huṇase marada keḷage malagisi’ anta. Adannē māḍtīvi.
    en: Appa had told us long ago, 'Lay me in our own field, under that tamarind tree.' That's exactly what we'll do.
  - who: elder
    t: ಸರಿಯಾದ ಮಾತು. ಬೆವರು ಸುರಿಸಿದ ನೆಲದಲ್ಲೇ ಮಲಗೋದು ರೈತನಿಗೆ ದೊಡ್ಡ ಭಾಗ್ಯ.
    tr: Sariyāda mātu. Bevaru surisida neladallē malagōdu raitanige doḍḍa bhāgya.
    en: Well said. For a farmer, to lie in the very soil he poured his sweat into is a great blessing.
  - who: shobha
    t: ಅವ್ವಾ…! ಅಪ್ಪಾ… ಒಂದು ಮಾತು ಹೇಳ್ಬಾರದಿತ್ತಾ? ನಾನು ಬರೋವರ್ಗೂ ಕಾಯ್ಬಾರದಿತ್ತಾ?
    tr: Avvā…! Appā… ondu mātu hēḷbāradittā? Nānu barōvargū kāybāradittā?
    en: (running in) Avva…! Appa… couldn't you have said one word? Couldn't you have waited until I came?
  - who: avva
    t: ಬಂದ್ಯಾ ಮಗಳೇ… ನಿನ್ನೆ ನಿನ್ನನ್ನೇ ಕೇಳ್ತಿದ್ರು ಕಣೇ. ‘ಶೋಭ ಯಾವಾಗ ಬತ್ತಾಳೆ, ಸಂಕ್ರಾಂತಿಗೆ ಬತ್ತಾಳಾ’ ಅಂತ.
    tr: Bandyā magaḷē… ninne ninnannē kēḷtidru kaṇē. ‘Śōbha yāvāga battāḷe, saṅkrāntige battāḷā’ anta.
    en: You've come, my daughter… only yesterday he was asking about you, dear. 'When is Shobha coming? Will she come for Sankranti?'
  - who: shobha
    t: ನಾನು ಬಂದಿದೀನಿ ಅವ್ವ. ಇನ್ನು ಕೆಲವು ದಿನ ಇಲ್ಲೇ ಇರ್ತೀನಿ, ನಿನ್ನ ಜೊತೆ. ಆಸ್ಪತ್ರೆಗೆ ರಜೆ ಹಾಕಿದೀನಿ.
    tr: Nānu bandidīni avva. Innu kelavu dina illē irtīni, ninna jote. Āspatrege raje hākidīni.
    en: I'm here, Avva. I'll stay here with you for some days now. I've taken leave from the hospital.
  - section: I am the one who stayed
    learn: 'the first quarrel: iddōnu nānē, nīvu habbakke bandu hōgtidri · rhetorical questions: hēḷidre ēn māḍtidde? · peace-making: sāku, ibbrū; ivattu ī mātu bēḍa · funeral customs: tamaṭe, caṭṭa, hegalu koḍu, ‘hōgi banni’ is never said'
  - scene: Late morning. In the yard the drummers have arrived and the bamboo bier is being tied. Suresh, Mahadeva and Shobha stand apart, near the cattle shed.
  - who: shobha
    t: ಮಹದೇವ, ಒಂದು ಮಾತು ಕೇಳ್ಬೇಕು. ಅಪ್ಪಂಗೆ ಕಳೆದ ವಾರದಿಂದಲೇ ಸುಸ್ತು ಆಗ್ತಿತ್ತು ಅಂತ ಅವ್ವ ಹೇಳ್ತಿದ್ದಾರೆ. ಯಾಕೆ ಯಾರೂ ನಮಗೆ ಹೇಳ್ಲಿಲ್ಲ?
    tr: Mahadēva, ondu mātu kēḷbēku. Appaṅge kaḷeda vāradindalē sustu āgtittu anta avva hēḷtiddāre. Yāke yārū namage hēḷlilla?
    en: Mahadeva, I need to ask you something. Avva says Appa had been feeling exhausted since last week. Why did nobody tell us?
  - who: mahadeva
    t: ಹೇಳಿದ್ರೆ ಏನ್ ಮಾಡ್ತಿದ್ದೆ? ಮೈಸೂರಿಂದ ಬಂದು ಬಿಪಿ ನೋಡ್ತಿದ್ದ್ಯಾ? ಅವ್ರು ಯಾರ್ ಮಾತೂ ಕೇಳ್ತಿರ್ಲಿಲ್ಲ. ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಎದ್ದು ಹಸುಗಳ ಹಾಲು ಕರೀತಿದ್ರು, ಮಧ್ಯಾಹ್ನದವರ್ಗೂ ಗದ್ದೇಲಿ ಇರ್ತಿದ್ರು.
    tr: Hēḷidre ēn māḍtidde? Maisūrinda bandu bi-pi nōḍtiddyā? Avru yār mātū kēḷtirlilla. Beḷigge aidakke eddu hasugaḷa hālu karītidru, madhyāhnadavargū gaddēli irtidru.
    en: And if we had, what would you have done? Come from Mysuru to check his BP? He didn't listen to anyone. He'd be up at five milking the cows and out in the paddy field till noon.
  - who: suresh
    t: ಶೋಭಾ ಕೇಳಿದ್ದು ತಪ್ಪಲ್ಲ, ಮಹದೇವ. ನಾವೂ ಅವರ ಮಕ್ಕಳೇ. ಒಂದು ಫೋನ್ ಮಾಡಿದ್ರೆ ಬೆಂಗಳೂರಲ್ಲಿ ಒಳ್ಳೆ ಡಾಕ್ಟರ್ ಹತ್ರ ತೋರಿಸ್ತಿದ್ವಿ.
    tr: Śōbhā kēḷiddu tappalla, Mahadēva. Nāvū avara makkaḷē. Ondu phōn māḍidre Beṅgaḷūralli oḷḷe ḍākṭar hatra tōristidvi.
    en: Shobha isn't wrong to ask, Mahadeva. We're his children too. One phone call and we'd have shown him to a good doctor in Bengaluru.
  - who: mahadeva
    t: ಬೆಂಗಳೂರು! ಯಾವಾಗ್ಲೂ ಬೆಂಗಳೂರು. ಅಣ್ಣ, ಇಪ್ಪತ್ತು ವರ್ಷದಿಂದ ಇಲ್ಲಿ ಇದ್ದೋನು ನಾನು. ಮಳೆ ಬರದೇ ಇದ್ದಾಗ, ಕಬ್ಬಿನ ದುಡ್ಡು ಬರದೇ ಇದ್ದಾಗ, ಅಪ್ಪಂಗೆ ಜ್ವರ ಬಂದಾಗ — ಇದ್ದೋನು ನಾನೇ. ನೀವು ಹಬ್ಬಕ್ಕೆ ಎರಡು ದಿನ ಬಂದು ಹೋಗ್ತಿದ್ರಿ.
    tr: Beṅgaḷūru! Yāvāglū Beṅgaḷūru. Aṇṇa, ippattu varṣadinda illi iddōnu nānu. Maḷe barade iddāga, kabbina duḍḍu barade iddāga, appaṅge jvara bandāga — iddōnu nānē. Nīvu habbakke eraḍu dina bandu hōgtidri.
    en: Bengaluru! Always Bengaluru. Anna, the one who's been here for twenty years is me. When the rain didn't come, when the cane money didn't come, when Appa had fever — the one who was here was me. You people came for two days at festival time and left.
  - who: shobha
    t: ಅಂದ್ರೆ ನಾವು ಅಪ್ಪನ್ನ ಪ್ರೀತಿಸ್ತಿರ್ಲಿಲ್ಲ ಅಂತಾನಾ? ನನಗೆ ಮದುವೆ ಮಾಡಿ ಮೈಸೂರಿಗೆ ಕಳಿಸಿದ್ದು ನೀವೇ, ನಾನಾಗಿ ಹೋಗ್ಲಿಲ್ಲ.
    tr: Andre nāvu appanna prītistirlilla antānā? Nanage maduve māḍi Maisūrige kaḷisiddu nīvē, nānāgi hōglilla.
    en: So you mean we didn't love Appa? It was all of you who married me off and sent me to Mysuru; I didn't go of my own accord.
  - who: suresh
    t: ಸಾಕು, ಇಬ್ರೂ. ಒಳಗೆ ಅಪ್ಪ ಮಲಗಿದಾರೆ, ಹೊರಗೆ ಊರಿನೋರು ನಿಂತಿದಾರೆ. ಇವತ್ತು ಈ ಮಾತು ಬೇಡ.
    tr: Sāku, ibbrū. Oḷage appa malagidāre, horage ūrinōru nintidāre. Ivattu ī mātu bēḍa.
    en: Enough, both of you. Appa is lying inside, and the whole village is standing outside. Not this talk today.
  - who: mahadeva
    t: ಶೋಭ ಕೇಳಿದ್ಲು, ಅದಕ್ಕೆ ಹೇಳ್ದೆ ಅಷ್ಟೇ. … ನನ್ ಮಾತು ತಪ್ಪು ತಿಳ್ಕೋಬೇಡ ಶೋಭ. ರಾತ್ರಿ ಅವ್ರು ನನ್ ಪಕ್ಕದಲ್ಲೇ ಉಸಿರು ಬಿಟ್ರು. ಆ ಕಾರ್ ಸೀಟು ಇನ್ನೂ ನನ್ ಕಣ್ಣ ಮುಂದೇನೇ ಇದೆ.
    tr: Śōbha kēḷidlu, adakke hēḷde aṣṭē. … Nan mātu tappu tiḷkōbēḍa Śōbha. Rātri avru nan pakkadallē usiru biṭru. Ā kār sīṭu innū nan kaṇṇa mundēnē ide.
    en: Shobha asked, so I answered, that's all. … Don't take what I said the wrong way, Shobha. Last night he breathed his last right beside me. I can still see that car seat in front of my eyes.
  - who: shobha
    t: ಗೊತ್ತು. ನಿನಗೆ ತುಂಬಾ ಕಷ್ಟ ಆಗಿರುತ್ತೆ. ನಾನೂ ಜೋರಾಗಿ ಮಾತಾಡ್ಬಾರದಿತ್ತು. ಕ್ಷಮಿಸು.
    tr: Gottu. Ninage tumbā kaṣṭa āgirutte. Nānū jōrāgi mātāḍbāradittu. Kṣamisu.
    en: I know. It must have been terribly hard for you. I shouldn't have raised my voice either. Forgive me.
  - who: elder
    t: ಮಕ್ಕಳೇ, ತಮಟೆಯೋರು ಬಂದಿದಾರೆ. ಚಟ್ಟ ರೆಡಿ ಆಗಿದೆ. ದೊಡ್ಡ ಮಗ ಮುಂದೆ ನಿಲ್ಬೇಕು. ಸುರೇಶಪ್ಪ, ಬಾ.
    tr: Makkaḷē, tamaṭeyōru bandidāre. Caṭṭa reḍi āgide. Doḍḍa maga munde nilbēku. Surēśappa, bā.
    en: Children, the drummers have come. The bier is ready. The eldest son must stand in front. Suresh, come.
  - who: mahadeva
    t: ಅಣ್ಣಾನೇ ಮಾಡ್ಲಿ. ಅದು ದೊಡ್ಡ ಮಗನ ಹಕ್ಕು. ನನಗೆ ಏನೂ ಬೇಡ.
    tr: Aṇṇānē māḍli. Adu doḍḍa magana hakku. Nanage ēnū bēḍa.
    en: Let Anna do it. That's the eldest son's right. I don't want anything.
  - who: suresh
    t: ಇಲ್ಲ, ಮಹದೇವ. ನಾವಿಬ್ರೂ ಸೇರಿ ಮಾಡೋಣ. ಅಪ್ಪನ್ನ ಕೊನೇ ಸಲ ಹೆಗಲ ಮೇಲೆ ಹೊರೋಕೆ ನಿನಗೂ ಅಷ್ಟೇ ಹಕ್ಕಿದೆ.
    tr: Illa, Mahadēva. Nāvibbrū sēri māḍōṇa. Appanna konē sala hegala mēle horōke ninagū aṣṭē hakkide.
    en: No, Mahadeva. We'll do it together, the two of us. You have just as much right to carry Appa on your shoulder one last time.
  - who: elder
    t: ಹಂಗೇ ಮಾಡಿ. ಅಣ್ಣ-ತಮ್ಮ ಸೇರಿ ಹೆಗಲು ಕೊಟ್ರೆ ಅದೇ ಚನ್ನೇಗೌಡಂಗೆ ಖುಷಿ.
    tr: Haṅgē māḍi. Aṇṇa-tamma sēri hegalu koṭre adē Cannēgauḍaṅge khuṣi.
    en: Do just that. If the brothers give their shoulders together, that's what would make Channegowda happiest.
  - who: rakshith
    t: ಅಮ್ಮ, ನಾನೂ ಹೆಗಲು ಕೊಡ್ಬಹುದಾ? ತಾತನ್ನ ಹೊಲದವರೆಗೂ…
    tr: Amma, nānū hegalu koḍbahudā? Tātanna holadavaregū…
    en: Amma, can I give my shoulder too? Carry Thatha as far as the field…
  - who: meena
    t: ಕೊಡು ಕಂದ. ನಿಮ್ಮಪ್ಪನ ಪಕ್ಕ ನಿಂತ್ಕೋ. ನಿಧಾನವಾಗಿ ನಡಿ, ಹಿಂದೆ ತಿರುಗಿ ನೋಡ್ಬೇಡ.
    tr: Koḍu kanda. Nimmappana pakka nintkō. Nidhānavāgi naḍi, hinde tirugi nōḍbēḍa.
    en: Yes, my love. Stand next to your father. Walk slowly, and don't turn and look back.
  - who: avva
    t: ‘ಹೋಗಿ ಬನ್ನಿ’ ಅನ್ನೋ ಹಂಗಿಲ್ಲ ಕಣ್ರಪ್ಪ… ಹೋಗಿ. ನಿಧಾನಕ್ಕೆ ಕರ್ಕಂಡು ಹೋಗಿ. ಅವ್ರಿಗೆ ಆ ಹುಣಸೆ ಮರದ ನೆರಳು ಅಂದ್ರೆ ತುಂಬಾ ಇಷ್ಟ.
    tr: ‘Hōgi banni’ annō haṅgilla kaṇrappa… hōgi. Nidhānakke karkaṇḍu hōgi. Avrige ā huṇase marada neraḷu andre tumbā iṣṭa.
    en: (at the doorway) I can't even say 'go and come back', my sons… Go. Take him gently. He loved the shade of that tamarind tree.
  - chapter: Chapter 2 — The eleventh day
  - section: Milk under the tamarind tree
    learn: 'the third-day rite: hālu-tuppa biḍōdu, samādhi, eḍe iḍōdu · habitual past in memories: kuntu nōḍtidru, naḍītidri, antidri · warm Mandya address: kaṇappa, kaṇē, kaṇrappa · belief and respect: adu nambike, vāda bēḍa'
  - scene: Thursday, 11 December 2025, just after sunrise. The dryland field, under the tamarind tree. A fresh mound of earth marks Thatha's grave. The family has walked out from the house carrying a brass pot of milk, a small bowl of ghee and a plate of food covered with a banana leaf.
  - who: avva
    t: ಇಲ್ಲೇ ಕಣಪ್ಪ… ದಿನಾ ಬೆಳಿಗ್ಗೆ ಗದ್ದೆಗೆ ಹೋಗೋ ಮುಂಚೆ ಇದೇ ಮರದ ಕೆಳಗೆ ಐದು ನಿಮಿಷ ಕುಂತು ಆಕಾಶ ನೋಡ್ತಿದ್ರು. ‘ಮಳೆ ಬತ್ತದಾ ಇಲ್ವಾ ಅಂತ ಮೋಡನೇ ಹೇಳುತ್ತೆ’ ಅಂತಿದ್ರು.
    tr: Illē kaṇappa… dinā beḷigge gaddege hōgō mun̄ce idē marada keḷage aidu nimiṣa kuntu ākāśa nōḍtidru. ‘Maḷe battadā ilvā anta mōḍanē hēḷutte’ antidru.
    en: Right here, son… every morning before going to the paddy field he'd sit under this very tree for five minutes and look at the sky. 'The clouds themselves tell you whether the rain will come or not,' he used to say.
  - who: rakshith
    t: ಅಜ್ಜಿ, ಮೂರನೇ ದಿನ ನಾವು ಇಲ್ಲಿಗೆ ಯಾಕೆ ಬಂದಿದೀವಿ? ಹಾಲು ಯಾಕೆ ತಂದಿದೀರ?
    tr: Ajji, mūranē dina nāvu illige yāke bandidīvi? Hālu yāke tandidīra?
    en: Ajji, why have we come here on the third day? Why have you brought milk?
  - who: avva
    t: ಇದಕ್ಕೆ ಹಾಲು-ತುಪ್ಪ ಬಿಡೋದು ಅಂತಾರೆ ಕಣಪ್ಪ. ಮಣ್ಣು ಮಾಡಿದ ಮೂರನೇ ದಿನ ಮನೆಯೋರೆಲ್ಲಾ ಬಂದು ಸಮಾಧಿ ಮೇಲೆ ಹಾಲು, ತುಪ್ಪ ಬಿಡ್ತೀವಿ, ಹೋದೋರಿಗೆ ತಂಪಾಗ್ಲಿ ಅಂತ. ಅವ್ರಿಗೆ ಇಷ್ಟ ಆಗಿದ್ದ ತಿಂಡಿನೂ ಎಡೆ ಇಡ್ತೀವಿ.
    tr: Idakke hālu-tuppa biḍōdu antāre kaṇappa. Maṇṇu māḍida mūranē dina maneyōrellā bandu samādhi mēle hālu, tuppa biḍtīvi, hōdōrige tampāgli anta. Avrige iṣṭa āgidda tiṇḍinū eḍe iḍtīvi.
    en: This is called 'giving milk and ghee', child. On the third day after the burial the whole family comes and pours milk and ghee over the grave, so that the one who has gone may feel cool and at peace. We also lay out the food he liked as an offering.
  - who: rakshith
    t: ಎಡೆ ಅಂದ್ರೆ?
    tr: Eḍe andre?
    en: What does 'ede' mean?
  - who: meena
    t: ಎಡೆ ಅಂದ್ರೆ ಹೋದೋರಿಗೆ ಅಂತ ತೆಗೆದಿಡೋ ಊಟ, ದೇವರ ನೈವೇದ್ಯದ ಹಾಗೆ. ನೋಡು, ಅಜ್ಜಿ ತಾತಂಗೆ ಇಷ್ಟವಾದ ರಾಗಿ ರೊಟ್ಟಿ, ಕಾಯಿ ಚಟ್ನಿ ಮಾಡ್ಕೊಂಡು ಬಂದಿದಾರೆ.
    tr: Eḍe andre hōdōrige anta tegediḍō ūṭa, dēvara naivēdyada hāge. Nōḍu, ajji tātaṅge iṣṭavāda rāgi roṭṭi, kāyi caṭni māḍkoṇḍu bandidāre.
    en: An 'ede' is food set aside for the one who has passed, like an offering to God. Look, Ajji has made the ragi rotti and coconut chutney Thatha loved and brought them along.
  - who: mahadeva
    t: ಅಣ್ಣ, ಹಾಲು ನೀನು ಮೊದ್ಲು ಬಿಡು. ಆಮೇಲೆ ನಾನು, ಆಮೇಲೆ ಶೋಭ.
    tr: Aṇṇa, hālu nīnu modlu biḍu. Āmēle nānu, āmēle Śōbha.
    en: Anna, you pour the milk first. Then me, then Shobha.
  - who: suresh
    t: ಇಲ್ಲ, ಅವ್ವ ಮೊದ್ಲು. ಐವತ್ತೆರಡು ವರ್ಷ ಅವರ ಜೊತೆ ಇದ್ದೋರು ಅವ್ವ. ಬಾ ಅವ್ವ, ಕೈ ಹಿಡ್ಕೊಳ್ತೀನಿ.
    tr: Illa, avva modlu. Aivatteraḍu varṣa avara jote iddōru avva. Bā avva, kai hiḍkoḷḷtīni.
    en: No, Avva first. She's the one who was with him for fifty-two years. Come, Avva, I'll hold your hand.
  - who: avva
    t: ತಗಳಿ… ನಿಮ್ಮ ಗೌರಿ ಹಸುವಿನ ಹಾಲು. ಮೊನ್ನೆ ತಾನೇ ಕರು ಹಾಕ್ತು. ಹೆಣ್ಣು ಕರು. ನೀವು ನೋಡ್ಲೇ ಇಲ್ಲ.
    tr: Tagaḷi… nimma Gauri hasuvina hālu. Monne tānē karu hāktu. Heṇṇu karu. Nīvu nōḍlē illa.
    en: (pouring the milk) Take it… milk from your cow Gauri. She calved only the other day. A female calf. You never even saw it.
  - who: shobha
    t: ಅಪ್ಪಾ, ನಾನು ಚಿಕ್ಕವಳಿದ್ದಾಗ ನನ್ನನ್ನ ಹೆಗಲ ಮೇಲೆ ಕೂರಿಸ್ಕೊಂಡು ಇದೇ ಬದು ಮೇಲೆ ನಡೀತಿದ್ರಿ. ಬೀಳ್ತೀನಿ ಅಂತ ನಾನು ಅತ್ತಾಗ, ‘ನಾನಿರೋವರ್ಗೂ ನೀನು ಬೀಳಲ್ಲ ಮಗಳೇ’ ಅಂತಿದ್ರಿ.
    tr: Appā, nānu cikkavaḷiddāga nannanna hegala mēle kūriskoṇḍu idē badu mēle naḍītidri. Bīḷtīni anta nānu attāga, ‘nānirōvargū nīnu bīḷalla magaḷē’ antidri.
    en: Appa, when I was little you used to carry me on your shoulders along this very bund. When I cried that I'd fall, you'd say, 'As long as I'm here, you won't fall, my girl.'
  - who: mahadeva
    t: ಆ ಮಾತು ಅವ್ರು ನಿಜ ಮಾಡಿದ್ರು. ನಿನ್ ಮದುವೆಗೆ ಸಾಲ ಮಾಡಿದ್ರೂ ಊರಲ್ಲಿ ಯಾರ್ ಮುಂದೂ ತಲೆ ತಗ್ಗಿಸ್ಲಿಲ್ಲ.
    tr: Ā mātu avru nija māḍidru. Nin maduvege sāla māḍidrū ūralli yār mundū tale taggislilla.
    en: He kept that promise. Even though he borrowed money for your wedding, he never bowed his head before anyone in the village.
  - who: shobha
    t: ಗೊತ್ತು ಮಹದೇವ. ಅದನ್ನ ನಾನು ಯಾವತ್ತೂ ಮರೆತಿಲ್ಲ.
    tr: Gottu Mahadēva. Adanna nānu yāvattū maretilla.
    en: (quietly) I know, Mahadeva. I have never forgotten that.
  - who: suresh
    t: ರಕ್ಷಿತ್, ಬಾ. ನೀನೂ ಸ್ವಲ್ಪ ಹಾಲು ಬಿಡು. ಮೊಮ್ಮಕ್ಕಳಲ್ಲಿ ನೀನೇ ದೊಡ್ಡೋನು.
    tr: Rakṣit, bā. Nīnū svalpa hālu biḍu. Mommakkaḷalli nīnē doḍḍōnu.
    en: Rakshith, come. You pour a little milk too. You're the eldest of the grandchildren.
  - who: rakshith
    t: ತಾತ… ಸಂಕ್ರಾಂತಿಗೆ ನಾನು ಬರ್ತೀನಿ. ನೀವು ಹೇಳ್ಕೊಡ್ಬೇಕಾಗಿದ್ದನ್ನ ಚಿಕ್ಕಪ್ಪನ ಹತ್ರ ಕಲೀತೀನಿ. ಮಾತು ಕೊಡ್ತೀನಿ.
    tr: Tāta… saṅkrāntige nānu bartīni. Nīvu hēḷkoḍbēkāgiddanna cikkappana hatra kalītīni. Mātu koḍtīni.
    en: Thatha… I'll come for Sankranti. What you were going to teach me, I'll learn from Chikkappa. I promise.
  - who: mahadeva
    t: ಬಾರಪ್ಪ, ಕಲಿಸ್ತೀನಿ. ದನಗಳ ಕೊಂಬಿಗೆ ಬಣ್ಣ ಹಚ್ಚೋದು ಅಷ್ಟೇ ಅಲ್ಲ, ನೇಗಿಲು ಹಿಡಿಯೋದೂ ಕಲಿಸ್ತೀನಿ. ಚನ್ನೇಗೌಡ್ರ ಮೊಮ್ಮಗ ಅಂದ್ಮೇಲೆ ಮಣ್ಣು ಮುಟ್ಟಲೇಬೇಕು.
    tr: Bārappa, kalistīni. Danagaḷa kombige baṇṇa haccōdu aṣṭē alla, nēgilu hiḍiyōdū kalistīni. Cannēgauḍra mommaga andmēle maṇṇu muṭṭalēbēku.
    en: Come, lad, I'll teach you. Not just painting the cattle's horns — I'll teach you to hold a plough too. If you're Channegowda's grandson, you have to touch the soil.
  - who: avva
    t: ಕಾಗೆ ಬಂತು ನೋಡಿ… ಎಡೆ ಮುಟ್ತು. ಅವ್ರಿಗೆ ತೃಪ್ತಿ ಆಯ್ತು ಕಣ್ರಪ್ಪ. ನಡೀರಿ, ಮನೆಗೆ ಹೋಗೋಣ.
    tr: Kāge bantu nōḍi… eḍe muṭtu. Avrige tṛpti āytu kaṇrappa. Naḍīri, manege hōgōṇa.
    en: Look, a crow has come… it has touched the offering. He is satisfied, my children. Come, let's go home.
  - who: rakshith
    t: ಅಮ್ಮ, ಕಾಗೆ ಮುಟ್ಟಿದ್ರೆ ತಾತಂಗೆ ತೃಪ್ತಿ ಆಯ್ತು ಅಂತಾನಾ?
    tr: Amma, kāge muṭṭidre tātaṅge tṛpti āytu antānā?
    en: (whispering) Amma, does a crow touching it really mean Thatha is satisfied?
  - who: meena
    t: ಅದು ನಂಬಿಕೆ ಕಂದ. ನಂಬಿಕೆ ಬಗ್ಗೆ ಇವತ್ತು ವಾದ ಬೇಡ. ಅಜ್ಜಿ ಮುಖ ನೋಡು, ಮೂರು ದಿನದಲ್ಲಿ ಮೊದಲ ಸಲ ಸ್ವಲ್ಪ ಸಮಾಧಾನ ಕಾಣ್ತಿದೆ. ಅಷ್ಟು ಸಾಕು.
    tr: Adu nambike kanda. Nambike bagge ivattu vāda bēḍa. Ajji mukha nōḍu, mūru dinadalli modala sala svalpa samādhāna kāṇtide. Aṣṭu sāku.
    en: That's a belief, my love. No arguments about beliefs today. Look at Ajji's face — for the first time in three days there's a little peace in it. That's enough.
  - section: The eleventh-day feast
    learn: 'ritual words: tithi, vaikuṇṭha samārādhane, sūtaka, piṇḍa, kūdalu tegesōdu · feast words: paṅkti, baḍisu, eleaḍike, mudde toḷasōdu, avarekāḷu sāru · hosting: saṅkōca bēḍa, hoṭṭe tumbā ūṭa māḍi · blessings and proverb: kūḍi bāḷidare svarga sukha'
  - scene: Friday, 19 December 2025. The eleventh day. A canvas canopy has been put up in the yard. Thatha's photograph, garlanded, stands on a chair in the front hall with an oil lamp before it. Suresh and Mahadeva have had their heads shaved. Behind the house, hired cooks stir huge copper pots over wood fires. The village priest has arrived.
  - who: priest
    t: ಸುರೇಶ್, ಮಹದೇವ, ಇಬ್ರೂ ಇಲ್ಲಿ ಕೂತ್ಕೊಳ್ಳಿ. ಇವತ್ತು ಹನ್ನೊಂದನೇ ದಿನದ ಕಾರ್ಯ. ಕೆಲವರು ಇದನ್ನ ವೈಕುಂಠ ಸಮಾರಾಧನೆ ಅಂತಾರೆ, ನಮ್ಮ ಕಡೆ ಹೆಚ್ಚಾಗಿ ತಿಥಿ ಅಂತೀವಿ. ಇವತ್ತಿಗೆ ಮನೆಯ ಸೂತಕ ಮುಗಿಯುತ್ತೆ.
    tr: Surēś, Mahadēva, ibbrū illi kūtkoḷḷi. Ivattu hannondanē dinada kārya. Kelavaru idanna vaikuṇṭha samārādhane antāre, namma kaḍe heccāgi tithi antīvi. Ivattige maneya sūtaka mugiyutte.
    en: Suresh, Mahadeva, both of you sit here. Today is the eleventh-day rite. Some call it Vaikuntha Samaradhane; round here we mostly call it the tithi. With today, the household's period of mourning impurity comes to an end.
  - who: suresh
    t: ಆಯ್ತು ಸ್ವಾಮಿ. ಏನೇನು ಮಾಡ್ಬೇಕು ಅಂತ ನೀವೇ ಹೇಳಿ. ನಮಗೆ ಎಲ್ಲಾ ಗೊತ್ತಿಲ್ಲ. ಮನೇಲಿ ಇಂಥ ಕಾರ್ಯ ಏನೇ ಇದ್ರೂ ಅಪ್ಪಾನೇ ಮುಂದೆ ನಿಂತು ನೋಡ್ಕೊಳ್ತಿದ್ರು.
    tr: Āytu svāmi. Ēnēnu māḍbēku anta nīvē hēḷi. Namage ellā gottilla. Manēli intha kārya ēnē idrū appānē munde nintu nōḍkoḷḷtidru.
    en: Very well, Swami. Please tell us what has to be done. We don't know it all. Whenever there was a rite like this in the house, it was always Appa who stood in front and handled it.
  - who: priest
    t: ಮೊದಲು ಪಿಂಡ ಇಡ್ಬೇಕು. ಆಮೇಲೆ ಅವರ ಫೋಟೋಗೆ ಪೂಜೆ, ಎಡೆ. ಆಮೇಲೆ ಬಂದೋರಿಗೆಲ್ಲಾ ಊಟ. ಬಂದೋರು ಹೊಟ್ಟೆ ತುಂಬಾ ಊಟ ಮಾಡಿ, ಮನಸ್ಸಿಂದ ಹರಸಿ ಹೋದ್ರೆ ಅದೇ ಹೋದೋರಿಗೆ ದೊಡ್ಡ ಪುಣ್ಯ.
    tr: Modalu piṇḍa iḍbēku. Āmēle avara phōṭōge pūje, eḍe. Āmēle bandōrigellā ūṭa. Bandōru hoṭṭe tumbā ūṭa māḍi, manassinda harasi hōdre adē hōdōrige doḍḍa puṇya.
    en: First the rice-ball offerings have to be placed. Then worship before his photograph, and the food offering. After that, a meal for everyone who has come. If the guests eat their fill and leave blessing him from the heart, that is the greatest merit for the departed.
  - who: rakshith
    t: ಅಪ್ಪಾ, ನಿಮ್ಮ ತಲೆ… ಚಿಕ್ಕಪ್ಪಂದೂ… ಕೂದಲು ಯಾಕೆ ತೆಗೆಸಿದ್ರಿ?
    tr: Appā, nimma tale… cikkappandū… kūdalu yāke tegesidri?
    en: Appa, your head… and Chikkappa's too… why did you have your hair shaved off?
  - who: suresh
    t: ಅಪ್ಪ ಹೋದಾಗ ಗಂಡು ಮಕ್ಕಳು ಕೂದಲು ತೆಗೆಸೋದು ನಮ್ಮಲ್ಲಿ ಪದ್ಧತಿ. ಸೋಮವಾರ ಇದೇ ತಲೆ ಇಟ್ಕೊಂಡು ಬ್ಯಾಂಕ್‌ಗೆ ಹೋಗ್ಬೇಕು. ಪರವಾಗಿಲ್ಲ, ನೋಡಿದೋರಿಗೆಲ್ಲಾ ಅರ್ಥ ಆಗುತ್ತೆ.
    tr: Appa hōdāga gaṇḍu makkaḷu kūdalu tegesōdu nammalli paddhati. Sōmavāra idē tale iṭkoṇḍu byāṅk-ge hōgbēku. Paravāgilla, nōḍidōrigellā artha āgutte.
    en: When a father dies, it's our custom for the sons to have their heads shaved. On Monday I'll have to go to the bank with my head like this. Never mind — everyone who sees it will understand.
  - who: meena
    t: ಮಹದೇವ, ಅಡುಗೆಯೋರು ಮುನ್ನೂರು ಜನಕ್ಕೆ ಮಾಡಿದಾರೆ. ಊರಿನೋರು, ನೆಂಟರು, ಶೋಭಾ ಮನೆಯೋರು ಎಲ್ಲಾ ಸೇರಿದ್ರೆ ಸಾಕಾಗುತ್ತಾ?
    tr: Mahadēva, aḍugeyōru munnūru janakke māḍidāre. Ūrinōru, neṇṭaru, Śōbhā maneyōru ellā sēridre sākāguttā?
    en: Mahadeva, the cooks have made food for three hundred. With the villagers, the relatives and Shobha's in-laws all together, will it be enough?
  - who: mahadeva
    t: ಸಾಕಾಗುತ್ತೆ ಅತ್ತಿಗೆ. ಮುದ್ದೆ, ಅವರೆಕಾಳು ಸಾರು, ಅನ್ನ, ಪಾಯಸ, ಹೋಳಿಗೆ. ಕಡಿಮೆ ಬಿದ್ರೆ ಇನ್ನೊಂದು ಪಾತ್ರೆ ಮುದ್ದೆ ತೊಳಸೋದು ಅರ್ಧ ಗಂಟೆ ಕೆಲಸ. ನಮ್ಮೂರಲ್ಲಿ ತಿಥಿ ಊಟಕ್ಕೆ ಬಂದೋರ್ನ ಅರ್ಧ ಹೊಟ್ಟೇಲಿ ಕಳಿಸಿದ್ರೆ ಅದು ಮನೆತನಕ್ಕೇ ಅವಮಾನ.
    tr: Sākāgutte attige. Mudde, avarekāḷu sāru, anna, pāyasa, hōḷige. Kaḍime bidre innondu pātre mudde toḷasōdu ardha gaṇṭe kelasa. Nammūralli tithi ūṭakke bandōrna ardha hoṭṭēli kaḷisidre adu manetanakkē avamāna.
    en: It'll be enough, Attige. Ragi mudde, field-bean saaru, rice, payasa, holige. If we run short, stirring another pot of mudde is half an hour's work. In our village, sending a tithi guest home half-fed is a disgrace to the whole family name.
  - who: elder
    t: ಪುಟ್ಟಮ್ಮ, ಎದ್ದು ಬಾರವ್ವ. ಬಂದೋರೆಲ್ಲಾ ನಿನ್ನ ಮುಖ ನೋಡ್ಬೇಕು ಅಂತ ಕಾಯ್ತಿದಾರೆ.
    tr: Puṭṭamma, eddu bāravva. Bandōrellā ninna mukha nōḍbēku anta kāytidāre.
    en: Puttamma, get up and come out, dear. Everyone who has come is waiting to see your face.
  - who: avva
    t: ಏನ್ ಮುಖ ತೋರಿಸ್ಲಿ ತಿಮ್ಮಣ್ಣ… ಇವತ್ತು ಕುಂಕುಮ ಇಲ್ಲದ ಹಣೆ, ಬಳೆ ಇಲ್ಲದ ಕೈ.
    tr: Ēn mukha tōrisli Timmaṇṇa… ivattu kuṅkuma illada haṇe, baḷe illada kai.
    en: What face can I show them, Thimmanna… today it's a forehead without kumkum and hands without bangles.
  - who: elder
    t: ಹಣೇಲಿ ಕುಂಕುಮ ಇಲ್ಲ ಅಂದ್ರೆ ಏನಾಯ್ತು? ಈ ಮನೆ ನಿಂತಿರೋದು ನಿನ್ನಿಂದ ಕಣವ್ವ. ಚನ್ನೇಗೌಡ ಹೊಲದಲ್ಲಿ ದುಡಿದ, ನೀನು ಮನೆ ಕಟ್ಟಿದೆ. ಇವತ್ತಿಂದ ಈ ಮನೆಗೆ ಯಜಮಾನಿ ನೀನೇ.
    tr: Haṇēli kuṅkuma illa andre ēnāytu? Ī mane nintirōdu ninninda kaṇavva. Cannēgauḍa holadalli duḍida, nīnu mane kaṭṭide. Ivattinda ī manege yajamāni nīnē.
    en: So what if there's no kumkum on your forehead? This house stands because of you, my dear. Channegowda toiled in the fields; you built the home. From today, you are the head of this house.
  - who: shobha
    t: ಹೌದು ಅವ್ವ. ನೀನು ಮುಂದೆ ಕುಂತ್ಕೊಂಡ್ರೆ ನಮಗೆಲ್ಲಾ ಧೈರ್ಯ. ಬಾ, ನಾನು ಕೈ ಹಿಡ್ಕೊಳ್ತೀನಿ.
    tr: Haudu avva. Nīnu munde kuntkoṇḍre namagellā dhairya. Bā, nānu kai hiḍkoḷḷtīni.
    en: Yes, Avva. If you sit out in front, it gives all of us courage. Come, I'll hold your hand.
  - who: priest
    t: ಈಗ ಎಡೆ ಇಡಿ. ಚನ್ನೇಗೌಡರಿಗೆ ಏನೇನು ಇಷ್ಟ ಇತ್ತೋ ಅದೆಲ್ಲಾ ಈ ಬಾಳೆ ಎಲೆ ಮೇಲೆ ಇಡಿ.
    tr: Īga eḍe iḍi. Cannēgauḍarige ēnēnu iṣṭa ittō adellā ī bāḷe ele mēle iḍi.
    en: Now lay out the offering. Put everything Channegowda liked on this banana leaf.
  - who: avva
    t: ಮುದ್ದೆ, ಬಸ್ಸಾರು, ಒಂದು ಚೂರು ಬೆಲ್ಲ… ಊಟ ಆದ ಮೇಲೆ ಒಂದು ಎಲೆಅಡಿಕೆ. ಐವತ್ತು ವರ್ಷ ಇದೇ ಊಟ. ಮೊನ್ನೆ ರಕ್ಷಿತ್ ಬೆಂಗಳೂರಿಂದ ಪಿಜ್ಜಾ ತಂದಾಗ ‘ಇದ್ಯಾಕೆ ರೊಟ್ಟಿ ಮೇಲೆ ಚಟ್ನಿ ಚೆಲ್ಲಿದೀರ’ ಅಂದಿದ್ರು.
    tr: Mudde, bassāru, ondu cūru bella… ūṭa āda mēle ondu eleaḍike. Aivattu varṣa idē ūṭa. Monne Rakṣit Beṅgaḷūrinda pijjā tandāga ‘idyāke roṭṭi mēle caṭni cellidīra’ andidru.
    en: Mudde, bassaru, a small piece of jaggery… and after the meal, betel leaf and areca nut. Fifty years, the same meal. When Rakshith brought a pizza from Bengaluru the other time, he said, 'Why have you spilled chutney all over a rotti?'
  - who: rakshith
    t: ಅವತ್ತು ಅರ್ಧ ತಿಂದು, ‘ಚೆನ್ನಾಗಿದೆ ಕಣಪ್ಪ, ಆದ್ರೆ ಮುದ್ದೆ ಹಂಗಿಲ್ಲ’ ಅಂದ್ರು. ನಾನು ಆ ಫೋಟೋ ಇನ್ನೂ ಫೋನಲ್ಲಿ ಇಟ್ಕೊಂಡಿದೀನಿ.
    tr: Avattu ardha tindu, ‘cennāgide kaṇappa, ādre mudde haṅgilla’ andru. Nānu ā phōṭō innū phōnalli iṭkoṇḍidīni.
    en: (with a small smile) That day he ate half and said, 'It's nice, lad, but it's not like mudde.' I've still got that photo on my phone.
  - who: elder
    t: ಬನ್ನಿ ಎಲ್ರೂ, ಎಲೆ ಹಾಕಿದಾರೆ. ಮೊದಲ ಪಂಕ್ತಿಗೆ ಹಿರಿಯರು ಕುಂತ್ಕಳಿ. ಹುಡುಗರು ಬಡಿಸೋಕೆ ಬನ್ನಿ.
    tr: Banni ellrū, ele hākidāre. Modala paṅktige hiriyaru kuntkaḷi. Huḍugaru baḍisōke banni.
    en: Come, everyone, the leaves have been laid. Elders, take your places in the first row. Young men, come and serve.
  - who: suresh
    t: ಇನ್ನೂ ಸ್ವಲ್ಪ ಪಾಯಸ ಹಾಕ್ಲಾ? ಸಂಕೋಚ ಬೇಡ, ಹೊಟ್ಟೆ ತುಂಬಾ ಊಟ ಮಾಡಿ.
    tr: Innū svalpa pāyasa hāklā? Saṅkōca bēḍa, hoṭṭe tumbā ūṭa māḍi.
    en: (serving along the row) Shall I give you a little more payasa? Don't be shy, eat your fill.
  - who: elder
    t: ಸಾಕಪ್ಪ, ಹೊಟ್ಟೆ ತುಂಬ್ತು, ಮನಸ್ಸೂ ತುಂಬ್ತು. ಚನ್ನೇಗೌಡನ ಮಕ್ಕಳು ಒಟ್ಟಿಗೆ ನಿಂತು ಬಡಿಸ್ತಿರೋದು ನೋಡಿ ಖುಷಿ ಆಯ್ತು. ಹಿಂಗೇ ಒಟ್ಟಿಗಿರಿ. ‘ಕೂಡಿ ಬಾಳಿದರೆ ಸ್ವರ್ಗ ಸುಖ’ ಅಂತ ಹಿರಿಯರು ಸುಮ್ನೆ ಹೇಳಿಲ್ಲ.
    tr: Sākappa, hoṭṭe tumbtu, manassū tumbtu. Cannēgauḍana makkaḷu oṭṭige nintu baḍistirōdu nōḍi khuṣi āytu. Hiṅgē oṭṭigiri. ‘Kūḍi bāḷidare svarga sukha’ anta hiriyaru sumne hēḷilla.
    en: Enough, son — my stomach is full, and so is my heart. It made me glad to see Channegowda's children standing together and serving. Stay together like this. Our elders didn't say 'living together is heaven's own happiness' for nothing.
  - who: mahadeva
    t: ಕೇಳಿಸ್ಕೊಂಡ್ಯಾ ಅಣ್ಣ? ಊರಿನೋರು ನಮ್ಮನ್ನೇ ನೋಡ್ತಿದಾರೆ. ಚನ್ನೇಗೌಡನ ಮಕ್ಕಳು ಆಸ್ತಿಗೆ ಹೊಡ್ದಾಡ್ತಾರಾ ಇಲ್ವಾ ಅಂತ ಕಾಯ್ತಿದಾರೆ.
    tr: Kēḷiskoṇḍyā aṇṇa? Ūrinōru nammannē nōḍtidāre. Cannēgauḍana makkaḷu āstige hoḍdāḍtārā ilvā anta kāytidāre.
    en: (quietly, to Suresh) Did you hear that, Anna? The village is watching us. They're waiting to see whether Channegowda's children will fight over the property or not.
  - who: suresh
    t: ಅವರಿಗೆ ಆ ಸುದ್ದಿ ಸಿಗಲ್ಲ, ಮಹದೇವ. ನಮ್ಮ ಮನೆ ವಿಷಯ ನಮ್ಮ ಮನೆ ಒಳಗೇ ಮಾತಾಡ್ಕೊಳ್ಳೋಣ.
    tr: Avarige ā suddi sigalla, Mahadēva. Namma mane viṣaya namma mane oḷagē mātāḍkoḷḷōṇa.
    en: They won't get that news, Mahadeva. Our family matters we'll talk over inside our own house.
  - section: The tin trunk
    learn: 'land records: pahaṇi, sarve nambar, hissā, ekare and guṇṭe, nīrāvari vs khuṣki, mālīka, bin · money left behind: beḷe sāla, vyavasāya sēvā sahakāra saṅgha, pi-em kisān kantu, baḍḍi · inheritance words: vārasudāraru, pauti khāte · rural speech: maḍagu, tagaḷi'
  - scene: That night. The guests have gone; the canopy is half taken down. In the front hall, under Thatha's old wooden cot, there is a dented tin trunk. Mahadeva drags it out. The family sits around it on the floor under a single bulb.
  - who: mahadeva
    t: ಅಣ್ಣ, ಶೋಭ, ಇಲ್ಲಿ ಬನ್ನಿ. ಅಪ್ಪನ ಮಂಚದ ಕೆಳಗೆ ಈ ತಗಡಿನ ಪೆಟ್ಟಿಗೆ ಇತ್ತು. ಬೀಗದ ಕೈ ಅವ್ವನ ಹತ್ರ ಇತ್ತು. ಇವತ್ತು ಕಾರ್ಯ ಮುಗೀಲಿ ಅಂತ ಕಾಯ್ತಿದ್ದೆ.
    tr: Aṇṇa, Śōbha, illi banni. Appana man̄cada keḷage ī tagaḍina peṭṭige ittu. Bīgada kai avvana hatra ittu. Ivattu kārya mugīli anta kāytidde.
    en: Anna, Shobha, come here. This tin trunk was under Appa's cot. Avva had the key. I was waiting for today's rite to be over.
  - who: avva
    t: ತಗಳಿ. ಇದರಲ್ಲಿ ಏನೇನಿದೆ ಅಂತ ನನಗೂ ಪೂರ್ತಿ ಗೊತ್ತಿಲ್ಲ. ಕಾಗದ ಪತ್ರ ಎಲ್ಲಾ ಅವ್ರೇ ಮಡಗ್ತಿದ್ರು. ನಾನು ಓದಿದೋಳಲ್ಲ ಕಣಪ್ಪ.
    tr: Tagaḷi. Idaralli ēnēnide anta nanagū pūrti gottilla. Kāgada patra ellā avrē maḍagtidru. Nānu ōdidōḷalla kaṇappa.
    en: Here, take it. Even I don't know everything that's in it. He was the one who kept all the papers. I never went to school, son.
  - who: shobha
    t: 'ಎಷ್ಟೊಂದು ಕಾಗದ! ಇದು ನೋಡು ಅಣ್ಣ — ಪಹಣಿ. ಗ್ರಾಮ ಬೆಟ್ಟಹಳ್ಳಿ, ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡು. ಮಾಲೀಕರು: ಚನ್ನೇಗೌಡ ಬಿನ್ ಕರಿಯಪ್ಪ.'
    tr: 'Eṣṭondu kāgada! Idu nōḍu aṇṇa — pahaṇi. Grāma Beṭṭahaḷḷi, sarve nambar nūra hanneraḍu, hissā eraḍu. Mālīkaru: Cannēgauḍa bin Kariyappa.'
    en: 'So many papers! Look at this, Anna — an RTC. Village Bettahalli, survey number 112, hissa 2. Owner: Channegowda, son of Kariyappa.'
  - who: suresh
    t: 'ಕೊಡು ನೋಡೋಣ. … ಮೂರು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆ, ನೀರಾವರಿ, ಬೆಳೆ ಕಬ್ಬು. ಇದು ನಾಲೆ ಪಕ್ಕದ ಗದ್ದೆ. ಇನ್ನೊಂದು — ಸರ್ವೆ ನಂಬರ್ ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದು: ಎರಡು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆ, ಖುಷ್ಕಿ, ರಾಗಿ, ಅವರೆ. ಹುಣಸೆ ಮರ ಇರೋ ಹೊಲ ಇದೇ.'
    tr: 'Koḍu nōḍōṇa. … Mūru ekare ippattu guṇṭe, nīrāvari, beḷe kabbu. Idu nāle pakkada gadde. Innondu — sarve nambar embattēḷu, hissā ondu: eraḍu ekare ippattu guṇṭe, khuṣki, rāgi, avare. Huṇase mara irō hola idē.'
    en: 'Give it here, let''s see. … Three acres twenty guntas, irrigated, crop: sugarcane. That''s the wet land next to the canal. And the other one — survey number 87, hissa 1: two acres twenty guntas, rain-fed, ragi and field beans. That''s the field with the tamarind tree.'
  - who: rakshith
    t: ಗುಂಟೆ ಅಂದ್ರೆ ಏನಪ್ಪ? ಎಕರೆ ಗೊತ್ತು.
    tr: Guṇṭe andre ēnappa? Ekare gottu.
    en: What's a gunta, Appa? I know what an acre is.
  - who: mahadeva
    t: ನಲವತ್ತು ಗುಂಟೆ ಸೇರಿದ್ರೆ ಒಂದು ಎಕರೆ ಕಣಪ್ಪ. ಒಂದು ಗುಂಟೆ ಅಂದ್ರೆ ಸುಮಾರು ಸಾವಿರದ ತೊಂಬತ್ತು ಚದರ ಅಡಿ. ಬೆಂಗಳೂರಲ್ಲಿ ಮೂವತ್ತು-ನಲವತ್ತರ ಸೈಟು ಅಂತೀರಲ್ಲ, ಹೆಚ್ಚು ಕಮ್ಮಿ ಅಷ್ಟು.
    tr: Nalavattu guṇṭe sēridre ondu ekare kaṇappa. Ondu guṇṭe andre sumāru sāvirada tombattu cadara aḍi. Beṅgaḷūralli mūvattu-nalavattara saiṭu antīralla, heccu kammi aṣṭu.
    en: Forty guntas make one acre, lad. One gunta is about one thousand and ninety square feet. You know the thirty-by-forty sites you talk about in Bengaluru? More or less that much.
  - who: suresh
    t: ಒಟ್ಟು ಆರು ಎಕರೆ. ಆದ್ರೆ ನೋಡು, ಈ ಪಹಣಿ ಕಳೆದ ತಿಂಗಳು ತೆಗೆಸಿದ್ದು. ಇನ್ನೂ ಅಪ್ಪನ ಹೆಸರಲ್ಲೇ ಇದೆ. ಸರ್ಕಾರದ ಲೆಕ್ಕದಲ್ಲಿ ಈ ಜಮೀನಿನ ಮಾಲೀಕರು ಈಗ ಬದುಕಿಲ್ಲದ ಒಬ್ಬರು. ಇದನ್ನ ಬದಲಾಯಿಸ್ಬೇಕು.
    tr: Oṭṭu āru ekare. Ādre nōḍu, ī pahaṇi kaḷeda tiṅgaḷu tegesiddu. Innū appana hesarallē ide. Sarkārada lekkadalli ī jamīnina mālīkaru īga badukillada obbaru. Idanna badalāyisbēku.
    en: Six acres in all. But look, this RTC was taken out last month. It's still in Appa's name. As far as the government's records go, the owner of this land is now someone who is no longer alive. That has to be changed.
  - who: mahadeva
    t: ಅದಕ್ಕೇ ಇನ್ನೊಂದು ವಿಷಯ ಹೇಳ್ಬೇಕು. ಪಿಎಂ ಕಿಸಾನ್ ದುಡ್ಡು — ವರ್ಷಕ್ಕೆ ಆರು ಸಾವಿರ, ಮೂರು ಕಂತಲ್ಲಿ ಎರಡೆರಡು ಸಾವಿರ — ಅಪ್ಪನ ಅಕೌಂಟಿಗೆ ಬರ್ತಿತ್ತು. ಇನ್ಮುಂದೆ ಆ ಕಂತು ಯಾರಿಗೂ ಬರಲ್ಲ ಅಂತ ಬ್ಯಾಂಕ್‌ನೋರು ಹೇಳಿದ್ರು. ಜಮೀನು ನಮ್ಮ ಹೆಸರಿಗೆ ಬರೋವರ್ಗೂ ನಿಂತೋಗುತ್ತೆ.
    tr: Adakkē innondu viṣaya hēḷbēku. Pi-em kisān duḍḍu — varṣakke āru sāvira, mūru kantalli eraḍeraḍu sāvira — appana akauṇṭige bartittu. Inmunde ā kantu yārigū baralla anta byāṅk-nōru hēḷidru. Jamīnu namma hesarige barōvargū nintōgutte.
    en: That's why I need to tell you something else. The PM-Kisan money — six thousand a year, two thousand at a time in three instalments — used to come into Appa's account. The bank people told me no instalment will come to anyone from now on. It stops until the land comes into our names.
  - who: suresh
    t: ಸರಿಯಾಗೇ ಹೇಳಿದಾರೆ. ಖಾತೆ ವಾರಸುದಾರರ ಹೆಸರಿಗೆ ಬರ್ಬೇಕು. ಅದಕ್ಕೆ ಪೌತಿ ಖಾತೆ ಅಂತಾರೆ. ಅದಾದ ಮೇಲೆ ಹೊಸದಾಗಿ ಅರ್ಜಿ, ಇ-ಕೆವೈಸಿ ಎಲ್ಲಾ ಮಾಡಿದ್ರೆ ಮತ್ತೆ ಶುರು ಆಗುತ್ತೆ.
    tr: Sariyāgē hēḷidāre. Khāte vārasudārara hesarige barbēku. Adakke pauti khāte antāre. Adāda mēle hosadāgi arji, i-ke-vai-si ellā māḍidre matte śuru āgutte.
    en: They told you right. The khata has to come into the heirs' names. That's called 'pauti khata'. After that, if we apply afresh and do the e-KYC and so on, it will start again.
  - who: rakshith
    t: ಪೌತಿ ಅಂದ್ರೆ?
    tr: Pauti andre?
    en: What does 'pauti' mean?
  - who: suresh
    t: ಯಾರಾದ್ರೂ ತೀರ್ಕೊಂಡಾಗ ಅವರ ಜಮೀನಿನ ಖಾತೆಯನ್ನ ಅವರ ವಾರಸುದಾರರಿಗೆ — ಅಂದ್ರೆ ಹೆಂಡ್ತಿ, ಮಕ್ಕಳಿಗೆ — ಬದಲಾಯಿಸೋದು. ಸಾವಿನ ನಂತರದ ಖಾತೆ ಬದಲಾವಣೆ ಅಂತ ತಿಳ್ಕೋ.
    tr: Yārādrū tīrkoṇḍāga avara jamīnina khāteyanna avara vārasudārarige — andre heṇḍti, makkaḷige — badalāyisōdu. Sāvina nantarada khāte badalāvaṇe anta tiḷkō.
    en: When someone dies, transferring the khata of their land to their heirs — that is, the wife and children. Think of it as the change of khata after a death.
  - who: shobha
    t: 'ಇದು ಇನ್ನೊಂದು ಕಾಗದ… ವ್ಯವಸಾಯ ಸೇವಾ ಸಹಕಾರ ಸಂಘ, ಬೆಟ್ಟಹಳ್ಳಿ. ಬೆಳೆ ಸಾಲ — ಒಂದು ಲಕ್ಷ ಅರವತ್ತು ಸಾವಿರ. ಸಾಲಗಾರ: ಚನ್ನೇಗೌಡ. ಮಹದೇವ, ಅಪ್ಪ ಸಾಲ ತಗೊಂಡಿದ್ರು ಅಂತ ನಮಗೆ ಗೊತ್ತೇ ಇರ್ಲಿಲ್ಲ.'
    tr: 'Idu innondu kāgada… Vyavasāya Sēvā Sahakāra Saṅgha, Beṭṭahaḷḷi. Beḷe sāla — ondu lakṣa aravattu sāvira. Sālagāra: Cannēgauḍa. Mahadēva, appa sāla tagoṇḍidru anta namage gottē irlilla.'
    en: 'Here''s another paper… the Agricultural Service Cooperative Society, Bettahalli. Crop loan — one lakh sixty thousand. Borrower: Channegowda. Mahadeva, we didn''t even know Appa had taken a loan.'
  - who: mahadeva
    t: ಪ್ರತಿ ವರ್ಷ ತಗೋತೀವಿ ಕಣೇ. ಕಬ್ಬು ನೆಡೋವಾಗ ಗೊಬ್ಬರ, ಕೂಲಿ, ಎಲ್ಲಾ ಅದರಿಂದಲೇ. ಕಾರ್ಖಾನೆ ದುಡ್ಡು ಬಂದಾಗ ತೀರಿಸ್ತೀವಿ. ಈ ಸಲ ಕಬ್ಬಿನ ದುಡ್ಡು ಇನ್ನೂ ಬಂದಿಲ್ಲ, ಅದಕ್ಕೇ ಬಾಕಿ ಇದೆ.
    tr: Prati varṣa tagōtīvi kaṇē. Kabbu neḍōvāga gobbara, kūli, ellā adarindalē. Kārkhāne duḍḍu bandāga tīristīvi. Ī sala kabbina duḍḍu innū bandilla, adakkē bāki ide.
    en: We take it every year, girl. When we plant the cane — fertiliser, labour, all of it comes from that loan. We repay it when the factory money comes. This time the cane money still hasn't come, that's why it's outstanding.
  - who: suresh
    t: ನಾನು ಬ್ಯಾಂಕಲ್ಲಿ ನೋಡಿರೋ ಪ್ರಕಾರ, ಸಹಕಾರ ಸಂಘದ ಬೆಳೆ ಸಾಲಕ್ಕೆ ಐದು ಲಕ್ಷದವರೆಗೂ ಬಡ್ಡಿ ಇಲ್ಲ — ಆದ್ರೆ ಟೈಮಿಗೆ ಸರಿಯಾಗಿ ಕಟ್ಟಿದ್ರೆ ಮಾತ್ರ. ತಡ ಆದ್ರೆ ಬಡ್ಡಿ ಬೀಳುತ್ತೆ. ಸಾಲಗಾರ ತೀರ್ಕೊಂಡ್ರೆ ಸಾಲ ಮಾಯ ಆಗಲ್ಲ. ಅದು ಜಮೀನಿನ ಮೇಲೆ ಉಳಿಯುತ್ತೆ, ವಾರಸುದಾರರು ತೀರಿಸ್ಬೇಕು.
    tr: Nānu byāṅkalli nōḍirō prakāra, sahakāra saṅghada beḷe sālakke aidu lakṣadavaregū baḍḍi illa — ādre ṭaimige sariyāgi kaṭṭidre mātra. Taḍa ādre baḍḍi bīḷutte. Sālagāra tīrkoṇḍre sāla māya āgalla. Adu jamīnina mēle uḷiyutte, vārasudāraru tīrisbēku.
    en: From what I've seen at the bank, co-op crop loans are interest-free up to five lakh — but only if you repay on time. If you're late, interest is charged. When a borrower dies, the loan doesn't vanish. It stays on the land, and the heirs have to repay it.
  - who: shobha
    t: ವಾರಸುದಾರರು ಅಂದ್ರೆ ನಾವು ನಾಲ್ಕು ಜನ — ಅವ್ವ, ನೀನು, ಮಹದೇವ, ನಾನು. ಸಾಲ ಆಗ್ಲೀ, ಜಮೀನು ಆಗ್ಲೀ, ನಾಲ್ಕೂ ಜನಕ್ಕೆ ಸೇರಿದ್ದು.
    tr: Vārasudāraru andre nāvu nālku jana — avva, nīnu, Mahadēva, nānu. Sāla āglī, jamīnu āglī, nālkū janakke sēriddu.
    en: The heirs means the four of us — Avva, you, Mahadeva and me. Whether it's the loan or the land, it belongs to all four of us.
  - who: mahadeva
    t: ಸಾಲ ಕಟ್ಟೋದು ನಾನು. ಕಬ್ಬು ಬೆಳೆಯೋದು ನಾನು. ಕಾರ್ಖಾನೆ ಮುಂದೆ ಕ್ಯೂನಲ್ಲಿ ನಿಲ್ಲೋದು ನಾನು. ಈಗ ಜಮೀನು ಮಾತ್ರ ನಾಲ್ಕೂ ಜನಕ್ಕೆ ಸೇರಿದ್ದಾ?
    tr: Sāla kaṭṭōdu nānu. Kabbu beḷeyōdu nānu. Kārkhāne munde kyūnalli nillōdu nānu. Īga jamīnu mātra nālkū janakke sēriddā?
    en: (after a pause) Repaying the loan — me. Growing the cane — me. Standing in the queue outside the factory — me. And now only the land belongs to all four?
  - who: meena
    t: ಮಹದೇವ, ಶೋಭಾ ಕಾನೂನು ಏನು ಹೇಳುತ್ತೆ ಅಂತ ಹೇಳಿದ್ಲು ಅಷ್ಟೇ. ಇದು ಈ ರಾತ್ರಿ ತೀರ್ಮಾನ ಮಾಡೋ ವಿಷಯ ಅಲ್ಲ. ಕಾಗದ ಎಲ್ಲಾ ಒಂದು ಫೈಲಲ್ಲಿ ಜೋಡಿಸಿ ಇಡೋಣ. ಯಾವುದೂ ಕಳೆದುಹೋಗ್ಬಾರದು.
    tr: Mahadēva, Śōbhā kānūnu ēnu hēḷutte anta hēḷidlu aṣṭē. Idu ī rātri tīrmāna māḍō viṣaya alla. Kāgada ellā ondu phailalli jōḍisi iḍōṇa. Yāvudū kaḷeduhōgbāradu.
    en: Mahadeva, Shobha only said what the law says. This isn't something to decide tonight. Let's put all the papers in order in one file. Nothing must get lost.
  - section: Thatha's diary
    learn: 'reading years aloud: sāvirada ombainūra tombatteṇṭu, eraḍu sāvirada hattu · past perfect and habitual past: māride, kaṭṭidvi, kaḷistidde · counterfactual: gottidre … kaḷistidde · a diary is not a will: uyilu alla, dinacari · the father''s unspoken wish'
  - scene: Later the same night. At the bottom of the trunk, wrapped in a white cotton cloth, lies a thick hardbound notebook, its pages yellow and soft at the edges. Rakshith lifts it out.
  - who: rakshith
    t: ಅಪ್ಪಾ, ಕೆಳಗೆ ಬಿಳಿ ಬಟ್ಟೇಲಿ ಸುತ್ತಿದ ಒಂದು ದಪ್ಪ ಪುಸ್ತಕ ಇದೆ. ಲೆಕ್ಕದ ಪುಸ್ತಕನಾ?
    tr: Appā, keḷage biḷi baṭṭēli suttida ondu dappa pustaka ide. Lekkada pustakanā?
    en: Appa, there's a thick book at the bottom, wrapped in a white cloth. Is it an account book?
  - who: avva
    t: ಅದು ಅವ್ರ ದಿನಚರಿ ಕಣಪ್ಪ. ಮೊದ್ಲು ಲಾಟೀನು ಬೆಳಕಲ್ಲಿ, ಆಮೇಲೆ ಕರೆಂಟ್ ಬಂದ ಮೇಲೆ ಬಲ್ಬ್ ಕೆಳಗೆ, ದಿನಾ ರಾತ್ರಿ ಏನೋ ಬರೀತಿದ್ರು. ‘ಏನ್ ಬರೀತೀರಿ’ ಅಂದ್ರೆ ‘ಲೆಕ್ಕ’ ಅಂತಿದ್ರು.
    tr: Adu avra dinacari kaṇappa. Modlu lāṭīnu beḷakalli, āmēle kareṇṭ banda mēle balb keḷage, dinā rātri ēnō barītidru. ‘Ēn barītīri’ andre ‘lekka’ antidru.
    en: That's his diary, child. First by lantern light, later under the bulb once the electricity came, he'd write something every night. If I asked, 'What are you writing?', he'd say, 'Accounts.'
  - who: suresh
    t: ನಲವತ್ತು ವರ್ಷದ ದಿನಚರಿ… ರಕ್ಷಿತ್, ನೀನೇ ಓದು. ನಿನ್ನ ಕನ್ನಡ ಓದು ಹೇಗಿದೆ ನೋಡೋಣ. ತಾತನ ಅಕ್ಷರ ಸ್ವಲ್ಪ ಕಷ್ಟ, ನಿಧಾನವಾಗಿ ಓದು.
    tr: Nalavattu varṣada dinacari… Rakṣit, nīnē ōdu. Ninna kannaḍa ōdu hēgide nōḍōṇa. Tātana akṣara svalpa kaṣṭa, nidhānavāgi ōdu.
    en: Forty years of diary… Rakshith, you read it. Let's see how your Kannada reading is. Thatha's handwriting is a bit difficult; read slowly.
  - who: rakshith
    t: ‘ಸಾವಿರದ ಒಂಬೈನೂರ ತೊಂಬತ್ತೆಂಟು, ಜೂನ್ ಹದಿನೈದು. ಸುರೇಶನ ಕಾಲೇಜು ಫೀಸಿಗೆ ಎರಡು ಎತ್ತು ಮಾರಿದೆ. ಹದಿನಾಲ್ಕು ಸಾವಿರ. ಎತ್ತು ಹೋದ್ರೆ ಹೋಗ್ಲಿ, ಮಗ ಓದ್ಲಿ.’
    tr: ‘Sāvirada ombainūra tombatteṇṭu, jūn hadinaidu. Surēśana kālēju phīsige eraḍu ettu māride. Hadinālku sāvira. Ettu hōdre hōgli, maga ōdli.’
    en: '''Fifteenth of June, 1998. Sold the two bullocks for Suresh''s college fees. Fourteen thousand. If the bullocks go, let them go — let my son study.'''
  - who: suresh
    t: ನನಗೆ ಹೇಳಿದ್ದು ‘ಎತ್ತುಗಳಿಗೆ ವಯಸ್ಸಾಗಿತ್ತು, ಅದಕ್ಕೇ ಮಾರಿದೆ’ ಅಂತ. ಇಪ್ಪತ್ತೇಳು ವರ್ಷ ನಾನು ಅದನ್ನೇ ನಂಬಿದ್ದೆ.
    tr: Nanage hēḷiddu ‘ettugaḷige vayassāgittu, adakkē māride’ anta. Ippattēḷu varṣa nānu adannē nambidde.
    en: (after a silence) What he told me was, 'The bullocks had grown old, so I sold them.' For twenty-seven years I believed that.
  - who: rakshith
    t: ‘ಎರಡು ಸಾವಿರದ ಹತ್ತು, ಮೇ ಮೂರು. ಶೋಭಳ ಮದುವೆ. ಸಂಘದ ಸಾಲ, ಕೈಸಾಲ ಸೇರಿ ಎರಡು ಲಕ್ಷ. ಮಗಳು ಸಂತೋಷವಾಗಿ ಗಂಡನ ಮನೆಗೆ ಹೋದ್ಲು. ಸಾಲ ಮೂರು ವರ್ಷದಲ್ಲಿ ತೀರಿಸ್ತೀನಿ.’
    tr: ‘Eraḍu sāvirada hattu, mē mūru. Śōbhaḷa maduve. Saṅghada sāla, kaisāla sēri eraḍu lakṣa. Magaḷu santōṣavāgi gaṇḍana manege hōdlu. Sāla mūru varṣadalli tīristīni.’
    en: '''Third of May, 2010. Shobha''s wedding. Society loan and private borrowing together, two lakh. My daughter went happily to her husband''s home. I will clear the debt in three years.'''
  - who: shobha
    t: ಮೂರು ವರ್ಷ ಅಂತ ಬರೆದಿದ್ರು… ಎಷ್ಟು ವರ್ಷ ಆಯ್ತು ತೀರಿಸೋಕೆ, ಮಹದೇವ?
    tr: Mūru varṣa anta baredidru… eṣṭu varṣa āytu tīrisōke, Mahadēva?
    en: He wrote three years… how many years did it actually take to repay, Mahadeva?
  - who: mahadeva
    t: ಐದು ವರ್ಷ. ಎರಡು ಸಾವಿರದ ಹದಿನೈದರಲ್ಲಿ ಕೊನೇ ಕಂತು ಕಟ್ಟಿದ್ವಿ. ಆ ವರ್ಷ ಕಬ್ಬು ನಾನೇ ಕಡಿಸಿ, ನಾನೇ ಟ್ರ್ಯಾಕ್ಟರ್‌ನಲ್ಲಿ ಕಾರ್ಖಾನೆಗೆ ಹೊಡ್ಕಂಡು ಹೋಗಿದ್ದೆ.
    tr: Aidu varṣa. Eraḍu sāvirada hadinaidaralli konē kantu kaṭṭidvi. Ā varṣa kabbu nānē kaḍisi, nānē ṭryākṭar-nalli kārkhānege hoḍkaṇḍu hōgidde.
    en: Five years. We paid the last instalment in 2015. That year I had the cane cut myself and drove it to the factory on the tractor myself.
  - who: shobha
    t: ನನಗೆ ಯಾರೂ ಹೇಳ್ಲೇ ಇಲ್ಲ. ಸಂಬಳ ಬಂದಾಗ ಪ್ರತಿ ತಿಂಗಳು ಅವ್ವಂಗೆ ಸ್ವಲ್ಪ ಕಳಿಸ್ತಿದ್ದೆ. ಸಾಲ ಇದೆ ಅಂತ ಗೊತ್ತಿದ್ರೆ ಇನ್ನೂ ಜಾಸ್ತಿ ಕಳಿಸ್ತಿದ್ದೆ.
    tr: Nanage yārū hēḷlē illa. Sambaḷa bandāga prati tiṅgaḷu avvaṅge svalpa kaḷistidde. Sāla ide anta gottidre innū jāsti kaḷistidde.
    en: Nobody ever told me. Every month when my salary came, I used to send Avva a little. If I'd known there was a debt, I would have sent much more.
  - who: avva
    t: ಅವ್ರೇ ಬೇಡ ಅಂದಿದ್ರು ಕಣೇ. ‘ಹೆಣ್ಮಗಳ ಹತ್ರ ಸಾಲದ ಮಾತು ಆಡ್ಬಾರ್ದು. ತವರು ಮನೆ ಅಂದ್ರೆ ಅವಳಿಗೆ ನೆರಳು ಆಗ್ಬೇಕು, ಭಾರ ಅಲ್ಲ’ ಅಂತಿದ್ರು.
    tr: Avrē bēḍa andidru kaṇē. ‘Heṇmagaḷa hatra sālada mātu āḍbārdu. Tavaru mane andre avaḷige neraḷu āgbēku, bhāra alla’ antidru.
    en: It was he who said not to, dear. He used to say, 'Never talk about debts in front of a daughter. Her parents' home must be a shade for her, not a burden.'
  - who: rakshith
    t: ಇನ್ನೊಂದು ಇದೆ, ಇತ್ತೀಚಿನದು… ‘ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೈದು, ನವೆಂಬರ್ ಇಪ್ಪತ್ತು. ಮದ್ದೂರಿಂದ ಒಬ್ಬ ಬ್ರೋಕರ್ ಬಂದಿದ್ದ. ಎಕ್ಸ್‌ಪ್ರೆಸ್‌ವೇ ಹತ್ರ ಆಗಿರೋದ್ರಿಂದ ಜಮೀನಿಗೆ ಒಳ್ಳೆ ರೇಟು ಕೊಡ್ತೀನಿ ಅಂದ. ಬೇಡ ಅಂದೆ. ನಾನಿರೋವರ್ಗೂ ಈ ಮಣ್ಣು ಮಾರಲ್ಲ.’
    tr: Innondu ide, ittīcinadu… ‘Eraḍu sāvirada ippattaidu, navembar ippattu. Maddūrinda obba brōkar bandidda. Ekspres-vē hatra āgirōdrinda jamīnige oḷḷe rēṭu koḍtīni anda. Bēḍa ande. Nānirōvargū ī maṇṇu māralla.’
    en: There's another one, a recent one… 'Twentieth of November, 2025. A broker came from Maddur. He said that since it's near the expressway he'd give a good rate for the land. I said no. As long as I live, I will not sell this soil.'
  - who: mahadeva
    t: ಕೇಳಿದ್ರಾ? ‘ಮಾರಲ್ಲ’ ಅಂತ ಬರೆದಿದಾರೆ. ಅಪ್ಪನ ಕೈಯಲ್ಲೇ.
    tr: Kēḷidrā? ‘Māralla’ anta baredidāre. Appana kaiyallē.
    en: Did you hear that? 'I will not sell,' he's written. In Appa's own hand.
  - who: shobha
    t: ‘ನಾನಿರೋವರ್ಗೂ’ ಅಂತಾನೂ ಬರೆದಿದಾರೆ, ಮಹದೇವ. ಅದು ಉಯಿಲು ಅಲ್ಲ, ದಿನಚರಿ.
    tr: ‘Nānirōvargū’ antānū baredidāre, Mahadēva. Adu uyilu alla, dinacari.
    en: He's also written 'as long as I live', Mahadeva. It's a diary, not a will.
  - who: suresh
    t: ಸಾಕು. ಇವತ್ತು ಅಪ್ಪನ ಕಾರ್ಯದ ದಿನ. ಅವರ ಅಕ್ಷರ ಕೈಯಲ್ಲಿ ಹಿಡ್ಕೊಂಡು ನಾವು ವಕೀಲರ ಹಾಗೆ ವಾದ ಮಾಡೋದು ಬೇಡ.
    tr: Sāku. Ivattu appana kāryada dina. Avara akṣara kaiyalli hiḍkoṇḍu nāvu vakīlara hāge vāda māḍōdu bēḍa.
    en: Enough. Today is the day of Appa's rite. Let's not hold his handwriting in our hands and argue over it like lawyers.
  - who: rakshith
    t: ಕೊನೇ ಪುಟದಲ್ಲಿ ದಿನಾಂಕ ಇಲ್ಲದೆ ಒಂದು ಸಾಲು ಇದೆ… ‘ನನ್ನ ಮೂರು ಮಕ್ಕಳೂ ಮೂರು ಕಡೆ ಇದ್ದಾರೆ. ಒಂದು ದಿನ ಈ ಮನೆ ಅಂಗಳದಲ್ಲಿ ಮೂವರೂ ಒಟ್ಟಿಗೆ ಕೂತು ಊಟ ಮಾಡೋದು ನೋಡ್ಬೇಕು.’
    tr: Konē puṭadalli dināṅka illade ondu sālu ide… ‘Nanna mūru makkaḷū mūru kaḍe iddāre. Ondu dina ī mane aṅgaḷadalli mūvarū oṭṭige kūtu ūṭa māḍōdu nōḍbēku.’
    en: On the last page there's one line with no date… 'My three children live in three different places. One day I must see all three of them sitting together and eating in the yard of this house.'
  - who: avva
    t: ಇವತ್ತು ಮೂರೂ ಜನ ಅದೇ ಅಂಗಳದಲ್ಲಿ ಊಟ ಮಾಡಿದ್ರಿ ಕಣ್ರಪ್ಪ… ಅದನ್ನ ನೋಡೋಕೆ ಅವ್ರೇ ಇಲ್ಲ.
    tr: Ivattu mūrū jana adē aṅgaḷadalli ūṭa māḍidri kaṇrappa… adanna nōḍōke avrē illa.
    en: Today all three of you ate in that very yard, my children… and he isn't here to see it.
  - who: suresh
    t: ಅವ್ವ, ನಾನು ಸೋಮವಾರ ಬೆಂಗಳೂರಿಗೆ ಹೋಗ್ಬೇಕು, ಬ್ಯಾಂಕಲ್ಲಿ ಡಿಸೆಂಬರ್ ಕ್ಲೋಸಿಂಗ್ ಕೆಲಸ ಇದೆ. ಹೊಸ ವರ್ಷದ ಮೊದಲ ವಾರ ರಜೆ ಹಾಕಿ ಬರ್ತೀನಿ. ಗ್ರಾಮ ಲೆಕ್ಕಿಗರನ್ನ ನೋಡಿ ಪೌತಿ ಖಾತೆ ಕೆಲಸ ಶುರು ಮಾಡೋಣ. ಎಲ್ಲರ ಆಧಾರ್ ಕಾಪಿ ರೆಡಿ ಇಟ್ಕೊಳ್ಳಿ.
    tr: Avva, nānu sōmavāra Beṅgaḷūrige hōgbēku, byāṅkalli ḍisembar klōsiṅg kelasa ide. Hosa varṣada modala vāra raje hāki bartīni. Grāma lekkigaranna nōḍi pauti khāte kelasa śuru māḍōṇa. Ellara ādhār kāpi reḍi iṭkoḷḷi.
    en: Avva, I have to go back to Bengaluru on Monday; there's the December closing work at the bank. I'll take leave and come in the first week of the new year. We'll see the Village Accountant and start the pauti khata work. Keep everyone's Aadhaar copies ready.
  - who: shobha
    t: ಎಲ್ಲರ ಅಂದ್ರೆ ನನ್ನದೂ ಸೇರಿ, ಅಲ್ವಾ ಅಣ್ಣ?
    tr: Ellara andre nannadū sēri, alvā aṇṇa?
    en: Everyone's means mine too, doesn't it, Anna?
  - who: suresh
    t: ನಿನ್ನದೂ ಸೇರಿ, ಶೋಭಾ. ಅದರಲ್ಲಿ ಪ್ರಶ್ನೆನೇ ಇಲ್ಲ.
    tr: Ninnadū sēri, Śōbhā. Adaralli praśnenē illa.
    en: Yours too, Shobha. There's no question about that. (Mahadeva looks away and says nothing.)
  - chapter: Chapter 3 — Papers
  - section: The Village Accountant
    learn: 'documents: maraṇa pramāṇa patra, vaṁśavṛkṣa pramāṇa patra, aphiḍaviṭ, ādhār kāpi, kraya patra · procedure: sthaḷa mahajar, hēḷike, nōṭis, ākṣēpaṇe, ār-ai dṛḍhīkarisu · key idea: khāte māliktvada purāve alla · ancestral vs self-acquired: tātaninda bandiddu, appa koṇḍkaṇḍiddu · official frankness: ellā sariyāgi naḍedre'
  - scene: Monday, 5 January 2026, 10:30 a.m. A small room at the back of the Gram Panchayat building in Bettahalli, used by the Village Accountant. Steel almirahs, bundles of files tied with red tape, a desktop computer and a printer. Siddaraju, about fifty, is sorting papers. Suresh, Mahadeva and Avva come in.
  - who: va
    t: ಬನ್ನಿ, ಬನ್ನಿ, ಕೂತ್ಕೊಳ್ಳಿ. ಚನ್ನೇಗೌಡ್ರ ವಿಷಯ ಕೇಳಿ ತುಂಬಾ ಬೇಜಾರಾಯ್ತು. ಒಳ್ಳೆ ಮನುಷ್ಯ. ಭೂಕಂದಾಯ ಒಂದು ವರ್ಷಾನೂ ಬಾಕಿ ಇಟ್ಟೋರಲ್ಲ.
    tr: Banni, banni, kūtkoḷḷi. Cannēgauḍra viṣaya kēḷi tumbā bējārāytu. Oḷḷe manuṣya. Bhūkandāya ondu varṣānū bāki iṭṭōralla.
    en: Come in, come in, sit down. I was very sorry to hear about Channegowda. A good man. He never once left his land revenue unpaid, not for a single year.
  - who: suresh
    t: ಧನ್ಯವಾದ ಸಿದ್ದರಾಜು ಅವರೇ. ನಾನು ಸುರೇಶ್, ದೊಡ್ಡ ಮಗ. ಅಪ್ಪನ ಹೆಸರಲ್ಲಿರೋ ಜಮೀನಿಗೆ ಪೌತಿ ಖಾತೆ ಮಾಡಿಸ್ಬೇಕು. ಏನೇನು ಬೇಕು, ಎಷ್ಟು ದಿನ ಆಗುತ್ತೆ ಅಂತ ತಿಳ್ಕೊಳ್ಳೋಕೆ ಬಂದ್ವಿ.
    tr: Dhanyavāda Siddarāju avarē. Nānu Surēś, doḍḍa maga. Appana hesarallirō jamīnige pauti khāte māḍisbēku. Ēnēnu bēku, eṣṭu dina āgutte anta tiḷkoḷḷōke bandvi.
    en: Thank you, Siddaraju. I'm Suresh, the eldest son. We need to get the pauti khata done for the land in Appa's name. We've come to find out what's needed and how long it takes.
  - who: va
    t: ಒಳ್ಳೇದು, ತಡ ಮಾಡ್ಲಿಲ್ಲ ನೀವು. ಈಗ ಸರ್ಕಾರನೇ ಇ-ಪೌತಿ ಅಂತ ಅಭಿಯಾನ ನಡೆಸ್ತಿದೆ. ರಾಜ್ಯದಲ್ಲಿ ಸುಮಾರು ಐವತ್ತು ಲಕ್ಷ ಪಹಣಿಗಳು ಇನ್ನೂ ತೀರ್ಕೊಂಡೋರ ಹೆಸರಲ್ಲೇ ಇವೆ ಅಂತ ಲೆಕ್ಕ ಬಂದಿದೆ. ನಮ್ಮ ಮೇಲೂ ಮೇಲಿಂದ ಒತ್ತಡ ಇದೆ.
    tr: Oḷḷēdu, taḍa māḍlilla nīvu. Īga sarkāranē i-pauti anta abhiyāna naḍestide. Rājyadalli sumāru aivattu lakṣa pahaṇigaḷu innū tīrkoṇḍōra hesarallē ive anta lekka bandide. Namma mēlū mēlinda ottaḍa ide.
    en: Good, you didn't delay. Right now the government itself is running a campaign called e-Pauthi. They've worked out that around fifty lakh RTCs in the state are still in the names of people who have died. There's pressure on us from above too.
  - who: mahadeva
    t: ಐವತ್ತು ಲಕ್ಷ! ಅಂದ್ರೆ ನಮ್ಮ ಹಂಗೆ ಎಷ್ಟೋ ಜನ ಅಪ್ಪ-ತಾತನ ಹೆಸರಲ್ಲೇ ಬೇಸಾಯ ಮಾಡ್ತಿದಾರೆ.
    tr: Aivattu lakṣa! Andre namma haṅge eṣṭō jana appa-tātana hesarallē bēsāya māḍtidāre.
    en: Fifty lakh! So lots of people like us are farming in their father's or grandfather's name.
  - who: va
    t: ಹೌದು. ಕೆಲವರ ಪಹಣಿಯಲ್ಲಿ ಮುತ್ತಾತನ ಹೆಸರೂ ಇದೆ, ಅಂಥವರಿಗೆ ಒಂದರ ಹಿಂದೆ ಒಂದು ಮೂರು ಪೌತಿ ಮಾಡ್ಬೇಕು. ಈಗ ಕೇಳಿ, ಮೂರು ಮುಖ್ಯ ದಾಖಲೆ ಬೇಕು. ಒಂದು, ಮರಣ ಪ್ರಮಾಣ ಪತ್ರ. ಎರಡು, ವಂಶವೃಕ್ಷ ಪ್ರಮಾಣ ಪತ್ರ — ಅದಕ್ಕೆ ನಾಡಕಚೇರಿಯಲ್ಲಿ ಅರ್ಜಿ ಹಾಕ್ಬೇಕು, ತಹಸೀಲ್ದಾರ್ ಸಹಿ ಮಾಡ್ತಾರೆ. ಮೂರು, ಎಲ್ಲಾ ವಾರಸುದಾರರ ಆಧಾರ್ ಕಾಪಿ, ಅವರ ಫೋನ್ ನಂಬರ್.
    tr: Haudu. Kelavara pahaṇiyalli muttātana hesarū ide, anthavarige ondara hinde ondu mūru pauti māḍbēku. Īga kēḷi, mūru mukhya dākhale bēku. Ondu, maraṇa pramāṇa patra. Eraḍu, vaṁśavṛkṣa pramāṇa patra — adakke nāḍakacēriyalli arji hākbēku, tahasīldār sahi māḍtāre. Mūru, ellā vārasudārara ādhār kāpi, avara phōn nambar.
    en: Yes. Some people's RTCs still carry a great-grandfather's name; they need three pautis one after another. Now listen, three main documents are needed. One, the death certificate. Two, the family-tree certificate — for that you apply at the Nadakacheri and the Tahsildar signs it. Three, Aadhaar copies of all the heirs, and their phone numbers.
  - who: suresh
    t: ಮರಣ ಪ್ರಮಾಣ ಪತ್ರ ಬಂದಿದೆ. ಮಹದೇವ ಆಸ್ಪತ್ರೆ ವರದಿ ಇಟ್ಕೊಂಡು ಮರಣ ನೋಂದಣಿ ಮಾಡಿಸಿದ್ದ. ಇಗೋ, ಮೂಲ ಪ್ರತಿ ಮತ್ತು ಎರಡು ಜೆರಾಕ್ಸ್.
    tr: Maraṇa pramāṇa patra bandide. Mahadēva āspatre varadi iṭkoṇḍu maraṇa nōndaṇi māḍisidda. Igō, mūla prati mattu eraḍu jerāks.
    en: The death certificate has come. Mahadeva got the death registered with the hospital's report. Here — the original and two photocopies.
  - who: va
    t: 'ಸರಿ. ವಂಶವೃಕ್ಷಕ್ಕೆ ಅರ್ಜಿ ಹಾಕುವಾಗ ಒಂದು ಅಫಿಡವಿಟ್ ಕೊಡ್ಬೇಕು: ತೀರ್ಕೊಂಡೋರಿಗೆ ಯಾರ್ಯಾರು ವಾರಸುದಾರರು ಇದಾರೆ ಅಂತ. ಒಬ್ಬರ ಹೆಸರೂ ಬಿಟ್ಟು ಹೋಗ್ಬಾರದು. ಬಿಟ್ಟು ಹೋದ್ರೆ ಆಮೇಲೆ ಅದನ್ನ ಸರಿ ಮಾಡೋಕೆ ತಿಂಗಳುಗಟ್ಟಲೆ ಆಗುತ್ತೆ.'
    tr: 'Sari. Vaṁśavṛkṣakke arji hākuvāga ondu aphiḍaviṭ koḍbēku: tīrkoṇḍōrige yāryāru vārasudāraru idāre anta. Obbara hesarū biṭṭu hōgbāradu. Biṭṭu hōdre āmēle adanna sari māḍōke tiṅgaḷugaṭṭale āgutte.'
    en: Right. When you apply for the family tree, you have to give an affidavit stating who all the heirs of the deceased are. Not a single name must be left out. If one is, it takes months to put right afterwards.
  - who: avva
    t: ನಮ್ಮೆಜಮಾನ್ರಿಗೆ ನಾನು, ಎರಡು ಗಂಡು ಮಕ್ಕಳು, ಒಬ್ಬ ಮಗಳು. ಅಷ್ಟೇ ಕಣಪ್ಪ. ಅವ್ರ ಅಪ್ಪ-ಅವ್ವ ಯಾವಾಗ್ಲೋ ಹೋಗ್ಬುಟ್ರು.
    tr: Nammejamānrige nānu, eraḍu gaṇḍu makkaḷu, obba magaḷu. Aṣṭē kaṇappa. Avra appa-avva yāvāglō hōgbuṭru.
    en: My husband has me, two sons and one daughter. That's all, son. His father and mother passed away long ago.
  - who: va
    t: 'ಒಳ್ಳೇದು ಅಮ್ಮ. ಅವರ ತಾಯಿ ಬದುಕಿದ್ದಿದ್ರೆ ಅವರೂ ವಾರಸುದಾರರಾಗ್ತಿದ್ರು. ಹಾಗಾದ್ರೆ ನಾಲ್ಕು ಜನ. ಇನ್ನೊಂದು ಪ್ರಶ್ನೆ, ದಾಖಲೆಗೋಸ್ಕರ: ಈ ಜಮೀನು ಚನ್ನೇಗೌಡ್ರು ಸ್ವಂತ ಸಂಪಾದಿಸಿದ್ದಾ, ಅಥವಾ ಅವರ ಅಪ್ಪನಿಂದ ಬಂದಿದ್ದಾ?'
    tr: 'Oḷḷēdu amma. Avara tāyi badukiddidre avarū vārasudārarāgtidru. Hāgādre nālku jana. Innondu praśne, dākhalegōskara: ī jamīnu Cannēgauḍru svanta sampādisiddā, athavā avara appaninda bandiddā?'
    en: 'Good, Amma. If his mother had been alive, she too would have been an heir. So that makes four people. One more question, for the record: did Channegowda acquire this land himself, or did it come from his father?'
  - who: mahadeva
    t: ಗದ್ದೆ ತಾತನಿಂದ ಬಂದಿದ್ದು, ಕರಿಯಪ್ಪನವರಿಂದ. ಹೊಲ — ಆ ಎಂಬತ್ತೇಳರ ಎರಡೂವರೆ ಎಕರೆ — ಅಪ್ಪ ಎಂಬತ್ತರ ದಶಕದಲ್ಲಿ ಸ್ವಂತ ದುಡ್ಡಲ್ಲಿ ಕೊಂಡ್ಕಂಡಿದ್ದು. ಕ್ರಯ ಪತ್ರ ಪೆಟ್ಟಿಗೇಲಿ ಇದೆ.
    tr: Gadde tātaninda bandiddu, Kariyappanavarinda. Hola — ā embattēḷara eraḍūvare ekare — appa embattara daśakadalli svanta duḍḍalli koṇḍkaṇḍiddu. Kraya patra peṭṭigēli ide.
    en: The wet land came from our grandfather, from Kariyappa. The dry field — those two and a half acres in 87 — Appa bought with his own money in the eighties. The sale deed is in the trunk.
  - who: va
    t: 'ಅದನ್ನೂ ತನ್ನಿ. ಪೌತಿ ಖಾತೆಗೆ ಅದು ಅಷ್ಟು ಮುಖ್ಯ ಅಲ್ಲ, ಎರಡರಲ್ಲೂ ಎಲ್ಲಾ ವಾರಸುದಾರರ ಹೆಸರು ಸೇರುತ್ತೆ. ಆದ್ರೆ ಮುಂದೆ ಪಾಲು ಮಾಡ್ಕೊಳ್ಳುವಾಗ ಆ ವ್ಯತ್ಯಾಸ ಬೇಕಾಗಬಹುದು. ಒಂದು ವಿಷಯ ಮೊದ್ಲೇ ಹೇಳ್ತೀನಿ: ಖಾತೆ ಅಂದ್ರೆ ಮಾಲೀಕತ್ವದ ಪುರಾವೆ ಅಲ್ಲ. ಅದು ಕಂದಾಯದ ದಾಖಲೆ ಅಷ್ಟೇ. ಕೋರ್ಟ್‌ಗಳು ಇದನ್ನ ಪದೇ ಪದೇ ಹೇಳ್ತವೆ.'
    tr: 'Adannū tanni. Pauti khātege adu aṣṭu mukhya alla, eraḍarallū ellā vārasudārara hesaru sērutte. Ādre munde pālu māḍkoḷḷuvāga ā vyatyāsa bēkāgabahudu. Ondu viṣaya modlē hēḷtīni: khāte andre mālīkatvada purāve alla. Adu kandāyada dākhale aṣṭē. Kōrṭ-gaḷu idanna padē padē hēḷtave.'
    en: 'Bring that too. For the pauti khata it doesn''t matter much — all the heirs'' names go into both. But later, when you divide the property, that difference may matter. Let me tell you one thing up front: a khata is not proof of ownership. It''s only a revenue record. The courts say this again and again.'
  - who: suresh
    t: ಅರ್ಥ ಆಯ್ತು. ಒಟ್ಟು ಎಷ್ಟು ದಿನ ಆಗುತ್ತೆ?
    tr: Artha āytu. Oṭṭu eṣṭu dina āgutte?
    en: Understood. How long will it take altogether?
  - who: va
    t: ವಂಶವೃಕ್ಷ ಸಕಾಲ ಯೋಜನೆಯಲ್ಲಿ ಬರುತ್ತೆ — ಹದಿನಾಲ್ಕು ಕೆಲಸದ ದಿನದೊಳಗೆ ಕೊಡ್ಬೇಕು ಅಂತ ನಿಯಮ ಇದೆ. ಆಮೇಲೆ ನಾನು ಜಮೀನಿಗೆ ಬಂದು ಸ್ಥಳ ಮಹಜರ್ ಮಾಡ್ತೀನಿ, ಎಲ್ಲಾ ವಾರಸುದಾರರ ಹೇಳಿಕೆ ತಗೋತೀನಿ, ಕಡತ ರೆವಿನ್ಯೂ ಇನ್ಸ್‌ಪೆಕ್ಟರ್‌ಗೆ ಕಳಿಸ್ತೀನಿ. ಎಲ್ಲರಿಗೂ ನೋಟಿಸ್ ಹೋಗುತ್ತೆ. ಯಾರೂ ಆಕ್ಷೇಪಣೆ ಮಾಡ್ದೇ ಇದ್ರೆ ಆರ್‌ಐ ದೃಢೀಕರಿಸ್ತಾರೆ, ಹೊಸ ಪಹಣಿ ಬರುತ್ತೆ. ಎಲ್ಲಾ ಸರಿಯಾಗಿ ನಡೆದ್ರೆ ಒಂದೂವರೆಯಿಂದ ಎರಡು ತಿಂಗಳು.
    tr: Vaṁśavṛkṣa sakāla yōjaneyalli barutte — hadinālku kelasada dinadoḷage koḍbēku anta niyama ide. Āmēle nānu jamīnige bandu sthaḷa mahajar māḍtīni, ellā vārasudārara hēḷike tagōtīni, kaḍata revinyū inspekṭar-ge kaḷistīni. Ellarigū nōṭis hōgutte. Yārū ākṣēpaṇe māḍdē idre ār-ai dṛḍhīkaristāre, hosa pahaṇi barutte. Ellā sariyāgi naḍedre ondūvareyinda eraḍu tiṅgaḷu.
    en: The family tree comes under the Sakala scheme — the rule says it must be issued within fourteen working days. After that I come to the land and do the spot mahazar, take statements from all the heirs and send the file to the Revenue Inspector. Notice goes to everyone. If nobody objects, the RI certifies it and a new RTC comes. If everything goes smoothly, a month and a half to two months.
  - who: mahadeva
    t: ಎಲ್ಲಾ ಸರಿಯಾಗಿ ನಡೆದ್ರೆ… ಸರ್ಕಾರಿ ಕೆಲಸದಲ್ಲಿ ಅದೇ ದೊಡ್ಡ ‘ಆದ್ರೆ’ ಕಣ್ರೀ.
    tr: Ellā sariyāgi naḍedre… sarkāri kelasadalli adē doḍḍa ‘ādre’ kaṇrī.
    en: '''If everything goes smoothly''… in government work, that''s the big ''but'', sir.'
  - who: va
    t: ನಿಜ ಹೇಳ್ತೀನಿ, ನನ್ನ ಕೈಯಲ್ಲಿ ಮೂರು ಹಳ್ಳಿ ಇವೆ, ನಾನೊಬ್ನೇ ಇದೀನಿ. ಸರ್ವರ್ ಡೌನ್ ಆದ್ರೆ ದಿನವೆಲ್ಲಾ ಕಂಪ್ಯೂಟರ್ ಮುಂದೆ ಕೂತ್ಕೊಂಡೇ ಇರ್ಬೇಕು. ಇವತ್ತು ಕೂಡ ಭೂಮಿ ತಂತ್ರಾಂಶ ಬೆಳಿಗ್ಗೆಯಿಂದ ತೆಗೀತಿಲ್ಲ. ನಿಮ್ಮ ಮೇಲೆ ಕೋಪ ಇಲ್ಲ, ವ್ಯವಸ್ಥೆ ಹಾಗಿದೆ.
    tr: Nija hēḷtīni, nanna kaiyalli mūru haḷḷi ive, nānobnē idīni. Sarvar ḍaun ādre dinavellā kampyūṭar munde kūtkoṇḍē irbēku. Ivattu kūḍa bhūmi tantrāṁśa beḷiggeyinda tegītilla. Nimma mēle kōpa illa, vyavasthe hāgide.
    en: 'I''ll be honest: I have three villages in my charge and I''m on my own. When the server goes down I have to sit in front of the computer all day. Even today the Bhoomi software hasn''t opened since morning. It''s nothing against you — that''s how the system is.'
  - who: suresh
    t: ಪರವಾಗಿಲ್ಲ. ನಾವು ಇವತ್ತೇ ನಾಡಕಚೇರಿಗೆ ಹೋಗಿ ವಂಶವೃಕ್ಷಕ್ಕೆ ಅರ್ಜಿ ಹಾಕ್ತೀವಿ. ಶೋಭಾ ಆಧಾರ್ ಕಾಪಿ ವಾಟ್ಸಾಪ್‌ನಲ್ಲಿ ಕಳಿಸಿದಾಳೆ, ಪ್ರಿಂಟ್ ತೆಗೆಸ್ತೀನಿ.
    tr: Paravāgilla. Nāvu ivattē nāḍakacērige hōgi vaṁśavṛkṣakke arji hāktīvi. Śōbhā ādhār kāpi vāṭsāp-nalli kaḷisidāḷe, priṇṭ tegestīni.
    en: That's all right. We'll go to the Nadakacheri today itself and apply for the family tree. Shobha has sent her Aadhaar copy on WhatsApp; I'll get it printed.
  - who: va
    t: 'ಒಳ್ಳೇದು. ಒಂದು ಮಾತು: ಮಹಜರ್ ದಿನ ನಾಲ್ಕೂ ಜನ ಇರ್ಬೇಕು. ಮಗಳು ಮೈಸೂರಲ್ಲಿದ್ರೂ ಅವತ್ತು ಬರ್ಲೇಬೇಕು. ಆಮೇಲೆ ‘ನನ್ನ ಕೇಳ್ಲೇ ಇಲ್ಲ’ ಅನ್ನೋ ಮಾತು ಬರಬಾರದು.'
    tr: 'Oḷḷēdu. Ondu mātu: mahajar dina nālkū jana irbēku. Magaḷu Maisūralliddrū avattu barlēbēku. Āmēle ‘nanna kēḷlē illa’ annō mātu barabāradu.'
    en: 'Good. One thing: all four must be present on the day of the mahazar. Even if your sister lives in Mysuru, she must come that day. We don''t want anyone saying later, ''Nobody asked me.'''
  - section: The Nadakacheri queue
    learn: 'office life: ṭōkan nambar, kyū, arji phāram, rasīdi, sakāla, mesēj barutte · rural forms: kuntkōtīni, nōytā ide · mourning customs: varṣa āgōvaregū habba illa · a small trust that will matter later: nīnē tumbu, nīnē iṭkō'
  - scene: 'The same afternoon. The hobli Nadakacheri — the citizens'' service centre — a single-storey government building with a neem tree outside. The verandah is full: farmers with files, old women with Aadhaar cards, students wanting caste and income certificates. A token machine and a Sakala notice board on the wall.'
  - who: mahadeva
    t: ಅಣ್ಣ, ನಮ್ಮ ಟೋಕನ್ ನಂಬರ್ ನಲವತ್ತೇಳು. ಈಗ ಇಪ್ಪತ್ತೊಂಬತ್ತು ನಡೀತಿದೆ. ಒಂದು ಗಂಟೆ ಆದ್ರೂ ಆಗುತ್ತೆ.
    tr: Aṇṇa, namma ṭōkan nambar nalavattēḷu. Īga ippattombattu naḍītide. Ondu gaṇṭe ādrū āgutte.
    en: Anna, our token number is forty-seven. They're on twenty-nine now. It'll be at least an hour.
  - who: suresh
    t: ನಮ್ಮ ಬ್ಯಾಂಕಲ್ಲಿ ಗ್ರಾಹಕರು ಹತ್ತು ನಿಮಿಷ ಕಾದ್ರೆ ನನ್ನ ಮೇಲೆ ದೂರು ಬರೀತಾರೆ. ಇವತ್ತು ಗೊತ್ತಾಗ್ತಿದೆ ಕೌಂಟರ್‌ನ ಈ ಕಡೆ ನಿಲ್ಲೋದು ಹೇಗಿರುತ್ತೆ ಅಂತ.
    tr: Namma byāṅkalli grāhakaru hattu nimiṣa kādre nanna mēle dūru barītāre. Ivattu gottāgtide kauṇṭar-na ī kaḍe nillōdu hēgirutte anta.
    en: At my bank, if customers wait ten minutes they write complaints about me. Today I'm finding out what it's like to stand on this side of the counter.
  - who: avva
    t: ನಾನು ಆ ಬೇವಿನ ಮರದ ಕೆಳಗೆ ಕುಂತ್ಕೋತೀನಿ ಕಣಪ್ಪ. ಕಾಲು ನೋಯ್ತಾ ಇದೆ.
    tr: Nānu ā bēvina marada keḷage kuntkōtīni kaṇappa. Kālu nōytā ide.
    en: I'll sit under that neem tree, son. My legs are aching.
  - who: suresh
    t: ಬಾ ಅವ್ವ, ನಾನು ಕರ್ಕೊಂಡು ಹೋಗ್ತೀನಿ, ನೀರು ತಂದ್ಕೊಡ್ತೀನಿ. ಮಹದೇವ, ಅರ್ಜಿ ಫಾರಂ ನೀನೇ ತುಂಬು. ಕನ್ನಡ ಫಾರಂ, ನಿನ್ನ ಅಕ್ಷರ ನನಗಿಂತ ಚೆನ್ನಾಗಿದೆ.
    tr: Bā avva, nānu karkoṇḍu hōgtīni, nīru tandkoḍtīni. Mahadēva, arji phāram nīnē tumbu. Kannaḍa phāram, ninna akṣara nanaginta cennāgide.
    en: Come, Avva, I'll take you there and bring you some water. Mahadeva, you fill in the application form. It's a Kannada form, and your handwriting is better than mine.
  - who: mahadeva
    t: ಆಯ್ತು. ರೇಷನ್ ಕಾರ್ಡ್ ಕೂಡ ಕೇಳ್ತಾರೆ ಅಂದ್ರು, ತಂದಿದೀನಿ. ಹೆಸರೆಲ್ಲಾ ಅದರಲ್ಲಿ ಇರೋ ಹಾಗೇ ಬರೀತೀನಿ, ಆಗ ಅಕ್ಷರ ತಪ್ಪಾಗಲ್ಲ.
    tr: Āytu. Rēṣan kārḍ kūḍa kēḷtāre andru, tandidīni. Hesarellā adaralli irō hāgē barītīni, āga akṣara tappāgalla.
    en: All right. They said they'd ask for the ration card as well, so I've brought it. I'll write all the names exactly as they are on it; that way there'll be no spelling mistakes.
  - who: suresh
    t: ಅರ್ಜಿ ತಗೊಂಡ್ರು. ಶುಲ್ಕ ತುಂಬಾ ಕಮ್ಮಿ, ರಸೀದಿ ಕೊಟ್ರು. ಸಕಾಲದಲ್ಲಿ ಹದಿನಾಲ್ಕು ಕೆಲಸದ ದಿನದೊಳಗೆ ಬರುತ್ತೆ, ಫೋನಿಗೆ ಮೆಸೇಜ್ ಬರುತ್ತೆ ಅಂತ ಹೇಳಿದ್ರು.
    tr: Arji tagoṇḍru. Śulka tumbā kammi, rasīdi koṭru. Sakāladalli hadinālku kelasada dinadoḷage barutte, phōnige mesēj barutte anta hēḷidru.
    en: (an hour later, coming back from the counter) They've taken the application. The fee was very small, and they gave a receipt. They said under Sakala it'll come within fourteen working days, and a message will come to the phone.
  - who: avva
    t: ಹದಿನಾಲ್ಕು ದಿನ… ಅಷ್ಟರಲ್ಲಿ ಸಂಕ್ರಾಂತಿನೂ ಬಂದು ಹೋಗುತ್ತೆ. ಈ ಸಲ ನಮ್ಮನೇಲಿ ಹಬ್ಬ ಮಾಡೋ ಹಂಗಿಲ್ಲ.
    tr: Hadinālku dina… aṣṭaralli saṅkrāntinū bandu hōgutte. Ī sala nammanēli habba māḍō haṅgilla.
    en: Fourteen days… Sankranti will have come and gone by then. This year we can't celebrate the festival in our house.
  - who: suresh
    t: ಗೊತ್ತು ಅವ್ವ. ವರ್ಷ ಆಗೋವರೆಗೂ ಹಬ್ಬ ಇಲ್ಲ. ಆದ್ರೆ ರಕ್ಷಿತ್ ಬರ್ತಾನೆ, ಮಹದೇವನ ಜೊತೆ ದನಗಳಿಗೆ ಮೈ ತೊಳೀತಾನೆ. ತಾತಂಗೆ ಮಾತು ಕೊಟ್ಟಿದಾನೆ, ಅಷ್ಟಾದ್ರೂ ಮಾಡ್ಲಿ.
    tr: Gottu avva. Varṣa āgōvaregū habba illa. Ādre Rakṣit bartāne, Mahadēvana jote danagaḷige mai toḷītāne. Tātaṅge mātu koṭṭidāne, aṣṭādrū māḍli.
    en: I know, Avva. No festivals until the year is over. But Rakshith will come and wash the cattle with Mahadeva. He gave Thatha his word; let him at least do that much.
  - who: mahadeva
    t: ಅಣ್ಣ, ಅರ್ಜಿ ಕಾಪಿ ನೀನೇ ಇಟ್ಕೋ. ನನ್ನ ಹತ್ರ ಇದ್ರೆ ದನಗಳ ಮೇವಿನ ಜೊತೆ ಎಲ್ಲೋ ಕಳೆದೋಗುತ್ತೆ.
    tr: Aṇṇa, arji kāpi nīnē iṭkō. Nanna hatra idre danagaḷa mēvina jote ellō kaḷedōgutte.
    en: Anna, you keep the copy of the application. If it stays with me it'll get lost somewhere along with the cattle fodder.
  - who: suresh
    t: ಸರಿ, ಫೈಲಲ್ಲಿ ಇಡ್ತೀನಿ.
    tr: Sari, phailalli iḍtīni.
    en: Fine, I'll put it in the file. (He slips it into the folder without reading it.)
  - section: A name left out
    learn: 'reading a certificate: mṛtaru, patni, maga, vārasudāraru · blame and excuses: bēkanta biḍlilla, rēṣan kārḍ-nalli idda hāge · the law in plain words: maduve āgli biḍli, maganaṣṭē vārasudāraḷu · fixing it: tiddupaḍi arji · a hinted ''fee'' and a firm refusal: rasīdi illada ondu rūpāyinū…'
  - scene: Thursday, 22 January 2026. The Village Accountant's room again. The family-tree certificate has arrived. Shobha has come from Mysuru on the early bus; Suresh has driven down from Bengaluru. Avva and Mahadeva are there too.
  - who: va
    t: ವಂಶವೃಕ್ಷ ಪ್ರಮಾಣ ಪತ್ರ ಬಂದಿದೆ. ಮಹಜರ್‌ಗೆ ಮುಂಚೆ ನೀವೆಲ್ಲಾ ಒಂದ್ಸಲ ಚೆನ್ನಾಗಿ ನೋಡಿ. ಆಮೇಲೆ ‘ನಮಗೆ ಗೊತ್ತಿರ್ಲಿಲ್ಲ’ ಅನ್ಬೇಡಿ.
    tr: Vaṁśavṛkṣa pramāṇa patra bandide. Mahajar-ge mun̄ce nīvellā ondsala cennāgi nōḍi. Āmēle ‘namage gottirlilla’ anbēḍi.
    en: The family-tree certificate has come. Before the mahazar, all of you look at it carefully once. Don't say afterwards, 'We didn't know.'
  - who: shobha
    t: 'ಕೊಡಿ… ‘ಚನ್ನೇಗೌಡ ಬಿನ್ ಕರಿಯಪ್ಪ, ಮೃತರು. ವಾರಸುದಾರರು: ಒಂದು, ಪುಟ್ಟಮ್ಮ, ಪತ್ನಿ. ಎರಡು, ಸುರೇಶ, ಮಗ. ಮೂರು, ಮಹದೇವ, ಮಗ.’ … ಅಷ್ಟೇ? ನಾಲ್ಕನೇ ಹೆಸರು ಎಲ್ಲಿ? ನಾನು ಎಲ್ಲಿ?'
    tr: 'Koḍi… ‘Cannēgauḍa bin Kariyappa, mṛtaru. Vārasudāraru: ondu, Puṭṭamma, patni. Eraḍu, Surēśa, maga. Mūru, Mahadēva, maga.’ … Aṣṭē? Nālkanē hesaru elli? Nānu elli?'
    en: 'Give it to me… ''Channegowda, son of Kariyappa, deceased. Heirs: one, Puttamma, wife. Two, Suresha, son. Three, Mahadeva, son.'' … That''s all? Where''s the fourth name? Where am I?'
  - who: suresh
    t: ಏನು? ಕೊಡು ಇಲ್ಲಿ… ಹೌದು, ನಿನ್ನ ಹೆಸರೇ ಇಲ್ಲ. ಸಿದ್ದರಾಜು ಅವರೇ, ಇದು ಹೇಗಾಯ್ತು?
    tr: Ēnu? Koḍu illi… haudu, ninna hesarē illa. Siddarāju avarē, idu hēgāytu?
    en: What? Give it here… yes, your name isn't there at all. Siddaraju, how did this happen?
  - who: va
    t: ನಾಡಕಚೇರಿಯವರು ಅರ್ಜಿಯಲ್ಲಿ ಬರೆದ ಹೆಸರುಗಳನ್ನೇ ಪರಿಶೀಲನೆ ಮಾಡ್ತಾರೆ, ಸಾರ್. ಅವರು ಹೊಸ ಹೆಸರು ಸೇರಿಸಲ್ಲ. ಅರ್ಜಿಯ ಕಾಪಿ ನಿಮ್ಮ ಹತ್ರ ಇದ್ಯಾ? ನೋಡಿ.
    tr: Nāḍakacēriyavaru arjiyalli bareda hesarugaḷannē pariśīlane māḍtāre, sār. Avaru hosa hesaru sērisalla. Arjiya kāpi nimma hatra idyā? Nōḍi.
    en: The Nadakacheri people only verify the names written in the application, sir. They don't add new ones. Do you have a copy of the application? Have a look.
  - who: suresh
    t: … ಅರ್ಜಿಯಲ್ಲೂ ಮೂರೇ ಹೆಸರು. ಮಹದೇವ, ಇದು ನೀನು ಬರೆದಿದ್ದು.
    tr: … Arjiyallū mūrē hesaru. Mahadēva, idu nīnu barediddu.
    en: (opening the folder) … Only three names in the application as well. Mahadeva, you're the one who wrote this.
  - who: mahadeva
    t: ರೇಷನ್ ಕಾರ್ಡ್‌ನಲ್ಲಿ ಇದ್ದ ಹಾಗೆ ಬರೆದೆ ಅಣ್ಣ. ಶೋಭಂದು ಮದುವೆ ಆದ ಮೇಲೆ ಅವಳ ಹೆಸರು ಮೈಸೂರಿನ ಕಾರ್ಡ್‌ಗೆ ಹೋಯ್ತು. ನಾನು ಬೇಕಂತ ಬಿಡ್ಲಿಲ್ಲ.
    tr: Rēṣan kārḍ-nalli idda hāge barede aṇṇa. Śōbhandu maduve āda mēle avaḷa hesaru Maisūrina kārḍ-ge hōytu. Nānu bēkanta biḍlilla.
    en: I wrote it the way it was on the ration card, Anna. After Shobha's wedding her name moved to the card in Mysuru. I didn't leave it out on purpose.
  - who: shobha
    t: ಬೇಕಂತ ಬಿಡ್ಲಿಲ್ವಾ? ಮಹದೇವ, ನೀನು ಹತ್ತನೇ ಕ್ಲಾಸ್ ಹುಡುಗ ಅಲ್ಲ. ವಂಶವೃಕ್ಷ ಅಂದ್ರೆ ರೇಷನ್ ಕಾರ್ಡ್ ಅಲ್ಲ. ಒಬ್ಬರ ಹೆಸರೂ ಬಿಡ್ಬಾರ್ದು ಅಂತ ಸಿದ್ದರಾಜು ಅವರು ಹೇಳಿದ್ರು ಅಂತ ಅಣ್ಣ ಅವತ್ತೇ ನನಗೆ ಫೋನಲ್ಲಿ ಹೇಳಿದ್ದ.
    tr: Bēkanta biḍlilvā? Mahadēva, nīnu hattanē klās huḍuga alla. Vaṁśavṛkṣa andre rēṣan kārḍ alla. Obbara hesarū biḍbārdu anta Siddarāju avaru hēḷidru anta aṇṇa avattē nanage phōnalli hēḷidda.
    en: Not on purpose? Mahadeva, you're not a tenth-standard boy. A family tree is not a ration card. Anna told me on the phone that very day that Siddaraju had said not a single name should be left out.
  - who: mahadeva
    t: ಹೌದು ಕಣೇ, ಗೊತ್ತಿತ್ತು! ನಿಜ ಹೇಳ್ಲಾ? ನಮ್ಮೂರಲ್ಲಿ ಮದುವೆ ಆದ ಹೆಣ್ಣುಮಕ್ಕಳು ತವರು ಮನೆ ಜಮೀನಲ್ಲಿ ಪಾಲು ಕೇಳಲ್ಲ. ನಿನ್ ಮದುವೆಗೆ ಅಪ್ಪ ಎರಡು ಲಕ್ಷ ಸಾಲ ಮಾಡಿದ್ರು, ಐದು ವರ್ಷ ನಾನು ತೀರಿಸ್ದೆ. ಅದೇ ನಿನ್ನ ಪಾಲು ಅಂತ ಊರೆಲ್ಲಾ ಅಂದ್ಕೊಂಡಿದೆ.
    tr: Haudu kaṇē, gottittu! Nija hēḷlā? Nammūralli maduve āda heṇṇumakkaḷu tavaru mane jamīnalli pālu kēḷalla. Nin maduvege appa eraḍu lakṣa sāla māḍidru, aidu varṣa nānu tīrisde. Adē ninna pālu anta ūrellā andkoṇḍide.
    en: Yes, girl, I knew! Shall I tell you the truth? In our village, married daughters don't ask for a share of their parents' land. Appa borrowed two lakh for your wedding, and for five years I paid it off. The whole village believes that was your share.
  - who: shobha
    t: ಊರು ಏನು ಅಂದ್ಕೊಳ್ಳುತ್ತೆ ಅನ್ನೋದು ಕಾನೂನು ಅಲ್ಲ. ಮದುವೆ ಖರ್ಚು ಆಸ್ತಿಯ ಪಾಲು ಅಲ್ಲ. ಹಿಂದೂ ಉತ್ತರಾಧಿಕಾರ ಕಾಯ್ದೆ ಪ್ರಕಾರ ಮಗಳು ಮದುವೆ ಆಗ್ಲಿ ಬಿಡ್ಲಿ, ಮಗನಷ್ಟೇ ವಾರಸುದಾರಳು. ಇದು ನನ್ನ ಅಭಿಪ್ರಾಯ ಅಲ್ಲ ಮಹದೇವ, ಕಾನೂನು.
    tr: Ūru ēnu andkoḷḷutte annōdu kānūnu alla. Maduve kharcu āstiya pālu alla. Hindū uttarādhikāra kāyde prakāra magaḷu maduve āgli biḍli, maganaṣṭē vārasudāraḷu. Idu nanna abhiprāya alla Mahadēva, kānūnu.
    en: What the village believes is not the law. Wedding expenses are not a share of the property. Under the Hindu Succession Act, a daughter — married or not — is as much an heir as a son. This isn't my opinion, Mahadeva. It's the law.
  - who: avva
    t: ಅಯ್ಯೋ, ಆಫೀಸಲ್ಲಿ ಜಗಳ ಬೇಡ ಕಣ್ರಪ್ಪ… ಹೊರಗೆ ಊರಿನೋರೆಲ್ಲಾ ಕೇಳಿಸ್ಕೋತಿದಾರೆ.
    tr: Ayyō, āphīsalli jagaḷa bēḍa kaṇrappa… horage ūrinōrellā kēḷiskōtidāre.
    en: Oh, no fighting in the office, my children… everyone from the village outside can hear.
  - who: va
    t: ಅಮ್ಮ ಹೇಳೋದು ಸರಿ. ನೋಡಿ, ನನ್ನ ಕೆಲಸ ಕಾನೂನು ಪ್ರಕಾರ ಎಲ್ಲಾ ವಾರಸುದಾರರ ಹೆಸರು ಸೇರಿಸೋದು. ಮಗಳ ಹೆಸರು ಬಿಟ್ಟು ಖಾತೆ ಮಾಡಿದ್ರೆ ಅದು ತಪ್ಪು, ನಾಳೆ ಅದಕ್ಕೆ ನಾನೇ ಉತ್ತರ ಕೊಡ್ಬೇಕು. ಇದನ್ನ ಸರಿ ಮಾಡೋಕೆ ತಿದ್ದುಪಡಿ ಅರ್ಜಿ ಹಾಕ್ಬೇಕು — ಹೊಸ ಅಫಿಡವಿಟ್, ಮಗಳ ಆಧಾರ್, ಅವರ ಸಹಿ.
    tr: Amma hēḷōdu sari. Nōḍi, nanna kelasa kānūnu prakāra ellā vārasudārara hesaru sērisōdu. Magaḷa hesaru biṭṭu khāte māḍidre adu tappu, nāḷe adakke nānē uttara koḍbēku. Idanna sari māḍōke tiddupaḍi arji hākbēku — hosa aphiḍaviṭ, magaḷa ādhār, avara sahi.
    en: Amma is right. Look, my job is to include the names of all the heirs as the law requires. If I do the khata leaving out the daughter's name, that's wrong, and tomorrow I'm the one who has to answer for it. To fix this you have to file a correction application — a new affidavit, the daughter's Aadhaar, her signature.
  - who: suresh
    t: ಮತ್ತೆ ಎಷ್ಟು ದಿನ ಆಗುತ್ತೆ?
    tr: Matte eṣṭu dina āgutte?
    en: And how long will that take?
  - who: va
    t: ಮತ್ತೆ ಹದಿನಾಲ್ಕು ದಿನ, ಸಾರ್. ಕೆಲವರು… ಬೇಗ ಆಗ್ಲಿ ಅಂತ ತಾಲೂಕು ಆಫೀಸಲ್ಲಿ ಯಾರನ್ನೋ ‘ನೋಡ್ಕೊಳ್ತಾರೆ’. ಆಗ ಫೈಲ್ ಒಂದು ಟೇಬಲ್‌ನಿಂದ ಇನ್ನೊಂದು ಟೇಬಲ್‌ಗೆ ಬೇಗ ಓಡುತ್ತೆ. ನಾನೇನೂ ಕೇಳ್ತಿಲ್ಲ, ಹೀಗೂ ನಡೆಯುತ್ತೆ ಅಂತ ಹೇಳ್ದೆ ಅಷ್ಟೇ.
    tr: Matte hadinālku dina, sār. Kelavaru… bēga āgli anta tālūku āphīsalli yārannō ‘nōḍkoḷḷtāre’. Āga phail ondu ṭēbal-ninda innondu ṭēbal-ge bēga ōḍutte. Nānēnū kēḷtilla, hīgū naḍeyutte anta hēḷde aṣṭē.
    en: (lowering his voice) Another fourteen days, sir. Some people… to speed things up, they 'take care of' someone at the taluk office. Then the file runs quickly from one table to the next. I'm not asking for anything — I'm only telling you that this also happens.
  - who: suresh
    t: ಸಿದ್ದರಾಜು ಅವರೇ, ನಾನು ಇಪ್ಪತ್ತು ವರ್ಷದಿಂದ ಬ್ಯಾಂಕಲ್ಲಿ ಕೆಲಸ ಮಾಡ್ತಿದೀನಿ. ರಸೀದಿ ಇಲ್ಲದ ಒಂದು ರೂಪಾಯಿನೂ ನನ್ನ ಕೈಯಿಂದ ಹೋಗಿಲ್ಲ. ನಮ್ಮಪ್ಪನ ಹೆಸರಲ್ಲಿ ಮಾಡೋ ಕೆಲಸಕ್ಕೆ ಆ ದಾರಿ ಬೇಡ. ಹದಿನಾಲ್ಕು ದಿನ ಕಾಯ್ತೀವಿ. ಬೇಕಾದ್ರೆ ಇಪ್ಪತ್ತೆಂಟು ದಿನ.
    tr: Siddarāju avarē, nānu ippattu varṣadinda byāṅkalli kelasa māḍtidīni. Rasīdi illada ondu rūpāyinū nanna kaiyinda hōgilla. Nammappana hesaralli māḍō kelasakke ā dāri bēḍa. Hadinālku dina kāytīvi. Bēkādre ippatteṇṭu dina.
    en: Siddaraju, I've worked in a bank for twenty years. Not one rupee without a receipt has ever left my hands. For work done in my father's name, we won't take that road. We'll wait fourteen days. Twenty-eight if need be.
  - who: va
    t: ಸರಿ ಸಾರ್. ನಿಮ್ಮಂಥವರು ಇದ್ರೆ ನಮ್ಮ ಕೆಲಸಾನೂ ಸುಲಭ. ತಿದ್ದುಪಡಿ ಅರ್ಜಿ ನಾನೇ ಇವತ್ತು ಮುಂದಕ್ಕೆ ಕಳಿಸ್ತೀನಿ, ಹಿಂದೆ ಇಟ್ಕೊಳ್ಳಲ್ಲ. ಹೊಸ ಪ್ರಮಾಣ ಪತ್ರ ಬಂದ ಮೊದಲ ಶನಿವಾರ ಮಹಜರ್.
    tr: Sari sār. Nimmanthavaru idre namma kelasānū sulabha. Tiddupaḍi arji nānē ivattu mundakke kaḷistīni, hinde iṭkoḷḷalla. Hosa pramāṇa patra banda modala śanivāra mahajar.
    en: (nodding, a little embarrassed) All right, sir. With people like you, our work is easier too. I'll send the correction application forward myself today; I won't hold it back. The mahazar will be on the first Saturday after the new certificate comes.
  - who: shobha
    t: ನಾನು ಬರ್ತೀನಿ. ಆ ಶನಿವಾರ ಮಾತ್ರ ಅಲ್ಲ, ಎಷ್ಟು ಸಲ ಕರೆದ್ರೂ ಬರ್ತೀನಿ.
    tr: Nānu bartīni. Ā śanivāra mātra alla, eṣṭu sala karedrū bartīni.
    en: I'll come. Not just that Saturday — however many times I'm called, I'll come.
  - who: mahadeva
    t: ಬಾ, ಬಾ. ನಿನ್ನ ಪಾಲು ತಗೊಂಡು ಮೈಸೂರಿಗೆ ಹೋಗು. ಗದ್ದೆಗೆ ನೀರು ಕಟ್ಟೋಕೆ ಮಾತ್ರ ಯಾರೂ ಬರಲ್ಲ.
    tr: Bā, bā. Ninna pālu tagoṇḍu Maisūrige hōgu. Gaddege nīru kaṭṭōke mātra yārū baralla.
    en: Come, come. Take your share and go back to Mysuru. It's only to water the paddy field that nobody ever comes.
  - who: suresh
    t: ಮಹದೇವ!
    tr: Mahadēva!
    en: Mahadeva!
  - who: mahadeva
    t: ಏನಣ್ಣ? ಸುಳ್ಳು ಹೇಳಿದ್ನಾ? … ನಾನು ಗದ್ದೆಗೆ ಹೋಗ್ಬೇಕು. ನಾಲೆಗೆ ಇವತ್ತು ನೀರು ಬಿಟ್ಟಿದಾರೆ, ನಮ್ಮ ಸರದಿ ಮಧ್ಯಾಹ್ನ.
    tr: Ēnaṇṇa? Suḷḷu hēḷidnā? … Nānu gaddege hōgbēku. Nālege ivattu nīru biṭṭidāre, namma saradi madhyāhna.
    en: What, Anna? Did I lie? … I have to go to the field. They've released water into the canal today, and our turn is this afternoon. (He walks out.)
  - who: avva
    t: ಶೋಭ… ಅವನ ಮಾತು ಮನಸ್ಸಿಗೆ ತಗೋಬೇಡ ಕಣೇ. ಅಪ್ಪ ಹೋದ ಮೇಲೆ ಅವನ ಕಾಲ ಕೆಳಗಿನ ನೆಲ ಕುಸಿದಂಗಾಗಿದೆ.
    tr: Śōbha… avana mātu manassige tagōbēḍa kaṇē. Appa hōda mēle avana kāla keḷagina nela kusidaṅgāgide.
    en: Shobha… don't take his words to heart, dear. Since your father went, it's as if the ground under his feet has given way.
  - who: shobha
    t: ಅವ್ವ, ನನಗೆ ಆ ಮಣ್ಣು ಬೇಕು ಅಂತ ಅಲ್ಲ… ನನ್ನ ಹೆಸರು ಆ ಕಾಗದದಲ್ಲಿ ಇಲ್ಲ ಅಂದ್ರೆ, ನಾನು ಅಪ್ಪನ ಮಗಳೇ ಅಲ್ಲ ಅಂತ ಬರೆದ ಹಾಗೆ. ಅದನ್ನ ಮಾತ್ರ ನಾನು ಸಹಿಸೋಕಾಗಲ್ಲ.
    tr: Avva, nanage ā maṇṇu bēku anta alla… nanna hesaru ā kāgadadalli illa andre, nānu appana magaḷē alla anta bareda hāge. Adanna mātra nānu sahisōkāgalla.
    en: Avva, it isn't that I want that soil… if my name isn't on that paper, it's as though someone has written that I'm not Appa's daughter at all. That is the one thing I cannot bear.
  - section: The spot mahazar
    learn: 'on-the-spot enquiry: sthaḷa mahajar, sākṣi, pan̄caru, hēḷike, baredukoḷḷi · in the record: bēsāya māḍuttiruvavaru · formal claims: kēḷikoḷḷtīni, nanna oppige ide · the objection: bāymātalli hēḷidru, ākṣēpaṇe koḍtīni, vivādita prakaraṇa · elder''s counsel with -lā: kēḷlā'
  - scene: Saturday, 7 February 2026, ten in the morning. The paddy land beside the canal, survey number 112. The sugarcane stands tall. Siddaraju has come on his motorbike with a register and a printed form. Thimmegowda has walked over with his stick to sign as a witness. All four heirs are present.
  - who: va
    t: ಎಲ್ರೂ ಬಂದಿದೀರಾ? ಸರಿ. ಇದು ಸ್ಥಳ ಮಹಜರ್. ಅಂದ್ರೆ ನಾನು ಜಮೀನಿಗೆ ಬಂದು, ಯಾರು ಬೇಸಾಯ ಮಾಡ್ತಿದಾರೆ, ಏನು ಬೆಳೆ ಇದೆ, ವಾರಸುದಾರರು ಯಾರು ಅಂತ ಸಾಕ್ಷಿಗಳ ಮುಂದೆ ಬರ್ಕೋತೀನಿ. ಆರ್‌ಐ ಸಾಹೇಬ್ರು ಬರ್ಬೇಕಿತ್ತು, ಆದ್ರೆ ಇವತ್ತು ಪಕ್ಕದ ಹಳ್ಳಿಯಲ್ಲಿ ಕೆರೆ ಒತ್ತುವರಿ ತೆರವು ನಡೀತಿದೆ. ಅವರು ಆಮೇಲೆ ಕಡತ ನೋಡಿ ದೃಢೀಕರಿಸ್ತಾರೆ.
    tr: Ellrū bandidīrā? Sari. Idu sthaḷa mahajar. Andre nānu jamīnige bandu, yāru bēsāya māḍtidāre, ēnu beḷe ide, vārasudāraru yāru anta sākṣigaḷa munde barkōtīni. Ār-ai sāhēbru barbēkittu, ādre ivattu pakkada haḷḷiyalli kere ottuvari teravu naḍītide. Avaru āmēle kaḍata nōḍi dṛḍhīkaristāre.
    en: Is everyone here? Good. This is the spot mahazar. It means I come to the land and, in front of witnesses, write down who is farming it, what crop is standing, and who the heirs are. The RI sir was supposed to come, but today there's an eviction of encroachments on the tank in the next village. He'll look at the file later and certify it.
  - who: elder
    t: ಸಾಕ್ಷಿಗೆ ನಾನು ಸಹಿ ಹಾಕ್ತೀನಿ. ಚನ್ನೇಗೌಡನ ಮಕ್ಕಳು ಯಾರ್ಯಾರು ಅಂತ ಈ ಊರಲ್ಲಿ ನನಗಿಂತ ಚೆನ್ನಾಗಿ ಯಾರಿಗೆ ಗೊತ್ತು? ಮೂರೂ ಮಕ್ಳು ನನ್ನ ಕಣ್ಣ ಮುಂದೆ ಹುಟ್ಟಿದ್ದು.
    tr: Sākṣige nānu sahi hāktīni. Cannēgauḍana makkaḷu yāryāru anta ī ūralli nanaginta cennāgi yārige gottu? Mūrū makḷu nanna kaṇṇa munde huṭṭiddu.
    en: I'll sign as witness. Who in this village knows better than me who Channegowda's children are? All three were born before my eyes.
  - who: va
    t: 'ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡು: ಮೂರು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆ, ಕಬ್ಬಿನ ಬೆಳೆ ಇದೆ. ಸ್ಥಳದಲ್ಲಿ ಬೇಸಾಯ ಮಾಡ್ತಿರೋರು ಯಾರು?'
    tr: 'Sarve nambar nūra hanneraḍu, hissā eraḍu: mūru ekare ippattu guṇṭe, kabbina beḷe ide. Sthaḷadalli bēsāya māḍtirōru yāru?'
    en: 'Survey number 112, hissa 2: three acres twenty guntas, a sugarcane crop standing. Who is cultivating it on the spot?'
  - who: mahadeva
    t: ನಾನು. ಮಹದೇವ, ಚನ್ನೇಗೌಡರ ಎರಡನೇ ಮಗ. ಇಪ್ಪತ್ತು ವರ್ಷದಿಂದ ನಾನೇ ಮಾಡ್ತಿದೀನಿ. ಅದನ್ನೂ ಬರ್ಕೊಳ್ಳಿ.
    tr: Nānu. Mahadēva, Cannēgauḍara eraḍanē maga. Ippattu varṣadinda nānē māḍtidīni. Adannū barkoḷḷi.
    en: Me. Mahadeva, Channegowda's second son. I've been doing it for twenty years. Write that down too.
  - who: va
    t: 'ಬರ್ಕೋತೀನಿ: ‘ಸ್ಥಳದಲ್ಲಿ ಬೇಸಾಯ ಮಾಡುತ್ತಿರುವವರು ಮಹದೇವ.’ ಈಗ ವಾರಸುದಾರರ ಹೇಳಿಕೆ. ಪುಟ್ಟಮ್ಮನವರೇ, ನಿಮ್ಮ ಹೆಸರು, ಮೃತರ ಜೊತೆ ಸಂಬಂಧ?'
    tr: 'Barkōtīni: ‘Sthaḷadalli bēsāya māḍuttiruvavaru Mahadēva.’ Īga vārasudārara hēḷike. Puṭṭammanavarē, nimma hesaru, mṛtara jote sambandha?'
    en: 'I''m writing it: ''The person cultivating on the spot is Mahadeva.'' Now the heirs'' statements. Puttamma, your name and your relationship to the deceased?'
  - who: avva
    t: ಪುಟ್ಟಮ್ಮ. ಚನ್ನೇಗೌಡ್ರ ಹೆಂಡ್ತಿ. ನಾನು ಓದಿಲ್ಲ ಕಣಪ್ಪ, ಹೆಬ್ಬೆಟ್ಟು ಹಾಕ್ತೀನಿ.
    tr: Puṭṭamma. Cannēgauḍra heṇḍti. Nānu ōdilla kaṇappa, hebbeṭṭu hāktīni.
    en: Puttamma. Channegowda's wife. I can't read, son; I'll give my thumbprint.
  - who: shobha
    t: ಶೋಭಾ. ಚನ್ನೇಗೌಡರ ಮಗಳು. ಮದುವೆ ಆಗಿದೆ, ಮೈಸೂರಲ್ಲಿ ಇದೀನಿ. ನನ್ನ ಹೆಸರನ್ನ ವಾರಸುದಾರರ ಪಟ್ಟಿಯಲ್ಲಿ ಸೇರಿಸಬೇಕು ಅಂತ ಕೇಳ್ಕೊಳ್ತೀನಿ.
    tr: Śōbhā. Cannēgauḍara magaḷu. Maduve āgide, Maisūralli idīni. Nanna hesaranna vārasudārara paṭṭiyalli sērisabēku anta kēḷkoḷḷtīni.
    en: Shobha. Channegowda's daughter. I'm married and live in Mysuru. I request that my name be included in the list of heirs.
  - who: suresh
    t: ಸುರೇಶ. ದೊಡ್ಡ ಮಗ. ಬೆಂಗಳೂರಲ್ಲಿ ಇದೀನಿ. ನಾಲ್ಕೂ ಜನರ ಹೆಸರು ಸೇರಿಸೋಕೆ ನನ್ನ ಪೂರ್ತಿ ಒಪ್ಪಿಗೆ ಇದೆ.
    tr: Surēśa. Doḍḍa maga. Beṅgaḷūralli idīni. Nālkū janara hesaru sērisōke nanna pūrti oppige ide.
    en: Suresha. The eldest son. I live in Bengaluru. I fully consent to all four names being included.
  - who: va
    t: ಮಹದೇವ ಅವರೇ, ನಿಮ್ಮ ಹೇಳಿಕೆ?
    tr: Mahadēva avarē, nimma hēḷike?
    en: Mahadeva, your statement?
  - who: mahadeva
    t: 'ನನ್ನ ಹೆಸರು ಸೇರಿಸಿ. ಆದ್ರೆ ಇನ್ನೊಂದು ಮಾತೂ ಬರ್ಕೊಳ್ಳಿ: ಅಪ್ಪ ಬದುಕಿದ್ದಾಗ್ಲೇ ಬಾಯ್ಮಾತಲ್ಲಿ ‘ಗದ್ದೆ ನಿಂಗೆ, ನೀನೇ ನೋಡ್ಕೋ’ ಅಂತ ಹೇಳಿದ್ರು. ಅದಕ್ಕೆ ನನ್ನ ಆಕ್ಷೇಪಣೆ ಇದೆ. ನಾನು ಬರವಣಿಗೇಲಿ ಅರ್ಜಿ ಕೊಡ್ತೀನಿ.'
    tr: 'Nanna hesaru sērisi. Ādre innondu mātū barkoḷḷi: appa badukiddāglē bāymātalli ‘gadde niṅge, nīnē nōḍkō’ anta hēḷidru. Adakke nanna ākṣēpaṇe ide. Nānu baravaṇigēli arji koḍtīni.'
    en: '(after a long pause) Include my name. But write down one more thing: while Appa was alive, he told me by word of mouth, ''The wet land is yours; you look after it.'' I have an objection on that basis. I''ll give a written application.'
  - who: shobha
    t: ಬಾಯ್ಮಾತು? ಯಾರ ಮುಂದೆ ಹೇಳಿದ್ರು? ಯಾವ ಕಾಗದದಲ್ಲಿದೆ?
    tr: Bāymātu? Yāra munde hēḷidru? Yāva kāgadadallide?
    en: By word of mouth? In front of whom did he say it? On which paper is it written?
  - who: va
    t: 'ದಯವಿಟ್ಟು ಇಲ್ಲಿ ವಾದ ಬೇಡ. ನಿಯಮ ಹೀಗಿದೆ: ಒಬ್ಬ ವಾರಸುದಾರರು ಲಿಖಿತವಾಗಿ ಆಕ್ಷೇಪಣೆ ಕೊಟ್ರೆ ಇದು ವಿವಾದಿತ ಪ್ರಕರಣ ಆಗುತ್ತೆ. ಆಗ ನಾನಾಗ್ಲೀ ಆರ್‌ಐ ಆಗ್ಲೀ ತೀರ್ಮಾನ ಮಾಡೋ ಹಾಗಿಲ್ಲ. ಕಡತ ತಹಸೀಲ್ದಾರ್ ಅವರ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಹೋಗುತ್ತೆ, ಅಲ್ಲಿ ವಿಚಾರಣೆ ಆಗುತ್ತೆ.'
    tr: 'Dayaviṭṭu illi vāda bēḍa. Niyama hīgide: obba vārasudāraru likhitavāgi ākṣēpaṇe koṭre idu vivādita prakaraṇa āgutte. Āga nānāglī ār-ai āglī tīrmāna māḍō hāgilla. Kaḍata tahasīldār avara nyāyālayakke hōgutte, alli vicāraṇe āgutte.'
    en: 'Please, no arguments here. The rule is this: if one heir gives a written objection, it becomes a disputed case. Then neither I nor the RI can decide it. The file goes to the Tahsildar''s court, and there''s a hearing there.'
  - who: elder
    t: ಮಹದೇವ, ಕೇಳ್ಲಾ. ನಿಮ್ಮಪ್ಪ ನನ್ನ ಹತ್ರ ಯಾವತ್ತೂ ‘ಗದ್ದೆ ಮಹದೇವಂಗೆ’ ಅಂತ ಹೇಳಿಲ್ಲ. ‘ಮೂರೂ ಮಕ್ಳು ಚೆನ್ನಾಗಿರ್ಬೇಕು’ ಅಂತ ಹೇಳ್ತಿದ್ದ. ಆಫೀಸ್ ಕಾಗದಕ್ಕೆ ಹೋಗೋ ಮುಂಚೆ ಊರ ಹಿರಿಯರ ಮುಂದೆ ಕುಂತು ಮಾತಾಡಿ.
    tr: Mahadēva, kēḷlā. Nimmappa nanna hatra yāvattū ‘gadde Mahadēvaṅge’ anta hēḷilla. ‘Mūrū makḷu cennāgirbēku’ anta hēḷtidda. Āphīs kāgadakke hōgō mun̄ce ūra hiriyara munde kuntu mātāḍi.
    en: Mahadeva, listen to me, lad. Your father never once told me 'the wet land is for Mahadeva'. What he used to say was, 'All three children must do well.' Before you go running to office papers, sit down in front of the village elders and talk.
  - who: mahadeva
    t: ಮಾತಾಡೋಣ ತಿಮ್ಮಣ್ಣ. ಆದ್ರೆ ಆಕ್ಷೇಪಣೆ ಕೊಡ್ತೀನಿ. ಯಾವ ಕಾಗದದಲ್ಲೂ ನನ್ನ ಇಪ್ಪತ್ತು ವರ್ಷ ಇಲ್ಲ. ಇಲ್ಲಾದ್ರೂ ಇರ್ಲಿ.
    tr: Mātāḍōṇa Timmaṇṇa. Ādre ākṣēpaṇe koḍtīni. Yāva kāgadadallū nanna ippattu varṣa illa. Illādrū irli.
    en: We'll talk, Thimmanna. But I'm giving the objection. My twenty years aren't on any paper anywhere. Let them at least be on this one.
  - who: va
    t: ಸರಿ. ಮಹಜರ್‌ಗೆ ಎಲ್ರೂ ಸಹಿ ಹಾಕಿ. ಆಕ್ಷೇಪಣೆ ಅರ್ಜಿ ಸೋಮವಾರದೊಳಗೆ ನನಗೆ ಕೊಡಿ. ತಹಸೀಲ್ದಾರ್ ಕಚೇರಿಯಿಂದ ಎಲ್ಲರಿಗೂ ನೋಟಿಸ್ ಬರುತ್ತೆ, ವಿಚಾರಣೆಯ ದಿನಾಂಕ ಅದರಲ್ಲೇ ಇರುತ್ತೆ.
    tr: Sari. Mahajar-ge ellrū sahi hāki. Ākṣēpaṇe arji sōmavāradoḷage nanage koḍi. Tahasīldār kacēriyinda ellarigū nōṭis barutte, vicāraṇeya dināṅka adarallē irutte.
    en: Very well. Everyone sign the mahazar. Give me the objection application by Monday. A notice will come to all of you from the Tahsildar's office; the hearing date will be in it.
  - section: The Tahsildar's hearing
    learn: 'formal register: hājarāgi, saṅkṣiptavāgi hēḷi, kaḍatadallive, sābītu · legal passives read out: tiraskarisalāgide, dākhalisatakkaddu, dākhalisalāgide · key ideas: māliktvada praśne sivil nyāyālayada kelasa, modala darjeya vārasudāraru, mēlmanavi · record words: kōṁ (wife of), bin (son of) · advice: kūtu mātāḍidare eṣṭō varṣa uḷiyutte'
  - scene: Thursday, 26 February 2026. The Tahsildar's court hall in the Mini Vidhana Soudha, Maddur. Ceiling fans, a long table, a clerk calling out case numbers. Benches are packed with farmers. Meena has taken a day's leave and come with Suresh. The notice said 10:30 a.m.; it is now past two.
  - who: meena
    t: ಬೆಳಿಗ್ಗೆ ಹತ್ತೂವರೆಗೆ ಬನ್ನಿ ಅಂತ ನೋಟಿಸ್‌ನಲ್ಲಿತ್ತು. ಈಗ ಎರಡು ಗಂಟೆ ದಾಟಿದೆ. ನಮ್ಮ ಪ್ರಕರಣ ಪಟ್ಟಿಯಲ್ಲಿ ಮೂವತ್ತೆಂಟನೇದು.
    tr: Beḷigge hattūvarege banni anta nōṭis-nallittu. Īga eraḍu gaṇṭe dāṭide. Namma prakaraṇa paṭṭiyalli mūvatteṇṭanēdu.
    en: The notice said to come at half past ten in the morning. It's past two now. Our case is thirty-eighth on the list.
  - who: suresh
    t: ಇಲ್ಲಿ ಪ್ರತಿ ಕೇಸಿನ ಹಿಂದೆ ಒಂದು ಕುಟುಂಬ ಇದೆ, ಮೀನಾ. ಆ ಮುದುಕರು ಬೆಳಿಗ್ಗೆಯಿಂದ ಒಂದು ಬದು ವಿಷಯಕ್ಕೆ ಕಾಯ್ತಿದಾರೆ. ಕೇಳಿಸ್ಕೊಂಡ್ಯಾ? ಅವರ ತಮ್ಮನ ಮಗ ಎರಡು ಅಡಿ ಒಳಗೆ ಬದು ಹಾಕಿದಾನಂತೆ.
    tr: Illi prati kēsina hinde ondu kuṭumba ide, Mīnā. Ā mudukaru beḷiggeyinda ondu badu viṣayakke kāytidāre. Kēḷiskoṇḍyā? Avara tammana maga eraḍu aḍi oḷage badu hākidānante.
    en: Behind every case here there's a family, Meena. That old man has been waiting since morning over a field bund. Did you hear? Apparently his brother's son has built the bund two feet inside his land.
  - who: tahsildar
    t: 'ಮುಂದಿನ ಪ್ರಕರಣ: ಬೆಟ್ಟಹಳ್ಳಿ ಗ್ರಾಮ, ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡು ಮತ್ತು ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದು. ಮೃತ ಚನ್ನೇಗೌಡ ಅವರ ಪೌತಿ ಖಾತೆ — ವಿವಾದಿತ ಪ್ರಕರಣ. ಅರ್ಜಿದಾರರು ಮತ್ತು ಆಕ್ಷೇಪಣೆದಾರರು ಹಾಜರಾಗಿ.'
    tr: 'Mundina prakaraṇa: Beṭṭahaḷḷi grāma, sarve nambar nūra hanneraḍu, hissā eraḍu mattu embattēḷu, hissā ondu. Mṛta Cannēgauḍa avara pauti khāte — vivādita prakaraṇa. Arjidāraru mattu ākṣēpaṇedāraru hājarāgi.'
    en: 'Next case: Bettahalli village, survey number 112, hissa 2, and 87, hissa 1. Pauti khata of the late Channegowda — a disputed case. Applicants and objector, please come forward.'
  - who: suresh
    t: ಹಾಜರಿದೀವಿ ಮೇಡಂ. ನಾನು ಸುರೇಶ, ಹಿರಿಯ ಮಗ. ಇವರು ನಮ್ಮ ತಾಯಿ ಪುಟ್ಟಮ್ಮ, ತಂಗಿ ಶೋಭಾ, ತಮ್ಮ ಮಹದೇವ.
    tr: Hājaridīvi mēḍam. Nānu Surēśa, hiriya maga. Ivaru namma tāyi Puṭṭamma, taṅgi Śōbhā, tamma Mahadēva.
    en: We're present, madam. I'm Suresha, the eldest son. This is our mother Puttamma, my sister Shobha, and my brother Mahadeva.
  - who: tahsildar
    t: ಕುಳಿತುಕೊಳ್ಳಿ. ಅಮ್ಮ, ನೀವು ಮುಂದೆ ಆ ಕುರ್ಚಿಯಲ್ಲಿ ಕುಳಿತುಕೊಳ್ಳಿ. … ಗ್ರಾಮ ಆಡಳಿತ ಅಧಿಕಾರಿಯವರ ವರದಿ, ಸ್ಥಳ ಮಹಜರ್, ತಿದ್ದುಪಡಿ ಮಾಡಿದ ವಂಶವೃಕ್ಷ ಪ್ರಮಾಣ ಪತ್ರ ಕಡತದಲ್ಲಿವೆ. ಶ್ರೀ ಮಹದೇವ ಅವರು ಆಕ್ಷೇಪಣೆ ಸಲ್ಲಿಸಿದ್ದಾರೆ. ಮಹದೇವ ಅವರೇ, ನಿಮ್ಮ ಆಕ್ಷೇಪಣೆಯನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿ ನೀವೇ ಹೇಳಿ.
    tr: Kuḷitukoḷḷi. Amma, nīvu munde ā kurciyalli kuḷitukoḷḷi. … Grāma āḍaḷita adhikāriyavara varadi, sthaḷa mahajar, tiddupaḍi māḍida vaṁśavṛkṣa pramāṇa patra kaḍatadallive. Śrī Mahadēva avaru ākṣēpaṇe sallisiddāre. Mahadēva avarē, nimma ākṣēpaṇeyannu saṅkṣiptavāgi nīvē hēḷi.
    en: Please sit. Amma, you sit on that chair in front. … The Village Administrative Officer's report, the spot mahazar and the corrected family-tree certificate are in the file. Shri Mahadeva has filed an objection. Mahadeva, please state your objection briefly yourself.
  - who: mahadeva
    t: ಮೇಡಂ, ನಾನು ಇಪ್ಪತ್ತು ವರ್ಷದಿಂದ ಆ ಜಮೀನಲ್ಲಿ ದುಡೀತಿದೀನಿ. ಅಣ್ಣ ಬೆಂಗಳೂರಲ್ಲಿ, ತಂಗಿ ಮೈಸೂರಲ್ಲಿ. ಅಪ್ಪ ಬದುಕಿದ್ದಾಗ ‘ಗದ್ದೆ ನಿಂಗೆ, ನೀನೇ ನೋಡ್ಕೋ’ ಅಂತ ಹೇಳಿದ್ರು. ಸಾಲ ಕಟ್ಟಿದ್ದು ನಾನು, ಸಂಘದ ಸಾಲ ಈಗ್ಲೂ ಬಾಕಿ ಇದೆ. ಹಂಗಾಗಿ ಗದ್ದೆಯ ಖಾತೆ ನನ್ನೊಬ್ಬನ ಹೆಸರಿಗೆ ಮಾಡ್ಬೇಕು ಅಂತ ಕೇಳ್ಕೊಳ್ತೀನಿ.
    tr: Mēḍam, nānu ippattu varṣadinda ā jamīnalli duḍītidīni. Aṇṇa Beṅgaḷūralli, taṅgi Maisūralli. Appa badukiddāga ‘gadde niṅge, nīnē nōḍkō’ anta hēḷidru. Sāla kaṭṭiddu nānu, saṅghada sāla īglū bāki ide. Haṅgāgi gaddeya khāte nannobbana hesarige māḍbēku anta kēḷkoḷḷtīni.
    en: Madam, I've been toiling on that land for twenty years. My brother is in Bengaluru, my sister in Mysuru. While Appa was alive he said to me, 'The wet land is yours; you look after it.' I'm the one who repaid the loans, and the society loan is still outstanding. So I request that the khata of the wet land be made in my name alone.
  - who: tahsildar
    t: ಆ ಮಾತಿಗೆ ಯಾವುದಾದರೂ ದಾಖಲೆ ಇದೆಯೇ? ನೋಂದಾಯಿತ ವಿಭಾಗ ಪತ್ರ, ದಾನ ಪತ್ರ, ಉಯಿಲು — ಯಾವುದಾದರೂ?
    tr: Ā mātige yāvudādarū dākhale ideyē? Nōndāyita vibhāga patra, dāna patra, uyilu — yāvudādarū?
    en: Is there any document for that statement? A registered partition deed, a gift deed, a will — anything at all?
  - who: mahadeva
    t: ಕಾಗದ ಇಲ್ಲ ಮೇಡಂ. ಹಳ್ಳಿಯಲ್ಲಿ ಅಪ್ಪನ ಮಾತೇ ಕಾಗದ. ಅವರ ದಿನಚರಿಯಲ್ಲಿ ‘ಜಮೀನು ಮಾರಲ್ಲ’ ಅಂತ ಬರೆದಿದಾರೆ.
    tr: Kāgada illa mēḍam. Haḷḷiyalli appana mātē kāgada. Avara dinacariyalli ‘jamīnu māralla’ anta baredidāre.
    en: There's no paper, madam. In a village, a father's word is the paper. In his diary he wrote, 'I will not sell the land.'
  - who: tahsildar
    t: ನಿಮ್ಮ ಭಾವನೆ ನನಗೆ ಅರ್ಥವಾಗುತ್ತೆ, ಮಹದೇವ ಅವರೇ. ಇಲ್ಲಿಗೆ ಬರುವ ಅರ್ಧ ಪ್ರಕರಣಗಳು ಇಂಥವೇ. ಆದರೆ ನಾನು ಕಾನೂನಿನ ಪ್ರಕಾರ ನಡೆಯಬೇಕು. ‘ಮಾರುವುದಿಲ್ಲ’ ಅನ್ನುವುದು ಉಯಿಲು ಅಲ್ಲ. ಬಾಯಿಮಾತಿನ ಹಂಚಿಕೆಯನ್ನು ಸಾಬೀತು ಮಾಡುವ ಯಾವುದೇ ದಾಖಲೆ ಕಡತದಲ್ಲಿ ಇಲ್ಲ.
    tr: Nimma bhāvane nanage arthavāgutte, Mahadēva avarē. Illige baruva ardha prakaraṇagaḷu inthavē. Ādare nānu kānūnina prakāra naḍeyabēku. ‘Māruvudilla’ annuvudu uyilu alla. Bāyimātina han̄cikeyannu sābītu māḍuva yāvudē dākhale kaḍatadalli illa.
    en: I understand your feelings, Mahadeva. Half the cases that come here are just like this. But I have to go by the law. 'I will not sell' is not a will. There is no document in the file that proves an oral division.
  - who: shobha
    t: ಮೇಡಂ, ನಾನು ಒಂದು ಮಾತು ಹೇಳಬಹುದಾ? ಮೊದಲ ವಂಶವೃಕ್ಷದಲ್ಲಿ ನನ್ನ ಹೆಸರೇ ಬಿಟ್ಟುಹೋಗಿತ್ತು. ನನ್ನ ತಮ್ಮನ ದುಡಿಮೆಯನ್ನ ನಾನು ಅಲ್ಲಗಳೆಯಲ್ಲ. ಆದರೆ ನಾನೂ ಅದೇ ಅಪ್ಪನ ಮಗಳು.
    tr: Mēḍam, nānu ondu mātu hēḷabahudā? Modala vaṁśavṛkṣadalli nanna hesarē biṭṭuhōgittu. Nanna tammana duḍimeyanna nānu allagaḷeyalla. Ādare nānū adē appana magaḷu.
    en: Madam, may I say something? In the first family tree my name had been left out altogether. I don't deny my brother's labour. But I am the daughter of the same father.
  - who: tahsildar
    t: ಹೇಳಿದ್ದು ದಾಖಲಾಗಿದೆ. ಈಗ ಎಲ್ಲರೂ ಕೇಳಿ, ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳ್ತೀನಿ. ಈ ಕಚೇರಿಯಲ್ಲಿ ಆಗುವುದು ಖಾತೆ ಬದಲಾವಣೆ, ಅಂದರೆ ಕಂದಾಯ ದಾಖಲೆಯಲ್ಲಿ ಹೆಸರಿನ ಬದಲಾವಣೆ. ಯಾರಿಗೆ ಎಷ್ಟು ಪಾಲು, ಯಾವ ಜಮೀನು ಯಾರಿಗೆ — ಇಂಥ ಮಾಲೀಕತ್ವದ ಪ್ರಶ್ನೆಗಳನ್ನು ತೀರ್ಮಾನಿಸುವ ಅಧಿಕಾರ ನನಗಿಲ್ಲ. ಅದು ಸಿವಿಲ್ ನ್ಯಾಯಾಲಯದ ಕೆಲಸ, ಇಲ್ಲವೇ ನೀವೇ ಒಪ್ಪಿ ನೋಂದಾಯಿಸುವ ವಿಭಾಗ ಪತ್ರದ ಮೂಲಕ ಆಗಬೇಕು.
    tr: Hēḷiddu dākhalāgide. Īga ellarū kēḷi, spaṣṭavāgi hēḷtīni. Ī kacēriyalli āguvudu khāte badalāvaṇe, andare kandāya dākhaleyalli hesarina badalāvaṇe. Yārige eṣṭu pālu, yāva jamīnu yārige — intha mālīkatvada praśnegaḷannu tīrmānisuva adhikāra nanagilla. Adu sivil nyāyālayada kelasa, illavē nīvē oppi nōndāyisuva vibhāga patrada mūlaka āgabēku.
    en: What you said has been recorded. Now listen, all of you; I'll say it clearly. What happens in this office is a change of khata — a change of names in the revenue record. Who gets how much, which land goes to whom — I have no power to decide such questions of ownership. That is the civil court's work, or it must be done through a partition deed that you yourselves agree on and register.
  - who: suresh
    t: ಹಾಗಾದ್ರೆ ಈಗ ಖಾತೆ ಯಾರ ಹೆಸರಿಗೆ ಆಗುತ್ತೆ ಮೇಡಂ?
    tr: Hāgādre īga khāte yāra hesarige āgutte mēḍam?
    en: Then in whose names will the khata be made now, madam?
  - who: tahsildar
    t: ಹಿಂದೂ ಉತ್ತರಾಧಿಕಾರ ಕಾಯ್ದೆಯ ಪ್ರಕಾರ ಮೃತರ ಪತ್ನಿ ಮತ್ತು ಮಕ್ಕಳು ಎಲ್ಲರೂ ಮೊದಲ ದರ್ಜೆಯ ವಾರಸುದಾರರು. ಮಗಳು ವಿವಾಹಿತಳಾಗಿರಲಿ ಇಲ್ಲದಿರಲಿ, ಅವಳ ಹಕ್ಕು ಮಗನಷ್ಟೇ. ಆದ್ದರಿಂದ ಆಕ್ಷೇಪಣೆಯನ್ನು ತಿರಸ್ಕರಿಸಲಾಗಿದೆ. ಎರಡೂ ಸರ್ವೆ ನಂಬರ್‌ಗಳಲ್ಲಿ ನಾಲ್ವರ ಹೆಸರನ್ನೂ ಜಂಟಿಯಾಗಿ ದಾಖಲಿಸತಕ್ಕದ್ದು. ಸ್ಥಳದಲ್ಲಿ ಬೇಸಾಯ ಮಾಡುತ್ತಿರುವವರು ಮಹದೇವ ಎಂಬುದನ್ನೂ ಕಡತದಲ್ಲಿ ದಾಖಲಿಸಲಾಗಿದೆ. ಸಹಕಾರ ಸಂಘದ ಸಾಲದ ಹೊಣೆ ಜಮೀನಿನ ಮೇಲೆ ಮುಂದುವರಿಯುತ್ತದೆ.
    tr: Hindū uttarādhikāra kāydeya prakāra mṛtara patni mattu makkaḷu ellarū modala darjeya vārasudāraru. Magaḷu vivāhitaḷāgirali illadirali, avaḷa hakku maganaṣṭē. Āddarinda ākṣēpaṇeyannu tiraskarisalāgide. Eraḍū sarve nambar-gaḷalli nālvara hesarannū jaṇṭiyāgi dākhalisatakkaddu. Sthaḷadalli bēsāya māḍuttiruvavaru Mahadēva embudannū kaḍatadalli dākhalisalāgide. Sahakāra saṅghada sālada hoṇe jamīnina mēle munduvariyuttade.
    en: Under the Hindu Succession Act, the deceased's wife and children are all Class I heirs. Whether a daughter is married or not, her right equals a son's. The objection is therefore rejected. The names of all four shall be entered jointly in both survey numbers. It has also been recorded in the file that Mahadeva is the person cultivating on the spot. Liability for the cooperative society loan continues to attach to the land.
  - who: mahadeva
    t: 'ಅಂದ್ರೆ ನನ್ನ ಇಪ್ಪತ್ತು ವರ್ಷದ ಬೆವರು ಒಂದು ಸಾಲದಲ್ಲಿ ಮುಗೀತು. ‘ಬೇಸಾಯ ಮಾಡುತ್ತಿರುವವರು: ಮಹದೇವ.’ ಅಷ್ಟೇ.'
    tr: 'Andre nanna ippattu varṣada bevaru ondu sāladalli mugītu. ‘Bēsāya māḍuttiruvavaru: Mahadēva.’ Aṣṭē.'
    en: 'So twenty years of my sweat ends up in a single line. ''Person cultivating: Mahadeva.'' That''s all.'
  - who: tahsildar
    t: 'ಮಹದೇವ ಅವರೇ, ಆ ಸಾಲು ಚಿಕ್ಕದಲ್ಲ. ಮುಂದೆ ಪಾಲು ಮಾಡುವಾಗ ನಿಮ್ಮ ದುಡಿಮೆ, ನೀವು ತೀರಿಸಿದ ಸಾಲ — ಇವನ್ನೆಲ್ಲಾ ಕುಟುಂಬವಾಗಲೀ ನ್ಯಾಯಾಲಯವಾಗಲೀ ಪರಿಗಣಿಸಬಹುದು. ನನ್ನ ಆದೇಶ ಒಪ್ಪಿಗೆ ಇಲ್ಲದಿದ್ದರೆ ಸಹಾಯಕ ಆಯುಕ್ತರ ನ್ಯಾಯಾಲಯಕ್ಕೆ ಮೇಲ್ಮನವಿ ಹಾಕಬಹುದು. ಆದರೆ ಒಂದು ಸಲಹೆ: ಅಣ್ಣ, ತಮ್ಮ, ತಂಗಿ ಕೂತು ಮಾತಾಡಿದರೆ ಎಷ್ಟೋ ವರ್ಷ, ಎಷ್ಟೋ ದುಡ್ಡು ಉಳಿಯುತ್ತೆ. ಇವತ್ತು ಈ ಕೋಣೆಯಲ್ಲಿ ನಲವತ್ತು ಪ್ರಕರಣಗಳಿವೆ. ಹೆಚ್ಚಿನವು ಅಣ್ಣ-ತಮ್ಮಂದಿರದ್ದೇ.'
    tr: 'Mahadēva avarē, ā sālu cikkadalla. Munde pālu māḍuvāga nimma duḍime, nīvu tīrisida sāla — ivannellā kuṭumbavāglī nyāyālayavāglī parigaṇisabahudu. Nanna ādēśa oppige illadiddare sahāyaka āyuktara nyāyālayakke mēlmanavi hākabahudu. Ādare ondu salahe: aṇṇa, tamma, taṅgi kūtu mātāḍidare eṣṭō varṣa, eṣṭō duḍḍu uḷiyutte. Ivattu ī kōṇeyalli nalavattu prakaraṇagaḷive. Heccinavu aṇṇa-tammandiraddē.'
    en: 'Mahadeva, that line is not a small thing. Later, when the property is divided, your labour and the loans you repaid — all of this may be taken into account, whether by the family or by a court. If you don''t accept my order, you may appeal to the Assistant Commissioner''s court. But one piece of advice: if brothers and sister sit down and talk, it saves years and a great deal of money. There are forty cases in this room today. Most of them are between brothers.'
  - who: avva
    t: ಮೇಡಂ, ನಾನೊಂದು ಮಾತು… ನನ್ನ ಹೆಸರೂ ಆ ಕಾಗದಕ್ಕೆ ಬರುತ್ತಾ?
    tr: Mēḍam, nānondu mātu… nanna hesarū ā kāgadakke baruttā?
    en: Madam, may I say one thing… will my name also go onto that paper?
  - who: tahsildar
    t: ಬರುತ್ತೆ ಅಮ್ಮ. ಮೊದಲ ಹೆಸರೇ ನಿಮ್ಮದು. ಹೊಸ ಪಹಣಿ ಬಂದಾಗ ‘ಪುಟ್ಟಮ್ಮ ಕೋಂ ಚನ್ನೇಗೌಡ’ ಅಂತ ಇರುತ್ತೆ.
    tr: Barutte amma. Modala hesarē nimmadu. Hosa pahaṇi bandāga ‘Puṭṭamma kōṁ Cannēgauḍa’ anta irutte.
    en: It will, Amma. The very first name will be yours. When the new RTC comes, it will say 'Puttamma, wife of Channegowda'.
  - who: avva
    t: ಐವತ್ತೆರಡು ವರ್ಷ ಆ ಮಣ್ಣಲ್ಲಿ ಕಳೆ ಕಿತ್ತಿದೀನಿ. ಇವತ್ತು ಮೊದಲ ಸಲ ಅದರ ಮೇಲೆ ನನ್ನ ಹೆಸರು… ಅವ್ರು ಇದ್ದಿದ್ರೆ ಇದನ್ನ ಕೇಳಿ ನಗ್ತಿದ್ರು.
    tr: Aivatteraḍu varṣa ā maṇṇalli kaḷe kittidīni. Ivattu modala sala adara mēle nanna hesaru… avru iddidre idanna kēḷi nagtidru.
    en: For fifty-two years I've pulled weeds from that soil. Today, for the first time, my name on it… If he were alive, he'd have laughed to hear this.
  - who: tahsildar
    t: ಆದೇಶದ ಪ್ರತಿ ಹದಿನೈದು ದಿನದೊಳಗೆ ಸಿಗುತ್ತೆ. ಮುಂದಿನ ಪ್ರಕರಣ.
    tr: Ādēśada prati hadinaidu dinadoḷage sigutte. Mundina prakaraṇa.
    en: A copy of the order will be available within fifteen days. Next case.
  - section: On the steps
    learn: 'bitterness and restraint: sikkitallā nimage bēkāgiddu, yārū geddilla · persuasion: kūrōṇa, nīnu hēḷōdellā hēḷu · setting up the elders'' meeting: araḷi kaṭṭe, hiriyara munde, huṇṇime · proverb-like close: kānūnu pustaka vs ūrina nyāya'
  - scene: A few minutes later. The steps of the taluk office in the hot afternoon sun. Lorries roar past on the highway. Mahadeva stands a little apart from the others.
  - who: mahadeva
    t: ಸಿಕ್ತಲ್ಲಾ ನಿಮಗೆ ಬೇಕಾಗಿದ್ದು. ಕಾಗದದಲ್ಲಿ ನಾಲ್ಕು ಹೆಸರು. ಆದ್ರೆ ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಎದ್ದು ಗದ್ದೆಗೆ ನೀರು ಕಟ್ಟೋದು ಒಂದೇ ಹೆಸರು — ನಂದು.
    tr: Siktallā nimage bēkāgiddu. Kāgadadalli nālku hesaru. Ādre nāḷe beḷigge aidakke eddu gaddege nīru kaṭṭōdu ondē hesaru — nandu.
    en: Well, you got what you wanted. Four names on the paper. But tomorrow at five in the morning, the one who gets up and waters the paddy field has only one name — mine.
  - who: shobha
    t: ಮಹದೇವ, ನಾನು ಗೆದ್ದೆ ಅಂತ ಅಂದ್ಕೊಂಡಿಲ್ಲ. ಇವತ್ತು ಇಲ್ಲಿ ಯಾರೂ ಗೆದ್ದಿಲ್ಲ.
    tr: Mahadēva, nānu gedde anta andkoṇḍilla. Ivattu illi yārū geddilla.
    en: Mahadeva, I don't think I've won. Nobody won anything here today.
  - who: meena
    t: ತಹಸೀಲ್ದಾರ್ ಹೇಳಿದ್ದು ಕೇಳಿದ್ರಲ್ಲ — ಕೂತು ಮಾತಾಡಿ ಅಂತ. ಮಹಜರ್ ದಿನ ತಿಮ್ಮೇಗೌಡ್ರೂ ಅದನ್ನೇ ಹೇಳಿದ್ರು. ಇಬ್ಬರು ಬೇರೆ ಬೇರೆ ಜನ, ಒಂದೇ ಸಲಹೆ.
    tr: Tahasīldār hēḷiddu kēḷidralla — kūtu mātāḍi anta. Mahajar dina Timmēgauḍrū adannē hēḷidru. Ibbaru bēre bēre jana, ondē salahe.
    en: You heard what the Tahsildar said — sit down and talk. Thimmegowda said the same thing on the day of the mahazar. Two very different people, one piece of advice.
  - who: suresh
    t: ಮಹದೇವ, ತಿಮ್ಮೇಗೌಡ್ರ ಮುಂದೆ ಕೂರೋಣ. ಅರಳಿ ಕಟ್ಟೆ ಮೇಲೆ, ಊರ ಹಿರಿಯರ ಮುಂದೆ. ನೀನು ಹೇಳೋದೆಲ್ಲಾ ಹೇಳು, ಶೋಭಾ ಹೇಳೋದೆಲ್ಲಾ ಹೇಳ್ಲಿ, ಅವ್ವನ ಮಾತೂ ಕೇಳೋಣ. ಆಮೇಲೆ ತೀರ್ಮಾನ.
    tr: Mahadēva, Timmēgauḍra munde kūrōṇa. Araḷi kaṭṭe mēle, ūra hiriyara munde. Nīnu hēḷōdellā hēḷu, Śōbhā hēḷōdellā hēḷli, avvana mātū kēḷōṇa. Āmēle tīrmāna.
    en: Mahadeva, let's sit before Thimmegowda. On the platform under the peepul tree, in front of the village elders. You say everything you have to say, let Shobha say everything she has to say, and let's hear Avva too. Then we decide.
  - who: avva
    t: ಹಂಗೇ ಮಾಡಿ ಕಣ್ರಪ್ಪ. ಕೋರ್ಟು-ಕಚೇರಿ ಅಂತ ಅಲೆದಾಡಿದ್ರೆ ಮನೆ ಒಡೆದೋಗುತ್ತೆ. ನಮ್ಮ ಮನೆತನದಲ್ಲಿ ಯಾರೂ ಕೋರ್ಟು ಮೆಟ್ಟಿಲು ಹತ್ತಿಲ್ಲ.
    tr: Haṅgē māḍi kaṇrappa. Kōrṭu-kacēri anta aledāḍidre mane oḍedōgutte. Namma manetanadalli yārū kōrṭu meṭṭilu hattilla.
    en: Do that, my children. If you go wandering from court to office, the family will break apart. No one in our family has ever climbed the steps of a court.
  - who: mahadeva
    t: 'ಆಯ್ತು. ಹುಣ್ಣಿಮೆ ದಿನ ಕೂರೋಣ. ಆದ್ರೆ ಅಣ್ಣ, ಒಂದು ನೆನಪಿಟ್ಕೋ: ಅರಳಿ ಕಟ್ಟೆ ಮೇಲೆ ಯಾರೂ ಕಾನೂನು ಪುಸ್ತಕ ಓದಲ್ಲ. ಅಲ್ಲಿ ನಡೆಯೋದು ಊರಿನ ನ್ಯಾಯ.'
    tr: 'Āytu. Huṇṇime dina kūrōṇa. Ādre aṇṇa, ondu nenapiṭkō: araḷi kaṭṭe mēle yārū kānūnu pustaka ōdalla. Alli naḍeyōdu ūrina nyāya.'
    en: 'All right. We''ll sit on the full-moon day. But Anna, remember one thing: on the peepul platform nobody reads law books. What runs there is the village''s justice.'
  - chapter: Chapter 4 — The elders
  - section: Before the moon rises
    learn: 'getting ready: snāna māḍi, dīpa hacci, horaḍōṇa · custom in habitual past: hiriyaru hēḷtidru · wishes with -li: kempāgi huṭṭali, beḷḷage muḷugali · advice before a hard talk: kōpadalli āḍida mātu vāpas tagoḷḷōkāgalla'
  - scene: Tuesday, 3 March 2026, the full-moon evening. In the yard of the house in Bettahalli, Avva lights the lamp before Thatha's garlanded photograph. Suresh, Meena and Rakshith have driven down from Bengaluru; Shobha came on the afternoon bus. Mahadeva, freshly bathed, is tying a white dhoti. Tonight the moon will rise at the tail end of an eclipse.
  - who: avva
    t: ಗ್ರಹಣ ಬುಟ್ಟ ಮೇಲೆ ಎಲ್ರೂ ಸ್ನಾನ ಮಾಡಿ, ಆಮೇಲೆ ದೀಪ ಹಚ್ಚಿ ಹೊರಡೋಣ. ಗ್ರಹಣ ಇರೋವಾಗ ಯಾವ ಒಳ್ಳೆ ಕೆಲಸಾನೂ ಶುರು ಮಾಡಬಾರ್ದು ಅಂತ ನಮ್ಮ ಹಿರಿಯರು ಹೇಳ್ತಿದ್ರು.
    tr: Grahaṇa buṭṭa mēle ellrū snāna māḍi, āmēle dīpa hacci horaḍōṇa. Grahaṇa irōvāga yāva oḷḷe kelasānū śuru māḍabārdu anta namma hiriyaru hēḷtidru.
    en: Once the eclipse has passed, everybody bathe, then we'll light the lamp and set out. Our elders used to say you mustn't begin any good work while an eclipse is on.
  - who: rakshith
    t: ಅಜ್ಜಿ, ಇವತ್ತು ಚಂದ್ರ ಗ್ರಹಣ ಅಂತ ನಮ್ಮ ಸ್ಕೂಲ್ ಗ್ರೂಪ್‌ನಲ್ಲಿ ಫೋಟೋ ಹಾಕಿದಾರೆ. ಚಂದ್ರ ಕೆಂಪಾಗಿ ಹುಟ್ಟುತ್ತೆ ಅಂತೆ.
    tr: Ajji, ivattu candra grahaṇa anta namma skūl grūp-nalli phōṭō hākidāre. Candra kempāgi huṭṭutte ante.
    en: Ajji, people in my school group have posted photos — there's a lunar eclipse today. Apparently the moon rises red.
  - who: avva
    t: ಕೆಂಪಾಗಿ ಹುಟ್ಟಲಿ, ಬೆಳ್ಳಗೆ ಮುಳುಗಲಿ ಕಣಪ್ಪ. ಇವತ್ತು ರಾತ್ರಿ ನಮ್ಮನೇಲೂ ಹಂಗೇ ಆಗ್ಲಿ.
    tr: Kempāgi huṭṭali, beḷḷage muḷugali kaṇappa. Ivattu rātri nammanēlū haṅgē āgli.
    en: Let it rise red and set white, child. May it go the same way in our house tonight.
  - who: meena
    t: ಮಹದೇವ, ಅಲ್ಲಿ ಏನು ಹೇಳ್ಬೇಕು ಅಂತ ಯೋಚನೆ ಮಾಡಿದ್ದೀರಾ?
    tr: Mahadēva, alli ēnu hēḷbēku anta yōcane māḍiddīrā?
    en: Mahadeva, have you thought about what you're going to say there?
  - who: mahadeva
    t: ಯೋಚನೆ ಏನು ಅತ್ತಿಗೆ? ಇಪ್ಪತ್ತು ವರ್ಷದಿಂದ ಅದೇ ಮಾತು ಎದೆಯಲ್ಲಿ ಇಟ್ಕಂಡಿದೀನಿ. ಇವತ್ತು ಹೊರಗೆ ಬರುತ್ತೆ, ಅಷ್ಟೇ.
    tr: Yōcane ēnu attige? Ippattu varṣadinda adē mātu edeyalli iṭkaṇḍidīni. Ivattu horage barutte, aṣṭē.
    en: What's there to think about, Attige? I've kept the same words in my chest for twenty years. Tonight they'll come out, that's all.
  - who: meena
    t: ಹೊರಗೆ ಬರ್ಲಿ. ಆದ್ರೆ ಒಂದು ಕೇಳ್ಕೊಳ್ತೀನಿ — ಕೋಪದಲ್ಲಿ ಬರೋದು ಬೇಡ. ಕೋಪದಲ್ಲಿ ಆಡಿದ ಮಾತು ವಾಪಸ್ ತಗೊಳ್ಳೋಕಾಗಲ್ಲ.
    tr: Horage barli. Ādre ondu kēḷkoḷḷtīni — kōpadalli barōdu bēḍa. Kōpadalli āḍida mātu vāpas tagoḷḷōkāgalla.
    en: Let them come out. But I ask one thing — don't let them come out in anger. Words spoken in anger can't be taken back.
  - who: mahadeva
    t: ನಿಮ್ ಸ್ಕೂಲ್ ಹುಡುಗರಿಗೆ ಹೇಳೋ ಹಂಗೆ ಹೇಳ್ತೀರಲ್ಲ ಅತ್ತಿಗೆ. … ಆಯ್ತು, ಪ್ರಯತ್ನ ಮಾಡ್ತೀನಿ.
    tr: Nim skūl huḍugarige hēḷō haṅge hēḷtīralla attige. … Āytu, prayatna māḍtīni.
    en: You talk to me the way you talk to your school kids, Attige. … All right, I'll try.
  - who: shobha
    t: ಅವ್ವ, ನೀನೂ ಬರ್ತೀಯಾ ಕಟ್ಟೆಗೆ? ನಿನ್ನ ಮಂಡಿ ನೋವಿಗೆ ಕಲ್ಲಿನ ಮೇಲೆ ಕೂರೋದು ಕಷ್ಟ. ಒಂದು ಚಾಪೆ ತಗೊಂಡು ಹೋಗೋಣ.
    tr: Avva, nīnū bartīyā kaṭṭege? Ninna maṇḍi nōvige kallina mēle kūrōdu kaṣṭa. Ondu cāpe tagoṇḍu hōgōṇa.
    en: Avva, are you coming to the platform too? With your bad knees it's hard to sit on stone. Let's take a mat.
  - who: avva
    t: ಬರ್ದೇ ಇರ್ತೀನಾ? ನನ್ ಮಕ್ಳ ಜಗಳ ಊರ ಮುಂದೆ ನಡೀತಿರೋವಾಗ ನಾನು ಮನೇಲಿ ಕುಂತಿರ್ಲಾ?
    tr: Bardē irtīnā? Nan makḷa jagaḷa ūra munde naḍītirōvāga nānu manēli kuntirlā?
    en: Would I stay away? While my children's quarrel is going on in front of the whole village, am I to sit at home?
  - section: Under the peepul
    learn: 'convening a panchayati: araḷi kaṭṭe, hiriyaru, saradi, kūgāḍaṅgilla · elder''s story in past perfect: kōrṭige hōgidvi, mukha nōḍirlilla · the farmer''s claim in habitual past: ēḷtidde, kaṭtidde, nintkaḷtidde · slogan: uḷuvavanē holadoḍeya · being in the middle: eraḍu dōṇi mēle kālu'
  - scene: Later that night. The stone platform round the old peepul tree in the middle of Bettahalli. A hurricane lamp hangs from a low branch; the moon, pale again, is climbing over the coconut palms. Thimmegowda sits cross-legged at the centre with two other elders, Ningegowda and Kempaiah. Men stand around; the women sit together on one side, Meena and Rakshith among them. The family sits facing the elders.
  - who: elder
    t: 'ಎಲ್ರೂ ಕುಂತ್ಕಳಿ. ಗ್ರಹಣ ಬುಟ್ಟು ಚಂದ್ರ ಮತ್ತೆ ಬೆಳಗ್ತಾ ಅವ್ನೆ — ಒಳ್ಳೆ ಗಳಿಗೆ. ಇವತ್ತು ಇಲ್ಲಿ ಚನ್ನೇಗೌಡನ ಮನೆ ಮಾತು. ಮೊದ್ಲೇ ಒಂದು ನಿಯಮ ಹೇಳ್ತೀನಿ: ಒಂದ್ಸಲ ಒಬ್ರೇ ಮಾತಾಡ್ಬೇಕು. ಯಾರೂ ಕೂಗಾಡಂಗಿಲ್ಲ. ಹೆಣ್ಮಕ್ಳೂ ಮಾತಾಡ್ಬೋದು — ಇದು ಅವರ ಮನೆ ವಿಷಯಾನೂ ಹೌದು.'
    tr: 'Ellrū kuntkaḷi. Grahaṇa buṭṭu candra matte beḷagtā avne — oḷḷe gaḷige. Ivattu illi Cannēgauḍana mane mātu. Modlē ondu niyama hēḷtīni: ondsala obrē mātāḍbēku. Yārū kūgāḍaṅgilla. Heṇmakḷū mātāḍbōdu — idu avara mane viṣayānū haudu.'
    en: 'Sit down, all of you. The eclipse has let go and the moon is shining again — a good hour. Tonight the matter here is Channegowda''s household. First I''ll lay down one rule: one person speaks at a time. Nobody is to shout. The women may speak too — it''s their household''s matter as well.'
  - who: elder
    t: ನಿಂಗೇಗೌಡ್ರು, ಕೆಂಪಯ್ಯ ನನ್ ಜೊತೆ ಕುಂತಿದಾರೆ. ನಾವು ಕೋರ್ಟಲ್ಲ, ಯಾರ್ಗೂ ಶಿಕ್ಷೆ ಕೊಡಲ್ಲ. ಮನೆ ಮುರೀಬಾರ್ದು, ಅಷ್ಟೇ ನಮ್ ಆಸೆ. ಮಾತಾಡೋಕೆ ಮುಂಚೆ ಒಂದು ಕತೆ ಹೇಳ್ತೀನಿ. ನಾನು, ನನ್ನ ತಮ್ಮ ಸಿದ್ದೇಗೌಡ ಎಪ್ಪತ್ತೆಂಟರಲ್ಲಿ ಮೂರು ಎಕರೆ ತೋಟಕ್ಕೆ ಕೋರ್ಟಿಗೆ ಹೋಗಿದ್ವಿ. ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ ಕೇಸ್ ನಡೀತು. ವಕೀಲರ ಫೀಸ್ ಕಟ್ಟೋಕೆ ಇಬ್ರೂ ಅರ್ಧರ್ಧ ಜಮೀನು ಮಾರಿದ್ವಿ.
    tr: Niṅgēgauḍru, Kempayya nan jote kuntidāre. Nāvu kōrṭalla, yārgū śikṣe koḍalla. Mane murībārdu, aṣṭē nam āse. Mātāḍōke mun̄ce ondu kate hēḷtīni. Nānu, nanna tamma Siddēgauḍa eppatteṇṭaralli mūru ekare tōṭakke kōrṭige hōgidvi. Ippatteraḍu varṣa kēs naḍītu. Vakīlara phīs kaṭṭōke ibbrū ardhardha jamīnu māridvi.
    en: Ningegowda and Kempaiah are sitting with me. We are not a court; we punish no one. The house must not break — that's all we want. Before we talk, I'll tell you a story. In seventy-eight my younger brother Siddegowda and I went to court over three acres of garden land. The case went on for twenty-two years. To pay the lawyers' fees, each of us sold half our land.
  - who: mahadeva
    t: ಕೊನೆಗೆ ಏನಾಯ್ತು ತಿಮ್ಮಣ್ಣ?
    tr: Konege ēnāytu Timmaṇṇa?
    en: What happened in the end, Thimmanna?
  - who: elder
    t: ತೀರ್ಪು ಬಂದಾಗ ನಾವಿಬ್ರೂ ಮುದುಕರಾಗಿದ್ವಿ. ಗೆದ್ದಿದ್ದು ನಾನು. ಆದ್ರೆ ಆ ದಿನ ಸಿಹಿ ಹಂಚೋಕೂ ಮನಸ್ಸಾಗ್ಲಿಲ್ಲ. ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ ನನ್ನ ತಮ್ಮನ ಮುಖ ನೋಡಿರ್ಲಿಲ್ಲ. ಅವನು ಸತ್ತಾಗ ಅವನ ಮಕ್ಳು ನನಗೆ ಸುದ್ದಿ ಕೂಡ ಕಳಿಸ್ಲಿಲ್ಲ. ಅದಕ್ಕೇ ಹೇಳ್ತೀನಿ — ಕೋರ್ಟಲ್ಲಿ ಗೆಲ್ಲೋದು ಕಾಗದ. ಸೋಲೋದು ಮನೆ. … ಮಹದೇವ, ನೀನೇ ಆಕ್ಷೇಪಣೆ ಕೊಟ್ಟೋನು. ಮೊದ್ಲು ನೀನು ಹೇಳಪ್ಪ.
    tr: Tīrpu bandāga nāvibbrū mudukarāgidvi. Geddiddu nānu. Ādre ā dina sihi han̄cōkū manassāglilla. Ippatteraḍu varṣa nanna tammana mukha nōḍirlilla. Avanu sattāga avana makḷu nanage suddi kūḍa kaḷislilla. Adakkē hēḷtīni — kōrṭalli gellōdu kāgada. Sōlōdu mane. … Mahadēva, nīnē ākṣēpaṇe koṭṭōnu. Modlu nīnu hēḷappa.
    en: 'By the time the judgment came, we were both old men. I was the one who won. But that day I didn''t even have the heart to hand out sweets. For twenty-two years I hadn''t seen my brother''s face. When he died, his children didn''t even send me word. That''s why I say: in court it''s the paper that wins. What loses is the family. … Mahadeva, you''re the one who filed the objection. You speak first, son.'
  - who: mahadeva
    t: ತಿಮ್ಮಣ್ಣ, ಊರಿಗೆಲ್ಲಾ ಗೊತ್ತಿರೋದನ್ನೇ ಹೇಳ್ತೀನಿ. ತೊಂಬತ್ತೆಂಟರಲ್ಲಿ ಅಣ್ಣ ಕಾಲೇಜಿಗೆ ಹೋದ. ಎರಡು ಸಾವಿರದ ಆರರಲ್ಲಿ ನಾನು ಪಿಯುಸಿ ಮುಗಿಸಿದೆ, ಅದೇ ವರ್ಷ ಅಪ್ಪನ ಕಾಲು ಮುರೀತು. ಕಬ್ಬು ಕಟಾವಿಗೆ ಬಂದಿತ್ತು. ಅವತ್ತು ಪುಸ್ತಕ ಕೆಳಗಿಟ್ಟು ಕುಡುಗೋಲು ಕೈಗೆ ತಗಂಡೆ. ಮತ್ತೆ ಪುಸ್ತಕ ಮುಟ್ಟಲೇ ಇಲ್ಲ.
    tr: Timmaṇṇa, ūrigellā gottirōdannē hēḷtīni. Tombatteṇṭaralli aṇṇa kālējige hōda. Eraḍu sāvirada āraralli nānu pi-yu-si mugiside, adē varṣa appana kālu murītu. Kabbu kaṭāvige bandittu. Avattu pustaka keḷagiṭṭu kuḍugōlu kaige tagaṇḍe. Matte pustaka muṭṭalē illa.
    en: Thimmanna, I'll only say what the whole village already knows. In ninety-eight Anna went to college. In two thousand six I finished my PUC, and that same year Appa broke his leg. The cane was ready to be cut. That day I put down my books and took the sickle in my hand. I never touched a book again.
  - who: mahadeva
    t: ಆಮೇಲೆ ಇಪ್ಪತ್ತು ವರ್ಷ ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಏಳ್ತಿದ್ದೆ. ರಾತ್ರಿ ಕರೆಂಟ್ ಬಂದಾಗ ಗದ್ದೆಗೆ ನೀರು ಕಟ್ತಿದ್ದೆ. ಕಾರ್ಖಾನೆ ಮುಂದೆ ಮೂರು ಮೂರು ದಿನ ಟ್ರ್ಯಾಕ್ಟರ್ ಸಾಲಲ್ಲಿ ನಿಂತ್ಕಳ್ತಿದ್ದೆ. ಶೋಭನ ಮದುವೆ ಸಾಲ ಐದು ವರ್ಷ ಕಟ್ಟಿದೆ. ಅಣ್ಣ ಸಂಬಳದಲ್ಲಿ, ತಂಗಿ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ — ನಾನು ಈ ಮಣ್ಣಲ್ಲಿ.
    tr: Āmēle ippattu varṣa beḷigge aidakke ēḷtidde. Rātri karaṇṭ bandāga gaddege nīru kaṭtidde. Kārkhāne munde mūru mūru dina ṭrākṭar sālalli nintkaḷtidde. Śōbhana maduve sāla aidu varṣa kaṭṭide. Aṇṇa sambaḷadalli, taṅgi āspatreyalli — nānu ī maṇṇalli.
    en: After that, for twenty years I'd get up at five. At night, whenever the power came, I'd water the paddy. I'd stand in the tractor queue outside the factory for three days at a stretch. I paid off Shobha's wedding loan for five years. Anna in his salary, my sister in her hospital — and me in this soil.
  - who: mahadeva
    t: ದೇವರಾಜ ಅರಸು ಕಾಲದಲ್ಲೇ ಹೇಳಿದ್ರಲ್ಲ — ‘ಉಳುವವನೇ ಹೊಲದೊಡೆಯ’ ಅಂತ. ಉತ್ತೋನು ನಾನು. ಅದಕ್ಕೇ ಗದ್ದೆ ನಂಗೆ ಬೇಕು. ಬೇಕಾದ್ರೆ ಹೊಲದಲ್ಲಿ ಅವ್ರು ಪಾಲು ತಗಳ್ಲಿ.
    tr: Dēvarāja Arasu kāladallē hēḷidralla — ‘uḷuvavanē holadoḍeya’ anta. Uttōnu nānu. Adakkē gadde naṅge bēku. Bēkādre holadalli avru pālu tagaḷli.
    en: Back in Devaraj Urs's time they said it, didn't they — 'the one who tills is the owner of the field'. The one who ploughed is me. That's why I want the wet land. If they want, let them take shares in the dry field.
  - who: elder
    t: ಕೇಳ್ಲಾ ಮಹದೇವ. ಆ ಮಾತು ನನ್ ಕಾಲದ್ದು. ನಾನೇ ಅವತ್ತು ಮೆರವಣಿಗೇಲಿ ಕೂಗಿದ್ದೆ. ಆದ್ರೆ ಅದು ಜಮೀನ್ದಾರನ ಮುಂದೆ ಗೇಣಿದಾರನ ಮಾತು. ಅಣ್ಣ-ತಂಗಿ ಮುಂದೆ ತಮ್ಮನ ಮಾತಲ್ಲ. ಇಲ್ಲಿ ಯಾರೂ ಜಮೀನ್ದಾರರಲ್ಲ, ಯಾರೂ ಗೇಣಿದಾರರಲ್ಲ. ಒಂದೇ ಹೊಟ್ಟೇಲಿ ಹುಟ್ಟಿದೋರು.
    tr: Kēḷlā Mahadēva. Ā mātu nan kāladdu. Nānē avattu meravaṇigēli kūgidde. Ādre adu jamīndārana munde gēṇidārana mātu. Aṇṇa-taṅgi munde tammana mātalla. Illi yārū jamīndāraralla, yārū gēṇidāraralla. Ondē hoṭṭēli huṭṭidōru.
    en: Listen, Mahadeva. That slogan is from my time. I shouted it myself in the processions back then. But it was the tenant's cry against the landlord. Not a younger brother's cry against his brother and sister. Nobody here is a landlord, and nobody here is a tenant. You were all born of the same womb.
  - who: mahadeva
    t: ಗೊತ್ತು ತಿಮ್ಮಣ್ಣ. ಆದ್ರೆ ಬೆವರು ಸುರ್ಸಿದ್ದು ಒಂದೇ ಮೈ. ಅದನ್ನ ಯಾವ ಕಾನೂನು ಲೆಕ್ಕ ಹಾಕುತ್ತೆ?
    tr: Gottu Timmaṇṇa. Ādre bevaru sursiddu ondē mai. Adanna yāva kānūnu lekka hākutte?
    en: I know, Thimmanna. But the sweat was poured from only one body. Which law counts that?
  - who: elder
    t: ಸುರೇಶ, ನೀನು ದೊಡ್ಡೋನು. ನೀನೇನ್ ಹೇಳ್ತೀಯಪ್ಪ?
    tr: Surēśa, nīnu doḍḍōnu. Nīnēn hēḷtīyappa?
    en: Suresha, you're the eldest. What do you say, son?
  - who: suresh
    t: ತಿಮ್ಮೇಗೌಡ್ರೇ, ಮಹದೇವ ಹೇಳಿದ ಒಂದು ಮಾತೂ ಸುಳ್ಳಲ್ಲ. ಅಪ್ಪ ನನ್ನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ರು ಅಂತ ನಂಗೆ ಗೊತ್ತಾಗಿದ್ದು ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ, ಅವರ ದಿನಚರಿ ಓದಿದಾಗ. ನಾನು ಇವತ್ತು ಏನಾಗಿದೀನೋ ಅದರಲ್ಲಿ ಈ ಮಣ್ಣಿನ ಪಾಲೂ ಇದೆ, ಮಹದೇವನ ಪಾಲೂ ಇದೆ.
    tr: Timmēgauḍrē, Mahadēva hēḷida ondu mātū suḷḷalla. Appa nanna ōdige ettu māridru anta naṅge gottāgiddu Ḍisembar-nalli, avara dinacari ōdidāga. Nānu ivattu ēnāgidīnō adaralli ī maṇṇina pālū ide, Mahadēvana pālū ide.
    en: Thimmegowda, not one thing Mahadeva said is untrue. I only found out in December, reading his diary, that Appa sold the bullocks for my studies. Whatever I am today, this soil has a share in it, and so does Mahadeva.
  - who: suresh
    t: ಆದ್ರೆ ಒಂದು ವಿಷಯ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳ್ಬೇಕು. ಶೋಭಾಗೆ ಪಾಲು ಇಲ್ಲ ಅನ್ನೋದು ತಪ್ಪು. ನಾನು ಮಹದೇವನ ದುಡಿಮೆಗೆ ಬೆಲೆ ಕೊಡ್ತೀನಿ, ಶೋಭಾಳ ಹಕ್ಕಿಗೂ ಬೆಲೆ ಕೊಡ್ತೀನಿ. ಇವೆರಡನ್ನೂ ಹೇಗೆ ಜೋಡಿಸೋದು ಅನ್ನೋದೇ ಇವತ್ತಿನ ಪ್ರಶ್ನೆ.
    tr: Ādre ondu viṣaya spaṣṭavāgi hēḷbēku. Śōbhāge pālu illa annōdu tappu. Nānu Mahadēvana duḍimege bele koḍtīni, Śōbhāḷa hakkigū bele koḍtīni. Iveraḍannū hēge jōḍisōdu annōdē ivattina praśne.
    en: But one thing must be said clearly. Saying Shobha has no share is wrong. I value Mahadeva's labour, and I value Shobha's right too. How to fit the two together — that is tonight's question.
  - who: mahadeva
    t: ನೋಡಿದ್ರಾ? ಅಣ್ಣ ಯಾವಾಗ್ಲೂ ಹಿಂಗೇ — ಎರಡು ದೋಣಿ ಮೇಲೆ ಕಾಲು.
    tr: Nōḍidrā? Aṇṇa yāvāglū hiṅgē — eraḍu dōṇi mēle kālu.
    en: See that? Anna's always like this — a foot in two boats.
  - who: elder
    t: ಮಹದೇವ! ನಿಯಮ ಮರೀಬೇಡ. ಅವನ ಸರದಿ ಮುಗೀಲಿ.
    tr: Mahadēva! Niyama marībēḍa. Avana saradi mugīli.
    en: Mahadeva! Don't forget the rule. Let him finish his turn.
  - who: suresh
    t: ಪರವಾಗಿಲ್ಲ ತಿಮ್ಮೇಗೌಡ್ರೇ. ಹೌದು ಮಹದೇವ, ನಾನು ಮಧ್ಯದಲ್ಲಿ ನಿಂತಿದೀನಿ. ಯಾಕಂದ್ರೆ ಒಂದು ಕಡೆ ನನ್ನ ತಮ್ಮ, ಇನ್ನೊಂದು ಕಡೆ ನನ್ನ ತಂಗಿ. ಯಾರ ಕಡೆ ನಿಂತ್ರೂ ಇನ್ನೊಬ್ಬರನ್ನ ಕಳ್ಕೊಳ್ತೀನಿ.
    tr: Paravāgilla Timmēgauḍrē. Haudu Mahadēva, nānu madhyadalli nintidīni. Yākandre ondu kaḍe nanna tamma, innondu kaḍe nanna taṅgi. Yāra kaḍe nintrū innobbaranna kaḷkoḷḷtīni.
    en: It's all right, Thimmegowda. Yes, Mahadeva, I'm standing in the middle. Because on one side is my brother and on the other my sister. Whichever side I stand on, I lose the other.
  - who: elder
    t: ಸರಿ. ಈಗ ಮಗಳ ಸರದಿ. ಶೋಭಾ, ಹೇಳವ್ವ. ಭಯ ಬೇಡ.
    tr: Sari. Īga magaḷa saradi. Śōbhā, hēḷavva. Bhaya bēḍa.
    en: Good. Now it's the daughter's turn. Shobha, speak, my girl. Don't be afraid.
  - section: The law and the sister
    learn: 'citing the law: pitrārjita āsti, tiddupaḍi, huṭṭinindalē, sahasamāṁśi (coparcener), tīrpu, ḍikri · explaining a hard word with an image: ondē taṭṭeyalli uṇṇōru · rhetorical questions: yāke pālu āgutte? · debt vs right: ṛṇa bēre, hakku bēre · firm limits: ‘pālē illa’ annō dārige baralla'
  - scene: Shobha has a thin folder of photocopies on her lap. Some of the men at the back murmur when she opens it. Thimmegowda raises a hand, and they fall silent.
  - who: shobha
    t: ತಿಮ್ಮೇಗೌಡ್ರೇ, ನಾನು ಕೂತ್ಕೊಂಡೇ ಮಾತಾಡ್ತೀನಿ. ನನ್ನ ಕೈಲಿ ಸ್ವಲ್ಪ ಕಾಗದ ಇದೆ — ಜಗಳಕ್ಕಲ್ಲ. ನಾನು ಹೇಳೋದು ನನ್ನ ಸ್ವಂತ ಅಭಿಪ್ರಾಯ ಅಲ್ಲ ಅಂತ ತೋರಿಸೋಕೆ.
    tr: Timmēgauḍrē, nānu kūtkoṇḍē mātāḍtīni. Nanna kaili svalpa kāgada ide — jagaḷakkalla. Nānu hēḷōdu nanna svanta abhiprāya alla anta tōrisōke.
    en: Thimmegowda, I'll speak sitting down. I have some papers in my hand — not for a fight. Just to show that what I'm saying isn't merely my own opinion.
  - who: shobha
    t: ಗದ್ದೆ ಅಪ್ಪನಿಗೆ ಅವರ ಅಪ್ಪ ಕರಿಯಪ್ಪನಿಂದ ಬಂದಿದ್ದು. ಅಂದ್ರೆ ಅದು ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿ. ಎರಡು ಸಾವಿರದ ಐದರಲ್ಲಿ ಹಿಂದೂ ಉತ್ತರಾಧಿಕಾರ ಕಾಯ್ದೆಗೆ ತಿದ್ದುಪಡಿ ಆಯ್ತು. ಅದರ ಪ್ರಕಾರ ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿಯಲ್ಲಿ ಮಗಳಿಗೂ ಹುಟ್ಟಿನಿಂದಲೇ ಮಗನಷ್ಟೇ ಹಕ್ಕು ಇದೆ. ಕಾನೂನಿನ ಭಾಷೇಲಿ ಮಗಳೂ ‘ಸಹಸಮಾಂಶಿ’.
    tr: Gadde appanige avara appa Kariyappaninda bandiddu. Andre adu pitrārjita āsti. Eraḍu sāvirada aidaralli Hindū uttarādhikāra kāydege tiddupaḍi āytu. Adara prakāra pitrārjita āstiyalli magaḷigū huṭṭinindalē maganaṣṭē hakku ide. Kānūnina bhāṣēli magaḷū ‘sahasamāṁśi’.
    en: The wet land came to Appa from his father, Kariyappa. That makes it ancestral property. In 2005 the Hindu Succession Act was amended. Under it, a daughter has, from birth, the same right in ancestral property as a son. In the law's language, the daughter too is a 'coparcener'.
  - who: elder
    t: ಸಹ… ಸಮಾಂಶಿ. ಅಂಗಂದ್ರೆ ಏನವ್ವ? ನಮ್ಗೆ ಅರ್ಥ ಆಗಂಗೆ ಹೇಳು.
    tr: Saha… samāṁśi. Aṅgandre ēnavva? Namge artha āgaṅge hēḷu.
    en: Co… parcener. Meaning what, girl? Say it so we can understand.
  - who: shobha
    t: ಒಂದೇ ತಟ್ಟೆಯಲ್ಲಿ ಉಣ್ಣೋರು ಅಂತ ತಿಳ್ಕೊಳ್ಳಿ. ಹಿಂದೆ ಆ ತಟ್ಟೆ ಮುಂದೆ ಗಂಡುಮಕ್ಕಳು ಮಾತ್ರ ಕೂರ್ತಿದ್ರು. ಈಗ ಮಗಳೂ ಹುಟ್ಟಿದ ದಿನದಿಂದಲೇ ಅದೇ ತಟ್ಟೆ ಮುಂದೆ ಕೂತಿರ್ತಾಳೆ. ಮದುವೆ ಆದ್ರೂ ಅವಳ ಜಾಗ ಹೋಗಲ್ಲ.
    tr: Ondē taṭṭeyalli uṇṇōru anta tiḷkoḷḷi. Hinde ā taṭṭe munde gaṇḍumakkaḷu mātra kūrtidru. Īga magaḷū huṭṭida dinadindalē adē taṭṭe munde kūtirtāḷe. Maduve ādrū avaḷa jāga hōgalla.
    en: Think of it as those who eat from the same plate. In the old days only the sons sat before that plate. Now the daughter too sits before the same plate from the day she's born. Even if she marries, she doesn't lose her place.
  - who: elder
    t: ಹ್ಞೂ… ಚೆನ್ನಾಗಿ ಹೇಳ್ದೆ. ಮುಂದುವರ್ಸು.
    tr: Hñū… cennāgi hēḷde. Munduvarsu.
    en: Hmm… well put. Go on.
  - who: shobha
    t: 'ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತರಲ್ಲಿ ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ವಿನೀತಾ ಶರ್ಮಾ ಪ್ರಕರಣದಲ್ಲಿ ತೀರ್ಪು ಕೊಟ್ಟಿದೆ: ತಿದ್ದುಪಡಿ ಬಂದಾಗ ಅಪ್ಪ ಬದುಕಿರ್ಲಿ ಬಿಡ್ಲಿ, ಮಗಳ ಹಕ್ಕು ಹುಟ್ಟಿನಿಂದಲೇ. ಇನ್ನೊಂದು ಮಾತೂ ಆ ತೀರ್ಪಲ್ಲಿದೆ — ಬರೀ ಬಾಯ್ಮಾತಿನ ಪಾಲನ್ನ ಸಾಮಾನ್ಯವಾಗಿ ಒಪ್ಪಲ್ಲ. ನೋಂದಣಿ ಆದ ಪತ್ರ ಅಥವಾ ಕೋರ್ಟ್ ಡಿಕ್ರಿ ಬೇಕು.'
    tr: 'Eraḍu sāvirada ippattaralli Suprīṁ Kōrṭ Vinītā Śarmā prakaraṇadalli tīrpu koṭṭide: tiddupaḍi bandāga appa badukirli biḍli, magaḷa hakku huṭṭinindalē. Innondu mātū ā tīrpallide — barī bāymātina pālanna sāmānyavāgi oppalla. Nōndaṇi āda patra athavā kōrṭ ḍikri bēku.'
    en: 'In 2020 the Supreme Court gave its judgment in the Vineeta Sharma case: whether or not the father was alive when the amendment came, the daughter''s right exists from birth. There''s one more thing in that judgment — a division made only by word of mouth is generally not accepted. You need a registered deed or a court decree.'
  - who: mahadeva
    t: ದಿಲ್ಲಿ ಕೋರ್ಟು, ದಿಲ್ಲಿ ತೀರ್ಪು. ಆ ಜಡ್ಜು ಯಾವತ್ತಾದ್ರೂ ಬೆಟ್ಟಹಳ್ಳಿ ಗದ್ದೇಲಿ ಕಾಲಿಟ್ಟಿದಾರಾ?
    tr: Dilli kōrṭu, dilli tīrpu. Ā jaḍju yāvattādrū Beṭṭahaḷḷi gaddēli kāliṭṭidārā?
    en: A Delhi court, a Delhi judgment. Has that judge ever once set foot in a Bettahalli paddy field?
  - who: shobha
    t: ಇಲ್ಲ, ಮಹದೇವ. ಆದ್ರೆ ಬೆಟ್ಟಹಳ್ಳಿಯೂ ಇದೇ ದೇಶದಲ್ಲಿದೆ. ತಹಸೀಲ್ದಾರ್ ಮೇಡಂ ಹೇಳಿದ್ದೂ ಅದೇ ಅಲ್ವಾ?
    tr: Illa, Mahadēva. Ādre Beṭṭahaḷḷiyū idē dēśadallide. Tahasīldār mēḍam hēḷiddū adē alvā?
    en: No, Mahadeva. But Bettahalli is in this same country. Isn't that exactly what the Tahsildar madam said too?
  - who: shobha
    t: ಮತ್ತೆ, ಊರಲ್ಲಿ ಒಂದು ಮಾತು ಓಡಾಡ್ತಿದೆ ಅಂತ ನಂಗೆ ಗೊತ್ತು — ‘ಮದುವೆಗೆ ಎರಡು ಲಕ್ಷ ಖರ್ಚಾಯ್ತು, ಅದೇ ಅವಳ ಪಾಲು’ ಅಂತ. ಮದುವೆ ಖರ್ಚು ಪಾಲಲ್ಲ. ಅಪ್ಪ ಮಗನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ರು — ಅದನ್ನ ಯಾರೂ ಅಣ್ಣನ ಪಾಲು ಅನ್ನಲ್ಲ. ಮಗಳಿಗೆ ಮಾಡಿದ್ದು ಮಾತ್ರ ಯಾಕೆ ಪಾಲು ಆಗುತ್ತೆ?
    tr: Matte, ūralli ondu mātu ōḍāḍtide anta naṅge gottu — ‘maduvege eraḍu lakṣa kharcāytu, adē avaḷa pālu’ anta. Maduve kharcu pālalla. Appa magana ōdige ettu māridru — adanna yārū aṇṇana pālu annalla. Magaḷige māḍiddu mātra yāke pālu āgutte?
    en: And I know there's talk going round the village — 'Two lakh was spent on her wedding; that was her share.' Wedding expenses are not a share. Appa sold the bullocks for his son's studies — nobody calls that Anna's share. Why is it that only what was done for the daughter becomes her share?
  - who: elder
    t: … ಇದಕ್ಕೆ ಯಾರತ್ರಾನಾದ್ರೂ ಉತ್ರ ಇದೆಯಾ?
    tr: … Idakke yāratrānādrū utra ideyā?
    en: (after a silence) … Does anyone have an answer to that?
  - who: mahadeva
    t: ಉತ್ರ ಇದೆ. ಎತ್ತು ಮಾರಿದ್ದು ಅಪ್ಪ. ಸಾಲ ತೀರಿಸಿದ್ದು ನಾನು. ಅವಳ ಮದುವೆ ಸಾಲ ಅಪ್ಪನ ಸಾಲ ಆಗಿ ಉಳೀಲಿಲ್ಲ, ನನ್ನ ಬೆನ್ನ ಮೇಲಿನ ಸಾಲ ಆಗಿತ್ತು.
    tr: Utra ide. Ettu māriddu appa. Sāla tīrisiddu nānu. Avaḷa maduve sāla appana sāla āgi uḷīlilla, nanna benna mēlina sāla āgittu.
    en: There's an answer. It was Appa who sold the bullocks. It was me who cleared the debt. Her wedding loan didn't stay Appa's debt — it had become a debt on my back.
  - who: shobha
    t: ಅದಕ್ಕೆ ನಾನು ನಿನಗೆ ಋಣಿ, ಮಹದೇವ. ನಿಜವಾಗ್ಲೂ. ಪಾಲು ಮಾಡುವಾಗ ಅದನ್ನ ಲೆಕ್ಕಕ್ಕೆ ತಗೊಳ್ಳೋಣ. ಆದ್ರೆ ಋಣ ಬೇರೆ, ಹಕ್ಕು ಬೇರೆ.
    tr: Adakke nānu ninage ṛṇi, Mahadēva. Nijavāglū. Pālu māḍuvāga adanna lekkakke tagoḷḷōṇa. Ādre ṛṇa bēre, hakku bēre.
    en: I'm indebted to you for that, Mahadeva. Truly. Let's take it into account when we divide. But a debt of gratitude is one thing, and a right is another.
  - who: elder
    t: 'ನಿಂಗೇಗೌಡ್ರು ಒಂದು ಪ್ರಶ್ನೆ ಕೇಳ್ತಿದಾರೆ, ನಾನೇ ಕೇಳ್ತೀನಿ: ಶೋಭಾ, ನಿಂಗೆ ಏನು ಬೇಕು? ಗದ್ದೆ ಒಡೆದು ಒಂದು ತುಂಡು ಬೇಕಾ? ನೀನು ಮೈಸೂರಲ್ಲಿ ಇದ್ಕಂಡು ಉಳುಮೆ ಮಾಡ್ತೀಯಾ?'
    tr: 'Niṅgēgauḍru ondu praśne kēḷtidāre, nānē kēḷtīni: Śōbhā, niṅge ēnu bēku? Gadde oḍedu ondu tuṇḍu bēkā? Nīnu Maisūralli idkaṇḍu uḷume māḍtīyā?'
    en: Ningegowda is asking a question; I'll put it for him. Shobha, what is it you want? Do you want the wet land broken up and a piece of it? Will you plough it while living in Mysuru?
  - who: shobha
    t: 'ಇಲ್ಲ, ತಿಮ್ಮೇಗೌಡ್ರೇ. ನಾನು ಮಹದೇವನ ಕೈಯಿಂದ ನೇಗಿಲು ಕಿತ್ಕೊಳ್ಳೋಕೆ ಬಂದಿಲ್ಲ. ನನಗೆ ಮೂರು ವಿಷಯ ಬೇಕು. ಒಂದು: ನನ್ನ ಹೆಸರು ಇನ್ಮೇಲೆ ಯಾವ ಕಾಗದದಿಂದಲೂ ಕಾಣೆ ಆಗಬಾರದು. ಎರಡು: ನನ್ನ ಪಾಲು ನನಗೆ ಸಿಗ್ಬೇಕು — ಜಮೀನಾಗಿ ಆಗ್ಲಿ, ದುಡ್ಡಾಗಿ ಆಗ್ಲಿ. ಮೂರು: ನಾನು ಈ ಮನೆಗೆ ಬಂದಾಗ ನೆಂಟರ ತರ ಅಲ್ಲ, ಮಗಳ ತರ ಬರ್ಬೇಕು.'
    tr: 'Illa, Timmēgauḍrē. Nānu Mahadēvana kaiyinda nēgilu kitkoḷḷōke bandilla. Nanage mūru viṣaya bēku. Ondu: nanna hesaru inmēle yāva kāgadadindalū kāṇe āgabāradu. Eraḍu: nanna pālu nanage sigbēku — jamīnāgi āgli, duḍḍāgi āgli. Mūru: nānu ī manege bandāga neṇṭara tara alla, magaḷa tara barbēku.'
    en: 'No, Thimmegowda. I haven''t come to snatch the plough from Mahadeva''s hands. I want three things. One: from now on my name must never go missing from any paper. Two: I must get my share — as land or as money. Three: when I come to this house, I should come as a daughter, not as a visiting relative.'
  - who: mahadeva
    t: ದುಡ್ಡಾಗಿ? ಎಲ್ಲಿಂದ ತರ್ಲಿ? ಕಬ್ಬಿನ ದುಡ್ಡೇ ಇನ್ನೂ ಕಾರ್ಖಾನೆಯಿಂದ ಬಂದಿಲ್ಲ. ಸಂಘದ ಸಾಲ ಒಂದು ಲಕ್ಷ ಅರವತ್ತು ಸಾವಿರ ಬಾಕಿ ಇದೆ. ನಿನ್ನ ಪಾಲಿನ ಬೆಲೆ ಎಷ್ಟು ಲಕ್ಷ ಅಂತ ಲೆಕ್ಕ ಹಾಕಿದೀಯಾ? ಅಷ್ಟು ದುಡ್ಡು ನಾನು ಜೀವಮಾನದಲ್ಲಿ ಕಣ್ಣಲ್ಲಿ ನೋಡಿಲ್ಲ.
    tr: Duḍḍāgi? Ellinda tarli? Kabbina duḍḍē innū kārkhāneyinda bandilla. Saṅghada sāla ondu lakṣa aravattu sāvira bāki ide. Ninna pālina bele eṣṭu lakṣa anta lekka hākidīyā? Aṣṭu duḍḍu nānu jīvamānadalli kaṇṇalli nōḍilla.
    en: As money? Where am I to bring it from? The cane money itself still hasn't come from the factory. One lakh sixty thousand of society loan is outstanding. Have you worked out how many lakhs your share is worth? I haven't seen that much money with my own eyes in my whole life.
  - who: shobha
    t: ಒಂದೇ ಸಲ ಕೊಡು ಅಂತ ನಾನು ಹೇಳಿಲ್ಲ. ಕಂತಿನಲ್ಲಿ ಕೊಡು. ಇಲ್ಲಾಂದ್ರೆ ಹೊಲದಲ್ಲಿ ಒಂದು ತುಂಡು ನನ್ನ ಹೆಸರಿಗೆ ಇರ್ಲಿ, ನೀನೇ ಬೆಳೆ ಮಾಡು. ದಾರಿ ಹುಡುಕೋಕೆ ನಾನು ತಯಾರು. ಆದ್ರೆ ‘ಪಾಲೇ ಇಲ್ಲ’ ಅನ್ನೋ ದಾರಿಗೆ ಮಾತ್ರ ಬರಲ್ಲ.
    tr: Ondē sala koḍu anta nānu hēḷilla. Kantinalli koḍu. Illāndre holadalli ondu tuṇḍu nanna hesarige irli, nīnē beḷe māḍu. Dāri huḍukōke nānu tayāru. Ādre ‘pālē illa’ annō dārige mātra baralla.
    en: I never said give it all at once. Give it in instalments. Or let a piece of the dry field be in my name, and you grow the crop on it. I'm ready to look for a way. But the one road I won't take is the one that says 'no share at all'.
  - who: suresh
    t: ತಿಮ್ಮೇಗೌಡ್ರೇ, ನಾನೊಂದು ಸಲಹೆ ಹೇಳ್ತೀನಿ. ತೀರ್ಮಾನ ಅಲ್ಲ, ಬರೀ ಸಲಹೆ. ಗದ್ದೆ ಮಹದೇವನ ಕೈಯಲ್ಲೇ ಇರ್ಲಿ. ಶೋಭಾಳ ಪಾಲಿನ ಬೆಲೆಯಷ್ಟು ಜಾಗ ಹೊಲದಲ್ಲಿ ಅಳತೆ ಮಾಡಿ ಅವಳಿಗೆ ಕೊಡೋಣ. ನನ್ನ ಪಾಲಿನ ವಿಷಯ ಆಮೇಲೆ ನೋಡೋಣ — ನಾನು ಯಾರನ್ನೂ ಕಾಯಿಸಲ್ಲ.
    tr: Timmēgauḍrē, nānondu salahe hēḷtīni. Tīrmāna alla, barī salahe. Gadde Mahadēvana kaiyallē irli. Śōbhāḷa pālina beleyaṣṭu jāga holadalli aḷate māḍi avaḷige koḍōṇa. Nanna pālina viṣaya āmēle nōḍōṇa — nānu yārannū kāyisalla.
    en: Thimmegowda, let me offer a suggestion. Not a decision, just a suggestion. Let the wet land stay in Mahadeva's hands. Let's measure out land in the dry field worth Shobha's share and give it to her. My own share we can look at later — I won't keep anyone waiting.
  - who: elder
    t: ಕೇಳೋಕೆ ಚೆನ್ನಾಗಿದೆ. ಮಹದೇವ, ಏನಂತೀಯ?
    tr: Kēḷōke cennāgide. Mahadēva, ēnantīya?
    en: It sounds good to the ear. Mahadeva, what do you say?
  - who: mahadeva
    t: ಹೊಲ ತುಂಡು ಮಾಡ್ತೀರಾ? ಅಪ್ಪ ಮಲಗಿರೋದು ಆ ಹೊಲದ ಹುಣಸೆ ಮರದ ಕೆಳಗೆ, ಅಣ್ಣ. ನಾಳೆ ಅವಳ ಪಾಲಿನ ತುಂಡು ಯಾರೋ ಬೆಂಗಳೂರಿನೋರಿಗೆ ಮಾರಿದ್ರೆ? ಅಪ್ಪನ ಸಮಾಧಿ ಪಕ್ಕ ಯಾರದೋ ಕಾಂಪೌಂಡ್ ಗೋಡೆ ಏಳುತ್ತೆ. ಅದನ್ನ ನಾನು ನೋಡ್ಬೇಕಾ?
    tr: Hola tuṇḍu māḍtīrā? Appa malagirōdu ā holada huṇase marada keḷage, aṇṇa. Nāḷe avaḷa pālina tuṇḍu yārō Beṅgaḷūrinōrige māridre? Appana samādhi pakka yāradō kāmpauṇḍ gōḍe ēḷutte. Adanna nānu nōḍbēkā?
    en: You'll cut up the dry field? Appa lies under the tamarind tree in that field, Anna. What if tomorrow her piece is sold to some Bengaluru people? Somebody's compound wall will go up right next to Appa's grave. Am I supposed to watch that?
  - who: shobha
    t: ನಾನು ಮಾರ್ತೀನಿ ಅಂತ ಯಾರು ಹೇಳಿದ್ರು? ಅದು ನನ್ನ ಅಪ್ಪನ ಸಮಾಧಿನೂ ಹೌದು, ನಿನ್ನೊಬ್ಬನದಲ್ಲ.
    tr: Nānu mārtīni anta yāru hēḷidru? Adu nanna appana samādhinū haudu, ninnobbanadalla.
    en: Who said I'd sell it? That's my father's grave too, not yours alone.
  - who: mahadeva
    t: ಇವತ್ತು ನೀನು ಹೇಳಲ್ಲ. ನಾಳೆ ನಿನ್ನ ಗಂಡನ ಮನೆಯೋರು ಹೇಳ್ತಾರೆ. ಊರೂರಲ್ಲಿ ಹಂಗೆ ಆಗಿರೋದನ್ನ ನೋಡಿಲ್ವಾ?
    tr: Ivattu nīnu hēḷalla. Nāḷe ninna gaṇḍana maneyōru hēḷtāre. Ūrūralli haṅge āgirōdanna nōḍilvā?
    en: You won't say it today. Tomorrow your husband's family will say it. Haven't we seen it happen that way in village after village?
  - who: shobha
    t: ನನ್ನ ಗಂಡನ ಮನೆಯೋರನ್ನ ಇಲ್ಲಿಗೆ ಎಳೀಬೇಡ, ಮಹದೇವ.
    tr: Nanna gaṇḍana maneyōranna illige eḷībēḍa, Mahadēva.
    en: Don't drag my husband's family into this, Mahadeva.
  - who: elder
    t: ಸಾಕು, ಸಾಕು. ಮಾತು ಬೇರೆ ಕಡೆ ಹೋಯ್ತಾ ಇದೆ.
    tr: Sāku, sāku. Mātu bēre kaḍe hōytā ide.
    en: Enough, enough. The talk is drifting the wrong way.
  - section: Old wounds
    learn: 'reproach in habitual past: kaḷistiddaddu yāru?, mātāḍtiddaddu yāru? · counterfactual: ūrallē iddidre … kūtirtidde · admitting fault: adu nanna tappu, taḍavāgi hēḷtidīni · shared burdens: obbobbaru ondondu bhāra · image: maṇṇu han̄cabōdu, nōvu han̄cōkāgalla, karagisbēku'
  - scene: The lamp hisses. Among the women, a small child has fallen asleep in his mother's lap. The talk has turned from land to the past.
  - who: shobha
    t: ಮಹದೇವ, ನೀನು ‘ನಾನೇ ಇದ್ದೆ, ನಾನೇ ಇದ್ದೆ’ ಅಂತೀಯ. ಅವ್ವನ ಮಂಡಿ ನೋವಿಗೆ ಪ್ರತಿ ತಿಂಗಳು ಮೈಸೂರಿಂದ ಮಾತ್ರೆ ಕಳಿಸ್ತಿದ್ದದ್ದು ಯಾರು? ಪ್ರತಿ ಭಾನುವಾರ ಫೋನ್ ಮಾಡಿ ಅಪ್ಪನ ಹತ್ರ ಅರ್ಧ ಗಂಟೆ ಮಾತಾಡ್ತಿದ್ದದ್ದು ಯಾರು? ಊರಿಗೆ ಬಂದಾಗ ಅಪ್ಪ ‘ನನ್ ಮಗಳು ನರ್ಸ್’ ಅಂತ ಎಲ್ಲರಿಗೂ ತೋರಿಸ್ತಿದ್ದದ್ದು ಯಾರನ್ನ?
    tr: Mahadēva, nīnu ‘nānē idde, nānē idde’ antīya. Avvana maṇḍi nōvige prati tiṅgaḷu Maisūrinda mātre kaḷistiddaddu yāru? Prati bhānuvāra phōn māḍi appana hatra ardha gaṇṭe mātāḍtiddaddu yāru? Ūrige bandāga appa ‘nan magaḷu nars’ anta ellarigū tōristiddaddu yāranna?
    en: Mahadeva, you keep saying, 'I was the one who was here, I was here.' Who sent tablets from Mysuru every month for Avva's knee pain? Who phoned every Sunday and talked to Appa for half an hour? Whenever I came to the village, who was it Appa showed off to everyone — 'my daughter, the nurse'?
  - who: mahadeva
    t: ಫೋನ್ ಮಾಡೋದು ಸುಲಭ, ಶೋಭಾ. ಅಪ್ಪ ಜ್ವರದಲ್ಲಿ ನಡುಗ್ತಿದ್ದಾಗ ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಬೈಕಲ್ಲಿ ಕೂರಿಸ್ಕಂಡು ಮದ್ದೂರಿನ ಡಾಕ್ಟ್ರ ಮನೆ ಬಾಗಿಲು ತಟ್ಟೋದು ಕಷ್ಟ.
    tr: Phōn māḍōdu sulabha, Śōbhā. Appa jvaradalli naḍugtiddāga rātri eraḍu gaṇṭege baikalli kūriskaṇḍu Maddūrina ḍākṭra mane bāgilu taṭṭōdu kaṣṭa.
    en: Phoning is easy, Shobha. What's hard is sitting Appa on the back of the bike at two in the morning when he's shaking with fever, and knocking on the Maddur doctor's door.
  - who: shobha
    t: ಅದಕ್ಕೇ ನನ್ನ ಮೈಸೂರಿಗೆ ಕಳಿಸಿದ್ದು ನೀವೇ ಅಂದಿದ್ದು. ನಾನು ಇಪ್ಪತ್ತೊಂದು ವರ್ಷದವಳಿದ್ದಾಗ ‘ಒಳ್ಳೆ ಸಂಬಂಧ, ಬಿಡಬಾರದು’ ಅಂತ ಮದುವೆ ಮಾಡಿದ್ರಿ. ನಾನು ಊರಲ್ಲೇ ಇದ್ದಿದ್ರೆ ಆ ಬೈಕ್ ಹಿಂದೆ ನಾನೂ ಕೂತಿರ್ತಿದ್ದೆ.
    tr: Adakkē nanna Maisūrige kaḷisiddu nīvē andiddu. Nānu ippattondu varṣadavaḷiddāga ‘oḷḷe sambandha, biḍabāradu’ anta maduve māḍidri. Nānu ūrallē iddidre ā baik hinde nānū kūtirtidde.
    en: That's exactly why I said it was all of you who sent me off to Mysuru. When I was twenty-one, you married me off saying 'it's a good match, we mustn't let it go'. If I had stayed in the village, I'd have been sitting on the back of that bike too.
  - who: suresh
    t: ಶೋಭಾ, ಆ ಸಂಬಂಧ ತಂದಿದ್ದು ನಾನು. ಅವತ್ತು ನೀನು ‘ನರ್ಸಿಂಗ್ ಮುಗಿಸಿ ಕೆಲಸಕ್ಕೆ ಸೇರಿದ ಮೇಲೆ ಮದುವೆ’ ಅಂದಾಗ ನಾನು ಕೇಳಿಸ್ಕೊಳ್ಳಲಿಲ್ಲ. ಬ್ಯಾಂಕ್ ಕೆಲಸ ಸಿಕ್ಕಿದ ಜಂಬ ಇತ್ತು ನಂಗೆ — ಮನೆಯ ಎಲ್ಲಾ ತೀರ್ಮಾನ ನಾನೇ ಮಾಡ್ತೀನಿ ಅನ್ನೋ ಜಂಬ. ಅದು ನನ್ನ ತಪ್ಪು. ಹದಿನಾರು ವರ್ಷ ತಡವಾಗಿ ಹೇಳ್ತಿದೀನಿ.
    tr: Śōbhā, ā sambandha tandiddu nānu. Avattu nīnu ‘narsiṅg mugisi kelasakke sērida mēle maduve’ andāga nānu kēḷiskoḷḷalilla. Byāṅk kelasa sikkida jamba ittu naṅge — maneya ellā tīrmāna nānē māḍtīni annō jamba. Adu nanna tappu. Hadināru varṣa taḍavāgi hēḷtidīni.
    en: Shobha, I was the one who brought that proposal. That day, when you said 'I'll marry after I finish nursing and start a job', I didn't listen. I was full of pride at having got a bank job — the pride of thinking I'd make every decision in the house. That was my fault. I'm saying it sixteen years late.
  - who: shobha
    t: … ಮದುವೆ ಆದ ಮೇಲೆ ಮೂರು ವರ್ಷ ಕಷ್ಟಪಟ್ಟು ನರ್ಸಿಂಗ್ ಮುಗಿಸಿದೆ, ಅಣ್ಣ. ಅವತ್ತು ಯಾರೂ ‘ಹೇಗಿದೀಯ’ ಅಂತ ಕೇಳ್ಲಿಲ್ಲ.
    tr: … Maduve āda mēle mūru varṣa kaṣṭapaṭṭu narsiṅg mugiside, aṇṇa. Avattu yārū ‘hēgidīya’ anta kēḷlilla.
    en: (quietly) … After the wedding I struggled for three years to finish my nursing, Anna. Back then nobody asked me how I was.
  - who: mahadeva
    t: ಕೇಳ್ಲಿಲ್ಲ, ನಿಜ. ಯಾಕಂದ್ರೆ ಆಗ ನಾನು ನಿನ್ನ ಮದುವೆ ಸಾಲದ ಕಂತು ಕಟ್ತಿದ್ದೆ. ನಾವೆಲ್ಲಾ ಒಬ್ಬೊಬ್ಬರು ಒಂದೊಂದು ಭಾರ ಹೊತ್ಕಂಡಿದ್ವಿ. ಯಾರೂ ಇನ್ನೊಬ್ಬರ ಭಾರ ನೋಡ್ಲಿಲ್ಲ.
    tr: Kēḷlilla, nija. Yākandre āga nānu ninna maduve sālada kantu kaṭtidde. Nāvellā obbobbaru ondondu bhāra hotkaṇḍidvi. Yārū innobbara bhāra nōḍlilla.
    en: True, nobody asked. Because back then I was paying the instalments on your wedding loan. Each of us was carrying a load of our own. Nobody looked at anyone else's.
  - who: elder
    t: ಈಗ ನಿಜವಾದ ಮಾತು ಬಂತು. ನೋಡ್ರಪ್ಪ, ಜಮೀನಿನ ಜಗಳ ಅಂತ ಕುಂತ್ರಿ. ಆದ್ರೆ ಒಳಗೆ ಇರೋದು ಇಪ್ಪತ್ತು ವರ್ಷದ ನೋವು. ಮಣ್ಣು ಹಂಚಬೋದು, ನೋವು ಹಂಚೋಕಾಗಲ್ಲ — ಮಾತಾಡಿ ಮಾತಾಡಿ ಕರಗಿಸ್ಬೇಕು.
    tr: Īga nijavāda mātu bantu. Nōḍrappa, jamīnina jagaḷa anta kuntri. Ādre oḷage irōdu ippattu varṣada nōvu. Maṇṇu han̄cabōdu, nōvu han̄cōkāgalla — mātāḍi mātāḍi karagisbēku.
    en: Now the real talk has come out. Look, my children, you sat down calling it a land dispute. But what's inside is twenty years of hurt. Soil can be divided; hurt can't be divided — you have to talk and talk until it melts.
  - who: rakshith
    t: ಅಮ್ಮ, ‘ಕರಗಿಸ್ಬೇಕು’ ಅಂದ್ರೇನು?
    tr: Amma, ‘karagisbēku’ andrēnu?
    en: (whispering) Amma, what does 'karagisbeku' mean?
  - who: meena
    t: ಬೆಣ್ಣೆ ಬಿಸಿಗೆ ಕರಗೋ ಹಾಗೆ, ಗಟ್ಟಿಯಾಗಿರೋದನ್ನ ಮೆತ್ತಗೆ ಮಾಡ್ಬೇಕು ಅಂತ. ಈಗ ಸುಮ್ನೆ ಕೇಳು.
    tr: Beṇṇe bisige karagō hāge, gaṭṭiyāgirōdanna mettage māḍbēku anta. Īga sumne kēḷu.
    en: (whispering back) Like butter melting in the heat — making what has gone hard soft again. Now just listen.
  - section: Avva's wish
    learn: 'a mother''s plea: nānu badukirō tanaka, kaṇṇu muccida mēle · proverb-like images: ondu beraḷu koydrū nōvu · reported wisdom: nammavva hēḷtidlu · the elders'' terms (ondu, eraḍu, mūru) and a deadline: varṣada tithi tanaka · partial acceptance and refusal: modala eraḍu mātige optīni; oppige illa, tappu tiḷkōbēḍi · closing proverb: kūḍi bāḷidare svarga sukha'
  - scene: Thimmegowda turns to Avva, who has sat silent all evening on her mat, the end of her sari drawn over her head.
  - who: elder
    t: ಪುಟ್ಟಮ್ಮ, ಇವತ್ತು ಕೊನೇ ಮಾತು ನಿಂದು. ನೀನು ಏನ್ ಬಯಸ್ತೀಯಮ್ಮ?
    tr: Puṭṭamma, ivattu konē mātu nindu. Nīnu ēn bayastīyamma?
    en: Puttamma, tonight the last word is yours. What is it you wish for?
  - who: avva
    t: ನಾನೇನು ಹೇಳ್ಲಿ ತಿಮ್ಮಣ್ಣ… ಮೂರೂ ನನ್ ಹೊಟ್ಟೇಲಿ ಹುಟ್ಟಿದ ಮಕ್ಳು. ಒಂದು ಬೆರಳು ಕೊಯ್ದ್ರೂ ನೋವು, ಇನ್ನೊಂದು ಕೊಯ್ದ್ರೂ ನೋವು. ಯಾರ ಕಡೆ ನಿಲ್ಲಲಿ?
    tr: Nānēnu hēḷli Timmaṇṇa… mūrū nan hoṭṭēli huṭṭida makḷu. Ondu beraḷu koydrū nōvu, innondu koydrū nōvu. Yāra kaḍe nillali?
    en: What can I say, Thimmanna… all three are children of my own womb. Cut one finger, it hurts; cut another, it hurts just the same. Whose side am I to stand on?
  - who: avva
    t: ನನ್ನ ಆಸೆ ಒಂದೇ. ನಾನು ಬದುಕಿರೋ ತನಕ ಈ ಮನೆ, ಈ ಜಮೀನು ಒಡೀಬಾರ್ದು. ಮಹದೇವ ಗದ್ದೆ ನೋಡ್ಕಳ್ಲಿ. ಸುರೇಶ, ಶೋಭಾ ಹಬ್ಬಕ್ಕೆ ಬರ್ಲಿ, ಅಂಗಳದಲ್ಲಿ ಎಲ್ರೂ ಒಟ್ಟಿಗೆ ಉಣ್ಲಿ. ನಾನು ಕಣ್ಣು ಮುಚ್ಚಿದ ಮೇಲೆ ಏನ್ ಬೇಕಾದ್ರೂ ಮಾಡ್ಕಳಿ.
    tr: Nanna āse ondē. Nānu badukirō tanaka ī mane, ī jamīnu oḍībārdu. Mahadēva gadde nōḍkaḷli. Surēśa, Śōbhā habbakke barli, aṅgaḷadalli ellrū oṭṭige uṇli. Nānu kaṇṇu muccida mēle ēn bēkādrū māḍkaḷi.
    en: I have only one wish. As long as I'm alive, this house and this land must not be split. Let Mahadeva look after the wet land. Let Suresha and Shobha come for the festivals; let everyone eat together in the yard. Once I've closed my eyes, do whatever you like.
  - who: avva
    t: ಆದ್ರೆ ಮಹದೇವ, ಒಂದು ಮಾತು ಕೇಳು ಕಣಪ್ಪ. ಶೋಭಾ ನನ್ನ ಮಗಳು. ಅವಳಿಗೆ ‘ಪಾಲಿಲ್ಲ’ ಅನ್ನೋ ಮಾತು ನನ್ನ ಬಾಯಿಂದ ಯಾವತ್ತೂ ಬರಲ್ಲ. ತವರು ಮನೆ ಬಾಗಿಲು ಮಗಳಿಗೆ ಮುಚ್ಚಿದ್ರೆ ಆ ಮನೆಗೆ ಏಳ್ಗೆ ಇಲ್ಲ ಅಂತ ನಮ್ಮವ್ವ ಹೇಳ್ತಿದ್ಲು.
    tr: Ādre Mahadēva, ondu mātu kēḷu kaṇappa. Śōbhā nanna magaḷu. Avaḷige ‘pālilla’ annō mātu nanna bāyinda yāvattū baralla. Tavaru mane bāgilu magaḷige muccidre ā manege ēḷge illa anta nammavva hēḷtidlu.
    en: 'But Mahadeva, hear one thing, my son. Shobha is my daughter. The words ''you have no share'' will never come out of my mouth. My own mother used to say: if a house shuts its door on its daughter, that house will never prosper.'
  - who: mahadeva
    t: ಅವ್ವ, ನೀನೂ…?
    tr: Avva, nīnū…?
    en: Avva, you too…?
  - who: avva
    t: ನಾನು ಯಾರ ಕಡೇನೂ ಅಲ್ಲ ಕಣಪ್ಪ. ನಾನು ಈ ಮನೆ ಕಡೆ.
    tr: Nānu yāra kaḍēnū alla kaṇappa. Nānu ī mane kaḍe.
    en: I'm on nobody's side, son. I'm on this house's side.
  - who: elder
    t: 'ಸರಿ. ನಾವು ಮೂರು ಜನ ಹಿರಿಯರು ಮಾತಾಡ್ಕಂಡಿದೀವಿ. ನಮ್ ಮಾತು ಇದು. ಒಂದು: ಪಹಣಿಯಲ್ಲಿ ನಾಲ್ಕೂ ಹೆಸರು ಇರ್ಲಿ, ಯಾರೂ ಯಾರ ಹೆಸರೂ ತೆಗೆಸೋ ಪ್ರಯತ್ನ ಮಾಡಬಾರ್ದು. ಎರಡು: ಚನ್ನೇಗೌಡನ ವರ್ಷದ ತಿಥಿ ತನಕ — ಈ ಡಿಸೆಂಬರ್ ತನಕ — ಮಹದೇವನೇ ಬೇಸಾಯ ಮಾಡ್ಲಿ. ಕಬ್ಬಿನ ದುಡ್ಡು ಬಂದಾಗ ಸಾಲ ಕಟ್ಟಿ, ಉಳಿದಿದ್ರಲ್ಲಿ ಒಂದು ಭಾಗ ಅವ್ವನ ಕೈಗೆ ಕೊಡ್ಲಿ. ಮೂರು: ತಿಥಿ ಆದ ಮೇಲೆ ಮತ್ತೆ ಇದೇ ಕಟ್ಟೆ ಮೇಲೆ ಕುಂತು ಪಾಲು ತೀರ್ಮಾನ ಮಾಡೋಣ.'
    tr: 'Sari. Nāvu mūru jana hiriyaru mātāḍkaṇḍidīvi. Nam mātu idu. Ondu: pahaṇiyalli nālkū hesaru irli, yārū yāra hesarū tegesō prayatna māḍabārdu. Eraḍu: Cannēgauḍana varṣada tithi tanaka — ī Ḍisembar tanaka — Mahadēvanē bēsāya māḍli. Kabbina duḍḍu bandāga sāla kaṭṭi, uḷididralli ondu bhāga avvana kaige koḍli. Mūru: tithi āda mēle matte idē kaṭṭe mēle kuntu pālu tīrmāna māḍōṇa.'
    en: 'All right. We three elders have talked it over. Here is our word. One: let all four names stay in the RTC, and let nobody try to have anybody''s name removed. Two: until Channegowda''s first-year rite — until this December — let Mahadeva go on farming. When the cane money comes, let him repay the loan and hand a portion of what''s left to Avva. Three: after the rite, we''ll sit again on this same platform and decide the shares.'
  - who: suresh
    t: ನನಗೆ ಒಪ್ಪಿಗೆ ಇದೆ, ತಿಮ್ಮೇಗೌಡ್ರೇ.
    tr: Nanage oppige ide, Timmēgauḍrē.
    en: I agree, Thimmegowda.
  - who: mahadeva
    t: 'ಮೊದಲ ಎರಡು ಮಾತಿಗೆ ಒಪ್ತೀನಿ. ಮೂರನೇದಕ್ಕೆ… ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಕುಂತಾಗ್ಲೂ ನನ್ ಮಾತು ಇದೇ ಆಗಿರುತ್ತೆ: ಗದ್ದೆ ಒಡೆಯಲ್ಲ.'
    tr: 'Modala eraḍu mātige optīni. Mūranēdakke… Ḍisembar-nalli kuntāglū nan mātu idē āgirutte: gadde oḍeyalla.'
    en: 'I accept the first two. As for the third… even when we sit in December, my answer will be the same: the wet land will not be split.'
  - who: shobha
    t: ಹಂಗಾದ್ರೆ ಡಿಸೆಂಬರ್ ತನಕ ಕಾಯೋದು ಯಾಕೆ, ತಿಮ್ಮೇಗೌಡ್ರೇ? ಹದಿನಾರು ವರ್ಷದಿಂದ ‘ಮುಂದಿನ ವರ್ಷ ನೋಡೋಣ’ ಅಂತಾನೇ ಕೇಳ್ತಾ ಬಂದಿದೀನಿ. ಇವತ್ತೂ ಅದೇ ಮಾತು. ಕೊನೆಗೆ ಉತ್ತರ ‘ಇಲ್ಲ’ ಅಂತ ಮೊದ್ಲೇ ಗೊತ್ತಿದ್ರೆ ಕಾಯೋದ್ರಲ್ಲಿ ಅರ್ಥ ಇಲ್ಲ.
    tr: Haṅgādre Ḍisembar tanaka kāyōdu yāke, Timmēgauḍrē? Hadināru varṣadinda ‘mundina varṣa nōḍōṇa’ antānē kēḷtā bandidīni. Ivattū adē mātu. Konege uttara ‘illa’ anta modlē gottidre kāyōdralli artha illa.
    en: Then why wait till December, Thimmegowda? For sixteen years I've heard nothing but 'we'll see next year'. Tonight it's the same words again. If we already know the answer at the end will be 'no', there's no sense in waiting.
  - who: elder
    t: ಶೋಭಾ, ತಾಳ್ಮೆ ಕಳ್ಕೋಬೇಡವ್ವ. ಹಿರಿಯರ ಮಾತು ಕೇಳು.
    tr: Śōbhā, tāḷme kaḷkōbēḍavva. Hiriyara mātu kēḷu.
    en: Shobha, don't lose your patience, my girl. Listen to your elders.
  - who: shobha
    t: ನಿಮ್ಮ ಮೇಲೆ ನನಗೆ ಪೂರ್ತಿ ಗೌರವ ಇದೆ. ಆದ್ರೆ ತಾಳ್ಮೆ ಯಾವಾಗ್ಲೂ ಹೆಣ್ಣುಮಕ್ಕಳಿಂದಾನೇ ಯಾಕೆ ಕೇಳ್ತೀರಿ? ಇವತ್ತಿನ ಮಾತಿಗೆ ನನ್ನ ಒಪ್ಪಿಗೆ ಇಲ್ಲ. ತಪ್ಪು ತಿಳ್ಕೋಬೇಡಿ.
    tr: Nimma mēle nanage pūrti gaurava ide. Ādre tāḷme yāvāglū heṇṇumakkaḷindānē yāke kēḷtīri? Ivattina mātige nanna oppige illa. Tappu tiḷkōbēḍi.
    en: I have complete respect for you. But why is patience always asked of the women? I don't agree to tonight's terms. Please don't take it the wrong way.
  - who: suresh
    t: ಮಹದೇವ, ಒಂದು ಹೆಜ್ಜೆ ನೀನೂ ಹಿಂದೆ ಇಡು. ‘ಒಡೆಯಲ್ಲ’ ಅನ್ನೋ ಬದಲು ‘ಯೋಚನೆ ಮಾಡ್ತೀನಿ’ ಅನ್ನು, ಸಾಕು.
    tr: Mahadēva, ondu hejje nīnū hinde iḍu. ‘Oḍeyalla’ annō badalu ‘yōcane māḍtīni’ annu, sāku.
    en: Mahadeva, you take a step back too. Instead of 'it won't be split', just say 'I'll think about it' — that's enough.
  - who: mahadeva
    t: ಸುಳ್ಳು ಹೇಳೋಕೆ ಬರಲ್ಲ ಅಣ್ಣ. ಅಪ್ಪ ಅದನ್ನ ಕಲಿಸ್ಲಿಲ್ಲ.
    tr: Suḷḷu hēḷōke baralla aṇṇa. Appa adanna kalislilla.
    en: I don't know how to tell lies, Anna. Appa never taught me that.
  - who: elder
    t: … ಕೂಡಿ ಬಾಳಿದರೆ ಸ್ವರ್ಗ ಸುಖ ಅಂತಾರೆ. ಇವತ್ತು ಆ ಸ್ವರ್ಗ ಈ ಕಟ್ಟೆ ಮೇಲೆ ಇಳೀಲಿಲ್ಲ. ಪರವಾಗಿಲ್ಲ. ಒಂದೇ ರಾತ್ರೀಲಿ ಹಣ್ಣಾಗೋ ಕಾಯಿ ಯಾವ್ದೂ ಇಲ್ಲ. ಎಲ್ರೂ ಮನೆಗೆ ಹೋಗಿ. ಮಾತು ಮುಗಿದಿಲ್ಲ, ನಿಂತಿದೆ ಅಷ್ಟೇ.
    tr: … Kūḍi bāḷidare svarga sukha antāre. Ivattu ā svarga ī kaṭṭe mēle iḷīlilla. Paravāgilla. Ondē rātrīli haṇṇāgō kāyi yāvdū illa. Ellrū manege hōgi. Mātu mugidilla, nintide aṣṭē.
    en: (sighing) … They say living together is heaven's own happiness. Tonight that heaven didn't come down onto this platform. Never mind. No fruit ripens in a single night. Go home, all of you. The talk isn't over; it has only paused.
  - scene: The crowd breaks up. In the moonlight the family walks back along the cart track. Mahadeva strides ahead alone with a torch. Shobha falls in beside Suresh; Meena and Rakshith follow with Avva.
  - who: rakshith
    t: ಅಪ್ಪ, ನನಗೊಂದು ಅರ್ಥ ಆಗ್ಲಿಲ್ಲ. ಎಲ್ರೂ ತಾತನ್ನ ಪ್ರೀತಿಸ್ತಿದ್ರು, ಎಲ್ರೂ ಅಜ್ಜಿನ ಪ್ರೀತಿಸ್ತಾರೆ. ಆದ್ರೂ ಯಾಕೆ ಒಪ್ಪಿಗೆ ಆಗ್ಲಿಲ್ಲ?
    tr: Appa, nanagondu artha āglilla. Ellrū tātanna prītistidru, ellrū ajjina prītistāre. Ādrū yāke oppige āglilla?
    en: Appa, there's one thing I don't get. Everyone loved Thatha, everyone loves Ajji. So why couldn't they agree?
  - who: suresh
    t: ಯಾಕಂದ್ರೆ ಪ್ರೀತಿ ಇದ್ದಲ್ಲಿ ನೋವೂ ಜಾಸ್ತಿ, ಕಂದ. ಅಪರಿಚಿತರ ಜೊತೆ ಜಗಳ ಸುಲಭ — ಮುಗಿಸಿ ಹೊರಟು ಹೋಗ್ಬೋದು. ಸ್ವಂತದವರ ಜೊತೆ ಜಗಳ ಮುಗಿಯಲ್ಲ, ಮನಸ್ಸಲ್ಲೇ ಉಳಿಯುತ್ತೆ.
    tr: Yākandre prīti iddalli nōvū jāsti, kanda. Aparicitara jote jagaḷa sulabha — mugisi horaṭu hōgbōdu. Svantadavara jote jagaḷa mugiyalla, manassallē uḷiyutte.
    en: Because where there's love there's more hurt too, son. A quarrel with strangers is easy — you finish it and walk away. A quarrel with your own people never finishes; it stays inside you.
  - who: meena
    t: ಆದ್ರೆ ಇವತ್ತು ಒಂದು ಒಳ್ಳೇದೂ ಆಯ್ತು. ಹದಿನಾರು ವರ್ಷದಿಂದ ಯಾರೂ ಆಡದ ಮಾತುಗಳು ಹೊರಗೆ ಬಂದ್ವು. ಗಾಯ ತೆರೆದ್ರೇನೇ ಮದ್ದು ಹಚ್ಚೋಕಾಗೋದು.
    tr: Ādre ivattu ondu oḷḷēdū āytu. Hadināru varṣadinda yārū āḍada mātugaḷu horage bandvu. Gāya teredrēnē maddu haccōkāgōdu.
    en: But one good thing happened tonight too. Words nobody had spoken for sixteen years came out. Only when a wound is opened can you put medicine on it.
  - who: shobha
    t: ಅಣ್ಣ, ಇವತ್ತು ನೀನು ಹೇಳಿದ ಆ ಮಾತು… ಹದಿನಾರು ವರ್ಷದ ಹಿಂದಿನದು. ಅದು ನನಗೆ ಯಾವ ಪಾಲಿಗಿಂತಲೂ ದೊಡ್ಡದು.
    tr: Aṇṇa, ivattu nīnu hēḷida ā mātu… hadināru varṣada hindinadu. Adu nanage yāva pāligintalū doḍḍadu.
    en: Anna, what you said tonight… about sixteen years ago. That means more to me than any share.
  - who: suresh
    t: ಅದನ್ನ ಎಷ್ಟೋ ಮುಂಚೆ ಹೇಳ್ಬೇಕಿತ್ತು. … ಮುಂದೇನು ಮಾಡ್ತೀಯ, ಶೋಭಾ?
    tr: Adanna eṣṭō mun̄ce hēḷbēkittu. … Mundēnu māḍtīya, Śōbhā?
    en: I should have said it long ago. … What will you do next, Shobha?
  - who: shobha
    t: ಒಂದು ತಿಂಗಳು ಕಾಯ್ತೀನಿ. ಮಹದೇವ ತಾನಾಗೇ ಒಂದು ಹೆಜ್ಜೆ ಮುಂದೆ ಬಂದ್ರೆ ನಾನು ಎರಡು ಹೆಜ್ಜೆ ಬರ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ… ಮೈಸೂರಲ್ಲಿ ನನ್ನ ಸಹೋದ್ಯೋಗಿಯ ಅಣ್ಣ ವಕೀಲರು. ಅವರು ಮದ್ದೂರಿನ ಒಬ್ಬ ವಕೀಲರ ಹೆಸರು ಹೇಳಿದಾರೆ.
    tr: Ondu tiṅgaḷu kāytīni. Mahadēva tānāgē ondu hejje munde bandre nānu eraḍu hejje bartīni. Illāndre… Maisūralli nanna sahōdyōgiya aṇṇa vakīlaru. Avaru Maddūrina obba vakīlara hesaru hēḷidāre.
    en: I'll wait one month. If Mahadeva takes one step forward on his own, I'll take two. If not… a colleague of mine in Mysuru has a brother who's a lawyer. He's given me the name of a lawyer in Maddur.
  - who: avva
    t: ವಕೀಲ… ಅಯ್ಯೋ ದೇವ್ರೇ. ಯಜಮಾನ್ರೇ, ಮೇಲಿಂದ ನೋಡ್ತಾ ಇದೀರಾ?
    tr: Vakīla… ayyō dēvrē. Yajamānrē, mēlinda nōḍtā idīrā?
    en: (behind them, catching the last words) A lawyer… oh God. Are you watching this from up there, my husband?
  - chapter: Chapter 5 — The broker
  - section: The white car
    learn: 'a broker''s pitch: pārṭi, rēṭ, ekarege, oṭṭu, muṅgaḍa, oppanda · conversion: bhū parivartane, kṛṣiyētara upayōga, ādaṅgē · who may buy since 2020: sekṣan-gaḷannē tegeduhāktu, hiḍuvaḷi miti, darakhāstu jamīnu · refusing a cash deal: mārgasūci bele, kappu haṇa, ellrū māḍtāre anda takṣaṇa sari āgalla · polite dismissal: ā kāgada oḷage iṭkō'
  - scene: Saturday, 21 March 2026, two days after Ugadi — a quiet one, since the house is still in its year of mourning. Late morning. Suresh, Meena and Rakshith have come to spend the weekend with Avva; Mahadeva has gone to the canal to water the cane. A white SUV stops at the gate. A man in his forties in a crisp shirt, with two phones and a gold chain, gets out carrying a bag of fruit.
  - who: broker
    t: ನಮಸ್ಕಾರ ಸಾರ್, ನಮಸ್ಕಾರ ಅಮ್ಮಾವ್ರೇ. ನಾನು ಮಂಜುನಾಥ್, ಮದ್ದೂರು — ‘ಶ್ರೀ ಲಕ್ಷ್ಮಿ ಲ್ಯಾಂಡ್ ಡೆವಲಪರ್ಸ್’. ಗೌಡ್ರು ತೀರಿಕೊಂಡ್ರು ಅಂತ ಕೇಳಿ ತುಂಬಾ ಬೇಜಾರಾಯ್ತು. ದುಃಖದ ಮನೆಗೆ ಸಿಹಿ ತರಬಾರದು ಅಂತ ಸ್ವಲ್ಪ ಹಣ್ಣು ತಂದಿದೀನಿ.
    tr: Namaskāra sār, namaskāra ammāvrē. Nānu Man̄junāth, Maddūru — ‘Śrī Lakṣmi Lyāṇḍ Ḍevalapars’. Gauḍru tīrikoṇḍru anta kēḷi tumbā bējārāytu. Duḥkhada manege sihi tarabāradu anta svalpa haṇṇu tandidīni.
    en: Namaskara, sir; namaskara, Amma. I'm Manjunath, from Maddur — 'Sri Lakshmi Land Developers'. I was very sorry to hear Gowdru had passed away. You shouldn't bring sweets to a house in mourning, so I've brought a little fruit.
  - who: suresh
    t: ನಮಸ್ಕಾರ. ಕೂತ್ಕೊಳ್ಳಿ. ಏನು ವಿಷಯ ಅಂತ ಗೊತ್ತಾಗ್ಲಿಲ್ಲ.
    tr: Namaskāra. Kūtkoḷḷi. Ēnu viṣaya anta gottāglilla.
    en: Namaskara. Please sit. I'm not sure what this is about.
  - who: broker
    t: ನೇರವಾಗೇ ಹೇಳ್ತೀನಿ ಸಾರ್, ನಿಮ್ಮ ಟೈಮ್ ವೇಸ್ಟ್ ಮಾಡಲ್ಲ. ನವೆಂಬರ್‌ನಲ್ಲಿ ಗೌಡ್ರನ್ನ ಒಂದ್ಸಲ ಭೇಟಿ ಮಾಡಿದ್ದೆ. ಅವರು ‘ನಾನು ಬದುಕಿರೋ ತನಕ ಮಾರಲ್ಲ’ ಅಂದ್ರು. ಅವರ ಮಾತಿಗೆ ಗೌರವ ಕೊಟ್ಟು ವಾಪಸ್ ಹೋದೆ. ಈಗ ಪರಿಸ್ಥಿತಿ ಬೇರೆ. ಜಮೀನು ನಾಲ್ಕು ಜನ ವಾರಸುದಾರರ ಹೆಸರಿಗೆ ಬಂದಿದೆ ಅಂತ ಕೇಳ್ದೆ.
    tr: Nēravāgē hēḷtīni sār, nimma ṭaim vēsṭ māḍalla. Navembar-nalli Gauḍranna ondsala bhēṭi māḍidde. Avaru ‘nānu badukirō tanaka māralla’ andru. Avara mātige gaurava koṭṭu vāpas hōde. Īga paristhiti bēre. Jamīnu nālku jana vārasudārara hesarige bandide anta kēḷde.
    en: I'll come straight to the point, sir; I won't waste your time. In November I met Gowdru once. He said, 'As long as I'm alive, I won't sell.' I respected his word and went back. Now the situation is different. I heard the land has come into the names of four heirs.
  - who: meena
    t: ಊರಲ್ಲಿ ಸುದ್ದಿ ಬೇಗ ಓಡಾಡುತ್ತೆ.
    tr: Ūralli suddi bēga ōḍāḍutte.
    en: News travels fast in a village.
  - who: broker
    t: ನಮ್ಮ ಕೆಲಸವೇ ಅದು ಮೇಡಂ — ಸುದ್ದಿ ಮೊದ್ಲು ಕೇಳೋದು. ನೋಡಿ ಸಾರ್, ನಿಮ್ಮ ಗದ್ದೆ ಎಕ್ಸ್‌ಪ್ರೆಸ್‌ವೇ ಸರ್ವಿಸ್ ರೋಡಿಂದ ಬರೀ ಒಂದೂವರೆ ಕಿಲೋಮೀಟರ್. ನನ್ನ ಪಾರ್ಟಿ ಬೆಂಗಳೂರಿನ ಒಂದು ಕಂಪನಿ — ‘ಫಾರ್ಮ್ ಪ್ಲಾಟ್’ ಮಾಡ್ತಾರೆ. ಐಟಿ ಜನ ವೀಕೆಂಡ್‌ಗೆ ಬಂದು ತೆಂಗು, ಮಾವು ಬೆಳೆಸ್ತಾರೆ, ಸಣ್ಣ ಫಾರ್ಮ್‌ಹೌಸ್ ಕಟ್ಕೋತಾರೆ.
    tr: Namma kelasavē adu mēḍam — suddi modlu kēḷōdu. Nōḍi sār, nimma gadde eksprēs-vē sarvis rōḍinda barī ondūvare kilōmīṭar. Nanna pārṭi Beṅgaḷūrina ondu kampani — ‘phārm plāṭ’ māḍtāre. Aiṭi jana vīkeṇḍ-ge bandu teṅgu, māvu beḷestāre, saṇṇa phārm-haus kaṭkōtāre.
    en: 'That''s our job, madam — hearing the news first. Look, sir: your wet land is just a kilometre and a half from the expressway service road. My party is a Bengaluru company — they do ''farm plots''. IT people come at weekends, grow coconut and mango, and build themselves a small farmhouse.'
  - who: suresh
    t: ರೇಟ್ ಎಷ್ಟು ಅಂತ ಹೇಳ್ತಿದಾರೆ?
    tr: Rēṭ eṣṭu anta hēḷtidāre?
    en: What rate are they talking about?
  - who: broker
    t: ಗದ್ದೆಗೆ ಎಕರೆಗೆ ಐವತ್ತೈದು ಲಕ್ಷ. ಒಣ ಹೊಲಕ್ಕೆ ಎಕರೆಗೆ ನಲವತ್ತು. ಒಟ್ಟು ಎರಡು ಕೋಟಿ ತೊಂಬತ್ತೆರಡೂವರೆ ಲಕ್ಷ ಸಾರ್. ಮದ್ದೂರು ತಾಲೂಕಿನ ಒಳಗಿನ ಹಳ್ಳಿಗಳಲ್ಲಿ ಇದು ತುಂಬಾ ಒಳ್ಳೆ ರೇಟ್. ಬೇಕಾದ್ರೆ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ನೋಡಿ — ನಲವತ್ತರಿಂದ ಎಪ್ಪತ್ತೈದು ಲಕ್ಷದ ತನಕ ಕೇಳ್ತಾರೆ, ಕೊಡೋರು ಕಡಿಮೆ.
    tr: Gaddege ekarege aivattaidu lakṣa. Oṇa holakke ekarege nalavattu. Oṭṭu eraḍu kōṭi tombatteraḍūvare lakṣa sār. Maddūru tālūkina oḷagina haḷḷigaḷalli idu tumbā oḷḷe rēṭ. Bēkādre ānlain-nalli nōḍi — nalavattarinda eppattaidu lakṣada tanaka kēḷtāre, koḍōru kaḍime.
    en: For the wet land, fifty-five lakh an acre. For the dry field, forty an acre. Altogether two crore ninety-two and a half lakh, sir. For interior villages in Maddur taluk that's a very good rate. Look online if you like — people ask anywhere from forty to seventy-five lakh, but few actually pay it.
  - who: rakshith
    t: ಎರಡು ಕೋಟಿ ತೊಂಬತ್ತು…! ಅಪ್ಪ!
    tr: Eraḍu kōṭi tombattu…! Appa!
    en: Two crore ninety…! Appa!
  - who: meena
    t: ಆ ಕಂಪನಿಯ ಹೆಸರೇನು? ಅವರ ದಾಖಲೆಗಳನ್ನ ನೋಡಬಹುದಾ?
    tr: Ā kampaniya hesarēnu? Avara dākhalegaḷanna nōḍabahudā?
    en: What's the company's name? Can we see their documents?
  - who: broker
    t: ಒಪ್ಪಂದದ ದಿನ ಎಲ್ಲಾ ತೋರಿಸ್ತೀನಿ ಮೇಡಂ. ಈಗ ಪಾರ್ಟಿ ಹೆಸರು ಹೇಳೋ ಹಾಗಿಲ್ಲ — ಬಿಸಿನೆಸ್ ಸೀಕ್ರೆಟ್. … ಇನ್ನೂ ಕೇಳಿ, ತಮ್ಮ. ಭೂ ಪರಿವರ್ತನೆ ಆದ್ರೆ — ಅಂದ್ರೆ ಕೃಷಿ ಜಮೀನನ್ನ ಕೃಷಿಯೇತರ ಉಪಯೋಗಕ್ಕೆ ಡಿಸಿ ಕನ್ವರ್ಷನ್ ಮಾಡಿಸಿದ್ರೆ — ಎಕರೆಗೆ ಒಂದು ಕೋಟಿ ಇಪ್ಪತ್ತು ಲಕ್ಷದವರೆಗೂ ಹೋಗುತ್ತೆ. ಈಗ ಕನ್ವರ್ಷನ್ ಸುಲಭ. ಕಾನೂನು ಬದಲಾಗಿದೆ — ಡಿಸಿ ಮೂವತ್ತು ದಿನದೊಳಗೆ ತೀರ್ಮಾನ ಮಾಡ್ದಿದ್ರೆ ಆದಂಗೇ ಅಂತ.
    tr: Oppandada dina ellā tōristīni mēḍam. Īga pārṭi hesaru hēḷō hāgilla — bisines sīkreṭ. … Innū kēḷi, tamma. Bhū parivartane ādre — andre kṛṣi jamīnanna kṛṣiyētara upayōgakke Ḍi-si kanvarṣan māḍisidre — ekarege ondu kōṭi ippattu lakṣadavaregū hōgutte. Īga kanvarṣan sulabha. Kānūnu badalāgide — Ḍi-si mūvattu dinadoḷage tīrmāna māḍdidre ādaṅgē anta.
    en: 'I''ll show you everything on the day of the agreement, madam. I can''t give the party''s name just now — business secret. … And hear this, young man. With land conversion — that is, if you get the farmland converted by the DC for non-agricultural use — it goes up to one crore twenty lakh an acre. Conversion''s easy now. The law has changed: if the DC doesn''t decide within thirty days, it''s as good as done.'
  - who: suresh
    t: ‘ಆದಂಗೇ’ ಅಂದ್ರೆ? ನಾನು ಬ್ಯಾಂಕಲ್ಲಿ ಇಂಥ ಫೈಲ್ ನೋಡಿದೀನಿ, ಮಂಜುನಾಥ್. ಶುಲ್ಕ ಕಟ್ಟಿ ಪ್ರಮಾಣ ಪತ್ರ ಕೊಡ್ಬೇಕು, ಮಾಸ್ಟರ್ ಪ್ಲಾನ್‌ನಲ್ಲಿ ಆ ಜಾಗ ಯಾವ ವಲಯದಲ್ಲಿದೆ ಅನ್ನೋದು ಹೊಂದಬೇಕು. ಹೊಸ ನಿಯಮಗಳು ಇನ್ನೂ ಬದಲಾಗ್ತಾನೇ ಇವೆ. ಅಷ್ಟು ಸುಲಭ ಅಲ್ಲ.
    tr: ‘Ādaṅgē’ andre? Nānu byāṅkalli intha phail nōḍidīni, Man̄junāth. Śulka kaṭṭi pramāṇa patra koḍbēku, māsṭar plān-nalli ā jāga yāva valayadallide annōdu hondabēku. Hosa niyamagaḷu innū badalāgtānē ive. Aṣṭu sulabha alla.
    en: What do you mean, 'as good as done'? I've seen files like this at the bank, Manjunath. You have to pay the fee and give an affidavit, and the zone the land falls in on the master plan has to match. The new rules are still changing. It's not that simple.
  - who: broker
    t: ಬ್ಯಾಂಕ್ ಸಾರ್ ಅಂದ್ರೆ ಬ್ಯಾಂಕ್ ಸಾರೇ! ಸರಿ ಸಾರ್, ಅದೆಲ್ಲಾ ನಮ್ ಪಾರ್ಟಿ ನೋಡ್ಕೋತಾರೆ. ನಿಮಗೆ ಯಾವ ತಲೆನೋವೂ ಇಲ್ಲ.
    tr: Byāṅk sār andre byāṅk sārē! Sari sār, adellā nam pārṭi nōḍkōtāre. Nimage yāva talenōvū illa.
    en: (laughing) A bank man is a bank man! All right, sir — my party will take care of all that. No headache at all for you.
  - who: rakshith
    t: ಆದ್ರೆ ಅಂಕಲ್, ಬೆಂಗಳೂರಿನ ಐಟಿ ಜನ ಕೃಷಿ ಜಮೀನು ಕೊಳ್ಳಬಹುದಾ? ರೈತರು ಮಾತ್ರ ಕೊಳ್ಳಬೇಕು ಅಂತ ನಿಯಮ ಇರಲಿಲ್ವಾ?
    tr: Ādre aṅkal, Beṅgaḷūrina aiṭi jana kṛṣi jamīnu koḷḷabahudā? Raitaru mātra koḷḷabēku anta niyama iralilvā?
    en: But uncle, can IT people from Bengaluru buy farmland? Wasn't there a rule that only farmers could buy it?
  - who: broker
    t: ಇತ್ತು, ತಮ್ಮ — ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತರ ತನಕ. ಭೂ ಸುಧಾರಣಾ ಕಾಯ್ದೆಯಲ್ಲಿ ಕೃಷಿಯೇತರ ಆದಾಯ ಜಾಸ್ತಿ ಇರೋರು, ಕಂಪನಿಗಳು ಕೊಳ್ಳಬಾರದು ಅಂತ ಸೆಕ್ಷನ್‌ಗಳಿದ್ವು. ಇಪ್ಪತ್ತರಲ್ಲಿ ಸರ್ಕಾರ ಆ ಸೆಕ್ಷನ್‌ಗಳನ್ನೇ ತೆಗೆದುಹಾಕ್ತು. ಈಗ ಯಾರು ಬೇಕಾದ್ರೂ ಕೊಳ್ಳಬಹುದು. ಅದಕ್ಕೇ ನಮ್ ಬಿಸಿನೆಸ್ ಚೆನ್ನಾಗಿ ನಡೀತಿದೆ.
    tr: Ittu, tamma — eraḍu sāvirada ippattara tanaka. Bhū sudhāraṇā kāydeyalli kṛṣiyētara ādāya jāsti irōru, kampanigaḷu koḷḷabāradu anta sekṣan-gaḷidvu. Ippattaralli sarkāra ā sekṣan-gaḷannē tegeduhāktu. Īga yāru bēkādrū koḷḷabahudu. Adakkē nam bisines cennāgi naḍītide.
    en: There was, young man — until 2020. The Land Reforms Act had sections saying that people with big non-farm incomes, and companies, couldn't buy. In 2020 the government removed those sections altogether. Now anyone can buy. That's why our business is doing so well.
  - who: suresh
    t: ಯಾರು ಬೇಕಾದ್ರೂ ಅಲ್ಲ. ಹಿಡುವಳಿ ಮಿತಿ ಇನ್ನೂ ಇದೆ. ಸರ್ಕಾರ ಮಂಜೂರು ಮಾಡಿದ ದರಖಾಸ್ತು ಜಮೀನಿಗೆ ಅನುಮತಿ ಬೇಕು. ವಿದೇಶದಲ್ಲಿರೋ ಎನ್‌ಆರ್‌ಐಗಳು ಕೃಷಿ ಜಮೀನು ಕೊಳ್ಳೋ ಹಾಗಿಲ್ಲ — ಪಿತ್ರಾರ್ಜಿತವಾಗಿ ಬಂದ್ರೆ ಮಾತ್ರ ಇಟ್ಕೋಬಹುದು.
    tr: Yāru bēkādrū alla. Hiḍuvaḷi miti innū ide. Sarkāra man̄jūru māḍida darakhāstu jamīnige anumati bēku. Vidēśadallirō en-ār-aigaḷu kṛṣi jamīnu koḷḷō hāgilla — pitrārjitavāgi bandre mātra iṭkōbahudu.
    en: Not anyone. The landholding ceiling still applies. Land granted by the government needs permission. And NRIs living abroad can't buy farmland — they can only keep it if it comes to them by inheritance.
  - who: broker
    t: ಸರಿ ಸರಿ, ಸಾರ್ ಎಲ್ಲಾ ಓದ್ಕೊಂಡಿದಾರೆ. ಇನ್ನೊಂದು ಮಾತು ಸಾರ್ — ಸ್ವಲ್ಪ ಪ್ರೈವೇಟ್ ಆಗಿ. ರಿಜಿಸ್ಟ್ರೇಷನ್ ಮಾರ್ಗಸೂಚಿ ಬೆಲೆಗೆ ಮಾಡೋಣ, ಉಳಿದಿದ್ದು ಕ್ಯಾಶ್‌ನಲ್ಲಿ. ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ ಉಳಿಯುತ್ತೆ, ತೆರಿಗೆ ಉಳಿಯುತ್ತೆ. ಎಲ್ರೂ ಮಾಡೋದೇ.
    tr: Sari sari, sār ellā ōdkoṇḍidāre. Innondu mātu sār — svalpa praivēṭ āgi. Rijisṭrēṣan mārgasūci belege māḍōṇa, uḷididdu kyāś-nalli. Sṭyāmp ḍyūṭi uḷiyutte, terige uḷiyutte. Ellrū māḍōdē.
    en: All right, all right, sir has read up on everything. One more thing, sir — a bit privately. We do the registration at the guidance value and the rest in cash. You save stamp duty, you save tax. Everybody does it.
  - who: rakshith
    t: ಮಾರ್ಗಸೂಚಿ ಬೆಲೆ ಅಂದ್ರೆ?
    tr: Mārgasūci bele andre?
    en: What's 'guidance value'?
  - who: meena
    t: ಸರ್ಕಾರ ನಿಗದಿ ಮಾಡಿರೋ ಬೆಲೆ. ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ ಅದರ ಮೇಲೆ ಲೆಕ್ಕ ಆಗುತ್ತೆ. ಹಳ್ಳಿಗಳಲ್ಲಿ ಅದು ಮಾರುಕಟ್ಟೆ ಬೆಲೆಗಿಂತ ತುಂಬಾ ಕಡಿಮೆ. ಆ ವ್ಯತ್ಯಾಸ ಕ್ಯಾಶ್‌ನಲ್ಲಿ ಕೈ ಬದಲಾಯಿಸಿದ್ರೆ ಅದೇ ಕಪ್ಪು ಹಣ.
    tr: Sarkāra nigadi māḍirō bele. Sṭyāmp ḍyūṭi adara mēle lekka āgutte. Haḷḷigaḷalli adu mārukaṭṭe beleginta tumbā kaḍime. Ā vyatyāsa kyāś-nalli kai badalāyisidre adē kappu haṇa.
    en: The price fixed by the government. Stamp duty is calculated on it. In villages it's far below the market price. If that difference changes hands in cash, that's exactly what black money is.
  - who: suresh
    t: ಎಲ್ರೂ ಮಾಡ್ತಾರೆ ಅಂದ ತಕ್ಷಣ ಅದು ಸರಿ ಆಗಲ್ಲ. ಇಪ್ಪತ್ತು ವರ್ಷ ಬ್ಯಾಂಕಲ್ಲಿ ಇಂಥದೇ ಕಪ್ಪು ಹಣದ ಕೇಸುಗಳನ್ನ ನೋಡಿದೀನಿ. ಮಾರೋದಾದ್ರೆ — ‘ಆದ್ರೆ’ ಅಂತ ಹೇಳ್ತಿದೀನಿ — ಪೂರ್ತಿ ಬೆಲೆ ಕಾಗದದ ಮೇಲೆ, ಪೂರ್ತಿ ಹಣ ಬ್ಯಾಂಕ್ ಮೂಲಕ.
    tr: Ellrū māḍtāre anda takṣaṇa adu sari āgalla. Ippattu varṣa byāṅkalli inthadē kappu haṇada kēsugaḷanna nōḍidīni. Mārōdādre — ‘ādre’ anta hēḷtidīni — pūrti bele kāgadada mēle, pūrti haṇa byāṅk mūlaka.
    en: Just because everybody does it doesn't make it right. For twenty years at the bank I've seen exactly these black-money cases. If we sell — and I'm saying 'if' — it's the full price on paper and the full amount through the bank.
  - who: broker
    t: ಸರಿ ಸಾರ್, ನಿಮ್ಮಿಷ್ಟ. ಪಾರ್ಟಿ ಅದಕ್ಕೂ ರೆಡಿ, ರೇಟ್ ಸ್ವಲ್ಪ ಕಡಿಮೆ ಆಗಬಹುದು ಅಷ್ಟೇ. ಇವತ್ತು ಎಲ್ಲಾ ವಾರಸುದಾರರು ಒಪ್ಪಂದಕ್ಕೆ ಸಹಿ ಹಾಕಿದ್ರೆ ಐದು ಲಕ್ಷ ಮುಂಗಡ ಸ್ಥಳದಲ್ಲೇ ಕೊಡ್ತೀನಿ.
    tr: Sari sār, nimmiṣṭa. Pārṭi adakkū reḍi, rēṭ svalpa kaḍime āgabahudu aṣṭē. Ivattu ellā vārasudāraru oppandakke sahi hākidre aidu lakṣa muṅgaḍa sthaḷadallē koḍtīni.
    en: Fine, sir, as you wish. The party's ready for that too — the rate may come down a little, that's all. If all the heirs sign an agreement today, I'll pay five lakh advance right here on the spot.
  - who: meena
    t: ಎಲ್ಲಾ ವಾರಸುದಾರರು ಅಂದ್ರೆ ನಾಲ್ಕು ಜನ. ಮಹದೇವ ಇಲ್ಲಿಲ್ಲ, ಶೋಭಾ ಮೈಸೂರಲ್ಲಿದಾರೆ. ಮತ್ತೆ ಅವ್ವ…
    tr: Ellā vārasudāraru andre nālku jana. Mahadēva illilla, Śōbhā Maisūrallidāre. Matte avva…
    en: All the heirs means four people. Mahadeva isn't here, Shobha is in Mysuru. And then there's Avva…
  - who: broker
    t: ಮೈಸೂರಿನೋರ ಕಡೆಯಿಂದ ಸಮಸ್ಯೆ ಇಲ್ಲ ಅನ್ಸುತ್ತೆ ಮೇಡಂ. ಮೊನ್ನೆ ಅವರ ಯಜಮಾನ್ರು ನನಗೆ ಫೋನ್ ಮಾಡಿ ರೇಟ್ ಎಷ್ಟು ಅಂತ ಕೇಳಿದ್ರು.
    tr: Maisūrinōra kaḍeyinda samasye illa ansutte mēḍam. Monne avara yajamānru nanage phōn māḍi rēṭ eṣṭu anta kēḷidru.
    en: I don't think there'll be a problem from the Mysuru side, madam. The other day her husband phoned me and asked what the rate was.
  - who: suresh
    t: ಶೋಭಾಳ ಗಂಡ? ನಿಮಗೆ ಫೋನ್ ಮಾಡಿದ್ರಾ?
    tr: Śōbhāḷa gaṇḍa? Nimage phōn māḍidrā?
    en: Shobha's husband? He phoned you?
  - who: broker
    t: ಬರೀ ರೇಟ್ ಕೇಳಿದ್ರು ಸಾರ್, ಏನೂ ಮಾತು ಕೊಟ್ಟಿಲ್ಲ. ಈಗಿನ ಕಾಲದಲ್ಲಿ ಎಲ್ರೂ ರೇಟ್ ಕೇಳ್ತಾರೆ.
    tr: Barī rēṭ kēḷidru sār, ēnū mātu koṭṭilla. Īgina kāladalli ellrū rēṭ kēḷtāre.
    en: He only asked the rate, sir; he didn't promise anything. Everyone asks the rate these days.
  - who: avva
    t: ಮಂಜುನಾಥ, ಕಣಪ್ಪ. ನವೆಂಬರ್‌ನಲ್ಲಿ ನೀನು ಬಂದಾಗ ನಾನೇ ನಿಂಗೆ ಕಾಫಿ ಕೊಟ್ಟಿದ್ದೆ. ನನ್ ಯಜಮಾನ್ರು ಏನಂದ್ರು ನೆನಪಿದೆಯಾ?
    tr: Man̄junātha, kaṇappa. Navembar-nalli nīnu bandāga nānē niṅge kāphi koṭṭidde. Nan yajamānru ēnandru nenapideyā?
    en: (from the doorway, where she has been listening) Manjunatha, son. When you came in November, it was I who gave you coffee. Do you remember what my husband said?
  - who: broker
    t: ನೆನಪಿದೆ ಅಮ್ಮಾವ್ರೇ. ‘ಈ ಮಣ್ಣು ನನ್ನ ಅಪ್ಪನ ಬೆವರು’ ಅಂದ್ರು.
    tr: Nenapide ammāvrē. ‘Ī maṇṇu nanna appana bevaru’ andru.
    en: I remember, Amma. He said, 'This soil is my father's sweat.'
  - who: avva
    t: ಹಂಗಾದ್ರೆ ಅದೇ ಮಾತು ಇವತ್ತೂ ಈ ಮನೆಯ ಮಾತು. ಹಣ್ಣು ತಂದಿದೀಯ, ತಗಂಡು ಹೋಗು ಅನ್ನಲ್ಲ. ಆದ್ರೆ ಆ ಕಾಗದ ಒಳಗೆ ಇಟ್ಕೋ.
    tr: Haṅgādre adē mātu ivattū ī maneya mātu. Haṇṇu tandidīya, tagaṇḍu hōgu annalla. Ādre ā kāgada oḷage iṭkō.
    en: Then those same words are this house's words today too. You've brought fruit; I won't tell you to take it back. But put that paper away.
  - who: broker
    t: 'ಸರಿ ಅಮ್ಮಾವ್ರೇ. ಸಾರ್, ನನ್ ಕಾರ್ಡ್ ಇಟ್ಕೊಳ್ಳಿ. ಒಂದೇ ಮಾತು: ಇಂಥ ರೇಟ್ ಯಾವಾಗ್ಲೂ ಇರಲ್ಲ. ಮತ್ತೆ ಜಮೀನಿನ ಮೇಲೆ ಕೋರ್ಟ್ ಕೇಸ್ ಏನಾದ್ರೂ ಬಿದ್ರೆ ಯಾವ ಪಾರ್ಟಿನೂ ಮುಟ್ಟಲ್ಲ. ವಿವಾದದ ಜಮೀನು ಅಂದ್ರೆ ಬೆಲೆ ಅರ್ಧ. ಯೋಚನೆ ಮಾಡಿ.'
    tr: 'Sari ammāvrē. Sār, nan kārḍ iṭkoḷḷi. Ondē mātu: intha rēṭ yāvāglū iralla. Matte jamīnina mēle kōrṭ kēs ēnādrū bidre yāva pārṭinū muṭṭalla. Vivādada jamīnu andre bele ardha. Yōcane māḍi.'
    en: '(standing up) All right, Amma. Sir, keep my card. Just one thing: a rate like this won''t last for ever. And if a court case lands on the land, no party will touch it. Disputed land means half the price. Think it over.'
  - section: Meena's numbers
    learn: 'calculating aloud: -dante (at … each), oṭṭu, sumārāgi, śēkaḍa ēḷu baḍḍi, ṭhēvaṇi, varṣakke · conditionals: iṭre … barutte, uḷidre heccu · the numbers not on paper: baṇḍavāḷa lābhada terige, gurutu · confessing temptation: manassu allāḍtu · a teenager weighing both sides: eraḍū sari ansutte'
  - scene: That night, on the flat roof of the house. A mat, a steel tumbler of buttermilk each, a school notebook. Avva has gone to sleep. Meena writes figures by the light of her phone.
  - who: meena
    t: ಸರಿ, ಭಾವನೆ ಒಂದು ಕ್ಷಣ ಪಕ್ಕಕ್ಕಿಡೋಣ, ಲೆಕ್ಕ ನೋಡೋಣ. ಮೂರೂವರೆ ಎಕರೆ ಗದ್ದೆ, ಐವತ್ತೈದು ಲಕ್ಷದಂತೆ — ಒಂದು ಕೋಟಿ ತೊಂಬತ್ತೆರಡೂವರೆ ಲಕ್ಷ. ಎರಡೂವರೆ ಎಕರೆ ಹೊಲ, ನಲವತ್ತು ಲಕ್ಷದಂತೆ — ಒಂದು ಕೋಟಿ. ಒಟ್ಟು ಎರಡು ಕೋಟಿ ತೊಂಬತ್ತೆರಡೂವರೆ ಲಕ್ಷ.
    tr: Sari, bhāvane ondu kṣaṇa pakkakkiḍōṇa, lekka nōḍōṇa. Mūrūvare ekare gadde, aivattaidu lakṣadante — ondu kōṭi tombatteraḍūvare lakṣa. Eraḍūvare ekare hola, nalavattu lakṣadante — ondu kōṭi. Oṭṭu eraḍu kōṭi tombatteraḍūvare lakṣa.
    en: 'Right — let''s set feelings aside for a moment and look at the numbers. Three and a half acres of wet land at fifty-five lakh each — one crore ninety-two and a half lakh. Two and a half acres of dry field at forty lakh each — one crore. Total: two crore ninety-two and a half lakh.'
  - who: suresh
    t: ಬೇಜಾರಿನ ವಿಷಯ ಅಂದ್ರೆ, ಆ ಸಂಖ್ಯೆ ಕೇಳಿದಾಗ ನನಗೂ ಒಂದು ಕ್ಷಣ ಮನಸ್ಸು ಅಲ್ಲಾಡ್ತು, ಮೀನಾ. ಮನೆ ಸಾಲದ ಇಎಂಐ, ಮುಂದಿನ ವರ್ಷ ರಕ್ಷಿತ್‌ನ ಕಾಲೇಜು ಫೀಸು… ಎಲ್ಲಾ ಕಣ್ಣ ಮುಂದೆ ಬಂತು.
    tr: Bējārina viṣaya andre, ā saṅkhye kēḷidāga nanagū ondu kṣaṇa manassu allāḍtu, Mīnā. Mane sālada i-em-ai, mundina varṣa Rakṣit-na kālēju phīsu… ellā kaṇṇa munde bantu.
    en: The sad part is, when I heard that number my mind wavered for a moment too, Meena. The home-loan EMI, Rakshith's college fees next year… it all flashed before my eyes.
  - who: meena
    t: ಅದು ಸಹಜ. ಮುಂದೆ ಕೇಳಿ. ಸುಮಾರಾಗಿ ನಾಲ್ಕು ಸಮ ಪಾಲು ಮಾಡಿದ್ರೆ ಒಬ್ಬೊಬ್ಬರಿಗೆ ಎಪ್ಪತ್ಮೂರು ಲಕ್ಷ. ಅದನ್ನ ಶೇಕಡ ಏಳು ಬಡ್ಡಿಗೆ ಠೇವಣಿ ಇಟ್ರೆ ವರ್ಷಕ್ಕೆ ಐದು ಲಕ್ಷ ಬಡ್ಡಿ ಬರುತ್ತೆ — ತೆರಿಗೆಗೆ ಮುಂಚೆ.
    tr: Adu sahaja. Munde kēḷi. Sumārāgi nālku sama pālu māḍidre obbobbarige eppatmūru lakṣa. Adanna śēkaḍa ēḷu baḍḍige ṭhēvaṇi iṭre varṣakke aidu lakṣa baḍḍi barutte — terigege mun̄ce.
    en: That's natural. Listen to the rest. Roughly, with four equal shares, each gets seventy-three lakh. Put that in a fixed deposit at seven percent and it earns five lakh a year in interest — before tax.
  - who: meena
    t: ಈಗ ಜಮೀನಿನ ಆದಾಯ. ಮಹದೇವ ಹೇಳಿದ್ದು ನೆನಪಿದೆ — ಎಕರೆಗೆ ನಲವತ್ತು ಟನ್ ಕಬ್ಬು ಬಂದ್ರೆ ಒಳ್ಳೆ ವರ್ಷ. ಗೊಬ್ಬರ, ಕೂಲಿ, ಕಟಾವು, ಸಾಗಣೆ ಕಳೆದ್ರೆ ಆರು ಎಕರೆಯಿಂದ ಇಡೀ ಮನೆಗೆ ವರ್ಷಕ್ಕೆ ಎರಡು-ಎರಡೂವರೆ ಲಕ್ಷ ಉಳಿದ್ರೆ ಹೆಚ್ಚು. ಅದೂ ಕಾರ್ಖಾನೆ ಸಮಯಕ್ಕೆ ದುಡ್ಡು ಕೊಟ್ರೆ.
    tr: Īga jamīnina ādāya. Mahadēva hēḷiddu nenapide — ekarege nalavattu ṭan kabbu bandre oḷḷe varṣa. Gobbara, kūli, kaṭāvu, sāgaṇe kaḷedre āru ekareyinda iḍī manege varṣakke eraḍu-eraḍūvare lakṣa uḷidre heccu. Adū kārkhāne samayakke duḍḍu koṭre.
    en: Now the land's income. I remember what Mahadeva said — forty tonnes of cane an acre is a good year. After fertiliser, labour, harvesting and transport, if six acres leave the whole household two or two and a half lakh a year, that's a lot. And that's only if the factory pays on time.
  - who: rakshith
    t: ಅಂದ್ರೆ… ಮಾರಿದ್ರೆ ಒಬ್ಬರ ಪಾಲಿನ ಬಡ್ಡಿಯೇ ಇಡೀ ಜಮೀನಿನ ಆದಾಯಕ್ಕಿಂತ ಜಾಸ್ತಿ! ಚಿಕ್ಕಪ್ಪ ಇಷ್ಟು ಕಷ್ಟಪಡೋ ಅವಶ್ಯಕತೆನೇ ಇರಲ್ಲ.
    tr: Andre… māridre obbara pālina baḍḍiyē iḍī jamīnina ādāyakkinta jāsti! Cikkappa iṣṭu kaṣṭapaḍō avaśyakatenē iralla.
    en: So… if we sell, the interest on just one person's share is more than the income from the whole land! Chikkappa wouldn't need to slave like this at all.
  - who: meena
    t: 'ಕಾಗದದ ಮೇಲೆ ಹಾಗೆ ಕಾಣುತ್ತೆ. ಈಗ ಕಾಗದದಲ್ಲಿ ಇಲ್ಲದ ಸಂಖ್ಯೆಗಳು. ಒಂದು: ಕಳೆದ ಹತ್ತು ವರ್ಷದಲ್ಲಿ ಈ ಕಡೆ ಜಮೀನಿನ ಬೆಲೆ ಬಡ್ಡಿಗಿಂತ ವೇಗವಾಗಿ ಏರಿದೆ. ಎರಡು: ಮದ್ದೂರು ಪಟ್ಟಣದಿಂದ ಎಷ್ಟು ದೂರ ಅನ್ನೋದರ ಮೇಲೆ ಕೃಷಿ ಜಮೀನು ಮಾರಿದ್ರೂ ಬಂಡವಾಳ ಲಾಭದ ತೆರಿಗೆ ಬರಬಹುದು — ಅದನ್ನ ಆಡಿಟರ್ ಹತ್ರ ಕೇಳ್ಬೇಕು. ಮೂರು: ಹಣ ಕೈಗೆ ಬಂದ ಮೇಲೆ ಉಳಿಸೋದು ಕಷ್ಟ. ಸಂಬಂಧಿಕರು, ಸಾಲ ಕೇಳೋರು, ಹೊಸ ಕಾರು…'
    tr: 'Kāgadada mēle hāge kāṇutte. Īga kāgadadalli illada saṅkhyegaḷu. Ondu: kaḷeda hattu varṣadalli ī kaḍe jamīnina bele baḍḍiginta vēgavāgi ēride. Eraḍu: Maddūru paṭṭaṇadinda eṣṭu dūra annōdara mēle kṛṣi jamīnu māridrū baṇḍavāḷa lābhada terige barabahudu — adanna āḍiṭar hatra kēḷbēku. Mūru: haṇa kaige banda mēle uḷisōdu kaṣṭa. Sambandhikaru, sāla kēḷōru, hosa kāru…'
    en: 'On paper it looks that way. Now the numbers that aren''t on paper. One: over the last ten years, land prices round here have risen faster than interest. Two: depending on how far it is from Maddur town, even selling farmland may attract capital gains tax — we''d have to ask an auditor. Three: once money is in your hand, it''s hard to hold on to. Relatives, people asking for loans, a new car…'
  - who: meena
    t: 'ನಾಲ್ಕನೇದು, ಎಲ್ಲಕ್ಕಿಂತ ದೊಡ್ಡದು: ಮಹದೇವ. ನಲವತ್ತು ವರ್ಷದ ರೈತ. ಎಪ್ಪತ್ಮೂರು ಲಕ್ಷ ಕೈಗೆ ಬಂದ್ರೆ ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಎದ್ದು ಏನು ಮಾಡ್ತಾನೆ? ಅವನ ಕೆಲಸ, ಅವನ ಗುರುತು, ಅವನ ದನಗಳು — ಇದಕ್ಕೆಲ್ಲಾ ಬಡ್ಡಿ ದರ ಇಲ್ಲ.'
    tr: 'Nālkanēdu, ellakkinta doḍḍadu: Mahadēva. Nalavattu varṣada raita. Eppatmūru lakṣa kaige bandre nāḷe beḷigge aidakke eddu ēnu māḍtāne? Avana kelasa, avana gurutu, avana danagaḷu — idakkellā baḍḍi dara illa.'
    en: 'The fourth, and the biggest: Mahadeva. A forty-year-old farmer. If seventy-three lakh lands in his hands, what does he do when he gets up at five tomorrow morning? His work, his identity, his cattle — none of these has an interest rate.'
  - who: suresh
    t: ಮತ್ತೆ ಅವ್ವ. ಜಮೀನು ಹೋದ್ರೆ ಅವ್ವ ಎಲ್ಲಿರ್ತಾಳೆ? ನಮ್ಮ ಜೊತೆ ಬೆಂಗಳೂರಿಗಾ? ಅಪ್ಪ ಅಲ್ಲಿ ಹತ್ತು ದಿನಕ್ಕಿಂತ ಜಾಸ್ತಿ ಇರಲಿಲ್ಲ. ಅವ್ವ ನಮ್ಮ ಫ್ಲ್ಯಾಟ್‌ನಲ್ಲಿ ಒಂದು ವಾರಾನೂ ಇರಲ್ಲ — ದನ ಇಲ್ಲ, ಅಂಗಳ ಇಲ್ಲ, ಪಕ್ಕದ್ಮನೆಯವರ ಹೆಸರೇ ಗೊತ್ತಿಲ್ಲ.
    tr: Matte avva. Jamīnu hōdre avva ellirtāḷe? Namma jote Beṅgaḷūrigā? Appa alli hattu dinakkinta jāsti iralilla. Avva namma phlyāṭ-nalli ondu vārānū iralla — dana illa, aṅgaḷa illa, pakkadmaneyavara hesarē gottilla.
    en: And then Avva. If the land goes, where will Avva live? With us in Bengaluru? Appa didn't last more than ten days there. Avva won't last even a week in our flat — no cattle, no yard, and nobody knows the neighbours' names.
  - who: meena
    t: ಅದಕ್ಕೇ ಹೇಳಿದ್ದು — ಎಲ್ಲಾ ಸಂಖ್ಯೆಗಳೂ ಲೆಕ್ಕದ ಪುಸ್ತಕದಲ್ಲಿ ಬರಲ್ಲ.
    tr: Adakkē hēḷiddu — ellā saṅkhyegaḷū lekkada pustakadalli baralla.
    en: That's what I meant — not every number fits in the account book.
  - who: suresh
    t: ನೀನು ಪ್ರಿನ್ಸಿಪಾಲ್ ಆಗೋ ಬದಲು ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಆಗ್ಬೇಕಿತ್ತು.
    tr: Nīnu prinsipāl āgō badalu byāṅk myānējar āgbēkittu.
    en: You should have been a bank manager instead of a principal.
  - who: meena
    t: ಒಬ್ಬ ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಮನೇಲಿ ಸಾಕು. … ರಕ್ಷಿತ್, ನೀನೇನು ಯೋಚಿಸ್ತೀಯ? ನೀನೂ ಈ ಮನೆಯ ಮುಂದಿನ ತಲೆಮಾರು.
    tr: Obba byāṅk myānējar manēli sāku. … Rakṣit, nīnēnu yōcistīya? Nīnū ī maneya mundina talemāru.
    en: One bank manager in the house is enough. … Rakshith, what do you think? You're this family's next generation.
  - who: rakshith
    t: ನಿಜ ಹೇಳ್ಲಾ? ಮೊದಲು ಆ ಸಂಖ್ಯೆ ಕೇಳಿದಾಗ ತುಂಬಾ ಖುಷಿ ಆಯ್ತು. ಆಮೇಲೆ ತಾತನ ಹುಣಸೆ ಮರ ನೆನಪಾಯ್ತು. ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಅಲ್ಲಿ ಹಾಲು ಹಾಕಿದ್ವಿ. ಆ ಹೊಲ ಮಾರಿದ್ರೆ ತಾತನ ಸಮಾಧಿ ಯಾರದೋ ಫಾರ್ಮ್‌ಹೌಸ್ ತೋಟದಲ್ಲಿರುತ್ತೆ. ವಾರಾಂತ್ಯಕ್ಕೆ ಬರೋ ಜನ ಅದರ ಪಕ್ಕ ಬಾರ್ಬೆಕ್ಯೂ ಮಾಡ್ತಾರೆ.
    tr: Nija hēḷlā? Modalu ā saṅkhye kēḷidāga tumbā khuṣi āytu. Āmēle tātana huṇase mara nenapāytu. Ḍisembar-nalli alli hālu hākidvi. Ā hola māridre tātana samādhi yāradō phārm-haus tōṭadallirutte. Vārāntyakke barō jana adara pakka bārbekyū māḍtāre.
    en: Shall I tell you the truth? When I first heard that number I was really thrilled. Then I remembered Thatha's tamarind tree. In December we poured milk there. If that field is sold, Thatha's grave will be in somebody's farmhouse garden. Weekend people will have barbecues right next to it.
  - who: rakshith
    t: ತಾತ ನನಗೆ ದನಗಳ ಕೊಂಬಿಗೆ ಬಣ್ಣ ಹಚ್ಚೋದು ಕಲಿಸ್ತೀನಿ ಅಂದಿದ್ರು. ಚಿಕ್ಕಪ್ಪ ನೇಗಿಲು ಹಿಡಿಯೋದು ಕಲಿಸ್ತೀನಿ ಅಂದಿದಾರೆ. ಎಲ್ಲಾ ಮಾರಿಬಿಟ್ರೆ ನಾನು ಎಲ್ಲಿ ಕಲೀಲಿ? ನಾಳೆ ನನ್ನ ಮಕ್ಕಳಿಗೆ ‘ನಮ್ಮ ಮನೆತನ ಇಲ್ಲಿಂದ ಬಂತು’ ಅಂತ ಎಲ್ಲಿ ತೋರಿಸ್ಲಿ? ಆದ್ರೂ… ಚಿಕ್ಕಪ್ಪ ಇಷ್ಟು ಕಷ್ಟಪಡೋದು ನೋಡಿದ್ರೆ, ಗೊತ್ತಿಲ್ಲ ಅಪ್ಪ. ಎರಡೂ ಸರಿ ಅನ್ಸುತ್ತೆ.
    tr: Tāta nanage danagaḷa kombige baṇṇa haccōdu kalistīni andidru. Cikkappa nēgilu hiḍiyōdu kalistīni andidāre. Ellā māribiṭre nānu elli kalīli? Nāḷe nanna makkaḷige ‘namma manetana illinda bantu’ anta elli tōrisli? Ādrū… cikkappa iṣṭu kaṣṭapaḍōdu nōḍidre, gottilla appa. Eraḍū sari ansutte.
    en: Thatha said he'd teach me to paint the cattle's horns. Chikkappa has said he'll teach me to hold a plough. If we sell it all, where do I learn? One day, where do I show my own kids 'this is where our family came from'? But still… when I see how hard Chikkappa works — I don't know, Appa. Both seem right.
  - who: suresh
    t: ‘ಎರಡೂ ಸರಿ ಅನ್ಸುತ್ತೆ’ — ಇದೇ ಕಣೋ ದೊಡ್ಡೋರಾಗೋದ್ರ ಕಷ್ಟ. ಸರಿ-ತಪ್ಪಿನ ಮಧ್ಯೆ ಆಯ್ಕೆ ಸುಲಭ. ಎರಡು ಸರಿಗಳ ಮಧ್ಯೆ ಆಯ್ಕೆ ಮಾಡೋದೇ ಕಷ್ಟ.
    tr: ‘Eraḍū sari ansutte’ — idē kaṇō doḍḍōrāgōdra kaṣṭa. Sari-tappina madhye āyke sulabha. Eraḍu sarigaḷa madhye āyke māḍōdē kaṣṭa.
    en: '''Both seem right'' — that''s exactly what''s hard about growing up, son. Choosing between right and wrong is easy. Choosing between two rights is the hard part.'
  - who: meena
    t: ಇನ್ನೊಂದು ವಿಷಯ. ಶೋಭಾಳ ಗಂಡ ಮಂಜುನಾಥ್‌ಗೆ ಫೋನ್ ಮಾಡಿದ್ದು. ಇದು ಬೇರೆ ಯಾರಿಂದಲಾದ್ರೂ ಮಹದೇವನ ಕಿವಿಗೆ ಬೀಳೋ ಮುಂಚೆ ನೀವೇ ಹೇಳೋದು ಒಳ್ಳೇದು.
    tr: Innondu viṣaya. Śōbhāḷa gaṇḍa Man̄junāth-ge phōn māḍiddu. Idu bēre yārindalādrū Mahadēvana kivige bīḷō mun̄ce nīvē hēḷōdu oḷḷēdu.
    en: One more thing. Shobha's husband phoning Manjunath. Better you tell Mahadeva yourself before it reaches his ears from someone else.
  - who: suresh
    t: ಬೆಳಿಗ್ಗೆ ಗದ್ದೆಗೆ ಹೋಗಿ ಹೇಳ್ತೀನಿ. … ಅಷ್ಟರಲ್ಲಿ ಊರೇ ಅವನಿಗೆ ಹೇಳಿರದಿದ್ರೆ.
    tr: Beḷigge gaddege hōgi hēḷtīni. … Aṣṭaralli ūrē avanige hēḷiradidre.
    en: I'll go to the field in the morning and tell him. … If the village hasn't told him by then.
  - section: Mahadeva's anger
    learn: 'accusation: kūrisidrallā nīvu!, ‘illa’ antānū annalilla, alvā? · honest admission: suḷḷu hēḷalla, nānū manuṣya · land as mother: mūru talemārina bevaru, bhūmi tāyi · a phone quarrel: āṇe māḍi hēḷtīni, nanna paravāgi vakīlaru mātāḍtāre · defiance: nan mēle uḷume māḍbēku · a mother''s image: kāḷanna sippeyinda bēre māḍōdu sulabha'
  - scene: Sunday morning, 22 March. The cane field by the canal. Mahadeva is opening a channel with a spade; water gurgles into the furrows. Suresh walks along the bund towards him. Mahadeva doesn't look up.
  - who: mahadeva
    t: ನಿನ್ನೆ ನಮ್ಮನೆ ಮುಂದೆ ಬಿಳಿ ಕಾರು ನಿಂತಿತ್ತಂತೆ. ಡೈರಿಗೆ ಹಾಲು ಹಾಕೋಕೆ ಹೋದಾಗ ಊರಿಗೆಲ್ಲಾ ಗೊತ್ತಿತ್ತು. ನನಗೆ ಮಾತ್ರ ಕೊನೆಗೆ.
    tr: Ninne nammane munde biḷi kāru nintittante. Ḍairige hālu hākōke hōdāga ūrigellā gottittu. Nanage mātra konege.
    en: Apparently a white car was parked outside our house yesterday. When I went to pour the milk at the dairy, the whole village knew. Only I found out last.
  - who: suresh
    t: ಅದಕ್ಕೇ ನಾನೇ ಹೇಳೋಕೆ ಬಂದೆ, ಮಹದೇವ. ಮಂಜುನಾಥ್ ಬಂದಿದ್ದ. ಎಕರೆಗೆ ಐವತ್ತೈದು ಲಕ್ಷ ಅಂದ.
    tr: Adakkē nānē hēḷōke bande, Mahadēva. Man̄junāth bandidda. Ekarege aivattaidu lakṣa anda.
    en: That's why I came to tell you myself, Mahadeva. Manjunath came. He said fifty-five lakh an acre.
  - who: mahadeva
    t: ಅದೇ ಮಂಜುನಾಥ. ನವೆಂಬರ್‌ನಲ್ಲಿ ಅಪ್ಪ ಯಾರಿಗೆ ‘ಇಲ್ಲ’ ಅಂದು ಕಳಿಸಿದ್ರೋ ಅದೇ ಮನುಷ್ಯ. ಅಪ್ಪನ ಫೋಟೋ ಮುಂದೆ, ಅಪ್ಪನ ಮನೇಲಿ, ಅವನಿಗೆ ಕಾಫಿ ಕೊಟ್ಟು ಕೂರಿಸಿದ್ರಲ್ಲಾ ನೀವು!
    tr: Adē Man̄junātha. Navembar-nalli appa yārige ‘illa’ andu kaḷisidrō adē manuṣya. Appana phōṭō munde, appana manēli, avanige kāphi koṭṭu kūrisidrallā nīvu!
    en: (putting down the spade) The same Manjunath. The very man Appa sent away with a 'no' in November. In front of Appa's photo, in Appa's own house, you sat him down and gave him coffee!
  - who: suresh
    t: ಮನೆಗೆ ಬಂದೋರನ್ನ ಬಾಗಿಲಲ್ಲೇ ನಿಲ್ಲಿಸೋದು ನಮ್ಮ ಮನೆತನದ ಪದ್ಧತಿ ಅಲ್ಲ. ನಾನು ‘ಹೂಂ’ ಅನ್ನಲಿಲ್ಲ, ಯಾವ ಕಾಗದಕ್ಕೂ ಸಹಿ ಹಾಕಲಿಲ್ಲ. ಅವ್ವನೇ ಅವನನ್ನ ಕಳಿಸಿದ್ರು.
    tr: Manege bandōranna bāgilallē nillisōdu namma manetanada paddhati alla. Nānu ‘hūṁ’ annalilla, yāva kāgadakkū sahi hākalilla. Avvanē avananna kaḷisidru.
    en: Keeping a visitor standing at the door isn't our family's way. I didn't say 'yes', and I didn't sign any paper. It was Avva herself who sent him off.
  - who: mahadeva
    t: ‘ಹೂಂ’ ಅನ್ನಲಿಲ್ಲ. ‘ಇಲ್ಲ’ ಅಂತಾನೂ ಅನ್ನಲಿಲ್ಲ, ಅಲ್ವಾ ಅಣ್ಣ? ನಿನ್ನ ಕಣ್ಣ ಮುಂದೆ ಆ ಕೋಟಿ ಸಂಖ್ಯೆ ಕುಣೀತಾ ಇತ್ತು. ಮುಖ ನೋಡಿದ್ರೇ ಗೊತ್ತಾಗುತ್ತೆ.
    tr: ‘Hūṁ’ annalilla. ‘Illa’ antānū annalilla, alvā aṇṇa? Ninna kaṇṇa munde ā kōṭi saṅkhye kuṇītā ittu. Mukha nōḍidrē gottāgutte.
    en: You didn't say 'yes'. You didn't say 'no' either, did you, Anna? That crore figure was dancing before your eyes. I can tell just from your face.
  - who: suresh
    t: … ಹೌದು. ಸುಳ್ಳು ಹೇಳಲ್ಲ. ಒಂದು ಕ್ಷಣ ಮನಸ್ಸು ಅಲ್ಲಾಡ್ತು. ರಕ್ಷಿತ್‌ನ ಓದು, ಮನೆ ಸಾಲ… ನಾನೂ ಮನುಷ್ಯ, ಮಹದೇವ. ಆದ್ರೆ ಮನಸ್ಸು ಅಲ್ಲಾಡೋದು ಬೇರೆ, ಮಾರೋದು ಬೇರೆ.
    tr: … Haudu. Suḷḷu hēḷalla. Ondu kṣaṇa manassu allāḍtu. Rakṣit-na ōdu, mane sāla… nānū manuṣya, Mahadēva. Ādre manassu allāḍōdu bēre, mārōdu bēre.
    en: … Yes. I won't lie. For a moment my mind wavered. Rakshith's studies, the house loan… I'm human too, Mahadeva. But wavering is one thing, and selling is another.
  - who: mahadeva
    t: ಇದನ್ನ ನೋಡು ಅಣ್ಣ. ಈ ಮಣ್ಣಿಗೆ ಅಜ್ಜ ಕರಿಯಪ್ಪ ಕೆರೆ ಹೂಳು ತಂದು ಹಾಕಿದ್ರು, ಅಪ್ಪ ಬದು ಕಟ್ಟಿದ್ರು, ನಾನು ಇಪ್ಪತ್ತು ವರ್ಷ ಗೊಬ್ಬರ ಹಾಕಿದೀನಿ. ಮೂರು ತಲೆಮಾರಿನ ಬೆವರು ಇದು. ದುಡ್ಡು ಖರ್ಚಾಗುತ್ತೆ, ಭೂಮಿ ಒಂದ್ಸಲ ಹೋದ್ರೆ ವಾಪಸ್ ಬರಲ್ಲ. ಭೂಮಿ ತಾಯಿ ಅಂತೀವಿ — ಯಾರಾದ್ರೂ ತಾಯಿನ ಮಾರ್ತಾರಾ?
    tr: Idanna nōḍu aṇṇa. Ī maṇṇige ajja Kariyappa kere hūḷu tandu hākidru, appa badu kaṭṭidru, nānu ippattu varṣa gobbara hākidīni. Mūru talemārina bevaru idu. Duḍḍu kharcāgutte, bhūmi ondsala hōdre vāpas baralla. Bhūmi tāyi antīvi — yārādrū tāyina mārtārā?
    en: (scooping up a handful of soil) Look at this, Anna. Grandfather Kariyappa carted silt from the tank and spread it on this soil; Appa built the bunds; I've put manure on it for twenty years. This is three generations' sweat. Money gets spent; once land is gone it never comes back. We call the earth our mother — does anyone sell their mother?
  - who: mahadeva
    t: ಮತ್ತೆ ಆ ಫಾರ್ಮ್ ಪ್ಲಾಟ್ ಜನ ಏನ್ ಮಾಡ್ತಾರೆ ಗೊತ್ತಾ? ಪಕ್ಕದ ಹಳ್ಳೀಲಿ ನೋಡ್ಕಂಡು ಬಾ. ಗೇಟ್ ಹಾಕ್ತಾರೆ, ಬಂಡಿ ದಾರಿ ಮುಚ್ತಾರೆ, ಐನೂರು ಅಡಿ ಬೋರ್‌ವೆಲ್ ಕೊರೆಸ್ತಾರೆ — ನಮ್ ಬಾವಿ ಒಣಗುತ್ತೆ. ವಾರಕ್ಕೊಂದ್ಸಲ ಬಂದು ಫೋಟೋ ತಗಂಡು ಹೋಗ್ತಾರೆ. ಉಳಿದ ದಿನ ಅಲ್ಲಿ ಕಾವಲುಗಾರ ಮಾತ್ರ.
    tr: Matte ā phārm plāṭ jana ēn māḍtāre gottā? Pakkada haḷḷīli nōḍkaṇḍu bā. Gēṭ hāktāre, baṇḍi dāri muctāre, ainūru aḍi bōr-vel korestāre — nam bāvi oṇagutte. Vārakkondsala bandu phōṭō tagaṇḍu hōgtāre. Uḷida dina alli kāvalugāra mātra.
    en: And do you know what those farm-plot people do? Go and look in the next village. They put up gates, they block the cart track, they drill a five-hundred-foot borewell — and our well dries up. They come once a week and take photos. The rest of the time there's only a watchman.
  - who: suresh
    t: 'ನೀನು ಹೇಳೋದು ನಿಜ. ಇನ್ನೊಂದು ವಿಷಯ ನಿನಗೆ ನನ್ನಿಂದಲೇ ಗೊತ್ತಾಗ್ಬೇಕು: ಶೋಭಾಳ ಗಂಡ ಮಂಜುನಾಥ್‌ಗೆ ಫೋನ್ ಮಾಡಿ ರೇಟ್ ಕೇಳಿದ್ರಂತೆ. ಬರೀ ರೇಟ್ ಅಂತೆ.'
    tr: 'Nīnu hēḷōdu nija. Innondu viṣaya ninage nanninda gottāgbēku: Śōbhāḷa gaṇḍa Man̄junāth-ge phōn māḍi rēṭ kēḷidrante. Barī rēṭ ante.'
    en: 'What you say is true. There''s one more thing you should hear from me: Shobha''s husband apparently phoned Manjunath and asked the rate. Only the rate, he says.'
  - who: mahadeva
    t: ಬರೀ ರೇಟ್! ನೋಡಿದ್ಯಾ? ಹುಣ್ಣಿಮೆ ದಿನ ಕಟ್ಟೆ ಮೇಲೆ ಅವಳು ಏನಂದ್ಲು — ‘ನಾನು ಮಾರ್ತೀನಿ ಅಂತ ಯಾರು ಹೇಳಿದ್ರು?’ ಮೂರು ವಾರ ಆಗಿಲ್ಲ, ಆಗ್ಲೇ ಗಂಡ ರೇಟ್ ಕೇಳ್ತಿದಾನೆ. ನಾನು ಅವತ್ತೇ ಹೇಳಿದ್ದೆ. ಕಾನೂನು ಪುಸ್ತಕ ಎಲ್ಲಾ ಇದಕ್ಕೇ.
    tr: Barī rēṭ! Nōḍidyā? Huṇṇime dina kaṭṭe mēle avaḷu ēnandlu — ‘nānu mārtīni anta yāru hēḷidru?’ Mūru vāra āgilla, āglē gaṇḍa rēṭ kēḷtidāne. Nānu avattē hēḷidde. Kānūnu pustaka ellā idakkē.
    en: (with a bitter laugh) Only the rate! See? What did she say on the platform that full-moon night — 'Who said I'd sell?' Not three weeks later, and already her husband is asking the rate. I said it that very day. All those law books were for this.
  - who: suresh
    t: ಮಹದೇವ, ಶೋಭಾಗೆ ಇದು ಗೊತ್ತಿತ್ತೋ ಇಲ್ವೋ ನಮಗೆ ಗೊತ್ತಿಲ್ಲ. ತೀರ್ಮಾನಕ್ಕೆ ಮುಂಚೆ ಅವಳನ್ನೇ ಕೇಳೋಣ.
    tr: Mahadēva, Śōbhāge idu gottittō ilvō namage gottilla. Tīrmānakke mun̄ce avaḷannē kēḷōṇa.
    en: Mahadeva, we don't know whether Shobha knew about this or not. Before we judge, let's ask her.
  - who: mahadeva
    t: ಕೇಳ್ತೀನಿ. ಈಗ್ಲೇ ಕೇಳ್ತೀನಿ.
    tr: Kēḷtīni. Īglē kēḷtīni.
    en: (pulling out his phone) I'll ask. I'll ask right now.
  - scene: He puts the call on speaker. It rings for a long time. In Mysuru it is Shobha's day off.
  - who: shobha
    t: ಹಲೋ? ಮಹದೇವ? ಇಷ್ಟು ಬೆಳಿಗ್ಗೆ… ಅವ್ವ ಚೆನ್ನಾಗಿದಾಳಾ?
    tr: Halō? Mahadēva? Iṣṭu beḷigge… avva cennāgidāḷā?
    en: Hello? Mahadeva? So early in the morning… is Avva all right?
  - who: mahadeva
    t: ಅವ್ವ ಚೆನ್ನಾಗಿದಾಳೆ. ನಿನ್ ಯಜಮಾನ್ರು ಚೆನ್ನಾಗಿದಾರಾ? ಮಂಜುನಾಥನಿಗೆ ಫೋನ್ ಮಾಡಿ ನಮ್ ಗದ್ದೆ ರೇಟ್ ಕೇಳೋಷ್ಟು ಚೆನ್ನಾಗಿದಾರೆ ಅಂತ ಕೇಳ್ದೆ.
    tr: Avva cennāgidāḷe. Nin yajamānru cennāgidārā? Man̄junāthanige phōn māḍi nam gadde rēṭ kēḷōṣṭu cennāgidāre anta kēḷde.
    en: Avva's fine. Is your husband well? I hear he's well enough to phone Manjunath and ask the rate for our wet land.
  - who: shobha
    t: ಏನು? … ನನಗೆ ಗೊತ್ತೇ ಇಲ್ಲ, ಮಹದೇವ. ನಾನು ಅವರ ಹತ್ರ ಮಾತಾಡ್ತೀನಿ. ಆದ್ರೆ ನಾನು ಯಾರಿಗೂ ಜಮೀನು ಮಾರ್ತೀನಿ ಅಂತ ಹೇಳಿಲ್ಲ — ಆಣೆ ಮಾಡಿ ಹೇಳ್ತೀನಿ.
    tr: Ēnu? … Nanage gottē illa, Mahadēva. Nānu avara hatra mātāḍtīni. Ādre nānu yārigū jamīnu mārtīni anta hēḷilla — āṇe māḍi hēḷtīni.
    en: What? … I knew nothing about it, Mahadeva. I'll talk to him. But I have told no one I'd sell the land — I swear it.
  - who: mahadeva
    t: ಆಣೆ ಬೇಡ. ಮೊದಲು ಕಾನೂನು, ಈಗ ಬ್ರೋಕರ್, ನಾಳೆ ಇನ್ನೇನೋ. ನಿಮ್ಮೆಲ್ಲರ ಕಣ್ಣು ಮಣ್ಣಿನ ಮೇಲಿಲ್ಲ, ಮಣ್ಣಿನ ಬೆಲೆ ಮೇಲಿದೆ.
    tr: Āṇe bēḍa. Modalu kānūnu, īga brōkar, nāḷe innēnō. Nimmellara kaṇṇu maṇṇina mēlilla, maṇṇina bele mēlide.
    en: Don't swear. First the law, now a broker, tomorrow something else. None of you has your eyes on the soil — your eyes are on the price of the soil.
  - who: shobha
    t: ಮಹದೇವ, ಹೀಗೆ ಮಾತಾಡಿದ್ರೆ… ಸರಿ. ನಿನ್ನ ಜೊತೆ ಮಾತಾಡಿದ್ದು ಸಾಕು ಅನ್ಸುತ್ತೆ. ಇನ್ಮೇಲೆ ನನ್ನ ಪರವಾಗಿ ಒಬ್ಬ ವಕೀಲರು ಮಾತಾಡ್ತಾರೆ.
    tr: Mahadēva, hīge mātāḍidre… sari. Ninna jote mātāḍiddu sāku ansutte. Inmēle nanna paravāgi obba vakīlaru mātāḍtāre.
    en: Mahadeva, if you talk like this… fine. I think I've done enough talking with you. From now on a lawyer will speak on my behalf.
  - who: mahadeva
    t: ಕರ್ಕಂಡು ಬಾ ನಿನ್ ವಕೀಲನ್ನ! ನಾನೂ ಕೋರ್ಟ್ ಮೆಟ್ಟಿಲು ಹತ್ತೋಕೆ ಹೆದರಲ್ಲ. ಈ ಗದ್ದೆಗೆ ಯಾರಾದ್ರೂ ಕಾಲಿಡ್ಬೇಕು ಅಂದ್ರೆ ಮೊದ್ಲು ನನ್ ಮೇಲೆ ಉಳುಮೆ ಮಾಡ್ಬೇಕು.
    tr: Karkaṇḍu bā nin vakīlanna! Nānū kōrṭ meṭṭilu hattōke hedaralla. Ī gaddege yārādrū kāliḍbēku andre modlu nan mēle uḷume māḍbēku.
    en: Bring your lawyer, then! I'm not afraid to climb the court steps either. If anyone wants to set foot on this field, they'll have to plough over me first.
  - scene: He cuts the call. For a long moment only the water running in the channel can be heard.
  - who: suresh
    t: ಮಹದೇವ… ಅವ್ವ ‘ನಮ್ಮ ಮನೆತನದಲ್ಲಿ ಯಾರೂ ಕೋರ್ಟು ಮೆಟ್ಟಿಲು ಹತ್ತಿಲ್ಲ’ ಅಂದಿದ್ರು. ನೆನಪಿದೆಯಾ?
    tr: Mahadēva… avva ‘namma manetanadalli yārū kōrṭu meṭṭilu hattilla’ andidru. Nenapideyā?
    en: Mahadeva… Avva said, 'No one in our family has ever climbed the steps of a court.' Do you remember?
  - who: mahadeva
    t: ನೆನಪಿದೆ. ಆ ಮಾತು ಮೊದ್ಲು ಮುರಿಯೋರು ನಾನಲ್ಲ, ಅಣ್ಣ. … ನೀರು ಬೇರೆ ಕಡೆ ಹರೀತಿದೆ, ಬದಿಗೆ ಸರಿ.
    tr: Nenapide. Ā mātu modlu muriyōru nānalla, aṇṇa. … Nīru bēre kaḍe harītide, badige sari.
    en: (picking up the spade again) I remember. I won't be the first to break those words, Anna. … The water's running the wrong way — move aside.
  - scene: Noon. Avva sits on the veranda shelling avare beans into a winnowing tray. The two brothers come back from the field, walking several feet apart.
  - who: avva
    t: ಮುಖ ನೋಡಿದ್ರೇ ಗೊತ್ತಾಗುತ್ತೆ. ಏನಾಯ್ತು?
    tr: Mukha nōḍidrē gottāgutte. Ēnāytu?
    en: I can tell by your faces. What's happened?
  - who: suresh
    t: ಶೋಭಾ ವಕೀಲರ ಹತ್ರ ಹೋಗ್ತೀನಿ ಅಂದ್ಲು, ಅವ್ವ.
    tr: Śōbhā vakīlara hatra hōgtīni andlu, avva.
    en: Shobha says she's going to a lawyer, Avva.
  - who: avva
    t: … ಅವರೆ ಕಾಳನ್ನ ಸಿಪ್ಪೆಯಿಂದ ಬೇರೆ ಮಾಡೋದು ಸುಲಭ ಕಣ್ರಪ್ಪ. ಮಕ್ಳನ್ನ ಮನೆಯಿಂದ ಬೇರೆ ಮಾಡೋದು… ನಿಮ್ಮಪ್ಪ ಇದ್ದಿದ್ರೆ ಮೂರೂ ಜನನ್ನ ಕಿವಿ ಹಿಡ್ಕಂಡು ಒಂದೇ ಚಾಪೆ ಮೇಲೆ ಕೂರಿಸ್ತಿದ್ರು.
    tr: … Avare kāḷanna sippeyinda bēre māḍōdu sulabha kaṇrappa. Makḷanna maneyinda bēre māḍōdu… nimmappa iddidre mūrū janna kivi hiḍkaṇḍu ondē cāpe mēle kūristidru.
    en: (her hands go still) … Separating avare beans from their pods is easy, my sons. Separating children from their home… If your father were alive, he'd have pulled all three of you by the ear and sat you down on one mat.
  - who: mahadeva
    t: ಅಪ್ಪ ಇದ್ದಿದ್ರೆ ಈ ಜಗಳಾನೇ ಇರ್ತಿರ್ಲಿಲ್ಲ, ಅವ್ವ.
    tr: Appa iddidre ī jagaḷānē irtirlilla, avva.
    en: If Appa were alive, there wouldn't be any fight at all, Avva.
  - who: avva
    t: ಇರ್ತಿತ್ತು ಮಗ. ಅಪ್ಪನ ಭಯಕ್ಕೆ ಬಾಯಿ ಮುಚ್ಕೊಂಡಿರ್ತಿತ್ತು, ಅಷ್ಟೇ. ಮುಚ್ಚಿಟ್ಟ ಗಾಯ ಒಳಗೇ ಕೊಳೆಯುತ್ತೆ. … ಶೋಭ ಯಾಕೆ ಹಂಗಂದ್ಲು? ಯಾರು ಏನಂದ್ರು ಅವಳಿಗೆ?
    tr: Irtittu maga. Appana bhayakke bāyi muckoṇḍirtittu, aṣṭē. Mucciṭṭa gāya oḷagē koḷeyutte. … Śōbha yāke haṅgandlu? Yāru ēnandru avaḷige?
    en: There would, son. It would only have kept its mouth shut out of fear of your father, that's all. A wound kept covered festers inside. … Why did Shobha say that? Who said what to her?
  - who: suresh
    t: ಅವಳ ಗಂಡ ಬ್ರೋಕರ್‌ಗೆ ಫೋನ್ ಮಾಡಿದ ವಿಷಯ ಮಹದೇವ ಕೇಳಿದ, ಅವ್ವ. ಅವಳಿಗೆ ಅದು ಗೊತ್ತೇ ಇರ್ಲಿಲ್ಲ ಅಂತ ಆಣೆ ಮಾಡಿದ್ಲು. ಆಮೇಲೆ ಮಾತಿಗೆ ಮಾತು ಬೆಳೀತು.
    tr: Avaḷa ganḍa brōkar-ge phōn māḍida viṣaya Mahadēva kēḷida, avva. Avaḷige adu gottē irlilla anta āṇe māḍidlu. Āmēle mātige mātu beḷītu.
    en: Mahadeva asked her about her husband phoning the broker, Avva. She swore she knew nothing about it. Then one word led to another.
  - who: avva
    t: ಮಹದೇವ, ಗಂಡನ ಮಾತಿಗೆ ಹೆಂಡತಿಯನ್ನ ತೂಗಬೇಡ. ಊರವರು ಆಡೋ ಮಾತಿಗೆ ನಾನು ನಿನ್ನನ್ನ ತೂಗಿದ್ರೆ ನಿಂಗೆ ಹೆಂಗಾಗುತ್ತೆ?
    tr: Mahadēva, ganḍana mātige henḍatiyanna tūgabēḍa. Ūravaru āḍō mātige nānu ninnanna tūgidre niṅge heṅgāgutte?
    en: Mahadeva, don't weigh a wife by her husband's words. If I weighed you by what the village says, how would that feel?
  - who: mahadeva
    t: ಅವಳ ಗಂಡ ಏನಾದ್ರೂ ಮಾಡ್ಕೊಳ್ಲಿ, ಅವ್ವ. ‘ಇನ್ಮೇಲೆ ವಕೀಲರು ಮಾತಾಡ್ತಾರೆ’ ಅಂದಿದ್ದು ಅವಳೇ — ನಾನಲ್ಲ.
    tr: Avaḷa ganḍa ēnādrū māḍkoḷli, avva. ‘Inmēle vakīlaru mātāḍtāre’ andiddu avaḷē — nānalla.
    en: Let her husband do what he likes, Avva. She's the one who said 'from now on a lawyer will speak for me' — not me.
  - who: avva
    t: ಸಿಟ್ಟು ಬಂದಾಗ ಅವರೆಕಾಳು ಬಿಡಿಸು, ಮಗ. ಕೈ ಕೆಲಸ ಮಾಡ್ತಿದ್ರೆ ಬಾಯಿ ಸುಮ್ಮನಿರುತ್ತೆ. … ಕೂತ್ಕೊಳ್ಳಿ ಇಬ್ರೂ. ಈ ಮೊರ ತುಂಬೋವರೆಗೂ ಯಾರೂ ಏಳಬಾರದು.
    tr: Siṭṭu bandāga avarekāḷu biḍisu, maga. Kai kelasa māḍtidre bāyi summanirutte. … Kūtkoḷḷi ibrū. Ī mora tumbōvaregū yārū ēḷabāradu.
    en: (pushing the winnowing tray towards them) When anger comes, shell avare beans, son. When the hands are busy, the mouth keeps quiet. … Sit down, both of you. Nobody gets up till this tray is full.
  - chapter: Chapter 6 — The case
  - section: Advocate Nagendra
    learn: 'a lawyer''s questions: nōndāyita vibhāga patra, dāna patra, hakku biḍugaḍe patra · shares: svayārjita (Section 8, talā nālkanē ondu bhāga) vs pitrārjita (Section 6, sahasamāṁśi) · stages of a suit: vādapatra, samans, likhita hēḷike, vivādāṁśagaḷu, prilimināri ḍikri, phainal ḍikri, kamiṣanar · court fee: jaṇṭi svādhīna vs horagiṭṭu, mārukaṭṭe maulya · legal passives in the plaint: kōruvudilla, kōralāgilla · honesty about time: daśakagaḷu hiḍiyutte'
  - scene: Thursday, 9 April 2026. Advocate Nagendra's chamber, in a lane behind the court complex in Maddur. A narrow room lined with brown law reports; a typist at an old computer in the corner; a Bar Association calendar on the wall. Nagendra, in his late fifties, wears a white shirt; his black coat hangs on the chair. Shobha sits opposite him with her folder. She has come alone.
  - who: lawyer
    t: ಬನ್ನಿ ಮೇಡಂ, ಕುಳಿತುಕೊಳ್ಳಿ. ಮೈಸೂರಿನ ರಾಮಚಂದ್ರ ಅವರು ಫೋನ್ ಮಾಡಿದ್ರು, ನೀವು ಬರ್ತೀರಿ ಅಂತ. ತಂದೆ ತೀರಿಕೊಂಡಿದ್ದು ಕೇಳಿ ಬೇಸರ ಆಯ್ತು. ಮೊದಲು ನೀವೇ ಪೂರ್ತಿ ಕತೆ ಹೇಳಿ. ಆಮೇಲೆ ನಾನು ಕಾಗದ ನೋಡ್ತೀನಿ.
    tr: Banni mēḍam, kuḷitukoḷḷi. Maisūrina Rāmacandra avaru phōn māḍidru, nīvu bartīri anta. Tande tīrikoṇḍiddu kēḷi bēsara āytu. Modalu nīvē pūrti kate hēḷi. Āmēle nānu kāgada nōḍtīni.
    en: Come in, madam, please sit. Mr Ramachandra from Mysuru phoned to say you'd be coming. I was sorry to hear about your father. First, tell me the whole story yourself. Then I'll look at the papers.
  - who: shobha
    t: ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಹೇಳ್ತೀನಿ ಸಾರ್. ಅಪ್ಪ ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ತೀರಿಕೊಂಡ್ರು, ಉಯಿಲು ಇಲ್ಲ. ಆರು ಎಕರೆ — ಮೂರೂವರೆ ಎಕರೆ ಗದ್ದೆ ಅಜ್ಜನಿಂದ ಬಂದಿದ್ದು, ಎರಡೂವರೆ ಎಕರೆ ಹೊಲ ಅಪ್ಪ ತಮ್ಮ ದುಡಿಮೆಯಿಂದ ಕೊಂಡಿದ್ದು. ತಹಸೀಲ್ದಾರ್ ಆದೇಶದಿಂದ ಪಹಣಿಯಲ್ಲಿ ನಾಲ್ವರ ಹೆಸರೂ ಬಂದಿದೆ — ಅವ್ವ, ಅಣ್ಣ, ತಮ್ಮ, ನಾನು. ತಮ್ಮ ಮಹದೇವ ಬೇಸಾಯ ಮಾಡ್ತಿದಾನೆ. ಗದ್ದೆ ಒಡೆಯೋಕೆ ಬಿಡಲ್ಲ, ನನಗೆ ಪಾಲು ಕೊಡೋಕೂ ಒಪ್ಪಲ್ಲ. ಊರ ಹಿರಿಯರ ಮುಂದೆ ಮಾತಾಡಿದ್ವಿ — ಏನೂ ಆಗಲಿಲ್ಲ.
    tr: Saṅkṣiptavāgi hēḷtīni sār. Appa Ḍisembar-nalli tīrikoṇḍru, uyilu illa. Āru ekare — mūrūvare ekare gadde ajjaninda bandiddu, eraḍūvare ekare hola appa tamma duḍimeyinda koṇḍiddu. Tahasīldār ādēśadinda pahaṇiyalli nālvara hesarū bandide — avva, aṇṇa, tamma, nānu. Tamma Mahadēva bēsāya māḍtidāne. Gadde oḍeyōke biḍalla, nanage pālu koḍōkū oppalla. Ūra hiriyara munde mātāḍidvi — ēnū āgalilla.
    en: I'll keep it short, sir. Appa died in December, without a will. Six acres — three and a half acres of wet land that came from my grandfather, and two and a half acres of dry field that Appa bought with his own earnings. By the Tahsildar's order, all four names are now in the RTC — Avva, my elder brother, my younger brother and me. My younger brother Mahadeva farms it. He won't let the wet land be divided, and he won't agree to give me a share. We talked before the village elders — nothing came of it.
  - who: lawyer
    t: 'ಮೂರು ಪ್ರಶ್ನೆ. ಒಂದು: ಎರಡು ಸಾವಿರದ ನಾಲ್ಕರ ಡಿಸೆಂಬರ್‌ಗಿಂತ ಮುಂಚೆ ಕುಟುಂಬದಲ್ಲಿ ನೋಂದಾಯಿತ ವಿಭಾಗ ಪತ್ರ ಆಗಿತ್ತಾ? ಎರಡು: ತಂದೆ ಯಾರಿಗಾದ್ರೂ ದಾನ ಪತ್ರ ಮಾಡಿದ್ರಾ? ಮೂರು: ನಿಮ್ಮ ಮದುವೆ ಸಮಯದಲ್ಲಿ ನೀವು ಯಾವುದಾದ್ರೂ ಹಕ್ಕು ಬಿಡುಗಡೆ ಪತ್ರಕ್ಕೆ ಸಹಿ ಹಾಕಿದ್ರಾ? ಹಳ್ಳಿಗಳಲ್ಲಿ ಇದು ತುಂಬಾ ನಡೆಯುತ್ತೆ.'
    tr: 'Mūru praśne. Ondu: eraḍu sāvirada nālkara Ḍisembar-ginta mun̄ce kuṭumbadalli nōndāyita vibhāga patra āgittā? Eraḍu: tande yārigādrū dāna patra māḍidrā? Mūru: nimma maduve samayadalli nīvu yāvudādrū hakku biḍugaḍe patrakke sahi hākidrā? Haḷḷigaḷalli idu tumbā naḍeyutte.'
    en: 'Three questions. One: before December 2004, was there any registered partition deed in the family? Two: did your father execute a gift deed in anyone''s favour? Three: at the time of your wedding, did you sign any release deed? That happens a lot in villages.'
  - who: shobha
    t: ಮೂರಕ್ಕೂ ಇಲ್ಲ ಸಾರ್. ನಾನು ಯಾವ ಕಾಗದಕ್ಕೂ ಸಹಿ ಹಾಕಿಲ್ಲ. ನನ್ನ ತಮ್ಮ ‘ಅಪ್ಪ ಬಾಯ್ಮಾತಲ್ಲಿ ಗದ್ದೆ ನನಗೆ ಅಂದಿದ್ರು’ ಅಂತಾನೆ, ಅಷ್ಟೇ.
    tr: Mūrakkū illa sār. Nānu yāva kāgadakkū sahi hākilla. Nanna tamma ‘appa bāymātalli gadde nanage andidru’ antāne, aṣṭē.
    en: No to all three, sir. I haven't signed any paper. My brother says 'Appa told me by word of mouth the wet land was mine', that's all.
  - who: lawyer
    t: ಹಾಗಾದ್ರೆ ಕಾನೂನಿನಲ್ಲಿ ನಿಮ್ಮ ಸ್ಥಿತಿ ಗಟ್ಟಿಯಾಗಿದೆ. ಹೊಲ ನಿಮ್ಮ ತಂದೆಯ ಸ್ವಯಾರ್ಜಿತ ಆಸ್ತಿ. ಉಯಿಲು ಇಲ್ಲದ್ದರಿಂದ ಸೆಕ್ಷನ್ ಎಂಟರ ಪ್ರಕಾರ ಮೊದಲ ದರ್ಜೆಯ ನಾಲ್ಕು ವಾರಸುದಾರರಿಗೆ — ತಾಯಿಯೂ ಸೇರಿ — ತಲಾ ನಾಲ್ಕನೇ ಒಂದು ಭಾಗ.
    tr: Hāgādre kānūninalli nimma sthiti gaṭṭiyāgide. Hola nimma tandeya svayārjita āsti. Uyilu illaddarinda sekṣan eṇṭara prakāra modala darjeya nālku vārasudārarige — tāyiyū sēri — talā nālkanē ondu bhāga.
    en: Then your position in law is strong. The dry field is your father's self-acquired property. Since there's no will, under Section 8 it goes to the four Class I heirs — your mother included — one quarter each.
  - who: lawyer
    t: 'ಗದ್ದೆ ಸ್ವಲ್ಪ ಬೇರೆ. ಅದು ಪಿತ್ರಾರ್ಜಿತ. ತಿದ್ದುಪಡಿ ಆದ ಸೆಕ್ಷನ್ ಆರರ ಪ್ರಕಾರ ನೀವು ಹುಟ್ಟಿನಿಂದಲೇ ಸಹಸಮಾಂಶಿ — ನಿಮ್ಮ ಅಣ್ಣ-ತಮ್ಮಂದಿರ ಹಾಗೇ. ತಂದೆಯ ಸ್ವಂತ ಭಾಗ ಅವರ ಮರಣದ ನಂತರ ವಾರಸುದಾರರಿಗೆ ಹಂಚಿಹೋಗುತ್ತೆ, ಅದರಲ್ಲಿ ತಾಯಿಗೂ ಪಾಲಿದೆ. ನಿಖರವಾಗಿ ಎಷ್ಟು ಭಾಗ ಅನ್ನೋದನ್ನ ಕೋರ್ಟ್ ಪ್ರಿಲಿಮಿನರಿ ಡಿಕ್ರಿಯಲ್ಲಿ ಘೋಷಿಸುತ್ತೆ. ಆದರೆ ಒಂದು ವಿಷಯ ಖಚಿತ: ಗದ್ದೆಯಲ್ಲಿ ನಿಮ್ಮ ಪಾಲು ಪ್ರತಿ ಸಹೋದರನ ಪಾಲಿನಷ್ಟೇ.'
    tr: 'Gadde svalpa bēre. Adu pitrārjita. Tiddupaḍi āda sekṣan ārara prakāra nīvu huṭṭinindalē sahasamāṁśi — nimma aṇṇa-tammandira hāgē. Tandeya svanta bhāga avara maraṇada nantara vārasudārarige han̄cihōgutte, adaralli tāyigū pālide. Nikharavāgi eṣṭu bhāga annōdanna kōrṭ prilimināri ḍikriyalli ghōṣisutte. Ādare ondu viṣaya khacita: gaddeyalli nimma pālu prati sahōdarana pālinaṣṭē.'
    en: 'The wet land is a little different. It''s ancestral. Under the amended Section 6, you are a coparcener from birth — just like your brothers. Your father''s own portion passes on his death to his heirs, and your mother has a share in that. Exactly what fraction is something the court will declare in the preliminary decree. But one thing is certain: in the wet land, your share is the same as each of your brothers''.'
  - who: shobha
    t: ಮಹದೇವ ಇಪ್ಪತ್ತು ವರ್ಷ ದುಡಿದಿದ್ದು, ಸಾಲ ತೀರಿಸಿದ್ದು — ಅದಕ್ಕೆ ಕೋರ್ಟಲ್ಲಿ ಏನೂ ಬೆಲೆ ಇಲ್ವಾ?
    tr: Mahadēva ippattu varṣa duḍididdu, sāla tīrisiddu — adakke kōrṭalli ēnū bele ilvā?
    en: Mahadeva's twenty years of labour, the loans he repaid — do those count for nothing in court?
  - who: lawyer
    t: ಒಳ್ಳೆ ಪ್ರಶ್ನೆ — ಸಾಮಾನ್ಯವಾಗಿ ವಾದಿಗಳು ಇದನ್ನ ಕೇಳಲ್ಲ. ಜಂಟಿ ಆಸ್ತಿಯಲ್ಲಿ ಒಬ್ಬರು ಬೇಸಾಯ ಮಾಡಿದ್ರೆ ಅವರಿಗೆ ಕೂಲಿ ಅಂತ ಕಾನೂನು ಕೊಡಲ್ಲ. ಆದರೆ ಅವರು ತೀರಿಸಿದ ಸಾಲ, ಮಾಡಿದ ಸುಧಾರಣೆ — ಪಾಲು ಮಾಡುವಾಗ ಕೋರ್ಟ್ ಪರಿಗಣಿಸಬಹುದು. ಇನ್ನೊಂದು ಕಡೆ, ನೀವು ಕಳೆದ ಮೂರು ವರ್ಷದ ಆದಾಯದಲ್ಲಿ ನಿಮ್ಮ ಪಾಲಿನ ಲೆಕ್ಕವನ್ನೂ ಕೇಳಬಹುದು.
    tr: Oḷḷe praśne — sāmānyavāgi vādigaḷu idanna kēḷalla. Jaṇṭi āstiyalli obbaru bēsāya māḍidre avarige kūli anta kānūnu koḍalla. Ādare avaru tīrisida sāla, māḍida sudhāraṇe — pālu māḍuvāga kōrṭ parigaṇisabahudu. Innondu kaḍe, nīvu kaḷeda mūru varṣada ādāyadalli nimma pālina lekkavannū kēḷabahudu.
    en: A good question — plaintiffs don't usually ask it. If one co-owner farms joint property, the law doesn't pay him wages for it. But the loans he cleared and the improvements he made — the court may take those into account when dividing. On the other side, you could also ask for an account of your share of the income for the last three years.
  - who: shobha
    t: ಬೇಡ ಸಾರ್. ಅವನ ಬೆವರಿನ ದುಡ್ಡಲ್ಲಿ ನನಗೆ ಒಂದು ಪೈಸೆನೂ ಬೇಡ. ಹಿಂದಿನ ಲೆಕ್ಕ ಕೇಳಲ್ಲ. ಮುಂದಿನ ಪಾಲು ಮಾತ್ರ.
    tr: Bēḍa sār. Avana bevarina duḍḍalli nanage ondu paisenū bēḍa. Hindina lekka kēḷalla. Mundina pālu mātra.
    en: No, sir. I don't want a single paisa of the money from his sweat. I won't ask for past accounts. Only my share from here on.
  - who: lawyer
    t: ಸರಿ. ಅದನ್ನ ದಾವೆಯಲ್ಲೇ ಸ್ಪಷ್ಟವಾಗಿ ಬರೆಯೋಣ — ‘ವಾದಿಯು ಹಿಂದಿನ ಆದಾಯದ ಲೆಕ್ಕವನ್ನು ಕೋರುವುದಿಲ್ಲ’ ಅಂತ. ಎದುರು ಪಕ್ಷದವರು ಓದಿದಾಗ ಅದು ಸ್ವಲ್ಪ ಬಿಸಿ ಕಡಿಮೆ ಮಾಡುತ್ತೆ. ಈಗ ಅವರ ಬಾಯ್ಮಾತಿನ ಪಾಲಿನ ವಾದ. ವಿನೀತಾ ಶರ್ಮಾ ತೀರ್ಪಿನ ನಂತರ, ಆ ಕಾಲದ ಸಾರ್ವಜನಿಕ ದಾಖಲೆಗಳ ಬೆಂಬಲ ಇಲ್ಲದ ಬಾಯ್ಮಾತಿನ ವಿಭಾಗವನ್ನ ಕೋರ್ಟ್‌ಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಒಪ್ಪಲ್ಲ.
    tr: Sari. Adanna dāveyallē spaṣṭavāgi bareyōṇa — ‘vādiyu hindina ādāyada lekkavannu kōruvudilla’ anta. Eduru pakṣadavaru ōdidāga adu svalpa bisi kaḍime māḍutte. Īga avara bāymātina pālina vāda. Vinītā Śarmā tīrpina nantara, ā kālada sārvajanika dākhalegaḷa bembala illada bāymātina vibhāgavanna kōrṭ-gaḷu sāmānyavāgi oppalla.
    en: Fine. Let's write that clearly in the plaint itself — 'The plaintiff does not seek an account of past income.' When the other side reads it, it will take some of the heat out of things. Now, their oral-partition argument. Since the Vineeta Sharma judgment, courts generally don't accept an oral partition that isn't backed by public records from that time.
  - who: shobha
    t: ದಾವೆ ಹೇಗೆ ನಡೆಯುತ್ತೆ ಸಾರ್? ಹಂತ ಹಂತವಾಗಿ ಹೇಳಿ.
    tr: Dāve hēge naḍeyutte sār? Hanta hantavāgi hēḷi.
    en: How does a suit proceed, sir? Tell me step by step.
  - who: lawyer
    t: 'ಮೊದಲು ವಾದಪತ್ರ — ಪ್ಲೇಂಟ್ — ಇಲ್ಲಿನ ಸಿವಿಲ್ ಜಡ್ಜ್ ನ್ಯಾಯಾಲಯದಲ್ಲಿ ಮೂಲ ದಾವೆಯಾಗಿ ಹಾಕ್ತೀವಿ. ಕೋರ್ಟ್ ಎಲ್ಲಾ ಪ್ರತಿವಾದಿಗಳಿಗೆ ಸಮನ್ಸ್ ಕಳಿಸುತ್ತೆ. ಅವರು ಲಿಖಿತ ಹೇಳಿಕೆ ಕೊಡ್ತಾರೆ. ಆಮೇಲೆ ವಿವಾದಾಂಶಗಳ ರಚನೆ, ಸಾಕ್ಷಿ, ವಾದ. ಆಮೇಲೆ ಪ್ರಿಲಿಮಿನರಿ ಡಿಕ್ರಿ — ಯಾರಿಗೆ ಎಷ್ಟು ಪಾಲು ಅಂತ ಘೋಷಣೆ. ಅದಾದ ಮೇಲೆ ಫೈನಲ್ ಡಿಕ್ರಿ ಪ್ರಕ್ರಿಯೆ: ಕೋರ್ಟ್ ಒಬ್ಬ ಕಮಿಷನರ್‌ನ ನೇಮಿಸುತ್ತೆ, ಸರ್ವೇಯರ್ ಬಂದು ಜಮೀನು ಅಳತೆ ಮಾಡಿ, ಗಡಿ ಕಲ್ಲು ಹಾಕಿ ಭಾಗ ಮಾಡ್ತಾರೆ.'
    tr: 'Modalu vādapatra — plēṇṭ — illina sivil jaḍj nyāyālayadalli mūla dāveyāgi hāktīvi. Kōrṭ ellā prativādigaḷige samans kaḷisutte. Avaru likhita hēḷike koḍtāre. Āmēle vivādāṁśagaḷa racane, sākṣi, vāda. Āmēle prilimināri ḍikri — yārige eṣṭu pālu anta ghōṣaṇe. Adāda mēle phainal ḍikri prakriye: kōrṭ obba kamiṣanar-na nēmisutte, sarvēyar bandu jamīnu aḷate māḍi, gaḍi kallu hāki bhāga māḍtāre.'
    en: 'First the plaint — we file it as an original suit in the Civil Judge''s court here. The court sends summons to all the defendants. They file written statements. Then the issues are framed, then evidence, then arguments. Then the preliminary decree — the declaration of who gets what share. After that, the final decree proceedings: the court appoints a commissioner, and a surveyor comes, measures the land, sets boundary stones and divides it.'
  - who: shobha
    t: ಪ್ರತಿವಾದಿಗಳು ಅಂದ್ರೆ — ಮಹದೇವ ಮಾತ್ರ ತಾನೇ?
    tr: Prativādigaḷu andre — Mahadēva mātra tānē?
    en: By defendants you mean — only Mahadeva, surely?
  - who: lawyer
    t: 'ಇಲ್ಲ ಮೇಡಂ. ವಿಭಾಗದ ದಾವೆಯಲ್ಲಿ ಎಲ್ಲಾ ಸಹ ಮಾಲೀಕರೂ ಪಕ್ಷಕಾರರಾಗಬೇಕು. ಪ್ರತಿವಾದಿ ಒಂದು: ನಿಮ್ಮ ತಾಯಿ ಪುಟ್ಟಮ್ಮ. ಎರಡು: ಸುರೇಶ. ಮೂರು: ಮಹದೇವ. ಸಹಕಾರ ಸಂಘದ ಸಾಲ ಜಮೀನಿನ ಮೇಲಿರೋದರಿಂದ ಆ ಸಂಘಕ್ಕೂ ನೋಟಿಸ್ ಹೋಗಬಹುದು.'
    tr: 'Illa mēḍam. Vibhāgada dāveyalli ellā saha mālīkarū pakṣakārarāgabēku. Prativādi ondu: nimma tāyi Puṭṭamma. Eraḍu: Surēśa. Mūru: Mahadēva. Sahakāra saṅghada sāla jamīnina mēlirōdarinda ā saṅghakkū nōṭis hōgabahudu.'
    en: 'No, madam. In a partition suit, every co-owner has to be a party. Defendant one: your mother, Puttamma. Two: Suresha. Three: Mahadeva. Since the cooperative society''s loan is on the land, a notice may go to the society as well.'
  - who: shobha
    t: ಅವ್ವನ ಹೆಸರು… ಪ್ರತಿವಾದಿಯಾಗಿ? ಸಾರ್, ನನ್ನ ತಾಯಿಯ ಮೇಲೆ ನಾನು ಕೇಸ್ ಹಾಕ್ತೀನಾ? ಊರಲ್ಲಿ ಎಲ್ರೂ ಅದನ್ನೇ ಹೇಳ್ತಾರೆ — ‘ಹೆತ್ತ ತಾಯಿ ಮೇಲೆ ಕೋರ್ಟಿಗೆ ಹೋದ್ಲು’ ಅಂತ.
    tr: Avvana hesaru… prativādiyāgi? Sār, nanna tāyiya mēle nānu kēs hāktīnā? Ūralli ellrū adannē hēḷtāre — ‘hetta tāyi mēle kōrṭige hōdlu’ anta.
    en: Avva's name… as a defendant? Sir, am I to file a case against my own mother? That's exactly what everyone in the village will say — 'she went to court against the mother who bore her.'
  - who: lawyer
    t: 'ಅದು ತಾಯಿಯ ವಿರುದ್ಧ ಅಲ್ಲ, ಮೇಡಂ. ಅವರ ಪಾಲನ್ನೂ ಕೋರ್ಟ್ ಘೋಷಿಸಬೇಕಲ್ಲ — ಅದಕ್ಕೆ ಅವರು ಪಕ್ಷಕಾರರು. ಬೇಕಾದ್ರೆ ದಾವೆಯಲ್ಲೇ ಬರೆಯೋಣ: ‘ಒಂದನೇ ಪ್ರತಿವಾದಿಯ ವಿರುದ್ಧ ಯಾವುದೇ ಪರಿಹಾರ ಕೋರಲಾಗಿಲ್ಲ.’ ಅಂಥವರನ್ನ ನಾವು ‘ಔಪಚಾರಿಕ ಪಕ್ಷಕಾರರು’ ಅಂತೀವಿ. ಆದರೆ ಹೌದು, ಊರಿಗೆ ಈ ವ್ಯತ್ಯಾಸ ಅರ್ಥ ಆಗಲ್ಲ. ಅದು ನಿಮಗೆ ಮೊದಲೇ ಗೊತ್ತಿರಲಿ.'
    tr: 'Adu tāyiya viruddha alla, mēḍam. Avara pālannū kōrṭ ghōṣisabēkalla — adakke avaru pakṣakāraru. Bēkādre dāveyallē bareyōṇa: ‘Ondanē prativādiya viruddha yāvudē parihāra kōralāgilla.’ Anthavaranna nāvu ‘aupacārika pakṣakāraru’ antīvi. Ādare haudu, ūrige ī vyatyāsa artha āgalla. Adu nimage modalē gottirali.'
    en: 'It isn''t against your mother, madam. The court has to declare her share too — that''s why she''s a party. If you like, we''ll write it into the plaint itself: ''No relief is sought against the first defendant.'' We call such people ''formal parties''. But yes — the village won''t understand the difference. Better you know that going in.'
  - who: shobha
    t: … ಖರ್ಚು ಎಷ್ಟಾಗುತ್ತೆ ಸಾರ್? ಕೋರ್ಟ್ ಶುಲ್ಕ, ನಿಮ್ಮ ಫೀಸು — ಎಲ್ಲಾ ಮೊದಲೇ ಗೊತ್ತಿರಲಿ.
    tr: … Kharcu eṣṭāgutte sār? Kōrṭ śulka, nimma phīsu — ellā modalē gottirali.
    en: (after a pause) … How much will it cost, sir? The court fee, your fee — let me know everything up front.
  - who: lawyer
    t: ಕೋರ್ಟ್ ಶುಲ್ಕದಲ್ಲಿ ಒಂದು ಮುಖ್ಯ ವಿಷಯ ಇದೆ. ಕರ್ನಾಟಕ ನ್ಯಾಯಾಲಯ ಶುಲ್ಕ ಕಾಯ್ದೆಯ ಪ್ರಕಾರ, ವಾದಿ ಜಮೀನಿನ ಜಂಟಿ ಸ್ವಾಧೀನದಲ್ಲಿದ್ದಾರೆ ಅಂತ ಹೇಳಿದ್ರೆ ಒಂದು ಸಣ್ಣ ನಿಗದಿತ ಶುಲ್ಕ ಸಾಕು — ಕೆಲವು ನೂರು ರೂಪಾಯಿ. ಆದರೆ ಎದುರು ಪಕ್ಷದವರು ‘ಇವರನ್ನ ಜಮೀನಿಂದ ಹೊರಗಿಟ್ಟು ವರ್ಷಗಳಾಯ್ತು’ ಅಂತ ವಾದಿಸಿ, ಕೋರ್ಟ್ ಅದನ್ನ ಒಪ್ಪಿದ್ರೆ, ನಿಮ್ಮ ಪಾಲಿನ ಮಾರುಕಟ್ಟೆ ಮೌಲ್ಯದ ಮೇಲೆ ಶುಲ್ಕ ಕಟ್ಟಬೇಕಾಗುತ್ತೆ. ಅದು ಸಾವಿರಗಳಲ್ಲಿ ನಿಲ್ಲಲ್ಲ, ಲಕ್ಷದ ಹತ್ತಿರ ಹೋಗಬಹುದು.
    tr: Kōrṭ śulkadalli ondu mukhya viṣaya ide. Karnāṭaka nyāyālaya śulka kāydeya prakāra, vādi jamīnina jaṇṭi svādhīnadalliddāre anta hēḷidre ondu saṇṇa nigadita śulka sāku — kelavu nūru rūpāyi. Ādare eduru pakṣadavaru ‘ivaranna jamīninda horagiṭṭu varṣagaḷāytu’ anta vādisi, kōrṭ adanna oppidre, nimma pālina mārukaṭṭe maulyada mēle śulka kaṭṭabēkāgutte. Adu sāviragaḷalli nillalla, lakṣada hattira hōgabahudu.
    en: There's one important point about the court fee. Under the Karnataka Court Fees Act, if the plaintiff states she is in joint possession of the land, a small fixed fee is enough — a few hundred rupees. But if the other side argues 'she's been kept out of the land for years' and the court accepts that, you'd have to pay a fee on the market value of your share. That won't stop at thousands — it could come close to a lakh.
  - who: shobha
    t: ನಾನು ಮೈಸೂರಲ್ಲಿದೀನಿ. ಅವನು ಅದನ್ನೇ ಹೇಳ್ತಾನೆ.
    tr: Nānu Maisūrallidīni. Avanu adannē hēḷtāne.
    en: I live in Mysuru. That's exactly what he'll say.
  - who: lawyer
    t: 'ಹೇಳಬಹುದು. ಆದರೆ ಜಂಟಿ ಆಸ್ತಿಯಲ್ಲಿ ಒಬ್ಬರ ಸ್ವಾಧೀನ ಎಲ್ಲರ ಸ್ವಾಧೀನ ಅಂತಾನೇ ಕಾನೂನು ಸಾಮಾನ್ಯವಾಗಿ ನೋಡುತ್ತೆ. ಅದಕ್ಕಿಂತ ಮುಖ್ಯ — ತಹಸೀಲ್ದಾರ್ ಆದೇಶದಿಂದ ನಿಮ್ಮ ಹೆಸರು ಈಗ ಪಹಣಿಯಲ್ಲಿದೆ. ಅವತ್ತು ಆ ಹೆಸರಿಗಾಗಿ ನೀವು ಹೋರಾಡಿದ್ದು ಇವತ್ತು ಉಪಯೋಗಕ್ಕೆ ಬರ್ತಿದೆ. ನನ್ನ ಫೀಸು: ದಾವೆ ಹಾಕಿ ಲಿಖಿತ ಹೇಳಿಕೆಯ ಹಂತದವರೆಗೆ ಇಪ್ಪತ್ತೈದು ಸಾವಿರ. ಮುಂದಿನ ಹಂತಗಳಿಗೆ ಬೇರೆ. ಪ್ರತಿ ರೂಪಾಯಿಗೂ ರಸೀದಿ ಕೊಡ್ತೀನಿ.'
    tr: 'Hēḷabahudu. Ādare jaṇṭi āstiyalli obbara svādhīna ellara svādhīna antānē kānūnu sāmānyavāgi nōḍutte. Adakkinta mukhya — tahasīldār ādēśadinda nimma hesaru īga pahaṇiyallide. Avattu ā hesarigāgi nīvu hōrāḍiddu ivattu upayōgakke bartide. Nanna phīsu: dāve hāki likhita hēḷikeya hantadavarege ippattaidu sāvira. Mundina hantagaḷige bēre. Prati rūpāyigū rasīdi koḍtīni.'
    en: 'He may. But in joint property the law generally treats one co-owner''s possession as everyone''s possession. More important — thanks to the Tahsildar''s order, your name is now in the RTC. The fight you put up for that name back then is paying off today. My fee: twenty-five thousand up to the written-statement stage. The later stages separately. I''ll give you a receipt for every rupee.'
  - who: shobha
    t: ಎಷ್ಟು ವರ್ಷ ಆಗುತ್ತೆ ಸಾರ್? ನಿಜ ಹೇಳಿ.
    tr: Eṣṭu varṣa āgutte sār? Nija hēḷi.
    en: How many years will it take, sir? Tell me honestly.
  - who: lawyer
    t: ನಿಜ ಹೇಳ್ತೀನಿ. ಕಳೆದ ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಕರ್ನಾಟಕ ಹೈಕೋರ್ಟೇ ಒಂದು ತೀರ್ಪಲ್ಲಿ ಹೇಳಿದೆ — ವಿಳಂಬದ ಪಟ್ಟಿಯಲ್ಲಿ ವಿಭಾಗದ ದಾವೆಗಳು ಮೊದಲ ಸ್ಥಾನದಲ್ಲಿವೆ, ಎಷ್ಟೋ ಸಲ ದಶಕಗಳು ಹಿಡಿಯುತ್ತೆ ಅಂತ. ನಮ್ಮ ರಾಜ್ಯದ ಜಿಲ್ಲಾ ನ್ಯಾಯಾಲಯಗಳಲ್ಲಿ ಒಂದೂವರೆ ಲಕ್ಷಕ್ಕೂ ಹೆಚ್ಚು ವಿಭಾಗದ ದಾವೆಗಳು ಬಾಕಿ ಇವೆ. ಸಾಮಾನ್ಯವಾಗಿ ಪ್ರಿಲಿಮಿನರಿ ಡಿಕ್ರಿಗೆ ಮೂರರಿಂದ ಏಳು ವರ್ಷ. ಫೈನಲ್ ಡಿಕ್ರಿಗೆ ಇನ್ನೂ ಕೆಲವು ವರ್ಷ. ಮೇಲ್ಮನವಿ ಹೋದ್ರೆ ಇನ್ನೂ ಜಾಸ್ತಿ.
    tr: Nija hēḷtīni. Kaḷeda akṭōbar-nalli Karnāṭaka haikōrṭē ondu tīrpalli hēḷide — viḷambada paṭṭiyalli vibhāgada dāvegaḷu modala sthānadallive, eṣṭō sala daśakagaḷu hiḍiyutte anta. Namma rājyada jillā nyāyālayagaḷalli ondūvare lakṣakkū heccu vibhāgada dāvegaḷu bāki ive. Sāmānyavāgi prilimināri ḍikrige mūrarinda ēḷu varṣa. Phainal ḍikrige innū kelavu varṣa. Mēlmanavi hōdre innū jāsti.
    en: I'll tell you honestly. Last October the Karnataka High Court itself said in a judgment that partition suits top the list for delay and often take decades. In our state's district courts more than one and a half lakh partition suits are pending. Usually three to seven years to the preliminary decree. A few more years for the final decree. Longer still if there's an appeal.
  - who: shobha
    t: ದಶಕಗಳು… ಆಗ ಅವ್ವ…
    tr: Daśakagaḷu… āga avva…
    en: Decades… by then Avva…
  - who: lawyer
    t: 'ಅದಕ್ಕೇ ಎಲ್ಲಾ ಕಕ್ಷಿದಾರರಿಗೂ ನಾನು ಹೇಳೋದು: ದಾವೆ ಹಾಕೋದು ಒಂದು ಬಾಗಿಲು ತೆಗೆಯೋದು, ರಾಜಿಯ ಬಾಗಿಲು ಮುಚ್ಚೋದಲ್ಲ. ಕೋರ್ಟೇ ಮಧ್ಯಸ್ಥಿಕೆ ಕೇಂದ್ರಕ್ಕೆ ಕಳಿಸಬಹುದು. ಲೋಕ ಅದಾಲತ್‌ನಲ್ಲಿ ರಾಜಿ ಆದ್ರೆ ಅದಕ್ಕೆ ಡಿಕ್ರಿಯಷ್ಟೇ ಬಲ, ಮೇಲ್ಮನವಿ ಇಲ್ಲ, ಕೋರ್ಟ್ ಶುಲ್ಕವೂ ವಾಪಸ್. ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದ ವಕೀಲಿಕೆಯಲ್ಲಿ, ಸಮನ್ಸ್ ಬಂದ ಮೇಲೇ ಮೊದಲ ಸಲ ಗಂಭೀರವಾಗಿ ಮಾತಾಡೋಕೆ ಕೂತ ಎಷ್ಟೋ ಕುಟುಂಬಗಳನ್ನ ನೋಡಿದೀನಿ.'
    tr: 'Adakkē ellā kakṣidārarigū nānu hēḷōdu: dāve hākōdu ondu bāgilu tegeyōdu, rājiya bāgilu muccōdalla. Kōrṭē madhyasthike kēndrakke kaḷisabahudu. Lōka Adālat-nalli rāji ādre adakke ḍikriyaṣṭē bala, mēlmanavi illa, kōrṭ śulkavū vāpas. Ippatteraḍu varṣada vakīlikeyalli, samans banda mēlē modala sala gambhīravāgi mātāḍōke kūta eṣṭō kuṭumbagaḷanna nōḍidīni.'
    en: 'That''s why I tell every client: filing a suit opens one door; it doesn''t shut the door to compromise. The court itself may send the case to the mediation centre. A settlement at a Lok Adalat has the force of a decree, there''s no appeal, and the court fee is refunded. In twenty-two years of practice I''ve seen many families sit down to talk seriously for the first time only after the summons arrived.'
  - who: shobha
    t: ಇನ್ನೊಂದು ಸಾರ್. ನನ್ನ ಯಜಮಾನ್ರು ಒಬ್ಬ ಬ್ರೋಕರ್‌ಗೆ ಫೋನ್ ಮಾಡಿ ರೇಟ್ ಕೇಳಿದ್ರು — ನನಗೆ ಗೊತ್ತಿಲ್ಲದೆ. ಅವರಿಗೆ ಸರಿಯಾಗಿ ಹೇಳಿದೀನಿ. ಆದರೆ ಈಗ ನನ್ನ ತಮ್ಮ ನಾನು ಮಾರೋಕೆ ಹೊರಟಿದೀನಿ ಅಂತ ನಂಬಿದಾನೆ.
    tr: Innondu sār. Nanna yajamānru obba brōkar-ge phōn māḍi rēṭ kēḷidru — nanage gottillade. Avarige sariyāgi hēḷidīni. Ādare īga nanna tamma nānu mārōke horaṭidīni anta nambidāne.
    en: One more thing, sir. My husband phoned a broker and asked the rate — without my knowledge. I've given him a proper piece of my mind. But now my brother believes I'm out to sell.
  - who: lawyer
    t: ದಾವೆ ಬಾಕಿ ಇರುವಾಗ ಯಾರಾದ್ರೂ ಮಾರಿದ್ರೂ ಆ ಮಾರಾಟ ಕೋರ್ಟಿನ ತೀರ್ಪಿಗೆ ಒಳಪಟ್ಟಿರುತ್ತೆ. ಅದಕ್ಕೇ ಬ್ರೋಕರ್‌ಗಳು ವಿವಾದದ ಜಮೀನು ಮುಟ್ಟಲ್ಲ. ಬೇಕಾದ್ರೆ ಯಾರೂ ಮಾರಬಾರದು ಅಂತ ತಾತ್ಕಾಲಿಕ ತಡೆಯಾಜ್ಞೆಗೂ ಅರ್ಜಿ ಹಾಕಬಹುದು.
    tr: Dāve bāki iruvāga yārādrū māridrū ā mārāṭa kōrṭina tīrpige oḷapaṭṭirutte. Adakkē brōkar-gaḷu vivādada jamīnu muṭṭalla. Bēkādre yārū mārabāradu anta tātkālika taḍeyājñegū arji hākabahudu.
    en: While a suit is pending, even if someone sells, the sale is subject to the court's final judgment. That's exactly why brokers won't touch disputed land. If you want, we can also apply for a temporary injunction so that nobody sells.
  - who: shobha
    t: ಬೇಡ ಸಾರ್. ತಡೆಯಾಜ್ಞೆ ಅಂದ್ರೆ ಊರಲ್ಲಿ ‘ಅಕ್ಕ ತಮ್ಮನ ಕೈ ಕಟ್ಟಿದ್ಲು’ ಅಂತಾರೆ. ನಾನು ಅವನ ಕೈ ಕಟ್ಟೋಕೆ ಬಂದಿಲ್ಲ. ಪಾಲು ಮಾತ್ರ ಕೇಳ್ತಿದೀನಿ.
    tr: Bēḍa sār. Taḍeyājñe andre ūralli ‘akka tammana kai kaṭṭidlu’ antāre. Nānu avana kai kaṭṭōke bandilla. Pālu mātra kēḷtidīni.
    en: No, sir. An injunction, and the village will say 'the sister tied her brother's hands.' I haven't come to tie his hands. I'm only asking for my share.
  - who: lawyer
    t: ಸರಿ, ನಿಮ್ಮಿಷ್ಟ. ಹಾಗಾದ್ರೆ ಈ ವಕಾಲತ್ತಿಗೆ ಸಹಿ ಮಾಡಿ — ಅಂದ್ರೆ ನಿಮ್ಮ ಪರವಾಗಿ ನಾನು ವಾದಿಸೋಕೆ ನೀವು ಕೊಡೋ ಅಧಿಕಾರ. ಮತ್ತೆ ವಾದಪತ್ರದ ಕೊನೆಯ ಈ ದೃಢೀಕರಣ — ‘ಇಲ್ಲಿ ಬರೆದಿರುವುದು ನನ್ನ ತಿಳಿವಳಿಕೆಯಂತೆ ಸತ್ಯ’ — ಇದನ್ನ ಓದಿ, ಅರ್ಥ ಮಾಡ್ಕೊಂಡು ಸಹಿ ಹಾಕಿ. ಸೋಮವಾರ ಫೈಲ್ ಮಾಡ್ತೀನಿ.
    tr: Sari, nimmiṣṭa. Hāgādre ī vakālattige sahi māḍi — andre nimma paravāgi nānu vādisōke nīvu koḍō adhikāra. Matte vādapatrada koneya ī dṛḍhīkaraṇa — ‘illi barediruvudu nanna tiḷivaḷikeyante satya’ — idanna ōdi, artha māḍkoṇḍu sahi hāki. Sōmavāra phail māḍtīni.
    en: All right, as you wish. Then sign this vakalath — the authority you give me to argue on your behalf. And this verification at the end of the plaint — 'What is written here is true to the best of my knowledge' — read it, make sure you understand it, and sign. I'll file it on Monday.
  - scene: Shobha holds the pen over the paper. Then she puts it down, takes out her phone, steps to the doorway and calls Suresh.
  - who: shobha
    t: ಅಣ್ಣ… ನಾನು ವಕೀಲರ ಆಫೀಸಲ್ಲಿದೀನಿ. ಸಹಿ ಹಾಕೋಕೆ ಮುಂಚೆ ನಿನಗೆ ಹೇಳ್ಬೇಕು ಅನ್ನಿಸ್ತು. ದಾವೆಯಲ್ಲಿ ನಿನ್ನ ಹೆಸರೂ, ಅವ್ವನ ಹೆಸರೂ ಪ್ರತಿವಾದಿಗಳಾಗಿ ಬರುತ್ತೆ.
    tr: Aṇṇa… nānu vakīlara āphīsallidīni. Sahi hākōke mun̄ce ninage hēḷbēku annistu. Dāveyalli ninna hesarū, avvana hesarū prativādigaḷāgi barutte.
    en: Anna… I'm at the lawyer's office. Before I sign, I felt I had to tell you. In the suit, your name and Avva's name will go in as defendants too.
  - who: suresh
    t: 'ಶೋಭಾ, ನಾನು ನಿನ್ನ ತಡೆಯಲ್ಲ. ಹದಿನಾರು ವರ್ಷದ ಹಿಂದೆ ನಿನ್ನ ಮಾತು ಕೇಳ್ಲಿಲ್ಲ; ಈಗ ನಿನ್ನ ಹಕ್ಕನ್ನ ತಡೆಯೋ ಅಧಿಕಾರ ನನಗಿಲ್ಲ. ಒಂದೇ ಕೇಳ್ಕೊಳ್ತೀನಿ: ಕೋರ್ಟಲ್ಲಿ ಏನೇ ಆದ್ರೂ ಅವ್ವನ ಮನೆ ಬಾಗಿಲು ನಿನಗೆ ಮುಚ್ಚಿಕೊಳ್ಳಬಾರದು. ನಾನು ಎರಡೂ ಕಡೆ ಬಾಗಿಲು ತೆಗೆದಿಟ್ಟಿರ್ತೀನಿ.'
    tr: 'Śōbhā, nānu ninna taḍeyalla. Hadināru varṣada hinde ninna mātu kēḷlilla; īga ninna hakkanna taḍeyō adhikāra nanagilla. Ondē kēḷkoḷḷtīni: kōrṭalli ēnē ādrū avvana mane bāgilu ninage muccikoḷḷabāradu. Nānu eraḍū kaḍe bāgilu tegediṭṭirtīni.'
    en: '(on the phone, after a long silence) Shobha, I won''t stop you. Sixteen years ago I didn''t listen to you; now I have no right to stand in the way of your right. I ask only one thing: whatever happens in court, Avva''s door must never close on you. I''ll keep the doors open on both sides.'
  - who: shobha
    t: ಅದೇ ಸಾಕು ಅಣ್ಣ. … ಎಲ್ಲಿ ಸಹಿ ಹಾಕ್ಬೇಕು ಸಾರ್?
    tr: Adē sāku aṇṇa. … Elli sahi hākbēku sār?
    en: That's enough, Anna. … (to the lawyer) Where do I sign, sir?
  - section: The summons
    learn: 'a summons read aloud (formal written Kannada): ī mūlaka tiḷisuvudēnendare, mēlkaṇḍa dāve, khuddāgi, hājarāgatakkaddu, tappidalli, gairuhājari, ēkapakṣīyavāgi vicāraṇe māḍalāguvudu · shock: nan mēlē kēs hākidlā? · free legal aid for women: tālūku kānūnu sēvegaḷa samiti, ucitavāgi · bitter irony: kāgadakke mātra bele anta kalisiddu nīvē'
  - scene: Tuesday, 28 April 2026, late afternoon. A process server from the Maddur court has come on a moped and left three envelopes at the house, taking Avva's thumbprint and Mahadeva's signature in his register. Mahadeva sits on the veranda step and tears one open. Avva stands behind him. Suresh is on the phone from Bengaluru, on speaker.
  - who: avva
    t: ಏನಪ್ಪ ಅದು? ಸರ್ಕಾರದ ಮುದ್ರೆ ಇದೆ. ಹೊಸ ಪಹಣಿನಾ?
    tr: Ēnappa adu? Sarkārada mudre ide. Hosa pahaṇinā?
    en: What is it, son? It has a government seal. Is it the new RTC?
  - who: mahadeva
    t: 'ಪಹಣಿ ಅಲ್ಲ ಅವ್ವ. ಕೋರ್ಟಿಂದ ಸಮನ್ಸ್. ಕೇಳು, ಓದ್ತೀನಿ: ‘ಸಿವಿಲ್ ನ್ಯಾಯಾಧೀಶರ ಮತ್ತು ಜೆಎಂಎಫ್‌ಸಿ ನ್ಯಾಯಾಲಯ, ಮದ್ದೂರು. ಮೂಲ ದಾವೆ. ವಾದಿ: ಶೋಭಾ, ಚನ್ನೇಗೌಡರ ಮಗಳು. ಪ್ರತಿವಾದಿಗಳು: ಒಂದು, ಪುಟ್ಟಮ್ಮ…’'
    tr: 'Pahaṇi alla avva. Kōrṭinda samans. Kēḷu, ōdtīni: ‘Sivil nyāyādhīśara mattu je-em-eph-si nyāyālaya, Maddūru. Mūla dāve. Vādi: Śōbhā, Cannēgauḍara magaḷu. Prativādigaḷu: ondu, Puṭṭamma…’'
    en: 'It''s not the RTC, Avva. It''s a summons from the court. Listen, I''ll read it: ''Court of the Civil Judge and JMFC, Maddur. Original Suit. Plaintiff: Shobha, daughter of Channegowda. Defendants: one, Puttamma…'''
  - who: avva
    t: ನಾನು? ನನ್ ಹೆಸರಾ? ನನ್ ಮಗಳು… ನನ್ ಮೇಲೇ ಕೇಸ್ ಹಾಕಿದ್ಲಾ?
    tr: Nānu? Nan hesarā? Nan magaḷu… nan mēlē kēs hākidlā?
    en: Me? My name? My daughter… has filed a case against me?
  - who: suresh
    t: ಅವ್ವ, ಹಂಗಲ್ಲ. ಕೇಳು. ಪಾಲಿನ ಕೇಸಲ್ಲಿ ಜಮೀನಲ್ಲಿ ಹೆಸರಿರೋ ಎಲ್ಲರನ್ನೂ ಸೇರಿಸ್ಲೇಬೇಕು ಅನ್ನೋ ನಿಯಮ ಇದೆ. ನನ್ ಹೆಸರೂ ಇದೆ. ದಾವೆಯಲ್ಲೇ ಬರೆದಿದಾರೆ — ‘ಒಂದನೇ ಪ್ರತಿವಾದಿಯ ವಿರುದ್ಧ ಯಾವ ಪರಿಹಾರವೂ ಕೇಳಿಲ್ಲ’ ಅಂತ. ಶೋಭಾ ಸಹಿ ಹಾಕೋ ಮುಂಚೆ ನನಗೆ ಫೋನ್ ಮಾಡಿ ಹೇಳಿದ್ಲು.
    tr: Avva, haṅgalla. Kēḷu. Pālina kēsalli jamīnalli hesarirō ellarannū sērislēbēku annō niyama ide. Nan hesarū ide. Dāveyallē baredidāre — ‘ondanē prativādiya viruddha yāva parihāravū kēḷilla’ anta. Śōbhā sahi hākō mun̄ce nanage phōn māḍi hēḷidlu.
    en: (on speaker) Avva, it's not like that. Listen. There's a rule that in a partition case everyone whose name is on the land has to be included. My name's there too. It's written in the plaint itself — 'no relief is sought against the first defendant.' Shobha phoned and told me before she signed.
  - who: mahadeva
    t: ನಿನಗೆ ಮೊದಲೇ ಗೊತ್ತಿತ್ತಾ ಅಣ್ಣ? ಗೊತ್ತಿದ್ದೂ ಹೇಳ್ಲಿಲ್ಲ?
    tr: Ninage modalē gottittā aṇṇa? Gottiddū hēḷlilla?
    en: You knew beforehand, Anna? You knew and didn't tell me?
  - who: suresh
    t: ಹೇಳೋಕೆ ಮೂರು ಸಲ ಫೋನ್ ಮಾಡಿದೆ, ಮಹದೇವ. ನೀನು ಒಂದೂ ಎತ್ತಲಿಲ್ಲ. ಮೆಸೇಜ್‌ಗೂ ಉತ್ತರ ಇಲ್ಲ.
    tr: Hēḷōke mūru sala phōn māḍide, Mahadēva. Nīnu ondū ettalilla. Mesēj-gū uttara illa.
    en: I phoned you three times to tell you, Mahadeva. You didn't pick up once. No reply to my message either.
  - who: mahadeva
    t: ‘…ಈ ಮೂಲಕ ನಿಮಗೆ ತಿಳಿಸುವುದೇನೆಂದರೆ, ಮೇಲ್ಕಂಡ ದಾವೆಗೆ ಉತ್ತರ ನೀಡಲು ದಿನಾಂಕ ಇಪ್ಪತ್ತು ಮೇ, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರರಂದು ಬೆಳಿಗ್ಗೆ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ಖುದ್ದಾಗಿ ಅಥವಾ ವಕೀಲರ ಮೂಲಕ ಹಾಜರಾಗತಕ್ಕದ್ದು. ತಪ್ಪಿದಲ್ಲಿ ನಿಮ್ಮ ಗೈರುಹಾಜರಿಯಲ್ಲಿ ದಾವೆಯನ್ನು ಏಕಪಕ್ಷೀಯವಾಗಿ ವಿಚಾರಣೆ ಮಾಡಲಾಗುವುದು.’
    tr: ‘…Ī mūlaka nimage tiḷisuvudēnendare, mēlkaṇḍa dāvege uttara nīḍalu dināṅka ippattu Mē, eraḍu sāvirada ippattārarandu beḷigge hannondu gaṇṭege khuddāgi athavā vakīlara mūlaka hājarāgatakkaddu. Tappidalli nimma gairuhājariyalli dāveyannu ēkapakṣīyavāgi vicāraṇe māḍalāguvudu.’
    en: (saying nothing, then reading on) '…You are hereby informed that you shall appear in person or through an advocate on the twentieth of May, two thousand and twenty-six, at eleven in the morning, to answer the above suit. Failing which, the suit will be heard ex parte in your absence.'
  - who: avva
    t: ಏಕ… ಪಕ್ಷೀಯ? ಅಂಗಂದ್ರೆ ಏನಪ್ಪ?
    tr: Ēka… pakṣīya? Aṅgandre ēnappa?
    en: Ex… parte? What does that mean, son?
  - who: suresh
    t: ನಾವು ಹೋಗದಿದ್ರೆ ನಾವಿಲ್ಲದೇನೇ ಕೇಸ್ ನಡೆಸ್ತಾರೆ ಅಂತ, ಅವ್ವ. ಅದಕ್ಕೇ ಹೋಗ್ಲೇಬೇಕು. ಆದ್ರೆ ನೀನು ಹೆದರಬೇಡ. ಮದ್ದೂರು ಕೋರ್ಟಲ್ಲೇ ತಾಲೂಕು ಕಾನೂನು ಸೇವೆಗಳ ಸಮಿತಿ ಅಂತ ಇದೆ. ಹೆಂಗಸರಿಗೆ ಉಚಿತವಾಗಿ ವಕೀಲರನ್ನ ಕೊಡ್ತಾರೆ. ನಿನಗೆ ಅವರ ಮೂಲಕ ಒಬ್ಬ ವಕೀಲರು ಸಿಗ್ತಾರೆ, ಒಂದು ರೂಪಾಯಿ ಖರ್ಚಿಲ್ಲ.
    tr: Nāvu hōgadidre nāvilladēnē kēs naḍestāre anta, avva. Adakkē hōglēbēku. Ādre nīnu hedarabēḍa. Maddūru kōrṭallē tālūku kānūnu sēvegaḷa samiti anta ide. Heṅgasarige ucitavāgi vakīlaranna koḍtāre. Ninage avara mūlaka obba vakīlaru sigtāre, ondu rūpāyi kharcilla.
    en: It means if we don't go, they'll run the case without us, Avva. That's why we must go. But don't be afraid. Right there in the Maddur court there's the Taluk Legal Services Committee. They give women a lawyer free of charge. You'll get a lawyer through them; it won't cost a rupee.
  - who: avva
    t: ಐವತ್ತೆರಡು ವರ್ಷ ಸಂಸಾರ ಮಾಡಿ, ಎಪ್ಪತ್ತನೇ ವಯಸ್ಸಲ್ಲಿ ನನಗೊಬ್ಬ ವಕೀಲ… ನನ್ ಮಗಳ ವಿರುದ್ಧ ಅಲ್ಲ, ನನ್ ಮಗನ ವಿರುದ್ಧಾನೂ ಅಲ್ಲ. ಹಂಗಾದ್ರೆ ಆ ವಕೀಲ ಯಾರ ಪರವಾಗಿ ಮಾತಾಡ್ತಾನೆ?
    tr: Aivatteraḍu varṣa saṁsāra māḍi, eppattanē vayassalli nanagobba vakīla… nan magaḷa viruddha alla, nan magana viruddhānū alla. Haṅgādre ā vakīla yāra paravāgi mātāḍtāne?
    en: Fifty-two years of married life, and at seventy I get a lawyer of my own… not against my daughter, not against my son either. Then on whose side will that lawyer speak?
  - who: suresh
    t: ನಿನ್ನ ಪರವಾಗಿ, ಅವ್ವ. ನಿನ್ನ ಪಾಲಿನ ಪರವಾಗಿ. ಮತ್ತೆ ನಿನ್ನ ಆಸೆಯ ಪರವಾಗಿ — ಮನೆ ಒಡೀಬಾರ್ದು ಅನ್ನೋ ಆಸೆ.
    tr: Ninna paravāgi, avva. Ninna pālina paravāgi. Matte ninna āseya paravāgi — mane oḍībārdu annō āse.
    en: On yours, Avva. On behalf of your share. And on behalf of your wish — the wish that the house mustn't break.
  - who: mahadeva
    t: 'ನಾನೂ ಸುಮ್ನೆ ಕೂತಿಲ್ಲ. ಅವಳು ವಕೀಲರ ಮಾತಾಡಿದ ದಿನಾನೇ ಮಂಡ್ಯದಲ್ಲಿ ಒಬ್ಬ ವಕೀಲರನ್ನ ನೋಡಿದ್ದೆ. ಅವರು ಹೇಳಿದಾರೆ: ಲಿಖಿತ ಹೇಳಿಕೆ ಜೊತೆ ತಡೆಯಾಜ್ಞೆಗೆ ಅರ್ಜಿ ಹಾಕೋಣ — ಕೇಸ್ ಮುಗಿಯೋವರೆಗೆ ಯಾರೂ ಜಮೀನು ಮಾರಬಾರದು, ನಾನು ಮಾಡ್ತಿರೋ ಬೇಸಾಯಕ್ಕೆ ಯಾರೂ ಅಡ್ಡಿ ಮಾಡಬಾರದು ಅಂತ.'
    tr: 'Nānū sumne kūtilla. Avaḷu vakīlara mātāḍida dinānē Maṇḍyadalli obba vakīlaranna nōḍidde. Avaru hēḷidāre: likhita hēḷike jote taḍeyājñege arji hākōṇa — kēs mugiyōvarege yārū jamīnu mārabāradu, nānu māḍtirō bēsāyakke yārū aḍḍi māḍabāradu anta.'
    en: 'I haven''t been sitting idle either. The very day she talked of a lawyer, I''d gone and seen one in Mandya. He says: along with the written statement, let''s apply for an injunction — that until the case ends nobody may sell the land, and nobody may obstruct the farming I''m doing.'
  - who: suresh
    t: ಯಾರೂ ಮಾರೋಕೆ ಹೊರಟಿಲ್ಲ, ಮಹದೇವ. ಶೋಭಾನೇ ತಡೆಯಾಜ್ಞೆ ಬೇಡ ಅಂದ್ಲಂತೆ — ‘ತಮ್ಮನ ಕೈ ಕಟ್ಟೋಕೆ ಬಂದಿಲ್ಲ’ ಅಂತ.
    tr: Yārū mārōke horaṭilla, Mahadēva. Śōbhānē taḍeyājñe bēḍa andlante — ‘tammana kai kaṭṭōke bandilla’ anta.
    en: Nobody's out to sell, Mahadeva. Shobha herself turned down an injunction, I'm told — 'I haven't come to tie my brother's hands,' she said.
  - who: mahadeva
    t: ಬಾಯಿಮಾತು, ಅಣ್ಣ. ಬಾಯಿಮಾತಿಗೆ ಬೆಲೆ ಇಲ್ಲ, ಕಾಗದಕ್ಕೆ ಮಾತ್ರ ಬೆಲೆ ಅಂತ ನನಗೆ ಕಲಿಸಿದ್ದು ನೀವೇ — ತಹಸೀಲ್ದಾರ್ ಕಚೇರೀಲಿ. ಈಗ ನಾನೂ ಕಾಗದ ಮಾಡಿಸ್ಕೋತೀನಿ.
    tr: Bāyimātu, aṇṇa. Bāyimātige bele illa, kāgadakke mātra bele anta nanage kalisiddu nīvē — tahasīldār kacērīli. Īga nānū kāgada māḍiskōtīni.
    en: Word of mouth, Anna. It was all of you who taught me — in the Tahsildar's office — that word of mouth is worth nothing and only paper counts. Now I'll get myself some paper too.
  - who: avva
    t: ಕಾಗದ, ಕಾಗದ, ಕಾಗದ… ಈ ಮನೇಲಿ ಮನುಷ್ಯರಿಗಿಂತ ಕಾಗದ ಜಾಸ್ತಿ ಆಯ್ತು.
    tr: Kāgada, kāgada, kāgada… ī manēli manuṣyariginta kāgada jāsti āytu.
    en: (sitting down heavily on the step) Paper, paper, paper… in this house there's more paper now than people.
  - who: suresh
    t: ಅವ್ವ, ಇಪ್ಪತ್ತನೇ ತಾರೀಖು ರಜೆ ಹಾಕಿ ಬರ್ತೀನಿ. ನಿನ್ನ ಕೈ ಹಿಡ್ಕೊಂಡು ಕೋರ್ಟಿಗೆ ನಾನೇ ಕರ್ಕೊಂಡು ಹೋಗ್ತೀನಿ.
    tr: Avva, ippattanē tārīkhu raje hāki bartīni. Ninna kai hiḍkoṇḍu kōrṭige nānē karkoṇḍu hōgtīni.
    en: Avva, I'll take leave on the twentieth and come. I'll hold your hand and take you to court myself.
  - who: avva
    t: ಮೆಟ್ಟಿಲು ಹತ್ತೋವಾಗ ಕೈ ಬಿಡ್ಬೇಡ ಕಣಪ್ಪ. ನಮ್ಮ ಮನೆತನದಲ್ಲಿ ಮೊದಲ ಸಲ ಕೋರ್ಟು ಮೆಟ್ಟಿಲು ಹತ್ತೋಳು ನಾನೇ ಆಗ್ತೀನಿ ಅಂತ ಕನಸಲ್ಲೂ ಅಂದ್ಕೊಂಡಿರ್ಲಿಲ್ಲ.
    tr: Meṭṭilu hattōvāga kai biḍbēḍa kaṇappa. Namma manetanadalli modala sala kōrṭu meṭṭilu hattōḷu nānē āgtīni anta kanasallū andkoṇḍirlilla.
    en: Don't let go of my hand on the steps, son. I never dreamed that the first one in our family to climb the steps of a court would be me.
  - section: Night calls
    learn: 'a mother on the phone: ūṭa āytā modlu hēḷu, aḷbēḍa · sad vs angry: bējāride, kōpa illa · counterfactual regret: gottiddidre … biḍtirlilla · reported habitual speech: … antidru · a son''s fear: nanage ēnu uḷiyutte? · identity: gurutu koḍōdu kāgada alla'
  - scene: The same night. Avva cannot sleep. She asks Mahadeva to dial Shobha's number for her; he does it without a word, hands her the phone and walks out to the cattle shed.
  - who: shobha
    t: ಅವ್ವ? ಇಷ್ಟು ರಾತ್ರೀಲಿ… ಸಮನ್ಸ್ ಬಂತಾ?
    tr: Avva? Iṣṭu rātrīli… samans bantā?
    en: Avva? At this time of night… has the summons come?
  - who: avva
    t: ಬಂತು ಕಣವ್ವ. ಊಟ ಆಯ್ತಾ, ಮೊದ್ಲು ಅದು ಹೇಳು.
    tr: Bantu kaṇavva. Ūṭa āytā, modlu adu hēḷu.
    en: It's come, my girl. Have you eaten? Tell me that first.
  - who: shobha
    t: ಅವ್ವ, ನಿನ್ನ ಹೆಸರು ಹಾಕೋದು ನನಗೂ ಇಷ್ಟ ಇರ್ಲಿಲ್ಲ. ವಕೀಲರು ಕಾನೂನು ಅಂದ್ರು. ನಾನು ನಿನ್ನ ವಿರುದ್ಧ ಅಲ್ಲ, ಆಣೆ.
    tr: Avva, ninna hesaru hākōdu nanagū iṣṭa irlilla. Vakīlaru kānūnu andru. Nānu ninna viruddha alla, āṇe.
    en: (crying) Avva, I didn't want your name in it either. The lawyer said it's the law. I'm not against you, I swear.
  - who: avva
    t: ಅಳ್ಬೇಡ. ನಿನ್ ಮೇಲೆ ನಂಗೆ ಕೋಪ ಇಲ್ಲ. ಬೇಜಾರಿದೆ, ಕೋಪ ಇಲ್ಲ. ಎರಡಕ್ಕೂ ವ್ಯತ್ಯಾಸ ಇದೆ ಕಣವ್ವ.
    tr: Aḷbēḍa. Nin mēle naṅge kōpa illa. Bējāride, kōpa illa. Eraḍakkū vyatyāsa ide kaṇavva.
    en: Don't cry. I'm not angry with you. I'm sad, not angry. There's a difference between the two, my girl.
  - who: shobha
    t: ಅವ್ವ, ನಿಂಗೊಂದು ಗೊತ್ತಾ? ಅಪ್ಪ ಸಾಲ ಮಾಡಿ ನನ್ನ ಮದುವೆ ಮಾಡಿದ್ದು ನನಗೆ ಡಿಸೆಂಬರ್‌ನಲ್ಲೇ ಗೊತ್ತಾಗಿದ್ದು. ಗೊತ್ತಿದ್ದಿದ್ರೆ ಅವತ್ತು ಅಷ್ಟು ಖರ್ಚು ಮಾಡೋಕೆ ಬಿಡ್ತಿರ್ಲಿಲ್ಲ. ಎಲ್ರೂ ನನ್ನಿಂದ ಮುಚ್ಚಿಟ್ಟರು — ಸಾಲಾನೂ, ಕಷ್ಟಾನೂ. ಈಗ ಆ ಮುಚ್ಚಿಟ್ಟಿದ್ದೇ ನನ್ನ ಪಾಲು ಅಂತಾರೆ.
    tr: Avva, niṅgondu gottā? Appa sāla māḍi nanna maduve māḍiddu nanage Ḍisembar-nallē gottāgiddu. Gottiddidre avattu aṣṭu kharcu māḍōke biḍtirlilla. Ellrū nanninda mucciṭṭaru — sālānū, kaṣṭānū. Īga ā mucciṭṭiddē nanna pālu antāre.
    en: Avva, do you know something? I only found out in December that Appa borrowed to pay for my wedding. If I'd known, I'd never have let you spend that much back then. Everyone hid it from me — the debt and the hardship. And now they say the very thing they hid from me was my share.
  - who: avva
    t: ಮುಚ್ಚಿಟ್ಟಿದ್ದು ನಿಮ್ಮಪ್ಪನ ಹಠ ಕಣವ್ವ, ನಿನ್ನ ತಪ್ಪಲ್ಲ. ‘ತವರು ಮಗಳಿಗೆ ನೆರಳಾಗ್ಬೇಕು, ಭಾರ ಆಗ್ಬಾರ್ದು’ ಅಂತಿದ್ರು. … ಇಪ್ಪತ್ತನೇ ತಾರೀಖು ಕೋರ್ಟಿಗೆ ಬರ್ತೀಯಲ್ಲ? ಬಂದಾಗ ನನ್ ಪಕ್ಕ ಕೂರು. ನೀನು ಆ ಕಡೆ, ನಾನು ಈ ಕಡೆ ಅನ್ನೋದು ಕಾಗದದಲ್ಲಿರ್ಲಿ. ಬೆಂಚಿನ ಮೇಲೆ ಬೇಡ.
    tr: Mucciṭṭiddu nimmappana haṭha kaṇavva, ninna tappalla. ‘Tavaru magaḷige neraḷāgbēku, bhāra āgbārdu’ antidru. … Ippattanē tārīkhu kōrṭige bartīyalla? Bandāga nan pakka kūru. Nīnu ā kaḍe, nānu ī kaḍe annōdu kāgadadallirli. Beṇcina mēle bēḍa.
    en: Hiding it was your father's stubbornness, my girl, not your fault. He used to say, 'A daughter's parents' home must be a shade for her, never a burden.' … You're coming to court on the twentieth, aren't you? When you come, sit beside me. Let 'you on that side, me on this' stay on paper. Not on the bench.
  - who: shobha
    t: ಪ್ರಯತ್ನ ಮಾಡ್ತೀನಿ ಅವ್ವ.
    tr: Prayatna māḍtīni avva.
    en: I'll try, Avva.
  - scene: Avva goes out to the cattle shed. A single bulb hangs over the two cows and the calf. Mahadeva sits on an upturned bucket.
  - who: avva
    t: ಇಲ್ಲಿ ಯಾಕೆ ಕೂತಿದೀಯಪ್ಪ? ದನಗಳ ಜೊತೆ ಮಾತಾಡ್ತಿದೀಯಾ?
    tr: Illi yāke kūtidīyappa? Danagaḷa jote mātāḍtidīyā?
    en: Why are you sitting out here, son? Talking to the cows?
  - who: mahadeva
    t: ದನಗಳು ಕೋರ್ಟಿಗೆ ಹೋಗಲ್ಲ ಅವ್ವ. … ಅವ್ವ, ಕೇಸ್ ನಡೆದು ಗದ್ದೆ ನಾಲ್ಕು ತುಂಡಾದ್ರೆ ನನಗೆ ಏನು ಉಳಿಯುತ್ತೆ? ಒಂದು ಪಟ್ಟಿ ಜಮೀನು, ಎರಡು ದನ, ಮತ್ತೆ ‘ತಂಗಿ ಜೊತೆ ಕೋರ್ಟಲ್ಲಿ ಜಗಳ ಆಡಿದೋನು’ ಅನ್ನೋ ಹೆಸರು. ಅಣ್ಣನಿಗೆ ಬ್ಯಾಂಕ್ ಇದೆ, ಅವಳಿಗೆ ಆಸ್ಪತ್ರೆ ಇದೆ. ನನಗೆ ಇರೋದು ಇದೊಂದೇ.
    tr: Danagaḷu kōrṭige hōgalla avva. … Avva, kēs naḍedu gadde nālku tuṇḍādre nanage ēnu uḷiyutte? Ondu paṭṭi jamīnu, eraḍu dana, matte ‘taṅgi jote kōrṭalli jagaḷa āḍidōnu’ annō hesaru. Aṇṇanige byāṅk ide, avaḷige āspatre ide. Nanage irōdu idondē.
    en: Cows don't go to court, Avva. … Avva, if the case goes on and the wet land is cut into four, what's left for me? A strip of land, two cows, and the name of 'the man who fought his sister in court'. Anna has his bank, she has her hospital. All I have is this.
  - who: avva
    t: ಮಹದೇವ, ನಾನು ಹದಿನೆಂಟನೇ ವಯಸ್ಸಲ್ಲಿ ಈ ಮನೆಗೆ ಬಂದಾಗ ನನ್ ಕೈಲಿ ಒಂದು ಟ್ರಂಕು, ಎರಡು ಸೀರೆ ಬಿಟ್ರೆ ಏನೂ ಇರ್ಲಿಲ್ಲ. ಜಮೀನು ನನ್ ಹೆಸರಿಗೆ ಬಂದಿದ್ದು ಮೊನ್ನೆ. ಆದ್ರೂ ಐವತ್ತೆರಡು ವರ್ಷದಲ್ಲಿ ನಾನು ಈ ಮನೆಯೋಳಲ್ಲ ಅಂತ ಒಂದ್ಸಲಾನೂ ಅನ್ಸಲಿಲ್ಲ. ಯಾಕೆ ಗೊತ್ತಾ? ಮನುಷ್ಯನಿಗೆ ಗುರುತು ಕೊಡೋದು ಕಾಗದ ಅಲ್ಲ ಕಣಪ್ಪ. ಅವನು ಮಾಡೋ ಕೆಲಸ, ಅವನು ಪ್ರೀತಿಸೋ ಜನ.
    tr: Mahadēva, nānu hadineṇṭanē vayassalli ī manege bandāga nan kaili ondu ṭraṅku, eraḍu sīre biṭre ēnū irlilla. Jamīnu nan hesarige bandiddu monne. Ādrū aivatteraḍu varṣadalli nānu ī maneyōḷalla anta ondsalānū ansalilla. Yāke gottā? Manuṣyanige gurutu koḍōdu kāgada alla kaṇappa. Avanu māḍō kelasa, avanu prītisō jana.
    en: Mahadeva, when I came into this house at eighteen, apart from a trunk and two saris I had nothing in my hands. The land came into my name only the other day. And yet in fifty-two years I never once felt I didn't belong to this house. Do you know why? What gives a person their identity isn't paper, son. It's the work they do and the people they love.
  - who: mahadeva
    t: … ನಿನ್ನ ಹಂಗೆ ಯೋಚನೆ ಮಾಡೋಕೆ ನನಗೆ ಇನ್ನೂ ಐವತ್ತು ವರ್ಷ ಬೇಕು ಅವ್ವ. ಹೋಗಿ ಮಲ್ಕೋ. ನಾನು ಕರುಗೆ ಹುಲ್ಲು ಹಾಕಿ ಬರ್ತೀನಿ.
    tr: … Ninna haṅge yōcane māḍōke nanage innū aivattu varṣa bēku avva. Hōgi malkō. Nānu karuge hullu hāki bartīni.
    en: … To think the way you do, I'll need another fifty years, Avva. Go and sleep. I'll give the calf some hay and come in.
  - section: The corridor
    learn: 'the silence: grūp biṭṭu hōdaru, phōn ettalla, mātē nintōytu · a hearing explained: madhyantara ādēśa, yathāsthiti kāpāḍabēku, māruvantilla, aḍaviḍuvantilla, aḍḍi māḍuvantilla · next date and written statements: mundina dināṅka, likhita hēḷike · a lawyer''s observation: ondē kāralli bartāre, eraḍu kāralli · Avva''s division: sama pālu, yāva ḍikrinū bēḍa · the diary echoed: nagtidrō, aḷtidrō'
  - scene: Tuesday night, 19 May 2026. The flat in Vijayanagar. Suresh sits with his phone; the family WhatsApp group, 'Bettahalli Mane', has been silent for three weeks. Meena is packing a bag for the morning; Rakshith leans in the doorway.
  - who: suresh
    t: ನೋಡು ಮೀನಾ. ‘ಬೆಟ್ಟಹಳ್ಳಿ ಮನೆ’ ಗ್ರೂಪ್. ಕೊನೆಯ ಮೆಸೇಜ್ ಏಪ್ರಿಲ್ ಇಪ್ಪತ್ತೆಂಟು — ‘ಶೋಭಾ ಗ್ರೂಪ್ ಬಿಟ್ಟು ಹೋದರು.’ ಅದಾದ ಮೇಲೆ ಒಂದು ‘ಗುಡ್ ಮಾರ್ನಿಂಗ್’ ಕೂಡ ಇಲ್ಲ.
    tr: Nōḍu Mīnā. ‘Beṭṭahaḷḷi Mane’ grūp. Koneya mesēj Ēpril ippatteṇṭu — ‘Śōbhā grūp biṭṭu hōdaru.’ Adāda mēle ondu ‘guḍ mārniṅg’ kūḍa illa.
    en: Look, Meena. The 'Bettahalli Mane' group. The last message is from the twenty-eighth of April — 'Shobha left the group.' Since then, not even a single 'good morning'.
  - who: meena
    t: ಮಹದೇವ ಫೋನ್ ಎತ್ತಿದ್ನಾ?
    tr: Mahadēva phōn ettidnā?
    en: Has Mahadeva picked up?
  - who: suresh
    t: 'ಅವ್ವನ ಆರೋಗ್ಯದ ಬಗ್ಗೆ ಕೇಳಿದ್ರೆ ಎರಡೇ ಮಾತು: ‘ಚೆನ್ನಾಗಿದಾಳೆ. ಇಡ್ತೀನಿ.’ ಶೋಭಾ ಮೆಸೇಜ್‌ಗೆ ಉತ್ತರ ಕೊಡ್ತಾಳೆ, ಆದ್ರೆ ಮಹದೇವನ ಹೆಸರು ಬಂದ ತಕ್ಷಣ ಮೌನ. ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಅಪ್ಪನ್ನ ಹೊರೋವಾಗ ನಾವಿಬ್ರೂ ಒಟ್ಟಿಗೆ ಹೆಗಲು ಕೊಟ್ವಿ, ಮೀನಾ. ಐದು ತಿಂಗಳಲ್ಲಿ ಮಾತೇ ನಿಂತೋಯ್ತು.'
    tr: 'Avvana ārōgyada bagge kēḷidre eraḍē mātu: ‘Cennāgidāḷe. Iḍtīni.’ Śōbhā mesēj-ge uttara koḍtāḷe, ādre Mahadēvana hesaru banda takṣaṇa mauna. Ḍisembar-nalli appanna horōvāga nāvibbrū oṭṭige hegalu koṭvi, Mīnā. Aidu tiṅgaḷalli mātē nintōytu.'
    en: 'Ask him about Avva''s health and you get exactly two phrases: ''She''s fine. Hanging up.'' Shobha replies to messages, but the moment Mahadeva''s name comes up — silence. In December the two of us carried Appa on our shoulders together, Meena. In five months, even talking has stopped.'
  - who: meena
    t: ನಾಳೆ ನಾನೂ ಬರ್ತೀನಿ. ಶಾಲೆಗೆ ಬೇಸಿಗೆ ರಜೆ. ನೀವು ಅವ್ವನ ಕೈ ಹಿಡ್ಕೊಳ್ಳಿ, ನಾನು ಶೋಭಾ ಪಕ್ಕ ಕೂರ್ತೀನಿ. ಯಾರಾದ್ರೂ ಒಬ್ರು ಅವಳ ಪಕ್ಕ ಇರ್ಬೇಕು.
    tr: Nāḷe nānū bartīni. Śālege bēsige raje. Nīvu avvana kai hiḍkoḷḷi, nānu Śōbhā pakka kūrtīni. Yārādrū obru avaḷa pakka irbēku.
    en: I'll come tomorrow too. School's on summer holiday. You hold Avva's hand; I'll sit next to Shobha. Somebody has to be beside her.
  - who: rakshith
    t: ಅಪ್ಪ, ನಾಳೆ ನಾನೂ ಬರ್ಲಾ? ಅಜ್ಜಿ ಜೊತೆ ಇರ್ತೀನಿ.
    tr: Appa, nāḷe nānū barlā? Ajji jote irtīni.
    en: Appa, can I come tomorrow too? I'll stay with Ajji.
  - who: suresh
    t: ಬೇಡ ಕಂದ. ನಾಳೆ ನಿನಗೆ ಬೇಸಿಗೆ ಕೋಚಿಂಗ್ ಕ್ಲಾಸ್ ಇದೆ. ಮತ್ತೆ… ಕೋರ್ಟ್ ಕಾರಿಡಾರು ಹದಿನೇಳು ವರ್ಷದವನು ನೋಡ್ಬೇಕಾದ ಜಾಗ ಅಲ್ಲ.
    tr: Bēḍa kanda. Nāḷe ninage bēsige kōciṅg klās ide. Matte… kōrṭ kāriḍāru hadinēḷu varṣadavanu nōḍbēkāda jāga alla.
    en: No, son. You have your summer coaching class tomorrow. And besides… a court corridor isn't a place a seventeen-year-old should have to see.
  - who: rakshith
    t: ಆದ್ರೆ ತಾತನ ಮನೆಯ ಜಗಳ ನಾನು ನೋಡ್ಬೇಕಾದ ವಿಷಯ ಅಲ್ವಾ ಅಪ್ಪ? ನಾಳೆ ಆ ಜಮೀನು ನನ್ನ ತಲೆಮಾರಿಗೂ ಬರುತ್ತೆ.
    tr: Ādre tātana maneya jagaḷa nānu nōḍbēkāda viṣaya alvā appa? Nāḷe ā jamīnu nanna talemārigū barutte.
    en: But isn't Thatha's family quarrel something I ought to see, Appa? One day that land will come to my generation too.
  - who: suresh
    t: … ಸರಿ. ಮುಂದಿನ ಸಲ ಬಾ. ನಿನ್ನ ಮಾತು ಕೇಳಿ ನನಗೊಂದು ಅರ್ಥ ಆಯ್ತು — ನಾವು ಜಗಳ ಆಡ್ತಿರೋದು ನಿನ್ನ ಕಣ್ಣ ಮುಂದೆ. ನೀನು ಕಲಿಯೋದು ನಾವು ಏನು ಹೇಳ್ತೀವಿ ಅಂತಲ್ಲ, ಏನು ಮಾಡ್ತೀವಿ ಅಂತ.
    tr: … Sari. Mundina sala bā. Ninna mātu kēḷi nanagondu artha āytu — nāvu jagaḷa āḍtirōdu ninna kaṇṇa munde. Nīnu kaliyōdu nāvu ēnu hēḷtīvi antalla, ēnu māḍtīvi anta.
    en: (after a pause) … All right. Come next time. Listening to you, I've understood something — we're fighting right in front of your eyes. What you'll learn isn't what we say, but what we do.
  - scene: Wednesday, 20 May 2026. The corridor of the Civil Judge and JMFC court in Maddur. Every bench is full; people sit on the floor along the walls; a peon calls out case numbers from a list. Shobha sits at one end with Meena. Mahadeva stands at the other end by a pillar, beside his Mandya lawyer's junior. On the middle bench Suresh sits with Avva, who holds a cloth bundle in her lap.
  - who: meena
    t: ಅವ್ವ ನಿನ್ನನ್ನ ಪಕ್ಕ ಕೂರು ಅಂದಿದ್ರಂತೆ.
    tr: Avva ninnanna pakka kūru andidrante.
    en: (softly, to Shobha) I hear Avva asked you to sit beside her.
  - who: shobha
    t: ಅಂದಿದ್ರು ಅತ್ತಿಗೆ. ಆದ್ರೆ ಆ ಕಡೆ ಮಹದೇವನ ವಕೀಲರ ಜೂನಿಯರ್ ಎಲ್ಲಾ ನೋಡ್ತಿದಾರೆ. ನಾನು ಅವ್ವನ ಪಕ್ಕ ಕೂತ್ರೆ ‘ತಾಯಿ ಮೇಲೆ ಒತ್ತಡ ಹಾಕ್ತಿದಾಳೆ’ ಅಂತಾರೆ ಅಂತ ಭಯ. ನೋಡಿ — ನನ್ನ ಸ್ವಂತ ಅವ್ವನ ಪಕ್ಕ ಕೂರೋಕೂ ಈಗ ಲೆಕ್ಕ ಹಾಕ್ಬೇಕು.
    tr: Andidru attige. Ādre ā kaḍe Mahadēvana vakīlara jūniyar ellā nōḍtidāre. Nānu avvana pakka kūtre ‘tāyi mēle ottaḍa hāktidāḷe’ antāre anta bhaya. Nōḍi — nanna svanta avvana pakka kūrōkū īga lekka hākbēku.
    en: She did, Attige. But Mahadeva's lawyer's junior over there is watching everything. I'm afraid that if I sit beside Avva they'll say 'she's pressuring her mother'. Look at it — now I have to calculate even before sitting next to my own mother.
  - who: meena
    t: ಇವತ್ತು ಬೇಕಾದ್ರೆ ಲೆಕ್ಕ ಹಾಕು. ಆದ್ರೆ ರೊಟ್ಟಿ ಬಂದಾಗ ಲೆಕ್ಕ ಬಿಡು. ಅವ್ವನ ಮಡಿಲಲ್ಲಿ ಆ ಗಂಟು ನೋಡಿದ್ಯಾ?
    tr: Ivattu bēkādre lekka hāku. Ādre roṭṭi bandāga lekka biḍu. Avvana maḍilalli ā gaṇṭu nōḍidyā?
    en: Calculate today if you must. But stop calculating when the rotti comes out. Did you see that bundle in Avva's lap?
  - scene: The case is called at 12:40. It is over in six minutes. Advocate Nagendra comes out, straightening his white bands, and goes to Suresh.
  - who: lawyer
    t: ಸುರೇಶ್ ಅವರೇ, ನೀವು ಎರಡನೇ ಪ್ರತಿವಾದಿ, ನಿಮಗೂ ತಿಳಿಸೋದು ನನ್ನ ಕರ್ತವ್ಯ. ಒಳಗೆ ಏನಾಯ್ತು ಅಂತ ಸರಳವಾಗಿ ಹೇಳ್ತೀನಿ.
    tr: Surēś avarē, nīvu eraḍanē prativādi, nimagū tiḷisōdu nanna kartavya. Oḷage ēnāytu anta saraḷavāgi hēḷtīni.
    en: Mr Suresh, you're the second defendant; it's my duty to inform you too. I'll explain simply what happened inside.
  - who: lawyer
    t: 'ಮೂರನೇ ಪ್ರತಿವಾದಿ ಮಹದೇವ ಅವರ ವಕೀಲರು ತಾತ್ಕಾಲಿಕ ತಡೆಯಾಜ್ಞೆಗೆ ಅರ್ಜಿ ಹಾಕಿದ್ರು. ನ್ಯಾಯಾಧೀಶರು ಮಧ್ಯಂತರ ಆದೇಶ ಕೊಟ್ಟಿದಾರೆ: ಮುಂದಿನ ದಿನಾಂಕದವರೆಗೆ ಯಥಾಸ್ಥಿತಿ ಕಾಪಾಡಬೇಕು. ಅಂದ್ರೆ ಯಾವ ಪಕ್ಷಕಾರರೂ ಜಮೀನನ್ನ ಮಾರುವಂತಿಲ್ಲ, ಅಡವಿಡುವಂತಿಲ್ಲ. ಮತ್ತೆ ಮಹದೇವ ಅವರು ಮಾಡ್ತಿರೋ ಬೇಸಾಯಕ್ಕೆ ಯಾರೂ ಅಡ್ಡಿ ಮಾಡುವಂತಿಲ್ಲ.'
    tr: 'Mūranē prativādi Mahadēva avara vakīlaru tātkālika taḍeyājñege arji hākidru. Nyāyādhīśaru madhyantara ādēśa koṭṭidāre: mundina dināṅkadavarege yathāsthiti kāpāḍabēku. Andre yāva pakṣakārarū jamīnanna māruvantilla, aḍaviḍuvantilla. Matte Mahadēva avaru māḍtirō bēsāyakke yārū aḍḍi māḍuvantilla.'
    en: 'The lawyer for the third defendant, Mahadeva, applied for a temporary injunction. The judge has passed an interim order: the status quo must be maintained until the next date. That means none of the parties may sell or mortgage the land. And no one may obstruct the cultivation Mahadeva is carrying on.'
  - who: suresh
    t: ಅಂದ್ರೆ ಶೋಭಾ ಕೇಳದಿದ್ದ ತಡೆಯಾಜ್ಞೆಯನ್ನ ಮಹದೇವ ಕೇಳಿ ತಗೊಂಡ.
    tr: Andre Śōbhā kēḷadidda taḍeyājñeyanna Mahadēva kēḷi tagoṇḍa.
    en: So the injunction Shobha wouldn't ask for, Mahadeva asked for and got.
  - who: lawyer
    t: ಹೌದು. ಕಾನೂನಿನ ದೃಷ್ಟಿಯಿಂದ ನಮಗೆ ಇದರಿಂದ ನಷ್ಟ ಇಲ್ಲ — ನಾವೂ ಮಾರಾಟ ಬೇಡ ಅಂತಾನೇ ಇದ್ವಿ. ಆದ್ರೆ ಊರಲ್ಲಿ ‘ಮಹದೇವ ಕೋರ್ಟಲ್ಲಿ ಗೆದ್ದ’ ಅಂತ ಸುದ್ದಿ ಹೋಗುತ್ತೆ. ಮೊದಲ ದಿನವೇ ಎರಡೂ ಕಡೆಯವರಿಗೆ ಒಂದೊಂದು ‘ಗೆಲುವು’ ಸಿಕ್ತು. ಇಂಥ ಕೇಸುಗಳು ಹೀಗೇ ಉದ್ದ ಆಗೋದು.
    tr: Haudu. Kānūnina dṛṣṭiyinda namage idarinda naṣṭa illa — nāvū mārāṭa bēḍa antānē idvi. Ādre ūralli ‘Mahadēva kōrṭalli gedda’ anta suddi hōgutte. Modala dinavē eraḍū kaḍeyavarige ondondu ‘geluvu’ siktu. Intha kēsugaḷu hīgē udda āgōdu.
    en: Yes. Legally it does us no harm — we didn't want a sale either. But word will go round the village that 'Mahadeva won in court'. On the very first day, each side has got its own 'victory'. That's exactly how cases like this grow long.
  - who: suresh
    t: ಮುಂದಿನ ದಿನಾಂಕ ಯಾವಾಗ?
    tr: Mundina dināṅka yāvāga?
    en: When's the next date?
  - who: lawyer
    t: 'ಆಗಸ್ಟ್ ಹದಿನಾಲ್ಕು. ಅಷ್ಟರಲ್ಲಿ ಪ್ರತಿವಾದಿಗಳು ಲಿಖಿತ ಹೇಳಿಕೆ ಹಾಕಬೇಕು. ನಿಮ್ಮ ತಾಯಿಯವರಿಗೆ ತಾಲೂಕು ಕಾನೂನು ಸೇವೆಗಳ ಸಮಿತಿಯಿಂದ ವಕೀಲರನ್ನ ನೇಮಿಸಿದಾರೆ — ಒಳ್ಳೆಯವರು, ನನಗೆ ಗೊತ್ತು. ಇನ್ನೊಂದು: ನ್ಯಾಯಾಧೀಶರು ತಾವೇ ಕೇಳಿದ್ರು — ‘ಕುಟುಂಬದ ವಿಷಯ, ಮಧ್ಯಸ್ಥಿಕೆಗೆ ಹೋಗ್ತೀರಾ?’ ಅಂತ. ಮಹದೇವ ಅವರ ಕಡೆಯಿಂದ ‘ಈಗ ಬೇಡ’ ಅಂತ ಉತ್ತರ ಬಂತು.'
    tr: 'Āgasṭ hadinālku. Aṣṭaralli prativādigaḷu likhita hēḷike hākabēku. Nimma tāyiyavarige tālūku kānūnu sēvegaḷa samitiyinda vakīlaranna nēmisidāre — oḷḷeyavaru, nanage gottu. Innondu: nyāyādhīśaru tāvē kēḷidru — ‘kuṭumbada viṣaya, madhyasthikege hōgtīrā?’ anta. Mahadēva avara kaḍeyinda ‘īga bēḍa’ anta uttara bantu.'
    en: 'The fourteenth of August. By then the defendants have to file their written statements. A lawyer has been assigned to your mother by the Taluk Legal Services Committee — a good man, I know him. One more thing: the judge asked on his own, ''It''s a family matter — will you go to mediation?'' The answer from Mahadeva''s side was ''not now''.'
  - who: lawyer
    t: ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದಿಂದ ಈ ಕಾರಿಡಾರ್ ನೋಡ್ತಿದೀನಿ, ಸುರೇಶ್ ಅವರೇ. ಅಣ್ಣ-ತಮ್ಮಂದಿರು ಮೊದಲ ದಿನ ಒಂದೇ ಕಾರಲ್ಲಿ ಬರ್ತಾರೆ. ಎರಡನೇ ಸಲ ಎರಡು ಕಾರಲ್ಲಿ. ಹತ್ತನೇ ಸಲ ಒಬ್ಬರ ಮುಖ ಇನ್ನೊಬ್ಬರು ನೋಡಲ್ಲ. ನಿಮ್ಮ ಮನೆಯವರು ಮೊದಲ ದಿನವೇ ಮೂರು ಮೂಲೆಯಲ್ಲಿ ಕೂತಿದಾರೆ.
    tr: Ippatteraḍu varṣadinda ī kāriḍār nōḍtidīni, Surēś avarē. Aṇṇa-tammandiru modala dina ondē kāralli bartāre. Eraḍanē sala eraḍu kāralli. Hattanē sala obbara mukha innobbaru nōḍalla. Nimma maneyavaru modala dinavē mūru mūleyalli kūtidāre.
    en: I've been watching this corridor for twenty-two years, Mr Suresh. On the first day brothers come in one car. The second time, in two cars. By the tenth, they won't look at each other's faces. Your family is sitting in three different corners on the very first day.
  - who: suresh
    t: ಹೌದು ಸಾರ್. … ಧನ್ಯವಾದ. ನಿಮ್ಮ ಪ್ರಾಮಾಣಿಕತೆಗೆ.
    tr: Haudu sār. … Dhanyavāda. Nimma prāmāṇikatege.
    en: Yes, sir. … Thank you. For your honesty.
  - scene: The lawyer goes back in for his next case. Avva unties the cloth bundle in her lap. Inside, wrapped in a banana leaf, are ragi rottis she made before dawn, still faintly warm, and a little steel box of chutney.
  - who: avva
    t: ಮಹದೇವ, ಬಾರಪ್ಪ ಇಲ್ಲಿ. ಶೋಭಾ, ನೀನೂ ಬಾ ಕಣವ್ವ. ಬೆಳಿಗ್ಗೆಯಿಂದ ಯಾರೂ ಏನೂ ತಿಂದಿಲ್ಲ. ನಾಲ್ಕು ಗಂಟೆಗೆ ಎದ್ದು ರಾಗಿ ರೊಟ್ಟಿ ಮಾಡಿ ತಂದಿದೀನಿ.
    tr: Mahadēva, bārappa illi. Śōbhā, nīnū bā kaṇavva. Beḷiggeyinda yārū ēnū tindilla. Nālku gaṇṭege eddu rāgi roṭṭi māḍi tandidīni.
    en: Mahadeva, come here, son. Shobha, you come too, my girl. Nobody's eaten a thing since morning. I got up at four and made ragi rottis.
  - scene: At first neither of them moves. Then Shobha comes, with Meena. After a long moment Mahadeva walks over too, but stays standing.
  - who: shobha
    t: ಅವ್ವ… ನಿನ್ನ ಮಂಡಿ ನೋವಲ್ಲಿ ನಾಲ್ಕು ಗಂಟೆಗೆ ಎದ್ದು ಒಲೆ ಮುಂದೆ ಕೂತ್ಯಾ?
    tr: Avva… ninna maṇḍi nōvalli nālku gaṇṭege eddu ole munde kūtyā?
    en: Avva… with your knees, you got up at four and sat in front of the stove?
  - who: avva
    t: ಮಂಡಿ ನೋಯ್ತಿತ್ತು. ಕರುಳು ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ ನೋಯ್ತಿತ್ತು. … ಇಲ್ಲಿ ನೋಡಿ. ನಿಮ್ಮಪ್ಪನ ಜಮೀನನ್ನ ಕೋರ್ಟು ಹಂಚುತ್ತಂತೆ — ಎಷ್ಟು ವರ್ಷ ಆಗುತ್ತೋ ಆ ದೇವ್ರಿಗೇ ಗೊತ್ತು. ನನ್ ಕೈಲಿ ಹಂಚೋಕಾಗೋದು ಇಷ್ಟೇ.
    tr: Maṇḍi nōytittu. Karuḷu adakkinta jāsti nōytittu. … Illi nōḍi. Nimmappana jamīnanna kōrṭu han̄cuttante — eṣṭu varṣa āguttō ā dēvrigē gottu. Nan kaili han̄cōkāgōdu iṣṭē.
    en: My knees hurt. My insides hurt more. … Look here. They say the court will divide your father's land — God alone knows how many years it will take. This is all I can divide with my own hands.
  - scene: She tears the last rotti into three pieces and holds them out, one to each of her children.
  - who: avva
    t: ಒಂದು ಸುರೇಶಂಗೆ. ಒಂದು ಮಹದೇವಂಗೆ. ಒಂದು ಶೋಭಂಗೆ. ಸಮ ಪಾಲು. ಯಾವ ವಕೀಲನೂ ಬೇಡ, ಯಾವ ಡಿಕ್ರಿನೂ ಬೇಡ. ತಿನ್ನಿ.
    tr: Ondu Surēśaṅge. Ondu Mahadēvaṅge. Ondu Śōbhaṅge. Sama pālu. Yāva vakīlanū bēḍa, yāva ḍikrinū bēḍa. Tinni.
    en: One for Suresha. One for Mahadeva. One for Shobha. Equal shares. No lawyer needed, no decree needed. Eat.
  - who: shobha
    t: ಇದಕ್ಕೆ ಯಾವ ಕೋರ್ಟ್ ಶುಲ್ಕಾನೂ ಇಲ್ಲ, ಅಲ್ವಾ ಅವ್ವ?
    tr: Idakke yāva kōrṭ śulkānū illa, alvā avva?
    en: (taking her piece, her voice breaking) No court fee for this one, is there, Avva?
  - who: mahadeva
    t: ರೊಟ್ಟಿ ತಗೋತೀನಿ, ಅವ್ವ. ಆದ್ರೆ ಆಗಸ್ಟ್ ಹದಿನಾಲ್ಕಕ್ಕೆ ನನ್ ಲಿಖಿತ ಹೇಳಿಕೆ ಹೋಗುತ್ತೆ.
    tr: Roṭṭi tagōtīni, avva. Ādre Āgasṭ hadinālkakke nan likhita hēḷike hōgutte.
    en: (taking his piece; then quietly, eyes on the floor) I'll take the rotti, Avva. But on the fourteenth of August my written statement goes in.
  - who: avva
    t: ಹೋಗ್ಲಿ. ನಿನ್ನ ಕಾಗದ ನೀನು ಕೊಡು. ಆದ್ರೆ ರೊಟ್ಟಿ ಇಲ್ಲೇ ಕೂತು ತಿನ್ನು. ನಿಂತ್ಕಂಡು ತಿಂದ್ರೆ ಮೈಗೆ ಹಿಡಿಯಲ್ಲ ಅಂತಿದ್ರು ನಿಮ್ಮಪ್ಪ.
    tr: Hōgli. Ninna kāgada nīnu koḍu. Ādre roṭṭi illē kūtu tinnu. Nintkaṇḍu tindre maige hiḍiyalla antidru nimmappa.
    en: Let it go in. You give your paper. But sit down here and eat the rotti. Your father used to say food eaten standing never does you any good.
  - scene: 'Mahadeva hesitates — then sits at the far end of the bench. For a few minutes the three siblings eat in silence on the same bench, Avva in the middle, none of them looking at the others. Then the peon calls the next case. Mahadeva gets up first and walks out without a word. Shobha picks up her bag: her bus to Mysuru leaves at three.'
  - who: shobha
    t: ಮೀನಾ ಅತ್ತಿಗೆ, ಬರ್ತೀನಿ. ಅಣ್ಣ… ಅವ್ವನ್ನ ಜೋಪಾನ.
    tr: Mīnā attige, bartīni. Aṇṇa… avvanna jōpāna.
    en: Meena Attige, I'll be going. Anna… take care of Avva.
  - who: suresh
    t: ನಡಿ ಅವ್ವ, ಮನೆಗೆ ಹೋಗೋಣ. ಮೆಟ್ಟಿಲು ಹುಷಾರು.
    tr: Naḍi avva, manege hōgōṇa. Meṭṭilu huṣāru.
    en: (helping Avva up) Come, Avva, let's go home. Careful on the steps.
  - who: avva
    t: ನಿಮ್ಮಪ್ಪ ಆ ದಿನಚರೀಲಿ ಕೊನೆಗೆ ಏನು ಬರೆದಿದ್ರು, ಸುರೇಶ? ‘ಮೂರೂ ಮಕ್ಳು ಈ ಮನೆ ಅಂಗಳದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಕೂತು ಉಣ್ಣೋದು ನೋಡ್ಬೇಕು’ ಅಂತ ತಾನೇ? … ಇವತ್ತು ಮೂರೂ ಜನ ಒಂದೇ ಬೆಂಚಿನ ಮೇಲೆ ಉಂಡ್ರು. ಅಂಗಳದಲ್ಲಲ್ಲ, ಕೋರ್ಟಿನ ಕಾರಿಡಾರಲ್ಲಿ. ಅವ್ರು ಇದನ್ನ ನೋಡಿದ್ರೆ ನಗ್ತಿದ್ರೋ, ಅಳ್ತಿದ್ರೋ — ನನಗೆ ಗೊತ್ತಿಲ್ಲ ಕಣಪ್ಪ.
    tr: Nimmappa ā dinacarīli konege ēnu baredidru, Surēśa? ‘Mūrū makḷu ī mane aṅgaḷadalli oṭṭige kūtu uṇṇōdu nōḍbēku’ anta tānē? … Ivattu mūrū jana ondē beṇcina mēle uṇḍru. Aṅgaḷadallalla, kōrṭina kāriḍāralli. Avru idanna nōḍidre nagtidrō, aḷtidrō — nanage gottilla kaṇappa.
    en: (at the top of the court steps, watching Mahadeva's motorbike and Shobha's bus go off in opposite directions) What was the last thing your father wrote in that diary, Suresha? 'I must see all three children sitting together and eating in the yard of this house' — wasn't it? … Today all three of them ate on the same bench. Not in the yard — in a court corridor. If he saw this, would he laugh or would he cry? I don't know, son.
  - chapter: Chapter 7 — The season
  - section: The weekend farmer
    learn: 'offering help: holada kelasa ēnideyō hēḷu, māḍtīni · the nursery and the canal: sasimaḍi, nāṭi, kūḷe kabbu, kaṭṭu paddhati · rural commands: barigālalli bā, hiṅge hiḍkō · habitual past: appa haṅgē māḍtidru · first blisters: kaige guḷḷe bandide'
  - scene: Saturday, 6 June 2026, half past six in the morning. Bettahalli. Suresh's car stops at the gate. He wears an old shirt and a dhoti and carries a pair of rubber boots in a plastic bag; Rakshith, still sleepy, gets out of the back. Mahadeva is in the cattle shed, milking.
  - who: mahadeva
    t: ಅಣ್ಣ? ಇಷ್ಟು ಬೆಳಿಗ್ಗೆ? ಕೋರ್ಟಿಂದ ಏನಾದ್ರೂ ಕಾಗದ ಬಂತಾ?
    tr: Aṇṇa? Iṣṭu beḷigge? Kōrṭinda ēnādrū kāgada bantā?
    en: Anna? This early? Has some paper come from the court?
  - who: suresh
    t: ಯಾವ ಕಾಗದಾನೂ ಇಲ್ಲ. ಇನ್ಮೇಲೆ ಪ್ರತಿ ಶನಿವಾರ-ಭಾನುವಾರ ಬರ್ತೀನಿ ಅಂತ ತೀರ್ಮಾನ ಮಾಡಿದೀನಿ. ಹೊಲದ ಕೆಲಸ ಏನಿದೆಯೋ ಹೇಳು, ಮಾಡ್ತೀನಿ.
    tr: Yāva kāgadānū illa. Inmēle prati Śanivāra-Bhānuvāra bartīni anta tīrmāna māḍidīni. Holada kelasa ēnideyō hēḷu, māḍtīni.
    en: No paper at all. I've decided I'll come every Saturday and Sunday from now on. Tell me whatever work there is in the fields, and I'll do it.
  - who: mahadeva
    t: ನೀನಾ? ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರು ಗದ್ದೆಗೆ ಇಳೀತಾರಾ? ಕೋರ್ಟಲ್ಲಿ ‘ನಾನೂ ಬೇಸಾಯ ಮಾಡ್ದೆ’ ಅಂತ ಹೇಳೋಕೆ ಸಾಕ್ಷಿ ಮಾಡ್ಕಳ್ತಿದೀಯಾ?
    tr: Nīnā? Byāṅk myānējaru gaddege iḷītārā? Kōrṭalli ‘nānū bēsāya māḍde’ anta hēḷōke sākṣi māḍkaḷtidīyā?
    en: You? A bank manager stepping down into the wet field? Are you collecting evidence so you can tell the court 'I farmed too'?
  - who: suresh
    t: ಕೋರ್ಟಲ್ಲಿ ನಾನು ಏನೂ ಕೇಳ್ತಿಲ್ಲ, ಮಹದೇವ. ಆದ್ರೆ ಇಪ್ಪತ್ತು ವರ್ಷ ನೀನೊಬ್ಬನೇ ಹೊತ್ತಿದ್ದನ್ನ ನಾನು ಒಂದು ದಿನಾನೂ ಹೊತ್ತಿಲ್ಲ. ಪಾಲಿನ ಮಾತಾಡೋಕೆ ಮುಂಚೆ ಆ ಭಾರ ಎಷ್ಟು ಅಂತ ನನಗೆ ಗೊತ್ತಾಗ್ಬೇಕು.
    tr: Kōrṭalli nānu ēnū kēḷtilla, Mahadēva. Ādre ippattu varṣa nīnobbanē hottiddanna nānu ondu dinānū hottilla. Pālina mātāḍōke mun̄ce ā bhāra eṣṭu anta nanage gottāgbēku.
    en: I'm not asking for anything in court, Mahadeva. But what you carried alone for twenty years, I haven't carried for a single day. Before anyone talks about shares, I need to know how heavy that load is.
  - who: mahadeva
    t: ಇದ್ದಕ್ಕಿದ್ದಂಗೆ ಯಾಕಣ್ಣ? ಮೂರು ವಾರ ಫೋನ್ ಮಾಡಿದ್ರೂ ‘ಅವ್ವ ಹೇಗಿದಾರೆ’ ಅಂತ ಎರಡೇ ಮಾತು ಆಡ್ತಿದ್ವಿ.
    tr: Iddakkiddaṅge yākaṇṇa? Mūru vāra phōn māḍidrū ‘avva hēgidāre’ anta eraḍē mātu āḍtidvi.
    en: Why all of a sudden, Anna? For three weeks, even when we phoned, all we said to each other was 'How's Avva?'
  - who: suresh
    t: ಕೋರ್ಟಿನ ಕಾರಿಡಾರಲ್ಲಿ ಅವ್ವ ಕೊನೇ ರೊಟ್ಟಿಯನ್ನ ಮೂರು ತುಂಡು ಮಾಡಿ ಕೊಟ್ರಲ್ಲ — ಅವತ್ತಿಂದ ನಂಗೆ ಸರಿಯಾಗಿ ನಿದ್ದೆ ಬಂದಿಲ್ಲ. ಕೇಸು ವಕೀಲರು ನೋಡ್ಕೊಳ್ಲಿ. ಹೊಲದಲ್ಲಿ ನಾನು ನಿನ್ನ ಪಕ್ಕ ನಿಂತಿರ್ತೀನಿ. ಬ್ಯಾಂಕಲ್ಲಿ ಶನಿವಾರದ ರಜೆಗೆ ಅರ್ಜಿನೂ ಕೊಟ್ಟಾಯ್ತು.
    tr: Kōrṭina kāriḍāralli avva konē roṭṭiyanna mūru tuṇḍu māḍi koṭralla — avattinda naṅge sariyāgi nidde bandilla. Kēsu vakīlaru nōḍkoḷli. Holadalli nānu ninna pakka nintirtīni. Byāṅkalli Śanivārada rajege arjinū koṭṭāytu.
    en: In the court corridor, when Avva tore that last rotti into three pieces — since that day I haven't slept properly. Let the lawyers look after the case. In the field, I'll be standing beside you. I've even put in for Saturdays off at the bank.
  - who: avva
    t: ಬಂದವನನ್ನ ಬಾಗಿಲಲ್ಲೇ ನಿಲ್ಲಿಸಿ ಪ್ರಶ್ನೆ ಕೇಳ್ತೀಯಾ ಮಹದೇವ? ಮೊದ್ಲು ಕಾಫಿ ಕುಡೀಲಿ. ಆಮೇಲೆ ಬೇಕಾದ್ರೆ ಗುದ್ದಲಿ ಕೊಡು.
    tr: Bandavananna bāgilallē nillisi praśne kēḷtīyā Mahadēva? Modlu kāphi kuḍīli. Āmēle bēkādre guddali koḍu.
    en: (from the veranda) Are you going to keep him standing at the door and question him, Mahadeva? Let him drink his coffee first. Then give him a spade if you like.
  - who: mahadeva
    t: ಸರಿ. ಕಾಫಿ ಆದ್ಮೇಲೆ ಸಸಿಮಡಿ ಹತ್ರ ಬಾ. ಬೂಟು ಬೇಡ, ಕೆಸರಲ್ಲಿ ಹೂತ್ಕಂಡು ಹೋಗುತ್ತೆ. ಬರಿಗಾಲಲ್ಲಿ ಬಾ.
    tr: Sari. Kāphi ādmēle sasimaḍi hatra bā. Būṭu bēḍa, kesaralli hūtkaṇḍu hōgutte. Barigālalli bā.
    en: All right. After coffee, come to the nursery bed. No boots — they'll sink in the mud. Come barefoot.
  - scene: An hour later. Beside the canal, on the one-acre strip of survey 112 where the old cane was cut in May, Mahadeva has raised a small nursery bed of paddy seedlings. The rest of the wet land is green with young cane.
  - who: suresh
    t: ಇಲ್ಲಿ ಕಬ್ಬು ಇತ್ತಲ್ಲ? ಈಗ ಭತ್ತ ಯಾಕೆ?
    tr: Illi kabbu ittalla? Īga bhatta yāke?
    en: Wasn't there cane here? Why paddy now?
  - who: mahadeva
    t: ಮೇ ತಿಂಗಳಲ್ಲಿ ಈ ಒಂದು ಎಕರೆ ಕಬ್ಬು ಕಡಿದ್ವಿ. ಮೂರು ವರ್ಷ ಕೂಳೆ ಕಬ್ಬು ಬಿಟ್ಟಿದ್ವಿ, ಮಣ್ಣು ಸುಸ್ತಾಗಿದೆ. ಒಂದು ಬೆಳೆ ಭತ್ತ ಹಾಕಿದ್ರೆ ಮಣ್ಣಿಗೂ ವಿಶ್ರಾಂತಿ, ಮನೆಗೂ ವರ್ಷದ ಅಕ್ಕಿ. ಅಪ್ಪ ಯಾವಾಗ್ಲೂ ಹಂಗೇ ಮಾಡ್ತಿದ್ರು.
    tr: Mē tiṅgaḷalli ī ondu ekare kabbu kaḍidvi. Mūru varṣa kūḷe kabbu biṭṭidvi, maṇṇu sustāgide. Ondu beḷe bhatta hākidre maṇṇigū viśrānti, manegū varṣada akki. Appa yāvāglū haṅgē māḍtidru.
    en: In May we cut the cane on this one acre. We'd let it grow back as ratoon for three years; the soil is tired. Put in one crop of paddy, and the soil gets a rest and the house gets a year's rice. Appa always did it that way.
  - who: rakshith
    t: ಚಿಕ್ಕಪ್ಪ, ‘ಕೂಳೆ ಕಬ್ಬು’ ಅಂದ್ರೆ ಏನು? ನಂಗೆ ಹಳ್ಳಿ ಪದಗಳು ಇನ್ನೂ ಪೂರ್ತಿ ಅರ್ಥ ಆಗಲ್ಲ.
    tr: Cikkappa, ‘kūḷe kabbu’ andre ēnu? Naṅge haḷḷi padagaḷu innū pūrti artha āgalla.
    en: Chikkappa, what does 'koole kabbu' mean? I still don't fully understand village words.
  - who: mahadeva
    t: ಕಬ್ಬು ಕಡಿದ ಮೇಲೆ ಬುಡ ಮಣ್ಣಲ್ಲೇ ಇರುತ್ತೆ. ಅದಕ್ಕೆ ನೀರು, ಗೊಬ್ಬರ ಕೊಟ್ರೆ ಮತ್ತೆ ಚಿಗುರುತ್ತೆ — ಹೊಸ ಬೀಜ ಬೇಕಿಲ್ಲ. ಅದೇ ಕೂಳೆ. ಖರ್ಚು ಕಮ್ಮಿ, ಆದ್ರೆ ಪ್ರತಿ ವರ್ಷ ಇಳುವರಿ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಕಮ್ಮಿ ಆಗುತ್ತೆ. ನಮ್ಮಂಗೇ — ವಯಸ್ಸಾದಂಗೆ.
    tr: Kabbu kaḍida mēle buḍa maṇṇallē irutte. Adakke nīru, gobbara koṭre matte cigurutte — hosa bīja bēkilla. Adē kūḷe. Kharcu kammi, ādre prati varṣa iḷuvari svalpa svalpa kammi āgutte. Nammaṅgē — vayassādaṅge.
    en: When the cane is cut, the stump stays in the soil. Give it water and fertiliser and it sprouts again — no new seed needed. That's the ratoon. Less expense, but every year the yield drops a little. Just like us — as we get older.
  - who: suresh
    t: ನಾಟಿ ಯಾವಾಗ? ಸಸಿ ಚೆನ್ನಾಗಿ ಬಂದಿದೆ.
    tr: Nāṭi yāvāga? Sasi cennāgi bandide.
    en: When's the transplanting? The seedlings have come up well.
  - who: mahadeva
    t: ಅದು ನಮ್ಮ ಕೈಲಿಲ್ಲ. ನಾಲೆಗೆ ನೀರು ಬಿಟ್ಟಾಗ. ಕೆಆರ್‌ಎಸ್ ತುಂಬಿದ್ರೆ ವಿಶ್ವೇಶ್ವರಯ್ಯ ನಾಲೆಗೆ ಜುಲೈನಲ್ಲಿ ನೀರು ಬರುತ್ತೆ ಅಂತಾರೆ. ಅದೂ ಕಟ್ಟು ಪದ್ಧತಿಯಲ್ಲಿ — ಕೆಲವು ದಿನ ನೀರು, ಕೆಲವು ದಿನ ಇಲ್ಲ. ಅಷ್ಟರಲ್ಲಿ ತಮಿಳುನಾಡಿಗೆ ಎಷ್ಟು ಬಿಡ್ಬೇಕು ಅಂತ ದೆಹಲಿಯಲ್ಲಿ ಮೀಟಿಂಗು. ನಮ್ಮ ಸಸಿ ಕಾಯ್ತಾ ಇರುತ್ತೆ.
    tr: Adu namma kaililla. Nālege nīru biṭṭāga. Ke-Ār-Es tumbidre Viśvēśvarayya nālege Julai-nalli nīru barutte antāre. Adū kaṭṭu paddhatiyalli — kelavu dina nīru, kelavu dina illa. Aṣṭaralli Tamiḷunāḍige eṣṭu biḍbēku anta Dehaliyalli mīṭiṅgu. Namma sasi kāytā irutte.
    en: That's not in our hands. It's when they release water into the canal. If KRS fills, they say water will come down the Visvesvaraya Canal in July. And even then by rotation — some days water, some days none. Meanwhile there are meetings in Delhi about how much must go to Tamil Nadu. And our seedlings sit here waiting.
  - who: suresh
    t: 'ಬ್ಯಾಂಕಲ್ಲಿ ನಾನು ರೈತರ ಸಾಲದ ಫೈಲ್ ನೋಡ್ತೀನಿ — ‘ಬೆಳೆ: ಭತ್ತ, ನೀರಾವರಿ: ನಾಲೆ’ ಅಂತ ಒಂದು ಕಾಲಂ. ಆ ಒಂದು ಕಾಲಂ ಹಿಂದೆ ಇಷ್ಟು ಕಾಯೋದಿದೆ ಅಂತ ನಂಗೆ ಯಾವತ್ತೂ ಅನ್ನಿಸಿರಲಿಲ್ಲ.'
    tr: 'Byāṅkalli nānu raitara sālada phail nōḍtīni — ‘beḷe: bhatta, nīrāvari: nāle’ anta ondu kālam. Ā ondu kālam hinde iṣṭu kāyōdide anta naṅge yāvattū annisiralilla.'
    en: 'At the bank I look at farmers'' loan files — there''s one column: ''Crop: paddy. Irrigation: canal.'' It never once struck me how much waiting lies behind that one column.'
  - who: mahadeva
    t: ಕಾಲಂನಲ್ಲಿ ಕಾಯೋದು ಕಾಣ್ಸಲ್ಲ ಕಣಣ್ಣ. ತಗೋ, ಈ ಬದುವಿನ ಕಳೆ ಕಿತ್ತು ಹಾಕು. ಕುಡುಗೋಲು ಹಿಂಗೆ ಹಿಡ್ಕೋ — ಇಲ್ಲಾಂದ್ರೆ ಬೆರಳು ಹೋಗುತ್ತೆ.
    tr: Kālam-nalli kāyōdu kāṇsalla kaṇaṇṇa. Tagō, ī baduvina kaḷe kittu hāku. Kuḍugōlu hiṅge hiḍkō — illāndre beraḷu hōgutte.
    en: Waiting doesn't show in a column, Anna. Here — pull the weeds off this bund. Hold the sickle like this, or you'll lose a finger.
  - scene: Noon. Suresh straightens his back with a groan. His palms are red; a blister has risen at the base of his thumb.
  - who: rakshith
    t: ಅಪ್ಪ, ನಿನ್ನ ಕೈಗೆ ಗುಳ್ಳೆ ಬಂದಿದೆ! ಜಿಮ್‌ನಲ್ಲೂ ಹೀಗಾಗಲ್ಲ.
    tr: Appa, ninna kaige guḷḷe bandide! Jim-nallū hīgāgalla.
    en: Appa, you've got a blister on your hand! Even the gym doesn't do that.
  - who: mahadeva
    t: ಮೊದಲ ದಿನ ಎಲ್ರಿಗೂ ಬರುತ್ತೆ. ಹದಿನೈದು ವರ್ಷದವನಾಗಿದ್ದಾಗ ನಂಗೂ ಬಂದಿತ್ತು. ಅಪ್ಪ ಹರಳೆಣ್ಣೆ ಹಚ್ಚಿ ‘ನಾಳೆ ಮತ್ತೆ ಬಾ’ ಅಂದಿದ್ರು. … ನೀನೂ ನಾಳೆ ಬರ್ತೀಯಾ ಅಣ್ಣ?
    tr: Modala dina ellrigū barutte. Hadinaidu varṣadavanāgiddāga naṅgū bandittu. Appa haraḷeṇṇe hacci ‘nāḷe matte bā’ andidru. … Nīnū nāḷe bartīyā aṇṇa?
    en: Everyone gets one the first day. I got one too, when I was fifteen. Appa rubbed castor oil on it and said, 'Come again tomorrow.' … Will you come tomorrow too, Anna?
  - who: suresh
    t: ನಾಳೆ ಮಾತ್ರ ಅಲ್ಲ. ಈ ಬೆಳೆ ಕೊಯ್ಲು ಆಗೋವರೆಗೂ ಬರ್ತೀನಿ. ಆಮೇಲೆ ಏನಾಗುತ್ತೋ ನೋಡೋಣ.
    tr: Nāḷe mātra alla. Ī beḷe koylu āgōvaregū bartīni. Āmēle ēnāguttō nōḍōṇa.
    en: Not just tomorrow. I'll keep coming until this crop is harvested. After that, we'll see what happens.
  - who: mahadeva
    t: ನೋಡೋಣ.
    tr: Nōḍōṇa.
    en: (not looking up, but his voice has softened) We'll see.
  - section: The field officer
    learn: 'the mill''s terms: kabbina nōndaṇi, kaṭāvu ādēśa, rikavari, tūka · prices: nyāyasammata mattu lābhadāyaka bele (ephārpi), kviṇṭālige, ṭannige, kaṭāvu-sāgaṇe kharcu kaḷedu · law vs practice: hadinālku dinadoḷage pāvati, baḍḍi sērisi · an honest official: nānu hēḷōdu kāgadadalli irōdu mātra · consent: oppige patra'
  - scene: Saturday, 18 July 2026. The rain has come in fits and starts; KRS is filling. A young man on a motorbike, with a tablet in a plastic cover and a sugar factory ID card on a ribbon, stops on the cart track beside survey 112. He is the field officer who registers cane and fixes the cutting schedule.
  - who: millman
    t: ನಮಸ್ಕಾರ. ನಾನು ಕಾರ್ಖಾನೆಯ ಕ್ಷೇತ್ರ ಅಧಿಕಾರಿ, ಪ್ರದೀಪ್. ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡು — ಇದರ ಕಬ್ಬಿನ ನೋಂದಣಿ ಪರಿಶೀಲನೆಗೆ ಬಂದಿದೀನಿ. ಚನ್ನೇಗೌಡರ ಹೆಸರಲ್ಲಿ ನೋಂದಣಿ ಇತ್ತು — ಅವರು…
    tr: Namaskāra. Nānu kārkhāneya kṣētra adhikāri, Pradīp. Sarve nambar nūra hanneraḍu, hissā eraḍu — idara kabbina nōndaṇi pariśīlanege bandidīni. Cannēgauḍara hesaralli nōndaṇi ittu — avaru…
    en: Namaskara. I'm the factory's field officer, Pradeep. I've come to check the cane registration for survey number one hundred and twelve, hissa two. The registration was in Channegowda's name — he…
  - who: mahadeva
    t: ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಹೋದ್ರು ಸಾರ್. ಈಗ ಪಹಣಿಯಲ್ಲಿ ನಾವು ನಾಲ್ಕು ಜನದ ಹೆಸರಿದೆ. ಬೇಸಾಯ ನಾನು ಮಾಡ್ತೀನಿ — ತಹಸೀಲ್ದಾರ್ ಆರ್ಡರಲ್ಲೂ ಬರೆದಿದೆ, ಕೋರ್ಟೂ ಅದನ್ನೇ ಹೇಳಿದೆ.
    tr: Ḍisembar-nalli hōdru sār. Īga pahaṇiyalli nāvu nālku janada hesaride. Bēsāya nānu māḍtīni — tahasīldār ārḍarallū baredide, kōrṭū adannē hēḷide.
    en: He passed away in December, sir. Now the RTC has all four of our names. I'm the one who farms — it's written in the Tahsildar's order, and the court has said the same.
  - who: millman
    t: ಹಾಗಾದ್ರೆ ನೋಂದಣಿಯನ್ನ ನಿಮ್ಮ ಹೆಸರಿಗೆ ಬದಲಾಯಿಸಬೇಕು. ಹೊಸ ಪಹಣಿ, ಮರಣ ಪ್ರಮಾಣಪತ್ರ, ಉಳಿದ ವಾರಸುದಾರರ ಒಪ್ಪಿಗೆ ಪತ್ರ, ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ಪಾಸ್‌ಬುಕ್ — ಹಣ ನೇರ ಖಾತೆಗೆ ಹೋಗೋದು. ಒಪ್ಪಿಗೆ ಪತ್ರ ಇಲ್ಲದಿದ್ರೆ ಕಾರ್ಖಾನೆ ಹಣ ಯಾರ ಖಾತೆಗೆ ಹಾಕ್ಬೇಕು ಅಂತ ಗೊಂದಲ ಆಗುತ್ತೆ.
    tr: Hāgādre nōndaṇiyanna nimma hesarige badalāyisabēku. Hosa pahaṇi, maraṇa pramāṇapatra, uḷida vārasudārara oppige patra, nimma byāṅk pās-buk — haṇa nēra khātege hōgōdu. Oppige patra illadidre kārkhāne haṇa yāra khātege hākbēku anta gondala āgutte.
    en: Then the registration has to be changed to your name. The new RTC, the death certificate, a consent letter from the other heirs, your bank passbook — the money goes straight into the account. Without the consent letter there'll be confusion over whose account the factory should pay into.
  - who: suresh
    t: ಒಪ್ಪಿಗೆ ಪತ್ರಕ್ಕೆ ನಾನು ಇವತ್ತೇ ಸಹಿ ಹಾಕ್ತೀನಿ. ಅವ್ವನೂ ಹೆಬ್ಬೆಟ್ಟು ಒತ್ತುತ್ತಾಳೆ. ತಂಗಿ ಮೈಸೂರಲ್ಲಿದಾಳೆ — ಅವಳನ್ನ ನಾನು ಕೇಳ್ತೀನಿ.
    tr: Oppige patrakke nānu ivattē sahi hāktīni. Avvanū hebbeṭṭu ottuttāḷe. Taṅgi Maisūrallidāḷe — avaḷanna nānu kēḷtīni.
    en: I'll sign the consent letter today. Avva will give her thumbprint too. My sister is in Mysuru — I'll ask her.
  - who: mahadeva
    t: ಅವಳು ಕೊಡ್ತಾಳಾ? ಕೋರ್ಟಲ್ಲಿ ಕೇಸ್ ಹಾಕಿದೋಳು?
    tr: Avaḷu koḍtāḷā? Kōrṭalli kēs hākidōḷu?
    en: (low, to Suresh) Will she give it? The one who filed a case in court?
  - who: suresh
    t: ಕೇಳಿ ನೋಡೋಣ. ಕೇಳದೇನೇ ‘ಕೊಡಲ್ಲ’ ಅಂತ ನಾವೇ ತೀರ್ಮಾನ ಮಾಡೋದು ಬೇಡ.
    tr: Kēḷi nōḍōṇa. Kēḷadēnē ‘koḍalla’ anta nāvē tīrmāna māḍōdu bēḍa.
    en: Let's ask and see. Let's not decide 'she won't' for her without even asking.
  - who: rakshith
    t: ಸಾರ್, ಒಂದು ಪ್ರಶ್ನೆ. ಕಬ್ಬಿಗೆ ಬೆಲೆ ಯಾರು ತೀರ್ಮಾನ ಮಾಡ್ತಾರೆ? ಕಾರ್ಖಾನೆನಾ, ಸರ್ಕಾರಾನಾ?
    tr: Sār, ondu praśne. Kabbige bele yāru tīrmāna māḍtāre? Kārkhānenā, sarkārānā?
    en: Sir, one question. Who decides the price of cane? The factory or the government?
  - who: millman
    t: ಒಳ್ಳೆ ಪ್ರಶ್ನೆ. ಕೇಂದ್ರ ಸರ್ಕಾರ ಪ್ರತಿ ವರ್ಷ ‘ನ್ಯಾಯಸಮ್ಮತ ಮತ್ತು ಲಾಭದಾಯಕ ಬೆಲೆ’ — ಎಫ್‌ಆರ್‌ಪಿ — ನಿಗದಿ ಮಾಡುತ್ತೆ. ಕಳೆದ ಹಂಗಾಮಿಗೆ ಕ್ವಿಂಟಾಲಿಗೆ ಮುನ್ನೂರ ಐವತ್ತೈದು ರೂಪಾಯಿ, ಅಂದ್ರೆ ಟನ್ನಿಗೆ ಮೂರು ಸಾವಿರದ ಐನೂರ ಐವತ್ತು — ಹತ್ತು ಪಾಯಿಂಟ್ ಎರಡೈದು ಪರ್ಸೆಂಟ್ ರಿಕವರಿಗೆ. ರಿಕವರಿ ಅಂದ್ರೆ ಒಂದು ಟನ್ ಕಬ್ಬಿನಿಂದ ಎಷ್ಟು ಸಕ್ಕರೆ ಬರುತ್ತೆ ಅನ್ನೋದು. ರಿಕವರಿ ಜಾಸ್ತಿ ಆದ್ರೆ ಬೆಲೆ ಜಾಸ್ತಿ, ಕಮ್ಮಿ ಆದ್ರೆ ಕಮ್ಮಿ.
    tr: Oḷḷe praśne. Kēndra sarkāra prati varṣa ‘nyāyasammata mattu lābhadāyaka bele’ — ephārpi — nigadi māḍutte. Kaḷeda haṅgāmige kviṇṭālige munnūra aivattaidu rūpāyi, andre ṭannige mūru sāvirada ainūra aivattu — hattu pāyiṇṭ eraḍaidu parsenṭ rikavarige. Rikavari andre ondu ṭan kabbininda eṣṭu sakkare barutte annōdu. Rikavari jāsti ādre bele jāsti, kammi ādre kammi.
    en: Good question. Every year the central government fixes the 'fair and remunerative price' — the FRP. For last season it was three hundred and fifty-five rupees a quintal — three thousand five hundred and fifty a tonne — at a recovery of ten point two five percent. Recovery means how much sugar comes out of a tonne of cane. Higher recovery, higher price; lower recovery, lower price.
  - who: mahadeva
    t: ಮತ್ತೆ ರಾಜ್ಯ ಸರ್ಕಾರದ ಮೂರು ಸಾವಿರದ ಮುನ್ನೂರು? ಕಳೆದ ನವೆಂಬರ್‌ನಲ್ಲಿ ಬೆಳಗಾವಿ ಕಡೆ ರೈತರು ರಸ್ತೆಗೆ ಇಳಿದಾಗ ಮುಖ್ಯಮಂತ್ರಿಗಳು ಘೋಷಣೆ ಮಾಡಿದ್ರಲ್ಲ? ಅದು ನಮಗೂ ಸಿಗುತ್ತಾ, ಇಲ್ಲಾ ಉತ್ತರ ಕರ್ನಾಟಕಕ್ಕೆ ಮಾತ್ರಾನಾ?
    tr: Matte rājya sarkārada mūru sāvirada munnūru? Kaḷeda Navembar-nalli Beḷagāvi kaḍe raitaru rastege iḷidāga mukhyamantrigaḷu ghōṣaṇe māḍidralla? Adu namagū siguttā, illā uttara Karnāṭakakke mātrānā?
    en: And the state government's three thousand three hundred? Last November, when the farmers took to the roads round Belagavi, didn't the Chief Minister announce it? Do we get that too, or is it only for North Karnataka?
  - who: millman
    t: ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ, ಗೌಡ್ರೇ. ಆ ಮೂರು ಸಾವಿರದ ಮುನ್ನೂರು ಹನ್ನೊಂದೂಕಾಲು ಪರ್ಸೆಂಟ್ ರಿಕವರಿಗೆ, ಕಟಾವು-ಸಾಗಣೆ ಖರ್ಚು ಕಳೆದು ಅಂತ ನಮಗೆ ತಿಳಿಸಿದ್ರು. ನಮ್ಮ ಕಡೆ ರಿಕವರಿ ಅಷ್ಟು ಬರಲ್ಲ. ಮಂಡ್ಯದ ಕಾರ್ಖಾನೆಗಳು ಎಷ್ಟು ಕೊಡ್ತಾವೆ ಅನ್ನೋದು ಇನ್ನೂ ಸ್ಪಷ್ಟ ಇಲ್ಲ. ನಾನು ಹೇಳೋದು ಕಾಗದದಲ್ಲಿ ಇರೋದು ಮಾತ್ರ — ಆಮೇಲೆ ‘ಪ್ರದೀಪ್ ಹೇಳಿದ್ರು’ ಅಂತ ಹಿಡ್ಕೋಬೇಡಿ.
    tr: Nēravāgi hēḷtīni, gauḍrē. Ā mūru sāvirada munnūru hannondūkālu parsenṭ rikavarige, kaṭāvu-sāgaṇe kharcu kaḷedu anta namage tiḷisidru. Namma kaḍe rikavari aṣṭu baralla. Maṇḍyada kārkhānegaḷu eṣṭu koḍtāve annōdu innū spaṣṭa illa. Nānu hēḷōdu kāgadadalli irōdu mātra — āmēle ‘Pradīp hēḷidru’ anta hiḍkōbēḍi.
    en: I'll be straight with you, Gowdre. That three thousand three hundred is for eleven and a quarter percent recovery, after deducting harvesting and transport — that's what we were told. Recovery around here doesn't come that high. How much the Mandya factories will actually pay still isn't clear. I only tell you what's on paper — don't hold me to it later saying 'Pradeep said so'.
  - who: suresh
    t: ಇನ್ನೊಂದು ವಿಷಯ ಸಾರ್. ಕಾನೂನು ಪ್ರಕಾರ ಕಬ್ಬು ಕೊಟ್ಟು ಹದಿನಾಲ್ಕು ದಿನದೊಳಗೆ ಹಣ ಪಾವತಿ ಆಗ್ಬೇಕು ಅಲ್ವಾ? ತಡ ಆದ್ರೆ ಬಡ್ಡಿ ಸೇರಿಸಿ ಕೊಡ್ಬೇಕು. ಕಳೆದ ಸಲದ ಕಬ್ಬಿನ ಹಣ ಅಪ್ಪ ತೀರಿಕೊಂಡಾಗ್ಲೂ ಬಂದಿರಲಿಲ್ಲ.
    tr: Innondu viṣaya sār. Kānūnu prakāra kabbu koṭṭu hadinālku dinadoḷage haṇa pāvati āgbēku alvā? Taḍa ādre baḍḍi sērisi koḍbēku. Kaḷeda salada kabbina haṇa appa tīrikoṇḍāglū bandiralilla.
    en: One more thing, sir. By law, payment has to be made within fourteen days of supplying the cane, doesn't it? If it's late, they must pay interest on top. The money for the last lot of cane hadn't come even when Appa died.
  - who: millman
    t: ನಿಜ. ಕಾನೂನು ಹದಿನಾಲ್ಕು ದಿನ ಅನ್ನುತ್ತೆ. ಆದ್ರೆ ಸಕ್ಕರೆ ಮಾರಾಟ ಆಗಿಲ್ಲ, ಬಾಯ್ಲರ್ ಕೆಟ್ಟು ಅರೆಯೋದು ನಿಂತಿತ್ತು, ಕರೆಂಟ್ ಬಿಲ್ ಬಾಕಿ — ಹೀಗೆ ನೂರು ಕಾರಣ. ನಾನು ಕೆಲಸ ಮಾಡೋ ಕಾರ್ಖಾನೆ ಬಗ್ಗೆ ಕೆಟ್ಟದಾಗಿ ಮಾತಾಡಬಾರದು. ಆದ್ರೆ ನಾನೂ ರೈತನ ಮಗ, ಸಾರ್. ನಮ್ಮಪ್ಪಾನೂ ಕಬ್ಬಿನ ಹಣಕ್ಕೆ ಆರು ತಿಂಗಳು ಕಾದಿದ್ರು.
    tr: Nija. Kānūnu hadinālku dina annutte. Ādre sakkare mārāṭa āgilla, bāylar keṭṭu areyōdu nintittu, kareṇṭ bil bāki — hīge nūru kāraṇa. Nānu kelasa māḍō kārkhāne bagge keṭṭadāgi mātāḍabāradu. Ādre nānū raitana maga, sār. Nammappānū kabbina haṇakke āru tiṅgaḷu kādidru.
    en: True. The law says fourteen days. But the sugar hasn't sold, the boiler broke down and crushing stopped, the electricity bill is in arrears — a hundred reasons. I shouldn't speak ill of the factory I work for. But I'm a farmer's son too, sir. My own father waited six months for his cane money.
  - who: mahadeva
    t: ಕಟಾವು ಯಾವಾಗ ಸಾರ್? ಈ ಎರಡೂವರೆ ಎಕರೆ ಕಬ್ಬಿಗೆ ಅಕ್ಟೋಬರ್‌ಗೆ ಹದಿನಾಲ್ಕು ತಿಂಗಳು ಆಗುತ್ತೆ. ಜಾಸ್ತಿ ದಿನ ನಿಂತ್ರೆ ಕಬ್ಬು ಒಣಗಿ ತೂಕ ಕಮ್ಮಿ ಆಗುತ್ತೆ.
    tr: Kaṭāvu yāvāga sār? Ī eraḍūvare ekare kabbige Akṭōbar-ge hadinālku tiṅgaḷu āgutte. Jāsti dina nintre kabbu oṇagi tūka kammi āgutte.
    en: When's the harvest, sir? This two and a half acres of cane will be fourteen months old by October. If it stands too long, the cane dries out and loses weight.
  - who: millman
    t: ಅಕ್ಟೋಬರ್ ಕೊನೆ ವಾರಕ್ಕೆ ಕಟಾವು ಆದೇಶ ಹಾಕೋಕೆ ಪ್ರಯತ್ನ ಮಾಡ್ತೀನಿ. ಆದ್ರೆ ಕಡಿಯೋಕೆ ಆಳು ನೀವೇ ಹುಡುಕ್ಕೋಬೇಕು, ಇಲ್ಲಾ ಕಟಾವು ಯಂತ್ರ ಬಾಡಿಗೆಗೆ ತಗೋಬೇಕು. ಈಗ ಹಳ್ಳಿಗಳಲ್ಲಿ ಆಳುಗಳೇ ಸಿಗಲ್ಲ — ಹುಡುಗರೆಲ್ಲಾ ಬೆಂಗಳೂರಲ್ಲಿ ಕ್ಯಾಬ್ ಓಡಿಸ್ತಿದಾರೆ.
    tr: Akṭōbar kone vārakke kaṭāvu ādēśa hākōke prayatna māḍtīni. Ādre kaḍiyōke āḷu nīvē huḍukkōbēku, illā kaṭāvu yantra bāḍigege tagōbēku. Īga haḷḷigaḷalli āḷugaḷē sigalla — huḍugarellā Beṅgaḷūralli kyāb ōḍistidāre.
    en: I'll try to put in the harvest order for the last week of October. But you'll have to find cutters yourselves, or hire a harvester. You can't get labourers in the villages now — the young men are all driving cabs in Bengaluru.
  - who: rakshith
    t: ಅಂದ್ರೆ ಕಬ್ಬು ಬೆಳೆಯೋದು ಒಂದು ಕಷ್ಟ, ಕಡಿಯೋದು ಇನ್ನೊಂದು ಕಷ್ಟ, ಹಣ ಬರೋದು ಮೂರನೇ ಕಷ್ಟ.
    tr: Andre kabbu beḷeyōdu ondu kaṣṭa, kaḍiyōdu innondu kaṣṭa, haṇa barōdu mūranē kaṣṭa.
    en: So growing the cane is one struggle, cutting it is another, and getting paid is the third.
  - who: millman
    t: ನಾಲ್ಕನೇದೂ ಇದೆ ತಮ್ಮ — ಮಳೆ. ಅದು ಯಾರ ಸುತ್ತೋಲೆಗೂ ಸಿಗಲ್ಲ. ಬರ್ತೀನಿ ಗೌಡ್ರೇ. ಒಪ್ಪಿಗೆ ಪತ್ರ ಬೇಗ ಕಳಿಸಿ.
    tr: Nālkanēdū ide tamma — maḷe. Adu yāra suttōlegū sigalla. Bartīni gauḍrē. Oppige patra bēga kaḷisi.
    en: There's a fourth one too, young man — the rain. That doesn't obey anybody's circular. I'll be off, Gowdre. Send the consent letter soon.
  - scene: That evening Suresh calls Shobha and puts the phone on speaker. Mahadeva, filling the cattle trough, pretends not to listen.
  - who: shobha
    t: ಒಪ್ಪಿಗೆ ಪತ್ರಾನಾ? … ಅಣ್ಣ, ಕಬ್ಬಿನ ಹಣ ಬೆವರು ಸುರಿಸಿದವನ ಖಾತೆಗೆ ಹೋಗ್ಬೇಕು. ಅದರಲ್ಲಿ ನನಗೆ ಯಾವ ತಕರಾರೂ ಇಲ್ಲ. ನಾಳೆ ವಕೀಲರಿಗೆ ತೋರಿಸಿ, ಸಹಿ ಹಾಕಿ ಕಳಿಸ್ತೀನಿ — ಕೇಸಿಗೆ ತೊಂದರೆ ಆಗಬಾರ್ದು, ಅಷ್ಟೇ.
    tr: Oppige patrānā? … Aṇṇa, kabbina haṇa bevaru surisidavana khātege hōgbēku. Adaralli nanage yāva takarārū illa. Nāḷe vakīlarige tōrisi, sahi hāki kaḷistīni — kēsige tondare āgabārdu, aṣṭē.
    en: A consent letter? … Anna, the cane money should go into the account of the man who sweated for it. I have no objection to that at all. Tomorrow I'll show it to the lawyer, sign it and send it — it just mustn't harm the case, that's all.
  - who: mahadeva
    t: ಕೇಳಿದ್ಯಾ ಗೌರಿ? ‘ಬೆವರು ಸುರಿಸಿದವನು’ ಅಂದ್ಲು.
    tr: Kēḷidyā Gauri? ‘Bevaru surisidavanu’ andlu.
    en: (to the cow, after the call ends) Did you hear that, Gauri? 'The man who sweated for it,' she said.
  - section: Night water
    learn: 'a court notice: mundūḍalāgide, pīṭhāsīna adhikārigaḷu, svīkarisalāgide, jaṇṭi arji · night irrigation: badu oḍedide, nīru kaṭṭōdu, namma sarati · the failed borewell: ārunūrā aivattu aḍi, ondu hani nīrū barlilla, battōytu · admitting fault: adu nanna tappu, kēḷiskoḷḷalilla · proposing peace: alli hōgōṇa, Śōbhā oppidre'
  - scene: Friday, 14 August 2026. The Maddur court complex. The cause list is pinned to the notice board; beside the number of Shobha's suit is one word in red ink. Suresh and Mahadeva have come together, on Mahadeva's motorbike. Advocate Nagendra reads the board.
  - who: lawyer
    t: ‘ಮುಂದೂಡಲಾಗಿದೆ.’ ಪೀಠಾಸೀನ ಅಧಿಕಾರಿಗಳು ತರಬೇತಿಗೆ ಹೋಗಿದಾರೆ. ಲಿಖಿತ ಹೇಳಿಕೆಗಳನ್ನ ಕಚೇರಿಯಲ್ಲಿ ಸ್ವೀಕರಿಸಲಾಗಿದೆ. ಮುಂದಿನ ದಿನಾಂಕ ನವೆಂಬರ್ ಇಪ್ಪತ್ತೇಳು.
    tr: ‘Mundūḍalāgide.’ Pīṭhāsīna adhikārigaḷu tarabētige hōgidāre. Likhita hēḷikegaḷanna kacēriyalli svīkarisalāgide. Mundina dināṅka Navembar ippattēḷu.
    en: '''Adjourned.'' The presiding officer has gone for training. The written statements have been received at the office. Next date: the twenty-seventh of November.'
  - who: mahadeva
    t: ಮೂರು ತಿಂಗಳು ಕಾದು, ಒಂದು ಪದ. ‘ಮುಂದೂಡಲಾಗಿದೆ.’ ಇದಕ್ಕೆ ನಾನು ನಾಟಿ ಮಾಡಿದ ಗದ್ದೆ ಬಿಟ್ಟು ಬಂದೆ.
    tr: Mūru tiṅgaḷu kādu, ondu pada. ‘Mundūḍalāgide.’ Idakke nānu nāṭi māḍida gadde biṭṭu bande.
    en: Three months of waiting, and one word. 'Adjourned.' For this I left a freshly planted field and came.
  - who: lawyer
    t: 'ಮೊದಲ ವರ್ಷ ಹೀಗೇ, ಮಹದೇವ ಅವರೇ. ಬೇಸರ ಮಾಡ್ಕೋಬೇಡಿ — ನಿಮ್ಮ ವಕೀಲರಿಗೂ ನನಗೂ ಇದು ಹೊಸದಲ್ಲ. ಆದ್ರೆ ಒಂದು ಗಮನಿಸಿದೆ: ಇವತ್ತು ನೀವಿಬ್ರೂ ಒಂದೇ ಬೈಕಲ್ಲಿ ಬಂದ್ರಿ.'
    tr: 'Modala varṣa hīgē, Mahadēva avarē. Bēsara māḍkōbēḍi — nimma vakīlarigū nanagū idu hosadalla. Ādre ondu gamaniside: ivattu nīvibbrū ondē baikalli bandri.'
    en: 'The first year goes like this, Mr Mahadeva. Don''t be disheartened — it''s nothing new to your lawyer or to me. But I noticed one thing: today the two of you came on one motorbike.'
  - who: suresh
    t: ಬಸ್ಸು ತಪ್ಪಿತು ಸಾರ್, ಅಷ್ಟೇ.
    tr: Bassu tappitu sār, aṣṭē.
    en: (a little embarrassed) I missed the bus, sir, that's all.
  - who: lawyer
    t: ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದಲ್ಲಿ ಎಷ್ಟೋ ಜನ ‘ಬಸ್ಸು ತಪ್ಪಿತು’ ಅಂತ ಶುರು ಮಾಡಿ ರಾಜಿ ಆಗಿದಾರೆ. ಯೋಚನೆ ಮಾಡಿ. ಮುಂದಿನ ದಿನಾಂಕಕ್ಕೆ ಮುಂಚೆ ಮೂರೂ ಜನ ಒಪ್ಪಿ ಜಂಟಿ ಅರ್ಜಿ ಕೊಟ್ರೆ, ಕೋರ್ಟು ಕೇಸನ್ನ ಲೋಕ ಅದಾಲತ್‌ಗೆ ಕಳಿಸಬಹುದು.
    tr: Ippatteraḍu varṣadalli eṣṭō jana ‘bassu tappitu’ anta śuru māḍi rāji āgidāre. Yōcane māḍi. Mundina dināṅkakke mun̄ce mūrū jana oppi jaṇṭi arji koṭre, kōrṭu kēsanna Lōka Adālat-ge kaḷisabahudu.
    en: In twenty-two years I've seen plenty of people begin with 'I missed the bus' and end up settling. Think about it. If all three of you agree and file a joint application before the next date, the court can send the case to the Lok Adalat.
  - scene: Sunday, 16 August 2026, two in the morning. The canal water reached Bettahalli's branch channel on Friday; tonight is the family's turn. Torchlight, frogs, the sound of running water. The brothers stand ankle-deep in the transplanted paddy.
  - who: mahadeva
    t: ಆ ಕಡೆ ಬದು ಒಡೆದಿದೆ ಅಣ್ಣ, ನೀರು ಪಕ್ಕದವರ ಗದ್ದೆಗೆ ಹೋಗ್ತಿದೆ! ಮಣ್ಣು ಹಾಕು, ಬೇಗ!
    tr: Ā kaḍe badu oḍedide aṇṇa, nīru pakkadavara gaddege hōgtide! Maṇṇu hāku, bēga!
    en: The bund's broken over there, Anna — the water's running into the neighbour's field! Throw some earth on it, quick!
  - who: suresh
    t: ಆಯ್ತು… ನಿಂತ್ಕೊಳ್ತು. ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ನೀರು ಕಟ್ಟೋದು — ಇದನ್ನ ನೀನು ಇಪ್ಪತ್ತು ವರ್ಷ ಮಾಡಿದ್ಯಾ?
    tr: Āytu… nintkoḷtu. Rātri eraḍu gaṇṭege nīru kaṭṭōdu — idanna nīnu ippattu varṣa māḍidyā?
    en: Done… it's holding. Watering at two in the morning — you did this for twenty years?
  - who: mahadeva
    t: ನಮ್ಮ ಸರತಿ ರಾತ್ರಿ ಬಂದ್ರೆ ರಾತ್ರಿ, ಮಧ್ಯಾಹ್ನ ಬಂದ್ರೆ ಮಧ್ಯಾಹ್ನ. ನಾಲೆ ನಮ್ಮ ನಿದ್ದೆ ಕೇಳಲ್ಲ. ಸರತಿ ತಪ್ಪಿದ್ರೆ ಮುಂದಿನ ಕಟ್ಟು ಬರೋವರೆಗೆ ಪೈರು ಬಾಯಿ ಬಿಟ್ಕಂಡು ಕಾಯ್ಬೇಕು.
    tr: Namma sarati rātri bandre rātri, madhyāhna bandre madhyāhna. Nāle namma nidde kēḷalla. Sarati tappidre mundina kaṭṭu barōvarege pairu bāyi biṭkaṇḍu kāybēku.
    en: If our turn comes at night, it's night; if it comes at noon, it's noon. The canal doesn't ask about our sleep. Miss your turn, and the crop has to wait with its mouth open till the next rotation.
  - who: suresh
    t: ಬೋರ್‌ವೆಲ್‌ನಲ್ಲಿ ನೀರು ಸಿಕ್ಕಿದ್ರೆ ಈ ಕಾಯೋದು ತಪ್ಪುತ್ತಿತ್ತು ಅಂತ ಅನ್ಕೊಂಡಿದ್ದೆ. … ಆರುನೂರಾ ಐವತ್ತು ಅಡಿ, ಮಹದೇವ. ಒಂದು ಹನಿ ನೀರೂ ಬರ್ಲಿಲ್ಲ. ಬರೀ ಧೂಳು.
    tr: Bōrvel-nalli nīru sikkidre ī kāyōdu tapputtittu anta ankoṇḍidde. … Ārunūrā aivattu aḍi, Mahadēva. Ondu hani nīrū barlilla. Barī dhūḷu.
    en: I'd thought that if the borewell struck water, all this waiting would end. … Six hundred and fifty feet, Mahadeva. Not one drop of water came up. Only dust.
  - who: mahadeva
    t: ನಾನು ಮೊದಲೇ ಹೇಳಿದ್ದೆ. ಆ ಹೊಲದ ಕೆಳಗೆ ಕಲ್ಲು. ಪಕ್ಕದ ಫಾರ್ಮ್‌ಹೌಸ್‌ನವರು ಏಳುನೂರು ಅಡಿ ಕೊರೆಸಿದಾಗಲೇ ನಮ್ಮ ಹಳೇ ಬಾವಿ ಬತ್ತೋಯ್ತು. ಭೂಮಿತಾಯಿ ‘ಇಲ್ಲ’ ಅಂದ್ರೆ ಇಲ್ಲ, ಅಣ್ಣ. ಒಂದು ಲಕ್ಷದ ಹತ್ತಿರ ನಿನ್ನ ದುಡ್ಡು ಮಣ್ಣಲ್ಲಿ ಹೋಯ್ತು.
    tr: Nānu modalē hēḷidde. Ā holada keḷage kallu. Pakkada phārm-haus-navaru ēḷunūru aḍi koresidāgalē namma haḷē bāvi battōytu. Bhūmitāyi ‘illa’ andre illa, aṇṇa. Ondu lakṣada hattira ninna duḍḍu maṇṇalli hōytu.
    en: I told you beforehand. Under that field there's rock. When the farmhouse people next door drilled seven hundred feet, our old well dried up. When Mother Earth says 'no', it's no, Anna. Close to a lakh of your money has gone into the ground.
  - who: suresh
    t: ದುಡ್ಡು ಹೋಯ್ತು, ಹೋಗ್ಲಿ. ನೀನು ‘ಬೇಡ’ ಅಂದಾಗ ನಾನು ಕೇಳಿಸ್ಕೊಳ್ಳಲಿಲ್ಲ — ಅದು ನನ್ನ ತಪ್ಪು. ಬ್ಯಾಂಕಲ್ಲಿ ಕೂತು ‘ನಾನೇ ಸರಿ’ ಅನ್ನೋ ಅಭ್ಯಾಸ, ಅದನ್ನ ಹೊಲಕ್ಕೂ ತಂದೆ.
    tr: Duḍḍu hōytu, hōgli. Nīnu ‘bēḍa’ andāga nānu kēḷiskoḷḷalilla — adu nanna tappu. Byāṅkalli kūtu ‘nānē sari’ annō abhyāsa, adanna holakkū tande.
    en: The money's gone — let it go. When you said 'don't', I didn't listen — that was my mistake. The habit of sitting in a bank thinking 'I'm always right' — I brought that to the field too.
  - who: mahadeva
    t: ಅಣ್ಣ… ನೀನು ತಪ್ಪು ಒಪ್ಪಿಕೊಳ್ಳೋದು ನಾನು ನೋಡ್ತಿರೋದು ಇದು ಎರಡನೇ ಸಲ. ಮೊದಲನೇದು ಪಂಚಾಯ್ತಿ ರಾತ್ರಿ, ಶೋಭಾ ಮದುವೆ ವಿಷಯದಲ್ಲಿ.
    tr: Aṇṇa… nīnu tappu oppikoḷḷōdu nānu nōḍtirōdu idu eraḍanē sala. Modalanēdu pan̄cāyti rātri, Śōbhā maduve viṣayadalli.
    en: Anna… this is only the second time I've seen you admit a mistake. The first was the night of the panchayati, over Shobha's wedding.
  - who: suresh
    t: ಮೂರನೇದೂ ಇದೆ. ಶುಕ್ರವಾರ ಆ ಕೆಂಪು ಶಾಯಿಯ ಒಂದು ಪದ ನೋಡಿದ ಮೇಲೆ ಅರ್ಥ ಆಯ್ತು — ನಾಗೇಂದ್ರ ಅವರು ಹೇಳಿದ ಹಾಗೇ ಆಗ್ತಿದೆ. ವರ್ಷಕ್ಕೆ ಮೂರು ದಿನಾಂಕ, ಹತ್ತು ವರ್ಷಕ್ಕೆ ಮೂವತ್ತು. ಮಹದೇವ, ನಾನು ಆ ಕೇಸಲ್ಲಿ ಸುಮ್ನೆ ನಿಂತಿದ್ದೇ ತಪ್ಪು. ಅಣ್ಣ ಆಗಿ ನಾನು ಮೊದಲೇ ನಿಮ್ಮಿಬ್ರನ್ನೂ ಕೂರಿಸ್ಬೇಕಿತ್ತು.
    tr: Mūranēdū ide. Śukravāra ā kempu śāyiya ondu pada nōḍida mēle artha āytu — Nāgēndra avaru hēḷida hāgē āgtide. Varṣakke mūru dināṅka, hattu varṣakke mūvattu. Mahadēva, nānu ā kēsalli sumne nintiddē tappu. Aṇṇa āgi nānu modalē nimmibbrannū kūrisbēkittu.
    en: There's a third, too. After seeing that one word in red ink on Friday, I understood — it's going exactly the way Nagendra said. Three dates a year; thirty in ten years. Mahadeva, my just standing by silently in that case was itself a mistake. As the eldest, I should have sat the two of you down long ago.
  - who: mahadeva
    t: ಅಣ್ಣ, ನಾನೊಂದು ಹೇಳ್ಲಾ? ಮೂರು ತಿಂಗಳಿಂದ ನೀನು ಪ್ರತಿ ಶನಿವಾರ ಬರ್ತಿದೀಯ. ಕಳೆ ಕಿತ್ತೆ, ನಾಟಿ ಮಾಡ್ದೆ, ಬೋರ್‌ಗೆ ದುಡ್ಡು ಹಾಕ್ದೆ, ಈಗ ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಕೆಸರಲ್ಲಿ ನಿಂತಿದೀಯ. ಯಾರಿಗಾಗಿ? ಪಾಲಿಗಾಗಿ ಅಲ್ಲ ಅಂತ ನನಗೀಗ ಗೊತ್ತು.
    tr: Aṇṇa, nānondu hēḷlā? Mūru tiṅgaḷinda nīnu prati Śanivāra bartidīya. Kaḷe kitte, nāṭi māḍde, bōr-ge duḍḍu hākde, īga rātri eraḍu gaṇṭege kesaralli nintidīya. Yārigāgi? Pāligāgi alla anta nanagīga gottu.
    en: Anna, may I say something? For three months you've come every Saturday. You pulled weeds, you transplanted, you put money into the borewell, and now you're standing in the mud at two in the morning. For whom? Now I know it isn't for a share.
  - who: suresh
    t: ಅಪ್ಪನ ದಿನಚರಿ ಓದಿದ ಮೇಲೆ ನನಗೆ ಒಂದು ಅರ್ಥ ಆಯ್ತು, ಮಹದೇವ. ‘ಜಮೀನು ಮಾರಲ್ಲ’ ಅಂತ ಅಪ್ಪ ನಡುವಿನ ಯಾವುದೋ ಪುಟದಲ್ಲಿ ಬರೆದಿದ್ರು. ಆದ್ರೆ ‘ಮೂರೂ ಮಕ್ಕಳು ಒಟ್ಟಿಗೆ ಉಣ್ಣಬೇಕು’ ಅಂತ ಕೊನೇ ಪುಟದಲ್ಲಿ ಬರೆದಿದ್ರು. ಕೊನೇ ಪುಟದಲ್ಲಿ ಬರೆಯೋದೇ ಮನುಷ್ಯನ ಕೊನೇ ಆಸೆ.
    tr: Appana dinacari ōdida mēle nanage ondu artha āytu, Mahadēva. ‘Jamīnu māralla’ anta appa naḍuvina yāvudō puṭadalli baredidru. Ādre ‘mūrū makkaḷu oṭṭige uṇṇabēku’ anta konē puṭadalli baredidru. Konē puṭadalli bareyōdē manuṣyana konē āse.
    en: After reading Appa's diary I understood one thing, Mahadeva. Appa wrote 'I will not sell the land' somewhere in the middle pages. But on the very last page he wrote that all three children must eat together. What a man writes on the last page is his last wish.
  - who: mahadeva
    t: … ಮೇ ತಿಂಗಳಲ್ಲಿ ಜಡ್ಜ್ ಸಾಹೇಬ್ರು ‘ಮಧ್ಯಸ್ಥಿಕೆಗೆ ಹೋಗ್ತೀರಾ’ ಅಂತ ಕೇಳಿದಾಗ ‘ಈಗ ಬೇಡ’ ಅಂದಿದ್ದು ನನ್ನ ಕಡೆಯವರು. ಆಗ ನಂಗೆ ಹೆದರಿಕೆ ಇತ್ತು — ರಾಜಿ ಅಂದ್ರೆ ನಾನು ಸೋತೆ ಅಂತ. … ಲೋಕ ಅದಾಲತ್ ಅಂತ ನಾಗೇಂದ್ರ ಅವರು ಹೇಳಿದ್ರಲ್ಲ? ಅಲ್ಲಿಗೆ ಹೋಗೋಣ ಅಣ್ಣ. ಶೋಭಾ ಒಪ್ಪಿದ್ರೆ.
    tr: … Mē tiṅgaḷalli jaḍj sāhēbru ‘madhyasthikege hōgtīrā’ anta kēḷidāga ‘īga bēḍa’ andiddu nanna kaḍeyavaru. Āga naṅge hedarike ittu — rāji andre nānu sōte anta. … Lōka Adālat anta Nāgēndra avaru hēḷidralla? Allige hōgōṇa aṇṇa. Śōbhā oppidre.
    en: (after a long silence) … In May, when the judge asked 'will you go to mediation?', it was my side that said 'not now'. Back then I was afraid — that a compromise meant I'd lost. … That Lok Adalat Nagendra talked about? Let's go there, Anna. If Shobha agrees.
  - who: suresh
    t: ಇದನ್ನ ಹೇಳೋಕೆ ರಾತ್ರಿ ಎರಡು ಗಂಟೆ, ಮೊಣಕಾಲುವರೆಗೂ ಕೆಸರು ಬೇಕಾಯ್ತು ನೋಡು.
    tr: Idanna hēḷōke rātri eraḍu gaṇṭe, moṇakāluvaregū kesaru bēkāytu nōḍu.
    en: (laughing softly) Look at that — it took two in the morning and mud up to our knees for you to say it.
  - who: mahadeva
    t: ಹಗಲಲ್ಲಿ ಹೇಳಿದ್ರೆ ಊರೆಲ್ಲಾ ಕೇಳುತ್ತೆ. ರಾತ್ರಿ ಕಪ್ಪೆಗಳು ಮಾತ್ರ. ನಾಳೆ ಶೋಭಂಗೆ ನೀನೇ ಫೋನ್ ಮಾಡು. ನಾನು ಮಾಡಿದ್ರೆ ಮತ್ತೆ ಜಗಳ ಆಗುತ್ತೆ.
    tr: Hagalalli hēḷidre ūrellā kēḷutte. Rātri kappegaḷu mātra. Nāḷe Śōbhaṅge nīnē phōn māḍu. Nānu māḍidre matte jagaḷa āgutte.
    en: Say it in daylight and the whole village hears. At night there are only the frogs. Tomorrow you phone Shobha. If I do it, we'll only end up fighting again.
  - scene: Monday evening. Shobha, just off her shift, calls back from the bus stop outside her hospital in Mysuru.
  - who: shobha
    t: ಲೋಕ ಅದಾಲತ್? ಮಹದೇವಾನೇ ಹೇಳಿದ್ನಾ? … ಅಣ್ಣ, ನನಗೆ ಬೇಕಾಗಿದ್ದು ಗೆಲುವಲ್ಲ, ನನ್ನ ಹೆಸರು. ಆ ಹೆಸರು ಕಾಗದದಲ್ಲಿ ಉಳಿಯೋ ಹಾಗಿದ್ರೆ ನಾನು ಬರ್ತೀನಿ. ನಾಗೇಂದ್ರ ಅವರಿಗೆ ಹೇಳ್ತೀನಿ — ಮುಂದಿನ ದಿನಾಂಕದಲ್ಲಿ ಮೂರೂ ಜನ ಸೇರಿ ಜಂಟಿ ಅರ್ಜಿ ಹಾಕೋಣ ಅಂತ.
    tr: Lōka Adālat? Mahadēvānē hēḷidnā? … Aṇṇa, nanage bēkāgiddu geluvalla, nanna hesaru. Ā hesaru kāgadadalli uḷiyō hāgidre nānu bartīni. Nāgēndra avarige hēḷtīni — mundina dināṅkadalli mūrū jana sēri jaṇṭi arji hākōṇa anta.
    en: The Lok Adalat? Mahadeva himself said that? … Anna, what I wanted was never victory — it was my name. If that name stays on the paper, I'll come. I'll tell Nagendra — at the next date, let the three of us file a joint application together.
  - section: Milk before sunrise
    learn: 'dairy words: hālu kare, karu, gabba, hālina saṅgha, phyāṭ nōḍi bele, prōtsāhadhana · frequency: hadinaidu dinakkondsala, varṣakkondsala · naming: nīnē iḍu, mommaga iṭṭa hesaru · habitual past: hāḍu hēḷtidru, nintkaḷtittu'
  - scene: Saturday, 24 October 2026, quarter past five in the morning. Dasara is just over. In the cattle shed Rakshith, in a sweater, sits on a low stool beside Gauri while Mahadeva shows him how to milk. The calf, ten months old now, nudges the boy's shoulder.
  - who: mahadeva
    t: ಮೊದ್ಲು ಕರುಗೆ ಸ್ವಲ್ಪ ಕುಡಿಯೋಕೆ ಬಿಡು. ಕರು ಮೊಲೆಗೆ ಬಾಯಿ ಹಾಕಿದ್ರೆ ಹಸು ಹಾಲು ಇಳಿಸುತ್ತೆ. ಆಮೇಲೆ ಕರುನ ಕಟ್ಟು, ನೀನು ಕರೆ.
    tr: Modlu karuge svalpa kuḍiyōke biḍu. Karu molege bāyi hākidre hasu hālu iḷisutte. Āmēle karuna kaṭṭu, nīnu kare.
    en: First let the calf drink a little. When the calf puts its mouth to the udder, the cow lets her milk down. Then tie up the calf, and you milk.
  - who: rakshith
    t: ಚಿಕ್ಕಪ್ಪ, ಹೆಬ್ಬೆರಳು ಮತ್ತೆ ಮೊದಲ ಬೆರಳಿಂದ ಒತ್ತಿ ಕೆಳಗೆ ಎಳೆಯೋದಾ? … ಬಂತು! ಬಂತು!
    tr: Cikkappa, hebberaḷu matte modala beraḷinda otti keḷage eḷeyōdā? … Bantu! Bantu!
    en: Chikkappa, you squeeze with your thumb and first finger and pull down? … It's coming! It's coming!
  - who: mahadeva
    t: ಕೂಗಬೇಡ, ಗೌರಿ ಹೆದರ್ಕೊಳ್ಳುತ್ತೆ. ಹಸುಗೆ ಗಲಾಟೆ ಆಗಲ್ಲ. ನಿಮ್ಮ ತಾತ ಹಾಲು ಕರೆಯೋವಾಗ ಹಾಡು ಹೇಳ್ತಿದ್ರು — ಮೆತ್ತಗೆ. ಹಸು ಕಣ್ಣು ಮುಚ್ಕಂಡು ನಿಂತ್ಕಳ್ತಿತ್ತು.
    tr: Kūgabēḍa, Gauri hedarkoḷḷutte. Hasuge galāṭe āgalla. Nimma tāta hālu kareyōvāga hāḍu hēḷtidru — mettage. Hasu kaṇṇu muckaṇḍu nintkaḷtittu.
    en: Don't shout, Gauri will take fright. Cows can't stand noise. Your Thatha used to sing while he milked — softly. The cow would stand there with her eyes closed.
  - who: rakshith
    t: ದಿನಕ್ಕೆ ಎಷ್ಟು ಲೀಟರ್ ಬರುತ್ತೆ? ಡೈರಿಯವರು ಎಷ್ಟು ಕೊಡ್ತಾರೆ?
    tr: Dinakke eṣṭu līṭar barutte? Ḍairiyavaru eṣṭu koḍtāre?
    en: How many litres does she give a day? How much does the dairy pay?
  - who: mahadeva
    t: ಗೌರಿ ಎರಡು ಹೊತ್ತು ಸೇರಿ ಹತ್ತು-ಹನ್ನೆರಡು ಲೀಟರ್. ಇನ್ನೊಂದು ಹಸು ಈಗ ಗಬ್ಬ, ಹಾಲು ನಿಂತಿದೆ. ಊರಿನ ಹಾಲಿನ ಸಂಘದಲ್ಲಿ ಫ್ಯಾಟ್ ನೋಡಿ ಲೀಟರಿಗೆ ಬೆಲೆ. ಸರ್ಕಾರದ ಪ್ರೋತ್ಸಾಹಧನ ಬೇರೆ — ಅದು ಕೆಲವು ಸಲ ತಿಂಗಳುಗಟ್ಲೆ ತಡ. ಆದ್ರೆ ಸಂಘದ ಹಣ ಹದಿನೈದು ದಿನಕ್ಕೊಂದ್ಸಲ ಬರುತ್ತೆ. ಕಬ್ಬು ವರ್ಷಕ್ಕೊಂದ್ಸಲ ಬಾಗಿಲು ತಟ್ಟುತ್ತೆ, ಹಸು ಹದಿನೈದು ದಿನಕ್ಕೊಂದ್ಸಲ. ಮನೆ ನಡೆಯೋದು ಹಸುವಿಂದ.
    tr: Gauri eraḍu hottu sēri hattu-hanneraḍu līṭar. Innondu hasu īga gabba, hālu nintide. Ūrina hālina saṅghadalli phyāṭ nōḍi līṭarige bele. Sarkārada prōtsāhadhana bēre — adu kelavu sala tiṅgaḷugaṭle taḍa. Ādre saṅghada haṇa hadinaidu dinakkondsala barutte. Kabbu varṣakkondsala bāgilu taṭṭutte, hasu hadinaidu dinakkondsala. Mane naḍeyōdu hasuvinda.
    en: Gauri gives ten or twelve litres, morning and evening together. The other cow is in calf and has gone dry. At the village milk society the price per litre depends on the fat. The government's incentive comes separately — and sometimes that's months late. But the society pays every fifteen days. Cane knocks on the door once a year; the cow, every fifteen days. It's the cow that keeps the house running.
  - who: rakshith
    t: ಈ ಕರುಗೆ ಹೆಸರೇ ಇಲ್ಲ ಅಲ್ವಾ? ಹತ್ತು ತಿಂಗಳಾಯ್ತು. ತಾತ ಹೋದ ವಾರಾನೇ ಹುಟ್ಟಿದ್ದು.
    tr: Ī karuge hesarē illa alvā? Hattu tiṅgaḷāytu. Tāta hōda vārānē huṭṭiddu.
    en: This calf doesn't even have a name, does she? It's been ten months. She was born the very week Thatha died.
  - who: mahadeva
    t: ಆ ಗದ್ದಲದಲ್ಲಿ ಯಾರಿಗೆ ಹೆಸರು ನೆನಪಾಗುತ್ತೆ? ನೀನೇ ಇಡು. ಮೊಮ್ಮಗ ಇಟ್ಟ ಹೆಸರು.
    tr: Ā gaddaladalli yārige hesaru nenapāgutte? Nīnē iḍu. Mommaga iṭṭa hesaru.
    en: In all that turmoil, who'd have thought of a name? You give her one. A name from the grandson.
  - who: rakshith
    t: ಕಾವೇರಿ. ನಾಲೆ ನೀರಿಗೆ ನಾವೆಲ್ಲಾ ಕಾಯ್ತಿದ್ವಲ್ಲ — ಅದಕ್ಕೆ.
    tr: Kāvēri. Nāle nīrige nāvellā kāytidvalla — adakke.
    en: Kaveri. Because all of us kept waiting for the canal water.
  - who: avva
    t: ಕಾವೇರಿ… ಒಳ್ಳೆ ಹೆಸರು. ನಮ್ಮ ಮನೆ ಮಗಳ ಹಾಗೆ — ಬಂದ್ರೆ ಬೆಳೆ, ಬರ್ದಿದ್ರೆ ಕಾಯೋದು.
    tr: Kāvēri… oḷḷe hesaru. Namma mane magaḷa hāge — bandre beḷe, bardidre kāyōdu.
    en: (from the doorway) Kaveri… a good name. Like a daughter of our house — when she comes, there's a harvest; when she doesn't, there's waiting.
  - section: The harvester and the weighbridge
    learn: 'labour shortage: āḷugaḷu siklē ilvā, muṅgaḍa tagoṇḍu hōdru, kūli koṭrū baralla · hiring a machine: kaṭāvu yantra, guttigedāra, ṭannige iṣṭu anta bāḍige · the queue: tūkada cīṭi, rasa oṇagutte, tūka iḷiyutte · estimating: ekarege nalavattu bandre, āgabahudu, andkoṇḍrū'
  - scene: Wednesday, 28 October 2026. The harvest order has come. Suresh has taken three days' leave. At dawn a hired cane harvester — a huge green machine on tracks — crawls down the cart track, followed by two tractors with trailers.
  - who: suresh
    t: ಆಳುಗಳು ಸಿಕ್ಲೇ ಇಲ್ವಾ, ಮಹದೇವ?
    tr: Āḷugaḷu siklē ilvā, Mahadēva?
    en: Couldn't you find any cutters at all, Mahadeva?
  - who: mahadeva
    t: ಬೆಳಗಾವಿ ಕಡೆಯಿಂದ ಒಂದು ಗ್ಯಾಂಗ್ ಬರ್ತೀವಿ ಅಂದಿದ್ರು. ಮುಂಗಡ ತಗೊಂಡು ಬೇರೆ ಊರಿಗೆ ಹೋದ್ರು. ನಮ್ಮೂರಲ್ಲಿ ಕಬ್ಬು ಕಡಿಯೋರು ನಾಲ್ಕು ಜನ ಇದಾರೆ, ಎಲ್ರೂ ಅರವತ್ತು ದಾಟಿದೋರು. ದಿನಕ್ಕೆ ಆರುನೂರು-ಏಳುನೂರು ಕೂಲಿ ಕೊಟ್ರೂ ಹುಡುಗರು ಬರಲ್ಲ. ಅದಕ್ಕೇ ಈ ಯಂತ್ರ.
    tr: Beḷagāvi kaḍeyinda ondu gyāṅg bartīvi andidru. Muṅgaḍa tagoṇḍu bēre ūrige hōdru. Nammūralli kabbu kaḍiyōru nālku jana idāre, ellrū aravattu dāṭidōru. Dinakke ārunūru-ēḷunūru kūli koṭrū huḍugaru baralla. Adakkē ī yantra.
    en: A gang from the Belagavi side said they'd come. They took an advance and went to another village. In our village there are four men who can cut cane, all past sixty. Even at six or seven hundred a day, the young lads won't come. That's why this machine.
  - who: rakshith
    t: ಇದು ಒಂದು ಕೋಟಿ ರೂಪಾಯಿ ಯಂತ್ರ ಅಂತ ಡ್ರೈವರ್ ಹೇಳಿದ್ರು! ಯಾರದು ಇದು?
    tr: Idu ondu kōṭi rūpāyi yantra anta ḍraivar hēḷidru! Yāradu idu?
    en: The driver said this is a one-crore machine! Whose is it?
  - who: mahadeva
    t: ಮದ್ದೂರಿನ ಒಬ್ಬ ಗುತ್ತಿಗೆದಾರರದ್ದು. ನಮ್ಮಂಥೋರು ಕೊಳ್ಳೋಕಾಗುತ್ತಾ? ಟನ್ನಿಗೆ ಇಷ್ಟು ಅಂತ ಬಾಡಿಗೆ. ಯಂತ್ರ ಒಂದು ದಿನದಲ್ಲಿ ಮುಗಿಸುತ್ತೆ, ಆಳುಗಳಿಗೆ ಒಂದು ವಾರ. ಆದ್ರೆ ಯಂತ್ರ ಬುಡಾನ ಸ್ವಲ್ಪ ಎತ್ತರದಲ್ಲಿ ಕಡಿಯುತ್ತೆ, ಕೂಳೆಗೆ ಅಷ್ಟು ಒಳ್ಳೇದಲ್ಲ ಅಂತಾರೆ. ಏನು ಮಾಡೋದು — ಆಳು ಇಲ್ದಿದ್ರೆ ಯಂತ್ರ, ಯಂತ್ರ ಇಲ್ದಿದ್ರೆ ಕಬ್ಬು ಗದ್ದೆಯಲ್ಲೇ ಒಣಗುತ್ತೆ.
    tr: Maddūrina obba guttigedāraraddu. Nammanthōru koḷḷōkāguttā? Ṭannige iṣṭu anta bāḍige. Yantra ondu dinadalli mugisutte, āḷugaḷige ondu vāra. Ādre yantra buḍāna svalpa ettaradalli kaḍiyutte, kūḷege aṣṭu oḷḷēdalla antāre. Ēnu māḍōdu — āḷu ildidre yantra, yantra ildidre kabbu gaddeyallē oṇagutte.
    en: It belongs to a contractor in Maddur. Can people like us buy one? He charges so much a tonne. The machine finishes in a day; labourers would take a week. But it cuts the stumps a bit high, and they say that isn't so good for the ratoon. What can you do — no labour, then the machine; no machine, then the cane dries in the field.
  - scene: Afternoon. The weighbridge outside the factory gate. A long line of tractors and a few bullock carts heaped with cane stretches down the road. Suresh and Mahadeva wait beside their trailer.
  - who: suresh
    t: ಎಷ್ಟು ಹೊತ್ತಿಂದ ಈ ಸಾಲಲ್ಲಿ ನಿಂತಿದೀವಿ? ಐದು ಗಂಟೆ!
    tr: Eṣṭu hottinda ī sālalli nintidīvi? Aidu gaṇṭe!
    en: How long have we been standing in this line? Five hours!
  - who: mahadeva
    t: ಇದು ಕಮ್ಮಿ. ಬಾಯ್ಲರ್ ಕೆಟ್ಟಾಗ ಮೂರು ದಿನ ನಿಂತಿದ್ದೆ, ಟ್ರ್ಯಾಕ್ಟರ್ ಕೆಳಗೆ ಮಲಗಿ. ಕಬ್ಬು ಕಡಿದ ಮೇಲೆ ಪ್ರತಿ ಗಂಟೆಗೂ ರಸ ಒಣಗುತ್ತೆ, ತೂಕ ಇಳಿಯುತ್ತೆ. ಕಾಯೋದು ನಾವು, ನಷ್ಟಾನೂ ನಮ್ಗೇ.
    tr: Idu kammi. Bāylar keṭṭāga mūru dina nintidde, ṭryākṭar keḷage malagi. Kabbu kaḍida mēle prati gaṇṭegū rasa oṇagutte, tūka iḷiyutte. Kāyōdu nāvu, naṣṭānū namgē.
    en: This is nothing. When the boiler broke down I stood here three days, sleeping under the tractor. Once cane is cut, every hour the juice dries and the weight drops. We do the waiting, and the loss is ours as well.
  - who: suresh
    t: ತೂಕದ ಚೀಟಿ ಕೊಡು, ನೋಡ್ತೀನಿ. … ಈ ಟ್ರಾಲಿ ಹನ್ನೆರಡು ಟನ್ನು. ಎರಡೂವರೆ ಎಕರೆಗೆ ಒಟ್ಟು ಎಷ್ಟು ಆಗಬಹುದು?
    tr: Tūkada cīṭi koḍu, nōḍtīni. … Ī ṭrāli hanneraḍu ṭannu. Eraḍūvare ekarege oṭṭu eṣṭu āgabahudu?
    en: Give me the weighbridge slip, let me see. … This trailer's twelve tonnes. How much might the two and a half acres come to altogether?
  - who: mahadeva
    t: ಎಕರೆಗೆ ನಲವತ್ತು ಬಂದ್ರೆ ನೂರು ಟನ್. ಈ ಸಲ ಮಳೆ ಚೆನ್ನಾಗಿತ್ತು, ನಾಲೆ ನೀರೂ ಬಂತು — ನೂರಾ ಹತ್ತು ಆಗಬಹುದು. ಟನ್ನಿಗೆ ಮೂರೂವರೆ ಸಾವಿರ ಅಂದ್ಕೊಂಡ್ರೂ ನಾಲ್ಕು ಲಕ್ಷದ ಹತ್ತಿರ. ಕಟಾವು, ಸಾಗಣೆ, ಗೊಬ್ಬರ, ಸಾಲ ಎಲ್ಲಾ ಕಳೆದ ಮೇಲೆ ಕೈಗೆ ಎಷ್ಟು ಉಳಿಯುತ್ತೆ ಅಂತ ನೀನೇ ಲೆಕ್ಕ ಹಾಕು, ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರೇ.
    tr: Ekarege nalavattu bandre nūru ṭan. Ī sala maḷe cennāgittu, nāle nīrū bantu — nūrā hattu āgabahudu. Ṭannige mūrūvare sāvira andkoṇḍrū nālku lakṣada hattira. Kaṭāvu, sāgaṇe, gobbara, sāla ellā kaḷeda mēle kaige eṣṭu uḷiyutte anta nīnē lekka hāku, byāṅk myānējarē.
    en: If it's forty an acre, a hundred tonnes. The rain was good this time and the canal water came too — it might be a hundred and ten. Even at three and a half thousand a tonne, that's close to four lakh. After harvesting, transport, fertiliser and the loan, you work out what's left in hand, Mr Bank Manager.
  - who: suresh
    t: ಲೆಕ್ಕ ಹಾಕೋದು ಸುಲಭ. ಇಡೀ ವರ್ಷ ಕಾಯೋದು ಕಷ್ಟ. ಮೀನಾ ಮಾರ್ಚ್‌ನಲ್ಲಿ ಬರೆದ ಅಂಕಿಗಳು ಸರಿ ಇದ್ವು, ಮಹದೇವ. ಆದ್ರೆ ಆ ಅಂಕಿಗಳಲ್ಲಿ ಈ ಐದು ಗಂಟೆಯ ಸಾಲು ಇರ್ಲಿಲ್ಲ.
    tr: Lekka hākōdu sulabha. Iḍī varṣa kāyōdu kaṣṭa. Mīnā Mārc-nalli bareda aṅkigaḷu sari idvu, Mahadēva. Ādre ā aṅkigaḷalli ī aidu gaṇṭeya sālu irlilla.
    en: Doing the sums is easy. Waiting a whole year is hard. The figures Meena wrote down in March were right, Mahadeva. But this five-hour queue wasn't in them.
  - section: The money comes
    learn: 'payment: khātege jame āgide, ippattamūru dinakke bantu · clearing a debt: sāla tīristīni, bēbāki pramāṇapatra · a changed refusal: kōpadinda alla · a mother''s comparison: āru tiṅgaḷa hinde … ivattu … · counterfactual praise: nimmappa iddidre … antidru'
  - scene: Friday, 20 November 2026, evening. Suresh, Meena and Rakshith have come for the weekend. As the family sits down to eat on the veranda, a message beeps on Mahadeva's old phone.
  - who: mahadeva
    t: ಅಣ್ಣ… ನೋಡು. ‘ನಿಮ್ಮ ಖಾತೆಗೆ ಮೂರು ಲಕ್ಷದ ಎಂಬತ್ತೆರಡು ಸಾವಿರ ರೂಪಾಯಿ ಜಮೆ ಆಗಿದೆ.’ ಕಾರ್ಖಾನೆ ಹಣ! ಇಪ್ಪತ್ತಮೂರು ದಿನಕ್ಕೆ ಬಂತು.
    tr: Aṇṇa… nōḍu. ‘Nimma khātege mūru lakṣada embatteraḍu sāvira rūpāyi jame āgide.’ Kārkhāne haṇa! Ippattamūru dinakke bantu.
    en: Anna… look. 'Three lakh eighty-two thousand rupees has been credited to your account.' The factory money! It came in twenty-three days.
  - who: meena
    t: ಕಾನೂನು ಹದಿನಾಲ್ಕು ದಿನ ಅನ್ನುತ್ತೆ, ನಾವು ಇಪ್ಪತ್ತಮೂರು ದಿನಕ್ಕೆ ಬಂತು ಅಂತ ಖುಷಿ ಪಡ್ತಿದೀವಿ. ಹೀಗೇ ಅಭ್ಯಾಸ ಮಾಡಿಸ್ಬಿಟ್ಟಿದಾರೆ ನೋಡಿ.
    tr: Kānūnu hadinālku dina annutte, nāvu ippattamūru dinakke bantu anta khuṣi paḍtidīvi. Hīgē abhyāsa māḍisbiṭṭidāre nōḍi.
    en: The law says fourteen days, and here we are celebrating because it came in twenty-three. That's how well they've trained us, you see.
  - who: mahadeva
    t: ಕಳೆದ ಸಲದ್ದು ಏಳು ತಿಂಗಳಿಗೆ ಬಂದಿತ್ತು, ಅತ್ತಿಗೆ. ಇದು ಹಬ್ಬ. … ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಮೊದ್ಲು ಸಂಘಕ್ಕೆ ಹೋಗಿ ಅಪ್ಪನ ಹೆಸರಲ್ಲಿರೋ ಆ ಒಂದು ಲಕ್ಷದ ಅರವತ್ತು ಸಾವಿರ ಸಾಲ ತೀರಿಸ್ತೀನಿ. ಬೇಬಾಕಿ ಪ್ರಮಾಣಪತ್ರ ತಗೊಂಡು ಅಪ್ಪನ ಫೋಟೋ ಮುಂದೆ ಇಡ್ತೀನಿ.
    tr: Kaḷeda saladdu ēḷu tiṅgaḷige bandittu, attige. Idu habba. … Nāḷe beḷigge modlu saṅghakke hōgi appana hesarallirō ā ondu lakṣada aravattu sāvira sāla tīristīni. Bēbāki pramāṇapatra tagoṇḍu appana phōṭō munde iḍtīni.
    en: The last lot took seven months, Attige. This is a festival. … Tomorrow morning, first thing, I'll go to the society and clear that one lakh sixty thousand loan in Appa's name. I'll get the no-dues certificate and put it in front of Appa's photo.
  - who: suresh
    t: ಆ ಸಾಲ ನಾಲ್ಕು ಜನದ್ದು ಅಂತ ನಾನು ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಹೇಳಿದ್ದೆ. ನೆನಪಿದೆಯಾ? ಅರ್ಧ ನಾನು ಕೊಡ್ತೀನಿ.
    tr: Ā sāla nālku janaddu anta nānu Ḍisembar-nalli hēḷidde. Nenapideyā? Ardha nānu koḍtīni.
    en: Back in December I said that loan belonged to all four of us. Remember? I'll pay half.
  - who: mahadeva
    t: ಬೇಡ ಅಣ್ಣ. ಅವತ್ತು ಆ ಮಾತು ಕೇಳಿ ನಂಗೆ ತುಂಬಾ ಕೋಪ ಬಂದಿತ್ತು — ‘ಸಾಲ ತೀರಿಸೋದು ನಾನು, ಜಮೀನು ಮಾತ್ರ ನಾಲ್ಕು ಜನದ್ದಾ’ ಅಂತ. ಈ ಸಲಾನೂ ತೀರಿಸೋದು ನಾನೇ. ಆದ್ರೆ ಕೋಪದಿಂದ ಅಲ್ಲ. ಈ ಕಬ್ಬಲ್ಲಿ ನಿನ್ನ ಗುಳ್ಳೆ ಬಂದ ಕೈನೂ ಇದೆ. ಅಷ್ಟು ಸಾಕು.
    tr: Bēḍa aṇṇa. Avattu ā mātu kēḷi naṅge tumbā kōpa bandittu — ‘sāla tīrisōdu nānu, jamīnu mātra nālku janaddā’ anta. Ī salānū tīrisōdu nānē. Ādre kōpadinda alla. Ī kabballi ninna guḷḷe banda kainū ide. Aṣṭu sāku.
    en: No, Anna. Back then, hearing that made me furious — 'I repay the loan, but the land belongs to all four?' This time too, I'm the one who'll repay it. But not out of anger. Your blistered hand is in this cane as well. That's enough for me.
  - who: meena
    t: ಶೋಭಾಗೂ ಹೇಳು ಮಹದೇವ. ಒಪ್ಪಿಗೆ ಪತ್ರ ಕೊಟ್ಟಿದ್ದು ಅವಳೇ ತಾನೇ?
    tr: Śōbhāgū hēḷu Mahadēva. Oppige patra koṭṭiddu avaḷē tānē?
    en: Tell Shobha too, Mahadeva. She's the one who gave the consent letter, isn't she?
  - who: mahadeva
    t: '‘ಕಬ್ಬಿನ ಹಣ ಬಂತು. ಸಾಲ ನಾಳೆ ತೀರುತ್ತೆ. ಮಹದೇವ.’ … ಕಳಿಸಿದೆ. … ಉತ್ತರ ಬಂತು: ‘ಒಳ್ಳೆ ಸುದ್ದಿ. ಅವ್ವನಿಗೆ ಒಂದು ಸೀರೆ ತಗೊಂಡು ಹೋಗು. ಹಣ ನಾನು ಕೊಡ್ತೀನಿ.’'
    tr: '‘Kabbina haṇa bantu. Sāla nāḷe tīrutte. Mahadēva.’ … Kaḷiside. … Uttara bantu: ‘Oḷḷe suddi. Avvanige ondu sīre tagoṇḍu hōgu. Haṇa nānu koḍtīni.’'
    en: '(typing slowly, reading aloud) ''Cane money has come. Loan gets cleared tomorrow. Mahadeva.'' … Sent. … (a minute later) A reply: ''Good news. Buy Avva a sari. I''ll pay for it.'''
  - who: avva
    t: ಮಹದೇವ, ಸುರೇಶ — ಇಲ್ಲಿ ಕೂರಿ, ಊಟ ಮಾಡಿ. ಆರು ತಿಂಗಳ ಹಿಂದೆ ನೀವಿಬ್ರು ಒಂದೇ ಬದುವಿನ ಮೇಲೆ ಆರಡಿ ದೂರ ನಡೀತಿದ್ರಿ. ಇವತ್ತು ಅಕ್ಕಪಕ್ಕ ಎಲೆ ಹಾಕ್ಕಂಡು ಕೂತಿದೀರಿ. ನಿಮ್ಮಪ್ಪ ಇದ್ದಿದ್ರೆ ‘ಕಬ್ಬಿಗಿಂತ ಸಿಹಿ ಬೆಳೆ ಬೆಳೆದ್ರಿ’ ಅಂತಿದ್ರು.
    tr: Mahadēva, Surēśa — illi kūri, ūṭa māḍi. Āru tiṅgaḷa hinde nīvibbru ondē baduvina mēle āraḍi dūra naḍītidri. Ivattu akkapakka ele hākkaṇḍu kūtidīri. Nimmappa iddidre ‘kabbiginta sihi beḷe beḷedri’ antidru.
    en: Mahadeva, Suresha — sit here and eat. Six months ago the two of you walked along the same bund six feet apart. Today you're sitting with your leaves side by side. If your father were here, he'd have said, 'You've grown a crop sweeter than cane.'
  - who: rakshith
    t: ಅಜ್ಜಿ, ನಾನು ಈ ಆರು ತಿಂಗಳಲ್ಲಿ ಏನು ಕಲಿತೆ ಗೊತ್ತಾ? ಕೂಳೆ, ಕಟ್ಟು ಪದ್ಧತಿ, ಫ್ಯಾಟ್, ರಿಕವರಿ… ಆದ್ರೆ ದೊಡ್ಡ ಪಾಠ ಅದಲ್ಲ. ಅಪ್ಪ ‘ನನ್ನ ತಪ್ಪು’ ಅಂತ ಹೇಳೋದು ಕಲಿತ. ಚಿಕ್ಕಪ್ಪ ‘ಬಾ’ ಅಂತ ಹೇಳೋದು ಕಲಿತ.
    tr: Ajji, nānu ī āru tiṅgaḷalli ēnu kalite gottā? Kūḷe, kaṭṭu paddhati, phyāṭ, rikavari… ādre doḍḍa pāṭha adalla. Appa ‘nanna tappu’ anta hēḷōdu kalita. Cikkappa ‘bā’ anta hēḷōdu kalita.
    en: Ajji, do you know what I learnt in these six months? Ratoon, canal rotation, milk fat, recovery… but that's not the big lesson. Appa learnt to say 'my mistake'. Chikkappa learnt to say 'come'.
  - who: mahadeva
    t: ಏಯ್, ದೊಡ್ಡವರ ಬಗ್ಗೆ ಹಿಂಗೆ ಮಾತಾಡ್ತಾರಾ? … ತಿನ್ನು. ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಐದಕ್ಕೆ ಕಾವೇರಿಗೆ ಹುಲ್ಲು ಹಾಕ್ಬೇಕು ನೀನು.
    tr: Ēy, doḍḍavara bagge hiṅge mātāḍtārā? … Tinnu. Nāḷe beḷigge aidakke Kāvērige hullu hākbēku nīnu.
    en: (trying not to smile) Hey, is that any way to talk about your elders? … Eat. Tomorrow at five you've got to give Kaveri her hay.
  - who: meena
    t: ಮುಂದಿನ ಶುಕ್ರವಾರ ಕೋರ್ಟಲ್ಲಿ ಜಂಟಿ ಅರ್ಜಿ ಕೊಡ್ತೀವಿ. ನಾಗೇಂದ್ರ ಅವರು ಹೇಳಿದ್ರು — ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ರಾಷ್ಟ್ರೀಯ ಲೋಕ ಅದಾಲತ್ ಇದೆಯಂತೆ, ಅದಕ್ಕೆ ಹಾಕಿಸ್ತಾರಂತೆ. ಅದರ ಮಧ್ಯೆ ಭಾನುವಾರ ಜಾತ್ರೆ. ಶೋಭಾ ಬರ್ತಾಳಂತೆ, ಅವ್ವ.
    tr: Mundina Śukravāra kōrṭalli jaṇṭi arji koḍtīvi. Nāgēndra avaru hēḷidru — Ḍisembar-nalli rāṣṭrīya Lōka Adālat ideyante, adakke hākistārante. Adara madhye Bhānuvāra jātre. Śōbhā bartāḷante, avva.
    en: Next Friday we give the joint application in court. Nagendra says there's a National Lok Adalat in December, and he'll get the case listed there. In between, the jatre is on Sunday. Shobha says she's coming, Avva.
  - who: avva
    t: ಬರ್ತಾಳಾ? … ಹಾಗಾದ್ರೆ ನಾನು ಅಮ್ಮನಿಗೆ ಹರಕೆ ತೀರಿಸ್ತೀನಿ. ಅವರು ಹೋದ ರಾತ್ರಿ ಹೊತ್ತ ಹರಕೆ — ‘ನನ್ನ ಮೂರೂ ಮಕ್ಳು ಒಟ್ಟಿಗೆ ನಿನ್ನ ತೇರು ಎಳೆಯೋ ಹಾಗೆ ಮಾಡು ತಾಯಿ’ ಅಂತ.
    tr: Bartāḷā? … Hāgādre nānu ammanige harake tīristīni. Avaru hōda rātri hotta harake — ‘nanna mūrū makḷu oṭṭige ninna tēru eḷeyō hāge māḍu tāyi’ anta.
    en: She's coming? … Then I'll fulfil my vow to the Goddess. The vow I made the night he died — 'Mother, let all three of my children pull your chariot together.'
  - chapter: Chapter 8 — The jatre
  - section: The chariot
    learn: 'the jatre: tēru, hagga, davana, bāḷehaṇṇu esītāre, tamaṭe, ḍoḷḷu, pūjā kuṇita, prasāda · a vow: harake hottidde, harake tīristīni · mourning: varṣa tumbilla, sūtaka · awkward greetings: … bandyā · teasing: appana haṭha pūrti ninagē bandide · pulling together: ellrū ondē kaḍe eḷībēku'
  - scene: 'Sunday, 29 November 2026. The jatre of Bettadamma, Bettahalli''s village goddess. Since morning the lanes have been full: tamate and dollu drums, bangle stalls, a giant wheel by the tank, families home from Bengaluru and Mysuru. The tall wooden chariot stands before the temple, hung with flowers and coloured cloth; thick ropes lie on the ground in front of it. Shobha steps off the Mysuru bus at the crossroads, where Avva, Meena and Rakshith are waiting.'
  - who: shobha
    t: ಅವ್ವಾ! ಎಷ್ಟು ಜನ! ನಾನು ಕೊನೆಯ ಸಲ ಜಾತ್ರೆಗೆ ಬಂದಿದ್ದು ಮದುವೆಗೆ ಮುಂಚೆ — ಹದಿನಾರು ವರ್ಷ ಆಯ್ತು.
    tr: Avvā! Eṣṭu jana! Nānu koneya sala jātrege bandiddu maduvege mun̄ce — hadināru varṣa āytu.
    en: Avva! So many people! The last time I came to the jatre was before my wedding — sixteen years ago.
  - who: avva
    t: ಬಾ ಕಣವ್ವ. ಬಸ್ಸಲ್ಲಿ ನಿಂತ್ಕಂಡೇ ಬಂದ್ಯಾ? ಮುಖ ಬಾಡೋಗಿದೆ. … ನೋಡು, ಆ ಬಳೆ ಅಂಗಡಿ ಇನ್ನೂ ಅಲ್ಲೇ ಇದೆ. ಚಿಕ್ಕೋಳಿದ್ದಾಗ ನೀನು ಅಲ್ಲಿ ಹಸಿರು ಬಳೆಗೆ ಅತ್ತು ಗಲಾಟೆ ಮಾಡಿದ್ದೆ.
    tr: Bā kaṇavva. Bassalli nintkaṇḍē bandyā? Mukha bāḍōgide. … Nōḍu, ā baḷe aṅgaḍi innū allē ide. Cikkōḷiddāga nīnu alli hasiru baḷege attu galāṭe māḍidde.
    en: Come, my girl. Did you stand all the way on the bus? Your face has wilted. … Look, that bangle stall is still in the same spot. When you were little you cried and made a scene there for green bangles.
  - who: shobha
    t: ನೆನಪಿದೆ. ಅಪ್ಪ ಕೊನೆಗೆ ಎರಡು ಡಜನ್ ಕೊಡಿಸಿದ್ರು. … ಮಹದೇವ ಎಲ್ಲಿ?
    tr: Nenapide. Appa konege eraḍu ḍajan koḍisidru. … Mahadēva elli?
    en: I remember. In the end Appa bought me two dozen. … Where's Mahadeva?
  - who: avva
    t: ತೇರಿನ ಹತ್ರ. ಊರಿನ ಹುಡುಗರ ಜೊತೆ ಹಗ್ಗ ಸರಿ ಮಾಡ್ತಿದಾನೆ. ಪ್ರತಿ ವರ್ಷ ಮುಂದಿನ ಹಗ್ಗ ಹಿಡಿಯೋದು ನಮ್ಮ ಮನೆಯವರು — ನಿಮ್ಮ ತಾತನ ಕಾಲದಿಂದ.
    tr: Tērina hatra. Ūrina huḍugara jote hagga sari māḍtidāne. Prati varṣa mundina hagga hiḍiyōdu namma maneyavaru — nimma tātana kāladinda.
    en: By the chariot. He's setting the ropes right with the village lads. Every year it's our family that holds the front rope — since your grandfather's time.
  - who: rakshith
    t: ಅಜ್ಜಿ, ಆ ಜನ ತೇರಿನ ಮೇಲೆ ಬಾಳೆಹಣ್ಣು ಯಾಕೆ ಎಸೀತಿದಾರೆ? ಮತ್ತೆ ಆ ಹಸಿರು ಎಲೆ ಏನು?
    tr: Ajji, ā jana tērina mēle bāḷehaṇṇu yāke esītidāre? Matte ā hasiru ele ēnu?
    en: Ajji, why are those people throwing bananas at the chariot? And what's that green leaf?
  - who: avva
    t: ಅದು ದವನ, ಕಂದ. ಘಮ ಘಮ ಅನ್ನುತ್ತೆ. ಹರಕೆ ಹೊತ್ತೋರು, ಬೆಳೆ ಚೆನ್ನಾಗಿ ಬಂದೋರು ತೇರಿಗೆ ಬಾಳೆಹಣ್ಣು, ದವನ ಎಸೀತಾರೆ — ‘ತಾಯಿ, ನೀನು ಕೊಟ್ಟಿದ್ದರಲ್ಲಿ ಒಂದು ಪಾಲು ನಿನಗೆ’ ಅಂತ. ಕೆಳಗೆ ಬಿದ್ದ ಹಣ್ಣು ಪ್ರಸಾದ, ಮಕ್ಕಳು ಆರಿಸ್ಕಂಡು ತಿಂತಾರೆ.
    tr: Adu davana, kanda. Ghama ghama annutte. Harake hottōru, beḷe cennāgi bandōru tērige bāḷehaṇṇu, davana esītāre — ‘tāyi, nīnu koṭṭiddaralli ondu pālu ninage’ anta. Keḷage bidda haṇṇu prasāda, makkaḷu āriskaṇḍu tintāre.
    en: That's davana, child. Smell how fragrant it is. People who made vows, people whose crops did well, throw bananas and davana at the chariot — 'Mother, of what you gave us, a share for you.' The fruit that falls is prasada; the children pick it up and eat it.
  - who: rakshith
    t: ದೇವಿಗೂ ಪಾಲು! ಈ ಊರಲ್ಲಿ ಎಲ್ಲಾ ಮಾತೂ ಕೊನೆಗೆ ಪಾಲಿಗೇ ಬಂದು ನಿಲ್ಲುತ್ತೆ.
    tr: Dēvigū pālu! Ī ūralli ellā mātū konege pāligē bandu nillutte.
    en: A share for the Goddess too! In this village every conversation ends up at shares.
  - who: meena
    t: ರಕ್ಷಿತ್!
    tr: Rakṣit!
    en: (warning) Rakshith!
  - who: avva
    t: ಇರ್ಲಿ ಬಿಡವ್ವ, ಹುಡುಗ ಸರಿಯಾಗೇ ಹೇಳಿದ. ಪಾಲು ಕೊಡೋದು ಕಲಿತ್ರೆ ಪಾಲು ಕೇಳೋ ಜಗಳ ಕಮ್ಮಿ ಆಗುತ್ತೆ.
    tr: Irli biḍavva, huḍuga sariyāgē hēḷida. Pālu koḍōdu kalitre pālu kēḷō jagaḷa kammi āgutte.
    en: Let him be, dear — the boy's right. Learn to give a share, and there are fewer fights over asking for one.
  - scene: In front of the chariot. The drummers beat the tamate; a pooja kunitha dancer turns slowly, a tall decorated frame balanced on his head without his hands. Mahadeva, a towel tied round his head, straightens up from the rope when he sees Shobha.
  - who: mahadeva
    t: … ಬಂದ್ಯಾ.
    tr: … Bandyā.
    en: … You came.
  - who: shobha
    t: ಬಂದೆ. ಅವ್ವನ ಹರಕೆ ಅಂತ ಅಣ್ಣ ಹೇಳಿದ. … ಸಾಲ ತೀರಿಸಿದ್ಯಂತೆ. ಒಳ್ಳೇದಾಯ್ತು.
    tr: Bande. Avvana harake anta aṇṇa hēḷida. … Sāla tīrisidyante. Oḷḷēdāytu.
    en: I came. Anna said it was Avva's vow. … I hear you've cleared the loan. That's good.
  - who: mahadeva
    t: ಅವ್ವನ ಸೀರೆ ಇನ್ನೂ ತಗೊಂಡಿಲ್ಲ. ನೀನೇ ಆರಿಸು, ಇಲ್ಲೇ ಜಾತ್ರೆಯಲ್ಲಿ. ನನಗೆ ಬಣ್ಣ ಗೊತ್ತಾಗಲ್ಲ.
    tr: Avvana sīre innū tagoṇḍilla. Nīnē ārisu, illē jātreyalli. Nanage baṇṇa gottāgalla.
    en: I haven't bought Avva's sari yet. You choose it, here at the fair. I'm no good with colours.
  - who: shobha
    t: ಸರಿ. ಆದ್ರೆ ದುಡ್ಡು ನಾನೇ ಕೊಡೋದು. ಹೇಳಿದೀನಲ್ಲ.
    tr: Sari. Ādre duḍḍu nānē koḍōdu. Hēḷidīnalla.
    en: All right. But I'm paying. I said so, didn't I?
  - who: mahadeva
    t: ಅದೇ — ಆ ಹಠ. ಅಪ್ಪನ ಹಠ ಪೂರ್ತಿ ನಿನಗೇ ಬಂದಿದೆ.
    tr: Adē — ā haṭha. Appana haṭha pūrti ninagē bandide.
    en: There it is — that stubbornness. You got every bit of Appa's stubbornness.
  - who: shobha
    t: ಮತ್ತೆ ನಿನಗೆ? ಅಪ್ಪನ ಹಠ ಅರ್ಧ, ಅವ್ವನ ಹಠ ಅರ್ಧ.
    tr: Matte ninage? Appana haṭha ardha, avvana haṭha ardha.
    en: And you? Half Appa's stubbornness, half Avva's.
  - scene: Avva laughs for the first time in months. The priest comes down the temple steps with a brass plate of burning camphor. He sees Avva and stops.
  - who: priest
    t: ಪುಟ್ಟಮ್ಮನವರೇ, ಬನ್ನಿ. ಗೌಡ್ರು ಹೋದ ಮೇಲೆ ಇದು ಮೊದಲ ಜಾತ್ರೆ. ನಿಮ್ಮ ಮನೆಯಲ್ಲಿ ಇನ್ನೂ ವರ್ಷ ತುಂಬಿಲ್ಲ, ಹಬ್ಬ ಮಾಡಲ್ಲ ಅಂತ ಗೊತ್ತು. ಆದ್ರೆ ಅಮ್ಮನ ಸೇವೆಗೆ ಸೂತಕ ಅಡ್ಡ ಬರಲ್ಲ ಅಂತ ನಮ್ಮ ಹಿರಿಯರು ಹೇಳ್ತಿದ್ರು. ಹರಕೆ ಹೊತ್ತಿದ್ರಂತಲ್ಲ?
    tr: Puṭṭammanavarē, banni. Gauḍru hōda mēle idu modala jātre. Nimma maneyalli innū varṣa tumbilla, habba māḍalla anta gottu. Ādre ammana sēvege sūtaka aḍḍa baralla anta namma hiriyaru hēḷtidru. Harake hottidrantalla?
    en: Come, Puttamma-avare. This is the first jatre since Gowdru passed away. I know the year isn't yet complete in your house, and you won't celebrate festivals. But our elders used to say mourning does not stand in the way of serving the Goddess. I hear you made a vow?
  - who: avva
    t: ಹೌದು ಸ್ವಾಮಿ. ಅವರು ಹೋದ ರಾತ್ರಿ ಅಮ್ಮನ ಹತ್ರ ಬೇಡ್ಕಂಡಿದ್ದೆ — ನನ್ನ ಮೂರು ಮಕ್ಳು ಒಟ್ಟಿಗೆ ತೇರು ಎಳೀಬೇಕು ಅಂತ. ಆಮೇಲೆ ಮಕ್ಳು ಕೋರ್ಟಿಗೆ ಹೋದ್ರು. ಹರಕೆ ತೀರೋದೇ ಇಲ್ಲ ಅನ್ಕೊಂಡಿದ್ದೆ.
    tr: Haudu svāmi. Avaru hōda rātri ammana hatra bēḍkaṇḍidde — nanna mūru makḷu oṭṭige tēru eḷībēku anta. Āmēle makḷu kōrṭige hōdru. Harake tīrōdē illa ankoṇḍidde.
    en: Yes, Swami. The night he died, I begged the Goddess — that my three children should pull her chariot together. Then the children went to court. I thought the vow would never be fulfilled.
  - who: priest
    t: ಹರಕೆ ತೀರೋದು ಕೈಗಳಿಂದ ಅಲ್ಲ ಅಮ್ಮ, ಮನಸ್ಸಿಂದ. … ಮಕ್ಕಳೇ, ಮುಂದಿನ ಹಗ್ಗದಲ್ಲಿ ಮೂರೂ ಜನ ಒಂದೇ ಕಡೆ ನಿಲ್ಲಿ. ಹಗ್ಗದ ಒಂದು ತುದಿ ಅಮ್ಮನ ತೇರಿಗೆ ಕಟ್ಟಿದೆ, ಇನ್ನೊಂದು ತುದಿ ಊರಿನ ಎಲ್ಲರ ಕೈಲಿದೆ. ಯಾರೂ ವಿರುದ್ಧ ಕಡೆಗೆ ಎಳೆಯಲ್ಲ — ತೇರು ಮುಂದೆ ಹೋಗೋದು ಹಾಗೇ.
    tr: Harake tīrōdu kaigaḷinda alla amma, manassinda. … Makkaḷē, mundina haggadalli mūrū jana ondē kaḍe nilli. Haggada ondu tudi ammana tērige kaṭṭide, innondu tudi ūrina ellara kailide. Yārū viruddha kaḍege eḷeyalla — tēru munde hōgōdu hāgē.
    en: A vow isn't fulfilled by the hands, Amma, but by the heart. … Children, stand together on the same side of the front rope. One end of the rope is tied to the Goddess's chariot; the other is in the hands of the whole village. Nobody pulls the opposite way — that's the only way a chariot moves forward.
  - scene: The priest breaks a coconut before the great wheel. A roar goes up from the crowd. The three siblings take the front rope side by side — Suresh, Shobha, Mahadeva — with Rakshith just behind. The chariot creaks, shudders and begins to roll. Bananas and davana rain down on it.
  - who: mahadeva
    t: ಎಲ್ರೂ ಒಟ್ಟಿಗೆ — ಒಂದು, ಎರಡು, ಮೂರು — ಎಳೀರಿ!
    tr: Ellrū oṭṭige — ondu, eraḍu, mūru — eḷīri!
    en: Everyone together — one, two, three — pull!
  - who: rakshith
    t: ಉಘೇ ಉಘೇ ಬೆಟ್ಟದಮ್ಮ! … ಅಪ್ಪ, ಇದು ಎಷ್ಟು ಭಾರ! ಸಾವಿರ ಜನ ಎಳೀತಿದಾರೆ, ಆದ್ರೂ ನಿಧಾನವಾಗಿ ಹೋಗ್ತಿದೆ.
    tr: Ughē ughē Beṭṭadamma! … Appa, idu eṣṭu bhāra! Sāvira jana eḷītidāre, ādrū nidhānavāgi hōgtide.
    en: Ughe, ughe, Bettadamma! … Appa, it's so heavy! A thousand people are pulling, and still it moves slowly.
  - who: suresh
    t: ಅದಕ್ಕೇ ಎಲ್ಲರೂ ಒಂದೇ ಕಡೆ ಎಳೀಬೇಕು ಅಂದ್ರು ಪೂಜಾರಿಗಳು. ಕುಟುಂಬಾನೂ ಹಾಗೇ, ಕಂದ — ಭಾರ, ನಿಧಾನ, ಆದ್ರೆ ಎಲ್ರೂ ಎಳೆದ್ರೆ ಮುಂದೆ ಹೋಗುತ್ತೆ.
    tr: Adakkē ellarū ondē kaḍe eḷībēku andru pūjārigaḷu. Kuṭumbānū hāgē, kanda — bhāra, nidhāna, ādre ellrū eḷedre munde hōgutte.
    en: That's why the priest said everyone must pull the same way. A family's like that too, son — heavy, slow, but if everyone pulls, it moves.
  - who: shobha
    t: ಅವ್ವನ್ನ ನೋಡು — ಅಳ್ತಿದಾಳೆ.
    tr: Avvanna nōḍu — aḷtidāḷe.
    en: (glancing back) Look at Avva — she's crying.
  - who: avva
    t: ಅಳ್ತಿಲ್ಲ ಕಣವ್ವ. ದವನದ ಘಾಟು ಕಣ್ಣಿಗೆ ಹೊಡೀತು. … ಎಳೀರಿ, ಎಳೀರಿ, ನಿಲ್ಲಿಸ್ಬೇಡಿ.
    tr: Aḷtilla kaṇavva. Davanada ghāṭu kaṇṇige hoḍītu. … Eḷīri, eḷīri, nillisbēḍi.
    en: (wiping her eyes with the end of her sari) I'm not crying, girl. The davana got into my eyes. … Pull, pull, don't stop.
  - section: Fire and prasada
    learn: 'the fire-walk: koṇḍa, keṇḍa, upavāsa, vrata, pūjārigaḷa anumati, suṭṭa gāya · the priest''s counsel: haṇa eṇisōdu sulabha, manassu eṇisōdu kaṣṭa · habitual past: modala bellada accu tandu koḍtidru · a married daughter''s distance: tavarige atithi āgōdu nidhānavāgi āgutte · the fair: tiḷi baṇṇada hatti sīre, hasiru baḷe, jilēbi, kaḍlepuri'
  - scene: Evening. Behind the temple, in a fenced square, a long pit of embers glows — the konda, for the fire-walk at dawn. Men who have kept a vow and fasted are being blessed. The priest sits on the temple steps handing out prasada; Suresh, Mahadeva and Rakshith sit on the step below him.
  - who: rakshith
    t: ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಜನ ಈ ಕೆಂಡದ ಮೇಲೆ ನಡೀತಾರಾ? ಚಿಕ್ಕಪ್ಪ, ನೀನು ಯಾವತ್ತಾದ್ರೂ ನಡೆದಿದ್ಯಾ?
    tr: Nāḷe beḷigge jana ī keṇḍada mēle naḍītārā? Cikkappa, nīnu yāvattādrū naḍedidyā?
    en: Tomorrow morning people walk over these embers? Chikkappa, have you ever done it?
  - who: mahadeva
    t: ಒಂದೇ ಸಲ. ಎರಡು ಸಾವಿರದ ಆರರಲ್ಲಿ ಅಪ್ಪನ ಕಾಲು ಮುರಿದಾಗ ಹರಕೆ ಹೊತ್ತಿದ್ದೆ. ಒಂದು ವಾರ ಉಪವಾಸ, ವ್ರತ. … ಆದ್ರೆ ನೀನು ಯಾವತ್ತೂ ಇದನ್ನ ಆಟಕ್ಕೆ ಮಾಡ್ಬಾರ್ದು. ವ್ರತ ಮಾಡಿದೋರು, ಪೂಜಾರಿಗಳ ಅನುಮತಿ ಇರೋರು ಮಾತ್ರ. ಪ್ರತಿ ವರ್ಷ ಯಾರಿಗಾದ್ರೂ ಸುಟ್ಟ ಗಾಯ ಆಗುತ್ತೆ.
    tr: Ondē sala. Eraḍu sāvirada āraralli appana kālu muridāga harake hottidde. Ondu vāra upavāsa, vrata. … Ādre nīnu yāvattū idanna āṭakke māḍbārdu. Vrata māḍidōru, pūjārigaḷa anumati irōru mātra. Prati varṣa yārigādrū suṭṭa gāya āgutte.
    en: Just once. In two thousand six, when Appa broke his leg, I made a vow. A week of fasting and observances. … But don't you ever do it for fun. Only those who've kept the vow and have the priest's permission. Every year somebody gets burnt.
  - who: priest
    t: ಮಹದೇವ ಸರಿಯಾಗಿ ಹೇಳಿದ. ಕೊಂಡ ಧೈರ್ಯ ತೋರಿಸೋ ಜಾಗ ಅಲ್ಲ, ಶ್ರದ್ಧೆ ತೋರಿಸೋ ಜಾಗ. … ತಗೊಳ್ಳಿ, ಪ್ರಸಾದ. ಸುರೇಶ, ನಿಮ್ಮಪ್ಪ ಪ್ರತಿ ವರ್ಷ ಕೊಯ್ಲಾದ ಮೇಲೆ ಮೊದಲ ಬೆಲ್ಲದ ಅಚ್ಚು, ಮೊದಲ ರಾಗಿ ತೆನೆ ಅಮ್ಮನಿಗೆ ತಂದು ಕೊಡ್ತಿದ್ರು. ನಲವತ್ತು ವರ್ಷ ಒಂದ್ಸಲಾನೂ ತಪ್ಪಿಸಲಿಲ್ಲ.
    tr: Mahadēva sariyāgi hēḷida. Koṇḍa dhairya tōrisō jāga alla, śraddhe tōrisō jāga. … Tagoḷḷi, prasāda. Surēśa, nimmappa prati varṣa koylāda mēle modala bellada accu, modala rāgi tene ammanige tandu koḍtidru. Nalavattu varṣa ondsalānū tappisalilla.
    en: Mahadeva's right. The fire pit isn't a place to show courage; it's a place to show devotion. … Here, take the prasada. Suresha, every year after the harvest your father used to bring the Goddess the first block of jaggery and the first ear of ragi. In forty years he never once missed.
  - who: mahadeva
    t: ಈ ಸಲ ರಾಗಿ ಕೊಯ್ಲು ಮುಂದಿನ ವಾರ ಸ್ವಾಮಿ. ಮೊದಲ ತೆನೆ ನಾನೇ ತರ್ತೀನಿ.
    tr: Ī sala rāgi koylu mundina vāra svāmi. Modala tene nānē tartīni.
    en: This year the ragi harvest is next week, Swami. I'll bring the first ear myself.
  - who: priest
    t: ಒಳ್ಳೇದು. … ಒಂದು ಮಾತು ಹೇಳ್ಲಾ? ಊರಲ್ಲಿ ಸುದ್ದಿ ಇದೆ — ನೀವು ಲೋಕ ಅದಾಲತ್‌ಗೆ ಹೋಗ್ತಿದೀರಿ ಅಂತ. ನಾನು ಪೂಜಾರಿ, ನನಗೆ ಕಾನೂನು ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ಮೂವತ್ತು ವರ್ಷದಿಂದ ಈ ಮೆಟ್ಟಿಲ ಮೇಲೆ ಕೂತು ಎಷ್ಟೋ ಮನೆಗಳು ಒಡೆಯೋದು ನೋಡಿದೀನಿ. ಹಣ ಎಣಿಸೋದು ಸುಲಭ. ಮನಸ್ಸು ಎಣಿಸೋದು ಕಷ್ಟ. ಅಲ್ಲಿ ಹೋದಾಗ ಎಕರೆ-ಗುಂಟೆ ಜೊತೆಗೆ ಮನಸ್ಸನ್ನೂ ಅಳೀರಿ.
    tr: Oḷḷēdu. … Ondu mātu hēḷlā? Ūralli suddi ide — nīvu Lōka Adālat-ge hōgtidīri anta. Nānu pūjāri, nanage kānūnu gottilla. Ādre mūvattu varṣadinda ī meṭṭila mēle kūtu eṣṭō manegaḷu oḍeyōdu nōḍidīni. Haṇa eṇisōdu sulabha. Manassu eṇisōdu kaṣṭa. Alli hōdāga ekare-guṇṭe jotege manassannū aḷīri.
    en: Good. … May I say one thing? There's talk in the village that you're going to the Lok Adalat. I'm a priest; I don't know the law. But sitting on these steps for thirty years I've watched so many families break apart. Counting money is easy. Counting hearts is hard. When you go there, measure the hearts along with the acres and guntas.
  - who: suresh
    t: ನೆನಪಿಟ್ಕೊಳ್ತೀವಿ ಸ್ವಾಮಿ.
    tr: Nenapiṭkoḷtīvi svāmi.
    en: We'll remember that, Swami.
  - who: rakshith
    t: ಸ್ವಾಮಿ, ಒಂದು ಪ್ರಶ್ನೆ. ಈ ದೇವಿಗೆ ಬೆಟ್ಟದಮ್ಮ ಅಂತ ಯಾಕೆ ಹೆಸರು? ಇಲ್ಲಿ ಬೆಟ್ಟಾನೇ ಇಲ್ವಲ್ಲ — ಬರೀ ಗದ್ದೆ, ನಾಲೆ.
    tr: Svāmi, ondu praśne. Ī dēvige Beṭṭadamma anta yāke hesaru? Illi beṭṭānē ilvalla — barī gadde, nāle.
    en: Swami, a question. Why is the Goddess called Bettadamma — 'Mother of the hill'? There's no hill here at all — only paddy fields and the canal.
  - who: priest
    t: 'ಒಳ್ಳೆ ಪ್ರಶ್ನೆ ಮರಿ. ಹಿರಿಯರು ಹೇಳೋ ಕಥೆ — ಹಿಂದೆ ಒಂದು ದೊಡ್ಡ ಬರಗಾಲದಲ್ಲಿ ಈ ಊರಿನ ಜನ ಗುಳೆ ಹೋಗಿ ದೂರದ ಒಂದು ಬೆಟ್ಟದ ಬುಡದಲ್ಲಿ ಬದುಕಿದ್ರಂತೆ. ಮಳೆ ಬಂದು ವಾಪಸ್ ಬರುವಾಗ ಆ ಬೆಟ್ಟದ ಒಂದು ಕಲ್ಲು ಹೊತ್ಕೊಂಡು ಬಂದ್ರು — ‘ನಮ್ಮನ್ನ ಕಾಪಾಡಿದ ತಾಯಿ’ ಅಂತ. ಆ ಕಲ್ಲೇ ಇವತ್ತಿನ ಬೆಟ್ಟದಮ್ಮ. ಕಥೆ ನಿಜಾನೋ ಅಲ್ವೋ ನನಗೆ ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ಅದರ ಅರ್ಥ ಗೊತ್ತು: ಊರು ಬಿಟ್ಟು ಹೋದೋರು ಒಂದಲ್ಲ ಒಂದು ದಿನ ವಾಪಸ್ ಬರ್ತಾರೆ.'
    tr: 'Oḷḷe praśne mari. Hiriyaru hēḷō kathe — hinde ondu doḍḍa baragāladalli ī ūrina jana guḷe hōgi dūrada ondu beṭṭada buḍadalli badukidrante. Maḷe bandu vāpas baruvāga ā beṭṭada ondu kallu hotkoṇḍu bandru — ‘nammanna kāpāḍida tāyi’ anta. Ā kallē ivattina Beṭṭadamma. Kathe nijānō alvō nanage gottilla. Ādre adara artha gottu: ūru biṭṭu hōdōru ondalla ondu dina vāpas bartāre.'
    en: 'A good question, lad. The elders tell a story — long ago, in a great famine, the people of this village migrated and survived at the foot of a hill far away. When the rains came and they returned, they carried back a stone from that hill — ''the Mother who saved us''. That stone is today''s Bettadamma. Whether the story is true, I don''t know. But I know what it means: those who leave the village come back, one day or another.'
  - who: mahadeva
    t: ಬಂದ್ರೆ ಸಾಕು ಸ್ವಾಮಿ. ಬೆಟ್ಟದ ಕಲ್ಲು ಹೊತ್ಕೊಂಡು ಬರ್ಬೇಕಾಗಿಲ್ಲ — ಬರೀ ಕೈಯಲ್ಲಿ ಬಂದ್ರೂ ಸಾಕು.
    tr: Bandre sāku svāmi. Beṭṭada kallu hotkoṇḍu barbēkāgilla — barī kaiyalli bandrū sāku.
    en: (glancing at Suresh) It's enough if they come, Swami. They needn't carry a stone from the hill — it's enough even if they come empty-handed.
  - who: suresh
    t: ಬರೀ ಕೈಯಲ್ಲಲ್ಲ, ಮಹದೇವ. ಕೈ ತುಂಬಾ ಗುಳ್ಳೆ ಇಟ್ಕೊಂಡು ಬಂದಿದೀನಿ.
    tr: Barī kaiyallalla, Mahadēva. Kai tumbā guḷḷe iṭkoṇḍu bandidīni.
    en: (showing his palms) Not empty-handed, Mahadeva. I came with my hands full of blisters.
  - scene: The fair, after dark. Under strings of bulbs, Shobha and Rakshith walk between the stalls. Shobha holds a folded sari up to the light; Rakshith carries a paper cone of kadlepuri and a packet of jilebi.
  - who: shobha
    t: ಈ ತಿಳಿ ಬಣ್ಣದ ಹತ್ತಿ ಸೀರೆ ಅವ್ವನಿಗೆ ಹೇಗಿರುತ್ತೆ, ರಕ್ಷಿತ್? ಅವ್ವ ರೇಷ್ಮೆ ಉಡಲ್ಲ, ಹತ್ತಿಯೇ ಬೇಕು. ಹಸಿರು ಬಳೇನೂ ತಗೊಂಡೆ — ನಿಮ್ಮಮ್ಮನಿಗೊಂದು ಜೊತೆ, ನನಗೊಂದು ಜೊತೆ.
    tr: Ī tiḷi baṇṇada hatti sīre avvanige hēgirutte, Rakṣit? Avva rēṣme uḍalla, hattiyē bēku. Hasiru baḷēnū tagoṇḍe — nimmammanigondu jote, nanagondu jote.
    en: How will this pale cotton sari look on Avva, Rakshith? Avva doesn't wear silk; it has to be cotton. And I bought green bangles — a set for your mother, a set for me.
  - who: rakshith
    t: ಅತ್ತೆ, ಹದಿನಾರು ವರ್ಷದಿಂದ ನೀನು ಜಾತ್ರೆಗೆ ಯಾಕೆ ಬರ್ಲಿಲ್ಲ?
    tr: Atte, hadināru varṣadinda nīnu jātrege yāke barlilla?
    en: Atte, why didn't you come to the jatre for sixteen years?
  - who: shobha
    t: ಮೊದಲು ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ರಜೆ ಸಿಗ್ತಿರ್ಲಿಲ್ಲ. ಆಮೇಲೆ ಅಭ್ಯಾಸ ಆಯ್ತು — ಬರದೇ ಇರೋದು. ಮದುವೆಯಾದ ಹೆಣ್ಣುಮಗಳು ತವರಿಗೆ ‘ಅತಿಥಿ’ ಆಗೋದು ನಿಧಾನವಾಗಿ ಆಗುತ್ತೆ, ರಕ್ಷಿತ್. ಯಾರೂ ಬಾಗಿಲು ಮುಚ್ಚಲ್ಲ. ನಾವೇ ಬರೋದು ಕಮ್ಮಿ ಮಾಡ್ತೀವಿ. ಆಮೇಲೆ ಒಂದು ದಿನ ಜಮೀನಿನ ಕಾಗದದಲ್ಲಿ ಹೆಸರೇ ಇರಲ್ಲ.
    tr: Modalu āspatreyalli raje sigtirlilla. Āmēle abhyāsa āytu — baradē irōdu. Maduveyāda heṇṇumagaḷu tavarige ‘atithi’ āgōdu nidhānavāgi āgutte, Rakṣit. Yārū bāgilu muccalla. Nāvē barōdu kammi māḍtīvi. Āmēle ondu dina jamīnina kāgadadalli hesarē iralla.
    en: At first I couldn't get leave from the hospital. Then it became a habit — not coming. A married daughter turns into a 'guest' in her parents' home slowly, Rakshith. Nobody shuts the door. We ourselves come less and less. And then one day your name isn't even on the land papers.
  - who: rakshith
    t: ಅದಕ್ಕೇ ಕೇಸ್ ಹಾಕಿದ್ಯಾ?
    tr: Adakkē kēs hākidyā?
    en: Is that why you filed the case?
  - who: shobha
    t: ಅದಕ್ಕೇ. ಹಣಕ್ಕಲ್ಲ. ‘ನಾನೂ ಈ ಮನೆಯವಳು’ ಅಂತ ಬರೆದಿರೋ ಒಂದು ಕಾಗದಕ್ಕೆ. … ಜಿಲೇಬಿ ಕೊಡು, ತಣ್ಣಗಾಗ್ತಿದೆ.
    tr: Adakkē. Haṇakkalla. ‘Nānū ī maneyavaḷu’ anta baredirō ondu kāgadakke. … Jilēbi koḍu, taṇṇagāgtide.
    en: That's why. Not for money. For one piece of paper that says 'I belong to this house too'. … Give me a jilebi, they're getting cold.
  - section: A night in the yard
    learn: 'night talk: nidde barlilvā, ellrū illi kūri · shared memories: nenapideyā … malagtidvi, hēḷtidda · saying what you want: nanage bēkāgiddu …, maṇṇu nanage bēḍa, haṇada rūpadalli · generosity: lekka sari māḍtidīni, ippattu varṣada bāki · a mother''s terms: nānu irōvaregū nanna hesarallirali, uyilu barestīni · dictation: bari kaṇavva'
  - scene: Past midnight. The drums have stopped; only the generator of the giant wheel still hums down by the tank. In the yard of the house Avva sits on a mat under the open sky. One by one her children come out — none of them can sleep.
  - who: avva
    t: ನಿದ್ದೆ ಬರ್ಲಿಲ್ವಾ? ಬನ್ನಿ, ಎಲ್ರೂ ಇಲ್ಲಿ ಕೂರಿ. ಇವತ್ತು ಮೂರೂ ಜನ ಒಟ್ಟಿಗೆ ಕೂತಿದೀರಿ — ಕೋರ್ಟಿನ ಬೆಂಚಲ್ಲ, ನಮ್ಮ ಅಂಗಳ.
    tr: Nidde barlilvā? Banni, ellrū illi kūri. Ivattu mūrū jana oṭṭige kūtidīri — kōrṭina beṇcalla, namma aṅgaḷa.
    en: Couldn't sleep? Come, all of you, sit here. Tonight the three of you are sitting together — not on a court bench, in our own yard.
  - who: shobha
    t: ಅವ್ವ, ನೆನಪಿದೆಯಾ? ಬೇಸಿಗೆಯಲ್ಲಿ ನಾವು ಮೂವರೂ ಇಲ್ಲೇ ಚಾಪೆ ಹಾಸ್ಕೊಂಡು ಮಲಗ್ತಿದ್ವಿ. ಅಣ್ಣ ನಕ್ಷತ್ರಗಳ ಹೆಸರು ಹೇಳ್ತಿದ್ದ, ಮಹದೇವ ದೆವ್ವದ ಕಥೆ ಹೇಳಿ ನನ್ನ ಹೆದರಿಸ್ತಿದ್ದ.
    tr: Avva, nenapideyā? Bēsigeyalli nāvu mūvarū illē cāpe hāskoṇḍu malagtidvi. Aṇṇa nakṣatragaḷa hesaru hēḷtidda, Mahadēva devvada kathe hēḷi nanna hedaristidda.
    en: Avva, do you remember? In summer the three of us used to spread our mats right here and sleep. Anna would name the stars, and Mahadeva would tell ghost stories to frighten me.
  - who: mahadeva
    t: ನೀನು ಹೆದರಿ ಅಪ್ಪನ ಹತ್ರ ಓಡೋಗ್ತಿದ್ದೆ. ಮಾರನೇ ದಿನ ಬೈಸ್ಕೊಳ್ತಿದ್ದಿದ್ದು ನಾನು.
    tr: Nīnu hedari appana hatra ōḍōgtidde. Māranē dina baiskoḷtiddiddu nānu.
    en: You'd get scared and run to Appa. And the next day I'd be the one getting scolded.
  - who: avva
    t: ಅವತ್ತೂ ಹಂಗೇ, ಇವತ್ತೂ ಹಂಗೇ. … ಕೇಳಿ. ಹನ್ನೆರಡನೇ ತಾರೀಖು ನೀವು ಆ ಅದಾಲತ್‌ಗೆ ಹೋಗ್ತೀರಿ. ಅಲ್ಲಿ ವಕೀಲರು ಮಾತಾಡ್ತಾರೆ, ಜಡ್ಜ್ ಸಾಹೇಬ್ರು ಮಾತಾಡ್ತಾರೆ. ಅದಕ್ಕೂ ಮುಂಚೆ ಒಂದ್ಸಲ ಒಬ್ಬೊಬ್ಬರಾಗಿ ಹೇಳಿ — ನಿಜವಾಗ್ಲೂ ನಿಮಗೆ ಏನು ಬೇಕು? ವಕೀಲರ ಭಾಷೆಯಲ್ಲಿ ಅಲ್ಲ. ನಿಮ್ಮವ್ವನ ಭಾಷೆಯಲ್ಲಿ.
    tr: Avattū haṅgē, ivattū haṅgē. … Kēḷi. Hanneraḍanē tārīkhu nīvu ā Adālat-ge hōgtīri. Alli vakīlaru mātāḍtāre, jaḍj sāhēbru mātāḍtāre. Adakkū mun̄ce ondsala obbobbarāgi hēḷi — nijavāglū nimage ēnu bēku? Vakīlara bhāṣeyalli alla. Nimmavvana bhāṣeyalli.
    en: It was like that then, and it's like that now. … Listen. On the twelfth you go to that Adalat. There the lawyers will talk, the judge will talk. Before that, tell me once, one at a time — what do you truly want? Not in the lawyers' language. In your mother's.
  - who: mahadeva
    t: ನಾನೇ ಮೊದಲು ಹೇಳ್ತೀನಿ. ನನಗೆ ಗದ್ದೆ ಬೇಕು, ಅವ್ವ — ಪೂರ್ತಿ ಮೂರೂವರೆ ಎಕರೆ, ತುಂಡು ಮಾಡದೆ. ಮತ್ತೆ ಈ ಮನೆ, ಕೊಟ್ಟಿಗೆ. ಗದ್ದೆ ತುಂಡಾದ್ರೆ ನಾಲೆ ನೀರು ಹಂಚೋದೇ ಜಗಳ ಆಗುತ್ತೆ. ಅದಕ್ಕೆ ಬದಲಾಗಿ ಏನು ಕೇಳಿದ್ರೂ ಕೊಡ್ತೀನಿ — ಸಾಲ ಇದ್ರೆ ಅದೂ ನನ್ನದು. ಆದ್ರೆ ನನ್ ಹತ್ರ ಲಕ್ಷಗಟ್ಲೆ ನಗದು ಇಲ್ಲ, ಅದು ಎಲ್ರಿಗೂ ಗೊತ್ತು.
    tr: Nānē modalu hēḷtīni. Nanage gadde bēku, avva — pūrti mūrūvare ekare, tuṇḍu māḍade. Matte ī mane, koṭṭige. Gadde tuṇḍādre nāle nīru han̄cōdē jagaḷa āgutte. Adakke badalāgi ēnu kēḷidrū koḍtīni — sāla idre adū nannadu. Ādre nan hatra lakṣagaṭle nagadu illa, adu ellrigū gottu.
    en: I'll say it first. I want the wet land, Avva — all three and a half acres, without cutting it up. And this house, and the cattle shed. If the wet land is split, even sharing out the canal water becomes a fight. In return I'll give whatever's asked — if there's any loan, that's mine too. But I don't have lakhs in cash; everybody knows that.
  - who: shobha
    t: ನನಗೆ ಮೊದಲು ಬೇಕಾಗಿದ್ದು ನನ್ನ ಹೆಸರು. ಅದು ಪಹಣಿಯಲ್ಲಿ ಬಂತು. ಈಗ… ನಿಜ ಹೇಳ್ಬೇಕು ಅಂದ್ರೆ, ಮೈಸೂರಲ್ಲಿ ನಾವು ಹತ್ತು ವರ್ಷದಿಂದ ಬಾಡಿಗೆ ಮನೆಯಲ್ಲಿದೀವಿ. ಒಂದು ಸಣ್ಣ ಮನೆ ನಮ್ಮದು ಅಂತ ಆಗ್ಬೇಕು ಅನ್ನೋ ಆಸೆ ಇದೆ. ಮಣ್ಣು ನನಗೆ ಬೇಡ — ನಾನು ಬೇಸಾಯ ಮಾಡಲ್ಲ. ನನ್ನ ಪಾಲು ಹಣದ ರೂಪದಲ್ಲಿ ಬಂದ್ರೆ ಸಾಕು. ಆದ್ರೆ ಅದು ಮಹದೇವನ ಗದ್ದೆ ಮಾರಿ ಅಲ್ಲ.
    tr: Nanage modalu bēkāgiddu nanna hesaru. Adu pahaṇiyalli bantu. Īga… nija hēḷbēku andre, Maisūralli nāvu hattu varṣadinda bāḍige maneyallidīvi. Ondu saṇṇa mane nammadu anta āgbēku annō āse ide. Maṇṇu nanage bēḍa — nānu bēsāya māḍalla. Nanna pālu haṇada rūpadalli bandre sāku. Ādre adu Mahadēvana gadde māri alla.
    en: What I wanted first was my name. That's come into the RTC. Now… if I'm honest, in Mysuru we've lived in a rented house for ten years. I've always wished for one small house that's our own. I don't need soil — I won't farm. If my share comes as money, that's enough. But not by selling Mahadeva's wet land.
  - who: suresh
    t: ನನ್ನ ಸರತಿ. ನನಗೆ ಏನೂ ಬೇಡ. ಬ್ಯಾಂಕ್ ಕೆಲಸ ಇದೆ, ಮನೆ ಇದೆ — ಸಾಲದ ಮನೆ ಆದ್ರೂ. ಅಪ್ಪ ನನ್ನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ದೇ ನನ್ನ ಪಾಲು. ನನ್ನ ಭಾಗವನ್ನ ಅವ್ವನ ಹೆಸರಿಗೆ ಬರೆದುಬಿಡ್ತೀನಿ. ಅವ್ವ ಇರೋವರೆಗೂ ಅದು ಅವಳದು — ಯಾರ ಮುಂದೆಯೂ ಅವಳು ಕೈ ಚಾಚಬಾರದು.
    tr: Nanna sarati. Nanage ēnū bēḍa. Byāṅk kelasa ide, mane ide — sālada mane ādrū. Appa nanna ōdige ettu māriddē nanna pālu. Nanna bhāgavanna avvana hesarige baredubiḍtīni. Avva irōvaregū adu avaḷadu — yāra mundeyū avaḷu kai cācabāradu.
    en: My turn. I don't want anything. I have my bank job, I have a house — a house on a loan, but still. Appa selling the bullocks for my studies was my share. I'll write my portion over to Avva's name. As long as Avva lives, it's hers — she should never have to hold out her hand to anyone.
  - who: mahadeva
    t: ಅಣ್ಣ… ಅದು ಜಾಸ್ತಿ ಆಯ್ತು.
    tr: Aṇṇa… adu jāsti āytu.
    en: Anna… that's too much.
  - who: suresh
    t: ಜಾಸ್ತಿ ಅಲ್ಲ. ಲೆಕ್ಕ ಸರಿ ಮಾಡ್ತಿದೀನಿ. ಇಪ್ಪತ್ತು ವರ್ಷದ ಬಾಕಿ ಇದೆ.
    tr: Jāsti alla. Lekka sari māḍtidīni. Ippattu varṣada bāki ide.
    en: Not too much. I'm settling accounts. There are twenty years of arrears.
  - who: shobha
    t: ಅಣ್ಣ, ಅತ್ತಿಗೆನ ಕೇಳಿದ್ಯಾ? ಅದು ರಕ್ಷಿತ್‌ನ ಪಾಲೂ ಹೌದು.
    tr: Aṇṇa, attigena kēḷidyā? Adu Rakṣit-na pālū haudu.
    en: Anna, did you ask Attige? It's Rakshith's share too.
  - who: suresh
    t: ಕೇಳಿದೆ. ಮೀನಾ ಒಂದೇ ಮಾತು ಹೇಳಿದ್ಲು — ‘ಮಾರ್ಚ್‌ನಲ್ಲಿ ಅಂಕಿ ಬರೆದೋಳು ನಾನು. ಆ ಅಂಕಿಗಳಲ್ಲಿ ಅವ್ವನ ಮುಪ್ಪಿನ ಕಾಲ ಇರ್ಲಿಲ್ಲ. ಅದನ್ನ ಸೇರಿಸಿ.’ ರಕ್ಷಿತ್‌ನನ್ನೂ ಕೇಳಿದೆ. ‘ನಂಗೆ ಜಮೀನು ಬೇಡ, ಚಿಕ್ಕಪ್ಪನ ಮನೆಗೆ ಬರೋ ದಾರಿ ಮುಚ್ಚಬಾರದು, ಅಷ್ಟೇ’ ಅಂದ.
    tr: Kēḷide. Mīnā ondē mātu hēḷidlu — ‘Mārc-nalli aṅki baredōḷu nānu. Ā aṅkigaḷalli avvana muppina kāla irlilla. Adanna sērisi.’ Rakṣit-nannū kēḷide. ‘Naṅge jamīnu bēḍa, cikkappana manege barō dāri muccabāradu, aṣṭē’ anda.
    en: 'I did. Meena said just one thing: ''I''m the one who wrote the figures in March. Avva''s old age wasn''t in those figures. Put it in.'' I asked Rakshith too. He said, ''I don''t want land. Just don''t let the road to Chikkappa''s house close, that''s all.'''
  - who: avva
    t: ಈಗ ನನ್ನ ಮಾತು ಕೇಳಿ. ನನಗೆ ಜಮೀನು ಬೇಡ — ಎಪ್ಪತ್ತು ವರ್ಷದವಳು ಜಮೀನು ತಗೊಂಡು ಏನು ಮಾಡ್ಲಿ? ಆದ್ರೆ ಆ ಹುಣಸೆ ಮರದ ಹೊಲ… ನಿಮ್ಮಪ್ಪ ಅಲ್ಲಿ ಮಲಗಿದಾರೆ. ಆ ಭಾಗ ನಾನು ಇರೋವರೆಗೂ ನನ್ನ ಹೆಸರಲ್ಲಿರಲಿ. ಮಹದೇವ ಅಲ್ಲಿ ರಾಗಿ ಬೆಳೀಲಿ. ನಾನು ಹೋದ ಮೇಲೆ ಅದು ಯಾರಿಗೆ ಅಂತ ಉಯಿಲು ಬರೆಸ್ತೀನಿ — ನಿಮ್ಮಪ್ಪ ಬರೆಸಲಿಲ್ಲ, ಅದಕ್ಕೇ ಇಷ್ಟೆಲ್ಲಾ ಆಯ್ತು.
    tr: Īga nanna mātu kēḷi. Nanage jamīnu bēḍa — eppattu varṣadavaḷu jamīnu tagoṇḍu ēnu māḍli? Ādre ā huṇase marada hola… nimmappa alli malagidāre. Ā bhāga nānu irōvaregū nanna hesarallirali. Mahadēva alli rāgi beḷīli. Nānu hōda mēle adu yārige anta uyilu barestīni — nimmappa baresalilla, adakkē iṣṭellā āytu.
    en: Now listen to me. I don't want land — what would a woman of seventy do with land? But that field with the tamarind tree… your father lies there. Let that part stay in my name as long as I live. Let Mahadeva grow ragi on it. Who gets it after I'm gone, I'll have written in a will — your father never had one written, and that's why all this happened.
  - who: shobha
    t: ಮತ್ತೆ ನನ್ನ ಹಣ ಎಲ್ಲಿಂದ? ಮಹದೇವನ ಹತ್ರ ನಗದು ಇಲ್ಲ.
    tr: Matte nanna haṇa ellinda? Mahadēvana hatra nagadu illa.
    en: Then where does my money come from? Mahadeva has no cash.
  - who: mahadeva
    t: ಒಣ ಹೊಲದ ಅರ್ಧ — ಹುಣಸೆ ಮರ ಇಲ್ಲದ ಕಡೆ, ರಸ್ತೆ ಪಕ್ಕದ್ದು. ಪಕ್ಕದ ನಿಂಗೇಗೌಡ್ರು ಎರಡು ವರ್ಷದಿಂದ ಕೇಳ್ತಿದಾರೆ — ಅವರ ಹೊಲಕ್ಕೆ ಅಂಟ್ಕೊಂಡಿದೆ. ಅವರು ರೈತರು, ಬ್ರೋಕರ್ ಅಲ್ಲ, ಫಾರ್ಮ್‌ಹೌಸ್ ಕಟ್ಟಲ್ಲ. ಅದನ್ನ ಮಾರಿ ಬಂದ ಹಣ ಪೂರ್ತಿ ನಿನಗೆ.
    tr: Oṇa holada ardha — huṇase mara illada kaḍe, raste pakkaddu. Pakkada Niṅgēgauḍru eraḍu varṣadinda kēḷtidāre — avara holakke aṇṭkoṇḍide. Avaru raitaru, brōkar alla, phārm-haus kaṭṭalla. Adanna māri banda haṇa pūrti ninage.
    en: Half the dry field — the side without the tamarind tree, by the road. Our neighbour Ningegowda has been asking for it for two years — it adjoins his field. He's a farmer, not a broker; he won't build a farmhouse. Every rupee from selling it goes to you.
  - who: shobha
    t: ಮಾರಾಟ? ‘ಜಮೀನು ಮಾರಲ್ಲ’ ಅಂತ ಅಪ್ಪ ಬರೆದಿದ್ರಲ್ಲ, ಮಹದೇವ? ಆ ಮಾತನ್ನ ಮೊದಲು ಹೇಳಿದ್ದೇ ನೀನು.
    tr: Mārāṭa? ‘Jamīnu māralla’ anta appa baredidralla, Mahadēva? Ā mātanna modalu hēḷiddē nīnu.
    en: Selling? Didn't Appa write 'I will not sell the land', Mahadeva? You were the first one to quote it.
  - who: mahadeva
    t: ಹೌದು. ಅಪ್ಪ ಬದುಕಿದ್ದಾಗ ಮಾರ್ಲಿಲ್ಲ. ಆದ್ರೆ ಅಪ್ಪಾನೇ ನಿನ್ನ ಮದುವೆಗೆ ಸಾಲ ಮಾಡಿದ್ರು, ಅಣ್ಣನ ಓದಿಗೆ ಎತ್ತು ಮಾರಿದ್ರು. ಮಕ್ಕಳಿಗಾಗಿ ಕೊಡೋದು ಅಪ್ಪನಿಗೆ ಗೊತ್ತಿತ್ತು. ಒಂದೂಕಾಲು ಎಕರೆ ಹೋದ್ರೆ ಹೋಗ್ಲಿ — ತಂಗಿ ಕಣ್ಣೀರು ಹಾಕ್ಕೊಂಡು ಕೋರ್ಟಿಗೆ ಅಲೆಯೋದಕ್ಕಿಂತ ಅದು ಸಾವಿರ ಪಾಲು ವಾಸಿ.
    tr: Haudu. Appa badukiddāga mārlilla. Ādre appānē ninna maduvege sāla māḍidru, aṇṇana ōdige ettu māridru. Makkaḷigāgi koḍōdu appanige gottittu. Ondūkālu ekare hōdre hōgli — taṅgi kaṇṇīru hākkoṇḍu kōrṭige aleyōdakkinta adu sāvira pālu vāsi.
    en: Yes. While Appa lived, he didn't sell. But Appa himself borrowed for your wedding and sold the bullocks for Anna's studies. Appa knew how to give for his children. If one and a quarter acres goes, let it go — that's a thousand times better than my sister trailing round the courts in tears.
  - who: shobha
    t: … ಮಹದೇವ.
    tr: … Mahadēva.
    en: (her voice breaking) … Mahadeva.
  - who: avva
    t: ಸಾಕು, ಸಾಕು. ಇದನ್ನೆಲ್ಲಾ ಹನ್ನೆರಡನೇ ತಾರೀಖು ಜಡ್ಜ್ ಸಾಹೇಬ್ರ ಮುಂದೆ ಮತ್ತೆ ಹೇಳಿ. ಇವತ್ತು ರಾತ್ರಿ ಹೇಳಿದ್ದು ಅಮ್ಮನ ಮುಂದೆ ಹೇಳಿದ ಹಾಗೆ. … ನಿಮ್ಮಪ್ಪನ ದಿನಚರಿ ತಗೊಂಡು ಬಾ ಮಹದೇವ. ಇವತ್ತಿನ ದಿನ ಅದರಲ್ಲಿ ಬರೀಬೇಕು.
    tr: Sāku, sāku. Idannellā hanneraḍanē tārīkhu jaḍj sāhēbra munde matte hēḷi. Ivattu rātri hēḷiddu ammana munde hēḷida hāge. … Nimmappana dinacari tagoṇḍu bā Mahadēva. Ivattina dina adaralli barībēku.
    en: Enough, enough. Say all this again before the judge on the twelfth. What you said tonight, you've said as if before the Goddess. … Bring your father's diary, Mahadeva. Today has to be written in it.
  - who: mahadeva
    t: ಯಾರು ಬರೀತಾರೆ, ಅವ್ವ? ನಿನಗೆ ಬರೆಯೋಕೆ ಬರಲ್ಲ.
    tr: Yāru barītāre, avva? Ninage bareyōke baralla.
    en: Who'll write it, Avva? You can't write.
  - who: avva
    t: 'ನಾನು ಹೇಳ್ತೀನಿ, ಶೋಭಾ ಬರೀಲಿ. ಮನೆ ಮಗಳ ಕೈಬರಹ ಆ ಪುಸ್ತಕದಲ್ಲಿ ಒಂದು ಸಲನಾದ್ರೂ ಇರ್ಬೇಕು. … ಬರಿ ಕಣವ್ವ: ‘ಜಾತ್ರೆ ರಾತ್ರಿ. ಮೂರೂ ಮಕ್ಳು ಅಂಗಳದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಕೂತಿದ್ರು. ಇನ್ನು ಒಟ್ಟಿಗೆ ಉಣ್ಣೋದು ಒಂದೇ ಬಾಕಿ.’'
    tr: 'Nānu hēḷtīni, Śōbhā barīli. Mane magaḷa kaibaraha ā pustakadalli ondu salanādrū irbēku. … Bari kaṇavva: ‘Jātre rātri. Mūrū makḷu aṅgaḷadalli oṭṭige kūtidru. Innu oṭṭige uṇṇōdu ondē bāki.’'
    en: 'I''ll say it; let Shobha write. The daughter of the house must have her handwriting in that book at least once. … Write, my girl: ''Night of the jatre. All three children sat together in the yard. Only eating together still remains.'''
  - section: Dawn at the fire pit
    learn: 'watching a ritual: nidhānavāgi, samavāgi hejje iḍtidāre · a family memory (habitual and past perfect): ūrugōlu hiḍkoṇḍu nintu aḷtidru · a father''s word reported: ‘keṇḍada mēle naḍībēḍa, holada mēle naḍi’ · parting gifts and instructions: rāgi hiṭṭu, avarekāḷu, ūṭa ādmēle, khāli hoṭṭēli alla'
  - scene: Monday, 30 November, before sunrise. Behind the temple the drums start again. One by one the vow-keepers, wet from a dip in the tank, walk barefoot across the glowing pit while the priest stands at its head. Suresh, Mahadeva and Rakshith watch from behind the fence.
  - who: rakshith
    t: ಅಪ್ಪ, ನೋಡು — ಯಾರೂ ಓಡ್ತಿಲ್ಲ! ನಿಧಾನವಾಗಿ, ಸಮವಾಗಿ ಹೆಜ್ಜೆ ಇಡ್ತಿದಾರೆ.
    tr: Appa, nōḍu — yārū ōḍtilla! Nidhānavāgi, samavāgi hejje iḍtidāre.
    en: Appa, look — nobody's running! They're taking slow, even steps.
  - who: mahadeva
    t: ಕೊನೇಲಿ ಆ ಹಾಲು-ನೀರಿನ ಗುಂಡಿ ಕಾಣ್ತಿದ್ಯಾ? ಕೆಂಡ ದಾಟಿದ ತಕ್ಷಣ ಅದರಲ್ಲಿ ಕಾಲಿಡ್ತಾರೆ. ಎರಡು ಸಾವಿರದ ಆರರಲ್ಲಿ ನಾನು ಅದ್ರಲ್ಲಿ ಕಾಲಿಟ್ಟಾಗ, ಅಪ್ಪ ಊರುಗೋಲು ಹಿಡ್ಕೊಂಡು ಆ ಕಂಬದ ಹತ್ರ ನಿಂತು ಅಳ್ತಿದ್ರು.
    tr: Konēli ā hālu-nīrina guṇḍi kāṇtidyā? Keṇḍa dāṭida takṣaṇa adaralli kāliḍtāre. Eraḍu sāvirada āraralli nānu adralli kāliṭṭāga, appa ūrugōlu hiḍkoṇḍu ā kambada hatra nintu aḷtidru.
    en: See that pit of milk and water at the far end? As soon as they're across the embers, they step into it. In two thousand six, when I stepped into it, Appa was standing by that pillar on his crutch, crying.
  - who: rakshith
    t: ತಾತ ಅಳ್ತಿದ್ರಾ? ಯಾಕೆ ಚಿಕ್ಕಪ್ಪ — ನೀನು ಹರಕೆ ತೀರಿಸಿದ ಖುಷಿಗಾ?
    tr: Tāta aḷtidrā? Yāke cikkappa — nīnu harake tīrisida khuṣigā?
    en: Thatha was crying? Why, Chikkappa — from joy that you'd fulfilled the vow?
  - who: mahadeva
    t: ಖುಷಿ ಅಲ್ಲ, ಭಯ. ಆಮೇಲೆ ಒಂದು ವಾರ ನನ್ ಜೊತೆ ಮಾತೇ ಆಡ್ಲಿಲ್ಲ. ಆಮೇಲೆ ಒಂದೇ ಮಾತು ಹೇಳಿದ್ರು — ‘ನನಗೋಸ್ಕರ ಕೆಂಡದ ಮೇಲೆ ನಡೀಬೇಡ ಮಗ. ಹೊಲದ ಮೇಲೆ ನಡಿ, ಸಾಕು.’ ಅವತ್ತಿಂದ ನಾನು ಹೊಲ ಬುಟ್ಟು ಹೋಗಿಲ್ಲ.
    tr: Khuṣi alla, bhaya. Āmēle ondu vāra nan jote mātē āḍlilla. Āmēle ondē mātu hēḷidru — ‘nanagōskara keṇḍada mēle naḍībēḍa maga. Holada mēle naḍi, sāku.’ Avattinda nānu hola buṭṭu hōgilla.
    en: 'Not joy — fear. For a week after that he didn''t say a word to me. Then he said just one thing: ''Don''t walk on fire for my sake, son. Walk on the fields — that''s enough.'' I haven''t left the fields since.'
  - who: suresh
    t: ಅದಕ್ಕೇ ನೀನು ಉಳಿದೆ… ಇಪ್ಪತ್ತು ವರ್ಷದಿಂದ ಈ ಕಥೆ ನನಗೆ ಯಾರೂ ಹೇಳಿರ್ಲಿಲ್ಲ, ಮಹದೇವ.
    tr: Adakkē nīnu uḷide… Ippattu varṣadinda ī kathe nanage yārū hēḷirlilla, Mahadēva.
    en: So that's why you stayed… In twenty years nobody ever told me this, Mahadeva.
  - who: mahadeva
    t: ಕೇಳೋಕೆ ನೀನು ಊರಲ್ಲಿ ಇರ್ಲಿಲ್ವಲ್ಲ, ಅಣ್ಣ. … ಬೇಜಾರು ಮಾಡ್ಕೋಬೇಡ. ಈಗ ಇದೀಯ — ಅಷ್ಟೇ ಸಾಕು.
    tr: Kēḷōke nīnu ūralli irlilvalla, aṇṇa. … Bējāru māḍkōbēḍa. Īga idīya — aṣṭē sāku.
    en: You weren't in the village to hear it, Anna. … Don't feel bad. You're here now — that's enough.
  - scene: Seven o'clock. The bus stop at the crossroads, littered with the fair's paper cups. Shobha waits with her bag. Mahadeva rides up on his motorbike, a cloth bag hanging from the handlebar.
  - who: mahadeva
    t: ಇದು ತಗೋ. ಕಳೆದ ವರ್ಷದ ನಮ್ಮ ಹೊಲದ ರಾಗಿ ಹಿಟ್ಟು, ಸ್ವಲ್ಪ ಹೊಸ ಅವರೆಕಾಳು. ಮೈಸೂರಲ್ಲಿ ಅಂಗಡಿ ರಾಗಿ ತಿಂದು ನಿನ್ ಮುಖ ಬಾಡೋಗಿದೆ ಅಂತ ಅವ್ವ ಹೇಳಿದ್ರು.
    tr: Idu tagō. Kaḷeda varṣada namma holada rāgi hiṭṭu, svalpa hosa avarekāḷu. Maisūralli aṅgaḍi rāgi tindu nin mukha bāḍōgide anta avva hēḷidru.
    en: Take this. Ragi flour from our own field, last year's, and a few fresh avare beans. Avva says your face has wilted from eating shop ragi in Mysuru.
  - who: shobha
    t: ಮಹದೇವ… ಹನ್ನೆರಡನೇ ತಾರೀಖಿನ ಬಗ್ಗೆ. ರಾತ್ರಿ ಅಂಗಳದಲ್ಲಿ ಮಾತಾಡಿದ್ದನ್ನ ನಾನು ಮನೇಲಿ ಹೇಳ್ಬೇಕು. ನನ್ನ ಯಜಮಾನ್ರು ಸುಲಭವಾಗಿ ಒಪ್ಪಲ್ಲ. ಅವರ ಕಣ್ಣಲ್ಲಿ ತವರುಮನೆಯವರು ಹದಿನಾರು ವರ್ಷ ನನ್ನನ್ನ ಮರೆತುಬಿಟ್ಟಿದ್ರು.
    tr: Mahadēva… hanneraḍanē tārīkhina bagge. Rātri aṅgaḷadalli mātāḍiddanna nānu manēli hēḷbēku. Nanna yajamānru sulabhavāgi oppalla. Avara kaṇṇalli tavarumaneyavaru hadināru varṣa nannanna maretubiṭṭidru.
    en: Mahadeva… about the twelfth. What we said in the yard last night, I have to tell at home. My husband won't agree easily. In his eyes, my own family forgot me for sixteen years.
  - who: mahadeva
    t: ಅವರ ತಪ್ಪಿಲ್ಲ. ಆ ಹದಿನಾರು ವರ್ಷದಲ್ಲಿ ನಾನು ಒಂದ್ಸಲನಾದ್ರೂ ಮೈಸೂರಿಗೆ ಬಂದಿದ್ನಾ? ನನ್ ಪರವಾಗಿ ಅವರಿಗೆ ಒಂದು ಮಾತು ಹೇಳು — ಮುಂದಿನ ವರ್ಷದ ಜಾತ್ರೆಗೆ ಅವರೂ ಬರ್ಲಿ. ತೇರಿನ ಹಗ್ಗಕ್ಕೆ ಇನ್ನೊಂದು ಕೈ ಬೇಕು.
    tr: Avara tappilla. Ā hadināru varṣadalli nānu ondsalanādrū Maisūrige bandidnā? Nan paravāgi avarige ondu mātu hēḷu — mundina varṣada jātrege avarū barli. Tērina haggakke innondu kai bēku.
    en: He's not wrong. In those sixteen years, did I come to Mysuru even once? Give him a message from me — let him come to next year's jatre too. The chariot rope needs another pair of hands.
  - who: shobha
    t: ಹೇಳ್ತೀನಿ. … ಬಸ್ಸು ಬಂತು. ಕೇಳು — ಅವ್ವನ ಮಂಡಿನೋವಿನ ಮಾತ್ರೆ ರಾತ್ರಿ ಊಟ ಆದ್ಮೇಲೆ, ಖಾಲಿ ಹೊಟ್ಟೇಲಿ ಅಲ್ಲ. ಮರೀಬೇಡ.
    tr: Hēḷtīni. … Bassu bantu. Kēḷu — avvana maṇḍinōvina mātre rātri ūṭa ādmēle, khāli hoṭṭēli alla. Marībēḍa.
    en: I'll tell him. … The bus is here. Listen — Avva's knee tablet goes after dinner at night, not on an empty stomach. Don't forget.
  - who: mahadeva
    t: ನರ್ಸಮ್ಮನ ಆಜ್ಞೆ — ಪಾಲಿಸ್ತೀನಿ. … ಹುಷಾರಾಗಿ ಹೋಗು.
    tr: Narsammana ājñe — pālistīni. … Huṣārāgi hōgu.
    en: The nurse-madam's orders — I'll obey. … Go safely.
  - chapter: Chapter 9 — Lok Adalat
  - section: Bench number three
    learn: 'the conciliator''s opening: idu kōrṭ alla, yārū gellalla, yārū sōlalla · three points of law: aitīrpu ḍikrige samāna, mēlmanavi illa, nyāyālaya śulka vāpas · inviting each side: kāgadadallirō bēḍike alla, nimma manassallirōdu · wording matters: paḍediruttāre vs biṭṭukoṭṭiruttāre · testing a decision: bhāvōdvēgadalli tagoṇḍa tīrmānavā? · testimony: ottaḍa hākiddu obrē'
  - scene: Saturday, 12 December 2026, half past nine in the morning. The National Lok Adalat at the Maddur court complex. A banner hangs over the gate; the ground-floor corridor is packed — bank officers with loan files, insurance lawyers, a young couple sitting far apart on one bench, farmers clutching electricity bills. Advocate Nagendra meets the family at the foot of the stairs.
  - who: rakshith
    t: ಅಪ್ಪ, ಇಷ್ಟೊಂದು ಜನ! ಎಲ್ಲರದ್ದೂ ಜಮೀನಿನ ಕೇಸಾ?
    tr: Appa, iṣṭondu jana! Ellaraddū jamīnina kēsā?
    en: Appa, so many people! Are they all land cases?
  - who: lawyer
    t: ಇಲ್ಲಪ್ಪ. ಚೆಕ್ ಬೌನ್ಸ್, ಬ್ಯಾಂಕ್ ಸಾಲ, ಅಪಘಾತದ ಪರಿಹಾರ, ಗಂಡ-ಹೆಂಡತಿಯ ಜಗಳ, ಕರೆಂಟ್ ಬಿಲ್ಲು… ಇವತ್ತು ಒಂದೇ ದಿನ ರಾಜ್ಯದ ಎಲ್ಲಾ ಕೋರ್ಟುಗಳಲ್ಲೂ ಲೋಕ ಅದಾಲತ್. ಸಾವಿರಾರು ಪ್ರಕರಣ ರಾಜಿಯಲ್ಲಿ ಮುಗಿಯುತ್ತೆ. ಕೋರ್ಟಿನ ಹೊರೆ ಸ್ವಲ್ಪ ಇಳಿಯೋ ದಿನ ಇದು.
    tr: Illappa. Cek bauns, byāṅk sāla, apaghātada parihāra, ganḍa-henḍatiya jagaḷa, karenṭ billu… Ivattu ondē dina rājyada ellā kōrṭugaḷallū Lōka Adālat. Sāvirāru prakaraṇa rājiyalli mugiyutte. Kōrṭina hore svalpa iḷiyō dina idu.
    en: No, son. Cheque bounces, bank loans, accident compensation, husband-and-wife quarrels, electricity bills… Today, on one single day, there's a Lok Adalat in every court in the state. Thousands of cases end in compromise. It's the day the courts' burden gets a little lighter.
  - who: suresh
    t: ಆ ಮೂಲೆಯ ಮೇಜು ನೋಡು, ಮೀನಾ — ಒಂದು ಬ್ಯಾಂಕಿನವರು ಸಾಲ ಕಟ್ಟದ ರೈತರ ಜೊತೆ ರಾಜಿಗೆ ಕೂತಿದಾರೆ. ಇಪ್ಪತ್ತು ವರ್ಷ ನಾನು ಆ ಕಡೆ ಕೂರ್ತಿದ್ದೆ. ಇವತ್ತು ಮೊದಲ ಸಲ ಈ ಕಡೆ ನಿಂತಿದೀನಿ.
    tr: Ā mūleya mēju nōḍu, Mīnā — ondu byāṅkinavaru sāla kaṭṭada raitara jote rājige kūtidāre. Ippattu varṣa nānu ā kaḍe kūrtidde. Ivattu modala sala ī kaḍe nintidīni.
    en: Look at that table in the corner, Meena — a bank's people sitting down to settle with farmers who couldn't repay. For twenty years I sat on that side. Today, for the first time, I'm standing on this one.
  - who: meena
    t: ಯಾವ ಕಡೆ ಕೂತ್ರೂ ಪ್ರಶ್ನೆ ಒಂದೇ ಅಲ್ವಾ — ಎಷ್ಟು ಬಿಟ್ಕೊಡೋದು, ಎಷ್ಟು ಉಳಿಸ್ಕೊಳ್ಳೋದು.
    tr: Yāva kaḍe kūtrū praśne ondē alvā — eṣṭu biṭkoḍōdu, eṣṭu uḷiskoḷḷōdu.
    en: Whichever side you sit on, the question's the same, isn't it — how much to give up, how much to keep.
  - who: avva
    t: ಮತ್ತೆ ಅದೇ ಕೋರ್ಟಿನ ಮೆಟ್ಟಿಲು, ಸುರೇಶ. ಕಾಲು ಮುಂದೆ ಹೋಗ್ತಿಲ್ಲ.
    tr: Matte adē kōrṭina meṭṭilu, Surēśa. Kālu munde hōgtilla.
    en: The same court steps again, Suresha. My feet won't go forward.
  - who: lawyer
    t: ಅಮ್ಮ, ಇವತ್ತು ಕಟಕಟೆ ಇಲ್ಲ, ಸಾಕ್ಷಿ ಇಲ್ಲ, ಪಾಟೀಸವಾಲೂ ಇಲ್ಲ. ಒಂದು ಮೇಜು, ಕೆಲವು ಕುರ್ಚಿ, ಮಾತು — ಅಷ್ಟೇ. ನಿಮ್ಮ ಮನೆ ಅಂಗಳ ಅಂದ್ಕೊಳ್ಳಿ.
    tr: Amma, ivattu kaṭakaṭe illa, sākṣi illa, pāṭīsavālū illa. Ondu mēju, kelavu kurci, mātu — aṣṭē. Nimma mane aṅgaḷa andkoḷḷi.
    en: Amma, today there's no witness box, no witnesses, no cross-examination. A table, a few chairs, and talk — that's all. Think of it as your own yard.
  - who: mahadeva
    t: ಬಂದೆ, ಬಂದೆ. ನನ್ನ ವಕೀಲರು ಮೇಲೆ ಕಾಯ್ತಿದಾರಂತೆ. … ರಾತ್ರಿ ನಿದ್ದೆನೇ ಬರ್ಲಿಲ್ಲ, ಅಣ್ಣ. ನಾಲ್ಕಕ್ಕೇ ಎದ್ದು ಹಾಲು ಕರೆದು, ಕಾವೇರಿಗೆ ಹುಲ್ಲು ಹಾಕಿ ಹೊರಟೆ.
    tr: Bande, bande. Nanna vakīlaru mēle kāytidārante. … Rātri niddenē barlilla, aṇṇa. Nālkakkē eddu hālu karedu, Kāvērige hullu hāki horaṭe.
    en: (coming up the steps, out of breath) I'm here, I'm here. My lawyer's waiting upstairs, they say. … I didn't sleep at all last night, Anna. I was up at four, milked, gave Kaveri her hay and set off.
  - who: shobha
    t: ನಂಗೂ ನಿದ್ದೆ ಇಲ್ಲ. ಮೈಸೂರಿಂದ ಮೊದಲ ಬಸ್ಸು. … ಬನ್ನಿ, ಎಲ್ಲಾ ಒಟ್ಟಿಗೇ ಮೇಲೆ ಹೋಗೋಣ — ಮೂರು ದಿಕ್ಕಿನಿಂದ ಅಲ್ಲ.
    tr: Naṅgū nidde illa. Maisūrinda modala bassu. … Banni, ellā oṭṭigē mēle hōgōṇa — mūru dikkininda alla.
    en: (arriving behind him) I didn't sleep either. The first bus from Mysuru. … Come, let's all go up together — not from three different directions.
  - scene: 'Ten o''clock. Upstairs, in a first-floor hall, tables have been set out as ''benches'', each with a numbered placard. Bench three: a retired district judge with silver hair, and beside him a woman advocate as member. On 27 November the court had referred the suit here on the family''s joint application. Shobha sits with Advocate Nagendra; Mahadeva with his lawyer; Suresh and Meena; Avva with her legal-aid lawyer. This week the family marked one year since Thatha''s death.'
  - who: conciliator
    t: ಎಲ್ಲರಿಗೂ ನಮಸ್ಕಾರ. ಕೂತ್ಕೊಳ್ಳಿ — ಅಮ್ಮ, ನೀವು ಈ ಕುರ್ಚಿಯಲ್ಲಿ, ಫ್ಯಾನ್ ಕೆಳಗೆ. ಮೊದಲು ಒಂದು ವಿಷಯ ಸ್ಪಷ್ಟ ಮಾಡ್ತೀನಿ. ಇದು ಕೋರ್ಟ್ ಅಲ್ಲ. ಇಲ್ಲಿ ಯಾರೂ ಗೆಲ್ಲಲ್ಲ, ಯಾರೂ ಸೋಲಲ್ಲ. ನಾನು ತೀರ್ಪು ಕೊಡೋಕೆ ಕೂತಿಲ್ಲ; ನೀವೇ ಒಂದು ತೀರ್ಮಾನಕ್ಕೆ ಬರೋಕೆ ಸಹಾಯ ಮಾಡೋಕೆ ಕೂತಿದೀನಿ.
    tr: Ellarigū namaskāra. Kūtkoḷḷi — amma, nīvu ī kurciyalli, phyān keḷage. Modalu ondu viṣaya spaṣṭa māḍtīni. Idu kōrṭ alla. Illi yārū gellalla, yārū sōlalla. Nānu tīrpu koḍōke kūtilla; nīvē ondu tīrmānakke barōke sahāya māḍōke kūtidīni.
    en: Namaskara, everyone. Please sit — Amma, you take this chair, under the fan. First let me make one thing clear. This is not a court. Here nobody wins and nobody loses. I'm not sitting here to give a verdict; I'm here to help you reach a decision yourselves.
  - who: conciliator
    t: 'ಕಾನೂನಿನ ಮೂರು ಮಾತು ಮಾತ್ರ. ಒಂದು: ನೀವು ಒಪ್ಪಿ ಸಹಿ ಹಾಕಿದ ರಾಜಿಯ ಮೇಲೆ ಇಲ್ಲಿ ಕೊಡುವ ಐತೀರ್ಪು ಸಿವಿಲ್ ನ್ಯಾಯಾಲಯದ ಡಿಕ್ರಿಗೆ ಸಮಾನ. ಎರಡು: ಅದರ ವಿರುದ್ಧ ಮೇಲ್ಮನವಿ ಇಲ್ಲ — ಅದೇ ಕೊನೆ. ಮೂರು: ದಾವೆಗೆ ಕಟ್ಟಿದ ನ್ಯಾಯಾಲಯ ಶುಲ್ಕ ವಾಪಸ್ ಸಿಗುತ್ತೆ. ಒಪ್ಪಿಗೆ ಆಗದಿದ್ರೆ ಕೇಸ್ ಮತ್ತೆ ಕೋರ್ಟಿಗೇ ಹೋಗುತ್ತೆ, ನಿಮಗೆ ಏನೂ ನಷ್ಟ ಇಲ್ಲ. ಯಾರ ಮೇಲೂ ಒತ್ತಡ ಇಲ್ಲ.'
    tr: 'Kānūnina mūru mātu mātra. Ondu: nīvu oppi sahi hākida rājiya mēle illi koḍuva aitīrpu sivil nyāyālayada ḍikrige samāna. Eraḍu: adara viruddha mēlmanavi illa — adē kone. Mūru: dāvege kaṭṭida nyāyālaya śulka vāpas sigutte. Oppige āgadidre kēs matte kōrṭigē hōgutte, nimage ēnū naṣṭa illa. Yāra mēlū ottaḍa illa.'
    en: 'Just three points of law. One: the award made here on a compromise you agree to and sign is equal to a civil court decree. Two: there''s no appeal against it — it''s final. Three: the court fee paid on the suit is refunded. If you don''t agree, the case simply goes back to the court and you lose nothing. There''s no pressure on anyone.'
  - who: conciliator
    t: ದಾವೆ ಹಾಕಿದವರು ನೀವು, ಶೋಭಾ ಅವರೇ. ಮೊದಲು ನೀವೇ ಹೇಳಿ — ಕಾಗದದಲ್ಲಿರೋ ಬೇಡಿಕೆ ಅಲ್ಲ, ನಿಮ್ಮ ಮನಸ್ಸಲ್ಲಿರೋದು.
    tr: Dāve hākidavaru nīvu, Śōbhā avarē. Modalu nīvē hēḷi — kāgadadallirō bēḍike alla, nimma manassallirōdu.
    en: You filed the suit, Ms Shobha. You speak first — not the claim on paper, but what's in your heart.
  - who: shobha
    t: 'ಸಾರ್, ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಅಪ್ಪ ಹೋದಾಗ ವಂಶವೃಕ್ಷದಲ್ಲಿ ನನ್ನ ಹೆಸರೇ ಇರ್ಲಿಲ್ಲ. ಊರಲ್ಲಿ ‘ಮದುವೆ ಖರ್ಚೇ ಅವಳ ಪಾಲು’ ಅಂದ್ರು. ನಾನು ದಾವೆ ಹಾಕಿದ್ದು ನನ್ನ ಅಣ್ಣ-ತಮ್ಮನ ವಿರುದ್ಧ ಅಲ್ಲ — ಆ ಮಾತಿನ ವಿರುದ್ಧ. ಈಗ ತಹಸೀಲ್ದಾರ್ ಆದೇಶದಿಂದ ಪಹಣಿಯಲ್ಲಿ ನನ್ನ ಹೆಸರಿದೆ. ನನಗೆ ಮಣ್ಣು ಬೇಡ; ನ್ಯಾಯವಾದ ಪಾಲು ಹಣದ ರೂಪದಲ್ಲಿ ಸಾಕು. ಮತ್ತೆ ಒಂದು: ರಾಜಿ ಕಾಗದದಲ್ಲಿ ‘ಚನ್ನೇಗೌಡರ ಮಗಳು ಶೋಭಾ ತಮ್ಮ ಪಾಲು ಪಡೆದಿರುತ್ತಾರೆ’ ಅಂತ ಬರೀಬೇಕು. ‘ಬಿಟ್ಟುಕೊಟ್ಟಿರುತ್ತಾರೆ’ ಅಂತ ಅಲ್ಲ.'
    tr: 'Sār, Ḍisembar-nalli appa hōdāga vaṁśavṛkṣadalli nanna hesarē irlilla. Ūralli ‘maduve kharcē avaḷa pālu’ andru. Nānu dāve hākiddu nanna aṇṇa-tammana viruddha alla — ā mātina viruddha. Īga tahasīldār ādēśadinda pahaṇiyalli nanna hesaride. Nanage maṇṇu bēḍa; nyāyavāda pālu haṇada rūpadalli sāku. Matte ondu: rāji kāgadadalli ‘Cannēgauḍara magaḷu Śōbhā tamma pālu paḍediruttāre’ anta barībēku. ‘Biṭṭukoṭṭiruttāre’ anta alla.'
    en: 'Sir, when Appa died in December my name wasn''t even in the family tree. In the village they said, ''Her wedding expenses were her share.'' I didn''t file the suit against my brothers — I filed it against that sentence. Now, by the Tahsildar''s order, my name is in the RTC. I don''t need soil; a fair share in money is enough. And one more thing: the compromise must say ''Shobha, daughter of Channegowda, has received her share''. Not ''has given it up''.'
  - who: conciliator
    t: ಒಳ್ಳೆ ಅಂಶ. ‘ಪಡೆದಿರುತ್ತಾರೆ’ ಅಂತಲೇ ಬರೆಯೋಣ. … ಮಹದೇವ ಅವರೇ, ನೀವು.
    tr: Oḷḷe aṁśa. ‘Paḍediruttāre’ antalē bareyōṇa. … Mahadēva avarē, nīvu.
    en: A good point. We'll write 'has received', exactly so. … Mr Mahadeva, your turn.
  - who: mahadeva
    t: ಸಾರ್, ನನಗೆ ದೊಡ್ಡ ಮಾತು ಬರಲ್ಲ. ಇಪ್ಪತ್ತು ವರ್ಷ ಆ ಗದ್ದೆಯಲ್ಲಿ ದುಡಿದೀನಿ. ಮೇ ತಿಂಗಳಲ್ಲಿ ನಾನೇ ತಡೆಯಾಜ್ಞೆ ಕೇಳಿದ್ದೆ, ಮಧ್ಯಸ್ಥಿಕೆಗೆ ‘ಬೇಡ’ ಅಂದಿದ್ದೆ. ಆಗ ನನ್ನ ಭಯ ಒಂದೇ — ಗದ್ದೆ ತುಂಡಾಗುತ್ತೆ, ನನ್ನ ಕೆಲಸ ಹೋಗುತ್ತೆ ಅಂತ. ಈ ವರ್ಷ ನನ್ನ ಅಣ್ಣ ಪ್ರತಿ ಶನಿವಾರ ಬಂದು ಕೆಸರಲ್ಲಿ ನಿಂತ. ನನ್ನ ತಂಗಿ ಕಬ್ಬಿನ ಹಣ ನನ್ನ ಖಾತೆಗೆ ಹೋಗಲಿ ಅಂತ ಸಹಿ ಹಾಕಿದ್ಲು. ಈಗ ನನ್ನ ಭಯ ಬೇರೆ — ಇವತ್ತು ರಾಜಿ ಆಗದಿದ್ರೆ ಈ ವರ್ಷ ಕಟ್ಟಿದ್ದೆಲ್ಲಾ ಮತ್ತೆ ಒಡೆದುಹೋಗುತ್ತೆ ಅಂತ.
    tr: Sār, nanage doḍḍa mātu baralla. Ippattu varṣa ā gaddeyalli duḍidīni. Mē tiṅgaḷalli nānē taḍeyājñe kēḷidde, madhyasthikege ‘bēḍa’ andidde. Āga nanna bhaya ondē — gadde tuṇḍāgutte, nanna kelasa hōgutte anta. Ī varṣa nanna aṇṇa prati Śanivāra bandu kesaralli ninta. Nanna taṅgi kabbina haṇa nanna khātege hōgali anta sahi hākidlu. Īga nanna bhaya bēre — ivattu rāji āgadidre ī varṣa kaṭṭiddellā matte oḍeduhōgutte anta.
    en: Sir, I'm not good with big words. I've toiled on that wet land for twenty years. In May it was I who asked for the injunction and said 'no' to mediation. Back then I had one fear — that the land would be cut up and my work would be gone. This year my brother came every Saturday and stood in the mud. My sister signed so that the cane money could go into my account. Now my fear is different — that if there's no settlement today, everything we've built this year will break again.
  - who: conciliator
    t: ನಿಮ್ಮ ಪ್ರಸ್ತಾಪ?
    tr: Nimma prastāpa?
    en: Your proposal?
  - who: mahadeva
    t: ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡು — ಮೂರು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆ ಗದ್ದೆ, ಮನೆ, ಕೊಟ್ಟಿಗೆ ನನಗೆ. ಅಪ್ಪನ ಹೆಸರಲ್ಲಿದ್ದ ಸಂಘದ ಸಾಲ ಒಂದು ಲಕ್ಷ ಅರವತ್ತು ಸಾವಿರ ನಾನು ಈಗಾಗಲೇ ತೀರಿಸಿದೀನಿ — ಇಗೋ ಬೇಬಾಕಿ ಪ್ರಮಾಣಪತ್ರ. ಶೋಭಾಳ ಪಾಲಿಗೆ ಸರ್ವೆ ನಂಬರ್ ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದರ ಅರ್ಧ — ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ. ಅದನ್ನ ಮಾರಿ ಬರೋ ಹಣ ಪೂರ್ತಿ ಅವಳದು.
    tr: Sarve nambar nūra hanneraḍu, hissā eraḍu — mūru ekare ippattu guṇṭe gadde, mane, koṭṭige nanage. Appana hesaralidda saṅghada sāla ondu lakṣa aravattu sāvira nānu īgāgalē tīrisidīni — igō bēbāki pramāṇapatra. Śōbhāḷa pālige sarve nambar embattēḷu, hissā ondara ardha — ondu ekare hattu guṇṭe. Adanna māri barō haṇa pūrti avaḷadu.
    en: Survey number one hundred and twelve, hissa two — the three acres twenty guntas of wet land, the house and the cattle shed to me. The society loan of one lakh sixty thousand in Appa's name I've already repaid — here's the no-dues certificate. For Shobha's share, half of survey number eighty-seven, hissa one — one acre ten guntas. All the money from selling it is hers.
  - who: conciliator
    t: ಸುರೇಶ್ ಅವರೇ?
    tr: Surēś avarē?
    en: Mr Suresh?
  - who: suresh
    t: ಸಾರ್, ನಾನು ಎರಡನೇ ಪ್ರತಿವಾದಿ, ಹಿರಿಯ ಮಗ. ನನ್ನ ಪಾಲು ನನಗೆ ಬೇಡ. ಉಳಿದ ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ — ಹುಣಸೆ ಮರ, ನಮ್ಮಪ್ಪನ ಸಮಾಧಿ ಇರೋ ಭಾಗ — ನನ್ನ ಪಾಲು, ಅವ್ವನ ಪಾಲು ಸೇರಿ ಅವ್ವನ ಹೆಸರಿಗೆ ಆಗಲಿ. ಅವಳು ಇರೋವರೆಗೂ ಅದರ ಬೆಳೆ, ಆದಾಯ ಅವಳದು. ಮಹದೇವ ಅದನ್ನ ಬೇಸಾಯ ಮಾಡಿ ಅವಳಿಗೆ ಕೊಡ್ತಾನೆ.
    tr: Sār, nānu eraḍanē prativādi, hiriya maga. Nanna pālu nanage bēḍa. Uḷida ondu ekare hattu guṇṭe — huṇase mara, nammappana samādhi irō bhāga — nanna pālu, avvana pālu sēri avvana hesarige āgali. Avaḷu irōvaregū adara beḷe, ādāya avaḷadu. Mahadēva adanna bēsāya māḍi avaḷige koḍtāne.
    en: Sir, I'm the second defendant, the eldest son. I don't want my share. Let the remaining one acre ten guntas — the part with the tamarind tree and our father's grave — go into Avva's name, my share and hers together. As long as she lives, its crop and income are hers. Mahadeva will farm it and give her what it yields.
  - who: conciliator
    t: ಒಂದು ಪ್ರಶ್ನೆ, ಸುರೇಶ್ ಅವರೇ. ಇದು ಭಾವೋದ್ವೇಗದಲ್ಲಿ ತಗೊಂಡ ತೀರ್ಮಾನವಾ? ಐತೀರ್ಪಿಗೆ ಮೇಲ್ಮನವಿ ಇಲ್ಲ ಅಂತ ಹೇಳಿದೆ. ಹತ್ತು ವರ್ಷ ಆದ್ಮೇಲೆ ನಿಮ್ಮ ಮಗ ‘ನನ್ನ ಅಪ್ಪನ ಪಾಲು ಎಲ್ಲಿ?’ ಅಂತ ಕೇಳಿದ್ರೆ?
    tr: Ondu praśne, Surēś avarē. Idu bhāvōdvēgadalli tagoṇḍa tīrmānavā? Aitīrpige mēlmanavi illa anta hēḷide. Hattu varṣa ādmēle nimma maga ‘nanna appana pālu elli?’ anta kēḷidre?
    en: One question, Mr Suresh. Is this a decision taken in a moment of emotion? I've told you there's no appeal against the award. What if, ten years from now, your son asks, 'Where is my father's share?'
  - who: suresh
    t: ಅವನು ಇಲ್ಲೇ ಇದಾನೆ ಸಾರ್, ಹೊರಗಿನ ಬೆಂಚಿನ ಮೇಲೆ. ಅವನನ್ನ ಕೇಳಿದೀನಿ. ನನ್ನ ಹೆಂಡತಿಯನ್ನೂ ಕೇಳಿದೀನಿ — ಅವಳು ಇಲ್ಲೇ ಕೂತಿದಾಳೆ. ಮೂರು ತಿಂಗಳು ಯೋಚನೆ ಮಾಡಿದೀನಿ — ಆರುನೂರಾ ಐವತ್ತು ಅಡಿಯ ಒಣ ಬೋರ್‌ವೆಲ್ ಹತ್ರ ನಿಂತು, ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಕೆಸರಲ್ಲಿ ನಿಂತು. ಇದು ಭಾವೋದ್ವೇಗ ಅಲ್ಲ ಸಾರ್. ಇದು ಲೆಕ್ಕ.
    tr: Avanu illē idāne sār, horagina beṇcina mēle. Avananna kēḷidīni. Nanna heṇḍatiyannū kēḷidīni — avaḷu illē kūtidāḷe. Mūru tiṅgaḷu yōcane māḍidīni — ārunūrā aivattu aḍiya oṇa bōrvel hatra nintu, rātri eraḍu gaṇṭege kesaralli nintu. Idu bhāvōdvēga alla sār. Idu lekka.
    en: He's right here, sir, on the bench outside. I've asked him. I've asked my wife too — she's sitting right here. I've thought about it for three months — standing beside a dry six-hundred-and-fifty-foot borewell, standing in mud at two in the morning. This isn't emotion, sir. It's accounting.
  - who: meena
    t: ಸಾರ್, ಮನೆಯಲ್ಲಿ ಅಂಕಿ-ಸಂಖ್ಯೆ ನೋಡೋಳು ನಾನು. ನಮಗೆ ಬೆಂಗಳೂರಲ್ಲಿ ಸಂಬಳ ಇದೆ, ಮನೆ ಸಾಲ ಹತ್ತು ವರ್ಷದಲ್ಲಿ ಮುಗಿಯುತ್ತೆ. ಅವ್ವನಿಗೆ ವಯಸ್ಸು ಎಪ್ಪತ್ತು, ಅವರ ಸ್ವಂತ ಅಂತ ಏನೂ ಇಲ್ಲ. ಈ ತೀರ್ಮಾನಕ್ಕೆ ನಮ್ಮ ಪೂರ್ತಿ ಒಪ್ಪಿಗೆ ಇದೆ.
    tr: Sār, maneyalli aṅki-saṅkhye nōḍōḷu nānu. Namage Beṅgaḷūralli sambaḷa ide, mane sāla hattu varṣadalli mugiyutte. Avvanige vayassu eppattu, avara svanta anta ēnū illa. Ī tīrmānakke namma pūrti oppige ide.
    en: Sir, I'm the one who looks after the figures at home. We have salaries in Bengaluru; the house loan ends in ten years. Avva is seventy and has nothing of her own. We agree to this decision completely.
  - who: conciliator
    t: ಹೊರಗೆ ಕೂತಿರೋ ಆ ಹುಡುಗನ್ನ ಕರೀರಿ. ಮುಂದಿನ ತಲೆಮಾರು ಏನು ಹೇಳುತ್ತೆ ಅಂತ ಕೇಳೋಣ — ಕಾನೂನಿಗಲ್ಲ, ನನ್ನ ಸಮಾಧಾನಕ್ಕೆ.
    tr: Horage kūtirō ā huḍuganna karīri. Mundina talemāru ēnu hēḷutte anta kēḷōṇa — kānūnigalla, nanna samādhānakke.
    en: Call in that boy sitting outside. Let's hear what the next generation says — not for the law, for my own peace of mind.
  - who: rakshith
    t: ನಮಸ್ಕಾರ ಸಾರ್. ನಾನು ರಕ್ಷಿತ್, ಸೆಕೆಂಡ್ ಪಿಯುಸಿ.
    tr: Namaskāra sār. Nānu Rakṣit, sekeṇḍ Pi-Yu-Si.
    en: Namaskara, sir. I'm Rakshith, in second PUC.
  - who: conciliator
    t: ನಿಮ್ಮಪ್ಪ ತಮ್ಮ ಪಾಲು ಬಿಡ್ತಿದಾರೆ. ನಾಳೆ ಅದು ನಿನಗೆ ಸಿಗಲ್ಲ. ನಿನಗೆ ಬೇಜಾರಿಲ್ವಾ?
    tr: Nimmappa tamma pālu biḍtidāre. Nāḷe adu ninage sigalla. Ninage bējārilvā?
    en: Your father is giving up his share. One day it won't come to you. Doesn't that upset you?
  - who: rakshith
    t: ಸಾರ್, ಈ ವರ್ಷ ನಾನು ಹಸು ಕರೆಯೋದು, ಕೂಳೆ ಕಬ್ಬು, ನಾಲೆಯ ಕಟ್ಟು ಪದ್ಧತಿ ಕಲಿತೆ. ಅದು ಯಾವ ಪಹಣಿಯಲ್ಲೂ ಬರಲ್ಲ, ಆದ್ರೂ ಅದು ನನ್ನದು. ನನಗೆ ಬೇಕಾಗಿರೋದು ಒಂದೇ — ನಾನು ಬಂದಾಗ ಚಿಕ್ಕಪ್ಪನ ಮನೆ ಬಾಗಿಲು ತೆಗೆದಿರಬೇಕು, ಕಾವೇರಿ ನನ್ನ ಗುರುತು ಹಿಡೀಬೇಕು. ಕಾವೇರಿ ನಮ್ಮ ಕರು, ಸಾರ್.
    tr: Sār, ī varṣa nānu hasu kareyōdu, kūḷe kabbu, nāleya kaṭṭu paddhati kalite. Adu yāva pahaṇiyallū baralla, ādrū adu nannadu. Nanage bēkāgirōdu ondē — nānu bandāga cikkappana mane bāgilu tegedirabēku, Kāvēri nanna gurutu hiḍībēku. Kāvēri namma karu, sār.
    en: Sir, this year I learnt to milk a cow, about ratoon cane, the canal rotation. None of that shows up in any RTC, but it's mine. I want just one thing — when I come, Chikkappa's door should be open and Kaveri should recognise me. Kaveri's our calf, sir.
  - who: conciliator
    t: … ಅದನ್ನ ದಾಖಲಿಸಿಕೊಳ್ಳೋ ಅಗತ್ಯ ಇಲ್ಲ. ಆದ್ರೆ ನಾನು ಮರೆಯೋದಿಲ್ಲ. … ಅಮ್ಮ, ಈಗ ನೀವು. ನಿಮಗೂ ಒಬ್ಬ ವಕೀಲರಿದಾರೆ, ಆದ್ರೆ ನಾನು ನಿಮ್ಮ ಬಾಯಿಂದಲೇ ಕೇಳ್ಬೇಕು. ಯಾರಾದ್ರೂ ನಿಮ್ಮ ಮೇಲೆ ಒತ್ತಡ ಹಾಕಿದಾರಾ?
    tr: … Adanna dākhalisikoḷḷō agatya illa. Ādre nānu mareyōdilla. … Amma, īga nīvu. Nimagū obba vakīlaridāre, ādre nānu nimma bāyindalē kēḷbēku. Yārādrū nimma mēle ottaḍa hākidārā?
    en: (after a moment) … There's no need to record that. But I won't forget it. … Amma, now you. You have a lawyer of your own, but I must hear it from your own mouth. Has anyone put pressure on you?
  - who: avva
    t: ಒತ್ತಡ ಹಾಕಿದ್ದು ಒಬ್ರೇ ಸ್ವಾಮಿ — ನನ್ನ ಯಜಮಾನ್ರು. ದಿನಚರಿಯ ಕೊನೇ ಪುಟದಲ್ಲಿ. ‘ಮೂರೂ ಮಕ್ಳು ಒಟ್ಟಿಗೆ ಉಣ್ಣೋದು ನೋಡ್ಬೇಕು’ ಅಂತ. ಅವರು ನೋಡ್ಲಿಲ್ಲ. ನಾನಾದ್ರೂ ನೋಡ್ಬೇಕು. … ಸ್ವಾಮಿ, ನನಗೆ ಓದೋಕೆ ಬರಲ್ಲ. ಆದ್ರೆ ನನ್ನ ಮಕ್ಳ ಮುಖ ಓದೋಕೆ ಬರುತ್ತೆ. ಇವತ್ತು ಮೂರೂ ಮುಖದಲ್ಲಿ ಕೋಪ ಇಲ್ಲ. ಅಷ್ಟೇ ನನಗೆ ಸಾಕು.
    tr: Ottaḍa hākiddu obrē svāmi — nanna yajamānru. Dinacariya konē puṭadalli. ‘Mūrū makḷu oṭṭige uṇṇōdu nōḍbēku’ anta. Avaru nōḍlilla. Nānādrū nōḍbēku. … Svāmi, nanage ōdōke baralla. Ādre nanna makḷa mukha ōdōke barutte. Ivattu mūrū mukhadalli kōpa illa. Aṣṭē nanage sāku.
    en: 'Only one person has pressured me, Swami — my husband. On the last page of his diary: ''I must see all three children eating together.'' He didn''t live to see it. At least I must. … Swami, I can''t read. But I can read my children''s faces. Today there''s no anger in any of the three. That''s all I need.'
  - who: conciliator
    t: … ಮೂವತ್ತೈದು ವರ್ಷ ನ್ಯಾಯಾಧೀಶನಾಗಿದ್ದೆ, ಅಮ್ಮ. ಇಷ್ಟು ಒಳ್ಳೆ ಸಾಕ್ಷಿ ಹೇಳಿಕೆ ಕೇಳಿರಲಿಲ್ಲ. ನನ್ನ ಅಪ್ಪ ಮತ್ತೆ ಚಿಕ್ಕಪ್ಪ ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ ಒಂದು ವಿಭಾಗದ ದಾವೆ ನಡೆಸಿದ್ರು. ಡಿಕ್ರಿ ಬಂದಾಗ ಇಬ್ರೂ ಬದುಕಿರಲಿಲ್ಲ. ನಿವೃತ್ತಿ ಆದ ಮೇಲೆ ನಾನು ಈ ಬೆಂಚಲ್ಲಿ ಕೂತಿರೋದು ಅದಕ್ಕೇ.
    tr: … Mūvattaidu varṣa nyāyādhīśanāgidde, amma. Iṣṭu oḷḷe sākṣi hēḷike kēḷiralilla. Nanna appa matte cikkappa ippatteraḍu varṣa ondu vibhāgada dāve naḍesidru. Ḍikri bandāga ibbrū badukiralilla. Nivṛtti āda mēle nānu ī beṇcalli kūtirōdu adakkē.
    en: … I was a judge for thirty-five years, Amma. I never heard better testimony. My own father and his younger brother fought a partition suit for twenty-two years. When the decree came, neither of them was alive. That's why, after retiring, I sit on this bench.
  - section: Testing the terms
    learn: 'the arithmetic of fairness: kānūnina prakāra samapālu, mārgasūci bele, brōkar bele, raita raitanige koḍō bele · free consent: svaiccheyinda, yāva ottaḍavū illade, avasara illa · protecting the weak: jīvanaparyanta vāsada hakku, dāriya hakku · formal award language: oppiruttāre, sēratakkaddu, teravugoḷisalāgide, ityarthapaḍisalāgide, marupāvati māḍatakkaddu'
  - who: conciliator
    t: ಈಗ ಲೆಕ್ಕ. ಶೋಭಾ ಅವರೇ, ಕಾನೂನಿನ ಪ್ರಕಾರ ನಾಲ್ವರಿಗೂ ಸಮಪಾಲು — ಅಂದ್ರೆ ಆರು ಎಕರೆಯಲ್ಲಿ ಒಂದೂವರೆ ಎಕರೆಯ ಬೆಲೆ ನಿಮ್ಮದು. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಒಬ್ಬ ಬ್ರೋಕರ್ ಹೇಳಿದ ರೇಟಿನಲ್ಲಿ ಲೆಕ್ಕ ಹಾಕಿದ್ರೆ ಅದು ಎಪ್ಪತ್ತು ಲಕ್ಷಕ್ಕಿಂತ ಜಾಸ್ತಿ. ಒಣ ಹೊಲದ ಒಂದೂಕಾಲು ಎಕರೆಗೆ ಎಷ್ಟು ಬರುತ್ತೆ?
    tr: Īga lekka. Śōbhā avarē, kānūnina prakāra nālvarigū samapālu — andre āru ekareyalli ondūvare ekareya bele nimmadu. Mārc-nalli obba brōkar hēḷida rēṭinalli lekka hākidre adu eppattu lakṣakkinta jāsti. Oṇa holada ondūkālu ekarege eṣṭu barutte?
    en: Now the figures. Ms Shobha, under the law all four of you have equal shares — so the value of one and a half acres out of the six is yours. At the rate a broker quoted in March, that's over seventy lakh. What will one and a quarter acres of dry field fetch?
  - who: lawyer
    t: ಸಾರ್, ನಿಂಗೇಗೌಡರು ಎಕರೆಗೆ ಮೂವತ್ತಾರು ಲಕ್ಷ ಕೊಡೋಕೆ ಒಪ್ಪಿದಾರೆ — ಒಟ್ಟು ನಲವತ್ತೈದು ಲಕ್ಷ. ಇದು ಆ ಭಾಗದ ಮಾರ್ಗಸೂಚಿ ಬೆಲೆಗಿಂತ ಜಾಸ್ತಿ, ಆದ್ರೆ ಬ್ರೋಕರ್ ಹೇಳಿದ ಬೆಲೆಗಿಂತ ಕಮ್ಮಿ. ಬ್ರೋಕರ್ ಬೆಲೆ ಭೂ ಪರಿವರ್ತನೆಯ ಆಸೆಯ ಬೆಲೆ; ಇದು ರೈತ ರೈತನಿಗೆ ಕೊಡೋ ಬೆಲೆ. ಹಣ ಪೂರ್ತಿ ಬ್ಯಾಂಕ್ ಮೂಲಕ, ನೇರವಾಗಿ ಶೋಭಾ ಅವರ ಖಾತೆಗೆ.
    tr: Sār, Niṅgēgauḍaru ekarege mūvattāru lakṣa koḍōke oppidāre — oṭṭu nalavattaidu lakṣa. Idu ā bhāgada mārgasūci belegintā jāsti, ādre brōkar hēḷida belegintā kammi. Brōkar bele bhū parivartaneya āseya bele; idu raita raitanige koḍō bele. Haṇa pūrti byāṅk mūlaka, nēravāgi Śōbhā avara khātege.
    en: Sir, Ningegowda has agreed to pay thirty-six lakh an acre — forty-five lakh in all. That's above the guidance value for that area, but below the broker's price. The broker's price was the price of hoped-for conversion; this is the price one farmer pays another. All of it through the bank, straight into Ms Shobha's account.
  - who: conciliator
    t: ಇನ್ನೊಂದು ಪ್ರಶ್ನೆ. ನಿಂಗೇಗೌಡರು ನಾಳೆ ಮನಸ್ಸು ಬದಲಾಯಿಸಿದ್ರೆ? ಐತೀರ್ಪು ಒಬ್ಬ ಹೊರಗಿನ ವ್ಯಕ್ತಿಯ ಮಾತಿನ ಮೇಲೆ ನಿಲ್ಲಬಾರದು.
    tr: Innondu praśne. Niṅgēgauḍaru nāḷe manassu badalāyisidre? Aitīrpu obba horagina vyaktiya mātina mēle nillabāradu.
    en: Another question. What if Ningegowda changes his mind tomorrow? An award mustn't rest on the word of an outsider.
  - who: lawyer
    t: ಅದಕ್ಕೇ ಸಾರ್, ಶೋಭಾ ಅವರ ಹೆಸರಿಗೆ ಬರೋದು ಭೂಮಿ — ಹಣ ಅಲ್ಲ. ಅವರು ಯಾರಿಗೆ ಬೇಕಾದ್ರೂ ಮಾರಬಹುದು, ಇಲ್ಲಾ ಇಟ್ಕೊಳ್ಳಬಹುದು. ನಿಂಗೇಗೌಡರು ಐತೀರ್ಪು ಆದ ಮೇಲೆ, ಸರಿಯಾದ ಕರಾರು ಮಾಡ್ಕೊಂಡು, ಐದು ಲಕ್ಷ ಮುಂಗಡ ಕೊಡೋಕೆ ಸಿದ್ಧರಿದಾರೆ.
    tr: Adakkē sār, Śōbhā avara hesarige barōdu bhūmi — haṇa alla. Avaru yārige bēkādrū mārabahudu, illā iṭkoḷḷabahudu. Niṅgēgauḍaru aitīrpu āda mēle, sariyāda karāru māḍkoṇḍu, aidu lakṣa muṅgaḍa koḍōke siddharidāre.
    en: That's exactly why, sir, what comes into Ms Shobha's name is land — not money. She can sell it to anyone she likes, or keep it. Once the award is made, Ningegowda is ready to pay five lakh in advance under a proper agreement.
  - who: conciliator
    t: 'ಸರಿ. ಶೋಭಾ ಅವರೇ, ನಲವತ್ತೈದು ಮತ್ತು ಎಪ್ಪತ್ತು — ವ್ಯತ್ಯಾಸ ದೊಡ್ಡದು. ನಾನು ಇದನ್ನ ಕೇಳಲೇಬೇಕು: ನೀವು ಇದಕ್ಕೆ ಸ್ವಇಚ್ಛೆಯಿಂದ, ಯಾವ ಒತ್ತಡವೂ ಇಲ್ಲದೆ ಒಪ್ತೀರಾ? ಹೆಣ್ಣುಮಕ್ಕಳು ‘ಮನೆ ಶಾಂತಿಗಾಗಿ’ ಅಂತ ಕಮ್ಮಿಗೆ ಒಪ್ಪೋದು ನಾನು ಸಾಕಷ್ಟು ನೋಡಿದೀನಿ. ಅದು ಇಲ್ಲಿ ಆಗಬಾರದು.'
    tr: 'Sari. Śōbhā avarē, nalavattaidu mattu eppattu — vyatyāsa doḍḍadu. Nānu idanna kēḷalēbēku: nīvu idakke svaiccheyinda, yāva ottaḍavū illade optīrā? Heṇṇumakkaḷu ‘mane śāntigāgi’ anta kammige oppōdu nānu sākaṣṭu nōḍidīni. Adu illi āgabāradu.'
    en: 'Good. Ms Shobha, forty-five and seventy — that''s a big difference. I have to ask: do you agree to this of your own free will, under no pressure? I''ve seen plenty of daughters accept less ''for the sake of peace at home''. That must not happen here.'
  - who: shobha
    t: ಸಾರ್, ಒಂದು ವಿಷಯ ಮುಚ್ಚಿಡಲ್ಲ. ನನ್ನ ಯಜಮಾನ್ರು ನಿನ್ನೆ ರಾತ್ರಿ ಹೇಳಿದ್ರು — ‘ಎಪ್ಪತ್ತು ಲಕ್ಷದ ಹಕ್ಕು ಬಿಟ್ಟು ನಲವತ್ತೈದಕ್ಕೆ ಒಪ್ತೀಯಾ? ನಿನ್ನ ತವರಿನವರು ಮತ್ತೆ ನಿನಗೆ ಮೋಸ ಮಾಡ್ತಿದಾರೆ’ ಅಂತ. ಮನೆಯಲ್ಲಿ ಜಗಳ ಆಯ್ತು.
    tr: Sār, ondu viṣaya mucciḍalla. Nanna yajamānru ninne rātri hēḷidru — ‘eppattu lakṣada hakku biṭṭu nalavattaidakke optīyā? Ninna tavarinavaru matte ninage mōsa māḍtidāre’ anta. Maneyalli jagaḷa āytu.
    en: Sir, I won't hide one thing. Last night my husband said, 'You're giving up a claim worth seventy lakh and settling for forty-five? Your family is cheating you all over again.' We quarrelled at home.
  - who: conciliator
    t: ಅವರ ಭಯ ಅರ್ಥ ಆಗುತ್ತೆ. ಆದ್ರೆ ಕಾನೂನಿನಲ್ಲಿ ಈ ಪಾಲು ನಿಮ್ಮದು, ಅವರದಲ್ಲ — ತೀರ್ಮಾನಾನೂ ನಿಮ್ಮದೇ. ಬೇಕಾದ್ರೆ ಇವತ್ತು ಸಹಿ ಹಾಕದೆ ಮುಂದಿನ ಲೋಕ ಅದಾಲತ್‌ವರೆಗೆ ಯೋಚನೆ ಮಾಡಬಹುದು. ಯಾವ ಅವಸರಾನೂ ಇಲ್ಲ.
    tr: Avara bhaya artha āgutte. Ādre kānūninalli ī pālu nimmadu, avaradalla — tīrmānānū nimmadē. Bēkādre ivattu sahi hākade mundina Lōka Adālat-varege yōcane māḍabahudu. Yāva avasarānū illa.
    en: I understand his fear. But in law this share is yours, not his — and so is the decision. If you wish, you can leave without signing today and think it over until the next Lok Adalat. There's no hurry at all.
  - who: shobha
    t: ಇಲ್ಲ ಸಾರ್. ಅವರಿಗೆ ನಾನು ಒಂದೇ ಮಾತು ಹೇಳಿದೆ — ‘ಮೋಸ ಮಾಡೋರು ತಮ್ಮ ಪಾಲು ಬಿಟ್ಟುಕೊಡಲ್ಲ. ನನ್ನ ಅಣ್ಣ ತನ್ನದು ಪೂರ್ತಿ ಬಿಡ್ತಿದಾನೆ.’ ಮಹದೇವನಿಗೆ ಜಾಸ್ತಿ ಸಿಗ್ತಿದೆ, ನಿಜ. ಆದ್ರೆ ಆ ಜಾಸ್ತಿಯನ್ನ ಅವನು ಇಪ್ಪತ್ತು ವರ್ಷ ಮುಂಚೆಯೇ ದುಡಿದಿದಾನೆ — ತಹಸೀಲ್ದಾರ್ ಮೇಡಂ ಅವತ್ತೇ ಹೇಳಿದ್ರು, ಅವನ ದುಡಿಮೆ ಲೆಕ್ಕಕ್ಕೆ ಬರಬಹುದು ಅಂತ. ಹೌದು ಸಾರ್, ಸ್ವಇಚ್ಛೆಯಿಂದ ಒಪ್ತೀನಿ. … ಬೆಳಿಗ್ಗೆ ನನ್ನ ಯಜಮಾನ್ರೇ ಬಸ್ ಹತ್ತಿಸಿ ‘ಹುಷಾರು’ ಅಂದ್ರು.
    tr: Illa sār. Avarige nānu ondē mātu hēḷide — ‘mōsa māḍōru tamma pālu biṭṭukoḍalla. Nanna aṇṇa tannadu pūrti biḍtidāne.’ Mahadēvanige jāsti sigtide, nija. Ādre ā jāstiyanna avanu ippattu varṣa mun̄ceyē duḍididāne — tahasīldār mēḍam avattē hēḷidru, avana duḍime lekkakke barabahudu anta. Haudu sār, svaiccheyinda optīni. … Beḷigge nanna yajamānrē bas hattisi ‘huṣāru’ andru.
    en: 'No, sir. I told him just one thing: ''People who cheat don''t give up their own share. My elder brother is giving up all of his.'' Mahadeva is getting more, it''s true. But he earned that ''more'' twenty years in advance — the Tahsildar madam said so that very day, that his labour might be taken into account. Yes, sir, I agree of my own free will. … And this morning it was my husband himself who put me on the bus and said, ''Take care.'''
  - who: conciliator
    t: 'ದಾಖಲಿಸಿಕೊಂಡೆ. … ಇನ್ನೊಂದು ಸೂಕ್ಷ್ಮ ವಿಷಯ. ಸುರೇಶ್ ಅವರ ಭಾಗ ಅಮ್ಮನಿಗೆ ‘ಅವರು ಇರೋವರೆಗೂ’ ಅಂದ್ರಿ. ಅಮ್ಮನ ನಂತರ ಅದು ಯಾರಿಗೆ ಅನ್ನೋದು ಸ್ಪಷ್ಟ ಇರ್ಬೇಕು, ಇಲ್ಲದಿದ್ರೆ ಮುಂದಿನ ತಲೆಮಾರಿಗೆ ಇನ್ನೊಂದು ದಾವೆ ಬಿಟ್ಟು ಹೋಗ್ತೀರಿ. ಎರಡು ದಾರಿ: ಒಂದು, ಆ ಭಾಗ ಅಮ್ಮನಿಗೆ ಪೂರ್ಣ ಹಕ್ಕಿನಿಂದ — ಆಮೇಲೆ ಅವರು ಉಯಿಲು ಮಾಡಬಹುದು. ಎರಡು, ಅಮ್ಮನಿಗೆ ಜೀವಿತಾವಧಿ ಹಕ್ಕು, ನಂತರ ಯಾರಿಗೆ ಅಂತ ಇವತ್ತೇ ಬರೆಯೋದು.'
    tr: 'Dākhalisikoṇḍe. … Innondu sūkṣma viṣaya. Surēś avara bhāga ammanige ‘avaru irōvaregū’ andri. Ammana nantara adu yārige annōdu spaṣṭa irbēku, illadidre mundina talemārige innondu dāve biṭṭu hōgtīri. Eraḍu dāri: ondu, ā bhāga ammanige pūrṇa hakkininda — āmēle avaru uyilu māḍabahudu. Eraḍu, ammanige jīvitāvadhi hakku, nantara yārige anta ivattē bareyōdu.'
    en: 'Noted. … One more delicate matter. You said Mr Suresh''s portion goes to Amma ''for as long as she lives''. Who gets it after her must be clear, or you''ll leave the next generation another lawsuit. There are two ways: one, that portion goes to Amma absolutely — then she can make a will. Two, Amma has a life interest, and you write down today who gets it after.'
  - who: avva
    t: 'ಉಯಿಲು ಬರೆಸ್ತೀನಿ ಅಂದಿದ್ದೆ ಸ್ವಾಮಿ. ಬೇಡ — ಕಾಗದ ಎರಡಾದ್ರೆ ಜಗಳಾನೂ ಎರಡಾಗುತ್ತೆ. ನನ್ನ ಮಕ್ಕಳ ಮುಂದೆ ಇವತ್ತೇ ಹೇಳ್ತೀನಿ: ನಾನು ಹೋದ ಮೇಲೆ ಆ ಹುಣಸೆ ಮರದ ಹೊಲ ಮಹದೇವನಿಗೆ. ಅವನೇ ಅದನ್ನ ಉಳ್ತಾನೆ, ಅವನೇ ಅಪ್ಪನ ಸಮಾಧಿಗೆ ದೀಪ ಹಚ್ತಾನೆ. ಆದ್ರೆ ಒಂದು ಕಂಡಿಷನ್: ಆ ಸಮಾಧಿ ಹತ್ರ ಬರೋಕೆ ಸುರೇಶಂಗೂ ಶೋಭಂಗೂ ಅವರ ಮಕ್ಕಳಿಗೂ ಯಾವತ್ತೂ ದಾರಿ ಇರ್ಬೇಕು. ಅದನ್ನ ಬರೀರಿ.'
    tr: 'Uyilu barestīni andidde svāmi. Bēḍa — kāgada eraḍādre jagaḷānū eraḍāgutte. Nanna makkaḷa munde ivattē hēḷtīni: nānu hōda mēle ā huṇase marada hola Mahadēvanige. Avanē adanna uḷtāne, avanē appana samādhige dīpa hactāne. Ādre ondu kaṇḍiṣan: ā samādhi hatra barōke Surēśaṅgū Śōbhaṅgū avara makkaḷigū yāvattū dāri irbēku. Adanna barīri.'
    en: 'I''d said I''d have a will written, Swami. No — two papers mean two quarrels. I''ll say it today, in front of my children: after I''m gone, the tamarind field goes to Mahadeva. He''s the one who''ll plough it; he''s the one who''ll light the lamp at his father''s grave. But one condition: Suresha and Shobha and their children must always have a path to come to that grave. Write that down.'
  - who: mahadeva
    t: ಅವ್ವ… ದಾರಿ ಮಾತ್ರ ಅಲ್ಲ. ಪ್ರತಿ ಸಂಕ್ರಾಂತಿಗೆ ಊಟಾನೂ ಇರುತ್ತೆ. ಅದನ್ನೂ ಬರೀರಿ ಸಾರ್.
    tr: Avva… dāri mātra alla. Prati Saṅkrāntige ūṭānū irutte. Adannū barīri sār.
    en: Avva… not just a path. There'll be a meal every Sankranti too. Write that as well, sir.
  - who: conciliator
    t: 'ಊಟವನ್ನ ಐತೀರ್ಪಲ್ಲಿ ಬರೆಯೋಕಾಗಲ್ಲ, ಮಹದೇವ ಅವರೇ — ಯಾವ ನ್ಯಾಯಾಲಯವೂ ಅದನ್ನ ಜಾರಿ ಮಾಡೋಕಾಗಲ್ಲ. ಅದು ನಿಮ್ಮ ಮನಸ್ಸಲ್ಲೇ ಇರಲಿ. ದಾರಿಯ ಹಕ್ಕನ್ನ ಬರೀತೀನಿ. ಇನ್ನೊಂದು ಅಂಶ ನಾನೇ ಸೇರಿಸ್ತೀನಿ: ಮನೆ ಮಹದೇವ ಅವರಿಗೆ, ಆದ್ರೆ ಅಮ್ಮನಿಗೆ ಅದೇ ಮನೆಯಲ್ಲಿ ಜೀವನಪರ್ಯಂತ ವಾಸ ಮಾಡುವ ಹಕ್ಕು. ಐವತ್ತೆರಡು ವರ್ಷ ಆ ಅಂಗಳ ಗುಡಿಸಿದವರು ಯಾರ ದಯೆಯಲ್ಲೂ ಇರಬಾರದು.'
    tr: 'Ūṭavanna aitīrpalli bareyōkāgalla, Mahadēva avarē — yāva nyāyālayavū adanna jāri māḍōkāgalla. Adu nimma manassallē irali. Dāriya hakkanna barītīni. Innondu aṁśa nānē sēristīni: mane Mahadēva avarige, ādre ammanige adē maneyalli jīvanaparyanta vāsa māḍuva hakku. Aivatteraḍu varṣa ā aṅgaḷa guḍisidavaru yāra dayeyallū irabāradu.'
    en: '(smiling) A meal can''t be written into an award, Mr Mahadeva — no court can enforce it. Let that stay in your hearts. I''ll write in the right of way. And I''ll add one point myself: the house goes to Mahadeva, but Amma has the right to live in that same house for the rest of her life. Someone who swept that yard for fifty-two years must not live at anyone''s mercy.'
  - who: mahadeva
    t: ಬರೀರಿ ಸಾರ್. ಆದ್ರೆ ಆ ಮನೆ ಅವ್ವನದು, ನಾನು ಅದರಲ್ಲಿ ವಾಸ ಮಾಡೋನು ಅಷ್ಟೇ ಅಂತ ನನಗೆ ಗೊತ್ತು.
    tr: Barīri sār. Ādre ā mane avvanadu, nānu adaralli vāsa māḍōnu aṣṭē anta nanage gottu.
    en: Write it, sir. But I know the house is Avva's, and I'm only the one who lives in it.
  - who: conciliator
    t: ಇನ್ನೊಂದು ಪ್ರಶ್ನೆ — ಇದು ಕಾನೂನಿನದ್ದಲ್ಲ. ಅಮ್ಮನಿಗೆ ಎಪ್ಪತ್ತು ವರ್ಷ. ನಾಳೆ ಆಸ್ಪತ್ರೆ ಖರ್ಚು ಬಂದ್ರೆ, ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ಹುಷಾರು ತಪ್ಪಿದ್ರೆ — ಯಾರು?
    tr: Innondu praśne — idu kānūninaddalla. Ammanige eppattu varṣa. Nāḷe āspatre kharcu bandre, rātri eraḍu gaṇṭege huṣāru tappidre — yāru?
    en: One more question — not a legal one. Amma is seventy. If tomorrow there are hospital bills, if she falls ill at two in the morning — who?
  - who: mahadeva
    t: ರಾತ್ರಿ ಎರಡು ಗಂಟೆ ನಂದು ಸಾರ್. ಅಪ್ಪನ್ನ ಕೊನೇ ರಾತ್ರಿ ಮದ್ದೂರು ಆಸ್ಪತ್ರೆಗೆ ಕರ್ಕೊಂಡು ಹೋಗಿದ್ದೂ ನಾನೇ. ಅವ್ವನ್ನೂ ನಾನೇ ನೋಡ್ಕೊಳ್ತೀನಿ.
    tr: Rātri eraḍu gaṇṭe nandu sār. Appanna konē rātri Maddūru āspatrege karkoṇḍu hōgiddū nānē. Avvannū nānē nōḍkoḷtīni.
    en: Two in the morning is mine, sir. It was I who took Appa to the hospital in Maddur that last night. I'll look after Avva too.
  - who: suresh
    t: ಆಸ್ಪತ್ರೆ ಖರ್ಚು ನಂದು ಸಾರ್. ಎಪ್ಪತ್ತು ದಾಟಿದೋರಿಗೆ ಸರ್ಕಾರದ ಆಯುಷ್ಮಾನ್ ಕಾರ್ಡ್ ಇದೆ — ಅದನ್ನ ಮಾಡಿಸ್ತೀನಿ. ಅದರಲ್ಲಿ ಬರದಿದ್ದನ್ನ ನಾನು ಕಟ್ತೀನಿ.
    tr: Āspatre kharcu nandu sār. Eppattu dāṭidōrige sarkārada Āyuṣmān kārḍ ide — adanna māḍistīni. Adaralli baradiddanna nānu kaṭtīni.
    en: The hospital bills are mine, sir. There's the government's Ayushman card for people over seventy — I'll get her one. Whatever it doesn't cover, I'll pay.
  - who: shobha
    t: ಮೂರು ತಿಂಗಳಿಗೊಮ್ಮೆ ಬಿಪಿ, ಶುಗರ್, ಮಂಡಿ — ಅದು ನನ್ನ ಕೆಲಸ ಸಾರ್. ನಾನು ನರ್ಸ್. ಅಪ್ಪನ ಬಿಪಿ ಯಾರೂ ಸರಿಯಾಗಿ ನೋಡ್ಲಿಲ್ಲ. ಅವ್ವನ ವಿಷಯದಲ್ಲಿ ಆ ತಪ್ಪು ಮತ್ತೆ ಆಗಲ್ಲ.
    tr: Mūru tiṅgaḷigomme bipi, śugar, maṇḍi — adu nanna kelasa sār. Nānu nars. Appana bipi yārū sariyāgi nōḍlilla. Avvana viṣayadalli ā tappu matte āgalla.
    en: Every three months her blood pressure, sugar, knees — that's my job, sir. I'm a nurse. Nobody kept a proper eye on Appa's blood pressure. With Avva, that mistake won't happen again.
  - who: conciliator
    t: ಇದನ್ನ ನಾನು ಬರೆಯಲ್ಲ — ಬರೆಯೋ ಅಗತ್ಯಾನೂ ಇಲ್ಲ. ನೀವು ಮೂವರೂ ಒಬ್ಬರ ಮುಂದೆ ಒಬ್ಬರು ಜೋರಾಗಿ ಹೇಳ್ಲಿ ಅಂತಾನೇ ಕೇಳಿದೆ. ಕಾಗದ ಮರೆತುಹೋಗುತ್ತೆ; ಎಲ್ಲರ ಮುಂದೆ ಕೊಟ್ಟ ಮಾತು ಮರೆಯಲ್ಲ.
    tr: Idanna nānu bareyalla — bareyō agatyānū illa. Nīvu mūvarū obbara munde obbaru jōrāgi hēḷli antānē kēḷide. Kāgada maretuhōgutte; ellara munde koṭṭa mātu mareyalla.
    en: I won't write this down — there's no need. I asked only so that the three of you would say it out loud, in front of one another. Paper gets forgotten; a promise made in front of everyone doesn't.
  - scene: An hour later. The typist has prepared the compromise petition. The conciliator reads out the main terms slowly, in formal Kannada.
  - who: conciliator
    t: '‘ಎಲ್ಲ ಪಕ್ಷಕಾರರು ಈ ಕೆಳಗಿನ ಷರತ್ತುಗಳಿಗೆ ಸ್ವಇಚ್ಛೆಯಿಂದ ಒಪ್ಪಿರುತ್ತಾರೆ. ಒಂದು: ಸರ್ವೆ ನಂಬರ್ ನೂರ ಹನ್ನೆರಡು, ಹಿಸ್ಸಾ ಎರಡರ ಮೂರು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆ ಜಮೀನು ಮತ್ತು ವಾಸದ ಮನೆ ಮೂರನೇ ಪ್ರತಿವಾದಿ ಮಹದೇವ ಅವರಿಗೆ ಸೇರತಕ್ಕದ್ದು. ಮೊದಲನೇ ಪ್ರತಿವಾದಿ ಪುಟ್ಟಮ್ಮ ಅವರಿಗೆ ಆ ಮನೆಯಲ್ಲಿ ಜೀವನಪರ್ಯಂತ ವಾಸಿಸುವ ಹಕ್ಕು ಇರತಕ್ಕದ್ದು. ಮೃತ ಚನ್ನೇಗೌಡರ ಹೆಸರಿನ ಸಹಕಾರ ಸಂಘದ ಬೆಳೆ ಸಾಲವನ್ನು ಮಹದೇವ ಅವರು ಪೂರ್ಣವಾಗಿ ತೀರಿಸಿರುತ್ತಾರೆ.’'
    tr: '‘Ella pakṣakāraru ī keḷagina ṣarattugaḷige svaiccheyinda oppiruttāre. Ondu: sarve nambar nūra hanneraḍu, hissā eraḍara mūru ekare ippattu guṇṭe jamīnu mattu vāsada mane mūranē prativādi Mahadēva avarige sēratakkaddu. Modalanē prativādi Puṭṭamma avarige ā maneyalli jīvanaparyanta vāsisuva hakku iratakkaddu. Mṛta Cannēgauḍara hesarina sahakāra saṅghada beḷe sālavannu Mahadēva avaru pūrṇavāgi tīrisiruttāre.’'
    en: '(reading) ''All the parties have freely agreed to the following terms. One: the land in survey number one hundred and twelve, hissa two, measuring three acres twenty guntas, together with the dwelling house, shall belong to the third defendant, Mahadeva. The first defendant, Puttamma, shall have the right to reside in that house for life. Mahadeva has fully repaid the cooperative society crop loan standing in the name of the late Channegowda.'''
  - who: conciliator
    t: '‘ಎರಡು: ಸರ್ವೆ ನಂಬರ್ ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದರ ಎರಡು ಎಕರೆ ಇಪ್ಪತ್ತು ಗುಂಟೆಯನ್ನು ಎರಡು ಸಮ ಭಾಗ ಮಾಡತಕ್ಕದ್ದು. ರಸ್ತೆ ಕಡೆಯ ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ ವಾದಿ ಶೋಭಾ ಅವರಿಗೆ ಸೇರತಕ್ಕದ್ದು; ಅವರು ತಮ್ಮ ಪಾಲನ್ನು ಪಡೆದಿರುತ್ತಾರೆ. ಆ ಭಾಗವನ್ನು ಅವರು ಮಾರಾಟ ಮಾಡುವುದಕ್ಕೆ ಉಳಿದ ಪಕ್ಷಕಾರರ ಯಾವುದೇ ಆಕ್ಷೇಪಣೆ ಇರುವುದಿಲ್ಲ.’'
    tr: '‘Eraḍu: sarve nambar embattēḷu, hissā ondara eraḍu ekare ippattu guṇṭeyannu eraḍu sama bhāga māḍatakkaddu. Raste kaḍeya ondu ekare hattu guṇṭe vādi Śōbhā avarige sēratakkaddu; avaru tamma pālannu paḍediruttāre. Ā bhāgavannu avaru mārāṭa māḍuvudakke uḷida pakṣakārara yāvudē ākṣēpaṇe iruvudilla.’'
    en: '''Two: the two acres twenty guntas in survey number eighty-seven, hissa one, shall be divided into two equal parts. The one acre ten guntas on the road side shall belong to the plaintiff, Shobha; she has received her share. The remaining parties shall have no objection whatsoever to her selling that portion.'''
  - who: conciliator
    t: '‘ಮೂರು: ಉಳಿದ ಒಂದು ಎಕರೆ ಹತ್ತು ಗುಂಟೆ — ಹುಣಸೆ ಮರ ಮತ್ತು ಸಮಾಧಿ ಇರುವ ಭಾಗ — ಪುಟ್ಟಮ್ಮ ಅವರಿಗೆ ಅವರ ಜೀವಿತಾವಧಿಯವರೆಗೆ ಸೇರತಕ್ಕದ್ದು. ಎರಡನೇ ಪ್ರತಿವಾದಿ ಸುರೇಶ ಅವರು ಇದಕ್ಕಾಗಿ ತಮ್ಮ ಪಾಲಿನ ಹಕ್ಕನ್ನು ಯಾವುದೇ ಪ್ರತಿಫಲವಿಲ್ಲದೆ ಬಿಟ್ಟುಕೊಟ್ಟಿರುತ್ತಾರೆ. ಪುಟ್ಟಮ್ಮ ಅವರ ನಂತರ ಆ ಭಾಗ ಮಹದೇವ ಅವರಿಗೆ ಸೇರತಕ್ಕದ್ದು. ಸಮಾಧಿಗೆ ಹೋಗಲು ಕುಟುಂಬದ ಎಲ್ಲರಿಗೂ ದಾರಿಯ ಹಕ್ಕು ಶಾಶ್ವತವಾಗಿ ಇರತಕ್ಕದ್ದು.’'
    tr: '‘Mūru: uḷida ondu ekare hattu guṇṭe — huṇase mara mattu samādhi iruva bhāga — Puṭṭamma avarige avara jīvitāvadhiyavarege sēratakkaddu. Eraḍanē prativādi Surēśa avaru idakkāgi tamma pālina hakkannu yāvudē pratiphalavillade biṭṭukoṭṭiruttāre. Puṭṭamma avara nantara ā bhāga Mahadēva avarige sēratakkaddu. Samādhige hōgalu kuṭumbada ellarigū dāriya hakku śāśvatavāgi iratakkaddu.’'
    en: '''Three: the remaining one acre ten guntas — the portion with the tamarind tree and the grave — shall belong to Puttamma for her lifetime. The second defendant, Suresha, has relinquished his share for this purpose without any consideration. After Puttamma, that portion shall go to Mahadeva. Every member of the family shall have a permanent right of way to the grave.'''
  - who: conciliator
    t: '‘ನಾಲ್ಕು: ದಿನಾಂಕ ಇಪ್ಪತ್ತು ಮೇ ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತಾರರ ಮಧ್ಯಂತರ ಆದೇಶವನ್ನು ತೆರವುಗೊಳಿಸಲಾಗಿದೆ. ದಾವೆಯನ್ನು ರಾಜಿಯಲ್ಲಿ ಇತ್ಯರ್ಥಪಡಿಸಲಾಗಿದೆ. ವಾದಿಯವರು ಪಾವತಿಸಿದ ನ್ಯಾಯಾಲಯ ಶುಲ್ಕವನ್ನು ನಿಯಮಾನುಸಾರ ಮರುಪಾವತಿ ಮಾಡತಕ್ಕದ್ದು.’ … ಒಪ್ಪಿಗೆ ಇದ್ರೆ ಎಲ್ಲರೂ ಸಹಿ ಹಾಕಿ. ಅಮ್ಮ, ನಿಮ್ಮ ಹೆಬ್ಬೆಟ್ಟು ಇಲ್ಲಿ.'
    tr: '‘Nālku: dināṅka ippattu Mē eraḍu sāvirada ippattārara madhyantara ādēśavannu teravugoḷisalāgide. Dāveyannu rājiyalli ityarthapaḍisalāgide. Vādiyavaru pāvatisida nyāyālaya śulkavannu niyamānusāra marupāvati māḍatakkaddu.’ … Oppige idre ellarū sahi hāki. Amma, nimma hebbeṭṭu illi.'
    en: '''Four: the interim order dated the twentieth of May, two thousand twenty-six, is vacated. The suit is disposed of by compromise. The court fee paid by the plaintiff shall be refunded according to the rules.'' … If you agree, everyone please sign. Amma, your thumbprint here.'
  - scene: One by one they sign. Avva presses her inked thumb beside her name and looks at the mark for a long time.
  - who: avva
    t: ಐವತ್ತೆರಡು ವರ್ಷದಲ್ಲಿ ಎಷ್ಟೋ ಕಾಗದಕ್ಕೆ ಹೆಬ್ಬೆಟ್ಟು ಒತ್ತಿದೀನಿ — ಸಾಲಕ್ಕೆ, ರೇಷನ್‌ಗೆ, ಸಮನ್ಸ್‌ಗೆ. ಖುಷಿಯಿಂದ ಒತ್ತಿದ್ದು ಇದೇ ಮೊದಲ ಸಲ.
    tr: Aivatteraḍu varṣadalli eṣṭō kāgadakke hebbeṭṭu ottidīni — sālakke, rēṣan-ge, samans-ge. Khuṣiyinda ottiddu idē modala sala.
    en: In fifty-two years I've pressed my thumb on so many papers — for loans, for rations, for the summons. This is the first time I've pressed it gladly.
  - who: shobha
    t: ವಕೀಲರೇ, ಕೋರ್ಟ್ ಶುಲ್ಕ ಎಷ್ಟು ವಾಪಸ್ ಬರುತ್ತೆ?
    tr: Vakīlarē, kōrṭ śulka eṣṭu vāpas barutte?
    en: Sir, how much of the court fee comes back?
  - who: lawyer
    t: ನೀವು ಜಂಟಿ ಸ್ವಾಧೀನ ಅಂತ ಹೇಳಿದ್ರಿಂದ ಕಟ್ಟಿದ್ದೇ ಕೆಲವು ನೂರು ರೂಪಾಯಿ, ಶೋಭಾ ಅವರೇ. ಅದು ವಾಪಸ್ ಬರುತ್ತೆ — ಸ್ವಲ್ಪ ಕಾಗದ ಕೆಲಸ, ಸ್ವಲ್ಪ ಕಾಯೋದು. ಜಾತ್ರೆಯಲ್ಲಿ ಜಿಲೇಬಿಗೆ ಸಾಕಾಗುತ್ತೆ. … ಆದ್ರೆ ಇವತ್ತು ವಾಪಸ್ ಬಂದಿದ್ದು ಶುಲ್ಕ ಮಾತ್ರ ಅಲ್ಲ, ಅಲ್ವಾ?
    tr: Nīvu jaṇṭi svādhīna anta hēḷidrinda kaṭṭiddē kelavu nūru rūpāyi, Śōbhā avarē. Adu vāpas barutte — svalpa kāgada kelasa, svalpa kāyōdu. Jātreyalli jilēbige sākāgutte. … Ādre ivattu vāpas bandiddu śulka mātra alla, alvā?
    en: Since you pleaded joint possession, you only paid a few hundred rupees, Ms Shobha. That comes back — a bit of paperwork, a bit of waiting. Enough for jilebi at the jatre. … But it isn't only the fee that came back today, is it?
  - who: shobha
    t: ಇಲ್ಲ ಸಾರ್. ನನ್ನ ತವರು ವಾಪಸ್ ಬಂತು.
    tr: Illa sār. Nanna tavaru vāpas bantu.
    en: No, sir. My parents' home came back to me.
  - who: lawyer
    t: ಮೇ ತಿಂಗಳಲ್ಲಿ ನಾನು ಹೇಳಿದ ಮಾತು ನೆನಪಿದೆಯಾ ಸುರೇಶ್ ಅವರೇ? ಅಣ್ಣ-ತಮ್ಮಂದಿರು ಮೊದಲ ದಿನ ಒಂದೇ ಕಾರಲ್ಲಿ, ಹತ್ತನೇ ಸಲ ಮುಖ ನೋಡಲ್ಲ ಅಂತ. ನಿಮ್ಮ ಮನೆಯವರು ಅದನ್ನ ಉಲ್ಟಾ ಮಾಡಿದ್ರಿ — ಮೊದಲ ದಿನ ಮೂರು ಮೂಲೆ, ಕೊನೆಯ ದಿನ ಒಂದೇ ಬೆಂಚು. ಇಪ್ಪತ್ತೆರಡು ವರ್ಷದಲ್ಲಿ ಇದು ಅಪರೂಪ.
    tr: Mē tiṅgaḷalli nānu hēḷida mātu nenapideyā Surēś avarē? Aṇṇa-tammandiru modala dina ondē kāralli, hattanē sala mukha nōḍalla anta. Nimma maneyavaru adanna ulṭā māḍidri — modala dina mūru mūle, koneya dina ondē beṇcu. Ippatteraḍu varṣadalli idu aparūpa.
    en: Do you remember what I told you in May, Mr Suresh? That brothers come in one car on the first day and won't look at each other by the tenth. Your family turned it upside down — three corners on the first day, one bench on the last. In twenty-two years, that's rare.
  - who: suresh
    t: ಆ ದಿನ ಕಾರಿಡಾರಲ್ಲಿ ಅವ್ವ ರೊಟ್ಟಿ ಹಂಚದಿದ್ರೆ, ಹತ್ತನೇ ಸಲಕ್ಕೆ ನಾವೂ ಒಬ್ಬರ ಮುಖ ಒಬ್ಬರು ನೋಡ್ತಿರ್ಲಿಲ್ಲ, ಸಾರ್.
    tr: Ā dina kāriḍāralli avva roṭṭi hañcadidre, hattanē salakke nāvū obbara mukha obbaru nōḍtirlilla, sār.
    en: If Avva hadn't shared out that rotti in the corridor that day, by the tenth time we wouldn't have been looking at each other's faces either, sir.
  - who: lawyer
    t: ಹಂಗಾದ್ರೆ ಇನ್ಮೇಲೆ ನನ್ನ ಕಕ್ಷಿದಾರರಿಗೆ ಒಂದೇ ಸಲಹೆ ಕೊಡ್ತೀನಿ — ಕಾಗದಪತ್ರದ ಜೊತೆ ಅಮ್ಮನನ್ನೂ, ಅಮ್ಮನ ರೊಟ್ಟಿಯನ್ನೂ ಕರ್ಕೊಂಡು ಬನ್ನಿ ಅಂತ.
    tr: Haṅgādre inmēle nanna kakṣidārarige ondē salahe koḍtīni — kāgadapatrada jote ammanannū, ammana roṭṭiyannū karkoṇḍu banni anta.
    en: Then from now on I'll give my clients just one piece of advice — bring your mother along with your documents, and her rottis too.
  - scene: Outside, on the court steps, in the winter sun. Mahadeva starts his motorbike, then switches it off again.
  - who: mahadeva
    t: ಶೋಭಾ, ಬಸ್ ಸ್ಟ್ಯಾಂಡ್‌ವರೆಗೆ ಬೈಕಲ್ಲಿ ಬಿಡ್ತೀನಿ. ಹತ್ತು.
    tr: Śōbhā, bas sṭyāṇḍ-varege baikalli biḍtīni. Hattu.
    en: Shobha, I'll drop you at the bus stand on the bike. Get on.
  - who: shobha
    t: ಮಾರ್ಚ್‌ನಲ್ಲಿ ಪಂಚಾಯ್ತಿಯಲ್ಲಿ ಹೇಳಿದ್ದೆ — ‘ಊರಲ್ಲೇ ಇದ್ದಿದ್ರೆ ಆ ಬೈಕ್ ಹಿಂದೆ ನಾನೂ ಕೂತಿರ್ತಿದ್ದೆ’ ಅಂತ. ಈಗ ಕೂರ್ತಿದೀನಿ. ನಿಧಾನವಾಗಿ ಓಡಿಸು.
    tr: Mārc-nalli pan̄cāytiyalli hēḷidde — ‘ūrallē iddidre ā baik hinde nānū kūtirtidde’ anta. Īga kūrtidīni. Nidhānavāgi ōḍisu.
    en: In March, at the panchayati, I said, 'If I'd stayed in the village, I'd have been on the back of that bike too.' Now I'm getting on. Ride slowly.
  - who: mahadeva
    t: ಅಪ್ಪನ್ನ ಕೂರಿಸ್ಕೊಂಡು ಹೋಗ್ತಿದ್ದ ಹಾಗೇ ಓಡಿಸ್ತೀನಿ. ಹುಷಾರಾಗಿ.
    tr: Appanna kūriskoṇḍu hōgtidda hāgē ōḍistīni. Huṣārāgi.
    en: I'll ride the way I used to with Appa on the back. Carefully.
  - who: avva
    t: ಸಂಕ್ರಾಂತಿಗೆ ಬರ್ತೀಯಲ್ಲ ಕಣವ್ವ? ನಿಮ್ಮಪ್ಪ ಕೊನೆ ದಿನ ಕೇಳಿದ್ದು ಅದೇ — ‘ಶೋಭಾ ಸಂಕ್ರಾಂತಿಗೆ ಬರ್ತಾಳಾ?’ ಅಂತ.
    tr: Saṅkrāntige bartīyalla kaṇavva? Nimmappa kone dina kēḷiddu adē — ‘Śōbhā Saṅkrāntige bartāḷā?’ anta.
    en: You'll come for Sankranti, won't you, girl? That's the very thing your father asked on his last day — 'Will Shobha come for Sankranti?'
  - who: shobha
    t: ಬರ್ತೀನಿ ಅವ್ವ. ಎಳ್ಳು-ಬೆಲ್ಲ ನಾನೇ ಮಾಡ್ಕೊಂಡು ತರ್ತೀನಿ — ಅಪ್ಪನಿಗೆ ಇಷ್ಟ ಆಗ್ತಿದ್ದ ಹಾಗೆ, ಕೊಬ್ಬರಿ ಜಾಸ್ತಿ.
    tr: Bartīni avva. Eḷḷu-bella nānē māḍkoṇḍu tartīni — appanige iṣṭa āgtidda hāge, kobbari jāsti.
    en: I'll come, Avva. I'll make the ellu-bella myself and bring it — the way Appa liked it, with extra copra.
  - scene: That evening, Bettahalli. In the front hall Mahadeva props the certified copy of the award against Thatha's photograph, beside the society's no-dues certificate. Avva sits on the floor by the lamp.
  - who: mahadeva
    t: ಅಪ್ಪ, ನೋಡು. ಈ ಕಡೆ ಸಂಘದ ಬೇಬಾಕಿ ಪ್ರಮಾಣಪತ್ರ, ಆ ಕಡೆ ಅದಾಲತ್ತಿನ ಐತೀರ್ಪು. ನಿನ್ನ ಸಾಲಾನೂ ತೀರ್ತು, ನಿನ್ನ ಮಕ್ಕಳ ಜಗಳಾನೂ ತೀರ್ತು.
    tr: Appa, nōḍu. Ī kaḍe saṅghada bēbāki pramāṇapatra, ā kaḍe adālattina aitīrpu. Ninna sālānū tīrtu, ninna makkaḷa jagaḷānū tīrtu.
    en: Look, Appa. On this side, the society's no-dues certificate; on that side, the Adalat's award. Your loan is settled, and so is your children's quarrel.
  - who: avva
    t: ಕಾಗದಾನ ಅಪ್ಪನ ಮುಂದೆ ಇಟ್ಟೆ. ಈಗ ನಿನ್ನ ಮನಸ್ಸನ್ನ ನನ್ನ ಮುಂದೆ ಇಡು. ಸಹಿ ಹಾಕುವಾಗ ನಿನ್ನ ಕೈ ನಡುಗ್ತಿತ್ತು, ನಾನು ನೋಡ್ದೆ.
    tr: Kāgadāna appana munde iṭṭe. Īga ninna manassanna nanna munde iḍu. Sahi hākuvāga ninna kai naḍugtittu, nānu nōḍde.
    en: You've put the paper before your father. Now put your heart before me. When you signed, your hand was trembling — I saw it.
  - who: mahadeva
    t: ನಡುಗ್ತಿತ್ತು, ಅವ್ವ. ಇಪ್ಪತ್ತು ವರ್ಷ ‘ಉಳಿದವನು ನಾನು’ ಅಂತ ಹೇಳ್ಕೊಂಡೇ ಬದುಕಿದೆ. ಇವತ್ತು ಗದ್ದೆ ಕಾಗದದ ಮೇಲೂ ನಂದಾಯ್ತು. ಆದ್ರೆ ಅದಕ್ಕೋಸ್ಕರ ಅಣ್ಣ ತನ್ನ ಪಾಲು ಬಿಟ್ಟ, ತಂಗಿ ಕಡಿಮೆಗೆ ಒಪ್ಕೊಂಡ್ಲು. ಈ ಋಣ ಹೆಂಗೆ ತೀರಿಸ್ಲಿ?
    tr: Naḍugtittu, avva. Ippattu varṣa ‘uḷidavanu nānu’ anta hēḷkoṇḍē badukide. Ivattu gadde kāgadada mēlū nandāytu. Ādre adakkōskara aṇṇa tanna pālu biṭṭa, taṅgi kaḍimege opkoṇḍlu. Ī ṛṇa heṅge tīrisli?
    en: It was trembling, Avva. For twenty years I lived telling myself 'I'm the one who stayed'. Today the wet land became mine on paper too. But for that, my brother gave up his share and my sister settled for less. How do I repay a debt like that?
  - who: avva
    t: ಕೆಲವು ಋಣ ತೀರಿಸೋಕಲ್ಲ ಮಗ, ಹೊರೋಕೆ. ನಿಮ್ಮಪ್ಪ ಇಡೀ ಊರಿನ ಋಣ ಹೊತ್ಕೊಂಡೇ ಬದುಕಿದ್ರು. ಗದ್ದೆಯ ಬೆಳೆ ನಿಂದು; ಈ ಋಣ ಮೂವರದ್ದು. ಪ್ರತಿ ಹಬ್ಬಕ್ಕೂ ಅವರಿಬ್ರಿಗೂ ಬಾಗಿಲು ತೆಗೆದಿಡು. ಅದೇ ಬಡ್ಡಿ.
    tr: Kelavu ṛṇa tīrisōkalla maga, horōke. Nimmappa iḍī ūrina ṛṇa hotkoṇḍē badukidru. Gaddeya beḷe nindu; ī ṛṇa mūvaraddu. Prati habbakkū avaribrigū bāgilu tegediḍu. Adē baḍḍi.
    en: Some debts aren't for repaying, son — they're for carrying. Your father lived his whole life carrying what he owed the village. The crop from the wet land is yours; this debt belongs to all three of you. Keep the door open for those two at every festival. That's the interest.
  - who: mahadeva
    t: ಬಾಗಿಲು ಮಾತ್ರ ಅಲ್ಲ, ಅವ್ವ. ಶೋಭ ಮೈಸೂರಲ್ಲಿ ಮನೆ ತಗೊಂಡಾಗ, ಗೃಹಪ್ರವೇಶದ ದಿನ ಉಕ್ಕಿಸೋ ಹಾಲು ನಮ್ಮ ಗೌರಿಯದ್ದೇ ಆಗ್ಬೇಕು. ಅದನ್ನ ನಾನೇ ಬೈಕಲ್ಲಿ ತಗೊಂಡು ಹೋಗ್ತೀನಿ.
    tr: Bāgilu mātra alla, avva. Śōbha Maisūralli mane tagoṇḍāga, gṛhapravēśada dina ukkisō hālu namma Gauriyaddē āgbēku. Adanna nānē baikalli tagoṇḍu hōgtīni.
    en: Not just the door, Avva. When Shobha gets her house in Mysuru, the milk that boils over on the housewarming day has to be our Gauri's. I'll take it there myself on the bike.
  - section: Stones and papers
    learn: 'after the award: aitīrpina dṛḍhīkṛta prati, vibhāga patra nōndaṇi, Kāvēri tantrāṁśa, i-sṭāmp, mudrāṅka śulka · the survey: hannondu-i nakṣe, pōḍi, hissā, gaḍi kallu, Mōjiṇi, guṇṭe = mūvattamūru aḍi × mūvattamūru aḍi · mutation: khāte badalāvaṇe, tiḷuvaḷike patra, ākṣēpaṇe avadhi · honesty: rasīdi illada kharcu bēḍa'
  - scene: Tuesday, 29 December 2026. The dry field, survey 87. A surveyor from the land records office is stretching a measuring chain across the stubble of the harvested ragi; Siddaraju, the Village Accountant, stands by with a file under his arm. The family watches from the bund. Ningegowda, the neighbour, waits by his own field with his son.
  - who: va
    t: ನಮಸ್ಕಾರ ಅಮ್ಮ. ಜನವರಿಯಲ್ಲಿ ನಿಮ್ಮ ಮನೆಯವರು ನನ್ನ ಕೊಠಡಿಯಲ್ಲಿ ಜಗಳ ಆಡಿದ್ರು. ಇವತ್ತು ಎಲ್ಲರೂ ಒಂದೇ ಬದುವಿನ ಮೇಲೆ ನಿಂತಿದೀರಿ. ಸರ್ಕಾರಿ ಕೆಲಸದಲ್ಲಿ ಇಂಥ ದಿನ ಅಪರೂಪ.
    tr: Namaskāra amma. Janavariyalli nimma maneyavaru nanna koṭhaḍiyalli jagaḷa āḍidru. Ivattu ellarū ondē baduvina mēle nintidīri. Sarkāri kelasadalli intha dina aparūpa.
    en: Namaskara, Amma. In January your family quarrelled in my office. Today you're all standing on the same bund. Days like this are rare in government work.
  - who: suresh
    t: ಸಿದ್ದರಾಜು ಅವರೇ, ಮುಂದಿನ ಹೆಜ್ಜೆಗಳು ಏನು? ನಾಗೇಂದ್ರ ಅವರು ಐತೀರ್ಪಿನ ದೃಢೀಕೃತ ಪ್ರತಿ ಕೊಟ್ಟಿದಾರೆ. ಜೊತೆಗೆ ಸಬ್-ರಿಜಿಸ್ಟ್ರಾರ್ ಕಚೇರಿಯಲ್ಲಿ ವಿಭಾಗ ಪತ್ರಾನೂ ನೋಂದಣಿ ಮಾಡಿಸಿ ಅಂದಿದಾರೆ — ಮುಂದೆ ಬ್ಯಾಂಕ್ ಸಾಲಕ್ಕೋ ಮಾರಾಟಕ್ಕೋ ಯಾವ ತಕರಾರೂ ಬರಬಾರದು ಅಂತ.
    tr: Siddarāju avarē, mundina hejjegaḷu ēnu? Nāgēndra avaru aitīrpina dṛḍhīkṛta prati koṭṭidāre. Jotege sab-rijisṭrār kacēriyalli vibhāga patrānū nōndaṇi māḍisi andidāre — munde byāṅk sālakkō mārāṭakkō yāva takarārū barabāradu anta.
    en: Mr Siddaraju, what are the next steps? Nagendra has given us the certified copy of the award. He's also advised us to register a partition deed at the Sub-Registrar's office — so that no objection crops up later over a bank loan or the sale.
  - who: va
    t: 'ಸರಿಯಾದ ಸಲಹೆ. ಕ್ರಮ ಹೀಗೆ: ಮೊದಲು ಈ ಅಳತೆ. ಸರ್ವೇಯರ್ ಹನ್ನೊಂದು-ಇ ನಕ್ಷೆ ಮಾಡ್ತಾರೆ — ಅದಿಲ್ಲದೆ ಸರ್ವೆ ನಂಬರಿನ ಒಂದು ಭಾಗಕ್ಕೆ ನೋಂದಣಿ ಆಗಲ್ಲ. ಆಮೇಲೆ ವಿಭಾಗ ಪತ್ರ — ಕಾವೇರಿ ತಂತ್ರಾಂಶದಲ್ಲಿ, ಇ-ಸ್ಟಾಂಪ್ ಮೂಲಕ. ಮುದ್ರಾಂಕ ಶುಲ್ಕ ಪ್ರತಿ ಪಾಲಿಗೆ ಒಂದು ಸಣ್ಣ ನಿಗದಿತ ಮೊತ್ತ; ನೋಂದಣಿ ಶುಲ್ಕ, ವಕೀಲರ ಫೀಸೇ ದೊಡ್ಡದು. ಆಮೇಲೆ ಮೋಜಿಣಿಯಲ್ಲಿ ಪೋಡಿ — ಎಂಬತ್ತೇಳು, ಹಿಸ್ಸಾ ಒಂದು ಎರಡು ತುಂಡಾಗಿ, ಒಂದು-ಎ, ಒಂದು-ಬಿ ಅಂತ ಹೊಸ ಹಿಸ್ಸಾ ನಂಬರ್. ಕೊನೆಗೆ ನನ್ನ ಕಡೆ ಖಾತೆ ಬದಲಾವಣೆ — ಎಲ್ಲರಿಗೂ ತಿಳುವಳಿಕೆ ಪತ್ರ, ಆಕ್ಷೇಪಣೆ ಅವಧಿ ಮುಗಿದ ಮೇಲೆ ಹೊಸ ಪಹಣಿ.'
    tr: 'Sariyāda salahe. Krama hīge: modalu ī aḷate. Sarvēyar hannondu-i nakṣe māḍtāre — adillade sarve nambarina ondu bhāgakke nōndaṇi āgalla. Āmēle vibhāga patra — Kāvēri tantrāṁśadalli, i-sṭāmp mūlaka. Mudrāṅka śulka prati pālige ondu saṇṇa nigadita motta; nōndaṇi śulka, vakīlara phīsē doḍḍadu. Āmēle Mōjiṇiyalli pōḍi — embattēḷu, hissā ondu eraḍu tuṇḍāgi, ondu-e, ondu-bi anta hosa hissā nambar. Konege nanna kaḍe khāte badalāvaṇe — ellarigū tiḷuvaḷike patra, ākṣēpaṇe avadhi mugida mēle hosa pahaṇi.'
    en: 'Sound advice. The order is this: first, this measurement. The surveyor draws the 11E sketch — without it, part of a survey number can''t be registered. Then the partition deed — on the Kaveri software, with an e-stamp. The stamp duty is a small fixed amount per share; the registration fee and the lawyer''s fee are the bigger costs. Then the podi through Mojini — eighty-seven, hissa one, splits in two, with new hissa numbers one-A and one-B. Finally, on my side, the mutation — a notice to everyone, and once the objection period is over, the new RTC.'
  - who: rakshith
    t: ಸಿದ್ದರಾಜು ಅವರೇ, ನಲವತ್ತು ಗುಂಟೆ ಒಂದು ಎಕರೆ ಅಂತ ಚಿಕ್ಕಪ್ಪ ಡಿಸೆಂಬರಲ್ಲೇ ಹೇಳಿದ್ರು. ಆದ್ರೆ ನೆಲದ ಮೇಲೆ ಒಂದು ಗುಂಟೆ ಎಷ್ಟು ಉದ್ದ, ಎಷ್ಟು ಅಗಲ? ಕಣ್ಣಿಗೆ ಕಾಣೋ ಹಾಗೆ ಹೇಳಿ.
    tr: Siddarāju avarē, nalavattu guṇṭe ondu ekare anta cikkappa ḍisembarallē hēḷidru. Ādre nelada mēle ondu guṇṭe eṣṭu udda, eṣṭu agala? Kaṇṇige kāṇō hāge hēḷi.
    en: Mr Siddaraju, Chikkappa told me back in December that forty guntas make an acre. But on the ground, how long and how wide is one gunta? Tell me so I can see it.
  - who: va
    t: ಒಂದು ಗುಂಟೆ ಅಂದ್ರೆ ಮೂವತ್ತಮೂರು ಅಡಿ ಉದ್ದ, ಮೂವತ್ತಮೂರು ಅಡಿ ಅಗಲ — ಸಾವಿರದ ಎಂಬತ್ತೊಂಬತ್ತು ಚದರ ಅಡಿ. ಆ ಸರ್ವೇಯರ್ ಹಿಡಿದಿರೋ ಸರಪಳಿ ನೋಡಿ — ಅದು ಒಂದು ಗುಂಟೆಯ ಒಂದು ಬದಿಯಷ್ಟೇ ಉದ್ದ. ಹಂಗೆ ನಾಲ್ಕು ಬದಿ ಎಳೆದ್ರೆ ಒಂದು ಗುಂಟೆ.
    tr: Ondu guṇṭe andre mūvattamūru aḍi udda, mūvattamūru aḍi agala — sāvirada embattombattu cadara aḍi. Ā sarvēyar hiḍidirō sarapaḷi nōḍi — adu ondu guṇṭeya ondu badiyaṣṭē udda. Haṅge nālku badi eḷedre ondu guṇṭe.
    en: A gunta is thirty-three feet long and thirty-three feet wide — one thousand and eighty-nine square feet. Look at the chain the surveyor's holding — it's exactly as long as one side of a gunta. Stretch it out like that on four sides and you have one gunta.
  - who: avva
    t: ಆ ಹುಣಸೆ ಮರ ನನ್ನ ಭಾಗದಲ್ಲೇ ಬರ್ಬೇಕು ಸ್ವಾಮಿ. ಸರಪಳಿ ಎಳೆಯೋವಾಗ ಮರದ ಬೇರು ಕೂಡ ಆ ಕಡೆ ಹೋಗಬಾರದು.
    tr: Ā huṇase mara nanna bhāgadallē barbēku svāmi. Sarapaḷi eḷeyōvāga marada bēru kūḍa ā kaḍe hōgabāradu.
    en: That tamarind tree must fall in my part, sir. When they stretch the chain, not even a root of it should go to the other side.
  - who: va
    t: ಹೆದರಬೇಡಿ ಅಮ್ಮ. ಮರದಿಂದ ಇಪ್ಪತ್ತು ಅಡಿ ಆಚೆ ಗಡಿ ಕಲ್ಲು ನೆಡೋಣ ಅಂತ ಎರಡೂ ಕಡೆಯವರು ಒಪ್ಪಿದಾರೆ. ಬೇರಿಗೆ ಗಡಿ ಗೊತ್ತಾಗಲ್ಲ, ಆದ್ರೆ ಕಾಗದಕ್ಕೆ ಗೊತ್ತಾಗುತ್ತೆ.
    tr: Hedarabēḍi amma. Maradinda ippattu aḍi āce gaḍi kallu neḍōṇa anta eraḍū kaḍeyavaru oppidāre. Bērige gaḍi gottāgalla, ādre kāgadakke gottāgutte.
    en: Don't worry, Amma. Both sides have agreed to set the boundary stone twenty feet beyond the tree. Roots don't know about boundaries, but paper does.
  - who: shobha
    t: ಇದು ಈಗ ನನ್ನ ಪಾಲು. ಮೂವತ್ತೇಳು ವರ್ಷದಲ್ಲಿ ಒಂದು ದಿನಾನೂ ಇಲ್ಲಿ ನೇಗಿಲು ಹಿಡಿದಿಲ್ಲ, ಅವ್ವ.
    tr: Idu īga nanna pālu. Mūvattēḷu varṣadalli ondu dinānū illi nēgilu hiḍidilla, avva.
    en: (picking up a handful of soil on the roadside portion) This is my share now. In thirty-seven years I've never once held a plough here, Avva.
  - who: avva
    t: ನಿಮ್ಮಪ್ಪ ಈ ಹೊಲ ತಗೊಂಡ ವರ್ಷ ಸುರೇಶ ಇನ್ನೂ ತೊಟ್ಟಿಲಲ್ಲಿದ್ದ. ಕೂಡಿಟ್ಟ ದುಡ್ಡು ಸಾಲ್ಲಿಲ್ಲ ಅಂತ ತಾಳಿ ಬಿಟ್ಟು ನನ್ನ ಒಡವೆ ಎಲ್ಲಾ ಮಾರಿದ್ವಿ. ಈ ಮಣ್ಣಲ್ಲಿ ನನ್ನ ಓಲೆನೂ ಇದೆ, ನನ್ನ ಬಳೆನೂ ಇದೆ.
    tr: Nimmappa ī hola tagoṇḍa varṣa Surēśa innū toṭṭilallidda. Kūḍiṭṭa duḍḍu sāllilla anta tāḷi biṭṭu nanna oḍave ellā māridvi. Ī maṇṇalli nanna ōlenū ide, nanna baḷenū ide.
    en: The year your father bought this field, Suresha was still in the cradle. Our savings weren't enough, so we sold all my jewellery except my mangalsutra. My earrings are in this soil, and my bangles too.
  - who: shobha
    t: ಅಂದ್ರೆ ನಾನು ನಿನ್ನ ಒಡವೆನ ಮಾರ್ತಿದೀನಿ… ಅದಕ್ಕೇ ಕೈ ಭಾರ ಆಗ್ತಿದೆ, ಅವ್ವ.
    tr: Andre nānu ninna oḍavena mārtidīni… Adakkē kai bhāra āgtide, avva.
    en: So I'm selling your jewellery… That's why my hand feels so heavy, Avva.
  - who: avva
    t: ಒಡವೆ ಮಣ್ಣಾಯ್ತು, ಈಗ ಆ ಮಣ್ಣು ನನ್ನ ಮಗಳಿಗೆ ಮನೆ ಆಗ್ತಿದೆ. ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಲೆಕ್ಕ ಎಲ್ಲಿದೆ ಕಣೇ? ಮಾರು. ಆದ್ರೆ ಆ ಮನೆ ಅಂಗಳದಲ್ಲಿ ಒಂದು ತುಳಸಿ ನೆಡು.
    tr: Oḍave maṇṇāytu, īga ā maṇṇu nanna magaḷige mane āgtide. Idakkinta oḷḷe lekka ellide kaṇē? Māru. Ādre ā mane aṅgaḷadalli ondu tuḷasi neḍu.
    en: The jewellery became soil, and now that soil is becoming a house for my daughter. What better account could there be, girl? Sell it. But plant a tulasi in that house's yard.
  - who: shobha
    t: ಸಿದ್ದರಾಜು ಅವರೇ, ಹೊಸ ಪಹಣಿ ಯಾವಾಗ ಬರುತ್ತೆ? ನಿಂಗೇಗೌಡರ ಜೊತೆ ಕ್ರಯಪತ್ರ ಮಾಡೋಕೆ ಅದು ಬೇಕಲ್ಲ.
    tr: Siddarāju avarē, hosa pahaṇi yāvāga barutte? Niṅgēgauḍara jote krayapatra māḍōke adu bēkalla.
    en: Mr Siddaraju, when will the new RTC come? I'll need it to do the sale deed with Ningegowda.
  - who: va
    t: ನಿಜ ಹೇಳ್ತೀನಿ ಮೇಡಂ — ಪೋಡಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಎರಡು-ಮೂರು ತಿಂಗಳು ಹಿಡಿಯುತ್ತೆ. ಸರ್ವೇಯರ್‌ಗಳು ಕಮ್ಮಿ, ಅರ್ಜಿ ಜಾಸ್ತಿ. ಸರ್ವರ್ ಕೈಕೊಟ್ರೆ ಇನ್ನೂ ತಡ. ಆದ್ರೆ ಯಾರಾದ್ರೂ ‘ಬೇಗ ಮಾಡಿಸ್ಕೊಡ್ತೀನಿ, ಸ್ವಲ್ಪ ಖರ್ಚಾಗುತ್ತೆ’ ಅಂದ್ರೆ, ‘ರಸೀದಿ ಇಲ್ಲದ ಖರ್ಚು ಬೇಡ’ ಅಂತ ಹೇಳಿ ನನ್ನ ಹತ್ರ ಬನ್ನಿ.
    tr: Nija hēḷtīni mēḍam — pōḍige sāmānyavāgi eraḍu-mūru tiṅgaḷu hiḍiyutte. Sarvēyargaḷu kammi, arji jāsti. Sarvar kaikoṭre innū taḍa. Ādre yārādrū ‘bēga māḍiskoḍtīni, svalpa kharcāgutte’ andre, ‘rasīdi illada kharcu bēḍa’ anta hēḷi nanna hatra banni.
    en: I'll be honest, madam — a podi usually takes two or three months. Few surveyors, lots of applications. If the server lets us down, longer still. But if anyone says, 'I'll get it done fast, it'll cost a little', tell them 'no expense without a receipt' and come to me.
  - who: mahadeva
    t: ಸಾರ್, ಮನೆಗೆ ಬನ್ನಿ, ಕಾಫಿ ಕುಡಿದು ಹೋಗಿ. ಜನವರಿಯಲ್ಲಿ ನಿಮ್ಮ ಕೊಠಡಿಯಲ್ಲಿ ನಾನು ಜೋರಾಗಿ ಮಾತಾಡಿದ್ದೆ. ಕ್ಷಮಿಸಿ.
    tr: Sār, manege banni, kāphi kuḍidu hōgi. Janavariyalli nimma koṭhaḍiyalli nānu jōrāgi mātāḍidde. Kṣamisi.
    en: Sir, come to the house and have some coffee before you go. In January I raised my voice in your office. Forgive me.
  - who: va
    t: ಕಾಫಿ ಕುಡೀತೀನಿ, ಕ್ಷಮೆ ಬೇಡ. ನನ್ನ ಕೊಠಡಿಯಲ್ಲಿ ದಿನಕ್ಕೆ ಹತ್ತು ಜನ ಜೋರಾಗಿ ಮಾತಾಡ್ತಾರೆ, ಮಹದೇವ ಅವರೇ. ಎಲ್ಲರಿಗೂ ಭೂಮಿಯ ಬಗ್ಗೆ ಭಯ. ನಿಮ್ಮ ಮನೆಯಲ್ಲಿ ಆ ಭಯ ಹೋಯ್ತು — ಅಷ್ಟೇ ಸಾಕು.
    tr: Kāphi kuḍītīni, kṣame bēḍa. Nanna koṭhaḍiyalli dinakke hattu jana jōrāgi mātāḍtāre, Mahadēva avarē. Ellarigū bhūmiya bagge bhaya. Nimma maneyalli ā bhaya hōytu — aṣṭē sāku.
    en: I'll have the coffee; no need for forgiveness. Ten people a day raise their voices in my office, Mr Mahadeva. Everyone is afraid about land. In your house that fear has gone — that's enough.
  - chapter: Chapter 10 — Sankranti
  - section: Sesame and jaggery
    learn: 'Sankranti words: eḷḷu-bella, huride eḷḷu, kaḍlebīja, hurigaḍale, kobbari, sakkare accu, ālemane · the formula: eḷḷu-bella tindu oḷḷe mātāḍi · a long-awaited apology: … biṭṭiddu nānu, adu tappu, kṣamisu · proverb-like wisdom: sihi sumne baralla · habitual past: prati Saṅkrāntige … māḍtidru'
  - scene: Sankranti, mid-January 2027. The year of mourning is over, and for the first time since Thatha's death the house in Bettahalli keeps a festival. A rangoli covers the swept yard; two cane stalks are tied at the door. Avva wears the pale cotton sari from the jatre. Shobha came on the last bus last night with a steel box. Thatha's garlanded photograph watches from the hall.
  - who: shobha
    t: ಅವ್ವ, ಎಳ್ಳು-ಬೆಲ್ಲ ನೋಡು — ಹುರಿದ ಎಳ್ಳು, ಕಡ್ಲೆಬೀಜ, ಹುರಿಗಡಲೆ, ಕೊಬ್ಬರಿ, ಬೆಲ್ಲದ ಚೂರು. ಕೊಬ್ಬರಿ ಜಾಸ್ತಿ — ಅಪ್ಪನಿಗೆ ಇಷ್ಟ ಆಗ್ತಿದ್ದ ಹಾಗೆ. ಸಕ್ಕರೆ ಅಚ್ಚು ಮೈಸೂರಿಂದ ತಂದೆ.
    tr: Avva, eḷḷu-bella nōḍu — huride eḷḷu, kaḍlebīja, hurigaḍale, kobbari, bellada cūru. Kobbari jāsti — appanige iṣṭa āgtidda hāge. Sakkare accu Maisūrinda tande.
    en: Avva, look at the ellu-bella — roasted sesame, groundnuts, fried gram, copra, bits of jaggery. Extra copra — the way Appa liked it. I brought the sugar figurines from Mysuru.
  - who: avva
    t: ಬೆಲ್ಲ ಎಲ್ಲಿಂದು ಕಣವ್ವ? ಘಮ ಬೇರೆ ಇದೆ.
    tr: Bella ellindu kaṇavva? Ghama bēre ide.
    en: Where's the jaggery from, girl? It smells different.
  - who: mahadeva
    t: ಆ ಬೆಲ್ಲ ನಮ್ಮ ಗದ್ದೆಯದು, ಅವ್ವ. ಯಂತ್ರ ಬಿಟ್ಟು ಹೋಗಿದ್ದ ಬದುವಿನ ಎರಡು ಸಾಲು ಕಬ್ಬನ್ನ ಕೈಯಲ್ಲಿ ಕಡಿದು ಪಕ್ಕದೂರಿನ ಆಲೆಮನೆಗೆ ಕೊಟ್ಟಿದ್ದೆ. ಆಲೆಮನೆಗಳೂ ಈಗ ಕಮ್ಮಿ ಆಗ್ತಿವೆ — ಆಳು ಸಿಗಲ್ಲ, ಖರ್ಚು ಜಾಸ್ತಿ. ಅಲ್ಲಿ ಮಾಡಿದ ಹತ್ತು ಕೆಜಿ ಬೆಲ್ಲದಲ್ಲಿ ಒಂದು ಕೆಜಿ ಶೋಭಂಗೆ ಕಳಿಸಿದ್ದೆ.
    tr: Ā bella namma gaddeyadu, avva. Yantra biṭṭu hōgidda baduvina eraḍu sālu kabbanna kaiyalli kaḍidu pakkadūrina ālemanege koṭṭidde. Ālemanegaḷū īga kammi āgtive — āḷu sigalla, kharcu jāsti. Alli māḍida hattu keji belladalli ondu keji Śōbhaṅge kaḷisidde.
    en: That jaggery is from our own wet land, Avva. The machine had left two rows of cane along the bund; I cut them by hand and gave them to the jaggery unit in the next village. Those units are dwindling too — no labour, high costs. Of the ten kilos of jaggery they made, I'd sent one kilo to Shobha.
  - who: avva
    t: ಮೊದಲ ಅಚ್ಚು ಅಮ್ಮನಿಗೆ ಕೊಟ್ಯಾ ಮಹದೇವ? ಪೂಜಾರಿಗಳು ಹೇಳಿದ್ರಲ್ಲ.
    tr: Modala accu ammanige koṭyā Mahadēva? Pūjārigaḷu hēḷidralla.
    en: Did you give the first block to the Goddess, Mahadeva? As the priest said?
  - who: mahadeva
    t: ಕೊಟ್ಟೆ ಅವ್ವ. ರಾಗಿಯ ಮೊದಲ ತೆನೆ, ಬೆಲ್ಲದ ಮೊದಲ ಅಚ್ಚು — ಎರಡೂ. ಅಪ್ಪನ ನಲವತ್ತು ವರ್ಷದ ಲೆಕ್ಕ ತಪ್ಪಲಿಲ್ಲ.
    tr: Koṭṭe avva. Rāgiya modala tene, bellada modala accu — eraḍū. Appana nalavattu varṣada lekka tappalilla.
    en: I did, Avva. The first ear of ragi and the first block of jaggery — both. Appa's forty-year record wasn't broken.
  - who: rakshith
    t: ಅತ್ತೆ, ‘ಎಳ್ಳು ಬೀರೋದು’ ಅಂದ್ರೆ ಏನು? ಅಮ್ಮ ಬೆಂಗಳೂರಲ್ಲಿ ಅಪಾರ್ಟ್‌ಮೆಂಟ್‌ನಲ್ಲಿ ಡಬ್ಬಿಗಳಲ್ಲಿ ಹಂಚ್ತಾಳೆ, ಆದ್ರೆ ಅದರ ಹೆಸರು ನನಗೆ ಗೊತ್ತಿರಲಿಲ್ಲ.
    tr: Atte, ‘eḷḷu bīrōdu’ andre ēnu? Amma Beṅgaḷūralli apārṭmeṇṭ-nalli ḍabbigaḷalli han̄ctāḷe, ādre adara hesaru nanage gottiralilla.
    en: Atte, what does 'ellu beerodu' mean? Amma hands it out in little boxes in our apartment block in Bengaluru, but I never knew what it was called.
  - who: shobha
    t: ಇದೇ — ಎಳ್ಳು ಬೀರೋದು. ಸಂಜೆ ಹೆಣ್ಣುಮಕ್ಕಳು, ಮಕ್ಕಳು ಹೊಸ ಬಟ್ಟೆ ಹಾಕ್ಕೊಂಡು ಮನೆ ಮನೆಗೆ ಹೋಗಿ ಎಳ್ಳು-ಬೆಲ್ಲ, ಸಕ್ಕರೆ ಅಚ್ಚು, ಒಂದು ಬಾಳೆಹಣ್ಣು, ಒಂದು ಕಬ್ಬಿನ ತುಂಡು ಕೊಡ್ತಾರೆ. ಕೊಡೋವಾಗ ಒಂದು ಮಾತು ಹೇಳ್ಬೇಕು — ‘ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡಿ.’
    tr: Idē — eḷḷu bīrōdu. Sañje heṇṇumakkaḷu, makkaḷu hosa baṭṭe hākkoṇḍu mane manege hōgi eḷḷu-bella, sakkare accu, ondu bāḷehaṇṇu, ondu kabbina tuṇḍu koḍtāre. Koḍōvāga ondu mātu hēḷbēku — ‘eḷḷu-bella tindu oḷḷe mātāḍi.’
    en: 'This — this is ellu beerodu. In the evening the women and children put on new clothes and go from house to house, giving ellu-bella, a sugar figurine, a banana and a piece of cane. And as you give it you must say: ''Eat sesame and jaggery, and speak sweetly.'''
  - who: rakshith
    t: ‘ಒಳ್ಳೆ ಮಾತಾಡಿ’… ಈ ವರ್ಷದ ನಮ್ಮ ಮನೆಗೆ ಇದಕ್ಕಿಂತ ಸರಿಯಾದ ಹಬ್ಬ ಇಲ್ಲ.
    tr: ‘Oḷḷe mātāḍi’… ī varṣada namma manege idakkinta sariyāda habba illa.
    en: '''Speak sweetly''… after the year our family''s had, there couldn''t be a better festival.'
  - who: meena
    t: ಮೊದಲ ಎಳ್ಳು ಯಾರಿಗೆ, ಶೋಭಾ? ಸಂಪ್ರದಾಯ ಏನು?
    tr: Modala eḷḷu yārige, Śōbhā? Sampradāya ēnu?
    en: Who gets the first ellu, Shobha? What's the custom?
  - who: shobha
    t: ಸಂಪ್ರದಾಯ ಗೊತ್ತಿಲ್ಲ ಅತ್ತಿಗೆ. ಆದ್ರೆ ನನ್ನ ಮನಸ್ಸು ಹೇಳ್ತಿದೆ. … ಮಹದೇವ, ತಗೋ. ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡು. ಕೋರ್ಟಿನ ಕಾಗದಗಳಲ್ಲಿ ನಿನ್ನ ಹೆಸರು ‘ಮೂರನೇ ಪ್ರತಿವಾದಿ’ ಅಂತ ಇತ್ತು. ಆ ಪದ ಓದಿದಾಗೆಲ್ಲಾ ನನಗೆ ತುಂಬಾ ನೋವಾಗ್ತಿತ್ತು.
    tr: Sampradāya gottilla attige. Ādre nanna manassu hēḷtide. … Mahadēva, tagō. Eḷḷu-bella tindu oḷḷe mātāḍu. Kōrṭina kāgadagaḷalli ninna hesaru ‘mūranē prativādi’ anta ittu. Ā pada ōdidāgellā nanage tumbā nōvāgtittu.
    en: I don't know the custom, Attige. But my heart says this. … Mahadeva, take it. Eat sesame and jaggery and speak sweetly. In the court papers your name was 'third defendant'. Every time I read that word, it hurt me terribly.
  - who: mahadeva
    t: ತಗೊಂಡೆ. ಒಳ್ಳೆ ಮಾತು ಹೇಳ್ತೀನಿ — ಆದ್ರೆ ನನಗೆ ದೊಡ್ಡ ಮಾತು ಬರಲ್ಲ ಅಂತ ನಿನಗೆ ಗೊತ್ತು. … ಶೋಭಾ, ವಂಶವೃಕ್ಷದಲ್ಲಿ ನಿನ್ನ ಹೆಸರು ಬಿಟ್ಟಿದ್ದು ನಾನು. ಬೇಕು ಅಂತ ಅಲ್ಲ — ಆದ್ರೆ ‘ಅವಳು ಕೇಳಲ್ಲ’ ಅಂತ ಮನಸ್ಸಲ್ಲಿ ಅನ್ಕೊಂಡಿದ್ದೆ. ಅದು ತಪ್ಪು. ಕ್ಷಮಿಸು.
    tr: Tagoṇḍe. Oḷḷe mātu hēḷtīni — ādre nanage doḍḍa mātu baralla anta ninage gottu. … Śōbhā, vaṁśavṛkṣadalli ninna hesaru biṭṭiddu nānu. Bēku anta alla — ādre ‘avaḷu kēḷalla’ anta manassalli ankoṇḍidde. Adu tappu. Kṣamisu.
    en: I've taken it. I'll say something sweet — but you know I'm no good with big words. … Shobha, I'm the one who left your name out of the family tree. Not on purpose — but somewhere in my mind I'd assumed 'she won't ask'. That was wrong. Forgive me.
  - who: shobha
    t: … ಇಷ್ಟು ಸಿಹಿ ಮಾತು ಕೇಳೋಕೆ ಒಂದು ವರ್ಷ, ಒಂದು ದಾವೆ, ಒಂದು ಜಾತ್ರೆ ಬೇಕಾಯ್ತು ನೋಡು.
    tr: … Iṣṭu sihi mātu kēḷōke ondu varṣa, ondu dāve, ondu jātre bēkāytu nōḍu.
    en: (laughing through tears) … Look at that — it took a year, a lawsuit and a jatre to hear something this sweet.
  - who: avva
    t: ಬೆಲ್ಲ ಆಗೋಕೂ ಕಬ್ಬು ಹದಿನಾಲ್ಕು ತಿಂಗಳು ಗದ್ದೆಯಲ್ಲಿ ನಿಲ್ಲಬೇಕು, ಆಮೇಲೆ ಬೆಂಕಿಯಲ್ಲಿ ಕುದೀಬೇಕು ಕಣವ್ವ. ಸಿಹಿ ಸುಮ್ನೆ ಬರಲ್ಲ.
    tr: Bella āgōkū kabbu hadinālku tiṅgaḷu gaddeyalli nillabēku, āmēle beṅkiyalli kudībēku kaṇavva. Sihi sumne baralla.
    en: Even to become jaggery, cane has to stand fourteen months in the field and then boil over a fire, my girl. Sweetness doesn't come for nothing.
  - who: suresh
    t: ಅವ್ವ, ನಿನಗೆ. … ‘ಒಳ್ಳೆ ಮಾತಾಡು’ ಅಂತ ನಿನಗೆ ಹೇಳೋ ಅಗತ್ಯ ಇಲ್ಲ. ಈ ವರ್ಷ ಒಂದು ಕಹಿ ಮಾತೂ ಆಡದೇ ಇದ್ದೋಳು ನೀನೊಬ್ಬಳೇ.
    tr: Avva, ninage. … ‘Oḷḷe mātāḍu’ anta ninage hēḷō agatya illa. Ī varṣa ondu kahi mātū āḍadē iddōḷu nīnobbaḷē.
    en: (holding out ellu-bella) Avva, for you. … There's no need to tell you to 'speak sweetly'. You're the only one who didn't say a single bitter word all year.
  - who: avva
    t: ಆಡಿದೀನಿ ಕಣಪ್ಪ, ಮನಸ್ಸಲ್ಲಿ. ದೇವ್ರು ಬಾಯಿಗೆ ಬೀಗ ಹಾಕಿದ್ದ, ಅಷ್ಟೇ.
    tr: Āḍidīni kaṇappa, manassalli. Dēvru bāyige bīga hākidda, aṣṭē.
    en: I said plenty, son — in my heart. God had put a lock on my mouth, that's all.
  - section: The huggi pot
    learn: 'kitchen and custom: hosa maḍike, ukkisu, sauṭu, saude, ole · habitual past: nam atte hēḷōru · handing on: ivattu ninna kaige koḍtidīni · a woman''s labour: heṅgasina duḍimege pahaṇi iralla · promise to teach: ninna hesaru bareyōdu kalistīni'
  - scene: Mid-morning. The smoke-darkened kitchen. In a new clay pot on the wood stove, rice and moong dal simmer in milk for the huggi. Avva sits on a low plank, directing; Shobha stirs; Meena grates coconut.
  - who: avva
    t: ಹಾಲು ಉಕ್ಕಿ ಮಡಕೆಯಿಂದ ಹೊರಗೆ ಚೆಲ್ಲಬೇಕು ಕಣೇ. ಮಡಕೆ ಉಕ್ಕಿದ ಹಾಗೆ ಮನೇಲಿ ಸಮೃದ್ಧಿ ಉಕ್ಕುತ್ತೆ ಅಂತ ನಮ್ ಅತ್ತೆ ಹೇಳೋರು.
    tr: Hālu ukki maḍakeyinda horage cellabēku kaṇē. Maḍake ukkida hāge manēli samṛddhi ukkutte anta nam atte hēḷōru.
    en: The milk has to boil up and spill over the pot, girl. My mother-in-law used to say that as the pot overflows, so plenty overflows in the house.
  - who: shobha
    t: ನಿನ್ನ ಅತ್ತೆ — ಅಂದ್ರೆ ನಮ್ಮಜ್ಜಿ. ಅವರ ಮುಖಾನೇ ನಂಗೆ ನೆನಪಿಲ್ಲ, ಅವ್ವ.
    tr: Ninna atte — andre nammajji. Avara mukhānē naṅge nenapilla, avva.
    en: Your mother-in-law — our grandmother. I don't even remember her face, Avva.
  - who: avva
    t: ನೀನು ಹುಟ್ಟೋ ಮುಂಚೇನೇ ಹೋದ್ರು. ನಾನು ಹದಿನೆಂಟು ವರ್ಷದವಳಾಗಿ ಈ ಮನೆಗೆ ಬಂದಾಗ ಅವರೇ ನನ್ನ ಕೈಗೆ ಈ ಸೌಟು ಕೊಟ್ಟಿದ್ದು. ಐವತ್ತೆರಡು ವರ್ಷ ಆಯ್ತು. ಇವತ್ತು ನಿನ್ನ ಕೈಗೆ ಕೊಡ್ತಿದೀನಿ.
    tr: Nīnu huṭṭō muñcēnē hōdru. Nānu hadineṇṭu varṣadavaḷāgi ī manege bandāga avarē nanna kaige ī sauṭu koṭṭiddu. Aivatteraḍu varṣa āytu. Ivattu ninna kaige koḍtidīni.
    en: She passed before you were born. When I came into this house at eighteen, it was she who put this ladle in my hand. That was fifty-two years ago. Today I'm putting it in yours.
  - who: meena
    t: ಅವ್ವ, ಈ ಅಡುಗೆಮನೆಯ ಲೆಕ್ಕ ಯಾವ ಪಹಣಿಯಲ್ಲೂ ಇಲ್ಲ ಅಲ್ವಾ? ಐವತ್ತೆರಡು ವರ್ಷದ ಹೊಗೆ, ಒಲೆ, ಸೌದೆ…
    tr: Avva, ī aḍugemaneya lekka yāva pahaṇiyallū illa alvā? Aivatteraḍu varṣada hoge, ole, saude…
    en: Avva, there's no account of this kitchen in any RTC, is there? Fifty-two years of smoke, stove and firewood…
  - who: avva
    t: ಹೆಂಗಸಿನ ದುಡಿಮೆಗೆ ಪಹಣಿ ಇರಲ್ಲ, ಮೀನಾ. ಆದ್ರೆ ಈ ವರ್ಷ ಒಂದು ಬದಲಾಯ್ತು — ನನ್ನ ಮಗಳ ಹೆಸರು ಕಾಗದದ ಮೇಲೆ ಬಂತು. ನನ್ನ ಹೆಸರೂ ಬಂತು. ಹೆಬ್ಬೆಟ್ಟಲ್ಲಾದ್ರೂ ಸರಿ.
    tr: Heṅgasina duḍimege pahaṇi iralla, Mīnā. Ādre ī varṣa ondu badalāytu — nanna magaḷa hesaru kāgadada mēle bantu. Nanna hesarū bantu. Hebbeṭṭallādrū sari.
    en: There's no RTC for a woman's work, Meena. But one thing changed this year — my daughter's name came onto the paper. Mine came too. Even if only as a thumbprint.
  - who: shobha
    t: ಅವ್ವ, ಮುಂದಿನ ಸಂಕ್ರಾಂತಿ ಒಳಗೆ ನಿನ್ನ ಹೆಸರು ಬರೆಯೋದು ಕಲಿಸ್ತೀನಿ. ಹೆಬ್ಬೆಟ್ಟು ಸಾಕು ಅನ್ನೋ ದಿನ ಮುಗೀತು.
    tr: Avva, mundina Saṅkrānti oḷage ninna hesaru bareyōdu kalistīni. Hebbeṭṭu sāku annō dina mugītu.
    en: Avva, before next Sankranti I'll teach you to write your name. The days of 'a thumbprint will do' are over.
  - who: avva
    t: ಎಪ್ಪತ್ತರಲ್ಲಿ ಅಕ್ಷರಾನಾ? … ಸರಿ, ಕಲಿಸು. ನಿಮ್ಮಪ್ಪನ ದಿನಚರಿಯಲ್ಲಿ ಒಂದು ಸಾಲಾದ್ರೂ ನನ್ನ ಕೈಯಲ್ಲೇ ಬರೀಬೇಕು ಅಂತ ಆಸೆ.
    tr: Eppattaralli akṣarānā? … Sari, kalisu. Nimmappana dinacariyalli ondu sālādrū nanna kaiyallē barībēku anta āse.
    en: Letters, at seventy? … All right, teach me. I'd like to write at least one line in your father's diary in my own hand.
  - who: meena
    t: ಅವ್ವ, ನೋಡಿ — ಉಕ್ಕಿತು! ಹುಗ್ಗಿ ಉಕ್ಕಿತು!
    tr: Avva, nōḍi — ukkitu! Huggi ukkitu!
    en: Avva, look — it's boiling over! The huggi's boiling over!
  - who: avva
    t: ಉಕ್ಕಲಿ ಬಿಡು. ಒಂದು ವರ್ಷ ಈ ಮನೆ ಒಳಗೊಳಗೇ ಕುದೀತು. ಈಗ ಹೊರಗೆ ಉಕ್ಕಲಿ.
    tr: Ukkali biḍu. Ondu varṣa ī mane oḷagoḷagē kudītu. Īga horage ukkali.
    en: Let it boil over. For a whole year this house simmered inside. Now let it overflow.
  - section: Painted horns
    learn: 'decorating cattle: kombige baṇṇa, gejje, hūvina hāra, mai toḷedu siṅgarisu, huggi tinisu · the fire ritual and its risks: kiccu hāyisōdu, gāya āytu, paśuvaidyaru bēḍa antāre · promises kept: … kalistīni andidde, ondu āytu · future plans: kṛṣi viśvavidyālayakke arji hākbēku antidīni'
  - scene: Late morning. The cattle have been washed in the canal. In front of the cattle shed Rakshith kneels beside Kaveri, now a year old, with a tin of white paint and a brush; Mahadeva holds the calf's head. Gauri, already painted, stands by with a garland of marigolds.
  - who: mahadeva
    t: ಹಿಂಗೆ — ಕೊಂಬಿನ ಬುಡದಿಂದ ತುದಿಗೆ, ಒಂದೇ ದಿಕ್ಕಿಗೆ ಬ್ರಶ್ ಎಳಿ. ಮೊದಲು ಬಿಳಿ, ಒಣಗಿದ ಮೇಲೆ ಕೆಂಪು. ಕಾವೇರಿಗೆ ಇದು ಮೊದಲ ಹಬ್ಬ, ಅವಳ ಕೊಂಬು ಇನ್ನೂ ಸಣ್ಣದು — ನಿಧಾನ.
    tr: Hiṅge — kombina buḍadinda tudige, ondē dikkige braś eḷi. Modalu biḷi, oṇagida mēle kempu. Kāvērige idu modala habba, avaḷa kombu innū saṇṇadu — nidhāna.
    en: Like this — draw the brush from the base of the horn to the tip, in one direction. White first, red once it's dry. This is Kaveri's first festival and her horns are still small — gently.
  - who: rakshith
    t: ಚಿಕ್ಕಪ್ಪ, ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ತಾತನ ಸಮಾಧಿ ಹತ್ರ ನೀನು ಹೇಳಿದ್ದೆ — ‘ದನಗಳ ಕೊಂಬಿಗೆ ಬಣ್ಣ ಹಚ್ಚೋದು ಅಷ್ಟೇ ಅಲ್ಲ, ನೇಗಿಲು ಹಿಡಿಯೋದೂ ಕಲಿಸ್ತೀನಿ’ ಅಂತ. ಒಂದು ಆಯ್ತು.
    tr: Cikkappa, Ḍisembar-nalli tātana samādhi hatra nīnu hēḷidde — ‘danagaḷa kombige baṇṇa haccōdu aṣṭē alla, nēgilu hiḍiyōdū kalistīni’ anta. Ondu āytu.
    en: Chikkappa, that December, by Thatha's grave, you said, 'Not just painting the cattle's horns — I'll teach you to hold a plough too.' That's one done.
  - who: mahadeva
    t: ನೇಗಿಲು ಮುಂದಿನ ಮುಂಗಾರಿಗೆ. ಮನೆಯಲ್ಲಿ ಎತ್ತು ಇಲ್ಲ, ಈಗ ಎಲ್ಲಾ ಟ್ರ್ಯಾಕ್ಟರ್ ಬಾಡಿಗೆ. ಆದ್ರೆ ತಾತನ ಕಾಲದ ನೇಗಿಲು ಕೊಟ್ಟಿಗೆ ಅಟ್ಟದ ಮೇಲಿದೆ. ಅದನ್ನ ಇಳಿಸಿ, ಪಕ್ಕದ ಮನೆಯ ಎತ್ತು ಕೇಳಿ, ಒಂದು ಸಾಲು ಉಳೋಣ — ನಿನಗೋಸ್ಕರ.
    tr: Nēgilu mundina muṅgārige. Maneyalli ettu illa, īga ellā ṭryākṭar bāḍige. Ādre tātana kālada nēgilu koṭṭige aṭṭada mēlide. Adanna iḷisi, pakkada maneya ettu kēḷi, ondu sālu uḷōṇa — ninagōskara.
    en: The plough will be next monsoon. We've no bullocks in the house — it's all hired tractors now. But Thatha's old plough is up in the loft of the cattle shed. We'll bring it down, borrow the neighbour's bullocks and plough one furrow — just for you.
  - who: rakshith
    t: ಇನ್ನೊಂದು ವಿಷಯ ನಿನಗೆ ಮೊದಲು ಹೇಳ್ತೀನಿ ಚಿಕ್ಕಪ್ಪ — ಅಪ್ಪನಿಗೂ ಇನ್ನೂ ಹೇಳಿಲ್ಲ. ಪಿಯುಸಿ ಆದ್ಮೇಲೆ ನಾನು ಕೃಷಿ ವಿಶ್ವವಿದ್ಯಾಲಯಕ್ಕೆ ಅರ್ಜಿ ಹಾಕ್ಬೇಕು ಅಂತಿದೀನಿ. ಬಿಎಸ್ಸಿ ಕೃಷಿ.
    tr: Innondu viṣaya ninage modalu hēḷtīni cikkappa — appanigū innū hēḷilla. Pi-Yu-Si ādmēle nānu kṛṣi viśvavidyālayakke arji hākbēku antidīni. Bi-Es-Si kṛṣi.
    en: I'll tell you something else first, Chikkappa — I haven't even told Appa yet. After PUC I want to apply to the agricultural university. A BSc in agriculture.
  - who: mahadeva
    t: 'ನೀನಾ? ಬೆಂಗಳೂರಿನ ಹುಡುಗ, ಕೃಷಿ ಓದ್ತೀಯಾ? … ಓದು. ಆದ್ರೆ ಒಂದು ಮಾತು: ಓದಿ ಆಫೀಸಲ್ಲಿ ಕೂತು ರೈತರಿಗೆ ‘ಇದು ಮಾಡಿ, ಅದು ಮಾಡಿ’ ಅಂತ ಹೇಳೋಕೆ ಮುಂಚೆ ವರ್ಷಕ್ಕೊಂದ್ಸಲ ಇಲ್ಲಿ ಬಂದು ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ನೀರು ಕಟ್ಟು. ಆಗ ನಿನ್ನ ಸಲಹೆ ಕೇಳೋಕೆ ನಾನೇ ಮೊದಲು ಬರ್ತೀನಿ.'
    tr: 'Nīnā? Beṅgaḷūrina huḍuga, kṛṣi ōdtīyā? … Ōdu. Ādre ondu mātu: ōdi āphīsalli kūtu raitarige ‘idu māḍi, adu māḍi’ anta hēḷōke mun̄ce varṣakkondsala illi bandu rātri eraḍu gaṇṭege nīru kaṭṭu. Āga ninna salahe kēḷōke nānē modalu bartīni.'
    en: 'You? A Bengaluru boy, studying agriculture? … Study. But one thing: before you sit in an office telling farmers ''do this, do that'', come here once a year and water the field at two in the morning. Then I''ll be the first to come asking your advice.'
  - who: rakshith
    t: ಆಣೆ. … ಕಿಚ್ಚು ಹಾಯಿಸೋದು ಇವತ್ತು ಮಾಡ್ತೀರಾ? ಫೋನಲ್ಲಿ ವಿಡಿಯೋ ನೋಡಿದೆ — ಬೆಂಕಿ ಮೇಲೆ ದನಗಳು ಹಾರ್ತಾವೆ.
    tr: Āṇe. … Kiccu hāyisōdu ivattu māḍtīrā? Phōnalli viḍiyō nōḍide — beṅki mēle danagaḷu hārtāve.
    en: I swear. … Are you doing the kichchu today? I saw a video on my phone — the cattle jump over fire.
  - who: mahadeva
    t: 'ಊರ ಬೀದಿಯಲ್ಲಿ ಕೆಲವರು ಮಾಡ್ತಾರೆ. ಹುಲ್ಲಿಗೆ ಬೆಂಕಿ ಹಚ್ಚಿ ದನಗಳನ್ನ ಅದರ ಮೇಲೆ ಓಡಿಸ್ತಾರೆ — ರೋಗ-ರುಜಿನ ಹೋಗ್ಲಿ ಅಂತ ನಂಬಿಕೆ. ಆದ್ರೆ ಎರಡು ವರ್ಷದ ಹಿಂದೆ ಮಂಡ್ಯ ಕಡೆ ದನಗಳಿಗೂ ಜನಕ್ಕೂ ಗಾಯ ಆಯ್ತು; ಪಶುವೈದ್ಯರೂ ಬೇಡ ಅಂತಾರೆ. ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಒಂದೇ ನಿಯಮ: ಮೈ ತೊಳೆದು, ಸಿಂಗರಿಸಿ, ಹುಗ್ಗಿ ತಿನಿಸಿ, ಆರತಿ ಎತ್ತೋದು. ಬೆಂಕಿ ಆರತಿ ತಟ್ಟೆಯಲ್ಲಿ ಮಾತ್ರ.'
    tr: 'Ūra bīdiyalli kelavaru māḍtāre. Hullige beṅki hacci danagaḷanna adara mēle ōḍistāre — rōga-rujina hōgli anta nambike. Ādre eraḍu varṣada hinde Maṇḍya kaḍe danagaḷigū janakkū gāya āytu; paśuvaidyarū bēḍa antāre. Namma maneyalli ondē niyama: mai toḷedu, siṅgarisi, huggi tinisi, ārati ettōdu. Beṅki ārati taṭṭeyalli mātra.'
    en: 'Some people do it in the village street. They set straw alight and run the cattle over it — the belief is that it drives away sickness. But two years ago, around Mandya, both cattle and people were hurt, and the vets say don''t. In our house there''s one rule: wash them, decorate them, feed them huggi and wave the lamp before them. The only fire is on the arati plate.'
  - who: rakshith
    t: ಗೌರಿಗೆ ಕೆಂಪು, ಕಾವೇರಿಗೆ ನೀಲಿ. ಗೆಜ್ಜೆ ಎಲ್ಲಿದೆ ಚಿಕ್ಕಪ್ಪ?
    tr: Gaurige kempu, Kāvērige nīli. Gejje ellide cikkappa?
    en: Red for Gauri, blue for Kaveri. Where are the bells, Chikkappa?
  - who: avva
    t: ಗೆಜ್ಜೆ ಟ್ರಂಕಿನಲ್ಲಿದೆ — ನಾನು ಈ ಮನೆಗೆ ತಂದ ಆ ಟ್ರಂಕು. ನಿಮ್ಮ ತಾತ ಪ್ರತಿ ಸಂಕ್ರಾಂತಿಗೆ ಅದನ್ನ ತೆಗೆದು ಹೊಳಪು ಮಾಡ್ತಿದ್ರು. ಕಳೆದ ವರ್ಷ ಯಾರೂ ತೆಗೀಲಿಲ್ಲ.
    tr: Gejje ṭraṅkinallide — nānu ī manege tanda ā ṭraṅku. Nimma tāta prati Saṅkrāntige adanna tegedu hoḷapu māḍtidru. Kaḷeda varṣa yārū tegīlilla.
    en: (from the doorway) The bells are in the trunk — the trunk I brought to this house. Your Thatha used to take them out and polish them every Sankranti. Last year nobody took them out.
  - who: rakshith
    t: ಈ ವರ್ಷ ನಾನು ತೆಗೀತೀನಿ ಅಜ್ಜಿ.
    tr: Ī varṣa nānu tegītīni ajji.
    en: This year I'll take them out, Ajji.
  - section: The meal in the yard
    learn: 'festival food: huggi, rāgi mudde, avarekāḷu sāru, bassāru · news in brief: vibhāga patra nōndaṇi āytu, pōḍige arji hōgide, muṅgaḍa koṭṭidāre, karāru āgide · serving: nānu baḍistīni, ele hāki · reading and writing the diary: koneya puṭa ōdu, nīnu nōḍiddanna bari · closing a debt: bāki tīritu'
  - scene: Afternoon. Banana leaves are laid on mats in the yard, under the open sky.
  - who: avva
    t: ಎಲೆ ಹಾಕಿ. ಅಂಗಳದಲ್ಲೇ. ಒಳಗೆ ಬೇಡ — ಇವತ್ತು ಅಂಗಳದಲ್ಲೇ ಊಟ.
    tr: Ele hāki. Aṅgaḷadallē. Oḷage bēḍa — ivattu aṅgaḷadallē ūṭa.
    en: Lay the leaves. Here in the yard. Not inside — today we eat in the yard.
  - who: meena
    t: ಹುಗ್ಗಿ, ರಾಗಿ ಮುದ್ದೆ, ಅವರೆಕಾಳು ಸಾರು, ಬಸ್ಸಾರು, ಎಳ್ಳು-ಬೆಲ್ಲ, ಕಬ್ಬು… ಅವ್ವ, ಅಡುಗೆ ಎಲ್ಲಾ ನಿಮ್ಮ ಮಗಳದು. ನಾನು ಬರೀ ತೆಂಗಿನಕಾಯಿ ತುರಿದಿದ್ದು.
    tr: Huggi, rāgi mudde, avarekāḷu sāru, bassāru, eḷḷu-bella, kabbu… Avva, aḍuge ellā nimma magaḷadu. Nānu barī teṅginakāyi turididdu.
    en: Huggi, ragi mudde, field-bean saaru, bassaaru, ellu-bella, cane… Avva, all the cooking is your daughter's. All I did was grate the coconut.
  - who: suresh
    t: ಅವ್ವ, ಒಂದು ಸುದ್ದಿ. ಕಳೆದ ಗುರುವಾರ ಮದ್ದೂರಿನ ಉಪನೋಂದಣಾಧಿಕಾರಿ ಕಚೇರಿಯಲ್ಲಿ ವಿಭಾಗ ಪತ್ರ ನೋಂದಣಿ ಆಯ್ತು — ಅಲ್ಲಿ ಕ್ಯಾಮರಾ ಮುಂದೆ ನಿನ್ನ ಹೆಬ್ಬೆಟ್ಟು ತಗೊಂಡ್ರಲ್ಲ, ಅದೇ. ಪೋಡಿಗೆ ಅರ್ಜಿ ಹೋಗಿದೆ. ಸಿದ್ದರಾಜು ಅವರು ಹೇಳಿದ ಹಾಗೆ ಹೊಸ ಪಹಣಿ ಮಾರ್ಚ್-ಏಪ್ರಿಲ್ ಹೊತ್ತಿಗೆ ಬರಬಹುದು.
    tr: Avva, ondu suddi. Kaḷeda Guruvāra Maddūrina upanōndaṇādhikāri kacēriyalli vibhāga patra nōndaṇi āytu — alli kyāmarā munde ninna hebbeṭṭu tagoṇḍralla, adē. Pōḍige arji hōgide. Siddarāju avaru hēḷida hāge hosa pahaṇi Mārc-Ēpril hottige barabahudu.
    en: Avva, some news. Last Thursday the partition deed was registered at the Sub-Registrar's office in Maddur — that's where they took your thumbprint in front of the camera. The podi application has gone in. As Siddaraju said, the new RTC may come around March or April.
  - who: shobha
    t: ನಿಂಗೇಗೌಡರು ಐದು ಲಕ್ಷ ಮುಂಗಡ ಕೊಟ್ಟಿದಾರೆ, ಕರಾರು ಆಗಿದೆ. ಹೊಸ ಪಹಣಿ ಬಂದ ತಕ್ಷಣ ಕ್ರಯಪತ್ರ. ಮೈಸೂರಲ್ಲಿ ಬೋಗಾದಿ ಹತ್ರ ಒಂದು ಸಣ್ಣ ಮನೆ ನೋಡಿದೀವಿ — ಎರಡು ರೂಮು, ಒಂದು ಸಣ್ಣ ಅಂಗಳ. ಅಂಗಳ ಇರ್ಲೇಬೇಕು ಅಂತ ನಾನೇ ಹಠ ಹಿಡಿದೆ.
    tr: Niṅgēgauḍaru aidu lakṣa muṅgaḍa koṭṭidāre, karāru āgide. Hosa pahaṇi banda takṣaṇa krayapatra. Maisūralli Bōgādi hatra ondu saṇṇa mane nōḍidīvi — eraḍu rūmu, ondu saṇṇa aṅgaḷa. Aṅgaḷa irlēbēku anta nānē haṭha hiḍide.
    en: Ningegowda has paid five lakh in advance; the agreement is signed. As soon as the new RTC comes, the sale deed. In Mysuru we've seen a small house near Bogadi — two rooms and a little yard. I was the one who insisted it must have a yard.
  - who: mahadeva
    t: ಆ ಅಂಗಳಕ್ಕೆ ತುಳಸಿ ಕಟ್ಟೆ ನಾನು ಮಾಡಿಸ್ಕೊಡ್ತೀನಿ — ನಮ್ಮೂರ ಕಲ್ಲಿನಲ್ಲಿ.
    tr: Ā aṅgaḷakke tuḷasi kaṭṭe nānu māḍiskoḍtīni — nammūra kallinalli.
    en: I'll have a tulasi stand made for that yard — out of our village's stone.
  - who: suresh
    t: ಇನ್ನೊಂದು ವಿಷಯ. ವೀಕೆಂಡ್ ರೈತನ ಕೆಲಸ ನಿಲ್ಲಲ್ಲ. ತಿಂಗಳಿಗೆ ಎರಡು ಶನಿವಾರ ಬರ್ತೀನಿ. ಅಕ್ಟೋಬರ್ ಕಟಾವಿಗೆ ಮೂರು ದಿನ ರಜೆ ಈಗಲೇ ಬರೆದಿಟ್ಟಿದೀನಿ.
    tr: Innondu viṣaya. Vīkeṇḍ raitana kelasa nillalla. Tiṅgaḷige eraḍu Śanivāra bartīni. Akṭōbar kaṭāvige mūru dina raje īgalē barediṭṭidīni.
    en: One more thing. The weekend farmer isn't retiring. I'll come two Saturdays a month. I've already blocked three days' leave for the October harvest.
  - who: mahadeva
    t: ಬಾ. ಆದ್ರೆ ಈ ಸಲ ಬೋರ್‌ವೆಲ್ ಐಡಿಯಾ ಬೇಡ, ಅಣ್ಣ. ಈ ವರ್ಷ ಗದ್ದೆಯ ಒಂದು ಮೂಲೇಲಿ ಹನಿ ನೀರಾವರಿ ಹಾಕಿ ನೋಡೋಣ ಅಂತಿದೀನಿ — ಕಬ್ಬಿಗೆ ನೀರು ಕಡಿಮೆ, ಇಳುವರಿ ಜಾಸ್ತಿ ಅಂತಾರೆ. ಸರ್ಕಾರದ ಸಬ್ಸಿಡಿನೂ ಸಿಗುತ್ತಂತೆ.
    tr: Bā. Ādre ī sala bōrvel aiḍiyā bēḍa, aṇṇa. Ī varṣa gaddeya ondu mūlēli hani nīrāvari hāki nōḍōṇa antidīni — kabbige nīru kaḍime, iḷuvari jāsti antāre. Sarkārada sabsiḍinū siguttante.
    en: Come. But no borewell ideas this time, Anna. This year I'm thinking of trying drip irrigation in one corner of the wet land — they say cane needs less water that way and yields more. Apparently there's a government subsidy too.
  - who: rakshith
    t: ಆ ಅರ್ಜಿ ನಾನು ಆನ್‌ಲೈನಲ್ಲಿ ಹಾಕ್ತೀನಿ, ಚಿಕ್ಕಪ್ಪ. ಆಧಾರ್, ಪಹಣಿ, ಬ್ಯಾಂಕ್ ಪಾಸ್‌ಬುಕ್ — ಅಷ್ಟೇ ತಾನೇ?
    tr: Ā arji nānu ānlainalli hāktīni, cikkappa. Ādhār, pahaṇi, byāṅk pās-buk — aṣṭē tānē?
    en: (from the veranda) I'll put in that application online, Chikkappa. Aadhaar, RTC, bank passbook — that's all, isn't it?
  - who: mahadeva
    t: ಹೊಸ ಪಹಣಿ ನನ್ನೊಬ್ಬನ ಹೆಸರಿಗೆ ಬರೋವರೆಗೂ ಕಾಯ್ಬೇಕು, ಮರಿ. ಈ ಊರಲ್ಲಿ ಯಾವ ಕೆಲಸನೂ ಪಹಣಿ ಇಲ್ದೆ ಶುರು ಆಗಲ್ಲ — ಈ ವರ್ಷ ಅದನ್ನಾದ್ರೂ ಕಲ್ತಿದೀಯ.
    tr: Hosa pahaṇi nannobbana hesarige barōvaregū kāybēku, mari. Ī ūralli yāva kelasanū pahaṇi ilde śuru āgalla — ī varṣa adannādrū kaltidīya.
    en: We'll have to wait till the new RTC comes in my name alone, lad. Nothing in this village starts without an RTC — that much you've learnt this year.
  - who: avva
    t: ಮೂರೂ ಜನ ಕೂತ್ರಾ? ಸುರೇಶ ಈ ಕಡೆ, ಶೋಭಾ ಮಧ್ಯ, ಮಹದೇವ ಆ ಕಡೆ. ನಾನು ಬಡಿಸ್ತೀನಿ.
    tr: Mūrū jana kūtrā? Surēśa ī kaḍe, Śōbhā madhya, Mahadēva ā kaḍe. Nānu baḍistīni.
    en: Are all three of you sitting? Suresha on this side, Shobha in the middle, Mahadeva on that side. I'll serve.
  - who: shobha
    t: ಅವ್ವ, ನೀನೂ ಕೂರು. ಇವತ್ತು ನಾನು ಬಡಿಸ್ತೀನಿ — ಕೋರ್ಟಲ್ಲಿ ನೀನು ರೊಟ್ಟಿ ಹಂಚಿದ್ದೆ, ಇವತ್ತು ನನ್ನ ಸರತಿ.
    tr: Avva, nīnū kūru. Ivattu nānu baḍistīni — kōrṭalli nīnu roṭṭi han̄cidde, ivattu nanna sarati.
    en: Avva, you sit too. Today I'll serve — you shared out the rotti in court; today it's my turn.
  - who: avva
    t: ಇಲ್ಲ ಕಣವ್ವ. ಇವತ್ತು ನಾನು ಕೂರಲ್ಲ. ನಿಮ್ಮಪ್ಪ ನೋಡ್ಬೇಕು ಅಂದಿದ್ದನ್ನ ನಾನು ನಿಂತ್ಕೊಂಡು ನೋಡ್ಬೇಕು.
    tr: Illa kaṇavva. Ivattu nānu kūralla. Nimmappa nōḍbēku andiddanna nānu nintkoṇḍu nōḍbēku.
    en: No, my girl. Today I won't sit. What your father wanted to see, I must stand and see.
  - scene: The three siblings sit cross-legged in the yard, banana leaves before them; Avva serves. Meena and Rakshith sit a little apart on the veranda step. For a while nobody speaks; there is only the sound of eating, and the bells on the cattle.
  - who: avva
    t: … ರಕ್ಷಿತ್, ಆ ದಿನಚರಿ ತಗೊಂಡು ಬಾ ಕಂದ. ಕೊನೇ ಪುಟ ಓದು.
    tr: … Rakṣit, ā dinacari tagoṇḍu bā kanda. Konē puṭa ōdu.
    en: … Rakshith, bring the diary, child. Read the last page.
  - who: rakshith
    t: '‘ನನ್ನ ಮೂರು ಮಕ್ಕಳೂ ಮೂರು ಕಡೆ ಇದ್ದಾರೆ. ಒಂದು ದಿನ ಈ ಮನೆ ಅಂಗಳದಲ್ಲಿ ಮೂವರೂ ಒಟ್ಟಿಗೆ ಕೂತು ಊಟ ಮಾಡೋದು ನೋಡ್ಬೇಕು.’ … ಅದರ ಕೆಳಗೆ ಅತ್ತೆಯ ಕೈಬರಹ: ‘ಜಾತ್ರೆ ರಾತ್ರಿ. ಮೂರೂ ಮಕ್ಳು ಅಂಗಳದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಕೂತಿದ್ರು. ಇನ್ನು ಒಟ್ಟಿಗೆ ಉಣ್ಣೋದು ಒಂದೇ ಬಾಕಿ.’'
    tr: '‘Nanna mūru makkaḷū mūru kaḍe iddāre. Ondu dina ī mane aṅgaḷadalli mūvarū oṭṭige kūtu ūṭa māḍōdu nōḍbēku.’ … Adara keḷage atteya kaibaraha: ‘Jātre rātri. Mūrū makḷu aṅgaḷadalli oṭṭige kūtidru. Innu oṭṭige uṇṇōdu ondē bāki.’'
    en: '''My three children are in three different places. One day I must see all three of them sitting together and eating in the yard of this house.'' … And under it, in Atte''s handwriting: ''Night of the jatre. All three children sat together in the yard. Only eating together still remains.'''
  - who: avva
    t: ಈಗ ನೀನು ಬರಿ, ಕಂದ. ತಾತನ ಮೊಮ್ಮಗನ ಕೈಬರಹ. ನಾನು ಹೇಳಿದ್ದನ್ನಲ್ಲ — ನೀನು ನೋಡಿದ್ದನ್ನ.
    tr: Īga nīnu bari, kanda. Tātana mommagana kaibaraha. Nānu hēḷiddannalla — nīnu nōḍiddanna.
    en: Now you write, child. In Thatha's grandson's hand. Not what I tell you — what you saw.
  - who: rakshith
    t: ‘ಸಂಕ್ರಾಂತಿ, ಎರಡು ಸಾವಿರದ ಇಪ್ಪತ್ತೇಳು. ಇವತ್ತು ಮೂರೂ ಮಕ್ಕಳು ಈ ಅಂಗಳದಲ್ಲಿ ಒಟ್ಟಿಗೆ ಕೂತು ಉಂಡ್ರು. ಅಜ್ಜಿ ನಿಂತು ಬಡಿಸಿದ್ರು. ಯಾರೂ ಲೆಕ್ಕ ಹಾಕಲಿಲ್ಲ. ತಾತ, ನಿಮ್ಮ ಬಾಕಿ ತೀರಿತು.’
    tr: ‘Saṅkrānti, eraḍu sāvirada ippattēḷu. Ivattu mūrū makkaḷu ī aṅgaḷadalli oṭṭige kūtu uṇḍru. Ajji nintu baḍisidru. Yārū lekka hākalilla. Tāta, nimma bāki tīritu.’
    en: (writing slowly, then reading it out) 'Sankranti, two thousand twenty-seven. Today all three children sat together in this yard and ate. Ajji stood and served. Nobody counted anything. Thatha, your account is settled.'
  - who: suresh
    t: ‘ಬಾಕಿ ತೀರಿತು’… ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಮಗ ನೋಡು.
    tr: ‘Bāki tīritu’… byāṅk myānējar maga nōḍu.
    en: (his voice thick) 'Account settled'… spoken like a bank manager's son.
  - who: mahadeva
    t: ಸಂಘದ ಬೇಬಾಕಿ ಪ್ರಮಾಣಪತ್ರಕ್ಕಿಂತ ಇದು ದೊಡ್ಡ ಪ್ರಮಾಣಪತ್ರ, ಅಣ್ಣ.
    tr: Saṅghada bēbāki pramāṇapatrakkinta idu doḍḍa pramāṇapatra, aṇṇa.
    en: That's a bigger certificate than the society's no-dues certificate, Anna.
  - who: shobha
    t: ಅವ್ವ… ಈಗಲಾದ್ರೂ ಕೂರು. ಬಾಕಿ ತೀರಿತಲ್ಲ.
    tr: Avva… īgalādrū kūru. Bāki tīritalla.
    en: Avva… sit down now, at least. The account's settled, isn't it?
  - who: avva
    t: ಕೂರ್ತೀನಿ. … ಸುರೇಶ, ಸಂಜೆ ರಕ್ಷಿತ್ ಜೊತೆ ಹೋಗಿ ಒಂದು ಹಿಡಿ ಎಳ್ಳು-ಬೆಲ್ಲ ಹುಣಸೆ ಮರದ ಹತ್ರ ಇಟ್ಟು ಬಾ. ಅವರಿಗೂ ಒಂದು ಪಾಲು.
    tr: Kūrtīni. … Surēśa, sañje Rakṣit jote hōgi ondu hiḍi eḷḷu-bella huṇase marada hatra iṭṭu bā. Avarigū ondu pālu.
    en: I'll sit. … Suresha, this evening go with Rakshith and leave a handful of ellu-bella under the tamarind tree. A share for him too.
  - section: Visitors
    learn: 'giving ellu: eḷḷu-bella tagoḷḷi, oḷḷe mātāḍi · an elder''s reflection: nānu sōte, bīja avattē bittiddu, kānūnē haṅgaite, kūḍi bāḷidare svarga sukha · the broker''s last visit: vyāpārakkalla, āṇe · defending a choice: ā bele nānē tīrmāna māḍiddu, gēṭu alla raita irtāne'
  - scene: Late afternoon. Shobha and Rakshith, carrying a tray of ellu-bella, go along the lane to the peepul platform. Old Thimmegowda sits there in a fresh white shirt, a shawl over his shoulders.
  - who: shobha
    t: ತಿಮ್ಮಣ್ಣ, ಎಳ್ಳು-ಬೆಲ್ಲ ತಗೊಳ್ಳಿ. ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡಿ.
    tr: Timmaṇṇa, eḷḷu-bella tagoḷḷi. Eḷḷu-bella tindu oḷḷe mātāḍi.
    en: Thimmanna, have some ellu-bella. Eat sesame and jaggery and speak sweetly.
  - who: elder
    t: ಬಾಮ್ಮ, ಬಾ. ಚನ್ನೇಗೌಡನ ಮಗಳು ಎಳ್ಳು ಬೀರೋಕೆ ಬಂದ್ಲು ಅಂದ್ರೆ ಊರಿಗೆ ಸಂಕ್ರಾಂತಿ ಬಂತು ಅಂತ ಲೆಕ್ಕ. … ಮಾರ್ಚ್‌ನಲ್ಲಿ ಇದೇ ಕಟ್ಟೆ ಮೇಲೆ ನಾನು ಸೋತೆ ಕಣಮ್ಮ. ನಿಮ್ಮನ್ನ ಒಂದು ಮಾಡೋಕೆ ಆಗ್ಲಿಲ್ಲ.
    tr: Bāmma, bā. Cannēgauḍana magaḷu eḷḷu bīrōke bandlu andre ūrige Saṅkrānti bantu anta lekka. … Mārc-nalli idē kaṭṭe mēle nānu sōte kaṇamma. Nimmanna ondu māḍōke āglilla.
    en: Come, child, come. When Channegowda's daughter comes round with ellu, the village knows Sankranti has truly arrived. … In March, on this very platform, I failed, my dear. I couldn't bring you together.
  - who: shobha
    t: ಸೋಲಲಿಲ್ಲ ತಿಮ್ಮಣ್ಣ. ಅವತ್ತು ಅವ್ವ ಮೊದಲ ಸಲ ಊರಿನ ಮುಂದೆ ತನ್ನ ಆಸೆ ಹೇಳಿದ್ರು. ಬೀಜ ಅವತ್ತೇ ಬಿತ್ತಿದ್ದು. ಬೆಳೆ ಈಗ ಬಂತು, ಅಷ್ಟೇ.
    tr: Sōlalilla Timmaṇṇa. Avattu avva modala sala ūrina munde tanna āse hēḷidru. Bīja avattē bittiddu. Beḷe īga bantu, aṣṭē.
    en: You didn't fail, Thimmanna. That night Avva spoke her wish in front of the village for the first time. The seed was sown that night. The crop has only come up now.
  - who: elder
    t: 'ಹೂಂ. ನಮ್ಮ ಕಾಲದಲ್ಲಿ ಹೆಣ್ಮಕ್ಕಳು ಪಾಲು ಕೇಳ್ತಿರ್ಲಿಲ್ಲ; ಕೇಳಿದ್ರೆ ಊರು ಬೈತಿತ್ತು. ಈಗ ಕಾನೂನೇ ಹಂಗೈತೆ — ಒಳ್ಳೇದೇ ಆಯ್ತು ಅನ್ಸುತ್ತೆ. ಆದ್ರೆ ಮುದುಕನ ಒಂದು ಮಾತು ಕೇಳು: ಕಾನೂನು ಪಾಲು ಕೊಡುತ್ತೆ, ಕುಟುಂಬ ಕೊಡಲ್ಲ. ಕುಟುಂಬ ಉಳಿಸ್ಕೊಳ್ಳೋದು ನಿಮ್ಮ ಕೈಲೇ ಐತೆ. ಕೂಡಿ ಬಾಳಿದರೆ ಸ್ವರ್ಗ ಸುಖ ಅಂತಾರಲ್ಲ — ಅದು.'
    tr: 'Hūṁ. Namma kāladalli heṇmakkaḷu pālu kēḷtirlilla; kēḷidre ūru baitittu. Īga kānūnē haṅgaite — oḷḷēdē āytu ansutte. Ādre mudukana ondu mātu kēḷu: kānūnu pālu koḍutte, kuṭumba koḍalla. Kuṭumba uḷiskoḷḷōdu nimma kailē aite. Kūḍi bāḷidare svarga sukha antāralla — adu.'
    en: 'Hm. In our day daughters didn''t ask for a share; if they did, the village scolded them. Now the law itself says so — and I think that''s turned out for the good. But hear one word from an old man: the law gives you a share; it doesn''t give you a family. Keeping the family is in your own hands. ''Living together is the joy of heaven,'' as they say — that.'
  - who: elder
    t: ನಂಗೂ ಒಬ್ಳು ಮಗಳಿದಾಳೆ ಕಣವ್ವ, ಹಾಸನದಲ್ಲಿ. ಮೂವತ್ತು ವರ್ಷದಿಂದ ಅವಳು ಪಾಲು ಕೇಳ್ಲಿಲ್ಲ, ನಾನು ಕೊಡ್ಲಿಲ್ಲ. ಕೇಳ್ಲಿಲ್ಲ ಅಂದ್ರೆ ಬೇಡ ಅಂತ ಅಲ್ಲ ಅಂತ ಈ ವರ್ಷ ನಿನ್ನ ನೋಡಿ ಅರ್ಥ ಆಯ್ತು.
    tr: Naṅgū obḷu magaḷidāḷe kaṇavva, Hāsanadalli. Mūvattu varṣadinda avaḷu pālu kēḷlilla, nānu koḍlilla. Kēḷlilla andre bēḍa anta alla anta ī varṣa ninna nōḍi artha āytu.
    en: 'I have a daughter too, my dear — in Hassan. For thirty years she never asked for a share, and I never gave one. This year, watching you, I understood: not asking doesn''t mean not wanting.'
  - who: shobha
    t: ಹಾಗಾದ್ರೆ ಇವತ್ತೇ ಫೋನ್ ಮಾಡಿ, ತಿಮ್ಮಣ್ಣ. ಎಳ್ಳು-ಬೆಲ್ಲ ಕೊಡೋ ದಿನ ಇದು — ಒಳ್ಳೆ ಮಾತಾಡೋ ದಿನ.
    tr: Hāgādre ivattē phōn māḍi, Timmaṇṇa. Eḷḷu-bella koḍō dina idu — oḷḷe mātāḍō dina.
    en: Then phone her today, Thimmanna. It's the day for giving ellu-bella — the day for speaking sweetly.
  - who: elder
    t: ಮಾಡ್ತೀನಿ… ನೀನೇ ನಂಬರ್ ಒತ್ತು ಮಗ. ನನ್ ಕಣ್ಣಿಗೆ ಆ ಸಣ್ಣ ಅಕ್ಷರ ಕಾಣಲ್ಲ.
    tr: Māḍtīni… nīnē nambar ottu maga. Nan kaṇṇige ā saṇṇa akṣara kāṇalla.
    en: I will… you press the number for me, child. My eyes can't see those tiny letters.
  - who: rakshith
    t: ತಾತ, ನಿಮಗೂ ಸಕ್ಕರೆ ಅಚ್ಚು. … ಇದು ಆನೆ ಆಕಾರ.
    tr: Tāta, nimagū sakkare accu. … Idu āne ākāra.
    en: Thatha, a sugar figurine for you too. … This one's an elephant.
  - who: elder
    t: ನೀನು ಆ ಬೆಂಗಳೂರು ಹುಡುಗ ಅಲ್ವಾ? ಕೃಷಿ ಓದ್ತೀಯಂತೆ — ಬೆಳಿಗ್ಗೆಯಿಂದ ಊರೆಲ್ಲಾ ಇದೇ ಸುದ್ದಿ. ಓದು ಕಣಪ್ಪ. ಓದಿ ಮುಗಿದ ಮೇಲೆ ಈ ಕಟ್ಟೆಗೆ ಬಂದು ನಮಗೂ ಹೇಳು — ಕಮ್ಮಿ ನೀರಲ್ಲಿ ಕಬ್ಬು ಹೆಂಗೆ ಬೆಳೆಯೋದು ಅಂತ.
    tr: Nīnu ā Beṅgaḷūru huḍuga alvā? Kṛṣi ōdtīyante — beḷiggeyinda ūrellā idē suddi. Ōdu kaṇappa. Ōdi mugida mēle ī kaṭṭege bandu namagū hēḷu — kammi nīralli kabbu heṅge beḷeyōdu anta.
    en: You're that Bengaluru boy, aren't you? They say you're going to study agriculture — the whole village has been talking of nothing else since morning. Study, lad. And when you've finished, come to this platform and tell us too — how to grow cane on less water.
  - scene: Back at the house, a white SUV has stopped at the gate. Manjunath the broker gets out, holding a box of sugar figurines.
  - who: broker
    t: ಸಂಕ್ರಾಂತಿ ಶುಭಾಶಯಗಳು ಸಾರ್, ಅಮ್ಮಾವ್ರೇ. ಎಳ್ಳು-ಬೆಲ್ಲ ಕೊಡೋಕೆ ಬಂದೆ, ವ್ಯಾಪಾರಕ್ಕಲ್ಲ — ಆಣೆ. … ಆದ್ರೂ ಕೇಳಿದೆ, ಲೋಕ ಅದಾಲತ್‌ನಲ್ಲಿ ರಾಜಿ ಆಯ್ತಂತೆ, ಒಣ ಹೊಲದ ಅರ್ಧ ನಿಂಗೇಗೌಡ್ರಿಗೆ ಮೂವತ್ತಾರಕ್ಕೆ ಹೋಗ್ತಿದೆಯಂತೆ. ನನ್ನ ಪಾರ್ಟಿ ನಲವತ್ತು ಕೊಡ್ತಿತ್ತು ಸಾರ್!
    tr: Saṅkrānti śubhāśayagaḷu sār, ammāvrē. Eḷḷu-bella koḍōke bande, vyāpārakkalla — āṇe. … Ādrū kēḷide, Lōka Adālat-nalli rāji āytante, oṇa holada ardha Niṅgēgauḍrige mūvattārakke hōgtideyante. Nanna pārṭi nalavattu koḍtittu sār!
    en: Happy Sankranti, sir, Ammavre. I've come to give ellu-bella, not for business — I swear. … Still, I heard there was a settlement at the Lok Adalat, and half the dry field is going to Ningegowda at thirty-six. My party would have paid forty, sir!
  - who: shobha
    t: ಆ ವ್ಯತ್ಯಾಸ ನನ್ನ ಪಾಲಿಂದ ಹೋಗಿದ್ದು, ಮಂಜುನಾಥ್ ಅವರೇ — ಸುಮಾರು ಐದು ಲಕ್ಷ. ಅದಕ್ಕೆ ಬದಲಾಗಿ ನನ್ನ ತಮ್ಮನ ಹೊಲದ ಪಕ್ಕದಲ್ಲಿ ಗೇಟು ಅಲ್ಲ, ರೈತ ಇರ್ತಾನೆ. ನಾಳೆ ಅವನ ದನ ಆ ಬದುವಿನ ಮೇಲೆ ಮೇದ್ರೆ ಯಾರೂ ವಾಚ್‌ಮನ್ ಕಳಿಸಲ್ಲ. ಆ ಬೆಲೆ ನಾನೇ ತೀರ್ಮಾನ ಮಾಡಿದ್ದು.
    tr: Ā vyatyāsa nanna pālinda hōgiddu, Man̄junāth avarē — sumāru aidu lakṣa. Adakke badalāgi nanna tammana holada pakkadalli gēṭu alla, raita irtāne. Nāḷe avana dana ā baduvina mēle mēdre yārū vāc-man kaḷisalla. Ā bele nānē tīrmāna māḍiddu.
    en: That difference came out of my share, Mr Manjunath — about five lakh. In return, next to my brother's land there'll be a farmer, not a gate. If his cattle graze on that bund tomorrow, nobody will send a watchman. I chose that price myself.
  - who: broker
    t: … ಸರಿ ಮೇಡಂ. ನನ್ನ ಇಪ್ಪತ್ತು ವರ್ಷದ ವ್ಯಾಪಾರದಲ್ಲಿ ಕಮ್ಮಿ ಬೆಲೆಗೆ ಖುಷಿಯಾಗಿ ಮಾರಿದ ಮೊದಲ ಪಾರ್ಟಿ ನೀವು. ತಗೊಳ್ಳಿ, ಸಕ್ಕರೆ ಅಚ್ಚು. ವ್ಯಾಪಾರ ಇಲ್ದಿದ್ರೂ ಸಂಕ್ರಾಂತಿ ಇದೆಯಲ್ಲ.
    tr: … Sari mēḍam. Nanna ippattu varṣada vyāpāradalli kammi belege khuṣiyāgi mārida modala pārṭi nīvu. Tagoḷḷi, sakkare accu. Vyāpāra ildidrū Saṅkrānti ideyalla.
    en: (after a pause) … All right, madam. In twenty years of business, you're the first party I've seen sell happily for less. Here, have the sugar figurines. Even without a deal, it's still Sankranti.
  - who: avva
    t: ಬಾ ಮಂಜುನಾಥ, ಕಾಫಿ ಕುಡಿದು ಹೋಗು. ಎಳ್ಳು-ಬೆಲ್ಲ ತಿಂದು ಒಳ್ಳೆ ಮಾತಾಡು — ಇವತ್ತು ರೇಟಿನ ಮಾತು ಬೇಡ.
    tr: Bā Man̄junātha, kāphi kuḍidu hōgu. Eḷḷu-bella tindu oḷḷe mātāḍu — ivattu rēṭina mātu bēḍa.
    en: Come, Manjunatha, have coffee before you go. Eat ellu-bella and speak sweetly — no talk of rates today.
  - section: Under the tamarind tree
    learn: 'a father''s reflection: prāmāṇikavāgi hēḷtīni, manassu allāḍitu · paradox: kelavu āstigaḷanna han̄cidre kammi āgutte, kelavanna biṭṭukoṭre jāsti āgutte · the diary reinterpreted: makkaḷigāgi jamīnu, jamīnigāgi makkaḷalla · a banker''s metaphor: idakkinta doḍḍa baḍḍi yāva byāṅkū koḍalla · three rules to remember: heṇṇumakkaḷa hesaru, bevarina bele, modalu aṅgaḷakke'
  - scene: Evening. Suresh and Rakshith walk out along the cart track to the dry field. The ragi stubble is pale gold; a new boundary stone, still bright with fresh-cut edges, stands twenty feet from the tamarind tree. Under the tree is Thatha's grave.
  - who: rakshith
    t: ಅಪ್ಪ, ಅಲ್ಲಿ ನೋಡು — ಹೊಸ ಗಡಿ ಕಲ್ಲು. ಮರದಿಂದ ಇಪ್ಪತ್ತು ಅಡಿ. ಅಜ್ಜಿ ಹೇಳಿದ ಹಾಗೇ.
    tr: Appa, alli nōḍu — hosa gaḍi kallu. Maradinda ippattu aḍi. Ajji hēḷida hāgē.
    en: Appa, look there — the new boundary stone. Twenty feet from the tree. Just as Ajji said.
  - who: suresh
    t: ಹೂಂ. ಒಂದು ಕಲ್ಲು, ಒಂದು ವರ್ಷ. … ಎಳ್ಳು-ಬೆಲ್ಲ ಇಲ್ಲಿಡು, ಸಮಾಧಿ ಮೇಲೆ. ತಾತನಿಗೂ ಒಂದು ಪಾಲು.
    tr: Hūṁ. Ondu kallu, ondu varṣa. … Eḷḷu-bella illiḍu, samādhi mēle. Tātanigū ondu pālu.
    en: Hm. One stone, one year. … Put the ellu-bella here, on the grave. A share for Thatha too.
  - who: rakshith
    t: ಅಪ್ಪ, ಒಂದು ಪ್ರಶ್ನೆ ಕೇಳ್ಲಾ? ನೀನು ನಿನ್ನ ಪಾಲು ಬಿಟ್ಟಿದ್ದಕ್ಕೆ ಯಾವತ್ತಾದ್ರೂ ಪಶ್ಚಾತ್ತಾಪ ಆಗುತ್ತಾ? ಆ ಬ್ರೋಕರ್ ಹೇಳಿದ ಎಪ್ಪತ್ತು ಲಕ್ಷ… ನಮ್ಮ ಮನೆ ಸಾಲ ಒಂದೇ ದಿನದಲ್ಲಿ ಮುಗೀತಿತ್ತು.
    tr: Appa, ondu praśne kēḷlā? Nīnu ninna pālu biṭṭiddakke yāvattādrū paścāttāpa āguttā? Ā brōkar hēḷida eppattu lakṣa… namma mane sāla ondē dinadalli mugītittu.
    en: Appa, can I ask you something? Will you ever regret giving up your share? The seventy lakh that broker talked about… our house loan would have been gone in a single day.
  - who: suresh
    t: ಪ್ರಾಮಾಣಿಕವಾಗಿ ಹೇಳ್ತೀನಿ, ಕಂದ. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಆ ಅಂಕಿ ಕೇಳಿದಾಗ ನನ್ನ ಮನಸ್ಸೂ ಒಂದು ಕ್ಷಣ ಅಲ್ಲಾಡಿತು. ಮನುಷ್ಯ ಅಂದ್ಮೇಲೆ ಆಸೆ ಇರುತ್ತೆ. ಆದ್ರೆ ಈ ವರ್ಷ ನಾನು ಒಂದು ಲೆಕ್ಕ ಕಲಿತೆ — ಬ್ಯಾಂಕಲ್ಲಿ ಇಪ್ಪತ್ತು ವರ್ಷ ಕೆಲಸ ಮಾಡಿದ್ರೂ ಕಲಿಯದ ಲೆಕ್ಕ. ಕೆಲವು ಆಸ್ತಿಗಳನ್ನ ಹಂಚಿದ್ರೆ ಕಮ್ಮಿ ಆಗುತ್ತೆ. ಕೆಲವನ್ನ ಬಿಟ್ಟುಕೊಟ್ರೆ ಜಾಸ್ತಿ ಆಗುತ್ತೆ.
    tr: Prāmāṇikavāgi hēḷtīni, kanda. Mārc-nalli ā aṅki kēḷidāga nanna manassū ondu kṣaṇa allāḍitu. Manuṣya andmēle āse irutte. Ādre ī varṣa nānu ondu lekka kalite — byāṅkalli ippattu varṣa kelasa māḍidrū kaliyada lekka. Kelavu āstigaḷanna han̄cidre kammi āgutte. Kelavanna biṭṭukoṭre jāsti āgutte.
    en: I'll tell you honestly, son. In March, when I heard that figure, my mind wavered for a moment too. We're human; there's always desire. But this year I learnt a kind of arithmetic — one that twenty years in a bank never taught me. Some wealth shrinks when you divide it. Some grows when you give it away.
  - who: rakshith
    t: ಅಂದ್ರೆ?
    tr: Andre?
    en: Meaning?
  - who: suresh
    t: ನೋಡು. ನಾನು ಆ ಒಂದೂಕಾಲು ಎಕರೆ ಇಟ್ಕೊಂಡಿದ್ರೆ ನನ್ನ ಹೆಸರಲ್ಲಿ ಒಂದು ಪಹಣಿ ಇರ್ತಿತ್ತು. ಬಿಟ್ಟುಕೊಟ್ಟೆ — ಈಗ ನನಗೆ ಮತ್ತೆ ಒಬ್ಬ ತಮ್ಮ ಇದಾನೆ, ಒಬ್ಬ ತಂಗಿ ಇದಾಳೆ, ನಿನಗೆ ಒಂದು ಊರು ಇದೆ, ಅವ್ವನಿಗೆ ನೆಮ್ಮದಿ ಇದೆ. ಯಾವ ಉಪನೋಂದಣಾಧಿಕಾರಿಯೂ ಇದನ್ನ ನೋಂದಣಿ ಮಾಡಲ್ಲ. ಆದ್ರೆ ನಿಜವಾದ ಆಸ್ತಿ ಇದೇ.
    tr: Nōḍu. Nānu ā ondūkālu ekare iṭkoṇḍidre nanna hesaralli ondu pahaṇi irtittu. Biṭṭukoṭṭe — īga nanage matte obba tamma idāne, obba taṅgi idāḷe, ninage ondu ūru ide, avvanige nemmadi ide. Yāva upanōndaṇādhikāriyū idanna nōndaṇi māḍalla. Ādre nijavāda āsti idē.
    en: Look. If I'd kept that one and a quarter acres, there'd be an RTC in my name. I gave it up — and now I have a brother again, and a sister; you have a village; Avva has peace of mind. No Sub-Registrar will ever register that. But that is the real property.
  - who: rakshith
    t: ತಾತ ‘ಜಮೀನು ಮಾರಲ್ಲ’ ಅಂತ ಬರೆದಿದ್ರು. ಈಗ ಒಂದೂಕಾಲು ಎಕರೆ ಮಾರ್ತಿದೀವಿ. ತಾತನಿಗೆ ಬೇಜಾರಾಗಲ್ವಾ?
    tr: Tāta ‘jamīnu māralla’ anta baredidru. Īga ondūkālu ekare mārtidīvi. Tātanige bējārāgalvā?
    en: Thatha wrote 'I will not sell the land'. Now we're selling one and a quarter acres. Wouldn't Thatha be upset?
  - who: suresh
    t: ನಾನೂ ಅದನ್ನೇ ಯೋಚನೆ ಮಾಡಿದೆ. ಆಮೇಲೆ ದಿನಚರಿಯ ಇನ್ನೊಂದು ಪುಟ ನೆನಪಾಯ್ತು — ‘ಮಗಳು ಸಂತೋಷವಾಗಿ ಗಂಡನ ಮನೆಗೆ ಹೋದ್ಲು. ಸಾಲ ಮೂರು ವರ್ಷದಲ್ಲಿ ತೀರಿಸ್ತೀನಿ.’ ತಾತ ಜಮೀನು ಉಳಿಸಿದ್ದು ಮಕ್ಕಳಿಗಾಗಿ — ಜಮೀನಿಗಾಗಿ ಮಕ್ಕಳನ್ನ ಕಳ್ಕೊಳ್ಳೋಕೆ ಅಲ್ಲ. ಆ ವ್ಯತ್ಯಾಸ ಅರ್ಥ ಆಗೋಕೆ ನನಗೆ ನಲವತ್ತೈದು ವರ್ಷ ಬೇಕಾಯ್ತು.
    tr: Nānū adannē yōcane māḍide. Āmēle dinacariya innondu puṭa nenapāytu — ‘Magaḷu santōṣavāgi gaṇḍana manege hōdlu. Sāla mūru varṣadalli tīristīni.’ Tāta jamīnu uḷisiddu makkaḷigāgi — jamīnigāgi makkaḷanna kaḷkoḷḷōke alla. Ā vyatyāsa artha āgōke nanage nalavattaidu varṣa bēkāytu.
    en: 'I wondered the same thing. Then I remembered another page of the diary: ''My daughter went happily to her husband''s home. I will clear the debt in three years.'' Thatha kept the land for his children — not to lose his children for the sake of the land. It took me forty-five years to understand that difference.'
  - who: rakshith
    t: ಅಪ್ಪ, ನಾನು ಕೃಷಿ ಓದ್ಬೇಕು ಅಂತಿದೀನಿ. ಚಿಕ್ಕಪ್ಪನಿಗೆ ಮೊದಲು ಹೇಳ್ದೆ. ನಿನಗೆ ಬೇಜಾರಾಯ್ತಾ — ಇಂಜಿನಿಯರಿಂಗ್ ಅಲ್ಲ ಅಂತ?
    tr: Appa, nānu kṛṣi ōdbēku antidīni. Cikkappanige modalu hēḷde. Ninage bējārāytā — iñjiniyariṅg alla anta?
    en: Appa, I want to study agriculture. I told Chikkappa first. Are you upset — that it isn't engineering?
  - who: suresh
    t: ಬೇಜಾರಾ? … ಸುಮಾರು ಮೂವತ್ತು ವರ್ಷದ ಹಿಂದೆ ನಿಮ್ಮ ತಾತ ಎತ್ತು ಮಾರಿ ನನ್ನನ್ನ ಈ ಊರಿಂದ ಹೊರಗೆ ಓದೋಕೆ ಕಳಿಸಿದ್ರು. ಇವತ್ತು ನನ್ನ ಮಗ ಅದೇ ಊರಿಗೆ ವಾಪಸ್ ಬರೋ ದಾರಿ ಹುಡುಕ್ತಿದಾನೆ. ಇದಕ್ಕಿಂತ ದೊಡ್ಡ ಬಡ್ಡಿ ಯಾವ ಬ್ಯಾಂಕೂ ಕೊಡಲ್ಲ, ಕಂದ.
    tr: Bējārā? … Sumāru mūvattu varṣada hinde nimma tāta ettu māri nannanna ī ūrinda horage ōdōke kaḷisidru. Ivattu nanna maga adē ūrige vāpas barō dāri huḍuktidāne. Idakkinta doḍḍa baḍḍi yāva byāṅkū koḍalla, kanda.
    en: Upset? … Nearly thirty years ago your Thatha sold his bullocks to send me out of this village to study. Today my son is looking for the road back to the same village. No bank pays a bigger interest than that, son.
  - who: suresh
    t: 'ಕೇಳು, ರಕ್ಷಿತ್. ಒಂದು ದಿನ ನಾನೂ ಇರಲ್ಲ, ನಿಮ್ಮ ಚಿಕ್ಕಪ್ಪನೂ ಇರಲ್ಲ. ಆಗ ಯಾರಾದ್ರೂ ಕಾಗದ ಹಿಡ್ಕೊಂಡು ‘ಇದು ನನ್ನ ಪಾಲು’ ಅಂತ ಬರ್ತಾರೆ — ಅದು ಸಹಜ, ಕಾನೂನು ಕೊಟ್ಟಿರೋ ಹಕ್ಕು. ಆ ದಿನ ಮೂರು ವಿಷಯ ನೆನಪಿಟ್ಕೋ. ಒಂದು: ಹೆಣ್ಣುಮಕ್ಕಳ ಹೆಸರು ಯಾವ ಕಾಗದದಿಂದಲೂ ಬಿಟ್ಟು ಹೋಗಬಾರದು. ಎರಡು: ಮಣ್ಣಲ್ಲಿ ದುಡಿದವನ ಬೆವರಿಗೂ ಒಂದು ಬೆಲೆ ಇದೆ, ಅದು ಯಾವ ಮಾರ್ಗಸೂಚಿ ಬೆಲೆಯಲ್ಲೂ ಇರಲ್ಲ. ಮೂರು: ಮೊದಲು ಕೋರ್ಟಿಗಲ್ಲ, ಅಂಗಳಕ್ಕೆ ಹೋಗು. ಎಲೆ ಹಾಕು, ಎಲ್ಲರನ್ನೂ ಕೂರಿಸು, ಆಮೇಲೆ ಮಾತಾಡು.'
    tr: 'Kēḷu, Rakṣit. Ondu dina nānū iralla, nimma cikkappanū iralla. Āga yārādrū kāgada hiḍkoṇḍu ‘idu nanna pālu’ anta bartāre — adu sahaja, kānūnu koṭṭirō hakku. Ā dina mūru viṣaya nenapiṭkō. Ondu: heṇṇumakkaḷa hesaru yāva kāgadadindalū biṭṭu hōgabāradu. Eraḍu: maṇṇalli duḍidavana bevarigū ondu bele ide, adu yāva mārgasūci beleyallū iralla. Mūru: modalu kōrṭigalla, aṅgaḷakke hōgu. Ele hāku, ellarannū kūrisu, āmēle mātāḍu.'
    en: 'Listen, Rakshith. One day I won''t be here, and nor will your Chikkappa. Then someone will come holding a paper and saying ''this is my share'' — that''s natural; it''s a right the law has given. On that day, remember three things. One: no daughter''s name must ever be left off any paper. Two: the sweat of the one who toiled in the soil has a value too, and you won''t find it in any guidance value. Three: go first not to the court, but to the yard. Lay the leaves, sit everyone down, and then talk.'
  - who: rakshith
    t: ಮೂರನೇದು ಅಜ್ಜಿಯ ಕಾನೂನು.
    tr: Mūranēdu ajjiya kānūnu.
    en: The third one is Ajji's law.
  - who: suresh
    t: ಹೌದು. ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಅದೇ ಸುಪ್ರೀಂ ಕೋರ್ಟು. … ನಡಿ, ಕತ್ತಲಾಗ್ತಿದೆ. ಕಾವೇರಿಗೆ ಹುಲ್ಲು ಹಾಕೋ ಸಮಯ. ನಾಳೆ ಬೆಂಗಳೂರಿಗೆ ಹೊರಡೋ ಮುಂಚೆ ಒಂದ್ಸಲ ಗದ್ದೆಗೆ ಹೋಗಿ ಬರೋಣ — ಮಹದೇವ ಹೊಸ ಕೂಳೆಗೆ ನೀರು ಕಟ್ಟಬೇಕಂತೆ.
    tr: Haudu. Namma maneyalli adē suprīm kōrṭu. … Naḍi, kattalāgtide. Kāvērige hullu hākō samaya. Nāḷe Beṅgaḷūrige horaḍō mun̄ce ondsala gaddege hōgi barōṇa — Mahadēva hosa kūḷege nīru kaṭṭabēkante.
    en: Yes. In our house, that's the Supreme Court. … Come on, it's getting dark. Time to give Kaveri her hay. Tomorrow, before we leave for Bengaluru, let's go to the wet land once — Mahadeva says the new ratoon needs watering.
  - scene: They walk back along the cart track as the sun sets over the cane. Behind them, on the grave under the tamarind tree, lies a small heap of ellu-bella. Ahead, in the yard, Avva has lit the lamp before Thatha's photograph; Shobha and Mahadeva are arguing cheerfully over how much sugar goes in the coffee.
  - who: avva
    t: ಬಂದ್ರಾ? ಕೈಕಾಲು ತೊಳ್ಕೊಂಡು ಬನ್ನಿ, ಎಲ್ರೂ ಒಟ್ಟಿಗೆ ಕಾಫಿ ಕುಡಿಯೋಣ. … ನೋಡಿ — ಒಂದು ವರ್ಷದ ಮೇಲೆ ಈ ಮನೆ ಮತ್ತೆ ತುಂಬಿದೆ.
    tr: Bandrā? Kaikālu toḷkoṇḍu banni, ellrū oṭṭige kāphi kuḍiyōṇa. … Nōḍi — ondu varṣada mēle ī mane matte tumbide.
    en: You're back? Wash your hands and feet and come; let's all have coffee together. … Look — after a whole year, this house is full again.
