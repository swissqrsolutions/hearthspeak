  - who: landlord
    t: 'ನಾನು ಮಾಡಿಸ್ತೀನಿ: ಹಿಂದಿನ ಗೋಡೆಯಲ್ಲಿ ತೇವ ಇದೆ, ಅದನ್ನ ಸರಿ ಮಾಡಿಸ್ತೀನಿ. ಮೇನ್ ಲೈನ್ ತನಕ ಹೊಸ ಡ್ರೈನೇಜ್ ಪೈಪ್ ಹಾಕಿಸ್ತೀನಿ. ತ್ರೀ-ಫೇಸ್‌ಗೆ ಬೆಸ್ಕಾಂಗೆ ನನ್ನ ಹೆಸರಲ್ಲಿ ಅಪ್ಲೈ ಮಾಡ್ತೀನಿ, ಡೆಪಾಸಿಟ್ ನೀವು ಕಟ್ಟಿ. ಒಳಗಿನ ಕೆಲಸ ಎಲ್ಲಾ ನಿಮ್ದು: ಟೈಲ್ಸ್, ಕೌಂಟರ್, ಚಿಮಣಿ, ಗ್ರೀಸ್ ಟ್ರ್ಯಾಪ್, ಬೋರ್ಡ್. ಗೋಡೆ ಒಡೆಯೋದಾದ್ರೆ ಮೊದಲು ನನ್ನನ್ನ ಕೇಳಿ.'
    tr: 'Nānu māḍistīni: hindina gōḍeyalli tēva ide, adanna sari māḍistīni. Mēn lain tanaka hosa ḍrainēj paip hākistīni. Trī-phēs-ge Beskāṅge nanna hesaralli aplai māḍtīni, ḍepāsiṭ nīvu kaṭṭi. Oḷagina kelasa ellā nimdu: ṭails, kauṇṭar, chimaṇi, grīs ṭryāp, bōrḍ. Gōḍe oḍeyōdādre modalu nannanna kēḷi.'
    en: 'I''ll get these done: the back wall is damp, I''ll have it fixed. I''ll have a new drainage pipe laid up to the main line. I''ll apply to BESCOM for three-phase in my name, and you pay the deposit. All the inside work is yours: tiles, counters, chimney, grease trap, signboard. If any wall needs breaking, ask me first.'
  - who: mahesh
    t: ಕರೆಂಟ್ ಬಿಲ್, ನೀರಿನ ಬಿಲ್?
    tr: Karaṇṭ bil, nīrina bil?
    en: Electricity bill, water bill?
  - who: landlord
    t: ಅಂಗಡಿಗೆ ಬೇರೆ ಮೀಟರ್ ಇದೆ, ಆ ಬಿಲ್ ನೀವೇ ಕಟ್ಟಿ. ನೀರಿಗೆ ಬೇರೆ ಮೀಟರ್ ಇಲ್ಲ. ಹೋಟೆಲ್ ನೀರು ಜಾಸ್ತಿ ಬಳಸುತ್ತೆ, ಅದಕ್ಕೆ ತಿಂಗಳಿಗೆ ಒಂದು ಫಿಕ್ಸ್‌ಡ್ ಅಮೌಂಟ್ ಮಾಡೋಣ, ಮೂರು ಸಾವಿರ. ಪ್ರಾಪರ್ಟಿ ಟ್ಯಾಕ್ಸ್ ನನ್ನದು.
    tr: Aṅgaḍige bēre mīṭar ide, ā bil nīvē kaṭṭi. Nīrige bēre mīṭar illa. Hōṭel nīru jāsti baḷasutte, adakke tingaḷige ondu phiksḍ amauṇṭ māḍōṇa, mūru sāvira. Prāparṭi ṭyāks nannadu.
    en: 'The shop has its own meter; you pay that bill. There''s no separate water meter. A hotel uses a lot of water, so let''s fix an amount per month: three thousand. Property tax is mine.'
  - who: mahesh
    t: 'ಸರಿ ಸಾರ್. ಕೊನೆಯದು: ಮುಂದೆ ಬೋರ್ಡ್. ಕನ್ನಡ ದೊಡ್ಡದಾಗಿ ಇರ್ಬೇಕು, ಅರವತ್ತು ಪರ್ಸೆಂಟ್ ಅಂತ ರೂಲ್ ಇದೆ. ಅದಕ್ಕೆ ಸಾಕಷ್ಟು ಜಾಗ ಬೇಕು.'
    tr: 'Sari sār. Koneyadu: munde bōrḍ. Kannaḍa doḍḍadāgi irbēku, aravattu parsenṭ anta rūl ide. Adakke sākaṣṭu jāga bēku.'
    en: 'All right, sir. Last thing: the board in front. The Kannada has to be big; there''s a sixty-percent rule. I''ll need enough space for it.'
  - who: landlord
    t: ಕನ್ನಡ ಬೋರ್ಡ್‌ಗೆ ನಾನು ಯಾವತ್ತೂ ಬೇಡ ಅನ್ನಲ್ಲ. ಆದ್ರೆ ನನ್ನ ಬಾಲ್ಕನಿ ಮುಚ್ಚೋ ಹಾಗೆ ಬೇಡ. ಸರಿ ಪ್ರಕಾಶ್, ಎಲ್ಲಾ ಸೇರಿಸಿ ಒಂದ್ಸಲ ಹೇಳು.
    tr: Kannaḍa bōrḍ-ge nānu yāvattū bēḍa annalla. Ādre nanna bālkani mucchō hāge bēḍa. Sari Prakāś, ellā sērisi ondsala hēḷu.
    en: I'll never say no to a Kannada board. Just don't cover my balcony. All right, Prakash, put it all together and say it once.
  - who: broker
    t: ಹೇಳ್ತೀನಿ ಸಾರ್. ರೆಂಟ್ ತಿಂಗಳಿಗೆ ಒಂದು ಲಕ್ಷ, ಜನವರಿ ಒಂದರಿಂದ. ಡಿಸೆಂಬರ್ ಫಿಟ್-ಔಟ್‌ಗೆ ಫ್ರೀ. ಅಡ್ವಾನ್ಸ್ ಏಳು ಲಕ್ಷ, ಬಡ್ಡಿ ಇಲ್ಲ, ಖಾಲಿ ಮಾಡುವಾಗ ರಿಪೇರಿ ಖರ್ಚು ಕಳೆದು ವಾಪಸ್. ಮೂರು ವರ್ಷದ ರಿಜಿಸ್ಟರ್ಡ್ ಲೀಸ್, ಹದಿನೆಂಟು ತಿಂಗಳ ಲಾಕ್-ಇನ್, ಆಮೇಲೆ ಮೂರು ತಿಂಗಳ ನೋಟಿಸ್. ವರ್ಷಕ್ಕೆ ಐದು ಪರ್ಸೆಂಟ್ ಏರಿಕೆ. ಪ್ಯೂರ್ ವೆಜ್, ರಾತ್ರಿ ಹತ್ತೂವರೆಗೆ ಕ್ಲೋಸ್.
    tr: Hēḷtīni sār. Renṭ tingaḷige ondu lakṣa, Janavari ondarinda. Ḍisembar phiṭ-auṭ-ge phrī. Aḍvāns ēḷu lakṣa, baḍḍi illa, khāli māḍuvāga ripēri kharchu kaḷedu vāpas. Mūru varṣada rijisṭarḍ līs, hadineṇṭu tingaḷa lāk-in, āmēle mūru tingaḷa nōṭis. Varṣakke aidu parsenṭ ērike. Pyūr vej, rātri hattūvarege klōs.
    en: Here it is, sir. Rent one lakh a month from the first of January. December free for the fit-out. Advance seven lakh, interest-free, returned on vacating minus any repair costs. A three-year registered lease, eighteen-month lock-in, then three months' notice. Five percent increase a year. Pure veg, closed by ten-thirty at night.
  - who: landlord
    t: ಸರಿ. ಟೋಕನ್ ಅಡ್ವಾನ್ಸ್ ಎಷ್ಟು ಕೊಡ್ತೀರಿ?
    tr: Sari. Ṭōkan aḍvāns eṣṭu koḍtīri?
    en: Fine. How much token advance will you give?
  - who: mahesh
    t: ಒಂದು ಲಕ್ಷ ಸಾರ್, ಈಗಲೇ, ಬ್ಯಾಂಕ್ ಟ್ರಾನ್ಸ್‌ಫರ್‌ನಲ್ಲಿ. ಕ್ಯಾಶ್ ಬೇಡ, ಎಲ್ಲಾ ದಾಖಲೆ ಇರ್ಲಿ. ಉಳಿದ ಆರು ಲಕ್ಷ ರಿಜಿಸ್ಟ್ರೇಷನ್ ದಿನ. ಟೋಕನ್‌ಗೆ ಒಂದು ರಶೀದಿ ಕೊಡಿ ಸಾರ್.
    tr: Ondu lakṣa sār, īgalē, byāṅk ṭrānsphar-nalli. Kyāś bēḍa, ellā dākhale irli. Uḷida āru lakṣa rijisṭrēṣan dina. Ṭōkan-ge ondu raśīdi koḍi sār.
    en: One lakh, sir, right now, by bank transfer. No cash; let there be a record of everything. The remaining six lakh on the day of registration. Please give me a receipt for the token, sir.
  - who: landlord
    t: ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಹತ್ರಾನೇ ರಶೀದಿ ಕೇಳ್ತಿದೀಯ! ಒಳ್ಳೇದು, ನನಗೆ ಇಷ್ಟ ಆಯ್ತು. ಕೊಡ್ತೀನಿ, ಇಲ್ಲಿ ಸಹಿ ಹಾಕಿ.
    tr: Byāṅk myānējar hatrānē raśīdi kēḷtidīya! Oḷḷēdu, nanage iṣṭa āytu. Koḍtīni, illi sahi hāki.
    en: You're asking a bank manager for a receipt! Good, I like that. I'll give you one; sign here.
  - who: broker
    t: ಮತ್ತೆ ನನ್ನ ಕಮಿಷನ್, ಮಹೇಶ್ ಅವರೇ. ರಿಜಿಸ್ಟ್ರೇಷನ್ ದಿನ, ಒಂದು ತಿಂಗಳ ರೆಂಟ್.
    tr: Matte nanna kamiṣan, Mahēś avarē. Rijisṭrēṣan dina, ondu tingaḷa renṭ.
    en: 'And my commission, Mahesh. On registration day: one month''s rent.'
  - who: mahesh
    t: ನೀವು ಓನರ್ ಕಡೆಯಿಂದಾನೂ ತಗೊಳ್ತೀರಿ ಅಂತ ನನಗೆ ಗೊತ್ತು. ನನ್ನ ಕಡೆಯಿಂದ ಅರ್ಧ ತಿಂಗಳು, ಐವತ್ತು ಸಾವಿರ. “ಮೊಬೈಲ್ ಅಂಗಡಿ ಪಾರ್ಟಿ” ಕಥೆಗೆ ಡಿಸ್ಕೌಂಟ್.
    tr: Nīvu ōnar kaḍeyindānū tagoḷtīri anta nanage gottu. Nanna kaḍeyinda ardha tingaḷu, aivattu sāvira. “Mobail aṅgaḍi pārṭi” kathege ḍiskauṇṭ.
    en: 'I know you''re taking commission from the owner''s side as well. From my side, half a month: fifty thousand. A discount for the “mobile-shop party” story.'
  - who: broker
    t: ಅಯ್ಯೋ… ಸರಿ, ಸರಿ. ಉಡುಪಿಯವರ ಹತ್ರ ಗೆಲ್ಲೋಕಾಗಲ್ಲ.
    tr: Ayyō… sari, sari. Uḍupiyavara hatra gellōkāgalla.
    en: Ayyo… fine, fine. You can't win against an Udupi man.
  - section: Reading the lease, registering it
    learn: 'documents: līs ḍīḍ, ḍrāphṭ, sṭyāmp ḍyūṭi, chalan, raśīdi · causatives: badalāyisu, sērisu · reported speech: “… badalāyisi” andru · deadlines and dates'
  - scene: Two weeks later. The lawyer has sent the draft lease. Kavya has read every clause twice with a red pen.
  - who: kavya
    t: ಡ್ರಾಫ್ಟ್ ಪೂರ್ತಿ ಓದಿದೆ. ಎರಡು ತಪ್ಪು ಇದೆ. ಲಾಕ್-ಇನ್‌ನಲ್ಲಿ “ಬಾಡಿಗೆದಾರ ಮಾತ್ರ” ಅಂತ ಬರೆದಿದೆ. ಹಾಗಾದ್ರೆ ಓನರ್ ಯಾವಾಗ ಬೇಕಾದ್ರೂ ಕಳಿಸಬಹುದು. “ಎರಡೂ ಕಡೆ” ಅಂತ ಬದಲಾಯಿಸ್ಬೇಕು.
    tr: Ḍrāphṭ pūrti ōdide. Eraḍu tappu ide. Lāk-in-nalli “bāḍigedāra mātra” anta baredide. Hāgādre ōnar yāvāga bēkādrū kaḷisabahudu. “Eraḍū kaḍe” anta badalāyisbēku.
    en: I've read the whole draft. There are two mistakes. Under lock-in it says “tenant only”. That means the owner could send us away whenever he likes. It has to be changed to “both parties”.
  - who: mahesh
    t: ಎರಡನೇದು?
    tr: Eraḍanēdu?
    en: And the second?
  - who: kavya
    t: ಅಡ್ವಾನ್ಸ್ ಯಾವಾಗ ವಾಪಸ್ ಅಂತ ಇಲ್ಲ. “ಖಾಲಿ ಮಾಡಿದ ಮೂವತ್ತು ದಿನದೊಳಗೆ, ರಿಪೇರಿ ಖರ್ಚು ಬಿಲ್ ಸಮೇತ ಕಳೆದು” ಅಂತ ಸೇರಿಸ್ಬೇಕು. ಇಲ್ಲಾಂದ್ರೆ ವರ್ಷಗಟ್ಟಲೆ ಕಾಯ್ಬೇಕಾಗುತ್ತೆ. ಮತ್ತೆ ಲೀಸ್ ಫರ್ಮ್ ಹೆಸರಲ್ಲಿ ಇರ್ಬೇಕು, ನಿನ್ನ ಹೆಸರಲ್ಲಿ ಅಲ್ಲ. ಬ್ಯಾಂಕ್ ಅದನ್ನೇ ಕೇಳುತ್ತೆ.
    tr: Aḍvāns yāvāga vāpas anta illa. “Khāli māḍida mūvattu dinadoḷage, ripēri kharchu bil samēta kaḷedu” anta sērisbēku. Illāndre varṣagaṭṭale kāybēkāgutte. Matte līs pharm hesaralli irbēku, ninna hesaralli alla. Byāṅk adannē kēḷutte.
    en: 'It doesn''t say when the advance comes back. We need to add: “within thirty days of vacating, after deducting repair costs with bills.” Otherwise we could be waiting for years. And the lease has to be in the firm''s name, not yours. That''s what the bank will ask for.'
  - who: mahesh
    t: ವೆಂಕಟೇಶ ಮೂರ್ತಿ ಅವರು ಒಪ್ತಾರಾ?
    tr: Veṅkaṭēśa Mūrti avaru optārā?
    en: Will Mr. Murthy agree?
  - who: kavya
    t: ನಿನ್ನೆ ಫೋನ್ ಮಾಡಿದ್ದೆ. “ಸರಿಯಾಗಿ ಓದಿದೀರಿ, ಬದಲಾಯಿಸಿ” ಅಂದ್ರು. ರಿಟೈರ್ಡ್ ಬ್ಯಾಂಕರ್‌ಗೆ ಪೇಪರ್ ಓದೋರು ಅಂದ್ರೆ ಇಷ್ಟ.
    tr: Ninne phōn māḍidde. “Sariyāgi ōdidīri, badalāyisi” andru. Riṭairḍ byāṅkar-ge pēpar ōdōru andre iṣṭa.
    en: I called him yesterday. He said, “You've read it properly; change it.” A retired banker likes people who read their papers.
  - scene: Friday, 28 November 2025. The Sub-Registrar office in Jayanagar. Mahesh, Kavya, Mr. Murthy and two witnesses on a bench, waiting for their number to be called.
  - who: landlord
    t: ಸ್ಟ್ಯಾಂಪ್ ಡ್ಯೂಟಿ, ರಿಜಿಸ್ಟ್ರೇಷನ್ ಫೀಸ್ ಎಲ್ಲಾ ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ಕಟ್ಟಿದ್ರಾ?
    tr: Sṭyāmp ḍyūṭi, rijisṭrēṣan phīs ellā ān-lain-nallē kaṭṭidrā?
    en: Did you pay the stamp duty and registration fee online?
  - who: mahesh
    t: ಹೌದು ಸಾರ್. ಲಾಯರ್ ಲೆಕ್ಕ ಹಾಕಿದ್ರು. ರೆಂಟ್, ಅಡ್ವಾನ್ಸ್ ಮೇಲೆ ಪರ್ಸೆಂಟೇಜ್ ಲೆಕ್ಕ ಅಂತೆ. ಎಲ್ಲಾ ಸೇರಿ ಸುಮಾರು ನಲವತ್ತು ಸಾವಿರ ಆಯ್ತು. ಕರೆಕ್ಟ್ ಅಮೌಂಟ್ ಚಲನ್‌ನಲ್ಲಿ ಇದೆ.
    tr: Haudu sār. Lāyar lekka hākidru. Renṭ, aḍvāns mēle parsenṭēj lekka ante. Ellā sēri sumāru nalavattu sāvira āytu. Karekṭ amauṇṭ chalan-nalli ide.
    en: Yes, sir. The lawyer worked it out. Apparently it's a percentage of the rent and the advance. All together it came to about forty thousand. The exact amount is on the challan.
  - who: landlord
    t: ನಲವತ್ತು ಸಾವಿರ ಉಳಿಸೋಕೆ ಜನ ಹನ್ನೊಂದು ತಿಂಗಳ ಅಗ್ರಿಮೆಂಟ್ ಮಾಡ್ತಾರೆ, ಆಮೇಲೆ ಕೋರ್ಟ್‌ಗೆ ಲಕ್ಷ ಲಕ್ಷ ಕೊಡ್ತಾರೆ. ನೀವು ಮಾಡಿದ್ದು ಸರಿ.
    tr: Nalavattu sāvira uḷisōke jana hannondu tingaḷa agrimeṇṭ māḍtāre, āmēle kōrṭ-ge lakṣa lakṣa koḍtāre. Nīvu māḍiddu sari.
    en: To save forty thousand, people do eleven-month agreements, and then pay lakhs and lakhs in court. You did the right thing.
  - who: mahesh
    t: ನಿಮ್ಮಂಥವರ ಹತ್ರಾನೇ ಕಲಿತದ್ದು ಸಾರ್.
    tr: Nimmanthavara hatrānē kalitaddu sār.
    en: I learnt it from people like you, sir.
  - scene: Their number is called. Photos, thumbprints, signatures. Twenty minutes later it is done. On the steps outside, Mr. Murthy takes a bunch of keys from his pocket.
  - who: landlord
    t: 'ಇಗೋ, ಕೀ. ಡಿಸೆಂಬರ್ ಒಂದರಿಂದ ಜಾಗ ನಿಮ್ದು. ಒಂದು ಮಾತು, ಮಹೇಶ್: ಬೆಳಗ್ಗೆ ಮೊದಲ ಕಾಫಿ ನನಗೆ. ಆದ್ರೆ ದುಡ್ಡು ಕೊಟ್ಟೇ ಕುಡೀತೀನಿ. ಓನರ್‌ಗೆ ಅಂತ ಬಿಟ್ಟಿ ಕಾಫಿ ಕೊಡೋಕೆ ಶುರು ಮಾಡಿದ್ರೆ ಬಿಸಿನೆಸ್ ಉಳಿಯಲ್ಲ.'
    tr: 'Igō, kī. Ḍisembar ondarinda jāga nimdu. Ondu mātu, Mahēś: beḷagge modala kāphi nanage. Ādre duḍḍu koṭṭē kuḍītīni. Ōnar-ge anta biṭṭi kāphi koḍōke śuru māḍidre bisines uḷiyalla.'
    en: 'Here, the keys. From the first of December the place is yours. One word, Mahesh: the first coffee of the morning is mine. But I''ll pay for it. Once you start giving free coffee to the owner, the business won''t survive.'
  - who: mahesh
    t: ಸರಿ ಸಾರ್. ಮೊದಲ ಟೋಕನ್ ನಿಮ್ಮದು.
    tr: Sari sār. Modala ṭōkan nimmadu.
    en: Agreed, sir. The first token is yours.
  - who: kavya
    t: 'ಬ್ಯಾಂಕ್‌ಗೆ ಲೀಸ್ ಕಾಪಿ ಇವತ್ತೇ ಕಳಿಸ್ತೀನಿ. ರಶ್ಮಿ ಮೇಡಂ ಹೇಳಿದ ಹಾಗೆ, ಅಡ್ರೆಸ್ ಇದ್ರೆ ಫೈಲ್ ಮುಂದೆ ಹೋಗುತ್ತೆ. ಲೆಕ್ಕ ಕೇಳು: ಏಳು ಲಕ್ಷ ಅಡ್ವಾನ್ಸ್, ಐವತ್ತು ಸಾವಿರ ಕಮಿಷನ್, ನಲವತ್ತು ಸಾವಿರ ರಿಜಿಸ್ಟ್ರೇಷನ್. ನಮ್ಮ ಒಂಬತ್ತು ಲಕ್ಷದಲ್ಲಿ ಉಳಿದಿರೋದು ಒಂದು ಲಕ್ಷ ಹತ್ತು ಸಾವಿರ. ನಿತಿನ್‌ನ ಎಂಟು ಲಕ್ಷ ಮುಟ್ಟಿಲ್ಲ, ಅದು ಇಂಟೀರಿಯರ್ ಮತ್ತೆ ಅಂಗಡಿ ಸೆಟಪ್‌ಗೆ.'
    tr: 'Byāṅk-ge līs kāpi ivattē kaḷistīni. Raśmi mēḍam hēḷida hāge, aḍres idre phail munde hōgutte. Lekka kēḷu: ēḷu lakṣa aḍvāns, aivattu sāvira kamiṣan, nalavattu sāvira rijisṭrēṣan. Namma ombattu lakṣadalli uḷidirōdu ondu lakṣa hattu sāvira. Nitin-na eṇṭu lakṣa muṭṭilla, adu iṇṭīriyar matte aṅgaḍi seṭap-ge.'
    en: '(Walking out, phone in hand) I''ll send the lease copy to the bank today. Like Rashmi madam said, with an address the file will move. Listen to the numbers: seven lakh advance, fifty thousand commission, forty thousand registration. Of our nine lakh, one lakh ten thousand is left. Nitin''s eight lakh is untouched; that''s for the interiors and setting up the shop.'
  - who: mahesh
    t: ಮತ್ತೆ ಡಿಸೆಂಬರ್ ಒಂದೇ ತಿಂಗಳು ಫ್ರೀ. ಜನವರಿ ಒಂದರಿಂದ ದಿನಕ್ಕೆ ಮೂರು ಸಾವಿರದ ಮುನ್ನೂರು ರೆಂಟ್ ಓಡ್ತಿರುತ್ತೆ, ಅಂಗಡಿ ತೆರೆದಿರಲಿ ಬಿಡಲಿ.
    tr: Matte Ḍisembar ondē tingaḷu phrī. Janavari ondarinda dinakke mūru sāvirada munnūru renṭ ōḍtirutte, aṅgaḍi teredirali biḍali.
    en: And only December is free. From the first of January, three thousand three hundred a day in rent keeps running, whether the shop is open or not.
  - who: kavya
    t: ಹಾಗಾದ್ರೆ ಓಪನಿಂಗ್ ಜನವರಿ ಕೊನೆಯೊಳಗೆ ಆಗ್ಲೇಬೇಕು. ಅಲ್ಲಿವರೆಗೆ ಲೈಸೆನ್ಸ್, ಕಿಚನ್, ಸ್ಟಾಫ್… ಎಲ್ಲಾ.
    tr: Hāgādre ōpaniṅg Janavari koneyoḷage āglēbēku. Allivarege laisens, kichan, sṭāf… ellā.
    en: 'Then the opening has to happen before the end of January. Before that: licences, kitchen, staff… everything.'
  - who: mahesh
    t: ಜನವರಿ ಇಪ್ಪತ್ತಾರು. ಗಣರಾಜ್ಯೋತ್ಸವ. ರಾಜ್ಯೋತ್ಸವದ ತಿಂಗಳಲ್ಲಿ ಜಾಗ ಸಿಕ್ತು, ಗಣರಾಜ್ಯೋತ್ಸವದ ದಿನ ಬಾಗಿಲು ತೆರೆಯೋಣ.
    tr: Janavari ippattāru. Gaṇarājyōtsava. Rājyōtsavada tingaḷalli jāga siktu, Gaṇarājyōtsavada dina bāgilu tereyōṇa.
    en: The twenty-sixth of January. Republic Day. We found the place in Rajyotsava month; let's open the doors on Republic Day.
  - chapter: Chapter 3 — Licences
  - section: A name over the door
    learn: 'naming: hesaru iḍu, hesaralli · Śr̥ṅgēri Śāradāmbe · let''s / let it be: -ōṇa, -irli · a blessing with conditions: śuddhavāgi naḍesi, … bēḍa'
  - scene: Monday, 1 December 2025, 7 a.m. The empty shop smells of old paper and damp. Amma draws a rangoli at the threshold; Mahesh lifts the shutter; Kavya photographs the bare walls for the interior contractor.
  - who: amma
    t: ಮೊದಲು ಹೊಸ್ತಿಲು ಪೂಜೆ. ಆಮೇಲೆ ನಿಮ್ಮ ಲೆಕ್ಕ, ಲೈಸೆನ್ಸ್ ಎಲ್ಲಾ.
    tr: Modalu hostilu pūje. Āmēle nimma lekka, laisens ellā.
    en: Threshold puja first. Then your accounts, your licences, all that.
  - who: kavya
    t: ಅಮ್ಮ, ಪೂಜೆ ಆದ್ಮೇಲೆ ಒಂದು ಮುಖ್ಯ ತೀರ್ಮಾನ. ಎಲ್ಲಾ ಅರ್ಜಿಯಲ್ಲೂ ಹೋಟೆಲ್ ಹೆಸರು ಕೇಳ್ತಾರೆ. ಬೋರ್ಡ್‌ಗೂ ಹೆಸರು ಬೇಕು. ನಾವು ಇನ್ನೂ ಹೆಸರೇ ಇಟ್ಟಿಲ್ಲ.
    tr: Amma, pūje ādmēle ondu mukhya tīrmāna. Ellā arjiyallū hōṭel hesaru kēḷtāre. Bōrḍ-gū hesaru bēku. Nāvu innū hesarē iṭṭilla.
    en: Amma, after the puja, one important decision. Every application asks for the hotel's name. The board needs a name too. We haven't even named it yet.
  - who: mahesh
    t: ನಾನು ಇಟ್ಟಿದೀನಿ. ಯಾರಿಗೂ ಹೇಳಿರ್ಲಿಲ್ಲ ಅಷ್ಟೇ. ಶಾರದಾ ದರ್ಶಿನಿ.
    tr: Nānu iṭṭidīni. Yārigū hēḷirlilla aṣṭē. Śāradā Darśini.
    en: I've named it. I just hadn't told anyone. Sharada Darshini.
  - who: amma
    t: ಶಾರದಾ? ನನ್ನ ಹೆಸರು ಯಾಕೋ? ಬೋರ್ಡ್ ಮೇಲೆ ಮುದುಕಿ ಹೆಸರು ನೋಡಿ ಜನ ನಗ್ತಾರೆ. ಉಡುಪಿ ಕೃಷ್ಣ ಅಂತ ಇಡು, ಚೆನ್ನಾಗಿರುತ್ತೆ.
    tr: Śāradā? Nanna hesaru yākō? Bōrḍ mēle muduki hesaru nōḍi jana nagtāre. Uḍupi Kr̥ṣṇa anta iḍu, chennāgirutte.
    en: Sharada? Why my name? People will laugh at an old woman's name on a board. Call it Udupi Krishna, that sounds nice.
  - who: mahesh
    t: ಜಯನಗರದಲ್ಲಿ ಉಡುಪಿ ಕೃಷ್ಣ ಅಂತ ಹತ್ತು ಹೋಟೆಲ್ ಇವೆ ಅಮ್ಮ. ಶಾರದಾ ಒಂದೇ. ಚಟ್ನಿ ನಿಂದು, ಧೈರ್ಯ ನಿಂದು, ಬೇಕಾದ್ರೆ ಚಿನ್ನಾನೂ ನಿಂದೇ. ಹೆಸರೂ ನಿಂದೇ ಇರ್ಲಿ.
    tr: Jayanagaradalli Uḍupi Kr̥ṣṇa anta hattu hōṭel ive amma. Śāradā ondē. Chaṭni nindu, dhairya nindu, bēkādre chinnānū nindē. Hesarū nindē irli.
    en: There are ten hotels called Udupi Krishna in Jayanagar, Amma. There's only one Sharada. The chutney is yours, the courage is yours, even the gold, if we need it, is yours. Let the name be yours too.
  - who: kavya
    t: ಮತ್ತೆ ಅಮ್ಮ, ಶಾರದೆ ಅಂದ್ರೆ ಶೃಂಗೇರಿ ಶಾರದಾಂಬೆ ಕೂಡ. ಜನ ದೇವಿ ಹೆಸರು ಅಂದ್ಕೊಳ್ತಾರೆ, ನಾವು ನಿಮ್ಮ ಹೆಸರು ಅಂದ್ಕೊಳ್ತೀವಿ. ಎರಡೂ ಸರಿ.
    tr: Matte amma, Śārade andre Śr̥ṅgēri Śāradāmbe kūḍa. Jana dēvi hesaru andkoḷtāre, nāvu nimma hesaru andkoḷtīvi. Eraḍū sari.
    en: And Amma, Sharada is also Sringeri Sharadambe. People will take it as the goddess's name; we'll know it's yours. Both are true.
  - who: amma
    t: ನೀವಿಬ್ರೂ ಸೇರಿ ಮೊದಲೇ ತೀರ್ಮಾನ ಮಾಡಿದೀರಿ, ನನಗೆ ಗೊತ್ತು. ಸರಿ. ಹೆಸರಿಗೆ ತಕ್ಕ ಹಾಗೆ ಶುದ್ಧವಾಗಿ ನಡೆಸಿ. ಶಾರದೆ ಹೆಸರಲ್ಲಿ ಸುಳ್ಳು ಲೆಕ್ಕ ಬೇಡ, ಹಳಸಿದ ಚಟ್ನಿ ಬೇಡ.
    tr: Nīvibrū sēri modalē tīrmāna māḍidīri, nanage gottu. Sari. Hesarige takka hāge śuddhavāgi naḍesi. Śārade hesaralli suḷḷu lekka bēḍa, haḷasida chaṭni bēḍa.
    en: (Wiping her eyes with the end of her sari) You two decided this together beforehand, I know. All right. Run it cleanly, worthy of the name. No false accounts and no stale chutney under Sharada's name.
  - who: mahesh
    t: 'ಮಾತು ಕೊಡ್ತೀನಿ ಅಮ್ಮ. ಕಾವ್ಯ, ಬರ್ಕೋ: ಶಾರದಾ ದರ್ಶಿನಿ, ಶುದ್ಧ ಸಸ್ಯಾಹಾರಿ. ಇವತ್ತಿಂದ ಎಲ್ಲಾ ಅರ್ಜಿಗೂ ಇದೇ ಹೆಸರು.'
    tr: 'Mātu koḍtīni amma. Kāvya, barkō: Śāradā Darśini, śuddha sasyāhāri. Ivattinda ellā arjigū idē hesaru.'
    en: 'I give you my word, Amma. Kavya, write it down: Sharada Darshini, pure vegetarian. From today, this name on every application.'
  - who: kavya
    t: ಬರ್ಕೊಂಡೆ. ಇವತ್ತು ಡಿಸೆಂಬರ್ ಒಂದು. ಓಪನಿಂಗ್‌ಗೆ ಐವತ್ತಾರು ದಿನ. ಮೊದಲ ಕೆಲಸ ನಾಳೆ ಬೆಳಗ್ಗೆ, ಭಟ್ರ ಆಫೀಸ್‌ನಲ್ಲಿ.
    tr: Barkoṇḍe. Ivattu Ḍisembar ondu. Ōpaniṅg-ge aivattāru dina. Modala kelasa nāḷe beḷagge, Bhaṭra āphīs-nalli.
    en: 'Written. Today is the first of December. Fifty-six days to the opening. First job: tomorrow morning, at Mr. Bhat''s office.'
  - section: 'FSSAI: registration or licence?'
    learn: 'nōndaṇi (registration) vs paravānagi (licence) · turnover limits; hedging a rumour: … māḍtāre anta mātu ide, ādre ārḍar bandilla · documents: nīrina ṭesṭ ripōrṭ, kichan lē-auṭ · rules: -bēku, -ō hāgilla, -abahudu'
  - scene: Tuesday, 2 December 2025. Mr. Bhat's office again. On his desk, a printed checklist with the darshini's new name at the top; nothing is ticked yet.
  - who: ca
    t: 'ಶಾರದಾ ದರ್ಶಿನಿ. ಒಳ್ಳೆ ಹೆಸರು. ಈಗ ಪಟ್ಟಿ ನೋಡಿ: ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ, ಜಿಎಸ್‌ಟಿ, ಶಾಪ್ಸ್ ಅಂಡ್ ಎಸ್ಟಾಬ್ಲಿಷ್‌ಮೆಂಟ್, ಜಿಬಿಎ ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್. ಆಹಾರದ ವ್ಯಾಪಾರ ಆದ್ದರಿಂದ ಮೊದಲು ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ. ಅದಿಲ್ದೆ ಒಂದು ಇಡ್ಲಿನೂ ಮಾರೋ ಹಾಗಿಲ್ಲ.'
    tr: 'Śāradā Darśini. Oḷḷe hesaru. Īga paṭṭi nōḍi: ef-es-es-e-ai, ji-es-ṭi, śāps aṇḍ esṭābliṣmeṇṭ, ji-bi-e ṭrēḍ laisens. Āhārada vyāpāra āddarinda modalu ef-es-es-e-ai. Adilde ondu iḍlinū mārō hāgilla.'
    en: 'Sharada Darshini. A good name. Now look at the list: FSSAI, GST, Shops and Establishments, the GBA trade licence. Since it''s a food business, FSSAI first. Without it you can''t sell a single idli.'
  - who: mahesh
    t: ಅದರಲ್ಲಿ ರಿಜಿಸ್ಟ್ರೇಷನ್ ಅಂತ ಒಂದು, ಲೈಸೆನ್ಸ್ ಅಂತ ಒಂದು ಇದೆಯಂತೆ. ನಮಗೆ ಯಾವುದು ಸಾರ್?
    tr: Adaralli rijisṭrēṣan anta ondu, laisens anta ondu ideyante. Namage yāvudu sār?
    en: I hear there's one called registration and one called a licence. Which one is ours, sir?
  - who: ca
    t: ಅದು ವರ್ಷದ ಟರ್ನೋವರ್ ಮೇಲೆ. ಇವತ್ತಿನ ರೂಲ್ ಪ್ರಕಾರ ವರ್ಷಕ್ಕೆ ಹನ್ನೆರಡು ಲಕ್ಷದವರೆಗೆ ಬೇಸಿಕ್ ರಿಜಿಸ್ಟ್ರೇಷನ್ ಸಾಕು. ಹನ್ನೆರಡು ಲಕ್ಷದಿಂದ ಇಪ್ಪತ್ತು ಕೋಟಿವರೆಗೆ ಸ್ಟೇಟ್ ಲೈಸೆನ್ಸ್. ಕಾವ್ಯ, ಪ್ರಾಜೆಕ್ಟ್ ರಿಪೋರ್ಟ್‌ನಲ್ಲಿ ಮೊದಲ ವರ್ಷದ ಸೇಲ್ಸ್ ಎಷ್ಟು ಹಾಕಿದ್ರಿ?
    tr: Adu varṣada ṭarnōvar mēle. Ivattina rūl prakāra varṣakke hanneraḍu lakṣadavarege bēsik rijisṭrēṣan sāku. Hanneraḍu lakṣadinda ippattu kōṭivarege sṭēṭ laisens. Kāvya, prājekṭ ripōrṭ-nalli modala varṣada sēls eṣṭu hākidri?
    en: It depends on annual turnover. Under today's rules, basic registration is enough up to twelve lakh a year. From twelve lakh to twenty crore, a state licence. Kavya, what first-year sales did you put in the project report?
  - who: kavya
    t: ದಿನಕ್ಕೆ ಮೂವತ್ತು ಸಾವಿರ ಅಂದ್ಕೊಂಡಿದೀನಿ ಸಾರ್. ವರ್ಷಕ್ಕೆ ಸುಮಾರು ಒಂದು ಕೋಟಿ ಹತ್ತು ಲಕ್ಷ.
    tr: Dinakke mūvattu sāvira andkoṇḍidīni sār. Varṣakke sumāru ondu kōṭi hattu lakṣa.
    en: I've assumed thirty thousand a day, sir. About one crore ten lakh a year.
  - who: ca
    t: 'ಹಾಗಾದ್ರೆ ಸ್ಟೇಟ್ ಲೈಸೆನ್ಸ್. ಒಂದು ಮಾತು: ಈ ಲಿಮಿಟ್‌ಗಳನ್ನ ಮುಂದಿನ ವರ್ಷ ಜಾಸ್ತಿ ಮಾಡ್ತಾರೆ ಅಂತ ಮಾತು ಕೇಳಿಬರ್ತಿದೆ. ಆದ್ರೆ ಆರ್ಡರ್ ಇನ್ನೂ ಬಂದಿಲ್ಲ. ಮಾತಿನ ಮೇಲೆ ಬಿಸಿನೆಸ್ ನಡೆಸೋಕಾಗಲ್ಲ. ಇವತ್ತು ಇರೋ ರೂಲ್ ಪ್ರಕಾರ ಮಾಡೋಣ.'
    tr: 'Hāgādre sṭēṭ laisens. Ondu mātu: ī limiṭ-gaḷanna mundina varṣa jāsti māḍtāre anta mātu kēḷibartide. Ādre ārḍar innū bandilla. Mātina mēle bisines naḍesōkāgalla. Ivattu irō rūl prakāra māḍōṇa.'
    en: 'Then a state licence. One thing: there''s talk that these limits will be raised next year. But no order has come yet. You can''t run a business on talk. Let''s go by the rule as it stands today.'
  - who: mahesh
    t: ಸ್ಟೇಟ್ ಲೈಸೆನ್ಸ್‌ಗೆ ಏನೇನು ಬೇಕು ಸಾರ್?
    tr: Sṭēṭ laisens-ge ēnēnu bēku sār?
    en: What does a state licence need, sir?
  - who: ca
    t: ಫೋಸ್ಕೋಸ್ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಆನ್‌ಲೈನ್ ಅರ್ಜಿ. ಪಾರ್ಟ್ನರ್‌ಗಳ ಐಡಿ, ಫೋಟೋ, ಲೀಸ್ ಡೀಡ್, ಕಿಚನ್ ಲೇಔಟ್ ಪ್ಲಾನ್, ಮೆಷಿನ್‌ಗಳ ಪಟ್ಟಿ, ಆಹಾರದ ಐಟಂಗಳ ಪಟ್ಟಿ. ಮತ್ತೆ ನೀರಿನ ಟೆಸ್ಟ್ ರಿಪೋರ್ಟ್, ಅದನ್ನ ಎನ್‌ಎಬಿಎಲ್ ಲ್ಯಾಬ್‌ನಲ್ಲಿ ಮಾಡಿಸ್ಬೇಕು. ಫೀಸ್ ವರ್ಷಕ್ಕೆ ಎರಡು ಸಾವಿರ. ಒಂದರಿಂದ ಐದು ವರ್ಷದವರೆಗೆ ಒಟ್ಟಿಗೆ ಕಟ್ಟಬಹುದು.
    tr: Phōskōs pōrṭal-nalli ān-lain arji. Pārṭnar-gaḷa ai-ḍi, phōṭō, līs ḍīḍ, kichan lē-auṭ plān, meṣin-gaḷa paṭṭi, āhārada aiṭam-gaḷa paṭṭi. Matte nīrina ṭesṭ ripōrṭ, adanna en-e-bi-el lyāb-nalli māḍisbēku. Phīs varṣakke eraḍu sāvira. Ondarinda aidu varṣadavarege oṭṭige kaṭṭabahudu.
    en: An online application on the FoSCoS portal. The partners' IDs and photos, the lease deed, a kitchen layout plan, a list of the machines, a list of food items. And a water test report, which you have to get done at an NABL lab. The fee is two thousand a year. You can pay for anything from one to five years at once.
  - who: kavya
    t: ಕಿಚನ್ ಲೇಔಟ್ ಇನ್ನೂ ಫೈನಲ್ ಆಗಿಲ್ಲ ಸಾರ್. ಮೆಷಿನ್ ಕೂಡ ತಗೊಂಡಿಲ್ಲ.
    tr: Kichan lē-auṭ innū phainal āgilla sār. Meṣin kūḍa tagoṇḍilla.
    en: The kitchen layout isn't final yet, sir. We haven't bought the machines either.
  - who: ca
    t: ಪರವಾಗಿಲ್ಲ, ಪ್ಲಾನ್ ಮಾಡಿರೋ ಲೇಔಟ್ ಸಾಕು. ಆದ್ರೆ ಆಮೇಲೆ ಇನ್ಸ್‌ಪೆಕ್ಷನ್‌ಗೆ ಬಂದಾಗ ಪೇಪರ್‌ನಲ್ಲಿ ಇರೋದೂ ಜಾಗದಲ್ಲಿ ಇರೋದೂ ಒಂದೇ ಇರ್ಬೇಕು. ನೀರಿನ ಸ್ಯಾಂಪಲ್ ಇವತ್ತೇ ಕೊಡಿ. ರಿಪೋರ್ಟ್ ಬರೋಕೆ ಒಂದು ವಾರ ಆಗುತ್ತೆ.
    tr: Paravāgilla, plān māḍirō lē-auṭ sāku. Ādre āmēle inspekṣan-ge bandāga pēpar-nalli irōdū jāgadalli irōdū ondē irbēku. Nīrina syāmpal ivattē koḍi. Ripōrṭ barōke ondu vāra āgutte.
    en: That's fine; the planned layout will do. But when they come to inspect later, what's on paper and what's on the ground must match. Give the water sample today. The report takes a week.
  - who: mahesh
    t: ಲೈಸೆನ್ಸ್ ಬರೋಕೆ ಎಷ್ಟು ದಿನ ಸಾರ್?
    tr: Laisens barōke eṣṭu dina sār?
    en: How many days for the licence to come, sir?
  - who: ca
    t: 'ರೂಲ್ ಪ್ರಕಾರ ಅರವತ್ತು ದಿನದೊಳಗೆ ತೀರ್ಮಾನ ಆಗ್ಬೇಕು. ಸಾಮಾನ್ಯವಾಗಿ ಅದಕ್ಕಿಂತ ಬೇಗ ಬರುತ್ತೆ, ಆದ್ರೆ ನಿಮ್ಮ ಓಪನಿಂಗ್ ದಿನ ನೋಡಿ ಯಾರೂ ಕೆಲಸ ಮಾಡಲ್ಲ. ಒಂದು ಒಳ್ಳೆ ವಿಷಯ: ಫೈಲ್ ಎಲ್ಲಿದೆ ಅಂತ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ನೀವೇ ಟ್ರ್ಯಾಕ್ ಮಾಡಬಹುದು. ಯಾರ ಹತ್ರಾನೂ ಹೋಗಿ ಕೇಳೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ.'
    tr: 'Rūl prakāra aravattu dinadoḷage tīrmāna āgbēku. Sāmānyavāgi adakkinta bēga barutte, ādre nimma ōpaniṅg dina nōḍi yārū kelasa māḍalla. Ondu oḷḷe viṣaya: phail ellide anta pōrṭal-nalli nīvē ṭryāk māḍabahudu. Yāra hatrānū hōgi kēḷō avaśyakate illa.'
    en: 'By the rules, a decision has to be made within sixty days. It usually comes sooner, but nobody works to your opening date. One good thing: you can track on the portal yourself where the file is. No need to go and ask anybody.'
  - who: ca
    t: 'ಇನ್ನೊಂದು: ಅಡುಗೆಮನೆ ಸ್ಟಾಫ್‌ಗೆ ವರ್ಷಕ್ಕೊಮ್ಮೆ ಮೆಡಿಕಲ್ ಸರ್ಟಿಫಿಕೇಟ್. ಮತ್ತೆ ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬರು ಫುಡ್ ಸೇಫ್ಟಿ ಟ್ರೈನಿಂಗ್ ಮಾಡ್ಬೇಕು. ಮಹೇಶ್ ಅವರೇ, ಅದು ನೀವೇ.'
    tr: 'Innondu: aḍugemane sṭāf-ge varṣakkomme meḍikal sarṭiphikēṭ. Matte nimmalli obbaru phuḍ sēphṭi ṭrainiṅg māḍbēku. Mahēś avarē, adu nīvē.'
    en: 'One more: a medical certificate once a year for the kitchen staff. And one of you has to do a food-safety training course. Mahesh, that''s you.'
  - who: mahesh
    t: ಹತ್ತು ವರ್ಷ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಹೈಜೀನ್ ಬಗ್ಗೆ ಬೇರೆಯವರಿಗೆ ಬೈತಿದ್ದೆ. ಈಗ ನಾನೇ ಕ್ಲಾಸ್‌ನಲ್ಲಿ ಕೂರ್ಬೇಕು. ಸರಿ ಸಾರ್.
    tr: Hattu varṣa hōṭel-nalli haijīn bagge bēreyavarige baitidde. Īga nānē klās-nalli kūrbēku. Sari sār.
    en: For ten years I scolded other people about hygiene at the hotel. Now I have to sit in the class myself. All right, sir.
  - section: 'GST: five percent, two ways'
    learn: 'terige / ṭyāks · the ₹20 lakh threshold · 5% without ITC (regular) vs composition: grāhakarinda vasūli māḍbahudu / māḍō hāgilla · reasoning with -drū: eraḍu skīm-nallū … ondē · warnings: eccharike, takṣaṇa'
  - scene: The same morning. Mr. Bhat pulls out a calculator with worn-out keys.
  - who: kavya
    t: ಜಿಎಸ್‌ಟಿ ಈಗಲೇ ಬೇಕಾ ಸಾರ್? ಇಪ್ಪತ್ತು ಲಕ್ಷ ದಾಟಿದ ಮೇಲೆ ಅಲ್ವಾ ಕಡ್ಡಾಯ?
    tr: Ji-es-ṭi īgalē bēkā sār? Ippattu lakṣa dāṭida mēle alvā kaḍḍāya?
    en: Do we need GST right now, sir? Isn't it compulsory only after crossing twenty lakh?
  - who: ca
    t: ಹೌದು, ವರ್ಷಕ್ಕೆ ಇಪ್ಪತ್ತು ಲಕ್ಷ. ನಿಮ್ಮ ಲೆಕ್ಕದಲ್ಲಿ ದಿನಕ್ಕೆ ಮೂವತ್ತು ಸಾವಿರ ಅಂದ್ರೆ ಎರಡು ತಿಂಗಳೊಳಗೆ ಅದನ್ನ ದಾಟ್ತೀರಿ. ಮತ್ತೆ ಬ್ಯಾಂಕ್, ಜಿಬಿಎ ಎರಡೂ ಜಿಎಸ್‌ಟಿ ನಂಬರ್ ಕೇಳ್ತಾರೆ. ಮೊದಲೇ ತಗೊಳ್ಳೋದು ಒಳ್ಳೇದು. ಪ್ರಶ್ನೆ ಇರೋದು ಯಾವ ಸ್ಕೀಮ್ ಅಂತ.
    tr: Haudu, varṣakke ippattu lakṣa. Nimma lekkadalli dinakke mūvattu sāvira andre eraḍu tingaḷoḷage adanna dāṭtīri. Matte byāṅk, ji-bi-e eraḍū ji-es-ṭi nambar kēḷtāre. Modalē tagoḷḷōdu oḷḷēdu. Praśne irōdu yāva skīm anta.
    en: Yes, twenty lakh a year. By your numbers, thirty thousand a day, you'll cross that within two months. And both the bank and the GBA ask for a GST number. Better to take it from the start. The question is which scheme.
  - who: mahesh
    t: ಹೋಟೆಲ್‌ಗೆ ಐದು ಪರ್ಸೆಂಟ್ ಅಲ್ವಾ ಸಾರ್?
    tr: Hōṭel-ge aidu parsenṭ alvā sār?
    en: For a restaurant it's five percent, isn't it, sir?
  - who: ca
    t: 'ಎರಡು ದಾರಿಯಲ್ಲೂ ಐದು ಪರ್ಸೆಂಟೇ. ಮೊದಲನೇದು ರೆಗ್ಯುಲರ್ ಸ್ಕೀಮ್: ಬಿಲ್ ಮೇಲೆ ಐದು ಪರ್ಸೆಂಟ್ ಗ್ರಾಹಕರಿಂದ ವಸೂಲಿ ಮಾಡ್ತೀರಿ, ಸರ್ಕಾರಕ್ಕೆ ಕಟ್ತೀರಿ. ಆದ್ರೆ ಇನ್‌ಪುಟ್ ಟ್ಯಾಕ್ಸ್ ಕ್ರೆಡಿಟ್ ಇಲ್ಲ. ಅಂದ್ರೆ ಗ್ಯಾಸ್, ಮೆಷಿನ್ ಮೇಲೆ ನೀವು ಕಟ್ಟಿದ ಜಿಎಸ್‌ಟಿ ವಾಪಸ್ ಬರಲ್ಲ. ಪ್ರತಿ ತಿಂಗಳು ರಿಟರ್ನ್ ಹಾಕ್ಬೇಕು.'
    tr: 'Eraḍu dāriyallū aidu parsenṭē. Modalanēdu regyular skīm: bil mēle aidu parsenṭ grāhakarinda vasūli māḍtīri, sarkārakke kaṭtīri. Ādre in-puṭ ṭyāks kreḍiṭ illa. Andre gyās, meṣin mēle nīvu kaṭṭida ji-es-ṭi vāpas baralla. Prati tingaḷu riṭarn hākbēku.'
    en: 'Both ways it''s five percent. The first is the regular scheme: you collect five percent on the bill from the customer and pay it to the government. But there''s no input tax credit. That means the GST you paid on gas and machines doesn''t come back to you. And you file returns every month.'
  - who: ca
    t: ಎರಡನೇದು ಕಾಂಪೊಸಿಷನ್ ಸ್ಕೀಮ್, ಒಂದೂವರೆ ಕೋಟಿವರೆಗಿನ ಟರ್ನೋವರ್‌ಗೆ ಮಾತ್ರ. ಅದರಲ್ಲೂ ಐದು ಪರ್ಸೆಂಟ್, ಆದ್ರೆ ಗ್ರಾಹಕರಿಂದ ಟ್ಯಾಕ್ಸ್ ಅಂತ ಬೇರೆ ವಸೂಲಿ ಮಾಡೋ ಹಾಗಿಲ್ಲ. ನಿಮ್ಮ ಕಲೆಕ್ಷನ್‌ನಿಂದಲೇ ಕಟ್ಬೇಕು. ಮೂರು ತಿಂಗಳಿಗೊಮ್ಮೆ ಕಟ್ಟಿದ್ರೆ ಸಾಕು, ಪೇಪರ್ ಕೆಲಸ ಕಮ್ಮಿ.
    tr: Eraḍanēdu kāmpoṣiṣan skīm, ondūvare kōṭivaregina ṭarnōvar-ge mātra. Adarallū aidu parsenṭ, ādre grāhakarinda ṭyāks anta bēre vasūli māḍō hāgilla. Nimma kalekṣan-nindalē kaṭbēku. Mūru tingaḷigomme kaṭṭidre sāku, pēpar kelasa kammi.
    en: The second is the composition scheme, only for turnover up to one and a half crore. That's five percent too, but you can't collect tax separately from customers. You pay it out of your own takings. Paying once every three months is enough; less paperwork.
  - who: mahesh
    t: ಅಂದ್ರೆ ಕಾಂಪೊಸಿಷನ್‌ನಲ್ಲಿ ಐದು ಪರ್ಸೆಂಟ್ ನಮ್ಮ ಜೇಬಿನಿಂದ ಹೋಗುತ್ತೆ. ಅದು ನಷ್ಟ ಅಲ್ವಾ?
    tr: Andre kāmpoṣiṣan-nalli aidu parsenṭ namma jēbininda hōgutte. Adu naṣṭa alvā?
    en: So under composition, the five percent comes out of our pocket. Isn't that a loss?
  - who: kavya
    t: ಇಲ್ಲ, ಯೋಚನೆ ಮಾಡು. ದರ್ಶಿನಿಯಲ್ಲಿ ಯಾರೂ “ಇಡ್ಲಿ ನಲವತ್ತು ಪ್ಲಸ್ ಟ್ಯಾಕ್ಸ್” ಅಂತ ಬೋರ್ಡ್ ಹಾಕಲ್ಲ. ರೇಟ್ ಟ್ಯಾಕ್ಸ್ ಸೇರಿಸಿಯೇ ಇಡ್ತೀವಿ. ಹಾಗಾದ್ರೆ ಎರಡು ಸ್ಕೀಮ್‌ನಲ್ಲೂ ನಮ್ಮ ಕೈಗೆ ಬರೋದು ಒಂದೇ. ವ್ಯತ್ಯಾಸ ಪೇಪರ್ ಕೆಲಸದಲ್ಲಿ ಮಾತ್ರ.
    tr: Illa, yōchane māḍu. Darśiniyalli yārū “iḍli nalavattu plas ṭyāks” anta bōrḍ hākalla. Rēṭ ṭyāks sērisiyē iḍtīvi. Hāgādre eraḍu skīm-nallū namma kaige barōdu ondē. Vyatyāsa pēpar kelasadalli mātra.
    en: No, think about it. No darshini puts up a board saying “idli forty plus tax”. We'll set the prices with tax included anyway. Then under both schemes, what reaches our hands is the same. The difference is only in the paperwork.
  - who: ca
    t: 'ಕಾವ್ಯ ಸರಿಯಾಗಿ ಹೇಳಿದ್ರು. ಐಟಿಸಿ ಎರಡರಲ್ಲೂ ಇಲ್ಲ, ಹಾಗಾಗಿ ಮೊದಲ ವರ್ಷಕ್ಕೆ ಕಾಂಪೊಸಿಷನ್ ಸುಲಭ. ಆದ್ರೆ ಎರಡು ಎಚ್ಚರಿಕೆ. ಬಿಲ್ ಮೇಲೆ “ಕಾಂಪೊಸಿಷನ್ ಟ್ಯಾಕ್ಸೇಬಲ್ ಪರ್ಸನ್” ಅಂತ ಬರೀಬೇಕು, ಅಂಗಡಿಯಲ್ಲೂ ಬೋರ್ಡ್ ಹಾಕ್ಬೇಕು. ಎರಡನೇದು: ಟರ್ನೋವರ್ ಒಂದೂವರೆ ಕೋಟಿ ದಾಟಿದ್ರೆ ತಕ್ಷಣ ರೆಗ್ಯುಲರ್‌ಗೆ ಬರ್ಬೇಕು.'
    tr: 'Kāvya sariyāgi hēḷidru. Ai-ṭi-si eraḍarallū illa, hāgāgi modala varṣakke kāmpoṣiṣan sulabha. Ādre eraḍu eccharike. Bil mēle “kāmpoṣiṣan ṭyāksēbal parsan” anta barībēku, aṅgaḍiyallū bōrḍ hākbēku. Eraḍanēdu: ṭarnōvar ondūvare kōṭi dāṭidre takṣaṇa regyular-ge barbēku.'
    en: 'Kavya is right. There''s no ITC in either, so for the first year composition is simpler. But two warnings. The bill must say “composition taxable person”, and you must put up a notice in the shop too. Second: if turnover crosses one and a half crore, you have to move to the regular scheme at once.'
  - who: mahesh
    t: ಒಂದೂವರೆ ಕೋಟಿ ದಾಟಿದ್ರೆ ನಾನೇ ಸಂತೋಷದಿಂದ ರೆಗ್ಯುಲರ್‌ಗೆ ಬರ್ತೀನಿ ಸಾರ್.
    tr: Ondūvare kōṭi dāṭidre nānē santōṣadinda regyular-ge bartīni sār.
    en: If we cross one and a half crore, sir, I'll move to regular myself, happily.
  - who: ca
    t: 'ಎಲ್ಲರೂ ಹಾಗೇ ಹೇಳ್ತಾರೆ, ಆಮೇಲೆ ಮಾರ್ಚ್‌ನಲ್ಲಿ ನನಗೆ ಫೋನ್ ಮಾಡ್ತಾರೆ. ಇನ್ನೊಂದು: ಮುಂದೆ ಸ್ವಿಗ್ಗಿ, ಜೊಮ್ಯಾಟೋ ಸೇರೋ ಯೋಚನೆ ಇದ್ರೆ ಆಗ ಸ್ಕೀಮ್ ಮತ್ತೆ ನೋಡ್ಬೇಕಾಗಬಹುದು. ಆ ರೂಲ್ಸ್ ಬೇರೆ. ಅದು ಬಂದಾಗ ನೋಡೋಣ.'
    tr: 'Ellarū hāgē hēḷtāre, āmēle mārch-nalli nanage phōn māḍtāre. Innondu: munde Sviggi, Jomyāṭō sērō yōchane idre āga skīm matte nōḍbēkāgabahudu. Ā rūls bēre. Adu bandāga nōḍōṇa.'
    en: 'Everyone says that, and then they call me in March. One more thing: if you later think of joining Swiggy or Zomato, we may have to look at the scheme again. Those rules are different. We''ll see when it comes to that.'
  - who: kavya
    t: ಜಿಎಸ್‌ಟಿ ಅರ್ಜಿ ನಾನೇ ಇವತ್ತು ರಾತ್ರಿ ಹಾಕ್ತೀನಿ. ಆಧಾರ್ ಓಟಿಪಿ ನಿನ್ನ ಫೋನ್‌ಗೆ ಬರುತ್ತೆ, ಫೋನ್ ಸೈಲೆಂಟ್ ಮಾಡ್ಬೇಡ.
    tr: Ji-es-ṭi arji nānē ivattu rātri hāktīni. Ādhār ō-ṭi-pi ninna phōn-ge barutte, phōn sailenṭ māḍbēḍa.
    en: I'll file the GST application myself tonight. The Aadhaar OTP will come to your phone; don't put it on silent.
  - who: ca
    t: ಎಲ್ಲಾ ಸರಿ ಇದ್ರೆ ಏಳು ದಿನದಲ್ಲಿ ನಂಬರ್ ಬರುತ್ತೆ. ಅಧಿಕಾರಿ ಏನಾದ್ರೂ ಪ್ರಶ್ನೆ ಕೇಳಿದ್ರೆ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಕೆಲವೊಮ್ಮೆ ಜಾಗ ನೋಡೋಕೂ ಬರ್ತಾರೆ, ಬೋರ್ಡ್ ಇದೆಯಾ, ಅಂಗಡಿ ನಿಜವಾಗ್ಲೂ ಇದೆಯಾ ಅಂತ.
    tr: Ellā sari idre ēḷu dinadalli nambar barutte. Adhikāri ēnādrū praśne kēḷidre svalpa jāsti. Kelavomme jāga nōḍōkū bartāre, bōrḍ ideyā, aṅgaḍi nijavāglū ideyā anta.
    en: If everything is in order, the number comes within seven days. A bit longer if the officer raises a query. Sometimes they even come to see the place, to check there's a board and the shop really exists.
  - section: Shops and Establishments
    learn: 'kārmika ilākhe (Labour Department) · kāyde (Act) · vārada raje (weekly off), kelasada gaṇṭe, saradi (rotation) · hedging: … anta ide ansutte, pakkā gottilla · positives: arji nambar, sṭēṭas ān-lain'
  - scene: Saturday, 6 December, late at night. Kavya at the laptop, Mahesh with a cup of coffee. The GST number has come through in four days.
  - who: kavya
    t: 'ಒಳ್ಳೆ ಸುದ್ದಿ: ಜಿಎಸ್‌ಟಿ ನಂಬರ್ ಬಂತು. ನಾಲ್ಕೇ ದಿನ. ಯಾರ ಬಾಗಿಲೂ ತಟ್ಟಿಲ್ಲ.'
    tr: 'Oḷḷe suddi: ji-es-ṭi nambar bantu. Nālkē dina. Yāra bāgilū taṭṭilla.'
    en: 'Good news: the GST number has come. Just four days. We didn''t knock on anyone''s door.'
  - who: mahesh
    t: ನಂಬೋಕಾಗ್ತಿಲ್ಲ. ಈಗ ಆ ಶಾಪ್ಸ್ ಅಂಡ್ ಎಸ್ಟಾಬ್ಲಿಷ್‌ಮೆಂಟ್ ಏನು? ಅದು ಯಾರ ಡಿಪಾರ್ಟ್‌ಮೆಂಟ್?
    tr: Nambōkāgtilla. Īga ā śāps aṇḍ esṭābliṣmeṇṭ ēnu? Adu yāra ḍipārṭmeṇṭ?
    en: Unbelievable. Now what's this Shops and Establishments thing? Whose department is that?
  - who: kavya
    t: ಕಾರ್ಮಿಕ ಇಲಾಖೆ. ಕರ್ನಾಟಕ ಅಂಗಡಿಗಳು ಮತ್ತು ವಾಣಿಜ್ಯ ಸಂಸ್ಥೆಗಳ ಕಾಯ್ದೆ. ಕೆಲಸಗಾರರು ಇರೋ ಪ್ರತಿ ಅಂಗಡಿ ರಿಜಿಸ್ಟರ್ ಆಗ್ಬೇಕು. ಇದೂ ಆನ್‌ಲೈನ್. ಫೀಸ್ ಎಷ್ಟು ಜನ ಕೆಲಸಗಾರರು ಅನ್ನೋದರ ಮೇಲೆ.
    tr: Kārmika ilākhe. Karnāṭaka aṅgaḍigaḷu mattu vāṇijya saṁsthegaḷa kāyde. Kelasagāraru irō prati aṅgaḍi rijisṭar āgbēku. Idū ān-lain. Phīs eṣṭu jana kelasagāraru annōdara mēle.
    en: The Labour Department. The Karnataka Shops and Commercial Establishments Act. Every shop with workers has to be registered. This is online too. The fee depends on how many workers you have.
  - who: mahesh
    t: ಇನ್ನೂ ಯಾರನ್ನೂ ಕೆಲಸಕ್ಕೆ ತಗೊಂಡಿಲ್ಲ. ಏನು ಹಾಕೋದು?
    tr: Innū yārannū kelasakke tagoṇḍilla. Ēnu hākōdu?
    en: We haven't hired anyone yet. What do we put?
  - who: kavya
    t: 'ಪ್ಲಾನ್ ಮಾಡಿರೋ ಸಂಖ್ಯೆ: ಒಬ್ಬ ಕುಕ್, ಇಬ್ಬರು ಹೆಲ್ಪರ್, ಒಬ್ಬ ಕ್ಯಾಶಿಯರ್, ಮತ್ತೆ ನೀನು. ವ್ಯಾಪಾರ ಶುರುವಾದ ಒಂದು ತಿಂಗಳೊಳಗೆ ರಿಜಿಸ್ಟರ್ ಮಾಡ್ಬೇಕು ಅಂತ ಇದೆ ಅನ್ಸುತ್ತೆ, ಪಕ್ಕಾ ಗೊತ್ತಿಲ್ಲ. ನಾವು ಮೊದಲೇ ಮಾಡಿಬಿಡೋಣ. ಆಮೇಲೆ ಯಾರೂ “ಲೇಟ್ ಆಯ್ತು” ಅನ್ನೋ ಹಾಗಿಲ್ಲ.'
    tr: 'Plān māḍirō saṅkhye: obba kuk, ibbaru helpar, obba kyāśiyar, matte nīnu. Vyāpāra śuruvāda ondu tingaḷoḷage rijisṭar māḍbēku anta ide ansutte, pakkā gottilla. Nāvu modalē māḍibiḍōṇa. Āmēle yārū “lēṭ āytu” annō hāgilla.'
    en: 'The planned number: one cook, two helpers, one cashier, and you. I think the rule says register within a month of starting business, but I''m not certain. Let''s just do it beforehand. Then nobody can say we were late.'
  - who: mahesh
    t: ಫಾರ್ಮ್‌ನಲ್ಲಿ ಇದೇನು, “ವಾರದ ರಜಾ ದಿನ”?
    tr: Phārm-nalli idēnu, “vārada rajā dina”?
    en: What's this on the form, “weekly holiday”?
  - who: kavya
    t: ಕೆಲಸಗಾರರಿಗೆ ವಾರಕ್ಕೆ ಒಂದು ದಿನ ರಜೆ ಕೊಡ್ಬೇಕು. ಕೆಲಸದ ಗಂಟೆ, ಓವರ್‌ಟೈಮ್, ಎಲ್ಲಾ ಕಾಯ್ದೆಯಲ್ಲಿ ಇದೆ. ಹೋಟೆಲ್ ವಾರವೆಲ್ಲಾ ತೆರೆದಿದ್ರೂ ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಒಂದು ದಿನ ರಜೆ, ಸರದಿ ಪ್ರಕಾರ.
    tr: Kelasagārarige vārakke ondu dina raje koḍbēku. Kelasada gaṇṭe, ōvarṭaim, ellā kāydeyalli ide. Hōṭel vāravellā teredidrū pratiyobbarigū ondu dina raje, saradi prakāra.
    en: Workers have to get one day off a week. Working hours, overtime, it's all in the Act. Even if the hotel is open all week, everyone gets one day off, by rotation.
  - who: mahesh
    t: 'ನಾನು ಕೆಲಸ ಮಾಡಿದ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಹುಡುಗರಿಗೆ ತಿಂಗಳಿಗೆ ಎರಡು ದಿನ ರಜೆ ಸಿಕ್ಕಿದ್ರೆ ಹೆಚ್ಚು. ನಮ್ಮಲ್ಲಿ ಹಾಗಾಗಬಾರದು. ಬರ್ಕೋ: ಎಲ್ಲರಿಗೂ ವಾರಕ್ಕೊಂದು ರಜೆ.'
    tr: 'Nānu kelasa māḍida hōṭel-nalli huḍugarige tingaḷige eraḍu dina raje sikkidre heccu. Nammalli hāgāgabāradu. Barkō: ellarigū vārakkondu raje.'
    en: 'In the hotel where I worked, the boys were lucky to get two days off a month. That mustn''t happen with us. Write it: one day off a week for everyone.'
  - who: kavya
    t: ಸಬ್ಮಿಟ್ ಆಯ್ತು. ಅರ್ಜಿ ನಂಬರ್ ಬಂತು, ಸ್ಟೇಟಸ್ ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ನೋಡಬಹುದು. ಸರ್ಟಿಫಿಕೇಟ್ ಬಂದ್ರೆ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ ಕೌಂಟರ್ ಹತ್ರ ಫ್ರೇಮ್ ಹಾಕಿಸೋಣ.
    tr: Sabmiṭ āytu. Arji nambar bantu, sṭēṭas ān-lain-nallē nōḍabahudu. Sarṭiphikēṭ bandre ḍaunlōḍ māḍi kauṇṭar hatra phrēm hākisōṇa.
    en: Submitted. We've got an application number; we can check the status online. When the certificate comes, we'll download it and have it framed by the counter.
  - section: Sixty percent Kannada
    learn: 'the nameboard rule: mēlina aravattu parsenṭ Kannaḍa, uḷida nalavattaralli bēre bhāṣe · sealing: sīl māḍidru · comparisons: -ginta doḍḍa · limits: mīrabāradu · family humour'
  - scene: Wednesday, 10 December. A signboard shop has sent a draft design. Nitin has come over after work; the draft is on the TV screen. Amma watches from the sofa.
  - who: nitin
    t: ಅಣ್ಣ, ಡಿಸೈನ್ ಸೂಪರ್, ಆದ್ರೆ ಇಂಗ್ಲಿಷ್ ಸ್ವಲ್ಪ ದೊಡ್ಡದು ಮಾಡಿಸೋಣ. ಜಯನಗರದಲ್ಲಿ ಟೆಕ್ಕಿಗಳು, ಹೊರಗಿನವರು ತುಂಬಾ ಜನ. ಅವರಿಗೂ ಓದೋಕೆ ಆಗ್ಬೇಕಲ್ಲ.
    tr: Aṇṇa, ḍisain sūpar, ādre iṅgliṣ svalpa doḍḍadu māḍisōṇa. Jayanagaradalli ṭekkigaḷu, horaginavaru tumbā jana. Avarigū ōdōke āgbēkalla.
    en: Anna, the design is great, but let's have the English made a bit bigger. Jayanagar is full of techies and outsiders. They need to be able to read it too.
  - who: kavya
    t: 'ಆಗಲ್ಲ ನಿತಿನ್. ರೂಲ್ ಸ್ಪಷ್ಟ: ಬೋರ್ಡ್‌ನ ಮೇಲಿನ ಅರವತ್ತು ಪರ್ಸೆಂಟ್ ಕನ್ನಡ. ಉಳಿದ ನಲವತ್ತರಲ್ಲಿ ಬೇರೆ ಭಾಷೆ, ಕೆಳಗೆ, ಚಿಕ್ಕದಾಗಿ.'
    tr: 'Āgalla Nitin. Rūl spaṣṭa: bōrḍ-na mēlina aravattu parsenṭ Kannaḍa. Uḷida nalavattaralli bēre bhāṣe, keḷage, chikkadāgi.'
    en: 'Can''t, Nitin. The rule is clear: the top sixty percent of the board is Kannada. Other languages go in the remaining forty, below, smaller.'
  - who: nitin
    t: ಅದನ್ನ ಎಷ್ಟು ಸೀರಿಯಸ್ ಆಗಿ ಜಾರಿ ಮಾಡ್ತಾರೆ? ಬರೀ ಪೇಪರ್ ರೂಲ್ ಅಲ್ವಾ?
    tr: Adanna eṣṭu sīriyas āgi jāri māḍtāre? Barī pēpar rūl alvā?
    en: How seriously do they enforce it? Isn't it just a rule on paper?
  - who: mahesh
    t: ಎರಡು ವರ್ಷದ ಹಿಂದೆ ಹೆಬ್ಬಾಳದ ದೊಡ್ಡ ಮಾಲ್‌ನಲ್ಲೇ ಅಂಗಡಿಗಳನ್ನ ಸೀಲ್ ಮಾಡಿದ್ರು. ಈಗ ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಅರ್ಜಿಗೆ ಬೋರ್ಡ್ ಫೋಟೋನೇ ಅಪ್‌ಲೋಡ್ ಮಾಡ್ಬೇಕು. ಬೋರ್ಡ್ ಸರಿ ಇಲ್ಲಾಂದ್ರೆ ಲೈಸೆನ್ಸೇ ಇಲ್ಲ.
    tr: Eraḍu varṣada hinde Hebbāḷada doḍḍa māl-nallē aṅgaḍigaḷanna sīl māḍidru. Īga ṭrēḍ laisens arjige bōrḍ phōṭōnē ap-lōḍ māḍbēku. Bōrḍ sari illāndre laisensē illa.
    en: Two years ago they sealed shops in a big mall in Hebbal, no less. Now you have to upload a photo of the board with the trade licence application. If the board's not right, there's no licence at all.
  - who: amma
    t: ಕನ್ನಡ ನಾಡಲ್ಲಿ ಕನ್ನಡ ಬೋರ್ಡ್‌ಗೆ ರೂಲ್ ಬೇಕಾ? ನಮ್ಮ ಕಾಲದಲ್ಲಿ ಎಲ್ಲಾ ಬೋರ್ಡ್ ಕನ್ನಡದಲ್ಲೇ ಇರ್ತಿತ್ತು. ನಿತಿನ್, ಕನ್ನಡ ಓದೋಕೆ ಬರದೋರು ಬೋರ್ಡ್ ನೋಡಿ ಬರಲ್ಲ, ವಾಸನೆ ಹಿಡ್ಕೊಂಡು ಬರ್ತಾರೆ.
    tr: Kannaḍa nāḍalli Kannaḍa bōrḍ-ge rūl bēkā? Namma kāladalli ellā bōrḍ Kannaḍadallē irtittu. Nitin, Kannaḍa ōdōke baradōru bōrḍ nōḍi baralla, vāsane hiḍkoṇḍu bartāre.
    en: Does a Kannada board in the land of Kannada need a rule? In our day every board was in Kannada. Nitin, people who can't read Kannada don't come because of the board; they follow the smell.
  - who: nitin
    t: ದೊಡ್ಡಮ್ಮ, ನಿಮ್ಮ ಚಟ್ನಿ ವಾಸನೆ ಯಾವ ಬೋರ್ಡ್‌ಗಿಂತಲೂ ದೊಡ್ಡ ಜಾಹೀರಾತು, ಒಪ್ತೀನಿ. ಸರಿ, ಕನ್ನಡ ಮೇಲೆ. ಆದ್ರೆ ಕೆಳಗೆ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ “ಪ್ಯೂರ್ ವೆಜ್” ಅಂತಾದ್ರೂ ಇರ್ಲಿ.
    tr: Doḍḍamma, nimma chaṭni vāsane yāva bōrḍ-gintalū doḍḍa jāhīrātu, optīni. Sari, Kannaḍa mēle. Ādre keḷage iṅgliṣ-nalli “pyūr vej” antādrū irli.
    en: Doddamma, the smell of your chutney is a bigger advertisement than any board, I agree. Fine, Kannada on top. But at least let “Pure Veg” be there below, in English.
  - who: kavya
    t: ಅದು ಸರಿ. ಮೇಲೆ ದೊಡ್ಡದಾಗಿ “ಶಾರದಾ ದರ್ಶಿನಿ”, ಅದರ ಕೆಳಗೆ “ಶುದ್ಧ ಸಸ್ಯಾಹಾರಿ ಉಪಾಹಾರ”. ಕೊನೆಯ ಪಟ್ಟಿಯಲ್ಲಿ ಇಂಗ್ಲಿಷ್ ಹೆಸರು, “ಪ್ಯೂರ್ ವೆಜ್”, ಜಿಎಸ್‌ಟಿ ನಂಬರ್. ಎತ್ತರ ಅಳತೆ ಮಾಡಿ ಪೇಂಟರ್‌ಗೆ ಸೆಂಟಿಮೀಟರ್ ಲೆಕ್ಕದಲ್ಲಿ ಹೇಳ್ತೀನಿ.
    tr: Adu sari. Mēle doḍḍadāgi “Śāradā Darśini”, adara keḷage “śuddha sasyāhāri upāhāra”. Koneya paṭṭiyalli iṅgliṣ hesaru, “pyūr vej”, ji-es-ṭi nambar. Ettara aḷate māḍi pēṇṭar-ge seṇṭimīṭar lekkadalli hēḷtīni.
    en: 'That''s fine. On top, big: “Sharada Darshini”, under it “Pure vegetarian tiffin”. On the bottom strip, the English name, “Pure Veg” and the GST number. I''ll measure the heights and give the painter the numbers in centimetres.'
  - who: mahesh
    t: ಮತ್ತೆ ಬಾಲ್ಕನಿ ಮುಚ್ಚಬಾರದು, ಮೂರ್ತಿ ಸಾರ್ ಕಂಡೀಷನ್. ಬೋರ್ಡ್ ಎತ್ತರ ಮೂರು ಅಡಿ ಮೀರಬಾರದು.
    tr: Matte bālkani mucchabāradu, Mūrti sār kaṇḍīṣan. Bōrḍ ettara mūru aḍi mīrabāradu.
    en: And it mustn't cover the balcony; that's Murthy sir's condition. The board can't be more than three feet high.
  - who: amma
    t: ಬೋರ್ಡ್ ಹಾಕಿದ ದಿನ ನಿಂಬೆಹಣ್ಣು, ಮೆಣಸಿನಕಾಯಿ ಕಟ್ಟಬೇಕು. ಅದು ನನ್ನ ರೂಲ್.
    tr: Bōrḍ hākida dina nimbehaṇṇu, meṇasinakāyi kaṭṭabēku. Adu nanna rūl.
    en: On the day the board goes up, a lemon and chillies must be tied to it. That's my rule.
  - who: nitin
    t: ಅದಕ್ಕೆ ಎಷ್ಟು ಪರ್ಸೆಂಟ್ ದೊಡ್ಡಮ್ಮ?
    tr: Adakke eṣṭu parsenṭ doḍḍamma?
    en: And how many percent for that, Doddamma?
  - who: amma
    t: ನೂರು ಪರ್ಸೆಂಟ್.
    tr: Nūru parsenṭ.
    en: A hundred percent.
  - section: 'The trade licence: a portal and a missing paper'
    learn: 'GBA trade licence (uddime paravānagi): category, fee, inspection, approval chain · renewal: Phebravari 1–28 no fine, March +25%, April +100% · frustration: sarvar ḍaun, ḍākyumeṇṭ illa · the landlord''s property-tax receipt'
  - scene: Tuesday, 16 December, 11:40 p.m. The board went up that afternoon, lemon and chillies included; Kavya has its photos on her phone. The GBA trade-licence portal has shown the same message since nine.
  - who: mahesh
    t: ಇನ್ನೂ ಬಂದಿಲ್ವಾ? ಒಂಬತ್ತು ಗಂಟೆಯಿಂದ ಅದೇ ಪೇಜ್.
    tr: Innū bandilvā? Ombattu gaṇṭeyinda adē pēj.
    en: Still not up? The same page since nine o'clock.
  - who: kavya
    t: “ಸರ್ವರ್ ನಿರ್ವಹಣೆಯಲ್ಲಿದೆ, ದಯವಿಟ್ಟು ನಂತರ ಪ್ರಯತ್ನಿಸಿ.” ನಂತರ ಅಂದ್ರೆ ಯಾವಾಗ ಅಂತ ಹೇಳಲ್ಲ. ಬಿಬಿಎಂಪಿ ಜಿಬಿಎ ಆಯ್ತು, ಪೋರ್ಟಲ್ ಮಾತ್ರ ಹಾಗೇ ಇದೆ.
    tr: “Sarvar nirvahaṇeyallide, dayaviṭṭu nantara prayatnisi.” Nantara andre yāvāga anta hēḷalla. Bi-bi-em-pi ji-bi-e āytu, pōrṭal mātra hāgē ide.
    en: (Reading) “The server is under maintenance; please try later.” It doesn't say when later is. BBMP became GBA, but the portal has stayed exactly the same.
  - who: mahesh
    t: ನಾಳೆ ಬೆಳಗ್ಗೆ ಆಫೀಸ್‌ಗೇ ಹೋಗಿ ಕೊಟ್ಟುಬಿಡ್ತೀನಿ.
    tr: Nāḷe beḷagge āphīs-gē hōgi koṭṭubiḍtīni.
    en: I'll just go to the office tomorrow morning and hand it in.
  - who: kavya
    t: ಆಫೀಸ್‌ನಲ್ಲೂ ಇದೇ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಹಾಕ್ತಾರೆ. ಅಲ್ಲಿಗೆ ಹೋದ್ರೆ ಹೊರಗೆ ನಿಂತಿರೋರು “ಏಜೆಂಟ್ ಮೂಲಕ ಮಾಡಿಸಿ” ಅಂತ ಹಿಡ್ಕೊಳ್ತಾರೆ. ಬೆಳಗಿನ ಜಾವ ಸರ್ವರ್ ಖಾಲಿ ಇರುತ್ತೆ. ಐದು ಗಂಟೆಗೆ ಅಲಾರಂ ಇಡು.
    tr: Āphīs-nallū idē pōrṭal-nalli hāktāre. Allige hōdre horage nintirōru “ējeṇṭ mūlaka māḍisi” anta hiḍkoḷtāre. Beḷagina jāva sarvar khāli irutte. Aidu gaṇṭege alāram iḍu.
    en: 'Even at the office they enter it on the same portal. Go there and the men standing outside will grab you: “get it done through an agent”. In the early morning the server is free. Set an alarm for five.'
  - scene: 5:10 a.m. The portal opens. Kavya fills in the form; Mahesh reads out from a folder.
  - who: kavya
    t: 'ವ್ಯಾಪಾರದ ವಿಧ: ಹೋಟೆಲ್, ರೆಸ್ಟೋರೆಂಟ್, ತಿಂಡಿ. ಜಾಗ ಐನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್, ಫೀಸ್ ಅದರ ಮೇಲೆ ಲೆಕ್ಕ ಆಗುತ್ತೆ. ಈಗ ಅಪ್‌ಲೋಡ್: ಲೀಸ್ ಡೀಡ್, ಆಧಾರ್, ಪ್ಯಾನ್, ಜಿಎಸ್‌ಟಿ, ಕರೆಂಟ್ ಬಿಲ್, ಬೋರ್ಡ್ ಫೋಟೋ… ಮತ್ತೆ ಓನರ್‌ನ ಈ ವರ್ಷದ ಪ್ರಾಪರ್ಟಿ ಟ್ಯಾಕ್ಸ್ ರಶೀದಿ.'
    tr: 'Vyāpārada vidha: hōṭel, resṭōreṇṭ, tiṇḍi. Jāga ainūru skvēr fīṭ, phīs adara mēle lekka āgutte. Īga ap-lōḍ: līs ḍīḍ, ādhār, pyān, ji-es-ṭi, karaṇṭ bil, bōrḍ phōṭō… matte ōnar-na ī varṣada prāparṭi ṭyāks raśīdi.'
    en: 'Type of trade: hotel, restaurant, eatery. Area five hundred square feet; the fee is calculated from that. Now the uploads: lease deed, Aadhaar, PAN, GST, electricity bill, board photos… and the owner''s property-tax receipt for this year.'
  - who: mahesh
    t: ಅದು… ನಮ್ಮ ಹತ್ರ ಇಲ್ಲ. ಲೀಸ್ ಟೈಮ್‌ನಲ್ಲಿ ಹೋದ ವರ್ಷದ್ದು ಕೊಟ್ಟಿದ್ರು.
    tr: Adu… namma hatra illa. Līs ṭaim-nalli hōda varṣaddu koṭṭidru.
    en: That… we don't have it. At the time of the lease he gave us last year's.
  - who: kavya
    t: ಹಳೇದು ತಗೊಳ್ಳಲ್ಲ. ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ ಕೂಡ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ಅದರ ಅರ್ಜಿ ನಂಬರ್ ಹಾಕ್ತೀನಿ. ಮೂರ್ತಿ ಸಾರ್ ಎದ್ದಮೇಲೆ ಕೇಳು. ಐದು ಗಂಟೆಗೆ ಫೋನ್ ಮಾಡಿದ್ರೆ ಲೀಸ್ ಕ್ಯಾನ್ಸಲ್ ಮಾಡ್ತಾರೆ.
    tr: Haḷēdu tagoḷḷalla. Ef-es-es-e-ai kūḍa innū bandilla, adara arji nambar hāktīni. Mūrti sār eddamēle kēḷu. Aidu gaṇṭege phōn māḍidre līs kyānsal māḍtāre.
    en: It won't accept the old one. FSSAI hasn't come yet either; I'll enter its application number. Ask Murthy sir once he's up. Phone him at five and he'll cancel the lease.
  - scene: 8 a.m. Upstairs, Mr. Murthy, in a banian with a towel over his shoulder, opens a steel cupboard full of labelled files.
  - who: landlord
    t: ಪ್ರಾಪರ್ಟಿ ಟ್ಯಾಕ್ಸ್ ರಶೀದಿ? ಏಪ್ರಿಲ್‌ನಲ್ಲೇ ಕಟ್ಟಿದೀನಿ, ಐದು ಪರ್ಸೆಂಟ್ ರಿಬೇಟ್‌ಗೋಸ್ಕರ. ಇಗೋ. ಸ್ಟೇಷನರಿ ಅಂಗಡಿ ಇದ್ದಾಗಿಂದಲೂ ಕೆಳಗಿನ ಭಾಗಕ್ಕೆ ಕಮರ್ಷಿಯಲ್ ರೇಟ್‌ನಲ್ಲೇ ಕಟ್ತಿದೀನಿ. ಮನೆ ಅಂತ ತೋರಿಸಿ ಉಳಿಸೋ ಬುದ್ಧಿ ನನಗಿಲ್ಲ. ಅದಕ್ಕೇ ನಿಮ್ಮ ಲೈಸೆನ್ಸ್‌ಗೆ ತೊಂದರೆ ಆಗಲ್ಲ.
    tr: Prāparṭi ṭyāks raśīdi? Ēpril-nallē kaṭṭidīni, aidu parsenṭ ribēṭ-gōskara. Igō. Sṭēṣanari aṅgaḍi iddāgindalū keḷagina bhāgakke kamarṣiyal rēṭ-nallē kaṭtidīni. Mane anta tōrisi uḷisō buddhi nanagilla. Adakkē nimma laisens-ge tondare āgalla.
    en: Property-tax receipt? I paid it in April itself, for the five-percent rebate. Here. Ever since the stationery shop was there, I've paid the commercial rate for the ground floor. I'm not the type to save money by showing it as a house. That's why your licence won't run into trouble.
  - who: mahesh
    t: ಅದಕ್ಕೇ ನಿಮ್ಮ ಜಾಗ ತಗೊಂಡಿದ್ದು ಸಾರ್. ಸ್ಕ್ಯಾನ್ ಮಾಡಿ ಇವತ್ತೇ ವಾಪಸ್ ಕೊಡ್ತೀನಿ.
    tr: Adakkē nimma jāga tagoṇḍiddu sār. Skyān māḍi ivattē vāpas koḍtīni.
    en: That's why we took your place, sir. I'll scan it and give it back today.
  - scene: That evening the application goes through. The fee is paid online, and the portal shows a status line.
  - who: kavya
    t: 'ಕಟ್ಟಿದ್ದು ಏಳು ಸಾವಿರದ ಚಿಲ್ಲರೆ, ಒಂದು ವರ್ಷಕ್ಕೆ. ಸ್ಟೇಟಸ್: “ತಪಾಸಣೆಗೆ ಬಾಕಿ.” ಇದಾದ ಮೇಲೆ ಮೆಡಿಕಲ್ ಆಫೀಸರ್, ಹೆಲ್ತ್ ಆಫೀಸರ್, ಜಾಯಿಂಟ್ ಕಮಿಷನರ್, ಎಲ್ಲರ ಟೇಬಲ್ ದಾಟ್ಬೇಕು.'
    tr: 'Kaṭṭiddu ēḷu sāvirada chillare, ondu varṣakke. Sṭēṭas: “tapāsaṇege bāki.” Idāda mēle meḍikal āphīsar, helth āphīsar, jāyiṇṭ kamiṣanar, ellara ṭēbal dāṭbēku.'
    en: 'We paid seven thousand odd, for one year. Status: “pending inspection”. After that it has to cross the desks of the medical officer, the health officer, the joint commissioner, all of them.'
  - who: mahesh
    t: ಒಂದು ವರ್ಷಕ್ಕೆ ಮಾತ್ರನಾ? ಮುಂದಿನ ವರ್ಷ ಮತ್ತೆ ಇದೆಲ್ಲ?
    tr: Ondu varṣakke mātranā? Mundina varṣa matte idella?
    en: Only for one year? All this again next year?
  - who: kavya
    t: ರಿನೀವಲ್ ಸುಲಭ, ಆದ್ರೆ ಡೇಟ್ ನೆನಪಿಡು. ಫೆಬ್ರವರಿ ಒಂದರಿಂದ ಇಪ್ಪತ್ತೆಂಟರೊಳಗೆ ಮಾಡಿದ್ರೆ ಫೈನ್ ಇಲ್ಲ. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಇಪ್ಪತ್ತೈದು ಪರ್ಸೆಂಟ್ ಜಾಸ್ತಿ. ಏಪ್ರಿಲ್‌ನಿಂದ ಡಬಲ್. ನಿನ್ನ ಫೋನ್‌ನಲ್ಲಿ ರಿಮೈಂಡರ್ ಹಾಕಿದೀನಿ.
    tr: Rinīval sulabha, ādre ḍēṭ nenapiḍu. Phebravari ondarinda ippatteṇṭaroḷage māḍidre phain illa. Mārch-nalli ippattaidu parsenṭ jāsti. Ēpril-ninda ḍabal. Ninna phōn-nalli rimainḍar hākidīni.
    en: Renewal is easy, but remember the dates. Between the first and the twenty-eighth of February, no fine. In March, twenty-five percent extra. From April, double. I've put a reminder on your phone.
  - section: The sanction letter
    learn: 'syāṅkṣan, kantu (instalment), ḍisbarsmeṇṭ, moraṭōriyam, vime (insurance) · stages: modala kantu…, adāda mēle mātra… · conditions: -ade (without) … āgalla · money per day: dinakke eṣṭu'
  - scene: Friday, 19 December 2025. Ms. Rashmi's cabin at the bank. A printed letter in a plastic sleeve lies on the desk.
  - who: bank
    t: 'ಅಭಿನಂದನೆಗಳು. ಸ್ಯಾಂಕ್ಷನ್ ಆಯ್ತು. ತರುಣ್ ಕೆಟಗರಿ, ಹತ್ತು ಲಕ್ಷ. ಬಡ್ಡಿ ಹತ್ತು ಪಾಯಿಂಟ್ ಎರಡೈದು ಪರ್ಸೆಂಟ್, ಐದು ವರ್ಷ. ಮೊದಲ ಆರು ತಿಂಗಳು ಮೊರಟೋರಿಯಂ ಸಿಕ್ಕಿದೆ: ಆ ಟೈಮ್‌ನಲ್ಲಿ ಬಡ್ಡಿ ಮಾತ್ರ ಕಟ್ಬೇಕು.'
    tr: 'Abhinandanegaḷu. Syāṅkṣan āytu. Taruṇ keṭagari, hattu lakṣa. Baḍḍi hattu pāyiṇṭ eraḍaidu parsenṭ, aidu varṣa. Modala āru tingaḷu moraṭōriyam sikkide: ā ṭaim-nalli baḍḍi mātra kaṭbēku.'
    en: 'Congratulations. It''s sanctioned. Tarun category, ten lakh. Interest ten point two five percent, five years. You''ve been given a six-month moratorium at the start: during that time you pay only interest.'
  - who: mahesh
    t: ಮೇಡಂ, ತುಂಬಾ ಥ್ಯಾಂಕ್ಸ್. ಮೂರು ವಾರ ಅಂದಿದ್ರಿ, ಮೂರು ವಾರದಲ್ಲೇ ಆಯ್ತು.
    tr: Mēḍam, tumbā thyāṅks. Mūru vāra andidri, mūru vāradallē āytu.
    en: Madam, thank you so much. You said three weeks, and it came in three weeks.
  - who: bank
    t: ಫೈಲ್ ಪೂರ್ತಿ ಇತ್ತು, ಅದಕ್ಕೆ. ಕಾವ್ಯ ಅವರ ಪ್ರಾಜೆಕ್ಟ್ ರಿಪೋರ್ಟ್ ನೋಡಿ ನಮ್ಮ ಕ್ರೆಡಿಟ್ ಮ್ಯಾನೇಜರ್ ಕೂಡ “ರಿಪೋರ್ಟ್ ಅಂದ್ರೆ ಹೀಗಿರ್ಬೇಕು” ಅಂದ್ರು. ಈಗ ಡಿಸ್ಬರ್ಸ್‌ಮೆಂಟ್ ಹೇಗೆ ಅಂತ ಸರಿಯಾಗಿ ಕೇಳಿ. ದುಡ್ಡು ಒಂದೇ ಸಲ ಬರಲ್ಲ, ಎರಡು ಕಂತಲ್ಲಿ.
    tr: Phail pūrti ittu, adakke. Kāvya avara prājekṭ ripōrṭ nōḍi namma kreḍiṭ myānējar kūḍa “ripōrṭ andre hīgirbēku” andru. Īga ḍisbarsmeṇṭ hēge anta sariyāgi kēḷi. Duḍḍu ondē sala baralla, eraḍu kantalli.
    en: That's because the file was complete. Even our credit manager looked at Kavya's project report and said, “This is what a report should look like.” Now listen carefully to how the disbursement works. The money doesn't come all at once; it comes in two instalments.
  - who: bank
    t: 'ಮೊದಲ ಕಂತು ಆರು ಲಕ್ಷ: ನೀವು ಆರಿಸಿದ ಕಿಚನ್ ಸಪ್ಲೈಯರ್‌ಗೆ, ಅವರ ಕೊಟೇಷನ್ ಪ್ರಕಾರ, ನೇರವಾಗಿ. ಸಾಮಾನು ಬಂದು ಫಿಟ್ ಆದ್ಮೇಲೆ ನಾನು ಅಂಗಡಿಗೆ ಬಂದು ನೋಡ್ತೀನಿ, ಬಿಲ್, ಸೀರಿಯಲ್ ನಂಬರ್ ಎಲ್ಲಾ ಚೆಕ್ ಮಾಡ್ತೀನಿ. ಅದಾದ ಮೇಲೆ ಮಾತ್ರ ಉಳಿದ ನಾಲ್ಕು ಲಕ್ಷ.'
    tr: 'Modala kantu āru lakṣa: nīvu ārisida kichan saplaiyar-ge, avara koṭēṣan prakāra, nēravāgi. Sāmānu bandu phiṭ ādmēle nānu aṅgaḍige bandu nōḍtīni, bil, sīriyal nambar ellā chek māḍtīni. Adāda mēle mātra uḷida nālku lakṣa.'
    en: The first instalment, six lakh, goes straight to the kitchen supplier you chose, as per their quotation. After the equipment arrives and is fitted, I'll come to the shop and check the bills, the serial numbers, everything. Only after that, the remaining four lakh.
  - who: kavya
    t: ಉಳಿದ ನಾಲ್ಕರಲ್ಲಿ ಎರಡು ಲಕ್ಷ ಅರವತ್ತು ಸಾವಿರ ಸಪ್ಲೈಯರ್‌ನ ಬಾಕಿಗೆ, ಒಂದು ಲಕ್ಷ ನಲವತ್ತು ಇಂಟೀರಿಯರ್ ಬಾಕಿಗೆ. ಇಂಟೀರಿಯರ್ ಬಿಲ್‌ಗಳೂ ಜಿಎಸ್‌ಟಿ ಬಿಲ್‌ಗಳೇ ಮೇಡಂ.
    tr: Uḷida nālkaralli eraḍu lakṣa aravattu sāvira saplaiyar-na bākige, ondu lakṣa nalavattu iṇṭīriyar bākige. Iṇṭīriyar bil-gaḷū ji-es-ṭi bil-gaḷē mēḍam.
    en: Of the remaining four, two lakh sixty thousand for the supplier's balance and one lakh forty for the interior contractor's balance. The interior bills are proper GST bills too, madam.
  - who: bank
    t: ಒಳ್ಳೇದು. ಇನ್ನೆರಡು ಕಂಡೀಷನ್. ಲೋನ್ ಸಾಮಾನಿಗೆ ವಿಮೆ ಮಾಡಿಸ್ಬೇಕು, ಬ್ಯಾಂಕ್ ಹೆಸರು ಸೇರಿಸಿ, ಬೆಂಕಿ ಮತ್ತೆ ಕಳ್ಳತನ ಎರಡಕ್ಕೂ. ಮತ್ತೆ ಎರಡನೇ ಕಂತಿಗೆ ಮುಂಚೆ ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಕಾಪಿ ಬೇಕು. ಅದು ಬರದೆ ನಾನು ಏನೂ ಮಾಡೋಕಾಗಲ್ಲ.
    tr: Oḷḷēdu. Inneraḍu kaṇḍīṣan. Lōn sāmānige vime māḍisbēku, byāṅk hesaru sērisi, beṅki matte kaḷḷatana eraḍakkū. Matte eraḍanē kantige muñche ṭrēḍ laisens kāpi bēku. Adu barade nānu ēnū māḍōkāgalla.
    en: Good. Two more conditions. The loan equipment has to be insured, with the bank's name added, against both fire and theft. And before the second instalment I need a copy of the trade licence. Without it I can't do anything.
  - who: mahesh
    t: ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಇನ್ಸ್‌ಪೆಕ್ಷನ್‌ಗೆ ಕಾಯ್ತಿದೆ ಮೇಡಂ. ಅದು ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐಗೆ ಕಾಯ್ತಿದೆ. ಎಲ್ಲಾ ಒಂದರ ಮೇಲೆ ಒಂದು ನಿಂತಿದೆ.
    tr: Ṭrēḍ laisens inspekṣan-ge kāytide mēḍam. Adu ef-es-es-e-ai-ge kāytide. Ellā ondara mēle ondu nintide.
    en: The trade licence is waiting for inspection, madam. And that is waiting for FSSAI. Everything is stacked one on top of another.
  - who: bank
    t: 'ಸರ್ಕಾರಿ ಕೆಲಸ ಹಾಗೇ, ರೈಲಿನ ಡಬ್ಬಿ ಥರ. ಎಂಜಿನ್ ಓಡಿದ್ರೆ ಉಳಿದದ್ದು ಹಿಂದೆ ಬರುತ್ತೆ. ಇನ್ನೊಂದು ವಿಷಯ, ಮಹೇಶ್ ಅವರೇ: ಮೊರಟೋರಿಯಂ ಅಂದ್ರೆ ಬಡ್ಡಿ ಮಾಫಿ ಅಲ್ಲ. ಆರು ತಿಂಗಳು ಬಡ್ಡಿ ಮಾತ್ರ, ಆಮೇಲೆ ಪೂರ್ತಿ ಇಎಂಐ. ಆ ಆರು ತಿಂಗಳೂ ಐದು ವರ್ಷದೊಳಗೇ ಬರೋದ್ರಿಂದ ಇಎಂಐ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ, ಸುಮಾರು ಇಪ್ಪತ್ಮೂರು ಸಾವಿರ.'
    tr: 'Sarkāri kelasa hāgē, railina ḍabbi thara. Eñjin ōḍidre uḷidaddu hinde barutte. Innondu viṣaya, Mahēś avarē: moraṭōriyam andre baḍḍi māphi alla. Āru tingaḷu baḍḍi mātra, āmēle pūrti i-em-ai. Ā āru tingaḷū aidu varṣadoḷagē barōdrinda i-em-ai svalpa jāsti, sumāru ippatmūru sāvira.'
    en: 'Government work is like that, like railway coaches. When the engine moves, the rest follow. One more thing, Mahesh: a moratorium doesn''t mean the interest is waived. Six months of interest only, then the full EMI. Because those six months fall inside the five years, the EMI is a little higher: about twenty-three thousand.'
  - who: kavya
    t: ಅಂದ್ರೆ ಜನವರಿಯಿಂದ ಜೂನ್‌ವರೆಗೆ ತಿಂಗಳಿಗೆ ಸುಮಾರು ಎಂಟೂವರೆ ಸಾವಿರ ಬಡ್ಡಿ. ಜುಲೈಯಿಂದ ಇಪ್ಪತ್ಮೂರು. ಬರ್ಕೊಂಡೆ.
    tr: Andre Janavariyinda Jūn-varege tingaḷige sumāru eṇṭūvare sāvira baḍḍi. Julaiyinda ippatmūru. Barkoṇḍe.
    en: So from January to June, about eight and a half thousand a month in interest. From July, twenty-three. Noted.
  - who: mahesh
    t: ಜುಲೈಯಿಂದ ದಿನಕ್ಕೆ ಸುಮಾರು ಎಂಟುನೂರು ರೂಪಾಯಿ ಬ್ಯಾಂಕ್‌ಗೆ. ಅಂದ್ರೆ ದಿನಾ ಮೊದಲ ಹತ್ತು ಮಸಾಲೆ ದೋಸೆ ಬ್ಯಾಂಕ್‌ದು.
    tr: Julaiyinda dinakke sumāru eṇṭunūru rūpāyi byāṅk-ge. Andre dinā modala hattu masāle dōse byāṅk-du.
    en: From July, about eight hundred rupees a day to the bank. So every day, the first ten masala doses belong to the bank.
  - who: bank
    t: ಹಾಗೆ ಲೆಕ್ಕ ಹಾಕೋರು ಸಾಮಾನ್ಯವಾಗಿ ಲೋನ್ ಸರಿಯಾಗಿ ಕಟ್ತಾರೆ. ಆಲ್ ದಿ ಬೆಸ್ಟ್. ಓಪನಿಂಗ್‌ಗೆ ಕರೀರಿ.
    tr: Hāge lekka hākōru sāmānyavāgi lōn sariyāgi kaṭtāre. Āl di besṭ. Ōpaniṅg-ge karīri.
    en: People who do that sum usually repay their loans properly. All the best. Invite me to the opening.
  - section: Mr. Gowda's inspection
    learn: 'inspection talk: tōrisi, elli, ellige hōgutte · an official''s hint: svalpa nōḍkoṇḍre…, adara pāḍige adu hōgutte · polite refusal: chalan koḍi, raśīdi samēta kaṭtīni, kāytīni · reported speech: mātu koṭṭidīni … anta'
  - scene: 'Tuesday, 23 December, 11 a.m. The shop is half-built: granite counters in, wall tiles drying, wires hanging where the chimney hood will go. Mr. Gowda, the GBA health inspector, arrives on a scooter with a file under his arm.'
  - who: officer
    t: ಶಾರದಾ ದರ್ಶಿನಿ ಅಂದ್ರೆ ಇದೇನಾ? ಇನ್ನೂ ಕೆಲಸ ನಡೀತಿದೆಯಲ್ಲ. ಪಾರ್ಟ್ನರ್ ಯಾರು?
    tr: Śāradā Darśini andre idēnā? Innū kelasa naḍītideyalla. Pārṭnar yāru?
    en: So this is Sharada Darshini? Work is still going on, I see. Who's the partner?
  - who: mahesh
    t: ನಾನೇ ಸಾರ್, ಮಹೇಶ್ ಉಪಾಧ್ಯ. ಇನ್ನೊಬ್ಬ ಪಾರ್ಟ್ನರ್ ನನ್ನ ತಮ್ಮ, ಅವನು ಆಫೀಸ್‌ಗೆ ಹೋಗಿದಾನೆ. ಕೂತ್ಕೊಳ್ಳಿ ಸಾರ್, ಕಾಫಿ ತರಿಸ್ತೀನಿ.
    tr: Nānē sār, Mahēś Upādhya. Innobba pārṭnar nanna tamma, avanu āphīs-ge hōgidāne. Kūtkoḷḷi sār, kāphi taristīni.
    en: I am, sir, Mahesh Upadhya. The other partner is my cousin; he's at his office. Please sit, sir, I'll have some coffee brought.
  - who: officer
    t: ಕಾಫಿ ಆಮೇಲೆ. ಮೊದಲು ನೋಡೋಣ. ಅಡುಗೆಮನೆ ಎಲ್ಲಿ? ಡ್ರೈನೇಜ್ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತೆ? ಗ್ರೀಸ್ ಟ್ರ್ಯಾಪ್ ಎಲ್ಲಿ?
    tr: Kāphi āmēle. Modalu nōḍōṇa. Aḍugemane elli? Ḍrainēj ellige hōgutte? Grīs ṭryāp elli?
    en: Coffee later. Let's look first. Where's the kitchen? Where does the drainage go? Where's the grease trap?
  - who: mahesh
    t: ಇಲ್ಲಿ ಸಾರ್, ಸಿಂಕ್ ಕೆಳಗೆ. ಎರಡು ಚೇಂಬರ್ ಗ್ರೀಸ್ ಟ್ರ್ಯಾಪ್, ಅಲ್ಲಿಂದ ಹೊಸ ಪೈಪ್ ಮೇನ್ ಲೈನ್‌ಗೆ. ಓನರ್ ಹೋದ ವಾರ ಹೊಸ ಪೈಪ್ ಹಾಕಿಸಿದ್ರು.
    tr: Illi sār, siṅk keḷage. Eraḍu chēmbar grīs ṭryāp, allinda hosa paip mēn lain-ge. Ōnar hōda vāra hosa paip hākisidru.
    en: Here, sir, under the sink. A two-chamber grease trap, and from there a new pipe to the main line. The owner had the new pipe laid last week.
  - who: officer
    t: ಹ್ಮ್. ಚಿಮಣಿ ಹೊಗೆ ಎಲ್ಲಿಗೆ ಬಿಡ್ತೀರಿ? ಪಕ್ಕದ ಮನೆಯವರ ಕಿಟಕಿಗೆ ಬಿಟ್ರೆ ನಾಳೆ ಕಂಪ್ಲೇಂಟ್ ನನಗೇ ಬರುತ್ತೆ.
    tr: Hm. Chimaṇi hoge ellige biḍtīri? Pakkada maneyavara kiṭakige biṭre nāḷe kampleṇṭ nanagē barutte.
    en: Hm. Where will the chimney smoke go out? If it goes into the neighbours' window, tomorrow the complaint comes to me.
  - who: mahesh
    t: ಡಕ್ಟ್ ಟೆರೇಸ್‌ನಿಂದ ಮೂರು ಅಡಿ ಮೇಲೆ ಹೋಗುತ್ತೆ ಸಾರ್. ಡ್ರಾಯಿಂಗ್ ಇದೆ, ನೋಡಿ. ಕೆಲಸ ಜನವರಿ ಮೊದಲ ವಾರ ಮುಗಿಯುತ್ತೆ.
    tr: Ḍakṭ ṭerēs-ninda mūru aḍi mēle hōgutte sār. Ḍrāyiṅg ide, nōḍi. Kelasa Janavari modala vāra mugiyutte.
    en: The duct goes three feet above the terrace, sir. Here's the drawing. The work will be finished in the first week of January.
  - who: officer
    t: ಬೋರ್ಡ್ ಸರಿ ಇದೆ, ಕನ್ನಡ ಮೇಲೆ ದೊಡ್ಡದಾಗಿ ಇದೆ. ಒಳ್ಳೇದು. ಅರ್ಧ ಜನ ಇಂಗ್ಲಿಷ್ ದೊಡ್ಡದಾಗಿ ಹಾಕಿ, ಸೀಲ್ ಆದ್ಮೇಲೆ ಓಡಿ ಬರ್ತಾರೆ.
    tr: Bōrḍ sari ide, Kannaḍa mēle doḍḍadāgi ide. Oḷḷēdu. Ardha jana iṅgliṣ doḍḍadāgi hāki, sīl ādmēle ōḍi bartāre.
    en: The board is fine; the Kannada is big and on top. Good. Half the people put the English big and come running after they get sealed.
  - who: officer
    t: ಸರಿ. ಪೇಪರ್ ಎಲ್ಲಾ ಸರಿ ಇದೆ. ಆದ್ರೆ ನೋಡಿ, ನನ್ನ ರಿಪೋರ್ಟ್ ಆದ್ಮೇಲೆ ಫೈಲ್ ಇನ್ನೂ ನಾಲ್ಕು ಟೇಬಲ್ ದಾಟ್ಬೇಕು. ಹೊಸ ವರ್ಷದ ರಜೆ, ಸಾಹೇಬ್ರು ಬ್ಯುಸಿ… ಜನವರಿ ಇಪ್ಪತ್ತಾರಕ್ಕೆ ಓಪನಿಂಗ್ ಅಂದ್ರಿ ಅಲ್ವಾ?
    tr: Sari. Pēpar ellā sari ide. Ādre nōḍi, nanna ripōrṭ ādmēle phail innū nālku ṭēbal dāṭbēku. Hosa varṣada raje, sāhēbru byusi… Janavari ippattārakke ōpaniṅg andri alvā?
    en: All right. The papers are all in order. But look, after my report the file still has to cross four desks. New Year holidays, the bosses are busy… You said the opening is on the twenty-sixth of January, didn't you?
  - who: mahesh
    t: ಹೌದು ಸಾರ್.
    tr: Haudu sār.
    en: Yes, sir.
  - who: officer
    t: ಅದಕ್ಕೇ ಹೇಳ್ತಿದೀನಿ. ಕೆಲವರು ನಮ್ಮನ್ನ ಸ್ವಲ್ಪ “ನೋಡ್ಕೊಂಡ್ರೆ” ಫೈಲ್ ಬೇಗ ಓಡುತ್ತೆ. ನಾನೇ ಕೈಯಲ್ಲಿ ತಗೊಂಡು ಹೋಗಿ ಸಹಿ ಮಾಡಿಸ್ಕೊಂಡು ಬರ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ… ಅದರ ಪಾಡಿಗೆ ಅದು ಹೋಗುತ್ತೆ. ಯಾವಾಗ ತಲುಪುತ್ತೋ ಗೊತ್ತಿಲ್ಲ.
    tr: Adakkē hēḷtidīni. Kelavaru nammanna svalpa “nōḍkoṇḍre” phail bēga ōḍutte. Nānē kaiyalli tagoṇḍu hōgi sahi māḍiskoṇḍu bartīni. Illāndre… adara pāḍige adu hōgutte. Yāvāga taluputtō gottilla.
    en: That's why I'm telling you. When some people “take care of” us a little, the file runs fast. I carry it by hand myself and get the signatures. Otherwise… it goes at its own pace. Who knows when it gets there.
  - who: mahesh
    t: ಅರ್ಥ ಆಯ್ತು ಸಾರ್. ಆದ್ರೆ ಈ ಹೆಸರಲ್ಲಿ ಸುಳ್ಳು ಲೆಕ್ಕ ಇರಲ್ಲ ಅಂತ ನಾನು ಅಮ್ಮನಿಗೆ ಮಾತು ಕೊಟ್ಟಿದೀನಿ. ಫೀಸ್ ಏನಿದೆಯೋ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಕಟ್ಟಿದೀನಿ. ಸರ್ಕಾರಕ್ಕೆ ಬೇರೆ ಏನಾದ್ರೂ ಕಟ್ಬೇಕಾದ್ರೆ ಚಲನ್ ಕೊಡಿ, ರಶೀದಿ ಸಮೇತ ಕಟ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ ಕಾಯ್ತೀನಿ.
    tr: Artha āytu sār. Ādre ī hesaralli suḷḷu lekka iralla anta nānu ammanige mātu koṭṭidīni. Phīs ēnideyō ān-lain-nalli kaṭṭidīni. Sarkārakke bēre ēnādrū kaṭbēkādre chalan koḍi, raśīdi samēta kaṭtīni. Illāndre kāytīni.
    en: I understand, sir. But I've given my mother my word that there'll be no false accounts under this name. Whatever the fee is, I've paid it online. If anything else is due to the government, give me a challan and I'll pay it against a receipt. Otherwise, I'll wait.
  - who: officer
    t: ನಾನೇನು ಕೇಳಿದ್ನಾ? ಸಿಸ್ಟಮ್ ಹೇಗಿದೆ ಅಂತ ಹೇಳಿದೆ ಅಷ್ಟೇ. ಸರಿ. ನನ್ನ ರಿಪೋರ್ಟ್ ಇವತ್ತೇ ಅಪ್‌ಲೋಡ್ ಮಾಡ್ತೀನಿ. ಆದ್ರೆ ನೆನಪಿರ್ಲಿ, ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ ಲೈಸೆನ್ಸ್ ಕಾಪಿ ಬರದೆ ಫೈನಲ್ ಅಪ್ರೂವಲ್ ಆಗಲ್ಲ.
    tr: Nānēnu kēḷidnā? Sisṭam hēgide anta hēḷide aṣṭē. Sari. Nanna ripōrṭ ivattē ap-lōḍ māḍtīni. Ādre nenapirli, ef-es-es-e-ai laisens kāpi barade phainal aprūval āgalla.
    en: '(Stiffly) Did I ask for anything? I only told you how the system is. All right. I''ll upload my report today itself. But remember: without a copy of the FSSAI licence, there''s no final approval.'
  - who: mahesh
    t: ಖಂಡಿತ ಸಾರ್. ಕಾಫಿ?
    tr: Khaṇḍita sār. Kāphi?
    en: Of course, sir. Coffee?
  - who: officer
    t: ಇವತ್ತು ಬೇಡ. ಓಪನಿಂಗ್ ಆದ್ಮೇಲೆ ಬರ್ತೀನಿ. ದುಡ್ಡು ಕೊಟ್ಟು ಕುಡೀತೀನಿ.
    tr: Ivattu bēḍa. Ōpaniṅg ādmēle bartīni. Duḍḍu koṭṭu kuḍītīni.
    en: Not today. I'll come after the opening. And I'll pay for it.
  - scene: When he has gone, Mahesh sits on an upturned paint bucket and phones Kavya.
  - who: kavya
    t: ಸರಿಯಾಗಿ ಮಾಡಿದೆ. ಸ್ಟೇಟಸ್ ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ದಿನಾ ತಗೋತೀನಿ. ಜನವರಿ ಹತ್ತರೊಳಗೆ ಫೈಲ್ ಮುಂದೆ ಹೋಗದಿದ್ರೆ ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ಕಂಪ್ಲೇಂಟ್ ಹಾಕೋಣ. ಕೈ ನಡುಗ್ತಿದೆಯಾ?
    tr: Sariyāgi māḍide. Sṭēṭas skrīnśāṭ dinā tagōtīni. Janavari hattaroḷage phail munde hōgadidre ān-lain-nallē kampleṇṭ hākōṇa. Kai naḍugtideyā?
    en: You did the right thing. I'll take a screenshot of the status every day. If the file hasn't moved by the tenth of January, we'll file a complaint online. Is your hand shaking?
  - who: mahesh
    t: ಸ್ವಲ್ಪ. ರಿಸೈನ್ ಮಾಡಿದ ದಿನಕ್ಕಿಂತ ಕಮ್ಮಿ.
    tr: Svalpa. Risain māḍida dinakkinta kammi.
    en: A little. Less than on the day I resigned.
  - section: The fire question
    learn: 'fire safety: phair en-ō-si, eksṭiṅgviṣar, gyās līk ḍiṭekṭar, mēn vālv · hedging what officials say: sāmānyavāgi, bāyimātalli, baravaṇigeyalli alla · concessive pairs: bēkirali biḍali'
  - scene: Saturday, 27 December. Mr. Murthy has come down to see the kitchen. He stops at the back door, where an iron cage for gas cylinders is being welded.
  - who: landlord
    t: ಮಹೇಶ್, ಮೇಲೆ ನಾನು ಮಲಗೋದು. ಕೆಳಗೆ ನಾಲ್ಕು ಗ್ಯಾಸ್ ಸಿಲಿಂಡರ್. ನನಗೂ ರಾತ್ರಿ ನಿದ್ದೆ ಬರ್ಬೇಕಲ್ಲ. ಫೈರ್ ಎನ್‌ಓಸಿ ತಗೊಂಡಿದೀರಾ?
    tr: Mahēś, mēle nānu malagōdu. Keḷage nālku gyās silinḍar. Nanagū rātri nidde barbēkalla. Phair en-ō-si tagoṇḍidīrā?
    en: Mahesh, I sleep upstairs. Downstairs, four gas cylinders. I need to sleep at night too. Have you got a fire NOC?
  - who: mahesh
    t: 'ಅದನ್ನೇ ಕೇಳೋಕೆ ನಿನ್ನೆ ಹತ್ತಿರದ ಫೈರ್ ಸ್ಟೇಷನ್‌ಗೆ ಹೋಗಿದ್ದೆ ಸಾರ್. ಅಲ್ಲಿನ ಅಧಿಕಾರಿ ಹೇಳಿದ್ರು: ಗ್ರೌಂಡ್ ಫ್ಲೋರ್, ಐನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್, ಕೂರೋ ವ್ಯವಸ್ಥೆ ಇಲ್ಲದ ಸಣ್ಣ ಹೋಟೆಲ್‌ಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಪೂರ್ತಿ ಎನ್‌ಓಸಿ ಬೇಕಾಗಲ್ಲ ಅಂತ. ಎತ್ತರದ ಕಟ್ಟಡ, ದೊಡ್ಡ ಜಾಗ, ತುಂಬಾ ಜನ ಕೂರೋ ರೆಸ್ಟೋರೆಂಟ್‌ಗೆ ಬೇಕು ಅಂದ್ರು.'
    tr: 'Adannē kēḷōke ninne hattirada phair sṭēṣan-ge hōgidde sār. Allina adhikāri hēḷidru: grauṇḍ phlōr, ainūru skvēr fīṭ, kūrō vyavasthe illada saṇṇa hōṭel-ge sāmānyavāgi pūrti en-ō-si bēkāgalla anta. Ettarada kaṭṭaḍa, doḍḍa jāga, tumbā jana kūrō resṭōreṇṭ-ge bēku andru.'
    en: That's exactly what I went to ask at the nearest fire station yesterday, sir. The officer there said that a small ground-floor hotel of five hundred square feet with no seating usually doesn't need a full NOC. He said it's needed for tall buildings, large premises, restaurants where lots of people sit.
  - who: landlord
    t: “ಸಾಮಾನ್ಯವಾಗಿ” ಅಂದ್ರು. ಬರವಣಿಗೆಯಲ್ಲಿ ಕೊಟ್ರಾ?
    tr: “Sāmānyavāgi” andru. Baravaṇigeyalli koṭrā?
    en: He said “usually”. Did he give it in writing?
  - who: mahesh
    t: ಇಲ್ಲ ಸಾರ್, ಬಾಯಿಮಾತಲ್ಲಿ. ಅದಕ್ಕೇ ಭಟ್ರ ಹತ್ರಾನೂ ಕೇಳಿದೆ. ನಿಯಮ ಕಟ್ಟಡದ ಎತ್ತರ, ಜಾಗ, ಜನರ ಸಂಖ್ಯೆ ಮೇಲೆ ಡಿಪೆಂಡ್ ಆಗುತ್ತೆ, ಬದಲಾಗ್ತಾನೂ ಇರುತ್ತೆ ಅಂದ್ರು. ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್‌ನವರು ಕೇಳಿದ್ರೆ ಆಗ ಅರ್ಜಿ ಹಾಕೋಣ ಅಂತ. ಆದ್ರೆ ಎನ್‌ಓಸಿ ಬೇಕಿರಲಿ ಬಿಡಲಿ, ಸೇಫ್ಟಿ ನಮಗೆ ಬೇಕು.
    tr: Illa sār, bāyimātalli. Adakkē Bhaṭra hatrānū kēḷide. Niyama kaṭṭaḍada ettara, jāga, janara saṅkhye mēle ḍipeṇḍ āgutte, badalāgtānū irutte andru. Ṭrēḍ laisens-navaru kēḷidre āga arji hākōṇa anta. Ādre en-ō-si bēkirali biḍali, sēphṭi namage bēku.
    en: No, sir, only by word of mouth. That's why I asked Mr. Bhat too. He said the rule depends on the building's height, the area and the number of people, and it keeps changing. If the trade-licence people ask for it, we'll apply then. But NOC or no NOC, we need the safety.
  - who: landlord
    t: ಅದು ಸರಿಯಾದ ಮಾತು. ಏನೇನು ಹಾಕಿಸ್ತೀರಿ?
    tr: Adu sariyāda mātu. Ēnēnu hākistīri?
    en: That's the right way to talk. What will you have installed?
  - who: mahesh
    t: ಎರಡು ಫೈರ್ ಎಕ್ಸ್‌ಟಿಂಗ್ವಿಷರ್, ಒಂದು ಅಡುಗೆಮನೆಯಲ್ಲಿ, ಒಂದು ಕೌಂಟರ್ ಹತ್ರ. ಎಣ್ಣೆ ಬೆಂಕಿಗೆ ಬೇರೆ ತರದ್ದು. ಗ್ಯಾಸ್ ಲೀಕ್ ಡಿಟೆಕ್ಟರ್, ಅಲಾರಂ ಜೊತೆ. ಸಿಲಿಂಡರ್ ಒಳಗೆ ಅಲ್ಲ, ಹೊರಗೆ ಈ ಕಬ್ಬಿಣದ ಕೇಜ್‌ನಲ್ಲಿ, ಗಾಳಿ ಓಡಾಡೋ ಜಾಗದಲ್ಲಿ. ಪೈಪ್‌ಲೈನ್ ಗ್ಯಾಸ್ ಕಂಪನಿಯ ಅಧಿಕೃತ ಫಿಟ್ಟರ್ ಹಾಕ್ತಾರೆ. ರಾತ್ರಿ ಹೋಗೋವಾಗ ಮೇನ್ ವಾಲ್ವ್ ಬಂದ್.
    tr: Eraḍu phair eksṭiṅgviṣar, ondu aḍugemaneyalli, ondu kauṇṭar hatra. Eṇṇe beṅkige bēre taraddu. Gyās līk ḍiṭekṭar, alāram jote. Silinḍar oḷage alla, horage ī kabbiṇada kēj-nalli, gāḷi ōḍāḍō jāgadalli. Paip-lain gyās kampaniya adhikr̥ta phiṭṭar hāktāre. Rātri hōgōvāga mēn vālv band.
    en: Two fire extinguishers, one in the kitchen and one by the counter. A different type for oil fires. A gas-leak detector with an alarm. The cylinders not inside but out here, in this iron cage, where the air moves. The pipeline will be fitted by the gas company's authorised fitter. When we leave at night, the main valve goes off.
  - who: landlord
    t: ಮತ್ತೆ ಸ್ಟಾಫ್‌ಗೆ ಅದನ್ನ ಉಪಯೋಗಿಸೋದು ಹೇಳಿಕೊಡಿ. ಗೋಡೆ ಮೇಲೆ ನೇತಾಡೋ ಎಕ್ಸ್‌ಟಿಂಗ್ವಿಷರ್ ಯಾರಿಗೂ ಉಪಯೋಗಿಸೋಕೆ ಬರದಿದ್ರೆ ಅದು ಬರೀ ಅಲಂಕಾರ.
    tr: Matte sṭāf-ge adanna upayōgisōdu hēḷikoḍi. Gōḍe mēle nētāḍō eksṭiṅgviṣar yārigū upayōgisōke baradidre adu barī alaṅkāra.
    en: And teach the staff how to use them. An extinguisher hanging on the wall that nobody knows how to use is just decoration.
  - who: mahesh
    t: ಓಪನಿಂಗ್‌ಗೆ ಮುಂಚೆ ಒಂದು ಡೆಮೋ ಮಾಡಿಸ್ತೀನಿ ಸಾರ್. ನೀವೂ ಬನ್ನಿ.
    tr: Ōpaniṅg-ge muñche ondu ḍemō māḍistīni sār. Nīvū banni.
    en: I'll arrange a demonstration before the opening, sir. You come too.
  - who: landlord
    t: ಬರ್ತೀನಿ. ಎಪ್ಪತ್ತು ವರ್ಷ ಆದ್ರೂ ಕಲಿಯೋದು ಮುಗಿದಿಲ್ಲ.
    tr: Bartīni. Eppattu varṣa ādrū kaliyōdu mugidilla.
    en: I'll come. Seventy years old, and the learning still isn't over.
  - chapter: Chapter 4 — Kitchen, menu and suppliers
  - section: Three quotations
    learn: 'equipment: ṭilṭiṅg graiṇḍar, iḍli sṭīmar, dōse kāvali, kāphi ḍikākṣan bāylar, chimaṇi huḍ, ḍakṭ · comparing quotes: -ginta kammi/jāsti, heccu kammi ondē, vāraṇṭi, sarvīs · aggaddu tagoṇḍre eraḍu sala tagoḷbēku (buy cheap, buy twice)'
  - scene: Sunday, 7 December 2025, the same busy week as the licence rush. Three kitchen-equipment quotations lie on the dining table. Nitin has built a spreadsheet of his own.
  - who: nitin
    t: ಮೂರು ಕೊಟೇಷನ್ ಒಂದೇ ಶೀಟ್‌ಗೆ ಹಾಕಿದೀನಿ. ಮೊದಲನೇದು ಒಂಬತ್ತು ಲಕ್ಷ ಎಂಬತ್ತು ಸಾವಿರ. ಎರಡನೇದು ಎಂಟು ಲಕ್ಷ ತೊಂಬತ್ತು. ಮೂರನೇದು ಏಳು ಲಕ್ಷ ಇಪ್ಪತ್ತು. ಮೂರನೇದೇ ತಗೊಳ್ಳೋಣ, ಎರಡೂವರೆ ಲಕ್ಷಕ್ಕಿಂತ ಜಾಸ್ತಿ ಉಳಿತಾಯ.
    tr: Mūru koṭēṣan ondē śīṭ-ge hākidīni. Modalanēdu ombattu lakṣa embattu sāvira. Eraḍanēdu eṇṭu lakṣa tombattu. Mūranēdu ēḷu lakṣa ippattu. Mūranēdē tagoḷḷōṇa, eraḍūvare lakṣakkinta jāsti uḷitāya.
    en: 'I''ve put the three quotations on one sheet. The first is nine lakh eighty thousand. The second, eight lakh ninety. The third, seven lakh twenty. Let''s take the third: a saving of more than two and a half lakh.'
  - who: mahesh
    t: ಮೂರನೇದರಲ್ಲಿ ಗ್ರೈಂಡರ್ ನೋಡು. ಟೇಬಲ್-ಟಾಪ್, ಹತ್ತು ಲೀಟರ್ ಅಲ್ಲ, ಐದು ಲೀಟರ್. ನಮಗೆ ದಿನಾ ಮೂವತ್ತು ಕೆಜಿ ಹಿಟ್ಟು ರುಬ್ಬಬೇಕು. ಐದು ಲೀಟರ್ ಗ್ರೈಂಡರ್ ರಾತ್ರಿಯೆಲ್ಲಾ ತಿರುಗ್ತಿರುತ್ತೆ.
    tr: Mūranēdaralli graiṇḍar nōḍu. Ṭēbal-ṭāp, hattu līṭar alla, aidu līṭar. Namage dinā mūvattu keji hiṭṭu rubbabēku. Aidu līṭar graiṇḍar rātriyellā tirugtirutte.
    en: Look at the grinder in the third one. Table-top, not ten litres but five. We need to grind thirty kilos of batter a day. A five-litre grinder would be turning all night.
  - who: kavya
    t: ಮತ್ತೆ ಸ್ಟೀಲ್. ಮೊದಲ ಎರಡರಲ್ಲಿ ಮುನ್ನೂರ ನಾಲ್ಕು ಗ್ರೇಡ್ ಅಂತ ಬರೆದಿದೆ. ಮೂರನೇದರಲ್ಲಿ “ಎಸ್‌ಎಸ್” ಅಂತ ಮಾತ್ರ. ಗ್ರೇಡ್ ಇಲ್ಲ, ವಾರಂಟಿ ಆರು ತಿಂಗಳು.
    tr: Matte sṭīl. Modala eraḍaralli munnūra nālku grēḍ anta baredide. Mūranēdaralli “es-es” anta mātra. Grēḍ illa, vāraṇṭi āru tingaḷu.
    en: And the steel. The first two say grade 304. The third just says “SS”. No grade, and a six-month warranty.
  - who: mahesh
    t: ಅಗ್ಗದ ಸ್ಟೀಲ್ ಆರು ತಿಂಗಳಲ್ಲಿ ತುಕ್ಕು ಹಿಡಿಯುತ್ತೆ. ಹೆಲ್ತ್ ಇನ್ಸ್‌ಪೆಕ್ಟರ್ ಮೊದಲು ನೋಡೋದೇ ಅದು. ಅಗ್ಗದ್ದು ತಗೊಂಡ್ರೆ ಎರಡು ಸಲ ತಗೊಳ್ಬೇಕು.
    tr: Aggada sṭīl āru tingaḷalli tukku hiḍiyutte. Helth inspekṭar modalu nōḍōdē adu. Aggaddu tagoṇḍre eraḍu sala tagoḷbēku.
    en: Cheap steel rusts in six months. That's the first thing a health inspector looks at. Buy cheap and you buy twice.
  - who: nitin
    t: ಸರಿ, ಮೂರನೇದು ಔಟ್. ಮೊದಲನೇದು ಯಾಕೆ ಇಷ್ಟು ದುಬಾರಿ?
    tr: Sari, mūranēdu auṭ. Modalanēdu yāke iṣṭu dubāri?
    en: Fine, the third is out. Why is the first one so expensive?
  - who: mahesh
    t: ಅದರಲ್ಲಿ ಚಿಮಣಿ ಹುಡ್, ಡಕ್ಟ್, ಫಿಲ್ಟರ್ ಎಲ್ಲಾ ಸೇರಿದೆ, ಟೆರೇಸ್‌ವರೆಗೆ. ಎರಡನೇದರಲ್ಲಿ ಡಕ್ಟ್ ಇಲ್ಲ, ಅದು ಬೇರೆ, ಸುಮಾರು ಒಂದು ಲಕ್ಷ. ಹಾಗೆ ನೋಡಿದ್ರೆ ಎರಡೂ ಹೆಚ್ಚು ಕಮ್ಮಿ ಒಂದೇ.
    tr: Adaralli chimaṇi huḍ, ḍakṭ, philṭar ellā sēride, ṭerēs-varege. Eraḍanēdaralli ḍakṭ illa, adu bēre, sumāru ondu lakṣa. Hāge nōḍidre eraḍū heccu kammi ondē.
    en: That one includes the chimney hood, the duct and the filters, all the way up to the terrace. The second has no duct; that's extra, about one lakh. Seen that way, the two are more or less the same.
  - who: kavya
    t: ಹಾಗಾದ್ರೆ ಸರ್ವೀಸ್ ನೋಡೋಣ. ಯಾರು ಹತ್ರ ಇದಾರೆ? ಗ್ರೈಂಡರ್ ಬೆಳಗ್ಗೆ ನಾಲ್ಕು ಗಂಟೆಗೆ ಕೆಟ್ಟು ಹೋದ್ರೆ ಯಾರು ಬರ್ತಾರೆ?
    tr: Hāgādre sarvīs nōḍōṇa. Yāru hatra idāre? Graiṇḍar beḷagge nālku gaṇṭege keṭṭu hōdre yāru bartāre?
    en: Then let's look at service. Who's nearby? If the grinder breaks down at four in the morning, who comes?
  - who: mahesh
    t: ಮೊದಲನೇದು ಕಲಾಸಿಪಾಳ್ಯದಲ್ಲಿ, ಇಪ್ಪತ್ತು ನಿಮಿಷ. ಮೂವತ್ತು ವರ್ಷದಿಂದ ಉಡುಪಿ ಹೋಟೆಲ್‌ಗಳಿಗೆ ಮಾಡ್ತಿದಾರೆ. ಎರಡನೇದು ಪೀಣ್ಯ, ಒಂದೂವರೆ ಗಂಟೆ ಟ್ರಾಫಿಕ್. ನಾನು ಮೊದಲನೇದರ ಹತ್ರ ಮಾತಾಡ್ತೀನಿ. ಒಂಬತ್ತು ಎಂಬತ್ತು ಅಲ್ಲ, ಎಂಟೂವರೆ ಹತ್ರ ತರ್ತೀನಿ.
    tr: Modalanēdu Kalāsipāḷyadalli, ippattu nimiṣa. Mūvattu varṣadinda Uḍupi hōṭel-gaḷige māḍtidāre. Eraḍanēdu Pīṇya, ondūvare gaṇṭe ṭrāphik. Nānu modalanēdara hatra mātāḍtīni. Ombattu embattu alla, eṇṭūvare hatra tartīni.
    en: 'The first is in Kalasipalya, twenty minutes away. They''ve been making equipment for Udupi hotels for thirty years. The second is in Peenya, an hour and a half of traffic. I''ll talk to the first one. Not nine eighty: I''ll bring it down to around eight and a half.'
  - scene: Mahesh steps out onto the balcony with his phone. Ten minutes of Kannada, a little Tulu, and long silences. He comes back in.
  - who: mahesh
    t: ಎಂಟು ಲಕ್ಷ ಅರವತ್ತು. ಒಂದು ಡೋರ್ ಫ್ರಿಜ್ ಬದಲು ಎರಡು ಡೋರ್, ಒಂದು ವರ್ಷ ಫ್ರೀ ಸರ್ವೀಸ್, ಡೆಲಿವರಿ ಮತ್ತೆ ಫಿಟ್ಟಿಂಗ್ ಫ್ರೀ. ಅಡ್ವಾನ್ಸ್ ಬೇಡ, ಬ್ಯಾಂಕ್ ದುಡ್ಡು ಬಂದಾಗ ಸಾಕು ಅಂದ್ರು.
    tr: Eṇṭu lakṣa aravattu. Ondu ḍōr phrij badalu eraḍu ḍōr, ondu varṣa phrī sarvīs, ḍelivari matte phiṭṭiṅg phrī. Aḍvāns bēḍa, byāṅk duḍḍu bandāga sāku andru.
    en: Eight lakh sixty. A two-door fridge instead of a single-door, a year of free service, delivery and fitting free. No advance; they said it's fine when the bank money comes.
  - who: nitin
    t: ಒಂದು ಲಕ್ಷ ಇಪ್ಪತ್ತು ಸಾವಿರ ಕಡಿಮೆ! ಹೇಗೆ ಮಾಡಿದೆ?
    tr: Ondu lakṣa ippattu sāvira kaḍime! Hēge māḍide?
    en: One lakh twenty thousand less! How did you do it?
  - who: mahesh
    t: 'ಅವರ ತಂದೆ ನಮ್ಮಪ್ಪನ ಜೊತೆ ಉಡುಪಿಯಲ್ಲಿ ಕೆಲಸ ಮಾಡಿದ್ರು. ಅದು ಅರ್ಧ. ಉಳಿದರ್ಧ: “ಇನ್ನೂ ಎರಡು ಕೊಟೇಷನ್ ಕೈಯಲ್ಲಿದೆ” ಅಂತ ಹೇಳಿದೆ. ಎರಡೂ ನಿಜ.'
    tr: 'Avara tande nammappana jote Uḍupiyalli kelasa māḍidru. Adu ardha. Uḷidardha: “innū eraḍu koṭēṣan kaiyallide” anta hēḷide. Eraḍū nija.'
    en: 'His father worked with my father in Udupi. That''s half of it. The other half: I told him, “I have two other quotations in hand.” Both true.'
  - who: kavya
    t: ಎಂಟು ಅರವತ್ತು. ನಾಳೆ ಬ್ಯಾಂಕ್‌ಗೆ ಇದೇ ಕೊಟೇಷನ್ ಕೊಡ್ತೀನಿ. ಪ್ರತಿ ಮೆಷಿನ್‌ನ ಮಾಡೆಲ್, ಬ್ರ್ಯಾಂಡ್ ಎಲ್ಲಾ ಹಾಕಿಸು. ರಶ್ಮಿ ಮೇಡಂ ಒಂದೊಂದೂ ಚೆಕ್ ಮಾಡ್ತಾರೆ.
    tr: Eṇṭu aravattu. Nāḷe byāṅk-ge idē koṭēṣan koḍtīni. Prati meṣin-na māḍel, bryāṇḍ ellā hākisu. Raśmi mēḍam ondondū chek māḍtāre.
    en: Eight sixty. I'll give this very quotation to the bank tomorrow. Get them to put in the model and brand of every machine. Rashmi madam checks every single item.
  - section: Ashok and the blue cylinders
    learn: 'commercial vs domestic LPG: kamarṣiyal silinḍar, mane silinḍar · ḍepāsiṭ, myānipholḍ, regyulēṭar, bukiṅg · prohibitions: iḍō hāgilla, sīj māḍtāre · monthly price revisions: prati tingaḷu ondanē tārīkhu'
  - scene: 'Monday, 15 December. Ashok''s LPG distributorship near South End Circle: a counter, a calendar with a goddess on it, stacks of red and blue cylinders behind an iron grille.'
  - who: gas
    t: ಹೋಟೆಲ್‌ಗಾ? ಕಮರ್ಷಿಯಲ್ ಕನೆಕ್ಷನ್. ಹತ್ತೊಂಬತ್ತು ಕೆಜಿ, ನೀಲಿ ಸಿಲಿಂಡರ್. ಎಷ್ಟು ಸಿಲಿಂಡರ್ ಬೇಕು? ದಿನಕ್ಕೆ ಎಷ್ಟು ಉರಿಯುತ್ತೆ ಅಂದ್ಕೊಂಡಿದೀರಿ?
    tr: Hōṭel-gā? Kamarṣiyal kanekṣan. Hattombattu keji, nīli silinḍar. Eṣṭu silinḍar bēku? Dinakke eṣṭu uriyutte andkoṇḍidīri?
    en: For a hotel? A commercial connection, then. Nineteen kilos, the blue cylinder. How many cylinders do you need? How much do you expect to burn a day?
  - who: mahesh
    t: 'ದೋಸೆ ಕಾವಲಿ, ಇಡ್ಲಿ ಸ್ಟೀಮರ್, ಸಾಂಬಾರ್, ಕಾಫಿ… ಶುರುವಿನಲ್ಲಿ ದಿನಕ್ಕೆ ಒಂದೂವರೆ, ಎರಡು ಸಿಲಿಂಡರ್ ಅಂತ ಲೆಕ್ಕ. ನಾಲ್ಕು ಸಿಲಿಂಡರ್ ಕನೆಕ್ಷನ್ ಬೇಕಾಗಿತ್ತು: ಎರಡು ಮ್ಯಾನಿಫೋಲ್ಡ್‌ಗೆ, ಎರಡು ಸ್ಟ್ಯಾಂಡ್‌ಬೈ.'
    tr: 'Dōse kāvali, iḍli sṭīmar, sāmbār, kāphi… śuruvinalli dinakke ondūvare, eraḍu silinḍar anta lekka. Nālku silinḍar kanekṣan bēkāgittu: eraḍu myānipholḍ-ge, eraḍu sṭyāṇḍbai.'
    en: 'Dosa griddle, idli steamer, sambar, coffee… at the start I reckon one and a half to two cylinders a day. I was hoping for a four-cylinder connection: two on the manifold, two on standby.'
  - who: gas
    t: 'ಸರಿ. ಡಾಕ್ಯುಮೆಂಟ್ಸ್: ಫರ್ಮ್ ಪ್ಯಾನ್, ಜಿಎಸ್‌ಟಿ, ಲೀಸ್ ಡೀಡ್, ಪಾರ್ಟ್ನರ್ ಆಧಾರ್. ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಇದ್ರೆ ಒಳ್ಳೇದು, ಇಲ್ಲಾಂದ್ರೆ ಅರ್ಜಿ ರಶೀದಿ ಸಾಕು, ಆಮೇಲೆ ಕಾಪಿ ಕೊಡಿ. ಸಿಲಿಂಡರ್‌ಗೆ, ರೆಗ್ಯುಲೇಟರ್‌ಗೆ ಡೆಪಾಸಿಟ್, ಅದು ವಾಪಸ್ ಸಿಗುತ್ತೆ. ನಾಲ್ಕಕ್ಕೆ ಎಲ್ಲಾ ಸೇರಿ ಸುಮಾರು ಹದಿನಾರು ಸಾವಿರ. ಕಂಪನಿ ರೇಟ್ ಬದಲಾಗ್ತಿರುತ್ತೆ, ಫೈನಲ್ ಅಮೌಂಟ್ ರಶೀದಿಯಲ್ಲಿ.'
    tr: 'Sari. Ḍākyumeṇṭs: pharm pyān, ji-es-ṭi, līs ḍīḍ, pārṭnar ādhār. Ṭrēḍ laisens idre oḷḷēdu, illāndre arji raśīdi sāku, āmēle kāpi koḍi. Silinḍar-ge, regyulēṭar-ge ḍepāsiṭ, adu vāpas sigutte. Nālkakke ellā sēri sumāru hadināru sāvira. Kampani rēṭ badalāgtirutte, phainal amauṇṭ raśīdiyalli.'
    en: 'Fine. Documents: the firm''s PAN, GST, lease deed, the partners'' Aadhaar. A trade licence is better; if you don''t have it yet, the application receipt will do, and give me a copy later. There''s a deposit for the cylinders and the regulator, and you get it back. For four, about sixteen thousand all together. The company''s rates keep changing; the final amount will be on the receipt.'
  - who: mahesh
    t: ಗ್ಯಾಸ್ ರೇಟ್ ಈಗ ಎಷ್ಟು?
    tr: Gyās rēṭ īga eṣṭu?
    en: And what's the gas price now?
  - who: gas
    t: 'ಈ ತಿಂಗಳು ಬೆಂಗಳೂರಲ್ಲಿ ಹತ್ತೊಂಬತ್ತು ಕೆಜಿಗೆ ಸುಮಾರು ಹದಿನೇಳು ನೂರು. ಆದ್ರೆ ನೆನಪಿಡಿ: ಕಮರ್ಷಿಯಲ್ ರೇಟ್ ಪ್ರತಿ ತಿಂಗಳು ಒಂದನೇ ತಾರೀಖು ಬದಲಾಗುತ್ತೆ, ಇಂಟರ್‌ನ್ಯಾಷನಲ್ ರೇಟ್ ಮೇಲೆ. ಕೆಲವು ಸಲ ಇಳಿಯುತ್ತೆ, ಜಾಸ್ತಿ ಸಲ ಏರುತ್ತೆ.'
    tr: 'Ī tingaḷu Beṅgaḷūralli hattombattu kejige sumāru hadinēḷu nūru. Ādre nenapiḍi: kamarṣiyal rēṭ prati tingaḷu ondanē tārīkhu badalāgutte, iṇṭarnyāṣanal rēṭ mēle. Kelavu sala iḷiyutte, jāsti sala ērutte.'
    en: 'This month in Bengaluru, about seventeen hundred for nineteen kilos. But remember: the commercial rate changes on the first of every month, going by international prices. Sometimes it comes down; more often it goes up.'
  - who: mahesh
    t: ಮನೆ ಸಿಲಿಂಡರ್ ಕೆಜಿ ಲೆಕ್ಕದಲ್ಲಿ ತುಂಬಾ ಅಗ್ಗ ಅಂತ ಕೆಲವು ಹೋಟೆಲ್‌ನವರು ಅದನ್ನೇ ಉಪಯೋಗಿಸ್ತಾರೆ ಅಂತ ಕೇಳಿದೀನಿ.
    tr: Mane silinḍar keji lekkadalli tumbā agga anta kelavu hōṭel-navaru adannē upayōgistāre anta kēḷidīni.
    en: I've heard some hotels use domestic cylinders because they're much cheaper per kilo.
  - who: gas
    t: ಉಪಯೋಗಿಸ್ತಾರೆ, ಸಿಕ್ಕಿಹಾಕ್ಕೊಳ್ತಾರೆ. ಹೋಟೆಲ್‌ನಲ್ಲಿ ಮನೆ ಸಿಲಿಂಡರ್ ಇಡೋ ಹಾಗಿಲ್ಲ. ಫುಡ್ ಡಿಪಾರ್ಟ್‌ಮೆಂಟ್‌ನವರು ರೇಡ್ ಮಾಡಿದ್ರೆ ಸಿಲಿಂಡರ್ ಸೀಜ್, ಕೇಸ್, ಫೈನ್. ನನ್ನ ಏಜೆನ್ಸಿಯಿಂದ ಆ ಕೆಲಸ ಆಗಲ್ಲ. ಮೊದಲೇ ಹೇಳ್ತಿದೀನಿ.
    tr: Upayōgistāre, sikkihākkoḷtāre. Hōṭel-nalli mane silinḍar iḍō hāgilla. Phuḍ ḍipārṭmeṇṭ-navaru rēḍ māḍidre silinḍar sīj, kēs, phain. Nanna ējensiyinda ā kelasa āgalla. Modalē hēḷtidīni.
    en: They use them, and they get caught. You're not allowed to keep domestic cylinders in a hotel. If the Food Department raids, the cylinders are seized, there's a case and a fine. That kind of thing doesn't happen through my agency. I'm telling you up front.
  - who: mahesh
    t: ನಾನು ಕೇಳಿದ್ದು ಅದನ್ನ ಮಾಡೋಕಲ್ಲ ಅಶೋಕ್ ಅವರೇ, ಮಾಡಬಾರದು ಅಂತ ಖಚಿತ ಮಾಡ್ಕೊಳ್ಳೋಕೆ. ಡೆಲಿವರಿ ಹೇಗೆ? ಬುಕ್ ಮಾಡಿದ್ರೆ ಎಷ್ಟು ಹೊತ್ತಿಗೆ ಬರುತ್ತೆ?
    tr: Nānu kēḷiddu adanna māḍōkalla Aśōk avarē, māḍabāradu anta khachita māḍkoḷḷōke. Ḍelivari hēge? Buk māḍidre eṣṭu hottige barutte?
    en: I didn't ask in order to do it, Ashok; I asked to be sure not to. How does delivery work? If I book, how soon does it come?
  - who: gas
    t: 'ಆಪ್‌ನಲ್ಲಿ ಅಥವಾ ಫೋನ್‌ನಲ್ಲಿ ಬುಕ್ ಮಾಡಿ. ಸಾಮಾನ್ಯವಾಗಿ ಅದೇ ದಿನ, ಇಲ್ಲಾಂದ್ರೆ ಮಾರನೇ ದಿನ ಬೆಳಗ್ಗೆ. ಖಾಲಿ ಸಿಲಿಂಡರ್ ಕೊಟ್ರೆ ತುಂಬಿದ್ದು ಸಿಗುತ್ತೆ. ಒಂದು ಸಲಹೆ: ಸ್ಟ್ಯಾಂಡ್‌ಬೈ ಎರಡು ಯಾವಾಗ್ಲೂ ತುಂಬಿರ್ಲಿ. ಹಬ್ಬ, ಬಂದ್, ಲಾರಿ ಸ್ಟ್ರೈಕ್ ಬಂದ್ರೆ ಮೊದಲು ಒದ್ದಾಡೋದು ಹೋಟೆಲ್‌ಗಳೇ.'
    tr: 'Āp-nalli athavā phōn-nalli buk māḍi. Sāmānyavāgi adē dina, illāndre māranē dina beḷagge. Khāli silinḍar koṭre tumbiddu sigutte. Ondu salahe: sṭyāṇḍbai eraḍu yāvāglū tumbirli. Habba, band, lāri sṭraik bandre modalu oddāḍōdu hōṭel-gaḷē.'
    en: 'Book on the app or by phone. Usually the same day, otherwise the next morning. Hand over an empty and you get a full one. One piece of advice: always keep the two standbys full. When there''s a festival, a bandh or a lorry strike, the hotels are the first to suffer.'
  - who: mahesh
    t: ಪೈಪ್‌ಲೈನ್, ಮ್ಯಾನಿಫೋಲ್ಡ್ ಯಾರು ಹಾಕ್ತಾರೆ?
    tr: Paip-lain, myānipholḍ yāru hāktāre?
    en: Who installs the pipeline and the manifold?
  - who: gas
    t: ನಮ್ಮ ಮೆಕ್ಯಾನಿಕ್, ಕಂಪನಿ ಅಪ್ರೂವ್ ಮಾಡಿರೋ ಸಾಮಾನು. ಹೊರಗಿನವರಿಂದ ಹಾಕಿಸಿದ್ರೆ ಅಗ್ಗ, ಆದ್ರೆ ಏನಾದ್ರೂ ಆದ್ರೆ ಇನ್ಶೂರೆನ್ಸ್ ಸಿಗಲ್ಲ. ಮ್ಯಾನಿಫೋಲ್ಡ್, ಪೈಪ್, ವಾಲ್ವ್, ಲೇಬರ್ ಸೇರಿ ಸುಮಾರು ಹದಿನೆಂಟು ಸಾವಿರ. ಜನವರಿ ಎರಡನೇ ವಾರ ಕನೆಕ್ಷನ್. ಅಷ್ಟರೊಳಗೆ ನಿಮ್ಮ ಸ್ಟೌ ಎಲ್ಲಾ ಫಿಟ್ ಆಗಿರ್ಬೇಕು.
    tr: Namma mekyānik, kampani aprūv māḍirō sāmānu. Horaginavarinda hākisidre agga, ādre ēnādrū ādre inśūrens sigalla. Myānipholḍ, paip, vālv, lēbar sēri sumāru hadineṇṭu sāvira. Janavari eraḍanē vāra kanekṣan. Aṣṭaroḷage nimma sṭau ellā phiṭ āgirbēku.
    en: 'Our mechanic, with company-approved parts. Getting outsiders to do it is cheaper, but if anything happens, the insurance won''t pay. Manifold, pipes, valves and labour: about eighteen thousand. Connection in the second week of January. All your stoves must be fitted by then.'
  - who: mahesh
    t: ಡೆಪಾಸಿಟ್, ಫಿಟ್ಟಿಂಗ್ ಎಲ್ಲಾ ಚೆಕ್‌ನಲ್ಲಿ ಕೊಡ್ತೀನಿ. ರಶೀದಿ ಕೊಡಿ.
    tr: Ḍepāsiṭ, phiṭṭiṅg ellā chek-nalli koḍtīni. Raśīdi koḍi.
    en: I'll pay the deposit and the fitting by cheque. Please give me receipts.
  - who: gas
    t: ನೀವು ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್ ಮಗನಾ? ಎಲ್ಲದಕ್ಕೂ ರಶೀದಿ, ರಶೀದಿ.
    tr: Nīvu byāṅk myānējar maganā? Elladakkū raśīdi, raśīdi.
    en: Are you a bank manager's son? A receipt for everything.
  - who: mahesh
    t: ಇಲ್ಲ. ಬ್ಯಾಂಕ್ ಮ್ಯಾನೇಜರ್‌ನ ಬಾಡಿಗೆದಾರ.
    tr: Illa. Byāṅk myānējar-na bāḍigedāra.
    en: No. A bank manager's tenant.
  - section: What should a masala dose cost?
    learn: 'costing: sāmānina kharchu, plēṭ-ge kharchu, mūru paṭṭu, mūvattaidu parsenṭ · conditionals with prices: -kke iṭre, -kke koṭrū · balancing: saridūgisu · menu words: iḍli-vaḍe, khāli dōse, kēsari bāt, khārā bāt, chau chau bāt, bisibēḷe bāt, mosaranna'
  - scene: Sunday, 4 January 2026, night. The equipment has been installed. At home Kavya has a new sheet called 'cost per plate'. Amma, Mahesh and Nitin (on speakerphone) sit round the table, a plate of Amma's trial idlis in the middle.
  - who: kavya
    t: ಮೊದಲು ಮಸಾಲೆ ದೋಸೆ. ಅಕ್ಕಿ, ಉದ್ದಿನಬೇಳೆ ಹಿಟ್ಟು ಎಂಟು ರೂಪಾಯಿ. ಆಲೂಗಡ್ಡೆ ಪಲ್ಯ ಆರು. ಎಣ್ಣೆ, ಬೆಣ್ಣೆ ಐದು. ಚಟ್ನಿ, ಸಾಂಬಾರ್ ಆರು. ಗ್ಯಾಸ್ ಮೂರು. ಒಟ್ಟು ಒಂದು ಪ್ಲೇಟ್‌ಗೆ ಇಪ್ಪತ್ತೆಂಟು ರೂಪಾಯಿ, ಬರೀ ಸಾಮಾನು ಮತ್ತೆ ಗ್ಯಾಸ್.
    tr: Modalu masāle dōse. Akki, uddinabēḷe hiṭṭu eṇṭu rūpāyi. Ālūgaḍḍe palya āru. Eṇṇe, beṇṇe aidu. Chaṭni, sāmbār āru. Gyās mūru. Oṭṭu ondu plēṭ-ge ippatteṇṭu rūpāyi, barī sāmānu matte gyās.
    en: Masala dose first. Rice and urad-dal batter, eight rupees. Potato palya, six. Oil and butter, five. Chutney and sambar, six. Gas, three. Twenty-eight rupees a plate in total, ingredients and gas only.
  - who: mahesh
    t: ಇಪ್ಪತ್ತೆಂಟು ಅಂದ್ರೆ ಅರವತ್ತಕ್ಕೆ ಕೊಟ್ರೂ ಡಬಲ್ ಲಾಭ.
    tr: Ippatteṇṭu andre aravattakke koṭrū ḍabal lābha.
    en: Twenty-eight means even at sixty we'd make double.
  - who: kavya
    t: 'ಅದೇ ತಪ್ಪು ಲೆಕ್ಕ. ಆ ಇಪ್ಪತ್ತೆಂಟರಲ್ಲಿ ರೆಂಟ್ ಇಲ್ಲ, ಸಂಬಳ ಇಲ್ಲ, ಕರೆಂಟ್, ಬಡ್ಡಿ, ಪಾತ್ರೆ ತೊಳೆಯೋ ಸೋಪು ಕೂಡ ಇಲ್ಲ. ಹೋಟೆಲ್ ಲೈನ್‌ನಲ್ಲಿ ಒಂದು ಸಾಮಾನ್ಯ ನಿಯಮ ಇದೆ: ಸಾಮಾನಿನ ಖರ್ಚು ರೇಟ್‌ನ ಮೂವತ್ತೈದು ಪರ್ಸೆಂಟ್ ಒಳಗೆ ಇರ್ಬೇಕು. ಅಂದ್ರೆ ಸುಮಾರು ಮೂರು ಪಟ್ಟು.'
    tr: 'Adē tappu lekka. Ā ippatteṇṭaralli renṭ illa, sambaḷa illa, karaṇṭ, baḍḍi, pātre toḷeyō sōpu kūḍa illa. Hōṭel lain-nalli ondu sāmānya niyama ide: sāmānina kharchu rēṭ-na mūvattaidu parsenṭ oḷage irbēku. Andre sumāru mūru paṭṭu.'
    en: 'That''s exactly the wrong sum. That twenty-eight has no rent in it, no salaries, no electricity, no interest, not even the soap for the dishes. There''s a common rule in the hotel line: ingredient cost should be within thirty-five percent of the price. That means roughly three times.'
  - who: mahesh
    t: ಮೂರು ಪಟ್ಟು ಅಂದ್ರೆ ಎಂಬತ್ನಾಲ್ಕು. ಪಕ್ಕದ ಬೀದಿಯಲ್ಲಿ ಮಸಾಲೆ ದೋಸೆ ಎಪ್ಪತ್ತು. ಮೊದಲ ದಿನವೇ ಹದಿನಾಲ್ಕು ರೂಪಾಯಿ ಜಾಸ್ತಿ ಇಟ್ರೆ ಯಾರು ಬರ್ತಾರೆ?
    tr: Mūru paṭṭu andre embatnālku. Pakkada bīdiyalli masāle dōse eppattu. Modala dinavē hadinālku rūpāyi jāsti iṭre yāru bartāre?
    en: Three times is eighty-four. In the next street, masala dose is seventy. If we're fourteen rupees dearer from day one, who's going to come?
  - who: nitin
    t: ಅಣ್ಣ, ಕಾರ್ಪೊರೇಟ್‌ನಲ್ಲಿ ಇದಕ್ಕೆ ಪ್ರಾಡಕ್ಟ್ ಮಿಕ್ಸ್ ಅಂತಾರೆ. ಎಲ್ಲಾ ಐಟಂ ಮೇಲೆ ಒಂದೇ ಲಾಭ ಬೇಕಾಗಿಲ್ಲ. ಕಾಫಿ ಮೇಲೆ ಜಾಸ್ತಿ ಸಿಗುತ್ತೆ ಅಲ್ವಾ?
    tr: Aṇṇa, kārporēṭ-nalli idakke prāḍakṭ miks antāre. Ellā aiṭam mēle ondē lābha bēkāgilla. Kāphi mēle jāsti sigutte alvā?
    en: (On speaker) Anna, in corporate they call this the product mix. You don't need the same margin on every item. You make more on coffee, don't you?
  - who: kavya
    t: ಎಲ್ಲರೂ ಹಾಗೇ ಅನ್ಕೊಳ್ತಾರೆ. ಲೆಕ್ಕ ನೋಡು. ಒಂದು ಕಾಫಿಗೆ ನೂರು ಎಂಎಲ್ ಹಾಲು, ನಾಲ್ಕು ರೂಪಾಯಿ ಅರವತ್ತು ಪೈಸೆ. ಕಾಫಿ ಪುಡಿ ನಾಲ್ಕು, ಸಕ್ಕರೆ, ಗ್ಯಾಸ್ ಒಂದು. ಒಂಬತ್ತೂವರೆ. ಇಪ್ಪತ್ತಕ್ಕೆ ಕೊಟ್ರೆ ಅರ್ಧದಷ್ಟು ಸಾಮಾನಿಗೇ ಹೋಗುತ್ತೆ. ನಿಜವಾದ ಲಾಭ ಇಡ್ಲಿ, ವಡೆ, ಕೇಸರಿ ಬಾತ್‌ನಲ್ಲಿ.
    tr: Ellarū hāgē ankoḷtāre. Lekka nōḍu. Ondu kāphige nūru em-el hālu, nālku rūpāyi aravattu paise. Kāphi puḍi nālku, sakkare, gyās ondu. Ombattūvare. Ippattakke koṭre ardhadaṣṭu sāmānigē hōgutte. Nijavāda lābha iḍli, vaḍe, kēsari bāt-nalli.
    en: 'Everyone thinks so. Look at the numbers. A hundred ml of milk per coffee: four rupees sixty paise. Coffee powder four, sugar and gas one. Nine and a half. Sell it at twenty and about half goes on ingredients. The real margin is in idli, vada and kesari bath.'
  - who: amma
    t: ನನ್ನ ಕೇಸರಿ ಬಾತ್‌ಗೆ ತುಪ್ಪ ಕಮ್ಮಿ ಮಾಡಿ ಲಾಭ ಮಾಡೋ ಯೋಚನೆ ಇದ್ರೆ ಈಗಲೇ ಬಿಟ್ಬಿಡಿ. ತುಪ್ಪ ಇಲ್ಲದ ಕೇಸರಿ ಬಾತ್ ಕೇಸರಿ ಬಾತೇ ಅಲ್ಲ.
    tr: Nanna kēsari bāt-ge tuppa kammi māḍi lābha māḍō yōchane idre īgalē biṭbiḍi. Tuppa illada kēsari bāt kēsari bātē alla.
    en: If you're thinking of making a profit by cutting the ghee in my kesari bath, drop the idea now. Kesari bath without ghee isn't kesari bath at all.
  - who: kavya
    t: ತುಪ್ಪ ಸೇರಿಸಿಯೇ ಲೆಕ್ಕ ಹಾಕಿದೀನಿ ಅಮ್ಮ, ಹತ್ತು ಗ್ರಾಂ. ಒಂದು ಪ್ಲೇಟ್‌ಗೆ ಹದಿಮೂರು ರೂಪಾಯಿ. ನಲವತ್ತಕ್ಕೆ ಇಟ್ರೆ ಸರಿ ಆಗುತ್ತೆ.
    tr: Tuppa sērisiyē lekka hākidīni amma, hattu grām. Ondu plēṭ-ge hadimūru rūpāyi. Nalavattakke iṭre sari āgutte.
    en: I've done the sum with the ghee in, Amma, ten grams. Thirteen rupees a plate. At forty it works.
  - who: amma
    t: ಹತ್ತು ಗ್ರಾಂ? ಹದಿನೈದು ಹಾಕು. ಆ ಐದು ಗ್ರಾಂ ತುಪ್ಪಕ್ಕೆ ಜನ ಹತ್ತು ಕಿಲೋಮೀಟರ್ ಬರ್ತಾರೆ.
    tr: Hattu grām? Hadinaidu hāku. Ā aidu grām tuppakke jana hattu kilōmīṭar bartāre.
    en: Ten grams? Put fifteen. People will come ten kilometres for those five grams of ghee.
  - who: kavya
    t: ಹದಿನೈದು ಅಂದ್ರೆ ಹದಿನಾರೂವರೆ ರೂಪಾಯಿ. ಸರಿ, ರೇಟ್ ನಲವತ್ತೇ. ಇದರಲ್ಲಿ ಲಾಭ ಸ್ವಲ್ಪ ಕಮ್ಮಿ, ಆದ್ರೆ ಅಮ್ಮನ ಹೆಸರಿದೆ.
    tr: Hadinaidu andre hadinārūvare rūpāyi. Sari, rēṭ nalavattē. Idaralli lābha svalpa kammi, ādre ammana hesaride.
    en: Fifteen means sixteen and a half rupees. All right, the price stays forty. A bit less profit on this one, but Amma's name is on it.
  - who: mahesh
    t: 'ಮಸಾಲೆ ದೋಸೆಗೆ ಬರೋಣ. ನನ್ನ ಐಡಿಯಾ: ಎಪ್ಪತ್ತೈದು. ಪಕ್ಕದವರಿಗಿಂತ ಐದು ರೂಪಾಯಿ ಜಾಸ್ತಿ, ಆದ್ರೆ ದೋಸೆ ದೊಡ್ಡದು, ಬೆಣ್ಣೆ ನಿಜವಾದದ್ದು. ಜನ ವ್ಯತ್ಯಾಸ ನೋಡ್ತಾರೆ.'
    tr: 'Masāle dōsege barōṇa. Nanna aiḍiyā: eppattaidu. Pakkadavariginta aidu rūpāyi jāsti, ādre dōse doḍḍadu, beṇṇe nijavādaddu. Jana vyatyāsa nōḍtāre.'
    en: 'Let''s come to masala dose. My idea: seventy-five. Five rupees more than the neighbours, but the dose is bigger and the butter is real. People will see the difference.'
  - who: kavya
    t: 'ಎಪ್ಪತ್ತೈದರಲ್ಲಿ ಇಪ್ಪತ್ತೆಂಟು ಅಂದ್ರೆ ಮೂವತ್ತೇಳು ಪರ್ಸೆಂಟ್. ಸ್ವಲ್ಪ ಜಾಸ್ತಿ, ಆದ್ರೆ ಇಡ್ಲಿ, ವಡೆ ಅದನ್ನ ಸರಿದೂಗಿಸುತ್ತೆ. ಒಪ್ಪಿಗೆ. ಒಂದು ಕಂಡೀಷನ್: ಆಲೂಗಡ್ಡೆ ರೇಟ್ ಏರಿದ್ರೂ ಮೂರು ತಿಂಗಳು ನಾವು ರೇಟ್ ಬದಲಾಯಿಸಲ್ಲ, ಆದ್ರೆ ಈ ಶೀಟ್ ಮಾತ್ರ ಪ್ರತಿ ತಿಂಗಳು ಮತ್ತೆ ನೋಡ್ತೀವಿ.'
    tr: 'Eppattaidaralli ippatteṇṭu andre mūvattēḷu parsenṭ. Svalpa jāsti, ādre iḍli, vaḍe adanna saridūgisutte. Oppige. Ondu kaṇḍīṣan: ālūgaḍḍe rēṭ ēridrū mūru tingaḷu nāvu rēṭ badalāyisalla, ādre ī śīṭ mātra prati tingaḷu matte nōḍtīvi.'
    en: 'Twenty-eight out of seventy-five is thirty-seven percent. A little high, but idli and vada balance it out. Agreed. One condition: even if potato prices rise, we won''t change our prices for three months, but we look at this sheet again every month.'
  - who: nitin
    t: ಹಾಗಾದ್ರೆ ಫೈನಲ್ ಮೆನು ಓದಿ, ನಾನು ಬರ್ಕೊಳ್ತೀನಿ.
    tr: Hāgādre phainal menu ōdi, nānu barkoḷtīni.
    en: Then read out the final menu; I'll write it down.
  - who: kavya
    t: ಇಡ್ಲಿ ಎರಡು, ನಲವತ್ತು. ಒಂದು ಇಡ್ಲಿ ಒಂದು ವಡೆ, ಐವತ್ತು. ವಡೆ ಒಂದು, ಮೂವತ್ತು. ಮಸಾಲೆ ದೋಸೆ ಎಪ್ಪತ್ತೈದು. ಖಾಲಿ ದೋಸೆ ಐವತ್ತೈದು. ಕೇಸರಿ ಬಾತ್, ಖಾರಾ ಬಾತ್ ನಲವತ್ತು, ಎರಡೂ ಸೇರಿ ಚೌ ಚೌ ಬಾತ್ ಎಪ್ಪತ್ತು. ಫಿಲ್ಟರ್ ಕಾಫಿ ಇಪ್ಪತ್ತು. ಮಧ್ಯಾಹ್ನ ಬಿಸಿಬೇಳೆ ಬಾತ್, ಮೊಸರನ್ನ, ಅರವತ್ತು.
    tr: Iḍli eraḍu, nalavattu. Ondu iḍli ondu vaḍe, aivattu. Vaḍe ondu, mūvattu. Masāle dōse eppattaidu. Khāli dōse aivattaidu. Kēsari bāt, khārā bāt nalavattu, eraḍū sēri chau chau bāt eppattu. Philṭar kāphi ippattu. Madhyāhna bisibēḷe bāt, mosaranna, aravattu.
    en: Two idlis, forty. One idli and one vada, fifty. One vada, thirty. Masala dose, seventy-five. Plain dose, fifty-five. Kesari bath and khara bath, forty; the two together as chow chow bath, seventy. Filter coffee, twenty. At lunch, bisibele bath and curd rice, sixty.
  - who: mahesh
    t: ಕಾಫಿ ಇಪ್ಪತ್ತೇ? ಇಪ್ಪತ್ತೆರಡು ಮಾಡೋಣ ಅಂದ್ಕೊಂಡಿದ್ದೆ.
    tr: Kāphi ippattē? Ippatteraḍu māḍōṇa andkoṇḍidde.
    en: Coffee only twenty? I'd thought we'd make it twenty-two.
  - who: kavya
    t: ಇಪ್ಪತ್ತೆರಡಕ್ಕೆ ಚಿಲ್ಲರೆ ಸಮಸ್ಯೆ. ಯುಪಿಐ ಇದ್ರೂ ಅರ್ಧ ಜನ ಕ್ಯಾಶ್ ಕೊಡ್ತಾರೆ. ಈಗ ಇಪ್ಪತ್ತು. ಹಾಲಿನ ರೇಟ್ ಏರಿದಾಗ ಇಪ್ಪತ್ತೈದು. ಕಾಫಿ ನಮ್ಮ ಜಾಹೀರಾತು, ಅದರಲ್ಲಿ ಲಾಭ ಹುಡುಕ್ಬೇಡ.
    tr: Ippatteraḍakke chillare samasye. Yu-pi-ai idrū ardha jana kyāś koḍtāre. Īga ippattu. Hālina rēṭ ēridāga ippattaidu. Kāphi namma jāhīrātu, adaralli lābha huḍukbēḍa.
    en: At twenty-two there's the change problem. Even with UPI, half the people pay cash. Twenty for now. Twenty-five when the milk price goes up. Coffee is our advertisement; don't look for profit in it.
  - who: amma
    t: ಇಡ್ಲಿ ತಿಂದು ನೋಡಿ. ರೇಟ್ ಆಮೇಲೆ. ಮೃದುವಾಗಿದೆಯಾ?
    tr: Iḍli tindu nōḍi. Rēṭ āmēle. Mr̥duvāgideyā?
    en: Taste the idli. Prices later. Is it soft?
  - who: mahesh
    t: ಮಲ್ಲಿಗೆ ಹೂವಿನ ಹಾಗಿದೆ ಅಮ್ಮ. ಇದಕ್ಕೆ ನಲವತ್ತು ಕಮ್ಮಿನೇ.
    tr: Mallige hūvina hāgide amma. Idakke nalavattu kamminē.
    en: Like jasmine flowers, Amma. Forty is too little for this.
  - section: KR Market at four in the morning
    learn: 'bargaining: kejige eṣṭu, mūṭe tagoṇḍre, … hāki, phainal · weighing and quality: takkaḍi, tūka, koḷeta, oṇagide · delivery and credit: ṭempō, vārakkondsala pēmeṇṭ, haḷē bāki kliyar āgade hosa mālu baralla · bil ilde kammi (refused)'
  - scene: 'Thursday, 8 January 2026, 4:15 a.m. KR Market under sodium lamps: lorries from Kolar and Chikkaballapur unloading, porters with sacks on their heads, the smell of crushed coriander and diesel. Ramesh, a vegetable wholesaler recommended by Mahesh''s old hotel, waits at his stall.'
  - who: supplier
    t: ಬನ್ನಿ ಸಾರ್, ಬನ್ನಿ! ಹೊಸ ಹೋಟೆಲಾ? ನಿಮ್ಮ ಹಳೇ ಹೋಟೆಲ್ ಓನರ್ ಹೇಳಿದ್ರು, “ಮಹೇಶ ಒಳ್ಳೆ ಹುಡುಗ, ಆದ್ರೆ ಚೌಕಾಸಿ ಜಾಸ್ತಿ” ಅಂತ.
    tr: Banni sār, banni! Hosa hōṭelā? Nimma haḷē hōṭel ōnar hēḷidru, “Mahēśa oḷḷe huḍuga, ādre chaukāsi jāsti” anta.
    en: Come, sir, come! A new hotel? Your old hotel's owner told me, “Mahesha's a good lad, but he bargains too much.”
  - who: mahesh
    t: ಆಗ ಚೌಕಾಸಿ ಮಾಡಿದ್ದು ಅವರ ದುಡ್ಡಿಗೆ, ರಮೇಶಣ್ಣ. ಈಗ ನನ್ನ ದುಡ್ಡು. ಇನ್ನೂ ಜಾಸ್ತಿ ಮಾಡ್ತೀನಿ. ಈರುಳ್ಳಿ ಕೆಜಿಗೆ ಎಷ್ಟು?
    tr: Āga chaukāsi māḍiddu avara duḍḍige, Rameśaṇṇa. Īga nanna duḍḍu. Innū jāsti māḍtīni. Īruḷḷi kejige eṣṭu?
    en: Back then I bargained for his money, Ramesh-anna. Now it's my money. I'll bargain even harder. How much is onion a kilo?
  - who: supplier
    t: ನಲವತ್ತು. ಮೂಟೆ ತಗೊಂಡ್ರೆ ಮೂವತ್ತಾರು. ನೋಡಿ, ಮಹಾರಾಷ್ಟ್ರದ ಈರುಳ್ಳಿ, ಚೆನ್ನಾಗಿ ಒಣಗಿದೆ, ಒಂದು ವಾರ ಇಟ್ರೂ ಕೆಡಲ್ಲ.
    tr: Nalavattu. Mūṭe tagoṇḍre mūvattāru. Nōḍi, Mahārāṣṭrada īruḷḷi, chennāgi oṇagide, ondu vāra iṭrū keḍalla.
    en: Forty. Thirty-six if you take a sack. Look, Maharashtra onions, well dried; they won't spoil even if you keep them a week.
  - who: mahesh
    t: ಮೂವತ್ತೆರಡು ಹಾಕಿ. ದಿನಾ ತಗೊಳ್ತೀನಿ, ವರ್ಷವಿಡೀ.
    tr: Mūvatteraḍu hāki. Dinā tagoḷtīni, varṣaviḍī.
    en: Make it thirty-two. I'll buy every day, all year.
  - who: supplier
    t: “ದಿನಾ ತಗೊಳ್ತೀನಿ” ಅಂತ ಎಲ್ಲರೂ ಹೇಳ್ತಾರೆ ಸಾರ್. ಮೂರು ತಿಂಗಳಾದ್ಮೇಲೆ ಬೇರೆ ಅಂಗಡಿಗೆ ಹೋಗ್ತಾರೆ. ಮೂವತ್ನಾಲ್ಕು, ಫೈನಲ್. ಅದಕ್ಕಿಂತ ಕಮ್ಮಿ ಮಾಡಿದ್ರೆ ನನ್ನ ಮಕ್ಕಳ ಸ್ಕೂಲ್ ಫೀಸ್ ನೀವೇ ಕಟ್ಬೇಕಾಗುತ್ತೆ.
    tr: “Dinā tagoḷtīni” anta ellarū hēḷtāre sār. Mūru tingaḷādmēle bēre aṅgaḍige hōgtāre. Mūvatnālku, phainal. Adakkinta kammi māḍidre nanna makkaḷa skūl phīs nīvē kaṭbēkāgutte.
    en: Everyone says “I'll buy every day”, sir. After three months they go to another stall. Thirty-four, final. Any lower and you'll be paying my children's school fees.
  - who: mahesh
    t: ಮೂವತ್ನಾಲ್ಕು. ಆದ್ರೆ ಮೂಟೆ ತೂಕ ನನ್ನ ಮುಂದೆ ಮಾಡಿ. ಐವತ್ತು ಕೆಜಿ ಅಂದ್ರೆ ಐವತ್ತು.
    tr: Mūvatnālku. Ādre mūṭe tūka nanna munde māḍi. Aivattu keji andre aivattu.
    en: Thirty-four. But weigh the sack in front of me. Fifty kilos means fifty.
  - who: supplier
    t: ತಗೊಳ್ಳಿ, ತಕ್ಕಡಿ ನೋಡಿ. ಐವತ್ತು ಕೆಜಿ ಮುನ್ನೂರು ಗ್ರಾಂ. ಆ ಮುನ್ನೂರು ಗ್ರಾಂ ನನ್ನ ಕಡೆಯಿಂದ ಗಿಫ್ಟ್. ಇನ್ನೇನು ಬೇಕು?
    tr: Tagoḷḷi, takkaḍi nōḍi. Aivattu keji munnūru grām. Ā munnūru grām nanna kaḍeyinda gipṭ. Innēnu bēku?
    en: There, look at the scale. Fifty kilos three hundred grams. Those three hundred grams are a gift from me. What else do you need?
  - who: mahesh
    t: ದಿನಕ್ಕೆ ಆಲೂಗಡ್ಡೆ ಇಪ್ಪತ್ತು ಕೆಜಿ, ಟೊಮೇಟೊ ಹತ್ತು, ಈರುಳ್ಳಿ ಹದಿನೈದು, ಹಸಿಮೆಣಸಿನಕಾಯಿ, ಶುಂಠಿ, ಕೊತ್ತಂಬರಿ, ಕರಿಬೇವು. ತೆಂಗಿನಕಾಯಿ ದಿನಕ್ಕೆ ನಲವತ್ತು. ಆದ್ರೆ ನಾನು ದಿನಾ ನಾಲ್ಕು ಗಂಟೆಗೆ ಇಲ್ಲಿಗೆ ಬರೋಕಾಗಲ್ಲ. ಆರು ಗಂಟೆಯೊಳಗೆ ಅಂಗಡಿಗೆ ಡೆಲಿವರಿ ಆಗ್ಬೇಕು.
    tr: Dinakke ālūgaḍḍe ippattu keji, ṭomēṭo hattu, īruḷḷi hadinaidu, hasimeṇasinakāyi, śuṇṭhi, kottambari, karibēvu. Teṅginakāyi dinakke nalavattu. Ādre nānu dinā nālku gaṇṭege illige barōkāgalla. Āru gaṇṭeyoḷage aṅgaḍige ḍelivari āgbēku.
    en: 'Every day: twenty kilos of potatoes, ten of tomatoes, fifteen of onions, green chillies, ginger, coriander, curry leaves. Forty coconuts a day. But I can''t come here at four every day. It has to be delivered to the shop before six.'
  - who: supplier
    t: ನನ್ನ ಟೆಂಪೋ ದಿನಾ ಜಯನಗರಕ್ಕೆ ಹೋಗುತ್ತೆ, ಐದೂವರೆಗೆ ನಿಮ್ಮ ಅಂಗಡಿ ಮುಂದೆ. ಡೆಲಿವರಿ ಚಾರ್ಜ್ ಇಲ್ಲ. ತೆಂಗಿನಕಾಯಿ ನಾನು ಇಡಲ್ಲ, ಆದ್ರೆ ತಿಪಟೂರಿನ ಕಾಯಿ ತರೋ ನಮ್ಮ ಹುಡುಗ ಒಬ್ಬ ಇದಾನೆ, ಅವನೂ ಅದೇ ಟೆಂಪೋದಲ್ಲಿ ಕಳಿಸ್ತಾನೆ.
    tr: Nanna ṭempō dinā Jayanagarakke hōgutte, aidūvarege nimma aṅgaḍi munde. Ḍelivari chārj illa. Teṅginakāyi nānu iḍalla, ādre Tipaṭūrina kāyi tarō namma huḍuga obba idāne, avanū adē ṭempōdalli kaḷistāne.
    en: My tempo goes to Jayanagar every day; at five-thirty it'll be outside your shop. No delivery charge. I don't stock coconuts, but there's a lad of ours who brings Tiptur coconuts; he'll send them in the same tempo.
  - who: mahesh
    t: ಪೇಮೆಂಟ್?
    tr: Pēmeṇṭ?
    en: Payment?
  - who: supplier
    t: 'ಮೊದಲ ಎರಡು ವಾರ ಕ್ಯಾಶ್ ಅಥವಾ ಯುಪಿಐ, ದಿನಾ. ಆಮೇಲೆ ವಾರಕ್ಕೊಂದ್ಸಲ, ಶನಿವಾರ. ಒಂದು ಕಂಡೀಷನ್: ಹಳೇ ಬಾಕಿ ಕ್ಲಿಯರ್ ಆಗದೆ ಹೊಸ ಮಾಲು ಬರಲ್ಲ. ಬೇಜಾರ್ ಮಾಡ್ಕೋಬೇಡಿ, ಇಪ್ಪತ್ತು ವರ್ಷದಲ್ಲಿ ಆರು ಹೋಟೆಲ್ ನನ್ನ ಬಾಕಿ ಇಟ್ಕೊಂಡೇ ಮುಚ್ಚಿಹೋದ್ವು.'
    tr: 'Modala eraḍu vāra kyāś athavā yu-pi-ai, dinā. Āmēle vārakkondsala, Śanivāra. Ondu kaṇḍīṣan: haḷē bāki kliyar āgade hosa mālu baralla. Bējār māḍkōbēḍi, ippattu varṣadalli āru hōṭel nanna bāki iṭkoṇḍē mucchihōdvu.'
    en: 'The first two weeks, cash or UPI, daily. After that, once a week, on Saturday. One condition: no new goods until the old dues are cleared. Don''t take it badly; in twenty years, six hotels shut down still owing me money.'
  - who: mahesh
    t: 'ಒಪ್ಪಿಗೆ. ನನ್ನ ಕಂಡೀಷನ್ ಕೂಡ ಕೇಳಿ: ಒಂದೇ ಒಂದು ಕೊಳೆತ ಟೊಮೇಟೊ ಬಂದ್ರೂ ಆ ಕ್ರೇಟ್ ವಾಪಸ್. ಬಿಲ್ ಪ್ರತಿ ದಿನ, ತೂಕ ಸಮೇತ.'
    tr: 'Oppige. Nanna kaṇḍīṣan kūḍa kēḷi: ondē ondu koḷeta ṭomēṭo bandrū ā krēṭ vāpas. Bil prati dina, tūka samēta.'
    en: 'Agreed. Now hear my conditions: if even one rotten tomato comes, that crate goes back. A bill every day, with the weights.'
  - who: supplier
    t: ಬಿಲ್ ಬೇಕಾ? ಬಿಲ್ ಇಲ್ದೆ ಆದ್ರೆ ಸ್ವಲ್ಪ ಕಮ್ಮಿ ಮಾಡ್ತೀನಿ…
    tr: Bil bēkā? Bil ilde ādre svalpa kammi māḍtīni…
    en: You want a bill? Without a bill I could make it a little cheaper…
  - who: mahesh
    t: ಬಿಲ್ ಬೇಕು ರಮೇಶಣ್ಣ. ನನ್ನ ಹೆಂಡತಿ ಅಕೌಂಟೆಂಟ್. ಬಿಲ್ ಇಲ್ಲದ ಒಂದು ಕೆಜಿ ಈರುಳ್ಳಿ ಕಂಡ್ರೆ ನನ್ನನ್ನೇ ಹೊರಗೆ ಹಾಕ್ತಾಳೆ.
    tr: Bil bēku Rameśaṇṇa. Nanna heṇḍati akauṇṭeṇṭ. Bil illada ondu keji īruḷḷi kaṇḍre nannannē horage hāktāḷe.
    en: I want the bill, Ramesh-anna. My wife's an accountant. If she finds one kilo of onions without a bill, she'll throw me out.
  - who: supplier
    t: ಹಾಗಾದ್ರೆ ಬಿಲ್ ಜೊತೆ ಕೊತ್ತಂಬರಿ ಫ್ರೀ. ಮೇಡಂಗೆ ನನ್ನ ನಮಸ್ಕಾರ ಹೇಳಿ.
    tr: Hāgādre bil jote kottambari phrī. Mēḍam-ge nanna namaskāra hēḷi.
    en: Then coriander free with the bill. Give madam my regards.
  - scene: 5 a.m. Over glasses of tea at a stall by the flower market, Ramesh writes a name and a number on the back of a bill.
  - who: supplier
    t: ಅಕ್ಕಿ, ಬೇಳೆ, ಎಣ್ಣೆಗೆ ಚಿಕ್ಕಪೇಟೆಯಲ್ಲಿ ನನ್ನ ಭಾವನ ಹೋಲ್‌ಸೇಲ್ ಅಂಗಡಿ ಇದೆ. ನಾನೂ ಹತ್ತು ಗಂಟೆಗೆ ಅಲ್ಲಿಗೆ ಬರ್ತೀನಿ, ಪರಿಚಯ ಮಾಡಿಸ್ತೀನಿ. ಅಷ್ಟು ಹೊತ್ತಿಗೆ ಅವನು ಎದ್ದಿರ್ತಾನೆ.
    tr: Akki, bēḷe, eṇṇege Chikkapēṭeyalli nanna bhāvana hōlsēl aṅgaḍi ide. Nānū hattu gaṇṭege allige bartīni, parichaya māḍistīni. Aṣṭu hottige avanu eddirtāne.
    en: For rice, dal and oil, my brother-in-law has a wholesale shop in Chickpet. I'll come there too at ten and introduce you. He'll be awake by then.
  - section: Rice, dal, oil and milk
    learn: 'groceries: iḍli akki, Sōnā Masūri, uddinabēḷe, togaribēḷe, Bāmbe rave, sakkare, eṇṇe ḍabba · credit: hadinaidu dinada kreḍiṭ, chek bauns · reported speech: … ante, … andru, “…” anta hēḷidru · quality: maṅkāgide, huḷa, ubballa'
  - scene: 'The same day, 10 a.m. A narrow wholesale shop in Chickpet: rice sacks stacked to the ceiling, tins of oil, a ledger on a low desk. Ramesh''s brother-in-law sits behind it. Amma has come along; she has opinions about dal.'
  - who: amma
    t: ಈ ಉದ್ದಿನಬೇಳೆ ನೋಡು, ಮಹೇಶ. ಹಳೇದು. ಬಣ್ಣ ಮಂಕಾಗಿದೆ, ಒಂದೆರಡು ಹುಳ ಇದೆ. ಹಳೇ ಬೇಳೆ ಹಿಟ್ಟು ಉಬ್ಬಲ್ಲ. ಇಡ್ಲಿ ಕಲ್ಲಿನ ಹಾಗೆ ಆಗುತ್ತೆ.
    tr: Ī uddinabēḷe nōḍu, Mahēśa. Haḷēdu. Baṇṇa maṅkāgide, onderaḍu huḷa ide. Haḷē bēḷe hiṭṭu ubballa. Iḍli kallina hāge āgutte.
    en: (Rubbing grains between her fingers) Look at this urad dal, Mahesha. It's old. The colour is dull and there are a couple of weevils. Batter from old dal won't rise. The idlis come out like stones.
  - who: supplier
    t: ಅಮ್ಮ, ನಿಮ್ಮ ಕಣ್ಣಿಗೆ ಮೋಸ ಮಾಡೋಕಾಗಲ್ಲ. ಭಾವ ಹೇಳ್ತಿದಾನೆ, ಒಳಗೆ ಹೊಸ ಸ್ಟಾಕ್ ಇದೆಯಂತೆ, ನಿನ್ನೆನೇ ಬಂತಂತೆ. ಕೆಜಿಗೆ ಎಂಟು ರೂಪಾಯಿ ಜಾಸ್ತಿ.
    tr: Amma, nimma kaṇṇige mōsa māḍōkāgalla. Bhāva hēḷtidāne, oḷage hosa sṭāk ideyante, ninnenē bantante. Kejige eṇṭu rūpāyi jāsti.
    en: Amma, nobody can fool your eyes. My brother-in-law says there's new stock inside; it only came yesterday. Eight rupees more a kilo.
  - who: amma
    t: ಎಂಟು ರೂಪಾಯಿ ಜಾಸ್ತಿ ಕೊಟ್ಟು ಇಡ್ಲಿ ಉಳಿಸ್ಕೊಳ್ಳೋದು ಒಳ್ಳೇದು. ಅದನ್ನೇ ತಗೋ.
    tr: Eṇṭu rūpāyi jāsti koṭṭu iḍli uḷiskoḷḷōdu oḷḷēdu. Adannē tagō.
    en: Better to pay eight rupees more and save the idlis. Take that one.
  - who: mahesh
    t: 'ಹಾಗಾದ್ರೆ ತಿಂಗಳಿಗೆ: ಇಡ್ಲಿ ಅಕ್ಕಿ ಆರು ಮೂಟೆ, ಸೋನಾ ಮಸೂರಿ ಎರಡು, ಉದ್ದಿನಬೇಳೆ ನೂರೈವತ್ತು ಕೆಜಿ, ಬಾಂಬೆ ರವೆ, ಸಕ್ಕರೆ, ತೊಗರಿಬೇಳೆ, ಹದಿನೈದು ಲೀಟರ್‌ನ ಸನ್‌ಫ್ಲವರ್ ಎಣ್ಣೆ ಡಬ್ಬ ಹತ್ತು. ರಮೇಶಣ್ಣ, ರೇಟ್ ಜೊತೆ ಕ್ರೆಡಿಟ್ ಬಗ್ಗೆನೂ ಕೇಳಿ.'
    tr: 'Hāgādre tingaḷige: iḍli akki āru mūṭe, Sōnā Masūri eraḍu, uddinabēḷe nūraivattu keji, Bāmbe rave, sakkare, togaribēḷe, hadinaidu līṭar-na sanphlavar eṇṇe ḍabba hattu. Rameśaṇṇa, rēṭ jote kreḍiṭ baggenū kēḷi.'
    en: 'Then per month: six sacks of idli rice, two of Sona Masuri, a hundred and fifty kilos of urad dal, Bombay rava, sugar, toor dal, ten fifteen-litre tins of sunflower oil. Ramesh-anna, ask about credit as well as the rates.'
  - who: supplier
    t: 'ಕೇಳಿದೆ. ಭಾವ ಹೇಳೋದು ಹೀಗೆ: ಮೊದಲ ತಿಂಗಳು ಡೆಲಿವರಿ ಆದ ದಿನವೇ ಪೇಮೆಂಟ್. ಎರಡನೇ ತಿಂಗಳಿಂದ ಹದಿನೈದು ದಿನದ ಕ್ರೆಡಿಟ್. ಒಂದು ಚೆಕ್ ಬೌನ್ಸ್ ಆದ್ರೂ ಮತ್ತೆ ಕ್ಯಾಶ್ ಮಾತ್ರ. ಜಿಎಸ್‌ಟಿ ಬಿಲ್ ಕೊಡ್ತಾನೆ. ಎಣ್ಣೆ ರೇಟ್ ಮಾತ್ರ ವಾರ ವಾರ ಬದಲಾಗುತ್ತೆ, ಅದಕ್ಕೆ ಅವನು ಗ್ಯಾರಂಟಿ ಕೊಡಲ್ಲ.'
    tr: 'Kēḷide. Bhāva hēḷōdu hīge: modala tingaḷu ḍelivari āda dinavē pēmeṇṭ. Eraḍanē tingaḷinda hadinaidu dinada kreḍiṭ. Ondu chek bauns ādrū matte kyāś mātra. Ji-es-ṭi bil koḍtāne. Eṇṇe rēṭ mātra vāra vāra badalāgutte, adakke avanu gyāraṇṭi koḍalla.'
    en: 'I asked. Here''s what my brother-in-law says: the first month, payment on the day of delivery. From the second month, fifteen days'' credit. If even one cheque bounces, it''s back to cash only. He gives GST bills. Only the oil price changes week to week; he won''t guarantee that.'
  - who: mahesh
    t: ನ್ಯಾಯವಾಗಿದೆ. ಹದಿನೈದು ದಿನದ ಕ್ರೆಡಿಟ್ ಅಂದ್ರೆ ನಮ್ಮ ವರ್ಕಿಂಗ್ ಕ್ಯಾಪಿಟಲ್‌ಗೆ ಸ್ವಲ್ಪ ಉಸಿರು ಸಿಗುತ್ತೆ.
    tr: Nyāyavāgide. Hadinaidu dinada kreḍiṭ andre namma varkiṅg kyāpiṭal-ge svalpa usiru sigutte.
    en: That's fair. Fifteen days' credit gives our working capital a little room to breathe.
  - scene: On the bus back to Jayanagar, Mahesh takes a call from the Nandini milk agent, then turns to Amma.
  - who: amma
    t: ಏನಂತೆ ಹಾಲಿನವನು?
    tr: Ēnante hālinavanu?
    en: What does the milk man say?
  - who: mahesh
    t: 'ನಂದಿನಿ ಏಜೆಂಟ್ ಹೇಳಿದ್ರು: ದಿನಾ ಬೆಳಗ್ಗೆ ಐದು ಗಂಟೆಗೆ ಕ್ರೇಟ್‌ನಲ್ಲಿ ತಂದುಕೊಡ್ತಾರಂತೆ. ಶುರುವಿನಲ್ಲಿ ದಿನಕ್ಕೆ ನಲವತ್ತು ಲೀಟರ್. ಟೋನ್ಡ್ ಹಾಲು ಲೀಟರ್‌ಗೆ ನಲವತ್ತಾರು, ಪ್ಯಾಕೆಟ್ ಮೇಲಿನ ರೇಟೇ, ಡಿಸ್ಕೌಂಟ್ ಇಲ್ಲವಂತೆ. ಕ್ರೇಟ್‌ಗೆ ಡೆಪಾಸಿಟ್ ಬೇಕಂತೆ. ಪೇಮೆಂಟ್ ಹತ್ತು ದಿನಕ್ಕೊಮ್ಮೆ.'
    tr: 'Nandini ējeṇṭ hēḷidru: dinā beḷagge aidu gaṇṭege krēṭ-nalli tandukoḍtārante. Śuruvinalli dinakke nalavattu līṭar. Ṭōnḍ hālu līṭar-ge nalavattāru, pyākeṭ mēlina rēṭē, ḍiskauṇṭ illavante. Krēṭ-ge ḍepāsiṭ bēkante. Pēmeṇṭ hattu dinakkomme.'
    en: 'The Nandini agent said he''ll bring it in crates every morning at five. To start with, forty litres a day. Toned milk at forty-six a litre: the price on the packet, no discount, he says. He wants a deposit for the crates. Payment once every ten days.'
  - who: amma
    t: ನಲವತ್ತು ಲೀಟರ್! ನಮ್ಮ ಮನೆಗೆ ಒಂದು ತಿಂಗಳಿಗೆ ಸಾಕು. ಹಾಲು ಒಡೆದು ಹೋದ್ರೆ ವಾಪಸ್ ತಗೊಳ್ತಾನಾ ಅಂತ ಕೇಳಿದ್ಯಾ?
    tr: Nalavattu līṭar! Namma manege ondu tingaḷige sāku. Hālu oḍedu hōdre vāpas tagoḷtānā anta kēḷidyā?
    en: Forty litres! That would last our house a month. Did you ask whether he takes it back if the milk splits?
  - who: mahesh
    t: ಕೇಳಿದೆ. “ಪ್ಯಾಕೆಟ್ ಒಡೆದಿದ್ರೆ, ಡೇಟ್ ಮುಗಿದಿದ್ರೆ ಬದಲಾಯಿಸ್ತೀನಿ. ನಿಮ್ಮ ಫ್ರಿಜ್‌ನಲ್ಲಿ ಕೆಟ್ಟು ಹೋದ್ರೆ ನನ್ನ ತಪ್ಪಲ್ಲ” ಅಂದ್ರು. ನ್ಯಾಯ.
    tr: Kēḷide. “Pyākeṭ oḍedidre, ḍēṭ mugididre badalāyistīni. Nimma phrij-nalli keṭṭu hōdre nanna tappalla” andru. Nyāya.
    en: I did. He said, “If a packet has burst or is past its date, I'll replace it. If it goes bad in your fridge, that's not my fault.” Fair enough.
  - who: amma
    t: ಕಾಫಿ ಪುಡಿ? ಅದು ಮುಖ್ಯ. ಹಾಲು ಎಲ್ಲಾ ಕಡೆ ಒಂದೇ, ಪುಡಿ ಬೇರೆ ಬೇರೆ.
    tr: Kāphi puḍi? Adu mukhya. Hālu ellā kaḍe ondē, puḍi bēre bēre.
    en: And the coffee powder? That's what matters. Milk is the same everywhere; powder isn't.
  - who: mahesh
    t: 'ನನ್ನ ಹಳೇ ಹೋಟೆಲ್ ತಗೊಳ್ತಿದ್ದ ಕಾಫಿ ವರ್ಕ್ಸ್ ಬಸವನಗುಡಿಯಲ್ಲಿ ಇದೆ ಅಮ್ಮ. ಎಂಬತ್ತು-ಇಪ್ಪತ್ತು: ಎಂಬತ್ತು ಕಾಫಿ, ಇಪ್ಪತ್ತು ಚಿಕೋರಿ. ನಾಳೆ ನೀನೂ ಬಾ, ವಾಸನೆ ನೋಡಿ ನೀನೇ ಆರಿಸು.'
    tr: 'Nanna haḷē hōṭel tagoḷtidda kāphi varks Basavanaguḍiyalli ide amma. Embattu-ippattu: embattu kāphi, ippattu chikōri. Nāḷe nīnū bā, vāsane nōḍi nīnē ārisu.'
    en: 'The coffee works my old hotel used to buy from is in Basavanagudi, Amma. Eighty-twenty: eighty coffee, twenty chicory. Come with me tomorrow and choose by the smell yourself.'
  - section: What is left
    learn: 'taking stock: uḷididdu, hōytu, bāki · obligations ahead: … koḍbēku, … kaṭbēku · if / if not: chennāgi bandre naḍeyutte, baradidre… · counting down: ōpaniṅg-ge hadināru dina'
  - scene: Saturday, 10 January 2026, late at night. Kavya closes the laptop halfway, then opens it again. Mahesh has fallen asleep sitting up on the sofa; she shakes him awake.
  - who: kavya
    t: 'ಎದ್ದೇಳು, ಐದು ನಿಮಿಷ. ಲೆಕ್ಕ ಮುಗಿಸ್ಬೇಕು. ಒಳ್ಳೆ ಸುದ್ದಿ ಮೊದಲು: ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ ಲೈಸೆನ್ಸ್ ಬುಧವಾರ ಬಂತು. ಜಿಬಿಎ ಸ್ಟೇಟಸ್ “ಹೆಲ್ತ್ ಆಫೀಸರ್ ಬಳಿ” ಅಂತ ತೋರಿಸ್ತಿದೆ. ಮುಂದೆ ಹೋಗ್ತಿದೆ, ಯಾರಿಗೂ ಏನೂ ಕೊಡದೆ.'
    tr: 'Eddēḷu, aidu nimiṣa. Lekka mugisbēku. Oḷḷe suddi modalu: ef-es-es-e-ai laisens Budhavāra bantu. Ji-bi-e sṭēṭas “helth āphīsar baḷi” anta tōristide. Munde hōgtide, yārigū ēnū koḍade.'
    en: 'Wake up, five minutes. I need to finish the accounts. Good news first: the FSSAI licence came on Wednesday. The GBA status shows “with the Health Officer”. It''s moving, without us giving anybody anything.'
  - who: mahesh
    t: ಹೇಳು. ಎಷ್ಟು ಉಳಿದಿದೆ?
    tr: Hēḷu. Eṣṭu uḷidide?
    en: Go on. How much is left?
  - who: kavya
    t: ಮುದ್ರಾದ ಮೊದಲ ಆರು ಲಕ್ಷ ಸಪ್ಲೈಯರ್‌ಗೆ ಹೋಯ್ತು. ಉಳಿದ ನಾಲ್ಕು ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ಬಂದ್ಮೇಲೆ, ಅದೂ ಸಪ್ಲೈಯರ್ ಮತ್ತೆ ಇಂಟೀರಿಯರ್ ಬಾಕಿಗೆ ನೇರವಾಗಿ ಹೋಗುತ್ತೆ. ನಮ್ಮ ಕೈಗೆ ಒಂದು ರೂಪಾಯಿನೂ ಬರಲ್ಲ.
    tr: Mudrāda modala āru lakṣa saplaiyar-ge hōytu. Uḷida nālku ṭrēḍ laisens bandmēle, adū saplaiyar matte iṇṭīriyar bākige nēravāgi hōgutte. Namma kaige ondu rūpāyinū baralla.
    en: MUDRA's first six lakh has gone to the supplier. The other four come after the trade licence, and they too go straight to the supplier's and the interior contractor's balances. Not one rupee reaches our hands.
  - who: kavya
    t: 'ನಿತಿನ್‌ನ ಎಂಟು ಲಕ್ಷದಿಂದ: ಇಂಟೀರಿಯರ್ ಮೂರು ಲಕ್ಷ ಅರವತ್ತು, ಗ್ಯಾಸ್ ಡೆಪಾಸಿಟ್ ಮತ್ತೆ ಫಿಟ್ಟಿಂಗ್ ಮೂವತ್ನಾಲ್ಕು ಸಾವಿರ, ಬಿಲ್ಲಿಂಗ್ ಮೆಷಿನ್, ಪಾತ್ರೆ, ತಟ್ಟೆ, ಲೋಟ ಒಂದು ಲಕ್ಷ ಹತ್ತು, ಜನವರಿ ರೆಂಟ್ ಒಂದು ಲಕ್ಷ. ಉಳಿದಿದ್ದು ಒಂದು ಲಕ್ಷ ತೊಂಬತ್ತಾರು ಸಾವಿರ. ನಮ್ಮ ಉಳಿತಾಯದಲ್ಲಿ ಲೈಸೆನ್ಸ್, ಸಿಎ, ಎಕ್ಸ್‌ಟಿಂಗ್ವಿಷರ್ ಹೋಗಿ ಅರವತ್ತೆರಡು ಸಾವಿರ.'
    tr: 'Nitin-na eṇṭu lakṣadinda: iṇṭīriyar mūru lakṣa aravattu, gyās ḍepāsiṭ matte phiṭṭiṅg mūvatnālku sāvira, billiṅg meṣin, pātre, taṭṭe, lōṭa ondu lakṣa hattu, Janavari renṭ ondu lakṣa. Uḷididdu ondu lakṣa tombattāru sāvira. Namma uḷitāyadalli laisens, si-e, eksṭiṅgviṣar hōgi aravatteraḍu sāvira.'
    en: 'From Nitin''s eight lakh: interiors three lakh sixty, gas deposit and fitting thirty-four thousand, billing machine, vessels, plates and tumblers one lakh ten, January rent one lakh. What''s left: one lakh ninety-six thousand. From our savings, after licences, the CA and the extinguishers: sixty-two thousand.'
  - who: mahesh
    t: ಒಟ್ಟು ಎರಡು ಲಕ್ಷ ಐವತ್ತೆಂಟು ಸಾವಿರ. ನೀನು ವರ್ಕಿಂಗ್ ಕ್ಯಾಪಿಟಲ್‌ಗೆ ಏಳು ಬೇಕು ಅಂದಿದ್ದೆ.
    tr: Oṭṭu eraḍu lakṣa aivatteṇṭu sāvira. Nīnu varkiṅg kyāpiṭal-ge ēḷu bēku andidde.
    en: Two lakh fifty-eight thousand in all. You said we needed seven for working capital.
  - who: kavya
    t: ಹೌದು. ಫೆಬ್ರವರಿ ಒಂದಕ್ಕೆ ರೆಂಟ್, ಸ್ಟಾಫ್ ಸಂಬಳ, ಹಾಲು, ಗ್ಯಾಸ್, ಬಡ್ಡಿ. ಮೊದಲ ತಿಂಗಳು ಕಲೆಕ್ಷನ್ ಚೆನ್ನಾಗಿ ಬಂದ್ರೆ ನಡೆಯುತ್ತೆ. ಬರದಿದ್ರೆ…
    tr: Haudu. Phebravari ondakke renṭ, sṭāf sambaḷa, hālu, gyās, baḍḍi. Modala tingaḷu kalekṣan chennāgi bandre naḍeyutte. Baradidre…
    en: 'Yes. On the first of February: rent, staff salaries, milk, gas, interest. If the first month''s takings are good, we''ll manage. If they''re not…'
  - who: mahesh
    t: ಅಮ್ಮನ ಚಿನ್ನ.
    tr: Ammana chinna.
    en: (Quietly) Amma's gold.
  - who: kavya
    t: 'ಅದು ಇನ್ನೂ ಲಾಕರ್‌ನಲ್ಲೇ ಇದೆ, ಹಾಗೇ ಇರ್ಲಿ ಅಂತ ನನ್ನ ಆಸೆ. ಈಗ ಅದಕ್ಕಿಂತ ದೊಡ್ಡ ಪ್ರಶ್ನೆ: ಅಡುಗೆ ಮಾಡೋರು ಯಾರು? ಓಪನಿಂಗ್‌ಗೆ ಹದಿನಾರು ದಿನ. ಮೆಷಿನ್ ಇದೆ, ಗ್ಯಾಸ್ ಇದೆ, ಮೆನು ಇದೆ. ಕುಕ್ ಇಲ್ಲ, ಹೆಲ್ಪರ್ ಇಲ್ಲ, ಕ್ಯಾಶಿಯರ್ ಇಲ್ಲ.'
    tr: 'Adu innū lākar-nallē ide, hāgē irli anta nanna āse. Īga adakkinta doḍḍa praśne: aḍuge māḍōru yāru? Ōpaniṅg-ge hadināru dina. Meṣin ide, gyās ide, menu ide. Kuk illa, helpar illa, kyāśiyar illa.'
    en: 'It''s still in the locker, and I hope it stays there. Right now there''s a bigger question: who''s going to cook? Sixteen days to the opening. We have machines, gas, a menu. No cook, no helpers, no cashier.'
  - who: mahesh
    t: ಕುಂದಾಪುರದಲ್ಲಿ ಒಬ್ಬರು ಇದಾರೆ, ಶಂಕರ ಅಂತ. ಇಪ್ಪತ್ತೈದು ವರ್ಷ ಉಡುಪಿ ಹೋಟೆಲ್‌ಗಳಲ್ಲಿ ಹೆಡ್ ಕುಕ್. ಕೋಪ ಜಾಸ್ತಿ, ಸಂಬಳ ಜಾಸ್ತಿ. ಆದ್ರೆ ಅವರ ಸಾಂಬಾರ್ ಒಂದು ಸಲ ಕುಡಿದ್ರೆ ಎರಡೂ ಮರೆತು ಹೋಗುತ್ತೆ. ನಾಳೆ ರಾತ್ರಿ ಬಸ್‌ಗೆ ಹೋಗ್ತೀನಿ.
    tr: Kundāpuradalli obbaru idāre, Śaṅkara anta. Ippattaidu varṣa Uḍupi hōṭel-gaḷalli heḍ kuk. Kōpa jāsti, sambaḷa jāsti. Ādre avara sāmbār ondu sala kuḍidre eraḍū maretu hōgutte. Nāḷe rātri bas-ge hōgtīni.
    en: There's a man in Kundapura, Shankara. Twenty-five years as head cook in Udupi hotels. A big temper, a big salary. But one sip of his sambar and you forget both. I'll take the night bus tomorrow.
  - who: kavya
    t: ಹೋಗು. ಆದ್ರೆ ಸಂಬಳದ ಮಾತು ಶುರು ಮಾಡೋ ಮುಂಚೆ ನನಗೆ ಫೋನ್ ಮಾಡು.
    tr: Hōgu. Ādre sambaḷada mātu śuru māḍō muñche nanage phōn māḍu.
    en: Go. But call me before you start talking salary.
  - chapter: Chapter 5 — Hiring the team
  - section: Shankara of Kundapura
    learn: 'coastal colour: ēnta, uṇṭu, mārāyre, aldā · conditions: … ādre mātra, … bēku, … bāradu · salary talk: sambaḷa, ūṭa-rūm, bōnas, raje, aḍvāns · counter-offers: modala mūru tingaḷu…, … dāṭidre…'
  - scene: 'Monday, 12 January 2026, 7 a.m. Kundapura. A tiled house near the river: areca palms, a well, a scooter under a mango tree. Shankara, fifty, in a white mundu, is grating coconut on the verandah. He does not get up at once.'
  - who: cook
    t: ಓ, ಬೆಂಗಳೂರಿನವರು ಬಂದ್ರಾ. ಬನ್ನಿ ಮಾರಾಯ್ರೆ, ಕೂತ್ಕೊಳ್ಳಿ. ರಾತ್ರಿ ಬಸ್ಸಲ್ಲಿ ನಿದ್ದೆ ಆಯ್ತಾ? ಮೊದಲು ಕಾಫಿ ಕುಡೀರಿ, ಮಾತು ಆಮೇಲೆ.
    tr: Ō, Beṅgaḷūrinavaru bandrā. Banni mārāyre, kūtkoḷḷi. Rātri bassalli nidde āytā? Modalu kāphi kuḍīri, mātu āmēle.
    en: Oh, the Bengaluru man has come. Come in, my friend, sit down. Did you sleep on the night bus? Drink your coffee first; we'll talk afterwards.
  - who: mahesh
    t: ನಮಸ್ಕಾರ ಶಂಕರಣ್ಣ. ಉಡುಪಿಯಲ್ಲಿ ನಿಮ್ಮ ಹೆಸರು ಕೇಳದವರು ಯಾರೂ ಇಲ್ಲ. ಹತ್ತು ವರ್ಷ ಆದ್ರೂ ನಿಮ್ಮ ಸಾಂಬಾರ್ ರುಚಿ ನನಗೆ ಇನ್ನೂ ನೆನಪಿದೆ.
    tr: Namaskāra Śaṅkaraṇṇa. Uḍupiyalli nimma hesaru kēḷadavaru yārū illa. Hattu varṣa ādrū nimma sāmbār ruchi nanage innū nenapide.
    en: Namaskara, Shankara-anna. There's nobody in Udupi who hasn't heard your name. Ten years on, I still remember the taste of your sambar.
  - who: cook
    t: ಹೊಗಳಿಕೆ ಸಾಕು. ಹೊಗಳೋರು ಎಲ್ರೂ ಸಂಬಳದ ಮಾತು ಬಂದಾಗ ಸುಮ್ಮನಾಗ್ತಾರೆ. ಎಂತ ವಿಷಯ? ನೇರವಾಗಿ ಹೇಳಿ.
    tr: Hogaḷike sāku. Hogaḷōru ellrū sambaḷada mātu bandāga summanāgtāre. Ēnta viṣaya? Nēravāgi hēḷi.
    en: Enough praise. Everyone who praises goes quiet when salary comes up. What's this about? Say it straight.
  - who: mahesh
    t: ಜಯನಗರ ನಾಲ್ಕನೇ ಬ್ಲಾಕ್‌ನಲ್ಲಿ ಒಂದು ಸಣ್ಣ ದರ್ಶಿನಿ ತೆಗೀತಿದೀನಿ, ಶಾರದಾ ದರ್ಶಿನಿ. ಜನವರಿ ಇಪ್ಪತ್ತಾರಕ್ಕೆ ಓಪನಿಂಗ್. ಐನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್, ನಿಂತ್ಕೊಂಡು ತಿನ್ನೋದು. ಇಡ್ಲಿ, ವಡೆ, ದೋಸೆ, ಬಾತ್, ಕಾಫಿ. ಅಡುಗೆಮನೆ ನಿಮ್ಮ ಕೈಯಲ್ಲಿ ಇರಬೇಕು ಅಂತ ನನ್ನ ಆಸೆ.
    tr: Jayanagara nālkanē blāk-nalli ondu saṇṇa darśini tegītidīni, Śāradā Darśini. Janavari ippattārakke ōpaniṅg. Ainūru skvēr fīṭ, nintkoṇḍu tinnōdu. Iḍli, vaḍe, dōse, bāt, kāphi. Aḍugemane nimma kaiyalli irabēku anta nanna āse.
    en: I'm opening a small darshini in Jayanagar 4th Block, Sharada Darshini. Opening on the twenty-sixth of January. Five hundred square feet, people eat standing. Idli, vada, dose, bath, coffee. I'd like the kitchen to be in your hands.
  - who: cook
    t: ಬೆಂಗಳೂರು… ಅಲ್ಲಿ ನೀರು ಬೇರೆ, ಅಕ್ಕಿ ಬೇರೆ, ಜನರ ನಾಲಿಗೆ ಬೇರೆ. ಮೂರು ವರ್ಷ ಹಿಂದೆ ಒಂದು ಚೈನ್‌ನವರು ಕರೆದಿದ್ರು. ಎರಡು ತಿಂಗಳಲ್ಲಿ ವಾಪಸ್ ಬಂದೆ. ಅಲ್ಲಿ ಸಾಂಬಾರ್ ಪುಡಿ ಪ್ಯಾಕೆಟ್‌ನಲ್ಲಿ ಬರ್ತಿತ್ತು. ಅಡುಗೆಯವನಿಗೆ ಕೆಲಸ ಇಲ್ಲ, ಬರೀ ಬಟನ್ ಒತ್ತೋದು.
    tr: Beṅgaḷūru… alli nīru bēre, akki bēre, janara nālige bēre. Mūru varṣa hinde ondu chain-navaru karedidru. Eraḍu tingaḷalli vāpas bande. Alli sāmbār puḍi pyākeṭ-nalli bartittu. Aḍugeyavanige kelasa illa, barī baṭan ottōdu.
    en: Bengaluru… the water's different there, the rice is different, people's tongues are different. Three years ago a chain called me. I was back in two months. Their sambar powder came in packets. Nothing for a cook to do; just press buttons.
  - who: mahesh
    t: ನಮ್ಮಲ್ಲಿ ಪ್ಯಾಕೆಟ್ ಇಲ್ಲ. ಸಾಂಬಾರ್ ಪುಡಿ, ಚಟ್ನಿ, ಕಾಫಿ ಡಿಕಾಕ್ಷನ್, ಎಲ್ಲಾ ಅಂಗಡಿಯಲ್ಲೇ ಮಾಡೋದು. ಅದಕ್ಕೇ ನೀವು ಬೇಕು.
    tr: Nammalli pyākeṭ illa. Sāmbār puḍi, chaṭni, kāphi ḍikākṣan, ellā aṅgaḍiyallē māḍōdu. Adakkē nīvu bēku.
    en: We have no packets. Sambar powder, chutney, coffee decoction, everything is made in the shop. That's exactly why I need you.
  - who: cook
    t: 'ಹಾಗಾದ್ರೆ ನನ್ನ ಕಂಡೀಷನ್ ಕೇಳಿ. ಒಂದು: ಮಸಾಲೆ ನಾನೇ ಹುರಿದು ನಾನೇ ಪುಡಿ ಮಾಡ್ತೀನಿ. ರೆಸಿಪಿ ಯಾರಿಗೂ ಬರ್ಕೊಡಲ್ಲ. ಎರಡು: ಕಸ್ಟಮರ್ ಮುಂದೆ ನನ್ನ ಮೇಲೆ ಯಾರೂ ಕೂಗಾಡಬಾರದು. ತಪ್ಪಿದ್ರೆ ಒಳಗೆ ಕರೆದು ಹೇಳಿ, ಕೇಳ್ತೀನಿ.'
    tr: 'Hāgādre nanna kaṇḍīṣan kēḷi. Ondu: masāle nānē huridu nānē puḍi māḍtīni. Resipi yārigū barkoḍalla. Eraḍu: kasṭamar munde nanna mēle yārū kūgāḍabāradu. Tappidre oḷage karedu hēḷi, kēḷtīni.'
    en: 'Then hear my conditions. One: I roast the spices myself and grind the powder myself. I don''t write the recipe down for anybody. Two: nobody shouts at me in front of customers. If I go wrong, call me inside and tell me; I''ll listen.'
  - who: mahesh
    t: ಎರಡೂ ಒಪ್ಪಿಗೆ. ನಾನೂ ಹತ್ತು ವರ್ಷ ಸೂಪರ್‌ವೈಸರ್ ಆಗಿದ್ದೆ. ಎಲ್ಲರ ಮುಂದೆ ಕೂಗಿದ್ರೆ ಕೆಲಸ ಆಗಲ್ಲ, ಮನಸ್ಸು ಮುರಿಯುತ್ತೆ ಅಷ್ಟೇ.
    tr: Eraḍū oppige. Nānū hattu varṣa sūparvaisar āgidde. Ellara munde kūgidre kelasa āgalla, manassu muriyutte aṣṭē.
    en: Agreed on both. I was a supervisor for ten years myself. Shouting in front of everyone doesn't get work done; it only breaks people's spirit.
  - who: cook
    t: 'ಮೂರು: ವರ್ಷಕ್ಕೆ ಒಂದು ಸಲ ಕೋಟೇಶ್ವರದ ಕೊಡಿಹಬ್ಬಕ್ಕೆ ಒಂದು ವಾರ ರಜೆ. ಅದು ನಮ್ಮ ಮನೆದೇವರ ಹಬ್ಬ. ಹೋಟೆಲ್ ಮುಚ್ಚಿದ್ರೂ ಸರಿ, ನಾನು ಹೋಗೋದೇ.'
    tr: 'Mūru: varṣakke ondu sala Kōṭēśvarada koḍihabbakke ondu vāra raje. Adu namma manedēvara habba. Hōṭel muchchidrū sari, nānu hōgōdē.'
    en: 'Three: once a year, a week''s leave for the Kodi Habba at Koteshwara. It''s our family deity''s festival. Even if the hotel has to shut, I''m going.'
  - who: mahesh
    t: ಅದು ನವೆಂಬರ್-ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಅಲ್ವಾ? ಆ ವಾರಕ್ಕೆ ಬೇರೆ ವ್ಯವಸ್ಥೆ ಮಾಡ್ತೀನಿ. ಸರಿ. ಈಗ… ಸಂಬಳ.
    tr: Adu Navembar-Ḍisembar-nalli alvā? Ā vārakke bēre vyavasthe māḍtīni. Sari. Īga… sambaḷa.
    en: That's in November or December, isn't it? I'll make other arrangements for that week. All right. Now… salary.
  - who: cook
    t: ಮೂವತ್ತೈದು ಸಾವಿರ. ಊಟ, ರೂಮ್ ನಿಮ್ದು. ರೂಮ್ ನನಗೊಬ್ಬನಿಗೇ ಬೇಕು. ಐವತ್ತು ವರ್ಷ ಆಯ್ತು, ಹುಡುಗರ ಗೊರಕೆ ಕೇಳ್ಕೊಂಡು ಮಲಗೋಕಾಗಲ್ಲ.
    tr: Mūvattaidu sāvira. Ūṭa, rūm nimdu. Rūm nanagobbanigē bēku. Aivattu varṣa āytu, huḍugara gorake kēḷkoṇḍu malagōkāgalla.
    en: Thirty-five thousand. Food and room from you. And the room just for me. I'm fifty; I can't sleep listening to boys snoring.
  - who: mahesh
    t: ಒಂದು ನಿಮಿಷ, ಶಂಕರಣ್ಣ. ನನ್ನ ಹೆಂಡತಿಗೆ ಒಂದು ಫೋನ್ ಮಾಡ್ಬೇಕು. ಸಂಬಳದ ಮಾತಿಗೆ ಮುಂಚೆ ಫೋನ್ ಮಾಡು ಅಂತ ಆರ್ಡರ್ ಇದೆ.
    tr: Ondu nimiṣa, Śaṅkaraṇṇa. Nanna heṇḍatige ondu phōn māḍbēku. Sambaḷada mātige muñche phōn māḍu anta ārḍar ide.
    en: One minute, Shankara-anna. I have to phone my wife. I have orders to call her before any salary talk.
  - who: cook
    t: ಹೋ, ಮನೆಯಲ್ಲೂ ಒಬ್ಬ ಹೆಡ್ ಕುಕ್ ಉಂಟು ಅನ್ನಿ. ಮಾಡಿ ಮಾಡಿ.
    tr: Hō, maneyallū obba heḍ kuk uṇṭu anni. Māḍi māḍi.
    en: (Laughing for the first time) Oh, so there's a head cook at home too. Go on, call.
  - scene: Mahesh walks over to the well and phones Kavya. She answers in a whisper from her desk at the CA firm.
  - who: kavya
    t: ಮೂವತ್ತೈದಾ? ಸಂಬಳವೇ ವರ್ಷಕ್ಕೆ ನಾಲ್ಕು ಲಕ್ಷ ಇಪ್ಪತ್ತು ಸಾವಿರ. ಬೇರೆ ರೂಮ್ ಅಂದ್ರೆ ತಿಂಗಳಿಗೆ ಇನ್ನೂ ಐದು ಸಾವಿರ. ನಮ್ಮ ಹತ್ರ ಇರೋದು ಎರಡೂವರೆ ಲಕ್ಷ, ನೆನಪಿರ್ಲಿ.
    tr: Mūvattaidā? Sambaḷavē varṣakke nālku lakṣa ippattu sāvira. Bēre rūm andre tingaḷige innū aidu sāvira. Namma hatra irōdu eraḍūvare lakṣa, nenapirli.
    en: Thirty-five? The salary alone is four lakh twenty thousand a year. A separate room means another five thousand a month. What we have is two and a half lakh, remember.
  - who: mahesh
    t: ಗೊತ್ತು. ಆದ್ರೆ ಅಡುಗೆ ಕೆಟ್ಟರೆ ಒಂದು ತಿಂಗಳಲ್ಲಿ ಅಂಗಡಿ ಮುಚ್ಚಬೇಕಾಗುತ್ತೆ. ಹೋಟೆಲ್‌ನ ಜೀವ ಅಡುಗೆಮನೆ.
    tr: Gottu. Ādre aḍuge keṭṭare ondu tingaḷalli aṅgaḍi muchchabēkāgutte. Hōṭel-na jīva aḍugemane.
    en: I know. But if the food is bad, we'll have to shut within a month. The kitchen is a hotel's life.
  - who: kavya
    t: 'ಹಾಗಾದ್ರೆ ಹೀಗೆ ಹೇಳು: ಮೊದಲ ಮೂರು ತಿಂಗಳು ಮೂವತ್ತು. ದಿನದ ಕಲೆಕ್ಷನ್ ಸರಾಸರಿ ಇಪ್ಪತ್ತು ಸಾವಿರ ದಾಟಿದ್ರೆ ಮೇ ತಿಂಗಳಿಂದ ಮೂವತ್ತೈದು. ಜೊತೆಗೆ ದೀಪಾವಳಿಗೆ ಒಂದು ತಿಂಗಳ ಬೋನಸ್. ನಮ್ಮ ಮೇಲೆ ನಂಬಿಕೆ ಇದ್ರೆ ಒಪ್ಪುತ್ತಾರೆ.'
    tr: 'Hāgādre hīge hēḷu: modala mūru tingaḷu mūvattu. Dinada kalekṣan sarāsari ippattu sāvira dāṭidre Mē tingaḷinda mūvattaidu. Jotege Dīpāvaḷige ondu tingaḷa bōnas. Namma mēle nambike idre opputtāre.'
    en: 'Then put it like this: thirty for the first three months. If the daily takings average more than twenty thousand, thirty-five from May. Plus one month''s bonus at Deepavali. If he trusts us, he''ll agree.'
  - scene: Back on the verandah. Mahesh repeats the offer word for word. Shankara grates coconut in silence for a long moment.
  - who: cook
    t: 'ನಿಮ್ಮ ಹೆಂಡತಿ ಲೆಕ್ಕ ಗಟ್ಟಿ ಮಾರಾಯ್ರೆ. ಒಂದೇ ಬದಲಾವಣೆ: ಮೂವತ್ತಲ್ಲ, ಮೂವತ್ತೆರಡು. ಉಳಿದಿದ್ದು ಅವರು ಹೇಳಿದ ಹಾಗೇ. ರೂಮ್ ಹತ್ತಿರ ಇರಬೇಕು, ನಾನು ನಾಲ್ಕೂವರೆಗೆ ಅಡುಗೆಮನೆಯಲ್ಲಿರ್ತೀನಿ.'
    tr: 'Nimma heṇḍati lekka gaṭṭi mārāyre. Ondē badalāvaṇe: mūvattalla, mūvatteraḍu. Uḷididdu avaru hēḷida hāgē. Rūm hattira irabēku, nānu nālkūvarege aḍugemaneyallirtīni.'
    en: 'Your wife''s arithmetic is solid, my friend. Just one change: not thirty, thirty-two. The rest as she said. The room must be close by; I''ll be in the kitchen at half past four.'
  - who: mahesh
    t: ಮೂವತ್ತೆರಡು ಒಪ್ಪಿಗೆ. ಬಸ್ ಚಾರ್ಜ್‌ಗೆ ಮತ್ತೆ ಮೊದಲ ವಾರದ ಖರ್ಚಿಗೆ ಐದು ಸಾವಿರ ಅಡ್ವಾನ್ಸ್ ಕೊಡ್ತೀನಿ.
    tr: Mūvatteraḍu oppige. Bas chārj-ge matte modala vārada kharchige aidu sāvira aḍvāns koḍtīni.
    en: Thirty-two, agreed. I'll give you five thousand in advance for the bus fare and the first week's expenses.
  - who: cook
    t: 'ಅಡ್ವಾನ್ಸ್ ಬೇಡ. ಕೆಲಸ ನೋಡಿ ಕೊಡಿ. ಆದ್ರೆ ಒಂದು ಮಾತು: ಶುರುವಿನ ಹತ್ತು ದಿನ ನಾನು ನಿಮ್ಮ ಮನೆ ಊಟ ಮಾಡ್ತೀನಿ. ನಿಮ್ಮಮ್ಮ ಮಾಡೋ ಚಟ್ನಿ ತಿಂದ್ರೆ ನಿಮ್ಮ ಮನೆ ಎಂಥದ್ದು ಅಂತ ಗೊತ್ತಾಗುತ್ತೆ.'
    tr: 'Aḍvāns bēḍa. Kelasa nōḍi koḍi. Ādre ondu mātu: śuruvina hattu dina nānu nimma mane ūṭa māḍtīni. Nimmamma māḍō chaṭni tindre nimma mane enthaddu anta gottāgutte.'
    en: 'No advance. Pay me once you''ve seen my work. But one thing: for the first ten days I''ll eat at your house. One taste of your mother''s chutney and I''ll know what kind of house yours is.'
  - who: mahesh
    t: 'ಆಯ್ತು. ಆದ್ರೆ ಎಚ್ಚರ: ಅಮ್ಮನ ಚಟ್ನಿಯಲ್ಲಿ ಅವರ ಮುಂದೆ ಏನಾದ್ರೂ ಕೊರತೆ ಹುಡುಕಿದ್ರೆ, ಅವತ್ತೇ ಯುದ್ಧ.'
    tr: 'Āytu. Ādre echchara: ammana chaṭniyalli avara munde ēnādrū korate huḍukidre, avattē yuddha.'
    en: 'Done. But careful: if you find any fault with Amma''s chutney in front of her, it''s war that very day.'
  - who: cook
    t: ಹಾಗಾದ್ರೆ ಸರಿಯಾದ ಜಾಗಕ್ಕೇ ಬರ್ತಿದೀನಿ. ಹದಿನೆಂಟನೇ ತಾರೀಖು ರಾತ್ರಿ ಬಸ್ ಹತ್ತುತ್ತೀನಿ. ಟ್ರಯಲ್‌ಗೆ ಒಂದು ವಾರ ಸಾಕು, ಅಲ್ದಾ?
    tr: Hāgādre sariyāda jāgakkē bartidīni. Hadineṇṭanē tārīkhu rātri bas hattuttīni. Ṭrayal-ge ondu vāra sāku, aldā?
    en: Then I'm coming to the right place. I'll catch the night bus on the eighteenth. A week is enough for trials, isn't it?
  - section: Basavaraj, Dev and Latha
    learn: 'interview questions: elli kelsa māḍtidri? eṣṭu varṣa? yāke biṭri? · terms: tingaḷa sambaḷa, ūṭa-rūm, vāradalli ondu dina raje, ṭrayal · North-Karnataka colour: aiti, adāri, -ri, sāhēbra, pagāra · simple Kannada corrected: nanage kelasa bēku (not nānu kelasa bēku)'
  - scene: Wednesday, 14 January 2026, Sankranti. The shop has its counter and steel shelves but no customers yet. Mahesh and Kavya sit on two upturned crates; Amma has brought ellu-bella for everyone. A young man in a freshly ironed shirt waits at the shutter.
  - who: helper
    t: ನಮಸ್ಕಾರ್ರಿ ಸಾಹೇಬ್ರ. ನಾ ಬಸವರಾಜ, ಬಾಗಲಕೋಟೆ ಕಡೆಯವ. ರಮೇಶಣ್ಣ ಕಳಿಸ್ಯಾರ್ರಿ.
    tr: Namaskārri sāhēbra. Nā Basavarāja, Bāgalakōṭe kaḍeyava. Rameśaṇṇa kaḷisyārri.
    en: Namaskara, sir. I'm Basavaraj, from the Bagalkot side. Ramesh-anna sent me.
  - who: mahesh
    t: ಬನ್ನಿ ಬಸವರಾಜ್. ಮೊದಲು ಎಳ್ಳು-ಬೆಲ್ಲ ತಗೊಳ್ಳಿ, ಇವತ್ತು ಸಂಕ್ರಾಂತಿ. ಮೊದಲು ಎಲ್ಲಿ ಕೆಲಸ ಮಾಡ್ತಿದ್ರಿ? ಎಷ್ಟು ವರ್ಷ?
    tr: Banni Basavarāj. Modalu eḷḷu-bella tagoḷḷi, ivattu Saṅkrānti. Modalu elli kelasa māḍtidri? Eṣṭu varṣa?
    en: Come in, Basavaraj. Have some ellu-bella first; it's Sankranti today. Where did you work before? How many years?
  - who: helper
    t: ಹುಬ್ಬಳ್ಳಿಯೊಳಗ ಒಂದು ಖಾನಾವಳಿಯೊಳಗ ಮೂರು ವರ್ಷ ಇದ್ದೆರಿ. ರೊಟ್ಟಿ ತಟ್ಟತೇನಿ, ಪಲ್ಯ ಮಾಡತೇನಿ, ಪಾತ್ರೆ ತೊಳಿತೇನಿ. ದೋಸೆ ಇನ್ನೂ ಸರಿ ಬರಂಗಿಲ್ಲರಿ, ಕಲಿತೇನಿ.
    tr: Hubbaḷḷiyoḷaga ondu khānāvaḷiyoḷaga mūru varṣa idderi. Roṭṭi taṭṭatēni, palya māḍatēni, pātre toḷitēni. Dōse innū sari baraṅgillari, kalitēni.
    en: Three years in a khanavali in Hubballi, sir. I can pat out rotis, make palya, wash vessels. My dosas don't come out right yet; I'll learn.
  - who: kavya
    t: ಅಲ್ಲಿ ಯಾಕೆ ಬಿಟ್ರಿ?
    tr: Alli yāke biṭri?
    en: Why did you leave?
  - who: helper
    t: ಮಾಲೀಕ್ರು ಮೂರು ತಿಂಗಳು ಪಗಾರ ಕೊಡಲಿಲ್ಲರಿ ಮೇಡಂ. ಕೇಳಿದ್ರ ‘ಮುಂದಿನ ವಾರ’ ಅಂತಿದ್ರು. ಮನ್ಯಾಗ ಅವ್ವ, ತಂಗಿ ಅದಾರ್ರಿ. ತಂಗಿ ಕಾಲೇಜಿಗೆ ಫೀಸ್ ಕಟ್ಟಬೇಕು. ಪಗಾರ ಟೈಮಿಗೆ ಬಂದ್ರ ಸಾಕ್ರಿ, ನಾ ಕೆಲಸದಾಗ ಹಿಂದ ಸರಿಯಂಗಿಲ್ಲ.
    tr: Mālīkru mūru tingaḷu pagāra koḍalillari mēḍam. Kēḷidra ‘mundina vāra’ antidru. Manyāga avva, taṅgi adārri. Taṅgi kālējige phīs kaṭṭabēku. Pagāra ṭaimige bandra sākri, nā kelasadāga hinda sariyaṅgilla.
    en: The owner didn't pay my wages for three months, madam. When I asked, he'd say ‘next week’. At home there's my mother and my younger sister. I have to pay my sister's college fees. If the pay comes on time, that's all I ask; I won't hold back at work.
  - who: kavya
    t: ನಮ್ಮಲ್ಲಿ ಸಂಬಳ ಪ್ರತಿ ತಿಂಗಳು ಒಂದನೇ ತಾರೀಖು, ನೇರವಾಗಿ ಬ್ಯಾಂಕ್ ಅಕೌಂಟ್‌ಗೆ. ಹದಿನೈದು ಸಾವಿರ, ಮೂರು ಹೊತ್ತು ಊಟ, ಹತ್ತಿರದಲ್ಲಿ ಹಂಚಿಕೊಳ್ಳೋ ರೂಮ್. ವಾರಕ್ಕೆ ಒಂದು ದಿನ ರಜೆ, ಆದ್ರೆ ಭಾನುವಾರ ಅಲ್ಲ. ಭಾನುವಾರ ನಮಗೆ ಜಾಸ್ತಿ ವ್ಯಾಪಾರ.
    tr: Nammalli sambaḷa prati tingaḷu ondanē tārīkhu, nēravāgi byāṅk akauṇṭ-ge. Hadinaidu sāvira, mūru hottu ūṭa, hattiradalli hañchikoḷḷō rūm. Vārakke ondu dina raje, ādre Bhānuvāra alla. Bhānuvāra namage jāsti vyāpāra.
    en: Here, salary comes on the first of every month, straight into your bank account. Fifteen thousand, three meals a day, a shared room nearby. One day off a week, but not Sunday. Sunday is our busiest day.
  - who: mahesh
    t: ಹಬ್ಬಕ್ಕೆ ಊರಿಗೆ ಹೋಗ್ಬೇಕಂದ್ರೆ ಹದಿನೈದು ದಿನ ಮುಂಚೆ ಹೇಳ್ಬೇಕು. ಹೇಳದೆ ಹೋಗಿ ಹೇಳದೆ ಬರೋದು ಇಲ್ಲಿ ನಡೆಯಲ್ಲ.
    tr: Habbakke ūrige hōgbēkandre hadinaidu dina muñche hēḷbēku. Hēḷade hōgi hēḷade barōdu illi naḍeyalla.
    en: If you need to go home for a festival, tell us fifteen days ahead. Leaving without a word and turning up without a word doesn't work here.
  - who: helper
    t: ಆತ್ರಿ ಸಾಹೇಬ್ರ. ಸುಗ್ಗಿ ಟೈಮಿಗೆ ಮಾತ್ರ ಒಂದು ವಾರ ಊರಿಗೆ ಹೋಗತೇನಿ, ಮುಂಚೆನೇ ಹೇಳತೇನಿ. ಮಾತು ಕೊಟ್ಟೇನ್ರಿ.
    tr: Ātri sāhēbra. Suggi ṭaimige mātra ondu vāra ūrige hōgatēni, muñchenē hēḷatēni. Mātu koṭṭēnri.
    en: All right, sir. Only at harvest time I'll go home for a week, and I'll tell you well before. You have my word.
  - scene: Half an hour later. A thin young man with a backpack, slightly out of breath; he has walked from the metro station.
  - who: dev
    t: ನಮಸ್ಕಾರ ಸಾರ್. ನಾನು ದೇವ್. ಅಸ್ಸಾಂ. ಬೋರ್ಡ್ ನೋಡಿದೆ, ‘ಕೆಲಸಕ್ಕೆ ಜನ ಬೇಕು’. ನಾನು ಕೆಲಸ ಬೇಕು.
    tr: Namaskāra sār. Nānu Dēv. Assām. Bōrḍ nōḍide, ‘kelasakke jana bēku’. Nānu kelasa bēku.
    en: 'Namaskara, sir. I am Dev. Assam. I saw the board: ‘Staff wanted’. I… need job.'
  - who: amma
    t: ‘ನಾನು’ ಅಲ್ಲಪ್ಪ, ‘ನನಗೆ ಕೆಲಸ ಬೇಕು’. ‘ಬೇಕು’ ಬಂದಾಗ ‘ನನಗೆ’. ನನಗೆ ಕಾಫಿ ಬೇಕು, ನನಗೆ ನಿದ್ದೆ ಬೇಕು.
    tr: ‘Nānu’ allappa, ‘nanage kelasa bēku’. ‘Bēku’ bandāga ‘nanage’. Nanage kāphi bēku, nanage nidde bēku.
    en: '(Gently) Not ‘nānu’, dear: ‘nanage kelasa bēku’. When there''s ‘bēku’, it''s ‘nanage’. Nanage coffee bēku, nanage sleep bēku.'
  - who: dev
    t: ನನಗೆ ಕೆಲಸ ಬೇಕು. ಥ್ಯಾಂಕ್ಯೂ ಅಮ್ಮ. ಕನ್ನಡ ಕಷ್ಟ, ಆದ್ರೆ ಚೆನ್ನಾಗಿದೆ.
    tr: Nanage kelasa bēku. Thyāṅkyū amma. Kannaḍa kaṣṭa, ādre chennāgide.
    en: Nanage kelasa bēku. Thank you, Amma. Kannada is difficult, but it's nice.
  - who: mahesh
    t: ಎಷ್ಟು ದಿನದಿಂದ ಬೆಂಗಳೂರಲ್ಲಿ ಇದೀಯ? ಮೊದಲು ಎಲ್ಲಿ ಕೆಲಸ ಮಾಡ್ತಿದ್ದೆ?
    tr: Eṣṭu dinadinda Beṅgaḷūralli idīya? Modalu elli kelasa māḍtidde?
    en: How long have you been in Bengaluru? Where were you working before?
  - who: dev
    t: ಒಂದು ವರ್ಷ. ಕೋರಮಂಗಲ, ಬೇಕರಿ. ಪಾತ್ರೆ ತೊಳೆಯೋದು, ಟೇಬಲ್ ಕ್ಲೀನ್, ಟೀ ಮಾಡೋದು. ಬೇಕರಿ ಮುಚ್ಚಿತು. ಮಾಲೀಕ ದುಬೈಗೆ ಹೋದ.
    tr: Ondu varṣa. Kōramaṅgala, bēkari. Pātre toḷeyōdu, ṭēbal klīn, ṭī māḍōdu. Bēkari muchchitu. Mālīka Dubaige hōda.
    en: One year. Koramangala, a bakery. Washing vessels, cleaning tables, making tea. The bakery closed. The owner went to Dubai.
  - who: kavya
    t: ಹಿಂದಿ ಬರುತ್ತಾ? ಕಸ್ಟಮರ್ ಜೊತೆ ಕನ್ನಡದಲ್ಲಿ ಮಾತಾಡೋಕೆ ಆಗುತ್ತಾ?
    tr: Hindi baruttā? Kasṭamar jote Kannaḍadalli mātāḍōke āguttā?
    en: Do you speak Hindi? Can you talk to customers in Kannada?
  - who: dev
    t: ಹಿಂದಿ ಬರುತ್ತೆ, ಅಸ್ಸಾಮೀಸ್ ಬರುತ್ತೆ. ಕನ್ನಡ… ‘ಇಡ್ಲಿ ವಡೆ’, ‘ಎಷ್ಟು’, ‘ಸ್ವಲ್ಪ ಇರಿ’, ‘ಊಟ ಆಯ್ತಾ’. ದಿನಾ ಹತ್ತು ಪದ ಕಲೀತೀನಿ. ಫೋನ್‌ನಲ್ಲಿ ಬರ್ಕೊಳ್ತೀನಿ.
    tr: Hindi barutte, Assāmīs barutte. Kannaḍa… ‘iḍli vaḍe’, ‘eṣṭu’, ‘svalpa iri’, ‘ūṭa āytā’. Dinā hattu pada kalītīni. Phōn-nalli barkoḷtīni.
    en: Hindi yes, Assamese yes. Kannada… ‘idli vada’, ‘how much’, ‘wait a moment’, ‘have you eaten?’. Every day I learn ten words. I write them in my phone.
  - who: mahesh
    t: ದಿನಕ್ಕೆ ಹತ್ತು ಪದ ಅಂದ್ರೆ ಒಂದು ವರ್ಷದಲ್ಲಿ ಮೂರು ಸಾವಿರಕ್ಕಿಂತ ಜಾಸ್ತಿ. ಆಮೇಲೆ ನೀನು ನನಗಿಂತ ಚೆನ್ನಾಗಿ ಮಾತಾಡ್ತೀಯ. ಹದಿನಾಲ್ಕು ಸಾವಿರ, ಊಟ, ರೂಮ್ ಬಸವರಾಜ್ ಜೊತೆ. ಮೊದಲ ಒಂದು ತಿಂಗಳು ಟ್ರಯಲ್.
    tr: Dinakke hattu pada andre ondu varṣadalli mūru sāvirakkinta jāsti. Āmēle nīnu nanaginta chennāgi mātāḍtīya. Hadinālku sāvira, ūṭa, rūm Basavarāj jote. Modala ondu tingaḷu ṭrayal.
    en: Ten words a day is more than three thousand in a year. After that you'll speak better than me. Fourteen thousand, food, and a room with Basavaraj. The first month is a trial.
  - who: dev
    t: ಒಪ್ಪಿಗೆ ಸಾರ್. ಒಂದು ಪ್ರಶ್ನೆ… ಕೆಲಸದಲ್ಲಿ ಫೋನ್ ಇಟ್ಕೋಬಹುದಾ? ರಾತ್ರಿ ಅಮ್ಮಗೆ ಫೋನ್ ಮಾಡ್ತೀನಿ.
    tr: Oppige sār. Ondu praśne… kelasadalli phōn iṭkōbahudā? Rātri ammage phōn māḍtīni.
    en: Agreed, sir. One question… can I keep my phone at work? At night I call my mother.
  - who: mahesh
    t: ಅಡುಗೆಮನೆಯಲ್ಲಿ ಫೋನ್ ಬೇಡ, ಲಾಕರ್‌ನಲ್ಲಿ ಇಡು. ಬ್ರೇಕ್‌ನಲ್ಲಿ, ರಾತ್ರಿ, ಎಷ್ಟು ಬೇಕಾದ್ರೂ ಮಾತಾಡು. ಅಮ್ಮ ಮುಖ್ಯ.
    tr: Aḍugemaneyalli phōn bēḍa, lākar-nalli iḍu. Brēk-nalli, rātri, eṣṭu bēkādrū mātāḍu. Amma mukhya.
    en: No phone in the kitchen; keep it in the locker. In your break and at night, talk as much as you like. Your mother comes first.
  - scene: Afternoon. Latha arrives with a file of certificates and a steel tiffin box. She looks at the billing machine before she looks at anybody.
  - who: cashier
    t: ನಮಸ್ಕಾರ ಸಾರ್, ನಮಸ್ಕಾರ ಮೇಡಂ. ನಾನು ಲತಾ. ಬಿಕಾಂ ಮಾಡಿದೀನಿ. ನಾಲ್ಕು ವರ್ಷ ಬನಶಂಕರಿಯ ಒಂದು ಸೂಪರ್‌ಮಾರ್ಕೆಟ್‌ನಲ್ಲಿ ಕ್ಯಾಶಿಯರ್ ಆಗಿದ್ದೆ. ಈ ಬಿಲ್ಲಿಂಗ್ ಸಾಫ್ಟ್‌ವೇರ್ ನನಗೆ ಗೊತ್ತು, ಅಲ್ಲೂ ಇದೇ ಇತ್ತು.
    tr: Namaskāra sār, namaskāra mēḍam. Nānu Latā. Bikām māḍidīni. Nālku varṣa Banaśaṅkariya ondu sūparmārkeṭ-nalli kyāśiyar āgidde. Ī billiṅg sāphṭvēr nanage gottu, allū idē ittu.
    en: Namaskara, sir; namaskara, madam. I'm Latha. I have a B.Com. For four years I was a cashier at a supermarket in Banashankari. I know this billing software; they had the same one there.
  - who: kavya
    t: ಸೂಪರ್‌ಮಾರ್ಕೆಟ್ ಬಿಟ್ಟು ದರ್ಶಿನಿಗೆ ಯಾಕೆ?
    tr: Sūparmārkeṭ biṭṭu darśinige yāke?
    en: Why leave a supermarket for a darshini?
  - who: cashier
    t: ಮನೆ ಇಲ್ಲೇ ಐದನೇ ಬ್ಲಾಕ್‌ನಲ್ಲಿ. ಬನಶಂಕರಿಗೆ ದಿನಾ ಎರಡು ಬಸ್. ಮಗಳು ಒಂದನೇ ಕ್ಲಾಸ್, ಮೂರು ಗಂಟೆಗೆ ಸ್ಕೂಲ್ ಬಿಡುತ್ತೆ. ಬೆಳಗ್ಗೆ ಏಳರಿಂದ ಮಧ್ಯಾಹ್ನ ಎರಡೂವರೆವರೆಗೆ ಶಿಫ್ಟ್ ಸಿಕ್ಕಿದ್ರೆ ನನಗೆ ತುಂಬಾ ಅನುಕೂಲ.
    tr: Mane illē aidanē blāk-nalli. Banaśaṅkarige dinā eraḍu bas. Magaḷu ondanē klās, mūru gaṇṭege skūl biḍutte. Beḷagge ēḷarinda madhyāhna eraḍūvarevarege śiphṭ sikkidre nanage tumbā anukūla.
    en: My home is right here in 5th Block. To Banashankari it's two buses every day. My daughter is in first standard; school gets out at three. A shift from seven in the morning to half past two would suit me very well.
  - who: mahesh
    t: ಅದೇ ನಮ್ಮ ರಶ್ ಟೈಮ್. ಸಂಜೆ ಗಲ್ಲಾ ನಾನೋ ಅಮ್ಮನೋ ನೋಡ್ಕೋತೀವಿ. ಟೋಕನ್ ಸಿಸ್ಟಮ್ ಗೊತ್ತಾ? ಬಿಲ್ ಹಾಕಿದ ತಕ್ಷಣ ಟೋಕನ್ ಪ್ರಿಂಟ್, ಕಸ್ಟಮರ್ ಟೋಕನ್ ತಗೊಂಡು ಕೌಂಟರ್‌ಗೆ.
    tr: Adē namma raś ṭaim. Sañje gallā nānō ammanō nōḍkōtīvi. Ṭōkan sisṭam gottā? Bil hākida takṣaṇa ṭōkan priṇṭ, kasṭamar ṭōkan tagoṇḍu kauṇṭar-ge.
    en: That's exactly our rush hour. In the evening Amma or I will look after the cash counter. Do you know the token system? The moment you bill, a token prints; the customer takes it to the counter.
  - who: cashier
    t: 'ಗೊತ್ತು ಸಾರ್. ಒಂದು ಸಲಹೆ: ಯುಪಿಐ ಸೌಂಡ್‌ಬಾಕ್ಸ್ ಗಲ್ಲಾದ ಹತ್ತಿರ, ಜೋರಾಗಿ ಇಡಿ. ಕೆಲವರು ಹಳೇ ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ತೋರಿಸಿ ಹೋಗ್ತಾರೆ. ಬಾಕ್ಸ್ ‘ಹಣ ಸ್ವೀಕರಿಸಲಾಗಿದೆ’ ಅಂತ ಹೇಳೋವರೆಗೆ ನಾನು ಟೋಕನ್ ಕೊಡಲ್ಲ.'
    tr: 'Gottu sār. Ondu salahe: yu-pi-ai sauṇḍbāks gallāda hattira, jōrāgi iḍi. Kelavaru haḷē skrīnśāṭ tōrisi hōgtāre. Bāks ‘haṇa svīkarisalāgide’ anta hēḷōvarege nānu ṭōkan koḍalla.'
    en: 'I do, sir. One suggestion: keep the UPI soundbox near the cash counter, and loud. Some people show an old screenshot and walk off. I don''t hand over a token until the box says ‘payment received’.'
  - who: kavya
    t: ಹದಿನಾರು ಸಾವಿರ, ಮಧ್ಯಾಹ್ನದ ಊಟ ಇಲ್ಲೇ. ಪ್ರತಿ ದಿನ ಶಿಫ್ಟ್ ಮುಗಿದಾಗ ಕ್ಯಾಶ್ ಎಣಿಸಿ, ಯುಪಿಐ ರಿಪೋರ್ಟ್ ಜೊತೆ ಹೋಲಿಸಿ, ನನಗೆ ವಾಟ್ಸಾಪ್ ಮಾಡಬೇಕು. ಹತ್ತು ರೂಪಾಯಿ ವ್ಯತ್ಯಾಸ ಬಂದ್ರೂ ಹೇಳಬೇಕು, ಮುಚ್ಚಿಡಬಾರದು.
    tr: Hadināru sāvira, madhyāhnada ūṭa illē. Prati dina śiphṭ mugidāga kyāś eṇisi, yu-pi-ai ripōrṭ jote hōlisi, nanage vāṭsāp māḍabēku. Hattu rūpāyi vyatyāsa bandrū hēḷabēku, muchchiḍabāradu.
    en: Sixteen thousand, with lunch here. Every day at the end of your shift, count the cash, match it against the UPI report and WhatsApp it to me. Even a ten-rupee difference, you tell me; you never hide it.
  - who: cashier
    t: ಮೇಡಂ, ಸೂಪರ್‌ಮಾರ್ಕೆಟ್‌ನಲ್ಲಿ ಒಂದು ರೂಪಾಯಿ ಕಮ್ಮಿ ಆದ್ರೂ ಸಂಬಳದಿಂದ ಕಟ್ ಮಾಡ್ತಿದ್ರು. ನಿಮಗೆ ನೇರವಾಗಿ ಹೇಳೋದು ಅದಕ್ಕಿಂತ ಎಷ್ಟೋ ಸುಲಭ.
    tr: Mēḍam, sūparmārkeṭ-nalli ondu rūpāyi kammi ādrū sambaḷadinda kaṭ māḍtidru. Nimage nēravāgi hēḷōdu adakkinta eṣṭō sulabha.
    en: Madam, at the supermarket they docked my pay if I was even one rupee short. Telling you straight is far easier than that.
  - section: The chutney test
    learn: 'tasting and judging: kāyi hosadu, hitavāgide, uppu ondu chiṭike kammi, dappa · polite criticism: ondu mātu hēḷabahudā? · address for a cook: Bhaṭrē · territory: nanna aḍugemane, nimmadu'
  - scene: Monday, 19 January, 7:30 a.m. Shankara has come straight from the night bus to the house in 9th Block, a cloth bag over his shoulder. Amma has made idli and coconut chutney. Everybody pretends not to watch.
  - who: amma
    t: ಬನ್ನಿ ಭಟ್ರೇ. ಬಸ್ ಪ್ರಯಾಣ ಹೇಗಾಯ್ತು? ಕೈ ತೊಳ್ಕೊಳ್ಳಿ, ಬಿಸಿ ಇಡ್ಲಿ ಇದೆ.
    tr: Banni Bhaṭrē. Bas prayāṇa hēgāytu? Kai toḷkoḷḷi, bisi iḍli ide.
    en: Come in, Bhatre. How was the bus journey? Wash your hands; there are hot idlis.
  - who: cook
    t: ನಮಸ್ಕಾರ ಅಮ್ಮ. ನಿಮ್ಮ ಚಟ್ನಿ ಬಗ್ಗೆ ತಪ್ಪು ಮಾತಾಡಿದ್ರೆ ಯುದ್ಧ ಅಂತ ಮಹೇಶ ಎಚ್ಚರಿಸಿದ್ದಾರೆ. ಅದಕ್ಕೇ ಮೊದಲು ತಿಂತೀನಿ, ಆಮೇಲೆ ಮಾತು.
    tr: Namaskāra amma. Nimma chaṭni bagge tappu mātāḍidre yuddha anta Mahēśa echcharisiddāre. Adakkē modalu tintīni, āmēle mātu.
    en: Namaskara, Amma. Mahesha has warned me that a wrong word about your chutney means war. So I'll eat first and talk afterwards.
  - scene: He eats in silence. Two idlis. Then a third.
  - who: cook
    t: ಕಾಯಿ ತಿಪಟೂರಿನದ್ದು, ಹೊಸದು. ಹುರಿಗಡಲೆ ಹಿತವಾಗಿದೆ. ಶುಂಠಿ… ಇದೆ, ಆದ್ರೆ ಗೊತ್ತಾಗದ ಹಾಗೆ. ಒಗ್ಗರಣೆ ತುಪ್ಪದಲ್ಲಾ?
    tr: Kāyi Tipaṭūrinaddu, hosadu. Hurigaḍale hitavāgide. Śuṇṭhi… ide, ādre gottāgada hāge. Oggaraṇe tuppadallā?
    en: Tiptur coconut, fresh. Just the right amount of roasted gram. Ginger… it's there, but you can't quite tell. Is the tempering done in ghee?
  - who: amma
    t: ಮನೆಯಲ್ಲಿ ತುಪ್ಪ. ಅಂಗಡಿಯಲ್ಲಿ ಎಣ್ಣೆ. ಕಾವ್ಯ ಲೆಕ್ಕ ಹಾಕಿದ್ದಾಳೆ.
    tr: Maneyalli tuppa. Aṅgaḍiyalli eṇṇe. Kāvya lekka hākiddāḷe.
    en: At home, ghee. At the shop, oil. Kavya has done the sums.
  - who: kavya
    t: ತುಪ್ಪದ ಒಗ್ಗರಣೆ ಅಂದ್ರೆ ದಿನಕ್ಕೆ ನೂರೈವತ್ತು ರೂಪಾಯಿ ಜಾಸ್ತಿ. ತಿಂಗಳಿಗೆ ನಾಲ್ಕೂವರೆ ಸಾವಿರ.
    tr: Tuppada oggaraṇe andre dinakke nūraivattu rūpāyi jāsti. Tingaḷige nālkūvare sāvira.
    en: A ghee tempering means a hundred and fifty rupees more a day. Four and a half thousand a month.
  - who: cook
    t: ಒಂದು ಮಾತು ಹೇಳಬಹುದಾ ಅಮ್ಮ? ದೊಡ್ಡ ಹೋಟೆಲ್‌ಗಳಲ್ಲಿ ಲಾಭಕ್ಕೋಸ್ಕರ ಚಟ್ನಿಗೆ ನೀರು ಜಾಸ್ತಿ ಹಾಕ್ತಾರೆ. ನಿಮ್ಮ ಚಟ್ನಿ ದಪ್ಪ. ಅಂಗಡಿಯಲ್ಲೂ ಇದೇ ದಪ್ಪ ಇರಲಿ. ನೀರು ಹಾಕೋ ಕೈ ಕಂಡ್ರೆ ನಾನೇ ತಡೀತೀನಿ.
    tr: Ondu mātu hēḷabahudā amma? Doḍḍa hōṭel-gaḷalli lābhakkōskara chaṭnige nīru jāsti hāktāre. Nimma chaṭni dappa. Aṅgaḍiyallū idē dappa irali. Nīru hākō kai kaṇḍre nānē taḍītīni.
    en: May I say one thing, Amma? Big hotels add extra water to the chutney for profit. Yours is thick. Let it be just as thick in the shop. If I see a hand adding water, I'll stop it myself.
  - who: amma
    t: ಅಂದ್ರೆ… ಏನೂ ಕೊರತೆ ಇಲ್ವಾ?
    tr: Andre… ēnū korate ilvā?
    en: So… nothing wrong with it?
  - who: cook
    t: ಉಪ್ಪು ಒಂದು ಚಿಟಿಕೆ ಕಮ್ಮಿ. ಆದ್ರೆ ಅದು ನನ್ನ ನಾಲಿಗೆ, ಕುಂದಾಪುರದ ನಾಲಿಗೆ. ಬೆಂಗಳೂರಿನ ನಾಲಿಗೆಗೆ ನಿಮ್ಮದೇ ಸರಿ.
    tr: Uppu ondu chiṭike kammi. Ādre adu nanna nālige, Kundāpurada nālige. Beṅgaḷūrina nālige-ge nimmadē sari.
    en: A pinch short on salt. But that's my tongue, a Kundapura tongue. For Bengaluru tongues, yours is exactly right.
  - who: mahesh
    t: ಯುದ್ಧ ಇಲ್ಲ. ಶಾಂತಿ ಒಪ್ಪಂದ.
    tr: Yuddha illa. Śānti oppanda.
    en: No war. A peace treaty.
  - who: amma
    t: ಇನ್ನೊಂದು ಇಡ್ಲಿ ತಗೊಳ್ಳಿ ಭಟ್ರೇ. ಸಾಂಬಾರ್ ನಿಮ್ಮದು, ಚಟ್ನಿ ನನ್ನದು. ಆದ್ರೆ ಉಪ್ಪಿನ ಡಬ್ಬ ಮಾತ್ರ ಇಬ್ಬರಿಗೂ ಸೇರಿದ್ದು.
    tr: Innondu iḍli tagoḷḷi Bhaṭrē. Sāmbār nimmadu, chaṭni nannadu. Ādre uppina ḍabba mātra ibbarigū sēriddu.
    en: Have another idli, Bhatre. The sambar is yours, the chutney is mine. But the salt tin belongs to both of us.
  - section: Rules on the wall
    learn: 'rules with -bēku / -bāradu / kaḍḍāya: kai toḷeyabēku, mobail baḷasabāradu · uniform words: samavastra, ēpran, kyāp, hēr-neṭ · causatives: holisu (have stitched), chekap māḍisu · fire safety: pin eḷi, bēnkiya buḍakke, mēn vālv band'
  - scene: Saturday, 24 January 2026, 9 p.m. Two days to the opening, after the second trial run. The whole team is in the shop. A printed chart in Kannada is taped beside the hand-wash basin. Mr. Murthy has come down in his shawl for the fire-extinguisher demonstration.
  - who: helper
    t: ಸಾಹೇಬ್ರ, ರೂಮ್ ಚೊಲೋ ಐತ್ರಿ. ಆದ್ರ ನಳದಾಗ ನೀರು ಬೆಳಿಗ್ಗೆ ಒಂದು ತಾಸು ಮಾತ್ರ ಬರತೈತಿ.
    tr: Sāhēbra, rūm cholō aitri. Ādra naḷadāga nīru beḷigge ondu tāsu mātra barataiti.
    en: Sir, the room is good. But water comes in the tap for only an hour in the morning.
  - who: mahesh
    t: ನಾಳೆನೇ ಎರಡು ಡ್ರಮ್ ತಂದು ಕೊಡ್ತೀನಿ, ತುಂಬಿಸಿಟ್ಕೊಳ್ಳಿ. ಈಗ ಎಲ್ಲರೂ ಕೇಳಿ. ಇದು ನಮ್ಮ ಗೋಡೆ ಮೇಲಿನ ನಿಯಮ. ಲತಾ, ನೀವು ಓದಿ, ನಿಮ್ಮ ಕನ್ನಡ ಸ್ಪಷ್ಟ.
    tr: Nāḷenē eraḍu ḍram tandu koḍtīni, tumbisiṭkoḷḷi. Īga ellarū kēḷi. Idu namma gōḍe mēlina niyama. Latā, nīvu ōdi, nimma Kannaḍa spaṣṭa.
    en: I'll bring you two drums tomorrow itself; keep them filled. Now everyone listen. These are the rules on our wall. Latha, you read them out; your Kannada is clear.
  - who: cashier
    t: 'ಒಂದು: ಅಡುಗೆಮನೆಗೆ ಬರುವ ಮೊದಲು ಸೋಪಿನಿಂದ ಕೈ ತೊಳೆಯಬೇಕು. ಎರಡು: ಕ್ಯಾಪ್ ಅಥವಾ ಹೇರ್‌ನೆಟ್ ಕಡ್ಡಾಯ. ಮೂರು: ಉಗುರು ಚಿಕ್ಕದಾಗಿರಬೇಕು. ನಾಲ್ಕು: ಅಡುಗೆಮನೆಯಲ್ಲಿ ಮೊಬೈಲ್ ಬಳಸಬಾರದು. ಐದು: ಆರೋಗ್ಯ ಸರಿ ಇಲ್ಲದಿದ್ದರೆ ಮುಚ್ಚಿಡದೆ ಮಾಲೀಕರಿಗೆ ತಿಳಿಸಬೇಕು.'
    tr: 'Ondu: aḍugemanege baruva modalu sōpininda kai toḷeyabēku. Eraḍu: kyāp athavā hērneṭ kaḍḍāya. Mūru: uguru chikkadāgirabēku. Nālku: aḍugemaneyalli mobail baḷasabāradu. Aidu: ārōgya sari illadiddare muchchiḍade mālīkarige tiḷisabēku.'
    en: '(Reading formally) One: wash your hands with soap before entering the kitchen. Two: a cap or hairnet is compulsory. Three: nails must be kept short. Four: mobile phones must not be used in the kitchen. Five: if you are unwell, do not hide it; inform the owner.'
  - who: helper
    t: ಹುಷಾರಿಲ್ಲಂದ್ರ ಪಗಾರ ಕಟ್ ಆಗತೈತೇನ್ರಿ?
    tr: Huṣārillandra pagāra kaṭ āgataitēnri?
    en: If we're sick, does our pay get cut?
  - who: mahesh
    t: ಇಲ್ಲ. ತಿಂಗಳಿಗೆ ಎರಡು ದಿನ ಸಿಕ್ ಲೀವ್, ಸಂಬಳ ಕಟ್ ಇಲ್ಲ. ಜ್ವರ ಇಟ್ಕೊಂಡು ಕೆಲಸಕ್ಕೆ ಬಂದು ಎಲ್ಲರಿಗೂ ಹಂಚೋದಕ್ಕಿಂತ ರೂಮಲ್ಲಿ ಮಲಗೋದು ವಾಸಿ.
    tr: Illa. Tingaḷige eraḍu dina sik līv, sambaḷa kaṭ illa. Jvara iṭkoṇḍu kelasakke bandu ellarigū hañchōdakkinta rūmalli malagōdu vāsi.
    en: No. Two days' sick leave a month, no pay cut. Better to sleep in your room than come to work with a fever and share it with everyone.
  - who: kavya
    t: ಇನ್ನೊಂದು. ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ ನಿಯಮದ ಪ್ರಕಾರ ಆಹಾರ ಮುಟ್ಟೋ ಎಲ್ಲರಿಗೂ ಮೆಡಿಕಲ್ ಸರ್ಟಿಫಿಕೇಟ್ ಬೇಕು. ಓಪನಿಂಗ್ ಆದ್ಮೇಲೆ ಮೊದಲ ಮಂಗಳವಾರ ಎಲ್ಲರನ್ನೂ ಕ್ಲಿನಿಕ್‌ಗೆ ಕರ್ಕೊಂಡು ಹೋಗಿ ಚೆಕಪ್ ಮಾಡಿಸ್ತೀನಿ. ಖರ್ಚು ನಮ್ದು.
    tr: Innondu. Ef-es-es-e-ai niyamada prakāra āhāra muṭṭō ellarigū meḍikal sarṭiphikēṭ bēku. Ōpaniṅg ādmēle modala Maṅgaḷavāra ellarannū klinik-ge karkoṇḍu hōgi chekap māḍistīni. Kharchu namdu.
    en: One more. Under FSSAI rules, everyone who handles food needs a medical certificate. On the first Tuesday after the opening I'll take you all to the clinic and get you checked up. We'll pay.
  - who: cook
    t: ಐವತ್ತು ವರ್ಷದಲ್ಲಿ ನನ್ನನ್ನ ಯಾರೂ ಚೆಕಪ್ ಮಾಡಿಸಿಲ್ಲ. ಸರಿ, ಮಾಡಿಸಿ. ಆದ್ರೆ ಬಿಪಿ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ ಬಂದ್ರೆ ‘ಉಪ್ಪು ಕಮ್ಮಿ ಮಾಡಿ’ ಅಂತ ಡಾಕ್ಟರ್ ಹೇಳಬಾರದು. ಸಾಂಬಾರ್ ಉಪ್ಪು ನನ್ನ ಕೈಯಲ್ಲೇ ಇರ್ಲಿ.
    tr: Aivattu varṣadalli nannanna yārū chekap māḍisilla. Sari, māḍisi. Ādre bi-pi svalpa jāsti bandre ‘uppu kammi māḍi’ anta ḍākṭar hēḷabāradu. Sāmbār uppu nanna kaiyallē irli.
    en: In fifty years nobody has ever had me checked. Fine, do it. But if my BP comes out a bit high, the doctor had better not tell me to cut down on salt. The salt in the sambar stays in my hands.
  - who: amma
    t: 'ಸಮವಸ್ತ್ರ ಬಂತು. ನಮ್ಮ ಬೀದಿ ಟೈಲರ್ ಹತ್ರ ಹೊಲಿಸಿದೀನಿ. ಅಡುಗೆಮನೆಯವರಿಗೆ ಬಿಳಿ ಶರ್ಟ್, ಹಸಿರು ಏಪ್ರನ್. ಲತಾಗೆ ಹಸಿರು ಓವರ್‌ಕೋಟ್. ಎಲ್ಲರಿಗೂ ಎರಡೆರಡು ಜೊತೆ: ಒಂದು ಒಗೆಯೋಕೆ, ಒಂದು ಹಾಕ್ಕೊಳ್ಳೋಕೆ.'
    tr: 'Samavastra bantu. Namma bīdi ṭailar hatra holisidīni. Aḍugemaneyavarige biḷi śarṭ, hasiru ēpran. Latāge hasiru ōvarkōṭ. Ellarigū eraḍeraḍu jote: ondu ogeyōke, ondu hākkoḷḷōke.'
    en: 'The uniforms have come. I had them stitched by the tailor on our street. White shirts and green aprons for the kitchen. A green overcoat for Latha. Two sets each: one in the wash, one to wear.'
  - who: dev
    t: ಅಮ್ಮ, ‘ಏಪ್ರನ್’ ಕನ್ನಡ ಪದನಾ?
    tr: Amma, ‘ēpran’ Kannaḍa padanā?
    en: Amma, is ‘apron’ a Kannada word?
  - who: amma
    t: ಈಗ ಆಗಿದೆ ಮಗು. ಬೆಂಗಳೂರಲ್ಲಿ ಯಾವ ಪದ ಆದ್ರೂ ಸ್ವಲ್ಪ ದಿನ ಇದ್ರೆ ಕನ್ನಡ ಆಗುತ್ತೆ. ನಿನ್ನ ಹಾಗೆ.
    tr: Īga āgide magu. Beṅgaḷūralli yāva pada ādrū svalpa dina idre Kannaḍa āgutte. Ninna hāge.
    en: It is now, child. In Bengaluru any word becomes Kannada if it stays long enough. Like you.
  - who: dev
    t: ಹಾಗಾದ್ರೆ ಸ್ವಲ್ಪ ದಿನದಲ್ಲಿ ನಾನೂ ಕನ್ನಡ ಆಗ್ತೀನಿ.
    tr: Hāgādre svalpa dinadalli nānū Kannaḍa āgtīni.
    en: Then in a little while I'll become Kannada too.
  - who: mahesh
    t: 'ಇನ್ನೆರಡು ಮಾತು. ಕಸ್ಟಮರ್ ಜೊತೆ ಜಗಳ ಬೇಡ. ಯಾರಾದ್ರೂ ಕೂಗಾಡಿದ್ರೆ ನನ್ನನ್ನ ಕರೀರಿ. ಮತ್ತೆ ಎಣ್ಣೆ: ವಡೆ ಕರಿದ ಎಣ್ಣೆಯನ್ನ ಮೂರು ಸಲಕ್ಕಿಂತ ಜಾಸ್ತಿ ಕಾಯಿಸಬಾರದು. ಕಪ್ಪಾದ ಎಣ್ಣೆ ಕಂಡ್ರೆ ನಾನೇ ಚೆಲ್ತೀನಿ, ಎಷ್ಟೇ ದುಬಾರಿ ಆದ್ರೂ.'
    tr: 'Inneraḍu mātu. Kasṭamar jote jagaḷa bēḍa. Yārādrū kūgāḍidre nannanna karīri. Matte eṇṇe: vaḍe karida eṇṇeyanna mūru salakkinta jāsti kāyisabāradu. Kappāda eṇṇe kaṇḍre nānē cheltīni, eṣṭē dubāri ādrū.'
    en: 'Two more things. No arguing with customers. If anyone starts shouting, call me. And oil: oil used for frying vadas must not be heated more than three times. If I see black oil, I''ll pour it away myself, however expensive it is.'
  - scene: Outside, in the lane beside the iron cage of cylinders. Mahesh holds a red extinguisher; Mr. Murthy watches with his arms folded.
  - who: mahesh
    t: ಮೂರ್ತಿ ಸಾರ್ ಮುಂದೆ ಡೆಮೋ. ಪಿನ್ ಎಳೀರಿ. ನಾಜಲ್ ಬೆಂಕಿಯ ಬುಡಕ್ಕೆ. ಹ್ಯಾಂಡಲ್ ಒತ್ತಿ, ಎಡಕ್ಕೆ ಬಲಕ್ಕೆ ಆಡಿಸಿ. ಎಣ್ಣೆ ಬೆಂಕಿಗೆ ಯಾವತ್ತೂ ನೀರು ಹಾಕಬಾರದು. ಗ್ಯಾಸ್ ವಾಸನೆ ಬಂದ್ರೆ ಸ್ವಿಚ್ ಮುಟ್ಟಬೇಡಿ, ಮೊದಲು ಮೇನ್ ವಾಲ್ವ್ ಬಂದ್.
    tr: Mūrti sār munde ḍemō. Pin eḷīri. Nājal beṅkiya buḍakke. Hyāṇḍal otti, eḍakke balakke āḍisi. Eṇṇe beṅkige yāvattū nīru hākabāradu. Gyās vāsane bandre svich muṭṭabēḍi, modalu mēn vālv band.
    en: A demo in front of Murthy sir. Pull the pin. Nozzle at the base of the fire. Squeeze the handle, sweep left and right. Never throw water on an oil fire. If you smell gas, don't touch a switch; first shut the main valve.
  - who: landlord
    t: ದೇವ್, ಈಗ ನೀನು ಮಾಡು. ಅವನು ಹೇಳಿದ್ದನ್ನ ನಿನ್ನ ಮಾತಲ್ಲಿ ಮತ್ತೆ ಹೇಳು.
    tr: Dēv, īga nīnu māḍu. Avanu hēḷiddanna ninna mātalli matte hēḷu.
    en: Dev, now you do it. Say what he said again, in your own words.
  - who: dev
    t: ಪಿನ್ ಎಳಿ. ಬೆಂಕಿ ಕೆಳಗೆ ತೋರಿಸು. ಒತ್ತು. ಎಣ್ಣೆ ಬೆಂಕಿ, ನೀರು ಬೇಡ. ಗ್ಯಾಸ್ ವಾಸನೆ, ಸ್ವಿಚ್ ಬೇಡ, ವಾಲ್ವ್ ಬಂದ್.
    tr: Pin eḷi. Beṅki keḷage tōrisu. Ottu. Eṇṇe beṅki, nīru bēḍa. Gyās vāsane, svich bēḍa, vālv band.
    en: (Doing each step) Pull pin. Point at the bottom of fire. Press. Oil fire, no water. Gas smell, no switch, valve shut.
  - who: landlord
    t: ಶಭಾಷ್. ವ್ಯಾಕರಣ ಸ್ವಲ್ಪ ತಪ್ಪಿರಬಹುದು, ಆದ್ರೆ ಬೆಂಕಿ ಆರುತ್ತೆ. ಅದೇ ಮುಖ್ಯ. ಮಹೇಶ್, ಇನ್ಮೇಲೆ ನನಗೆ ರಾತ್ರಿ ನಿದ್ದೆ ಬರುತ್ತೆ.
    tr: Śabhāṣ. Vyākaraṇa svalpa tappirabahudu, ādre beṅki ārutte. Adē mukhya. Mahēś, inmēle nanage rātri nidde barutte.
    en: Well done. The grammar may be a little off, but the fire goes out. That's what matters. Mahesh, from now on I'll sleep at night.
  - who: cook
    t: ಎಲ್ಲಾ ಆಯ್ತಲ್ವಾ? ನಾಡಿದ್ದು ಓಪನಿಂಗ್. ನಾಳೆ ರಾತ್ರಿ ಮೂವತ್ತು ಕೆಜಿ ಹಿಟ್ಟು ರುಬ್ಬಬೇಕು. ಬಸವರಾಜ, ದೇವ್, ಎಂಟು ಗಂಟೆಗೆ ಗ್ರೈಂಡರ್ ಹತ್ರ. ಹಿಟ್ಟು ಚೆನ್ನಾಗಿ ಹುದುಗು ಬಂದ್ರೆ ಅರ್ಧ ಕೆಲಸ ಮುಗಿದ ಹಾಗೆ.
    tr: Ellā āytalvā? Nāḍiddu ōpaniṅg. Nāḷe rātri mūvattu keji hiṭṭu rubbabēku. Basavarāja, Dēv, eṇṭu gaṇṭege graiṇḍar hatra. Hiṭṭu chennāgi hudugu bandre ardha kelasa mugida hāge.
    en: 'Are we done? The opening is the day after tomorrow. Tomorrow night we grind thirty kilos of batter. Basavaraja, Dev: eight o''clock, at the grinder. If the batter ferments well, half the work is done.'
  - chapter: Chapter 6 — Opening day and the first months
  - section: Republic Day, five in the morning
    learn: 'auspicious beginnings: dīpa hachchu, naivēdya, kumbaḷakāyi oḍe, dṛṣṭi, bōṇi (the first sale of the day) · Gaṇarājyōtsava, dhvaja hārisu · mallige-like idli · girāki (customer, old word)'
  - scene: Monday, 26 January 2026, Republic Day, 5 a.m. The shutter is half up. A small Ganapati picture over the counter, a brass lamp, mango leaves over the door. Nitin is filming on his phone. Mr. Murthy has just hoisted a small flag on his balcony and come down.
  - who: amma
    t: ದೀಪ ಹಚ್ಚಿದೀನಿ. ಮಹೇಶ, ಮೊದಲ ಇಡ್ಲಿ ದೇವರಿಗೆ ನೈವೇದ್ಯ. ಆಮೇಲೆ ಬಾಗಿಲ ಹತ್ರ ಕುಂಬಳಕಾಯಿ ಒಡೆ. ಹೊಸ ಅಂಗಡಿಗೆ ದೃಷ್ಟಿ ಆಗಬಾರದು.
    tr: Dīpa hachchidīni. Mahēśa, modala iḍli dēvarige naivēdya. Āmēle bāgila hatra kumbaḷakāyi oḍe. Hosa aṅgaḍige dṛṣṭi āgabāradu.
    en: I've lit the lamp. Mahesha, the first idli is an offering to God. Then break the ash gourd at the door. A new shop mustn't catch the evil eye.
  - who: mahesh
    t: ಆಯ್ತಮ್ಮ. ಶಂಕರಣ್ಣ, ಇಡ್ಲಿ ಹೇಗಿದೆ?
    tr: Āytamma. Śaṅkaraṇṇa, iḍli hēgide?
    en: All right, Amma. Shankara-anna, how are the idlis?
  - who: cook
    t: ಮಲ್ಲಿಗೆ ಹೂವಿನ ಹಾಗೆ. ರಾತ್ರಿ ಹಿಟ್ಟು ಚೆನ್ನಾಗಿ ಉಬ್ಬಿತು. ದೇವರಿಗೂ ಖುಷಿ, ಗಿರಾಕಿಗೂ ಖುಷಿ.
    tr: Mallige hūvina hāge. Rātri hiṭṭu chennāgi ubbitu. Dēvarigū khuṣi, girākigū khuṣi.
    en: Like jasmine flowers. The batter rose beautifully overnight. God will be happy, and so will the customers.
  - who: nitin
    t: 'ನಾನು ಸ್ಲೀಪಿಂಗ್ ಪಾರ್ಟ್ನರ್, ಆದ್ರೆ ಇವತ್ತು ನಿದ್ದೆನೇ ಇಲ್ಲ. ಮೂರು ಗಂಟೆಗೇ ಎದ್ದೆ. ಇನ್‌ಸ್ಟಾಗ್ರಾಮ್‌ಗೆ ಒಂದು ರೀಲ್ ಮಾಡ್ತೀನಿ: ದೀಪ, ಇಡ್ಲಿ ಹಬೆ, ಶಟರ್ ಮೇಲೆ ಹೋಗೋದು.'
    tr: 'Nānu slīpiṅg pārṭnar, ādre ivattu niddenē illa. Mūru gaṇṭegē edde. Inṣṭāgrām-ge ondu rīl māḍtīni: dīpa, iḍli habe, śaṭar mēle hōgōdu.'
    en: 'I''m the sleeping partner, but there''s no sleep today. I was up at three. I''m making an Instagram reel: the lamp, the steam off the idlis, the shutter going up.'
  - who: landlord
    t: 'ಮಹೇಶ್, ಇವತ್ತು ಗಣರಾಜ್ಯೋತ್ಸವ. ಧ್ವಜ ಹಾರಿಸಿ ಆಯ್ತು. ಈಗ ನನ್ನ ಬೋಣಿ: ಒಂದು ಇಡ್ಲಿ-ವಡೆ, ಒಂದು ಕಾಫಿ. ದುಡ್ಡು ತಗೊಳ್ಳದಿದ್ರೆ ನಾನು ತಿನ್ನಲ್ಲ.'
    tr: 'Mahēś, ivattu Gaṇarājyōtsava. Dhvaja hārisi āytu. Īga nanna bōṇi: ondu iḍli-vaḍe, ondu kāphi. Duḍḍu tagoḷḷadidre nānu tinnalla.'
    en: 'Mahesh, it''s Republic Day. The flag is up. Now for my bōṇi, your first sale: one idli-vada, one coffee. If you don''t take money, I won''t eat.'
  - who: mahesh
    t: ಸಾರ್, ನೀವು ನಮ್ಮ ಮನೆ ಹಿರಿಯರ ಹಾಗೆ…
    tr: Sār, nīvu namma mane hiriyara hāge…
    en: Sir, you're like an elder of our family…
  - who: landlord
    t: ಅದಕ್ಕೇ. ಹಿರಿಯರ ಕೈಯಿಂದ ಬೋಣಿ ಆದ್ರೆ ಅಂಗಡಿಗೆ ಲಕ್ಷ್ಮಿ ಬರ್ತಾಳೆ ಅಂತಾರೆ. ಎಪ್ಪತ್ತು ರೂಪಾಯಿ, ನಗದು. ಈ ನೋಟು ಗಲ್ಲಾದಲ್ಲಿ ಇಡಬೇಡ, ಫ್ರೇಮ್ ಹಾಕಿಸು.
    tr: Adakkē. Hiriyara kaiyinda bōṇi ādre aṅgaḍige Lakṣmi bartāḷe antāre. Eppattu rūpāyi, nagadu. Ī nōṭu gallādalli iḍabēḍa, phrēm hākisu.
    en: That's exactly why. They say if the first sale comes from an elder's hand, Lakshmi comes to the shop. Seventy rupees, in cash. Don't put these notes in the till; have them framed.
  - who: cashier
    t: ಟೋಕನ್ ನಂಬರ್ ಒಂದು! ಶಾರದಾ ದರ್ಶಿನಿಯ ಮೊದಲ ಬಿಲ್.
    tr: Ṭōkan nambar ondu! Śāradā Darśiniya modala bil.
    en: Token number one! Sharada Darshini's first bill.
  - who: kavya
    t: ಕೈ ನಡುಗ್ತಿದೆಯಾ?
    tr: Kai naḍugtideyā?
    en: (Quietly, to Mahesh) Is your hand shaking?
  - who: mahesh
    t: ಇಲ್ಲ. ಇವತ್ತು ಕೈ ಅಲ್ಲ, ಎದೆ ನಡುಗ್ತಿದೆ.
    tr: Illa. Ivattu kai alla, ede naḍugtide.
    en: No. Today it's not my hand; it's my heart.
  - section: Token chaos
    learn: 'counter phrases: ṭōkan tagoḷḷi, svalpa saiḍ-ge banni, aidu nimiṣa āgutte, baiṭu kāphi, pārsel, chaṭni jāsti, skyān māḍlā? · apologising for the system: nimma tappalla, namma tappu · fixing it: eraḍu baṇṇada ṭōkan, kramavāgi'
  - scene: Sunday, 1 February 2026, 8:45 a.m. The first Sunday. The pavement outside is full; people hold up tokens and call out numbers. At the dosa counter, steam, smoke and a pile of paper slips.
  - who: customer
    t: ಎಕ್ಸ್‌ಕ್ಯೂಸ್ ಮಿ! ಹದಿನೈದು ನಿಮಿಷ ಆಯ್ತು. ಟೋಕನ್ ನಲವತ್ತೆರಡು. ನನ್ನ ಆಮೇಲೆ ಬಂದವರಿಗೆ ದೋಸೆ ಸಿಕ್ತು!
    tr: Eks-kyūs mi! Hadinaidu nimiṣa āytu. Ṭōkan nalavatteraḍu. Nanna āmēle bandavarige dōse siktu!
    en: Excuse me! It's been fifteen minutes. Token forty-two. People who came after me have got their dosas!
  - who: dev
    t: ಸಾರ್, ನಲವತ್ತೆರಡು… ಇಡ್ಲಿ ಆಯ್ತು, ದೋಸೆ ಐದು ನಿಮಿಷ ಆಗುತ್ತೆ. ಸ್ವಲ್ಪ ಇರಿ, ಪ್ಲೀಸ್.
    tr: Sār, nalavatteraḍu… iḍli āytu, dōse aidu nimiṣa āgutte. Svalpa iri, plīs.
    en: Sir, forty-two… idli done, dosa takes five minutes. Please wait a little.
  - who: customer
    t: ಐದು ನಿಮಿಷ ಅಂತ ಹತ್ತು ನಿಮಿಷದಿಂದ ಹೇಳ್ತಿದೀರಾ!
    tr: Aidu nimiṣa anta hattu nimiṣadinda hēḷtidīrā!
    en: You've been saying ‘five minutes’ for ten minutes!
  - who: helper
    t: ಸಾಹೇಬ್ರ, ಕಾವಲಿ ಮ್ಯಾಲೆ ಆರು ದೋಸೆ ಐತ್ರಿ, ಚೀಟಿ ಹನ್ನೆರಡು ಬಂದಾವ್ರಿ! ಯಾವದು ಯಾರದು ಅಂತ ಗೊತ್ತಾಗವಲ್ತರಿ!
    tr: Sāhēbra, kāvali myāle āru dōse aitri, chīṭi hanneraḍu bandāvri! Yāvadu yāradu anta gottāgavaltari!
    en: Sir, there are six dosas on the griddle and twelve slips have come in! I can't tell which one is whose!
  - who: mahesh
    t: ಸಾರ್, ಇದು ನಿಮ್ಮ ತಪ್ಪಲ್ಲ, ನಮ್ಮ ತಪ್ಪು. ಕ್ಷಮಿಸಿ. ಮೊದಲ ಭಾನುವಾರ ಇಷ್ಟು ಜನ ಬರ್ತಾರೆ ಅಂತ ನಾವು ಅಂದ್ಕೊಂಡಿರಲಿಲ್ಲ. ನಿಮ್ಮ ದೋಸೆ ಈಗಲೇ, ನನ್ನ ಕೈಯಿಂದ. ಕಾಫಿ ನಮ್ಮ ಕಡೆಯಿಂದ.
    tr: Sār, idu nimma tappalla, namma tappu. Kṣamisi. Modala Bhānuvāra iṣṭu jana bartāre anta nāvu andkoṇḍiralilla. Nimma dōse īgalē, nanna kaiyinda. Kāphi namma kaḍeyinda.
    en: Sir, this isn't your fault, it's ours. I'm sorry. We didn't expect so many people on the first Sunday. Your dosa right now, from my own hands. The coffee is on us.
  - who: customer
    t: ಸರಿ… ಆದ್ರೆ ಮುಂದಿನ ಭಾನುವಾರ ಹೀಗಾದ್ರೆ ಪಕ್ಕದ ಹೋಟೆಲ್‌ಗೆ ಹೋಗ್ತೀನಿ, ಈಗಲೇ ಹೇಳಿದೀನಿ.
    tr: Sari… ādre mundina Bhānuvāra hīgādre pakkada hōṭel-ge hōgtīni, īgalē hēḷidīni.
    en: All right… but if this happens next Sunday, I'm going to the hotel next door. I'm telling you now.
  - scene: A tall, sunburnt foreigner in a kurta squeezes through the crowd with a steel tiffin carrier. It is Sam.
  - who: sam
    t: 'ನಮಸ್ಕಾರ ಮಹೇಶ್ ಅವರೇ! ಎಷ್ಟು ಜನ! ಅಜ್ಜಿ ಹೇಳಿದ್ರು: ‘ನಾಲ್ಕನೇ ಬ್ಲಾಕ್‌ನಲ್ಲಿ ಹೊಸ ದರ್ಶಿನಿ, ಉಡುಪಿಯವರದ್ದು, ಹೋಗಿ ನೋಡ್ಕೊಂಡು ಬಾ.’ ಅವರಿಗೂ ಪಾರ್ಸೆಲ್ ಬೇಕು.'
    tr: 'Namaskāra Mahēś avarē! Eṣṭu jana! Ajji hēḷidru: ‘Nālkanē blāk-nalli hosa darśini, Uḍupiyavaraddu, hōgi nōḍkoṇḍu bā.’ Avarigū pārsel bēku.'
    en: 'Namaskara, Mahesh! So many people! Ajji told me: ‘There''s a new darshini in 4th Block, run by Udupi people; go and have a look.’ She wants a parcel too.'
  - who: mahesh
    t: ಬನ್ನಿ ಸ್ಯಾಮ್, ಸ್ವಾಗತ! ಅಜ್ಜಿಗೆ ನನ್ನ ನಮಸ್ಕಾರ ಹೇಳಿ. ಟೋಕನ್ ಗಲ್ಲಾದಲ್ಲಿ, ಲತಾ ಹತ್ರ.
    tr: Banni Syām, svāgata! Ajjige nanna namaskāra hēḷi. Ṭōkan gallādalli, Latā hatra.
    en: Come in, Sam, welcome! Give Ajji my respects. Tokens at the cash counter, from Latha.
  - who: sam
    t: ಒಂದು ಇಡ್ಲಿ-ವಡೆ, ಒಂದು ಮಸಾಲೆ, ಒಂದು ಕಾಫಿ. ಮತ್ತೆ ಅಜ್ಜಿಗೆ ಎರಡು ಇಡ್ಲಿ ಪಾರ್ಸೆಲ್, ಚಟ್ನಿ ಜಾಸ್ತಿ, ಸಾಂಬಾರ್ ಬೇರೆ ಕವರ್‌ನಲ್ಲಿ. ಎಷ್ಟಾಯ್ತು? ಸ್ಕ್ಯಾನ್ ಮಾಡ್ಲಾ?
    tr: Ondu iḍli-vaḍe, ondu masāle, ondu kāphi. Matte ajjige eraḍu iḍli pārsel, chaṭni jāsti, sāmbār bēre kavar-nalli. Eṣṭāytu? Skyān māḍlā?
    en: One idli-vada, one masala dose, one coffee. And for Ajji, two idlis to take away, extra chutney, sambar in a separate bag. How much is it? Shall I scan?
  - who: cashier
    t: ನೂರ ತೊಂಬತ್ತು ಸಾರ್, ಪಾರ್ಸೆಲ್ ಚಾರ್ಜ್ ಐದು ರೂಪಾಯಿ ಸೇರಿ. ಸ್ಕ್ಯಾನ್ ಮಾಡಿ. …ಬಂತು. ಟೋಕನ್ ಐವತ್ತೊಂಬತ್ತು.
    tr: Nūra tombattu sār, pārsel chārj aidu rūpāyi sēri. Skyān māḍi. …Bantu. Ṭōkan aivattombattu.
    en: A hundred and ninety, sir, including a five-rupee parcel charge. Go ahead and scan. …(The soundbox speaks) It's in. Token fifty-nine.
  - who: dev
    t: ಐವತ್ತೊಂಬತ್ತು! ಇಡ್ಲಿ-ವಡೆ, ಮಸಾಲೆ… ಸಾರ್, ನೀವು ಕನ್ನಡ… ಎಲ್ಲಿಂದ?
    tr: Aivattombattu! Iḍli-vaḍe, masāle… Sār, nīvu Kannaḍa… ellinda?
    en: Fifty-nine! Idli-vada, masala… Sir, you speak Kannada… where are you from?
  - who: sam
    t: ಸ್ವಿಟ್ಜರ್ಲ್ಯಾಂಡ್. ನಾನೂ ನಿನ್ನ ಹಾಗೆ ಮೊದಲು ‘ನಾನು ಕಾಫಿ ಬೇಕು’ ಅಂತಿದ್ದೆ. ಒಬ್ಬರು ಅಜ್ಜಿ ದಿನಾ ತಿದ್ದಿದ್ರು. ಈಗ ‘ನನಗೆ’.
    tr: Sviṭjarlyāṇḍ. Nānū ninna hāge modalu ‘nānu kāphi bēku’ antidde. Obbaru ajji dinā tiddidru. Īga ‘nanage’.
    en: Switzerland. I used to say ‘nānu kāphi bēku’ too, just like you. An old lady corrected me every day. Now it's ‘nanage’.
  - who: dev
    t: ನನಗೂ ಅಮ್ಮ ತಿದ್ದಿದ್ರು! ಅದೇ ಪದ! ಸಾರ್, ಎಷ್ಟು ವರ್ಷ ಆಯ್ತು ಕಲಿಯೋಕೆ?
    tr: Nanagū amma tiddidru! Adē pada! Sār, eṣṭu varṣa āytu kaliyōke?
    en: Amma corrected me too! The same word! Sir, how many years did it take you to learn?
  - who: sam
    t: 'ಎರಡು ವರ್ಷ. ಇನ್ನೂ ಕಲೀತಿದೀನಿ. ಒಂದು ಗುಟ್ಟು ಹೇಳ್ತೀನಿ: ತಪ್ಪು ಮಾತಾಡೋಕೆ ನಾಚಿಕೆ ಪಡಬೇಡ. ಜನ ನಗ್ತಾರೆ, ಆಮೇಲೆ ಸಹಾಯ ಮಾಡ್ತಾರೆ.'
    tr: 'Eraḍu varṣa. Innū kalītidīni. Ondu guṭṭu hēḷtīni: tappu mātāḍōke nāchike paḍabēḍa. Jana nagtāre, āmēle sahāya māḍtāre.'
    en: 'Two years. I''m still learning. I''ll tell you a secret: don''t be shy of speaking wrongly. People laugh, and then they help.'
  - scene: 10:45 a.m. The rush is over. Floors are wet, the griddle hisses quietly. Mahesh gathers the staff by the counter.
  - who: cashier
    t: ಸಾರ್, ಸಮಸ್ಯೆ ಟೋಕನ್‌ನಲ್ಲಿ ಅಲ್ಲ. ಒಂದೇ ಟೋಕನ್‌ನಲ್ಲಿ ಇಡ್ಲಿನೂ ಇರುತ್ತೆ, ದೋಸೆನೂ ಇರುತ್ತೆ. ಇಡ್ಲಿ ಬೇಗ ಹೋಗುತ್ತೆ, ದೋಸೆ ತಡ. ಒಬ್ಬನೇ ಮನುಷ್ಯ ಎರಡು ಕೌಂಟರ್ ಮುಂದೆ ನಿಲ್ತಾನೆ, ಗೊಂದಲ ಅಲ್ಲೇ ಶುರು.
    tr: Sār, samasye ṭōkan-nalli alla. Ondē ṭōkan-nalli iḍlinū irutte, dōsenū irutte. Iḍli bēga hōgutte, dōse taḍa. Obbanē manuṣya eraḍu kauṇṭar munde niltāne, gondala allē śuru.
    en: Sir, the problem isn't the token as such. One token has both idli and dosa on it. The idli goes out fast, the dosa is slow. The same person stands at two counters, and that's where the confusion starts.
  - who: mahesh
    t: 'ಸರಿ. ನಾಳೆಯಿಂದ ಎರಡು ಬಣ್ಣದ ಟೋಕನ್: ಬಿಳಿ ಇಡ್ಲಿ, ವಡೆ, ಬಾತ್‌ಗೆ; ಹಳದಿ ದೋಸೆಗೆ. ದೋಸೆ ಕೌಂಟರ್‌ನಲ್ಲಿ ದೇವ್ ನಂಬರ್ ಜೋರಾಗಿ ಕರೀತಾನೆ, ಕನ್ನಡದಲ್ಲಿ. ಬಸವರಾಜ್, ಚೀಟಿ ಬಂದ ಕ್ರಮದಲ್ಲೇ ಕಾವಲಿ ಮೇಲೆ ಹಾಕಿ, ಪ್ರತಿ ದೋಸೆ ಪಕ್ಕ ಅದರ ಚೀಟಿ.'
    tr: 'Sari. Nāḷeyinda eraḍu baṇṇada ṭōkan: biḷi iḍli, vaḍe, bāt-ge; haḷadi dōsege. Dōse kauṇṭar-nalli Dēv nambar jōrāgi karītāne, Kannaḍadalli. Basavarāj, chīṭi banda kramadallē kāvali mēle hāki, prati dōse pakka adara chīṭi.'
    en: 'Right. From tomorrow, tokens in two colours: white for idli, vada and bath; yellow for dosa. At the dosa counter Dev will call the numbers out loud, in Kannada. Basavaraj, put the dosas on the griddle in the order the slips come, each slip beside its dosa.'
  - who: dev
    t: ಸಾರ್, ಎಪ್ಪತ್ತರ ಮೇಲೆ ಕನ್ನಡ ನಂಬರ್ ಕಷ್ಟ. ಎಪ್ಪತ್ತೇಳು, ಎಂಬತ್ತೇಳು… ಎರಡೂ ಒಂದೇ ಹಾಗೆ ಕೇಳುತ್ತೆ.
    tr: Sār, eppattara mēle Kannaḍa nambar kaṣṭa. Eppattēḷu, embattēḷu… eraḍū ondē hāge kēḷutte.
    en: Sir, Kannada numbers above seventy are hard. Eppattēḷu, embattēḷu… they both sound the same.
  - who: amma
    t: ಅದಕ್ಕೇ ಇವತ್ತು ರಾತ್ರಿ ನೂರರವರೆಗೆ ನನ್ನ ಹತ್ರ ಪಾಠ. ತಪ್ಪಿದ್ರೆ ಮತ್ತೆ ಮೊದಲಿಂದ.
    tr: Adakkē ivattu rātri nūraravarege nanna hatra pāṭha. Tappidre matte modalinda.
    en: That's why tonight you have a lesson with me, up to a hundred. Make a mistake and we start again from one.
  - section: Cold sambar
    learn: 'complaints: sāmbār taṇṇagide, muñche hīgirlilla · apologising: kṣamisi, nīvu hēḷiddu sari, ī plēṭ-ge duḍḍu bēḍa, inmēle hīgāgalla · finding the cause, not the culprit: tappu vyavastheyaddu · causative: sṭīm ṭēbal māḍisu'
  - scene: Thursday, 5 February, 7:30 a.m. The morning walkers from the park. An elderly woman in walking shoes holds up a plate of idli at the counter.
  - who: customer
    t: ಯಾರಪ್ಪ ಇಲ್ಲಿ ಮಾಲೀಕರು? ಈ ಸಾಂಬಾರ್ ತಣ್ಣಗಿದೆ. ಇಡ್ಲಿ ಬಿಸಿ, ಸಾಂಬಾರ್ ತಣ್ಣಗೆ. ನಲವತ್ತು ರೂಪಾಯಿ ಕೊಟ್ಟು ಇದನ್ನ ತಿನ್ನಬೇಕಾ?
    tr: Yārappa illi mālīkaru? Ī sāmbār taṇṇagide. Iḍli bisi, sāmbār taṇṇage. Nalavattu rūpāyi koṭṭu idanna tinnabēkā?
    en: Who's the owner here? This sambar is cold. Hot idli, cold sambar. Am I supposed to pay forty rupees and eat this?
  - who: mahesh
    t: ಕ್ಷಮಿಸಿ ಅಮ್ಮ. ನೀವು ಹೇಳಿದ್ದು ಸರಿ. ಒಂದು ನಿಮಿಷ, ಹೊಸ ಇಡ್ಲಿ, ಕುದಿಯೋ ಸಾಂಬಾರ್ ತರ್ತೀನಿ. ಈ ಪ್ಲೇಟ್‌ಗೆ ದುಡ್ಡು ಬೇಡ.
    tr: Kṣamisi amma. Nīvu hēḷiddu sari. Ondu nimiṣa, hosa iḍli, kudiyō sāmbār tartīni. Ī plēṭ-ge duḍḍu bēḍa.
    en: I'm sorry, Amma. You're right. One minute; I'll bring fresh idli and boiling sambar. No charge for this plate.
  - who: customer
    t: ದುಡ್ಡಿನ ವಿಷಯ ಅಲ್ಲಪ್ಪ. ಮೂವತ್ತು ವರ್ಷದಿಂದ ಈ ರಸ್ತೆಯಲ್ಲಿ ವಾಕಿಂಗ್ ಮಾಡ್ತೀನಿ. ಮೂರು ಹೋಟೆಲ್ ಬಂದ್ವು, ಹೋದ್ವು. ಮೊದಲ ತಿಂಗಳಲ್ಲೇ ಸಾಂಬಾರ್ ತಣ್ಣಗಾದ್ರೆ, ಆರನೇ ತಿಂಗಳಲ್ಲಿ ಏನು ಗತಿ?
    tr: Duḍḍina viṣaya allappa. Mūvattu varṣadinda ī rasteyalli vākiṅg māḍtīni. Mūru hōṭel bandvu, hōdvu. Modala tingaḷallē sāmbār taṇṇagādre, āranē tingaḷalli ēnu gati?
    en: It's not about the money, dear. I've walked on this road for thirty years. Three hotels came and went. If the sambar is cold in the very first month, what will it be like in the sixth?
  - who: mahesh
    t: ಅದಕ್ಕೇ ನೀವು ಹೇಳಿದ್ದು ನನಗೆ ಉಪಕಾರ. ಸುಮ್ಮನೆ ಹೋಗಿದ್ರೆ ನನಗೆ ಗೊತ್ತೇ ಆಗ್ತಿರಲಿಲ್ಲ. ನಾಳೆ ಬನ್ನಿ. ಸಾಂಬಾರ್ ಬಿಸಿ ಇರದಿದ್ರೆ ನನ್ನನ್ನೇ ಕರೀರಿ.
    tr: Adakkē nīvu hēḷiddu nanage upakāra. Summane hōgidre nanage gottē āgtiralilla. Nāḷe banni. Sāmbār bisi iradidre nannannē karīri.
    en: That's why your telling me is a favour. If you'd just walked away, I'd never have known. Come tomorrow. If the sambar isn't hot, call me personally.
  - who: customer
    t: ನೋಡೋಣ. ನಿನ್ನ ಕಾಫಿ ಚೆನ್ನಾಗಿದೆ, ಅದಕ್ಕೇ ನಾಳೆ ಬರ್ತೀನಿ.
    tr: Nōḍōṇa. Ninna kāphi chennāgide, adakkē nāḷe bartīni.
    en: We'll see. Your coffee is good; that's why I'll come tomorrow.
  - scene: Inside the kitchen, out of the customers' sight, as promised in Kundapura.
  - who: mahesh
    t: ಶಂಕರಣ್ಣ, ಒಂದು ನಿಮಿಷ. ಕೌಂಟರ್‌ನ ಸಾಂಬಾರ್ ಬಕೆಟ್ ತಣ್ಣಗಾಗಿತ್ತು. ಒಬ್ಬರು ಹಿರಿಯರು ಕಂಪ್ಲೇಂಟ್ ಮಾಡಿದ್ರು.
    tr: Śaṅkaraṇṇa, ondu nimiṣa. Kauṇṭar-na sāmbār bakeṭ taṇṇagāgittu. Obbaru hiriyaru kamplēṇṭ māḍidru.
    en: Shankara-anna, a minute. The sambar bucket at the counter had gone cold. An elderly lady complained.
  - who: cook
    t: ನನ್ನ ಸಾಂಬಾರ್ ತಣ್ಣಗೆ? ಒಲೆ ಮೇಲೆ ಕುದೀತಾ ಇದೆ, ನೋಡಿ! …ಆದ್ರೆ ಕೌಂಟರ್‌ಗೆ ಹೋದ ಬಕೆಟ್ ಅರ್ಧ ಗಂಟೆ ಅಲ್ಲೇ ಕೂತಿರುತ್ತೆ. ಮೇಲೆ ಫ್ಯಾನ್ ಗಾಳಿ. ಹೌದು ಮಾರಾಯ್ರೆ, ಅಲ್ಲಿ ತಣ್ಣಗಾಗುತ್ತೆ.
    tr: Nanna sāmbār taṇṇage? Ole mēle kudītā ide, nōḍi! …Ādre kauṇṭar-ge hōda bakeṭ ardha gaṇṭe allē kūtirutte. Mēle phyān gāḷi. Haudu mārāyre, alli taṇṇagāgutte.
    en: My sambar, cold? It's boiling on the stove, look! …(A pause) But the bucket that goes to the counter sits there for half an hour. With the fan blowing on it. Yes, my friend, it goes cold out there.
  - who: mahesh
    t: 'ತಪ್ಪು ಯಾರದ್ದೂ ಅಲ್ಲ, ವ್ಯವಸ್ಥೆಯದ್ದು. ಎರಡು ಉಪಾಯ: ಕೌಂಟರ್‌ನಲ್ಲಿ ಚಿಕ್ಕ ಬಕೆಟ್, ಹದಿನೈದು ನಿಮಿಷಕ್ಕೊಮ್ಮೆ ಬದಲಾಯಿಸೋದು. ಮತ್ತೆ ಬಿಸಿ ಇಡೋ ಒಂದು ಸ್ಟೀಮ್ ಟೇಬಲ್ ಮಾಡಿಸೋಣ. ಸ್ಟೀಲ್ ಅಂಗಡಿಯವನು ಹನ್ನೆರಡು ಸಾವಿರ ಅಂದ.'
    tr: 'Tappu yāraddū alla, vyavastheyaddu. Eraḍu upāya: kauṇṭar-nalli chikka bakeṭ, hadinaidu nimiṣakkomme badalāyisōdu. Matte bisi iḍō ondu sṭīm ṭēbal māḍisōṇa. Sṭīl aṅgaḍiyavanu hanneraḍu sāvira anda.'
    en: 'It''s nobody''s fault; it''s the system''s. Two fixes: a smaller bucket at the counter, swapped every fifteen minutes. And we''ll have a steam table made to keep things hot. The steel-shop man said twelve thousand.'
  - who: cook
    t: ಸ್ಟೀಮ್ ಟೇಬಲ್ ಬರೋವರೆಗೆ ದೇವ್ ಹದಿನೈದು ನಿಮಿಷಕ್ಕೊಮ್ಮೆ ಓಡಬೇಕು. ಅವನ ಕೈಗೆ ಒಂದು ಟೈಮರ್ ಕೊಡಿ. ಮತ್ತೆ… ನಾಳೆ ಆ ಅಮ್ಮನಿಗೆ ನಾನೇ ಸಾಂಬಾರ್ ಬಡಿಸ್ತೀನಿ.
    tr: Sṭīm ṭēbal barōvarege Dēv hadinaidu nimiṣakkomme ōḍabēku. Avana kaige ondu ṭaimar koḍi. Matte… nāḷe ā ammanige nānē sāmbār baḍistīni.
    en: Until the steam table comes, Dev runs every fifteen minutes. Give him a timer. And… tomorrow I'll serve that lady her sambar myself.
  - who: kavya
    t: ಹನ್ನೆರಡು ಸಾವಿರ? ಒಂದು ಕಂಪ್ಲೇಂಟ್‌ಗೆ?
    tr: Hanneraḍu sāvira? Ondu kamplēṇṭ-ge?
    en: (On the phone, that afternoon) Twelve thousand? For one complaint?
  - who: mahesh
    t: ಒಂದು ಕಂಪ್ಲೇಂಟ್ ಹಿಂದೆ ಸುಮ್ಮನೆ ಹೋದ ಹತ್ತು ಜನ ಇರ್ತಾರೆ. ಅವರು ಏನೂ ಹೇಳಲ್ಲ. ಮತ್ತೆ ಬರಲ್ಲ, ಅಷ್ಟೇ.
    tr: Ondu kamplēṇṭ hinde summane hōda hattu jana irtāre. Avaru ēnū hēḷalla. Matte baralla, aṣṭē.
    en: Behind every complaint there are ten people who left without a word. They don't say anything. They just never come back.
  - who: kavya
    t: ಸರಿ. ಆದ್ರೆ ಮೂರು ಕೊಟೇಶನ್ ತಗೊ. ನಿನ್ನ ಸ್ಟೀಲ್ ಅಂಗಡಿಯವನ ಮುಖ ನೋಡಿ ಅಲ್ಲ.
    tr: Sari. Ādre mūru koṭēśan tago. Ninna sṭīl aṅgaḍiyavana mukha nōḍi alla.
    en: Fine. But get three quotations. Not just your steel-shop man's smiling face.
  - section: Cash, UPI and a licence
    learn: 'payments: skyān, sauṇḍbāks, chillare, sarvar ḍaun, … parsenṭ yu-pi-ai · trust: nambike, phōn nambar barkoṇḍu biṭṭe · reported speech from officials: … ante, … anta hēḷidru · renewal deadline: … oḷage, daṇḍa illa'
  - scene: Monday, 9 February 2026, 2:30 p.m. End of Latha's shift. She hands Kavya a printout and a rubber-banded bundle of notes.
  - who: cashier
    t: 'ಮೇಡಂ, ನನ್ನ ಶಿಫ್ಟ್ ರಿಪೋರ್ಟ್: ಒಟ್ಟು ಇಪ್ಪತ್ತೊಂದು ಸಾವಿರದ ನಾನೂರು. ಯುಪಿಐ ಹದಿನಾರು ಸಾವಿರದ ಎಂಟುನೂರು, ಕ್ಯಾಶ್ ನಾಲ್ಕು ಸಾವಿರದ ಆರುನೂರು. ಅಂದ್ರೆ ಸುಮಾರು ಎಪ್ಪತ್ತೆಂಟು ಪರ್ಸೆಂಟ್ ಯುಪಿಐ. ಕ್ಯಾಶ್ ಸರಿಯಾಗಿದೆ, ಒಂದು ರೂಪಾಯಿನೂ ವ್ಯತ್ಯಾಸ ಇಲ್ಲ.'
    tr: 'Mēḍam, nanna śiphṭ ripōrṭ: oṭṭu ippattondu sāvirada nānūru. Yu-pi-ai hadināru sāvirada eṇṭunūru, kyāś nālku sāvirada ārunūru. Andre sumāru eppatteṇṭu parsenṭ yu-pi-ai. Kyāś sariyāgide, ondu rūpāyinū vyatyāsa illa.'
    en: 'Madam, my shift report: twenty-one thousand four hundred in all. UPI sixteen thousand eight hundred, cash four thousand six hundred. So about seventy-eight percent UPI. The cash tallies; not a rupee''s difference.'
  - who: kavya
    t: ಒಳ್ಳೇದು. ಚಿಲ್ಲರೆ ಸಮಸ್ಯೆ ಹೇಗಿದೆ?
    tr: Oḷḷēdu. Chillare samasye hēgide?
    en: Good. How's the change problem?
  - who: cashier
    t: 'ಬೆಳಗ್ಗೆ ವಾಕಿಂಗ್ ಜನ ಇಪ್ಪತ್ತು ರೂಪಾಯಿ ಕಾಫಿಗೆ ಐನೂರರ ನೋಟು ತರ್ತಾರೆ. ಬ್ಯಾಂಕಿಂದ ದಿನಾ ಎರಡು ಸಾವಿರ ಚಿಲ್ಲರೆ ತರಿಸಬೇಕು. ಇನ್ನೊಂದು: ನಿನ್ನೆ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ಯುಪಿಐ ಸರ್ವರ್ ಡೌನ್ ಆಯ್ತು, ಇಪ್ಪತ್ತು ನಿಮಿಷ. ಕೆಲವರ ಹತ್ರ ಒಂದು ರೂಪಾಯಿನೂ ಕ್ಯಾಶ್ ಇರಲಿಲ್ಲ.'
    tr: 'Beḷagge vākiṅg jana ippattu rūpāyi kāphige ainūrara nōṭu tartāre. Byāṅkinda dinā eraḍu sāvira chillare tarisabēku. Innondu: ninne hannondu gaṇṭege yu-pi-ai sarvar ḍaun āytu, ippattu nimiṣa. Kelavara hatra ondu rūpāyinū kyāś iralilla.'
    en: 'The morning walkers bring five-hundred-rupee notes for a twenty-rupee coffee. We need two thousand in change from the bank every day. Another thing: yesterday at eleven the UPI server went down for twenty minutes. Some people didn''t have a single rupee in cash.'
  - who: mahesh
    t: ಆಗ ಏನು ಮಾಡಿದ್ರಿ?
    tr: Āga ēnu māḍidri?
    en: What did you do?
  - who: cashier
    t: ಅವರ ಫೋನ್ ನಂಬರ್ ಬರ್ಕೊಂಡು ತಿನ್ನೋಕೆ ಬಿಟ್ಟೆ. ಆರು ಜನರಲ್ಲಿ ಐದು ಜನ ಸಂಜೆಯೊಳಗೆ ಕಳಿಸಿದ್ರು. ಒಬ್ಬರು… ಇನ್ನೂ ಇಲ್ಲ. ಎಪ್ಪತ್ತೈದು ರೂಪಾಯಿ.
    tr: Avara phōn nambar barkoṇḍu tinnōke biṭṭe. Āru janaralli aidu jana sañjeyoḷage kaḷisidru. Obbaru… innū illa. Eppattaidu rūpāyi.
    en: I wrote down their phone numbers and let them eat. Five out of six sent the money by evening. One… not yet. Seventy-five rupees.
  - who: mahesh
    t: ಐದು ಜನರ ನಂಬಿಕೆ ಎಪ್ಪತ್ತೈದು ರೂಪಾಯಿಗಿಂತ ದೊಡ್ಡದು. ಚೆನ್ನಾಗಿ ಮಾಡಿದ್ರಿ, ಶಭಾಷ್.
    tr: Aidu janara nambike eppattaidu rūpāyiginta doḍḍadu. Chennāgi māḍidri, śabhāṣ.
    en: The trust of five people is worth more than seventy-five rupees. You did well. Shabash.
  - scene: 'A familiar figure at the counter: Mr. Gowda, the health inspector, in a sweater, his phone already out.'
  - who: officer
    t: ಮಹೇಶ್ ಅವರೇ, ನಮಸ್ಕಾರ. ನೆನಪಿದೆಯಾ? ಓಪನಿಂಗ್ ಆದ್ಮೇಲೆ ಕಾಫಿಗೆ ಬರ್ತೀನಿ, ನಾನೇ ದುಡ್ಡು ಕೊಡ್ತೀನಿ ಅಂದಿದ್ದೆ. ಮೇಡಂ, ಒಂದು ಕಾಫಿ. ಸ್ಕ್ಯಾನ್ ಮಾಡ್ತೀನಿ.
    tr: Mahēś avarē, namaskāra. Nenapideyā? Ōpaniṅg ādmēle kāphige bartīni, nānē duḍḍu koḍtīni andidde. Mēḍam, ondu kāphi. Skyān māḍtīni.
    en: Namaskara, Mahesh. Remember? I said I'd come for coffee after the opening and pay for it myself. Madam, one coffee. I'll scan.
  - who: officer
    t: 'ಜೊತೆಗೆ ಒಂದು ಸುದ್ದಿ: ನಿಮ್ಮ ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ನಿನ್ನೆ ಸಂಜೆ ಅಪ್ರೂವ್ ಆಯ್ತು. ಸರ್ಟಿಫಿಕೇಟ್ ಪೋರ್ಟಲ್‌ನಲ್ಲೇ ಡೌನ್‌ಲೋಡ್ ಮಾಡ್ಕೊಳ್ಳಿ. ಪ್ರಿಂಟ್ ತೆಗೆದು ಎಲ್ಲರಿಗೂ ಕಾಣೋ ಹಾಗೆ ಗೋಡೆ ಮೇಲೆ ಹಾಕಬೇಕು.'
    tr: 'Jotege ondu suddi: nimma ṭrēḍ laisens ninne sañje aprūv āytu. Sarṭiphikēṭ pōrṭal-nallē ḍaunlōḍ māḍkoḷḷi. Priṇṭ tegedu ellarigū kāṇō hāge gōḍe mēle hākabēku.'
    en: 'And some news: your trade licence was approved yesterday evening. Download the certificate from the portal itself. Print it and put it up on the wall where everyone can see it.'
  - who: mahesh
    t: 'ಧನ್ಯವಾದ ಸಾರ್. ಒಂದು ಪ್ರಶ್ನೆ: ಇದು ಮಾರ್ಚ್ ಮೂವತ್ತೊಂದರವರೆಗೆ ಮಾತ್ರ ಅಲ್ವಾ?'
    tr: 'Dhanyavāda sār. Ondu praśne: idu Mārch mūvattondaravarege mātra alvā?'
    en: 'Thank you, sir. One question: it''s only valid until the thirty-first of March, isn''t it?'
  - who: officer
    t: ಹೌದು. ಫೆಬ್ರವರಿ ಇಪ್ಪತ್ತೆಂಟರ ನಿಯಮ ನಿಮ್ಮ ಮೇಡಂಗೆ ಗೊತ್ತೇ ಇದೆ. ಅಂದ್ರೆ ಲೈಸೆನ್ಸ್ ಬಂದ ಮೂರು ವಾರದಲ್ಲೇ ರಿನ್ಯೂ ಮಾಡಬೇಕು. ಸಿಸ್ಟಮ್ ಹಾಗಿದೆ, ನಾನೇನು ಮಾಡ್ಲಿ.
    tr: Haudu. Phebravari ippatteṇṭara niyama nimma mēḍam-ge gottē ide. Andre laisens banda mūru vāradallē rinyū māḍabēku. Sisṭam hāgide, nānēnu māḍli.
    en: Yes. Your madam already knows the twenty-eighth-of-February rule. So you have to renew within three weeks of getting it. That's the system; what can I do?
  - who: officer
    t: ಕಾಫಿ ಚೆನ್ನಾಗಿದೆ. ಡಿಕಾಕ್ಷನ್ ಗಟ್ಟಿ. ಇಪ್ಪತ್ತು ರೂಪಾಯಿಗೆ ಮೋಸ ಇಲ್ಲ. ನಿಮ್ಮ ತಾಯಿಗೆ ಕೊಟ್ಟ ಮಾತು ನೆನಪಿದೆ. ಹೀಗೇ ನಡೀಲಿ.
    tr: Kāphi chennāgide. Ḍikākṣan gaṭṭi. Ippattu rūpāyige mōsa illa. Nimma tāyige koṭṭa mātu nenapide. Hīgē naḍīli.
    en: (After a sip) Good coffee. Strong decoction. No cheating for twenty rupees. I remember the promise you made your mother. May it go on like this.
  - who: kavya
    t: ರಶ್ಮಿ ಮೇಡಂಗೆ ಲೈಸೆನ್ಸ್ ಕಾಪಿ ಕಳಿಸಿದೆ. ಗುರುವಾರ ಬ್ಯಾಂಕ್‌ನವರು ಸೈಟ್ ವಿಸಿಟ್‌ಗೆ ಬರ್ತಾರಂತೆ, ಆಮೇಲೆ ಉಳಿದ ನಾಲ್ಕು ಲಕ್ಷ ನೇರವಾಗಿ ಸಪ್ಲೈಯರ್ ಮತ್ತೆ ಕಾಂಟ್ರಾಕ್ಟರ್‌ಗೆ. ರಿನ್ಯೂವಲ್ ಅರ್ಜಿ ನಾಳೆನೇ ಹಾಕ್ತೀನಿ. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಇಪ್ಪತ್ತೈದು ಪರ್ಸೆಂಟ್ ದಂಡ ಕಟ್ಟೋಕೆ ನಾನು ರೆಡಿ ಇಲ್ಲ.
    tr: Raśmi mēḍam-ge laisens kāpi kaḷiside. Guruvāra byāṅk-navaru saiṭ visiṭ-ge bartārante, āmēle uḷida nālku lakṣa nēravāgi saplaiyar matte kāṇṭrākṭar-ge. Rinyūval arji nāḷenē hāktīni. Mārch-nalli ippattaidu parsenṭ daṇḍa kaṭṭōke nānu reḍi illa.
    en: (That evening, on the phone) I've sent Ms. Rashmi a copy of the licence. She says the bank people will come for the site visit on Thursday, and then the remaining four lakh goes straight to the supplier and the contractor. I'll file the renewal tomorrow itself. I'm not ready to pay a twenty-five percent fine in March.
  - section: Regulars
    learn: 'a regular''s order: yāvāginaddē?, sakkare kammi, sṭrāṅg · suggestions politely: ondu salahe, bējār māḍkōbēḍi · teaching a skill: kāvali hada, nīru chimukisu, savaru, teḷḷage, aṅchige eṇṇe, maḍachu · encouragement: kai paḷagutte'
  - scene: Saturday, 21 February, 6:40 a.m. The shutter has been up for ten minutes. Sam arrives in running clothes, as he now does every morning.
  - who: cashier
    t: ಬನ್ನಿ ಸ್ಯಾಮ್ ಸಾರ್. ಯಾವಾಗಿನದ್ದೇನಾ? ಒಂದು ಇಡ್ಲಿ-ವಡೆ, ಒಂದು ಕಾಫಿ ಸಕ್ಕರೆ ಕಮ್ಮಿ, ಅಜ್ಜಿಗೆ ಎರಡು ಇಡ್ಲಿ ಪಾರ್ಸೆಲ್.
    tr: Banni Syām sār. Yāvāginaddēnā? Ondu iḍli-vaḍe, ondu kāphi sakkare kammi, ajjige eraḍu iḍli pārsel.
    en: Come in, Sam sir. The usual? One idli-vada, one coffee with less sugar, two idlis to take away for Ajji.
  - who: sam
    t: 'ನೀವು ನನ್ನ ಆರ್ಡರ್ ನನಗಿಂತ ಚೆನ್ನಾಗಿ ನೆನಪಿಟ್ಕೊಂಡಿದೀರಾ. ಇವತ್ತು ಒಂದು ಬದಲಾವಣೆ: ಕಾಫಿ ಸ್ಟ್ರಾಂಗ್. ರಾತ್ರಿ ಮನೆಯವರ ಜೊತೆ ವಿಡಿಯೋ ಕಾಲ್, ನಿದ್ದೆ ಆಗಿಲ್ಲ.'
    tr: 'Nīvu nanna ārḍar nanaginta chennāgi nenapiṭkoṇḍidīrā. Ivattu ondu badalāvaṇe: kāphi sṭrāṅg. Rātri maneyavara jote viḍiyō kāl, nidde āgilla.'
    en: 'You remember my order better than I do. One change today: strong coffee. A video call with my family last night; I didn''t sleep.'
  - who: cashier
    t: ಸ್ಟ್ರಾಂಗ್, ಸಕ್ಕರೆ ಕಮ್ಮಿ. ನೂರ ಹದಿನೈದು ರೂಪಾಯಿ. ಟೋಕನ್ ಹದಿನಾಲ್ಕು.
    tr: Sṭrāṅg, sakkare kammi. Nūra hadinaidu rūpāyi. Ṭōkan hadinālku.
    en: Strong, less sugar. A hundred and fifteen rupees. Token fourteen.
  - who: sam
    t: ಮಹೇಶ್ ಅವರೇ, ಒಂದು ಸಲಹೆ, ಬೇಜಾರ್ ಮಾಡ್ಕೋಬೇಡಿ. ಬೆಳಗ್ಗೆ ಆರೂವರೆಗೆ ವಾಕಿಂಗ್ ಜನ ಕಾಫಿಗೆ ಮಾತ್ರ ಬರ್ತಾರೆ. ಕಾಫಿಗೆ ಬೇರೆ ಸಣ್ಣ ಕೌಂಟರ್ ಇದ್ರೆ ಅವರು ಇಡ್ಲಿ ಕ್ಯೂನಲ್ಲಿ ನಿಲ್ಲೋದು ತಪ್ಪುತ್ತೆ. ನಮ್ಮ ಊರಿನ ರೈಲ್ವೇ ಸ್ಟೇಷನ್‌ನಲ್ಲೂ ಕಾಫಿ ಬೇರೆ ಕಡೆ.
    tr: Mahēś avarē, ondu salahe, bējār māḍkōbēḍi. Beḷagge ārūvarege vākiṅg jana kāphige mātra bartāre. Kāphige bēre saṇṇa kauṇṭar idre avaru iḍli kyūnalli nillōdu tapputte. Namma ūrina railvē sṭēṣan-nallū kāphi bēre kaḍe.
    en: Mahesh, a suggestion, don't take it badly. At half past six the walkers come only for coffee. If coffee had its own little counter, they wouldn't have to stand in the idli queue. Even at the railway stations back home, coffee is in a separate spot.
  - who: mahesh
    t: ಸ್ವಿಸ್ ಐಡಿಯಾ, ಜಯನಗರದ ಕೌಂಟರ್. ಒಳ್ಳೇದು. ಸೋಮವಾರದಿಂದ ಕಾಫಿ ಟೋಕನ್ ಬೇರೆ, ಕೌಂಟರ್ ಬಾಗಿಲ ಹತ್ರ. ಇವತ್ತು ನಿಮ್ಮ ಕಾಫಿ ನಮ್ಮ ಕಡೆಯಿಂದ, ಕನ್ಸಲ್ಟಿಂಗ್ ಫೀಸ್.
    tr: Svis aiḍiyā, Jayanagarada kauṇṭar. Oḷḷēdu. Sōmavāradinda kāphi ṭōkan bēre, kauṇṭar bāgila hatra. Ivattu nimma kāphi namma kaḍeyinda, kansalṭiṅg phīs.
    en: 'A Swiss idea, a Jayanagar counter. Good. From Monday, separate coffee tokens and a counter by the door. Today your coffee''s on us: a consulting fee.'
  - who: sam
    t: 'ಇಲ್ಲ ಇಲ್ಲ, ನಾನು ದುಡ್ಡು ಕೊಡ್ತೀನಿ. ಅಜ್ಜಿ ಹೇಳಿದ್ದಾರೆ: ‘ಹೊಸ ಅಂಗಡಿಯಲ್ಲಿ ಫ್ರೀ ತಿನ್ನಬೇಡ. ಅದು ಅವರ ಹೊಟ್ಟೆ ಮೇಲೆ ಹೊಡೆದ ಹಾಗೆ.’'
    tr: 'Illa illa, nānu duḍḍu koḍtīni. Ajji hēḷiddāre: ‘Hosa aṅgaḍiyalli phrī tinnabēḍa. Adu avara hoṭṭe mēle hoḍeda hāge.’'
    en: 'No, no, I''ll pay. Ajji has told me: ‘Never eat free at a new shop. That''s like hitting them in the stomach.’'
  - scene: Inside, at the dosa griddle, after the rush. Shankara stands behind Basavaraj with his arms folded.
  - who: cook
    t: ಬಸವರಾಜ, ಮೊದಲು ಕಾವಲಿ ಹದ ನೋಡು. ನೀರು ಚಿಮುಕಿಸು. ‘ಚುಂಯ್’ ಅಂದು ತಕ್ಷಣ ಆರಿದ್ರೆ ಹದ ಸರಿ. ಹನಿ ಸುಮ್ಮನೆ ಕೂತ್ರೆ ತಣ್ಣಗಿದೆ. ಹೊಗೆ ಬಂದ್ರೆ ಜಾಸ್ತಿ ಬಿಸಿ.
    tr: Basavarāja, modalu kāvali hada nōḍu. Nīru chimukisu. ‘Chumy’ andu takṣaṇa āridre hada sari. Hani summane kūtre taṇṇagide. Hoge bandre jāsti bisi.
    en: Basavaraja, first check the griddle's heat. Sprinkle water. If it hisses and vanishes at once, the heat is right. If the drops just sit there, it's too cold. If it smokes, too hot.
  - who: helper
    t: ‘ಚುಂಯ್’ ಅಂತ್ರಿ… ಆರಿತ್ರಿ.
    tr: ‘Chumy’ antri… āritri.
    en: It hissed, sir… it's gone.
  - who: cook
    t: ಈಗ ಸೌಟು ಮಧ್ಯದಲ್ಲಿ ಇಟ್ಟು ಹೊರಗೆ ಸುತ್ತು. ಒತ್ತಬೇಡ, ಸವರು. ತೆಳ್ಳಗೆ… ಇನ್ನೂ ತೆಳ್ಳಗೆ. ಎಣ್ಣೆ ಅಂಚಿಗೆ, ಮಧ್ಯಕ್ಕಲ್ಲ. ಚಿನ್ನದ ಬಣ್ಣ ಬಂದಾಗ ಪಲ್ಯ ಇಟ್ಟು ಮಡಚು.
    tr: Īga sauṭu madhyadalli iṭṭu horage suttu. Ottabēḍa, savaru. Teḷḷage… innū teḷḷage. Eṇṇe aṅchige, madhyakkalla. Chinnada baṇṇa bandāga palya iṭṭu maḍachu.
    en: Now put the ladle in the middle and spiral outwards. Don't press, just glide. Thin… thinner. Oil on the edges, not in the middle. When it turns golden, add the palya and fold.
  - who: helper
    t: ಹರಿದು ಹೋತ್ರಿ… ಮತ್ತ ಹರಿದು ಹೋತು. ಹುಬ್ಬಳ್ಳಿ ರೊಟ್ಟಿ ಇದಕ್ಕಿಂತ ಸುಲಭ ಇತ್ತರಿ.
    tr: Haridu hōtri… matta haridu hōtu. Hubbaḷḷi roṭṭi idakkinta sulabha ittari.
    en: It tore, sir… torn again. The rotis in Hubballi were easier than this.
  - who: cook
    t: ನಾನು ಮೊದಲ ದೋಸೆ ಹಾಕಿದಾಗ ಹದಿನಾಲ್ಕು ವರ್ಷ. ಒಂದು ತಿಂಗಳು ನನ್ನ ದೋಸೆ ಎಲ್ಲಾ ದನಕ್ಕೆ ಹೋಯ್ತು. ಹರಿದ ದೋಸೆ ಇವತ್ತು ಸ್ಟಾಫ್ ಊಟಕ್ಕೆ. ನಾಳೆ ಮತ್ತೆ. ಒಂದು ವಾರದಲ್ಲಿ ಕೈ ಪಳಗುತ್ತೆ.
    tr: Nānu modala dōse hākidāga hadinālku varṣa. Ondu tingaḷu nanna dōse ellā danakke hōytu. Harida dōse ivattu sṭāf ūṭakke. Nāḷe matte. Ondu vāradalli kai paḷagutte.
    en: When I made my first dosa I was fourteen. For a month all my dosas went to the cows. The torn ones go to the staff lunch today. Again tomorrow. In a week your hand will get the knack.
  - who: dev
    t: ಹಾಗಾದ್ರೆ ಇವತ್ತು ನಮ್ಮ ಊಟ ಬೊಂಬಾಟ್!
    tr: Hāgādre ivattu namma ūṭa bombāṭ!
    en: Then today our lunch is fantastic!
  - section: The first month's accounts
    learn: 'monthly accounts: kalekṣan, sarāsari bil, āhāra kharchu … parsenṭ, ī-em-ai, ji-es-ṭi, nikaṭṭāgi break-even · comparisons: … kinta kammi/jāsti · hopes and fears: hīgē naḍedre…, ēnādrū āgidre…'
  - scene: Sunday, 1 March 2026, 10 p.m. Mahesh and Kavya's dining table. Nitin has come with sweets. Amma is folding the green aprons from the wash.
  - who: kavya
    t: ಫೆಬ್ರವರಿ ಲೆಕ್ಕ. ಇಪ್ಪತ್ತೆಂಟು ದಿನ, ಒಂದು ದಿನವೂ ರಜೆ ಇಲ್ಲ. ದಿನಕ್ಕೆ ಸರಾಸರಿ ಇನ್ನೂರ ತೊಂಬತ್ತು ಬಿಲ್, ಒಂದು ಬಿಲ್ ಸರಾಸರಿ ಎಪ್ಪತ್ತೆರಡು ರೂಪಾಯಿ. ದಿನಕ್ಕೆ ಸುಮಾರು ಇಪ್ಪತ್ತು ಸಾವಿರದ ಒಂಬೈನೂರು. ತಿಂಗಳ ಕಲೆಕ್ಷನ್ ಐದು ಲಕ್ಷ ಎಂಬತ್ತೈದು ಸಾವಿರ.
    tr: Phebravari lekka. Ippatteṇṭu dina, ondu dinavū raje illa. Dinakke sarāsari innūra tombattu bil, ondu bil sarāsari eppatteraḍu rūpāyi. Dinakke sumāru ippattu sāvirada ombainūru. Tingaḷa kalekṣan aidu lakṣa embattaidu sāvira.
    en: 'February''s accounts. Twenty-eight days, not one day off. An average of two hundred and ninety bills a day, seventy-two rupees per bill on average. About twenty thousand nine hundred a day. Takings for the month: five lakh eighty-five thousand.'
  - who: nitin
    t: ಐದು ಲಕ್ಷದ ಮೇಲೆ! ಮೊದಲ ತಿಂಗಳಿಗೆ ಸೂಪರ್. ಲಾಭ ಎಷ್ಟು?
    tr: Aidu lakṣada mēle! Modala tingaḷige sūpar. Lābha eṣṭu?
    en: Over five lakh! Superb for a first month. How much profit?
  - who: kavya
    t: 'ತಾಳು. ಖರ್ಚು ಕೇಳು. ಅಕ್ಕಿ, ಬೇಳೆ, ಹಾಲು, ತರಕಾರಿ, ಎಣ್ಣೆ: ಎರಡು ಲಕ್ಷ ಇಪ್ಪತ್ತೆರಡು, ಅಂದ್ರೆ ಮೂವತ್ತೆಂಟು ಪರ್ಸೆಂಟ್. ಸ್ಟಾಫ್ ಸಂಬಳ ಮತ್ತೆ ರೂಮ್ ಎಂಬತ್ತೆಂಟು ಸಾವಿರ. ರೆಂಟ್ ಒಂದು ಲಕ್ಷ. ಗ್ಯಾಸ್ ನಲವತ್ತೆಂಟು ಸಿಲಿಂಡರ್, ಎಂಬತ್ತೆರಡು ಸಾವಿರ. ಕರೆಂಟ್, ನೀರು ಹದಿನಾರು. ಮುದ್ರಾ ಬಡ್ಡಿ ಎಂಟೂವರೆ; ಮೊರಟೋರಿಯಂ ಇರೋದ್ರಿಂದ ಬರೀ ಬಡ್ಡಿ. ಜಿಎಸ್‌ಟಿ ಇಪ್ಪತ್ತೆಂಟು. ಸ್ಟೀಮ್ ಟೇಬಲ್, ಪಾರ್ಸೆಲ್ ಕವರ್, ಮೆಷಿನ್‌ಗಳ ಇನ್ಶೂರೆನ್ಸ್, ರಿಪೇರಿ, ಸಣ್ಣಪುಟ್ಟ ಖರ್ಚು ನಲವತ್ತೆರಡೂವರೆ.'
    tr: 'Tāḷu. Kharchu kēḷu. Akki, bēḷe, hālu, tarakāri, eṇṇe: eraḍu lakṣa ippatteraḍu, andre mūvatteṇṭu parsenṭ. Sṭāf sambaḷa matte rūm embatteṇṭu sāvira. Renṭ ondu lakṣa. Gyās nalavatteṇṭu silinḍar, embatteraḍu sāvira. Kareṇṭ, nīru hadināru. Mudrā baḍḍi eṇṭūvare; moraṭōriyam irōdrinda barī baḍḍi. Ji-es-ṭi ippatteṇṭu. Sṭīm ṭēbal, pārsel kavar, meṣin-gaḷa inśūrens, ripēri, saṇṇapuṭṭa kharchu nalavatteraḍūvare.'
    en: 'Wait. Hear the expenses. Rice, dal, milk, vegetables, oil: two lakh twenty-two, which is thirty-eight percent. Staff salaries and rooms, eighty-eight thousand. Rent, one lakh. Gas, forty-eight cylinders, eighty-two thousand. Electricity and water, sixteen. MUDRA interest, eight and a half; only interest, because of the moratorium. GST, twenty-eight. Steam table, parcel bags, the equipment insurance, repairs and small expenses, forty-two and a half.'
  - who: mahesh
    t: ಒಟ್ಟು… ಐದು ಲಕ್ಷ ಎಂಬತ್ತೇಳು. ಅಂದ್ರೆ ಎರಡು ಸಾವಿರ ನಷ್ಟ.
    tr: Oṭṭu… aidu lakṣa embattēḷu. Andre eraḍu sāvira naṣṭa.
    en: In all… five lakh eighty-seven. So a loss of two thousand.
  - who: kavya
    t: ಎರಡು ಸಾವಿರ ನಷ್ಟ, ಅದೂ ನೀನು ಒಂದು ರೂಪಾಯಿ ಸಂಬಳ ತಗೊಳ್ಳದೆ. ಆದ್ರೆ ಬೇಜಾರು ಬೇಡ. ಮೊದಲ ತಿಂಗಳಲ್ಲಿ ಹೆಚ್ಚು ಕಡಿಮೆ ಬ್ರೇಕ್-ಈವನ್ ಅಂದ್ರೆ ಅದು ಒಳ್ಳೆ ಸುದ್ದಿ. ನನ್ನ ಶೀಟ್‌ನಲ್ಲಿ ಮೂರನೇ ತಿಂಗಳವರೆಗೆ ನಷ್ಟ ಅಂತ ಇತ್ತು.
    tr: Eraḍu sāvira naṣṭa, adū nīnu ondu rūpāyi sambaḷa tagoḷḷade. Ādre bējāru bēḍa. Modala tingaḷalli hechchu kaḍime brēk-īvan andre adu oḷḷe suddi. Nanna śīṭ-nalli mūranē tingaḷavarege naṣṭa anta ittu.
    en: A two-thousand loss, and that with you not taking a single rupee in salary. But don't be glum. Roughly break-even in the first month is good news. My sheet had losses until the third month.
  - who: mahesh
    t: ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಈಗ ಎಷ್ಟಿದೆ?
    tr: Byāṅk-nalli īga eṣṭide?
    en: And how much is in the bank now?
  - who: kavya
    t: ಒಂದು ಲಕ್ಷ ಎಂಬತ್ತು. ಜನವರಿಯ ಟ್ರಯಲ್ ವಾರಗಳು, ಸ್ಟಾಫ್‌ನ ಮೊದಲ ಸಂಬಳ, ಮೊದಲ ಸ್ಟಾಕ್ ಸೇರಿ ಎಪ್ಪತ್ತಾರು ಸಾವಿರ ಹೋಯ್ತು. ಬಿಗಿ, ಆದ್ರೆ ನಿಂತಿದೀವಿ.
    tr: Ondu lakṣa embattu. Janavariya ṭrayal vāragaḷu, sṭāf-na modala sambaḷa, modala sṭāk sēri eppattāru sāvira hōytu. Bigi, ādre nintidīvi.
    en: One lakh eighty. The trial weeks in January, the staff's first wages and the first stock took seventy-six thousand. Tight, but we're standing.
  - who: nitin
    t: ಹಾಗಾದ್ರೆ ನನ್ನ ಪ್ರಾಫಿಟ್ ಶೇರ್?
    tr: Hāgādre nanna prāphiṭ śēr?
    en: So, my profit share?
  - who: kavya
    t: ನಿನ್ನ ಪ್ರಾಫಿಟ್ ಶೇರ್ ಒಂದು ಕಾಫಿ, ಎರಡು ಮೈಸೂರ್ ಪಾಕ್. ನೀನೇ ತಂದಿದ್ದು.
    tr: Ninna prāphiṭ śēr ondu kāphi, eraḍu Maisūr pāk. Nīnē tandiddu.
    en: Your profit share is one coffee and two pieces of Mysore pak. The ones you brought.
  - who: nitin
    t: 'ಒಪ್ಪಿಗೆ. ಆದ್ರೆ ಇದು ನೋಡಿ: ಗೂಗಲ್‌ನಲ್ಲಿ ನೂರ ನಲವತ್ತು ರಿವ್ಯೂ, ನಾಲ್ಕು ಪಾಯಿಂಟ್ ಆರು ಸ್ಟಾರ್. ಅರ್ಧ ರಿವ್ಯೂಗಳಲ್ಲಿ ಒಂದೇ ಪದ: ‘ಚಟ್ನಿ’. ‘ಅಮ್ಮನ ಚಟ್ನಿ’ ಅಂತ ಒಬ್ಬರು ಬರೆದಿದ್ದಾರೆ.'
    tr: 'Oppige. Ādre idu nōḍi: Gūgal-nalli nūra nalavattu rivyū, nālku pāyiṇṭ āru sṭār. Ardha rivyūgaḷalli ondē pada: ‘chaṭni’. ‘Ammana chaṭni’ anta obbaru barediddāre.'
    en: 'Fair. But look at this: a hundred and forty reviews on Google, four point six stars. Half the reviews have the same word: ‘chutney’. Somebody has written ‘Amma''s chutney’.'
  - who: amma
    t: ಅದು ನನ್ನ ಚಟ್ನಿ ಅಲ್ಲ, ತಿಪಟೂರಿನ ಕಾಯಿಯ ಗುಣ. ಹುರಿಗಡಲೆ ಸ್ವಲ್ಪ, ಹಸಿಮೆಣಸು, ಶುಂಠಿ, ಮೇಲೆ ಸಾಸಿವೆ ಕರಿಬೇವಿನ ಒಗ್ಗರಣೆ. ಅಷ್ಟೇ.
    tr: Adu nanna chaṭni alla, Tipaṭūrina kāyiya guṇa. Hurigaḍale svalpa, hasimeṇasu, śuṇṭhi, mēle sāsive karibēvina oggaraṇe. Aṣṭē.
    en: It isn't my chutney; it's the quality of the Tiptur coconuts. A little roasted gram, green chilli, ginger, and a tempering of mustard seeds and curry leaves on top. That's all.
  - who: mahesh
    t: 'ಅಷ್ಟೇ ಅಂತೆ. ದಿನಾ ಬೆಳಗ್ಗೆ ಐದು ಗಂಟೆಗೆ ಅಂಗಡಿಗೆ ಬಂದು ಇಪ್ಪತ್ತು ತೆಂಗಿನಕಾಯಿಯ ಚಟ್ನಿ ರುಬ್ಬೋದು ‘ಅಷ್ಟೇ’. ಶಂಕರಣ್ಣ ಕೂಡ ನಿನ್ನೆ ಕಸ್ಟಮರ್‌ಗಳ ಮುಂದೆ ಹೇಳಿದ್ರು: ‘ಚಟ್ನಿ ಅಮ್ಮನದ್ದೇ ಇರ್ಲಿ, ಸಾಂಬಾರ್ ನನ್ನದು.’'
    tr: 'Aṣṭē ante. Dinā beḷagge aidu gaṇṭege aṅgaḍige bandu ippattu teṅginakāyiya chaṭni rubbōdu ‘aṣṭē’. Śaṅkaraṇṇa kūḍa ninne kasṭamar-gaḷa munde hēḷidru: ‘Chaṭni ammanaddē irli, sāmbār nannadu.’'
    en: '‘That''s all’, she says. Coming to the shop at five every morning and grinding twenty coconuts'' worth of chutney is ‘that''s all’. Even Shankara-anna said it in front of customers yesterday: ‘Let the chutney stay Amma''s; the sambar is mine.’'
  - who: kavya
    t: ಅಮ್ಮ, ನಿಮಗೂ ಸಂಬಳ ಬರೀಬೇಕು. ಲೆಕ್ಕದಲ್ಲಿ ನಿಮ್ಮ ಕೆಲಸ ಕಾಣಿಸ್ಬೇಕು.
    tr: Amma, nimagū sambaḷa barībēku. Lekkadalli nimma kelasa kāṇisbēku.
    en: Amma, we should write a salary for you too. Your work has to show up in the accounts.
  - who: amma
    t: 'ನನ್ನ ಸಂಬಳ ಒಂದೇ: ಆ ಚಿನ್ನ ಲಾಕರ್‌ನಲ್ಲೇ ಇರಬೇಕು. ಅದು ಹೊರಗೆ ಬರದ ಹಾಗೆ ನೋಡ್ಕೊಳ್ಳಿ. ಅದೇ ನನಗೆ ಬೋನಸ್.'
    tr: 'Nanna sambaḷa ondē: ā chinna lākar-nallē irabēku. Adu horage barada hāge nōḍkoḷḷi. Adē nanage bōnas.'
    en: 'My salary is just one thing: that gold stays in the locker. Make sure it never has to come out. That''s my bonus.'
  - who: nitin
    t: ಒಂದು ಸಣ್ಣ ಚಿಂತೆ. ಆಫೀಸ್‌ನಲ್ಲಿ ಎಲ್ರೂ ಪಶ್ಚಿಮ ಏಷ್ಯಾದ ಯುದ್ಧದ ಸುದ್ದಿನೇ ಮಾತಾಡ್ತಿದಾರೆ. ತೈಲದ ಬೆಲೆ ಏರ್ತಿದೆ. ಗ್ಯಾಸ್ ಮೇಲೆ ಏನಾದ್ರೂ ಪರಿಣಾಮ ಆಗುತ್ತಾ?
    tr: Ondu saṇṇa chinte. Āphīs-nalli ellrū paśchima Ēṣyāda yuddhada suddinē mātāḍtidāre. Tailada bele ērtide. Gyās mēle ēnādrū pariṇāma āguttā?
    en: One small worry. Everyone at the office is talking about the war news from West Asia. Oil prices are climbing. Will it affect the gas at all?
  - who: mahesh
    t: ಅಶೋಕ್ ಹೇಳಿದ ಹಾಗೆ ಎರಡು ಸ್ಟ್ಯಾಂಡ್‌ಬೈ ಸಿಲಿಂಡರ್ ಯಾವಾಗ್ಲೂ ತುಂಬಿರುತ್ತೆ. ಆದ್ರೆ ಯುದ್ಧ ಸಮುದ್ರದಾಚೆ ನಡೆದ್ರೆ, ಅದರ ಸೇಕೆ ಇಲ್ಲಿ ನಮ್ಮ ಒಲೆಗೆ ಬರೋಕೆ ಎಷ್ಟು ದಿನ ಬೇಕು, ಯಾರಿಗೆ ಗೊತ್ತು.
    tr: Aśōk hēḷida hāge eraḍu sṭyāṇḍbai silinḍar yāvāglū tumbirutte. Ādre yuddha samudradāche naḍedre, adara sēke illi namma olege barōke eṣṭu dina bēku, yārige gottu.
    en: Like Ashok said, the two standby cylinders are always full. But when a war is going on across the sea, who knows how long its heat takes to reach our stove here.
  - chapter: Chapter 7 — The gas crisis
  - section: No cylinders
    learn: 'shortage words: koratu, sapplai nintide, kōṭā, ādyate, gōḍaun · reported news: … antāre, … anta echcharike koṭṭidāre · rationing: kammi urisidre…, muchchaḷa hāki · honest uncertainty: suḷḷu hēḷalla, gottilla; prāmis alla, prayatna'
  - scene: Monday, 9 March 2026, 6:10 a.m. Ashok's delivery auto is outside, but it is empty. Ashok comes in himself, without his usual grin.
  - who: gas
    t: ಮಹೇಶ್ ಅವರೇ, ಕೆಟ್ಟ ಸುದ್ದಿ. ಕಂಪನಿಯಿಂದ ಕಮರ್ಷಿಯಲ್ ಸಿಲಿಂಡರ್ ಸಪ್ಲೈ ನಿಂತಿದೆ. ಪಶ್ಚಿಮ ಏಷ್ಯಾದ ಯುದ್ಧದಿಂದ ಗ್ಯಾಸ್ ಹಡಗುಗಳು ಬರ್ತಿಲ್ಲ ಅಂತಾರೆ. ಮನೆ ಸಿಲಿಂಡರ್‌ಗೆ ಮೊದಲ ಆದ್ಯತೆ, ಹೋಟೆಲ್‌ಗಳಿಗೆ ಆಮೇಲೆ.
    tr: Mahēś avarē, keṭṭa suddi. Kampaniyinda kamarṣiyal silinḍar saplai nintide. Paśchima Ēṣyāda yuddhadinda gyās haḍagugaḷu bartilla antāre. Mane silinḍar-ge modala ādyate, hōṭel-gaḷige āmēle.
    en: Mahesh, bad news. Commercial cylinder supply from the company has stopped. They say the gas ships aren't coming because of the war in West Asia. Household cylinders get first priority; hotels come after.
  - who: mahesh
    t: ಎಷ್ಟು ದಿನ?
    tr: Eṣṭu dina?
    en: For how many days?
  - who: gas
    t: ಯಾರಿಗೂ ಗೊತ್ತಿಲ್ಲ. ಹೋಟೆಲ್ ಅಸೋಸಿಯೇಷನ್‌ನವರು ‘ನಾಳೆಯಿಂದ ಹೋಟೆಲ್‌ಗಳು ಮುಚ್ಚಬೇಕಾಗಬಹುದು’ ಅಂತ ಎಚ್ಚರಿಕೆ ಕೊಟ್ಟಿದ್ದಾರೆ. ನನ್ನ ಗೋಡೌನ್‌ನಲ್ಲಿ ಇವತ್ತು ಒಂದೂ ಕಮರ್ಷಿಯಲ್ ಸಿಲಿಂಡರ್ ಇಲ್ಲ. ನಿಮ್ಮ ಹತ್ರ ಎಷ್ಟಿದೆ?
    tr: Yārigū gottilla. Hōṭel asōsiyēṣan-navaru ‘nāḷeyinda hōṭel-gaḷu muchchabēkāgabahudu’ anta echcharike koṭṭiddāre. Nanna gōḍaun-nalli ivattu ondū kamarṣiyal silinḍar illa. Nimma hatra eṣṭide?
    en: Nobody knows. The hotel association has warned that hotels may have to shut from tomorrow. Today there isn't a single commercial cylinder in my godown. How many do you have?
  - who: mahesh
    t: ಮ್ಯಾನಿಫೋಲ್ಡ್‌ನಲ್ಲಿ ಒಂದು ಅರ್ಧ ಆಗಿದೆ, ಇನ್ನೊಂದು ಪೂರ್ತಿ. ಎರಡು ಸ್ಟ್ಯಾಂಡ್‌ಬೈ ತುಂಬಿವೆ. ನೀವು ಹೇಳಿದ್ದಕ್ಕೇ.
    tr: Myāniphōlḍ-nalli ondu ardha āgide, innondu pūrti. Eraḍu sṭyāṇḍbai tumbive. Nīvu hēḷiddakkē.
    en: On the manifold, one is half used and the other is full. The two standbys are full. Because you told me to.
  - who: gas
    t: ಒಳ್ಳೇದಾಯ್ತು. ದಿನಕ್ಕೆ ಒಂದೂ ಮುಕ್ಕಾಲು ಉರಿಸ್ತಿದ್ರೆ ಸುಮಾರು ಎರಡು ದಿನ. ಅರ್ಧ ಉರಿಸಿದ್ರೆ ನಾಲ್ಕು ದಿನ.
    tr: Oḷḷēdāytu. Dinakke ondū mukkālu uristidre sumāru eraḍu dina. Ardha urisidre nālku dina.
    en: Good thing. At one and three-quarter cylinders a day, that's about two days. Burn half as much and it's four.
  - who: mahesh
    t: ನಾಲ್ಕು ದಿನದಲ್ಲಿ ಬರುತ್ತಾ?
    tr: Nālku dinadalli baruttā?
    en: Will supply come within four days?
  - who: gas
    t: ಸುಳ್ಳು ಹೇಳಲ್ಲ, ಗೊತ್ತಿಲ್ಲ. ಸರ್ಕಾರ ಹೋಟೆಲ್‌ಗಳಿಗೆ ಏನೋ ಕೋಟಾ ಕೊಡುತ್ತೆ ಅಂತ ಸುದ್ದಿ ಇದೆ. ಬಂದ್ರೆ ಮೊದಲು ನಿಮ್ಮಂಥ, ಯಾವಾಗ್ಲೂ ಬಿಲ್ ತಗೊಂಡು ಸರಿಯಾಗಿ ವ್ಯವಹಾರ ಮಾಡೋರಿಗೆ. ಪ್ರಾಮಿಸ್ ಅಲ್ಲ, ಪ್ರಯತ್ನ.
    tr: Suḷḷu hēḷalla, gottilla. Sarkāra hōṭel-gaḷige ēnō kōṭā koḍutte anta suddi ide. Bandre modalu nimmantha, yāvāglū bil tagoṇḍu sariyāgi vyavahāra māḍōrige. Prāmis alla, prayatna.
    en: 'I won''t lie to you: I don''t know. There''s news that the government will give hotels some kind of quota. If it comes, people like you who always take a bill and deal straight get it first. Not a promise; an effort.'
  - scene: Mahesh walks into the kitchen. Shankara has heard everything through the hatch.
  - who: cook
    t: ಗ್ಯಾಸ್ ಇಲ್ಲಾಂದ್ರೆ ದೋಸೆ ಇಲ್ಲ, ವಡೆ ಇಲ್ಲ. ಕಾವಲಿ ಒಂದೇ ದಿನಕ್ಕೆ ಅರ್ಧ ಸಿಲಿಂಡರ್ ತಿನ್ನುತ್ತೆ. ಎಣ್ಣೆ ಬಾಣಲೆ ಇನ್ನೂ ಜಾಸ್ತಿ.
    tr: Gyās illāndre dōse illa, vaḍe illa. Kāvali ondē dinakke ardha silinḍar tinnutte. Eṇṇe bāṇale innū jāsti.
    en: No gas, no dosa, no vada. The griddle alone eats half a cylinder a day. The frying pan even more.
  - who: mahesh
    t: ಹಾಗಾದ್ರೆ ಇವತ್ತಿಂದ ಗ್ಯಾಸ್ ಉಳಿಸೋ ಯುದ್ಧ. ಒಲೆ ಸುಮ್ಮನೆ ಉರಿಯಬಾರದು. ಪ್ರತಿ ಪಾತ್ರೆಗೆ ಮುಚ್ಚಳ. ಹಾಲು ಒಂದೇ ಸಲ ಕಾಯಿಸೋದು. ದೋಸೆ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ನಿಲ್ಲಿಸೋಣ. ನಾಳೆ ಏನು ಮಾಡೋದು ಅಂತ ರಾತ್ರಿ ತೀರ್ಮಾನ.
    tr: Hāgādre ivattinda gyās uḷisō yuddha. Ole summane uriyabāradu. Prati pātrege muchchaḷa. Hālu ondē sala kāyisōdu. Dōse hannondu gaṇṭege nillisōṇa. Nāḷe ēnu māḍōdu anta rātri tīrmāna.
    en: Then from today it's a war to save gas. No burner stays on for nothing. A lid on every vessel. Milk boiled only once. We'll stop dosas at eleven. Tonight we decide what to do tomorrow.
  - section: An offer in the lane
    learn: 'black-market talk (refused): blyāk-nalli, bil illa praśne illa, mane silinḍar · refusing firmly but kindly: bēḍa Rameśaṇṇa, nimma mēle kōpa alla · reasons: kānūnu, apāya, bēre yāra aḍugemane'
  - scene: Tuesday, 10 March, 5:30 a.m. Ramesh's tempo is unloading vegetables. He lowers his voice.
  - who: supplier
    t: ಮಹೇಶಣ್ಣ, ಒಂದು ಮಾತು. ನನಗೆ ಗೊತ್ತಿರೋ ಒಬ್ಬ ಹುಡುಗ ಇದಾನೆ. ಕಮರ್ಷಿಯಲ್ ಸಿಲಿಂಡರ್ ಒಂದಕ್ಕೆ ನಾಲ್ಕೂವರೆ ಸಾವಿರ. ಮನೆ ಸಿಲಿಂಡರ್ ಬೇಕಂದ್ರೆ ಮೂರು ಸಾವಿರ. ಬಿಲ್ ಇಲ್ಲ, ಪ್ರಶ್ನೆ ಇಲ್ಲ. ರಾತ್ರಿ ಹತ್ತು ಗಂಟೆಗೆ ತಂದುಕೊಡ್ತಾನೆ.
    tr: Mahēśaṇṇa, ondu mātu. Nanage gottirō obba huḍuga idāne. Kamarṣiyal silinḍar ondakke nālkūvare sāvira. Mane silinḍar bēkandre mūru sāvira. Bil illa, praśne illa. Rātri hattu gaṇṭege tandukoḍtāne.
    en: Mahesh-anna, a word. There's a lad I know. Four and a half thousand for a commercial cylinder. If you want household cylinders, three thousand. No bill, no questions. He'll bring them at ten at night.
  - who: mahesh
    t: ನಾಲ್ಕೂವರೆ ಸಾವಿರ? ಕಂಪನಿ ರೇಟ್‌ಗಿಂತ ಎರಡು ಪಟ್ಟು ಜಾಸ್ತಿ. ಬೇಡ ರಮೇಶಣ್ಣ.
    tr: Nālkūvare sāvira? Kampani rēṭ-ginta eraḍu paṭṭu jāsti. Bēḍa Rameśaṇṇa.
    en: Four and a half thousand? That's more than twice the company rate. No, Ramesh-anna.
  - who: supplier
    t: ಯೋಚನೆ ಮಾಡಿ. ಪಕ್ಕದ ಎರಡು ಹೋಟೆಲ್‌ನವರು ತಗೊಳ್ತಿದ್ದಾರೆ. ಅವರ ದೋಸೆ ನಡೀತಿದೆ, ನಿಮ್ಮ ಕಾವಲಿ ತಣ್ಣಗಾಗಿದೆ. ಗಿರಾಕಿ ಒಂದು ಸಲ ಹೋದ್ರೆ ವಾಪಸ್ ಬರೋದು ಕಷ್ಟ.
    tr: Yōchane māḍi. Pakkada eraḍu hōṭel-navaru tagoḷtiddāre. Avara dōse naḍītide, nimma kāvali taṇṇagāgide. Girāki ondu sala hōdre vāpas barōdu kaṣṭa.
    en: Think about it. Two hotels near you are buying. Their dosas are going; your griddle is cold. Once a customer leaves, it's hard to get them back.
  - who: mahesh
    t: 'ಅವರ ಲೆಕ್ಕ ಅವರಿಗೆ. ನನ್ನ ಲೆಕ್ಕ ಹೀಗಿದೆ: ಮನೆ ಸಿಲಿಂಡರ್ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಇಟ್ರೆ ಸೀಜ್, ಕೇಸ್, ದಂಡ. ಮೇಲೆ ಮೂರ್ತಿ ಸಾರ್ ಮಲಗಿರ್ತಾರೆ, ಬಿಲ್ ಇಲ್ಲದ ಸಿಲಿಂಡರ್‌ಗೆ ಇನ್ಶೂರೆನ್ಸ್ ಇಲ್ಲ. ಮತ್ತೆ, ಆ ಮನೆ ಸಿಲಿಂಡರ್ ಎಲ್ಲಿಂದ ಬರುತ್ತೆ? ಯಾವುದೋ ಮನೆಯ ಅಡುಗೆಮನೆಯಿಂದ.'
    tr: 'Avara lekka avarige. Nanna lekka hīgide: mane silinḍar hōṭel-nalli iṭre sīj, kēs, daṇḍa. Mēle Mūrti sār malagirtāre, bil illada silinḍar-ge inśūrens illa. Matte, ā mane silinḍar ellinda barutte? Yāvudō maneya aḍugemaneyinda.'
    en: 'Their accounts are their business. Mine go like this: a household cylinder kept in a hotel means seizure, a case and a fine. Murthy sir sleeps upstairs, and a cylinder without a bill has no insurance. And where does that household cylinder come from? From some family''s kitchen.'
  - who: supplier
    t: ಹ್ಮ್… ಅದನ್ನ ನಾನು ಯೋಚನೆ ಮಾಡಿರಲಿಲ್ಲ. ಸರಿ ಬಿಡಿ. ನಿಮ್ಮ ಹೆಂಡತಿ ಬಿಲ್ ಇಲ್ಲದ ಈರುಳ್ಳಿಗೇ ಮನೆಯಿಂದ ಹೊರಗೆ ಹಾಕ್ತಾರೆ ಅಂದ್ರಿ. ಬಿಲ್ ಇಲ್ಲದ ಸಿಲಿಂಡರ್‌ಗೆ ಊರಿಂದಲೇ ಹೊರಗೆ ಹಾಕ್ತಾರೆ.
    tr: Hm… adanna nānu yōchane māḍiralilla. Sari biḍi. Nimma heṇḍati bil illada īruḷḷigē maneyinda horage hāktāre andri. Bil illada silinḍar-ge ūrindalē horage hāktāre.
    en: Hmm… I hadn't thought of that. All right, forget it. You said your wife would throw you out of the house over onions without a bill. For a cylinder without a bill, she'd throw you out of town.
  - who: mahesh
    t: 'ನಿಮ್ಮ ಮೇಲೆ ಕೋಪ ಇಲ್ಲ ರಮೇಶಣ್ಣ. ಸಹಾಯ ಮಾಡೋಕೆ ಬಂದ್ರಿ, ಗೊತ್ತು. ಆದ್ರೆ ಈ ಸಹಾಯ ಬೇಡ. ಬದಲಿಗೆ ಒಂದು ಕೆಲಸ ಮಾಡಿ: ನಾಳೆಯಿಂದ ಈರುಳ್ಳಿ, ಆಲೂಗಡ್ಡೆ ಅರ್ಧ ಸಾಕು. ದೋಸೆ ಇಲ್ಲದೆ ಪಲ್ಯ ಯಾರಿಗೆ?'
    tr: 'Nimma mēle kōpa illa Rameśaṇṇa. Sahāya māḍōke bandri, gottu. Ādre ī sahāya bēḍa. Badalige ondu kelasa māḍi: nāḷeyinda īruḷḷi, ālūgaḍḍe ardha sāku. Dōse illade palya yārige?'
    en: 'I''m not angry with you, Ramesh-anna. You came to help, I know. But not this kind of help. Do one thing instead: from tomorrow, half the onions and potatoes will do. Without dosas, who needs the potato palya?'
  - section: Firewood or induction
    learn: 'options and trade-offs: sīde ole vs inḍakṣan · electricity load: syāṅkṣanḍ lōḍ, kilōvyāṭ, bāḍige (rent) · hypotheticals: … māḍidre ēnāgutte?, … āgidre chennāgittu · menu cut: aidu tiṇḍi mātra · comparison with others: bēre hōṭel-gaḷu … māḍtive'
  - scene: Tuesday, 10 March, 10 p.m. The shutter is down. Mahesh, Kavya, Nitin and Shankara sit on crates in the empty shop. Amma stands by the counter.
  - who: cook
    t: ನಮ್ಮ ಊರಿನ ದೇವಸ್ಥಾನದ ಅಡುಗೆಮನೆಯಲ್ಲಿ ಇವತ್ತಿಗೂ ಸೌದೆ ಒಲೆ. ಸಾವಿರ ಜನಕ್ಕೆ ಸಾರು, ಪಾಯಸ ಸೌದೆಯಲ್ಲೇ. ಕೆಲವು ಹೋಟೆಲ್‌ಗಳು ಈಗ ಸೌದೆಗೆ ಬದಲಾಯಿಸಿವೆ ಅಂತ ಕೇಳಿದೆ. ನನಗೆ ಸೌದೆ ಒಲೆ ಗೊತ್ತು.
    tr: Namma ūrina dēvasthānada aḍugemaneyalli ivattigū saude ole. Sāvira janakke sāru, pāyasa saudeyallē. Kelavu hōṭel-gaḷu īga saudege badalāyisive anta kēḷide. Nanage saude ole gottu.
    en: Even today, the temple kitchen back home cooks on firewood. Rasam and payasa for a thousand people, all on firewood. I hear some hotels have switched to firewood now. I know how to cook on a wood fire.
  - who: mahesh
    t: 'ನಾನೂ ಯೋಚನೆ ಮಾಡಿದೆ, ಮೂರ್ತಿ ಸಾರ್‌ಗೆ ಫೋನ್ ಕೂಡ ಮಾಡಿದೆ. ಅವರು ಹೇಳಿದ್ರು: ‘ಹೊಗೆ ಮೇಲೆ ಬಂದ್ರೆ ನಾನು ಉಸಿರಾಡೋದು ಹೇಗೆ? ನಿಮ್ಮ ಚಿಮಣಿ ಗ್ಯಾಸ್ ಒಲೆಗೆ ಮಾಡಿದ್ದು, ಸೌದೆ ಹೊಗೆಗಲ್ಲ. ಬೆಂಕಿ ಅಪಾಯ ಬೇರೆ, ಇನ್ಶೂರೆನ್ಸ್ ಕೂಡ ಕೊಡಲ್ಲ.’ ಅವರು ಹೇಳಿದ್ದು ಸರಿ.'
    tr: 'Nānū yōchane māḍide, Mūrti sār-ge phōn kūḍa māḍide. Avaru hēḷidru: ‘Hoge mēle bandre nānu usirāḍōdu hēge? Nimma chimaṇi gyās olege māḍiddu, saude hogegalla. Beṅki apāya bēre, inśūrens kūḍa koḍalla.’ Avaru hēḷiddu sari.'
    en: 'I thought about it too, and I even phoned Murthy sir. He said: ‘If smoke comes up, how am I supposed to breathe? Your chimney was built for gas stoves, not for wood smoke. And there''s the fire risk besides; the insurance won''t cover it either.’ He''s right.'
  - who: nitin
    t: ಹಾಗಾದ್ರೆ ಕರೆಂಟ್. ನಾನು ಇಡೀ ದಿನ ರಿಸರ್ಚ್ ಮಾಡಿದೆ. ಕಮರ್ಷಿಯಲ್ ಇಂಡಕ್ಷನ್, ಮೂರೂವರೆ ಕಿಲೋವ್ಯಾಟ್‌ನದ್ದು, ಒಂದಕ್ಕೆ ನಲವತ್ತೈದು ಸಾವಿರ. ಆದ್ರೆ ಇವತ್ತು ಬೆಂಗಳೂರಲ್ಲಿ ಎಲ್ಲಾ ಹೋಟೆಲ್‌ನವರೂ ಅದನ್ನೇ ಹುಡುಕ್ತಿದ್ದಾರೆ. ಸ್ಟಾಕ್ ಇಲ್ಲ, ರೇಟ್ ದಿನಾ ಏರ್ತಿದೆ.
    tr: Hāgādre kareṇṭ. Nānu iḍī dina risarch māḍide. Kamarṣiyal inḍakṣan, mūrūvare kilōvyāṭ-naddu, ondakke nalavattaidu sāvira. Ādre ivattu Beṅgaḷūralli ellā hōṭel-navarū adannē huḍuktiddāre. Sṭāk illa, rēṭ dinā ērtide.
    en: Then electricity. I spent the whole day researching. A commercial induction unit, three and a half kilowatts, costs forty-five thousand each. But today every hotel in Bengaluru is looking for the same thing. No stock, and the price goes up every day.
  - who: kavya
    t: ನಲವತ್ತೈದು ಸಾವಿರ ಎರಡು ಅಂದ್ರೆ ತೊಂಬತ್ತು. ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಇರೋದು ಒಂದು ಲಕ್ಷ ಎಂಬತ್ತು. ಈ ತಿಂಗಳ ಸಂಬಳ, ರೆಂಟ್ ಇನ್ನೂ ಮುಂದೆ ಇದೆ. ಖರೀದಿ ಮಾಡೋದು ಬೇಡ.
    tr: Nalavattaidu sāvira eraḍu andre tombattu. Byāṅk-nalli irōdu ondu lakṣa embattu. Ī tingaḷa sambaḷa, renṭ innū munde ide. Kharīdi māḍōdu bēḍa.
    en: Forty-five thousand times two is ninety. What's in the bank is one lakh eighty. This month's salaries and rent are still ahead of us. Let's not buy.
  - who: nitin
    t: ಖರೀದಿ ಅಲ್ಲ, ಬಾಡಿಗೆ. ನನ್ನ ಫ್ರೆಂಡ್‌ಗೆ ಕ್ಯಾಟರಿಂಗ್ ಬಿಸಿನೆಸ್ ಇದೆ. ಮದುವೆ ಸೀಸನ್ ಮುಗಿದಿದೆ, ಅವನ ಹತ್ರ ಎರಡು ಇಂಡಕ್ಷನ್ ಖಾಲಿ ಬಿದ್ದಿವೆ. ತಿಂಗಳಿಗೆ ಎಂಟು ಸಾವಿರ, ಎರಡಕ್ಕೂ ಸೇರಿ. ಗ್ಯಾಸ್ ಬಂದ ತಕ್ಷಣ ವಾಪಸ್.
    tr: Kharīdi alla, bāḍige. Nanna phreṇḍ-ge kyāṭariṅg bisines ide. Maduve sīsan mugidide, avana hatra eraḍu inḍakṣan khāli biddive. Tingaḷige eṇṭu sāvira, eraḍakkū sēri. Gyās banda takṣaṇa vāpas.
    en: 'Not buy: rent. A friend of mine has a catering business. The wedding season is over, and he has two induction units lying idle. Eight thousand a month for both together. They go back the moment the gas returns.'
  - who: mahesh
    t: ಕರೆಂಟ್ ಲೋಡ್ ನೋಡಬೇಕು. ನಮ್ಮ ಸ್ಯಾಂಕ್ಷನ್ಡ್ ಲೋಡ್ ಹನ್ನೆರಡು ಕಿಲೋವ್ಯಾಟ್. ಗ್ರೈಂಡರ್, ಫ್ರಿಜ್, ಚಿಮಣಿ, ಲೈಟ್ ಸೇರಿ ಸುಮಾರು ಆರು. ಎರಡು ಇಂಡಕ್ಷನ್ ಏಳು. ಒಟ್ಟು ಹದಿಮೂರು, ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಹಾಗಾದ್ರೆ ಗ್ರೈಂಡರ್ ಹಗಲಲ್ಲಿ ಬೇಡ, ರಾತ್ರಿ ಮಾತ್ರ. ಆಗ ಹನ್ನೊಂದರೊಳಗೆ ಇರುತ್ತೆ.
    tr: Kareṇṭ lōḍ nōḍabēku. Namma syāṅkṣanḍ lōḍ hanneraḍu kilōvyāṭ. Graiṇḍar, phrij, chimaṇi, laiṭ sēri sumāru āru. Eraḍu inḍakṣan ēḷu. Oṭṭu hadimūru, svalpa jāsti. Hāgādre graiṇḍar hagalalli bēḍa, rātri mātra. Āga hannondaroḷage irutte.
    en: We have to check the electrical load. Our sanctioned load is twelve kilowatts. Grinder, fridge, chimney and lights come to about six. Two induction units, seven. Thirteen in all; slightly over. So no grinder in the daytime, only at night. Then we stay under eleven.
  - who: cook
    t: ಇಂಡಕ್ಷನ್‌ನಲ್ಲಿ ಇಡ್ಲಿ ಆಗುತ್ತೆ, ಸಾಂಬಾರ್ ಆಗುತ್ತೆ, ಬಾತ್ ಆಗುತ್ತೆ. ಪಾತ್ರೆ ತಳ ಚಪ್ಪಟೆ ಇರಬೇಕು ಅಷ್ಟೇ. ಆದ್ರೆ ದೋಸೆ? ಇಂಡಕ್ಷನ್ ಕಾವಲಿಯಲ್ಲಿ ನನ್ನ ದೋಸೆ ಗರಿಗರಿ ಬರಲ್ಲ. ಅರೆಬರೆ ದೋಸೆ ಕೊಡೋದಕ್ಕಿಂತ ದೋಸೆ ಇಲ್ಲ ಅನ್ನೋದು ವಾಸಿ.
    tr: Inḍakṣan-nalli iḍli āgutte, sāmbār āgutte, bāt āgutte. Pātre taḷa chappaṭe irabēku aṣṭē. Ādre dōse? Inḍakṣan kāvaliyalli nanna dōse garigari baralla. Arebare dōse koḍōdakkinta dōse illa annōdu vāsi.
    en: On induction you can do idli, sambar and the baths. The vessels just need flat bottoms. But dosa? On an induction griddle my dosa won't come out crisp. Better to say ‘no dosa’ than to serve a half-baked one.
  - who: kavya
    t: ಹಾಗಾದ್ರೆ ಮೆನು ಕಟ್. ಎಷ್ಟು ಐಟಂ?
    tr: Hāgādre menu kaṭ. Eṣṭu aiṭam?
    en: Then we cut the menu. How many items?
  - who: mahesh
    t: ಐದು. ಇಡ್ಲಿ, ಖಾರಾ ಬಾತ್, ಕೇಸರಿ ಬಾತ್, ಚಿತ್ರಾನ್ನ, ಕಾಫಿ. ಅಶೋಕ್ ಹತ್ರ ಏನಾದ್ರೂ ಗ್ಯಾಸ್ ಸಿಕ್ಕಿದ್ರೆ ಅದು ಕಾಫಿ ಹಾಲಿಗೆ ಮಾತ್ರ. ದೋಸೆ, ವಡೆ ಗ್ಯಾಸ್ ಬರೋವರೆಗೆ ಇಲ್ಲ.
    tr: Aidu. Iḍli, khārā bāt, kēsari bāt, chitrānna, kāphi. Aśōk hatra ēnādrū gyās sikkidre adu kāphi hālige mātra. Dōse, vaḍe gyās barōvarege illa.
    en: Five. Idli, khara bath, kesari bath, chitranna, coffee. Whatever gas we get from Ashok goes only to boiling milk for coffee. No dosa or vada until the gas comes back.
  - who: nitin
    t: ರೇಟ್? ಕೆಲವು ದರ್ಶಿನಿಗಳು ಊಟದ ರೇಟ್ ತೊಂಬತ್ತರಿಂದ ನೂರಕ್ಕೆ ಏರಿಸಿವೆ ಅಂತ ನ್ಯೂಸ್‌ನಲ್ಲಿ ಬಂದಿದೆ.
    tr: Rēṭ? Kelavu darśinigaḷu ūṭada rēṭ tombattarinda nūrakke ērisive anta nyūs-nalli bandide.
    en: Prices? The news says some darshinis have raised the price of a meal from ninety to a hundred.
  - who: amma
    t: ಕಷ್ಟದ ಕಾಲದಲ್ಲಿ ರೇಟ್ ಏರಿಸಿದ್ರೆ ಜನ ಮರೆಯಲ್ಲ, ಮಗು. ಇಳಿಸಿದ್ರೂ ಮರೆಯಲ್ಲ. ಇಡ್ಲಿ ನಲವತ್ತೇ ಇರ್ಲಿ.
    tr: Kaṣṭada kāladalli rēṭ ērisidre jana mareyalla, magu. Iḷisidrū mareyalla. Iḍli nalavattē irli.
    en: If you raise prices in hard times, people don't forget it, child. If you keep them down, they don't forget that either. Let idli stay at forty.
  - section: Five items on the board
    learn: 'apologising on a notice: … koratheyinda, kṣamisi, sahakarisi · customers'' impatience and patience: hāgādre yāke bāgilu tegedidīri? vs bāgilu tegediddē doḍḍadu · the 20% quota: ippattu parsenṭ kōṭā, vārakke eraḍu silinḍar'
  - scene: Friday, 13 March, 7 a.m. A whiteboard by the shutter, in Latha's neat handwriting. Two induction units hum in the kitchen. Ashok's auto pulls up with two blue cylinders.
  - who: cashier
    t: '‘ಗ್ಯಾಸ್ ಕೊರತೆಯಿಂದ ಇಂದು ಐದು ತಿಂಡಿಗಳು ಮಾತ್ರ: ಇಡ್ಲಿ, ಖಾರಾ ಬಾತ್, ಕೇಸರಿ ಬಾತ್, ಚಿತ್ರಾನ್ನ, ಕಾಫಿ. ದೋಸೆ, ವಡೆ ಸದ್ಯಕ್ಕೆ ಇಲ್ಲ. ತೊಂದರೆಗಾಗಿ ಕ್ಷಮಿಸಿ, ಸಹಕರಿಸಿ.’ ಸರಿಯಾಗಿದೆಯಾ ಸಾರ್?'
    tr: '‘Gyās korateyinda indu aidu tiṇḍigaḷu mātra: iḍli, khārā bāt, kēsari bāt, chitrānna, kāphi. Dōse, vaḍe sadyakke illa. Tondaregāgi kṣamisi, sahakarisi.’ Sariyāgideyā sār?'
    en: '(Reading the board) ‘Due to the gas shortage, only five items today: idli, khara bath, kesari bath, chitranna, coffee. No dosa or vada for now. We apologise for the inconvenience; please bear with us.’ Is that right, sir?'
  - who: gas
    t: 'ಮಹೇಶ್ ಅವರೇ, ಸರ್ಕಾರ ಕೋಟಾ ಕೊಟ್ಟಿದೆ: ಹೋಟೆಲ್‌ಗಳ ಸಾಮಾನ್ಯ ಬಳಕೆಯ ಇಪ್ಪತ್ತು ಪರ್ಸೆಂಟ್ ಅಂತೆ. ನಿಮ್ಮ ಪಾಲು ವಾರಕ್ಕೆ ಎರಡು ಸಿಲಿಂಡರ್. ಮೊದಲ ಎರಡು ಇವು. ಬಿಲ್ ಜೊತೆ, ಕಂಪನಿ ರೇಟ್‌ಗೆ.'
    tr: 'Mahēś avarē, sarkāra kōṭā koṭṭide: hōṭel-gaḷa sāmānya baḷakeya ippattu parsenṭ ante. Nimma pālu vārakke eraḍu silinḍar. Modala eraḍu ivu. Bil jote, kampani rēṭ-ge.'
    en: 'Mahesh, the government has given a quota: twenty percent of hotels'' normal use, they say. Your share is two cylinders a week. Here are the first two. With a bill, at the company rate.'
  - who: mahesh
    t: ಅಶೋಕ್, ನೀವು ಮಾತು ಉಳಿಸ್ಕೊಂಡ್ರಿ. ಇಪ್ಪತ್ತು ಪರ್ಸೆಂಟ್ ಅಂದ್ರೆ ಕಾಫಿ ಉಳಿಯುತ್ತೆ. ಕಾಫಿ ಉಳಿದ್ರೆ ಜನ ಬರ್ತಾರೆ.
    tr: Aśōk, nīvu mātu uḷiskoṇḍri. Ippattu parsenṭ andre kāphi uḷiyutte. Kāphi uḷidre jana bartāre.
    en: Ashok, you kept your word. Twenty percent means the coffee survives. If the coffee survives, people will keep coming.
  - who: customer
    t: ದೋಸೆ ಇಲ್ವಾ? ವಡೆನೂ ಇಲ್ವಾ? ಹಾಗಾದ್ರೆ ಬಾಗಿಲು ಯಾಕೆ ತೆಗೆದಿದೀರಾ? ಮಗನಿಗೆ ಮಸಾಲೆ ದೋಸೆ ಪ್ರಾಮಿಸ್ ಮಾಡಿ ಕರ್ಕೊಂಡು ಬಂದಿದೀನಿ.
    tr: Dōse ilvā? Vaḍenū ilvā? Hāgādre bāgilu yāke tegedidīrā? Maganige masāle dōse prāmis māḍi karkoṇḍu bandidīni.
    en: No dosa? No vada either? Then why are you open at all? I promised my son a masala dose and brought him here.
  - who: dev
    t: ಸಾರ್, ಕ್ಷಮಿಸಿ. ಇವತ್ತು ದೋಸೆ ಇಲ್ಲ. ಗ್ಯಾಸ್ ಇಲ್ಲ, ಇಡೀ ಬೆಂಗಳೂರಲ್ಲಿ. ಆದ್ರೆ ಇಡ್ಲಿ ಇದೆ, ಬಿಸಿ ಇದೆ. ಕೇಸರಿ ಬಾತ್ ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ. ಮಗುವಿಗೆ ಇಷ್ಟ ಆಗುತ್ತೆ.
    tr: Sār, kṣamisi. Ivattu dōse illa. Gyās illa, iḍī Beṅgaḷūralli. Ādre iḍli ide, bisi ide. Kēsari bāt tumbā chennāgide. Maguvige iṣṭa āgutte.
    en: Sorry, sir. No dosa today. No gas, in all of Bengaluru. But there's idli, and it's hot. The kesari bath is very good. Your boy will like it.
  - who: customer
    t: ಇವನು ಯಾವಾಗ ಇಷ್ಟು ಕನ್ನಡ ಕಲಿತ? ಸರಿ, ಎರಡು ಕೇಸರಿ ಬಾತ್, ಒಂದು ಇಡ್ಲಿ.
    tr: Ivanu yāvāga iṣṭu Kannaḍa kalita? Sari, eraḍu kēsari bāt, ondu iḍli.
    en: '(Softening) When did he learn this much Kannada? All right: two kesari bath, one idli.'
  - who: customer
    t: ಇಡೀ ಊರಲ್ಲಿ ಗ್ಯಾಸ್ ಇಲ್ಲ. ಕೆಲವು ಹೋಟೆಲ್‌ಗಳು ಬಾಗಿಲೇ ಹಾಕಿವೆ. ಇವರು ತೆಗೆದಿರೋದೇ ದೊಡ್ಡದು. ಮಹೇಶ, ಸಾಂಬಾರ್ ಇವತ್ತೂ ಬಿಸಿ ಇದೆ, ನೋಡಿದೆ.
    tr: Iḍī ūralli gyās illa. Kelavu hōṭel-gaḷu bāgilē hākive. Ivaru tegedirōdē doḍḍadu. Mahēśa, sāmbār ivattū bisi ide, nōḍide.
    en: '(Another voice: the elderly walker from the cold-sambar morning) There''s no gas in the whole city. Some hotels have shut their doors altogether. That these people are open at all is something. Mahesha, the sambar is hot today too; I checked.'
  - who: sam
    t: ಮಹೇಶ್ ಅವರೇ, ನಿಮಗೆ ಏನಾದ್ರೂ ಸಹಾಯ ಬೇಕಾ? ಅಜ್ಜಿ ಹೇಳಿದ್ರು, ಮನೆ ಸಿಲಿಂಡರ್ ಬುಕಿಂಗ್‌ಗೂ ಈಗ ತುಂಬಾ ದಿನ ಕಾಯಬೇಕಂತೆ. ಅವರು ಇಡ್ಲಿ ಹಿಟ್ಟು ಮನೆಯಲ್ಲಿ ಮಾಡ್ತಿಲ್ಲ, ಇನ್ಮೇಲೆ ದಿನಾ ನಿಮ್ಮ ಪಾರ್ಸೆಲ್.
    tr: Mahēś avarē, nimage ēnādrū sahāya bēkā? Ajji hēḷidru, mane silinḍar bukiṅg-gū īga tumbā dina kāyabēkante. Avaru iḍli hiṭṭu maneyalli māḍtilla, inmēle dinā nimma pārsel.
    en: Mahesh, do you need any help? Ajji says that even for household cylinders you have to wait many days for a booking now. She's not making idli batter at home; from now on, it's your parcel every day.
  - who: mahesh
    t: 'ಇದೇ ಸಹಾಯ ಸ್ಯಾಮ್. ದಿನಾ ಬನ್ನಿ, ಅಜ್ಜಿಗೆ ಹೇಳಿ: ಚಟ್ನಿ ಜಾಸ್ತಿ, ಯಾವಾಗ್ಲೂ.'
    tr: 'Idē sahāya Syām. Dinā banni, ajjige hēḷi: chaṭni jāsti, yāvāglū.'
    en: 'That is the help, Sam. Come every day, and tell Ajji: extra chutney, always.'
  - section: Nobody will be sent home
    learn: 'staff worries: ūrige kaḷistāra?, sambaḷa baruttā?, kelasa uḷiyuttā? · reassurance with conditions: … ādrū, … kaḷisalla; … tanaka · deferring pay with dignity: mundina tingaḷige iḍi, baḍḍi samēta vāpas · Bihu, Rongāli Bihu'
  - scene: Friday, 20 March, 9:30 p.m. After closing. The staff eat dinner sitting on the kitchen floor. Mahesh sits down with them, plate in hand.
  - who: helper
    t: ಸಾಹೇಬ್ರ, ಒಂದು ಮಾತು ಕೇಳ್ಬೇಕಿತ್ರಿ. ಹುಬ್ಬಳ್ಳಿಯೊಳಗ ನನ್ನ ಗೆಳ್ಯಾನ ಹೋಟೆಲ್ ಬಂದ್ ಆಗೇತಿ. ಎಲ್ಲಾರ್ನೂ ಪಗಾರ ಇಲ್ಲದ ಊರಿಗೆ ಕಳಿಸ್ಯಾರ. ನಮ್ಮನ್ನೂ ಕಳಿಸ್ತೀರೇನ್ರಿ?
    tr: Sāhēbra, ondu mātu kēḷbēkitri. Hubbaḷḷiyoḷaga nanna geḷyāna hōṭel band āgēti. Ellārnū pagāra illada ūrige kaḷisyāra. Nammannū kaḷistīrēnri?
    en: Sir, I wanted to ask you something. My friend's hotel in Hubballi has shut. They've sent everyone home without wages. Will you send us home too?
  - who: mahesh
    t: ಇಲ್ಲ. ಎಲ್ರೂ ಕೇಳಿ. ಈ ತಿಂಗಳು ಕಲೆಕ್ಷನ್ ಮೂವತ್ತು ಪರ್ಸೆಂಟ್‌ಗಿಂತ ಜಾಸ್ತಿ ಕಮ್ಮಿ ಆಗಿದೆ. ನಷ್ಟ ಆಗ್ತಿದೆ, ಸುಳ್ಳು ಹೇಳಲ್ಲ. ಆದ್ರೂ ಮಾರ್ಚ್ ಸಂಬಳ ಪೂರ್ತಿ, ಏಪ್ರಿಲ್ ಒಂದನೇ ತಾರೀಖು. ಅಂಗಡಿ ತೆರೆದಿರೋ ತನಕ ಯಾರನ್ನೂ ಕೆಲಸದಿಂದ ತೆಗೆಯಲ್ಲ.
    tr: Illa. Ellrū kēḷi. Ī tingaḷu kalekṣan mūvattu parsenṭ-ginta jāsti kammi āgide. Naṣṭa āgtide, suḷḷu hēḷalla. Ādrū Mārch sambaḷa pūrti, Ēpril ondanē tārīkhu. Aṅgaḍi teredirō tanaka yārannū kelasadinda tegeyalla.
    en: No. Everyone, listen. This month the takings are down by more than thirty percent. We're losing money; I won't lie. Even so, March salaries in full, on the first of April. As long as this shop is open, nobody loses their job.
  - who: cashier
    t: ಸಾರ್, ಜನ ಕಮ್ಮಿ ಇದ್ದಾಗ ನಾನು ಒಂದು ಗಂಟೆ ಬೇಗ ಹೋಗಬಹುದು. ಆ ಗಂಟೆಯ ಸಂಬಳ ಕಟ್ ಮಾಡಿ. ನನಗೆ ಬೇಜಾರಿಲ್ಲ.
    tr: Sār, jana kammi iddāga nānu ondu gaṇṭe bēga hōgabahudu. Ā gaṇṭeya sambaḷa kaṭ māḍi. Nanage bējārilla.
    en: Sir, when there are fewer people I can leave an hour early. Cut that hour's pay. I don't mind.
  - who: mahesh
    t: ಬೇಡ ಲತಾ. ಆ ಒಂದು ಗಂಟೆಯಲ್ಲಿ ಕೌಂಟರ್‌ನಲ್ಲಿ ನಿಂತು ಗಿರಾಕಿಗಳಿಗೆ ಮೆನು ಯಾಕೆ ಚಿಕ್ಕದಾಗಿದೆ ಅಂತ ಹೇಳಿ. ನಿಮ್ಮ ಮಾತು ಕೇಳಿದ ಮೇಲೆ ಜನ ಕೋಪದಿಂದ ಹೋಗಲ್ಲ, ನಗ್ತಾ ಹೋಗ್ತಾರೆ.
    tr: Bēḍa Latā. Ā ondu gaṇṭeyalli kauṇṭar-nalli nintu girākigaḷige menu yāke chikkadāgide anta hēḷi. Nimma mātu kēḷida mēle jana kōpadinda hōgalla, nagtā hōgtāre.
    en: No, Latha. Use that hour standing at the counter and telling customers why the menu is short. After they've heard you, people don't leave angry; they leave smiling.
  - who: cook
    t: ನನ್ನ ಸಂಬಳದಲ್ಲಿ ಹತ್ತು ಸಾವಿರ ಮುಂದಿನ ತಿಂಗಳಿಗೆ ಇಡಿ. ಇದು ದಾನ ಅಲ್ಲ, ಸಾಲ. ಗ್ಯಾಸ್ ಬಂದ್ಮೇಲೆ ವಾಪಸ್ ಕೊಡಿ. ಈ ಹುಡುಗರ ಸಂಬಳ ಮಾತ್ರ ಒಂದು ರೂಪಾಯಿನೂ ಕಮ್ಮಿ ಆಗಬಾರದು.
    tr: Nanna sambaḷadalli hattu sāvira mundina tingaḷige iḍi. Idu dāna alla, sāla. Gyās bandmēle vāpas koḍi. Ī huḍugara sambaḷa mātra ondu rūpāyinū kammi āgabāradu.
    en: Keep ten thousand of my salary for next month. It's not charity; it's a loan. Pay it back when the gas returns. But these boys' wages must not be one rupee short.
  - who: mahesh
    t: ಶಂಕರಣ್ಣ… ಆಯ್ತು. ಮೇ ತಿಂಗಳ ಸಂಬಳದ ಜೊತೆ, ಬಡ್ಡಿ ಸಮೇತ. ಕಾವ್ಯ ಲೆಕ್ಕದಲ್ಲಿ ಬರೀತಾಳೆ.
    tr: Śaṅkaraṇṇa… āytu. Mē tingaḷa sambaḷada jote, baḍḍi samēta. Kāvya lekkadalli barītāḷe.
    en: Shankara-anna… all right. With May's salary, with interest. Kavya will write it in the books.
  - who: cook
    t: ಬಡ್ಡಿ ಬೇಡ ಮಾರಾಯ್ರೆ. ಗ್ಯಾಸ್ ಬಂದ ದಿನ ನನ್ನ ಕಾವಲಿ ಮೇಲೆ ಮೊದಲ ದೋಸೆ ನಿಮ್ಮ ಅಮ್ಮನಿಗೆ. ಅದೇ ಬಡ್ಡಿ.
    tr: Baḍḍi bēḍa mārāyre. Gyās banda dina nanna kāvali mēle modala dōse nimma ammanige. Adē baḍḍi.
    en: No interest, my friend. The day the gas comes back, the first dosa off my griddle goes to your mother. That's the interest.
  - who: dev
    t: ಸಾರ್… ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಬಿಹು. ನಮ್ಮ ಹೊಸ ವರ್ಷ. ಎರಡು ವರ್ಷದಿಂದ ಮನೆಗೆ ಹೋಗಿಲ್ಲ. ಹೋದ್ರೆ… ವಾಪಸ್ ಬಂದಾಗ ಕೆಲಸ ಇರುತ್ತಾ?
    tr: Sār… Ēpril-nalli Bihu. Namma hosa varṣa. Eraḍu varṣadinda manege hōgilla. Hōdre… vāpas bandāga kelasa iruttā?
    en: Sir… in April it's Bihu. Our new year. I haven't been home for two years. If I go… will there be a job when I come back?
  - who: mahesh
    t: 'ನಿಯಮ ನೆನಪಿದೆಯಾ? ಹದಿನೈದು ದಿನ ಮುಂಚೆ ಹೇಳಬೇಕು. ನೀನು ಈಗಲೇ ಹೇಳ್ತಿದೀಯ, ಮೂರು ವಾರ ಮುಂಚೆ. ಹೋಗು. ಕೆಲಸ ಇಲ್ಲೇ ಇರುತ್ತೆ. ಆದ್ರೆ ಒಂದು ಕಂಡೀಷನ್: ವಾಪಸ್ ಬಂದಾಗ ಅಮ್ಮನಿಗೆ ಅಸ್ಸಾಂ ಟೀ ತರಬೇಕು.'
    tr: 'Niyama nenapideyā? Hadinaidu dina muñche hēḷabēku. Nīnu īgalē hēḷtidīya, mūru vāra muñche. Hōgu. Kelasa illē irutte. Ādre ondu kaṇḍīṣan: vāpas bandāga ammanige Assām ṭī tarabēku.'
    en: 'Remember the rule? Tell us fifteen days ahead. You''re telling me now, three weeks ahead. Go. The job will be right here. But one condition: when you come back, you bring Amma some Assam tea.'
  - who: dev
    t: 'ಎರಡು ಕೆಜಿ ತರ್ತೀನಿ! ಮತ್ತೆ… ಸಾರ್, ನಾನು ನೂರರವರೆಗೆ ಎಣಿಸ್ತೀನಿ, ಕೇಳಿ: ತೊಂಬತ್ತೇಳು, ತೊಂಬತ್ತೆಂಟು, ತೊಂಬತ್ತೊಂಬತ್ತು, ನೂರು!'
    tr: 'Eraḍu keji tartīni! Matte… sār, nānu nūraravarege eṇistīni, kēḷi: tombattēḷu, tombatteṇṭu, tombattombattu, nūru!'
    en: 'I''ll bring two kilos! And… sir, I can count to a hundred now, listen: ninety-seven, ninety-eight, ninety-nine, a hundred!'
  - who: helper
    t: ಶಭಾಷ್ ದೇವ್! ನನಗಿಂತ ಚೊಲೋ ಹೇಳ್ತಿ ನೀನು.
    tr: Śabhāṣ Dēv! Nanaginta cholō hēḷti nīnu.
    en: Shabash, Dev! You say it better than I do.
  - section: Two in the morning
    learn: 'doubt and counterfactuals: kelasa biḍade iddidre…, … bartittu, … irtiralilla · family pressure: oḷḷe kelasa biṭṭu hōṭel yāke?, nālku jana ēnantāre? · planning in scenarios: … bandre, … baradidre, āga mātra · support: nāviddīvi, dhairyavāgiru'
  - scene: Wednesday, 25 March, 2 a.m. The bedroom light is off; the street light comes through the curtain. Mahesh is lying awake. Kavya turns over.
  - who: mahesh
    t: ಕಾವ್ಯ, ಎದ್ದಿದೀಯಾ? ನಿದ್ದೆ ಬರ್ತಿಲ್ಲ. ನಾನು ಕೆಲಸ ಬಿಡದೆ ಇದ್ದಿದ್ರೆ ಈ ತಿಂಗಳೂ ಸಂಬಳ ಬರ್ತಿತ್ತು, ಇಎಂಐ ಇರ್ತಿರಲಿಲ್ಲ, ಅಮ್ಮ ದಿನಾ ನಾಲ್ಕೂವರೆಗೆ ಏಳ್ತಿರಲಿಲ್ಲ.
    tr: Kāvya, eddidīyā? Nidde bartilla. Nānu kelasa biḍade iddidre ī tingaḷū sambaḷa bartittu, ī-em-ai irtiralilla, amma dinā nālkūvarege ēḷtiralilla.
    en: Kavya, are you awake? I can't sleep. If I hadn't quit my job, a salary would have come this month too, there'd be no EMI, and Amma wouldn't be getting up at half past four every day.
  - who: kavya
    t: ಮತ್ತೆ ನೀನು ಆ ಹೋಟೆಲ್‌ನಲ್ಲಿ ಬೇರೆಯವರ ಲಾಭಕ್ಕೆ ಕೆಲಸ ಮಾಡ್ತಿದ್ದೆ, ಪ್ರತಿ ರಾತ್ರಿ ‘ನನ್ನದೇ ಒಂದು ಅಂಗಡಿ ಇದ್ದಿದ್ರೆ…’ ಅಂತ ಹೇಳ್ತಿದ್ದೆ. ಅದನ್ನೂ ಲೆಕ್ಕಕ್ಕೆ ಸೇರಿಸು.
    tr: Matte nīnu ā hōṭel-nalli bēreyavara lābhakke kelasa māḍtidde, prati rātri ‘nannadē ondu aṅgaḍi iddidre…’ anta hēḷtidde. Adannū lekkakke sērisu.
    en: And you'd be working for someone else's profit at that hotel, saying every night, ‘If only I had a shop of my own…’. Put that in the accounts too.
  - who: mahesh
    t: ಇವತ್ತು ಚಿಕ್ಕಪ್ಪ ಫೋನ್ ಮಾಡಿದ್ರು. ‘ಒಳ್ಳೆ ಕೆಲಸ ಬಿಟ್ಟು ಹೋಟೆಲ್ ಯಾಕೆ? ಈಗ ನೋಡು, ಗ್ಯಾಸೂ ಇಲ್ಲ. ನಾಲ್ಕು ಜನ ಏನಂತಾರೆ?’ ಅಂದ್ರು.
    tr: Ivattu chikkappa phōn māḍidru. ‘Oḷḷe kelasa biṭṭu hōṭel yāke? Īga nōḍu, gyāsū illa. Nālku jana ēnantāre?’ andru.
    en: My uncle phoned today. He said, ‘Why leave a good job for a hotel? Look at you now, not even gas. What will people say?’
  - who: kavya
    t: 'ನಾಲ್ಕು ಜನ ಏನಂತಾರೆ ಗೊತ್ತಾ? ನಿನ್ನೆ ಗೂಗಲ್‌ನಲ್ಲಿ ಒಬ್ಬರು ಬರೆದಿದ್ರು: ‘ಗ್ಯಾಸ್ ಇಲ್ಲದ ವಾರದಲ್ಲೂ ಇವರ ಇಡ್ಲಿ ರೇಟ್ ಏರಲಿಲ್ಲ.’ ಆ ನಾಲ್ಕು ಜನ ನನಗೆ ಸಾಕು.'
    tr: 'Nālku jana ēnantāre gottā? Ninne Gūgal-nalli obbaru baredidru: ‘Gyās illada vāradallū ivara iḍli rēṭ ēralilla.’ Ā nālku jana nanage sāku.'
    en: 'Do you know what people say? Yesterday someone wrote on Google: ‘Even in the week without gas, their idli price didn''t go up.’ Those are the people I care about.'
  - who: mahesh
    t: ಆದ್ರೆ ಏಪ್ರಿಲ್‌ನಲ್ಲೂ ಹೀಗೇ ಆದ್ರೆ? ಅಮ್ಮನ ಚಿನ್ನ…
    tr: Ādre Ēpril-nallū hīgē ādre? Ammana chinna…
    en: But what if April is like this too? Amma's gold…
  - who: kavya
    t: ನಾನು ಒಂದು ಶೀಟ್ ಮಾಡಿದೀನಿ. ಹೆದರಬೇಡ, ಚಿಕ್ಕದು. ಮೂರು ಸ್ಥಿತಿ. ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಗ್ಯಾಸ್ ಬಂದ್ರೆ, ಮೇ ತಿಂಗಳಲ್ಲಿ ಮತ್ತೆ ಬ್ರೇಕ್-ಈವನ್. ಮೇವರೆಗೆ ಬರದಿದ್ರೆ, ನಿತಿನ್‌ನ ಸಾಲ. ಜೂನ್‌ವರೆಗೂ ಬರದಿದ್ರೆ, ಆಗ ಮಾತ್ರ ಚಿನ್ನದ ಮಾತು. ಅಲ್ಲಿವರೆಗೆ ಆ ಪದ ಈ ಮನೆಯಲ್ಲಿ ಬೇಡ.
    tr: Nānu ondu śīṭ māḍidīni. Hedarabēḍa, chikkadu. Mūru sthiti. Ēpril-nalli gyās bandre, Mē tingaḷalli matte brēk-īvan. Mēvarege baradidre, Nitin-na sāla. Jūn-varegū baradidre, āga mātra chinnada mātu. Allivarege ā pada ī maneyalli bēḍa.
    en: I've made a sheet. Don't panic, it's a small one. Three scenarios. If the gas comes back in April, break-even again in May. If it doesn't come by May, Nitin's loan. If it still hasn't come by June, only then do we talk about the gold. Until then, that word isn't spoken in this house.
  - who: mahesh
    t: ಮೊದಲ ಸಲ ನಿನ್ನ ಶೀಟ್ ನೋಡಿ ಭಯ ಆಗ್ತಿಲ್ಲ.
    tr: Modala sala ninna śīṭ nōḍi bhaya āgtilla.
    en: For the first time, your spreadsheet doesn't scare me.
  - who: kavya
    t: ಒಳ್ಳೇದು. ಈಗ ಮಲಗು. ಎರಡೂವರೆ ಗಂಟೆಯಲ್ಲಿ ಶಂಕರಣ್ಣ ಇಂಡಕ್ಷನ್ ಮೇಲೆ ಸಾಂಬಾರ್ ಇಡ್ತಾರೆ. ನೀನು ಅಲ್ಲಿರಬೇಕು.
    tr: Oḷḷēdu. Īga malagu. Eraḍūvare gaṇṭeyalli Śaṅkaraṇṇa inḍakṣan mēle sāmbār iḍtāre. Nīnu allirabēku.
    en: Good. Now sleep. In two and a half hours Shankara-anna puts the sambar on the induction. You need to be there.
  - who: amma
    t: ನಾನೂ ಎದ್ದಿದೀನಿ, ಗೋಡೆ ತೆಳ್ಳಗಿದೆ. ನೀವಿಬ್ರೂ ಮಲಗಿ. ನಾವಿದ್ದೀವಿ, ಧೈರ್ಯವಾಗಿರು ಮಹೇಶ.
    tr: Nānū eddidīni, gōḍe teḷḷagide. Nīvibrū malagi. Nāviddīvi, dhairyavāgiru Mahēśa.
    en: (From the next room) I'm awake too; the walls are thin. Both of you, go to sleep. We're here. Be brave, Mahesha.
  - section: Counting the loss
    learn: 'a bad month in numbers: kalekṣan … parsenṭ kammi, naṣṭa, uḷididdu · concessive: naṣṭa ādrū… · looking ahead with hedges: sudhārisabahudu antāre, bele ērutte anta echcharisidru, … anta mātu ide · ending a hard month: yāra hoṭṭegū mōsa māḍilla'
  - scene: Tuesday, 31 March 2026, 11 p.m. The last night of the financial year. Kavya's laptop, Nitin on a video call, Amma with a cup of coffee she isn't drinking.
  - who: kavya
    t: ಮಾರ್ಚ್ ಲೆಕ್ಕ. ಕಲೆಕ್ಷನ್ ಮೂರು ಲಕ್ಷ ತೊಂಬತ್ತು ಸಾವಿರ. ಫೆಬ್ರವರಿಗಿಂತ ಮೂವತ್ಮೂರು ಪರ್ಸೆಂಟ್ ಕಮ್ಮಿ. ಅಸೋಸಿಯೇಷನ್ ಇಪ್ಪತ್ತೈದರಿಂದ ಮೂವತ್ತು ಪರ್ಸೆಂಟ್ ನಷ್ಟ ಅಂತ ಅಂದಾಜು ಮಾಡಿತ್ತು. ನಾವು ಅದಕ್ಕಿಂತ ಸ್ವಲ್ಪ ಕೆಟ್ಟದಾಗಿದೀವಿ.
    tr: Mārch lekka. Kalekṣan mūru lakṣa tombattu sāvira. Phebravariginta mūvatmūru parsenṭ kammi. Asōsiyēṣan ippattaidarinda mūvattu parsenṭ naṣṭa anta andāju māḍittu. Nāvu adakkinta svalpa keṭṭadāgidīvi.
    en: 'March''s accounts. Takings: three lakh ninety thousand. Thirty-three percent less than February. The association had estimated losses of twenty-five to thirty percent. We''re doing a little worse than that.'
  - who: kavya
    t: 'ಖರ್ಚು: ಸಾಮಾನು ಕಮ್ಮಿ ತಗೊಂಡಿದ್ರಿಂದ ಒಂದು ಲಕ್ಷ ನಲವತ್ತೈದು. ಸ್ಟಾಫ್ ಪೂರ್ತಿ, ಎಂಬತ್ತೆಂಟು, ಶಂಕರಣ್ಣನ ಹತ್ತು ಸಾವಿರ ಸಾಲವಾಗಿ ಬಾಕಿ. ರೆಂಟ್ ಒಂದು ಲಕ್ಷ. ಗ್ಯಾಸ್ ಹತ್ತೊಂಬತ್ತು ಸಾವಿರ. ಇಂಡಕ್ಷನ್ ಬಾಡಿಗೆ ಎಂಟು. ಕರೆಂಟ್ ಬಿಲ್ ಎರಡು ಪಟ್ಟಿಗಿಂತ ಜಾಸ್ತಿ, ಮೂವತ್ತೆಂಟು. ಬ್ಯಾಂಕ್ ಬಡ್ಡಿ, ಜಿಎಸ್‌ಟಿ, ಉಳಿದದ್ದು ಸೇರಿ ಒಟ್ಟು ನಾಲ್ಕು ಲಕ್ಷ ಐವತ್ತೆಂಟು.'
    tr: 'Kharchu: sāmānu kammi tagoṇḍidrinda ondu lakṣa nalavattaidu. Sṭāf pūrti, embatteṇṭu, Śaṅkaraṇṇana hattu sāvira sālavāgi bāki. Renṭ ondu lakṣa. Gyās hattombattu sāvira. Inḍakṣan bāḍige eṇṭu. Kareṇṭ bil eraḍu paṭṭiginta jāsti, mūvatteṇṭu. Byāṅk baḍḍi, ji-es-ṭi, uḷidaddu sēri oṭṭu nālku lakṣa aivatteṇṭu.'
    en: 'Expenses: since we bought less stock, one lakh forty-five. Staff in full, eighty-eight, with Shankara-anna''s ten thousand owed to him as a loan. Rent, one lakh. Gas, nineteen thousand. Induction rental, eight. The electricity bill more than doubled: thirty-eight. With the bank interest, GST and the rest, four lakh fifty-eight in all.'
  - who: mahesh
    t: ಅರವತ್ತೆಂಟು ಸಾವಿರ ನಷ್ಟ.
    tr: Aravatteṇṭu sāvira naṣṭa.
    en: A loss of sixty-eight thousand.
  - who: kavya
    t: ಹೌದು. ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಉಳಿದಿರೋದು ಒಂದು ಲಕ್ಷ ಹನ್ನೆರಡು ಸಾವಿರ. ಏಪ್ರಿಲ್ ಒಂದಕ್ಕೆ ಸಂಬಳ, ಐದಕ್ಕೆ ರೆಂಟ್. ಎರಡೂ ಕೊಟ್ಟ ಮೇಲೆ ಕೈಯಲ್ಲಿ ಬಹುತೇಕ ಏನೂ ಇರಲ್ಲ. ಇನ್ನೊಂದು ತಿಂಗಳು ಹೀಗೇ ಆದ್ರೆ…
    tr: Haudu. Byāṅk-nalli uḷidirōdu ondu lakṣa hanneraḍu sāvira. Ēpril ondakke sambaḷa, aidakke renṭ. Eraḍū koṭṭa mēle kaiyalli bahutēka ēnū iralla. Innondu tingaḷu hīgē ādre…
    en: Yes. What's left in the bank is one lakh twelve thousand. Salaries on the first of April, rent on the fifth. Once both are paid, there's almost nothing in hand. If another month goes like this…
  - who: nitin
    t: ನಾನು ಇನ್ನೂ ಎರಡು ಲಕ್ಷ ಹಾಕಬಹುದು, ಸಾಲವಾಗಿ, ಡೀಡ್‌ನಲ್ಲಿ ಬರೆದು. ದೊಡ್ಡಮ್ಮನ ಚಿನ್ನಕ್ಕೆ ಮುಂಚೆ ನನ್ನ ದುಡ್ಡು.
    tr: Nānu innū eraḍu lakṣa hākabahudu, sālavāgi, ḍīḍ-nalli baredu. Doḍḍammana chinnakke muñche nanna duḍḍu.
    en: I can put in two lakh more, as a loan, written into the deed. My money before Doddamma's gold.
  - who: kavya
    t: ಮೇ ತನಕ ಕಾಯೋಣ ಅಂದ್ಕೊಂಡಿದ್ದೆ, ಆದ್ರೆ ಲೆಕ್ಕ ಕಾಯಲ್ಲ. ಸರಿ ನಿತಿನ್, ನಾಳೆನೇ ಹಾಕು. ಸಾಲದ ಪತ್ರ ನಾನು ಬರೆದು ಡೀಡ್‌ಗೆ ಸೇರಿಸ್ತೀನಿ. ಬಡ್ಡಿ ಇಲ್ಲ, ಆದ್ರೆ ವಾಪಸ್ ಕೊಡೋ ತಾರೀಖು ಬರೆದೇ ಇರ್ಬೇಕು.
    tr: Mē tanaka kāyōṇa andkoṇḍidde, ādre lekka kāyalla. Sari Nitin, nāḷenē hāku. Sālada patra nānu baredu ḍīḍ-ge sēristīni. Baḍḍi illa, ādre vāpas koḍō tārīkhu baredē irbēku.
    en: I'd thought we could wait until May, but the numbers won't wait. All right, Nitin, put it in tomorrow. I'll write the loan letter and attach it to the deed. No interest, but the repayment date has to be written down.
  - who: amma
    t: ನಷ್ಟ ಆದ್ರೂ ನನಗೆ ಒಂದು ಸಮಾಧಾನ ಇದೆ. ಈ ತಿಂಗಳು ನಾವು ಯಾರ ಹೊಟ್ಟೆಗೂ ಮೋಸ ಮಾಡಿಲ್ಲ. ಹುಡುಗರ ಸಂಬಳ ನಿಂತಿಲ್ಲ, ಕದ್ದ ಸಿಲಿಂಡರ್ ಅಂಗಡಿಗೆ ಬಂದಿಲ್ಲ, ಇಡ್ಲಿ ರೇಟ್ ಏರಿಲ್ಲ. ದೇವರು ನೋಡ್ತಾನೆ.
    tr: Naṣṭa ādrū nanage ondu samādhāna ide. Ī tingaḷu nāvu yāra hoṭṭegū mōsa māḍilla. Huḍugara sambaḷa nintilla, kadda silinḍar aṅgaḍige bandilla, iḍli rēṭ ērilla. Dēvaru nōḍtāne.
    en: Even with the loss, I have one comfort. This month we cheated nobody's stomach. The boys' wages didn't stop, no stolen cylinder came into the shop, the idli price didn't go up. God is watching.
  - who: kavya
    t: 'ದೇವರ ಜೊತೆ ಸಿಎ ಆಫೀಸ್ ಕೂಡ ನೋಡ್ತಿದೆ, ಅಮ್ಮ. ಅಲ್ಲಿ ಇನ್ನೊಂದು ಮಾತು ಓಡಾಡ್ತಿದೆ: ಸರ್ಕಾರ ಕನಿಷ್ಠ ವೇತನ ಪರಿಷ್ಕರಣೆ ಮಾಡುತ್ತಂತೆ, ತುಂಬಾ ದೊಡ್ಡ ಏರಿಕೆ ಅಂತ. ಇನ್ನೂ ಏನೂ ಖಚಿತ ಇಲ್ಲ.'
    tr: 'Dēvara jote si-e āphīs kūḍa nōḍtide, amma. Alli innondu mātu ōḍāḍtide: sarkāra kaniṣṭha vētana pariṣkaraṇe māḍuttante, tumbā doḍḍa ērike anta. Innū ēnū khachita illa.'
    en: 'Along with God, the CA''s office is watching too, Amma. Another rumour is going round there: the government is going to revise minimum wages, and it''s a very big increase, they say. Nothing is certain yet.'
  - scene: Mahesh's phone buzzes. Ashok. He puts it on speaker.
  - who: gas
    t: 'ಮಹೇಶ್ ಅವರೇ, ತಡ ರಾತ್ರಿ ಕ್ಷಮಿಸಿ. ಸಪ್ಲೈ ಸ್ವಲ್ಪ ಸುಧಾರಿಸ್ತಿದೆ. ನಾಳೆ ಬೆಳಗ್ಗೆ ನಾಲ್ಕು ಸಿಲಿಂಡರ್ ತರ್ತೀನಿ. ಆದ್ರೆ ಒಂದು ಎಚ್ಚರಿಕೆ: ಗ್ಯಾಸ್ ಬರುತ್ತೆ, ಬೆಲೆನೂ ಏರುತ್ತೆ. ಮುಂದಿನ ತಿಂಗಳುಗಳಲ್ಲಿ ದೊಡ್ಡ ಏರಿಕೆ ಬರಬಹುದು ಅಂತ ಕಂಪನಿಯವರೇ ಹೇಳ್ತಿದ್ದಾರೆ.'
    tr: 'Mahēś avarē, taḍa rātri kṣamisi. Saplai svalpa sudhāristide. Nāḷe beḷagge nālku silinḍar tartīni. Ādre ondu echcharike: gyās barutte, belenū ērutte. Mundina tingaḷugaḷalli doḍḍa ērike barabahudu anta kampaniyavarē hēḷtiddāre.'
    en: 'Mahesh, sorry for calling so late. Supply is improving a little. I''ll bring four cylinders tomorrow morning. But a warning: the gas is coming back, and so is the price going up. The company people themselves say a big increase may come in the next few months.'
  - who: mahesh
    t: ನಾಲ್ಕು ಸಿಲಿಂಡರ್… ಅಮ್ಮ, ನಾಳೆ ಬೆಳಗ್ಗೆ ಆರು ಗಂಟೆಗೆ ಅಂಗಡಿಗೆ ಬಾ. ಶಂಕರಣ್ಣನ ಕಾವಲಿಯ ಮೊದಲ ದೋಸೆ ನಿನಗೆ. ಅದು ಅವರ ಬಡ್ಡಿ.
    tr: Nālku silinḍar… Amma, nāḷe beḷagge āru gaṇṭege aṅgaḍige bā. Śaṅkaraṇṇana kāvaliya modala dōse ninage. Adu avara baḍḍi.
    en: Four cylinders… Amma, come to the shop at six tomorrow morning. The first dosa off Shankara-anna's griddle is yours. That's his interest.
  - who: amma
    t: ಬರ್ತೀನಿ. ಚಟ್ನಿ ನಾನೇ ತರ್ತೀನಿ.
    tr: Bartīni. Chaṭni nānē tartīni.
    en: I'll come. I'll bring the chutney myself.
  - chapter: Chapter 8 — Wages and the apps
  - section: Nine hundred and ninety-three rupees
    learn: 'a price shock: ondē sala … jāsti, ērike, hosa rēṭ · monthly sums: tingaḷige … āgutte · keeping promises: bāki tīrisu, mātu koṭṭante, ondu tingaḷu muñchenē · a gift from Assam: Assām ṭī, Bihu'
  - scene: Friday, 1 May 2026, 6 a.m. The gas has been flowing normally since mid-April and the induction units have gone back. Ashok's auto stops by the iron cage with four cylinders. Dev, back from Assam, is wiping the counter; Amma has just arrived with the chutney.
  - who: gas
    t: ಮಹೇಶ್ ಅವರೇ, ಮಾರ್ಚ್ ಕೊನೆಯಲ್ಲಿ ನಾನು ಹೇಳಿದ್ದು ನೆನಪಿದೆಯಾ? ಇವತ್ತಿಂದ ಕಮರ್ಷಿಯಲ್ ಸಿಲಿಂಡರ್ ಒಂದಕ್ಕೆ ಒಂಬೈನೂರ ತೊಂಬತ್ಮೂರು ರೂಪಾಯಿ ಜಾಸ್ತಿ. ಒಂದೇ ಸಲ. ಬಿಲ್ ನೋಡಿ.
    tr: Mahēś avarē, Mārch koneyalli nānu hēḷiddu nenapideyā? Ivattinda kamarṣiyal silinḍar ondakke ombainūra tombatmūru rūpāyi jāsti. Ondē sala. Bil nōḍi.
    en: Mahesh, remember what I told you at the end of March? From today a commercial cylinder costs nine hundred and ninety-three rupees more. In one go. Look at the bill.
  - who: mahesh
    t: ಒಂಬೈನೂರ ತೊಂಬತ್ಮೂರು? ಅಂದ್ರೆ ಸುಮಾರು ಸಾವಿರ. ನಾವು ತಿಂಗಳಿಗೆ ನಲವತ್ತೈದು ಸಿಲಿಂಡರ್ ಉರಿಸ್ತೀವಿ. ಅಂದ್ರೆ ತಿಂಗಳಿಗೆ ನಲವತ್ತೈದು ಸಾವಿರ ಜಾಸ್ತಿ ಖರ್ಚು. ಇಡ್ಲಿ ರೇಟ್ ಮಾತ್ರ ಅದೇ ನಲವತ್ತು.
    tr: Ombainūra tombatmūru? Andre sumāru sāvira. Nāvu tingaḷige nalavattaidu silinḍar uristīvi. Andre tingaḷige nalavattaidu sāvira jāsti kharchu. Iḍli rēṭ mātra adē nalavattu.
    en: Nine hundred and ninety-three? That's nearly a thousand. We burn forty-five cylinders a month. So forty-five thousand more in costs every month. And the idli is still the same forty.
  - who: gas
    t: ಗೊತ್ತು. ನನ್ನ ಎಲ್ಲಾ ಹೋಟೆಲ್ ಗಿರಾಕಿಗಳೂ ಇವತ್ತು ಇದೇ ಲೆಕ್ಕ ಮಾಡ್ತಿದ್ದಾರೆ. ಈ ರೇಟ್ ಪ್ರತಿ ತಿಂಗಳು ಒಂದನೇ ತಾರೀಖು ಬದಲಾಗುತ್ತೆ. ಮುಂದೆ ಇಳಿದ್ರೂ ಇಳೀಬಹುದು. ಆದ್ರೆ ನಾನಂತೂ ಕಾಯ್ಕೊಂಡು ಕೂರಲ್ಲ.
    tr: Gottu. Nanna ellā hōṭel girākigaḷū ivattu idē lekka māḍtiddāre. Ī rēṭ prati tingaḷu ondanē tārīkhu badalāgutte. Munde iḷidrū iḷībahudu. Ādre nānantū kāykoṇḍu kūralla.
    en: I know. All my hotel customers are doing the same sum today. This rate changes on the first of every month. It may come down later. But I wouldn't sit around waiting for it.
  - who: mahesh
    t: ಸಿಲಿಂಡರ್ ಇಳಿಸಿ ಅಶೋಕ್. ಗ್ಯಾಸ್ ಇಲ್ಲದ ದಿನಕ್ಕಿಂತ ದುಬಾರಿ ಗ್ಯಾಸ್ ವಾಸಿ. ಮಾರ್ಚ್ ತಿಂಗಳು ಅದನ್ನ ಕಲಿಸಿದೆ.
    tr: Silinḍar iḷisi Aśōk. Gyās illada dinakkinta dubāri gyās vāsi. Mārch tingaḷu adanna kaliside.
    en: Unload the cylinders, Ashok. Expensive gas is better than days without gas. March taught us that.
  - who: dev
    t: ಅಮ್ಮ, ಇದು ನಿಮಗೆ. ಅಸ್ಸಾಂ ಟೀ, ಎರಡು ಕೆಜಿ. ನಮ್ಮ ಊರಿನ ತೋಟದ್ದು. ನನ್ನ ಅಮ್ಮ ಕಳಿಸಿದ್ದು. ‘ಮಗನಿಗೆ ಕೆಲಸ ಕೊಟ್ಟ ಮನೆಗೆ’ ಅಂತ ಹೇಳಿದ್ರು.
    tr: Amma, idu nimage. Assām ṭī, eraḍu keji. Namma ūrina tōṭaddu. Nanna amma kaḷisiddu. ‘Maganige kelasa koṭṭa manege’ anta hēḷidru.
    en: Amma, this is for you. Assam tea, two kilos. From a garden in my village. My mother sent it. She said, ‘For the house that gave my son work.’
  - who: amma
    t: ಅಯ್ಯೋ, ಎರಡು ಕೆಜಿ! ನಿನ್ನ ಅಮ್ಮನಿಗೆ ನನ್ನ ನಮಸ್ಕಾರ ಹೇಳು. ಮುಂದಿನ ಸಲ ಹೋಗುವಾಗ ನನ್ನ ಕೈಯ ಚಟ್ನಿಪುಡಿ ತಗೊಂಡು ಹೋಗು. ಬಿಹು ಹೇಗಿತ್ತು?
    tr: Ayyō, eraḍu keji! Ninna ammanige nanna namaskāra hēḷu. Mundina sala hōguvāga nanna kaiya chaṭnipuḍi tagoṇḍu hōgu. Bihu hēgittu?
    en: Oh my, two kilos! Give your mother my namaskara. Next time you go, take some chutney powder made by my own hands. How was Bihu?
  - who: dev
    t: ತುಂಬಾ ಚೆನ್ನಾಗಿತ್ತು. ಆದ್ರೆ ಒಂದು ತಮಾಷೆ. ನನ್ನ ತಂಗಿ ‘ನೀನು ಕನಸಲ್ಲೂ ಕನ್ನಡ ಮಾತಾಡ್ತೀಯ’ ಅಂದ್ಲು. ರಾತ್ರಿ ನಿದ್ದೆಯಲ್ಲಿ ‘ಟೋಕನ್ ನಲವತ್ತೆರಡು, ದೋಸೆ ರೆಡಿ!’ ಅಂತ ಕೂಗಿದ್ನಂತೆ.
    tr: Tumbā chennāgittu. Ādre ondu tamāṣe. Nanna taṅgi ‘nīnu kanasallū Kannaḍa mātāḍtīya’ andlu. Rātri niddeyalli ‘ṭōkan nalavatteraḍu, dōse reḍi!’ anta kūgidnante.
    en: It was lovely. But one funny thing. My sister said, ‘You speak Kannada even in your dreams.’ Apparently I shouted in my sleep, ‘Token forty-two, dosa ready!’
  - scene: In the kitchen, Basavaraj is pouring dosas on the griddle under Shankara's eye. Mahesh hands Shankara an envelope.
  - who: mahesh
    t: ಶಂಕರಣ್ಣ, ಇದು ನಿಮ್ಮ ಹತ್ತು ಸಾವಿರ. ಮೇ ಸಂಬಳದ ಜೊತೆ ಅಂತ ಹೇಳಿದ್ದೆ, ಒಂದು ತಿಂಗಳು ಮುಂಚೆನೇ ಕೊಡ್ತಿದೀನಿ. ಮತ್ತೆ ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ದಿನದ ಸರಾಸರಿ ಕಲೆಕ್ಷನ್ ಇಪ್ಪತ್ತೊಂದು ಸಾವಿರ ದಾಟಿದೆ. ಮಾತು ಕೊಟ್ಟಂತೆ, ಈ ತಿಂಗಳಿಂದ ನಿಮ್ಮ ಸಂಬಳ ಮೂವತ್ತೈದು.
    tr: Śaṅkaraṇṇa, idu nimma hattu sāvira. Mē sambaḷada jote anta hēḷidde, ondu tingaḷu muñchenē koḍtidīni. Matte Ēpril-nalli dinada sarāsari kalekṣan ippattondu sāvira dāṭide. Mātu koṭṭante, ī tingaḷinda nimma sambaḷa mūvattaidu.
    en: Shankara-anna, here's your ten thousand. I said with May's salary; I'm giving it a month early. And in April the average daily takings crossed twenty-one thousand. As promised, from this month your salary is thirty-five.
  - who: cook
    t: ಮಾತು ಉಳಿಸಿಕೊಳ್ಳೋ ಯಜಮಾನ ಸಿಗೋದು ಅಪರೂಪ, ಮಾರಾಯ್ರೆ. ಆದ್ರೆ ನನ್ನ ಸಂಬಳ ಏರಿದ್ರೆ ಸಾಲದು. ಈ ಹುಡುಗರು ಹದಿನಾಲ್ಕು-ಹದಿನೈದು ಸಾವಿರದಲ್ಲಿ ಬೆಂಗಳೂರಲ್ಲಿ ಹೇಗೆ ಬದುಕ್ತಾರೆ? ಅದನ್ನೂ ಯೋಚನೆ ಮಾಡಿ.
    tr: Mātu uḷisikoḷḷō yajamāna sigōdu aparūpa, mārāyre. Ādre nanna sambaḷa ēridre sāladu. Ī huḍugaru hadinālku-hadinaidu sāviradalli Beṅgaḷūralli hēge baduktāre? Adannū yōchane māḍi.
    en: An employer who keeps his word is rare, my friend. But my salary going up isn't enough. How do these boys live in Bengaluru on fourteen or fifteen thousand? Think about that too.
  - who: mahesh
    t: ಯೋಚನೆ ಮಾಡ್ತಿದೀನಿ. ಸರ್ಕಾರನೂ ಮಾಡ್ತಿದೆಯಂತೆ. ಕನಿಷ್ಠ ವೇತನದ ಹೊಸ ಆದೇಶ ಈ ತಿಂಗಳೇ ಬರಬಹುದು ಅಂತ ಕಾವ್ಯ ಹೇಳ್ತಿದ್ದಾಳೆ. ಅಂದಹಾಗೆ, ಬಸವರಾಜನ ದೋಸೆ ಹೇಗಿದೆ?
    tr: Yōchane māḍtidīni. Sarkāranū māḍtideyante. Kaniṣṭha vētanada hosa ādēśa ī tingaḷē barabahudu anta Kāvya hēḷtiddāḷe. Andahāge, Basavarājana dōse hēgide?
    en: I am thinking about it. So is the government, apparently. Kavya says the new minimum-wage order may come this very month. By the way, how are Basavaraj's dosas?
  - who: cook
    t: ಹತ್ತರಲ್ಲಿ ಏಳು ಗರಿಗರಿ. ಉಳಿದ ಮೂರು ಅವನೇ ತಿಂತಾನೆ. ಇನ್ನೊಂದು ತಿಂಗಳಲ್ಲಿ ಹತ್ತಕ್ಕೆ ಹತ್ತು.
    tr: Hattaralli ēḷu garigari. Uḷida mūru avanē tintāne. Innondu tingaḷalli hattakke hattu.
    en: Seven out of ten come out crisp. He eats the other three himself. Another month and it'll be ten out of ten.
  - who: helper
    t: ಹಂಗ ಹೇಳಬ್ಯಾಡ್ರಿ ಭಟ್ರೆ! ನಿನ್ನೆ ಎಂಟು ಆಗಿತ್ತು. ಸಾಹೇಬ್ರ, ನಿಮ್ಮ ದೋಸೆ ನಾನೇ ಹಾಕ್ತೀನಿ, ತಿಂದು ನೋಡ್ರಿ.
    tr: Haṅga hēḷabyāḍri Bhaṭre! Ninne eṇṭu āgittu. Sāhēbra, nimma dōse nānē hāktīni, tindu nōḍri.
    en: Don't say it like that, Bhattre! Yesterday it was eight. Sir, I'll make your dosa myself; taste it and see.
  - section: The order of 22 May
    learn: 'reading an order: ādēśa, kaniṣṭha vētana, valaya (zone), akuśala / arekuśala / ati kuśala · reported speech and hedging: … ante, kōrṭ-nalli arjigaḷu hōgive, sṭē bandrū barabahudu, tīrpu barōvarege · arrears: hindina tingaḷugaḷa bāki'
  - scene: Tuesday, 26 May, 10:30 p.m. At home. Kavya has the government notification open on her laptop. Nitin is on speaker; Amma is folding clothes.
  - who: kavya
    t: ಬಂತು. ಇಪ್ಪತ್ತೆರಡನೇ ತಾರೀಖಿನ ಆದೇಶ. ಎಂಬತ್ತೊಂದು ಉದ್ಯೋಗಗಳಿಗೆ ಹೊಸ ಕನಿಷ್ಠ ವೇತನ. ಸರಾಸರಿ ಸುಮಾರು ಅರವತ್ತು ಪರ್ಸೆಂಟ್ ಏರಿಕೆ. ಹೋಟೆಲ್‌ಗಳೂ ಅದರಲ್ಲಿ ಸೇರಿವೆ.
    tr: Bantu. Ippatteraḍanē tārīkhina ādēśa. Embattondu udyōgagaḷige hosa kaniṣṭha vētana. Sarāsari sumāru aravattu parsenṭ ērike. Hōṭel-gaḷū adaralli sērive.
    en: It's here. The order dated the twenty-second. New minimum wages for eighty-one kinds of employment. On average, a rise of about sixty percent. Hotels are included.
  - who: mahesh
    t: ಅರವತ್ತು ಪರ್ಸೆಂಟ್? ನಮ್ಮ ಹುಡುಗರಿಗೆ ಎಷ್ಟು ಆಗುತ್ತೆ? ನೇರವಾಗಿ ಹೇಳು.
    tr: Aravattu parsenṭ? Namma huḍugarige eṣṭu āgutte? Nēravāgi hēḷu.
    en: Sixty percent? What does it come to for our boys? Tell me straight.
  - who: kavya
    t: ಗ್ರೇಟರ್ ಬೆಂಗಳೂರು ವಲಯ. ಅಕುಶಲ, ಅಂದ್ರೆ ಅನ್‌ಸ್ಕಿಲ್ಡ್ ಕೆಲಸಗಾರರಿಗೆ ತಿಂಗಳಿಗೆ ಇಪ್ಪತ್ಮೂರು ಸಾವಿರದ ಮುನ್ನೂರ ಎಪ್ಪತ್ತಾರು. ಅತಿ ಕುಶಲ, ಹೆಡ್ ಕುಕ್ ಥರದವರಿಗೆ ಮೂವತ್ತೊಂದು ಸಾವಿರದ ನೂರ ಹದಿನಾಲ್ಕರವರೆಗೆ. ಶಂಕರಣ್ಣ ಈಗಾಗ್ಲೇ ಮೂವತ್ತೈದು, ಅವರ ಚಿಂತೆ ಇಲ್ಲ.
    tr: Grēṭar Beṅgaḷūru valaya. Akuśala, andre an-skilḍ kelasagārarige tingaḷige ippatmūru sāvirada munnūra eppattāru. Ati kuśala, heḍ kuk tharadavarige mūvattondu sāvirada nūra hadinālkaravarege. Śaṅkaraṇṇa īgāglē mūvattaidu, avara chinte illa.
    en: Greater Bengaluru zone. For unskilled workers, twenty-three thousand three hundred and seventy-six a month. For the highly skilled, people like a head cook, up to thirty-one thousand one hundred and fourteen. Shankara-anna is already on thirty-five, so no worry there.
  - who: mahesh
    t: ಬಸವರಾಜ ಹದಿನೈದು, ದೇವ್ ಹದಿನಾಲ್ಕು, ಲತಾ ಹದಿನಾರು. ಮೂವರೂ ಇಪ್ಪತ್ಮೂರೂವರೆ ಹತ್ರ ಹೋಗಬೇಕು. ಅಂದ್ರೆ… ತಿಂಗಳಿಗೆ ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಸಾವಿರ ಜಾಸ್ತಿ.
    tr: Basavarāja hadinaidu, Dēv hadinālku, Latā hadināru. Mūvarū ippatmūrūvare hatra hōgabēku. Andre… tingaḷige sumāru ippattaidu sāvira jāsti.
    en: Basavaraj is on fifteen, Dev fourteen, Latha sixteen. All three have to go to about twenty-three and a half. That means… roughly twenty-five thousand more a month.
  - who: kavya
    t: ಕನಿಷ್ಠ ಅಷ್ಟು. ಲತಾ ಕ್ಯಾಶಿಯರ್, ಅವಳ ಕೆಲಸ ಅರೆಕುಶಲ ವರ್ಗಕ್ಕೆ ಬರಬಹುದು, ಆಗ ಇನ್ನೂ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಭಟ್ ಸಾರ್‌ನ ಕೇಳ್ತೀನಿ. ಗ್ಯಾಸಿನ ನಲವತ್ತೈದು ಸೇರಿಸಿದ್ರೆ, ಪ್ರತಿ ತಿಂಗಳು ಎಪ್ಪತ್ತು ಸಾವಿರಕ್ಕಿಂತ ಜಾಸ್ತಿ ಹೊಸ ಖರ್ಚು.
    tr: Kaniṣṭha aṣṭu. Latā kyāśiyar, avaḷa kelasa arekuśala vargakke barabahudu, āga innū svalpa jāsti. Bhaṭ sār-na kēḷtīni. Gyāsina nalavattaidu sērisidre, prati tingaḷu eppattu sāvirakkinta jāsti hosa kharchu.
    en: At least that much. Latha is a cashier; her job may fall in the semi-skilled category, and then it's a bit more. I'll ask Mr. Bhat. Add the gas's forty-five and that's more than seventy thousand in new costs every month.
  - who: nitin
    t: 'ಒಂದು ನಿಮಿಷ. ನಮ್ಮ ಆಫೀಸ್ ಗ್ರೂಪ್‌ನಲ್ಲಿ ಒಬ್ಬ ಲಾಯರ್ ಫ್ರೆಂಡ್ ಹೇಳ್ತಿದ್ದ: ಈ ಆದೇಶದ ವಿರುದ್ಧ ಕೋರ್ಟ್‌ನಲ್ಲಿ ಅರ್ಜಿಗಳು ಹೋಗಿವೆಯಂತೆ. ಸ್ಟೇ ಬಂದ್ರೂ ಬರಬಹುದು. ಸ್ವಲ್ಪ ಕಾದು ನೋಡೋಣವಾ?'
    tr: 'Ondu nimiṣa. Namma āphīs grūp-nalli obba lāyar phreṇḍ hēḷtidda: ī ādēśada viruddha kōrṭ-nalli arjigaḷu hōgiveyante. Sṭē bandrū barabahudu. Svalpa kādu nōḍōṇavā?'
    en: One minute. A lawyer friend in our office group was saying that petitions have gone to court against this order. A stay might even come. Shall we wait and see a bit?
  - who: kavya
    t: ಹೋಟೆಲ್ ಅಸೋಸಿಯೇಷನ್ ಹೋಟೆಲ್‌ಗಳಿಗೆ ಬೇರೆ ದರ ಬೇಕು ಅಂತ ಕೇಳಿತ್ತು, ಸರ್ಕಾರ ಒಪ್ಪಲಿಲ್ಲ. ಕೋರ್ಟ್‌ನಲ್ಲಿ ಏನಾಗುತ್ತೋ ಯಾರಿಗೂ ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ತೀರ್ಪು ಬರೋವರೆಗೆ ಆದೇಶ ಆದೇಶವೇ. ಕಾದು, ಆಮೇಲೆ ಹಿಂದಿನ ತಿಂಗಳುಗಳ ಬಾಕಿ ಒಟ್ಟಿಗೆ ಕೊಡಬೇಕಾದ್ರೆ? ಅದು ಇನ್ನೂ ಕಷ್ಟ.
    tr: Hōṭel asōsiyēṣan hōṭel-gaḷige bēre dara bēku anta kēḷittu, sarkāra oppalilla. Kōrṭ-nalli ēnāguttō yārigū gottilla. Ādre tīrpu barōvarege ādēśa ādēśavē. Kādu, āmēle hindina tingaḷugaḷa bāki oṭṭige koḍabēkādre? Adu innū kaṣṭa.
    en: The hotel association asked for a separate rate for hotels, and the government refused. Nobody knows what will happen in court. But until there's a verdict, an order is an order. What if we wait and then have to pay all the past months' arrears at once? That's even harder.
  - who: nitin
    t: ಬೇರೆ ಹೋಟೆಲ್‌ನವರು ಏನು ಮಾಡ್ತಿದ್ದಾರೆ ಗೊತ್ತಾ? ಕೆಲವರು ಸ್ಟಾಫ್ ಕಮ್ಮಿ ಮಾಡ್ತೀವಿ ಅಂತಿದ್ದಾರೆ. ಕೆಲವರು ‘ಊಟ-ರೂಮ್ ಖರ್ಚು ಸಂಬಳದಲ್ಲೇ ಕಳೀತೀವಿ’ ಅಂತಿದ್ದಾರೆ.
    tr: Bēre hōṭel-navaru ēnu māḍtiddāre gottā? Kelavaru sṭāf kammi māḍtīvi antiddāre. Kelavaru ‘ūṭa-rūm kharchu sambaḷadallē kaḷītīvi’ antiddāre.
    en: Do you know what other hotels are doing? Some say they'll cut staff. Some say they'll deduct food and lodging from the wages.
  - who: mahesh
    t: 'ಕಾನೂನು ಒಂದು ಕಡೆ. ಇನ್ನೊಂದು ಕಡೆ ನಿಜ: ಬಸವರಾಜನ ತಂಗಿಯ ಕಾಲೇಜ್ ಫೀಸ್, ದೇವ್ ಊರಿಗೆ ಕಳಿಸೋ ದುಡ್ಡು. ಹದಿನಾಲ್ಕು ಸಾವಿರದಲ್ಲಿ ಬೆಂಗಳೂರಲ್ಲಿ ಬದುಕೋಕಾಗಲ್ಲ ಅಂತ ಶಂಕರಣ್ಣ ಹೇಳಿದ್ದು ಸರಿ. ಜೂನ್‌ನಿಂದ ಹೊಸ ಸಂಬಳ. ಕೋರ್ಟ್ ಏನೇ ಹೇಳಲಿ.'
    tr: 'Kānūnu ondu kaḍe. Innondu kaḍe nija: Basavarājana taṅgiya kālēj phīs, Dēv ūrige kaḷisō duḍḍu. Hadinālku sāviradalli Beṅgaḷūralli badukōkāgalla anta Śaṅkaraṇṇa hēḷiddu sari. Jūn-ninda hosa sambaḷa. Kōrṭ ēnē hēḷali.'
    en: 'The law is one side. On the other side is the truth: Basavaraj''s sister''s college fees, the money Dev sends home. Shankara-anna is right that nobody can live in Bengaluru on fourteen thousand. New salaries from June. Whatever the court says.'
  - who: nitin
    t: ಸರಿ, ಆದ್ರೆ ದುಡ್ಡು ಎಲ್ಲಿಂದ? ನ್ಯೂಸ್‌ನಲ್ಲಿ ಹೋಟೆಲ್‌ನವರು ‘ಅರವತ್ತು ಪರ್ಸೆಂಟ್ ರೇಟ್ ಏರಿಸ್ತೀವಿ, ಇಡ್ಲಿ ಎಂಬತ್ತು, ಮಸಾಲೆ ದೋಸೆ ನೂರೈವತ್ತು’ ಅಂತಿದ್ದಾರೆ.
    tr: Sari, ādre duḍḍu ellinda? Nyūs-nalli hōṭel-navaru ‘aravattu parsenṭ rēṭ ēristīvi, iḍli embattu, masāle dōse nūraivattu’ antiddāre.
    en: 'Fine, but where does the money come from? On the news, hoteliers are saying, ‘We''ll raise prices by sixty percent: idli eighty, masala dose a hundred and fifty.’'
  - who: amma
    t: ನೂರೈವತ್ತು ರೂಪಾಯಿಗೆ ಒಂದು ದೋಸೆ? ಆ ದುಡ್ಡಿಗೆ ನಮ್ಮ ಕಾಲದಲ್ಲಿ ಒಂದು ತಿಂಗಳ ತರಕಾರಿ ಬರ್ತಿತ್ತು.
    tr: Nūraivattu rūpāyige ondu dōse? Ā duḍḍige namma kāladalli ondu tingaḷa tarakāri bartittu.
    en: A hundred and fifty rupees for one dosa? In my day that money bought a month's vegetables.
  - who: kavya
    t: ಅದಕ್ಕೇ ಭಾನುವಾರ ರಾತ್ರಿ ಎರಡು ಮೀಟಿಂಗ್. ಮೊದಲು ಸ್ಟಾಫ್ ಜೊತೆ, ಆಮೇಲೆ ರೇಟ್ ಬಗ್ಗೆ. ನಾನು ಮೂರು ಆಯ್ಕೆ ರೆಡಿ ಮಾಡ್ತೀನಿ.
    tr: Adakkē bhānuvāra rātri eraḍu mīṭiṅg. Modalu sṭāf jote, āmēle rēṭ bagge. Nānu mūru āyke reḍi māḍtīni.
    en: That's why there are two meetings on Sunday night. First with the staff, then about prices. I'll get three options ready.
  - section: Mr. Bhat on the new wages
    learn: 'professional advice: vargakke bartāre, adhisūchane, nikhara aṅki, surakṣitavāgiru · compliance: apāyiṇṭmenṭ leṭar, sambaḷada slip, byāṅk mūlaka pāvati, nōṭis hāki · hedged legal talk: … sādhya irabahudu, ādre …, nānu innū ōdilla'
  - scene: Thursday, 28 May, 1:30 p.m. Kavya's lunch break at the CA firm. She knocks on Mr. Bhat's cabin; Mahesh is on speakerphone.
  - who: kavya
    t: ಸಾರ್, ಎರಡು ನಿಮಿಷ. ಹೊಸ ಕನಿಷ್ಠ ವೇತನದ ಆದೇಶ. ನಮ್ಮ ಕ್ಯಾಶಿಯರ್ ಲತಾ ಯಾವ ವರ್ಗಕ್ಕೆ ಬರ್ತಾಳೆ? ಅವಳು ಬಿಲ್ಲಿಂಗ್ ಮಷೀನ್, ಯುಪಿಐ, ಕ್ಯಾಶ್ ಲೆಕ್ಕ ಎಲ್ಲಾ ನೋಡ್ಕೋತಾಳೆ.
    tr: Sār, eraḍu nimiṣa. Hosa kaniṣṭha vētanada ādēśa. Namma kyāśiyar Latā yāva vargakke bartāḷe? Avaḷu billiṅg maśīn, yu-pi-ai, kyāś lekka ellā nōḍkōtāḷe.
    en: Sir, two minutes. The new minimum-wage order. Which category does our cashier Latha fall into? She handles the billing machine, UPI, the cash accounts, everything.
  - who: ca
    t: ಅವಳ ಕೆಲಸ ನೋಡಿದ್ರೆ ಅರೆಕುಶಲ ಅನ್ನಿಸುತ್ತೆ. ಆ ವರ್ಗದ ದರ ಅಕುಶಲಕ್ಕಿಂತ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಅಧಿಸೂಚನೆಯ ಟೇಬಲ್ ನೋಡಿ ನಿಖರ ಅಂಕಿ ಕಳಿಸ್ತೀನಿ. ಸಂದೇಹ ಇದ್ದಾಗ ಮೇಲಕ್ಕೆ ರೌಂಡ್ ಮಾಡಿ. ಕಮ್ಮಿ ಕೊಟ್ರೆ ನೋಟಿಸ್ ಬರುತ್ತೆ, ಸ್ವಲ್ಪ ಜಾಸ್ತಿ ಕೊಟ್ರೆ ಯಾರೂ ನೋಟಿಸ್ ಕೊಡಲ್ಲ.
    tr: Avaḷa kelasa nōḍidre arekuśala annisutte. Ā vargada dara akuśalakkinta svalpa jāsti. Adhisūchaneya ṭēbal nōḍi nikhara aṅki kaḷistīni. Sandēha iddāga mēlakke rauṇḍ māḍi. Kammi koṭre nōṭis barutte, svalpa jāsti koṭre yārū nōṭis koḍalla.
    en: From her work, I'd say semi-skilled. That category's rate is a little above unskilled. I'll check the table in the notification and send you the exact figure. When in doubt, round up. Pay less and you get a notice; pay a little more and nobody sends you one.
  - who: mahesh
    t: ಸಾರ್, ಬೇರೆ ಹೋಟೆಲ್‌ನವರು ಊಟ-ರೂಮ್ ಖರ್ಚನ್ನ ಸಂಬಳದಲ್ಲೇ ಕಳೀತೀವಿ ಅಂತಿದ್ದಾರೆ. ಅದು ಸರೀನಾ?
    tr: Sār, bēre hōṭel-navaru ūṭa-rūm kharchanna sambaḷadallē kaḷītīvi antiddāre. Adu sarīnā?
    en: Sir, other hotels say they'll deduct the cost of food and lodging from the wages. Is that right?
  - who: ca
    t: 'ಕೆಲವು ಸೌಲಭ್ಯಗಳ ಮೌಲ್ಯವನ್ನ ನಿಯಮದ ಪ್ರಕಾರ ಮಾತ್ರ ಲೆಕ್ಕಕ್ಕೆ ತಗೋಬಹುದು. ಅದಕ್ಕೆ ಮಿತಿ ಇದೆ, ಲಿಖಿತ ಒಪ್ಪಂದ ಬೇಕು. ಹೊಸ ಆದೇಶದಲ್ಲಿ ಅದರ ವಿವರ ನಾನು ಇನ್ನೂ ಪೂರ್ತಿ ಓದಿಲ್ಲ. ನನ್ನ ಸಲಹೆ: ಮಾಡಬೇಡಿ. ತಿಂಗಳ ಕೊನೆಗೆ ಅದೇ ಜಗಳಕ್ಕೆ ಕಾರಣ ಆಗುತ್ತೆ.'
    tr: 'Kelavu saulabhyagaḷa maulyavanna niyamada prakāra mātra lekkakke tagōbahudu. Adakke miti ide, likhita oppanda bēku. Hosa ādēśadalli adara vivara nānu innū pūrti ōdilla. Nanna salahe: māḍabēḍi. Tingaḷa konege adē jagaḷakke kāraṇa āgutte.'
    en: 'The value of certain benefits can be counted only as the rules allow. There are limits, and you need a written agreement. I haven''t fully read those details in the new order yet. My advice: don''t. At the end of the month, that''s exactly what starts fights.'
  - who: mahesh
    t: ಮಾಡಲ್ಲ ಸಾರ್. ಅದನ್ನ ಮೊದಲೇ ನಿರ್ಧರಿಸಿದೀನಿ.
    tr: Māḍalla sār. Adanna modalē nirdharisidīni.
    en: I won't, sir. I'd already decided that.
  - who: ca
    t: 'ಒಳ್ಳೇದು. ಇನ್ನೊಂದು: ಹೊಸ ಲೇಬರ್ ಕೋಡ್‌ಗಳು ಬಂದಮೇಲೆ ಕಾಗದ ಮುಖ್ಯ. ಪ್ರತಿ ಕೆಲಸಗಾರನಿಗೆ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಲೆಟರ್, ಪ್ರತಿ ತಿಂಗಳು ಸಂಬಳದ ಸ್ಲಿಪ್, ಸಂಬಳ ಬ್ಯಾಂಕ್ ಮೂಲಕ ಮಾತ್ರ. ಕನಿಷ್ಠ ವೇತನದ ನೋಟಿಸ್ ಅಂಗಡಿಯಲ್ಲಿ ಎಲ್ಲರಿಗೂ ಕಾಣೋ ಹಾಗೆ ಹಾಕಿ.'
    tr: 'Oḷḷēdu. Innondu: hosa lēbar kōḍ-gaḷu bandamēle kāgada mukhya. Prati kelasagāranige apāyiṇṭmenṭ leṭar, prati tingaḷu sambaḷada slip, sambaḷa byāṅk mūlaka mātra. Kaniṣṭha vētanada nōṭis aṅgaḍiyalli ellarigū kāṇō hāge hāki.'
    en: 'Good. One more thing: since the new labour codes came in, paperwork matters. An appointment letter for every worker, a pay slip every month, wages through the bank only. Put up the minimum-wage notice in the shop where everyone can see it.'
  - who: kavya
    t: ಸಾರ್, ಕೋರ್ಟ್‌ನಲ್ಲಿ ಸ್ಟೇ ಬಂದ್ರೆ? ಆಗ ಏರಿಸಿದ ಸಂಬಳ ಏನು ಮಾಡೋದು?
    tr: Sār, kōrṭ-nalli sṭē bandre? Āga ērisida sambaḷa ēnu māḍōdu?
    en: Sir, what if the court grants a stay? What do we do about the raised wages then?
  - who: ca
    t: ಸ್ಟೇ ಬಂದ್ರೆ ಕಾನೂನಿನ ಪ್ರಕಾರ ಇಳಿಸೋದು ಸಾಧ್ಯ ಇರಬಹುದು. ಆದ್ರೆ ಕೆಲಸಗಾರರ ಮನಸ್ಸಿನ ಪ್ರಕಾರ ಸಾಧ್ಯ ಇಲ್ಲ. ಒಮ್ಮೆ ಏರಿದ ಸಂಬಳ ಇಳಿಸಿದ್ರೆ ಒಳ್ಳೆ ಹುಡುಗರು ಹೋಗ್ತಾರೆ. ಅದನ್ನ ಯೋಚನೆ ಮಾಡಿಯೇ ಏರಿಸಿ.
    tr: Sṭē bandre kānūnina prakāra iḷisōdu sādhya irabahudu. Ādre kelasagārara manassina prakāra sādhya illa. Omme ērida sambaḷa iḷisidre oḷḷe huḍugaru hōgtāre. Adanna yōchane māḍiyē ērisi.
    en: If a stay comes, cutting back may be possible in law. But not in the workers' minds. Cut a wage once it's been raised, and the good people leave. Think about that before you raise it.
  - who: mahesh
    t: ಯೋಚನೆ ಮಾಡಿದೀನಿ ಸಾರ್. ಏರಿಸಿದ್ದು ಇಳಿಯಲ್ಲ.
    tr: Yōchane māḍidīni sār. Ērisiddu iḷiyalla.
    en: I have thought about it, sir. What goes up stays up.
  - section: An honest meeting
    learn: 'telling staff the truth: lekka muchchiḍalla, pūrti kēḷu · new wages: hosa sambaḷa, ondu rūpāyinū kaṭ illa · asking for help: nimminda mūru sahāya bēku, vēsṭ āgabāradu · workers'' worries: yārannādrū tegītīra? · coastal māḍu (roof), North-Karnataka kharēnā?'
  - scene: Sunday, 31 May, 10 p.m. The shutter is down. The staff sit on upturned crates; Kavya holds a printed sheet.
  - who: mahesh
    t: ಎಲ್ರೂ ಕೇಳಿ. ಸರ್ಕಾರ ಹೊಸ ಕನಿಷ್ಠ ವೇತನ ಘೋಷಣೆ ಮಾಡಿದೆ. ಜೂನ್ ತಿಂಗಳಿಂದ ಬಸವರಾಜ, ದೇವ್, ನಿಮ್ಮಿಬ್ಬರಿಗೆ ತಿಂಗಳಿಗೆ ಇಪ್ಪತ್ಮೂರು ಸಾವಿರದ ಮುನ್ನೂರ ಎಪ್ಪತ್ತಾರು. ಲತಾ, ನಿಮಗೆ ಭಟ್ ಸಾರ್ ಲೆಕ್ಕದ ಪ್ರಕಾರ ಇಪ್ಪತ್ತೈದು ಸಾವಿರ. ಊಟ, ರೂಮ್ ಎಂದಿನಂತೆ, ಅದಕ್ಕೆ ಒಂದು ರೂಪಾಯಿನೂ ಕಟ್ ಇಲ್ಲ.
    tr: Ellrū kēḷi. Sarkāra hosa kaniṣṭha vētana ghōṣaṇe māḍide. Jūn tingaḷinda Basavarāja, Dēv, nimmibbarige tingaḷige ippatmūru sāvirada munnūra eppattāru. Latā, nimage Bhaṭ sār lekkada prakāra ippattaidu sāvira. Ūṭa, rūm endinante, adakke ondu rūpāyinū kaṭ illa.
    en: Everyone, listen. The government has announced a new minimum wage. From June, Basavaraj and Dev, the two of you get twenty-three thousand three hundred and seventy-six a month. Latha, by Mr. Bhat's calculation, twenty-five thousand for you. Food and room as before; not one rupee deducted for them.
  - who: helper
    t: ಸಾಹೇಬ್ರ… ಇಪ್ಪತ್ಮೂರು ಸಾವಿರ? ಖರೇನಾ? ನಮ್ಮಪ್ಪ ಹೊಲದಾಗ ದುಡಿದ್ರೂ ತಿಂಗಳಿಗೆ ಇಷ್ಟು ಕಣ್ಣಿಗೆ ಕಾಣಂಗಿಲ್ರಿ.
    tr: Sāhēbra… ippatmūru sāvira? Kharēnā? Nammappa holadāga duḍidrū tingaḷige iṣṭu kaṇṇige kāṇaṅgilri.
    en: Sir… twenty-three thousand? Really? My father works the fields and never sets eyes on this much in a month.
  - who: mahesh
    t: ಖುಷಿ ಪಡು, ಆದ್ರೆ ಪೂರ್ತಿ ಕೇಳು. ಲೆಕ್ಕ ನಿಮ್ಮಿಂದ ಮುಚ್ಚಿಡಲ್ಲ. ಗ್ಯಾಸ್ ಸಾವಿರ ರೂಪಾಯಿ ಏರಿದೆ, ಸಂಬಳ ಏರಿದೆ. ತಿಂಗಳಿಗೆ ಎಪ್ಪತ್ತು ಸಾವಿರಕ್ಕಿಂತ ಜಾಸ್ತಿ ಹೊಸ ಖರ್ಚು. ಮಾರ್ಚ್‌ನ ನಷ್ಟ ಇನ್ನೂ ತುಂಬಿಲ್ಲ. ಕಾವ್ಯ, ಶೀಟ್ ತೋರಿಸು.
    tr: Khuṣi paḍu, ādre pūrti kēḷu. Lekka nimminda muchchiḍalla. Gyās sāvira rūpāyi ēride, sambaḷa ēride. Tingaḷige eppattu sāvirakkinta jāsti hosa kharchu. Mārch-na naṣṭa innū tumbilla. Kāvya, śīṭ tōrisu.
    en: Be happy, but hear all of it. I won't hide the accounts from you. Gas has gone up a thousand rupees, wages have gone up. More than seventy thousand in new costs a month. March's loss still hasn't been made up. Kavya, show them the sheet.
  - who: cashier
    t: ಸಾರ್, ನೇರವಾಗಿ ಕೇಳ್ತೀನಿ, ತಪ್ಪು ತಿಳ್ಕೋಬೇಡಿ. ಬೇರೆ ಕಡೆ ಸಂಬಳ ಏರಿಸಿ, ಒಬ್ಬರನ್ನ ಕೆಲಸದಿಂದ ತೆಗೆದು, ಉಳಿದವರ ಮೇಲೆ ಡಬಲ್ ಕೆಲಸ ಹಾಕ್ತಿದ್ದಾರೆ ಅಂತ ಕೇಳಿದೆ. ಇಲ್ಲೂ ಹಾಗೆ ಆಗುತ್ತಾ?
    tr: Sār, nēravāgi kēḷtīni, tappu tiḷkōbēḍi. Bēre kaḍe sambaḷa ērisi, obbaranna kelasadinda tegedu, uḷidavara mēle ḍabal kelasa hāktiddāre anta kēḷide. Illū hāge āguttā?
    en: Sir, I'll ask straight out; don't take it wrongly. I've heard that elsewhere they raise the wages, sack one person and load double work on the rest. Will that happen here too?
  - who: mahesh
    t: 'ಇಲ್ಲ. ಮಾರ್ಚ್‌ನಲ್ಲಿ ಹೇಳಿದ ಮಾತೇ ಈಗಲೂ: ಅಂಗಡಿ ತೆರೆದಿರೋ ತನಕ ಯಾರನ್ನೂ ತೆಗೆಯಲ್ಲ. ಆದ್ರೆ ನಿಮ್ಮಿಂದ ಮೂರು ಸಹಾಯ ಬೇಕು. ಒಂದು: ಒಂದು ಹಿಡಿ ಹಿಟ್ಟೂ ವೇಸ್ಟ್ ಆಗಬಾರದು. ಎರಡು: ಒಲೆ ಸುಮ್ಮನೆ ಉರಿಯಬಾರದು, ಗ್ಯಾಸ್ ಯುದ್ಧ ಮುಗಿದಿಲ್ಲ. ಮೂರು: ಗಿರಾಕಿ ನಗ್ತಾ ಹೋಗಬೇಕು, ಯಾಕಂದ್ರೆ ರೇಟ್ ಸ್ವಲ್ಪ ಏರಿಸಬೇಕಾಗುತ್ತೆ.'
    tr: 'Illa. Mārch-nalli hēḷida mātē īgalū: aṅgaḍi teredirō tanaka yārannū tegeyalla. Ādre nimminda mūru sahāya bēku. Ondu: ondu hiḍi hiṭṭū vēsṭ āgabāradu. Eraḍu: ole summane uriyabāradu, gyās yuddha mugidilla. Mūru: girāki nagtā hōgabēku, yākandre rēṭ svalpa ērisabēkāgutte.'
    en: 'No. What I said in March still holds: as long as the shop is open, nobody gets sacked. But I need three kinds of help from you. One: not a fistful of batter is to be wasted. Two: no burner burns for nothing; the gas war isn''t over. Three: customers have to leave smiling, because we''ll have to raise prices a little.'
  - who: dev
    t: ಸಾರ್, ನಾನು ಒಂದು ಮಾತು ಹೇಳಬಹುದಾ? ಇಪ್ಪತ್ಮೂರು ಸಾವಿರ ಬಂದ್ರೆ, ಅಮ್ಮನಿಗೆ ಹದಿನೈದು ಕಳಿಸ್ತೀನಿ. ಅವರು ಮನೆ ಮೇಲೆ ಹೊಸ ಶೀಟ್ ಹಾಕಿಸ್ತಾರೆ. ಮಳೆ ಬಂದ್ರೆ ಮನೆ ಒಳಗೆ ನೀರು ಬರುತ್ತೆ. ತುಂಬಾ ಧನ್ಯವಾದ ಸಾರ್.
    tr: Sār, nānu ondu mātu hēḷabahudā? Ippatmūru sāvira bandre, ammanige hadinaidu kaḷistīni. Avaru mane mēle hosa śīṭ hākistāre. Maḷe bandre mane oḷage nīru barutte. Tumbā dhanyavāda sār.
    en: Sir, may I say something? If twenty-three thousand comes, I'll send fifteen to my mother. She'll have a new sheet roof put on the house. When it rains, water comes inside. Thank you very much, sir.
  - who: cook
    t: ಕೇಳಿದ್ರಾ? ಇದು ಬರೀ ಸಂಬಳ ಅಲ್ಲ, ಮಳೆಗೆ ಮಾಡು. ಹಾಗಾದ್ರೆ ಈ ಅಡುಗೆಮನೆಯಲ್ಲಿ ಇನ್ಮೇಲೆ ಒಂದು ಚಿಟಿಕೆ ಕಾಯಿತುರಿನೂ ಕಸಕ್ಕೆ ಹೋಗಬಾರದು. ಬಸವರಾಜ, ನಾಳೆಯಿಂದ ಮಿಕ್ಕಿದ ಹಿಟ್ಟಿನ ಲೆಕ್ಕ ಪ್ರತಿ ರಾತ್ರಿ ನೀನು ಬರೀಬೇಕು.
    tr: Kēḷidrā? Idu barī sambaḷa alla, maḷege māḍu. Hāgādre ī aḍugemaneyalli inmēle ondu chiṭike kāyiturinū kasakke hōgabāradu. Basavarāja, nāḷeyinda mikkida hiṭṭina lekka prati rātri nīnu barībēku.
    en: Did you hear that? This isn't just a wage; it's a roof against the rain. So from now on, in this kitchen, not a pinch of grated coconut goes in the bin. Basavaraj, from tomorrow you write down the leftover batter every night.
  - who: helper
    t: ಆಯ್ತ್ರಿ ಭಟ್ರೆ. ಒಂದು ಸೌಟು ಹಿಟ್ಟು ಉಳಿದ್ರೂ ಬರೀತೀನಿ. ಮತ್ತ ಸಾಹೇಬ್ರ, ರೇಟ್ ಏರಿಸಿದ ಮ್ಯಾಲ ಗಿರಾಕಿ ಕೇಳಿದ್ರ ನಾವು ಏನು ಹೇಳಬೇಕ್ರಿ?
    tr: Āytri Bhaṭre. Ondu sauṭu hiṭṭu uḷidrū barītīni. Matta sāhēbra, rēṭ ērisida myāla girāki kēḷidra nāvu ēnu hēḷabēkri?
    en: Right, Bhattre. Even if one ladle of batter is left, I'll write it down. And sir, once prices go up, what do we say when customers ask?
  - who: cashier
    t: ನಿಜ ಹೇಳೋಣ. ಜನ ಪೇಪರ್ ಓದ್ತಾರೆ, ಅವರಿಗೂ ಗೊತ್ತು. ‘ಗ್ಯಾಸ್ ಏರಿದೆ, ನಾವು ಸರ್ಕಾರ ಹೇಳಿದ ಸಂಬಳ ಪೂರ್ತಿ ಕೊಡ್ತಿದೀವಿ.’ ಬೋರ್ಡ್ ನಾನೇ ಬರೀತೀನಿ ಸಾರ್. ಮತ್ತೆ… ಧನ್ಯವಾದ. ಹೋದ ಕೆಲಸದಲ್ಲಿ ಮೂರು ವರ್ಷ ಒಂದು ರೂಪಾಯಿನೂ ಏರಿಸಿರಲಿಲ್ಲ.
    tr: Nija hēḷōṇa. Jana pēpar ōdtāre, avarigū gottu. ‘Gyās ēride, nāvu sarkāra hēḷida sambaḷa pūrti koḍtidīvi.’ Bōrḍ nānē barītīni sār. Matte… dhanyavāda. Hōda kelasadalli mūru varṣa ondu rūpāyinū ērisiralilla.
    en: We tell the truth. People read the papers; they know. ‘Gas has gone up, and we pay the full wages the government has set.’ I'll write the board myself, sir. And… thank you. At my last job, they didn't raise my pay by a single rupee in three years.
  - who: cook
    t: ಯಜಮಾನ್ರೇ, ಒಂದು ಮಾತು. ಇವತ್ತು ನೀವು ಸಂಬಳ ಏರಿಸಿದ್ದಲ್ಲ ದೊಡ್ಡದು. ಏರಿಸೋಕೆ ಮುಂಚೆ ಲೆಕ್ಕ ತೋರಿಸಿದ್ರಲ್ಲ, ಅದು ದೊಡ್ಡದು. ಇಪ್ಪತ್ತೈದು ವರ್ಷದಲ್ಲಿ ಯಾವ ಯಜಮಾನನೂ ನನಗೆ ಲೆಕ್ಕ ತೋರಿಸಿರಲಿಲ್ಲ.
    tr: Yajamānrē, ondu mātu. Ivattu nīvu sambaḷa ērisiddalla doḍḍadu. Ērisōke muñche lekka tōrisidralla, adu doḍḍadu. Ippattaidu varṣadalli yāva yajamānanū nanage lekka tōrisiralilla.
    en: Boss, one thing. What matters today isn't that you raised the wages. It's that you showed us the accounts before you did. In twenty-five years, no employer ever showed me the accounts.
  - section: How much for an idli?
    learn: 'a price debate: rēṭ ērisu, eṣṭu ērisōṇa?, sarāsari bil, madhyada dāri · conditionals with numbers: prati bil-ge eṇṭu rūpāyi jāsti bandre… · comparisons: pakkada bīdiyavariginta hattu rūpāyi jāsti · whose shoulders: bhāra … hegala mēle'
  - scene: The same night, 11 p.m. The staff have gone to their room. Mahesh, Kavya, Amma and Shankara remain; Nitin joins on video.
  - who: kavya
    t: 'ಮೂರು ಆಯ್ಕೆ. ಒಂದು: ಏನೂ ಏರಿಸದೆ ಇರೋದು. ಆಗ ತಿಂಗಳಿಗೆ ಸುಮಾರು ಎಪ್ಪತ್ತು ಸಾವಿರ ನಷ್ಟ, ಅಮ್ಮನ ಚಿನ್ನ ಸೆಪ್ಟೆಂಬರ್ ಒಳಗೆ ಬ್ಯಾಂಕ್‌ಗೆ. ಎರಡು: ಪೇಪರ್‌ನಲ್ಲಿ ಹೇಳಿದ ಹಾಗೆ ಅರವತ್ತು ಪರ್ಸೆಂಟ್. ಆಗ ಅರ್ಧ ಗಿರಾಕಿ ಹೋಗ್ತಾರೆ. ಮೂರು: ಮಧ್ಯದ ದಾರಿ.'
    tr: 'Mūru āyke. Ondu: ēnū ērisade irōdu. Āga tingaḷige sumāru eppattu sāvira naṣṭa, ammana chinna Sepṭembar oḷage byāṅk-ge. Eraḍu: pēpar-nalli hēḷida hāge aravattu parsenṭ. Āga ardha girāki hōgtāre. Mūru: madhyada dāri.'
    en: 'Three options. One: raise nothing. Then we lose about seventy thousand a month, and Amma''s gold goes to the bank before September. Two: sixty percent, like the papers say. Then half the customers leave. Three: the middle path.'
  - who: mahesh
    t: ಮೊದಲನೇದು ಮುಳುಗೋ ದಾರಿ, ಎರಡನೇದು ಮೋಸ. ಮಧ್ಯದ ದಾರಿ ಹೇಳು.
    tr: Modalanēdu muḷugō dāri, eraḍanēdu mōsa. Madhyada dāri hēḷu.
    en: The first is the road to sinking, the second is cheating. Tell me the middle path.
  - who: kavya
    t: ದಿನಕ್ಕೆ ಸುಮಾರು ಮುನ್ನೂರು ಬಿಲ್. ಪ್ರತಿ ಬಿಲ್‌ಗೆ ಸರಾಸರಿ ಎಂಟು ರೂಪಾಯಿ ಜಾಸ್ತಿ ಬಂದ್ರೆ, ತಿಂಗಳಿಗೆ ಎಪ್ಪತ್ತೆರಡು ಸಾವಿರ. ಅಂದ್ರೆ ಸುಮಾರು ಹತ್ತು ಪರ್ಸೆಂಟ್ ಏರಿಕೆ ಸಾಕು. ಮಸಾಲೆ ದೋಸೆ ಎಪ್ಪತ್ತೈದರಿಂದ ಎಂಬತ್ತೈದು, ವಡೆ ಮೂವತ್ತರಿಂದ ಮೂವತ್ತೈದು, ಕಾಫಿ ಇಪ್ಪತ್ತರಿಂದ ಇಪ್ಪತ್ತೈದು, ಇಡ್ಲಿ ನಲವತ್ತರಿಂದ ನಲವತ್ತೈದು.
    tr: Dinakke sumāru munnūru bil. Prati bil-ge sarāsari eṇṭu rūpāyi jāsti bandre, tingaḷige eppatteraḍu sāvira. Andre sumāru hattu parsenṭ ērike sāku. Masāle dōse eppattaidarinda embattaidu, vaḍe mūvattarinda mūvattaidu, kāphi ippattarinda ippattaidu, iḍli nalavattarinda nalavattaidu.
    en: About three hundred bills a day. If each bill brings in eight rupees more on average, that's seventy-two thousand a month. So a rise of about ten percent is enough. Masala dose from seventy-five to eighty-five, vada thirty to thirty-five, coffee twenty to twenty-five, idli forty to forty-five.
  - who: amma
    t: ಇಡ್ಲಿ ಬೇಡ. ಗ್ಯಾಸ್ ಇಲ್ಲದ ತಿಂಗಳಲ್ಲೂ ಇಡ್ಲಿ ನಲವತ್ತೇ ಇತ್ತು. ಅದಕ್ಕೇ ಜನ ನಮ್ಮನ್ನ ನಂಬಿದ್ರು. ಆ ನಂಬಿಕೆಗೆ ಐದು ರೂಪಾಯಿ ಬೆಲೆ ಕಟ್ಟಬೇಡ, ಮಗು.
    tr: Iḍli bēḍa. Gyās illada tingaḷallū iḍli nalavattē ittu. Adakkē jana nammanna nambidru. Ā nambikege aidu rūpāyi bele kaṭṭabēḍa, magu.
    en: Not the idli. Even in the month without gas, idli stayed at forty. That's why people trusted us. Don't put a five-rupee price on that trust, child.
  - who: nitin
    t: ದೊಡ್ಡಮ್ಮ, ಭಾವನೆ ಅರ್ಥ ಆಗುತ್ತೆ. ಆದ್ರೆ ನಮ್ಮ ಮೂರು ಬಿಲ್‌ನಲ್ಲಿ ಒಂದು ಇಡ್ಲಿ ಬಿಲ್. ಇಡ್ಲಿ ಬಿಟ್ಟರೆ ಬೇರೆ ಐಟಂಗಳನ್ನ ಇನ್ನೂ ಜಾಸ್ತಿ ಏರಿಸಬೇಕು. ಆಗ ದೋಸೆ ತಿನ್ನೋರಿಗೆ ಅನ್ಯಾಯ ಅಲ್ವಾ?
    tr: Doḍḍamma, bhāvane artha āgutte. Ādre namma mūru bil-nalli ondu iḍli bil. Iḍli biṭṭare bēre aiṭam-gaḷanna innū jāsti ērisabēku. Āga dōse tinnōrige anyāya alvā?
    en: Doddamma, I understand the feeling. But one in three of our bills is an idli bill. If we leave idli out, the other items have to go up even more. Isn't that unfair to the dosa eaters?
  - who: cook
    t: ನನ್ನ ಲೆಕ್ಕ ಬೇರೆ. ಇಡ್ಲಿ ಹಬೆಯಲ್ಲಿ ಬೇಯುತ್ತೆ, ಗ್ಯಾಸ್ ಕಮ್ಮಿ. ದೋಸೆಗೆ ಕಾವಲಿ ಇಡೀ ದಿನ ಉರಿಯುತ್ತೆ, ಮೇಲೆ ಬೆಣ್ಣೆ, ಪಲ್ಯ. ಗ್ಯಾಸ್ ಏರಿಕೆಯ ಭಾರ ದೋಸೆಯ ಹೆಗಲ ಮೇಲೆ. ದೋಸೆ ತೊಂಬತ್ತು ಮಾಡಿ, ಇಡ್ಲಿ ನಲವತ್ತೇ ಇರಲಿ.
    tr: Nanna lekka bēre. Iḍli habeyalli bēyutte, gyās kammi. Dōsege kāvali iḍī dina uriyutte, mēle beṇṇe, palya. Gyās ērikeya bhāra dōseya hegala mēle. Dōse tombattu māḍi, iḍli nalavattē irali.
    en: My sums are different. Idli cooks in steam; it uses little gas. For dosa the griddle burns all day, and there's butter and palya on top. The weight of the gas rise sits on the dosa's shoulders. Make the dosa ninety and let the idli stay at forty.
  - who: kavya
    t: ಶಂಕರಣ್ಣ ಹೇಳೋದು ಲೆಕ್ಕದಲ್ಲೂ ಸರಿ. ಮಸಾಲೆ ದೋಸೆ ತೊಂಬತ್ತು, ಪ್ಲೇನ್ ದೋಸೆ ಅರವತ್ತೈದು, ವಡೆ ಮೂವತ್ತೈದು, ಕಾಫಿ ಇಪ್ಪತ್ತೈದು. ಇಡ್ಲಿ ನಲವತ್ತು. ಆಗ ಸರಾಸರಿ ಏಳು ರೂಪಾಯಿ ಬರುತ್ತೆ. ಉಳಿದ ಒಂದು ರೂಪಾಯಿ ಬಸವರಾಜನ ಹಿಟ್ಟಿನ ಲೆಕ್ಕದಿಂದ.
    tr: Śaṅkaraṇṇa hēḷōdu lekkadallū sari. Masāle dōse tombattu, plēn dōse aravattaidu, vaḍe mūvattaidu, kāphi ippattaidu. Iḍli nalavattu. Āga sarāsari ēḷu rūpāyi barutte. Uḷida ondu rūpāyi Basavarājana hiṭṭina lekkadinda.
    en: What Shankara-anna says works in the numbers too. Masala dose ninety, plain dose sixty-five, vada thirty-five, coffee twenty-five. Idli forty. That brings in seven rupees on average. The last rupee comes from Basavaraj's batter log.
  - who: mahesh
    t: ತೊಂಬತ್ತು… ಪಕ್ಕದ ಬೀದಿಯವರಿಗಿಂತ ಹತ್ತು ರೂಪಾಯಿ ಜಾಸ್ತಿ ಆಗುತ್ತೆ. ಅವರು ಹೊಸ ಸಂಬಳ ಕೊಡ್ತಿದ್ದಾರಾ ಇಲ್ಲವಾ, ನನಗೆ ಗೊತ್ತಿಲ್ಲ. ನಾನು ಕೊಡ್ತೀನಿ, ಅದನ್ನ ಬೋರ್ಡ್‌ನಲ್ಲಿ ಬರೆಯೋಣ. ಅಮ್ಮ, ಒಪ್ಪಿಗೆನಾ?
    tr: Tombattu… pakkada bīdiyavariginta hattu rūpāyi jāsti āgutte. Avaru hosa sambaḷa koḍtiddārā illavā, nanage gottilla. Nānu koḍtīni, adanna bōrḍ-nalli bareyōṇa. Amma, oppigenā?
    en: Ninety… that's ten rupees more than the next street. Whether they're paying the new wages or not, I don't know. I am, and we'll write that on the board. Amma, do you agree?
  - who: amma
    t: 'ಇಡ್ಲಿ ಉಳೀತು, ನನಗೆ ಸಾಕು. ಇನ್ನೊಂದು ಮಾತು: ದೋಸೆ ಏರಿಸಿದ ದಿನದಿಂದ ಚಟ್ನಿ ಕಪ್ ಸ್ವಲ್ಪ ದೊಡ್ಡದಾಗಬೇಕು. ಜಾಸ್ತಿ ಕೊಟ್ಟವರಿಗೆ ಜಾಸ್ತಿ ಸಿಗಬೇಕು.'
    tr: 'Iḍli uḷītu, nanage sāku. Innondu mātu: dōse ērisida dinadinda chaṭni kap svalpa doḍḍadāgabēku. Jāsti koṭṭavarige jāsti sigabēku.'
    en: 'The idli is saved; that''s enough for me. One more thing: from the day the dosa goes up, the chutney cup gets a little bigger. Those who pay more should get more.'
  - section: The new board
    learn: 'a formal notice: priya grāhakarē, … ādēśadante, anivāryavāgi ērisiddēve, nimma sahakārakke dhanyavāda · customers'' reactions: idu anyāya, biḍi sār, manēlē uppiṭṭu māḍkōtīni · calming answers: bējārāgōdu sahaja, ēnū muchchiṭṭilla'
  - scene: Monday, 1 June, 7 a.m. A new board beside the menu, in Latha's handwriting. The morning walkers stop to read it.
  - who: cashier
    t: ‘ಪ್ರಿಯ ಗ್ರಾಹಕರೇ, ವಾಣಿಜ್ಯ ಗ್ಯಾಸ್ ಸಿಲಿಂಡರ್ ಬೆಲೆ ಒಂದೇ ಸಲ ಸುಮಾರು ಸಾವಿರ ರೂಪಾಯಿ ಏರಿದೆ. ಸರ್ಕಾರದ ಹೊಸ ಆದೇಶದಂತೆ ನಮ್ಮ ಎಲ್ಲಾ ಕೆಲಸಗಾರರಿಗೆ ಹೊಸ ಕನಿಷ್ಠ ವೇತನ ಕೊಡುತ್ತಿದ್ದೇವೆ. ಆದ್ದರಿಂದ ಕೆಲವು ದರಗಳನ್ನು ಅನಿವಾರ್ಯವಾಗಿ ಏರಿಸಿದ್ದೇವೆ. ಇಡ್ಲಿ ದರ ಬದಲಾಗಿಲ್ಲ. ನಿಮ್ಮ ಸಹಕಾರಕ್ಕೆ ಧನ್ಯವಾದ.’
    tr: ‘Priya grāhakarē, vāṇijya gyās silinḍar bele ondē sala sumāru sāvira rūpāyi ēride. Sarkārada hosa ādēśadante namma ellā kelasagārarige hosa kaniṣṭha vētana koḍuttiddēve. Āddarinda kelavu daragaḷannu anivāryavāgi ērisiddēve. Iḍli dara badalāgilla. Nimma sahakārakke dhanyavāda.’
    en: (Reading the board aloud) ‘Dear customers, the price of a commercial gas cylinder has risen by about a thousand rupees in one go. As per the government's new order, we are paying all our workers the new minimum wage. We have therefore had to raise some prices. The price of idli has not changed. Thank you for your cooperation.’
  - who: customer
    t: ತೊಂಬತ್ತು ರೂಪಾಯಿ ಮಸಾಲೆ ದೋಸೆ? ಹದಿನೈದು ರೂಪಾಯಿ ಒಂದೇ ಸಲ! ನಿನ್ನೆವರೆಗೆ ಎಪ್ಪತ್ತೈದು. ಇದು ಅನ್ಯಾಯ.
    tr: Tombattu rūpāyi masāle dōse? Hadinaidu rūpāyi ondē sala! Ninnevarege eppattaidu. Idu anyāya.
    en: Ninety rupees for a masala dose? Fifteen rupees in one go! Until yesterday it was seventy-five. This is unfair.
  - who: cashier
    t: ಕ್ಷಮಿಸಿ ಸಾರ್, ಬೇಜಾರಾಗೋದು ಸಹಜ. ಆದ್ರೆ ಬೋರ್ಡ್ ನೋಡಿ, ಏನೂ ಮುಚ್ಚಿಟ್ಟಿಲ್ಲ. ನಮ್ಮ ಹುಡುಗರಿಗೆ ಈ ತಿಂಗಳಿಂದ ಸರ್ಕಾರದ ಸಂಬಳ. ಬೇಕಾದ್ರೆ ಇಡ್ಲಿ-ವಡೆ ತಗೊಳ್ಳಿ, ಅದು ಬರೀ ಐವತ್ತೈದು.
    tr: Kṣamisi sār, bējārāgōdu sahaja. Ādre bōrḍ nōḍi, ēnū muchchiṭṭilla. Namma huḍugarige ī tingaḷinda sarkārada sambaḷa. Bēkādre iḍli-vaḍe tagoḷḷi, adu barī aivattaidu.
    en: Sorry, sir; it's natural to be upset. But look at the board, we've hidden nothing. From this month our boys get the government wage. If you like, take idli-vada; that's only fifty-five.
  - who: customer
    t: ಹ್ಮ್… ಸರಿ, ಇಡ್ಲಿ-ವಡೆ. ಆದ್ರೆ ಮುಂದಿನ ತಿಂಗಳು ಮತ್ತೆ ಏರಿಸಿದ್ರೆ ನಾನು ಮನೆಯಲ್ಲೇ ಉಪ್ಪಿಟ್ಟು ಮಾಡ್ಕೋತೀನಿ.
    tr: Hm… sari, iḍli-vaḍe. Ādre mundina tingaḷu matte ērisidre nānu maneyallē uppiṭṭu māḍkōtīni.
    en: Hmm… all right, idli-vada. But if you raise it again next month, I'll make upma at home.
  - who: customer
    t: ಬಿಡಿ ಸಾರ್. ಜಯನಗರದ ಒಂದು ದೊಡ್ಡ ಹೋಟೆಲ್‌ನಲ್ಲಿ ನಿನ್ನೆ ಮಸಾಲೆ ದೋಸೆ ನೂರ ಹತ್ತು ಆಗಿತ್ತು. ಇವರು ಕನಿಷ್ಠ ಬೋರ್ಡ್ ಹಾಕಿ ಯಾಕೆ ಅಂತ ಹೇಳಿದ್ದಾರೆ. ಮಹೇಶ, ಒಂದು ಬೈಟು ಕಾಫಿ ಕೊಡು.
    tr: Biḍi sār. Jayanagarada ondu doḍḍa hōṭel-nalli ninne masāle dōse nūra hattu āgittu. Ivaru kaniṣṭha bōrḍ hāki yāke anta hēḷiddāre. Mahēśa, ondu baiṭu kāphi koḍu.
    en: (The elderly walker) Let it go, sir. Yesterday at a big hotel in Jayanagar, masala dose had gone up to a hundred and ten. These people have at least put up a board and told us why. Mahesha, one by-two coffee.
  - who: customer
    t: ಅಣ್ಣ, ನೀವು ಸ್ವಿಗ್ಗಿ, ಜೊಮ್ಯಾಟೋದಲ್ಲಿ ಯಾಕಿಲ್ಲ? ನಮ್ಮ ಆಫೀಸ್‌ನಲ್ಲಿ ಎಲ್ಲರೂ ನಿಮ್ಮ ಕೇಸರಿ ಬಾತ್ ಹುಡುಕಿದ್ರು. ಸಿಗಲಿಲ್ಲ.
    tr: Aṇṇa, nīvu Sviggi, Jomyāṭōdalli yākilla? Namma āphīs-nalli ellarū nimma kēsari bāt huḍukidru. Sigalilla.
    en: (A young woman with an office ID card) Anna, why aren't you on Swiggy or Zomato? Everyone in my office searched for your kesari bath. Couldn't find it.
  - who: cashier
    t: ಸದ್ಯಕ್ಕೆ ಇಲ್ಲ ಮೇಡಂ. ಬಂದು ತಿಂದ್ರೆ ಬಿಸಿಬಿಸಿ ಸಿಗುತ್ತೆ. ಆಫೀಸ್‌ಗೆ ಪಾರ್ಸೆಲ್ ಬೇಕಾದ್ರೆ ಇಲ್ಲೇ ಕಟ್ಟಿಕೊಡ್ತೀವಿ.
    tr: Sadyakke illa mēḍam. Bandu tindre bisibisi sigutte. Āphīs-ge pārsel bēkādre illē kaṭṭikoḍtīvi.
    en: Not for now, madam. If you come and eat, you get it piping hot. If you want a parcel for the office, we'll pack it right here.
  - who: sam
    t: ಮಹೇಶ್ ಅವರೇ, ಸ್ವಿಟ್ಜರ್‌ಲ್ಯಾಂಡ್‌ನಲ್ಲಿ ಒಂದು ಕಾಫಿ ನಾನೂರು ರೂಪಾಯಿ. ನಿಮ್ಮ ಇಪ್ಪತ್ತೈದು ರೂಪಾಯಿ ಕಾಫಿ ಇನ್ನೂ ಪ್ರಪಂಚದ ಅತಿ ಒಳ್ಳೆ ಡೀಲ್. ಆದ್ರೆ ಅಜ್ಜಿಗೆ ಈ ಸುದ್ದಿ ನಾನು ಹೇಳಲ್ಲ.
    tr: Mahēś avarē, Sviṭjarlyāṇḍ-nalli ondu kāphi nānūru rūpāyi. Nimma ippattaidu rūpāyi kāphi innū prapañchada ati oḷḷe ḍīl. Ādre ajjige ī suddi nānu hēḷalla.
    en: Mahesh, in Switzerland a coffee costs four hundred rupees. Your twenty-five-rupee coffee is still the best deal in the world. But I'm not telling Ajji this news.
  - who: mahesh
    t: ಅಜ್ಜಿಗೆ ಹೇಳಿ, ಚಟ್ನಿ ಕಪ್ ದೊಡ್ಡದಾಗಿದೆ ಅಂತ. ಆ ಸುದ್ದಿ ಅವರಿಗೆ ಇಷ್ಟ ಆಗುತ್ತೆ.
    tr: Ajjige hēḷi, chaṭni kap doḍḍadāgide anta. Ā suddi avarige iṣṭa āgutte.
    en: Tell Ajji the chutney cup has got bigger. She'll like that news.
  - scene: 'By the end of June, Kavya''s sheet shows about five percent fewer bills but seven percent higher takings, and the first real profit since the opening: twenty-two thousand rupees.'
  - section: Rohit's offer
    learn: 'platform terms: kamiṣan, pēmenṭ gēṭvē chārj, jāhīrātu, ḍiskauṇṭ kyāmpēn, pyākējiṅg, rēṭiṅg · persuasion vs arithmetic: hosa girākigaḷu sigtāre vs kaige eṣṭu barutte? · percentages of a price: nūra hattaralli mūvattu parsenṭ hōdre…'
  - scene: 'Saturday, 11 July, 3 p.m. The quiet hour. A young man in a company T-shirt, tablet in hand: Rohit, an account manager for a food-delivery app. Kavya is at the shop; it''s her day off.'
  - who: delivery
    t: ನಮಸ್ಕಾರ ಸಾರ್, ನಾನು ರೋಹಿತ್. ಫುಡ್ ಡೆಲಿವರಿ ಆ್ಯಪ್‌ನಿಂದ ಬಂದಿದೀನಿ. ನಿಮ್ಮ ಗೂಗಲ್ ರೇಟಿಂಗ್ ನಾಲ್ಕು ಪಾಯಿಂಟ್ ಆರು. ಜಯನಗರದಲ್ಲಿ ಇಷ್ಟು ರೇಟಿಂಗ್ ಇರೋ ದರ್ಶಿನಿ ನಮ್ಮ ಆ್ಯಪ್‌ನಲ್ಲಿ ಇಲ್ಲ. ನೀವು ಬಂದ್ರೆ ಎರಡು ಕಿಲೋಮೀಟರ್ ಸುತ್ತಲಿನ ಆಫೀಸ್, ಪಿಜಿ, ಅಪಾರ್ಟ್‌ಮೆಂಟ್ ಎಲ್ಲಾ ನಿಮ್ಮ ಗಿರಾಕಿಗಳು.
    tr: Namaskāra sār, nānu Rōhit. Phuḍ ḍelivari æp-ninda bandidīni. Nimma Gūgal rēṭiṅg nālku pāyiṇṭ āru. Jayanagaradalli iṣṭu rēṭiṅg irō darśini namma æp-nalli illa. Nīvu bandre eraḍu kilōmīṭar suttalina āphīs, PG, apārṭmenṭ ellā nimma girākigaḷu.
    en: Namaskara, sir, I'm Rohit. I'm from a food-delivery app. Your Google rating is four point six. There isn't a darshini in Jayanagar with a rating like that on our app. If you join, every office, PG and apartment within two kilometres becomes your customer.
  - who: mahesh
    t: ಕೇಳೋಕೆ ಚೆನ್ನಾಗಿದೆ. ಆದ್ರೆ ಮೊದಲು ಕಮಿಷನ್ ಹೇಳಿ. ಹೊಗಳಿಕೆ ಆಮೇಲೆ.
    tr: Kēḷōke chennāgide. Ādre modalu kamiṣan hēḷi. Hogaḷike āmēle.
    en: Sounds nice. But tell me the commission first. Compliments later.
  - who: delivery
    t: ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ ಸಾರ್. ಬೇಸ್ ಕಮಿಷನ್ ಸುಮಾರು ಹದಿನೈದರಿಂದ ಇಪ್ಪತ್ತೈದು ಪರ್ಸೆಂಟ್, ಏರಿಯಾ ಮತ್ತು ಡೆಲಿವರಿ ದೂರದ ಮೇಲೆ. ಅದರ ಮೇಲೆ ಪೇಮೆಂಟ್ ಗೇಟ್‌ವೇ ಚಾರ್ಜ್ ಸುಮಾರು ಎರಡು ಪರ್ಸೆಂಟ್. ಜಾಹೀರಾತು ಬೇಕಾದ್ರೆ ಬೇರೆ. ಆದ್ರೆ ಆ್ಯಪ್‌ನಲ್ಲಿ ಮೆನು ರೇಟ್ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ ಇಡಬಹುದು.
    tr: Nēravāgi hēḷtīni sār. Bēs kamiṣan sumāru hadinaidarinda ippattaidu parsenṭ, ēriyā mattu ḍelivari dūrada mēle. Adara mēle pēmenṭ gēṭvē chārj sumāru eraḍu parsenṭ. Jāhīrātu bēkādre bēre. Ādre æp-nalli menu rēṭ svalpa jāsti iḍabahudu.
    en: I'll be straight with you, sir. The base commission is about fifteen to twenty-five percent, depending on the area and the delivery distance. On top of that, a payment-gateway charge of about two percent. Ads are extra if you want them. But you can keep your menu prices a bit higher on the app.
  - who: kavya
    t: ಅಸೋಸಿಯೇಷನ್‌ನವರ ಲೆಕ್ಕದಲ್ಲಿ ಎಲ್ಲಾ ಸೇರಿ ಕೈಯಿಂದ ಹೋಗೋದು ಇಪ್ಪತ್ತೈದರಿಂದ ಮೂವತ್ತು ಪರ್ಸೆಂಟ್. ಮತ್ತೆ ಆ ‘ಐವತ್ತು ಪರ್ಸೆಂಟ್ ಆಫ್’ ಆಫರ್‌ಗಳು? ಅವುಗಳ ದುಡ್ಡು ಯಾರು ಕೊಡ್ತಾರೆ?
    tr: Asōsiyēṣan-navara lekkadalli ellā sēri kaiyinda hōgōdu ippattaidarinda mūvattu parsenṭ. Matte ā ‘aivattu parsenṭ āph’ āphar-gaḷu? Avugaḷa duḍḍu yāru koḍtāre?
    en: By the association's reckoning, with everything included, twenty-five to thirty percent goes out of your hands. And those ‘fifty percent off’ offers? Who pays for those?
  - who: delivery
    t: ಡಿಸ್ಕೌಂಟ್ ಕ್ಯಾಂಪೇನ್ ಸೇರೋದು ನಿಮ್ಮ ಇಷ್ಟ, ಮೇಡಂ. ಸೇರಿದ್ರೆ ಡಿಸ್ಕೌಂಟ್‌ನ ಹೆಚ್ಚಿನ ಭಾಗ ರೆಸ್ಟೋರೆಂಟ್‌ದೇ. ಸೇರದೆ ಇದ್ರೆ ಲಿಸ್ಟ್‌ನಲ್ಲಿ ನೀವು ಸ್ವಲ್ಪ ಕೆಳಗೆ ಬರ್ತೀರಿ. ಸುಳ್ಳು ಹೇಳಲ್ಲ, ಸಿಸ್ಟಮ್ ಹಾಗಿದೆ.
    tr: Ḍiskauṇṭ kyāmpēn sērōdu nimma iṣṭa, mēḍam. Sēridre ḍiskauṇṭ-na hechchina bhāga resṭōrenṭ-dē. Sērade idre lisṭ-nalli nīvu svalpa keḷage bartīri. Suḷḷu hēḷalla, sisṭam hāgide.
    en: Joining a discount campaign is your choice, madam. If you join, most of the discount is borne by the restaurant. If you don't, you show up a bit lower in the list. I won't lie; that's how the system works.
  - who: mahesh
    t: ಲೆಕ್ಕ ಹಾಕೋಣ. ಆ್ಯಪ್‌ನಲ್ಲಿ ಮಸಾಲೆ ದೋಸೆ ನೂರ ಹತ್ತು ಇಟ್ರೂ, ಮೂವತ್ತು ಪರ್ಸೆಂಟ್ ಹೋದ್ರೆ ಕೈಗೆ ಎಪ್ಪತ್ತೇಳು. ಪಾರ್ಸೆಲ್ ಬಾಕ್ಸ್, ಚಟ್ನಿ ಡಬ್ಬಿ, ಸಾಂಬಾರ್ ಕವರ್, ಬ್ಯಾಗ್ ಸೇರಿ ಹನ್ನೆರಡು ರೂಪಾಯಿ. ಉಳಿಯೋದು ಅರವತ್ತೈದು. ಕೌಂಟರ್‌ನಲ್ಲಿ ಅದೇ ದೋಸೆಗೆ ತೊಂಬತ್ತು ಸಿಗುತ್ತೆ.
    tr: Lekka hākōṇa. Æp-nalli masāle dōse nūra hattu iṭrū, mūvattu parsenṭ hōdre kaige eppattēḷu. Pārsel bāks, chaṭni ḍabbi, sāmbār kavar, byāg sēri hanneraḍu rūpāyi. Uḷiyōdu aravattaidu. Kauṇṭar-nalli adē dōsege tombattu sigutte.
    en: Let's do the sum. Even if we list masala dose at a hundred and ten on the app, if thirty percent goes, seventy-seven reaches us. Parcel box, chutney tub, sambar pouch and bag come to twelve rupees. What's left is sixty-five. At the counter the same dosa fetches ninety.
  - who: delivery
    t: ಆದ್ರೆ ಸಾರ್, ಅದು ಹೊಸ ವ್ಯಾಪಾರ. ಕೌಂಟರ್‌ಗೆ ಎಂದೂ ಬರದೆ ಇರೋ ಜನ. ನಿಮ್ಮ ಅಡುಗೆಮನೆ ಮಧ್ಯಾಹ್ನ ಮೂರರಿಂದ ಐದರವರೆಗೆ ಖಾಲಿ ಇರುತ್ತೆ. ಆ ಸಮಯದ ಆರ್ಡರ್‌ಗಳು ಅಂದ್ರೆ ಜಾಸ್ತಿ ಲಾಭವೇ.
    tr: Ādre sār, adu hosa vyāpāra. Kauṇṭar-ge endū barade irō jana. Nimma aḍugemane madhyāhna mūrarinda aidaravarege khāli irutte. Ā samayada ārḍar-gaḷu andre jāsti lābhavē.
    en: But sir, that's new business. People who would never come to your counter. Your kitchen sits idle from three to five in the afternoon. Orders in that slot are extra profit.
  - who: cook
    t: ಮೂರರಿಂದ ಐದು ನನ್ನ ಮಸಾಲೆ ಹುರಿಯೋ ಸಮಯ, ಹುಡುಗರ ಊಟದ ಸಮಯ. ಮತ್ತೆ ಅರ್ಧ ಗಂಟೆ ಬಾಕ್ಸ್‌ನಲ್ಲಿ ಕೂತ ದೋಸೆ ಗರಿಗರಿ ಇರಲ್ಲ. ಮೆತ್ತಗಾದ ದೋಸೆ ತಿಂದವನು ಒಂದು ಸ್ಟಾರ್ ಕೊಟ್ಟು ನನ್ನ ಹೆಸರು ಹಾಳುಮಾಡ್ತಾನೆ.
    tr: Mūrarinda aidu nanna masāle huriyō samaya, huḍugara ūṭada samaya. Matte ardha gaṇṭe bāks-nalli kūta dōse garigari iralla. Mettagāda dōse tindavanu ondu sṭār koṭṭu nanna hesaru hāḷumāḍtāne.
    en: (From the hatch) Three to five is when I roast my spices and the boys eat. And a dosa that's sat in a box for half an hour isn't crisp. The man who eats a soggy dosa gives one star and ruins my name.
  - who: delivery
    t: 'ಅದು ನಿಜ ಸಾರ್, ದೋಸೆ ಡೆಲಿವರಿಗೆ ಕಷ್ಟ. ಎಷ್ಟೋ ಜನ ಇಡ್ಲಿ, ಬಾತ್, ಊಟ ಮಾತ್ರ ಲಿಸ್ಟ್ ಮಾಡ್ತಾರೆ. ಯೋಚನೆ ಮಾಡಿ, ನನ್ನ ಕಾರ್ಡ್ ಇಲ್ಲಿದೆ. ಆದ್ರೆ ಒಂದು ವಿಷಯ ನಿಮಗೂ ಗೊತ್ತಿರಬಹುದು: ಈಗ ಹೋಟೆಲ್ ಅಸೋಸಿಯೇಷನ್ ಮತ್ತು ಡೆಲಿವರಿ ಕಂಪನಿಗಳ ಮಧ್ಯೆ ಜಗಳ ನಡೀತಿದೆ. ಏನಾಗುತ್ತೋ ನೋಡಬೇಕು.'
    tr: 'Adu nija sār, dōse ḍelivarige kaṣṭa. Eṣṭō jana iḍli, bāt, ūṭa mātra lisṭ māḍtāre. Yōchane māḍi, nanna kārḍ illide. Ādre ondu viṣaya nimagū gottirabahudu: īga hōṭel asōsiyēṣan mattu ḍelivari kampanigaḷa madhye jagaḷa naḍītide. Ēnāguttō nōḍabēku.'
    en: 'That''s true, sir; dosas are hard to deliver. Many places list only idli, the baths and meals. Think it over; here''s my card. But one thing you may already know: there''s a fight going on right now between the hotel association and the delivery companies. We''ll have to see what happens.'
  - section: The boycott and the decision
    learn: 'a collective protest: bahiṣkāra, mātukate, gaḍuvu (deadline), gupta ḍiskauṇṭ · uncertain outcomes: naḍeyuttō illavō khachita illa · deciding: sadyakke bēḍa, badalige…, mundina varṣa matte yōchane māḍōṇa · consent of a partner: oppige koḍtīni'
  - scene: Sunday, 9 August, 9 p.m. Nitin has come over. Kavya reads out a message from the hotel association's WhatsApp group.
  - who: kavya
    t: ಅಸೋಸಿಯೇಷನ್ ಮೆಸೇಜ್. ಮೊದಲು ‘ಕಮಿಷನ್ ಮತ್ತು ಗುಪ್ತ ಡಿಸ್ಕೌಂಟ್‌ಗಳ ವಿರುದ್ಧ ಆಗಸ್ಟ್ ಹದಿನೈದರಿಂದ ಆ್ಯಪ್ ಬಹಿಷ್ಕಾರ’ ಅಂದಿದ್ರು. ಆರು-ಏಳನೇ ತಾರೀಖು ಕಂಪನಿಗಳ ಜೊತೆ ಮಾತುಕತೆ ಆಯ್ತು. ಈಗ ‘ಆಗಸ್ಟ್ ಮೂವತ್ತೊಂದರವರೆಗೆ ನೋಡ್ತೀವಿ’ ಅಂತ ಗಡುವು ಇಟ್ಟಿದ್ದಾರೆ. ಬಹಿಷ್ಕಾರ ನಡೆಯುತ್ತೋ ಇಲ್ಲವೋ ಇನ್ನೂ ಖಚಿತ ಇಲ್ಲ.
    tr: Asōsiyēṣan mesēj. Modalu ‘kamiṣan mattu gupta ḍiskauṇṭ-gaḷa viruddha Āgasṭ hadinaidarinda æp bahiṣkāra’ andidru. Āru-ēḷanē tārīkhu kampanigaḷa jote mātukate āytu. Īga ‘Āgasṭ mūvattondaravarege nōḍtīvi’ anta gaḍuvu iṭṭiddāre. Bahiṣkāra naḍeyuttō illavō innū khachita illa.
    en: 'The association''s message. First they said: ‘Boycott of the apps from the fifteenth of August, against the commissions and hidden discounts.’ On the sixth and seventh there were talks with the companies. Now they''ve set a deadline: ‘We''ll wait until the thirty-first of August.’ Whether the boycott will actually happen isn''t certain yet.'
  - who: nitin
    t: ತಮಾಷೆ ನೋಡು. ನಾವು ಆ್ಯಪ್‌ಗೆ ಸೇರೇ ಇಲ್ಲ, ಆದ್ರೂ ಬಹಿಷ್ಕಾರದ ಮೆಸೇಜ್ ನಮಗೂ ಬರ್ತಿದೆ. ಆದ್ರೆ ಡೇಟಾ ನೋಡಿದ್ರೆ ಜಯನಗರದಲ್ಲಿ ಆ್ಯಪ್ ಆರ್ಡರ್ ಬೆಳೀತಾನೇ ಇದೆ. ನಾವು ಇಲ್ಲದಿದ್ರೆ ಆ ಗಿರಾಕಿ ಬೇರೆಯವರಿಗೆ.
    tr: Tamāṣe nōḍu. Nāvu æp-ge sērē illa, ādrū bahiṣkārada mesēj namagū bartide. Ādre ḍēṭā nōḍidre Jayanagaradalli æp ārḍar beḷītānē ide. Nāvu illadidre ā girāki bēreyavarige.
    en: Funny, isn't it? We're not even on the apps, and still we get the boycott messages. But if you look at the data, app orders in Jayanagar keep growing. If we're not there, those customers go to someone else.
  - who: mahesh
    t: ಹೋಗಲಿ. ನಾನು ಮೂರು ವಾರ ಯೋಚನೆ ಮಾಡಿದೆ. ನಮ್ಮದು ನಿಂತು ತಿನ್ನೋ ದರ್ಶಿನಿ. ಬಿಸಿ ಇಡ್ಲಿ, ಗರಿಗರಿ ದೋಸೆ, ಕಾಫಿಯ ನೊರೆ, ಇವೆಲ್ಲಾ ಕೌಂಟರ್‌ನಿಂದ ಬಾಯಿಗೆ ಐದು ನಿಮಿಷದ ದಾರಿ. ಬಾಕ್ಸ್‌ನಲ್ಲಿ ಅರ್ಧ ಗಂಟೆ ಕೂತ್ರೆ ಅದು ನಮ್ಮ ತಿಂಡಿ ಅಲ್ಲ.
    tr: Hōgali. Nānu mūru vāra yōchane māḍide. Nammadu nintu tinnō darśini. Bisi iḍli, garigari dōse, kāphiya nore, ivellā kauṇṭar-ninda bāyige aidu nimiṣada dāri. Bāks-nalli ardha gaṇṭe kūtre adu namma tiṇḍi alla.
    en: 'Let them go. I''ve thought about it for three weeks. Ours is a stand-and-eat darshini. Hot idli, crisp dosa, the froth on the coffee: all of it is a five-minute journey from the counter to the mouth. Half an hour in a box, and it isn''t our food any more.'
  - who: kavya
    t: ನನ್ನ ಲೆಕ್ಕನೂ ಅದನ್ನೇ ಹೇಳುತ್ತೆ. ಜೂನ್‌ನಲ್ಲಿ ಮೊದಲ ಸಲ ಇಪ್ಪತ್ತೆರಡು ಸಾವಿರ ಲಾಭ, ಜುಲೈನಲ್ಲಿ ನಲವತ್ತು. ಈಗ ಮೂವತ್ತು ಪರ್ಸೆಂಟ್ ಕೊಡೋ ವ್ಯಾಪಾರ ಶುರು ಮಾಡಿದ್ರೆ ಹೆಚ್ಚು ಕೆಲಸ, ಕಮ್ಮಿ ಲಾಭ. ಜೊತೆಗೆ ಭಟ್ ಸಾರ್ ಹೇಳಿದ ಹಾಗೆ ಜಿಎಸ್‌ಟಿ ಲೆಕ್ಕನೂ ಬದಲಾಗಬಹುದು.
    tr: Nanna lekkanū adannē hēḷutte. Jūn-nalli modala sala ippatteraḍu sāvira lābha, Julai-nalli nalavattu. Īga mūvattu parsenṭ koḍō vyāpāra śuru māḍidre hechchu kelasa, kammi lābha. Jotege Bhaṭ sār hēḷida hāge ji-es-ṭi lekkanū badalāgabahudu.
    en: My numbers say the same. In June, a profit of twenty-two thousand for the first time; in July, forty. If we now start business where thirty percent goes away, it's more work for less profit. And as Mr. Bhat said, the GST accounting might change too.
  - who: amma
    t: 'ನನಗೆ ಆ್ಯಪ್ ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ಒಂದು ಗೊತ್ತು: ಊಟ ಬಡಿಸೋವಾಗ ತಿನ್ನೋರ ಮುಖ ನೋಡಬೇಕು. ಮುಖ ನೋಡದೆ ಮಾಡೋ ಅಡುಗೆಗೆ ರುಚಿ ಕಮ್ಮಿ.'
    tr: 'Nanage æp gottilla. Ādre ondu gottu: ūṭa baḍisōvāga tinnōra mukha nōḍabēku. Mukha nōḍade māḍō aḍugege ruchi kammi.'
    en: 'I don''t know about apps. But I know one thing: when you serve food, you should see the faces of those who eat it. Cooking for faces you never see has less taste.'
  - who: mahesh
    t: 'ಹಾಗಾದ್ರೆ ತೀರ್ಮಾನ: ಸದ್ಯಕ್ಕೆ ಆ್ಯಪ್ ಬೇಡ. ಬದಲಿಗೆ ನಮ್ಮದೇ ವಾಟ್ಸಾಪ್ ನಂಬರ್. ಆಫೀಸ್‌ನವರು, ಪಿಜಿ ಹುಡುಗರು ಹತ್ತು ನಿಮಿಷ ಮುಂಚೆ ಆರ್ಡರ್ ಮಾಡಿ, ಬಂದು ಪಾರ್ಸೆಲ್ ತಗೊಂಡು ಹೋಗಲಿ. ಕಮಿಷನ್ ಇಲ್ಲ, ಕೌಂಟರ್ ರೇಟ್. ಮುಂದಿನ ವರ್ಷ ಮತ್ತೆ ಯೋಚನೆ ಮಾಡೋಣ. ರೋಹಿತ್‌ನ ಕಾರ್ಡ್ ಇಟ್ಕೊಳ್ಳಿ.'
    tr: 'Hāgādre tīrmāna: sadyakke æp bēḍa. Badalige nammadē vāṭsāp nambar. Āphīs-navaru, PG huḍugaru hattu nimiṣa muñche ārḍar māḍi, bandu pārsel tagoṇḍu hōgali. Kamiṣan illa, kauṇṭar rēṭ. Mundina varṣa matte yōchane māḍōṇa. Rōhit-na kārḍ iṭkoḷḷi.'
    en: 'Then the decision: no apps for now. Instead, our own WhatsApp number. Office people and PG boys can order ten minutes ahead and come and pick up their parcel. No commission, counter prices. We''ll think again next year. Keep Rohit''s card.'
  - who: nitin
    t: ಸ್ಲೀಪಿಂಗ್ ಪಾರ್ಟ್ನರ್ ಆಗಿ ನಾನು ಒಪ್ಪಿಗೆ ಕೊಡ್ತೀನಿ. ಆದ್ರೆ ವಾಟ್ಸಾಪ್ ಆರ್ಡರ್ ಮೆನು ನಾನೇ ಡಿಸೈನ್ ಮಾಡ್ತೀನಿ. ಕನಿಷ್ಠ ಅಷ್ಟು ಕೆಲಸ ಕೊಡಿ, ಇಲ್ಲಾಂದ್ರೆ ನಿಜವಾಗ್ಲೂ ನಿದ್ದೆ ಬಂದುಬಿಡುತ್ತೆ.
    tr: Slīpiṅg pārṭnar āgi nānu oppige koḍtīni. Ādre vāṭsāp ārḍar menu nānē ḍisain māḍtīni. Kaniṣṭha aṣṭu kelasa koḍi, illāndre nijavāglū nidde bandubiḍutte.
    en: As the sleeping partner, I give my consent. But I'm designing the WhatsApp order menu myself. Give me at least that much work, or I really will fall asleep.
  - chapter: Chapter 9 — Inspection and competition
  - section: Mr. Gowda comes back
    learn: 'inspection words: inspekṣan / tapāsaṇe, grīs ṭryāp, charaṇḍi, pesṭ kanṭrōl rekārḍ, meḍikal phiṭnes sarṭiphikēṭ · rules reported: … āgabēku anta niyama ide · the hinted ‘aḍjasṭ’ and a polite refusal: baravaṇigeyalli nōṭis koḍi, chalan koḍi, raśīdi samēta kaṭtīni · a notice read aloud: saripaḍisi dākhale sallisatakkaddu'
  - scene: Tuesday, 15 September 2026, 11 a.m. After a week of heavy rain. Mr. Gowda walks in unannounced, file under his arm, and heads straight for the kitchen.
  - who: officer
    t: ನಮಸ್ಕಾರ. ಜಿಬಿಎ ಆರೋಗ್ಯ ವಿಭಾಗ. ಸರ್‌ಪ್ರೈಸ್ ಇನ್ಸ್‌ಪೆಕ್ಷನ್. ನೆನಪಿದೆಯಾ ಮಹೇಶ್ ಅವರೇ? ಫೆಬ್ರವರಿಯಲ್ಲಿ ಕಾಫಿಗೆ ಬಂದಿದ್ದೆ. ಇವತ್ತು ಕಾಫಿ ಆಮೇಲೆ. ಮೊದಲು ಅಡುಗೆಮನೆ.
    tr: Namaskāra. Ji-bi-e ārōgya vibhāga. Sarprais inspekṣan. Nenapideyā Mahēś avarē? Phebravariyalli kāphige bandidde. Ivattu kāphi āmēle. Modalu aḍugemane.
    en: Namaskara. GBA health department. Surprise inspection. Remember me, Mahesh? In February I came for coffee. Today, coffee comes later. Kitchen first.
  - who: mahesh
    t: ನೆನಪಿದೆ ಸಾರ್, ಬನ್ನಿ. ಶಂಕರಣ್ಣ, ಗೌಡ ಸಾರ್ ಅಡುಗೆಮನೆ ನೋಡ್ತಾರೆ.
    tr: Nenapide sār, banni. Śaṅkaraṇṇa, Gauḍa sār aḍugemane nōḍtāre.
    en: I remember, sir. Please come in. Shankara-anna, Mr. Gowda is going to look at the kitchen.
  - who: officer
    t: ಕ್ಯಾಪ್, ಹೇರ್‌ನೆಟ್ ಎಲ್ಲರ ತಲೆ ಮೇಲೆ ಇದೆ, ಒಳ್ಳೇದು. ಎಫ್‌ಎಸ್‌ಎಸ್‌ಎಐ ಸರ್ಟಿಫಿಕೇಟ್ ಗೋಡೆ ಮೇಲೆ ಇದೆ. ಹಿಟ್ಟು ಮುಚ್ಚಿದೆ. ವಡೆ ಎಣ್ಣೆ ಎಷ್ಟು ಸಲ ಉಪಯೋಗಿಸ್ತೀರಿ?
    tr: Kyāp, hēr-neṭ ellara tale mēle ide, oḷḷēdu. Ef-es-es-e-ai sarṭiphikēṭ gōḍe mēle ide. Hiṭṭu muchchide. Vaḍe eṇṇe eṣṭu sala upayōgistīri?
    en: Caps and hairnets on everyone's head, good. The FSSAI certificate is on the wall. The batter is covered. How many times do you use the vada oil?
  - who: cook
    t: ಒಂದೇ ದಿನ ಸಾರ್. ರಾತ್ರಿ ಉಳಿದ ಎಣ್ಣೆ ಡ್ರಮ್‌ಗೆ, ಬಯೋಡೀಸೆಲ್‌ನವರು ತಿಂಗಳಿಗೊಮ್ಮೆ ತಗೊಂಡು ಹೋಗ್ತಾರೆ. ಲೆಕ್ಕ ಆ ಪುಸ್ತಕದಲ್ಲಿದೆ.
    tr: Ondē dina sār. Rātri uḷida eṇṇe ḍram-ge, bayōḍīsel-navaru tingaḷigomme tagoṇḍu hōgtāre. Lekka ā pustakadallide.
    en: One day only, sir. At night the leftover oil goes into a drum, and the biodiesel people collect it once a month. It's all logged in that book.
  - who: officer
    t: ಕೆಲಸಗಾರರ ಮೆಡಿಕಲ್ ಫಿಟ್‌ನೆಸ್ ಸರ್ಟಿಫಿಕೇಟ್ ತೋರಿಸಿ. ವರ್ಷಕ್ಕೊಮ್ಮೆ ಚೆಕಪ್ ಆಗಬೇಕು ಅಂತ ನಿಯಮ ಇದೆ.
    tr: Kelasagārara meḍikal phiṭnes sarṭiphikēṭ tōrisi. Varṣakkomme chekap āgabēku anta niyama ide.
    en: Show me the staff's medical fitness certificates. The rule is a check-up once a year.
  - who: cashier
    t: ಇಲ್ಲಿದೆ ಸಾರ್, ಫೈಲ್‌ನಲ್ಲಿ. ಐದು ಜನರದ್ದು, ಮಹೇಶ್ ಸಾರ್‌ದೂ ಸೇರಿ. ಜನವರಿಯಲ್ಲಿ ಮಾಡಿಸಿದ್ದು.
    tr: Illide sār, phail-nalli. Aidu janaraddu, Mahēś sār-dū sēri. Janavariyalli māḍisiddu.
    en: Here, sir, in the file. All five, Mahesh sir's included. Done in January.
  - who: officer
    t: ಹ್ಮ್. ಈಗ ಇಲ್ಲಿ ಬನ್ನಿ. ಈ ವಾಸನೆ ಏನು? ಪಾತ್ರೆ ತೊಳೆಯೋ ಜಾಗದ ಡ್ರೈನ್‌ನಲ್ಲಿ ನೀರು ನಿಂತಿದೆ. ಗ್ರೀಸ್ ಟ್ರ್ಯಾಪ್ ಕೊನೆಯ ಸಲ ಯಾವಾಗ ಕ್ಲೀನ್ ಮಾಡಿಸಿದ್ರಿ?
    tr: Hm. Īga illi banni. Ī vāsane ēnu? Pātre toḷeyō jāgada ḍrain-nalli nīru nintide. Grīs ṭryāp koneya sala yāvāga klīn māḍisidri?
    en: Hm. Now come here. What's this smell? Water is standing in the drain where you wash the vessels. When did you last have the grease trap cleaned?
  - who: helper
    t: ಹೋದ ತಿಂಗಳು ಸಾಹೇಬ್ರ… ಇಲ್ಲ, ಅದರ ಹಿಂದಿನ ತಿಂಗಳು. ಮಳೆ ಜಾಸ್ತಿ ಆದ್ಮೇಲೆ ಹೊರಗಿನ ಚರಂಡಿ ತುಂಬಿ ನೀರು ಹಿಂದಕ್ಕೆ ಬರ್ತೈತ್ರಿ.
    tr: Hōda tingaḷu sāhēbra… illa, adara hindina tingaḷu. Maḷe jāsti ādmēle horagina charaṇḍi tumbi nīru hindakke bartaitri.
    en: Last month, sir… no, the month before. Since the heavy rain, the drain outside fills up and the water comes back in.
  - who: officer
    t: 'ಮಳೆ ಎಲ್ಲರಿಗೂ ಬರುತ್ತೆ. ಟ್ರ್ಯಾಪ್ ತುಂಬಿದ್ರೆ ಗ್ರೀಸ್ ಹೊರಗಿನ ಲೈನ್‌ಗೆ ಹೋಗುತ್ತೆ, ಆಮೇಲೆ ಬೀದಿ ಚರಂಡಿ ಕಟ್ಟಿಕೊಳ್ಳುತ್ತೆ. ಇನ್ನೊಂದು: ಪೆಸ್ಟ್ ಕಂಟ್ರೋಲ್ ರೆಕಾರ್ಡ್ ತೋರಿಸಿ.'
    tr: 'Maḷe ellarigū barutte. Ṭryāp tumbidre grīs horagina lain-ge hōgutte, āmēle bīdi charaṇḍi kaṭṭikoḷḷutte. Innondu: pesṭ kanṭrōl rekārḍ tōrisi.'
    en: 'Rain comes for everyone. If the trap is full, the grease goes into the outside line, and then the street drain gets blocked. Another thing: show me the pest-control record.'
  - who: mahesh
    t: ಇಲ್ಲಿದೆ ಸಾರ್. ಜನವರಿಯಿಂದ ಪ್ರತಿ ತಿಂಗಳು…
    tr: Illide sār. Janavariyinda prati tingaḷu…
    en: Here it is, sir. Every month since January…
  - who: officer
    t: ಜೂನ್ ತನಕ. ಜುಲೈ, ಆಗಸ್ಟ್ ಖಾಲಿ. ಸೆಪ್ಟೆಂಬರ್‌ನೂ ಖಾಲಿ. ಮೂರು ತಿಂಗಳು ಪೆಸ್ಟ್ ಕಂಟ್ರೋಲ್ ಆಗಿಲ್ವಾ, ಇಲ್ಲಾ ಮಾಡಿದ್ರೂ ಬರೆದಿಲ್ವಾ?
    tr: Jūn tanaka. Julai, Āgasṭ khāli. Sepṭembar-nū khāli. Mūru tingaḷu pesṭ kanṭrōl āgilvā, illā māḍidrū baredilvā?
    en: Up to June. July and August blank. September blank too. Was there no pest control for three months, or was it done and not written down?
  - who: mahesh
    t: ನಿಜ ಹೇಳ್ತೀನಿ ಸಾರ್. ನಮ್ಮ ಪೆಸ್ಟ್ ಕಂಟ್ರೋಲ್ ಕಂಪನಿಯ ಹುಡುಗ ಕೆಲಸ ಬಿಟ್ಟ. ಆಮೇಲೆ ಅವರು ಯಾರನ್ನೂ ಕಳಿಸಿಲ್ಲ. ನಾನು ಫಾಲೋ ಅಪ್ ಮಾಡಬೇಕಿತ್ತು, ಮಾಡಿಲ್ಲ. ತಪ್ಪು ನನ್ನದು.
    tr: Nija hēḷtīni sār. Namma pesṭ kanṭrōl kampaniya huḍuga kelasa biṭṭa. Āmēle avaru yārannū kaḷisilla. Nānu phālō ap māḍabēkittu, māḍilla. Tappu nannadu.
    en: I'll tell you the truth, sir. The lad from our pest-control company quit. After that they never sent anyone. I should have followed up, and I didn't. The fault is mine.
  - who: officer
    t: ತಪ್ಪು ಒಪ್ಕೊಂಡ್ರಿ, ಒಳ್ಳೇದು. ಆದ್ರೆ ನೋಡಿ, ಇವೆರಡೂ ರಿಪೋರ್ಟ್‌ನಲ್ಲಿ ಬರೆದ್ರೆ ನೋಟಿಸ್ ಹೋಗುತ್ತೆ, ದಂಡ ಬರಬಹುದು, ಫೈಲ್ ಮೇಲಿನ ಆಫೀಸ್‌ಗೆ ಹೋಗುತ್ತೆ. ಲೈಸೆನ್ಸ್ ರಿನ್ಯೂವಲ್ ಟೈಮ್‌ನಲ್ಲಿ ಅದೇ ಫೈಲ್ ಮತ್ತೆ ಎದ್ದು ಬರುತ್ತೆ. ಸುಮ್ಮನೆ ತಲೆನೋವು.
    tr: Tappu opkoṇḍri, oḷḷēdu. Ādre nōḍi, iveraḍū ripōrṭ-nalli baredre nōṭis hōgutte, daṇḍa barabahudu, phail mēlina āphīs-ge hōgutte. Laisens rinyūval ṭaim-nalli adē phail matte eddu barutte. Summane talenōvu.
    en: 'You admit the fault; good. But look: if I write both of these in the report, a notice goes out, there may be a fine, and the file goes to the higher office. At licence-renewal time the same file pops up again. A needless headache.'
  - who: officer
    t: ನಾವು ಇಲ್ಲೇ ಏನಾದ್ರೂ ‘ಅಡ್ಜಸ್ಟ್’ ಮಾಡ್ಕೊಂಡ್ರೆ, ನಾನು ‘ಸಣ್ಣ ಸಲಹೆ’ ಅಂತ ಬರೀತೀನಿ, ಅಷ್ಟೇ. ನಿಮಗೂ ಸಮಯ ಉಳಿಯುತ್ತೆ, ನನಗೂ.
    tr: Nāvu illē ēnādrū ‘aḍjasṭ’ māḍkoṇḍre, nānu ‘saṇṇa salahe’ anta barītīni, aṣṭē. Nimagū samaya uḷiyutte, nanagū.
    en: (Lowering his voice) If we ‘adjust’ something right here between ourselves, I'll write it up as a ‘minor suggestion’, that's all. It saves your time, and mine.
  - who: mahesh
    t: ಸಾರ್, ಡಿಸೆಂಬರ್‌ನಲ್ಲಿ ಹೇಳಿದ್ದೇ ಈಗಲೂ. ಈ ಹೆಸರಲ್ಲಿ ಸುಳ್ಳು ಲೆಕ್ಕ ಇಲ್ಲ. ತಪ್ಪು ಇದೆ, ಅದನ್ನ ಬರೀರಿ. ಏನು ಸರಿ ಮಾಡಬೇಕು, ಎಷ್ಟು ದಿನದಲ್ಲಿ ಅಂತ ಬರವಣಿಗೆಯಲ್ಲಿ ನೋಟಿಸ್ ಕೊಡಿ. ದಂಡ ಇದ್ರೆ ಚಲನ್ ಕೊಡಿ, ರಶೀದಿ ಸಮೇತ ಕಟ್ತೀನಿ.
    tr: Sār, Ḍisembar-nalli hēḷiddē īgalū. Ī hesaralli suḷḷu lekka illa. Tappu ide, adanna barīri. Ēnu sari māḍabēku, eṣṭu dinadalli anta baravaṇigeyalli nōṭis koḍi. Daṇḍa idre chalan koḍi, raśīdi samēta kaṭtīni.
    en: Sir, what I said in December still stands. There are no false accounts under this name. There's a fault; write it down. Give me a written notice of what has to be fixed and in how many days. If there's a fine, give me a challan and I'll pay it against a receipt.
  - who: officer
    t: ನಾನೇನು ದುಡ್ಡು ಕೇಳಿದ್ನಾ? ನಿಮಗೆ ಸುಲಭ ಆಗಲಿ ಅಂತ ಹೇಳಿದೆ. ಸರಿ, ನಿಮಗೆ ನೋಟಿಸೇ ಬೇಕಂದ್ರೆ ನೋಟಿಸ್.
    tr: Nānēnu duḍḍu kēḷidnā? Nimage sulabha āgali anta hēḷide. Sari, nimage nōṭisē bēkandre nōṭis.
    en: Did I ask for money? I said it to make things easy for you. Fine. If it's a notice you want, a notice it is.
  - scene: He fills in a printed form, tears off the carbon copy and holds it out.
  - who: officer
    t: ‘ಪಾತ್ರೆ ತೊಳೆಯುವ ಸ್ಥಳದ ಚರಂಡಿ ಕಟ್ಟಿಕೊಂಡಿದೆ, ಗ್ರೀಸ್ ಟ್ರ್ಯಾಪ್ ಸ್ವಚ್ಛಗೊಳಿಸಿಲ್ಲ. ಜುಲೈಯಿಂದ ಕೀಟ ನಿಯಂತ್ರಣದ ದಾಖಲೆ ಇಲ್ಲ. ಏಳು ದಿನಗಳೊಳಗೆ ಸರಿಪಡಿಸಿ ದಾಖಲೆ ಸಲ್ಲಿಸತಕ್ಕದ್ದು.’ ಸಹಿ ಮಾಡಿ. ಏಳು ದಿನ ಆದ್ಮೇಲೆ ಮತ್ತೆ ಬರ್ತೀನಿ. ಆಗಲೂ ಹೀಗೇ ಇದ್ರೆ ದಂಡ, ಮುಂದಿನ ಕ್ರಮ.
    tr: ‘Pātre toḷeyuva sthaḷada charaṇḍi kaṭṭikoṇḍide, grīs ṭryāp svachchhagoḷisilla. Julaiyinda kīṭa niyantraṇada dākhale illa. Ēḷu dinagaḷoḷage saripaḍisi dākhale sallisatakkaddu.’ Sahi māḍi. Ēḷu dina ādmēle matte bartīni. Āgalū hīgē idre daṇḍa, mundina krama.
    en: '(Reading aloud) ‘The drain at the dishwashing area is blocked; the grease trap has not been cleaned. No pest-control record since July. To be rectified and records submitted within seven days.’ Sign here. I''ll come back after seven days. If it''s still like this: a fine, and further action.'
  - who: mahesh
    t: ಸಹಿ ಮಾಡಿದೆ ಸಾರ್. ಏಳು ದಿನ ಬೇಡ, ಐದು ದಿನದಲ್ಲಿ ಮುಗಿಸ್ತೀನಿ. ಆಗ ಕಾಫಿ ಕುಡಿದು ಹೋಗಿ.
    tr: Sahi māḍide sār. Ēḷu dina bēḍa, aidu dinadalli mugistīni. Āga kāphi kuḍidu hōgi.
    en: I've signed, sir. Not seven days; I'll finish in five. Then stay and have a coffee.
  - who: officer
    t: ನೋಡೋಣ.
    tr: Nōḍōṇa.
    en: We'll see.
  - section: Five days
    learn: 'causatives for repairs: klīn māḍisu, ṭryāp hākisu, vālv hākisu, jāli hākisu, kāṇṭrākṭ māḍisu · schedules and logs: vārakkomme, tingaḷigomme, ibrū sahi, gōḍe mēle chārṭ · owning a mistake: tappu obbaraddalla, vyavasthe iralilla · spelling: kombu, kāguṇita'
  - scene: Wednesday, 16 September, 6 a.m. A plumber's tools lie by the sink. Shankara has hardly spoken since yesterday.
  - who: cook
    t: ಮೂವತ್ತು ವರ್ಷದಿಂದ ಅಡುಗೆಮನೆಯಲ್ಲಿದೀನಿ. ಯಾರೂ ನನ್ನ ಅಡುಗೆಮನೆ ಬಗ್ಗೆ ನೋಟಿಸ್ ಬರೆದಿರಲಿಲ್ಲ. ನಿನ್ನೆ ರಾತ್ರಿ ನಿದ್ದೆ ಬರಲಿಲ್ಲ. ಆ ಡ್ರೈನ್ ನಾನು ನೋಡಬೇಕಿತ್ತು.
    tr: Mūvattu varṣadinda aḍugemaneyallidīni. Yārū nanna aḍugemane bagge nōṭis barediralilla. Ninne rātri nidde baralilla. Ā ḍrain nānu nōḍabēkittu.
    en: I've been in kitchens for thirty years. Nobody ever wrote a notice about my kitchen. I couldn't sleep last night. I should have kept an eye on that drain.
  - who: mahesh
    t: ಶಂಕರಣ್ಣ, ತಪ್ಪು ಒಬ್ಬರದ್ದಲ್ಲ. ವ್ಯವಸ್ಥೆ ಇರಲಿಲ್ಲ, ಅದು ನನ್ನ ಕೆಲಸ. ಈಗ ವ್ಯವಸ್ಥೆ ಮಾಡೋಣ. ಪ್ಲಂಬರ್ ಏನು ಹೇಳಿದ್ರು, ಬಸವರಾಜ?
    tr: Śaṅkaraṇṇa, tappu obbaraddalla. Vyavasthe iralilla, adu nanna kelasa. Īga vyavasthe māḍōṇa. Plambar ēnu hēḷidru, Basavarāja?
    en: Shankara-anna, the fault isn't one person's. There was no system, and that's my job. Let's set one up now. What did the plumber say, Basavaraj?
  - who: helper
    t: ಟ್ರ್ಯಾಪ್ ಸಣ್ಣದೈತಿ ಅಂತ ಹೇಳ್ಯಾನ್ರಿ, ದಿನಾ ಮುನ್ನೂರು ಪ್ಲೇಟ್‌ಗೆ ಸಾಲಂಗಿಲ್ಲ. ದೊಡ್ಡ ಟ್ರ್ಯಾಪ್ ಹಾಕಿಸಬೇಕು, ಹೊರಗಿನ ಪೈಪ್‌ಗೆ ನಾನ್-ರಿಟರ್ನ್ ವಾಲ್ವ್ ಹಾಕಿಸಬೇಕು. ಆಗ ಮಳೆ ನೀರು ಒಳಗ ಬರಂಗಿಲ್ಲ. ಹದಿನೆಂಟು ಸಾವಿರ ಆಗತೈತಂತ್ರಿ.
    tr: Ṭryāp saṇṇadaiti anta hēḷyānri, dinā munnūru plēṭ-ge sālaṅgilla. Doḍḍa ṭryāp hākisabēku, horagina paip-ge nān-riṭarn vālv hākisabēku. Āga maḷe nīru oḷaga baraṅgilla. Hadineṇṭu sāvira āgataitantri.
    en: He says the trap is too small; it can't cope with three hundred plates a day. We need a bigger trap fitted, and a non-return valve on the outside pipe. Then rainwater won't come back in. It'll cost eighteen thousand, he says.
  - who: kavya
    t: ಹದಿನೆಂಟು ಸಾವಿರ. ಮಾಡಿಸಿ. ದಂಡಕ್ಕಿಂತ ಕಮ್ಮಿ, ಅವಮಾನಕ್ಕಿಂತ ತುಂಬಾ ಕಮ್ಮಿ. ಜಿಎಸ್‌ಟಿ ಬಿಲ್ ತಗೊಳ್ಳಿ, ನೋಟಿಸ್ ಉತ್ತರದ ಜೊತೆ ಲಗತ್ತಿಸಬೇಕು.
    tr: Hadineṇṭu sāvira. Māḍisi. Daṇḍakkinta kammi, avamānakkinta tumbā kammi. Ji-es-ṭi bil tagoḷḷi, nōṭis uttarada jote lagattisabēku.
    en: (On the phone) Eighteen thousand. Get it done. Less than a fine, and much less than the shame. Take a GST bill; we have to attach it to our reply to the notice.
  - who: mahesh
    t: ಪೆಸ್ಟ್ ಕಂಟ್ರೋಲ್‌ಗೆ ಹೊಸ ಕಂಪನಿ ಜೊತೆ ವರ್ಷದ ಕಾಂಟ್ರಾಕ್ಟ್ ಮಾಡಿಸಿದೆ. ತಿಂಗಳಿಗೆ ಒಂದು ಸಲ ಬರ್ತಾರೆ, ಪ್ರತಿ ಸಲ ಕಾರ್ಡ್ ಮೇಲೆ ಸಹಿ, ದಿನಾಂಕ, ಯಾವ ಔಷಧಿ ಅಂತ ಬರೀತಾರೆ. ಬರದಿದ್ರೆ ಐದನೇ ತಾರೀಖು ಲತಾ ಫೋನ್ ಮಾಡ್ತಾರೆ.
    tr: Pesṭ kanṭrōl-ge hosa kampani jote varṣada kāṇṭrākṭ māḍiside. Tingaḷige ondu sala bartāre, prati sala kārḍ mēle sahi, dināṅka, yāva auṣadhi anta barītāre. Baradidre aidanē tārīkhu Latā phōn māḍtāre.
    en: I've signed a yearly contract with a new pest-control company. They come once a month, and each time they write their signature, the date and which chemical on the card. If they don't turn up, Latha phones them on the fifth.
  - who: cashier
    t: ಫೋನ್‌ನಲ್ಲಿ ರಿಮೈಂಡರ್ ಹಾಕಿದೀನಿ ಸಾರ್. ಟ್ರೇಡ್ ಲೈಸೆನ್ಸ್ ರಿನ್ಯೂವಲ್ ರಿಮೈಂಡರ್ ಪಕ್ಕದಲ್ಲೇ.
    tr: Phōn-nalli rimaiṇḍar hākidīni sār. Ṭrēḍ laisens rinyūval rimaiṇḍar pakkadallē.
    en: I've set a reminder on my phone, sir. Right next to the trade-licence renewal reminder.
  - who: cook
    t: ಇನ್ನೊಂದು ಕೆಲಸ ನನ್ನದು. ಪ್ರತಿ ಶನಿವಾರ ರಾತ್ರಿ ಟ್ರ್ಯಾಪ್ ತೆಗೆದು ಕ್ಲೀನ್. ಬಸವರಾಜ ಮಾಡ್ತಾನೆ, ನಾನು ನೋಡ್ತೀನಿ, ಇಬ್ರೂ ಪುಸ್ತಕದಲ್ಲಿ ಸಹಿ. ಡ್ರೈನ್ ಮೇಲೆ ಜಾಲಿ ಹಾಕಿಸಿ, ಒಂದು ಜಿರಳೆನೂ ಒಳಗೆ ಬರಬಾರದು.
    tr: Innondu kelasa nannadu. Prati śanivāra rātri ṭryāp tegedu klīn. Basavarāja māḍtāne, nānu nōḍtīni, ibrū pustakadalli sahi. Ḍrain mēle jāli hākisi, ondu jiraḷenū oḷage barabāradu.
    en: One more job is mine. Every Saturday night the trap comes out and gets cleaned. Basavaraj does it, I watch, and we both sign the book. Have a mesh put over the drain; not one cockroach gets in.
  - who: dev
    t: 'ಸಾರ್, ನಾನು ಗೋಡೆ ಮೇಲೆ ಒಂದು ಚಾರ್ಟ್ ಬರೆದೆ. ಕನ್ನಡದಲ್ಲಿ. ‘ಶನಿವಾರ: ಟ್ರ್ಯಾಪ್. ಐದನೇ ತಾರೀಖು: ಪೆಸ್ಟ್ ಕಂಟ್ರೋಲ್.’ ಕಾಗುಣಿತ ಸರಿ ಇದೆಯಾ ನೋಡಿ.'
    tr: 'Sār, nānu gōḍe mēle ondu chārṭ barede. Kannaḍadalli. ‘Śanivāra: ṭryāp. Aidanē tārīkhu: pesṭ kanṭrōl.’ Kāguṇita sari ideyā nōḍi.'
    en: 'Sir, I wrote a chart on the wall. In Kannada. ‘Saturday: trap. Fifth of the month: pest control.’ Check whether the spelling is right.'
  - who: mahesh
    t: ‘ಶನಿವಾರ’ದಲ್ಲಿ ಒಂದು ಕೊಂಬು ಜಾಸ್ತಿ ಇದೆ. ಉಳಿದದ್ದೆಲ್ಲಾ ಸರಿ. ದೇವ್, ಇನ್ನೊಂದು ವರ್ಷದಲ್ಲಿ ನೀನೇ ನನ್ನ ನೋಟಿಸ್‌ಗಳಿಗೆ ಉತ್ತರ ಬರೀತೀಯ.
    tr: ‘Śanivāra’dalli ondu kombu jāsti ide. Uḷidaddellā sari. Dēv, innondu varṣadalli nīnē nanna nōṭis-gaḷige uttara barītīya.
    en: There's one extra kombu in ‘Shanivara’. Everything else is right. Dev, in another year you'll be writing the replies to my notices yourself.
  - section: The coffee is paid for
    learn: 'a re-inspection: nōṭis klōs māḍtīni, bil-gaḷa kāpi phail-ge · grudging respect: ‘nōṭis koḍi’ anta kēḷidavaru tumbā kammi · a proverb-like reply: kāgada uḷiyutte, kai maretuhōgutte · paying one''s way: duḍḍu koṭṭu kuḍītīni'
  - scene: Monday, 21 September, 4 p.m. Mr. Gowda returns. He lifts the new grease-trap lid himself and leafs through the pest-control card and the Saturday book.
  - who: officer
    t: ಟ್ರ್ಯಾಪ್ ದೊಡ್ಡದು, ವಾಲ್ವ್ ಹಾಕಿದೀರಿ, ಜಾಲಿ ಇದೆ. ಕಾರ್ಡ್‌ನಲ್ಲಿ ಹದಿನೇಳನೇ ತಾರೀಖಿನ ಸಹಿ ಇದೆ. ಈ ಪುಸ್ತಕ ಯಾರು ಬರೆದಿದ್ದು? ಅಚ್ಚುಕಟ್ಟಾಗಿದೆ.
    tr: Ṭryāp doḍḍadu, vālv hākidīri, jāli ide. Kārḍ-nalli hadinēḷanē tārīkhina sahi ide. Ī pustaka yāru barediddu? Achchukaṭṭāgide.
    en: The trap is bigger, you've fitted the valve, there's a mesh. The card has a signature dated the seventeenth. Who keeps this book? It's neat.
  - who: helper
    t: ನಾನು ಸಾಹೇಬ್ರ. ಭಟ್ರು ಸಹಿ ಮಾಡ್ತಾರ್ರಿ.
    tr: Nānu sāhēbra. Bhaṭru sahi māḍtārri.
    en: I do, sir. Bhattru signs it.
  - who: officer
    t: ನೋಟಿಸ್ ಕ್ಲೋಸ್ ಮಾಡ್ತೀನಿ. ಬಿಲ್‌ಗಳ ಕಾಪಿ ಫೈಲ್‌ಗೆ ಹಾಕ್ತೀನಿ. ಮಹೇಶ್ ಅವರೇ, ಒಂದು ಮಾತು. ಇಪ್ಪತ್ತು ವರ್ಷದ ಸರ್ವಿಸ್‌ನಲ್ಲಿ ‘ನೋಟಿಸ್ ಕೊಡಿ’ ಅಂತ ಕೇಳಿದವರು ತುಂಬಾ ಕಮ್ಮಿ. ಹೆಚ್ಚಿನವರಿಗೆ ಕಾಗದಕ್ಕಿಂತ ಕೈ ಮೇಲೆ ಜಾಸ್ತಿ ನಂಬಿಕೆ.
    tr: Nōṭis klōs māḍtīni. Bil-gaḷa kāpi phail-ge hāktīni. Mahēś avarē, ondu mātu. Ippattu varṣada sarvīs-nalli ‘nōṭis koḍi’ anta kēḷidavaru tumbā kammi. Hechchinavarige kāgadakkinta kai mēle jāsti nambike.
    en: I'll close the notice. I'll put copies of the bills in the file. Mahesh, one thing. In twenty years of service, very few people have asked me for a notice. Most trust a hand more than paper.
  - who: mahesh
    t: ಕಾಗದ ಉಳಿಯುತ್ತೆ ಸಾರ್, ಕೈ ಮರೆತುಹೋಗುತ್ತೆ. ಈಗ ಕಾಫಿ?
    tr: Kāgada uḷiyutte sār, kai maretuhōgutte. Īga kāphi?
    en: Paper stays, sir; hands forget. Coffee now?
  - who: officer
    t: ಕೊಡಿ. ಸ್ಟ್ರಾಂಗ್, ಸಕ್ಕರೆ ಕಮ್ಮಿ. ಲತಾ ಅವರೇ, ಇಪ್ಪತ್ತೈದು ರೂಪಾಯಿ, ಯುಪಿಐ. ಫೆಬ್ರವರಿಯಲ್ಲಿ ಹೇಗೋ ಹಾಗೇ, ದುಡ್ಡು ಕೊಟ್ಟೇ ಕುಡೀತೀನಿ.
    tr: Koḍi. Sṭrāṅg, sakkare kammi. Latā avarē, ippattaidu rūpāyi, yu-pi-ai. Phebravariyalli hēgō hāgē, duḍḍu koṭṭē kuḍītīni.
    en: 'Go on. Strong, less sugar. Latha, twenty-five rupees, by UPI. Same as in February: I pay for my coffee.'
  - who: cashier
    t: ಬಂತು ಸಾರ್. ಟೋಕನ್ ಹದಿಮೂರು.
    tr: Bantu sār. Ṭōkan hadimūru.
    en: Received, sir. Token thirteen.
  - section: Two hundred metres away
    learn: 'competition talk: chain kephe, esi, kyū, ‘ondu tagoṇḍre ondu phrī’, Instāgrām · numbers that frighten: hōda śanivārakkinta hadineṇṭu parsenṭ kammi · comparisons: avara hatra kōṭigaṭṭale duḍḍu, namage āru tingaḷu sāku · advice: avara thara āgōke hōdre sōltīvi'
  - scene: 'Saturday, 3 October, 8 a.m. Two hundred metres down the main road, a well-known chain café has opened in a glass-fronted corner shop: air-conditioning, a queue on the pavement, a young man filming it all for Instagram. Nitin comes back from a look.'
  - who: nitin
    t: ನೋಡ್ಕೊಂಡು ಬಂದೆ. ಎಸಿ, ಕೂರೋಕೆ ಮೂವತ್ತು ಕುರ್ಚಿ, ಗೋಡೆ ಮೇಲೆ ದೊಡ್ಡ ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿ ಮೆನು. ಮಸಾಲೆ ದೋಸೆ ನೂರ ಮೂವತ್ತು, ಫಿಲ್ಟರ್ ಕಾಫಿ ಅರವತ್ತು. ಆದ್ರೂ ಕ್ಯೂ ರಸ್ತೆ ತನಕ. ಮೊದಲ ವಾರ ‘ಒಂದು ತಗೊಂಡ್ರೆ ಒಂದು ಫ್ರೀ’.
    tr: Nōḍkoṇḍu bande. Esi, kūrōke mūvattu kurchi, gōḍe mēle doḍḍa skrīn-nalli menu. Masāle dōse nūra mūvattu, philṭar kāphi aravattu. Ādrū kyū raste tanaka. Modala vāra ‘ondu tagoṇḍre ondu phrī’.
    en: I've been to look. AC, thirty chairs, the menu on a big screen on the wall. Masala dose a hundred and thirty, filter coffee sixty. And still a queue out to the road. For the first week, ‘buy one, get one free’.
  - who: cashier
    t: ಸಾರ್, ಬೆಳಗ್ಗೆ ಏಳರಿಂದ ಒಂಬತ್ತರವರೆಗಿನ ಬಿಲ್ ಲೆಕ್ಕ ನೋಡಿದೆ. ಹೋದ ಶನಿವಾರಕ್ಕಿಂತ ಹದಿನೆಂಟು ಪರ್ಸೆಂಟ್ ಕಮ್ಮಿ. ಕಾಲೇಜ್ ಹುಡುಗರು, ಆಫೀಸ್ ಹುಡುಗಿಯರು, ಯಾರೂ ಬಂದಿಲ್ಲ.
    tr: Sār, beḷagge ēḷarinda ombattaravaregina bil lekka nōḍide. Hōda śanivārakkinta hadineṇṭu parsenṭ kammi. Kālēj huḍugaru, āphīs huḍugiyaru, yārū bandilla.
    en: 'Sir, I checked the bill count from seven to nine. Eighteen percent fewer than last Saturday. The college boys, the office girls: none of them came.'
  - who: dev
    t: 'ಸಾರ್, ಆ ಕೆಫೆಯಲ್ಲಿ ನನ್ನ ಊರಿನ ಒಬ್ಬ ಹುಡುಗ ಕೆಲಸ ಮಾಡ್ತಾನೆ. ಅವನು ಹೇಳಿದ: ಅವರಿಗೆ ಒಳ್ಳೆ ಅಡುಗೆಯವರು ಬೇಕಂತೆ, ತುಂಬಾ ಸಂಬಳ. ಇಲ್ಲಿಂದ ಯಾರಾದ್ರೂ ಬರ್ತಾರಾ ಅಂತ ಕೇಳಿದ.'
    tr: 'Sār, ā kepheyalli nanna ūrina obba huḍuga kelasa māḍtāne. Avanu hēḷida: avarige oḷḷe aḍugeyavaru bēkante, tumbā sambaḷa. Illinda yārādrū bartārā anta kēḷida.'
    en: Sir, a boy from my village works at that café. He told me they want good cooks, and they pay a lot. He asked whether anyone from here would come.
  - scene: Mahesh glances at the kitchen hatch. Shankara keeps stirring the sambar and says nothing.
  - who: mahesh
    t: ಗ್ಯಾಸ್ ಹೋಯ್ತು, ಬಂತು. ಸಂಬಳ ಏರಿತು, ನಿಭಾಯಿಸಿದ್ವಿ. ಆದ್ರೆ ಇದು ಬೇರೆ. ಅವರ ಹತ್ರ ಕೋಟಿಗಟ್ಟಲೆ ದುಡ್ಡು, ಜಾಹೀರಾತು, ಹೆಸರು. ಆರು ತಿಂಗಳು ನಷ್ಟದಲ್ಲಿ ನಡೆಸಿದ್ರೂ ಅವರಿಗೆ ಏನೂ ಆಗಲ್ಲ. ನಮಗೆ ಮುಚ್ಚೋಕೆ ಆರು ತಿಂಗಳು ಸಾಕು.
    tr: Gyās hōytu, bantu. Sambaḷa ēritu, nibhāyisidvi. Ādre idu bēre. Avara hatra kōṭigaṭṭale duḍḍu, jāhīrātu, hesaru. Āru tingaḷu naṣṭadalli naḍesidrū avarige ēnū āgalla. Namage muchchōke āru tingaḷu sāku.
    en: The gas went and came back. Wages went up and we managed. But this is different. They have crores of money, advertising, a name. Even if they run at a loss for six months, nothing happens to them. For us, six months is enough to shut down.
  - who: kavya
    t: ಒಂದು ದಿನದ ಡೇಟಾ ನೋಡಿ ಹೆದರಬೇಡ. ಹೊಸ ಅಂಗಡಿ ತೆರೆದ ಮೊದಲ ವಾರ ಎಲ್ಲರೂ ಒಂದು ಸಲ ಹೋಗ್ತಾರೆ. ಪ್ರಶ್ನೆ ಏನಂದ್ರೆ, ಎರಡನೇ ಸಲ ಯಾರು ಹೋಗ್ತಾರೆ, ಯಾರು ವಾಪಸ್ ಬರ್ತಾರೆ. ನಾಲ್ಕು ವಾರ ಲೆಕ್ಕ ನೋಡೋಣ.
    tr: Ondu dinada ḍēṭā nōḍi hedarabēḍa. Hosa aṅgaḍi tereda modala vāra ellarū ondu sala hōgtāre. Praśne ēnandre, eraḍanē sala yāru hōgtāre, yāru vāpas bartāre. Nālku vāra lekka nōḍōṇa.
    en: Don't panic over one day's data. In a new shop's first week, everyone goes once. The question is who goes a second time and who comes back. Let's watch the numbers for four weeks.
  - who: nitin
    t: ನಾಲ್ಕು ವಾರ ನೋಡೋದು ಸರಿ. ಆದ್ರೆ ಕೈ ಕಟ್ಟಿ ಕೂರೋದು ಬೇಡ. ನಾವೂ ಏನಾದ್ರೂ ಮಾಡಬೇಕು. ಎಸಿ? ಕುರ್ಚಿ? ಇನ್‌ಸ್ಟಾಗ್ರಾಂ?
    tr: Nālku vāra nōḍōdu sari. Ādre kai kaṭṭi kūrōdu bēḍa. Nāvū ēnādrū māḍabēku. Esi? Kurchi? Instāgrām?
    en: Watching for four weeks is fine. But let's not sit with folded arms. We have to do something too. AC? Chairs? Instagram?
  - who: cook
    t: ಐನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್‌ನಲ್ಲಿ ಕುರ್ಚಿ ಹಾಕಿದ್ರೆ ಅದು ದರ್ಶಿನಿ ಅಲ್ಲ, ಗೋಡೌನ್. ಅವರ ಥರ ಆಗೋಕೆ ಹೋದ್ರೆ ನಾವು ಸೋಲ್ತೀವಿ. ಅವರು ಮಾಡೋಕಾಗದ್ದು ಏನು, ಅದನ್ನ ಯೋಚನೆ ಮಾಡಿ.
    tr: Ainūru skvēr fīṭ-nalli kurchi hākidre adu darśini alla, gōḍaun. Avara thara āgōke hōdre nāvu sōltīvi. Avaru māḍōkāgaddu ēnu, adanna yōchane māḍi.
    en: (From the hatch, without looking up) Put chairs in five hundred square feet and it's not a darshini, it's a godown. Try to become like them and we lose. Think about what they can't do.
  - who: amma
    t: ಅವರ ಸಾಂಬಾರ್ ಪುಡಿ ಪ್ಯಾಕೆಟ್‌ನಲ್ಲಿ ಬರುತ್ತೆ ಅಂತ ಶಂಕರ ಹೇಳ್ತಿದ್ದ. ನಮ್ಮದು ಈ ಕೈಯಲ್ಲಿ ಬರುತ್ತೆ. ಅದನ್ನ ಅವರು ದುಡ್ಡು ಕೊಟ್ಟು ಕೊಂಡ್ಕೊಳ್ಳೋಕಾಗಲ್ಲ.
    tr: Avara sāmbār puḍi pyākeṭ-nalli barutte anta Śaṅkara hēḷtidda. Nammadu ī kaiyalli barutte. Adanna avaru duḍḍu koṭṭu koṇḍkoḷḷōkāgalla.
    en: Shankara used to say their sambar powder comes in packets. Ours comes from these hands. That's something they can't buy with money.
  - section: What a chain can't copy
    learn: 'differentiation: avarige illaddu, yārū kāpi māḍōkāgalla · weekly specials: sōmavāra nīr dōse, guruvāra Maṅgaḷūru bans, bhānuvāra patroḍe · brass: hittāḷe lōṭa-ḍavara · regulars: ārḍar hēḷōdē bēḍa, ī bīdiyavanu · a trend in numbers: hadineṇṭu, hattu, aidu… hindina maṭṭakke'
  - scene: Sunday, 4 October, 10 p.m. Family meeting at the shop after closing. Basavaraj and Dev are scrubbing the griddle.
  - who: mahesh
    t: 'ನಾಲ್ಕು ವಿಷಯ ಯೋಚನೆ ಮಾಡಿದೀನಿ. ಒಂದು: ಕಾಫಿ. ಅವರದು ಮಷೀನ್ ಕಾಫಿ, ಅರವತ್ತು ರೂಪಾಯಿ. ನಮ್ಮದು ಪ್ರತಿ ಎರಡು ಗಂಟೆಗೆ ಹೊಸ ಡಿಕಾಕ್ಷನ್, ಹಿತ್ತಾಳೆ ಲೋಟ-ಡವರದಲ್ಲಿ, ನೊರೆ ಸಮೇತ, ಇಪ್ಪತ್ತೈದು. ಆ ವ್ಯತ್ಯಾಸ ಜನರ ಕಣ್ಣಿಗೆ ಕಾಣಬೇಕು.'
    tr: 'Nālku viṣaya yōchane māḍidīni. Ondu: kāphi. Avaradu maśīn kāphi, aravattu rūpāyi. Nammadu prati eraḍu gaṇṭege hosa ḍikākṣan, hittāḷe lōṭa-ḍavaradalli, nore samēta, ippattaidu. Ā vyatyāsa janara kaṇṇige kāṇabēku.'
    en: 'I''ve thought of four things. One: coffee. Theirs is machine coffee at sixty rupees. Ours is fresh decoction every two hours, served in a brass tumbler and davara, froth and all, at twenty-five. People have to be able to see that difference.'
  - who: kavya
    t: ನೂರು ಹಿತ್ತಾಳೆ ಲೋಟ-ಡವರ ಅಂದ್ರೆ ಸುಮಾರು ನಲವತ್ತು ಸಾವಿರ. ಕೆಲವು ಮಾಯ ಆಗಬಹುದು. ಆದ್ರೂ… ಸರಿ, ಐವತ್ತರಿಂದ ಶುರು ಮಾಡೋಣ.
    tr: Nūru hittāḷe lōṭa-ḍavara andre sumāru nalavattu sāvira. Kelavu māya āgabahudu. Ādrū… sari, aivattarinda śuru māḍōṇa.
    en: A hundred brass tumbler sets would be about forty thousand. Some may vanish. Still… all right, let's start with fifty.
  - who: mahesh
    t: 'ಎರಡು: ವಾರದ ವಿಶೇಷ, ಅಮ್ಮನ ಅಡುಗೆ. ಸೋಮವಾರ ನೀರ್ ದೋಸೆ, ಗುರುವಾರ ಮಂಗಳೂರು ಬನ್ಸ್, ಭಾನುವಾರ ಅಮ್ಮನ ಪತ್ರೊಡೆ. ಯಾವ ಚೈನ್ ಮೆನುವಿನಲ್ಲೂ ಇವು ಇಲ್ಲ.'
    tr: 'Eraḍu: vārada viśēṣa, Ammana aḍuge. Sōmavāra nīr dōse, guruvāra Maṅgaḷūru bans, bhānuvāra Ammana patroḍe. Yāva chain menuvinallū ivu illa.'
    en: 'Two: a weekly special, Amma''s cooking. Monday neer dose, Thursday Mangalore buns, Sunday Amma''s patrode. These aren''t on any chain''s menu.'
  - who: amma
    t: ಪತ್ರೊಡೆಗೆ ಕೆಸುವಿನ ಎಲೆ ಊರಿಂದಲೇ ಬರಬೇಕು. ಇಲ್ಲಿನ ಎಲೆ ಗಂಟಲು ತುರಿಸುತ್ತೆ. ರಮೇಶನಿಗೆ ಹೇಳು, ಉಡುಪಿ ಬಸ್‌ನಲ್ಲಿ ತರಿಸೋಕೆ.
    tr: Patroḍege kesuvina ele ūrindalē barabēku. Illina ele gaṇṭalu turisutte. Ramēśanige hēḷu, Uḍupi bas-nalli tarisōke.
    en: For patrode, the colocasia leaves have to come from home. The leaves here make your throat itch. Tell Ramesh to have them sent on the Udupi bus.
  - who: helper
    t: ನೀರ್ ದೋಸೆ ನಾನು ಹಾಕ್ತೀನ್ರಿ ಅಮ್ಮಾರ, ನೀವು ಹೇಳಿಕೊಡ್ರಿ. ಉತ್ತರ ಕರ್ನಾಟಕದ ಹುಡುಗ ಉಡುಪಿ ದೋಸೆ ಹಾಕಿದ್ರ, ಅದೇ ಒಂದು ಸುದ್ದಿ ಆಗತೈತಿ.
    tr: Nīr dōse nānu hāktīnri Ammāra, nīvu hēḷikoḍri. Uttara Karnāṭakada huḍuga Uḍupi dōse hākidra, adē ondu suddi āgataiti.
    en: 'I''ll make the neer dose, Amma; you teach me. A North Karnataka boy making an Udupi dosa: that''ll be news in itself.'
  - who: mahesh
    t: 'ಮೂರು: ಹೆಸರು. ಪ್ರತಿ ದಿನ ಬರೋರ ಹೆಸರು, ಅವರ ಕಾಫಿ ಹೇಗೆ ಅಂತ ನಮಗೆ ಗೊತ್ತು. ಅದನ್ನ ಇನ್ನೂ ಚೆನ್ನಾಗಿ ಮಾಡೋಣ. ನಾಲ್ಕು: ರೇಟ್. ಅವರ ಅರ್ಧ ರೇಟ್‌ನಲ್ಲಿ ಅವರಿಗಿಂತ ಬಿಸಿ ತಿಂಡಿ, ಐದು ನಿಮಿಷದಲ್ಲಿ.'
    tr: 'Mūru: hesaru. Prati dina barōra hesaru, avara kāphi hēge anta namage gottu. Adanna innū chennāgi māḍōṇa. Nālku: rēṭ. Avara ardha rēṭ-nalli avariginta bisi tiṇḍi, aidu nimiṣadalli.'
    en: 'Three: names. We know the names of the people who come every day and how they take their coffee. Let''s do that even better. Four: price. Hotter food than theirs, at half their price, in five minutes.'
  - who: nitin
    t: ಮತ್ತೆ ಒಂದು ಸಣ್ಣ ಇನ್‌ಸ್ಟಾಗ್ರಾಂ ಪೇಜ್. ದುಡ್ಡಿನ ಜಾಹೀರಾತು ಬೇಡ. ಬೆಳಗ್ಗೆ ಐದು ಗಂಟೆಗೆ ಶಂಕರಣ್ಣನ ಕಾವಲಿ, ಅಮ್ಮನ ಚಟ್ನಿ, ದೇವ್‌ನ ಕನ್ನಡ. ಅದನ್ನ ಯಾರೂ ಕಾಪಿ ಮಾಡೋಕಾಗಲ್ಲ.
    tr: Matte ondu saṇṇa Instāgrām pēj. Duḍḍina jāhīrātu bēḍa. Beḷagge aidu gaṇṭege Śaṅkaraṇṇana kāvali, Ammana chaṭni, Dēv-na Kannaḍa. Adanna yārū kāpi māḍōkāgalla.
    en: And a small Instagram page. No paid ads. Shankara-anna's griddle at five in the morning, Amma's chutney, Dev's Kannada. Nobody can copy that.
  - who: cook
    t: ನನ್ನ ಮುಖ ಬೇಡ, ಕಾವಲಿ ಮಾತ್ರ ತೋರಿಸು. ಕಾವಲಿ ನನಗಿಂತ ಚೆನ್ನಾಗಿ ಕಾಣುತ್ತೆ.
    tr: Nanna mukha bēḍa, kāvali mātra tōrisu. Kāvali nanaginta chennāgi kāṇutte.
    en: Not my face; show only the griddle. The griddle looks better than I do.
  - section: Leaves on the Udupi bus
    learn: 'supply chains: kattarisida tarakāri pyākeṭ-nalli, lāri, gōḍaun, pārsel raśīdi · judging produce: hasiru, dappa, daṇṭu kappagide · paying ahead: duḍḍu muñchenē koḍtīni · market wisdom: … sāyōdu ruchi badalādāga mātra'
  - scene: Saturday, 10 October, 5:15 a.m. Ramesh's tempo at the shutter. On top of the vegetable crates sits a bundle wrapped in wet newspaper.
  - who: supplier
    t: ಮಹೇಶಣ್ಣ, ಅಮ್ಮನ ಎಲೆ! ರಾತ್ರಿ ಉಡುಪಿ ಬಸ್‌ನಲ್ಲಿ ಬಂತು. ಪಾರ್ಸೆಲ್ ರಶೀದಿನೂ ಇದೆ, ನೋಡಿ. ನಿಮ್ಮ ಮನೆಯವರಿಗೆ ತೋರಿಸಿ, ಇಲ್ಲಾಂದ್ರೆ ನನ್ನನ್ನೂ ಊರಿಂದ ಹೊರಗೆ ಹಾಕ್ತಾರೆ.
    tr: Mahēśaṇṇa, ammana ele! Rātri Uḍupi bas-nalli bantu. Pārsel raśīdinū ide, nōḍi. Nimma maneyavarige tōrisi, illāndre nannannū ūrinda horage hāktāre.
    en: Mahesh-anna, Amma's leaves! They came on the Udupi bus last night. There's a parcel receipt too, look. Show it to your wife, or she'll throw me out of town as well.
  - who: mahesh
    t: ರಶೀದಿ ಸಮೇತ ಕೆಸುವಿನ ಎಲೆ! ಕಾವ್ಯ ಖುಷಿಪಡ್ತಾಳೆ. ರಮೇಶಣ್ಣ, ಆ ಹೊಸ ಕೆಫೆಗೆ ತರಕಾರಿ ಯಾರು ಕೊಡ್ತಾರೆ?
    tr: Raśīdi samēta kesuvina ele! Kāvya khuṣipaḍtāḷe. Rameśaṇṇa, ā hosa kephege tarakāri yāru koḍtāre?
    en: Colocasia leaves with a receipt! Kavya will be thrilled. Ramesh-anna, who supplies vegetables to that new café?
  - who: supplier
    t: ಅವರಿಗೆ ನಮ್ಮಂಥವರು ಬೇಡ. ಊರಿನ ಹೊರಗಿನ ದೊಡ್ಡ ಗೋಡೌನ್‌ನಿಂದ ಕತ್ತರಿಸಿದ ತರಕಾರಿ ಪ್ಯಾಕೆಟ್‌ನಲ್ಲಿ ಬರುತ್ತೆ, ಲಾರಿಯಲ್ಲಿ. ಬೆಳಗ್ಗೆ ಮಾರ್ಕೆಟ್‌ನಲ್ಲಿ ಯಾವ ಟೊಮ್ಯಾಟೋ ಚೆನ್ನಾಗಿದೆ ಅಂತ ಅವರಿಗೆ ಗೊತ್ತಿಲ್ಲ, ಗೊತ್ತಾಗೋದೂ ಬೇಡ.
    tr: Avarige nammanthavaru bēḍa. Ūrina horagina doḍḍa gōḍaun-ninda kattarisida tarakāri pyākeṭ-nalli barutte, lāriyalli. Beḷagge mārkeṭ-nalli yāva ṭomyāṭō chennāgide anta avarige gottilla, gottāgōdū bēḍa.
    en: They don't need people like us. Their vegetables come ready-cut in packets, by lorry, from a big warehouse outside the city. They don't know which tomatoes are good at the market in the morning, and they don't need to.
  - who: amma
    t: ಎಲೆ ನೋಡು ಮಹೇಶ. ಹಸಿರು, ದಪ್ಪ, ದಂಟು ಕಪ್ಪಗಿದೆ. ಇದೇ ಸರಿಯಾದ ಕೆಸು, ಗಂಟಲು ತುರಿಸಲ್ಲ. ರಮೇಶ, ಪ್ರತಿ ಶುಕ್ರವಾರ ರಾತ್ರಿ ಬೇಕು. ದುಡ್ಡು ಮುಂಚೆನೇ ಕೊಡ್ತೀನಿ.
    tr: Ele nōḍu Mahēśa. Hasiru, dappa, daṇṭu kappagide. Idē sariyāda kesu, gaṇṭalu turisalla. Ramēśa, prati śukravāra rātri bēku. Duḍḍu muñchenē koḍtīni.
    en: Look at these leaves, Mahesha. Green, thick, and the stalks are dark. This is the right colocasia; it won't make your throat itch. Ramesha, I want them every Friday night. I'll pay in advance.
  - who: supplier
    t: 'ಮುಂಚೆ ದುಡ್ಡು ಯಾರೂ ಕೊಡಲ್ಲ ಅಮ್ಮ, ನೀವೊಬ್ಬರೇ. ಮಹೇಶಣ್ಣ, ಚೈನ್ ಬಂದ್ರೆ ಭಯ ಬೇಡ. ಮೂವತ್ತು ವರ್ಷದಿಂದ ಮಾರ್ಕೆಟ್‌ನಲ್ಲಿ ನೋಡಿದೀನಿ: ದೊಡ್ಡ ಅಂಗಡಿ ಬಂದಾಗ ಸಣ್ಣ ಅಂಗಡಿ ಸಾಯೋದು ಅದರ ರುಚಿ ಬದಲಾದಾಗ ಮಾತ್ರ.'
    tr: 'Muñche duḍḍu yārū koḍalla amma, nīvobbarē. Mahēśaṇṇa, chain bandre bhaya bēḍa. Mūvattu varṣadinda mārkeṭ-nalli nōḍidīni: doḍḍa aṅgaḍi bandāga saṇṇa aṅgaḍi sāyōdu adara ruchi badalādāga mātra.'
    en: 'Nobody pays in advance, Amma; only you. Mahesh-anna, don''t be afraid of the chain. I''ve watched the market for thirty years: when a big shop arrives, a small one dies only if its own taste changes.'
  - who: mahesh
    t: ರುಚಿ ಬದಲಾಗಲ್ಲ. ಕೈ ಅದೇ, ಕಾವಲಿ ಅದೇ, ಎಲೆ ಕೂಡ ಅದೇ ಊರಿಂದ.
    tr: Ruchi badalāgalla. Kai adē, kāvali adē, ele kūḍa adē ūrinda.
    en: The taste won't change. Same hands, same griddle, and even the leaves come from the same place.
  - scene: Saturday, 24 October, 7:30 a.m. Sam comes up to the counter. Brass tumblers gleam on a new shelf.
  - who: sam
    t: ಮಹೇಶ್ ಅವರೇ, ಒಂದು ತಪ್ಪೊಪ್ಪಿಗೆ. ಹೋದ ವಾರ ಆ ಹೊಸ ಕೆಫೆಗೆ ಹೋಗಿದ್ದೆ. ಕಾಫಿ ಚೆನ್ನಾಗಿತ್ತು, ಎಸಿ ಚೆನ್ನಾಗಿತ್ತು. ಆದ್ರೆ ಯಾರಿಗೂ ನನ್ನ ಹೆಸರು ಗೊತ್ತಿಲ್ಲ. ಕಪ್ ಮೇಲೆ ‘ಸ್ಯಾಮ್’ ಬದಲಿಗೆ ‘ಸ್ಯಾಂಡಿ’ ಅಂತ ಬರೆದಿದ್ರು.
    tr: Mahēś avarē, ondu tappoppige. Hōda vāra ā hosa kephege hōgidde. Kāphi chennāgittu, esi chennāgittu. Ādre yārigū nanna hesaru gottilla. Kap mēle ‘Syām’ badalige ‘Syāṇḍi’ anta baredidru.
    en: Mahesh, a confession. Last week I went to that new café. The coffee was good, the AC was good. But nobody knows my name. On the cup, instead of ‘Sam’ they wrote ‘Sandy’.
  - who: dev
    t: 'ಸ್ಯಾಮ್ ಸಾರ್: ಸ್ಟ್ರಾಂಗ್, ಸಕ್ಕರೆ ಕಮ್ಮಿ, ಹಿತ್ತಾಳೆ ಲೋಟದಲ್ಲಿ. ಆರ್ಡರ್ ಹೇಳೋದೇ ಬೇಡ. ಮತ್ತೆ ಇವತ್ತು ಶನಿವಾರ, ಅಜ್ಜಿಗೆ ಇಡ್ಲಿ ಪಾರ್ಸೆಲ್. ಹಾರ್ಟ್ ಆಪರೇಷನ್ ಆದ್ಮೇಲೆ ಕೇಸರಿ ಬಾತ್ ಬೇಡ ಅಂತ ಡಾಕ್ಟರ್ ಹೇಳಿದ್ದಾರೆ, ಅಲ್ವಾ?'
    tr: 'Syām sār: sṭrāṅg, sakkare kammi, hittāḷe lōṭadalli. Ārḍar hēḷōdē bēḍa. Matte ivattu śanivāra, ajjige iḍli pārsel. Hārṭ āparēṣan ādmēle kēsari bāt bēḍa anta ḍākṭar hēḷiddāre, alvā?'
    en: 'Sam sir: strong, less sugar, in a brass tumbler. You don''t even need to order. And today is Saturday, so an idli parcel for Ajji. Since her heart procedure the doctor has said no kesari bath, right?'
  - who: sam
    t: ನೋಡಿದ್ರಾ? ಇದನ್ನ ಯಾವ ಚೈನ್ ಕೂಡ ಕೊಡೋಕಾಗಲ್ಲ. ಇಲ್ಲಿ ನಾನು ಗಿರಾಕಿ ಅಲ್ಲ, ಈ ಬೀದಿಯವನು.
    tr: Nōḍidrā? Idanna yāva chain kūḍa koḍōkāgalla. Illi nānu girāki alla, ī bīdiyavanu.
    en: See? No chain can give you this. Here I'm not a customer; I belong to this street.
  - who: customer
    t: ನಾನೂ ಹೋಗಿದ್ದೆ, ನಿಜ ಹೇಳ್ತೀನಿ. ನೂರ ಮೂವತ್ತು ರೂಪಾಯಿ ದೋಸೆ, ಇಪ್ಪತ್ತು ನಿಮಿಷ ಕಾಯಬೇಕು. ಇಲ್ಲಿ ತೊಂಬತ್ತು, ಐದು ನಿಮಿಷ. ಮತ್ತೆ ಆ ಪತ್ರೊಡೆ ಭಾನುವಾರ ಮಾತ್ರನಾ? ಶನಿವಾರನೂ ಮಾಡಿ.
    tr: Nānū hōgidde, nija hēḷtīni. Nūra mūvattu rūpāyi dōse, ippattu nimiṣa kāyabēku. Illi tombattu, aidu nimiṣa. Matte ā patroḍe bhānuvāra mātranā? Śanivāranū māḍi.
    en: (The elderly walker) I went too, I'll be honest. A hundred-and-thirty-rupee dosa and a twenty-minute wait. Here it's ninety and five minutes. And is that patrode only on Sundays? Make it on Saturdays too.
  - who: amma
    t: ಎಲೆ ಬಂದ್ರೆ ಮಾಡ್ತೀನಿ. ಎಲ್ಲಾ ಉಡುಪಿ ಬಸ್‌ನ ಕೈಯಲ್ಲಿದೆ.
    tr: Ele bandre māḍtīni. Ellā Uḍupi bas-na kaiyallide.
    en: If the leaves come, I'll make it. It's all up to the Udupi bus.
  - scene: That night, Kavya turns her laptop round so Mahesh can see the chart.
  - who: kavya
    t: ನಾಲ್ಕು ವಾರದ ಲೆಕ್ಕ. ಮೊದಲ ವಾರ ಹದಿನೆಂಟು ಪರ್ಸೆಂಟ್ ಕಮ್ಮಿ, ಎರಡನೇ ವಾರ ಹತ್ತು, ಮೂರನೇ ವಾರ ಐದು. ಈ ವಾರ ಬೆಳಗಿನ ಬಿಲ್ ಹಿಂದಿನ ಮಟ್ಟಕ್ಕೆ ಬಂದಿದೆ. ಕಾಲೇಜ್ ಹುಡುಗರು ಅಲ್ಲೇ ಇದ್ದಾರೆ, ಆದ್ರೆ ನಮ್ಮ ಹಳೇ ಗಿರಾಕಿಗಳು ವಾಪಸ್ ಬಂದಿದ್ದಾರೆ. ಭಾನುವಾರದ ಪತ್ರೊಡೆ ಹನ್ನೊಂದು ಗಂಟೆಗೆ ಖಾಲಿ.
    tr: Nālku vārada lekka. Modala vāra hadineṇṭu parsenṭ kammi, eraḍanē vāra hattu, mūranē vāra aidu. Ī vāra beḷagina bil hindina maṭṭakke bandide. Kālēj huḍugaru allē iddāre, ādre namma haḷē girākigaḷu vāpas bandiddāre. Bhānuvārada patroḍe hannondu gaṇṭege khāli.
    en: Four weeks of numbers. The first week eighteen percent down, the second ten, the third five. This week the morning bills are back to the old level. The college kids are still over there, but our old regulars have come back. Sunday's patrode was sold out by eleven.
  - who: mahesh
    t: ಹುಡುಗರು ಅಲ್ಲೇ ಇರಲಿ. ತಿಂಗಳ ಕೊನೆಗೆ ಅವರ ಜೇಬು ಖಾಲಿ ಆದಾಗ, ಇಲ್ಲಿ ಬಿಸಿ ಇಡ್ಲಿ ಕಾಯ್ತಿರುತ್ತೆ. ನಲವತ್ತು ರೂಪಾಯಿಗೆ.
    tr: Huḍugaru allē irali. Tingaḷa konege avara jēbu khāli ādāga, illi bisi iḍli kāytirutte. Nalavattu rūpāyige.
    en: Let the kids stay there. At the end of the month, when their pockets are empty, a hot idli will be waiting here. For forty rupees.
  - chapter: Chapter 10 — One year
  - section: Eight rupees a litre
    learn: 'another price rise: līṭar-ge eṇṭu rūpāyi jāsti, nīli pyākeṭ, mosaru · quick arithmetic: dinakke munnūra aravattu, tingaḷige sumāru hannondu sāvira · absorbing a cost: nāvē hotkoḷḷōṇa, Janavarivarege · reasons: raitarige jāsti koḍōke'
  - scene: Wednesday, 28 October 2026, 5 a.m. The Nandini agent's crates are stacked by the door. Latha, in early, reads the news on her phone.
  - who: cashier
    t: 'ಸಾರ್, ನ್ಯೂಸ್: ನವೆಂಬರ್ ಒಂದರಿಂದ ನಂದಿನಿ ಹಾಲು ಲೀಟರ್‌ಗೆ ಎಂಟು ರೂಪಾಯಿ ಜಾಸ್ತಿ. ನೀಲಿ ಪ್ಯಾಕೆಟ್ ನಲವತ್ತಾರರಿಂದ ಐವತ್ನಾಲ್ಕು. ಮೊಸರು ಲೀಟರ್‌ಗೆ ಹದಿನಾಲ್ಕು ಜಾಸ್ತಿ. ರೈತರಿಗೆ ಜಾಸ್ತಿ ಕೊಡೋಕೆ ಅಂತ ಸರ್ಕಾರ ಹೇಳ್ತಿದೆ.'
    tr: 'Sār, nyūs: Navembar ondarinda Nandini hālu līṭar-ge eṇṭu rūpāyi jāsti. Nīli pyākeṭ nalavattārarinda aivatnālku. Mosaru līṭar-ge hadinālku jāsti. Raitarige jāsti koḍōke anta sarkāra hēḷtide.'
    en: 'Sir, news: from the first of November, Nandini milk goes up eight rupees a litre. The blue packet from forty-six to fifty-four. Curd up fourteen a litre. The government says it''s so that farmers get more.'
  - who: mahesh
    t: ದಿನಕ್ಕೆ ನಲವತ್ತೈದು ಲೀಟರ್. ಅಂದ್ರೆ ದಿನಕ್ಕೆ ಮುನ್ನೂರ ಅರವತ್ತು, ತಿಂಗಳಿಗೆ ಸುಮಾರು ಹನ್ನೊಂದು ಸಾವಿರ. ಮೊಸರು ಸೇರಿಸಿದ್ರೆ ಇನ್ನೂ ಜಾಸ್ತಿ. ತುಪ್ಪನೂ ಏರುತ್ತೆ ಅಂತ ಮಾತಿದೆ. ಕಾಫಿ ರೇಟ್ ಮತ್ತೆ ಏರಿಸಬೇಕಾ?
    tr: Dinakke nalavattaidu līṭar. Andre dinakke munnūra aravattu, tingaḷige sumāru hannondu sāvira. Mosaru sērisidre innū jāsti. Tuppanū ērutte anta mātide. Kāphi rēṭ matte ērisabēkā?
    en: Forty-five litres a day. That's three hundred and sixty a day, about eleven thousand a month. More with the curd. There's talk that ghee will go up too. Do we raise the coffee price again?
  - who: cook
    t: ರೈತರಿಗೆ ಹೋಗೋ ದುಡ್ಡಿಗೆ ನಾನು ಬೈಯಲ್ಲ. ನಮ್ಮೂರಲ್ಲಿ ನನ್ನ ಅಣ್ಣನ ಮನೆಯಲ್ಲಿ ಎರಡು ದನ ಇವೆ, ಹಾಲು ಡೈರಿಗೆ ಹಾಕ್ತಾನೆ. ಅವನಿಗೆ ಲೀಟರ್‌ಗೆ ಏನು ಸಿಗುತ್ತೆ ಅಂತ ನನಗೆ ಗೊತ್ತು.
    tr: Raitarige hōgō duḍḍige nānu baiyalla. Nammūralli nanna aṇṇana maneyalli eraḍu dana ive, hālu ḍairige hāktāne. Avanige līṭar-ge ēnu sigutte anta nanage gottu.
    en: I won't curse money that goes to farmers. Back home my elder brother has two cows and pours his milk at the dairy. I know what he gets for a litre.
  - who: amma
    t: ಕಾಫಿ ಇಪ್ಪತ್ತೈದೇ ಇರಲಿ. ಜೂನ್‌ನಲ್ಲಿ ಏರಿಸಿದ್ದೀವಿ, ಇನ್ನೂ ಆರು ತಿಂಗಳೂ ಆಗಿಲ್ಲ. ಹಾಲಿನ ಏರಿಕೆಯನ್ನ ನಾವೇ ಹೊತ್ಕೊಳ್ಳೋಣ, ಜನವರಿವರೆಗೆ.
    tr: Kāphi ippattaidē irali. Jūn-nalli ērisiddīvi, innū āru tingaḷū āgilla. Hālina ērikeyanna nāvē hotkoḷḷōṇa, Janavarivarege.
    en: Let the coffee stay at twenty-five. We raised it in June; it hasn't even been six months. We'll carry the milk increase ourselves, until January.
  - who: mahesh
    t: ಸರಿ. ಜನವರಿಯಲ್ಲಿ ಲೆಕ್ಕ ನೋಡಿ ನಿರ್ಧಾರ. ಲತಾ, ಈ ಸಲ ಬೋರ್ಡ್ ಬೇಡ. ಬದಲಾಗಿರೋದು ನಮ್ಮ ಖರ್ಚು ಮಾತ್ರ, ಗಿರಾಕಿಯ ಬಿಲ್ ಅಲ್ಲ.
    tr: Sari. Janavariyalli lekka nōḍi nirdhāra. Latā, ī sala bōrḍ bēḍa. Badalāgirōdu namma kharchu mātra, girākiya bil alla.
    en: All right. We decide in January after looking at the numbers. Latha, no board this time. What's changed is only our cost, not the customer's bill.
  - who: dev
    t: ಸಾರ್, ಹಾಗಾದ್ರೆ ನಾನು ಹಾಲು ಕಾಯಿಸೋವಾಗ ಒಂದು ಹನಿನೂ ಉಕ್ಕಿ ಚೆಲ್ಲಲ್ಲ. ಪ್ರಾಮಿಸ್.
    tr: Sār, hāgādre nānu hālu kāyisōvāga ondu haninū ukki chellalla. Prāmis.
    en: Sir, then when I boil the milk, not one drop will boil over. Promise.
  - section: The landlord's coffee
    learn: 'lease reminders: Janavariyinda aidu parsenṭ ērike, lāk-in mugida mēle · a tempting offer reported: … koḍtīvi andru · loyalty and its limits: aidu parsenṭē, adakkinta ondu rūpāyinū kammi illa · old-man humour: ḍākṭar ājñe'
  - scene: Friday, 30 October, 6:30 a.m. Mr. Venkatesh Murthy comes down the stairs in his shawl, walking stick in hand, as he does most mornings now.
  - who: landlord
    t: ಮಹೇಶ, ಒಂದು ಕಾಫಿ. ಸಕ್ಕರೆ ಇಲ್ಲ, ಡಾಕ್ಟರ್ ಆಜ್ಞೆ. ಲೀಸ್‌ಗೆ ಸಹಿ ಹಾಕಿ ಒಂದು ವರ್ಷ ಆಗ್ತಾ ಬಂತಲ್ಲ? ಹೇಗಿತ್ತು ವರ್ಷ?
    tr: Mahēśa, ondu kāphi. Sakkare illa, ḍākṭar ājñe. Līs-ge sahi hāki ondu varṣa āgtā bantalla? Hēgittu varṣa?
    en: Mahesha, a coffee. No sugar, doctor's orders. It's nearly a year since you signed the lease, isn't it? How was the year?
  - who: mahesh
    t: ಸಾರ್, ಗ್ಯಾಸ್ ಇಲ್ಲದ ತಿಂಗಳು, ಸಂಬಳದ ಆದೇಶ, ನೋಟಿಸ್, ಚೈನ್ ಕೆಫೆ… ಒಂದು ವರ್ಷದಲ್ಲಿ ಹತ್ತು ವರ್ಷದ ಪಾಠ. ಆದ್ರೆ ಒಂದು ತಿಂಗಳೂ ನಿಮ್ಮ ಬಾಡಿಗೆ ತಡ ಆಗಿಲ್ಲ.
    tr: Sār, gyās illada tingaḷu, sambaḷada ādēśa, nōṭis, chain kephe… ondu varṣadalli hattu varṣada pāṭha. Ādre ondu tingaḷū nimma bāḍige taḍa āgilla.
    en: Sir, a month without gas, the wage order, a notice, a chain café… ten years of lessons in one year. But not one month was your rent late.
  - who: landlord
    t: ಅದು ಗೊತ್ತು. ಐದನೇ ತಾರೀಖು ಹತ್ತು ಗಂಟೆಗೆ ಮುಂಚೆ ನನ್ನ ಫೋನ್‌ಗೆ ಮೆಸೇಜ್ ಬರುತ್ತೆ. ಜನವರಿಯಿಂದ ಐದು ಪರ್ಸೆಂಟ್ ಏರಿಕೆ, ಒಂದು ಲಕ್ಷ ಐದು ಸಾವಿರ. ಅದು ಲೀಸ್‌ನಲ್ಲಿದೆ, ನೆನಪಿರಲಿ.
    tr: Adu gottu. Aidanē tārīkhu hattu gaṇṭege muñche nanna phōn-ge mesēj barutte. Janavariyinda aidu parsenṭ ērike, ondu lakṣa aidu sāvira. Adu līs-nallide, nenapirali.
    en: 'I know. On the fifth, before ten o''clock, the message comes to my phone. From January there''s the five percent increase: one lakh five thousand. It''s in the lease; don''t forget.'
  - who: mahesh
    t: ನೆನಪಿದೆ ಸಾರ್. ಕಾವ್ಯನ ಶೀಟ್‌ನಲ್ಲಿ ಜನವರಿಯ ಸಾಲು ಆಗಲೇ ಹಳದಿ ಬಣ್ಣದಲ್ಲಿದೆ.
    tr: Nenapide sār. Kāvyana śīṭ-nalli Janavariya sālu āgalē haḷadi baṇṇadallide.
    en: I remember, sir. In Kavya's sheet, January's row is already highlighted in yellow.
  - who: landlord
    t: ಇನ್ನೊಂದು ವಿಷಯ ಹೇಳಬೇಕು. ಹೋದ ವಾರ ಆ ಚೈನ್ ಕೆಫೆಯವರು ಇಬ್ರು ಸೂಟ್ ಹಾಕ್ಕೊಂಡು ಬಂದಿದ್ರು. ‘ಲಾಕ್-ಇನ್ ಮುಗಿದ ಮೇಲೆ ಈ ಜಾಗ ನಮಗೆ ಕೊಡಿ, ಒಂದೂವರೆ ಲಕ್ಷ ಬಾಡಿಗೆ ಕೊಡ್ತೀವಿ’ ಅಂದ್ರು.
    tr: Innondu viṣaya hēḷabēku. Hōda vāra ā chain kepheyavaru ibru sūṭ hākkoṇḍu bandidru. ‘Lāk-in mugida mēle ī jāga namage koḍi, ondūvare lakṣa bāḍige koḍtīvi’ andru.
    en: There's something else I should tell you. Last week two men in suits from that chain café came to see me. They said, ‘When the lock-in ends, give us this space. We'll pay a lakh and a half in rent.’
  - who: mahesh
    t: ಒಂದೂವರೆ ಲಕ್ಷ… ಸಾರ್, ನೀವೇನು ಹೇಳಿದ್ರಿ?
    tr: Ondūvare lakṣa… sār, nīvēnu hēḷidri?
    en: (After a long pause) A lakh and a half… Sir, what did you tell them?
  - who: landlord
    t: 'ಮಾರ್ಚ್‌ನಲ್ಲಿ ನನ್ನ ಮನೆ ಸಿಲಿಂಡರ್ ಬುಕ್ ಆಗದೆ ಇದ್ದಾಗ ಹತ್ತು ದಿನ ಬೆಳಗ್ಗೆ ಮೇಲೆ ಇಡ್ಲಿ ಕಳಿಸಿದ್ದು ಯಾರು? ನಿನ್ನ ಅಮ್ಮ. ಆ ಸೂಟ್‌ನವರಲ್ಲ. ‘ನನಗೆ ಬಾಡಿಗೆದಾರ ಇದಾನೆ, ಹೋಗಿ’ ಅಂದೆ. ಆದ್ರೆ ಕೇಳು: ಏರಿಕೆ ಐದು ಪರ್ಸೆಂಟೇ. ಅದಕ್ಕಿಂತ ಒಂದು ರೂಪಾಯಿನೂ ಕಮ್ಮಿ ಇಲ್ಲ.'
    tr: 'Mārch-nalli nanna mane silinḍar buk āgade iddāga hattu dina beḷagge mēle iḍli kaḷisiddu yāru? Ninna amma. Ā sūṭ-navaralla. ‘Nanage bāḍigedāra idāne, hōgi’ ande. Ādre kēḷu: ērike aidu parsenṭē. Adakkinta ondu rūpāyinū kammi illa.'
    en: 'In March, when I couldn''t book a cylinder for my own kitchen, who sent idlis upstairs every morning for ten days? Your mother. Not those men in suits. I told them, ‘I have a tenant. Off you go.’ But listen: the increase is five percent. Not one rupee less.'
  - who: mahesh
    t: ಐದು ಪರ್ಸೆಂಟ್ ಸಾರ್, ಒಂದು ರೂಪಾಯಿನೂ ಕಮ್ಮಿ ಬೇಡ. ಮತ್ತೆ ಈ ಕಾಫಿಗೆ ಬಿಲ್ ಇಲ್ಲ.
    tr: Aidu parsenṭ sār, ondu rūpāyinū kammi bēḍa. Matte ī kāphige bil illa.
    en: Five percent, sir, and not one rupee less. And there's no bill for this coffee.
  - who: landlord
    t: ಬಿಲ್ ಇಲ್ಲದ ಕಾಫಿ? ನಿನ್ನ ಹೆಂಡತಿಗೆ ಗೊತ್ತಾದ್ರೆ…
    tr: Bil illada kāphi? Ninna heṇḍatige gottādre…
    en: A coffee without a bill? If your wife finds out…
  - who: mahesh
    t: 'ಅವಳ ಶೀಟ್‌ನಲ್ಲಿ ಇದಕ್ಕೇ ಒಂದು ಕಾಲಂ ಇದೆ ಸಾರ್: ‘ಮೂರ್ತಿ ಸಾರ್ ಕಾಫಿ’.'
    tr: 'Avaḷa śīṭ-nalli idakkē ondu kālam ide sār: ‘Mūrti sār kāphi’.'
    en: 'Her sheet has a column just for this, sir: ‘Murthy sir''s coffee’.'
  - section: An offer from the chain
    learn: 'an honest exit talk: nēravāgi mātāḍōnu, hēḷade hōgōnu kaḷḷa · comparing offers: nalavatteṇṭu vs mūvattaidu, hadimūru sāvira vyatyāsa, varṣakke ondūvare lakṣa · a counter-offer within limits: nanninda āgōdu iṣṭu, baḍḍi illada muṅgaḍa, sambaḷadalli kaḷeyōṇa · letting go with dignity: khuṣiyinda kaḷistīni, bāgilu tegedirutte'
  - scene: Friday, 30 October, 10 p.m. Everyone else has gone. Shankara stays back, washes his hands slowly, and sits down on a crate opposite Mahesh.
  - who: cook
    t: ಯಜಮಾನ್ರೇ, ನಾನು ನೇರವಾಗಿ ಮಾತಾಡೋನು, ನಿಮಗೆ ಗೊತ್ತು. ಹೊಸ ಕೆಫೆಯ ಮ್ಯಾನೇಜರ್ ಮೂರು ಸಲ ಬಂದಿದ್ದ. ಅವರ ಸೆಂಟ್ರಲ್ ಕಿಚನ್‌ಗೆ ಹೆಡ್ ಕುಕ್ ಬೇಕಂತೆ. ತಿಂಗಳಿಗೆ ನಲವತ್ತೆಂಟು ಸಾವಿರ, ರೂಮ್, ಪಿಎಫ್, ಇನ್ಶೂರೆನ್ಸ್. ವಾರಕ್ಕೆ ಒಂದು ದಿನ ರಜೆ.
    tr: Yajamānrē, nānu nēravāgi mātāḍōnu, nimage gottu. Hosa kepheya myānējar mūru sala bandidda. Avara senṭral kichan-ge heḍ kuk bēkante. Tingaḷige nalavatteṇṭu sāvira, rūm, pi-eph, inśūrens. Vārakke ondu dina raje.
    en: Boss, I'm a man who speaks straight; you know that. The new café's manager has come three times. They need a head cook for their central kitchen. Forty-eight thousand a month, a room, PF, insurance. One day off a week.
  - who: mahesh
    t: ನಲವತ್ತೆಂಟು… ನಾನು ಕೊಡ್ತಿರೋದು ಮೂವತ್ತೈದು. ಹದಿಮೂರು ಸಾವಿರ ವ್ಯತ್ಯಾಸ. ಶಂಕರಣ್ಣ, ಹೇಳಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ನೀವು ಹೇಳದೆ ಹೋಗಬಹುದಿತ್ತು.
    tr: Nalavatteṇṭu… nānu koḍtirōdu mūvattaidu. Hadimūru sāvira vyatyāsa. Śaṅkaraṇṇa, hēḷiddakke dhanyavāda. Nīvu hēḷade hōgabahudittu.
    en: Forty-eight… I'm paying thirty-five. A difference of thirteen thousand. Shankara-anna, thank you for telling me. You could have just gone without a word.
  - who: cook
    t: ಹೇಳದೆ ಹೋಗೋನು ಅಡುಗೆಯವನಲ್ಲ, ಕಳ್ಳ. ಮುಂದಿನ ವರ್ಷ ನನ್ನ ಮಗಳ ಮದುವೆ. ಹದಿಮೂರು ಸಾವಿರ ಅಂದ್ರೆ ವರ್ಷಕ್ಕೆ ಒಂದೂವರೆ ಲಕ್ಷಕ್ಕಿಂತ ಜಾಸ್ತಿ. ಅದು ಸಣ್ಣ ದುಡ್ಡಲ್ಲ. ಯೋಚನೆ ಮಾಡ್ತಿದೀನಿ, ಸುಳ್ಳು ಹೇಳಲ್ಲ.
    tr: Hēḷade hōgōnu aḍugeyavanalla, kaḷḷa. Mundina varṣa nanna magaḷa maduve. Hadimūru sāvira andre varṣakke ondūvare lakṣakkinta jāsti. Adu saṇṇa duḍḍalla. Yōchane māḍtidīni, suḷḷu hēḷalla.
    en: A man who leaves without telling isn't a cook; he's a thief. My daughter gets married next year. Thirteen thousand a month is more than a lakh and a half a year. That's not small money. I'm thinking about it; I won't lie.
  - who: mahesh
    t: 'ನಾನೂ ಸುಳ್ಳು ಹೇಳಲ್ಲ. ನಲವತ್ತೆಂಟು ನನ್ನಿಂದ ಆಗಲ್ಲ. ಈ ವರ್ಷದ ಒಟ್ಟು ಲಾಭವೇ ಅಷ್ಟಿಲ್ಲ; ಶನಿವಾರ ಕಾವ್ಯ ಲೆಕ್ಕ ತೋರಿಸ್ತಾಳೆ, ನೀವೂ ಇರಿ. ನನ್ನಿಂದ ಆಗೋದು ಇಷ್ಟು: ನವೆಂಬರ್‌ನಿಂದ ಮೂವತ್ತೆಂಟು. ದೀಪಾವಳಿಗೆ ಮಾತು ಕೊಟ್ಟ ಒಂದು ತಿಂಗಳ ಬೋನಸ್, ಪೂರ್ತಿ.'
    tr: 'Nānū suḷḷu hēḷalla. Nalavatteṇṭu nanninda āgalla. Ī varṣada oṭṭu lābhavē aṣṭilla; śanivāra Kāvya lekka tōristāḷe, nīvū iri. Nanninda āgōdu iṣṭu: Navembar-ninda mūvatteṇṭu. Dīpāvaḷige mātu koṭṭa ondu tingaḷa bōnas, pūrti.'
    en: 'I won''t lie either. I can''t do forty-eight. This year''s entire profit isn''t that much; Kavya will show the accounts on Saturday, and you should be there. What I can do is this: thirty-eight from November. And the one month''s Deepavali bonus I promised, in full.'
  - who: mahesh
    t: ಮತ್ತೆ ಮಗಳ ಮದುವೆಗೆ ಒಂದು ಲಕ್ಷ, ಬಡ್ಡಿ ಇಲ್ಲದ ಮುಂಗಡ. ತಿಂಗಳಿಗೆ ಐದು ಸಾವಿರ ಸಂಬಳದಲ್ಲಿ ಕಳೆಯೋಣ. ಇದು ಕಾವ್ಯನ ಶೀಟ್‌ನಲ್ಲಿದೆ, ಸುಮ್ಮನೆ ಹೇಳ್ತಿಲ್ಲ. ಇದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಬೇಕು ಅಂದ್ರೆ, ಹೋಗಿ. ಖುಷಿಯಿಂದ ಕಳಿಸ್ತೀನಿ, ಈ ಬಾಗಿಲು ನಿಮಗೆ ಯಾವಾಗಲೂ ತೆರೆದಿರುತ್ತೆ.
    tr: Matte magaḷa maduvege ondu lakṣa, baḍḍi illada muṅgaḍa. Tingaḷige aidu sāvira sambaḷadalli kaḷeyōṇa. Idu Kāvyana śīṭ-nallide, summane hēḷtilla. Idakkinta jāsti bēku andre, hōgi. Khuṣiyinda kaḷistīni, ī bāgilu nimage yāvāgalū teredirutte.
    en: And for your daughter's wedding, one lakh as an interest-free advance. We'll deduct five thousand a month from your salary. It's in Kavya's sheet; I'm not just saying it. If you need more than this, go. I'll see you off gladly, and this door will always be open to you.
  - who: cook
    t: ಒಂದು ಮಾತು ಕೇಳಿ. ಅವರ ಸೆಂಟ್ರಲ್ ಕಿಚನ್‌ನಲ್ಲಿ ನಾನು ಏನು ಮಾಡ್ತೀನಿ ಗೊತ್ತಾ? ದಿನಕ್ಕೆ ಐನೂರು ಲೀಟರ್ ಸಾಂಬಾರ್, ಅವರ ರೆಸಿಪಿ ಕಾರ್ಡ್ ಪ್ರಕಾರ, ಪ್ಯಾಕೆಟ್ ಪುಡಿಯಲ್ಲಿ. ಅದು ಲಾರಿಯಲ್ಲಿ ಹತ್ತು ಅಂಗಡಿಗೆ ಹೋಗುತ್ತೆ. ತಿನ್ನೋರ ಮುಖ ನಾನು ಯಾವತ್ತೂ ನೋಡಲ್ಲ.
    tr: Ondu mātu kēḷi. Avara senṭral kichan-nalli nānu ēnu māḍtīni gottā? Dinakke ainūru līṭar sāmbār, avara resipi kārḍ prakāra, pyākeṭ puḍiyalli. Adu lāriyalli hattu aṅgaḍige hōgutte. Tinnōra mukha nānu yāvattū nōḍalla.
    en: Listen to this. Do you know what I'd do in their central kitchen? Five hundred litres of sambar a day, by their recipe card, from packet powder. It goes by lorry to ten shops. I'd never see the face of a single person who eats it.
  - who: mahesh
    t: ಅದು ನಿಮಗೆ ಗೊತ್ತು ಅಂತ ನನಗೆ ಗೊತ್ತು. ಆದ್ರೆ ಆ ಮಾತು ಹೇಳಿ ನಿಮ್ಮನ್ನ ಇಲ್ಲಿ ಕಟ್ಟಿಹಾಕೋಕೆ ನನಗೆ ಇಷ್ಟ ಇಲ್ಲ. ಮಗಳ ಮದುವೆ ಮುಖ್ಯ. ಎರಡು ದಿನ ಯೋಚನೆ ಮಾಡಿ, ಮನೆಯವರ ಜೊತೆ ಮಾತಾಡಿ.
    tr: Adu nimage gottu anta nanage gottu. Ādre ā mātu hēḷi nimmanna illi kaṭṭihākōke nanage iṣṭa illa. Magaḷa maduve mukhya. Eraḍu dina yōchane māḍi, maneyavara jote mātāḍi.
    en: I know you know that. But I don't want to tie you down here with that argument. Your daughter's wedding matters. Think for two days; talk to your family.
  - who: cook
    t: 'ಮನೆಯವರ ಜೊತೆ ನಿನ್ನೆನೇ ಮಾತಾಡಿದೆ. ನನ್ನ ಹೆಂಡತಿ ಒಂದೇ ಮಾತು ಹೇಳಿದ್ಲು: ‘ಗ್ಯಾಸ್ ಇಲ್ಲದ ತಿಂಗಳಲ್ಲೂ ಹುಡುಗರ ಸಂಬಳ ನಿಲ್ಲಿಸದ ಯಜಮಾನನ್ನ ಹದಿಮೂರು ಸಾವಿರಕ್ಕೆ ಬಿಟ್ರೆ, ಮಗಳ ಮದುವೆ ಚಪ್ಪರದಲ್ಲಿ ಯಾರ ಮುಖ ನೋಡ್ತೀರಿ?’'
    tr: 'Maneyavara jote ninnenē mātāḍide. Nanna heṇḍati ondē mātu hēḷidlu: ‘Gyās illada tingaḷallū huḍugara sambaḷa nillisada yajamānanna hadimūru sāvirakke biṭre, magaḷa maduve chapparadalli yāra mukha nōḍtīri?’'
    en: 'I spoke to my family yesterday itself. My wife said just one thing: ‘If you leave, for thirteen thousand, the boss who didn''t stop the boys'' wages even in the month without gas, whose face will you look at under the wedding canopy?’'
  - who: cook
    t: 'ಮೂವತ್ತೆಂಟು, ಬೋನಸ್, ಮುಂಗಡ, ಒಪ್ಪಿದೆ. ಆದ್ರೆ ನನ್ನದೂ ಒಂದು ಕಂಡೀಷನ್: ಈ ಸಲದ ಕೋಟೇಶ್ವರದ ಕೊಡಿ ಹಬ್ಬಕ್ಕೆ ಒಂದು ವಾರ ಹೋಗ್ತೀನಿ. ಆ ವಾರ ಬಸವರಾಜ ಕಾವಲಿ ನೋಡ್ಕೋತಾನೆ. ಅವನು ಈಗ ಹತ್ತಕ್ಕೆ ಹತ್ತು.'
    tr: 'Mūvatteṇṭu, bōnas, muṅgaḍa, oppide. Ādre nannadū ondu kaṇḍīṣan: ī salada Kōṭēśvarada koḍi habbakke ondu vāra hōgtīni. Ā vāra Basavarāja kāvali nōḍkōtāne. Avanu īga hattakke hattu.'
    en: 'Thirty-eight, the bonus, the advance: agreed. But I have one condition too: I''m going for a week to this year''s Kodi Habba at Koteshwara. That week Basavaraj handles the griddle. He''s ten out of ten now.'
  - who: mahesh
    t: ಅದು ಕಂಡೀಷನ್ ಅಲ್ಲ ಶಂಕರಣ್ಣ, ಮೊದಲ ದಿನದ ಒಪ್ಪಂದ. ನೆನಪಿದೆ. ಹೋಗಿ ಬನ್ನಿ. ದೇವರಿಗೆ ನಮ್ಮ ಪರವಾಗಿಯೂ ಒಂದು ನಮಸ್ಕಾರ.
    tr: Adu kaṇḍīṣan alla Śaṅkaraṇṇa, modala dinada oppanda. Nenapide. Hōgi banni. Dēvarige namma paravāgiyū ondu namaskāra.
    en: That's not a condition, Shankara-anna; it was in our agreement from day one. I remember. Go, and come back. Offer a namaskara to the deity on our behalf too.
  - section: One year of accounts
    learn: 'year-end figures: oṭṭu kalekṣan, oṭṭu naṣṭa, nivvaḷa lābha, ī-em-ai, bāki · two meanings of break-even: tingaḷa lekkadalli vs baṇḍavāḷada lekkadalli · profit sharing from the deed: eppattu-mūvattu, modala varṣa yārū lābha tegeyalla · honest books: illadidre lekka suḷḷu hēḷutte'
  - scene: Saturday, 31 October, 10:30 p.m. A year to the day since Mahesh's last day as a hotel supervisor. The shutter is half down. Kavya's laptop sits on the counter; Nitin, Amma and Shankara stand around it.
  - who: kavya
    t: ಒಂದು ವರ್ಷದ ಹಿಂದೆ ಇದೇ ರಾತ್ರಿ ನೀನು ರಿಸೈನ್ ಮಾಡಿ ಬಂದಿದ್ದೆ, ಕೈ ನಡುಗ್ತಿತ್ತು. ಈಗ ಲೆಕ್ಕ. ಜನವರಿ ಇಪ್ಪತ್ತಾರರಿಂದ ಇವತ್ತಿನವರೆಗೆ ಒಟ್ಟು ಕಲೆಕ್ಷನ್ ಐವತ್ತೈದು ಲಕ್ಷ ಎಪ್ಪತ್ತು ಸಾವಿರ.
    tr: Ondu varṣada hinde idē rātri nīnu risain māḍi bandidde, kai naḍugtittu. Īga lekka. Janavari ippattārarinda ivattinavarege oṭṭu kalekṣan aivattaidu lakṣa eppattu sāvira.
    en: 'A year ago tonight you came home having resigned, and your hand was shaking. Now the accounts. From the twenty-sixth of January to today, total takings: fifty-five lakh seventy thousand.'
  - who: mahesh
    t: ಐವತ್ತೈದು ಲಕ್ಷ… ಬ್ಯಾಂಕ್‌ಗೆ ಕೊಟ್ಟ ಪ್ರಾಜೆಕ್ಟ್ ರಿಪೋರ್ಟ್‌ನಲ್ಲಿ ದಿನಕ್ಕೆ ಮೂವತ್ತು ಸಾವಿರ ಅಂತ ಬರೆದಿದ್ವಿ. ನಿಜದಲ್ಲಿ ಇಪ್ಪತ್ತೊಂದು, ಇಪ್ಪತ್ತೆರಡು.
    tr: Aivattaidu lakṣa… byāṅk-ge koṭṭa prājekṭ ripōrṭ-nalli dinakke mūvattu sāvira anta baredidvi. Nijadalli ippattondu, ippatteraḍu.
    en: Fifty-five lakh… In the project report we gave the bank, we wrote thirty thousand a day. In reality it's twenty-one, twenty-two.
  - who: kavya
    t: 'ಪ್ರಾಜೆಕ್ಟ್ ರಿಪೋರ್ಟ್ ಕನಸು, ಬ್ಯಾಂಕ್ ಸ್ಟೇಟ್‌ಮೆಂಟ್ ನಿಜ. ಕೇಳು: ಜನವರಿಯಿಂದ ಮೇವರೆಗೆ ಒಟ್ಟು ನಷ್ಟ ಒಂದು ಲಕ್ಷ ಮೂರು ಸಾವಿರ. ಗ್ಯಾಸ್ ಇಲ್ಲದ ತಿಂಗಳು, ಗ್ಯಾಸ್ ಬೆಲೆ, ಎಲ್ಲಾ ಅದರಲ್ಲೇ. ಜೂನ್‌ನಿಂದ ಅಕ್ಟೋಬರ್‌ವರೆಗೆ ಲಾಭ ಒಂದು ಲಕ್ಷ ಐವತ್ತೈದು ಸಾವಿರ. ವರ್ಷದ ನಿವ್ವಳ ಲಾಭ: ಐವತ್ತೆರಡು ಸಾವಿರ.'
    tr: 'Prājekṭ ripōrṭ kanasu, byāṅk sṭēṭmenṭ nija. Kēḷu: Janavariyinda Mēvarege oṭṭu naṣṭa ondu lakṣa mūru sāvira. Gyās illada tingaḷu, gyās bele, ellā adarallē. Jūn-ninda Akṭōbar-varege lābha ondu lakṣa aivattaidu sāvira. Varṣada nivvaḷa lābha: aivatteraḍu sāvira.'
    en: 'A project report is a dream; a bank statement is the truth. Listen: from January to May, a total loss of one lakh three thousand. The month without gas, the gas price, it''s all in there. From June to October, a profit of one lakh fifty-five thousand. Net profit for the year: fifty-two thousand.'
  - who: nitin
    t: ಹಾಗಾದ್ರೆ ಬ್ರೇಕ್-ಈವನ್ ಆಯ್ತಾ, ಇಲ್ವಾ? ಒಂದೇ ಪದದಲ್ಲಿ ಹೇಳು.
    tr: Hāgādre brēk-īvan āytā, ilvā? Ondē padadalli hēḷu.
    en: So did we break even or not? Tell me in one word.
  - who: kavya
    t: ಒಂದು ಪದದಲ್ಲಿ ಆಗಲ್ಲ, ಎರಡು ಉತ್ತರ. ತಿಂಗಳ ಲೆಕ್ಕದಲ್ಲಿ ಹೌದು, ಜೂನ್‌ನಿಂದ ಪ್ರತಿ ತಿಂಗಳು ಲಾಭ. ಆದ್ರೆ ಅದು ಮಹೇಶ ಒಂದು ರೂಪಾಯಿ ಸಂಬಳ ತಗೊಳ್ಳದೆ. ಬಂಡವಾಳದ ಲೆಕ್ಕದಲ್ಲಿ ಇಲ್ಲ. ಹಾಕಿದ ಇಪ್ಪತ್ತೇಳು ಲಕ್ಷ ವಾಪಸ್ ಬರೋಕೆ ಇನ್ನೂ ನಾಲ್ಕೈದು ವರ್ಷ. ಅದೂ ಇನ್ನೊಂದು ಗ್ಯಾಸ್ ಯುದ್ಧ ಬರದಿದ್ರೆ.
    tr: Ondu padadalli āgalla, eraḍu uttara. Tingaḷa lekkadalli haudu, Jūn-ninda prati tingaḷu lābha. Ādre adu Mahēśa ondu rūpāyi sambaḷa tagoḷḷade. Baṇḍavāḷada lekkadalli illa. Hākida ippattēḷu lakṣa vāpas barōke innū nālkaidu varṣa. Adū innondu gyās yuddha baradidre.
    en: 'Not in one word; two answers. Month by month, yes: a profit every month since June. But that''s with Mahesh not taking a single rupee in salary. In terms of capital, no. Getting back the twenty-seven lakh we put in will take another four or five years. And that''s if another gas war doesn''t come.'
  - who: kavya
    t: 'ಇಎಂಐ: ಜುಲೈನಿಂದ ಪ್ರತಿ ತಿಂಗಳು ಇಪ್ಪತ್ಮೂರು ಸಾವಿರ, ಒಂದು ದಿನವೂ ತಡ ಆಗಿಲ್ಲ. ರಶ್ಮಿ ಮೇಡಂ ಹೋದ ವಾರ ಫೋನ್ ಮಾಡಿ ‘ನಿಮ್ಮ ಅಕೌಂಟ್ ನೋಡಿ ಖುಷಿ ಆಯ್ತು’ ಅಂದ್ರು. ಇವತ್ತು ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಮೂರು ಲಕ್ಷ ಹತ್ತು ಸಾವಿರ ಇದೆ. ನಿತಿನ್, ನಿನ್ನ ಎರಡು ಲಕ್ಷ ಸಾಲ ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ನಮ್ಮನ್ನ ಉಳಿಸಿತು. ಇವತ್ತೇ ಒಂದು ಲಕ್ಷ ವಾಪಸ್ ಕೊಡಬಹುದು.'
    tr: 'Ī-em-ai: Julai-ninda prati tingaḷu ippatmūru sāvira, ondu dinavū taḍa āgilla. Raśmi mēḍam hōda vāra phōn māḍi ‘nimma akauṇṭ nōḍi khuṣi āytu’ andru. Ivattu byāṅk-nalli mūru lakṣa hattu sāvira ide. Nitin, ninna eraḍu lakṣa sāla Ēpril-nalli nammanna uḷisitu. Ivattē ondu lakṣa vāpas koḍabahudu.'
    en: 'The EMI: twenty-three thousand every month since July, not one day late. Ms. Rashmi phoned last week and said, ‘I was happy to see your account.’ Today there''s three lakh ten thousand in the bank. Nitin, your two-lakh loan saved us in April. We can return one lakh today.'
  - who: nitin
    t: ಬೇಡ. ಮೊದಲು ಶಂಕರಣ್ಣನ ಮಗಳ ಮದುವೆಯ ಮುಂಗಡ, ಹುಡುಗರ ಬೋನಸ್. ನನ್ನದು ಮಾರ್ಚ್‌ನಿಂದ ತಿಂಗಳಿಗೆ ಇಪ್ಪತ್ತೈದು ಸಾವಿರ, ಎಂಟು ತಿಂಗಳಲ್ಲಿ ಮುಗಿಯುತ್ತೆ. ಡೀಡ್‌ಗೆ ಸೇರಿಸಿರೋ ಸಾಲದ ಪತ್ರದಲ್ಲಿ ಹಾಗೇ ಬರೆಯೋಣ.
    tr: Bēḍa. Modalu Śaṅkaraṇṇana magaḷa maduveya muṅgaḍa, huḍugara bōnas. Nannadu Mārch-ninda tingaḷige ippattaidu sāvira, eṇṭu tingaḷalli mugiyutte. Ḍīḍ-ge sērisirō sālada patradalli hāgē bareyōṇa.
    en: No. Shankara-anna's advance for his daughter's wedding comes first, and the boys' bonus. Mine can come back at twenty-five thousand a month from March; it'll be cleared in eight months. Let's write it that way in the loan letter attached to the deed.
  - who: kavya
    t: 'ಲಾಭದ ಹಂಚಿಕೆ: ಎಪ್ಪತ್ತು-ಮೂವತ್ತು. ನಿತಿನ್‌ನ ಪಾಲು ಹದಿನೈದು ಸಾವಿರದ ಆರುನೂರು. ಆದ್ರೆ ಡೀಡ್ ಪ್ರಕಾರ ಮೊದಲ ವರ್ಷ ಯಾರೂ ಲಾಭ ತೆಗೆಯಲ್ಲ, ಎಲ್ಲಾ ಬಿಸಿನೆಸ್‌ಗೇ.'
    tr: 'Lābhada hañchike: eppattu-mūvattu. Nitin-na pālu hadinaidu sāvirada ārunūru. Ādre ḍīḍ prakāra modala varṣa yārū lābha tegeyalla, ellā bisines-gē.'
    en: 'Profit sharing: seventy-thirty. Nitin''s share is fifteen thousand six hundred. But under the deed nobody takes profit out in the first year; it all goes back into the business.'
  - who: nitin
    t: 'ಒಪ್ಪಿದೆ. ಸ್ಲೀಪಿಂಗ್ ಪಾರ್ಟ್ನರ್‌ಗೆ ಮೊದಲ ವರ್ಷದ ಲಾಭ ಒಂದೇ: ರಾತ್ರಿ ಚೆನ್ನಾಗಿ ನಿದ್ದೆ ಬಂತು. ಮಾರ್ಚ್ ತಿಂಗಳು ಬಿಟ್ಟು.'
    tr: 'Oppide. Slīpiṅg pārṭnar-ge modala varṣada lābha ondē: rātri chennāgi nidde bantu. Mārch tingaḷu biṭṭu.'
    en: 'Agreed. A sleeping partner''s first-year profit is just one thing: he slept well at night. Except in March.'
  - who: kavya
    t: ಇನ್ನೊಂದು ಬದಲಾವಣೆ. ನವೆಂಬರ್‌ನಿಂದ ಮಹೇಶನಿಗೆ ಡೀಡ್ ಪ್ರಕಾರ ಇಪ್ಪತ್ತೈದು ಸಾವಿರ ಸಂಬಳ. ಇಲ್ಲದಿದ್ರೆ ನಮ್ಮ ಲೆಕ್ಕ ಸುಳ್ಳು ಹೇಳುತ್ತೆ. ಆ ಸಂಬಳ ಸೇರಿಸಿದ್ರೆ ನಿಜವಾದ ಬ್ರೇಕ್-ಈವನ್ ಇನ್ನೂ ಅಂಚಿನಲ್ಲೇ ಇದೆ. ಅದನ್ನ ಮರೆಯಬೇಡಿ.
    tr: Innondu badalāvaṇe. Navembar-ninda Mahēśanige ḍīḍ prakāra ippattaidu sāvira sambaḷa. Illadidre namma lekka suḷḷu hēḷutte. Ā sambaḷa sērisidre nijavāda brēk-īvan innū añchinallē ide. Adanna mareyabēḍi.
    en: One more change. From November, Mahesh draws a salary of twenty-five thousand, as the deed says. Otherwise our books tell a lie. Count that salary, and real break-even is still right on the edge. Don't forget that.
  - who: mahesh
    t: 'ಒಪ್ಪಿದೆ. ಆದ್ರೆ ನನ್ನ ಮೊದಲ ಸಂಬಳ ನನ್ನ ಕೈಗೆ ಬರಲ್ಲ. ದೀಪಾವಳಿ ಬೋನಸ್: ಶಂಕರಣ್ಣನಿಗೆ ಮಾತು ಕೊಟ್ಟ ಹಾಗೆ ಒಂದು ತಿಂಗಳ ಸಂಬಳ. ಬಸವರಾಜ, ದೇವ್, ಲತಾ, ಮೂವರಿಗೂ ಹತ್ತು ಹತ್ತು ಸಾವಿರ. ನನ್ನ ಇಪ್ಪತ್ತೈದು ಅದರೊಳಗೇ ಹೋಗಲಿ.'
    tr: 'Oppide. Ādre nanna modala sambaḷa nanna kaige baralla. Dīpāvaḷi bōnas: Śaṅkaraṇṇanige mātu koṭṭa hāge ondu tingaḷa sambaḷa. Basavarāja, Dēv, Latā, mūvarigū hattu hattu sāvira. Nanna ippattaidu adaroḷagē hōgali.'
    en: 'Agreed. But my first salary won''t reach my hands. Deepavali bonus: one month''s salary for Shankara-anna, as promised. Ten thousand each for Basavaraj, Dev and Latha. Let my twenty-five go into that.'
  - who: cook
    t: ಯಜಮಾನ ತನ್ನ ಸಂಬಳ ಬಿಟ್ಟು ಹುಡುಗರಿಗೆ ಬೋನಸ್ ಕೊಡೋದು ಇದೇ ಮೊದಲ ಸಲ ನೋಡ್ತಿದೀನಿ. ಕಾವ್ಯಮ್ಮ, ಇದನ್ನೂ ನಿಮ್ಮ ಶೀಟ್‌ನಲ್ಲಿ ಬರೆದಿಡಿ.
    tr: Yajamāna tanna sambaḷa biṭṭu huḍugarige bōnas koḍōdu idē modala sala nōḍtidīni. Kāvyamma, idannū nimma śīṭ-nalli barediḍi.
    en: This is the first time I've seen a boss give up his own salary to pay the boys a bonus. Kavyamma, write this in your sheet too.
  - who: kavya
    t: ಬರೆದಿದೀನಿ ಶಂಕರಣ್ಣ. ಒಂದು ಸಾಲು ಮಾತ್ರ ಉಳಿದಿದೆ. ಅಮ್ಮ, ಇದು ಲಾಕರ್ ಕೀ. ಒಂದು ವರ್ಷದಲ್ಲಿ ಒಂದು ಸಲವೂ ಆ ಲಾಕರ್ ತೆಗೆದಿಲ್ಲ. ಅಪ್ಪ ಮಾಡಿಸಿಕೊಟ್ಟ ದಿನ ನಿಮ್ಮ ಚಿನ್ನ ಹೇಗಿತ್ತೋ, ಹಾಗೇ ಇದೆ.
    tr: Baredidīni Śaṅkaraṇṇa. Ondu sālu mātra uḷidide. Amma, idu lākar kī. Ondu varṣadalli ondu salavū ā lākar tegedilla. Appa māḍisikoṭṭa dina nimma chinna hēgittō, hāgē ide.
    en: I have, Shankara-anna. Only one line is left. (She takes a small key from her purse.) Amma, this is the locker key. Not once in the whole year was that locker opened. Your gold is just as it was the day Appa had it made for you.
  - who: amma
    t: ನನ್ನ ಬೋನಸ್ ಅದೇ ಅಂತ ಹೇಳಿದ್ದೆ. ಸಿಕ್ತು. ಮಾರ್ಚ್‌ನ ಆ ರಾತ್ರಿಗಳಲ್ಲಿ ನಾನು ದೇವರ ಮುಂದೆ ದೀಪ ಹಚ್ಚಿ ಕೂತಿರ್ತಿದ್ದೆ. ನಿಮಗ್ಯಾರಿಗೂ ಹೇಳಿರಲಿಲ್ಲ.
    tr: Nanna bōnas adē anta hēḷidde. Siktu. Mārch-na ā rātrigaḷalli nānu dēvara munde dīpa hachchi kūtirtidde. Nimagyārigū hēḷiralilla.
    en: I told you that would be my bonus. I've got it. On those nights in March I used to sit in front of the gods with a lamp lit. I never told any of you.
  - who: nitin
    t: ಮುಂದಿನ ವರ್ಷದ ಪ್ಲಾನ್? ಆ್ಯಪ್? ಎರಡನೇ ಬ್ರಾಂಚ್?
    tr: Mundina varṣada plān? Æp? Eraḍanē brānch?
    en: Next year's plan? The apps? A second branch?
  - who: mahesh
    t: 'ರೋಹಿತ್‌ನ ಕಾರ್ಡ್ ಇನ್ನೂ ಡ್ರಾಯರ್‌ನಲ್ಲಿದೆ, ಜನವರಿಯಲ್ಲಿ ಮತ್ತೆ ಲೆಕ್ಕ ಹಾಕೋಣ. ಎರಡನೇ ಬ್ರಾಂಚ್ ಬೇಡ, ಮೊದಲನೇದು ಗಟ್ಟಿಯಾಗಿ ನಿಲ್ಲಲಿ. ಕೋರ್ಟ್‌ನಲ್ಲಿ ಸಂಬಳದ ಕೇಸ್ ಏನೇ ಆಗಲಿ, ನಮ್ಮ ಹುಡುಗರ ಸಂಬಳ ಇಳಿಯಲ್ಲ. ಮುಂದಿನ ವರ್ಷದ ಪ್ಲಾನ್ ಇಷ್ಟೇ: ಇಡ್ಲಿ ನಲವತ್ತು, ಎಷ್ಟು ದಿನ ಸಾಧ್ಯನೋ ಅಷ್ಟು ದಿನ.'
    tr: 'Rōhit-na kārḍ innū ḍrāyar-nallide, Janavariyalli matte lekka hākōṇa. Eraḍanē brānch bēḍa, modalanēdu gaṭṭiyāgi nillali. Kōrṭ-nalli sambaḷada kēs ēnē āgali, namma huḍugara sambaḷa iḷiyalla. Mundina varṣada plān iṣṭē: iḍli nalavattu, eṣṭu dina sādhyanō aṣṭu dina.'
    en: 'Rohit''s card is still in the drawer; we''ll do the sums again in January. No second branch; let the first one stand firm. Whatever happens to the wage case in court, our boys'' wages won''t come down. Next year''s plan is just this: idli at forty, for as long as it''s possible.'
  - section: Envelopes
    learn: 'giving and receiving thanks: nanna jote nintiddakke, koḍada mātu · callbacks: kanasallū Kannaḍa, hattu rūpāyi vyatyāsa, taṇṇagina sāmbār · Rajyotsava: Kannaḍa Rājyōtsavada śubhāśayagaḷu'
  - scene: 11:15 p.m. The staff, called back from their room, stand in a row by the counter. Mahesh hands out envelopes.
  - who: mahesh
    t: ದೀಪಾವಳಿ ಮುಂದಿನ ವಾರ. ಆದ್ರೆ ನಾಳೆ ಒಂದನೇ ತಾರೀಖು, ಸಂಬಳದ ದಿನ. ಅದರ ಜೊತೆ ಇದು. ಒಂದು ವರ್ಷ ನನ್ನ ಜೊತೆ ನಿಂತಿದ್ದಕ್ಕೆ.
    tr: Dīpāvaḷi mundina vāra. Ādre nāḷe ondanē tārīkhu, sambaḷada dina. Adara jote idu. Ondu varṣa nanna jote nintiddakke.
    en: Deepavali is next week. But tomorrow is the first, salary day. This comes with it. For standing by me for a year.
  - who: helper
    t: ಸಾಹೇಬ್ರ, ಹತ್ತು ಸಾವಿರ! ತಂಗಿಯ ಕೊನೆ ವರ್ಷದ ಕಾಲೇಜ್ ಫೀಸ್ ಪೂರ್ತಿ ಆತ್ರಿ. ಅವ್ವಗ ಈಗಲೇ ಫೋನ್ ಮಾಡ್ತೀನಿ, ಆಕಿ ಅಳತಾಳ.
    tr: Sāhēbra, hattu sāvira! Taṅgiya kone varṣada kālēj phīs pūrti ātri. Avvaga īgalē phōn māḍtīni, āki aḷatāḷa.
    en: Sir, ten thousand! That's my sister's final-year college fees, all of it. I'll phone my mother right now. She'll cry.
  - who: cashier
    t: 'ಸಾರ್, ನನ್ನ ಕವರ್‌ನಲ್ಲಿ ದುಡ್ಡಿನ ಜೊತೆ ಒಂದು ಚೀಟಿ ಇದೆ: ‘ಹತ್ತು ರೂಪಾಯಿ ವ್ಯತ್ಯಾಸವನ್ನೂ ಮುಚ್ಚಿಡದ ಲತಾಗೆ.’ ಈ ಚೀಟಿ ದುಡ್ಡಿಗಿಂತ ಜಾಸ್ತಿ.'
    tr: 'Sār, nanna kavar-nalli duḍḍina jote ondu chīṭi ide: ‘Hattu rūpāyi vyatyāsavannū muchchiḍada Latāge.’ Ī chīṭi duḍḍiginta jāsti.'
    en: 'Sir, along with the money in my envelope there''s a note: ‘To Latha, who never hid even a ten-rupee difference.’ This note is worth more than the money.'
  - who: dev
    t: ಸಾರ್, ಒಂದು ವರ್ಷದ ಹಿಂದೆ ನನಗೆ ‘ನಮಸ್ಕಾರ’ ಮಾತ್ರ ಗೊತ್ತಿತ್ತು. ಈಗ ಕನ್ನಡದಲ್ಲಿ ಕನಸು ಕಾಣ್ತೀನಿ, ಕನ್ನಡದಲ್ಲಿ ಜಗಳ ಆಡ್ತೀನಿ, ಕನ್ನಡದಲ್ಲಿ ಚಾರ್ಟ್ ಬರೀತೀನಿ, ಒಂದು ಕೊಂಬು ಜಾಸ್ತಿ ಇದ್ರೂ. ನಾಳೆ ರಾಜ್ಯೋತ್ಸವ. ನಾಳೆ ಮೊದಲ ಗಿರಾಕಿಗೆ ನಾನೇ ‘ಬನ್ನಿ’ ಅಂತೀನಿ.
    tr: Sār, ondu varṣada hinde nanage ‘namaskāra’ mātra gottittu. Īga Kannaḍadalli kanasu kāṇtīni, Kannaḍadalli jagaḷa āḍtīni, Kannaḍadalli chārṭ barītīni, ondu kombu jāsti idrū. Nāḷe Rājyōtsava. Nāḷe modala girākige nānē ‘banni’ antīni.
    en: Sir, a year ago all I knew was ‘namaskara’. Now I dream in Kannada, argue in Kannada, write charts in Kannada, even with one extra kombu. Tomorrow is Rajyotsava. Tomorrow I'll be the one to say ‘banni’ to the first customer.
  - who: cook
    t: ಸರಿ ಸರಿ, ಭಾಷಣ ಸಾಕು. ಎಲ್ರೂ ಹೋಗಿ ಮಲಗಿ. ನಾಳೆ ನಾಲ್ಕೂವರೆಗೆ ಸಾಂಬಾರ್. ಎರಡನೇ ವರ್ಷದ ಮೊದಲ ಸಾಂಬಾರ್ ತಣ್ಣಗಾದ್ರೆ, ನಾನೇ ಎಲ್ರಿಗೂ ನೋಟಿಸ್ ಕೊಡ್ತೀನಿ. ಬರವಣಿಗೆಯಲ್ಲಿ.
    tr: Sari sari, bhāṣaṇa sāku. Ellrū hōgi malagi. Nāḷe nālkūvarege sāmbār. Eraḍanē varṣada modala sāmbār taṇṇagādre, nānē ellrigū nōṭis koḍtīni. Baravaṇigeyalli.
    en: All right, all right, enough speeches. Everyone go to bed. Sambar at half past four tomorrow. If the first sambar of the second year goes cold, I'll give you all a notice myself. In writing.
  - section: Five in the morning
    learn: 'looking back: ondu varṣada hinde idē dina…, nenapideyā?, ibbrū gedvi · what a hotel is: iṣṭu janara maneya ole · the first sale again: bōṇi, nōṭu phrēm māḍisōṇa · a closing welcome: banni, eraḍanē varṣa śuru'
  - scene: Sunday, 1 November 2026, 4:55 a.m. Kannada Rajyotsava. A small red-and-yellow flag hangs over the board. The first crate of milk at the new price stands by the boiler. Shankara lights the griddle; Mahesh and Amma stand at the counter. The street is still dark.
  - who: amma
    t: ಒಂದು ವರ್ಷದ ಹಿಂದೆ ಇದೇ ದಿನ ಬೆಳಗ್ಗೆ ನೀನು ‘ಅಮ್ಮ, ನಾನು ಕೆಲಸ ಬಿಟ್ಟೆ’ ಅಂದಾಗ ನನ್ನ ಕೈಯಿಂದ ಕಾಫಿ ಲೋಟ ಬಿದ್ದಿತ್ತು. ನೆನಪಿದೆಯಾ?
    tr: Ondu varṣada hinde idē dina beḷagge nīnu ‘amma, nānu kelasa biṭṭe’ andāga nanna kaiyinda kāphi lōṭa biddittu. Nenapideyā?
    en: A year ago this very morning, when you said, ‘Amma, I've quit my job,’ the coffee tumbler fell out of my hand. Do you remember?
  - who: mahesh
    t: ನೆನಪಿದೆ. ಆಮೇಲೆ ನೀನು ‘ಚಿನ್ನ ಅಡ ಇಡು’ ಅಂದೆ, ನಾನು ‘ಬೇಡ’ ಅಂದೆ. ಕೊನೆಗೆ ಇಬ್ರೂ ಗೆದ್ವಿ.
    tr: Nenapide. Āmēle nīnu ‘chinna aḍa iḍu’ ande, nānu ‘bēḍa’ ande. Konege ibrū gedvi.
    en: I remember. Then you said, ‘Pawn the gold,’ and I said, ‘No.’ In the end, we both won.
  - who: amma
    t: ಗೆದ್ದಿದ್ದು ನಾವಲ್ಲ, ಮಗು. ಆ ಹುಡುಗರು. ದೇವ್‌ನ ಅಮ್ಮನ ಮನೆಗೆ ಮಳೆಗೆ ಮಾಡು, ಬಸವರಾಜನ ತಂಗಿಗೆ ಫೀಸ್, ಶಂಕರನ ಮಗಳಿಗೆ ಮದುವೆ. ಹೋಟೆಲ್ ಅಂದ್ರೆ ಇಡ್ಲಿ ಮಾತ್ರ ಅಲ್ಲ. ಇಷ್ಟು ಜನರ ಮನೆಯ ಒಲೆ.
    tr: Geddiddu nāvalla, magu. Ā huḍugaru. Dēv-na ammana manege maḷege māḍu, Basavarājana taṅgige phīs, Śaṅkarana magaḷige maduve. Hōṭel andre iḍli mātra alla. Iṣṭu janara maneya ole.
    en: It wasn't us who won, child. It was those boys. A roof against the rain for Dev's mother, fees for Basavaraj's sister, a wedding for Shankara's daughter. A hotel isn't just idli. It's the hearth fire of all these homes.
  - who: cook
    t: ಯಜಮಾನ್ರೇ, ಕಾವಲಿ ಬಿಸಿ ಆಗಿದೆ. ಎರಡನೇ ವರ್ಷದ ಮೊದಲ ದೋಸೆ ಯಾರಿಗೆ?
    tr: Yajamānrē, kāvali bisi āgide. Eraḍanē varṣada modala dōse yārige?
    en: Boss, the griddle's hot. Who gets the first dosa of the second year?
  - who: mahesh
    t: ಮೊದಲ ಗಿರಾಕಿಗೆ. ಅದೇ ನಿಯಮ.
    tr: Modala girākige. Adē niyama.
    en: The first customer. That's the rule.
  - scene: 5:02 a.m. Footsteps. The elderly walker from the cold-sambar morning, a shawl over her head, is first at the counter.
  - who: customer
    t: ಇಷ್ಟು ಬೇಗ ತೆಗೆದಿದೀರಾ? ವಾಕಿಂಗ್‌ಗೆ ಮುಂಚೆ ಒಂದು ಬೈಟು ಕಾಫಿ ಬೇಕಿತ್ತು. ಸಿಗುತ್ತಾ?
    tr: Iṣṭu bēga tegedidīrā? Vākiṅg-ge muñche ondu baiṭu kāphi bēkittu. Siguttā?
    en: Open this early? I wanted a by-two coffee before my walk. Can I get one?
  - who: dev
    t: ಬನ್ನಿ ಮೇಡಂ! ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವದ ಶುಭಾಶಯಗಳು. ನೀವು ನಮ್ಮ ಎರಡನೇ ವರ್ಷದ ಮೊದಲ ಗಿರಾಕಿ. ಬೈಟು ಕಾಫಿ, ಹಿತ್ತಾಳೆ ಲೋಟದಲ್ಲಿ. ಸಾಂಬಾರ್ ಬಿಸಿ ಇದೆ, ನಾನೇ ನೋಡಿದೆ.
    tr: Banni mēḍam! Kannaḍa Rājyōtsavada śubhāśayagaḷu. Nīvu namma eraḍanē varṣada modala girāki. Baiṭu kāphi, hittāḷe lōṭadalli. Sāmbār bisi ide, nānē nōḍide.
    en: Banni, madam! Happy Kannada Rajyotsava. You are the first customer of our second year. A by-two coffee, in a brass tumbler. The sambar is hot; I checked myself.
  - who: customer
    t: ಎರಡನೇ ವರ್ಷನಾ? ಆಗ್ಲೇ ಒಂದು ವರ್ಷ ಆಯ್ತಾ? ಆ ತಣ್ಣಗಿನ ಸಾಂಬಾರ್ ದಿನ ‘ಇನ್ನು ಇಲ್ಲಿಗೆ ಬರಲ್ಲ’ ಅಂದ್ಕೊಂಡಿದ್ದೆ. ಮರುದಿನನೂ ಬಂದೆ, ಆಮೇಲೆ ದಿನಾ.
    tr: Eraḍanē varṣanā? Āglē ondu varṣa āytā? Ā taṇṇagina sāmbār dina ‘innu illige baralla’ andkoṇḍidde. Marudinanū bande, āmēle dinā.
    en: The second year? Has it been a year already? On the day of the cold sambar I'd decided, ‘I'm never coming here again.’ I came the very next day too, and every day since.
  - who: mahesh
    t: ಮೇಡಂ, ಇವತ್ತು ಕಾಫಿ ಜೊತೆ ಶಂಕರಣ್ಣನ ಮೊದಲ ದೋಸೆ ನಿಮಗೆ. ಅದಕ್ಕೆ ಬಿಲ್ ಇಲ್ಲ.
    tr: Mēḍam, ivattu kāphi jote Śaṅkaraṇṇana modala dōse nimage. Adakke bil illa.
    en: Madam, today Shankara-anna's first dosa comes with your coffee. There's no bill for that.
  - who: customer
    t: ದೋಸೆ ನಿನ್ನ ಪ್ರೀತಿ, ತಗೊಳ್ತೀನಿ. ಆದ್ರೆ ಕಾಫಿಗೆ ದುಡ್ಡು ಕೊಡ್ತೀನಿ. ಬಿಲ್ ಇಲ್ಲದೆ ಬೋಣಿ ಆಗುತ್ತಾ? ತಗೋ, ಇಪ್ಪತ್ತೈದು ರೂಪಾಯಿ.
    tr: Dōse ninna prīti, tagoḷtīni. Ādre kāphige duḍḍu koḍtīni. Bil illade bōṇi āguttā? Tagō, ippattaidu rūpāyi.
    en: The dosa is your kindness; I'll take it. But I'll pay for the coffee. Can there be a first sale without a bill? Here, twenty-five rupees.
  - who: mahesh
    t: ಅಮ್ಮ, ಈ ನೋಟುಗಳನ್ನೂ ಫ್ರೇಮ್ ಮಾಡಿಸೋಣ. ಮೊದಲ ದಿನದ ಎಪ್ಪತ್ತು ರೂಪಾಯಿಯ ಪಕ್ಕ.
    tr: Amma, ī nōṭugaḷannū phrēm māḍisōṇa. Modala dinada eppattu rūpāyiya pakka.
    en: Amma, let's have these notes framed too. Next to the seventy rupees from the first day.
  - who: amma
    t: ಫ್ರೇಮ್ ಆಮೇಲೆ. ಮೊದಲು ಚಟ್ನಿ ಹಾಕು. ಸಾಲು ಶುರುವಾಗ್ತಿದೆ ನೋಡು.
    tr: Phrēm āmēle. Modalu chaṭni hāku. Sālu śuruvāgtide nōḍu.
    en: Frames later. Serve the chutney first. Look, the queue is starting.
  - who: sam
    t: 'ಶುಭಾಶಯಗಳು ಮಹೇಶ್ ಅವರೇ! ಇವತ್ತು ರಾಜ್ಯೋತ್ಸವ, ಅದಕ್ಕೆ ಇಂಗ್ಲಿಷ್ ಪದ ಇಲ್ಲದೆ ಆರ್ಡರ್ ಮಾಡ್ತೀನಿ… ಅಯ್ಯೋ, ‘ಆರ್ಡರ್’ ಕೂಡ ಇಂಗ್ಲಿಷ್! ಸರಿ: ಎರಡು ಇಡ್ಲಿ, ಒಂದು ಕಾಫಿ, ಸಕ್ಕರೆ ಕಮ್ಮಿ. ಮತ್ತೆ ಅಜ್ಜಿಗೆ ಚಟ್ನಿ ಜಾಸ್ತಿ.'
    tr: 'Śubhāśayagaḷu Mahēś avarē! Ivattu Rājyōtsava, adakke iṅgliṣ pada illade ārḍar māḍtīni… ayyō, ‘ārḍar’ kūḍa iṅgliṣ! Sari: eraḍu iḍli, ondu kāphi, sakkare kammi. Matte ajjige chaṭni jāsti.'
    en: 'Greetings, Mahesh! It''s Rajyotsava today, so I''ll order without a single English word… oh no, ‘order’ is English too! All right: two idlis, one coffee, less sugar. And extra chutney for Ajji.'
  - who: mahesh
    t: ಬನ್ನಿ, ಎಲ್ರೂ ಬನ್ನಿ. ಇಡ್ಲಿ ನಲವತ್ತು, ಕಾಫಿ ಇಪ್ಪತ್ತೈದು, ಚಟ್ನಿ ಎಷ್ಟು ಬೇಕೋ ಅಷ್ಟು. ಎರಡನೇ ವರ್ಷ ಶುರು.
    tr: Banni, ellrū banni. Iḍli nalavattu, kāphi ippattaidu, chaṭni eṣṭu bēkō aṣṭu. Eraḍanē varṣa śuru.
    en: Come in, everyone, come in. Idli forty, coffee twenty-five, as much chutney as you like. The second year begins.
  - scene: The street light flickers off. The first bus to the metro goes past. Steam rises from the idli steamer, and the second year of Sharada Darshini begins.
