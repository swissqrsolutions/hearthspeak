    tr: Sāmānyavāgi aidu varṣa. Hattu parsenṭ andkoṇḍre tingaḷige sumāru ippattondu sāvirada innūraivattu. Śuruvinalli kelavu tingaḷu moraṭōriyam kēḷabahudu, ādre adu kreḍiṭ ṭīm tīrmāna. Nānu īgalē prāmis māḍalla.
