    t: 'ನಮಸ್ಕಾರ ಮಹೇಶ್ ಅವರೇ. ರಾಜ್ಯೋತ್ಸವ ತಿಂಗಳಲ್ಲಿ ಹೊಸ ಬಿಸಿನೆಸ್‌ಗೆ ಜಾಗ ನೋಡ್ತಿದೀರಿ, ಒಳ್ಳೆ ಶಕುನ. ಇವತ್ತು ಮೂರು ತೋರಿಸ್ತೀನಿ. ಮೊದಲು ನನ್ನ ರೂಲ್ ಹೇಳ್ಬಿಡ್ತೀನಿ: ಡೀಲ್ ಆದ್ರೆ ಒಂದು ತಿಂಗಳ ಬಾಡಿಗೆ ನನ್ನ ಕಮಿಷನ್. ಆಗದಿದ್ರೆ ಒಂದು ರೂಪಾಯಿನೂ ಇಲ್ಲ.'
    tr: 'Namaskāra Mahēś avarē. Rājyōtsava tingaḷalli hosa bisines-ge jāga nōḍtidīri, oḷḷe śakuna. Ivattu mūru tōristīni. Modalu nanna rūl hēḷbiḍtīni: ḍīl ādre ondu tingaḷa bāḍige nanna kamiṣan. Āgadidre ondu rūpāyinū illa.'
    en: 'Hello, Mahesh. Looking for a place for a new business in Rajyotsava month, that''s a good omen. I''ll show you three today. Let me tell you my rule first: if the deal happens, one month''s rent is my commission. If it doesn''t, not a single rupee.'
  - who: mahesh
    t: ಸರಿ ಪ್ರಕಾಶ್ ಅವರೇ. ನನಗೆ ಬೇಕಾಗಿರೋದು ನಾನೂರೈವತ್ತರಿಂದ ಆರುನೂರು ಸ್ಕ್ವೇರ್ ಫೀಟ್, ಗ್ರೌಂಡ್ ಫ್ಲೋರ್, ನೀರು, ತ್ರೀ-ಫೇಸ್ ಕರೆಂಟ್, ಮತ್ತೆ ಚಿಮಣಿ ಹಾಕೋಕೆ ಜಾಗ. ಚಿಮಣಿ ಇಲ್ದೆ ಹೋಟೆಲ್ ಆಗಲ್ಲ.
