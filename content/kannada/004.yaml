  - who: bank
    t: ಮುದ್ರಾಗೆ ಒಂದೇ ಫಿಕ್ಸ್‌ಡ್ ರೇಟ್ ಅಂತ ಇಲ್ಲ, ಪ್ರತಿ ಬ್ಯಾಂಕ್‌ದು ಬೇರೆ ಬೇರೆ. ನಮ್ಮಲ್ಲಿ ಈಗ ಸುಮಾರು ಒಂಬತ್ತೂವರೆಯಿಂದ ಹನ್ನೊಂದು ಪರ್ಸೆಂಟ್ ನಡೀತಿದೆ, ನಿಮ್ಮ ಸಿಬಿಲ್ ಸ್ಕೋರ್ ಮೇಲೆ ಡಿಪೆಂಡ್ ಆಗುತ್ತೆ. ರೆಪೋ ರೇಟ್ ಬದಲಾದ್ರೆ ಇದೂ ಬದಲಾಗಬಹುದು. ಫೈನಲ್ ರೇಟ್ ಸ್ಯಾಂಕ್ಷನ್ ಲೆಟರ್‌ನಲ್ಲಿ ಇರುತ್ತೆ.
    tr: Mudrāge ondē phiksḍ rēṭ anta illa, prati byāṅk-du bēre bēre. Nammalli īga sumāru ombattūvareyinda hannondu parsenṭ naḍītide, nimma sibil skōr mēle ḍipeṇḍ āgutte. Repō rēṭ badalādre idū badalāgabahudu. Phainal rēṭ syāṅkṣan leṭar-nalli irutte.
    en: There's no single fixed rate for MUDRA; every bank is different. With us it's currently around nine and a half to eleven percent, depending on your CIBIL score. If the repo rate changes, this can change too. The final rate will be in the sanction letter.
