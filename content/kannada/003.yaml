lines:
  - chapter: Chapter 1 — Good news
  - section: 🧪 Two lines
    learn: 'dative experiencer: nanage vākarike āgtide (I feel sick) · garbhiṇi (pregnant), gere (line), masuku (faint) · concessive -idrū (even if) · -ōvaregū (until) · reported -anta'
  - scene: Saturday, 7 March 2026, seven in the morning. A two-bedroom flat in JP Nagar. Shwetha and Pradeep have been married for just over three months. Pradeep is making coffee; Shwetha comes out of the bathroom holding a small plastic test strip.
  - who: shwe
    t: ಪ್ರದೀಪ್… ಸ್ವಲ್ಪ ಇಲ್ಲಿ ಬಾ. ಕಾಫಿ ಆಮೇಲೆ.
    tr: Pradīp… svalpa illi bā. Kāphi āmēle.
    en: Pradeep… come here a moment. The coffee can wait.
  - who: pradeep
    t: ಏನಾಯ್ತು? ಮುಖ ಯಾಕೆ ಹಾಗಿದೆ? ಹುಷಾರಿಲ್ವಾ?
    tr: Ēnāytu? Mukha yāke hāgide? Huṣārilvā?
    en: What happened? Why that face? Aren't you feeling well?
  - who: shwe
    t: ನಾಲ್ಕು ದಿನದಿಂದ ಬೆಳಿಗ್ಗೆ ಎದ್ದ ತಕ್ಷಣ ವಾಕರಿಕೆ ಆಗ್ತಿದೆ. ಪೀರಿಯಡ್ಸ್ ಕೂಡ ಮೂರು ದಿನ ಲೇಟ್. ಅದಕ್ಕೆ ನಿನ್ನೆ ರಾತ್ರಿ ಮೆಡಿಕಲ್ ಶಾಪ್‌ನಿಂದ ಒಂದು ಕಿಟ್ ತಂದಿದ್ದೆ.
    tr: Nālku dinadinda beḷigge edda takṣaṇa vākarike āgtide. Pīriyaḍs kūḍa mūru dina lēṭ. Adakke ninne rātri meḍikal śāp-ninda ondu kiṭ tandidde.
    en: For four days I've felt sick the moment I get up. And my period is three days late. So last night I picked up a kit from the pharmacy.
  - who: pradeep
    t: ಕಿಟ್? ಅಂದ್ರೆ… ನೀನು… ರಿಸಲ್ಟ್ ಏನು ಬಂತು?
    tr: Kiṭ? Andre… nīnu… risalṭ ēnu bantu?
    en: A kit? You mean… you're… what did it say?
  - who: shwe
    t: ನೋಡು. ಎರಡು ಗೆರೆ. ಎರಡನೇದು ಸ್ವಲ್ಪ ಮಸುಕಾಗಿದೆ, ಆದ್ರೆ ಇದೆ.
    tr: Nōḍu. Eraḍu gere. Eraḍanēdu svalpa masukāgide, ādre ide.
    en: Look. Two lines. The second one is a bit faint, but it's there.
  - who: pradeep
    t: ಎರಡು ಗೆರೆ ಅಂದ್ರೆ ಪಾಸಿಟಿವ್ ತಾನೇ? ಡಬ್ಬದ ಮೇಲೆ ಏನು ಬರೆದಿದೆ? ಕೊಡು, ನಾನೇ ಓದ್ತೀನಿ.
    tr: Eraḍu gere andre pāsiṭiv tānē? Ḍabbada mēle ēnu baredide? Koḍu, nānē ōdtīni.
    en: Two lines means positive, right? What does it say on the box? Give it here, I'll read it myself.
  - who: shwe
    t: ಮೂರು ಸಲ ಓದಿದೀನಿ. ಎರಡನೇ ಗೆರೆ ಮಸುಕಾಗಿದ್ರೂ ಪಾಸಿಟಿವ್ ಅಂತಾನೇ ಅರ್ಥ ಅಂತ ಬರೆದಿದೆ. ಪ್ರದೀಪ್… ನಾನು ಗರ್ಭಿಣಿ.
    tr: Mūru sala ōdidīni. Eraḍanē gere masukāgidrū pāsiṭiv antānē artha anta baredide. Pradīp… nānu garbhiṇi.
    en: I've read it three times. It says even if the second line is faint, it still means positive. Pradeep… I'm pregnant.
  - who: pradeep
    t: ಅಯ್ಯೋ ದೇವ್ರೇ… ಶ್ವೇತಾ… ನಿಜವಾಗ್ಲೂ? ನಾನು… ನಾನು ಅಪ್ಪ ಆಗ್ತೀನಾ?
    tr: Ayyō dēvrē… Shwētā… nijavāglū? Nānu… nānu appa āgtīnā?
    en: (stunned, quietly) Oh my God… Shwetha… really? I'm… I'm going to be a father?
  - who: shwe
    t: ಹಾಗೇ ಅನ್ಸುತ್ತೆ. ಆದ್ರೆ ಡಾಕ್ಟ್ರು ಕನ್ಫರ್ಮ್ ಮಾಡೋವರೆಗೂ ಊರಿಗೆಲ್ಲಾ ಹೇಳ್ಬೇಡ. ಕಿಟ್ ಕೆಲವು ಸಲ ತಪ್ಪಾಗಬಹುದು.
    tr: Hāgē ansutte. Ādre ḍākṭru kanpharm māḍōvaregū ūrigellā hēḷbēḍa. Kiṭ kelavu sala tappāgabahudu.
    en: Looks like it. But don't tell the whole world until a doctor confirms it. These kits can sometimes be wrong.
  - who: pradeep
    t: ಸರಿ, ಸರಿ. ಆದ್ರೆ ನನ್ ಮುಖ ನೋಡು, ನಾನು ಏನೂ ಮುಚ್ಚಿಡೋಕೆ ಆಗಲ್ಲ. ಇವತ್ತು ಸಂಜೆ ಜಯನಗರಕ್ಕೆ ಊಟಕ್ಕೆ ಹೋಗ್ಬೇಕು. ನಿಮ್ಮಮ್ಮ ಒಂದೇ ನೋಟಕ್ಕೆ ಕಂಡುಹಿಡೀತಾರೆ.
    tr: Sari, sari. Ādre nan mukha nōḍu, nānu ēnū muchchiḍōke āgalla. Ivattu sanje Jayanagarakke ūṭakke hōgbēku. Nimmamma ondē nōṭakke kaṇḍuhiḍītāre.
    en: Okay, okay. But look at my face, I can't hide anything. We're going to Jayanagar for dinner tonight. Your mother will work it out with one look.
  - who: shwe
    t: ಹಾಗಾದ್ರೆ ಮನೆಯವರಿಗೆ ಮಾತ್ರ ಹೇಳೋಣ. ಮೂರು ತಿಂಗಳು ಆಗೋವರೆಗೂ ಬೇರೆ ಯಾರಿಗೂ ಬೇಡ. ವಿಮಲಾ ಆಂಟಿಗೆ ಅಂತೂ ಖಂಡಿತ ಬೇಡ.
    tr: Hāgādre maneyavarige mātra hēḷōṇa. Mūru tingaḷu āgōvaregū bēre yārigū bēḍa. Vimalā āṇṭige antū khaṇḍita bēḍa.
    en: Then let's tell only the family. Nobody else until three months are up. And definitely not Vimala Aunty.
  - who: pradeep
    t: ಡೀಲ್. ಮೊದಲು ಕ್ಲಿನಿಕ್‌ಗೆ ಫೋನ್ ಮಾಡಿ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ತಗೊಳ್ಳೋಣ. … ಶ್ವೇತಾ, ನಿಂಗೆ ಹೇಗನ್ಸ್ತಿದೆ? ಖುಷಿನಾ, ಭಯನಾ?
    tr: Ḍīl. Modalu klinik-ge phōn māḍi apāyiṇṭmeṇṭ tagoḷḷōṇa. … Shwētā, ninge hēganstide? Khuṣinā, bhayanā?
    en: Deal. First let's call the clinic and get an appointment. … Shwetha, how do you feel? Happy or scared?
  - who: shwe
    t: ಎರಡೂ. ಖುಷಿ ಆಗ್ತಿದೆ, ಆದ್ರೆ ಒಳಗೆ ಏನೋ ಗಡಿಬಿಡಿ. ಟೀಮ್, ಡೆಡ್‌ಲೈನ್, ರಾತ್ರಿ ಕಾಲ್‌ಗಳು… ಎಲ್ಲಾ ಹೇಗೆ ಮ್ಯಾನೇಜ್ ಮಾಡ್ತೀನೋ ಗೊತ್ತಿಲ್ಲ.
    tr: Eraḍū. Khuṣi āgtide, ādre oḷage ēnō gaḍibiḍi. Ṭīm, ḍeḍlain, rātri kāl-gaḷu… ellā hēge myānēj māḍtīnō gottilla.
    en: Both. I'm happy, but inside it's all a flutter. The team, deadlines, the late-night calls… I don't know how I'll manage it all.
  - who: pradeep
    t: ಒಂದೊಂದೇ ಹೆಜ್ಜೆ. ಮೊದಲು ಕಾಫಿ… ಇರು, ನೀನು ಕಾಫಿ ಕುಡೀಬಹುದಾ? ಅದನ್ನೂ ಡಾಕ್ಟ್ರನ್ನ ಕೇಳ್ಬೇಕು ಅನ್ಸುತ್ತೆ.
    tr: Ondondē hejje. Modalu kāphi… iru, nīnu kāphi kuḍībahudā? Adannū ḍākṭranna kēḷbēku ansutte.
    en: One step at a time. First, coffee… wait, are you even allowed coffee? I think we need to ask the doctor that too.
  - who: shwe
    t: ನೋಡು, ಹತ್ತು ನಿಮಿಷ ಆಗಿಲ್ಲ, ಆಗ್ಲೇ ಶುರು ಮಾಡ್ದೆ! ಒಂದು ಕಪ್ ಕುಡಿದ್ರೆ ಏನೂ ಆಗಲ್ಲ. ಕೊಡು ಇಲ್ಲಿ.
    tr: Nōḍu, hattu nimiṣa āgilla, āglē śuru māḍde! Ondu kap kuḍidre ēnū āgalla. Koḍu illi.
    en: See? Not even ten minutes and you've already started! One cup won't do anything. Hand it over.
  - section: 😭 Telling the family
    learn: 'family words: tāta, ajji, māva (mother''s brother), muttajji (great-grandmother) · tears: kaṇṇalli nīru · -tidīra (you are becoming) · blessing formulas with -ali'
  - scene: That evening, the Rao house in Jayanagar. Dinner is over. Amma is clearing the plates; Ajji, now 79, sits in her chair with a shawl; Appa, Kiran and Sam are watching cricket.
  - who: amma
    t: ಶ್ವೇತಾ, ನೀನು ಇವತ್ತು ಸರಿಯಾಗಿ ಊಟಾನೇ ಮಾಡ್ಲಿಲ್ಲ. ಹುಳಿ ನೋಡಿದ ತಕ್ಷಣ ಮುಖ ತಿರುಗಿಸಿದೆ. ಏನಾಯ್ತು?
    tr: Shwētā, nīnu ivattu sariyāgi ūṭānē māḍlilla. Huḷi nōḍida takṣaṇa mukha tirugiside. Ēnāytu?
    en: Shwetha, you hardly ate tonight. You turned your face away the moment you saw the sambar. What's wrong?
  - who: shwe
    t: ಅಮ್ಮ, ಸ್ವಲ್ಪ ಕೂತ್ಕೋ. ಅಪ್ಪ, ಟಿವಿ ಆಫ್ ಮಾಡ್ತೀಯಾ? ಎಲ್ಲರಿಗೂ ಒಂದು ವಿಷಯ ಹೇಳ್ಬೇಕು.
    tr: Amma, svalpa kūtkō. Appa, ṭivi āph māḍtīyā? Ellarigū ondu viṣaya hēḷbēku.
    en: Amma, sit down for a minute. Appa, could you turn off the TV? I need to tell everyone something.
  - who: kiran
    t: ಆಫ್? ಇಂಡಿಯಾ ಗೆಲ್ಲೋಕೆ ಇನ್ನು ಹನ್ನೆರಡು ರನ್ ಬೇಕು, ಅಕ್ಕ!
    tr: Āph? Iṇḍiyā gellōke innu hanneraḍu ran bēku, akka!
    en: Off? India needs twelve more runs to win, Akka!
  - who: appa
    t: ಕಿರಣ್. ಆಫ್ ಮಾಡು. … ಹೇಳಮ್ಮ, ಏನು ವಿಷಯ? ಪ್ರದೀಪ್, ಎಲ್ಲಾ ಆರಾಮ ತಾನೇ?
    tr: Kiraṇ. Āph māḍu. … Hēḷamma, ēnu viṣaya? Pradīp, ellā ārāma tānē?
    en: Kiran. Turn it off. … Tell us, dear, what is it? Pradeep, everything's fine, isn't it?
  - who: pradeep
    t: ಎಲ್ಲಾ ಆರಾಮ, ಮಾವ. ತುಂಬಾನೇ ಆರಾಮ, ಅನ್ಸುತ್ತೆ.
    tr: Ellā ārāma, māva. Tumbānē ārāma, ansutte.
    en: Everything's fine, Uncle. Very fine, actually, I think.
  - who: shwe
    t: ಇವತ್ತು ಬೆಳಿಗ್ಗೆ ಟೆಸ್ಟ್ ಮಾಡಿದೆ. ಪಾಸಿಟಿವ್ ಬಂತು. ಡಾಕ್ಟ್ರ ಹತ್ರ ಇನ್ನೂ ಹೋಗಿಲ್ಲ, ಆದ್ರೆ… ಅಪ್ಪ, ಅಮ್ಮ, ನೀವು ತಾತ-ಅಜ್ಜಿ ಆಗ್ತಿದೀರ.
    tr: Ivattu beḷigge ṭesṭ māḍide. Pāsiṭiv bantu. Ḍākṭra hatra innū hōgilla, ādre… Appa, Amma, nīvu tāta-ajji āgtidīra.
    en: I did a test this morning. It came out positive. We haven't seen a doctor yet, but… Appa, Amma, you're going to be grandparents.
  - who: amma
    t: ಏನು? ಶ್ವೇತಾ… ನಿಜಾನಾ? ಅಯ್ಯೋ, ನನ್ ಕಂದ… ನೋಡಿ, ಕಣ್ಣಲ್ಲಿ ನೀರು ತಾನಾಗೇ ಬರ್ತಿದೆ.
    tr: Ēnu? Shwētā… nijānā? Ayyō, nan kanda… nōḍi, kaṇṇalli nīru tānāgē bartide.
    en: What? Shwetha… is it true? Oh, my baby… look at me, the tears are just coming on their own.
  - who: appa
    t: ಲಕ್ಷ್ಮಿ, ಒಳ್ಳೆ ಸುದ್ದಿ ಕೇಳಿ ಯಾರಾದ್ರೂ ಅಳ್ತಾರಾ? … ಶ್ವೇತಾ, ಬಾಮ್ಮ ಇಲ್ಲಿ. ತುಂಬಾ ಖುಷಿ ಆಯ್ತು.
    tr: Lakshmī, oḷḷe suddi kēḷi yārādrū aḷtārā? … Shwētā, bāmma illi. Tumbā khuṣi āytu.
    en: Lakshmi, who cries at good news? … (his own voice unsteady) Shwetha, come here, dear. I'm so happy.
  - who: kiran
    t: ಒಂದು ನಿಮಿಷ. ಅಂದ್ರೆ ನಾನು… ಮಾವ ಆಗ್ತೀನಾ? ಇಪ್ಪತ್ತು ವರ್ಷಕ್ಕೇ ಮಾವ!
    tr: Ondu nimiṣa. Andre nānu… māva āgtīnā? Ippattu varṣakkē māva!
    en: Wait a minute. So I'm going to be… an uncle? An uncle at twenty!
  - who: sam
    t: ಕಂಗ್ರಾಜುಲೇಶನ್ಸ್, ಶ್ವೇತಾ, ಪ್ರದೀಪ್! ನಮ್ಮ ಸ್ವಿಟ್ಜರ್‌ಲ್ಯಾಂಡ್‌ನಲ್ಲಿ ಇಂಥ ಸುದ್ದಿ ಕೇಳಿದ್ರೆ ಷಾಂಪೇನ್ ತೆಗೀತಾರೆ. ಇಲ್ಲಿ ಏನು ಮಾಡ್ತಾರೆ?
    tr: Kangrājulēśans, Shwētā, Pradīp! Namma Sviṭjarlyāṇḍ-nalli intha suddi kēḷidre ṣāmpēn tegītāre. Illi ēnu māḍtāre?
    en: Congratulations, Shwetha, Pradeep! Back in Switzerland, news like this means opening champagne. What do people do here?
  - who: kiran
    t: ಇಲ್ಲಿ ಸ್ವೀಟ್ ಹಂಚ್ತಾರೆ. ಆಮೇಲೆ ಎಲ್ಲರೂ ಸಲಹೆ ಕೊಡೋಕೆ ಶುರು ಮಾಡ್ತಾರೆ. ಸ್ವಲ್ಪ ಕಾಯಿರಿ, ಅಜ್ಜಿ ಈಗ ಶುರು ಮಾಡ್ತಾರೆ, ನೋಡಿ.
    tr: Illi svīṭ hanchtāre. Āmēle ellarū salahe koḍōke śuru māḍtāre. Svalpa kāyiri, ajji īga śuru māḍtāre, nōḍi.
    en: Here we hand out sweets. Then everyone starts giving advice. Just wait, Ajji's about to begin, watch.
  - section: 👵 Ajji's blessing and Ajji's rules
    learn: 'prohibitions: -abāradu, -bēḍa · uṣṇa (heating) vs tampu (cooling) foods · pappāyi, anānas, grahaṇa (eclipse) · ibbarige tinnu (eat for two) · -ōvaregū'
  - who: ajji
    t: ಶ್ವೇತಾ, ಬಾ ಕಣೇ ಇಲ್ಲಿ, ನನ್ ಹತ್ರ ಕೂತ್ಕೋ. ತಲೆ ಮೇಲೆ ಕೈ ಇಡ್ತೀನಿ. ದೇವರು ನಿನ್ನನ್ನೂ ಮಗೂನೂ ಚೆನ್ನಾಗಿಟ್ಟಿರಲಿ.
    tr: Shwētā, bā kaṇē illi, nan hatra kūtkō. Tale mēle kai iḍtīni. Dēvaru ninnannū magūnū chennāgiṭṭirali.
    en: Shwetha, come here, girl, sit by me. Let me put my hand on your head. May God keep you and the baby well.
  - who: shwe
    t: ಅಜ್ಜಿ, ನೀನು ಮುತ್ತಜ್ಜಿ ಆಗ್ತೀಯ, ಗೊತ್ತಾ?
    tr: Ajji, nīnu muttajji āgtīya, gottā?
    en: Ajji, you're going to be a great-grandmother, you know?
  - who: ajji
    t: ಮುತ್ತಜ್ಜಿ… ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷ ಬದುಕಿದ್ದಕ್ಕೂ ಸಾರ್ಥಕ ಆಯ್ತು. ಆ ಮಗೂನ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ. ಈಗ್ಲೇ ಹೇಳಿಬಿಡ್ತೀನಿ.
    tr: Muttajji… eppattombattu varṣa badukiddakkū sārthaka āytu. Ā magūna kaiyalli ettikoḷḷōvaregū nānu ellū hōgalla. Īglē hēḷibiḍtīni.
    en: A great-grandmother… seventy-nine years of living have been worth it. I'm not going anywhere until I've held that baby in my arms. I'm telling you that right now.
  - who: amma
    t: ಅಮ್ಮ, ಆ ಮಾತು ಯಾಕೆ ಈಗ? ಇವತ್ತು ಒಳ್ಳೆ ದಿನ.
    tr: Amma, ā mātu yāke īga? Ivattu oḷḷe dina.
    en: Amma, why talk like that now? Today is a good day.
  - who: ajji
    t: ಸರಿ, ಸರಿ. ಈಗ ಕೇಳು ಶ್ವೇತಾ. ಇವತ್ತಿಂದ ಪಪ್ಪಾಯಿ ಮುಟ್ಟಬಾರದು. ಅನಾನಸ್ ಕೂಡ ಬೇಡ. ಎರಡೂ ಉಷ್ಣ, ಹೊಟ್ಟೇಲಿರೋ ಮಗೂಗೆ ಒಳ್ಳೇದಲ್ಲ.
    tr: Sari, sari. Īga kēḷu Shwētā. Ivattinda pappāyi muṭṭabāradu. Anānas kūḍa bēḍa. Eraḍū uṣṇa, hoṭṭēlirō magūge oḷḷēdalla.
    en: All right, all right. Now listen, Shwetha. From today, you're not to touch papaya. No pineapple either. Both are heating; they're not good for the baby in your belly.
  - who: ajji
    t: ಇನ್ನೊಂದು. ಈಗ ನೀನು ಒಬ್ಬಳಲ್ಲ, ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು. ದಿನಾ ತುಪ್ಪ, ಹಾಲು, ನೆನೆಸಿದ ಬಾದಾಮಿ. ಮತ್ತೆ ಈ ಒಂಬತ್ತು ತಿಂಗಳಲ್ಲಿ ಯಾವಾಗ ಗ್ರಹಣ ಬಂದ್ರೂ, ಆವತ್ತು ಹೊರಗೆ ಕಾಲು ಇಡಬಾರದು, ಚಾಕು ಹಿಡಿದು ಏನೂ ಕತ್ತರಿಸಬಾರದು.
    tr: Innondu. Īga nīnu obbaḷalla, ibbarige tinnabēku. Dinā tuppa, hālu, neneside bādāmi. Matte ī ombattu tingaḷalli yāvāga grahaṇa bandrū, āvattu horage kālu iḍabāradu, chāku hiḍidu ēnū kattarisabāradu.
    en: Another thing. You're not one person now, you have to eat for two. Ghee, milk and soaked almonds every day. And whenever there's an eclipse in these nine months, that day you mustn't set foot outside, and you mustn't pick up a knife and cut anything.
  - who: sam
    t: ಅಜ್ಜಿ, ಒಂದು ಪ್ರಶ್ನೆ. ಉಷ್ಣ ಅಂದ್ರೆ ಬಿಸಿ ಅಂತಾನಾ? ಪಪ್ಪಾಯಿ ಫ್ರಿಜ್‌ನಿಂದ ತೆಗೆದ್ರೆ ತಣ್ಣಗೇ ಇರುತ್ತಲ್ಲ.
    tr: Ajji, ondu praśne. Uṣṇa andre bisi antānā? Pappāyi phrij-ninda tegedre taṇṇagē iruttalla.
    en: Ajji, one question. Does “heating” mean hot? Papaya straight from the fridge is cold.
  - who: ajji
    t: ಅಯ್ಯೋ ಸ್ಯಾಮ್, ಮುಟ್ಟಿದಾಗ ಬಿಸಿ ಅಂತಲ್ಲ. ತಿಂದ ಮೇಲೆ ಮೈಯಲ್ಲಿ ಉಷ್ಣ ಆಗುತ್ತೆ. ಮಜ್ಜಿಗೆ, ಎಳನೀರು ತಂಪು. ನಿಮ್ ದೇಶದಲ್ಲಿ ಇದೆಲ್ಲಾ ಯಾರೂ ಹೇಳಲ್ವಾ?
    tr: Ayyō Sām, muṭṭidāga bisi antalla. Tinda mēle maiyalli uṣṇa āgutte. Majjige, eḷanīru tampu. Nim dēśadalli idellā yārū hēḷalvā?
    en: Oh, Sam, not hot to the touch. It makes heat in the body after you eat it. Buttermilk and tender coconut are cooling. Doesn't anyone tell you these things in your country?
  - who: sam
    t: ನಮ್ಮಲ್ಲಿ ಡಾಕ್ಟ್ರು ಹೇಳ್ತಾರೆ, ಅಜ್ಜಿ ಅಲ್ಲ. ಹಸಿ ಹಾಲಿನ ಚೀಸ್ ತಿನ್ನಬಾರದು, ವೈನ್ ಕುಡೀಬಾರದು, ಅಂತ.
    tr: Nammalli ḍākṭru hēḷtāre, ajji alla. Hasi hālina chīs tinnabāradu, vain kuḍībāradu, anta.
    en: Back home the doctor tells you, not the grandmother. Don't eat raw-milk cheese, don't drink wine, that sort of thing.
  - who: shwe
    t: ಅಜ್ಜಿ, ನೀನು ಹೇಳಿದ್ದೆಲ್ಲಾ ಫೋನ್‌ನಲ್ಲಿ ಬರ್ಕೊಂಡಿದೀನಿ. ಡಾಕ್ಟ್ರನ್ನ ಒಂದೊಂದಾಗಿ ಕೇಳ್ತೀನಿ. ಅವರು ಓಕೆ ಅಂದ್ರೆ ನಿನ್ ಮಾತು, ಬೇಡ ಅಂದ್ರೆ ಅವರ ಮಾತು. ಸರಿನಾ?
    tr: Ajji, nīnu hēḷiddellā phōn-nalli barkoṇḍidīni. Ḍākṭranna ondondāgi kēḷtīni. Avaru ōke andre nin mātu, bēḍa andre avara mātu. Sarinā?
    en: Ajji, I've noted everything you said on my phone. I'll ask the doctor one by one. If she says okay, your word goes; if she says no, hers does. Deal?
  - who: ajji
    t: ನೋಡಿದ್ಯಾ ಲಕ್ಷ್ಮಿ, ಈಗಿನ ಹುಡುಗೀರು! ಅಜ್ಜಿ ಮಾತಿಗೂ ಸೆಕೆಂಡ್ ಒಪೀನಿಯನ್. … ಆಯ್ತು ಕಣೇ, ಡಾಕ್ಟ್ರನ್ನೇ ಕೇಳು. ಆದ್ರೆ ಗ್ರಹಣದ ವಿಷಯದಲ್ಲಿ ಮಾತ್ರ ನನ್ ಮಾತು ಕೇಳು.
    tr: Nōḍidyā Lakshmī, īgina huḍugīru! Ajji mātigū sekeṇḍ opīniyan. … Āytu kaṇē, ḍākṭrannē kēḷu. Ādre grahaṇada viṣayadalli mātra nan mātu kēḷu.
    en: Did you see that, Lakshmi? Girls these days! Even Grandma's word needs a second opinion. … Fine, girl, ask the doctor. But on the eclipse, at least, listen to me.
  - who: amma
    t: ಶ್ವೇತಾ, ನಿನ್ ಅತ್ತೆ-ಮಾವನಿಗೆ ಹೇಳಿದ್ರಾ? ಅವರಿಗೂ ಬೇಗ ಹೇಳ್ಬೇಕು. ನಮಗೆ ಮೊದಲು ಹೇಳಿದ್ರಿ ಅಂತ ಗೊತ್ತಾದ್ರೆ ಅವರಿಗೆ ಬೇಜಾರಾಗುತ್ತೆ.
    tr: Shwētā, nin atte-māvanige hēḷidrā? Avarigū bēga hēḷbēku. Namage modalu hēḷidri anta gottādre avarige bējārāgutte.
    en: Shwetha, have you told your in-laws? They need to hear soon too. If they find out you told us first, they'll be hurt.
  - who: pradeep
    t: ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಫೋನ್ ಮಾಡ್ತೀವಿ, ಅತ್ತೆ. ನಿಜ ಹೇಳ್ಬೇಕು ಅಂದ್ರೆ… ಅಮ್ಮ ಹೇಗೆ ರಿಯಾಕ್ಟ್ ಮಾಡ್ತಾರೋ ಅಂತ ನನಗೆ ಸ್ವಲ್ಪ ಟೆನ್ಶನ್.
    tr: Nāḷe beḷigge phōn māḍtīvi, atte. Nija hēḷbēku andre… amma hēge riyākṭ māḍtārō anta nanage svalpa ṭenśan.
    en: We'll call tomorrow morning, Aunty. To be honest… I'm a bit nervous about how my mother will react.
  - who: appa
    t: ಟೆನ್ಶನ್ ಯಾಕೆ? ಹಳೇದೆಲ್ಲಾ ಮುಗೀತು. ಈ ಮಗು ಬರ್ತಿರೋದು ಎರಡೂ ಮನೆಗೆ. ಧೈರ್ಯವಾಗಿ ಹೇಳು.
    tr: Ṭenśan yāke? Haḷēdellā mugītu. Ī magu bartirōdu eraḍū manege. Dhairyavāgi hēḷu.
    en: Why nervous? The old business is over. This baby is coming to both houses. Tell them with confidence.
  - section: ☎️ Sumitra's careful call
    learn: 'careful phone politeness · hesitations and half-sentences · blessing: huḍuga āgli, huḍugi āgli, ārōgyavāgirli · apology vocabulary: tappāytu, bējāru, saṅkōcha'
  - scene: Sunday morning, 8 March. Back in the JP Nagar flat, Pradeep calls his parents on speaker. His mother picks up on the first ring.
  - who: sumitra
    t: ಹಲೋ, ಪ್ರದೀಪ? ಇಷ್ಟು ಬೆಳಿಗ್ಗೆ ಫೋನ್? ಎಲ್ಲಾ ಸರಿ ತಾನೇ? ಶ್ವೇತಾ ಹೇಗಿದ್ದಾಳೆ?
    tr: Halō, Pradīpa? Iṣṭu beḷigge phōn? Ellā sari tānē? Shwētā hēgiddāḷe?
    en: Hello, Pradeep? A call this early? Is everything all right? How is Shwetha?
  - who: pradeep
    t: ಎಲ್ಲಾ ಸರಿ, ಅಮ್ಮ. ಸ್ಪೀಕರ್‌ನಲ್ಲಿದ್ದೀಯ, ಶ್ವೇತಾನೂ ಇಲ್ಲೇ ಇದ್ದಾಳೆ. ಅಪ್ಪನ್ನೂ ಕರಿ, ಒಂದು ವಿಷಯ ಹೇಳ್ಬೇಕು.
    tr: Ellā sari, amma. Spīkar-nalliddīya, Shwētānū illē iddāḷe. Appannū kari, ondu viṣaya hēḷbēku.
    en: Everything's fine, Amma. You're on speaker; Shwetha is right here. Call Appa too, we have something to tell you.
  - who: shankar
    t: ಹೇಳಪ್ಪ, ನಾನೂ ಇಲ್ಲೇ ಇದ್ದೀನಿ.
    tr: Hēḷappa, nānū illē iddīni.
    en: Go on, son, I'm here too.
  - who: shwe
    t: ನಮಸ್ಕಾರ ಅತ್ತೆ, ನಮಸ್ಕಾರ ಮಾವ. … ನಾವು ಅಪ್ಪ-ಅಮ್ಮ ಆಗ್ತಿದೀವಿ. ನಿನ್ನೆ ಟೆಸ್ಟ್ ಮಾಡಿದೆ. ಡಾಕ್ಟ್ರು ಎರಡು ವಾರ ಬಿಟ್ಟು ಸ್ಕ್ಯಾನ್‌ಗೆ ಬನ್ನಿ ಅಂದಿದಾರೆ.
    tr: Namaskāra atte, namaskāra māva. … Nāvu appa-amma āgtidīvi. Ninne ṭesṭ māḍide. Ḍākṭru eraḍu vāra biṭṭu skyān-ge banni andidāre.
    en: Hello, Atte, hello, Mava. … We're going to be parents. I did the test yesterday. The clinic told us to come for a scan in two weeks.
  - who: sumitra
    t: …ಶ್ವೇತಾ… ತುಂಬಾ ಸಂತೋಷ ಆಯ್ತಮ್ಮ. ದೇವರು ಒಳ್ಳೇದು ಮಾಡ್ಲಿ. ಹುಡುಗ ಆಗ್ಲಿ, ಹುಡುಗಿ ಆಗ್ಲಿ, ಆರೋಗ್ಯವಾಗಿರ್ಲಿ. ಅಷ್ಟೇ ಸಾಕು.
    tr: …Shwētā… tumbā santōṣa āytamma. Dēvaru oḷḷēdu māḍli. Huḍuga āgli, huḍugi āgli, ārōgyavāgirli. Aṣṭē sāku.
    en: (after a silence, softly) …Shwetha… I'm so happy, dear. May God bless you. Boy or girl, let it be healthy. That's all we need.
  - who: sumitra
    t: ನಿಮ್ಮ ಅಪ್ಪ-ಅಮ್ಮನಿಗೆ ಹೇಳಿದ್ರಾ? ಅವರು… ನಮ್ಮ ಬಗ್ಗೆ ಏನಾದ್ರೂ ಅಂದ್ರಾ?
    tr: Nimma appa-ammanige hēḷidrā? Avaru… namma bagge ēnādrū andrā?
    en: Have you told your parents? Did they… say anything about us?
  - who: shwe
    t: ನಿನ್ನೆ ಹೇಳಿದ್ವಿ. ಅಮ್ಮನೇ ಮೊದಲು “ಅತ್ತೆ-ಮಾವನಿಗೆ ಹೇಳಿದ್ರಾ?” ಅಂತ ಕೇಳಿದ್ರು.
    tr: Ninne hēḷidvi. Ammanē modalu “atte-māvanige hēḷidrā?” anta kēḷidru.
    en: We told them yesterday. Amma was the first to ask, “Have you told your in-laws?”
  - who: sumitra
    t: ಹೌದಾ… ಲಕ್ಷ್ಮಿ ಅವರದ್ದು ದೊಡ್ಡ ಮನಸ್ಸು. ಅವತ್ತು ನಾವು ನಿಮ್ಮ ಮನೆಯಲ್ಲಿ ನಡ್ಕೊಂಡ ರೀತಿ… ಇಲ್ಲ, ಅದನ್ನ ಫೋನ್‌ನಲ್ಲಿ ಹೇಳೋದಲ್ಲ. ಅವರ ಎದುರಿಗೇ ಹೇಳ್ಬೇಕು.
    tr: Haudā… Lakshmī avaraddu doḍḍa manassu. Avattu nāvu nimma maneyalli naḍkoṇḍa rīti… illa, adanna phōn-nalli hēḷōdalla. Avara edurigē hēḷbēku.
    en: Really… Lakshmi has a big heart. The way we behaved in your house that day… no, that's not something to say over the phone. I need to say it to her face.
  - who: shankar
    t: ಶ್ವೇತಾ, ಮಗಳೇ. ನಮ್ಮಿಂದ ಏನು ಬೇಕಾದ್ರೂ ಕೇಳು. ಆಸ್ಪತ್ರೆ, ಓಡಾಟ, ಯಾವುದಕ್ಕೂ ಸಂಕೋಚ ಪಡ್ಬೇಡ.
    tr: Shwētā, magaḷē. Namminda ēnu bēkādrū kēḷu. Āspatre, ōḍāṭa, yāvudakkū saṅkōcha paḍbēḍa.
    en: Shwetha, my girl. Ask us for anything. Hospital, running around, anything at all; don't hesitate.
  - who: shwe
    t: ಥ್ಯಾಂಕ್ಸ್ ಮಾವ. ಸದ್ಯಕ್ಕೆ ನಿಮ್ಮ ಆಶೀರ್ವಾದ ಸಾಕು.
    tr: Thyāṅks māva. Sadyakke nimma āśīrvāda sāku.
    en: Thank you, Mava. For now, your blessings are enough.
  - who: sumitra
    t: ಒಂದು ಮಾತು, ಕಣಮ್ಮ. ನಾನು ಹಳೇ ಕಾಲದವಳು, ಏನೇನೋ ಹೇಳ್ಬೇಕು ಅನ್ಸುತ್ತೆ. ನಾನು ಹೇಳಿದ್ದು ನಿಂಗೆ ಇಷ್ಟ ಆಗ್ಲಿಲ್ಲ ಅಂದ್ರೆ ಮುಖಕ್ಕೇ ಹೇಳಿಬಿಡು. ನಾನು ಬೇಜಾರು ಮಾಡ್ಕೊಳ್ಳಲ್ಲ.
    tr: Ondu mātu, kaṇamma. Nānu haḷē kāladavaḷu, ēnēnō hēḷbēku ansutte. Nānu hēḷiddu ninge iṣṭa āglilla andre mukhakkē hēḷibiḍu. Nānu bējāru māḍkoḷḷalla.
    en: One thing, dear. I'm from the old days; I'll feel like saying all sorts of things. If you don't like something I say, tell me straight to my face. I won't take offence.
  - who: shwe
    t: ಅತ್ತೆ, ಅಜ್ಜಿ ಆಗ್ಲೇ ಪಪ್ಪಾಯಿ ನಿಷೇಧ ಮಾಡಿದಾರೆ. ನೀವೂ ಒಂದು ಲಿಸ್ಟ್ ಕಳ್ಸಿ, ಎರಡನ್ನೂ ಡಾಕ್ಟ್ರಿಗೆ ಒಟ್ಟಿಗೆ ತೋರಿಸ್ತೀನಿ.
    tr: Atte, ajji āglē pappāyi niṣēdha māḍidāre. Nīvū ondu lisṭ kaḷsi, eraḍannū ḍākṭrige oṭṭige tōristīni.
    en: Atte, Ajji has already banned papaya. Send me your list too; I'll show both to the doctor together.
  - who: sumitra
    t: ನನ್ ಲಿಸ್ಟ್ ಚಿಕ್ಕದು, ಕಣಮ್ಮ. ಹೊತ್ತು ಹೊತ್ತಿಗೆ ಊಟ, ಒಳ್ಳೆ ನಿದ್ದೆ, ಮನಸ್ಸಿಗೆ ಟೆನ್ಶನ್ ಇಲ್ಲದೆ ಇರೋದು. ಅಷ್ಟೇ.
    tr: Nan lisṭ chikkadu, kaṇamma. Hottu hottige ūṭa, oḷḷe nidde, manassige ṭenśan illade irōdu. Aṣṭē.
    en: (laughing a little) My list is short, dear. Meals on time, good sleep, and no stress on your mind. That's all.
  - section: 🩺 First visit to Dr. Usha Rao
    learn: 'the doctor''s grammar: -bēku, -bāradu, tagōbēḍi · weeks and dates: āru vāra, ḍyū ḍēṭ, -inda … -ra oḷage · causative māḍisi (get it done) · warning signs with -idre / -ādre · garbhakōśa, heppu, mātre, chīṭi'
  - scene: Thursday, 19 March. A gynaecology clinic in JP Nagar. Dr. Usha Rao, in her fifties, has just done a quick ultrasound and taken Shwetha's blood pressure. Pradeep sits beside Shwetha with a notebook open.
  - who: gyn
    t: ಕಂಗ್ರಾಜುಲೇಶನ್ಸ್, ಶ್ವೇತಾ. ಸ್ಕ್ಯಾನ್‌ನಲ್ಲಿ ಎಲ್ಲಾ ಚೆನ್ನಾಗಿ ಕಾಣ್ತಿದೆ. ಒಂದೇ ಮಗು, ಗರ್ಭಕೋಶದ ಒಳಗೇ ಇದೆ, ಹಾರ್ಟ್‌ಬೀಟ್ ಕೂಡ ಬಂದಿದೆ. ಈಗ ನಿಮಗೆ ಆರು ವಾರ.
    tr: Kangrājulēśans, Shwētā. Skyān-nalli ellā chennāgi kāṇtide. Ondē magu, garbhakōśada oḷagē ide, hārṭbīṭ kūḍa bandide. Īga nimage āru vāra.
    en: Congratulations, Shwetha. Everything looks good on the scan. A single baby, inside the uterus where it should be, and there's already a heartbeat. You're six weeks along.
  - who: shwe
    t: ಹಾರ್ಟ್‌ಬೀಟ್? ಇಷ್ಟು ಬೇಗ? ಸ್ಕ್ರೀನ್‌ನಲ್ಲಿ ಆ ಚಿಕ್ಕ ಚುಕ್ಕೆ ಮಿನುಗ್ತಾ ಇತ್ತಲ್ಲ, ಅದೇನಾ?
    tr: Hārṭbīṭ? Iṣṭu bēga? Skrīn-nalli ā chikka chukke minugtā ittalla, adēnā?
    en: A heartbeat? So soon? That little dot flickering on the screen, was that it?
  - who: gyn
    t: ಹೌದು, ಅದೇ. ನೀವು ಫೋನ್ ಮಾಡಿದಾಗ ನಮ್ ರಿಸೆಪ್ಶನ್‌ನವರು ಎರಡು ವಾರ ಕಾಯಿರಿ ಅಂತ ಯಾಕೆ ಹೇಳಿದ್ರು ಅಂತ ಈಗ ಗೊತ್ತಾಯ್ತಾ? ಆರು ವಾರಕ್ಕಿಂತ ಮುಂಚೆ ಹಾರ್ಟ್‌ಬೀಟ್ ಸರಿಯಾಗಿ ಕಾಣಿಸಲ್ಲ, ಸುಮ್ಮನೆ ಟೆನ್ಶನ್ ಆಗುತ್ತೆ.
    tr: Haudu, adē. Nīvu phōn māḍidāga nam risepśan-navaru eraḍu vāra kāyiri anta yāke hēḷidru anta īga gottāytā? Āru vārakkinta munche hārṭbīṭ sariyāgi kāṇisalla, summane ṭenśan āgutte.
    en: Yes, that's it. Now you know why our reception told you to wait two weeks when you called? Before six weeks the heartbeat often doesn't show clearly, and people panic for nothing.
  - who: pradeep
    t: ಡಾಕ್ಟ್ರೇ, ಡ್ಯೂ ಡೇಟ್ ಯಾವಾಗ ಅಂತ ಹೇಳ್ಬಹುದಾ?
    tr: Ḍākṭrē, ḍyū ḍēṭ yāvāga anta hēḷbahudā?
    en: Doctor, can you tell us when the due date is?
  - who: gyn
    t: ಕೊನೆಯ ಪೀರಿಯಡ್ ಶುರು ಆಗಿದ್ದು ಫೆಬ್ರವರಿ ಮೂರು ಅಂದ್ರಿ. ಅದರಿಂದ ಲೆಕ್ಕ ಹಾಕಿದ್ರೆ ಡ್ಯೂ ಡೇಟ್ ನವೆಂಬರ್ ಹತ್ತು. ಆದ್ರೆ ಅದೇ ದಿನ ಡೆಲಿವರಿ ಆಗುತ್ತೆ ಅಂತಲ್ಲ. ಎರಡು ವಾರ ಮುಂಚೆನೂ ಆಗಬಹುದು, ಒಂದು ವಾರ ಆಮೇಲೂ ಆಗಬಹುದು.
    tr: Koneya pīriyaḍ śuru āgiddu Pebravari mūru andri. Adarinda lekka hākidre ḍyū ḍēṭ Navembar hattu. Ādre adē dina ḍelivari āgutte antalla. Eraḍu vāra munchenū āgabahudu, ondu vāra āmēlū āgabahudu.
    en: You said your last period started on the third of February. Counting from that, the due date is the tenth of November. But that doesn't mean the baby comes that day. It could be two weeks earlier, or a week later.
  - who: shwe
    t: ನವೆಂಬರ್… ದೀಪಾವಳಿ ಹತ್ರ. ಸರಿ ಡಾಕ್ಟ್ರೇ, ಈಗ ನಾನು ಏನೇನು ಮಾಡ್ಬೇಕು?
    tr: Navembar… Dīpāvaḷi hatra. Sari ḍākṭrē, īga nānu ēnēnu māḍbēku?
    en: November… close to Deepavali. All right, Doctor, what do I need to do now?
  - who: gyn
    t: ಮೊದಲು ಮಾತ್ರೆ. ಫೋಲಿಕ್ ಆಸಿಡ್ ದಿನಾ ಒಂದು. ಮೂರು ತಿಂಗಳು ಮುಗಿಯೋವರೆಗೂ ಒಂದು ದಿನಾನೂ ತಪ್ಪಿಸಬಾರದು. ಮಗುವಿನ ಮೆದುಳು, ಬೆನ್ನುಹುರಿ ಸರಿಯಾಗಿ ಬೆಳೆಯೋಕೆ ಇದು ತುಂಬಾ ಮುಖ್ಯ.
    tr: Modalu mātre. Phōlik āsiḍ dinā ondu. Mūru tingaḷu mugiyōvaregū ondu dinānū tappisabāradu. Maguvina meduḷu, bennuhuri sariyāgi beḷeyōke idu tumbā mukhya.
    en: First, tablets. Folic acid, one a day. Don't miss a single day until the first three months are over. It's very important for the baby's brain and spinal cord to develop properly.
  - who: gyn
    t: 'ನಾಲ್ಕನೇ ತಿಂಗಳಿಂದ ಐರನ್, ಕ್ಯಾಲ್ಸಿಯಂ ಮಾತ್ರೆ ಶುರು ಮಾಡ್ತೀವಿ. ಒಂದು ವಿಷಯ ಈಗ್ಲೇ ಬರ್ಕೊಳ್ಳಿ: ಐರನ್, ಕ್ಯಾಲ್ಸಿಯಂ ಎರಡೂ ಒಟ್ಟಿಗೆ ತಗೋಬಾರದು. ಒಂದು ಬೆಳಿಗ್ಗೆ, ಇನ್ನೊಂದು ರಾತ್ರಿ.'
    tr: 'Nālkanē tingaḷinda airan, kyālsiyam mātre śuru māḍtīvi. Ondu viṣaya īglē barkoḷḷi: airan, kyālsiyam eraḍū oṭṭige tagōbāradu. Ondu beḷigge, innondu rātri.'
    en: 'From the fourth month we''ll start iron and calcium tablets. Write one thing down now: never take iron and calcium together. One in the morning, the other at night.'
  - who: pradeep
    t: ಬರ್ಕೊಂಡೆ. ಐರನ್ ಬೆಳಿಗ್ಗೆ, ಕ್ಯಾಲ್ಸಿಯಂ ರಾತ್ರಿ. ಊಟಕ್ಕೆ ಮುಂಚೆನಾ, ಊಟ ಆದ್ಮೇಲಾ?
    tr: Barkoṇḍe. Airan beḷigge, kyālsiyam rātri. Ūṭakke munchenā, ūṭa ādmēlā?
    en: Got it. Iron in the morning, calcium at night. Before food or after?
  - who: gyn
    t: 'ಅದನ್ನ ಮಾತ್ರೆ ಬರೆದು ಕೊಡುವಾಗ ಚೀಟಿಯಲ್ಲೇ ಬರೀತೀನಿ. ಈಗ ಟೆಸ್ಟ್‌ಗಳು. ಇವತ್ತೇ ಬ್ಲಡ್ ಟೆಸ್ಟ್ ಮಾಡಿಸಿ: ಹೀಮೋಗ್ಲೋಬಿನ್, ಬ್ಲಡ್ ಗ್ರೂಪ್, ಶುಗರ್, ಥೈರಾಯ್ಡ್, ಎಚ್‌ಐವಿ, ಹೆಪಟೈಟಿಸ್ ಬಿ, ಜೊತೆಗೆ ಯೂರಿನ್ ಟೆಸ್ಟ್. ಇದೆಲ್ಲಾ ರೂಟೀನ್, ಎಲ್ಲಾ ಗರ್ಭಿಣಿಯರಿಗೂ ಮಾಡ್ತೀವಿ. ಭಯ ಪಡ್ಬೇಡಿ.'
    tr: 'Adanna mātre baredu koḍuvāga chīṭiyallē barītīni. Īga ṭesṭ-gaḷu. Ivattē blaḍ ṭesṭ māḍisi: hīmōglōbin, blaḍ grūp, śugar, thairāyḍ, ech-ai-vi, hepaṭaiṭis bi, jotege yūrin ṭesṭ. Idellā rūṭīn, ellā garbhiṇiyarigū māḍtīvi. Bhaya paḍbēḍi.'
    en: 'I''ll write that on the prescription when I give you the tablets. Now, tests. Get your blood tests done today: haemoglobin, blood group, sugar, thyroid, HIV, hepatitis B, plus a urine test. It''s all routine; we do it for every pregnant woman. Don''t be alarmed.'
  - who: shwe
    t: ಎಚ್‌ಐವಿ ಕೂಡ? … ಸರಿ. ಬಿಪಿ ಎಷ್ಟಿತ್ತು ಡಾಕ್ಟ್ರೇ?
    tr: Ech-ai-vi kūḍa? … Sari. Bi-pi eṣṭittu ḍākṭrē?
    en: HIV too? … Okay. What was my BP, Doctor?
  - who: gyn
    t: ನೂರಾ ಹತ್ತು ಬೈ ಎಪ್ಪತ್ತು, ಚೆನ್ನಾಗಿದೆ. ತೂಕ ಐವತ್ತೆಂಟು ಕೆಜಿ. ಪ್ರತಿ ಸಲ ಬಂದಾಗ ಬಿಪಿ, ತೂಕ ಎರಡೂ ನೋಡ್ತೀವಿ. ಪ್ರೆಗ್ನೆನ್ಸಿಯಲ್ಲಿ ಬಿಪಿ ಜಾಸ್ತಿ ಆದ್ರೆ ಅಮ್ಮನಿಗೂ ಮಗುವಿಗೂ ರಿಸ್ಕ್.
    tr: Nūrā hattu bai eppattu, chennāgide. Tūka aivatteṇṭu keji. Prati sala bandāga bi-pi, tūka eraḍū nōḍtīvi. Pregnensiyalli bi-pi jāsti ādre ammanigū maguvigū risk.
    en: A hundred and ten over seventy. That's good. Weight, fifty-eight kilos. We'll check both BP and weight at every visit. If BP goes up in pregnancy, it's a risk for both mother and baby.
  - who: gyn
    t: ಇನ್ನೊಂದು ವಿಷಯ. ನಿಮ್ಮ ಪ್ರೆಗ್ನೆನ್ಸಿನ ಸರ್ಕಾರದ ಸಿಸ್ಟಮ್‌ನಲ್ಲೂ ರಿಜಿಸ್ಟರ್ ಮಾಡಿಸ್ಬೇಕು. ಅದಕ್ಕೆ ಎಎನ್‌ಸಿ ರಿಜಿಸ್ಟ್ರೇಶನ್ ಅಂತಾರೆ. ಹತ್ತಿರದ ಹೆಲ್ತ್ ಸೆಂಟರ್‌ನಲ್ಲಿ ತಾಯಿ ಕಾರ್ಡ್ ಕೊಡ್ತಾರೆ. ಎಲ್ಲಾ ಚೆಕಪ್, ಇಂಜೆಕ್ಷನ್ ಅದರಲ್ಲಿ ದಾಖಲಾಗುತ್ತೆ.
    tr: Innondu viṣaya. Nimma pregnensina sarkārada sisṭam-nallū rijisṭar māḍisbēku. Adakke e-en-si rijisṭrēśan antāre. Hattirada helth seṇṭar-nalli tāyi kārḍ koḍtāre. Ellā chekap, injekṣan adaralli dākhalāgutte.
    en: One more thing. Your pregnancy should also be registered in the government system. That's called ANC registration. The nearest health centre gives you a Thayi card, the mother card. Every check-up and injection gets recorded in it.
  - who: shwe
    t: ತಾಯಿ ಕಾರ್ಡ್? ನಾವು ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ ತೋರಿಸ್ತಿದೀವಲ್ಲ, ಅದು ನಮಗೂ ಬೇಕಾ?
    tr: Tāyi kārḍ? Nāvu praivēṭ-nalli tōristidīvalla, adu namagū bēkā?
    en: A Thayi card? We're seeing a private doctor, do we need it too?
  - who: gyn
    t: ಮಾಡಿಸ್ಕೊಳ್ಳಿ ಅಂತ ನಾನು ಹೇಳ್ತೀನಿ. ನಂಬರ್ ಸಿಗುತ್ತೆ, ನಿಮ್ಮ ಚೆಕಪ್, ಮುಂದೆ ಮಗುವಿನ ವ್ಯಾಕ್ಸಿನ್ ದಾಖಲೆ ಎಲ್ಲಾ ಒಂದೇ ಕಡೆ ಇರುತ್ತೆ. ಟಿಡಿ ಇಂಜೆಕ್ಷನ್ ಮೊದಲ ಡೋಸ್ ಕೂಡ ಅಲ್ಲೇ ಹಾಕಿಸ್ಕೊಳ್ಳಬಹುದು. ಇಲ್ಲಾಂದ್ರೆ ನಾನೇ ಹಾಕ್ತೀನಿ.
    tr: Māḍiskoḷḷi anta nānu hēḷtīni. Nambar sigutte, nimma chekap, munde maguvina vyāksin dākhale ellā ondē kaḍe irutte. Ṭi-ḍi injekṣan modala ḍōs kūḍa allē hākiskoḷḷabahudu. Illāndre nānē hāktīni.
    en: My advice is to get it. You get a number, and your check-ups and later the baby's vaccination record are all in one place. You can get the first Td injection there as well. Otherwise I'll give it here.
  - who: gyn
    t: ಮುಂದಿನ ದೊಡ್ಡ ಹೆಜ್ಜೆ ಎನ್‌ಟಿ ಸ್ಕ್ಯಾನ್. ಹನ್ನೊಂದರಿಂದ ಹದಿನಾಲ್ಕು ವಾರದ ಒಳಗೆ ಮಾಡಿಸ್ಬೇಕು. ನಿಮಗೆ ಏಪ್ರಿಲ್ ಕೊನೆ ವಾರ ಸರಿ ಆಗುತ್ತೆ. ಅದರ ಜೊತೆ ಡಬಲ್ ಮಾರ್ಕರ್ ಅನ್ನೋ ಬ್ಲಡ್ ಟೆಸ್ಟ್. ಡೌನ್ ಸಿಂಡ್ರೋಮ್ ತರಹದ ತೊಂದರೆಗಳ ರಿಸ್ಕ್ ಎಷ್ಟಿದೆ ಅಂತ ಅದರಲ್ಲಿ ಗೊತ್ತಾಗುತ್ತೆ.
    tr: Mundina doḍḍa hejje en-ṭi skyān. Hannondarinda hadinālku vārada oḷage māḍisbēku. Nimage Ēpril kone vāra sari āgutte. Adara jote ḍabal mārkar annō blaḍ ṭesṭ. Ḍaun sinḍrōm tarahada tondaregaḷa risk eṣṭide anta adaralli gottāgutte.
    en: The next big step is the NT scan. It has to be done between eleven and fourteen weeks; for you, the last week of April will be right. Along with it, a blood test called the double marker. Together they show how high the risk is of problems like Down syndrome.
  - who: shwe
    t: ಡಾಕ್ಟ್ರೇ, ನಮ್ಮಜ್ಜಿ ಒಂದು ಲಿಸ್ಟ್ ಕೊಟ್ಟಿದಾರೆ. ಪಪ್ಪಾಯಿ, ಅನಾನಸ್ ತಿನ್ನಬಾರದು, ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು, ಗ್ರಹಣದ ದಿನ ಹೊರಗೆ ಹೋಗಬಾರದು… ಇದರಲ್ಲಿ ಎಷ್ಟು ನಿಜ?
    tr: Ḍākṭrē, nammajji ondu lisṭ koṭṭidāre. Pappāyi, anānas tinnabāradu, ibbarige tinnabēku, grahaṇada dina horage hōgabāradu… idaralli eṣṭu nija?
    en: Doctor, my grandmother has given me a list. No papaya or pineapple, eat for two, don't go out on an eclipse day… how much of it is true?
  - who: gyn
    t: ಪ್ರತಿ ಅಜ್ಜಿನೂ ಇದೇ ಲಿಸ್ಟ್ ಕೊಡ್ತಾರೆ! ಹಸಿ ಪಪ್ಪಾಯಿ, ಅಂದ್ರೆ ಕಾಯಿ, ಬೇಡ. ಚೆನ್ನಾಗಿ ಹಣ್ಣಾದ ಪಪ್ಪಾಯಿ ಸ್ವಲ್ಪ ತಿಂದ್ರೆ ತೊಂದರೆ ಇಲ್ಲ. ಅನಾನಸ್ ಕೂಡ ಸ್ವಲ್ಪ ತಿಂದ್ರೆ ಪರವಾಗಿಲ್ಲ.
    tr: Prati ajjinū idē lisṭ koḍtāre! Hasi pappāyi, andre kāyi, bēḍa. Chennāgi haṇṇāda pappāyi svalpa tindre tondare illa. Anānas kūḍa svalpa tindre paravāgilla.
    en: (smiling) Every grandmother gives the same list! Raw papaya, I mean the green unripe kind, avoid that. A little well-ripened papaya is no problem. A little pineapple is fine too.
  - who: gyn
    t: ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು ಅನ್ನೋದು ತಪ್ಪು. ಮೊದಲ ಮೂರು ತಿಂಗಳು ಜಾಸ್ತಿ ಏನೂ ಬೇಡ, ಆಮೇಲೆ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ ಅಷ್ಟೇ. ತುಪ್ಪ, ಸಿಹಿ ಜಾಸ್ತಿ ತಿಂದ್ರೆ ತೂಕ ಏರುತ್ತೆ, ಶುಗರ್ ರಿಸ್ಕ್ ಬರುತ್ತೆ. ಗ್ರಹಣ ಅಂದ್ರಾ? ಅದು ನಿಮ್ಮಿಷ್ಟ. ಒಂದು ದಿನ ಮನೇಲಿದ್ದು ಅಜ್ಜಿ ಮನಸ್ಸಿಗೆ ಸಮಾಧಾನ ಆದ್ರೆ ಯಾರಿಗೂ ನಷ್ಟ ಇಲ್ಲ.
    tr: Ibbarige tinnabēku annōdu tappu. Modala mūru tingaḷu jāsti ēnū bēḍa, āmēle svalpa jāsti aṣṭē. Tuppa, sihi jāsti tindre tūka ērutte, śugar risk barutte. Grahaṇa andrā? Adu nimmiṣṭa. Ondu dina manēliddu ajji manassige samādhāna ādre yārigū naṣṭa illa.
    en: “Eat for two” is wrong. Nothing extra in the first three months, and only a little more after that. Too much ghee and sweets means weight gain and a risk of sugar problems. The eclipse? That's up to you. If staying home for one day puts your grandmother's mind at ease, nobody loses anything.
  - who: pradeep
    t: ಕಾಫಿ ಕುಡೀಬಹುದಾ, ಡಾಕ್ಟ್ರೇ? ಇವಳು ಕಾಫಿ ಇಲ್ಲದೆ ಬದುಕಲ್ಲ.
    tr: Kāphi kuḍībahudā, ḍākṭrē? Ivaḷu kāphi illade badukalla.
    en: Can she drink coffee, Doctor? She can't survive without it.
  - who: gyn
    t: ದಿನಕ್ಕೆ ಒಂದು-ಎರಡು ಕಪ್ ಓಕೆ. ಆದ್ರೆ ಆಲ್ಕೋಹಾಲ್, ಸಿಗರೇಟ್ ಹೊಗೆ, ಡಾಕ್ಟ್ರು ಹೇಳದ ಮಾತ್ರೆ, ಇದೆಲ್ಲಾ ಸಂಪೂರ್ಣ ಬೇಡ. ತಲೆನೋವು ಅಂತ ಮೆಡಿಕಲ್ ಶಾಪ್‌ನಿಂದ ಏನೋ ತಂದು ತಗೋಬೇಡಿ. ಮೊದಲು ನನಗೆ ಫೋನ್ ಮಾಡಿ.
    tr: Dinakke ondu-eraḍu kap ōke. Ādre ālkōhāl, sigarēṭ hoge, ḍākṭru hēḷada mātre, idellā sampūrṇa bēḍa. Talenōvu anta meḍikal śāp-ninda ēnō tandu tagōbēḍi. Modalu nanage phōn māḍi.
    en: 'One or two cups a day is okay. But alcohol, cigarette smoke and any tablet a doctor hasn''t prescribed: absolutely none of that. Don''t pick something up at the pharmacy for a headache. Call me first.'
  - who: gyn
    t: ಕೊನೆಯದಾಗಿ, ಇದು ತುಂಬಾ ಮುಖ್ಯ. ಬ್ಲೀಡಿಂಗ್ ಆದ್ರೆ, ಹೊಟ್ಟೆ ನೋವು ಜಾಸ್ತಿ ಆದ್ರೆ, ಜ್ವರ ಬಂದ್ರೆ, ಅಥವಾ ನೀರು ಕುಡಿದ್ರೂ ವಾಂತಿ ಆಗ್ತಿದ್ರೆ… ಕಾಯಬೇಡಿ. ರಾತ್ರಿ ಎಷ್ಟೇ ಹೊತ್ತಾಗಿರಲಿ, ತಕ್ಷಣ ಬನ್ನಿ.
    tr: Koneyadāgi, idu tumbā mukhya. Blīḍiṅg ādre, hoṭṭe nōvu jāsti ādre, jvara bandre, athavā nīru kuḍidrū vānti āgtidre… kāyabēḍi. Rātri eṣṭē hottāgirali, takṣaṇa banni.
    en: Lastly, and this is very important. If there's bleeding, if the stomach pain gets bad, if you get a fever, or if you're vomiting even after sipping water… don't wait. However late at night it is, come immediately.
  - who: shwe
    t: ಕೊನೆ ಪ್ರಶ್ನೆ, ಡಾಕ್ಟ್ರೇ. ನಾನು ಡೇಟಾ ಇಂಜಿನಿಯರ್, ಟೀಮ್ ಲೀಡ್. ದಿನಕ್ಕೆ ಹತ್ತು ಗಂಟೆ ಲ್ಯಾಪ್‌ಟಾಪ್ ಮುಂದೆ, ರಾತ್ರಿ ಅಮೆರಿಕಾ ಕ್ಲೈಂಟ್ ಜೊತೆ ಕಾಲ್. ಈ ಕೆಲಸ ಮುಂದುವರಿಸಬಹುದಾ?
    tr: Kone praśne, ḍākṭrē. Nānu ḍēṭā injiniyar, ṭīm līḍ. Dinakke hattu gaṇṭe lyāpṭāp munde, rātri Amerikā klaiṇṭ jote kāl. Ī kelasa munduvarisabahudā?
    en: Last question, Doctor. I'm a data engineer, a team lead. Ten hours a day at the laptop, and night calls with an American client. Can I carry on with this work?
  - who: gyn
    t: ಖಂಡಿತ ಮುಂದುವರಿಸಬಹುದು. ಪ್ರೆಗ್ನೆನ್ಸಿ ಕಾಯಿಲೆ ಅಲ್ಲ. ಆದ್ರೆ ಪ್ರತಿ ಗಂಟೆಗೆ ಎದ್ದು ಸ್ವಲ್ಪ ನಡೀರಿ, ನೀರು ಕುಡೀರಿ, ಏಳು-ಎಂಟು ಗಂಟೆ ನಿದ್ದೆ ಮಾಡಿ. ರಾತ್ರಿ ಹನ್ನೆರಡು ಗಂಟೆ ಕಾಲ್‌ಗಳನ್ನ ಮಾತ್ರ ಕಮ್ಮಿ ಮಾಡ್ಕೊಳ್ಳಿ. ರಿಪೋರ್ಟ್ ಬಂದ ಮೇಲೆ ತಗೊಂಡು ಬನ್ನಿ.
    tr: Khaṇḍita munduvarisabahudu. Pregnensi kāyile alla. Ādre prati gaṇṭege eddu svalpa naḍīri, nīru kuḍīri, ēḷu-eṇṭu gaṇṭe nidde māḍi. Rātri hanneraḍu gaṇṭe kāl-gaḷanna mātra kammi māḍkoḷḷi. Ripōrṭ banda mēle tagoṇḍu banni.
    en: Of course you can. Pregnancy isn't an illness. But get up and walk a little every hour, drink water, and sleep seven or eight hours. Just cut down on those midnight calls. Bring the reports once they're ready.
  - section: '💻 In the car: the fear about work'
    learn: 'worries and fears: bhaya, ṭenśan, ansutte · hakku (a right), kānūnu prakāra (according to law) · -aṣṭaralli (by the time) · sympathetic teasing'
  - scene: In the car outside the clinic. Pradeep starts the engine, then turns it off again. Shwetha is staring at the black-and-white scan printout.
  - who: pradeep
    t: ಏನು ಯೋಚನೆ ಮಾಡ್ತಿದೀಯ? ಡಾಕ್ಟ್ರು ಎಲ್ಲಾ ಚೆನ್ನಾಗಿದೆ ಅಂದ್ರಲ್ಲ.
    tr: Ēnu yōchane māḍtidīya? Ḍākṭru ellā chennāgide andralla.
    en: What are you thinking about? The doctor said everything's fine.
  - who: shwe
    t: ಮಗುವಿನ ಬಗ್ಗೆ ಅಲ್ಲ. ಆಫೀಸ್ ಬಗ್ಗೆ. ಹೋದ ತಿಂಗಳಷ್ಟೇ ನನಗೆ ಟೀಮ್ ಲೀಡ್ ಆಗಿ ಪ್ರಮೋಷನ್ ಸಿಕ್ತು. ಈಗ ಪ್ರೆಗ್ನೆಂಟ್ ಅಂತ ಹೇಳಿದ್ರೆ ಏನು ಅಂದ್ಕೊಳ್ತಾರೋ.
    tr: Maguvina bagge alla. Āphīs bagge. Hōda tingaḷaṣṭē nanage ṭīm līḍ āgi pramōṣan siktu. Īga pregneṇṭ anta hēḷidre ēnu andkoḷḷtārō.
    en: Not about the baby. About the office. I only got promoted to team lead last month. If I tell them I'm pregnant now, who knows what they'll think.
  - who: pradeep
    t: ಏನು ಅಂದ್ಕೊಳ್ತಾರೆ? ಕಾನೂನು ಪ್ರಕಾರ ಮೆಟರ್ನಿಟಿ ಲೀವ್ ನಿನ್ನ ಹಕ್ಕು. ಅದಕ್ಕೋಸ್ಕರ ಯಾರೂ ನಿನ್ನನ್ನ ಕೆಲಸದಿಂದ ತೆಗೆಯೋಕಾಗಲ್ಲ.
    tr: Ēnu andkoḷḷtāre? Kānūnu prakāra meṭarniṭi līv ninna hakku. Adakkōskara yārū ninnanna kelasadinda tegeyōkāgalla.
    en: What would they think? By law, maternity leave is your right. Nobody can fire you for that.
  - who: shwe
    t: ತೆಗೆಯಲ್ಲ, ಗೊತ್ತು. ಆದ್ರೆ ಸದ್ದಿಲ್ಲದೆ ಒಳ್ಳೆ ಪ್ರಾಜೆಕ್ಟ್ ಬೇರೆಯವರಿಗೆ ಕೊಡ್ತಾರೆ. ಅಪ್ರೈಸಲ್‌ನಲ್ಲಿ “ಈ ವರ್ಷ ಹೇಗೂ ಲೀವ್‌ನಲ್ಲಿ ಇರ್ತಾಳೆ” ಅಂತಾರೆ. ನನ್ ಹಳೇ ಟೀಮ್‌ನಲ್ಲಿ ಒಬ್ಬಳಿಗೆ ಹಾಗೇ ಆಯ್ತು.
    tr: Tegeyalla, gottu. Ādre saddillade oḷḷe prājekṭ bēreyavarige koḍtāre. Apraisal-nalli “ī varṣa hēgū līv-nalli irtāḷe” antāre. Nan haḷē ṭīm-nalli obbaḷige hāgē āytu.
    en: They won't fire me, I know. But they'll quietly give the good projects to someone else. At appraisal time they'll say, “She'll be on leave this year anyway.” That's exactly what happened to a woman on my old team.
  - who: pradeep
    t: ಆಗಬಹುದು, ಸುಳ್ಳು ಹೇಳಲ್ಲ. ಆದ್ರೆ ನಿನ್ ಮ್ಯಾನೇಜರ್ ನಿಖಿಲ್ ಹಾಗೆ ಮಾಡೋ ಮನುಷ್ಯ ಅಂತ ನಿಂಗೆ ಅನ್ಸುತ್ತಾ?
    tr: Āgabahudu, suḷḷu hēḷalla. Ādre nin myānējar Nikhil hāge māḍō manuṣya anta ninge ansuttā?
    en: It could happen, I won't lie. But do you think your manager Nikhil is the kind of person who'd do that?
  - who: shwe
    t: ಗೊತ್ತಿಲ್ಲ. ನಿಖಿಲ್ ಒಳ್ಳೆಯವರು, ಆದ್ರೆ ಅವರ ಮೇಲೂ ಪ್ರೆಶರ್ ಇರುತ್ತೆ. ಎನ್‌ಟಿ ಸ್ಕ್ಯಾನ್ ಆಗೋವರೆಗೂ ಆಫೀಸ್‌ನಲ್ಲಿ ಯಾರಿಗೂ ಹೇಳಲ್ಲ. ಅಷ್ಟರಲ್ಲಿ ಮೂರು ತಿಂಗಳೂ ಮುಗಿದಿರುತ್ತೆ.
    tr: Gottilla. Nikhil oḷḷeyavaru, ādre avara mēlū preśar irutte. En-ṭi skyān āgōvaregū āphīs-nalli yārigū hēḷalla. Aṣṭaralli mūru tingaḷū mugidirutte.
    en: I don't know. Nikhil is a good man, but he's under pressure too. I won't tell anyone at work until the NT scan is done. By then the first three months will be over anyway.
  - who: pradeep
    t: 'ಸರಿ. ಇನ್ನೊಂದು ವಿಷಯ: ನೀನು ಒಬ್ಬಳೇ ಎಲ್ಲಾ ಹೊತ್ತುಕೊಳ್ಳಬೇಕಿಲ್ಲ. ನಾನು ಹೇಗೂ ಮನೆಯಿಂದ ಕೆಲಸ ಮಾಡ್ತೀನಿ. ಅಡುಗೆ, ಡಾಕ್ಟ್ರು, ಟೆಸ್ಟ್, ಆ ಓಡಾಟ ಎಲ್ಲಾ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ.'
    tr: 'Sari. Innondu viṣaya: nīnu obbaḷē ellā hottukoḷḷabēkilla. Nānu hēgū maneyinda kelasa māḍtīni. Aḍuge, ḍākṭru, ṭesṭ, ā ōḍāṭa ellā nānu nōḍkoḷḷtīni.'
    en: 'Fine. One more thing: you don''t have to carry all this alone. I work from home anyway. Cooking, doctors, tests, all that running around, I''ll handle it.'
  - who: shwe
    t: ಅಡುಗೆ? ನೀನು? ನಿನ್ ಉಪ್ಪಿಟ್ಟು ತಿಂದ್ರೆ ವಾಂತಿ ಪ್ರೆಗ್ನೆನ್ಸಿಯಿಂದ ಬರ್ತಿದ್ಯೋ ನಿನ್ ಅಡುಗೆಯಿಂದ ಬರ್ತಿದ್ಯೋ ಗೊತ್ತಾಗಲ್ಲ!
    tr: Aḍuge? Nīnu? Nin uppiṭṭu tindre vānti pregnensiyinda bartidyō nin aḍugeyinda bartidyō gottāgalla!
    en: Cooking? You? After your upma I won't know if I'm throwing up because of the pregnancy or because of your cooking!
  - who: pradeep
    t: ಕಲಿತೀನಿ! ಯೂಟ್ಯೂಬ್ ಇದೆ, ಅತ್ತೆ ಇದ್ದಾರೆ, ಒಂಬತ್ತು ತಿಂಗಳು ಟೈಮ್ ಇದೆ. … ಈಗ ಮನೆಗೆ ಹೋಗೋಣ, ಮೇಡಂ. ದಾರಿಯಲ್ಲಿ ಫಾರ್ಮಸಿ ಹತ್ರ ನಿಲ್ಲಿಸ್ತೀನಿ, ಫೋಲಿಕ್ ಆಸಿಡ್ ಇವತ್ತೇ ಶುರು.
    tr: Kalitīni! Yūṭyūb ide, atte iddāre, ombattu tingaḷu ṭaim ide. … Īga manege hōgōṇa, mēḍam. Dāriyalli phārmasi hatra nillistīni, phōlik āsiḍ ivattē śuru.
    en: I'll learn! There's YouTube, there's your mother, and I have nine months. … Now let's go home, madam. I'll stop at the pharmacy on the way; the folic acid starts today.
  - chapter: Chapter 2 — The night of the attack
  - section: 🌧 “It's only gas”
    learn: 'dative experiencer for symptoms: ajjige ede uri āgtide · gyās, bhāra, bevaru, jum antide (tingling) · -tiddāga (while …) · -irbēku (must be)'
  - scene: Five months later. Shwetha is now twenty-seven weeks pregnant, in her seventh month; the NT scan in April and the Level-2 anomaly scan in June both came back normal. Tuesday, 11 August 2026, twenty to ten at night. Heavy monsoon rain over Jayanagar. Dinner is over. Appa is on the sofa with bank papers, Kiran is studying for his final-year exams, and Sam has just come home from work, soaked. Ajji sits on her bed in the front room, rubbing her chest.
  - who: sam
    t: ನಮಸ್ಕಾರ ಅಜ್ಜಿ. ಈ ಮಳೆಯಲ್ಲಿ ಸಿಲ್ಕ್ ಬೋರ್ಡ್‌ನಿಂದ ಬರೋಕೆ ಒಂದೂವರೆ ಗಂಟೆ ಆಯ್ತು. … ಅಜ್ಜಿ? ಯಾಕೆ ಎದೆ ಉಜ್ಜಿಕೊಳ್ತಿದೀರ?
    tr: Namaskāra ajji. Ī maḷeyalli Silk Bōrḍ-ninda barōke ondūvare gaṇṭe āytu. … Ajji? Yāke ede ujjikoḷḷtidīra?
    en: Good evening, Ajji. It took me an hour and a half to get back from Silk Board in this rain. … Ajji? Why are you rubbing your chest?
  - who: ajji
    t: ಏನಿಲ್ಲ ಸ್ಯಾಮ್. ಮಳೆ ಅಂತ ಸಂಜೆ ಎರಡು ಬೋಂಡಾ ತಿಂದೆ. ಗ್ಯಾಸ್ ಆಗಿರ್ಬೇಕು. ಎದೆ ಹತ್ರ ಸ್ವಲ್ಪ ಉರಿ, ಸ್ವಲ್ಪ ಭಾರ, ಅಷ್ಟೇ.
    tr: Ēnilla Sām. Maḷe anta sanje eraḍu bōṇḍā tinde. Gyās āgirbēku. Ede hatra svalpa uri, svalpa bhāra, aṣṭē.
    en: It's nothing, Sam. Because of the rain I ate a couple of bondas this evening. It must be gas. A little burning near the chest, a little heaviness, that's all.
  - who: amma
    t: ಅದಕ್ಕೇ ಹೇಳಿದ್ದು, ಎಣ್ಣೆ ತಿಂಡಿ ಬೇಡ ಅಂತ. ಇರಿ, ಜೀರಿಗೆ ನೀರು ಮಾಡ್ಕೊಡ್ತೀನಿ. ಕುಡಿದ್ರೆ ಸರಿ ಹೋಗುತ್ತೆ.
    tr: Adakkē hēḷiddu, eṇṇe tiṇḍi bēḍa anta. Iri, jīrige nīru māḍkoḍtīni. Kuḍidre sari hōgutte.
    en: (from the kitchen) That's exactly why I said no fried snacks. Wait, I'll make you some cumin water. Drink it and you'll feel better.
  - who: sam
    t: ಅಜ್ಜಿ, ಎಷ್ಟು ಹೊತ್ತಿಂದ ಹೀಗಾಗ್ತಿದೆ?
    tr: Ajji, eṣṭu hottinda hīgāgtide?
    en: Ajji, how long has this been going on?
  - who: ajji
    t: ಅರ್ಧ ಗಂಟೆ ಆಯ್ತೇನೋ. ಟಿವಿ ಸೀರಿಯಲ್ ನೋಡ್ತಿದ್ದಾಗ ಶುರು ಆಯ್ತು. ಹೋಗುತ್ತೆ ಬಿಡು. ವಯಸ್ಸಾದ ಮೇಲೆ ಇದೆಲ್ಲಾ ಮಾಮೂಲು.
    tr: Ardha gaṇṭe āytēnō. Ṭivi sīriyal nōḍtiddāga śuru āytu. Hōgutte biḍu. Vayassāda mēle idellā māmūlu.
    en: Maybe half an hour. It started while I was watching my TV serial. It'll pass, never mind. At my age all this is normal.
  - who: sam
    t: ಅಜ್ಜಿ, ಹೋದ ತಿಂಗಳು ಮೆಟ್ಟಿಲು ಹತ್ತುವಾಗಲೂ ಎದೆ ಭಾರ ಆಗುತ್ತೆ ಅಂದಿದ್ರಲ್ಲ? ಇದೂ ಅದೇ ಥರಾನಾ?
    tr: Ajji, hōda tingaḷu meṭṭilu hattuvāgalū ede bhāra āgutte andidralla? Idū adē tharānā?
    en: Ajji, last month you said your chest felt heavy when you climbed the stairs, didn't you? Is this the same kind of thing?
  - who: ajji
    t: ಅದು ಮೆಟ್ಟಿಲಿಂದ, ಸ್ಯಾಮ್. ರಮೇಶ ಕೂಡ “ವಯಸ್ಸು, ಅಮ್ಮ” ಅಂತ ನಕ್ಕ. ಎರಡು ನಿಮಿಷ ಕೂತ್ಕೊಂಡ್ರೆ ಹೋಗ್ತಿತ್ತು. ಇದು ಬೋಂಡದ ಗ್ಯಾಸ್, ಅಷ್ಟೇ.
    tr: Adu meṭṭilinda, Sām. Ramēsha kūḍa “vayassu, amma” anta nakka. Eraḍu nimiṣa kūtkoṇḍre hōgtittu. Idu bōṇḍada gyās, aṣṭē.
    en: That was the stairs, Sam. Even Ramesh laughed and said, “It's age, Amma.” It went away if I sat down for two minutes. This is just gas from the bondas.
  - who: sam
    t: ಅಜ್ಜಿ, ನಿಮ್ಮ ಹಣೆ ಎಲ್ಲಾ ಬೆವರಿದೆ. ಫ್ಯಾನ್ ಫುಲ್ ಸ್ಪೀಡ್‌ನಲ್ಲಿದೆ, ಹೊರಗೆ ಮಳೆ. ನಿಮಗೆ ಸೆಕೆ ಆಗ್ತಿದ್ಯಾ?
    tr: Ajji, nimma haṇe ellā bevaride. Phyān phul spīḍ-nallide, horage maḷe. Nimage seke āgtidyā?
    en: (looking more closely) Ajji, your forehead is all sweaty. The fan is on full speed and it's raining outside. Are you feeling hot?
  - who: ajji
    t: ಸೆಕೆ ಅಲ್ಲ… ಮೈ ತಣ್ಣಗಿದೆ, ಆದ್ರೂ ಬೆವರು ಬರ್ತಿದೆ. ವಿಚಿತ್ರ.
    tr: Seke alla… mai taṇṇagide, ādrū bevaru bartide. Vichitra.
    en: Not hot… my body is cold, but I'm still sweating. Strange.
  - who: amma
    t: ತಗೊಳ್ಳಿ ಅಮ್ಮ, ಜೀರಿಗೆ ನೀರು. ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಕುಡೀರಿ.
    tr: Tagoḷḷi amma, jīrige nīru. Svalpa svalpa kuḍīri.
    en: Here, Amma, cumin water. Sip it slowly.
  - who: ajji
    t: ಲಕ್ಷ್ಮಿ… ಈ ಎಡಗೈ ಯಾಕೋ ಜುಮ್ ಅಂತಿದೆ. ಭುಜದಿಂದ ಕೆಳಗೆ ಯಾರೋ ಎಳೀತಿರೋ ಹಾಗಿದೆ.
    tr: Lakshmī… ī eḍagai yākō jum antide. Bhujadinda keḷage yārō eḷītirō hāgide.
    en: (takes a sip, puts the glass down and grips her left arm) Lakshmi… this left arm feels numb and tingly. It's as if someone is pulling it down from the shoulder.
  - who: sam
    t: ಅಂಕಲ್! ಅಂಕಲ್, ಇಲ್ಲಿ ಬನ್ನಿ. ಬೇಗ!
    tr: Aṅkal! Aṅkal, illi banni. Bēga!
    en: Uncle! Uncle, come here. Quickly!
  - section: 💔 Not gas
    learn: 'describing the attack: ede nōvu, kallu iṭṭa hāge (like a stone placed on it), usiru kaṭṭu · urgent commands: phōn māḍu, kūrisi, malagbēḍi · -irabahudu (it might be) · hārṭ aṭyāk / hṛdayāghāta'
  - who: appa
    t: ಏನಾಯ್ತು, ಸ್ಯಾಮ್? … ಅಮ್ಮ! ಏನಾಗ್ತಿದೆ ನಿಂಗೆ?
    tr: Ēnāytu, Sām? … Amma! Ēnāgtide ninge?
    en: What happened, Sam? … Amma! What's happening to you?
  - who: ajji
    t: ಎದೆ ಮೇಲೆ… ಯಾರೋ ಕಲ್ಲು ಇಟ್ಟ ಹಾಗಿದೆ, ರಮೇಶ. ಉಸಿರು ತಗೊಳ್ಳೋಕೆ ಆಗ್ತಿಲ್ಲ.
    tr: Ede mēle… yārō kallu iṭṭa hāgide, Ramēsha. Usiru tagoḷḷōke āgtilla.
    en: It's like… someone has put a stone on my chest, Ramesh. I can't get my breath.
  - who: amma
    t: ಅಯ್ಯೋ ದೇವ್ರೇ! ರೀ, ಏನು ಮಾಡೋದು? ಏನು ಮಾಡೋದು ರೀ?
    tr: Ayyō dēvrē! Rī, ēnu māḍōdu? Ēnu māḍōdu rī?
    en: Oh God! What do we do? What do we do?
  - who: sam
    t: ಆಂಟಿ, ಎದೆ ನೋವು, ಎಡಗೈ, ತಣ್ಣನೆ ಬೆವರು… ನಮ್ಮ ಆಫೀಸ್ ಫಸ್ಟ್-ಏಡ್ ಟ್ರೇನಿಂಗ್‌ನಲ್ಲಿ ಹೇಳಿದ್ರು. ಇದು ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿರಬಹುದು. ಈಗಲೇ ಆಂಬುಲೆನ್ಸ್ ಕರೀಬೇಕು.
    tr: Āṇṭi, ede nōvu, eḍagai, taṇṇane bevaru… namma āphīs phasṭ-ēḍ ṭrēniṅg-nalli hēḷidru. Idu hārṭ aṭyāk āgirabahudu. Īgalē āmbulens karībēku.
    en: Aunty, chest pain, the left arm, cold sweat… they taught us this in first-aid training at the office. This could be a heart attack. We need to call an ambulance right now.
  - who: ajji
    t: ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಏನೂ ಇಲ್ಲ… ಗ್ಯಾಸ್ ಅಷ್ಟೇ… ಯಾರನ್ನೂ ಕರೀಬೇಡಿ. ರಾತ್ರಿ ಹೊತ್ತು ರಂಪ ಮಾಡ್ಬೇಡಿ.
    tr: Hārṭ aṭyāk ēnū illa… gyās aṣṭē… yārannū karībēḍi. Rātri hottu rampa māḍbēḍi.
    en: It's no heart attack… just gas… don't call anyone. Don't make a scene in the middle of the night.
  - who: appa
    t: ಅಮ್ಮ, ಸುಮ್ಮನಿರು. ಕಿರಣ್! ಕಿರಣ್, ಬೇಗ ಬಾ! ನಾನು ಕಾರ್ ಕೀ ತಗೋತೀನಿ, ನಾವೇ ಕರ್ಕೊಂಡು ಹೋಗೋಣ.
    tr: Amma, summaniru. Kiraṇ! Kiraṇ, bēga bā! Nānu kār kī tagōtīni, nāvē karkoṇḍu hōgōṇa.
    en: Amma, hush. Kiran! Kiran, come quick! I'll get the car keys; we'll take her ourselves.
  - who: kiran
    t: ಅಪ್ಪ, ಬೇಡ! ಈ ಮಳೆಯಲ್ಲಿ ಎಲ್ಲಾ ರೋಡ್ ಜಾಮ್ ಆಗಿರುತ್ತೆ. ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಆಕ್ಸಿಜನ್ ಇರುತ್ತೆ, ಇಸಿಜಿ ಇರುತ್ತೆ, ಸೈರನ್ ಕೇಳಿದ್ರೆ ಜನ ದಾರಿ ಬಿಡ್ತಾರೆ. ನಾನು ನೂರಾ ಎಂಟಕ್ಕೆ ಕಾಲ್ ಮಾಡ್ತೀನಿ.
    tr: Appa, bēḍa! Ī maḷeyalli ellā rōḍ jām āgirutte. Āmbulens-nalli āksijan irutte, isiji irutte, sairan kēḷidre jana dāri biḍtāre. Nānu nūrā eṇṭakke kāl māḍtīni.
    en: Appa, no! In this rain every road will be jammed. The ambulance has oxygen and an ECG, and people make way when they hear the siren. I'm calling 108.
  - who: appa
    t: ಸರಿ, ಸರಿ, ಮಾಡು! ಬೇಗ!
    tr: Sari, sari, māḍu! Bēga!
    en: All right, all right, do it! Quickly!
  - who: amma
    t: ಅಮ್ಮ, ಸ್ವಲ್ಪ ಮಲಗಿಕೊಳ್ಳಿ. ಮಲಗಿದ್ರೆ ಆರಾಮ ಅನ್ಸುತ್ತೆ…
    tr: Amma, svalpa malagikoḷḷi. Malagidre ārāma ansutte…
    en: Amma, lie down a little. You'll feel easier lying down…
  - who: ajji
    t: ಬೇಡ… ಮಲಗಿದ್ರೆ ಇನ್ನೂ ಉಸಿರು ಕಟ್ಟುತ್ತೆ. ಕೂತೇ ಇರ್ತೀನಿ.
    tr: Bēḍa… malagidre innū usiru kaṭṭutte. Kūtē irtīni.
    en: No… lying down makes the breathlessness worse. I'll stay sitting up.
  - section: 📞 The 108 call
    learn: 'emergency phone talk: aḍres, lyāṇḍmārk, vayassu, prajñe ide? (is she conscious?) · operator''s instructions: kūrisi, naḍesabāradu, ēnū koḍabēḍi · conditional -idre, negative -ade · -aṣṭaralli (in the meantime)'
  - scene: Kiran dials 108 and puts the phone on speaker. A short recorded message in Kannada and English, then a calm woman's voice.
  - who: operator
    t: ನಮಸ್ಕಾರ, ನೂರಾ ಎಂಟು ಆರೋಗ್ಯ ಕವಚ. ಹೇಳಿ, ಏನು ಎಮರ್ಜೆನ್ಸಿ?
    tr: Namaskāra, nūrā eṇṭu Ārōgya Kavacha. Hēḷi, ēnu emarjensi?
    en: Hello, 108 Arogya Kavacha. Go ahead, what's the emergency?
  - who: kiran
    t: ಮೇಡಂ, ಆಂಬುಲೆನ್ಸ್ ಬೇಕು, ಬೇಗ. ನಮ್ಮಜ್ಜಿಗೆ ಎದೆ ನೋವು, ತುಂಬಾ ಬೆವರ್ತಿದ್ದಾರೆ, ಎಡಗೈ ಜುಮ್ ಅಂತಿದೆ ಅಂತಿದ್ದಾರೆ. ಉಸಿರಾಡೋಕೂ ಕಷ್ಟ ಆಗ್ತಿದೆ.
    tr: Mēḍam, āmbulens bēku, bēga. Nammajjige ede nōvu, tumbā bevartiddāre, eḍagai jum antide antiddāre. Usirāḍōkū kaṣṭa āgtide.
    en: Madam, we need an ambulance, quickly. My grandmother has chest pain, she's sweating a lot, she says her left arm is numb. She's finding it hard to breathe too.
  - who: operator
    t: ಗಾಬರಿ ಆಗ್ಬೇಡಿ. ಆಂಬುಲೆನ್ಸ್ ಕಳಿಸೋಕೆ ನನಗೆ ಕೆಲವು ಡೀಟೇಲ್ಸ್ ಬೇಕು. ನಿಮ್ಮ ಹೆಸರು, ಪೇಶಂಟ್ ಹೆಸರು, ವಯಸ್ಸು ಹೇಳಿ.
    tr: Gābari āgbēḍi. Āmbulens kaḷisōke nanage kelavu ḍīṭēls bēku. Nimma hesaru, pēśaṇṭ hesaru, vayassu hēḷi.
    en: Don't panic. I need a few details to send the ambulance. Tell me your name, the patient's name and age.
  - who: kiran
    t: ನಾನು ಕಿರಣ್. ಪೇಶಂಟ್ ಸರಸ್ವತಮ್ಮ, ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷ.
    tr: Nānu Kiraṇ. Pēśaṇṭ Sarasvatamma, eppattombattu varṣa.
    en: I'm Kiran. The patient is Saraswathamma, seventy-nine.
  - who: operator
    t: ಅವರಿಗೆ ಪ್ರಜ್ಞೆ ಇದ್ಯಾ? ನೀವು ಮಾತಾಡಿಸಿದ್ರೆ ಉತ್ತರ ಕೊಡ್ತಿದ್ದಾರಾ?
    tr: Avarige prajñe idyā? Nīvu mātāḍisidre uttara koḍtiddārā?
    en: Is she conscious? Does she answer when you talk to her?
  - who: kiran
    t: ಹೌದು, ಮಾತಾಡ್ತಿದ್ದಾರೆ, ಕೂತ್ಕೊಂಡಿದ್ದಾರೆ. ಆದ್ರೆ ಮುಖ ಬಿಳಿಚಿಕೊಂಡಿದೆ.
    tr: Haudu, mātāḍtiddāre, kūtkoṇḍiddāre. Ādre mukha biḷichikoṇḍide.
    en: Yes, she's talking, she's sitting up. But her face has gone pale.
  - who: operator
    t: ಸರಿ. ಅಡ್ರೆಸ್ ಹೇಳಿ, ನಿಧಾನವಾಗಿ, ಸ್ಪಷ್ಟವಾಗಿ.
    tr: Sari. Aḍres hēḷi, nidhānavāgi, spaṣṭavāgi.
    en: Okay. Tell me the address, slowly and clearly.
  - who: kiran
    t: ನಂಬರ್ ಇಪ್ಪತ್ತಮೂರು, ಹತ್ತನೇ ಕ್ರಾಸ್, ಮೂರನೇ ಬ್ಲಾಕ್, ಜಯನಗರ.
    tr: Nambar ippattamūru, hattanē krās, mūranē blāk, Jayanagara.
    en: Number twenty-three, Tenth Cross, Third Block, Jayanagar.
  - who: operator
    t: ಹತ್ರ ಯಾವುದಾದ್ರೂ ಲ್ಯಾಂಡ್‌ಮಾರ್ಕ್ ಇದ್ಯಾ? ದೇವಸ್ಥಾನ, ಸ್ಕೂಲ್, ದೊಡ್ಡ ಅಂಗಡಿ?
    tr: Hatra yāvudādrū lyāṇḍmārk idyā? Dēvasthāna, skūl, doḍḍa aṅgaḍi?
    en: Is there any landmark nearby? A temple, a school, a big shop?
  - who: kiran
    t: ಕ್ರಾಸ್ ಶುರು ಆಗೋ ಕಡೆ ಒಂದು ಗಣಪತಿ ದೇವಸ್ಥಾನ ಇದೆ. ಅಲ್ಲಿಂದ ನಾಲ್ಕನೇ ಮನೆ, ನೀಲಿ ಗೇಟ್.
    tr: Krās śuru āgō kaḍe ondu Gaṇapati dēvasthāna ide. Allinda nālkanē mane, nīli gēṭ.
    en: There's a Ganapati temple where the cross road begins. Fourth house from there, blue gate.
  - who: operator
    t: ಓಕೆ, ಲೊಕೇಶನ್ ಸಿಕ್ತು. ಹತ್ತಿರದ ಆಂಬುಲೆನ್ಸ್‌ಗೆ ಕೇಸ್ ಹಾಕಿದೀನಿ. ಹದಿನೈದು-ಇಪ್ಪತ್ತು ನಿಮಿಷ ಆಗಬಹುದು. ಮಳೆ ಇರೋದ್ರಿಂದ ಸ್ವಲ್ಪ ತಡ ಆದ್ರೂ ಆಗಬಹುದು.
    tr: Ōke, lokēśan siktu. Hattirada āmbulens-ge kēs hākidīni. Hadinaidu-ippattu nimiṣa āgabahudu. Maḷe irōdrinda svalpa taḍa ādrū āgabahudu.
    en: Okay, I have the location. I've assigned the case to the nearest ambulance. It may take fifteen to twenty minutes. With the rain, it could be a little later.
  - who: kiran
    t: ಇಪ್ಪತ್ತು ನಿಮಿಷ? ಮೇಡಂ, ಅಷ್ಟು ಹೊತ್ತು…
    tr: Ippattu nimiṣa? Mēḍam, aṣṭu hottu…
    en: Twenty minutes? Madam, that long…
  - who: operator
    t: ನಿಮ್ಮ ಟೆನ್ಶನ್ ಅರ್ಥ ಆಗುತ್ತೆ. ಅಷ್ಟರಲ್ಲಿ ನೀವು ಏನು ಮಾಡ್ಬೇಕು ಅಂತ ಹೇಳ್ತೀನಿ, ಕೇಳಿ. ಅವರನ್ನ ಆರಾಮವಾಗಿ ಕೂರಿಸಿ, ಬೆನ್ನಿಗೆ ದಿಂಬು ಇಡಿ. ನಡೆಸಬಾರದು. ಬಾತ್‌ರೂಮ್‌ಗೂ ನಡೆದುಕೊಂಡು ಹೋಗೋದು ಬೇಡ.
    tr: Nimma ṭenśan artha āgutte. Aṣṭaralli nīvu ēnu māḍbēku anta hēḷtīni, kēḷi. Avaranna ārāmavāgi kūrisi, bennige dimbu iḍi. Naḍesabāradu. Bāthrūm-gū naḍedukoṇḍu hōgōdu bēḍa.
    en: I understand you're worried. Meanwhile, I'll tell you what to do, listen. Sit her comfortably and put a pillow behind her back. Don't make her walk. Not even to the bathroom.
  - who: operator
    t: ಬಿಗಿಯಾದ ಬಟ್ಟೆ ಇದ್ರೆ ಸಡಿಲ ಮಾಡಿ, ಕಿಟಕಿ ತೆಗೀರಿ. ಊಟ, ಕಾಫಿ, ಏನೂ ಕೊಡಬೇಡಿ. ಮನೇಲಿ ಆಸ್ಪಿರಿನ್ ಮಾತ್ರೆ ಇದ್ಯಾ?
    tr: Bigiyāda baṭṭe idre saḍila māḍi, kiṭaki tegīri. Ūṭa, kāphi, ēnū koḍabēḍi. Manēli āspirin mātre idyā?
    en: If her clothes are tight, loosen them, and open a window. Don't give her any food or coffee, nothing. Do you have aspirin tablets at home?
  - who: kiran
    t: ಆಸ್ಪಿರಿನ್… ಇಲ್ಲ ಅನ್ಸುತ್ತೆ. ಅಜ್ಜಿಗೆ ಬಿಪಿ, ಶುಗರ್ ಇದೆ, ಹತ್ತು ವರ್ಷದಿಂದ ಮಾತ್ರೆ ತಗೋತಿದ್ದಾರೆ. ಸಾರ್ಬಿಟ್ರೇಟ್ ಅಂತ ಏನೋ ನಾಲಿಗೆ ಕೆಳಗೆ ಇಡ್ತಾರೆ ಅಂತ ಕೇಳಿದೀನಿ. ಅದು ಕೊಡ್ಲಾ?
    tr: Āspirin… illa ansutte. Ajjige bi-pi, śugar ide, hattu varṣadinda mātre tagōtiddāre. Sārbiṭrēṭ anta ēnō nālige keḷage iḍtāre anta kēḷidīni. Adu koḍlā?
    en: Aspirin… I don't think so. Ajji has BP and sugar; she's been on tablets for ten years. I've heard people put something called Sorbitrate under the tongue. Should I give her that?
  - who: operator
    t: ಬೇಡ. ನೀವಾಗಿ ಯಾವ ಮಾತ್ರೆನೂ ಕೊಡಬೇಡಿ. ಕೆಲವು ಮಾತ್ರೆಯಿಂದ ಬಿಪಿ ತುಂಬಾ ಕಡಿಮೆ ಆಗಬಹುದು. ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಎಲ್ಲಾ ಇರುತ್ತೆ, ಅವರು ಡಾಕ್ಟ್ರನ್ನ ಕೇಳಿ ಕೊಡ್ತಾರೆ. ಅವರ ಮಾತ್ರೆ ಡಬ್ಬ, ಹಳೇ ರಿಪೋರ್ಟ್ ಎಲ್ಲಾ ರೆಡಿ ಇಟ್ಕೊಳ್ಳಿ.
    tr: Bēḍa. Nīvāgi yāva mātrenū koḍabēḍi. Kelavu mātreyinda bi-pi tumbā kaḍime āgabahudu. Āmbulens-nalli ellā irutte, avaru ḍākṭranna kēḷi koḍtāre. Avara mātre ḍabba, haḷē ripōrṭ ellā reḍi iṭkoḷḷi.
    en: No. Don't give her any tablet on your own. Some tablets can drop the BP badly. The ambulance has everything; they'll check with a doctor and give it. Keep her medicine box and old reports ready.
  - who: operator
    t: ಒಂದು ವೇಳೆ ಅವರು ಪ್ರಜ್ಞೆ ತಪ್ಪಿದ್ರೆ, ಉಸಿರು ನಿಂತ ಹಾಗೆ ಅನ್ನಿಸಿದ್ರೆ, ತಕ್ಷಣ ಇದೇ ನಂಬರ್‌ಗೆ ಮತ್ತೆ ಕಾಲ್ ಮಾಡಿ. ಸಿಪಿಆರ್ ಹೇಗೆ ಮಾಡೋದು ಅಂತ ನಾನು ಫೋನ್‌ನಲ್ಲೇ ಹೇಳ್ಕೊಡ್ತೀನಿ.
    tr: Ondu vēḷe avaru prajñe tappidre, usiru ninta hāge annisidre, takṣaṇa idē nambar-ge matte kāl māḍi. Si-pi-ār hēge māḍōdu anta nānu phōn-nallē hēḷkoḍtīni.
    en: If she loses consciousness, or if it seems her breathing has stopped, call this number again immediately. I'll talk you through how to do CPR over the phone.
  - who: operator
    t: ಆಂಬುಲೆನ್ಸ್‌ನವರು ಈ ನಂಬರ್‌ಗೆ ಕಾಲ್ ಮಾಡ್ತಾರೆ, ಫೋನ್ ಫ್ರೀ ಇಟ್ಕೊಳ್ಳಿ. ಯಾರಾದ್ರೂ ಒಬ್ಬರು ಗೇಟ್ ಹತ್ರ ನಿಂತ್ಕೊಳ್ಳಿ, ಹೊರಗಿನ ಲೈಟ್ ಹಾಕಿಡಿ. ಧೈರ್ಯವಾಗಿರಿ, ಸಹಾಯ ಬರ್ತಿದೆ.
    tr: Āmbulens-navaru ī nambar-ge kāl māḍtāre, phōn phrī iṭkoḷḷi. Yārādrū obbaru gēṭ hatra nintkoḷḷi, horagina laiṭ hākiḍi. Dhairyavāgiri, sahāya bartide.
    en: The ambulance crew will call this number, so keep the line free. Have someone stand at the gate, and switch the outside light on. Stay strong, help is on its way.
  - who: kiran
    t: ಸರಿ ಮೇಡಂ. ಥ್ಯಾಂಕ್ಯೂ… ಥ್ಯಾಂಕ್ಯೂ.
    tr: Sari mēḍam. Thyāṅkyū… thyāṅkyū.
    en: Okay, madam. Thank you… thank you.
  - section: ⏳ Twenty long minutes
    learn: 'comforting: samādhāna māḍko, ēnū āgalla, dhairya · Vimala''s practical checklist · shielding family: ... ge hēḷbēḍa · ಮಾತು ಕೊಡು (give one''s word)'
  - scene: Appa holds his mother's hand. Amma goes to the puja shelf, comes back, goes again; she can't keep still. Sam stands at the gate in the rain with an umbrella and a torch. The neighbour's door opens.
  - who: vimala
    t: ಲಕ್ಷ್ಮಿ! ಏನಾಯ್ತು? ಸ್ಯಾಮ್ ಮಳೆಯಲ್ಲಿ ಟಾರ್ಚ್ ಹಿಡ್ಕೊಂಡು ನಿಂತಿರೋದು ನೋಡಿ ಓಡಿ ಬಂದೆ. ಅಜ್ಜಿಗಾ?
    tr: Lakshmī! Ēnāytu? Sām maḷeyalli ṭārch hiḍkoṇḍu nintirōdu nōḍi ōḍi bande. Ajjigā?
    en: Lakshmi! What happened? I saw Sam standing in the rain with a torch and came running. Is it Ajji?
  - who: amma
    t: ವಿಮಲಾ… ಅಮ್ಮನಿಗೆ ಎದೆ ನೋವು. ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಇರಬಹುದು ಅಂತ ಸ್ಯಾಮ್ ಹೇಳ್ತಿದ್ದಾನೆ. ಆಂಬುಲೆನ್ಸ್ ಇನ್ನೂ ಬಂದಿಲ್ಲ. ನನ್ ಕೈಕಾಲು ನಡುಗ್ತಿದೆ.
    tr: Vimalā… ammanige ede nōvu. Hārṭ aṭyāk irabahudu anta Sām hēḷtiddāne. Āmbulens innū bandilla. Nan kaikālu naḍugtide.
    en: Vimala… Amma has chest pain. Sam says it might be a heart attack. The ambulance still hasn't come. My hands and legs are shaking.
  - who: vimala
    t: ಏನೂ ಆಗಲ್ಲ, ಸಮಾಧಾನ ಮಾಡ್ಕೋ. ನಮ್ಮ ಯಜಮಾನರಿಗೆ ಹೋದ ವರ್ಷ ಇದೇ ಆಯ್ತು, ನೆನಪಿದ್ಯಾ? ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿಸಿದ್ವಿ. ಈಗ ದಿನಾ ಲಾಲ್‌ಬಾಗ್‌ನಲ್ಲಿ ವಾಕಿಂಗ್ ಮಾಡ್ತಾರೆ.
    tr: Ēnū āgalla, samādhāna māḍkō. Namma yajamānarige hōda varṣa idē āytu, nenapidyā? Samayakke sariyāgi āspatrege sērisidvi. Īga dinā Lālbāg-nalli vākiṅg māḍtāre.
    en: Nothing will happen, calm down. The same thing happened to my husband last year, remember? We got him to hospital in time. Now he walks in Lalbagh every day.
  - who: vimala
    t: ಮನೆ ಬೀಗ, ಬೆಳಿಗ್ಗೆ ಹಾಲು, ಎಲ್ಲಾ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ. ನೀನು ಅಜ್ಜಿ ಆಧಾರ್ ಕಾರ್ಡ್, ಮಾತ್ರೆ ಡಬ್ಬ, ಹಳೇ ರಿಪೋರ್ಟ್ ಎಲ್ಲಾ ಒಂದು ಬ್ಯಾಗ್‌ಗೆ ಹಾಕು. ಆಸ್ಪತ್ರೇಲಿ ಮೊದಲು ಕೇಳೋದೇ ಅದು. ಕೈಯಲ್ಲಿ ದುಡ್ಡು ಇದ್ಯಾ?
    tr: Mane bīga, beḷigge hālu, ellā nānu nōḍkoḷḷtīni. Nīnu ajji Ādhār kārḍ, mātre ḍabba, haḷē ripōrṭ ellā ondu byāg-ge hāku. Āspatrēli modalu kēḷōdē adu. Kaiyalli duḍḍu idyā?
    en: Locking the house, the morning milk, I'll handle all that. You put Ajji's Aadhaar card, her medicine box and her old reports in one bag. That's the first thing the hospital asks for. Do you have money on you?
  - who: appa
    t: ಕಾರ್ಡ್ ಇದೆ, ಯುಪಿಐ ಇದೆ. … ಅಮ್ಮ, ನನ್ ಕಡೆ ನೋಡು. ಇನ್ನೇನು ಆಂಬುಲೆನ್ಸ್ ಬರುತ್ತೆ.
    tr: Kārḍ ide, yu-pi-ai ide. … Amma, nan kaḍe nōḍu. Innēnu āmbulens barutte.
    en: I have my card and UPI. … Amma, look at me. The ambulance will be here any minute.
  - who: ajji
    t: ರಮೇಶ… ಶ್ವೇತಾಗೆ ಹೇಳ್ಬೇಡ. ಹೊಟ್ಟೇಲಿ ಮಗು ಇದೆ. ಗಾಬರಿ ಆಗ್ತಾಳೆ, ರಾತ್ರಿಯೆಲ್ಲಾ ಅಳ್ತಾಳೆ.
    tr: Ramēsha… Shwētāge hēḷbēḍa. Hoṭṭēli magu ide. Gābari āgtāḷe, rātriyellā aḷtāḷe.
    en: Ramesh… don't tell Shwetha. She has a baby in her belly. She'll panic and cry all night.
  - who: appa
    t: ಸರಿ ಅಮ್ಮ, ಈಗ ಹೇಳಲ್ಲ. ನೀನು ಮಾತಾಡ್ಬೇಡ. ನಿಧಾನಕ್ಕೆ ಉಸಿರು ತಗೋ.
    tr: Sari amma, īga hēḷalla. Nīnu mātāḍbēḍa. Nidhānakke usiru tagō.
    en: All right, Amma, I won't tell her now. Don't talk. Just breathe slowly.
  - who: ajji
    t: ನಾನು ಮಾತು ಕೊಟ್ಟಿದೀನಿ ಕಣೋ, ಮರಿಮಗೂನ ಎತ್ಕೊಳ್ಳೋವರೆಗೂ ಹೋಗಲ್ಲ ಅಂತ. ಹೆದರ್ಬೇಡ.
    tr: Nānu mātu koṭṭidīni kaṇō, marimagūna etkoḷḷōvaregū hōgalla anta. Hedarbēḍa.
    en: 'I''ve given my word, son: I''m not going until I''ve held my great-grandchild. Don''t be afraid.'
  - who: kiran
    t: ಹಲೋ? ಹೌದು, ನಾನೇ ಕಾಲ್ ಮಾಡಿದ್ದು. … ಗಣಪತಿ ದೇವಸ್ಥಾನ ದಾಟಿದ್ರಾ? ಸರಿ, ಎಡಕ್ಕೆ ತಿರುಗಿ. ಗೇಟ್ ಹತ್ರ ಒಬ್ಬರು ಟಾರ್ಚ್ ಹಿಡ್ಕೊಂಡು ನಿಂತಿದ್ದಾರೆ… ಹೌದು, ಬಿಳಿ ಹುಡುಗ, ಅವರೇ!
    tr: Halō? Haudu, nānē kāl māḍiddu. … Gaṇapati dēvasthāna dāṭidrā? Sari, eḍakke tirugi. Gēṭ hatra obbaru ṭārch hiḍkoṇḍu nintiddāre… haudu, biḷi huḍuga, avarē!
    en: (his phone rings) Hello? Yes, I'm the one who called. … Have you passed the Ganapati temple? Okay, turn left. Someone's standing at the gate with a torch… yes, the white guy, that's him!
  - who: sam
    t: ಕಿರಣ್! ಸೈರನ್ ಕೇಳಿಸ್ತಿದೆ! ಬಂತು!
    tr: Kiraṇ! Sairan kēḷistide! Bantu!
    en: (shouting from the gate) Kiran! I can hear the siren! It's here!
  - section: 🚑 Manjunath and the ambulance
    learn: 'EMT questions: yāvāga śuru āytu?, yāva mātre?, hinde āpparēṣan āgittā? · āksijan hāktīni, isiji tegītīni · samaya tumbā mukhya (time is critical) · Hrudaya Jyothi scheme · -īgalē (right now)'
  - scene: Two men in uniform come in with a folding carry-chair. The older one, about forty, speaks first.
  - who: emt
    t: ನಮಸ್ಕಾರ, ನಾನು ಮಂಜುನಾಥ್, ಇಎಂಟಿ. ಅಜ್ಜಿ, ನಮಸ್ಕಾರ. ಹೆದರ್ಬೇಡಿ, ನಾವು ಬಂದಿದೀವಿ. ನೋವು ಎಲ್ಲಿದೆ? ಕೈ ಇಟ್ಟು ತೋರಿಸಿ.
    tr: Namaskāra, nānu Manjunāth, i-em-ṭi. Ajji, namaskāra. Hedarbēḍi, nāvu bandidīvi. Nōvu ellide? Kai iṭṭu tōrisi.
    en: Hello, I'm Manjunath, the EMT. Hello, Ajji. Don't be scared, we're here now. Where is the pain? Show me with your hand.
  - who: ajji
    t: ಇಲ್ಲಿ… ಇಡೀ ಎದೆ… ಎಡಗೈ… ದವಡೆ ಹತ್ರಾನೂ.
    tr: Illi… iḍī ede… eḍagai… davaḍe hatrānū.
    en: (pressing her fist to the middle of her chest) Here… the whole chest… the left arm… near the jaw too.
  - who: emt
    t: ಯಾವಾಗ ಶುರು ಆಯ್ತು? ಕರೆಕ್ಟ್ ಟೈಮ್ ಗೊತ್ತಾ?
    tr: Yāvāga śuru āytu? Karekṭ ṭaim gottā?
    en: When did it start? Do you know the exact time?
  - who: sam
    t: ಸೀರಿಯಲ್ ಶುರು ಆದಾಗ ಅಂತ ಅಜ್ಜಿ ಹೇಳಿದ್ರು, ಅಂದ್ರೆ ಒಂಬತ್ತು ಗಂಟೆ ಹತ್ರ. ಈಗ ಹತ್ತೂ ಕಾಲು.
    tr: Sīriyal śuru ādāga anta ajji hēḷidru, andre ombattu gaṇṭe hatra. Īga hattū kālu.
    en: Ajji said it started when her serial began, so around nine. It's quarter past ten now.
  - who: emt
    t: ಅಂದ್ರೆ ಒಂದು ಗಂಟೆಗಿಂತ ಜಾಸ್ತಿ ಆಗಿದೆ. ಟೈಮ್ ವೇಸ್ಟ್ ಮಾಡೋದು ಬೇಡ. ಹರೀಶ್, ಸ್ಯಾಚುರೇಷನ್ ನೋಡು. … ತೊಂಬತ್ತೊಂದು. ಅಜ್ಜಿ, ಮೂಗಿಗೆ ಆಕ್ಸಿಜನ್ ಹಾಕ್ತೀನಿ. ಸ್ವಲ್ಪ ತಣ್ಣಗೆ ಅನ್ಸುತ್ತೆ ಅಷ್ಟೇ.
    tr: Andre ondu gaṇṭeginta jāsti āgide. Ṭaim vēsṭ māḍōdu bēḍa. Harīś, syāchurēṣan nōḍu. … Tombattondu. Ajji, mūgige āksijan hāktīni. Svalpa taṇṇage ansutte aṣṭē.
    en: So it's been more than an hour. No time to waste. Harish, check her saturation. … Ninety-one. Ajji, I'm putting oxygen in your nose. It'll feel a bit cold, that's all.
  - who: emt
    t: ಮನೇಲಿ ಯಾವ ಮಾತ್ರೆ ತಗೋತಾರೆ? ರಕ್ತ ತೆಳ್ಳಗೆ ಮಾಡೋ ಮಾತ್ರೆ ಏನಾದ್ರೂ ಇದ್ಯಾ? ಹಿಂದೆ ಸ್ಟ್ರೋಕ್, ಆಪರೇಷನ್, ಹೊಟ್ಟೇಲಿ ಅಲ್ಸರ್, ಏನಾದ್ರೂ ಆಗಿತ್ತಾ?
    tr: Manēli yāva mātre tagōtāre? Rakta teḷḷage māḍō mātre ēnādrū idyā? Hinde sṭrōk, āpparēṣan, hoṭṭēli alsar, ēnādrū āgittā?
    en: Which tablets does she take at home? Anything that thins the blood? Has she ever had a stroke, an operation, a stomach ulcer, anything like that?
  - who: appa
    t: ಬಿಪಿಗೆ ಒಂದು, ಶುಗರ್‌ಗೆ ಎರಡು. ಇಗೋ, ಡಬ್ಬ. ಸ್ಟ್ರೋಕ್ ಆಗಿಲ್ಲ. ಆಪರೇಷನ್ ಅಂದ್ರೆ ಎಂಟು ವರ್ಷದ ಹಿಂದೆ ಕಣ್ಣಿನ ಕ್ಯಾಟರಾಕ್ಟ್ ಅಷ್ಟೇ.
    tr: Bi-pige ondu, śugar-ge eraḍu. Igō, ḍabba. Sṭrōk āgilla. Āpparēṣan andre eṇṭu varṣada hinde kaṇṇina kyāṭarākṭ aṣṭē.
    en: One for BP, two for sugar. Here's the box. No stroke. The only operation was cataract surgery eight years ago.
  - who: emt
    t: ಸರಿ. ಅಜ್ಜಿ, ನೀವು ನಡೀಬೇಡಿ. ಈ ಚೇರ್‌ನಲ್ಲಿ ಕೂರಿಸಿ ನಾವೇ ಎತ್ಕೊಂಡು ಹೋಗ್ತೀವಿ. ಇಸಿಜಿ ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲೇ ತೆಗೀತೀನಿ. ಸಾರ್, ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಒಬ್ಬರಿಗೆ ಮಾತ್ರ ಜಾಗ. ಪೇಶಂಟ್ ಬಗ್ಗೆ ಎಲ್ಲಾ ಗೊತ್ತಿರೋರು, ಸೈನ್ ಮಾಡೋರು ಬನ್ನಿ.
    tr: Sari. Ajji, nīvu naḍībēḍi. Ī chēr-nalli kūrisi nāvē etkoṇḍu hōgtīvi. Isiji āmbulens-nallē tegītīni. Sār, āmbulens-nalli obbarige mātra jāga. Pēśaṇṭ bagge ellā gottirōru, sain māḍōru banni.
    en: Okay. Ajji, don't walk. We'll sit you in this chair and carry you. I'll do the ECG in the ambulance. Sir, there's room for only one person in the ambulance. Whoever knows everything about the patient and can sign, come along.
  - who: appa
    t: ನಾನು ಬರ್ತೀನಿ. ಲಕ್ಷ್ಮಿ, ನೀನು ಕಿರಣ್, ಸ್ಯಾಮ್ ಜೊತೆ ಕಾರ್‌ನಲ್ಲಿ ಹಿಂದೆ ಬಾ. ಬ್ಯಾಗ್ ಮರೀಬೇಡ.
    tr: Nānu bartīni. Lakshmī, nīnu Kiraṇ, Sām jote kār-nalli hinde bā. Byāg marībēḍa.
    en: I'll come. Lakshmi, follow behind in the car with Kiran and Sam. Don't forget the bag.
  - who: sam
    t: ನಾನು ಡ್ರೈವ್ ಮಾಡ್ತೀನಿ, ಅಂಕಲ್. ಜಯದೇವಕ್ಕೆ ತಾನೇ?
    tr: Nānu ḍraiv māḍtīni, aṅkal. Jayadēvakke tānē?
    en: I'll drive, Uncle. It's Jayadeva, right?
  - who: emt
    t: ಹೇಳ್ತೀನಿ, ಮೊದಲು ಇಸಿಜಿ ನೋಡೋಣ. ಆಂಬುಲೆನ್ಸ್ ನಂಬರ್ ಫೋಟೋ ತಗೊಳ್ಳಿ, ಹಿಂದೆನೇ ಬನ್ನಿ.
    tr: Hēḷtīni, modalu isiji nōḍōṇa. Āmbulens nambar phōṭō tagoḷḷi, hindenē banni.
    en: I'll tell you; let's see the ECG first. Take a photo of the ambulance number and follow right behind.
  - scene: Inside the ambulance, siren on, rain lashing the windscreen. Manjunath sticks electrodes on Ajji's chest and looks at the small screen, then at his phone.
  - who: emt
    t: ಇಸಿಜಿ ಬಂತು. ಇದನ್ನ ನಮ್ಮ ಕಂಟ್ರೋಲ್ ರೂಮ್ ಡಾಕ್ಟ್ರಿಗೆ ಕಳಿಸಿದೀನಿ. … ಸಾರ್, ಅವರು ಹೇಳ್ತಿದ್ದಾರೆ, ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿರೋ ಹಾಗಿದೆ ಅಂತ. ಡಾಕ್ಟ್ರು ಹೇಳಿದ ಹಾಗೆ ಆಸ್ಪಿರಿನ್ ಕೊಡ್ತೀನಿ. ಅಜ್ಜಿ, ಈ ಮಾತ್ರೆ ನುಂಗಬೇಡಿ, ಅಗಿದು ತಿನ್ನಿ.
    tr: Isiji bantu. Idanna namma kaṇṭrōl rūm ḍākṭrige kaḷisidīni. … Sār, avaru hēḷtiddāre, hārṭ aṭyāk āgirō hāgide anta. Ḍākṭru hēḷida hāge āspirin koḍtīni. Ajji, ī mātre nuṅgabēḍi, agidu tinni.
    en: The ECG is done. I've sent it to the doctor at our control room. … Sir, he says it looks like a heart attack. On the doctor's instructions I'm giving her aspirin. Ajji, don't swallow this tablet whole, chew it.
  - who: appa
    t: ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್… ಮಂಜುನಾಥ್ ಅವರೇ, ಜೀವಕ್ಕೆ ಏನೂ ಅಪಾಯ ಇಲ್ಲ ತಾನೇ? ನಿಜ ಹೇಳಿ.
    tr: Hārṭ aṭyāk… Manjunāth avarē, jīvakke ēnū apāya illa tānē? Nija hēḷi.
    en: A heart attack… Manjunath, there's no danger to her life, is there? Tell me the truth.
  - who: emt
    t: 'ಸಾರ್, ನಾನು ಡಾಕ್ಟ್ರಲ್ಲ. ಆದ್ರೆ ಒಂದು ಹೇಳ್ತೀನಿ: ಇಂಥ ಕೇಸ್‌ನಲ್ಲಿ ಸಮಯ ತುಂಬಾ ಮುಖ್ಯ. ನೀವು ಗ್ಯಾಸ್ ಅಂತ ಬೆಳಿಗ್ಗೆವರೆಗೂ ಕಾಯಲಿಲ್ಲ. ತುಂಬಾ ಜನ ಕಾಯ್ತಾರೆ. ಅದೇ ದೊಡ್ಡ ವಿಷಯ.'
    tr: 'Sār, nānu ḍākṭralla. Ādre ondu hēḷtīni: intha kēs-nalli samaya tumbā mukhya. Nīvu gyās anta beḷiggevaregū kāyalilla. Tumbā jana kāytāre. Adē doḍḍa viṣaya.'
    en: 'Sir, I''m not a doctor. But I''ll tell you one thing: in cases like this, time matters most. You didn''t sit waiting till morning thinking it was gas. A lot of people do. That counts for a great deal.'
  - who: appa
    t: ನೇರವಾಗಿ ಜಯದೇವಕ್ಕೆ ಯಾಕೆ ಹೋಗ್ತಿಲ್ಲ? ಅದು ಇಲ್ಲೇ ಮೂರು-ನಾಲ್ಕು ಕಿಲೋಮೀಟರ್.
    tr: Nēravāgi Jayadēvakke yāke hōgtilla? Adu illē mūru-nālku kilōmīṭar.
    en: Why aren't we going straight to Jayadeva? It's only three or four kilometres from here.
  - who: emt
    t: ಡೈರಿ ಸರ್ಕಲ್ ಹತ್ರ ಮೊಣಕಾಲುದ್ದ ನೀರು ನಿಂತಿದೆ, ಟ್ರಾಫಿಕ್ ಮುಂದೆ ಹೋಗ್ತಾನೇ ಇಲ್ಲ ಅಂತ ಕಂಟ್ರೋಲ್ ರೂಮ್ ಹೇಳ್ತಿದೆ. ಹತ್ತಿರದ ಸರ್ಕಾರಿ ಆಸ್ಪತ್ರೆ ಹೃದಯ ಜ್ಯೋತಿ ಸ್ಕೀಮ್‌ನಲ್ಲಿದೆ. ಅಲ್ಲಿ ತಕ್ಷಣ ಹೆಪ್ಪು ಕರಗಿಸೋ ಇಂಜೆಕ್ಷನ್ ಕೊಡ್ತಾರೆ, ಆಮೇಲೆ ಅಲ್ಲಿಂದಾನೇ ಜಯದೇವಕ್ಕೆ ಶಿಫ್ಟ್ ಮಾಡ್ತಾರೆ. ಡಾಕ್ಟ್ರೇ ಹಾಗೆ ಹೇಳಿದ್ರು.
    tr: Ḍairi Sarkal hatra moṇakāludda nīru nintide, ṭrāphik munde hōgtānē illa anta kaṇṭrōl rūm hēḷtide. Hattirada sarkāri āspatre Hṛdaya Jyōti skīm-nallide. Alli takṣaṇa heppu karagisō injekṣan koḍtāre, āmēle allindānē Jayadēvakke śiphṭ māḍtāre. Ḍākṭrē hāge hēḷidru.
    en: The control room says there's knee-deep water at Dairy Circle and the traffic isn't moving at all. The nearest government hospital is part of the Hrudaya Jyothi scheme. They'll give a clot-dissolving injection there straight away, and then shift her to Jayadeva from there. That's what the doctor told us to do.
  - who: ajji
    t: ಹೃದಯ ಜ್ಯೋತಿ… ಪುನೀತ್ ಹೆಸರಿನ ಸ್ಕೀಮ್ ಅಲ್ವಾ ಅದು? ಪಾಪ, ಆ ಹುಡುಗ… ನಲವತ್ತಾರು ವರ್ಷಕ್ಕೇ…
    tr: Hṛdaya Jyōti… Punīt hesarina skīm alvā adu? Pāpa, ā huḍuga… nalavattāru varṣakkē…
    en: (weakly) Hrudaya Jyothi… that's the scheme named after Puneeth, isn't it? Poor boy… only forty-six…
  - who: emt
    t: ಹೌದು ಅಜ್ಜಿ, ಅಪ್ಪು ಹೆಸರಿನದ್ದೇ. ಈಗ ನೀವು ಮಾತಾಡ್ಬೇಡಿ, ಆಕ್ಸಿಜನ್ ತಗೊಳ್ಳಿ. ಉಳಿದಿದ್ದೆಲ್ಲಾ ನಾವು ನೋಡ್ಕೊಳ್ತೀವಿ.
    tr: Haudu ajji, Appu hesarinaddē. Īga nīvu mātāḍbēḍi, āksijan tagoḷḷi. Uḷididdellā nāvu nōḍkoḷḷtīvi.
    en: Yes, Ajji, it's named after Appu. Now don't talk; just take the oxygen. We'll take care of everything else.
  - section: '🏥 The emergency room: Dr. Anand'
    learn: 'ER formulas: nīvu pēśaṇṭ-ge ēnāgbēku? (how are you related?) · explaining risk: -abahudu, -adidre (if not …) · eṣṭu bēga … aṣṭu (the sooner … the more) · heppu (clot), raktanāḷa (blood vessel), ucita (free) · consent form: spoken vs written register'
  - scene: 'Twenty to eleven. The emergency room of a government hospital near Jayanagar: bright tube lights, a crowded corridor, monitors beeping. Ajji lies on a trolley bed. Amma, Kiran and Sam have just arrived. A young doctor with tired eyes comes out holding a strip of ECG paper.'
  - who: erdoc
    t: ಸರಸ್ವತಮ್ಮ ಅವರ ಕಡೆಯವರು ಯಾರು? ನೀವು ಪೇಶಂಟ್‌ಗೆ ಏನಾಗ್ಬೇಕು?
    tr: Sarasvatamma avara kaḍeyavaru yāru? Nīvu pēśaṇṭ-ge ēnāgbēku?
    en: Who's with Saraswathamma? How are you related to the patient?
  - who: appa
    t: ನಾನು ಮಗ, ಸಾರ್. ರಮೇಶ್. ಇವರು ನನ್ನ ಹೆಂಡತಿ, ಇವನು ಮಗ. ಡಾಕ್ಟ್ರೇ, ಅಮ್ಮ ಹೇಗಿದ್ದಾರೆ?
    tr: Nānu maga, sār. Ramēsh. Ivaru nanna heṇḍati, ivanu maga. Ḍākṭrē, amma hēgiddāre?
    en: I'm her son, sir. Ramesh. This is my wife, and this is my son. Doctor, how is my mother?
  - who: erdoc
    t: ನಾನು ಡಾಕ್ಟರ್ ಆನಂದ್, ಎಮರ್ಜೆನ್ಸಿ ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು. ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ, ಆಮೇಲೆ ಏನು ಬೇಕಾದ್ರೂ ಕೇಳಿ. ಇಸಿಜಿ ನೋಡಿದ್ವಿ. ಅವರಿಗೆ ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿದೆ. ನಾವು ಇದಕ್ಕೆ ಸ್ಟೆಮಿ ಅಂತೀವಿ.
    tr: Nānu Ḍākṭar Ānand, emarjensi ḍyūṭi ḍākṭru. Nēravāgi hēḷtīni, āmēle ēnu bēkādrū kēḷi. Isiji nōḍidvi. Avarige hārṭ aṭyāk āgide. Nāvu idakke sṭemi antīvi.
    en: I'm Dr. Anand, the emergency duty doctor. I'll be direct, and then you can ask me anything. We've looked at the ECG. She has had a heart attack. We call this type a STEMI.
  - who: erdoc
    t: ಹೃದಯಕ್ಕೆ ರಕ್ತ ಕೊಡೋ ಒಂದು ರಕ್ತನಾಳದಲ್ಲಿ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟಿ ಪೂರ್ತಿ ಬ್ಲಾಕ್ ಆಗಿದೆ. ಹೃದಯದ ಆ ಭಾಗಕ್ಕೆ ರಕ್ತ ಹೋಗ್ತಿಲ್ಲ. ಎಷ್ಟು ಬೇಗ ಆ ಬ್ಲಾಕ್ ತೆಗೀತೀವೋ, ಅಷ್ಟು ಹೃದಯ ಉಳಿಯುತ್ತೆ.
    tr: Hṛdayakke rakta koḍō ondu raktanāḷadalli rakta heppugaṭṭi pūrti blāk āgide. Hṛdayada ā bhāgakke rakta hōgtilla. Eṣṭu bēga ā blāk tegītīvō, aṣṭu hṛdaya uḷiyutte.
    en: In one of the blood vessels that supplies the heart, the blood has clotted and blocked it completely. No blood is reaching that part of the heart. The sooner we open that block, the more of the heart we save.
  - who: amma
    t: ಡಾಕ್ಟ್ರೇ, ಅವರು ಗ್ಯಾಸ್ ಅಂತ ಹೇಳ್ತಿದ್ರು… ನಾನು ಜೀರಿಗೆ ನೀರು ಕೊಟ್ಟೆ… ನನ್ನಿಂದ ತಪ್ಪಾಯ್ತಾ?
    tr: Ḍākṭrē, avaru gyās anta hēḷtidru… nānu jīrige nīru koṭṭe… nanninda tappāytā?
    en: Doctor, she kept saying it was gas… I gave her cumin water… did I do something wrong?
  - who: erdoc
    t: ಇಲ್ಲ ಮೇಡಂ, ನೀವೇನೂ ತಪ್ಪು ಮಾಡಿಲ್ಲ. ವಯಸ್ಸಾದವರಲ್ಲಿ, ಹೆಂಗಸರಲ್ಲಿ, ಶುಗರ್ ಇರೋರಲ್ಲಿ ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ತುಂಬಾ ಸಲ ಗ್ಯಾಸ್ ತರಾನೇ ಕಾಣಿಸುತ್ತೆ. ನೀವು ಎರಡು ಗಂಟೆ ಒಳಗೆ ಕರ್ಕೊಂಡು ಬಂದ್ರಿ. ಅದು ಒಳ್ಳೇದು.
    tr: Illa mēḍam, nīvēnū tappu māḍilla. Vayassādavaralli, heṅgasaralli, śugar irōralli hārṭ aṭyāk tumbā sala gyās tarānē kāṇisutte. Nīvu eraḍu gaṇṭe oḷage karkoṇḍu bandri. Adu oḷḷēdu.
    en: No, madam, you did nothing wrong. In older people, in women and in diabetics, a heart attack very often looks just like gas. You brought her within two hours. That's good.
  - who: erdoc
    t: ಈಗ ಪ್ಲಾನ್ ಕೇಳಿ. ಹೃದಯ ಜ್ಯೋತಿ ಯೋಜನೆಯಲ್ಲಿ ಟೆನೆಕ್ಟಿಪ್ಲೇಸ್ ಅನ್ನೋ ಇಂಜೆಕ್ಷನ್ ಕೊಡ್ತೀವಿ. ಅದು ರಕ್ತನಾಳದಲ್ಲಿರೋ ಹೆಪ್ಪನ್ನ ಕರಗಿಸುತ್ತೆ. ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ ಈ ಒಂದು ಇಂಜೆಕ್ಷನ್‌ಗೇ ಮೂವತ್ತು-ನಲವತ್ತು ಸಾವಿರ ಆಗುತ್ತೆ. ಇಲ್ಲಿ ಉಚಿತ.
    tr: Īga plān kēḷi. Hṛdaya Jyōti yōjaneyalli ṭenekṭiplēs annō injekṣan koḍtīvi. Adu raktanāḷadallirō heppanna karagisutte. Praivēṭ-nalli ī ondu injekṣan-gē mūvattu-nalavattu sāvira āgutte. Illi uchita.
    en: Now listen to the plan. Under the Hrudaya Jyothi scheme, we give an injection called tenecteplase. It dissolves the clot in the blood vessel. In a private hospital this one injection alone costs thirty to forty thousand. Here it's free.
  - who: appa
    t: ದುಡ್ಡಿನ ವಿಷಯ ಬಿಡಿ, ಸಾರ್. ಇಂಜೆಕ್ಷನ್‌ನಿಂದ ಏನಾದ್ರೂ ರಿಸ್ಕ್ ಇದ್ಯಾ?
    tr: Duḍḍina viṣaya biḍi, sār. Injekṣan-ninda ēnādrū risk idyā?
    en: Forget the money, sir. Is there any risk from the injection?
  - who: erdoc
    t: ಇದೆ, ಮುಚ್ಚಿಡಲ್ಲ. ರಕ್ತ ಕರಗಿಸೋ ಔಷಧಿ ಅಲ್ವಾ, ಅದಕ್ಕೆ ಎಲ್ಲಾದ್ರೂ ಬ್ಲೀಡಿಂಗ್ ಆಗಬಹುದು. ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷದಲ್ಲಿ ಆ ರಿಸ್ಕ್ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ಅಪರೂಪಕ್ಕೆ ತಲೆಯೊಳಗೂ ಆಗಬಹುದು. ಆದ್ರೆ ಇಂಜೆಕ್ಷನ್ ಕೊಡದಿದ್ರೆ, ಹೃದಯದ ಆ ಭಾಗ ಹಾಳಾಗೋ ರಿಸ್ಕ್ ಅದಕ್ಕಿಂತ ತುಂಬಾ ಜಾಸ್ತಿ.
    tr: Ide, muchchiḍalla. Rakta karagisō auṣadhi alvā, adakke ellādrū blīḍiṅg āgabahudu. Eppattombattu varṣadalli ā risk svalpa jāsti. Aparūpakke taleyoḷagū āgabahudu. Ādre injekṣan koḍadidre, hṛdayada ā bhāga hāḷāgō risk adakkinta tumbā jāsti.
    en: There is; I won't hide it. It's a clot-dissolving drug, so there can be bleeding somewhere. At seventy-nine that risk is a little higher. Rarely, it can even happen inside the head. But if we don't give the injection, the risk of that part of the heart being permanently damaged is much, much higher.
  - who: kiran
    t: ಇಂಜೆಕ್ಷನ್ ಕೊಟ್ಟ ಮೇಲೆ ಎಲ್ಲಾ ಸರಿ ಹೋಗುತ್ತಾ? ಆಮೇಲೆ ಮನೆಗೆ ಕರ್ಕೊಂಡು ಹೋಗಬಹುದಾ?
    tr: Injekṣan koṭṭa mēle ellā sari hōguttā? Āmēle manege karkoṇḍu hōgabahudā?
    en: Will everything be fine after the injection? Can we take her home after that?
  - who: erdoc
    t: ಇಲ್ಲ, ಇದು ಮೊದಲ ಹೆಜ್ಜೆ ಅಷ್ಟೇ. ಇಂಜೆಕ್ಷನ್ ಆದ ತಕ್ಷಣ ಜಯದೇವಕ್ಕೆ ರೆಫರ್ ಮಾಡ್ತೀವಿ. ಅಲ್ಲಿ ಆಂಜಿಯೋಗ್ರಾಮ್ ಮಾಡಿ ಬ್ಲಾಕ್ ಎಲ್ಲಿದೆ, ಎಷ್ಟಿದೆ ಅಂತ ನೋಡ್ತಾರೆ. ಬೇಕಾದ್ರೆ ಸ್ಟೆಂಟ್ ಹಾಕ್ತಾರೆ. ಅದೇ ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಕಳಿಸ್ತೀವಿ. ಜಯದೇವಕ್ಕೆ ನಾವೇ ಫೋನ್ ಮಾಡಿ ಇಸಿಜಿ ಕಳಿಸಿರ್ತೀವಿ.
    tr: Illa, idu modala hejje aṣṭē. Injekṣan āda takṣaṇa Jayadēvakke rephar māḍtīvi. Alli āñjiyōgrām māḍi blāk ellide, eṣṭide anta nōḍtāre. Bēkādre sṭeṇṭ hāktāre. Adē āmbulens-nalli kaḷistīvi. Jayadēvakke nāvē phōn māḍi isiji kaḷisirtīvi.
    en: No, this is only the first step. As soon as the injection is done, we'll refer her to Jayadeva. There they'll do an angiogram to see where the block is and how bad. If needed, they'll put in a stent. We'll send her in the same ambulance. We'll have called Jayadeva and sent them the ECG ourselves.
  - who: erdoc
    t: ಈ ಕನ್ಸೆಂಟ್ ಫಾರ್ಮ್ ನೋಡಿ, ಕನ್ನಡ-ಇಂಗ್ಲಿಷ್ ಎರಡರಲ್ಲೂ ಇದೆ. ನಾನು ಈಗ ಹೇಳಿದ್ದೇ ಇದರಲ್ಲಿ ಬರೆದಿದೆ. ಪೇಶಂಟ್ ಸೈನ್ ಮಾಡ್ತಾರೆ, ನೀವೂ ಹತ್ತಿರದ ಸಂಬಂಧಿಯಾಗಿ ಸೈನ್ ಮಾಡ್ಬೇಕು. ಬೇಗ, ಪ್ಲೀಸ್.
    tr: Ī kanseṇṭ phārm nōḍi, Kannaḍa-iṅgliṣ eraḍarallū ide. Nānu īga hēḷiddē idaralli baredide. Pēśaṇṭ sain māḍtāre, nīvū hattirada sambandhiyāgi sain māḍbēku. Bēga, plīs.
    en: Look at this consent form; it's in both Kannada and English. What I just told you is what's written here. The patient will sign, and you need to sign too, as next of kin. Quickly, please.
  - who: appa
    t: ಸಾರ್, ಕೈ ನಡುಗ್ತಿದೆ… ಅಕ್ಷರ ಕಾಣಿಸ್ತಿಲ್ಲ. ಕಿರಣ್, ನೀನು ಸ್ವಲ್ಪ ಓದು.
    tr: Sār, kai naḍugtide… akṣara kāṇistilla. Kiraṇ, nīnu svalpa ōdu.
    en: (holding the pen, unable to steady it) Sir, my hand is shaking… I can't see the letters. Kiran, you read it.
  - who: kiran
    t: “ರೋಗಿಗೆ ತೀವ್ರ ಹೃದಯಾಘಾತ ಆಗಿರುವುದರಿಂದ ಥ್ರಾಂಬೊಲಿಸಿಸ್ ಚಿಕಿತ್ಸೆ ನೀಡಲಾಗುವುದು. ಈ ಚಿಕಿತ್ಸೆಯಲ್ಲಿ ರಕ್ತಸ್ರಾವದ ಅಪಾಯ ಇರುತ್ತದೆ ಎಂದು ನಮಗೆ ವಿವರಿಸಲಾಗಿದೆ…” ಅಪ್ಪ, ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ದೇ ಇದೆ. ಸೈನ್ ಮಾಡು.
    tr: “Rōgige tīvra hṛdayāghāta āgiruvudarinda thrāmbolisis chikitse nīḍalāguvudu. Ī chikitseyalli raktasrāvada apāya iruttade endu namage vivarisalāgide…” Appa, ḍākṭru hēḷiddē ide. Sain māḍu.
    en: “As the patient has suffered a severe heart attack, thrombolysis treatment will be administered. It has been explained to us that this treatment carries a risk of bleeding…” Appa, it's exactly what the doctor said. Sign it.
  - who: appa
    t: ತಗೊಳ್ಳಿ, ಸಾರ್. ಡಾಕ್ಟ್ರೇ… ನಮ್ಮಮ್ಮ… ಉಳೀತಾರಾ?
    tr: Tagoḷḷi, sār. Ḍākṭrē… nammamma… uḷītārā?
    en: (signing) Here, sir. Doctor… my mother… will she make it?
  - who: erdoc
    t: ಈಗ ಬಿಪಿ ಸ್ಟೇಬಲ್ ಆಗಿದೆ, ಮಾತಾಡ್ತಿದ್ದಾರೆ. ಅದು ಒಳ್ಳೆ ಲಕ್ಷಣ. ಗ್ಯಾರಂಟಿ ಕೊಡೋಕಾಗಲ್ಲ, ಸಾರ್. ಆದ್ರೆ ನಮ್ಮ ಕೈಲಾದಷ್ಟು ಎಲ್ಲಾ ಮಾಡ್ತೀವಿ. ಮುಂದಿನ ಕೆಲವು ಗಂಟೆ ತುಂಬಾ ಮುಖ್ಯ.
    tr: Īga bi-pi sṭēbal āgide, mātāḍtiddāre. Adu oḷḷe lakṣaṇa. Gyāraṇṭi koḍōkāgalla, sār. Ādre namma kailādaṣṭu ellā māḍtīvi. Mundina kelavu gaṇṭe tumbā mukhya.
    en: Her BP is stable now and she's talking. That's a good sign. I can't give you a guarantee, sir. But we'll do everything in our power. The next few hours are very important.
  - section: 📱 Telling Shwetha
    learn: 'breaking bad news gently: modalu kūtkō, dīrghavāgi usiru tagō · hearsay -ante (stēbal ante) · don''t rush: ōḍi barbēḍa · promise: āṇe · relaying a message with … anta hēḷu'
  - scene: 'Twenty past eleven. Ajji has had the injection and is being readied for the transfer to Jayadeva. In the corridor, Appa looks at his phone: three missed calls from Shwetha.'
  - who: appa
    t: ಕಿರಣ್, ಶ್ವೇತಾ ಮೂರು ಸಲ ಫೋನ್ ಮಾಡಿದ್ದಾಳೆ. ಯಾರೋ ಹೇಳಿರ್ಬೇಕು. ಅಮ್ಮ ಬೇಡ ಅಂದಿದ್ರು, ಆದ್ರೆ ಮುಚ್ಚಿಟ್ರೆ ಇನ್ನೂ ಕೆಟ್ಟದು.
    tr: Kiraṇ, Shwētā mūru sala phōn māḍiddāḷe. Yārō hēḷirbēku. Amma bēḍa andidru, ādre muchchiṭre innū keṭṭadu.
    en: Kiran, Shwetha has called three times. Someone must have told her. Amma said not to, but hiding it would be worse.
  - who: kiran
    t: ನಾನು ಮಾತಾಡ್ತೀನಿ, ಅಪ್ಪ. ನೀನು ಮಾತಾಡಿದ್ರೆ ನಿನ್ ಧ್ವನಿ ಕೇಳಿನೇ ಅವಳು ಇನ್ನೂ ಹೆದರ್ತಾಳೆ.
    tr: Nānu mātāḍtīni, appa. Nīnu mātāḍidre nin dhvani kēḷinē avaḷu innū hedartāḷe.
    en: I'll talk to her, Appa. If you do, just hearing your voice will scare her even more.
  - who: shwe
    t: ಕಿರಣ್! ಏನಾಗ್ತಿದೆ? ವಿಮಲಾ ಆಂಟಿ ಸೊಸೆ ಇನ್‌ಸ್ಟಾ ಸ್ಟೋರಿಲಿ ನಮ್ಮ ಮನೆ ಮುಂದೆ ಆಂಬುಲೆನ್ಸ್ ಫೋಟೋ ಹಾಕಿದ್ದಾಳೆ! ಅಜ್ಜಿಗೆ ಏನಾಯ್ತು? ನಿಜ ಹೇಳು!
    tr: Kiraṇ! Ēnāgtide? Vimalā āṇṭi sose insṭā sṭōrili namma mane munde āmbulens phōṭō hākiddāḷe! Ajjige ēnāytu? Nija hēḷu!
    en: (on the phone) Kiran! What's going on? Vimala Aunty's daughter-in-law has posted a photo of an ambulance outside our house on her Insta story! What happened to Ajji? Tell me the truth!
  - who: kiran
    t: 'ಅಕ್ಕ, ಮೊದಲು ಕೂತ್ಕೋ. ದೀರ್ಘವಾಗಿ ಉಸಿರು ತಗೋ. … ಅಜ್ಜಿಗೆ ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆಗಿದೆ. ಆದ್ರೆ ಕೇಳು: ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ಆಸ್ಪತ್ರೆಗೆ ಬಂದ್ವಿ. ಇಂಜೆಕ್ಷನ್ ಕೊಟ್ಟಿದ್ದಾರೆ, ಮಾತಾಡ್ತಿದ್ದಾರೆ. ಬಿಪಿ ಸ್ಟೇಬಲ್ ಅಂತೆ.'
    tr: 'Akka, modalu kūtkō. Dīrghavāgi usiru tagō. … Ajjige hārṭ aṭyāk āgide. Ādre kēḷu: samayakke sariyāgi āspatrege bandvi. Injekṣan koṭṭiddāre, mātāḍtiddāre. Bi-pi sṭēbal ante.'
    en: 'Akka, sit down first. Take a deep breath. … Ajji has had a heart attack. But listen: we got to the hospital in time. They''ve given her an injection, and she''s talking. The doctor says her BP is stable.'
  - who: shwe
    t: ಅಯ್ಯೋ… ಅಜ್ಜಿ… ನಾನು ಈಗಲೇ ಬರ್ತೀನಿ. ಪ್ರದೀಪ್, ಕಾರ್ ಕೀ ತಗೋ…
    tr: Ayyō… ajji… nānu īgalē bartīni. Pradīp, kār kī tagō…
    en: Oh no… Ajji… I'm coming right now. Pradeep, get the car keys…
  - who: kiran
    t: ಬೇಡ ಅಕ್ಕ, ಪ್ಲೀಸ್. ಈಗ ಅಜ್ಜಿನ ಜಯದೇವಕ್ಕೆ ಶಿಫ್ಟ್ ಮಾಡ್ತಿದ್ದಾರೆ. ನೀನು ಬಂದ್ರೂ ಒಳಗೆ ಬಿಡಲ್ಲ, ರಾತ್ರಿಯೆಲ್ಲಾ ಕಾರಿಡಾರ್‌ನಲ್ಲಿ ನಿಂತಿರ್ತೀಯ. ನಿನ್ ಹೊಟ್ಟೇಲಿರೋ ಮಗೂಗೆ ಅದು ಒಳ್ಳೇದಲ್ಲ.
    tr: Bēḍa akka, plīs. Īga ajjina Jayadēvakke śiphṭ māḍtiddāre. Nīnu bandrū oḷage biḍalla, rātriyellā kāriḍār-nalli nintirtīya. Nin hoṭṭēlirō magūge adu oḷḷēdalla.
    en: No, Akka, please. They're shifting Ajji to Jayadeva now. Even if you come, they won't let you in; you'll be standing in a corridor all night. That's not good for the baby you're carrying.
  - who: pradeep
    t: ಕಿರಣ್, ನಾನು ಪ್ರದೀಪ್, ಸ್ಪೀಕರ್‌ನಲ್ಲಿದ್ದೀನಿ. ಇವತ್ತು ರಾತ್ರಿ ನಾನು ಶ್ವೇತಾ ಜೊತೆನೇ ಇರ್ತೀನಿ. ಜಯದೇವದಲ್ಲಿ ದುಡ್ಡು, ಓಡಾಟ, ಏನೇ ಬೇಕಾದ್ರೂ ತಕ್ಷಣ ಫೋನ್ ಮಾಡು, ಹತ್ತು ನಿಮಿಷದಲ್ಲಿ ಬರ್ತೀನಿ. ಸರಿನಾ, ಶ್ವೇತಾ?
    tr: Kiraṇ, nānu Pradīp, spīkar-nalliddīni. Ivattu rātri nānu Shwētā jotenē irtīni. Jayadēvadalli duḍḍu, ōḍāṭa, ēnē bēkādrū takṣaṇa phōn māḍu, hattu nimiṣadalli bartīni. Sarinā, Shwētā?
    en: Kiran, it's Pradeep, I'm on speaker. Tonight I'll stay here with Shwetha. If you need anything at Jayadeva — money, running around, anything — call me at once; I'll be there in ten minutes. All right, Shwetha?
  - who: shwe
    t: …ಸರಿ. ಆದ್ರೆ ಪ್ರತಿ ಅರ್ಧ ಗಂಟೆಗೆ ಮೆಸೇಜ್ ಮಾಡ್ಬೇಕು, ಆಣೆ. ಕಿರಣ್… ಅಜ್ಜಿಗೆ ಹೇಳು, ನಾನು ಕಾಯ್ತಿದ್ದೀನಿ ಅಂತ. ನಾವಿಬ್ರೂ ಕಾಯ್ತಿದ್ದೀವಿ ಅಂತ.
    tr: …Sari. Ādre prati ardha gaṇṭege mesēj māḍbēku, āṇe. Kiraṇ… ajjige hēḷu, nānu kāytiddīni anta. Nāvibrū kāytiddīvi anta.
    en: (crying) …Okay. But you message me every half hour, promise. Kiran… tell Ajji I'm waiting for her. Tell her we're both waiting.
  - who: appa
    t: 'ಶ್ವೇತಾ, ಮಗಳೇ… ಅಜ್ಜಿ ನಿನಗೆ ಒಂದು ಮಾತು ಹೇಳಿ ಅಂದ್ರು: “ಮರಿಮಗೂನ ಎತ್ಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ.” ನೀನು ಸಮಾಧಾನವಾಗಿ ಮಲಗು, ಮಗಳೇ.'
    tr: 'Shwētā, magaḷē… ajji ninage ondu mātu hēḷi andru: “Marimagūna etkoḷḷōvaregū nānu ellū hōgalla.” Nīnu samādhānavāgi malagu, magaḷē.'
    en: '(taking the phone) Shwetha, my girl… Ajji asked me to give you a message: “I''m not going anywhere until I''ve held my great-grandchild.” Now try to sleep, my dear.'
  - who: emt
    t: ಸಾರ್, ಪೇಶಂಟ್ ರೆಡಿ. ಜಯದೇವಕ್ಕೆ ಹೊರಡ್ತಿದ್ದೀವಿ. ಒಬ್ಬರು ಬನ್ನಿ, ಬೇಗ.
    tr: Sār, pēśaṇṭ reḍi. Jayadēvakke horaḍtiddīvi. Obbaru banni, bēga.
    en: Sir, the patient is ready. We're leaving for Jayadeva. One of you come, quickly.
  - who: appa
    t: ಬಂದೆ. ಲಕ್ಷ್ಮಿ, ಕಿರಣ್, ಸ್ಯಾಮ್, ಹಿಂದೆನೇ ಬನ್ನಿ. … ದೇವರೇ, ಕಾಪಾಡಪ್ಪ.
    tr: Bande. Lakshmī, Kiraṇ, Sām, hindenē banni. … Dēvarē, kāpāḍappa.
    en: Coming. Lakshmi, Kiran, Sam, follow right behind. … God, please protect her.
  - chapter: Chapter 3 — Jayadeva
  - section: 🚑 Through the night to Jayadeva
    learn: 'time clauses: -ōṣṭaralli (by the time) · reassurance: dhairyavāgiru, mātāḍbēḍi · ‘thank you’ that is really ‘it was a great favour’'
  - scene: Just after midnight. The ambulance races down Bannerghatta Road with its siren on. Ajji lies under an oxygen mask; Appa sits beside her, holding her hand. Sam follows in his car with Amma and Kiran.
  - who: emt
    t: ಇನ್ನು ಐದು ನಿಮಿಷ ಸಾರ್, ಜಯದೇವ ಬಂತು. ಇಂಜೆಕ್ಷನ್ ಕೊಟ್ಟಮೇಲೆ ಇಸಿಜಿ ಸ್ವಲ್ಪ ಸುಧಾರಿಸಿದೆ, ಬಿಪಿ ಕೂಡ ಸ್ಟೇಬಲ್ ಆಗಿದೆ.
    tr: Innu aidu nimiṣa sār, Jayadēva bantu. Injekṣan koṭṭamēle isiji swalpa sudhāriside, bipi kūḍa sṭēbal āgide.
    en: Five more minutes, sir, we're almost at Jayadeva. Since the injection her ECG has improved a little, and her BP is stable too.
  - who: appa
    t: ಅಮ್ಮಾ, ಕೇಳಿಸ್ತಿದ್ಯಾ? ಇನ್ನೇನು ತಲುಪ್ತೀವಿ. ಧೈರ್ಯವಾಗಿರು.
    tr: Ammā, kēḷistidyā? Innēnu taluptīvi. Dhairyavāgiru.
    en: Amma, can you hear me? We're nearly there. Be brave.
  - who: ajji
    t: ನಾನು ಧೈರ್ಯವಾಗೇ ಇದೀನಿ ಕಣೋ. ನೀನು ಮೊದಲು ಆ ಮುಖ ಸರಿ ಮಾಡ್ಕೋ.
    tr: Nānu dhairyavāgē idīni kaṇō. Nīnu modalu ā mukha sari māḍkō.
    en: (weakly, behind the mask) I am being brave, my boy. You fix that face of yours first.
  - who: emt
    t: ಅಜ್ಜಿ, ಮಾತಾಡ್ಬೇಡಿ, ಸುಮ್ನೆ ನಿಧಾನವಾಗಿ ಉಸಿರಾಡಿ. ನಾವು ಗೇಟ್ ತಲುಪೋಷ್ಟರಲ್ಲಿ ಎಮರ್ಜೆನ್ಸಿಯವರು ರೆಡಿ ಇರ್ತಾರೆ, ಆಗಲೇ ಫೋನ್ ಮಾಡಿ ಹೇಳಿದೀನಿ.
    tr: Ajji, mātāḍbēḍi, sumne nidhānavāgi usirāḍi. Nāvu gēṭ talupōṣṭaralli emarjensiyavaru reḍi irtāre, āgalē phōn māḍi hēḷidīni.
    en: Ajji, don't talk, just breathe slowly. By the time we reach the gate the emergency team will be ready — I've already called ahead.
  - scene: The ambulance stops at the Jayadeva emergency entrance. Even at half past twelve, the corridor is full of families from all over Karnataka.
  - who: emt
    t: ಸ್ಟ್ರೆಚರ್ ತನ್ನಿ! ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷದ ಪೇಶಂಟ್, ಸ್ಟೆಮಿ. ಹೃದಯ ಜ್ಯೋತಿ ಸ್ಪೋಕ್ ಆಸ್ಪತ್ರೆಯಿಂದ ರೆಫರ್ ಆಗಿದೆ. ಹನ್ನೊಂದು ಕಾಲಿಗೆ ಕ್ಲಾಟ್ ಕರಗಿಸೋ ಇಂಜೆಕ್ಷನ್ ಕೊಟ್ಟಿದ್ದಾರೆ. ಪೇಪರ್ಸ್ ಎಲ್ಲಾ ಈ ಫೈಲ್‌ನಲ್ಲಿದೆ.
    tr: Sṭrechar tanni! Eppattombattu varṣada pēshanṭ, sṭemi. Hṛdaya Jyōti spōk āspatreyinda rephar āgide. Hannondu kālige klāṭ karagisō injekṣan koṭṭiddāre. Pēpars ellā ī phail-nallide.
    en: Bring the stretcher! Seventy-nine-year-old patient, STEMI. Referred from a Hrudaya Jyothi spoke hospital. The clot-dissolving injection was given at quarter past eleven. All the papers are in this file.
  - who: appa
    t: ಮಂಜುನಾಥ್ ಅವರೇ, ನಿಮ್ಮಿಂದ ತುಂಬಾ ಉಪಕಾರ ಆಯ್ತು. ನೀವಿಲ್ಲದಿದ್ರೆ…
    tr: Manjunāth avarē, nimminda tumbā upakāra āytu. Nīvilladidre…
    en: Manjunath, you've done us a huge favour. If you hadn't been there…
  - who: emt
    t: ಅಯ್ಯೋ, ಇದು ನಮ್ ಕೆಲಸ ಸಾರ್. ಅಜ್ಜಿ ಬೇಗ ಹುಷಾರಾಗ್ಲಿ. ಹೋಗಿ, ಒಳಗೆ ನಿಮ್ಮನ್ನೇ ಕೇಳ್ತಿರ್ತಾರೆ.
    tr: Ayyō, idu nam kelasa sār. Ajji bēga huṣārāgli. Hōgi, oḷage nimmannē kēḷtirtāre.
    en: Oh, this is our job, sir. May Ajji get well soon. Go on — they'll be asking for you inside.
  - section: 🪪 Registration at midnight
    learn: 'documents at a counter · ‘How are you related?’: ēnāgbēku? · ‘-ಬೇಕು’ for requirements · concessive -ādrū (even though)'
  - scene: Ajji is wheeled inside. Amma, Kiran and Sam rush in. Appa is sent to the registration counter, where a line has formed even at this hour.
  - who: desk
    t: ಮುಂದಿನವರು ಬನ್ನಿ. ಪೇಶಂಟ್ ಹೆಸರು, ವಯಸ್ಸು? ನೀವು ಪೇಶಂಟ್‌ಗೆ ಏನಾಗ್ಬೇಕು?
    tr: Mundinavaru banni. Pēshanṭ hesaru, vayassu? Nīvu pēshanṭ-ge ēnāgbēku?
    en: Next, please. Patient's name and age? How are you related to the patient?
  - who: appa
    t: ಸರಸ್ವತಮ್ಮ, ಎಪ್ಪತ್ತೊಂಬತ್ತು ವರ್ಷ. ನಾನು ಅವರ ಮಗ, ರಮೇಶ್. ಎಮರ್ಜೆನ್ಸಿಯಿಂದ ಈಗಷ್ಟೇ ಒಳಗೆ ಕರ್ಕೊಂಡ್ ಹೋದ್ರು.
    tr: Saraswatamma, eppattombattu varṣa. Nānu avara maga, Ramēsh. Emarjensiyinda īgaṣṭē oḷage karkoṇḍ hōdru.
    en: Saraswathamma, seventy-nine. I'm her son, Ramesh. They've just taken her in from emergency.
  - who: desk
    t: ಸರಿ. ಆಧಾರ್ ಕಾರ್ಡ್, ರೆಫರಲ್ ಲೆಟರ್, ಅಲ್ಲಿ ಮಾಡಿದ ಇಸಿಜಿ ಕೊಡಿ. ನಿಮ್ಮ ಫೋನ್ ಯಾವಾಗ್ಲೂ ಆನ್ ಇರ್ಬೇಕು — ಡಾಕ್ಟ್ರು ಯಾವ ಹೊತ್ತಲ್ಲಾದ್ರೂ ಕರೀಬಹುದು.
    tr: Sari. Ādhār kārḍ, repharal leṭar, alli māḍida isiji koḍi. Nimma phōn yāvāglū ān irbēku — ḍākṭru yāva hottallādrū karībahudu.
    en: Right. Give me her Aadhaar card, the referral letter and the ECG they did there. Your phone must stay on at all times — the doctor may call you at any hour.
  - who: appa
    t: ಅಯ್ಯೋ… ಆಧಾರ್… ಗಡಿಬಿಡೀಲಿ ಮನೇಲೇ ಬಿಟ್ಟು ಬಂದ್ವಿ ಅನ್ಸುತ್ತೆ.
    tr: Ayyō… ādhār… gaḍibiḍīli manēlē biṭṭu bandvi ansutte.
    en: Oh no… the Aadhaar… I think we left it at home in the rush.
  - who: kiran
    t: ಅಪ್ಪಾ, ಟೆನ್ಶನ್ ಬೇಡ. ಅಜ್ಜಿ ಆಧಾರ್ ನನ್ನ ಫೋನ್‌ನಲ್ಲಿ ಡಿಜಿಲಾಕರ್‌ನಲ್ಲಿದೆ. ಕಳೆದ ತಿಂಗಳು ಬ್ಯಾಂಕ್ ಕೆಲಸಕ್ಕೆ ಹಾಕಿದ್ದೆ.
    tr: Appā, ṭenshan bēḍa. Ajji ādhār nanna phōn-nalli ḍijilākar-nallide. Kaḷeda tingaḷu byāṅk kelasakke hākidde.
    en: Appa, don't stress. Ajji's Aadhaar is in DigiLocker on my phone. I put it there last month for the bank work.
  - who: desk
    t: ಸದ್ಯಕ್ಕೆ ಅದು ಸಾಕು. ಒರಿಜಿನಲ್ ನಾಳೆ ತಂದು ತೋರಿಸಿ. ಇದು ಅವರ ಐಪಿ ನಂಬರ್ — ಇನ್ಮೇಲೆ ರಿಪೋರ್ಟ್, ಬಿಲ್, ಔಷಧಿ, ಎಲ್ಲಾದಕ್ಕೂ ಈ ನಂಬರೇ ಬೇಕು. ಕಳ್ಕೋಬೇಡಿ.
    tr: Sadyakke adu sāku. Orijinal nāḷe tandu tōrisi. Idu avara aipi nambar — inmēle riporṭ, bil, auṣadhi, ellādakkū ī nambarē bēku. Kaḷkōbēḍi.
    en: 'That''s enough for now. Bring the original tomorrow and show it. This is her IP number — from now on you''ll need it for everything: reports, bills, medicines. Don''t lose it.'
  - who: sam
    t: ಕಿರಣ್, ಇಷ್ಟು ರಾತ್ರೀಲೂ ಇಷ್ಟೊಂದು ಜನ! ಎಲ್ಲಾರೂ ಬೆಂಗಳೂರಿನವರಾ?
    tr: Kiraṇ, iṣṭu rātrīlū iṣṭondu jana! Ellārū Beṅgaḷūrinavarā?
    en: Kiran, so many people even this late at night! Are they all from Bengaluru?
  - who: kiran
    t: ಇಲ್ಲ, ಹಾಸನ, ರಾಯಚೂರು, ಬೀದರ್ — ಕರ್ನಾಟಕದ ಮೂಲೆ ಮೂಲೆಯಿಂದ ಬರ್ತಾರೆ. ಸರ್ಕಾರಿ ಆಸ್ಪತ್ರೆ ಆದ್ರೂ ಹಾರ್ಟ್‌ಗೆ ಜಯದೇವಾನೇ ಬೆಸ್ಟ್ ಅಂತ ಎಲ್ಲಾರ ನಂಬಿಕೆ.
    tr: Illa, Hāsana, Rāyachūru, Bīdar — Karnāṭakada mūle mūleyinda bartāre. Sarkāri āspatre ādrū hārṭ-ge Jayadēvānē besṭ anta ellāra nambike.
    en: No — Hassan, Raichur, Bidar — they come from every corner of Karnataka. It's a government hospital, but for the heart everyone trusts Jayadeva most.
  - who: desk
    t: ಹೌದು. ಕಳೆದ ವರ್ಷ ಹಾಸನದ ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಸುದ್ದಿ ಆದ್ಮೇಲಂತೂ ಓಪಿಡಿಗೆ ದಿನಾ ಸಾವಿರಕ್ಕಿಂತ ಜಾಸ್ತಿ ಜನ ಬರ್ತಿದ್ರು. ಕಾಯಬೇಕಾಗುತ್ತೆ, ಬೇಜಾರು ಮಾಡ್ಕೋಬೇಡಿ. ಆದ್ರೆ ಎಮರ್ಜೆನ್ಸಿ ಕೇಸನ್ನ ನಾವು ಯಾವತ್ತೂ ಕಾಯಿಸಲ್ಲ.
    tr: Haudu. Kaḷeda varṣa Hāsanada hārṭ aṭyāk suddi ādmēlantū ōpiḍige dinā sāvirakkinta jāsti jana bartidru. Kāyabēkāgutte, bējāru māḍkōbēḍi. Ādre emarjensi kēsanna nāvu yāvattū kāyisalla.
    en: True. After last year's news about heart attacks in Hassan, more than a thousand people a day were coming to the OPD. You'll have to wait for some things — please don't be upset. But we never make an emergency case wait.
  - who: desk
    t: ಇನ್ನೊಂದು ವಿಷಯ ಸಾರ್ — ಅಜ್ಜಿಗೆ ಎಪ್ಪತ್ತು ದಾಟಿದೆ. ಆಯುಷ್ಮಾನ್ ಕಾರ್ಡ್ ಇದ್ಯಾ? ಇಲ್ಲಾಂದ್ರೆ ಬೆಳಿಗ್ಗೆ ಏಳು ಗಂಟೆಗೆ ಆರೋಗ್ಯಮಿತ್ರ ಕೌಂಟರ್‌ಗೆ ಬನ್ನಿ. ಈಗ ಮೊದಲು ಟ್ರೀಟ್ಮೆಂಟ್.
    tr: Innondu viṣaya sār — Ajjige eppattu dāṭide. Āyuṣmān kārḍ idyā? Illāndre beḷigge ēḷu gaṇṭege Ārōgyamitra kaunṭar-ge banni. Īga modalu ṭrīṭmenṭ.
    en: One more thing, sir — Ajji is over seventy. Does she have an Ayushman card? If not, come to the Arogyamitra counter at seven in the morning. Treatment comes first right now.
  - section: 🩺 What the angiogram showed
    learn: 'explaining a diagnosis · percentages · dative experiencer: avarige sustu āgtittu · ‘don''t blame yourselves’: dūrkōbēḍi'
  - scene: Around three in the morning. Ajji has been taken for an angiogram. Dr. Meera Kulkarni comes out of the cath lab with a tablet in her hand and calls the family into a small counselling room.
  - who: cardio
    t: ಸರಸ್ವತಮ್ಮನವರ ಕಡೆಯವರು ಯಾರು? ಬನ್ನಿ, ಕೂತ್ಕೊಳ್ಳಿ. ನಾನು ಡಾಕ್ಟರ್ ಮೀರಾ ಕುಲಕರ್ಣಿ, ಕಾರ್ಡಿಯಾಲಜಿಸ್ಟ್.
    tr: Saraswatammanavara kaḍeyavaru yāru? Banni, kūtkoḷḷi. Nānu ḍākṭar Mīrā Kulakarṇi, kārḍiyālajisṭ.
    en: Who is here for Saraswathamma? Come, sit down. I'm Dr. Meera Kulkarni, the cardiologist.
  - who: appa
    t: ನಮಸ್ಕಾರ ಡಾಕ್ಟ್ರೇ. ನಾನು ಮಗ. ಅಮ್ಮ… ಹೇಗಿದ್ದಾರೆ?
    tr: Namaskāra ḍākṭrē. Nānu maga. Amma… hēgiddāre?
    en: Hello, Doctor. I'm her son. How… how is she?
  - who: cardio
    t: ಈಗ ಸ್ಟೇಬಲ್ ಆಗಿದ್ದಾರೆ, ಪ್ರಜ್ಞೆ ಇದೆ, ಮಾತಾಡ್ತಿದ್ದಾರೆ. ಆ ಸ್ಪೋಕ್ ಆಸ್ಪತ್ರೇಲಿ ಬೇಗ ಇಂಜೆಕ್ಷನ್ ಕೊಟ್ಟಿದ್ದು ತುಂಬಾ ಒಳ್ಳೇದಾಯ್ತು. ಆದ್ರೆ ಆ ಇಂಜೆಕ್ಷನ್ ಕ್ಲಾಟ್ ಕರಗಿಸುತ್ತೆ ಅಷ್ಟೇ, ಕೆಳಗಿರೋ ಬ್ಲಾಕೇಜ್ ಹಾಗೇ ಇರುತ್ತೆ. ಅದಕ್ಕೇ ಆಂಜಿಯೋಗ್ರಾಮ್ ಮಾಡಿದ್ವಿ.
    tr: Īga sṭēbal āgiddāre, prajñe ide, mātāḍtiddāre. Ā spōk āspatrēli bēga injekṣan koṭṭiddu tumbā oḷḷēdāytu. Ādre ā injekṣan klāṭ karagisutte aṣṭē, keḷagirō blākēj hāgē irutte. Adakkē āñjiyōgrām māḍidvi.
    en: She's stable now, conscious and talking. It was very good that the spoke hospital gave the injection so early. But that injection only dissolves the clot — the blockage underneath stays. That's why we did an angiogram.
  - who: amma
    t: ಆಂಜಿಯೋಗ್ರಾಮ್ ಅಂದ್ರೆ ಆಪರೇಷನ್ನಾ ಡಾಕ್ಟ್ರೇ?
    tr: Āñjiyōgrām andre āparēṣannā ḍākṭrē?
    en: Is an angiogram an operation, Doctor?
  - who: cardio
    t: ಇಲ್ಲಮ್ಮ, ಅದು ಒಂದು ಟೆಸ್ಟ್. ಕೈ ಮಣಿಕಟ್ಟಿನ ಹತ್ರ ಒಂದು ಸಣ್ಣ ಟ್ಯೂಬ್ ಹಾಕಿ, ಡೈ ಬಿಟ್ಟು, ಹೃದಯದ ರಕ್ತನಾಳಗಳನ್ನ ಎಕ್ಸ್‌ರೇ ಥರ ನೋಡ್ತೀವಿ. ಈ ಸ್ಕ್ರೀನ್ ನೋಡಿ.
    tr: Illamma, adu ondu ṭesṭ. Kai maṇikaṭṭina hatra ondu saṇṇa ṭyūb hāki, ḍai biṭṭu, hṛdayada raktanāḷagaḷanna eksrē thara nōḍtīvi. Ī skrīn nōḍi.
    en: No, Amma, it's a test. We put a thin tube in near the wrist, release a dye, and look at the heart's blood vessels like an X-ray. Look at this screen.
  - who: cardio
    t: ಹೃದಯಕ್ಕೆ ರಕ್ತ ಕೊಡೋ ಮೂರು ಮುಖ್ಯ ನಾಳಗಳಿವೆ. ಈ ಮುಂದಿನದು — ನಾವು ಎಲ್‌ಎಡಿ ಅಂತೀವಿ — ಇದರಲ್ಲಿ ತೊಂಬತ್ತು ಪರ್ಸೆಂಟ್ ಬ್ಲಾಕ್ ಇದೆ. ಅಟ್ಯಾಕ್ ಬಂದಿದ್ದು ಇದರಿಂದಾನೇ. ಬಲಗಡೆ ನಾಳದಲ್ಲಿ ಸುಮಾರು ಐವತ್ತು ಪರ್ಸೆಂಟ್ ಇದೆ, ಅದಕ್ಕೆ ಸದ್ಯಕ್ಕೆ ಮಾತ್ರೆ ಸಾಕು.
    tr: Hṛdayakke rakta koḍō mūru mukhya nāḷagaḷive. Ī mundinadu — nāvu el-e-ḍi antīvi — idaralli tombattu parsenṭ blāk ide. Aṭyāk bandiddu idarindānē. Balagaḍe nāḷadalli sumāru aivattu parsenṭ ide, adakke sadyakke mātre sāku.
    en: There are three main vessels that supply blood to the heart. This front one — we call it the LAD — is ninety percent blocked. That's what caused the attack. The one on the right is about fifty percent blocked; for now tablets are enough for that.
  - who: kiran
    t: ತೊಂಬತ್ತು ಪರ್ಸೆಂಟ್ ಅಂದ್ರೆ… ರಕ್ತ ಬರೀ ಹತ್ತು ಪರ್ಸೆಂಟ್ ಮಾತ್ರ ಹೋಗ್ತಿತ್ತಾ?
    tr: Tombattu parsenṭ andre… rakta barī hattu parsenṭ mātra hōgtittā?
    en: Ninety percent means… only ten percent of the blood was getting through?
  - who: cardio
    t: ಹೆಚ್ಚು ಕಮ್ಮಿ ಹಾಗೇ. ಅದಕ್ಕೇ ಅವರಿಗೆ ಕೆಲವು ತಿಂಗಳಿಂದ ಮೆಟ್ಟಿಲು ಹತ್ತುವಾಗ ಸುಸ್ತು, ದಮ್ಮು ಆಗ್ತಿದ್ದಿರಬಹುದು. ಯಾರಿಗಾದ್ರೂ ಹೇಳಿದ್ರಾ?
    tr: Hechchu kammi hāgē. Adakkē avarige kelavu tingaḷinda meṭṭilu hattuvāga sustu, dammu āgtiddirabahudu. Yārigādrū hēḷidrā?
    en: More or less. That's probably why she's been getting tired and breathless on the stairs for a few months. Did she mention it to anyone?
  - who: amma
    t: …ಹೇಳ್ತಿದ್ರು. ‘ವಯಸ್ಸಾಯ್ತು, ಗ್ಯಾಸ್ ಇರ್ಬೇಕು’ ಅಂತ ನಾವೇ ಸುಮ್ಮನಾದ್ವಿ.
    tr: …Hēḷtidru. ‘Vayassāytu, gyās irbēku’ anta nāvē summanādvi.
    en: '(quietly) …She did. We just brushed it off ourselves: ‘It''s age, it must be gas.’'
  - who: cardio
    t: ಅದಕ್ಕೆ ನಿಮ್ಮನ್ನ ನೀವು ದೂರ್ಕೋಬೇಡಿ. ತುಂಬಾ ಜನ ಹಾಗೇ ಅನ್ಕೋತಾರೆ, ಹೆಂಗಸರಲ್ಲಿ ಲಕ್ಷಣ ಬೇರೆ ಥರಾನೂ ಇರುತ್ತೆ. ಈಗ ಮುಖ್ಯ ಅಂದ್ರೆ, ಮುಂದೆ ಏನು ಮಾಡೋದು ಅಂತ.
    tr: Adakke nimmanna nīvu dūrkōbēḍi. Tumbā jana hāgē ankōtāre, heṅgasaralli lakṣaṇa bēre tharānū irutte. Īga mukhya andre, munde ēnu māḍōdu anta.
    en: Don't blame yourselves for that. Lots of people think the same, and in women the symptoms can look different too. What matters now is what we do next.
  - section: ⚖️ Stent or bypass?
    learn: 'conditionals of risk: -idre … -bahudu · ‘-ಬಹುದು’ (may) vs ‘-ಉತ್ತೆ’ (will) · comparisons with -kkinta · ‘the decision is yours’: nirdhāra nimdu'
  - who: cardio
    t: ಎರಡು ದಾರಿ ಇದೆ. ಒಂದು, ಆಂಜಿಯೋಪ್ಲಾಸ್ಟಿ — ಅದೇ ಮಣಿಕಟ್ಟಿನಿಂದ ಒಂದು ಬಲೂನ್ ತಗೊಂಡು ಹೋಗಿ, ಬ್ಲಾಕ್ ಆಗಿರೋ ಜಾಗ ಅಗಲ ಮಾಡಿ, ಒಂದು ಸ್ಟೆಂಟ್ ಇಡ್ತೀವಿ. ಸ್ಟೆಂಟ್ ಅಂದ್ರೆ ಜಾಲರಿ ಥರ ಇರೋ ಒಂದು ಸಣ್ಣ ಟ್ಯೂಬ್. ನಾಳ ಮತ್ತೆ ಮುಚ್ಚಿಹೋಗದ ಹಾಗೆ ಅದು ಹಿಡ್ಕೊಳ್ಳುತ್ತೆ.
    tr: Eraḍu dāri ide. Ondu, āñjiyōplāsṭi — adē maṇikaṭṭininda ondu balūn tagoṇḍu hōgi, blāk āgirō jāga agala māḍi, ondu sṭenṭ iḍtīvi. Sṭenṭ andre jālari thara irō ondu saṇṇa ṭyūb. Nāḷa matte muchchihōgada hāge adu hiḍkoḷḷutte.
    en: There are two ways. One is angioplasty — through the same wrist we take in a balloon, widen the blocked spot and place a stent. A stent is a small mesh-like tube. It holds the vessel open so it doesn't close up again.
  - who: cardio
    t: ಇನ್ನೊಂದು ಬೈಪಾಸ್ — ಅಂದ್ರೆ ಓಪನ್ ಹಾರ್ಟ್ ಸರ್ಜರಿ. ಎದೆ ತೆಗೆದು, ಕಾಲಿನಿಂದ ಅಥವಾ ಎದೆಯೊಳಗಿಂದ ಬೇರೆ ನಾಳ ತಗೊಂಡು, ಬ್ಲಾಕ್ ಆಗಿರೋ ಜಾಗ ಬಿಟ್ಟು ರಕ್ತಕ್ಕೆ ಹೊಸ ದಾರಿ ಮಾಡ್ತಾರೆ.
    tr: Innondu baipās — andre ōpan hārṭ sarjari. Ede tegedu, kālininda athavā edeyoḷaginda bēre nāḷa tagoṇḍu, blāk āgirō jāga biṭṭu raktakke hosa dāri māḍtāre.
    en: The other is a bypass — open-heart surgery. They open the chest, take another vessel from the leg or from inside the chest, and make the blood a new road around the blocked spot.
  - who: appa
    t: ಯಾವುದು ಒಳ್ಳೇದು ಡಾಕ್ಟ್ರೇ? ನಿಮ್ಮ ಅಮ್ಮ ಆಗಿದ್ರೆ ನೀವು ಏನು ಮಾಡ್ತಿದ್ರಿ?
    tr: Yāvudu oḷḷēdu ḍākṭrē? Nimma amma āgidre nīvu ēnu māḍtidri?
    en: Which is better, Doctor? If she were your mother, what would you do?
  - who: cardio
    t: ಒಳ್ಳೇ ಪ್ರಶ್ನೆ. ಮೂರೂ ನಾಳದಲ್ಲಿ ಜಾಸ್ತಿ ಬ್ಲಾಕ್ ಇದ್ರೆ, ಅಥವಾ ಎಡಗಡೆ ಮುಖ್ಯ ನಾಳದಲ್ಲೇ ಇದ್ರೆ, ನಾನು ಬೈಪಾಸ್ ಹೇಳ್ತಿದ್ದೆ. ಇಲ್ಲಿ ಮುಖ್ಯವಾಗಿ ಒಂದೇ ಕಡೆ ಇದೆ. ಎಪ್ಪತ್ತೊಂಬತ್ತನೇ ವಯಸ್ಸಲ್ಲಿ ಬೈಪಾಸ್ ಆದ್ರೆ ಐಸಿಯು, ಒಂದು ವಾರ ಆಸ್ಪತ್ರೆ, ಎದೆ ಮೂಳೆ ಕೂಡೋಕೆ ಒಂದೆರಡು ತಿಂಗಳು. ಸ್ಟೆಂಟ್ ಆದ್ರೆ ಎರಡು ಮೂರು ದಿನದಲ್ಲಿ ಮನೆಗೆ ಹೋಗಬಹುದು.
    tr: Oḷḷē prashne. Mūrū nāḷadalli jāsti blāk idre, athavā eḍagaḍe mukhya nāḷadallē idre, nānu baipās hēḷtidde. Illi mukhyavāgi ondē kaḍe ide. Eppattombattanē vayassalli baipās ādre aisiyu, ondu vāra āspatre, ede mūḷe kūḍōke onderaḍu tiṅgaḷu. Sṭenṭ ādre eraḍu mūru dinadalli manege hōgabahudu.
    en: Good question. If all three vessels were badly blocked, or the left main vessel itself, I would advise a bypass. Here it's mainly in one place. At seventy-nine, a bypass means ICU, a week in hospital, a month or two for the breastbone to heal. With a stent she could go home in two or three days.
  - who: cardio
    t: ಅದಕ್ಕೇ ನನ್ನ ಅಭಿಪ್ರಾಯದಲ್ಲಿ ಇವರಿಗೆ ಆಂಜಿಯೋಪ್ಲಾಸ್ಟಿನೇ ಸರಿ. ಆದ್ರೆ ನಿರ್ಧಾರ ನಿಮ್ದು — ಮುಖ್ಯವಾಗಿ ಪೇಶಂಟ್‌ದು.
    tr: Adakkē nanna abhiprāyadalli ivarige āñjiyōplāsṭinē sari. Ādre nirdhāra nimdu — mukhyavāgi pēshanṭ-du.
    en: So in my opinion angioplasty is the right choice for her. But the decision is yours — above all, the patient's.
  - who: kiran
    t: ರಿಸ್ಕ್ ಏನೇನಿದೆ? ನೇರವಾಗಿ ಹೇಳಿ ಡಾಕ್ಟ್ರೇ, ನಮಗೆ ಗೊತ್ತಿರ್ಬೇಕು.
    tr: Risk ēnēnide? Nēravāgi hēḷi ḍākṭrē, namage gottirbēku.
    en: What are the risks? Tell us straight, Doctor. We need to know.
  - who: cardio
    t: ಹೇಳ್ತೀನಿ. ಹೆಚ್ಚಿನ ಸಲ ಎಲ್ಲಾ ಸರಿಯಾಗೇ ಆಗುತ್ತೆ, ನಾವು ಇದನ್ನ ದಿನಾ ಮಾಡ್ತೀವಿ. ಆದ್ರೆ ಈ ವಯಸ್ಸಿನಲ್ಲಿ ರಿಸ್ಕ್ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ. ರಕ್ತ ತೆಳು ಮಾಡೋ ಔಷಧಿಯಿಂದ ಬ್ಲೀಡಿಂಗ್ ಆಗಬಹುದು. ಡೈಯಿಂದ ಕಿಡ್ನಿಗೆ ಸ್ವಲ್ಪ ತೊಂದರೆ ಆಗಬಹುದು. ಹೃದಯದ ಬಡಿತ ಏರುಪೇರಾಗಬಹುದು. ತುಂಬಾ ಅಪರೂಪಕ್ಕೆ ಜೀವಕ್ಕೂ ಅಪಾಯ ಆಗಬಹುದು.
    tr: Hēḷtīni. Hechchina sala ellā sariyāgē āgutte, nāvu idanna dinā māḍtīvi. Ādre ī vayassinalli risk swalpa jāsti. Rakta teḷu māḍō auṣadhiyinda blīḍiṅg āgabahudu. Ḍaiyinda kiḍnige swalpa tondare āgabahudu. Hṛdayada baḍita ēru-pērāgabahudu. Tumbā aparūpakke jīvakkū apāya āgabahudu.
    en: I'll tell you. Most of the time everything goes well — we do this every day. But at this age the risk is a little higher. The blood-thinning medicine can cause bleeding. The dye can trouble the kidneys a little. The heartbeat can go irregular. Very rarely, there can be a danger to life.
  - who: amma
    t: ಅಯ್ಯೋ ದೇವ್ರೇ…
    tr: Ayyō dēvrē…
    en: Oh God…
  - who: cardio
    t: ಗಾಬರಿ ಆಗ್ಬೇಡಿ ಅಮ್ಮ. ಏನೂ ಮಾಡದೇ ಇದ್ರೆ ಆ ರಿಸ್ಕ್ ಇನ್ನೂ ಜಾಸ್ತಿ — ಇನ್ನೊಂದು ಅಟ್ಯಾಕ್ ಬರಬಹುದು. ಅದಕ್ಕೇ ಬೇಗ ಮಾಡೋದು ಒಳ್ಳೇದು. ಬೆಳಿಗ್ಗೆ ಒಂಬತ್ತು ಗಂಟೆಗೆ ಕ್ಯಾತ್ ಲ್ಯಾಬ್ ಸಿಗುತ್ತೆ.
    tr: Gābari āgbēḍi amma. Ēnū māḍadē idre ā risk innū jāsti — innondu aṭyāk barabahudu. Adakkē bēga māḍōdu oḷḷēdu. Beḷigge ombattu gaṇṭege kyāt lyāb sigutte.
    en: Don't panic, Amma. If we do nothing, that risk is even higher — another attack could come. That's why it's better to do it soon. The cath lab is free at nine this morning.
  - who: sam
    t: ಡಾಕ್ಟ್ರೇ, ಅಜ್ಜಿಗೆ ಇದೆಲ್ಲಾ ಗೊತ್ತಾ? ಅವರನ್ನೂ ಕೇಳಬೇಕು ಅಲ್ವಾ?
    tr: Ḍākṭrē, ajjige idellā gottā? Avarannū kēḷabēku alvā?
    en: Doctor, does Ajji know all this? She has to be asked too, right?
  - who: cardio
    t: ಖಂಡಿತ. ಪ್ರಜ್ಞೆ ಇರೋ ಪೇಶಂಟ್‌ನ ಒಪ್ಪಿಗೆ ಮೊದಲು. ಐದು ನಿಮಿಷ ಬಿಟ್ಟು ಒಳಗೆ ಬನ್ನಿ, ಅವರ ಮುಂದೇನೇ ಮಾತಾಡೋಣ.
    tr: Khaṇḍita. Prajñe irō pēshanṭ-na oppige modalu. Aidu nimiṣa biṭṭu oḷage banni, avara mundēnē mātāḍōṇa.
    en: Of course. A conscious patient's consent comes first. Come in after five minutes; we'll talk in front of her.
  - scene: The doctor leaves. Amma grips Appa's arm.
  - who: amma
    t: ರೀ, ಅತ್ತೆಗೆ ರಿಸ್ಕ್ ವಿಷಯ ಹೇಳೋದು ಬೇಡ. ಗಾಬರಿ ಆಗ್ತಾರೆ, ಬಿಪಿ ಇನ್ನೂ ಜಾಸ್ತಿ ಆಗುತ್ತೆ.
    tr: Rī, attege risk viṣaya hēḷōdu bēḍa. Gābari āgtāre, bipi innū jāsti āgutte.
    en: Listen, let's not tell your mother about the risks. She'll panic and her BP will go even higher.
  - who: appa
    t: ಇಲ್ಲ ಲಕ್ಷ್ಮೀ. ಅಮ್ಮ ಜೀವನ ಪೂರ್ತಿ ನಮಗೆ ನಿಜಾನೇ ಹೇಳಿದ್ದಾರೆ. ಈಗ ನಾವು ಅವರಿಂದ ಮುಚ್ಚಿಡೋದು ಸರಿ ಅಲ್ಲ.
    tr: Illa Lakshmī�. Amma jīvana pūrti namage nijānē hēḷiddāre. Īga nāvu avarinda muchchiḍōdu sari alla.
    en: No, Lakshmi. All her life Amma has told us the truth. It isn't right for us to hide things from her now.
  - section: ✍️ The consent form
    learn: 'written register (-ಲಾಗಿದೆ, -ತ್ತೇನೆ) vs spoken · signature (sahi) and thumbprint (hebbeṭṭu) · ‘until’: -ōvaregū'
  - scene: The pre-procedure bay. Ajji lies propped up, an oxygen tube in her nose and a cannula in her hand. Dr. Meera holds a bilingual consent form.
  - who: cardio
    t: ಅಜ್ಜಿ, ನಿಮ್ಮ ಹೃದಯದ ಒಂದು ನಾಳದಲ್ಲಿ ಬ್ಲಾಕ್ ಇದೆ. ಬೆಳಿಗ್ಗೆ ಬಲೂನ್ ಹಾಕಿ ಅದನ್ನ ಅಗಲ ಮಾಡಿ, ಒಂದು ಸ್ಟೆಂಟ್ ಇಡ್ತೀವಿ. ಎದೆ ಕುಯ್ಯಲ್ಲ, ಕೈಯಿಂದಾನೇ. ನೀವು ಎಚ್ಚರವಾಗೇ ಇರ್ತೀರಿ. ಸ್ವಲ್ಪ ಚುಚ್ಚುತ್ತೆ ಅಷ್ಟೇ.
    tr: Ajji, nimma hṛdayada ondu nāḷadalli blāk ide. Beḷigge balūn hāki adanna agala māḍi, ondu sṭenṭ iḍtīvi. Ede kuyyalla, kaiyindānē. Nīvu echcharavāgē irtīri. Swalpa chuchchutte aṣṭē.
    en: Ajji, one of your heart's vessels is blocked. In the morning we'll open it with a balloon and put in a stent. We won't cut your chest — it goes in through the hand. You'll stay awake. It'll only prick a little, that's all.
  - who: ajji
    t: ರಿಸ್ಕ್ ಇದೆ ಅಂತ ನನ್ನ ಮಗನ ಮುಖ ನೋಡಿದ್ರೇನೇ ಗೊತ್ತಾಗ್ತಿದೆ ಡಾಕ್ಟ್ರೇ. ಮುಚ್ಚುಮರೆ ಬೇಡ. ಹೇಳಿ.
    tr: Risk ide anta nanna magana mukha nōḍidrēnē gottāgtide ḍākṭrē. Muchchumare bēḍa. Hēḷi.
    en: I can tell there's a risk just from my son's face, Doctor. No hiding things. Tell me.
  - who: cardio
    t: ಈ ವಯಸ್ಸಲ್ಲಿ ರಿಸ್ಕ್ ಸ್ವಲ್ಪ ಜಾಸ್ತಿ ಅಜ್ಜಿ — ಬ್ಲೀಡಿಂಗ್, ಕಿಡ್ನಿ ತೊಂದರೆ, ಅಪರೂಪಕ್ಕೆ ಜೀವಕ್ಕೂ ಅಪಾಯ. ಆದ್ರೆ ಮಾಡದಿದ್ರೆ ಇನ್ನೊಂದು ಅಟ್ಯಾಕ್ ಬರೋ ಸಾಧ್ಯತೆ ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ.
    tr: Ī vayassalli risk swalpa jāsti ajji — blīḍiṅg, kiḍni tondare, aparūpakke jīvakkū apāya. Ādre māḍadidre innondu aṭyāk barō sādhyate adakkinta jāsti.
    en: At this age the risk is a bit higher, Ajji — bleeding, kidney trouble, and rarely a danger to life. But if we don't do it, the chance of another attack is higher than that.
  - who: ajji
    t: ಹಾಗಾದ್ರೆ ಮಾಡಿ. ನನ್ನ ಮೊಮ್ಮಗಳ ಮಗೂನ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ. ಅದನ್ನ ದೇವರಿಗೂ ಹೇಳಿಬಿಟ್ಟಿದೀನಿ.
    tr: Hāgādre māḍi. Nanna mommagaḷa magūna kaiyalli ettikoḷḷōvaregū nānu ellū hōgalla. Adanna dēvarigū hēḷibiṭṭidīni.
    en: Then do it. I'm not going anywhere until I've held my granddaughter's baby in my arms. I've already told God so.
  - who: appa
    t: ‘ಈ ಚಿಕಿತ್ಸೆಯ ಉದ್ದೇಶ, ಸಾಧ್ಯವಿರುವ ಅಪಾಯಗಳು ಮತ್ತು ಪರ್ಯಾಯ ಚಿಕಿತ್ಸೆಗಳನ್ನು ನನಗೆ ನನ್ನ ಭಾಷೆಯಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ. ನಾನು ಸ್ವಇಚ್ಛೆಯಿಂದ ಒಪ್ಪಿಗೆ ನೀಡುತ್ತೇನೆ.’
    tr: ‘Ī chikitseya uddēsha, sādhyaviruva apāyagaḷu mattu paryāya chikitsegaḷannu nanage nanna bhāṣeyalli vivarisalāgide. Nānu sva-ichcheyinda oppige nīḍuttēne.’
    en: (reading the form aloud) ‘The purpose of this treatment, its possible risks and the alternative treatments have been explained to me in my language. I give my consent of my own free will.’
  - who: kiran
    t: ಅಂದ್ರೆ — ‘ಡಾಕ್ಟ್ರು ಎಲ್ಲಾ ಹೇಳಿದ್ರು, ನಮಗೆ ಅರ್ಥ ಆಯ್ತು, ನಾವೇ ಒಪ್ಕೊಂಡ್ವಿ’ ಅಂತ.
    tr: Andre — ‘ḍākṭru ellā hēḷidru, namage artha āytu, nāvē opkoṇḍvi’ anta.
    en: 'Meaning: ‘The doctor told us everything, we understood, and we agreed ourselves.’'
  - who: cardio
    t: ಹೌದು. ಮಾಡ್ತಿರುವಾಗ ಇನ್ನೊಂದು ಸ್ಟೆಂಟ್ ಬೇಕಾದ್ರೆ ಅದಕ್ಕೂ ಈ ಫಾರ್ಮ್‌ನಲ್ಲೇ ಒಪ್ಪಿಗೆ ಇದೆ. ವಯಸ್ಸಿನ ಕಾರಣಕ್ಕೆ ಹೈ-ರಿಸ್ಕ್ ಕನ್ಸೆಂಟ್ ಅಂತ ಇನ್ನೊಂದು ಪುಟ ಕೂಡ ಇದೆ.
    tr: Haudu. Māḍtiruvāga innondu sṭenṭ bēkādre adakkū ī phārm-nallē oppige ide. Vayassina kāraṇakke hai-risk kansenṭ anta innondu puṭa kūḍa ide.
    en: Yes. If a second stent is needed during the procedure, this form covers that too. Because of her age there's also another page, a high-risk consent.
  - who: sam
    t: ಯಾರು ಸೈನ್ ಮಾಡ್ಬೇಕು? ಅಜ್ಜೀನಾ, ಅಂಕಲ್ಲಾ?
    tr: Yāru sain māḍbēku? Ajjīnā, aṅkallā?
    en: Who has to sign? Ajji or Uncle?
  - who: cardio
    t: ಪೇಶಂಟ್‌ಗೆ ಪ್ರಜ್ಞೆ ಇದೆ, ಎಲ್ಲಾ ಅರ್ಥ ಆಗ್ತಿದೆ — ಅದಕ್ಕೇ ಮೊದಲು ಅವರೇ ಸಹಿ ಮಾಡ್ಬೇಕು. ಮಗ ಹತ್ತಿರದ ಸಂಬಂಧಿಕರಾಗಿ ಸಹಿ ಮಾಡ್ತಾರೆ, ಇನ್ನೊಬ್ಬರು ಸಾಕ್ಷಿಯಾಗಿ. ಅಜ್ಜಿ, ಕಷ್ಟ ಆದ್ರೆ ಹೆಬ್ಬೆಟ್ಟು ಒತ್ತಿದ್ರೂ ಸಾಕು.
    tr: Pēshanṭ-ge prajñe ide, ellā artha āgtide — adakkē modalu avarē sahi māḍbēku. Maga hattirada sambandhikarāgi sahi māḍtāre, innobbaru sākṣiyāgi. Ajji, kaṣṭa ādre hebbeṭṭu ottidrū sāku.
    en: The patient is conscious and understands everything, so she signs first. Her son signs as next of kin, and someone else as a witness. Ajji, if it's hard for you, a thumbprint is enough.
  - who: ajji
    t: ಏನು ಹೆಬ್ಬೆಟ್ಟು? ನಾನು ಏಳನೇ ಕ್ಲಾಸ್ ತನಕ ಓದಿದೀನಿ. ಪೆನ್ ಕೊಡಿ. …ಸ-ರ-ಸ್ವ-ತ-ಮ್ಮ. ಆಯ್ತು.
    tr: Ēnu hebbeṭṭu? Nānu ēḷanē klās tanaka ōdidīni. Pen koḍi. …Sa-ra-swa-ta-mma. Āytu.
    en: Thumbprint, indeed! I studied up to seventh standard. Give me the pen. …Sa-ras-wa-tham-ma. Done.
  - who: kiran
    t: ಅಜ್ಜಿ ಸಹಿ ನನ್ನ ಸಹಿಗಿಂತ ಚೆನ್ನಾಗಿದೆ. ನಾನು ಸಾಕ್ಷಿ ಹಾಕ್ತೀನಿ.
    tr: Ajji sahi nanna sahiginta chennāgide. Nānu sākṣi hāktīni.
    en: Ajji's signature is neater than mine. I'll sign as the witness.
  - section: 💰 Costs, cards and schemes
    learn: 'money in lakhs and thousands · hedging: innū spaṣṭa illa, āgabēku · ‘-ಗೋಸ್ಕರ’ (for the sake of) · e-KYC vocabulary: OTP, beraḷaccu'
  - scene: Seven in the morning. While Ajji is being prepared for the cath lab, Appa and Kiran stand at the Arogyamitra scheme desk. Venkatesh, who was on the night shift at registration, is still there, red-eyed, handling a long queue.
  - who: desk
    t: ಓ, ನೀವು ರಾತ್ರಿಯವರು. ಐಪಿ ನಂಬರ್ ಹೇಳಿ… ಸರಸ್ವತಮ್ಮ, ಎಪ್ಪತ್ತೊಂಬತ್ತು. ಆಂಜಿಯೋಪ್ಲಾಸ್ಟಿ ಪ್ಲಾನ್ ಆಗಿದೆ, ಅಲ್ವಾ?
    tr: Ō, nīvu rātriyavaru. Aipi nambar hēḷi… Saraswatamma, eppattombattu. Āñjiyōplāsṭi plān āgide, alvā?
    en: Oh, you're the family from last night. Tell me the IP number… Saraswathamma, seventy-nine. Angioplasty is planned, right?
  - who: appa
    t: ಹೌದು. ಎಷ್ಟು ಖರ್ಚಾಗಬಹುದು ಅಂತ ಒಂದು ಎಸ್ಟಿಮೇಟ್ ಕೊಡ್ತೀರಾ? ನಮ್ಮ ಬ್ಯಾಂಕ್ ಕಲೀಗ್‌ಗೆ ಪ್ರೈವೇಟ್ ಆಸ್ಪತ್ರೇಲಿ ಮೂರು ಲಕ್ಷ ಆಯ್ತಂತೆ.
    tr: Haudu. Eṣṭu kharchāgabahudu anta ondu esṭimēṭ koḍtīrā? Namma byāṅk kalīg-ge praivēṭ āspatrēli mūru lakṣa āytante.
    en: Yes. Could you give us an estimate of what it might cost? Apparently it came to three lakhs for a colleague at my bank, in a private hospital.
  - who: desk
    t: ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ ಎರಡೂವರೆಯಿಂದ ಮೂರೂವರೆ ಲಕ್ಷ ಆಗೋದು ಸಾಮಾನ್ಯ ಸಾರ್. ಇಲ್ಲಿ ಜನರಲ್ ವಾರ್ಡ್‌ನಲ್ಲಿ ಪ್ರೊಸೀಜರ್ ಚಾರ್ಜ್ ಸುಮಾರು ಐವತ್ತೈದು ಸಾವಿರ. ಅದರ ಮೇಲೆ ಸ್ಟೆಂಟ್ — ಅದರ ಬೆಲೆಗೆ ಸರ್ಕಾರ ಮಿತಿ ಹಾಕಿದೆ, ಸುಮಾರು ಮೂವತ್ತು ಸಾವಿರ. ಟೆಸ್ಟ್, ಔಷಧಿ, ಬೆಡ್ ಚಾರ್ಜ್ ಬೇರೆ. ಒಟ್ಟು ಒಂದು ಲಕ್ಷದ ಆಸುಪಾಸಿನಲ್ಲಿ ಮುಗಿಯಬಹುದು.
    tr: Praivēṭ-nalli eraḍūvareyinda mūrūvare lakṣa āgōdu sāmānya sār. Illi janaral vārḍ-nalli prosījar chārj sumāru aivattaidu sāvira. Adara mēle sṭenṭ — adara belege sarkāra miti hākide, sumāru mūvattu sāvira. Ṭesṭ, auṣadhi, beḍ chārj bēre. Oṭṭu ondu lakṣada āsupāsinalli mugiyabahudu.
    en: In a private hospital two and a half to three and a half lakhs is normal, sir. Here, in the general ward, the procedure charge is about fifty-five thousand. On top of that the stent — the government has capped its price, roughly thirty thousand. Tests, medicines and bed charges are extra. Altogether it may come to around one lakh.
  - who: kiran
    t: ಅಪ್ಪ, ಅಜ್ಜಿಗೆ ಎಪ್ಪತ್ತು ದಾಟಿದೆ. ಆಯುಷ್ಮಾನ್ ವಯ ವಂದನಾ ಅಂತ ಸ್ಕೀಮ್ ಇದೆ — ಎಪ್ಪತ್ತು ವರ್ಷ ಮೇಲ್ಪಟ್ಟವರಿಗೆಲ್ಲಾ ವರ್ಷಕ್ಕೆ ಐದು ಲಕ್ಷದವರೆಗೆ ಟ್ರೀಟ್ಮೆಂಟ್ ಫ್ರೀ, ಆದಾಯ ಎಷ್ಟೇ ಇರಲಿ. ಕಳೆದ ವರ್ಷ ನಾನೇ ಹೇಳಿದ್ದೆ, ಕಾರ್ಡ್ ಮಾಡಿಸೋಣ ಅಂತ…
    tr: Appa, ajjige eppattu dāṭide. Āyuṣmān Vaya Vandanā anta skīm ide — eppattu varṣa mēlpaṭṭavarigellā varṣakke aidu lakṣadavarege ṭrīṭmenṭ phrī, ādāya eṣṭē irali. Kaḷeda varṣa nānē hēḷidde, kārḍ māḍisōṇa anta…
    en: Appa, Ajji is over seventy. There's a scheme called Ayushman Vay Vandana — everyone above seventy gets free treatment up to five lakhs a year, whatever their income. I told you last year we should get her the card…
  - who: appa
    t: ಹೌದು… ‘ಆಮೇಲೆ ಮಾಡಿಸೋಣ’ ಅಂತ ಮುಂದೆ ಹಾಕ್ತಾನೇ ಬಂದ್ವಿ. ನನ್ನದೇ ತಪ್ಪು.
    tr: Haudu… ‘āmēle māḍisōṇa’ anta munde hāktānē bandvi. Nannadē tappu.
    en: 'Yes… we kept putting it off: ‘We''ll do it later.’ My own fault.'
  - who: desk
    t: ಪರ್ವಾಗಿಲ್ಲ ಸಾರ್, ತುಂಬಾ ಜನ ಹೀಗೇ ಬರ್ತಾರೆ. ಈಗಲೂ ಮಾಡಬಹುದು. ಅಜ್ಜಿ ಆಧಾರ್‌ಗೆ ಯಾವ ಮೊಬೈಲ್ ಲಿಂಕ್ ಆಗಿದೆ? ಅದಕ್ಕೆ ಓಟಿಪಿ ಬರುತ್ತೆ. ಇಲ್ಲಾಂದ್ರೆ ವಾರ್ಡ್‌ಗೆ ಹೋಗಿ ಅವರ ಬೆರಳಚ್ಚು ತಗೋಬೇಕಾಗುತ್ತೆ. ಈ-ಕೆವೈಸಿ ಆದ್ರೆ ಕಾರ್ಡ್ ಹೆಚ್ಚಾಗಿ ಅವತ್ತೇ ಸಿಗುತ್ತೆ.
    tr: Parvāgilla sār, tumbā jana hīgē bartāre. Īgalū māḍabahudu. Ajji ādhār-ge yāva mobail liṅk āgide? Adakke ōṭipi barutte. Illāndre vārḍ-ge hōgi avara beraḷachchu tagōbēkāgutte. Ī-kevaisi ādre kārḍ hechchāgi avattē sigutte.
    en: Don't worry, sir, lots of people come in just like this. You can still do it now. Which mobile is linked to Ajji's Aadhaar? The OTP comes to that. Otherwise we'd have to go to the ward and take her fingerprint. Once the e-KYC is done, the card usually comes the same day.
  - who: kiran
    t: ಅಪ್ಪನ ನಂಬರ್. ಅಪ್ಪ, ಫೋನ್ ಕೊಡು — ಓಟಿಪಿ ಬಂದ ತಕ್ಷಣ ನಾನು ಹೇಳ್ತೀನಿ.
    tr: Appana nambar. Appa, phōn koḍu — ōṭipi banda takṣaṇa nānu hēḷtīni.
    en: Appa's number. Appa, give me your phone — I'll read out the OTP the moment it comes.
  - who: appa
    t: ಕರ್ನಾಟಕ ಸರ್ಕಾರದ್ದೂ ಒಂದು ಸ್ಕೀಮ್ ಇದೆ ಅಲ್ವಾ — ಆರೋಗ್ಯ ಕರ್ನಾಟಕ? ಆದ್ರೆ ನಮ್ಮ ಹತ್ರ ಬಿಪಿಎಲ್ ಕಾರ್ಡ್ ಇಲ್ಲ.
    tr: Karnāṭaka sarkāraddū ondu skīm ide alvā — Ārōgya Karnāṭaka? Ādre namma hatra bipiel kārḍ illa.
    en: The Karnataka government has a scheme too, doesn't it — Arogya Karnataka? But we don't have a BPL card.
  - who: desk
    t: ಹೌದು ಸಾರ್. ಎಪಿಎಲ್ ಕಾರ್ಡ್ ಇರೋರು ಸಾಮಾನ್ಯವಾಗಿ ಮೂವತ್ತು ಪರ್ಸೆಂಟ್ ಕಟ್ಟಬೇಕು. ಆದ್ರೆ ಕಳೆದ ವರ್ಷದಿಂದ ಎಪ್ಪತ್ತು ದಾಟಿದ ಎಲ್ಲರಿಗೂ ರಾಜ್ಯದ ಸ್ಕೀಮ್ ಕೂಡ ಅನ್ವಯ ಆಗುತ್ತೆ ಅಂತ ಆದೇಶ ಬಂದಿದೆ. ಕೇಂದ್ರದ್ದು, ರಾಜ್ಯದ್ದು — ಎರಡೂ ಹೇಗೆ ಸೇರುತ್ತೆ ಅನ್ನೋದು ನಮಗೂ ಇನ್ನೂ ಪೂರ್ತಿ ಸ್ಪಷ್ಟ ಇಲ್ಲ. ಟ್ರಸ್ಟ್‌ನಿಂದ ಅಪ್ರೂವಲ್ ಬಂದ್ಮೇಲೆ ಗೊತ್ತಾಗುತ್ತೆ. ಒಂದು ಕಾರ್ಡ್ ಸಿಕ್ಕಿದ್ರೆ ಪ್ರೊಸೀಜರ್ ಕವರ್ ಆಗಬೇಕು.
    tr: Haudu sār. Epiel kārḍ irōru sāmānyavāgi mūvattu parsenṭ kaṭṭabēku. Ādre kaḷeda varṣadinda eppattu dāṭida ellarigū rājyada skīm kūḍa anvaya āgutte anta ādēsha bandide. Kēndraddu, rājyaddu — eraḍū hēge sērutte annōdu namagū innū pūrti spaṣṭa illa. Ṭrasṭ-ninda aprūval bandmēle gottāgutte. Ondu kārḍ sikkidre prosījar kavar āgabēku.
    en: Yes, sir. APL card holders normally have to pay thirty percent. But since last year there's been an order that the state scheme also applies to everyone over seventy. How the central one and the state one fit together — honestly, even we aren't fully clear yet. We'll know when approval comes from the Trust. If she gets one card, the procedure should be covered.
  - who: kiran
    t: ಅಂದ್ರೆ ನಾವು ಒಂದು ರೂಪಾಯಿನೂ ಕಟ್ಟೋದು ಬೇಡ್ವಾ?
    tr: Andre nāvu ondu rūpāyinū kaṭṭōdu bēḍvā?
    en: So we don't have to pay a single rupee?
  - who: desk
    t: ಹಾಗೇನಿಲ್ಲ. ಸ್ಕೀಮ್‌ನಲ್ಲಿ ಒಂದು ಪ್ಯಾಕೇಜ್ ಇರುತ್ತೆ. ಅದರಲ್ಲಿ ಸೇರದ ಕೆಲವು ಔಷಧಿ, ಟೆಸ್ಟ್ ನೀವೇ ಕಟ್ಟಬೇಕಾಗಬಹುದು. ಫೈನಲ್ ಲೆಕ್ಕ ಡಿಸ್ಚಾರ್ಜ್ ಟೈಮಲ್ಲಿ. ಅಲ್ಲಿವರೆಗೂ ಎಲ್ಲಾ ರಸೀದಿ ಜೋಪಾನವಾಗಿ ಇಟ್ಕೊಳ್ಳಿ.
    tr: Hāgēnilla. Skīm-nalli ondu pyākēj irutte. Adaralli sērada kelavu auṣadhi, ṭesṭ nīvē kaṭṭabēkāgabahudu. Phainal lekka ḍischārj ṭaimalli. Allivaregū ellā rasīdi jōpānavāgi iṭkoḷḷi.
    en: Not quite. The scheme has a package. You might have to pay for some medicines and tests that aren't in it. The final account comes at discharge. Until then, keep every receipt safe.
  - who: appa
    t: ಸರಿ. ಅಪ್ರೂವಲ್ ಬರೋಷ್ಟರಲ್ಲಿ ಪ್ರೊಸೀಜರ್ ನಿಲ್ಲಿಸಲ್ಲ ತಾನೇ?
    tr: Sari. Aprūval barōṣṭaralli prosījar nillisalla tānē?
    en: All right. They won't hold up the procedure while the approval comes through, will they?
  - who: desk
    t: ಇಲ್ಲ ಸಾರ್, ಇದು ಎಮರ್ಜೆನ್ಸಿ ಕೇಸ್. ಟ್ರೀಟ್ಮೆಂಟ್ ಪೇಪರ್‌ಗೋಸ್ಕರ ಕಾಯಲ್ಲ. ಪೇಪರ್ ನಮ್ಮ ತಲೆನೋವು, ಪೇಶಂಟ್ ಡಾಕ್ಟ್ರದ್ದು. …ಅಯ್ಯೋ, ಪೋರ್ಟಲ್ ಮತ್ತೆ ನಿಧಾನ ಆಯ್ತು. ಒಂದು ಹತ್ತು ನಿಮಿಷ ಕೂತ್ಕೊಳ್ಳಿ, ಓಟಿಪಿ ಬಂದ ತಕ್ಷಣ ಕರೀತೀನಿ.
    tr: Illa sār, idu emarjensi kēs. Ṭrīṭmenṭ pēpar-gōskara kāyalla. Pēpar namma talenōvu, pēshanṭ ḍākṭraddu. …Ayyō, pōrṭal matte nidhāna āytu. Ondu hattu nimiṣa kūtkoḷḷi, ōṭipi banda takṣaṇa karītīni.
    en: No, sir, it's an emergency case. Treatment doesn't wait for paperwork. The paperwork is our headache; the patient is the doctor's. …Oh no, the portal's gone slow again. Sit down for ten minutes or so — I'll call you as soon as the OTP comes.
  - section: ⏳ Outside the cath lab
    learn: 'religious vows: harake hottu · ‘as soon as’: banda takṣaṇa · hearsay -ante on the phone · ‘ಬೇಡ ಕಣೇ’ — loving prohibition'
  - scene: Nine o'clock. The red light above the cath lab door switches on. The family sits on a steel bench in the corridor. Amma holds a small picture of Lord Venkateshwara.
  - who: amma
    t: ಸ್ವಾಮಿ ವೆಂಕಟರಮಣ, ಅತ್ತೆ ಹುಷಾರಾಗಿ ಮನೆಗೆ ಬಂದ್ರೆ ತಿರುಪತಿಗೆ ಬಂದು ಮುಡಿ ಕೊಡ್ತೀನಿ. ಇದು ನನ್ನ ಹರಕೆ.
    tr: Swāmi Veṅkaṭaramaṇa, atte huṣārāgi manege bandre Tirupatige bandu muḍi koḍtīni. Idu nanna harake.
    en: Lord Venkataramana, if my mother-in-law comes home well, I'll come to Tirupati and offer my hair. That is my vow.
  - who: kiran
    t: ಅಮ್ಮ, ಮುಡಿ ಅಂದ್ರೆ… ಪೂರ್ತಿ ತಲೆ ಬೋಳಿಸ್ಕೋತೀಯಾ?
    tr: Amma, muḍi andre… pūrti tale bōḷiskōtīyā?
    en: Amma, offering your hair means… you'll shave your whole head?
  - who: amma
    t: ಅತ್ತೆ ಉಳಿದ್ರೆ ಕೂದಲು ಏನು ಮಹಾ.
    tr: Atte uḷidre kūdalu ēnu mahā.
    en: If your grandmother lives, what's a bit of hair?
  - scene: Sam's phone buzzes. It's Shwetha.
  - who: sam
    t: ಹಲೋ ಶ್ವೇತಾ. ಹೌದು, ಈಗಷ್ಟೇ ಒಳಗೆ ಕರ್ಕೊಂಡ್ ಹೋದ್ರು. ಒಂದು ಗಂಟೆ ಆಗಬಹುದಂತೆ.
    tr: Halō Shwētā. Haudu, īgaṣṭē oḷage karkoṇḍ hōdru. Ondu gaṇṭe āgabahudante.
    en: Hello, Shwetha. Yes, they've just taken her in. Apparently it might take an hour.
  - who: shwe
    t: ನಾನು ಅಲ್ಲಿಗೆ ಬರ್ತೀನಿ ಸ್ಯಾಮ್. ಮನೇಲಿ ಕೂರೋಕೆ ಆಗ್ತಿಲ್ಲ. ರಾತ್ರಿಯೆಲ್ಲಾ ಕಣ್ಣು ಮುಚ್ಚಿಲ್ಲ.
    tr: Nānu allige bartīni Sām. Manēli kūrōke āgtilla. Rātriyellā kaṇṇu muchchilla.
    en: I'm coming over there, Sam. I can't just sit at home. I haven't closed my eyes all night.
  - who: amma
    t: ಫೋನ್ ಕೊಡು ಸ್ಯಾಮ್. …ಶ್ವೇತಾ, ಬೇಡ ಕಣೇ. ಆಸ್ಪತ್ರೇಲಿ ಇನ್ಫೆಕ್ಷನ್, ಜನಜಂಗುಳಿ. ನಿನಗೆ ಏಳನೇ ತಿಂಗಳು. ಹೊಟ್ಟೆ ತುಂಬಾ ತಿಂದು ಮಲಗು — ಅಜ್ಜಿಗೆ ನೀನು ಈಗ ಮಾಡೋ ಸೇವೆ ಅದೇ.
    tr: Phōn koḍu Sām. …Shwētā, bēḍa kaṇē. Āspatrēli inphekṣan, janajaṅguḷi. Ninage ēḷanē tiṅgaḷu. Hoṭṭe tumbā tindu malagu — ajjige nīnu īga māḍō sēve adē.
    en: Give me the phone, Sam. …Shwetha, no, dear. The hospital is full of infections and crowds. You're in your seventh month. Eat properly and lie down — that's the best thing you can do for Ajji right now.
  - who: shwe
    t: ಸರಿಯಮ್ಮ… ಆದ್ರೆ ಪ್ರತಿ ಅರ್ಧ ಗಂಟೆಗೆ ಮೆಸೇಜ್ ಮಾಡ್ಬೇಕು. ಪ್ರದೀಪ್ ಆಫೀಸ್ ಕಾಲ್ ಎಲ್ಲಾ ಕ್ಯಾನ್ಸಲ್ ಮಾಡಿ ನನ್ ಜೊತೆ ಕೂತಿದಾನೆ.
    tr: Sariyamma… ādre prati ardha gaṇṭege mesēj māḍbēku. Pradīp āphīs kāl ellā kyānsal māḍi nan jote kūtidāne.
    en: Okay, Amma… but you have to message me every half hour. Pradeep has cancelled all his office calls and is sitting with me.
  - who: appa
    t: ಒಂದು ಗಂಟೆ ಅಂದ್ರು… ಒಂದೂವರೆ ಆಯ್ತು.
    tr: Ondu gaṇṭe andru… ondūvare āytu.
    en: (staring at the door) They said an hour… it's been an hour and a half.
  - who: kiran
    t: ಅಪ್ಪ, ಲೇಟ್ ಆದ್ರೆ ಏನೋ ತೊಂದರೆ ಅಂತ ಅಲ್ಲ. ಅವ್ರು ನಿಧಾನವಾಗಿ, ಸರಿಯಾಗಿ ಮಾಡ್ತಿರ್ಬಹುದು.
    tr: Appa, lēṭ ādre ēnō tondare anta alla. Avru nidhānavāgi, sariyāgi māḍtirbahudu.
    en: Appa, late doesn't mean something's wrong. They're probably just doing it slowly and carefully.
  - section: ✅ “The vessel is open”
    learn: 'good-news formulas · counterfactual: lēṭ āgidre … irtittu · ‘thanks to’: -inda'
  - scene: The red light goes off. Dr. Meera comes out, pulling down her mask. She is smiling.
  - who: cardio
    t: ರಮೇಶ್ ಅವರೇ? ಪ್ರೊಸೀಜರ್ ಸಕ್ಸಸ್‌ಫುಲ್ ಆಯ್ತು. ಬ್ಲಾಕ್ ಇದ್ದ ಜಾಗದಲ್ಲಿ ಒಂದು ಸ್ಟೆಂಟ್ ಹಾಕಿದ್ವಿ, ಈಗ ರಕ್ತ ಚೆನ್ನಾಗಿ ಹರೀತಿದೆ. ಎರಡನೇ ಸ್ಟೆಂಟ್ ಬೇಕಾಗ್ಲಿಲ್ಲ.
    tr: Ramēsh avarē? Prosījar saksas-phul āytu. Blāk idda jāgadalli ondu sṭenṭ hākidvi, īga rakta chennāgi harītide. Eraḍanē sṭenṭ bēkāglilla.
    en: Ramesh? The procedure was successful. We put one stent where the blockage was, and the blood is flowing well now. A second stent wasn't needed.
  - who: appa
    t: ದೇವರ ದಯೆ… ಡಾಕ್ಟ್ರೇ, ನಿಮಗೆ ಹೇಗೆ ಥ್ಯಾಂಕ್ಸ್ ಹೇಳ್ಬೇಕೋ ಗೊತ್ತಾಗ್ತಿಲ್ಲ.
    tr: Dēvara daye… ḍākṭrē, nimage hēge thyāṅks hēḷbēkō gottāgtilla.
    en: (his voice breaking) By God's grace… Doctor, I don't know how to thank you.
  - who: cardio
    t: ಆ ಸ್ಪೋಕ್ ಆಸ್ಪತ್ರೆಗೂ, ನೂರಾ ಎಂಟು ಆಂಬುಲೆನ್ಸ್‌ಗೂ ಥ್ಯಾಂಕ್ಸ್ ಹೇಳಿ. ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ಇಂಜೆಕ್ಷನ್ ಸಿಕ್ಕಿದ್ದರಿಂದ ಹೃದಯದ ಮಾಂಸಖಂಡಕ್ಕೆ ಜಾಸ್ತಿ ಡ್ಯಾಮೇಜ್ ಆಗಿಲ್ಲ. ಇನ್ನೊಂದೆರಡು ಗಂಟೆ ಲೇಟ್ ಆಗಿದ್ರೆ ಕಥೆನೇ ಬೇರೆ ಇರ್ತಿತ್ತು.
    tr: Ā spōk āspatregū, nūrā eṇṭu āmbulens-gū thyāṅks hēḷi. Samayakke sariyāgi injekṣan sikkiddarinda hṛdayada māṃsakhaṇḍakke jāsti ḍyāmēj āgilla. Innonderaḍu gaṇṭe lēṭ āgidre kathenē bēre irtittu.
    en: Thank the spoke hospital and the 108 ambulance too. Because she got the injection in time, the heart muscle isn't badly damaged. A couple of hours later and it would have been a different story.
  - who: amma
    t: ಈಗ ಎಲ್ಲಿದ್ದಾರೆ? ನೋಡ್ಬಹುದಾ?
    tr: Īga elliddāre? Nōḍbahudā?
    en: Where is she now? Can we see her?
  - who: cardio
    t: ಕಾರ್ಡಿಯಾಕ್ ಐಸಿಯುಗೆ ಶಿಫ್ಟ್ ಮಾಡ್ತಿದ್ದೀವಿ. ಮುಂದಿನ ಇಪ್ಪತ್ನಾಲ್ಕರಿಂದ ನಲವತ್ತೆಂಟು ಗಂಟೆ ತುಂಬಾ ಮುಖ್ಯ. ಮಣಿಕಟ್ಟಿಗೆ ಹಾಕಿರೋ ಬ್ಯಾಂಡ್ ಕೆಲವು ಗಂಟೆ ಬಿಗಿಯಾಗಿರುತ್ತೆ, ಆ ಕೈ ಅಲ್ಲಾಡಿಸಬಾರದು. ಎಲ್ಲಾ ಸರಿ ಇದ್ರೆ ನಾಳೆ ನಾಳಿದ್ದು ವಾರ್ಡ್‌ಗೆ.
    tr: Kārḍiyāk aisiyuge shiphṭ māḍtiddīvi. Mundina ippatnālkarinda nalavatteṇṭu gaṇṭe tumbā mukhya. Maṇikaṭṭige hākirō byāṇḍ kelavu gaṇṭe bigiyāgirutte, ā kai allāḍisabāradu. Ellā sari idre nāḷe nāḷiddu vārḍ-ge.
    en: We're shifting her to the cardiac ICU. The next twenty-four to forty-eight hours are very important. The band on her wrist stays tight for a few hours — she mustn't move that hand. If all goes well, she'll go to the ward tomorrow or the day after.
  - who: kiran
    t: ‘ಸ್ಟೆಂಟ್ ಹಾಕಿದ್ರು, ಸಕ್ಸಸ್ ಅಂತೆ, ಐಸಿಯುಗೆ ಶಿಫ್ಟ್ ಮಾಡ್ತಿದ್ದಾರೆ’ — ಅಕ್ಕಂಗೆ ಕಳ್ಸಿದೆ.
    tr: ‘Sṭenṭ hākidru, saksas ante, aisiyuge shiphṭ māḍtiddāre’ — akkaṅge kaḷside.
    en: ‘They put in a stent, apparently it's a success, they're shifting her to the ICU’ — sent that to Akka.
  - who: sam
    t: ಶ್ವೇತಾ ಅಳ್ತಿದಾಳೆ ಅಂತ ಪ್ರದೀಪ್ ರಿಪ್ಲೈ ಮಾಡಿದ — ಖುಷಿಯಿಂದ.
    tr: Shwētā aḷtidāḷe anta Pradīp riplai māḍida — khuṣiyinda.
    en: Pradeep replied that Shwetha is crying — happy tears.
  - section: 🛏 ICU rules with Sister Rekha
    learn: 'rules and prohibitions: -bāradu, -bēḍi, -bēku · ‘only’: mātra, obbarē · ‘no call means all is well’: -alla andre … anta artha'
  - scene: Afternoon, outside the cardiac ICU. A nurse comes out with a clipboard and a stack of pink passes.
  - who: nurse
    t: ಸರಸ್ವತಮ್ಮ ಅಟೆಂಡರ್ ಯಾರು? ನಾನು ರೇಖಾ, ಇವತ್ತು ಡ್ಯೂಟಿ ಸಿಸ್ಟರ್. ಕೆಲವು ರೂಲ್ಸ್ ಹೇಳ್ತೀನಿ, ಸರಿಯಾಗಿ ಕೇಳಿಸ್ಕೊಳ್ಳಿ.
    tr: Saraswatamma aṭeṇḍar yāru? Nānu Rēkhā, ivattu ḍyūṭi sisṭar. Kelavu rūls hēḷtīni, sariyāgi kēḷiskoḷḷi.
    en: Who is Saraswathamma's attender? I'm Rekha, the duty sister today. I'll tell you a few rules — please listen carefully.
  - who: nurse
    t: ಈ ಪಾಸ್ ಒಬ್ಬ ಅಟೆಂಡರ್‌ಗೆ ಮಾತ್ರ. ಆ ವ್ಯಕ್ತಿ ದಿನ-ರಾತ್ರಿ ಹೊರಗಡೆ ವೇಟಿಂಗ್ ಹಾಲ್‌ನಲ್ಲೇ ಇರ್ಬೇಕು — ಔಷಧಿ ತರೋಕೆ, ಡಾಕ್ಟ್ರು ಕರೆದ್ರೆ ಬರೋಕೆ. ಫೋನ್ ಯಾವಾಗ್ಲೂ ಆನ್ ಇರ್ಲಿ.
    tr: Ī pās obba aṭeṇḍar-ge mātra. Ā vyakti dina-rātri horagaḍe vēṭiṅg hāl-nallē irbēku — auṣadhi tarōke, ḍākṭru karedre barōke. Phōn yāvāglū ān irli.
    en: This pass is for one attender only. That person has to stay in the waiting hall outside, day and night — to fetch medicines, and to come if the doctor calls. Keep your phone on at all times.
  - who: nurse
    t: ವಿಸಿಟಿಂಗ್ ಟೈಮ್ ಬೆಳಿಗ್ಗೆ ಹನ್ನೊಂದರಿಂದ ಹನ್ನೆರಡು, ಸಂಜೆ ಐದರಿಂದ ಆರು. ಒಂದು ಸಲಕ್ಕೆ ಒಬ್ಬರೇ ಒಳಗೆ. ಚಪ್ಪಲಿ ಹೊರಗೆ ಬಿಡಿ, ಕೈಗೆ ಸ್ಯಾನಿಟೈಸರ್ ಹಾಕ್ಕೊಳ್ಳಿ, ಮಾಸ್ಕ್ ಹಾಕ್ಕೊಳ್ಳಿ. ಮಕ್ಕಳನ್ನ, ಬಸುರಿಯರನ್ನ ಕರ್ಕೊಂಡ್ ಬರಬಾರದು.
    tr: Visiṭiṅg ṭaim beḷigge hannondarinda hanneraḍu, sanje aidarinda āru. Ondu salakke obbarē oḷage. Chappali horage biḍi, kaige syāniṭaisar hākkoḷḷi, māsk hākkoḷḷi. Makkaḷanna, basuriyaranna karkoṇḍ barabāradu.
    en: Visiting hours are eleven to twelve in the morning and five to six in the evening. Only one person inside at a time. Leave your footwear outside, sanitise your hands, wear a mask. Don't bring children or pregnant women.
  - who: amma
    t: ಸಿಸ್ಟರ್, ಮನೆಯಿಂದ ಸ್ವಲ್ಪ ಗಂಜಿ ತಂದ್ರೆ ಕೊಡಬಹುದಾ? ಅವರಿಗೆ ಹೊರಗಿನ ಊಟ ಸೇರಲ್ಲ.
    tr: Sisṭar, maneyinda swalpa gañji tandre koḍabahudā? Avarige horagina ūṭa sēralla.
    en: Sister, if I bring a little rice porridge from home, can I give it to her? Outside food doesn't agree with her.
  - who: nurse
    t: ಈಗ ಬೇಡಮ್ಮ. ಐಸಿಯುನಲ್ಲಿ ಡಯಟೀಶಿಯನ್ ಹೇಳಿದ ಊಟ ಮಾತ್ರ — ಉಪ್ಪು ಕಮ್ಮಿ, ಎಣ್ಣೆ ಇಲ್ಲ. ಹೊರಗಿನ ಊಟ ಒಳಗೆ ತರಬಾರದು. ವಾರ್ಡ್‌ಗೆ ಹೋದ್ಮೇಲೆ ಡಾಕ್ಟ್ರನ್ನ ಕೇಳಿ.
    tr: Īga bēḍamma. Aisiyunalli ḍayaṭīshiyan hēḷida ūṭa mātra — uppu kammi, eṇṇe illa. Horagina ūṭa oḷage tarabāradu. Vārḍ-ge hōdmēle ḍākṭranna kēḷi.
    en: Not now, Amma. In the ICU, only the food the dietician prescribes — little salt, no oil. Outside food mustn't be brought in. Ask the doctor once she's in the ward.
  - who: kiran
    t: ಡಾಕ್ಟ್ರ ಹತ್ರ ಯಾವಾಗ ಮಾತಾಡಬಹುದು? ನಮಗೆ ಅಪ್ಡೇಟ್ ಹೇಗೆ ಸಿಗುತ್ತೆ?
    tr: Ḍākṭra hatra yāvāga mātāḍabahudu? Namage apḍēṭ hēge sigutte?
    en: When can we speak to the doctor? How will we get updates?
  - who: nurse
    t: ದಿನಾ ಮಧ್ಯಾಹ್ನ ಮೂರು ಗಂಟೆಗೆ ಕೌನ್ಸೆಲಿಂಗ್ ಟೈಮ್, ಡಾಕ್ಟ್ರು ಅಟೆಂಡರ್ ಜೊತೆ ಮಾತಾಡ್ತಾರೆ. ರಾತ್ರಿ ಏನಾದ್ರೂ ಬದಲಾವಣೆ ಆದ್ರೆ ನಾವೇ ಫೋನ್ ಮಾಡ್ತೀವಿ. ಫೋನ್ ಬರಲಿಲ್ಲ ಅಂದ್ರೆ ಎಲ್ಲಾ ಸರಿ ಇದೆ ಅಂತ ಅರ್ಥ.
    tr: Dinā madhyāhna mūru gaṇṭege kaunseliṅg ṭaim, ḍākṭru aṭeṇḍar jote mātāḍtāre. Rātri ēnādrū badalāvaṇe ādre nāvē phōn māḍtīvi. Phōn baralilla andre ellā sari ide anta artha.
    en: Every day at three in the afternoon there's counselling time — the doctor talks to the attender. If anything changes at night, we'll call you ourselves. If no call comes, it means everything is fine.
  - scene: At five o'clock Rekha lets Amma in for a few minutes. Ajji looks grey and tired, wires everywhere, but her eyes are open.
  - who: amma
    t: ಅತ್ತೆ… ಹೇಗಿದೀರಾ? ನೋವಿದ್ಯಾ?
    tr: Atte… hēgidīrā? Nōvidyā?
    en: Atte… how are you? Are you in pain?
  - who: ajji
    t: ಕೈ ಸ್ವಲ್ಪ ಬಿಗಿ ಅಷ್ಟೇ. ಲಕ್ಷ್ಮೀ, ಬೆಳಿಗ್ಗೆ ತುಳಸಿಗೆ ನೀರು ಹಾಕಿದ್ರಾ ಯಾರಾದ್ರೂ?
    tr: Kai swalpa bigi aṣṭē. Lakshmī�, beḷigge tuḷasige nīru hākidrā yārādrū?
    en: My hand's a bit tight, that's all. Lakshmi, did anyone water the tulsi this morning?
  - who: amma
    t: ಈ ಸ್ಥಿತೀಲೂ ನಿಮಗೆ ತುಳಸಿ ಚಿಂತೆನಾ!
    tr: Ī sthitīlū nimage tuḷasi chintenā!
    en: (laughing through tears) Even in this state, you're worried about the tulsi!
  - who: ajji
    t: ಮನೆ ನಡೀಬೇಕಲ್ವಾ. ಮತ್ತೆ ಶ್ವೇತಾಗೆ ಹೇಳು — ಇಲ್ಲಿಗೆ ಬರಬಾರದು. ಮಗೂಗೆ ಏನೂ ಆಗಬಾರದು.
    tr: Mane naḍībēkalvā. Matte Shwētāge hēḷu — illige barabāradu. Magūge ēnū āgabāradu.
    en: The house has to keep running, doesn't it? And tell Shwetha — she mustn't come here. Nothing must happen to the baby.
  - who: nurse
    t: ಅಮ್ಮಾ, ಸಮಯ ಆಯ್ತು. ಅಜ್ಜಿ ಈಗ ರೆಸ್ಟ್ ಮಾಡ್ಬೇಕು. ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಬನ್ನಿ.
    tr: Ammā, samaya āytu. Ajji īga resṭ māḍbēku. Nāḷe beḷigge banni.
    en: Amma, time's up. Ajji needs to rest now. Come back tomorrow morning.
  - section: 🌙 Night in the waiting hall
    learn: 'regret: -bēkittu (should have) · ‘when’: -iddāga · father and son, softly · ‘I felt like…’: anistu'
  - scene: Eleven at night. The waiting hall smells of phenyl and coffee. Families sleep on mats and newspapers. In a corner, Amma murmurs a prayer with her eyes closed. Appa holds the pink attender pass. Kiran refuses to go home.
  - who: appa
    t: ಕಿರಣ್, ನೀನು ಮನೆಗೆ ಹೋಗು. ನಾಳೆ ನಿಂಗೆ ಕಾಲೇಜ್ ಇದೆ, ಫೈನಲ್ ಇಯರ್.
    tr: Kiraṇ, nīnu manege hōgu. Nāḷe niṅge kālēj ide, phainal iyar.
    en: Kiran, go home. You've got college tomorrow — it's your final year.
  - who: kiran
    t: ಕಾಲೇಜ್ ಒಂದು ದಿನ ಬಿಟ್ರೆ ಏನೂ ಆಗಲ್ಲ ಅಪ್ಪ. ನೀನು ನಿನ್ನೆ ರಾತ್ರಿಯಿಂದ ಕಣ್ಣು ಮುಚ್ಚಿಲ್ಲ.
    tr: Kālēj ondu dina biṭre ēnū āgalla appa. Nīnu ninne rātriyinda kaṇṇu muchchilla.
    en: Nothing will happen if I miss college for one day, Appa. You haven't shut your eyes since last night.
  - who: appa
    t: ಕಳೆದ ತಿಂಗಳು ಅಮ್ಮ ‘ಮೆಟ್ಟಿಲು ಹತ್ತುವಾಗ ಎದೆ ಭಾರ ಆಗುತ್ತೆ’ ಅಂದಿದ್ರು. ನಾನು ‘ವಯಸ್ಸು ಅಮ್ಮ’ ಅಂತ ನಕ್ಕು ಸುಮ್ಮನಾದೆ. ಆಗಲೇ ಒಂದು ಚೆಕಪ್ ಮಾಡಿಸಬೇಕಿತ್ತು.
    tr: Kaḷeda tiṅgaḷu amma ‘meṭṭilu hattuvāga ede bhāra āgutte’ andidru. Nānu ‘vayassu amma’ anta nakku summanāde. Āgalē ondu chekap māḍisabēkittu.
    en: (after a long silence) Last month Amma said, ‘My chest feels heavy when I climb the stairs.’ I laughed — ‘It's age, Amma’ — and left it at that. I should have got her checked up right then.
  - who: kiran
    t: ಡಾಕ್ಟ್ರು ಏನು ಹೇಳಿದ್ರು ನೆನಪಿದ್ಯಾ? ನಿನ್ನನ್ನ ನೀನು ದೂರ್ಕೋಬೇಡ. ಇನ್ಮೇಲೆ ಪ್ರತಿ ಆರು ತಿಂಗಳಿಗೊಂದು ಚೆಕಪ್ — ನಾನೇ ಕರ್ಕೊಂಡ್ ಹೋಗ್ತೀನಿ.
    tr: Ḍākṭru ēnu hēḷidru nenapidyā? Ninnanna nīnu dūrkōbēḍa. Inmēle prati āru tiṅgaḷigondu chekap — nānē karkoṇḍ hōgtīni.
    en: Remember what the doctor said? Don't blame yourself. From now on, a check-up every six months — I'll take her myself.
  - who: appa
    t: ನೀನು ಯಾವಾಗ ಇಷ್ಟು ದೊಡ್ಡವನಾದೆ? ಒಂದು ವರ್ಷದ ಹಿಂದೆ ಕ್ರಿಕೆಟ್ ಬಿಟ್ರೆ ನಿಂಗೆ ಬೇರೆ ಏನೂ ಗೊತ್ತಿರ್ಲಿಲ್ಲ.
    tr: Nīnu yāvāga iṣṭu doḍḍavanāde? Ondu varṣada hinde krikeṭ biṭre niṅge bēre ēnū gottirlilla.
    en: When did you grow up this much? A year ago you knew nothing except cricket.
  - who: kiran
    t: ಅಕ್ಕ ಮದುವೆ ಆಗಿ ಹೋದ್ಮೇಲೆ ಮನೇಲಿ ಯಾರಾದ್ರೂ ದೊಡ್ಡವರಾಗ್ಬೇಕಲ್ವಾ.
    tr: Akka maduve āgi hōdmēle manēli yārādrū doḍḍavarāgbēkalvā.
    en: Once Akka got married and left, someone at home had to grow up, didn't they?
  - who: appa
    t: ನಿಜ ಹೇಳ್ಲಾ? ನಿನ್ನೆ ರಾತ್ರಿ ಆಂಬುಲೆನ್ಸ್‌ನಲ್ಲಿ ಅಮ್ಮನ ಕೈ ಹಿಡ್ಕೊಂಡಿದ್ದಾಗ, ನಾನು ಐವತ್ತೇಳು ವರ್ಷದವನಲ್ಲ, ಐದು ವರ್ಷದ ಹುಡುಗ ಅನ್ನಿಸ್ತು.
    tr: Nija hēḷlā? Ninne rātri āmbulens-nalli ammana kai hiḍkoṇḍiddāga, nānu aivattēḷu varṣadavanalla, aidu varṣada huḍuga annistu.
    en: Shall I tell you the truth? Last night in the ambulance, holding Amma's hand, I didn't feel fifty-seven. I felt like a five-year-old boy.
  - scene: Sam arrives with a steel tiffin carrier and a flask.
  - who: sam
    t: ಊಟ ಬಂತು! ವಿಮಲಾ ಆಂಟಿ ಚಿತ್ರಾನ್ನ, ಮೊಸರನ್ನ ಕಳ್ಸಿದ್ದಾರೆ, ಫ್ಲಾಸ್ಕ್‌ನಲ್ಲಿ ಕಾಫಿ. ‘ಯಾರೂ ಉಪವಾಸ ಇರಬಾರದು’ ಅಂತ ಸ್ಟ್ರಿಕ್ಟ್ ಆರ್ಡರ್.
    tr: Ūṭa bantu! Vimalā ānṭi chitrānna, mosaranna kaḷsiddāre, phlāsk-nalli kāphi. ‘Yārū upavāsa irabāradu’ anta sṭrikṭ ārḍar.
    en: 'Food''s here! Vimala Aunty has sent lemon rice and curd rice, and coffee in the flask. Strict orders: ‘Nobody is to go hungry.’'
  - who: amma
    t: ವಿಮಲಾ… ಅವಳ ಬಾಯಿ ಜಾಸ್ತಿ, ಆದ್ರೆ ಕಷ್ಟ ಬಂದಾಗ ಮೊದಲು ಬಾಗಿಲಿಗೆ ಬರೋದು ಅವಳೇ.
    tr: Vimalā… avaḷa bāyi jāsti, ādre kaṣṭa bandāga modalu bāgilige barōdu avaḷē.
    en: Vimala… she talks too much, but when trouble comes, she's the first one at the door.
  - who: appa
    t: ನನಗೆ ಹಸಿವಿಲ್ಲ ಸ್ಯಾಮ್.
    tr: Nanage hasivilla Sām.
    en: I'm not hungry, Sam.
  - who: sam
    t: ಅಂಕಲ್, ನಾನು ಬಂದ ಮೊದಲನೇ ವಾರ ನೀವೇ ನನಗೆ ಹೇಳಿದ್ರಿ — ‘ಹೊಟ್ಟೆ ಖಾಲಿ ಇದ್ರೆ ತಲೆ ಕೆಲಸ ಮಾಡಲ್ಲ.’ ಈಗ ನಾನು ಹೇಳ್ತಿದೀನಿ. ಸ್ವಲ್ಪ ತಿನ್ನಿ.
    tr: Aṅkal, nānu banda modalanē vāra nīvē nanage hēḷidri — ‘hoṭṭe khāli idre tale kelasa māḍalla.’ Īga nānu hēḷtidīni. Swalpa tinni.
    en: 'Uncle, in my very first week here you told me yourself: ‘An empty stomach means an empty head.’ Now I''m telling you. Eat a little.'
  - who: appa
    t: ನನ್ನ ಮಾತು ನನಗೇ ವಾಪಸ್! ಸರಿ, ಕೊಡು.
    tr: Nanna mātu nanagē vāpas! Sari, koḍu.
    en: (smiling for the first time) My own words thrown back at me! All right, give it here.
  - who: sam
    t: ನಮ್ ಊರಲ್ಲಿ ಮನೆಯವರು ಹೀಗೆ ರಾತ್ರಿಯೆಲ್ಲಾ ಆಸ್ಪತ್ರೇಲಿ ಕಾಯಲ್ಲ — ನರ್ಸ್‌ಗಳೇ ಎಲ್ಲಾ ನೋಡ್ಕೋತಾರೆ. ಆದ್ರೆ ಇಲ್ಲಿ ಹೀಗೆ ನೆಲದ ಮೇಲೆ ಎಲ್ಲಾ ಒಟ್ಟಿಗೆ ಕೂತಿರೋದ್ರಲ್ಲಿ… ಏನೋ ಒಂಥರಾ ಶಕ್ತಿ ಇದೆ.
    tr: Nam ūralli maneyavaru hīge rātriyellā āspatrēli kāyalla — nars-gaḷē ellā nōḍkōtāre. Ādre illi hīge nelada mēle ellā oṭṭige kūtirōdralli… ēnō onthara shakti ide.
    en: Back home, families don't wait in the hospital all night like this — the nurses take care of everything. But all of us sitting together on the floor like this… there's a kind of strength in it.
  - who: kiran
    t: ಶಕ್ತಿ ಜೊತೆಗೆ ಸೊಳ್ಳೆನೂ ಇದೆ.
    tr: Śakti jotege soḷḷenū ide.
    en: There are mosquitoes along with the strength, too.
  - section: 🤝 Sumitra comes
    learn: 'a real apology: -bāradittu (shouldn''t have) · admitting one''s own part · forgiving: kṣamisu · in-law words: bīgaru, bīgitti · dropping ‘avrē’ as a sign of closeness'
  - scene: 'Next morning, half past ten. A familiar voice in the corridor: Sumitra, Pradeep''s mother, with two steel boxes in a cloth bag. Shankar follows with a flask. Amma straightens up, her face polite and closed.'
  - who: sumitra
    t: ಲಕ್ಷ್ಮಿ ಅವ್ರೇ… ರಾತ್ರಿ ಪ್ರದೀಪ್ ಹೇಳಿದ ತಕ್ಷಣ ಬರಬೇಕು ಅನ್ಕೊಂಡೆ, ಆದ್ರೆ ಐಸಿಯು ಹತ್ರ ಜನ ಜಾಸ್ತಿ ಆಗಬಾರದು ಅಂತ ಸುಮ್ಮನಾದೆ. ಅಜ್ಜಿ ಹೇಗಿದ್ದಾರೆ?
    tr: Lakshmī avrē… rātri Pradīp hēḷida takṣaṇa barabēku ankoṇḍe, ādre aisiyu hatra jana jāsti āgabāradu anta summanāde. Ajji hēgiddāre?
    en: Lakshmi… I wanted to come the moment Pradeep told us last night, but I held back so there wouldn't be a crowd near the ICU. How is Ajji?
  - who: amma
    t: ಸ್ಟೆಂಟ್ ಹಾಕಿದ್ದಾರೆ. ಇನ್ನೂ ಐಸಿಯುನಲ್ಲೇ ಇದ್ದಾರೆ, ಈಗ ಪರ್ವಾಗಿಲ್ಲ. ಬನ್ನಿ, ಕೂತ್ಕೊಳ್ಳಿ.
    tr: Sṭenṭ hākiddāre. Innū aisiyunallē iddāre, īga parvāgilla. Banni, kūtkoḷḷi.
    en: They've put in a stent. She's still in the ICU, but she's all right now. Come, sit down.
  - who: shankar
    t: ರಮೇಶ್ ಅವರೇ, ದುಡ್ಡು ಬೇಕಾದ್ರೂ, ಓಡಾಡೋಕೆ ಜನ ಬೇಕಾದ್ರೂ — ಸಂಕೋಚ ಮಾಡ್ಕೋಬೇಡಿ. ನಾವು ಬೀಗರು, ಬೇರೆಯವರಲ್ಲ.
    tr: Ramēsh avarē, duḍḍu bēkādrū, ōḍāḍōke jana bēkādrū — saṅkōcha māḍkōbēḍi. Nāvu bīgaru, bēreyavaralla.
    en: Ramesh, whether you need money or someone to run around — don't hesitate. We're family by marriage, not outsiders.
  - who: appa
    t: ಥ್ಯಾಂಕ್ಸ್ ಶಂಕರ್ ಅವರೇ. ಬನ್ನಿ, ಕ್ಯಾಂಟೀನ್‌ನಲ್ಲಿ ಒಂದು ಕಾಫಿ ಕುಡಿಯೋಣ.
    tr: Thyāṅks Shaṅkar avarē. Banni, kyānṭīn-nalli ondu kāphi kuḍiyōṇa.
    en: Thank you, Shankar. Come, let's have a coffee in the canteen.
  - scene: Appa leads Shankar away. Sumitra and Amma are left alone on the steel bench. A long silence.
  - who: sumitra
    t: ಲಕ್ಷ್ಮಿ ಅವ್ರೇ, ನಾನು ಇವತ್ತು ಇಡ್ಲಿ ಕೊಡೋಕೆ ಮಾತ್ರ ಬಂದಿಲ್ಲ. ಒಂದು ವರ್ಷದಿಂದ ಒಂದು ಮಾತು ಗಂಟಲಲ್ಲಿ ಸಿಕ್ಕಿಹಾಕ್ಕೊಂಡಿದೆ.
    tr: Lakshmī avrē, nānu ivattu iḍli koḍōke mātra bandilla. Ondu varṣadinda ondu mātu gaṇṭalalli sikkihākkoṇḍide.
    en: Lakshmi, I haven't come today just to bring idlis. For a year now, something has been stuck in my throat.
  - who: amma
    t: ಈಗ ಅದೆಲ್ಲಾ ಯಾಕೆ, ಬಿಡಿ…
    tr: Īga adellā yāke, biḍi…
    en: Why bring all that up now, let it go…
  - who: sumitra
    t: ಇಲ್ಲ, ಹೇಳ್ಲೇಬೇಕು. ಆ ದಿನ ನಿಮ್ಮ ಮನೇಲಿ ಕೂತು ಚಿನ್ನ, ಛತ್ರ, ಕಾರು ಅಂತ ಪಟ್ಟಿ ಕೊಟ್ಟೆ. ‘ಹೆಣ್ಣುಮಕ್ಕಳನ್ನ ಜಾಸ್ತಿ ಓದಿಸಿದ್ರೆ ನಾಲಿಗೆ ಉದ್ದ ಆಗುತ್ತೆ’ ಅಂದೆ — ನಿಮ್ಮ ಮಗಳ ಬಗ್ಗೆ, ನಿಮ್ಮ ಮುಂದೇನೇ. ನಾನು ಹಾಗೆ ಮಾತಾಡಬಾರದಿತ್ತು.
    tr: Illa, hēḷlēbēku. Ā dina nimma manēli kūtu chinna, chatra, kāru anta paṭṭi koṭṭe. ‘Heṇṇumakkaḷanna jāsti ōdisidre nālige udda āgutte’ ande — nimma magaḷa bagge, nimma mundēnē. Nānu hāge mātāḍabāradittu.
    en: No, I have to say it. That day I sat in your house and handed you a list — gold, a hall, a car. I said, ‘If you educate girls too much, their tongues grow long’ — about your daughter, right in front of you. I should never have spoken like that.
  - who: amma
    t: ಆ ಮಾತು… ತುಂಬಾ ದಿನ ನನ್ನ ಕಿವೀಲಿ ಕೇಳ್ತಾನೇ ಇತ್ತು.
    tr: Ā mātu… tumbā dina nanna kivīli kēḷtānē ittu.
    en: (quietly) Those words… kept ringing in my ears for a long time.
  - who: sumitra
    t: ಗೊತ್ತು. ನನ್ನ ಕಿವೀಲೂ. ಜನವರೀಲಿ ನನಗೆ ಡೆಂಗ್ಯೂ ಬಂದಾಗ ರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ ನನ್ನನ್ನ ಆಸ್ಪತ್ರೆಗೆ ಕರ್ಕೊಂಡ್ ಹೋಗಿದ್ದು ಶ್ವೇತಾ. ಡಾಕ್ಟ್ರ ಜೊತೆ ವಾದ ಮಾಡಿ, ಇನ್ಶೂರೆನ್ಸ್ ಪೇಪರ್ ಎಲ್ಲಾ ಮಾಡಿದ್ದು ಅವಳು. ಆ ‘ಉದ್ದ ನಾಲಿಗೆ’ ಇಲ್ಲದಿದ್ರೆ ಅವತ್ತು ನನ್ನ ಕಥೆ ಏನಾಗ್ತಿತ್ತೋ.
    tr: Gottu. Nanna kivīlū. Janavarīli nanage ḍeṅgyū bandāga rātri eraḍu gaṇṭege nannanna āspatrege karkoṇḍ hōgiddu Shwētā. Ḍākṭra jote vāda māḍi, inshūrens pēpar ellā māḍiddu avaḷu. Ā ‘udda nālige’ illadidre avattu nanna kathe ēnāgtittō.
    en: I know. In mine too. In January, when I had dengue, it was Shwetha who took me to hospital at two in the morning. She argued with the doctors and did all the insurance papers. Without that ‘long tongue’, who knows what would have happened to me that night.
  - who: sumitra
    t: ನನ್ನ ಅಪ್ಪ ನನ್ನನ್ನ ಎಂಟನೇ ಕ್ಲಾಸಿಗೇ ಶಾಲೆ ಬಿಡಿಸಿದ್ರು. ನನಗೆ ಸಿಗದಿದ್ದು ಬೇರೆ ಹುಡುಗೀರಿಗೆ ಸಿಕ್ಕಿದಾಗ… ಒಳಗೊಳಗೆ ಹೊಟ್ಟೆಕಿಚ್ಚು ಆಗ್ತಿತ್ತು ಅನ್ಸುತ್ತೆ. ಅದಕ್ಕೆ ‘ಸಂಪ್ರದಾಯ’ ಅಂತ ಹೆಸರು ಇಟ್ಟೆ.
    tr: Nanna appa nannanna eṇṭanē klāsigē shāle biḍisidru. Nanage sigadiddu bēre huḍugīrige sikkidāga… oḷagoḷage hoṭṭekichchu āgtittu ansutte. Adakke ‘sampradāya’ anta hesaru iṭṭe.
    en: My father took me out of school in eighth standard. When other girls got what I never had… I think, deep inside, I felt jealous. And I gave that feeling the name ‘tradition’.
  - who: amma
    t: ಸುಮಿತ್ರ ಅವ್ರೇ… ಆ ದಿನ ನಾನೂ ಸರಿ ಇರ್ಲಿಲ್ಲ. ಶ್ವೇತಾ ಮಾತಾಡಿದಾಗ ನಾನೇ ‘ಸಾಕು’ ಅಂತ ಅವಳ ಬಾಯಿ ಮುಚ್ಚಿಸೋಕೆ ನೋಡಿದೆ. ಜನ ಏನು ಅನ್ಕೊಳ್ತಾರೋ ಅನ್ನೋ ಭಯ. ನಿಮ್ಮಷ್ಟೇ ನಾನೂ ಆ ಪದ್ಧತಿಗೆ ತಲೆ ಬಾಗಿಸಿದ್ದೆ.
    tr: Sumitra avrē… ā dina nānū sari irlilla. Shwētā mātāḍidāga nānē ‘sāku’ anta avaḷa bāyi muchchisōke nōḍide. Jana ēnu ankoḷtārō annō bhaya. Nimmaṣṭē nānū ā paddhatige tale bāgisidde.
    en: Sumitra… I wasn't right that day either. When Shwetha spoke up, I was the one who tried to shut her up — ‘That's enough!’ Fear of what people would say. I had bowed my head to that custom just as much as you.
  - who: sumitra
    t: ಅಂದ್ರೆ… ನನ್ನನ್ನ ಕ್ಷಮಿಸ್ತೀರಾ?
    tr: Andre… nannanna kṣamistīrā?
    en: So… will you forgive me?
  - who: amma
    t: ಕ್ಷಮೆ ಕೇಳೋದು ಸುಲಭ ಅಲ್ಲ. ನೀವು ಕೇಳಿದ್ರಿ, ನನಗೆ ಅಷ್ಟು ಸಾಕು. ಇನ್ಮೇಲೆ ಈ ‘ಅವ್ರೇ’ ಬೇಡ. ಲಕ್ಷ್ಮಿ ಅಂತ ಕರೀರಿ.
    tr: Kṣame kēḷōdu sulabha alla. Nīvu kēḷidri, nanage aṣṭu sāku. Inmēle ī ‘avrē’ bēḍa. Lakshmī anta karīri.
    en: (taking her hand) Asking for forgiveness isn't easy. You asked — that's enough for me. And from now on, no more of this ‘avre’. Just call me Lakshmi.
  - who: sumitra
    t: ಹಾಗಾದ್ರೆ ನೀವೂ ಬರೀ ‘ಸುಮಿತ್ರ’ ಅನ್ನಿ. …ಇನ್ನೊಂದು ವಿಷಯ. ಅಜ್ಜಿ ಮನೆಗೆ ಬರೋವರೆಗೂ ನೀವು ಇಲ್ಲೇ ಇರ್ಬೇಕಾಗುತ್ತೆ. ಪ್ರದೀಪ್‌ಗೆ ರಾತ್ರಿ ಅಮೆರಿಕಾ ಮೀಟಿಂಗ್ ಇರುತ್ತೆ, ಶ್ವೇತಾ ಒಬ್ಳೇ ಇರಬಾರದು. ಅವಳು ಹೂಂ ಅಂದ್ರೆ, ಈ ವಾರ ನಾನು ಅವರ ಮನೇಲೇ ಇದ್ದು ಅವಳಿಗೆ ಅಡುಗೆ ಮಾಡ್ತೀನಿ.
    tr: Hāgādre nīvū barī ‘Sumitra’ anni. …Innondu viṣaya. Ajji manege barōvaregū nīvu illē irbēkāgutte. Pradīp-ge rātri Amerikā mīṭiṅg irutte, Shwētā obḷē irabāradu. Avaḷu hūṃ andre, ī vāra nānu avara manēlē iddu avaḷige aḍuge māḍtīni.
    en: Then you just say ‘Sumitra’ too. …One more thing. Until Ajji comes home, you'll have to be here. Pradeep has America meetings at night, and Shwetha shouldn't be alone. If she agrees, I'll stay at their place this week and cook for her.
  - who: amma
    t: ಅದಕ್ಕಿಂತ ದೊಡ್ಡ ಉಪಕಾರ ಬೇರೆ ಇಲ್ಲ. ಆದ್ರೆ ಎಚ್ಚರ — ಏಳನೇ ತಿಂಗಳು, ಅವಳಿಗೆ ಈಗ ಹುಳಿ ಜಾಸ್ತಿ ಬೇಕು!
    tr: Adakkinta doḍḍa upakāra bēre illa. Ādre echchara — ēḷanē tiṅgaḷu, avaḷige īga huḷi jāsti bēku!
    en: (eyes filling) There's no bigger favour than that. But be warned — seventh month, she wants everything sour right now!
  - who: sumitra
    t: ಗೊತ್ತು ಗೊತ್ತು. ಮಾವಿನಕಾಯಿ ಚಿತ್ರಾನ್ನ ಆಗಲೇ ಆರ್ಡರ್ ಮಾಡಿದ್ದಾಳೆ.
    tr: Gottu gottu. Māvinakāyi chitrānna āgalē ārḍar māḍiddāḷe.
    en: (laughing) I know, I know. She's already ordered raw-mango rice.
  - scene: Amma opens her handbag and takes out a small paper packet of kumkum from the temple.
  - who: amma
    t: ಆ ದಿನ ನೀವು ಅರಿಶಿನ ಕುಂಕುಮ ತಗೊಳ್ಳದೇ ಹೋದ್ರಿ. ಆಸ್ಪತ್ರೇಲಿ ನನ್ನ ಹತ್ರ ಇರೋದು ಇದೊಂದೇ — ದೇವಸ್ಥಾನದ ಪ್ರಸಾದದ ಕುಂಕುಮ. ತಗೊಳ್ಳಿ.
    tr: Ā dina nīvu arishina kuṅkuma tagoḷḷadē hōdri. Āspatrēli nanna hatra irōdu idondē — dēvasthānada prasādada kuṅkuma. Tagoḷḷi.
    en: That day you left without taking the turmeric and kumkum. In the hospital this is all I have — kumkum from the temple. Please take it.
  - who: sumitra
    t: ಈ ಸಲ ‘ಇರ್ಲಿ, ಇರ್ಲಿ’ ಅನ್ನಲ್ಲ.
    tr: Ī sala ‘irli, irli’ annalla.
    en: (touching it to her forehead) This time I won't say ‘never mind, never mind’.
  - who: nurse
    t: ಸರಸ್ವತಮ್ಮ ಕಡೆಯವರು! ವಿಸಿಟಿಂಗ್ ಟೈಮ್ ಶುರು ಆಯ್ತು. ಒಬ್ಬರು ಬನ್ನಿ — ಮತ್ತೆ ಊಟದ ಡಬ್ಬಿ ಇಲ್ಲೇ ಬಿಟ್ಟು ಬನ್ನಿ.
    tr: Saraswatamma kaḍeyavaru! Visiṭiṅg ṭaim shuru āytu. Obbaru banni — matte ūṭada ḍabbi illē biṭṭu banni.
    en: Saraswathamma's family! Visiting time has started. One person, come — and leave the food boxes out here.
  - who: amma
    t: ಸುಮಿತ್ರ, ನೀವೇ ಹೋಗಿ. ಅತ್ತೆ ಕೋಪ ಇಟ್ಕೊಳ್ಳೋರಲ್ಲ. ಮರಿಮಗೂ ವಿಷಯ ಮಾತಾಡಿ — ಅವರಿಗೆ ಅದೇ ದೊಡ್ಡ ಔಷಧಿ.
    tr: Sumitra, nīvē hōgi. Atte kōpa iṭkoḷḷōralla. Marimagū viṣaya mātāḍi — avarige adē doḍḍa auṣadhi.
    en: Sumitra, you go. My mother-in-law doesn't hold grudges. Talk to her about the great-grandchild — that's the best medicine for her.
  - scene: Inside the ICU, Ajji turns her head on the pillow and sees Sumitra standing at the foot of the bed, hands empty, mask on.
  - who: ajji
    t: ಬಾಮ್ಮ ಸುಮಿತ್ರ. ಬರೀ ಕೈಯಲ್ಲಿ ಬಂದ್ಯಾ? ಒಳ್ಳೇದು. ನಮ್ಮ ಮನೆಗೆ ಹಾಗೇ ಬರಬೇಕು — ಮನಸ್ಸು ತುಂಬಿದ್ರೆ ಸಾಕು.
    tr: Bāmma Sumitra. Barī kaiyalli bandyā? Oḷḷēdu. Namma manege hāgē barabēku — manassu tumbidre sāku.
    en: Come, Sumitra. You've come empty-handed? Good. That's how one should come to our family — a full heart is enough.
  - who: sumitra
    t: ಅಮ್ಮ… ಆ ದಿನದ್ದಕ್ಕೆ…
    tr: Amma… ā dinaddakke…
    en: Amma… about that day…
  - who: ajji
    t: ಗೊತ್ತು. ಗಾಜಿನ ಆಚೆ ಲಕ್ಷ್ಮಿ ಮುಖ ನೋಡಿದ್ರೇನೇ ಗೊತ್ತಾಯ್ತು. ಹಳೇದನ್ನ ಇಲ್ಲೇ ಬಿಟ್ಬಿಡೋಣ. ನಾನು ಇನ್ನೂ ನೋಡೋದು ತುಂಬಾ ಇದೆ — ಒಂದು ಸೀಮಂತ, ಒಂದು ತೊಟ್ಟಿಲು.
    tr: Gottu. Gājina āche Lakshmī mukha nōḍidrēnē gottāytu. Haḷēdanna illē biṭbiḍōṇa. Nānu innū nōḍōdu tumbā ide — ondu sīmanta, ondu toṭṭilu.
    en: I know. I could tell just from Lakshmi's face through the glass. Let's leave the old things here. I still have a lot to see — a seemantha, and a cradle.
  - chapter: Chapter 4 — Discharge and a new routine
  - section: 🛏️ From the ICU to the ward
    learn: 'dative experiencer: nanage hasivu āgtide · ‑iddāga (when … was) · ‑aṣṭaralli (by the time / meanwhile) · prohibitions ‑bēḍi · ‑bahudu (may)'
  - scene: Day four at Jayadeva. Ajji has been moved out of the ICU into the general ward. Morning rounds are over, and nurse Rekha is checking her drip.
  - who: nurse
    t: ಅಜ್ಜಿ, ಇವತ್ತು ಹೇಗಿದ್ದೀರಾ? ರಾತ್ರಿ ನಿದ್ದೆ ಬಂತಾ?
    tr: Ajji, ivattu hēgiddīrā? Rātri nidde bantā?
    en: How are you today, Ajji? Did you get any sleep last night?
  - who: ajji
    t: ಐಸಿಯುನಲ್ಲಿ ಎಲ್ಲಿ ನಿದ್ದೆ ಬರುತ್ತೆ ಸಿಸ್ಟರ್? ರಾತ್ರಿ ಇಡೀ ಮೆಷೀನ್‌ಗಳು ಬೀಪ್ ಬೀಪ್ ಅಂತಿದ್ವು. ಇಲ್ಲಿ ವಾರ್ಡ್‌ನಲ್ಲಿ ಪರ್ವಾಗಿಲ್ಲ, ಒಂದು ಕಿಟಕಿ ಆದ್ರೂ ಇದೆ.
    tr: ICU-nalli elli nidde barutte sisṭar? Rātri iḍī meṣīngaḷu bīp bīp antidvu. Illi vārḍnalli parvāgilla, ondu kiṭaki ādrū ide.
    en: Who can sleep in the ICU, Sister? The machines went beep-beep all night. Here in the ward it's better — at least there's a window.
  - who: nurse
    t: ಮೂರು ದಿನ ಐಸಿಯುನಲ್ಲಿ ಇದ್ರಿ, ಈಗ ಎಲ್ಲಾ ರಿಪೋರ್ಟ್ ಚೆನ್ನಾಗಿವೆ. ಮಣಿಕಟ್ಟು ತೋರಿಸಿ, ಸ್ಟೆಂಟ್ ಹಾಕಿದ ಜಾಗ ನೋಡ್ತೀನಿ. ಊತ ಇಲ್ಲ, ರಕ್ತ ಬಂದಿಲ್ಲ — ಒಳ್ಳೇದು.
    tr: Mūru dina ICU-nalli idri, īga ellā ripōrṭ chennāgive. Maṇikaṭṭu tōrisi, sṭeṇṭ hākida jāga nōḍtīni. Ūta illa, rakta bandilla — oḷḷēdu.
    en: You were three days in the ICU; now all the reports look good. Show me your wrist, I'll check where they put the stent in. No swelling, no bleeding — good.
  - who: ajji
    t: ನನಗೆ ಹಸಿವಾಗ್ತಿದೆ ಸಿಸ್ಟರ್. ಒಂದು ಲೋಟ ಸ್ಟ್ರಾಂಗ್ ಕಾಫಿ ಸಿಗುತ್ತಾ?
    tr: Nanage hasivāgtide sisṭar. Ondu lōṭa sṭrāṅg kāphi siguttā?
    en: I'm hungry, Sister. Can I get a glass of strong coffee?
  - who: nurse
    t: ಕಾಫಿ ಈಗ ಬೇಡ ಅಜ್ಜಿ. ಡಯಟೀಷಿಯನ್ ಹೇಳಿರೋ ಹಾಗೆ ಗಂಜಿ ಬರುತ್ತೆ. ಕಾಫಿ ಬಗ್ಗೆ ಡಾಕ್ಟ್ರ ಹತ್ರಾನೇ ಕೇಳಿ.
    tr: Kāphi īga bēḍa ajji. Ḍayaṭīṣiyan hēḷirō hāge ganji barutte. Kāphi bagge ḍākṭra hatrānē kēḷi.
    en: No coffee for now, Ajji. Rice gruel is coming, as the dietician ordered. Ask the doctor herself about coffee.
  - who: amma
    t: ನೋಡಿದ್ರಾ ಸಿಸ್ಟರ್? ಸ್ವಲ್ಪ ಹುಷಾರಾಗ್ತಿದ್ದ ಹಾಗೇ ಅತ್ತೆಗೆ ಕಾಫಿ ನೆನಪಾಯ್ತು.
    tr: Nōḍidrā sisṭar? Svalpa huṣārāgtidda hāgē attege kāphi nenapāytu.
    en: See, Sister? The moment she feels a little better, my mother-in-law remembers her coffee.
  - who: ajji
    t: ಕಾಫಿ ಅಲ್ಲ ಕಣೇ ಮುಖ್ಯ. ಶ್ವೇತಾ ಎಲ್ಲಿ? ನಾನು ಐಸಿಯುನಲ್ಲಿದ್ದಾಗ ಅವಳು ಬಂದಿದ್ಲಾ?
    tr: Kāphi alla kaṇē mukhya. Shwētā elli? Nānu ICU-nalliddāga avaḷu bandidlā?
    en: It's not the coffee that matters, dear. Where's Shwetha? Did she come while I was in the ICU?
  - who: amma
    t: ಬಂದಿದ್ಲು ಅತ್ತೆ. ಐಸಿಯು ಒಳಗೆ ಒಬ್ಬರಿಗೇ ಪಾಸ್, ಇನ್ಫೆಕ್ಷನ್ ಭಯ ಬೇರೆ — ಅದಕ್ಕೆ ಗ್ಲಾಸ್ ಹೊರಗಿಂದಾನೇ ನೋಡಿ ಹೋದ್ಲು. ಇವತ್ತು ಸಂಜೆ ಬರ್ತಾಳಂತೆ.
    tr: Bandidlu atte. ICU oḷage obbarigē pās, inphekṣan bhaya bēre — adakke glās horagindānē nōḍi hōdlu. Ivattu sanje bartāḷante.
    en: She did, Atte. There's only one pass for inside the ICU, and there's the fear of infection too — so she just looked at you through the glass and left. She says she's coming this evening.
  - who: nurse
    t: ಡಾಕ್ಟ್ರು ಹನ್ನೊಂದು ಗಂಟೆಗೆ ರೌಂಡ್ಸ್‌ಗೆ ಬರ್ತಾರೆ. ಎಲ್ಲಾ ಸರಿ ಇದ್ರೆ ನಾಳೆ ಡಿಸ್ಚಾರ್ಜ್ ಅಂತ ಹೇಳಿದ್ರು. ಅಷ್ಟರಲ್ಲಿ ಬಾತ್‌ರೂಮ್‌ಗೆ ಒಬ್ಬರೇ ಹೋಗ್ಬೇಡಿ, ಈ ಬೆಲ್ ಒತ್ತಿ.
    tr: Ḍākṭru hannondu gaṇṭege rauṇḍsge bartāre. Ellā sari idre nāḷe ḍischārj anta hēḷidru. Aṣṭaralli bāthrūmge obbarē hōgbēḍi, ī bel otti.
    en: The doctor comes on her rounds at eleven. She said if everything's fine, discharge is tomorrow. Until then, don't go to the bathroom on your own — press this bell.
  - who: ajji
    t: ಒಬ್ಬಳೇ ಹೋಗ್ಬೇಡ, ಕಾಫಿ ಕುಡೀಬೇಡ, ಉಪ್ಪು ತಿನ್ಬೇಡ… ಇನ್ನೇನು ಉಳಿದಿದೆ ನನಗೆ?
    tr: Obbaḷē hōgbēḍa, kāphi kuḍībēḍa, uppu tinbēḍa… innēnu uḷidide nanage?
    en: Don't go alone, don't drink coffee, don't eat salt… what's left for me?
  - who: nurse
    t: ಮಾತಾಡ್ಬಹುದು ಅಜ್ಜಿ, ಎಷ್ಟು ಬೇಕಾದ್ರೂ! ಅದಕ್ಕೆ ಯಾವ ರೂಲ್ಸೂ ಇಲ್ಲ.
    tr: Mātāḍbahudu ajji, eṣṭu bēkādrū! Adakke yāva rūlsū illa.
    en: (laughing) You can talk, Ajji, as much as you like! There's no rule against that.
  - section: 📄 The discharge summary
    learn: ‑bāradu / ‑bēku (must not / must) · yāvudē kāraṇakkū (for no reason at all) · 1‑0‑1 read aloud · counterfactual ‑idre … ‑titu · rakta heppugaṭṭu (blood clots) · warning signs
  - scene: The next morning. Dr. Meera Kulkarni sits with Appa, Amma and Kiran in the small counselling room of the ward, the discharge summary in her hand.
  - who: cardio
    t: ನೋಡಿ, ಇದು ಡಿಸ್ಚಾರ್ಜ್ ಸಮ್ಮರಿ. ಇದನ್ನ ಜೋಪಾನವಾಗಿ ಇಟ್ಕೊಳ್ಳಿ. ಮುಂದೆ ಯಾವ ಡಾಕ್ಟ್ರ ಹತ್ರ ಹೋದ್ರೂ, ಯಾವ ಸ್ಕೀಮ್‌ಗೆ ಅಪ್ಲೈ ಮಾಡಿದ್ರೂ, ಇದನ್ನೇ ಮೊದಲು ಕೇಳ್ತಾರೆ.
    tr: Nōḍi, idu ḍischārj sammari. Idanna jōpānavāgi iṭkoḷḷi. Munde yāva ḍākṭra hatra hōdrū, yāva skīmge aplai māḍidrū, idannē modalu kēḷtāre.
    en: Look, this is the discharge summary. Keep it safe. Whichever doctor you see in future, whatever scheme you apply to, this is the first thing they'll ask for.
  - who: appa
    t: ಸರಿ ಮೇಡಂ. ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ಏನೇನೋ ಬರೆದಿದೆ. ನಮಗೆ ಸ್ವಲ್ಪ ಕನ್ನಡದಲ್ಲಿ ಹೇಳ್ತೀರಾ?
    tr: Sari mēḍam. Iṅgliṣnalli ēnēnō baredide. Namage svalpa Kannaḍadalli hēḷtīrā?
    en: All right, madam. There's all sorts of things written in English. Could you explain it to us in Kannada?
  - who: cardio
    t: ಖಂಡಿತ. ಮೊದಲು ಡಯಾಗ್ನೋಸಿಸ್ — ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್, ಅಂದ್ರೆ ಹೃದಯಾಘಾತ. ಹೃದಯಕ್ಕೆ ರಕ್ತ ತಗೊಂಡ್ ಹೋಗೋ ಒಂದು ಮುಖ್ಯ ರಕ್ತನಾಳದಲ್ಲಿ ಬ್ಲಾಕ್ ಇತ್ತು, ಅಲ್ಲಿ ಒಂದು ಸ್ಟೆಂಟ್ ಹಾಕಿದ್ವಿ. ಇಲ್ಲಿ 'ಪಿಟಿಸಿಎ ವಿತ್ ಒನ್ ಡಿಇಎಸ್' ಅಂತ ಬರೆದಿರೋದು ಅದೇ — ಔಷಧಿ ಲೇಪಿಸಿರೋ ಒಂದು ಸ್ಟೆಂಟ್.
    tr: Khaṇḍita. Modalu ḍayāgnōsis — hārṭ aṭyāk, andre hṛdayāghāta. Hṛdayakke rakta tagoṇḍ hōgō ondu mukhya raktanāḷadalli blāk ittu, alli ondu sṭeṇṭ hākidvi. Illi 'PTCA with one DES' anta baredirōdu adē — auṣadhi lēpisirō ondu sṭeṇṭ.
    en: Of course. First, the diagnosis — a heart attack, hṛdayāghāta. One of the main arteries carrying blood to the heart was blocked, and we put a stent there. What's written here, 'PTCA with one DES', means exactly that — one drug-coated stent.
  - who: kiran
    t: ಸ್ಟೆಂಟ್ ಜೀವನ ಪೂರ್ತಿ ಒಳಗೇ ಇರುತ್ತಾ ಮೇಡಂ? ಆಮೇಲೆ ತೆಗೀಬೇಕಾ?
    tr: Sṭeṇṭ jīvana pūrti oḷagē iruttā mēḍam? Āmēle tegībēkā?
    en: Does the stent stay inside for life, madam? Does it have to be taken out later?
  - who: cardio
    t: ಇಲ್ಲ, ತೆಗೆಯೋ ಅಗತ್ಯ ಇಲ್ಲ. ಅದು ರಕ್ತನಾಳದ ಗೋಡೆಯೊಳಗೆ ಸೇರ್ಕೊಂಡ್ ಬಿಡುತ್ತೆ. ಆದ್ರೆ ಸ್ಟೆಂಟ್ ಒಳಗೆ ಮತ್ತೆ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟಬಾರದು. ಅದಕ್ಕೇ ಈ ಮಾತ್ರೆಗಳು ತುಂಬಾ ಮುಖ್ಯ.
    tr: Illa, tegeyō agatya illa. Adu raktanāḷada gōḍeyoḷage sērkoṇḍ biḍutte. Ādre sṭeṇṭ oḷage matte rakta heppugaṭṭabāradu. Adakkē ī mātregaḷu tumbā mukhya.
    en: No, there's no need to remove it. It becomes part of the artery wall. But blood must not clot again inside the stent. That's why these tablets are so important.
  - who: cardio
    t: ಮೊದಲನೇದು, ಈ ಎರಡು ಬ್ಲಡ್ ಥಿನ್ನರ್ — ರಕ್ತ ತೆಳ್ಳಗೆ ಮಾಡೋ ಮಾತ್ರೆಗಳು. ಆಸ್ಪಿರಿನ್ ಮತ್ತೆ ಇನ್ನೊಂದು. ಕನಿಷ್ಠ ಒಂದು ವರ್ಷ ಎರಡೂ ತಗೋಬೇಕು, ಆಸ್ಪಿರಿನ್ ಜೀವನ ಪೂರ್ತಿ. ಯಾವುದೇ ಕಾರಣಕ್ಕೂ ನಮ್ಮನ್ನ ಕೇಳದೆ ನಿಲ್ಲಿಸಬಾರದು. ಹಲ್ಲು ಕೀಳಿಸೋಕೆ ಹೋದ್ರೂ ಡೆಂಟಿಸ್ಟ್‌ಗೆ ಮೊದಲೇ ಹೇಳಿ.
    tr: Modalanēdu, ī eraḍu blaḍ thinnar — rakta teḷḷage māḍō mātregaḷu. Āspirin matte innondu. Kaniṣṭha ondu varṣa eraḍū tagōbēku, āspirin jīvana pūrti. Yāvudē kāraṇakkū nammanna kēḷade nillisabāradu. Hallu kīḷisōke hōdrū ḍeṇṭisṭge modalē hēḷi.
    en: First, these two blood thinners — tablets that keep the blood thin. Aspirin and one more. She has to take both for at least a year, and aspirin for life. Under no circumstances stop them without asking us. Even if she goes to have a tooth pulled, tell the dentist first.
  - who: amma
    t: ಅತ್ತೆಗೆ ಮಾತ್ರೆ ನುಂಗೋದು ಅಂದ್ರೆ ಆಗೋದೇ ಇಲ್ಲ ಮೇಡಂ. ದಿನಾ ಜಗಳ ಆಗುತ್ತೆ.
    tr: Attege mātre nuṅgōdu andre āgōdē illa mēḍam. Dinā jagaḷa āgutte.
    en: My mother-in-law simply can't stand swallowing tablets, madam. It'll be a fight every day.
  - who: cardio
    t: ಅದಕ್ಕೇ ನಿಮಗೆ ಹೇಳ್ತಿದ್ದೀನಿ, ಅವರಿಗಲ್ಲ! ಒಂದು ಪಿಲ್ ಬಾಕ್ಸ್ ತಗೊಳ್ಳಿ, ಇಡೀ ವಾರದ ಮಾತ್ರೆ ಮೊದಲೇ ಹಾಕಿಡಿ. ಎರಡನೇದು ಕೊಲೆಸ್ಟ್ರಾಲ್ ಮಾತ್ರೆ, ಸ್ಟ್ಯಾಟಿನ್ — ರಾತ್ರಿ ಊಟ ಆದ್ಮೇಲೆ ಒಂದು. ಮೂರನೇದು ಬಿಪಿ ಮಾತ್ರೆ, ಬೆಳಿಗ್ಗೆ ತಿಂಡಿ ಆದ್ಮೇಲೆ. ಜೊತೆಗೆ ಹೊಟ್ಟೆ ಉರಿ ಆಗದೆ ಇರೋಕೆ ಒಂದು ಗ್ಯಾಸ್ಟ್ರಿಕ್ ಮಾತ್ರೆ, ತಿಂಡಿಗೆ ಮುಂಚೆ ಮತ್ತೆ ಊಟಕ್ಕೆ ಮುಂಚೆ.
    tr: Adakkē nimage hēḷtiddīni, avarigalla! Ondu pil bāks tagoḷḷi, iḍī vārada mātre modalē hākiḍi. Eraḍanēdu kolesṭrāl mātre, sṭyāṭin — rātri ūṭa ādmēle ondu. Mūranēdu BP mātre, beḷigge tiṇḍi ādmēle. Jotege hoṭṭe uri āgade irōke ondu gyāsṭrik mātre, tiṇḍige munche matte ūṭakke munche.
    en: That's exactly why I'm telling you, not her! Buy a pill box and fill in the whole week's tablets in advance. Second, the cholesterol tablet, a statin — one at night after dinner. Third, the BP tablet, in the morning after breakfast. And a gastric tablet so her stomach doesn't burn — before breakfast and before dinner.
  - who: kiran
    t: ಒಂದು ನಿಮಿಷ, ಫೋನ್‌ನಲ್ಲಿ ಬರ್ಕೋತೀನಿ. ಬೆಳಿಗ್ಗೆ ತಿಂಡಿಗೆ ಮುಂಚೆ ಗ್ಯಾಸ್ಟ್ರಿಕ್; ತಿಂಡಿ ಆದ್ಮೇಲೆ ಎರಡು ಬ್ಲಡ್ ಥಿನ್ನರ್, ಬಿಪಿ. ರಾತ್ರಿ ಊಟಕ್ಕೆ ಮುಂಚೆ ಮತ್ತೆ ಗ್ಯಾಸ್ಟ್ರಿಕ್; ಊಟ ಆದ್ಮೇಲೆ ಸ್ಟ್ಯಾಟಿನ್. ಸರೀನಾ ಮೇಡಂ?
    tr: Ondu nimiṣa, phōnnalli barkōtīni. Beḷigge tiṇḍige munche gyāsṭrik; tiṇḍi ādmēle eraḍu blaḍ thinnar, BP. Rātri ūṭakke munche matte gyāsṭrik; ūṭa ādmēle sṭyāṭin. Sarīnā mēḍam?
    en: 'One minute, I''ll note it on my phone. Morning before breakfast: gastric. After breakfast: the two blood thinners and BP. Night before dinner: gastric again. After dinner: statin. Is that right, madam?'
  - who: cardio
    t: ಸರಿ. ಚೀಟಿಯಲ್ಲಿ ಗ್ಯಾಸ್ಟ್ರಿಕ್ ಮುಂದೆ 'ಒಂದು-ಸೊನ್ನೆ-ಒಂದು' ಅಂತ ಇದೆಯಲ್ಲ, ಅದರ ಅರ್ಥ ಅದೇ — ಬೆಳಿಗ್ಗೆ ಒಂದು, ಮಧ್ಯಾಹ್ನ ಇಲ್ಲ, ರಾತ್ರಿ ಒಂದು.
    tr: Sari. Chīṭiyalli gyāsṭrik munde 'ondu-sonne-ondu' anta ideyalla, adara artha adē — beḷigge ondu, madhyāhna illa, rātri ondu.
    en: Right. Where the prescription says 'one-zero-one' next to the gastric tablet, that's what it means — one in the morning, none at noon, one at night.
  - who: appa
    t: ಮೇಡಂ, ಮನೆಗೆ ಹೋದ್ಮೇಲೆ ಏನೇನು ಮಾಡಬಾರದು? ಅಮ್ಮ ಸುಮ್ಮನೆ ಕೂರೋರಲ್ಲ.
    tr: Mēḍam, manege hōdmēle ēnēnu māḍabāradu? Amma summane kūrōralla.
    en: Madam, what must she not do once she's home? My mother isn't one to sit still.
  - who: cardio
    t: ಒಂದು ತಿಂಗಳು ಭಾರ ಎತ್ತಬಾರದು — ನೀರಿನ ಬಿಂದಿಗೆ, ಅಕ್ಕಿ ಚೀಲ, ಏನೂ ಇಲ್ಲ. ಮೆಟ್ಟಿಲು ನಿಧಾನವಾಗಿ ಹತ್ತಬಹುದು. ದಿನಾ ಬೆಳಿಗ್ಗೆ ಹತ್ತು ನಿಮಿಷ ವಾಕಿಂಗ್, ಆಮೇಲೆ ಪ್ರತಿ ವಾರ ಐದು ನಿಮಿಷ ಜಾಸ್ತಿ ಮಾಡಿ. ಉಪ್ಪು, ಎಣ್ಣೆ, ಸಿಹಿ — ಮೂರೂ ಕಮ್ಮಿ. ಉಪ್ಪಿನಕಾಯಿ, ಹಪ್ಪಳ, ಕರಿದಿದ್ದು ಬೇಡ.
    tr: Ondu tiṅgaḷu bhāra ettabāradu — nīrina bindige, akki chīla, ēnū illa. Meṭṭilu nidhānavāgi hattabahudu. Dinā beḷigge hattu nimiṣa vākiṅg, āmēle prati vāra aidu nimiṣa jāsti māḍi. Uppu, eṇṇe, sihi — mūrū kammi. Uppinakāyi, happaḷa, karididdu bēḍa.
    en: For a month she mustn't lift anything heavy — no water pots, no rice bags, nothing. She may climb stairs slowly. A ten-minute walk every morning, then add five minutes each week. Salt, oil, sweets — cut all three. No pickle, no papad, nothing fried.
  - who: amma
    t: ಉಪ್ಪಿನಕಾಯಿ ಇಲ್ಲದೆ ಅತ್ತೆ ಊಟಾನೇ ಮಾಡಲ್ಲ ಮೇಡಂ…
    tr: Uppinakāyi illade atte ūṭānē māḍalla mēḍam…
    en: My mother-in-law won't eat a meal without pickle, madam…
  - who: cardio
    t: ಗೊತ್ತು, ಎಲ್ಲಾ ಅಜ್ಜಿಯರೂ ಹಾಗೇ! ತಿಂಗಳಿಗೆ ಒಂದು ಸಲ, ಒಂದು ಚಮಚ — ಅದನ್ನ ನಾನು ನೋಡಿಲ್ಲ ಅಂದ್ಕೊಳ್ಳಿ.
    tr: Gottu, ellā ajjiyarū hāgē! Tiṅgaḷige ondu sala, ondu chamacha — adanna nānu nōḍilla andkoḷḷi.
    en: I know, all grandmothers are like that! Once a month, one spoonful — let's say I didn't see it.
  - who: cardio
    t: ಈಗ ಅತಿ ಮುಖ್ಯವಾದ ವಿಷಯ. ಮತ್ತೆ ಎದೆ ನೋವು, ಎದೆ ಭಾರ, ಉಸಿರು ಕಟ್ಟೋದು, ತಣ್ಣನೆ ಬೆವರು, ತಲೆಸುತ್ತು — ಇದರಲ್ಲಿ ಯಾವುದು ಬಂದ್ರೂ ಕಾಯಬೇಡಿ. 'ಗ್ಯಾಸ್ ಇರ್ಬೇಕು' ಅಂತ ಮನೇಲಿ ಕೂರಬೇಡಿ. ನೇರವಾಗಿ ಎಮರ್ಜೆನ್ಸಿಗೆ ಬನ್ನಿ, ಇಲ್ಲಾಂದ್ರೆ ನೂರಾ ಎಂಟಕ್ಕೆ ಫೋನ್ ಮಾಡಿ.
    tr: Īga ati mukhyavāda viṣaya. Matte ede nōvu, ede bhāra, usiru kaṭṭōdu, taṇṇane bevaru, talesuttu — idaralli yāvudu bandrū kāyabēḍi. 'Gyās irbēku' anta manēli kūrabēḍi. Nēravāgi emarjensige banni, illāndre nūrā eṇṭakke phōn māḍi.
    en: Now the most important thing. Chest pain again, heaviness in the chest, breathlessness, a cold sweat, dizziness — if any of these comes, don't wait. Don't sit at home saying 'it must be gas'. Come straight to emergency, or call 108.
  - who: appa
    t: ಆ ರಾತ್ರಿ ನಾವು ಇನ್ನೂ ಸ್ವಲ್ಪ ಲೇಟ್ ಮಾಡಿದ್ರೆ ಏನಾಗ್ತಿತ್ತೋ… ನೆನೆಸ್ಕೊಂಡ್ರೇನೇ ಭಯ ಆಗುತ್ತೆ.
    tr: Ā rātri nāvu innū svalpa lēṭ māḍidre ēnāgtittō… nenaskoṇḍrēnē bhaya āgutte.
    en: If we'd been a little later that night, who knows what would have happened… just thinking about it frightens me.
  - who: cardio
    t: ನೀವು ಬೇಗ ಕರ್ಕೊಂಡ್ ಬಂದಿದ್ದಕ್ಕೇ ಹಾರ್ಟ್ ಮಸಲ್ ಜಾಸ್ತಿ ಹಾಳಾಗಿಲ್ಲ. ಎಕೋದಲ್ಲಿ ಪಂಪಿಂಗ್ ನಲವತ್ತೈದು ಪರ್ಸೆಂಟ್ ಇದೆ — ಈ ವಯಸ್ಸಿಗೆ ಸಮಾಧಾನಕರ. ಎರಡು ವಾರ ಆದ್ಮೇಲೆ ಓಪಿಡಿಗೆ ರಿವ್ಯೂಗೆ ಬನ್ನಿ. ಅಲ್ಲೇ ಕಾರ್ಡಿಯಾಕ್ ರಿಹ್ಯಾಬ್ ಬಗ್ಗೆನೂ ಹೇಳ್ತಾರೆ.
    tr: Nīvu bēga karkoṇḍ bandiddakkē hārṭ masal jāsti hāḷāgilla. Ekōdalli pampiṅg nalavattaidu parsenṭ ide — ī vayassige samādhānakara. Eraḍu vāra ādmēle OPD-ge rivyūge banni. Allē kārḍiyāk rihyāb baggenū hēḷtāre.
    en: Because you brought her in quickly, not much heart muscle was damaged. On the echo the pumping is forty-five percent — reassuring at her age. Come to the OPD for a review after two weeks. They'll tell you about cardiac rehab there too.
  - who: kiran
    t: ಕಾರ್ಡಿಯಾಕ್ ರಿಹ್ಯಾಬ್ ಅಂದ್ರೆ ಏನು ಮೇಡಂ?
    tr: Kārḍiyāk rihyāb andre ēnu mēḍam?
    en: What's cardiac rehab, madam?
  - who: cardio
    t: ಹಾರ್ಟ್ ಅಟ್ಯಾಕ್ ಆದ್ಮೇಲೆ ನಿಧಾನವಾಗಿ ಶಕ್ತಿ ವಾಪಸ್ ತರೋ ಪ್ರೋಗ್ರಾಮ್. ಫಿಸಿಯೋಥೆರಪಿಸ್ಟ್ ಮುಂದೆ ವಾಕಿಂಗ್, ಸಣ್ಣ ವ್ಯಾಯಾಮ — ಅವರು ಬಿಪಿ, ಪಲ್ಸ್ ನೋಡ್ತಾ ಇರ್ತಾರೆ. ಸುಮಾರು ಆರರಿಂದ ಹನ್ನೆರಡು ವಾರ. ಡಯಟ್ ಬಗ್ಗೆ, ಟೆನ್ಶನ್ ಬಗ್ಗೆನೂ ಮಾತಾಡ್ತಾರೆ. ಇದನ್ನ ಸರಿಯಾಗಿ ಮಾಡಿದೋರಿಗೆ ಮತ್ತೆ ಅಟ್ಯಾಕ್ ಆಗೋ ಸಾಧ್ಯತೆ ಕಮ್ಮಿ.
    tr: Hārṭ aṭyāk ādmēle nidhānavāgi shakti vāpas tarō prōgrām. Phisiyōtherapisṭ munde vākiṅg, saṇṇa vyāyāma — avaru BP, pals nōḍtā irtāre. Sumāru ārarinda hanneraḍu vāra. Ḍayaṭ bagge, ṭenshan baggenū mātāḍtāre. Idanna sariyāgi māḍidōrige matte aṭyāk āgō sādhyate kammi.
    en: It's a programme that slowly brings strength back after a heart attack. Walking and light exercise in front of a physiotherapist, who keeps checking BP and pulse. About six to twelve weeks. They also talk about diet and stress. People who do it properly are less likely to have another attack.
  - who: appa
    t: ತುಂಬಾ ಥ್ಯಾಂಕ್ಸ್ ಮೇಡಂ. ನೀವು ಇಲ್ಲದಿದ್ರೆ…
    tr: Tumbā thyāṅks mēḍam. Nīvu illadidre…
    en: Thank you so much, madam. If it weren't for you…
  - who: cardio
    t: ನಾವು ನಮ್ಮ ಕೆಲಸ ಮಾಡಿದ್ವಿ ಅಷ್ಟೇ. ಆ ರಾತ್ರಿ ತಡ ಮಾಡದೆ ಫೋನ್ ಮಾಡಿದೋರಿಗೆ ಥ್ಯಾಂಕ್ಸ್ ಹೇಳಿ. ಬಿಲ್ಲಿಂಗ್‌ನಿಂದ ಕ್ಲಿಯರೆನ್ಸ್ ಬಂದ ತಕ್ಷಣ ಹೋಗ್ಬಹುದು.
    tr: Nāvu namma kelasa māḍidvi aṣṭē. Ā rātri taḍa māḍade phōn māḍidōrige thyāṅks hēḷi. Billiṅgninda kliyarens banda takṣaṇa hōgbahudu.
    en: We just did our job. Thank whoever called without delay that night. You can go as soon as billing gives clearance.
  - section: 🧾 The billing desk — what the scheme paid
    learn: kaṭṭu (pay) · skīmninda kavar āgide · 'free' andre … mātra · rasīdi, orijinal, jerāks · ‑oḷage (within) · lakh/thousand numbers · frustration and apology
  - scene: Three in the afternoon, the billing counter on the ground floor. Appa and Kiran have been waiting since eleven. Venkatesh finally calls their name.
  - who: desk
    t: ಸರಸ್ವತಮ್ಮ, ವಾರ್ಡ್ ಬೆಡ್ ಮೂವತ್ತೆರಡು? ಅಟೆಂಡರ್ ಯಾರು?
    tr: Sarasvatamma, vārḍ beḍ mūvatteraḍu? Aṭeṇḍar yāru?
    en: Saraswathamma, ward bed thirty-two? Who's the attender?
  - who: appa
    t: ನಾನು, ಅವರ ಮಗ. ಸಾರ್, ಬೆಳಿಗ್ಗೆ ಹತ್ತಕ್ಕೆ ಡಿಸ್ಚಾರ್ಜ್ ಅಂದ್ರು, ಈಗ ಮೂರು ಗಂಟೆ ಆಯ್ತು. ಅಮ್ಮ ಬೆಡ್ ಮೇಲೆ ಬ್ಯಾಗ್ ಕಟ್ಕೊಂಡ್ ಕಾಯ್ತಿದ್ದಾರೆ.
    tr: Nānu, avara maga. Sār, beḷigge hattakke ḍischārj andru, īga mūru gaṇṭe āytu. Amma beḍ mēle byāg kaṭkoṇḍ kāytiddāre.
    en: Me, her son. Sir, they said discharge at ten this morning, and it's now three o'clock. My mother's been sitting on the bed with her bag packed.
  - who: desk
    t: ಗೊತ್ತು ಸಾರ್, ಬೇಜಾರಾಗ್ಬೇಡಿ. ಸ್ಕೀಮ್ ಕೇಸ್‌ಗಳಲ್ಲಿ ಫೈನಲ್ ಕ್ಲೈಮ್ ಪೋರ್ಟಲ್‌ಗೆ ಅಪ್‌ಲೋಡ್ ಆಗ್ಬೇಕು, ಫಾರ್ಮಸಿ ಬಿಲ್ ಕ್ಲೋಸ್ ಆಗ್ಬೇಕು. ಇವತ್ತು ಐವತ್ತು ಡಿಸ್ಚಾರ್ಜ್ ಇದೆ, ನಾವು ಕೌಂಟರ್‌ನಲ್ಲಿ ಮೂರೇ ಜನ. ಈಗ ನಿಮ್ದು ರೆಡಿ ಆಯ್ತು, ನೋಡಿ.
    tr: Gottu sār, bējārāgbēḍi. Skīm kēsgaḷalli phainal klaim pōrṭalge aplōḍ āgbēku, phārmasi bil klōs āgbēku. Ivattu aivattu ḍischārj ide, nāvu kauṇṭarnalli mūrē jana. Īga nimdu reḍi āytu, nōḍi.
    en: I know, sir, please don't be upset. In scheme cases the final claim has to be uploaded to the portal and the pharmacy bill has to be closed. There are fifty discharges today and only three of us at the counter. Yours is ready now — have a look.
  - who: desk
    t: ಒಟ್ಟು ಬಿಲ್ — ಆಂಜಿಯೋಗ್ರಾಮ್, ಆಂಜಿಯೋಪ್ಲಾಸ್ಟಿ, ಸ್ಟೆಂಟ್, ಮೂರು ದಿನ ಐಸಿಯು, ವಾರ್ಡ್, ಟೆಸ್ಟ್‌ಗಳು, ಔಷಧಿ — ಎಲ್ಲಾ ಸೇರಿ ಒಂದು ಲಕ್ಷದ ಇಪ್ಪತ್ತೆರಡು ಸಾವಿರ. ಅದರಲ್ಲಿ ಒಂದು ಲಕ್ಷದ ಹದಿಮೂರು ಸಾವಿರದ ಆರುನೂರು ಆಯುಷ್ಮಾನ್ ವಯ ವಂದನಾ ಕಾರ್ಡ್‌ನಿಂದ ಕವರ್ ಆಗಿದೆ.
    tr: Oṭṭu bil — āñjiyōgrām, āñjiyōplāsṭi, sṭeṇṭ, mūru dina ICU, vārḍ, ṭesṭgaḷu, auṣadhi — ellā sēri ondu lakṣada ippatteraḍu sāvira. Adaralli ondu lakṣada hadimūru sāvirada ārunūru Āyuṣmān Vaya Vandanā kārḍninda kavar āgide.
    en: The total bill — angiogram, angioplasty, stent, three days of ICU, the ward, tests, medicines — comes to one lakh twenty-two thousand. Of that, one lakh thirteen thousand six hundred is covered by the Ayushman Vay Vandana card.
  - who: kiran
    t: ಹಾಗಾದ್ರೆ ಉಳಿದಿದ್ದು ಎಂಟು ಸಾವಿರದ ನಾನೂರು? ಅದು ಯಾಕೆ ಸಾರ್? ಸ್ಕೀಮ್‌ನಲ್ಲಿ ಎಲ್ಲಾ ಫ್ರೀ ಅಂದಿದ್ರಲ್ಲ?
    tr: Hāgādre uḷididdu eṇṭu sāvirada nānūru? Adu yāke sār? Skīmnalli ellā phrī andidrallā?
    en: So the remaining eight thousand four hundred — why's that, sir? Weren't we told everything is free under the scheme?
  - who: desk
    t: ಫ್ರೀ ಅಂದ್ರೆ ಪ್ಯಾಕೇಜ್‌ನಲ್ಲಿ ಇರೋದು ಮಾತ್ರ ಫ್ರೀ. ಅಡ್ಮಿಟ್ ಆದ ರಾತ್ರಿ, ಕಾರ್ಡ್ ವೆರಿಫೈ ಆಗೋಕೆ ಮುಂಚೆ ಮಾಡಿದ ಕೆಲವು ಟೆಸ್ಟ್ — ಐದು ಸಾವಿರದ ಆರುನೂರು. ಮತ್ತೆ ಮನೆಗೆ ಒಂದು ತಿಂಗಳ ಮಾತ್ರೆ — ಎರಡು ಸಾವಿರದ ಎಂಟುನೂರು. ಅವೆರಡೂ ಪ್ಯಾಕೇಜ್‌ಗೆ ಸೇರಲ್ಲ.
    tr: Phrī andre pyākējnalli irōdu mātra phrī. Aḍmiṭ āda rātri, kārḍ verifai āgōke munche māḍida kelavu ṭesṭ — aidu sāvirada ārunūru. Matte manege ondu tiṅgaḷa mātre — eraḍu sāvirada eṇṭunūru. Averaḍū pyākējge sēralla.
    en: '''Free'' means only what''s in the package is free. Some tests done on the night of admission, before the card was verified — five thousand six hundred. And a month''s tablets to take home — two thousand eight hundred. Neither is part of the package.'
  - who: appa
    t: ಪರ್ವಾಗಿಲ್ಲ ಬಿಡಿ. ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ ಇದೇ ಆಪರೇಷನ್‌ಗೆ ಎರಡೂವರೆ-ಮೂರು ಲಕ್ಷ ಆಗ್ತಿತ್ತು ಅಂತ ಎಲ್ರೂ ಹೇಳಿದ್ರು. ಯುಪಿಐ ಆಗುತ್ತಾ?
    tr: Parvāgilla biḍi. Praivēṭnalli idē āparēṣange eraḍūvare-mūru lakṣa āgtittu anta elrū hēḷidru. UPI āguttā?
    en: Never mind. Everyone said the same operation would have cost two and a half to three lakh at a private hospital. Can I pay by UPI?
  - who: desk
    t: ಆಗುತ್ತೆ ಸಾರ್, ಈ ಕ್ಯೂಆರ್ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ. ಮತ್ತೆ ಗೊತ್ತಿರಲಿ — ಈ ಕಾರ್ಡ್‌ನಲ್ಲಿ ವರ್ಷಕ್ಕೆ ಐದು ಲಕ್ಷ ಲಿಮಿಟ್. ಈ ವರ್ಷಕ್ಕೆ ಇನ್ನೂ ಮೂರು ಲಕ್ಷದ ಎಂಬತ್ತಾರು ಸಾವಿರದ ನಾನೂರು ಉಳಿದಿದೆ ಅಂತ ಪೋರ್ಟಲ್ ತೋರಿಸ್ತಿದೆ. ಆ ದುಡ್ಡು ಬೇಕಾಗದೇ ಇರ್ಲಿ.
    tr: Āgutte sār, ī kyū-ār skyān māḍi. Matte gottirali — ī kārḍnalli varṣakke aidu lakṣa limiṭ. Ī varṣakke innū mūru lakṣada embattāru sāvirada nānūru uḷidide anta pōrṭal tōristide. Ā duḍḍu bēkāgadē irli.
    en: Yes, sir, scan this QR code. And keep in mind — this card has a limit of five lakh a year. The portal shows three lakh eighty-six thousand four hundred still left for this year. May you never need it.
  - who: appa
    t: ಸಾರ್, ನಮ್ ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಡಿಪೆಂಡೆಂಟ್ ತಾಯಿಗೆ ಸ್ವಲ್ಪ ಮೆಡಿಕಲ್ ರೀಇಂಬರ್ಸ್‌ಮೆಂಟ್ ಸಿಗುತ್ತೆ ಅಂತ ಕೇಳಿದ್ದೀನಿ. ಅದಕ್ಕೆ ಏನೇನು ಬೇಕು?
    tr: Sār, nam byāṅknalli ḍipeṇḍeṇṭ tāyige svalpa meḍikal rī-imbarsmeṇṭ sigutte anta kēḷiddīni. Adakke ēnēnu bēku?
    en: Sir, I've heard my bank gives some medical reimbursement for a dependent mother. What would I need for that?
  - who: desk
    t: 'ಅದು ನಿಮ್ ಬ್ಯಾಂಕ್ ರೂಲ್ಸ್ ಸಾರ್, ನನಗೆ ಸರಿಯಾಗಿ ಗೊತ್ತಿಲ್ಲ. ಆದ್ರೆ ಸಾಮಾನ್ಯವಾಗಿ ಎಲ್ರೂ ಕೇಳೋದು ಇವು: ಡಿಸ್ಚಾರ್ಜ್ ಸಮ್ಮರಿ, ಫೈನಲ್ ಬಿಲ್, ನೀವು ಕಟ್ಟಿದ ದುಡ್ಡಿನ ಒರಿಜಿನಲ್ ರಸೀದಿ, ಫಾರ್ಮಸಿ ಬಿಲ್, ಟೆಸ್ಟ್ ರಿಪೋರ್ಟ್‌ಗಳು. ಸ್ಕೀಮ್ ಕಟ್ಟಿದ ಭಾಗಕ್ಕೆ ಕ್ಲೈಮ್ ಮಾಡೋಕಾಗಲ್ಲ — ನೀವೇ ಕಟ್ಟಿದ ಭಾಗಕ್ಕೆ ಮಾತ್ರ.'
    tr: 'Adu nim byāṅk rūls sār, nanage sariyāgi gottilla. Ādre sāmānyavāgi elrū kēḷōdu ivu: ḍischārj sammari, phainal bil, nīvu kaṭṭida duḍḍina orijinal rasīdi, phārmasi bil, ṭesṭ ripōrṭgaḷu. Skīm kaṭṭida bhāgakke klaim māḍōkāgalla — nīvē kaṭṭida bhāgakke mātra.'
    en: 'That depends on your bank''s rules, sir, I don''t know them exactly. But what everyone usually asks for is this: the discharge summary, the final bill, the original receipts for what you paid, the pharmacy bill and the test reports. You can''t claim the part the scheme paid — only the part you paid yourself.'
  - who: kiran
    t: ಒರಿಜಿನಲ್ ಒಂದೇ ಸೆಟ್ ಇರೋದು ಅಲ್ವಾ? ಎಲ್ಲದಕ್ಕೂ ಎರಡೆರಡು ಜೆರಾಕ್ಸ್ ಮಾಡಿಸ್ತೀನಿ, ಫೋನ್‌ನಲ್ಲೂ ಫೋಟೋ ತೆಗೆದಿಡ್ತೀನಿ.
    tr: Orijinal ondē seṭ irōdu alvā? Elladakkū eraḍeraḍu jerāks māḍistīni, phōnnallū phōṭō tegediḍtīni.
    en: There's only one set of originals, right? I'll get two photocopies of everything and take photos on my phone too.
  - who: desk
    t: ಬುದ್ಧಿವಂತ ಹುಡುಗ! ತುಂಬಾ ಜನ ರಸೀದಿ ಕಳ್ಕೊಂಡು, ಡುಪ್ಲಿಕೇಟ್‌ಗೆ ತಿಂಗಳುಗಟ್ಟಲೆ ಅಲೀತಾರೆ. ಮತ್ತೆ ರೀಇಂಬರ್ಸ್‌ಮೆಂಟ್‌ಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಡಿಸ್ಚಾರ್ಜ್ ಆದ ಒಂದು ತಿಂಗಳ ಒಳಗೆ ಹಾಕ್ಬೇಕು, ಲೇಟ್ ಮಾಡ್ಬೇಡಿ.
    tr: Buddhivanta huḍuga! Tumbā jana rasīdi kaḷkoṇḍu, ḍuplikēṭge tiṅgaḷugaṭṭale alītāre. Matte rī-imbarsmeṇṭge sāmānyavāgi ḍischārj āda ondu tiṅgaḷa oḷage hākbēku, lēṭ māḍbēḍi.
    en: Smart boy! Lots of people lose their receipts and then run around for months for a duplicate. And reimbursement usually has to be filed within a month of discharge — don't delay it.
  - who: appa
    t: ಇಲ್ಲಿ ಸೈನ್ ಮಾಡ್ಬೇಕಾ? … ಸರಿ. ಸಾರ್, ಬೆಳಿಗ್ಗೆಯಿಂದ ಸ್ವಲ್ಪ ಕೋಪ ಬಂದಿತ್ತು, ಬೇಸರ ಮಾಡ್ಕೋಬೇಡಿ. ನೀವು ತಾಳ್ಮೆಯಿಂದ ವಿವರಿಸಿದ್ರಿ.
    tr: Illi sain māḍbēkā? … Sari. Sār, beḷiggeyinda svalpa kōpa bandittu, bēsara māḍkōbēḍi. Nīvu tāḷmeyinda vivarisidri.
    en: (signing) Sign here? … Done. Sir, I've been a bit angry since the morning — please don't mind. You explained it all patiently.
  - who: desk
    t: ಪರ್ವಾಗಿಲ್ಲ ಸಾರ್, ಇದನ್ನ ದಿನಾ ನೋಡ್ತೀವಿ. ಇದು ಗೇಟ್ ಪಾಸ್ — ಹೊರಗೆ ಸೆಕ್ಯುರಿಟಿಗೆ ತೋರಿಸಿ. ಅಮ್ಮನಿಗೆ ಬೇಗ ಹುಷಾರಾಗ್ಲಿ.
    tr: Parvāgilla sār, idanna dinā nōḍtīvi. Idu gēṭ pās — horage sekyuriṭige tōrisi. Ammanige bēga huṣārāgli.
    en: It's all right, sir, we see this every day. Here's the gate pass — show it to security on the way out. May your mother get well soon.
  - who: kiran
    t: ಬೆಳಿಗ್ಗೆ ಡಿಸ್ಚಾರ್ಜ್ ಅಂದ್ರು, ಸಂಜೆ ಐದಕ್ಕೆ ಹೊರಗೆ ಬರ್ತಿದ್ದೀವಿ. ಇದೇ ಬೆಂಗಳೂರಿನ ಡಿಸ್ಚಾರ್ಜ್ ರೂಲ್ ಅನ್ಸುತ್ತೆ ಅಪ್ಪ.
    tr: Beḷigge ḍischārj andru, sanje aidakke horage bartiddīvi. Idē Beṅgaḷūrina ḍischārj rūl ansutte appa.
    en: They said discharge in the morning, and we're getting out at five in the evening. I guess that's Bengaluru's discharge rule, Appa.
  - section: '🏠 Home: low salt and a stubborn patient'
    learn: 'sappe (bland) · pathya (diet restriction) · harake hottiddīni (I''ve made a vow) · negotiation: ‑ōṇa, kaṇḍīṣan · ‑ade irōke (so as not to) · affectionate scolding'
  - scene: 'Thursday, a few days after the discharge: lunch at the Rao house in Jayanagar. Amma has cooked without pickle, papad or extra salt. Sam has come home for lunch.'
  - who: ajji
    t: ಈ ಸಾರಿಗೆ ಉಪ್ಪೇ ಹಾಕಿಲ್ವಾ? ಸಪ್ಪೆ ಸಪ್ಪೆ. ಆಸ್ಪತ್ರೆ ಊಟಾನೇ ಇದಕ್ಕಿಂತ ಚೆನ್ನಾಗಿತ್ತು.
    tr: Ī sārige uppē hākilvā? Sappe sappe. Āspatre ūṭānē idakkinta chennāgittu.
    en: Didn't you put any salt in this rasam at all? It's completely bland. Even the hospital food was better than this.
  - who: amma
    t: ಉಪ್ಪು ಇದೆ ಅತ್ತೆ, ಅರ್ಧ ಚಮಚ. ಡಾಕ್ಟ್ರು ಏನ್ ಹೇಳಿದ್ರು ನೆನಪಿದೆಯಾ? ಉಪ್ಪು, ಎಣ್ಣೆ, ಸಿಹಿ — ಮೂರೂ ಕಮ್ಮಿ.
    tr: Uppu ide atte, ardha chamacha. Ḍākṭru ēn hēḷidru nenapideyā? Uppu, eṇṇe, sihi — mūrū kammi.
    en: There is salt, Atte — half a spoon. Remember what the doctor said? Salt, oil, sweets — less of all three.
  - who: sam
    t: ಅಜ್ಜಿ, ಸ್ವಲ್ಪ ನಿಂಬೆಹಣ್ಣು ಹಿಂಡ್ಕೊಳ್ಳಿ, ಕಾಳುಮೆಣಸಿನ ಪುಡಿ ಹಾಕ್ಕೊಳ್ಳಿ. ನಮ್ ಊರಲ್ಲಿ ನನ್ನ ಅಜ್ಜನಿಗೂ ಹಾರ್ಟ್ ಪ್ರಾಬ್ಲಮ್ ಇತ್ತು, ಅವರು ಹೀಗೇ ತಿಂತಿದ್ರು. ಉಪ್ಪು ಕಮ್ಮಿ ಆದ್ರೂ ರುಚಿ ಬರುತ್ತೆ.
    tr: Ajji, svalpa nimbehaṇṇu hiṇḍkoḷḷi, kāḷumeṇasina puḍi hākkoḷḷi. Nam ūralli nanna ajjanigū hārṭ prāblam ittu, avaru hīgē tintidru. Uppu kammi ādrū ruchi barutte.
    en: Ajji, squeeze a little lemon on it and add some pepper powder. Back home my grandfather had a heart problem too, and that's how he ate. Even with less salt, it gets its taste.
  - who: ajji
    t: ಸ್ವಿಟ್ಜರ್ಲೆಂಡ್‌ನವರು ನಮಗೆ ಅಡುಗೆ ಹೇಳಿಕೊಡೋ ಕಾಲ ಬಂತು! … ಹ್ಮ್. ನಿಂಬೆ ಹಾಕಿದ್ರೆ ಪರ್ವಾಗಿಲ್ಲ, ತಿನ್ನಬಹುದು.
    tr: Sviṭjarleṇḍnavaru namage aḍuge hēḷikoḍō kāla bantu! … Hm. Nimbe hākidre parvāgilla, tinnabahudu.
    en: So now it's come to the Swiss teaching us how to cook! … (tasting) Hm. With lemon it's not bad. It's edible.
  - who: amma
    t: ನೋಡಿ, ಸ್ಯಾಮ್ ಹೇಳಿದ್ರೆ ಕೇಳ್ತೀರಾ. ನಾನು ಹೇಳಿದ್ರೆ ಮಾತ್ರ ಜಗಳ.
    tr: Nōḍi, Syām hēḷidre kēḷtīrā. Nānu hēḷidre mātra jagaḷa.
    en: See? When Sam says it, you listen. When I say it, it's a fight.
  - who: ajji
    t: ನಾಳೆ ಶುಕ್ರವಾರ. ಬೆಳಿಗ್ಗೆ ಬನಶಂಕರಿ ದೇವಸ್ಥಾನಕ್ಕೆ ಹೋಗ್ಬೇಕು. ಆಸ್ಪತ್ರೆಯಲ್ಲಿದ್ದಾಗ ಹರಕೆ ಹೊತ್ತಿದ್ದೀನಿ — ಹುಷಾರಾಗಿ ಮನೆಗೆ ಬಂದ್ರೆ ತಾಯಿಗೆ ಎಣ್ಣೆ ದೀಪ ಹಚ್ತೀನಿ ಅಂತ.
    tr: Nāḷe shukravāra. Beḷigge Banashaṅkari dēvasthānakke hōgbēku. Āspatreyalliddāga harake hottiddīni — huṣārāgi manege bandre tāyige eṇṇe dīpa hachtīni anta.
    en: Tomorrow's Friday. In the morning I have to go to the Banashankari temple. I made a vow while I was in hospital — that if I came home well, I'd light an oil lamp for the Mother.
  - who: appa
    t: ಅಮ್ಮಾ, ಶುಕ್ರವಾರ ಬನಶಂಕರಿಯಲ್ಲಿ ಎಷ್ಟು ರಶ್ ಇರುತ್ತೆ ಗೊತ್ತಲ್ವಾ? ಕ್ಯೂನಲ್ಲಿ ಒಂದು ಗಂಟೆ ನಿಲ್ಲಬೇಕು. ಡಾಕ್ಟ್ರು ಒಂದು ತಿಂಗಳು ಆರಾಮಾಗಿರಿ ಅಂದಿದ್ದಾರೆ.
    tr: Ammā, shukravāra Banashaṅkariyalli eṣṭu rash irutte gottalvā? Kyūnalli ondu gaṇṭe nillabēku. Ḍākṭru ondu tiṅgaḷu ārāmāgiri andiddāre.
    en: Amma, you know how crowded Banashankari is on a Friday, don't you? You'd stand in the queue for an hour. The doctor said to take it easy for a month.
  - who: ajji
    t: ಬನಶಂಕರಮ್ಮ ನನ್ನನ್ನ ಉಳಿಸಿದ್ದಾಳೆ. ಅವಳಿಗೆ ಕೈ ಮುಗಿಯೋಕೂ ಡಾಕ್ಟ್ರ ಪರ್ಮಿಷನ್ ಬೇಕಾ? ಮನೇಲೇ ಮಲಗಿದ್ರೆ ನಾನು ಇನ್ನೂ ಕಾಯಿಲೆ ಬೀಳ್ತೀನಿ.
    tr: Banashaṅkaramma nannanna uḷisiddāḷe. Avaḷige kai mugiyōkū ḍākṭra parmiṣan bēkā? Manēlē malagidre nānu innū kāyile bīḷtīni.
    en: Mother Banashankari saved me. Do I need the doctor's permission even to fold my hands before her? If I just lie around at home, I'll only get sicker.
  - who: kiran
    t: ಅಜ್ಜಿ, ನಿಮ್ಮನ್ನ ಉಳಿಸಿದ್ದು ಬನಶಂಕರಮ್ಮನೂ ಹೌದು, ಡಾಕ್ಟರ್ ಮೀರಾ ಕುಲಕರ್ಣಿನೂ ಹೌದು. ಇಬ್ರ ಮಾತೂ ಕೇಳಿ.
    tr: Ajji, nimmanna uḷisiddu Banashaṅkarammanū haudu, ḍākṭar Mīrā Kulakarṇinū haudu. Ibra mātū kēḷi.
    en: Ajji, the one who saved you was Banashankari, yes — and Dr. Meera Kulkarni too. Listen to both of them.
  - who: ajji
    t: ಇವನಿಗೆ ಬಾಯಿ ಜಾಸ್ತಿ ಆಗಿದೆ ಇತ್ತೀಚೆಗೆ.
    tr: Ivanige bāyi jāsti āgide ittīchege.
    en: This one's got a lot of mouth on him lately. (but she's smiling)
  - who: sam
    t: ಒಂದು ಐಡಿಯಾ. ಶುಕ್ರವಾರ, ಮಂಗಳವಾರ ತುಂಬಾ ರಶ್. ಬುಧವಾರ ಬೆಳಿಗ್ಗೆ ಏಳು ಗಂಟೆಗೆ ಕಮ್ಮಿ ಇರುತ್ತೆ. ನಾನು ಕಾರ್ ತಗೊಂಡ್ ಬರ್ತೀನಿ, ಗೇಟ್ ಹತ್ರಾನೇ ಇಳಿಸ್ತೀನಿ. ದೀಪ ಹಚ್ಚಿ, ಹತ್ತು ನಿಮಿಷದಲ್ಲಿ ವಾಪಸ್.
    tr: Ondu aiḍiyā. Shukravāra, maṅgaḷavāra tumbā rash. Budhavāra beḷigge ēḷu gaṇṭege kammi irutte. Nānu kār tagoṇḍ bartīni, gēṭ hatrānē iḷistīni. Dīpa hachchi, hattu nimiṣadalli vāpas.
    en: An idea. Fridays and Tuesdays are very crowded. Wednesday at seven in the morning it's quieter. I'll bring the car and drop you right at the gate. Light the lamp, and we're back in ten minutes.
  - who: appa
    t: ಸರಿ. ಆದ್ರೆ ಒಂದು ಕಂಡೀಷನ್ — ನಾಳೆಯಿಂದ ದಿನಾ ಬೆಳಿಗ್ಗೆ ಟೆರೇಸ್ ಮೇಲೆ ಹತ್ತು ನಿಮಿಷ ವಾಕಿಂಗ್. ಒಂದು ದಿನಾನೂ ತಪ್ಪಿಸಬಾರದು.
    tr: Sari. Ādre ondu kaṇḍīṣan — nāḷeyinda dinā beḷigge ṭerēs mēle hattu nimiṣa vākiṅg. Ondu dinānū tappisabāradu.
    en: All right. But one condition — from tomorrow, a ten-minute walk on the terrace every morning. You mustn't skip a single day.
  - who: ajji
    t: ಟೆರೇಸ್‌ಗೆ ಮೆಟ್ಟಿಲು ಹತ್ತಬೇಕಲ್ಲೋ!
    tr: Ṭerēsge meṭṭilu hattabēkallō!
    en: But I'd have to climb the stairs to the terrace!
  - who: sam
    t: ನಿಧಾನವಾಗಿ ಹತ್ತಬಹುದು ಅಂತ ಡಾಕ್ಟ್ರೇ ಹೇಳಿದ್ರು. ನಾನು ಆಫೀಸಿಗೆ ಹೋಗೋ ಮುಂಚೆ ಜೊತೆಗೆ ಬರ್ತೀನಿ. ನನಗೂ ವ್ಯಾಯಾಮ ಆಗುತ್ತೆ.
    tr: Nidhānavāgi hattabahudu anta ḍākṭrē hēḷidru. Nānu āphīsige hōgō munche jotege bartīni. Nanagū vyāyāma āgutte.
    en: The doctor herself said you can climb slowly. I'll come with you before I leave for the office. I'll get some exercise too.
  - who: kiran
    t: ಮತ್ತೆ ಮುಂದಿನ ವಾರದಿಂದ ಜಯದೇವದಲ್ಲಿ ಕಾರ್ಡಿಯಾಕ್ ರಿಹ್ಯಾಬ್ ಶುರು. ಅವರು ಕೊಡೋ ದಿನಗಳಲ್ಲಿ ನಾನು ಕಾಲೇಜ್ ಮುಗಿಸ್ಕೊಂಡು ಕರ್ಕೊಂಡ್ ಹೋಗ್ತೀನಿ.
    tr: Matte mundina vāradinda Jayadēvadalli kārḍiyāk rihyāb shuru. Avaru koḍō dinagaḷalli nānu kālēj mugiskoṇḍu karkoṇḍ hōgtīni.
    en: And cardiac rehab at Jayadeva starts next week. On the days they give us, I'll take her after college.
  - scene: The doorbell. Vimala Aunty walks in with a box of sweets.
  - who: vimala
    t: ಸರಸ್ವತಮ್ಮಾ! ಹೇಗಿದ್ದೀರಿ? ನಿಮಗೋಸ್ಕರ ತುಪ್ಪದ ಮೈಸೂರ್ ಪಾಕ್ ತಂದಿದ್ದೀನಿ!
    tr: Sarasvatammā! Hēgiddīri? Nimagōskara tuppada Maisūr pāk tandiddīni!
    en: Saraswathamma! How are you? I've brought you ghee Mysore pak!
  - who: amma
    t: ಅಯ್ಯೋ ವಿಮಲಾ, ಸಿಹಿ ಬೇಡ ಅಂತ ಡಾಕ್ಟ್ರು…
    tr: Ayyō Vimalā, sihi bēḍa anta ḍākṭru…
    en: Oh, Vimala, the doctor said no sweets…
  - who: vimala
    t: ಅಯ್ಯೋ, ಮರೆತೇ ಹೋಯ್ತು! ಸರಿ ಬಿಡಿ, ಇದು ಕಿರಣ್‌ಗೆ, ಸ್ಯಾಮ್‌ಗೆ. ಅಜ್ಜಿಗೆ ಮುಂದಿನ ಸಲ ಹಣ್ಣು ತರ್ತೀನಿ — ಪಪ್ಪಾಯಿ, ಹಾರ್ಟ್‌ಗೆ ಒಳ್ಳೇದಂತೆ.
    tr: Ayyō, maretē hōytu! Sari biḍi, idu Kiraṇge, Syāmge. Ajjige mundina sala haṇṇu tartīni — pappāyi, hārṭge oḷḷēdante.
    en: Oh no, I completely forgot! Never mind — this is for Kiran and Sam. Next time I'll bring fruit for Ajji — papaya, they say it's good for the heart.
  - who: ajji
    t: ಪಪ್ಪಾಯಿ ತಂದ್ರೆ ನಾನೇ ತಿಂತೀನಿ. ಶ್ವೇತಾ ಕಣ್ಣಿಗೆ ಮಾತ್ರ ಬೀಳದ ಹಾಗೆ ಇಡು!
    tr: Pappāyi tandre nānē tintīni. Shwētā kaṇṇige mātra bīḷada hāge iḍu!
    en: If you bring papaya, I'll eat it myself. Just keep it out of Shwetha's sight!
  - who: vimala
    t: ಮತ್ತೆ ಕೇಳಿದ್ರಾ? ಶ್ವೇತಾಳ ಅತ್ತೆ ಆಸ್ಪತ್ರೆಗೆ ಊಟ ತಗೊಂಡ್ ಬಂದಿದ್ರಂತೆ! ಮದುವೆ ಟೈಮಲ್ಲಿ ಹಾಗೆ ಆಡಿದೋರು, ಈಗ ಹೀಗೆ!
    tr: Matte kēḷidrā? Shwētāḷa atte āspatrege ūṭa tagoṇḍ bandidrante! Maduve ṭaimalli hāge āḍidōru, īga hīge!
    en: And did you hear? Shwetha's mother-in-law brought food to the hospital, apparently! The same woman who behaved like that at the wedding time — and now this!
  - who: amma
    t: ವಿಮಲಾ, ಅದು ಮುಗಿದ ಕಥೆ. ಕಷ್ಟದಲ್ಲಿ ಜೊತೆಗೆ ನಿಂತೋರೇ ನಮ್ಮೋರು.
    tr: Vimalā, adu mugida kathe. Kaṣṭadalli jotege nintōrē nammōru.
    en: Vimala, that story is over. Those who stand by you in hard times — they're our own people.
  - section: 🩺 The 28-week check and a borderline sugar test
    learn: '‑iddāga (while) · bārḍarlain, ḍayaṭ kaṇṭrōl · grōth skyān · maguvina chalane, odeyōdu (baby''s movement, kicking) · numbers: nūrā mūvatteṇṭu · ‑ade (without): kāyade · doctor''s hedging'
  - scene: Monday, 24 August, a little over a week after the discharge. Dr. Usha Rao's clinic in JP Nagar. Shwetha is twenty-eight weeks pregnant; her 28-week check, a growth scan and a repeat sugar test, had been put off for a few days while Ajji was in hospital. Pradeep is with her.
  - who: gyn
    t: ಬನ್ನಿ ಶ್ವೇತಾ, ಕೂತ್ಕೊಳ್ಳಿ. ಮೊದಲು ಅಜ್ಜಿ ಹೇಗಿದ್ದಾರೆ? ನೀವು ಫೋನ್‌ನಲ್ಲಿ ಹೇಳಿದಾಗ ನನಗೂ ಗಾಬರಿ ಆಗಿತ್ತು.
    tr: Banni Shwētā, kūtkoḷḷi. Modalu ajji hēgiddāre? Nīvu phōnnalli hēḷidāga nanagū gābari āgittu.
    en: Come in, Shwetha, have a seat. First, how is your grandmother? When you told me on the phone, I was alarmed too.
  - who: shwe
    t: ಈಗ ಮನೇಲಿದ್ದಾರೆ ಡಾಕ್ಟ್ರೇ. ದೇವಸ್ಥಾನಕ್ಕೆ ಹೋಗ್ಬೇಕು ಅಂತ ಹಠ ಮಾಡ್ತಿದ್ದಾರೆ — ಅಂದ್ರೆ ಹುಷಾರಾಗ್ತಿದ್ದಾರೆ ಅಂತ ಅರ್ಥ!
    tr: Īga manēliddāre ḍākṭrē. Dēvasthānakke hōgbēku anta haṭha māḍtiddāre — andre huṣārāgtiddāre anta artha!
    en: She's home now, Doctor. She's being stubborn about going to the temple — which means she's getting better!
  - who: gyn
    t: ಒಳ್ಳೇದು. ಈಗ ನಿಮ್ ರಿಪೋರ್ಟ್. ಮೊದಲು ಗ್ರೋತ್ ಸ್ಕ್ಯಾನ್ — ಮಗು ಸುಮಾರು ಒಂದು ಕೆಜಿ ಇನ್ನೂರು ಗ್ರಾಂ ಇದೆ, ಬೆಳವಣಿಗೆ ವಾರಕ್ಕೆ ತಕ್ಕ ಹಾಗೆ ಇದೆ. ನೀರು ನಾರ್ಮಲ್, ಪ್ಲಸೆಂಟಾ ಸರಿಯಾದ ಜಾಗದಲ್ಲಿದೆ. ಹೃದಯದ ನಾಲ್ಕು ಕೋಣೆಗಳೂ ಚೆನ್ನಾಗಿ ಕೆಲಸ ಮಾಡ್ತಿವೆ, ಹಾರ್ಟ್‌ಬೀಟ್ ನೂರಾ ನಲವತ್ತೈದು. ಜೂನ್‌ನಲ್ಲಿ ಮಾಡಿದ ಲೆವೆಲ್ ಟೂ ಸ್ಕ್ಯಾನ್ ಕೂಡ ನಾರ್ಮಲ್ ಇತ್ತು, ನೆನಪಿದೆ ತಾನೇ?
    tr: Oḷḷēdu. Īga nim ripōrṭ. Modalu grōth skyān — magu sumāru ondu keji innūru grām ide, beḷavaṇige vārakke takka hāge ide. Nīru nārmal, plaseṇṭā sariyāda jāgadallide. Hṛdayada nālku kōṇegaḷū chennāgi kelasa māḍtive, hārṭbīṭ nūrā nalavattaidu. Jūn-nalli māḍida leval ṭū skyān kūḍa nārmal ittu, nenapide tānē?
    en: 'Good. Now your reports. First the growth scan: the baby weighs about one kilo two hundred grams, and the growth matches the weeks. The fluid is normal and the placenta is in the right place. All four chambers of the heart are working well; the heartbeat is a hundred and forty-five. And the Level-2 scan we did in June was normal too, remember?'
  - who: pradeep
    t: ಹೃದಯದ ನಾಲ್ಕು ಕೋಣೆ… ಈ ತಿಂಗಳು ನಮ್ಮ ಮನೇಲಿ ಎಲ್ರೂ ಹೃದಯದ ಬಗ್ಗೆನೇ ಮಾತಾಡ್ತಿದ್ದೀವಿ.
    tr: Hṛdayada nālku kōṇe… ī tiṅgaḷu namma manēli elrū hṛdayada baggenē mātāḍtiddīvi.
    en: Four chambers of the heart… this month everyone in our family talks about nothing but hearts.
  - who: shwe
    t: ನಿಜವಾಗ್ಲೂ ಎಲ್ಲಾ ಸರಿ ಇದೆ ತಾನೇ ಡಾಕ್ಟ್ರೇ? ಅಜ್ಜಿ ಐಸಿಯುನಲ್ಲಿದ್ದಾಗ ನಾನು ತುಂಬಾ ಅತ್ತಿದ್ದೀನಿ, ನಿದ್ದೆ ಇಲ್ಲ, ಸರಿಯಾಗಿ ಊಟ ಇಲ್ಲ. ಅದರಿಂದ ಮಗುವಿಗೆ ಏನಾದ್ರೂ ತೊಂದ್ರೆ ಆಗಿದ್ರೆ ಅಂತ ಭಯ ಆಗ್ತಿತ್ತು.
    tr: Nijavāglū ellā sari ide tānē ḍākṭrē? Ajji ICU-nalliddāga nānu tumbā attiddīni, nidde illa, sariyāgi ūṭa illa. Adarinda maguvige ēnādrū tondre āgidre anta bhaya āgtittu.
    en: Everything really is fine, isn't it, Doctor? While Ajji was in the ICU I cried a lot — no sleep, no proper meals. I was scared it might have harmed the baby somehow.
  - who: gyn
    t: ನೋಡಿ, ಸ್ಕ್ಯಾನ್ ಎಲ್ಲವನ್ನೂ ಹಿಡಿಯೋಕಾಗಲ್ಲ, ಅದು ನಿಜ. ಆದ್ರೆ ಇವತ್ತು ನೋಡಬಹುದಾದ್ದೆಲ್ಲಾ ಚೆನ್ನಾಗಿದೆ. ಕೆಲವು ದಿನದ ಟೆನ್ಶನ್‌ನಿಂದ ಮಗುವಿಗೆ ಏನೂ ಆಗಲ್ಲ. ಈಗ ತಾಯಿ ತನ್ನನ್ನ ತಾನು ನೋಡ್ಕೊಂಡ್ರೆ ಸಾಕು. ಮಗು ಒದೀತಿದೆಯಾ?
    tr: Nōḍi, skyān ellavannū hiḍiyōkāgalla, adu nija. Ādre ivattu nōḍabahudāddellā chennāgide. Kelavu dinada ṭenshanninda maguvige ēnū āgalla. Īga tāyi tannanna tānu nōḍkoṇḍre sāku. Magu odītideyā?
    en: Look, a scan can't catch everything, that's true. But everything that can be seen today looks good. A few days of stress won't harm the baby. Now it's enough if the mother looks after herself. Is the baby kicking?
  - who: shwe
    t: ಹೌದು, ತುಂಬಾ! ರಾತ್ರಿ ಮಲಗಿದಾಗಂತೂ ಫುಟ್‌ಬಾಲ್ ಆಟಗಾರನ ಥರ ಒದೀತಾಳೆ… ಒದೀತಾನೆ… ಗೊತ್ತಿಲ್ಲ! ಮೊನ್ನೆ ಪ್ರದೀಪ್ ಹೊಟ್ಟೆ ಮೇಲೆ ಕೈ ಇಟ್ಟಾಗ ಅವನಿಗೂ ಗೊತ್ತಾಯ್ತು.
    tr: Haudu, tumbā! Rātri malagidāgantū phuṭbāl āṭagārana thara odītāḷe… odītāne… gottilla! Monne Pradīp hoṭṭe mēle kai iṭṭāga avanigū gottāytu.
    en: Yes, a lot! Especially at night when I lie down — she kicks like a footballer… or he does… who knows! The other day Pradeep put his hand on my belly and felt it too.
  - who: gyn
    t: 'ಜೋರಾಗಿ ಒದೆಯೋದು ಒಳ್ಳೆ ಲಕ್ಷಣ. ಇನ್ಮೇಲೆ ಗಮನಿಸ್ತಾ ಇರಿ: ಯಾವತ್ತಾದ್ರೂ ಮಾಮೂಲಿಗಿಂತ ತುಂಬಾ ಕಮ್ಮಿ ಒದ್ದಂತೆ ಅನ್ಸಿದ್ರೆ ಕಾಯಬೇಡಿ, ತಕ್ಷಣ ಬನ್ನಿ. ಈಗ ಇನ್ನೊಂದು ರಿಪೋರ್ಟ್ — ಶುಗರ್ ಟೆಸ್ಟ್. ಜುಲೈನಲ್ಲಿ, ಇಪ್ಪತ್ನಾಲ್ಕನೇ ವಾರದಲ್ಲಿ, ಟೆಸ್ಟ್ ನೂರಾ ಇಪ್ಪತ್ತೆಂಟು ಬಂದಿತ್ತು, ಅದು ಸರಿ ಇತ್ತು. ಆದ್ರೆ ನಿಮ್ ಕುಟುಂಬದಲ್ಲಿ ಶುಗರ್ ಇರೋದ್ರಿಂದ ಇಪ್ಪತ್ತೆಂಟನೇ ವಾರದಲ್ಲಿ ರಿಪೀಟ್ ಮಾಡಿದ್ವಿ. ಈ ಸಲ ಗ್ಲೂಕೋಸ್ ಕುಡಿದು ಎರಡು ಗಂಟೆ ಆದ್ಮೇಲೆ ನೂರಾ ಮೂವತ್ತೆಂಟು ಬಂದಿದೆ.'
    tr: 'Jōrāgi odeyōdu oḷḷe lakṣaṇa. Inmēle gamanistā iri: yāvattādrū māmūliginta tumbā kammi oddante ansidre kāyabēḍi, takṣaṇa banni. Īga innondu ripōrṭ — shugar ṭesṭ. Julai-nalli, ippatnālkanē vāradalli, ṭesṭ nūrā ippatteṇṭu bandittu, adu sari ittu. Ādre nim kuṭumbadalli shugar irōdrinda ippatteṇṭanē vāradalli ripīṭ māḍidvi. Ī sala glūkōs kuḍidu eraḍu gaṇṭe ādmēle nūrā mūvatteṇṭu bandide.'
    en: 'Strong kicks are a good sign. From now on, keep track: if one day the baby seems to move much less than usual, don''t wait — come in straight away. Now the other report — the sugar test. In July, at twenty-four weeks, the test came to a hundred and twenty-eight, which was fine. But because there''s diabetes in your family, we repeated it at twenty-eight weeks. This time, two hours after the glucose drink, it''s one hundred and thirty-eight.'
  - who: pradeep
    t: ನೂರಾ ಮೂವತ್ತೆಂಟು ಅಂದ್ರೆ ಜಾಸ್ತಿನಾ?
    tr: Nūrā mūvatteṇṭu andre jāstinā?
    en: Is a hundred and thirty-eight high?
  - who: gyn
    t: ನೂರಾ ನಲವತ್ತು ದಾಟಿದ್ರೆ ಜೆಸ್ಟೇಷನಲ್ ಡಯಾಬಿಟೀಸ್ ಅಂತೀವಿ — ಗರ್ಭಾವಸ್ಥೆಯ ಶುಗರ್. ನಿಮ್ದು ಬಾರ್ಡರ್‌ಲೈನ್, ಗೆರೆ ಹತ್ರ ಇದೆ. ಈಗ ಮಾತ್ರೆ, ಇನ್ಸುಲಿನ್ ಏನೂ ಬೇಡ. ಆದ್ರೆ ಡಯಟ್ ಬದಲಾಯಿಸ್ಬೇಕು. ಮೂವತ್ನಾಲ್ಕನೇ ವಾರದಲ್ಲಿ ಇನ್ನೊಂದು ಗ್ರೋತ್ ಸ್ಕ್ಯಾನ್ ಮಾಡ್ತೀವಿ.
    tr: Nūrā nalavattu dāṭidre jesṭēṣanal ḍayābiṭīs antīvi — garbhāvastheya shugar. Nimdu bārḍarlain, gere hatra ide. Īga mātre, insulin ēnū bēḍa. Ādre ḍayaṭ badalāyisbēku. Mūvatnālkanē vāradalli innondu grōth skyān māḍtīvi.
    en: Above one hundred and forty we call it gestational diabetes — pregnancy sugar. Yours is borderline, close to the line. No tablets or insulin for now. But the diet has to change. We'll do another growth scan at thirty-four weeks.
  - who: shwe
    t: ಅಂದ್ರೆ ಸಿಹಿ ಪೂರ್ತಿ ಬಿಡ್ಬೇಕಾ? ಅಮ್ಮ ದಿನಾ ತುಪ್ಪ, ಡ್ರೈ ಫ್ರೂಟ್ ಉಂಡೆ ಕಳಿಸ್ತಾರೆ — 'ಇಬ್ಬರಿಗೆ ತಿನ್ನು' ಅಂತ.
    tr: Andre sihi pūrti biḍbēkā? Amma dinā tuppa, ḍrai phrūṭ uṇḍe kaḷistāre — 'ibbarige tinnu' anta.
    en: So I have to give up sweets completely? Amma sends ghee and dry-fruit laddus every day — 'eat for two', she says.
  - who: gyn
    t: ಇಬ್ಬರಿಗಲ್ಲ, ಒಂದೂ ಕಾಲು ಜನಕ್ಕೆ ತಿನ್ನಿ! ಸಕ್ಕರೆ, ಸ್ವೀಟ್, ಜ್ಯೂಸ್, ಮೈದಾ ಬೇಡ. ಬಿಳಿ ಅನ್ನ ಕಮ್ಮಿ; ರಾಗಿ, ಬೇಳೆ, ಸೊಪ್ಪು, ತರಕಾರಿ ಜಾಸ್ತಿ. ಮೂರು ದೊಡ್ಡ ಊಟದ ಬದಲು ಐದಾರು ಸಲ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ. ಊಟ ಆದ್ಮೇಲೆ ಹತ್ತು-ಹದಿನೈದು ನಿಮಿಷ ನಿಧಾನವಾಗಿ ನಡೀರಿ. ಉಂಡೆ ದಿನಕ್ಕೆ ಒಂದು ಸಾಕು — ಡಾಕ್ಟರ್ ಹೇಳಿದ್ರು ಅಂತ ಅಮ್ಮನಿಗೆ ಹೇಳಿ.
    tr: Ibbarigalla, ondū kālu janakke tinni! Sakkare, svīṭ, jyūs, maidā bēḍa. Biḷi anna kammi; rāgi, bēḷe, soppu, tarakāri jāsti. Mūru doḍḍa ūṭada badalu aidāru sala svalpa svalpa. Ūṭa ādmēle hattu-hadinaidu nimiṣa nidhānavāgi naḍīri. Uṇḍe dinakke ondu sāku — ḍākṭar hēḷidru anta ammanige hēḷi.
    en: Not for two — eat for one and a quarter! No sugar, sweets, juice or maida. Less white rice; more ragi, dal, greens and vegetables. Instead of three big meals, five or six small ones. Walk slowly for ten or fifteen minutes after eating. One laddu a day is enough — tell your mother the doctor said so.
  - who: pradeep
    t: ಮನೇಲಿ ಗ್ಲೂಕೋಮೀಟರ್ ತಗೊಂಡು ಚೆಕ್ ಮಾಡ್ಬೇಕಾ ಮೇಡಂ?
    tr: Manēli glūkōmīṭar tagoṇḍu chek māḍbēkā mēḍam?
    en: Should we buy a glucometer and check at home, madam?
  - who: gyn
    t: ಹೌದು. ವಾರಕ್ಕೆ ಎರಡು ದಿನ — ಬೆಳಿಗ್ಗೆ ಖಾಲಿ ಹೊಟ್ಟೆಯಲ್ಲಿ, ಮತ್ತೆ ಊಟ ಆಗಿ ಎರಡು ಗಂಟೆ ಆದ್ಮೇಲೆ — ಚೆಕ್ ಮಾಡಿ, ಒಂದು ಪುಸ್ತಕದಲ್ಲಿ ಬರೆದಿಡಿ. ಮುಂದಿನ ಸಲ ತಗೊಂಡ್ ಬನ್ನಿ. ಹೆದರಬೇಡಿ — ಎಷ್ಟೋ ಜನರಿಗೆ ಡಯಟ್‌ನಿಂದಲೇ ಕಂಟ್ರೋಲ್ ಆಗುತ್ತೆ.
    tr: Haudu. Vārakke eraḍu dina — beḷigge khāli hoṭṭeyalli, matte ūṭa āgi eraḍu gaṇṭe ādmēle — chek māḍi, ondu pustakadalli barediḍi. Mundina sala tagoṇḍ banni. Hedarabēḍi — eṣṭō janarige ḍayaṭnindalē kaṇṭrōl āgutte.
    en: Yes. Two days a week — on an empty stomach in the morning, and two hours after a meal — check and write it down in a notebook. Bring it next time. Don't be afraid — for lots of women, diet alone keeps it under control.
  - section: 🌙 Two worries
    learn: 'emotions with nuance: aparādha bhāva (guilt), samādhāna, nemmadi · ‑ōvaregū (until) · aṣṭaralli (by then / meanwhile) · blessing ‑iru, ‑ali'
  - scene: That night, the flat in JP Nagar. Shwetha sits on the balcony with her phone. The new glucometer is still in its box on the table.
  - who: pradeep
    t: ಇನ್ನೂ ನಿದ್ದೆ ಬಂದಿಲ್ವಾ? ಡಾಕ್ಟ್ರು ಸ್ಕ್ಯಾನ್ ಎಲ್ಲಾ ನಾರ್ಮಲ್ ಅಂದ್ರಲ್ಲ.
    tr: Innū nidde bandilvā? Ḍākṭru skyān ellā nārmal andralla.
    en: Still can't sleep? The doctor said the scan was all normal.
  - who: shwe
    t: ಸ್ಕ್ಯಾನ್ ನಾರ್ಮಲ್, ಹೌದು. ಆದ್ರೆ ಆ ಶುಗರ್ ನಂಬರ್ ತಲೆಯಿಂದ ಹೋಗ್ತಿಲ್ಲ. ಒಂದು ಕಡೆ ಅಜ್ಜಿ, ಇನ್ನೊಂದು ಕಡೆ ಮಗು. ಯಾರ ಬಗ್ಗೆ ಮೊದಲು ಚಿಂತೆ ಮಾಡ್ಬೇಕು ಅಂತಾನೇ ಗೊತ್ತಾಗ್ತಿಲ್ಲ.
    tr: Skyān nārmal, haudu. Ādre ā shugar nambar taleyinda hōgtilla. Ondu kaḍe ajji, innondu kaḍe magu. Yāra bagge modalu chinte māḍbēku antānē gottāgtilla.
    en: The scan's normal, yes. But that sugar number won't leave my head. Ajji on one side, the baby on the other. I don't even know whom to worry about first.
  - who: pradeep
    t: ಯಾರ ಬಗ್ಗೆನೂ ನೀನೊಬ್ಬಳೇ ಚಿಂತೆ ಮಾಡ್ಬೇಡ. ಅದಕ್ಕೇ ನಾನಿದ್ದೀನಿ, ನಿಮ್ ಅಪ್ಪ-ಅಮ್ಮ, ಕಿರಣ್, ಸ್ಯಾಮ್ — ಇಷ್ಟು ಜನ ಇದ್ದೀವಿ.
    tr: Yāra baggenū nīnobbaḷē chinte māḍbēḍa. Adakkē nāniddīni, nim appa-amma, Kiraṇ, Syām — iṣṭu jana iddīvi.
    en: Don't worry about anyone all by yourself. That's what I'm here for — and your parents, Kiran, Sam — there are so many of us.
  - who: shwe
    t: ಗೊತ್ತು. ಆದ್ರೆ ಒಂದು ಅಪರಾಧ ಭಾವ ಇದೆ ಪ್ರದೀಪ್. ಅಜ್ಜಿ ಐಸಿಯುನಲ್ಲಿದ್ದಾಗ ನಾನು ಗ್ಲಾಸ್ ಹೊರಗೆ ನಿಂತಿದ್ದೆ ಅಷ್ಟೇ. ಎಲ್ರೂ 'ನೀನು ಬರ್ಬೇಡ, ನಿನ್ ಆರೋಗ್ಯ ನೋಡ್ಕೋ' ಅಂತಿದ್ರು. ಅವರಿಗೆ ನಾನು ಬೇಕಾದಾಗ ನಾನು ದೂರ ಇದ್ದೆ.
    tr: Gottu. Ādre ondu aparādha bhāva ide Pradīp. Ajji ICU-nalliddāga nānu glās horage nintidde aṣṭē. Elrū 'nīnu barbēḍa, nin ārōgya nōḍkō' antidru. Avarige nānu bēkādāga nānu dūra idde.
    en: I know. But I feel guilty, Pradeep. While Ajji was in the ICU, all I did was stand outside the glass. Everyone kept saying 'don't come, look after your own health'. When she needed me, I was far away.
  - who: pradeep
    t: ನೀನು ದೂರ ಇರ್ಲಿಲ್ಲ. ಅಜ್ಜಿ ಐಸಿಯುನಿಂದ ಹೊರಗೆ ಬಂದ ತಕ್ಷಣ ಮೊದಲು ಕೇಳಿದ್ದು ಏನು? 'ಶ್ವೇತಾ ಎಲ್ಲಿ?' ಅಂತ. ಅವರನ್ನ ಬದುಕಿಸ್ತಿರೋದೇ ನಿನ್ ಹೊಟ್ಟೇಲಿರೋ ಈ ಮಗು ಅನ್ಸುತ್ತೆ ನನಗೆ.
    tr: Nīnu dūra irlilla. Ajji ICU-ninda horage banda takṣaṇa modalu kēḷiddu ēnu? 'Shwētā elli?' anta. Avaranna badukistirōdē nin hoṭṭēlirō ī magu ansutte nanage.
    en: You weren't far away. The moment Ajji came out of the ICU, what was the first thing she asked? 'Where's Shwetha?' I feel it's this baby in your belly that's keeping her alive.
  - scene: Shwetha's phone rings. It's Ajji, on Kiran's phone.
  - who: shwe
    t: ಅಜ್ಜಿ! ಈ ಹೊತ್ತಲ್ಲಿ? … ಹಲೋ ಅಜ್ಜಿ, ಎಲ್ಲಾ ಸರಿ ತಾನೇ? ಎದೆ ನೋವು ಏನೂ ಇಲ್ಲ ತಾನೇ?
    tr: Ajji! Ī hottalli? … Halō ajji, ellā sari tānē? Ede nōvu ēnū illa tānē?
    en: Ajji! At this hour? … Hello, Ajji, everything's all right, isn't it? No chest pain or anything?
  - who: ajji
    t: ಏನೂ ಇಲ್ಲ ಕಣೇ, ಗಾಬರಿ ಆಗ್ಬೇಡ. ಕಿರಣ್ ಫೋನ್ ಮಾಡ್ಕೊಟ್ಟ. ನಿನ್ ಸ್ಕ್ಯಾನ್ ಏನಾಯ್ತು ಅಂತ ಕೇಳೋಕೆ ಕಾಯ್ತಿದ್ದೆ. ಮಗು ಹೇಗಿದೆ?
    tr: Ēnū illa kaṇē, gābari āgbēḍa. Kiraṇ phōn māḍkoṭṭa. Nin skyān ēnāytu anta kēḷōke kāytidde. Magu hēgide?
    en: Nothing at all, dear, don't panic. Kiran dialled for me. I was waiting up to ask how your scan went. How's the baby?
  - who: shwe
    t: ಮಗು ಚೆನ್ನಾಗಿದೆ ಅಜ್ಜಿ, ಎಲ್ಲಾ ನಾರ್ಮಲ್. ಆದ್ರೆ ನನಗೆ ಶುಗರ್ ಸ್ವಲ್ಪ ಬಾರ್ಡರ್‌ಲೈನ್ ಅಂತೆ. ಇನ್ಮೇಲೆ ಸಿಹಿ ಕಮ್ಮಿ, ವಾಕಿಂಗ್ ಜಾಸ್ತಿ.
    tr: Magu chennāgide ajji, ellā nārmal. Ādre nanage shugar svalpa bārḍarlain ante. Inmēle sihi kammi, vākiṅg jāsti.
    en: The baby's fine, Ajji, everything's normal. But apparently my sugar is a bit borderline. From now on, fewer sweets and more walking.
  - who: ajji
    t: ಹಾಗಾದ್ರೆ ನಾವಿಬ್ರೂ ಪಥ್ಯದವರು! ನಾನು ಉಪ್ಪು ಬಿಡ್ತೀನಿ, ನೀನು ಸಿಹಿ ಬಿಡು. ಇಬ್ರೂ ಸೇರಿ ಡಾಕ್ಟ್ರುಗಳಿಗೆ ಬೈಯೋಣ.
    tr: Hāgādre nāvibrū pathyadavaru! Nānu uppu biḍtīni, nīnu sihi biḍu. Ibrū sēri ḍākṭrugaḷige baiyōṇa.
    en: Then we're both on a diet! I'll give up salt, you give up sweets. And the two of us together will grumble about the doctors.
  - who: shwe
    t: ಡೀಲ್ ಅಜ್ಜಿ! ನಾಳೆ ಬೆಳಿಗ್ಗೆ ನೀವು ಟೆರೇಸ್ ಮೇಲೆ ನಡೀರಿ, ನಾನು ಇಲ್ಲಿ ಪಾರ್ಕ್‌ನಲ್ಲಿ ನಡೀತೀನಿ — ವೀಡಿಯೋ ಕಾಲ್‌ನಲ್ಲಿ ಒಟ್ಟಿಗೆ!
    tr: Ḍīl ajji! Nāḷe beḷigge nīvu ṭerēs mēle naḍīri, nānu illi pārknalli naḍītīni — vīḍiyō kālnalli oṭṭige!
    en: (laughing) Deal, Ajji! Tomorrow morning you walk on the terrace and I'll walk in the park here — together, on a video call!
  - who: ajji
    t: ನೋಡು ಮಗು, ಆ ಮಗುನ ನನ್ನ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ. ಅಷ್ಟರಲ್ಲಿ ನೀನೂ ಆರೋಗ್ಯವಾಗಿರು, ನಾನೂ ಆರೋಗ್ಯವಾಗಿರ್ತೀನಿ. ಈಗ ನೆಮ್ಮದಿಯಾಗಿ ಮಲಗು.
    tr: Nōḍu magu, ā maguna nanna kaiyalli ettikoḷḷōvaregū nānu ellū hōgalla. Aṣṭaralli nīnū ārōgyavāgiru, nānū ārōgyavāgirtīni. Īga nemmadiyāgi malagu.
    en: Listen, child — I'm not going anywhere until I hold that baby in my arms. Until then, you stay healthy, and I'll stay healthy. Now go to sleep in peace.
  - who: pradeep
    t: ನೋಡಿದ್ಯಾ? ಡಾಕ್ಟ್ರು ಹೇಳೋದಕ್ಕಿಂತ ಅಜ್ಜಿ ಹೇಳೋದೇ ಜಾಸ್ತಿ ಕೆಲಸ ಮಾಡುತ್ತೆ.
    tr: Nōḍidyā? Ḍākṭru hēḷōdakkinta ajji hēḷōdē jāsti kelasa māḍutte.
    en: See? What Ajji says works better than anything the doctors say.
  - chapter: Chapter 5 — Work and leave
  - section: 💼 One-on-one with Nikhil
    learn: 'request ladder: mātāḍbēkāgittu, koḍbahudā? · intention ‑bēku anta iddīni · herige raje / meṭarniṭi līv · hedging: ‑ante, kanpharm māḍkoḷḷi · hyāṇḍōvar · ‑aṣṭaralli (by the time)'
  - scene: Early September. A small meeting room in Shwetha's office on the Outer Ring Road. Her manager Nikhil has just closed his laptop.
  - who: shwe
    t: ನಿಖಿಲ್, ಹತ್ತು ನಿಮಿಷ ಸಿಗುತ್ತಾ? ನನ್ನ ಲೀವ್ ಪ್ಲಾನ್ ಬಗ್ಗೆ ಮಾತಾಡ್ಬೇಕಾಗಿತ್ತು.
    tr: Nikhil, hattu nimiṣa siguttā? Nanna līv plān bagge mātāḍbēkāgittu.
    en: Nikhil, do you have ten minutes? I wanted to talk about my leave plan.
  - who: manager
    t: ಖಂಡಿತ, ಕೂತ್ಕೊಳ್ಳಿ. ಮೊದಲು — ಅಜ್ಜಿ ಹೇಗಿದ್ದಾರೆ? ಆ ವಾರ ನೀವು ಮೀಟಿಂಗ್‌ಗಳಲ್ಲಿ ಇದ್ದೂ ಇಲ್ಲದ ಹಾಗೆ ಇದ್ರಿ. ನಾವೆಲ್ಲಾ ಅರ್ಥ ಮಾಡ್ಕೊಂಡ್ವಿ.
    tr: Khaṇḍita, kūtkoḷḷi. Modalu — ajji hēgiddāre? Ā vāra nīvu mīṭiṅgaḷalli iddū illada hāge idri. Nāvellā artha māḍkoṇḍvi.
    en: Of course, sit down. First — how's your grandmother? That week you were in meetings but not really there. We all understood.
  - who: shwe
    t: ಈಗ ಚೆನ್ನಾಗಿದ್ದಾರೆ, ಥ್ಯಾಂಕ್ಸ್. ಆ ವಾರ ಟೀಮ್ ನನ್ನ ಕೆಲಸ ಹಂಚ್ಕೊಂಡಿದ್ದಕ್ಕೆ ನಾನು ಋಣಿ. ವಿಷಯ ಏನಂದ್ರೆ, ನನ್ನ ಡ್ಯೂ ಡೇಟ್ ನವೆಂಬರ್‌ನಲ್ಲಿ. ಮೆಟರ್ನಿಟಿ ಲೀವ್ ಯಾವಾಗಿಂದ ಶುರು ಮಾಡ್ಬೇಕು ಅಂತ ಪ್ಲಾನ್ ಮಾಡ್ತಿದ್ದೀನಿ.
    tr: Īga chennāgiddāre, thyāṅks. Ā vāra ṭīm nanna kelasa hanchkoṇḍiddakke nānu ṛṇi. Viṣaya ēnandre, nanna ḍyū ḍēṭ navembarnalli. Meṭarniṭi līv yāvāginda shuru māḍbēku anta plān māḍtiddīni.
    en: She's doing well now, thanks. I'm grateful the team shared my work that week. So, the thing is, my due date is in November. I'm planning when to start my maternity leave.
  - who: manager
    t: ಬೇಗ ಪ್ಲಾನ್ ಮಾಡಿದ್ದು ಒಳ್ಳೇದು. ನಮ್ ಪಾಲಿಸಿ ಪ್ರಕಾರ ಇಪ್ಪತ್ತಾರು ವಾರ ಪೇಯ್ಡ್ ಲೀವ್ — ಸುಮಾರು ಆರು ತಿಂಗಳು. ಅದರಲ್ಲಿ ಹೆರಿಗೆಗೆ ಮುಂಚೆ ಎಂಟು ವಾರದವರೆಗೂ ತಗೋಬಹುದು. ಮೊದಲು ಇದು ಮೆಟರ್ನಿಟಿ ಬೆನಿಫಿಟ್ ಆಕ್ಟ್‌ನಲ್ಲಿತ್ತು; ಕಳೆದ ನವೆಂಬರ್‌ನಿಂದ ಸೋಶಿಯಲ್ ಸೆಕ್ಯುರಿಟಿ ಕೋಡ್ ಒಳಗೆ ಬಂದಿದೆಯಂತೆ. ರೂಲ್ಸ್ ಹೆಚ್ಚು-ಕಮ್ಮಿ ಅದೇ ಅಂತ ಎಚ್‌ಆರ್ ಹೇಳ್ತಾರೆ, ಆದ್ರೆ ಡೀಟೇಲ್ಸ್ ಅವರ ಹತ್ರಾನೇ ಕನ್ಫರ್ಮ್ ಮಾಡ್ಕೊಳ್ಳಿ — ನಾನು ಲಾಯರ್ ಅಲ್ಲ!
    tr: Bēga plān māḍiddu oḷḷēdu. Nam pālisi prakāra ippattāru vāra pēyḍ līv — sumāru āru tiṅgaḷu. Adaralli herigege munche eṇṭu vāradavaregū tagōbahudu. Modalu idu Meṭarniṭi Benifiṭ Ākṭnallittu; kaḷeda navembarninda Sōshiyal Sekyuriṭi Kōḍ oḷage bandideyante. Rūls hechchu-kammi adē anta HR hēḷtāre, ādre ḍīṭēls avara hatrānē kanpharm māḍkoḷḷi — nānu lāyar alla!
    en: Good that you're planning early. Under our policy it's twenty-six weeks of paid leave — about six months. Up to eight weeks of that can be taken before the delivery. It used to come under the Maternity Benefit Act; since last November it's apparently been folded into the Code on Social Security. HR says the rules are more or less the same, but confirm the details with them — I'm not a lawyer!
  - who: shwe
    t: ಲೀವ್ ಟೈಮಲ್ಲಿ ಪೂರ್ತಿ ಸಂಬಳ ಬರುತ್ತಾ? ವೇರಿಯಬಲ್ ಪೇ ಏನಾಗುತ್ತೆ?
    tr: Līv ṭaimalli pūrti sambaḷa baruttā? Vēriyabal pē ēnāgutte?
    en: Do I get my full salary during the leave? What happens to the variable pay?
  - who: manager
    t: ಸಂಬಳ ಬರುತ್ತೆ, ಅದು ಕಾನೂನು. ಬೋನಸ್, ವೇರಿಯಬಲ್ ಪೇ ಹೇಗೆ ಲೆಕ್ಕ ಹಾಕ್ತಾರೆ ಅನ್ನೋದು ಕಂಪನಿ ಪಾಲಿಸಿ — ಅದನ್ನೂ ಎಚ್‌ಆರ್‌ನ ಬರವಣಿಗೆಯಲ್ಲಿ ಕೇಳಿ. ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಲೀವ್ ಅಪ್ಲೈ ಮಾಡಿ, ಡ್ಯೂ ಡೇಟ್ ಇರೋ ಡಾಕ್ಟ್ರ ಸರ್ಟಿಫಿಕೇಟ್ ಅಪ್‌ಲೋಡ್ ಮಾಡಿ. ಎಷ್ಟು ಬೇಗ ಹಾಕ್ತೀರೋ ಅಷ್ಟು ಒಳ್ಳೇದು.
    tr: Sambaḷa barutte, adu kānūnu. Bōnas, vēriyabal pē hēge lekka hāktāre annōdu kampani pālisi — adannū HR-na baravaṇigeyalli kēḷi. Pōrṭalnalli līv aplai māḍi, ḍyū ḍēṭ irō ḍākṭra sarṭiphikēṭ aplōḍ māḍi. Eṣṭu bēga hāktīrō aṣṭu oḷḷēdu.
    en: The salary is paid — that's the law. How bonus and variable pay are calculated is company policy, so ask HR about that in writing too. Apply for the leave on the portal and upload a doctor's certificate with the due date. The sooner, the better.
  - who: shwe
    t: ನಾನು ಅಕ್ಟೋಬರ್ ಕೊನೆವರೆಗೂ ಕೆಲಸ ಮಾಡ್ಬೇಕು ಅಂತ ಇದ್ದೀನಿ. ಆದ್ರೆ ಸೀಮಂತ ಆದ್ಮೇಲೆ ಜಯನಗರದಲ್ಲಿ ಅಮ್ಮನ ಮನೇಲಿ ಇರ್ತೀನಿ. ಅಲ್ಲಿಂದ ದಿನಾ ಔಟರ್ ರಿಂಗ್ ರೋಡ್‌ಗೆ ಬರೋದು ಅಂದ್ರೆ ಎರಡು ಗಂಟೆ ಟ್ರಾಫಿಕ್. ಅದಕ್ಕೆ ಕೊನೆಯ ಆರು ವಾರ ವರ್ಕ್ ಫ್ರಮ್ ಹೋಮ್ ಕೊಡ್ಬಹುದಾ ಅಂತ ಕೇಳೋಣ ಅಂತ.
    tr: Nānu akṭōbar konevaregū kelasa māḍbēku anta iddīni. Ādre sīmanta ādmēle Jayanagaradalli ammana manēli irtīni. Allinda dinā auṭar riṅg rōḍge barōdu andre eraḍu gaṇṭe ṭrāphik. Adakke koneya āru vāra vark phram hōm koḍbahudā anta kēḷōṇa anta.
    en: I plan to work until the end of October. But after the seemantha I'll be staying at my mother's in Jayanagar. Coming to the Outer Ring Road from there every day means two hours of traffic. So I wanted to ask whether I could work from home for the last six weeks.
  - who: manager
    t: ಅದಕ್ಕೆ ತೊಂದ್ರೆ ಇಲ್ಲ ಅನ್ಸುತ್ತೆ. ಕೆಲಸದ ಸ್ವಭಾವ ಅನುಮತಿಸಿದ್ರೆ ವರ್ಕ್ ಫ್ರಮ್ ಹೋಮ್ ಕೊಡ್ಬಹುದು ಅಂತ ಕಾನೂನಲ್ಲೂ ಇದೆ, ನಮ್ ಪಾಲಿಸಿಲೂ ಇದೆ. ನಿಮ್ ಕೆಲಸ ಹೇಗಿದ್ರೂ ಲ್ಯಾಪ್‌ಟಾಪ್‌ನಲ್ಲೇ. ಆದ್ರೆ ವಾರಕ್ಕೊಮ್ಮೆ ಸ್ಪ್ರಿಂಟ್ ಪ್ಲಾನಿಂಗ್‌ಗೆ ಬರೋಕಾಗುತ್ತಾ?
    tr: Adakke tondre illa ansutte. Kelasada svabhāva anumatisidre vark phram hōm koḍbahudu anta kānūnallū ide, nam pālisilū ide. Nim kelasa hēgidrū lyāpṭāpnallē. Ādre vārakkomme spriṇṭ plāniṅgge barōkāguttā?
    en: I don't think that's a problem. Both the law and our policy say work from home can be allowed where the nature of the work permits. Your work is all on a laptop anyway. But could you come in once a week for sprint planning?
  - who: shwe
    t: ಆರೋಗ್ಯ ಸರಿ ಇದ್ರೆ ಬರ್ತೀನಿ. ಡಾಕ್ಟ್ರು ಬೇಡ ಅಂದ್ರೆ ಮಾತ್ರ ಆನ್‌ಲೈನ್.
    tr: Ārōgya sari idre bartīni. Ḍākṭru bēḍa andre mātra ānlain.
    en: If my health is fine, I'll come. Only if the doctor says no, I'll join online.
  - who: manager
    t: ಸರಿ. ಹ್ಯಾಂಡೋವರ್ ಬಗ್ಗೆ ಯೋಚನೆ ಮಾಡಿದ್ದೀರಾ? ನಿಮ್ ಪೈಪ್‌ಲೈನ್‌ಗಳು ನಿಮಗೆ ಬಿಟ್ರೆ ಯಾರಿಗೂ ಪೂರ್ತಿ ಗೊತ್ತಿಲ್ಲ.
    tr: Sari. Hyāṇḍōvar bagge yōchane māḍiddīrā? Nim paiplaingaḷu nimage biṭre yārigū pūrti gottilla.
    en: Fine. Have you thought about the handover? Nobody but you fully knows your pipelines.
  - who: shwe
    t: ಅದಕ್ಕೇ ಒಂದು ಡಾಕ್ಯುಮೆಂಟ್ ಶುರು ಮಾಡಿದ್ದೀನಿ. ಅರ್ಜುನ್ ಡೇಟಾ ಪೈಪ್‌ಲೈನ್ ನೋಡ್ಕೊಳ್ತಾನೆ, ಪ್ರಿಯಾ ಕ್ಲೈಂಟ್ ಮೀಟಿಂಗ್ಸ್. ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಮೂರು ವಾರ ಅವರ ಜೊತೆ ಕೂತು ಎಲ್ಲಾ ತೋರಿಸ್ತೀನಿ. ಲೀವ್ ಶುರು ಆಗೋ ಅಷ್ಟರಲ್ಲಿ ಅವರೇ ನಡೆಸ್ಕೊಂಡ್ ಹೋಗ್ಬೇಕು.
    tr: Adakkē ondu ḍākyumeṇṭ shuru māḍiddīni. Arjun ḍēṭā paiplain nōḍkoḷtāne, Priyā klaiṇṭ mīṭiṅgs. Akṭōbarnalli mūru vāra avara jote kūtu ellā tōristīni. Līv shuru āgō aṣṭaralli avarē naḍeskoṇḍ hōgbēku.
    en: That's why I've started a document. Arjun will look after the data pipelines, Priya the client meetings. In October I'll sit with them for three weeks and show them everything. By the time my leave starts, they should be running it themselves.
  - who: shwe
    t: ನಿಖಿಲ್, ಇನ್ನೊಂದು ವಿಷಯ — ನೇರವಾಗಿ ಕೇಳ್ತೀನಿ. ಅಪ್ರೈಸಲ್ ಮಾರ್ಚ್‌ನಲ್ಲಿ, ಆಗ ನಾನು ಲೀವ್‌ನಲ್ಲಿರ್ತೀನಿ. ಆರು ತಿಂಗಳು ಇಲ್ಲದೆ ಇದ್ರೆ ನನ್ನ ರೇಟಿಂಗ್, ಪ್ರೊಮೋಷನ್ ಎಲ್ಲಾ ಹೋಗುತ್ತೆ ಅಂತ ಭಯ. ನಮ್ ಟೀಮ್‌ನಲ್ಲೇ ಒಬ್ರು 'ಮೆಟರ್ನಿಟಿ ಅಂದ್ರೆ ಕರಿಯರ್‌ಗೆ ಬ್ರೇಕ್' ಅಂತ ಜೋಕ್ ಮಾಡಿದ್ರು.
    tr: Nikhil, innondu viṣaya — nēravāgi kēḷtīni. Apraisal mārchnalli, āga nānu līvnallirtīni. Āru tiṅgaḷu illade idre nanna rēṭiṅg, promōṣan ellā hōgutte anta bhaya. Nam ṭīmnallē obru 'meṭarniṭi andre kariyarge brēk' anta jōk māḍidru.
    en: Nikhil, one more thing — I'll ask directly. The appraisal is in March, and I'll be on leave then. I'm afraid that being away six months will cost me my rating and my promotion. Someone in our own team even joked that 'maternity means a break in your career'.
  - who: manager
    t: ಆ ಜೋಕ್ ನನಗೂ ಕೇಳಿಸ್ತು. ಅದು ತಮಾಷೆ ಅಲ್ಲ, ಆ ವ್ಯಕ್ತಿ ಹತ್ರ ನಾನೇ ಮಾತಾಡ್ತೀನಿ. ನೋಡಿ, ಮೆಟರ್ನಿಟಿ ಲೀವ್ ಕಾರಣಕ್ಕೆ ಯಾರನ್ನೂ ಕೆಲಸದಿಂದ ತೆಗೆಯೋಕಾಗಲ್ಲ, ಸಂಬಳ ಕಟ್ ಮಾಡೋಕಾಗಲ್ಲ. ರೇಟಿಂಗ್ ವಿಷಯದಲ್ಲಿ — ಏಪ್ರಿಲ್‌ನಿಂದ ಇವತ್ತಿನವರೆಗಿನ ನಿಮ್ ಕೆಲಸ ನಾನು ನೋಡಿದ್ದೀನಿ. ಆ ಮೈಗ್ರೇಷನ್ ಪ್ರಾಜೆಕ್ಟ್ ಯಾರಿಂದ ಮುಗೀತು ಅಂತ ಎಲ್ರಿಗೂ ಗೊತ್ತು.
    tr: Ā jōk nanagū kēḷistu. Adu tamāṣe alla, ā vyakti hatra nānē mātāḍtīni. Nōḍi, meṭarniṭi līv kāraṇakke yārannū kelasadinda tegeyōkāgalla, sambaḷa kaṭ māḍōkāgalla. Rēṭiṅg viṣayadalli — ēprilninda ivattinavaregina nim kelasa nānu nōḍiddīni. Ā maigrēṣan prājekṭ yārinda mugītu anta elrigū gottu.
    en: I heard that joke too. It isn't funny, and I'll speak to that person myself. Look — nobody can be dismissed or have their pay cut because of maternity leave. As for the rating — I've seen your work from April until today. Everyone knows who got that migration project done.
  - who: shwe
    t: ಅದು ಬರವಣಿಗೆಯಲ್ಲಿ ಇದ್ರೆ ನನಗೆ ಸಮಾಧಾನ. ಯಾಕಂದ್ರೆ ಮ್ಯಾನೇಜರ್‌ಗಳು ಬದಲಾಗ್ತಾರೆ.
    tr: Adu baravaṇigeyalli idre nanage samādhāna. Yākandre myānējargaḷu badalāgtāre.
    en: I'd feel better if that were in writing. Because managers change.
  - who: manager
    t: ನ್ಯಾಯವಾದ ಮಾತು. ಇವತ್ತೇ ನಿಮ್ ಮಿಡ್-ಇಯರ್ ರಿವ್ಯೂ ಬರೆದು ಎಚ್‌ಆರ್‌ಗೆ ಮೇಲ್ ಹಾಕ್ತೀನಿ, ನಿಮ್ಮನ್ನೂ ಸಿಸಿ ಮಾಡ್ತೀನಿ. ಹಾಗೆ, ಆಫೀಸ್ ಹತ್ರ ಒಂದು ಕ್ರೆಷ್ ಜೊತೆ ಟೈ-ಅಪ್ ಆಗಿದೆ — ಲೀವ್ ಮುಗಿಸಿ ವಾಪಸ್ ಬಂದಾಗ ಉಪಯೋಗ ಆಗುತ್ತೆ.
    tr: Nyāyavāda mātu. Ivattē nim miḍ-iyar rivyū baredu HR-ge mēl hāktīni, nimmannū CC māḍtīni. Hāge, āphīs hatra ondu kreṣ jote ṭai-ap āgide — līv mugisi vāpas bandāga upayōga āgutte.
    en: (laughs) Fair point. Today itself I'll write up your mid-year review and mail it to HR, copying you. And by the way, there's a tie-up with a crèche near the office — it'll be useful when you come back from leave.
  - who: shwe
    t: ಆರು ತಿಂಗಳ ಮಗುನ ಬಿಟ್ಟು ಬರೋದು ಅಂತ ಯೋಚಿಸಿದ್ರೇನೇ ಹೊಟ್ಟೆ ಹಿಂಡಿದ ಹಾಗಾಗುತ್ತೆ… ಆದ್ರೂ ಥ್ಯಾಂಕ್ಸ್ ನಿಖಿಲ್. ಈ ಮಾತುಕತೆಗೆ ತುಂಬಾ ಭಯಪಟ್ಟಿದ್ದೆ, ಈಗ ನಿರಾಳ ಆಯ್ತು.
    tr: Āru tiṅgaḷa maguna biṭṭu barōdu anta yōchisidrēnē hoṭṭe hiṇḍida hāgāgutte… ādrū thyāṅks Nikhil. Ī mātukatege tumbā bhayapaṭṭidde, īga nirāḷa āytu.
    en: Just thinking about leaving a six-month-old baby makes my stomach twist… but thanks, Nikhil. I was really dreading this conversation; now I feel relieved.
  - who: manager
    t: ಈ ಕಂಪನಿ ಆರು ತಿಂಗಳಲ್ಲಿ ಮುಳುಗಲ್ಲ, ಶ್ವೇತಾ. ಆರೋಗ್ಯ ಮೊದಲು. ಶುಗರ್ ಬಗ್ಗೆ ಹೇಳಿದ್ರಲ್ಲ — ಮಧ್ಯಾಹ್ನ ಊಟ ಆದ್ಮೇಲೆ ಹದಿನೈದು ನಿಮಿಷ ವಾಕ್, ಮೀಟಿಂಗ್ ಇದ್ರೂ ಬಿಡ್ಬೇಡಿ. ಅದು ನನ್ನ ಆರ್ಡರ್!
    tr: Ī kampani āru tiṅgaḷalli muḷugalla, Shwētā. Ārōgya modalu. Shugar bagge hēḷidralla — madhyāhna ūṭa ādmēle hadinaidu nimiṣa vāk, mīṭiṅg idrū biḍbēḍi. Adu nanna ārḍar!
    en: This company won't sink in six months, Shwetha. Health first. You told me about the sugar — a fifteen-minute walk after lunch, and don't skip it even if there's a meeting. That's an order!
  - section: 🌎 Pradeep asks for paternity leave
    learn: 'reported speech: ‑anta hēḷidru, ‑ante · pēṭarniṭi līv · ‑ōdrinda (because) · plans: modalu … āmēle … · teasing between spouses'
  - scene: Eleven at night in the JP Nagar flat. Pradeep has just finished a video call with his manager in Seattle.
  - who: shwe
    t: ಏನಂದ್ರು ನಿನ್ ಬಾಸ್? ಮುಖ ನೋಡಿದ್ರೆ ಒಳ್ಳೆ ಸುದ್ದಿ ಅನ್ಸುತ್ತೆ.
    tr: Ēnandru nin bās? Mukha nōḍidre oḷḷe suddi ansutte.
    en: What did your boss say? From your face, it looks like good news.
  - who: pradeep
    t: ಅರ್ಧ ಒಳ್ಳೆ ಸುದ್ದಿ. ಅಮೆರಿಕಾದಲ್ಲಿರೋ ಉದ್ಯೋಗಿಗಳಿಗೆ ಹನ್ನೆರಡು ವಾರ ಪೇರೆಂಟಲ್ ಲೀವ್ ಇದೆಯಂತೆ. ಆದ್ರೆ ನಾನು ಇಂಡಿಯಾದಿಂದ ಕೆಲಸ ಮಾಡ್ತಿರೋದ್ರಿಂದ ನನ್ನ ಕಾಂಟ್ರಾಕ್ಟ್ ಇಲ್ಲಿನ ಒಂದು ಪೇರೋಲ್ ಕಂಪನಿ ಮೂಲಕ. ಅವರ ಪಾಲಿಸಿ ಪ್ರಕಾರ ನಾಲ್ಕು ವಾರ ಮಾತ್ರ.
    tr: Ardha oḷḷe suddi. Amerikādallirō udyōgigaḷige hanneraḍu vāra pēreṇṭal līv ideyante. Ādre nānu Iṇḍiyādinda kelasa māḍtirōdrinda nanna kāṇṭrākṭ illina ondu pērōl kampani mūlaka. Avara pālisi prakāra nālku vāra mātra.
    en: Half good news. Apparently employees in America get twelve weeks of parental leave. But because I work from India, my contract goes through a payroll company here. Under their policy it's only four weeks.
  - who: shwe
    t: ನಾಲ್ಕು ವಾರ? ಇಲ್ಲಿ ಪ್ರೈವೇಟ್ ಕಂಪನಿಗಳಲ್ಲಿ ಗಂಡಸರಿಗೆ ಕಾನೂನಲ್ಲಿ ಪೇಟರ್ನಿಟಿ ಲೀವ್ ಅಂತ ಏನೂ ಇಲ್ಲ ಅನ್ಸುತ್ತೆ — ಕಂಪನಿ ಕೊಟ್ಟಷ್ಟು. ಆ ಲೆಕ್ಕದಲ್ಲಿ ನಾಲ್ಕು ವಾರ ಕೆಟ್ಟದ್ದಲ್ಲ.
    tr: Nālku vāra? Illi praivēṭ kampanigaḷalli gaṇḍasarige kānūnalli pēṭarniṭi līv anta ēnū illa ansutte — kampani koṭṭaṣṭu. Ā lekkadalli nālku vāra keṭṭaddalla.
    en: Four weeks? I think here, in private companies, there's no legal paternity leave for men — you get whatever the company gives. By that measure, four weeks isn't bad.
  - who: pradeep
    t: ಅದಕ್ಕೇ ನಾನೂ ಒಪ್ಕೊಂಡೆ. ಆದ್ರೆ ಅವರೇ ಒಂದು ಐಡಿಯಾ ಕೊಟ್ರು — ಮಗು ಹುಟ್ಟಿದ ತಕ್ಷಣ ಎರಡು ವಾರ, ನೀನು ಮಗುನ ಕರ್ಕೊಂಡು ನಮ್ ಮನೆಗೆ ವಾಪಸ್ ಬರುವಾಗ ಇನ್ನೆರಡು ವಾರ. ಮಧ್ಯದಲ್ಲಿ ನಾನು ಜಯನಗರದಿಂದಲೇ ಕೆಲಸ ಮಾಡ್ತೀನಿ.
    tr: Adakkē nānū opkoṇḍe. Ādre avarē ondu aiḍiyā koṭru — magu huṭṭida takṣaṇa eraḍu vāra, nīnu maguna karkoṇḍu nam manege vāpas baruvāga inneraḍu vāra. Madhyadalli nānu Jayanagaradindalē kelasa māḍtīni.
    en: That's why I agreed too. But he suggested something himself — two weeks right after the baby is born, and another two when you bring the baby back to our place. In between I'll work from Jayanagar.
  - who: shwe
    t: ಜಯನಗರದಿಂದ? ಅಮ್ಮನ ಮನೇಲಿ ಮಧ್ಯರಾತ್ರಿ ಸಿಯಾಟಲ್ ಮೀಟಿಂಗ್ ಮಾಡ್ತೀಯಾ? ಅಜ್ಜಿ ಒಂಬತ್ತೂವರೆಗೇ ಲೈಟ್ ಆಫ್ ಮಾಡ್ತಾರೆ!
    tr: Jayanagaradinda? Ammana manēli madhyarātri Siyāṭal mīṭiṅg māḍtīyā? Ajji ombattūvaregē laiṭ āph māḍtāre!
    en: From Jayanagar? You'll do midnight Seattle meetings in my mother's house? Ajji switches the lights off at nine-thirty!
  - who: pradeep
    t: ಸ್ಯಾಮ್ ಒಪ್ಪಿದ್ರೆ ಅವನ ರೂಮ್‌ನಲ್ಲಿ ಕೂತ್ಕೊಳ್ತೀನಿ. ಹೇಗೂ ಮಗು ರಾತ್ರಿ ಎಲ್ಲಾ ಎಚ್ಚರ ಇರುತ್ತೆ, ನಾನೂ ಎಚ್ಚರ ಇರ್ತೀನಿ — ಟೈಮ್ ಜೋನ್ ಸರಿಯಾಗೇ ಇದೆ!
    tr: Syām oppidre avana rūmnalli kūtkoḷtīni. Hēgū magu rātri ellā echchara irutte, nānū echchara irtīni — ṭaim jōn sariyāgē ide!
    en: If Sam agrees, I'll sit in his room. The baby will be awake all night anyway, and so will I — the time zone works out perfectly!
  - who: shwe
    t: ಹುಚ್ಚ! … ಆದ್ರೆ ಡ್ಯೂ ಡೇಟ್ ಮುಂಚೆ-ಹಿಂದೆ ಆದ್ರೆ ಏನು ಮಾಡ್ಬೇಕು ಅಂತ ಕೇಳಿದ್ಯಾ?
    tr: Huchcha! … Ādre ḍyū ḍēṭ munche-hinde ādre ēnu māḍbēku anta kēḷidyā?
    en: You're crazy! … But did you ask what happens if the baby comes before or after the due date?
  - who: pradeep
    t: ಕೇಳಿದೆ. 'ಬೇಬಿ ಬಂದ ದಿನಾನೇ ಲೀವ್ ಶುರು, ಒಂದು ಮೇಲ್ ಹಾಕಿದ್ರೆ ಸಾಕು' ಅಂತ ಹೇಳಿದ್ರು. ಆ ವಿಷಯದಲ್ಲಿ ಅವರು ತುಂಬಾ ಒಳ್ಳೆಯವರು.
    tr: Kēḷide. 'Bēbi banda dinānē līv shuru, ondu mēl hākidre sāku' anta hēḷidru. Ā viṣayadalli avaru tumbā oḷḷeyavaru.
    en: I did. He said, 'Leave starts the day the baby arrives — just send an email.' He's really good about that sort of thing.
  - section: 💰 Money, insurance and where to deliver
    learn: 'insurance words: grūp pālisi, sab-limiṭ, vēṭiṅg pīriyaḍ, kyāshles, pri-ātharaisēshan · ‑bēkādre (if needed) · tradition: who pays for the first delivery · ‑ade irō hāge (so that … not)'
  - scene: Sunday, 13 September, a week before the seemantha. The couple sit at the dining table with a laptop, Shwetha's insurance policy open on the screen, and a notebook full of figures.
  - who: shwe
    t: ನನ್ನ ಕಂಪನಿಯ ಗ್ರೂಪ್ ಇನ್ಶೂರೆನ್ಸ್‌ನಲ್ಲಿ ಮೆಟರ್ನಿಟಿ ಕವರ್ ಇದೆ. ಆದ್ರೆ ಸಬ್-ಲಿಮಿಟ್ — ನಾರ್ಮಲ್ ಡೆಲಿವರಿಗೆ ಐವತ್ತು ಸಾವಿರ, ಸಿಸೇರಿಯನ್‌ಗೆ ಎಪ್ಪತ್ತೈದು ಸಾವಿರ ಮಾತ್ರ. ಮಗುಗೆ ಮೊದಲ ದಿನದಿಂದಲೇ ಕವರ್ ಇದೆ ಅಂತ ಬರೆದಿದೆ.
    tr: Nanna kampaniya grūp inshūrensnalli meṭarniṭi kavar ide. Ādre sab-limiṭ — nārmal ḍelivarige aivattu sāvira, sisēriyange eppattaidu sāvira mātra. Maguge modala dinadindalē kavar ide anta baredide.
    en: My company's group insurance has maternity cover. But there's a sub-limit — only fifty thousand for a normal delivery and seventy-five thousand for a C-section. It says the baby is covered from day one.
  - who: pradeep
    t: ಗ್ರೂಪ್ ಪಾಲಿಸಿಲಿ ವೇಟಿಂಗ್ ಪೀರಿಯಡ್ ಇಲ್ಲ ಅಲ್ವಾ? ನಾನು ನೋಡಿದ ರಿಟೇಲ್ ಪಾಲಿಸಿಗಳಲ್ಲಿ ಮೆಟರ್ನಿಟಿಗೆ ಎರಡು-ಮೂರು ವರ್ಷ ಕಾಯ್ಬೇಕಿತ್ತು.
    tr: Grūp pālisili vēṭiṅg pīriyaḍ illa alvā? Nānu nōḍida riṭēl pālisigaḷalli meṭarniṭige eraḍu-mūru varṣa kāybēkittu.
    en: There's no waiting period in a group policy, right? In the retail policies I looked at, you had to wait two or three years for maternity.
  - who: shwe
    t: ಇಲ್ಲ, ನಮ್ಮದರಲ್ಲಿ ಮೊದಲ ದಿನದಿಂದಲೇ. ಅದೇ ಒಂದು ಸಮಾಧಾನ. ಡಾಕ್ಟರ್ ಉಷಾ ಕೂರೋ ಆಸ್ಪತ್ರೆ ನೆಟ್‌ವರ್ಕ್‌ನಲ್ಲಿದೆ, ಅಂದ್ರೆ ಕ್ಯಾಶ್‌ಲೆಸ್ ಆಗುತ್ತೆ. ಡ್ಯೂ ಡೇಟ್‌ಗೆ ಒಂದು ತಿಂಗಳು ಮುಂಚೆನೇ ಪ್ರಿ-ಆಥರೈಸೇಶನ್ ಕಳಿಸ್ಬಹುದಂತೆ.
    tr: Illa, nammadaralli modala dinadindalē. Adē ondu samādhāna. Ḍākṭar Uṣā kūrō āspatre neṭvarknallide, andre kyāshles āgutte. Ḍyū ḍēṭge ondu tiṅgaḷu munchenē pri-ātharaisēshan kaḷisbahudante.
    en: No — ours covers it from day one. That's one relief. The hospital where Dr. Usha practises is in the network, so it can be cashless. Apparently the pre-authorisation can be sent a month before the due date.
  - who: shwe
    t: ಈಗ ಖರ್ಚು. ಅವರ ಪ್ಯಾಕೇಜ್ — ನಾರ್ಮಲ್ ಡೆಲಿವರಿ ರೂಮ್ ನೋಡಿ ಸುಮಾರು ಎಂಬತ್ತು ಸಾವಿರದಿಂದ ಒಂದು ಲಕ್ಷದ ಹತ್ತು ಸಾವಿರ. ಸಿಸೇರಿಯನ್ ಆದ್ರೆ ಒಂದೂವರೆ ಲಕ್ಷದ ಹತ್ರ. ಮಗುಗೆ ಎನ್‌ಐಸಿಯು ಬೇಕಾದ್ರೆ ಅದು ಬೇರೆ — ದಿನಕ್ಕೆ ಹತ್ತರಿಂದ ಇಪ್ಪತ್ತು ಸಾವಿರ ಆಗಬಹುದು ಅಂದ್ರು.
    tr: Īga kharchu. Avara pyākēj — nārmal ḍelivari rūm nōḍi sumāru embattu sāviradinda ondu lakṣada hattu sāvira. Sisēriyan ādre ondūvare lakṣada hatra. Maguge NICU bēkādre adu bēre — dinakke hattarinda ippattu sāvira āgabahudu andru.
    en: Now the costs. Their package — a normal delivery is roughly eighty thousand to one lakh ten thousand, depending on the room. A C-section, close to one and a half lakh. If the baby needs the NICU, that's extra — they said it could be ten to twenty thousand a day.
  - who: pradeep
    t: ಅಂದ್ರೆ ಇನ್ಶೂರೆನ್ಸ್ ಹೋಗಿ ನಮ್ ಕೈಯಿಂದ ಕನಿಷ್ಠ ಐವತ್ತು-ಅರವತ್ತು ಸಾವಿರ. ಏನಾದ್ರೂ ಕಾಂಪ್ಲಿಕೇಷನ್ ಆದ್ರೆ ಇನ್ನೂ ಜಾಸ್ತಿ.
    tr: Andre inshūrens hōgi nam kaiyinda kaniṣṭha aivattu-aravattu sāvira. Ēnādrū kāmplikēṣan ādre innū jāsti.
    en: So after insurance, at least fifty or sixty thousand from our own pocket. More if there's any complication.
  - who: shwe
    t: ಅಮ್ಮ ವಾಣಿ ವಿಲಾಸ್ ಬಗ್ಗೆ ಹೇಳ್ತಿದ್ರು. ಸರ್ಕಾರಿ ಆಸ್ಪತ್ರೆ, ಡೆಲಿವರಿ ಹೆಚ್ಚು-ಕಮ್ಮಿ ಫ್ರೀ. ಒಂದು ಕಾಲದಲ್ಲಿ ಅಲ್ಲಿ ತಿಂಗಳಿಗೆ ಮೂರು ಸಾವಿರ ಡೆಲಿವರಿ ಆಗ್ತಿತ್ತಂತೆ — ಡಾಕ್ಟರ್‌ಗಳಿಗೆ ಅನುಭವ ತುಂಬಾ. ಆದ್ರೆ ಭಯಂಕರ ರಶ್, ಒಂದೇ ವಾರ್ಡ್‌ನಲ್ಲಿ ತುಂಬಾ ತಾಯಂದಿರು, ಮತ್ತೆ ನಮ್ ಡಾಕ್ಟರ್ ಅಲ್ಲಿ ಇರಲ್ಲ.
    tr: Amma Vāṇi Vilās bagge hēḷtidru. Sarkāri āspatre, ḍelivari hechchu-kammi phrī. Ondu kāladalli alli tiṅgaḷige mūru sāvira ḍelivari āgtittante — ḍākṭargaḷige anubhava tumbā. Ādre bhayaṅkara rash, ondē vārḍnalli tumbā tāyandiru, matte nam ḍākṭar alli iralla.
    en: Amma was talking about Vani Vilas. It's a government hospital — delivery is practically free. At one time they apparently did three thousand deliveries a month there, so the doctors are very experienced. But it's terribly crowded, lots of mothers in one ward, and our own doctor won't be there.
  - who: pradeep
    t: ಜಯದೇವ ನೋಡಿದ ಮೇಲೆ ಸರ್ಕಾರಿ ಆಸ್ಪತ್ರೆ ಬಗ್ಗೆ ನನ್ನ ಅಭಿಪ್ರಾಯಾನೇ ಬದಲಾಯ್ತು. ಅಜ್ಜಿನ ಅಲ್ಲಿ ಎಷ್ಟು ಚೆನ್ನಾಗಿ ನೋಡ್ಕೊಂಡ್ರು.
    tr: Jayadēva nōḍida mēle sarkāri āspatre bagge nanna abhiprāyānē badalāytu. Ajjina alli eṣṭu chennāgi nōḍkoṇḍru.
    en: After seeing Jayadeva, my whole opinion of government hospitals changed. They looked after Ajji so well there.
  - who: shwe
    t: ನಿಜ. ಆದ್ರೆ ನನ್ನ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಇದೆ, ಆರು ತಿಂಗಳಿಂದ ಡಾಕ್ಟರ್ ಉಷಾ ನನ್ನನ್ನ ನೋಡ್ತಿದ್ದಾರೆ, ನನ್ನ ಎಲ್ಲಾ ಹಿಸ್ಟರಿ ಅವರಿಗೆ ಗೊತ್ತು. ಹೆರಿಗೆ ಟೈಮಲ್ಲಿ ಪರಿಚಯ ಇರೋ ಮುಖ ಇರ್ಬೇಕು ಅನ್ಸುತ್ತೆ. ಅದಕ್ಕೆ ದುಡ್ಡು ಕೊಡೋಕೆ ನಾನು ರೆಡಿ.
    tr: Nija. Ādre nanna shugar bārḍarlain ide, āru tiṅgaḷinda ḍākṭar Uṣā nannanna nōḍtiddāre, nanna ellā hisṭari avarige gottu. Herige ṭaimalli parichaya irō mukha irbēku ansutte. Adakke duḍḍu koḍōke nānu reḍi.
    en: True. But my sugar is borderline, Dr. Usha has been seeing me for six months, she knows my whole history. I feel I need a familiar face at the delivery. I'm ready to pay for that.
  - who: pradeep
    t: ಹಾಗಾದ್ರೆ ಡಾಕ್ಟರ್ ಉಷಾನೇ. ನಮ್ ಎಮರ್ಜೆನ್ಸಿ ಫಂಡ್‌ನಲ್ಲಿ ಎರಡು ಲಕ್ಷ ಇದೆ — ಅದನ್ನ ಮುಟ್ಟದೆ, ಪ್ರತಿ ತಿಂಗಳು ಇಪ್ಪತ್ತು ಸಾವಿರ ಬೇರೆ ಇಡೋಣ. ನವೆಂಬರ್ ಅಷ್ಟರಲ್ಲಿ ಅರವತ್ತು ಸಾವಿರ ಆಗುತ್ತೆ. ಮತ್ತೆ ಮಗು ಹುಟ್ಟಿದ ತಕ್ಷಣ ಪಾಲಿಸಿಗೆ ಸೇರಿಸ್ಬೇಕು — ಸಾಮಾನ್ಯವಾಗಿ ಮೂವತ್ತು ದಿನದ ಒಳಗೆ ಎಚ್‌ಆರ್‌ಗೆ ಹೇಳ್ಬೇಕಂತೆ.
    tr: Hāgādre ḍākṭar Uṣānē. Nam emarjensi phaṇḍnalli eraḍu lakṣa ide — adanna muṭṭade, prati tiṅgaḷu ippattu sāvira bēre iḍōṇa. Navembar aṣṭaralli aravattu sāvira āgutte. Matte magu huṭṭida takṣaṇa pālisige sērisbēku — sāmānyavāgi mūvattu dinada oḷage HR-ge hēḷbēkante.
    en: Then it's Dr. Usha. We have two lakh in our emergency fund — let's not touch it, and put aside twenty thousand separately every month. By November that'll be sixty thousand. And as soon as the baby is born we have to add the baby to the policy — apparently you usually have to tell HR within thirty days.
  - who: shwe
    t: ಇನ್ನೊಂದು ವಿಷಯ. ನಮ್ಮಲ್ಲಿ ಮೊದಲ ಹೆರಿಗೆ ತವರುಮನೆಯವರ ಖರ್ಚು ಅನ್ನೋ ಪದ್ಧತಿ ಇದೆ. ಅಪ್ಪ ಈಗಾಗ್ಲೇ 'ಆಸ್ಪತ್ರೆ ಬಿಲ್ ನಾನೇ ಕಟ್ತೀನಿ' ಅಂದಿದ್ದಾರೆ. ಆದ್ರೆ ಅಜ್ಜಿ ಖರ್ಚು ಆದ್ಮೇಲೆ, ಅದೂ ರಿಟೈರ್‌ಮೆಂಟ್ ಹತ್ರ ಬರ್ತಿರೋವಾಗ… ನನಗೆ ಮನಸ್ಸು ಒಪ್ಪಲ್ಲ.
    tr: Innondu viṣaya. Nammalli modala herige tavarumaneyavara kharchu annō paddhati ide. Appa īgāglē 'āspatre bil nānē kaṭtīni' andiddāre. Ādre ajji kharchu ādmēle, adū riṭairmeṇṭ hatra bartirōvāga… nanage manassu oppalla.
    en: One more thing. In our community the custom is that the woman's parents pay for the first delivery. Appa has already said, 'I'll pay the hospital bill myself'. But after Ajji's expenses, and with his retirement coming up… my heart won't allow it.
  - who: pradeep
    t: ನಾವೇ ಕಟ್ಟೋಣ. ನಿಮ್ ಅಪ್ಪನ ಮರ್ಯಾದೆಗೆ ಧಕ್ಕೆ ಆಗದೆ ಇರೋ ಹಾಗೆ ಹೇಳೋಣ — ಸೀಮಂತ, ಬಾಣಂತನ ಅವರದ್ದು; ಆಸ್ಪತ್ರೆ ನಮ್ಮದು. ಅದು ಸರಿಯಾದ ಹಂಚಿಕೆ ಅನ್ಸುತ್ತೆ.
    tr: Nāvē kaṭṭōṇa. Nim appana maryādege dhakke āgade irō hāge hēḷōṇa — sīmanta, bāṇantana avaraddu; āspatre nammadu. Adu sariyāda hanchike ansutte.
    en: We'll pay. Let's put it to your father in a way that doesn't hurt his pride — the seemantha and the confinement are theirs; the hospital is ours. That feels like a fair split.
  - who: shwe
    t: ಮದುವೆ ಟೈಮಲ್ಲಿ ದುಡ್ಡಿನ ವಿಷಯಕ್ಕೆ ಏನೇನಾಯ್ತು ಅಂತ ನೆನೆಸ್ಕೊಂಡ್ರೆ… ಈಗ ನೀನು ಹೀಗೆ ಮಾತಾಡೋದು ಕೇಳಿ ತುಂಬಾ ಖುಷಿ ಆಗುತ್ತೆ.
    tr: Maduve ṭaimalli duḍḍina viṣayakke ēnēnāytu anta nenaskoṇḍre… īga nīnu hīge mātāḍōdu kēḷi tumbā khuṣi āgutte.
    en: When I remember everything that happened over money at the time of our wedding… hearing you talk like this makes me very happy.
  - scene: Pradeep's phone rings. It's his mother, Sumitra. He puts her on speaker.
  - who: sumitra
    t: ಶ್ವೇತಾ, ಹೇಗಿದ್ದೀಯಮ್ಮ? ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಅಂತ ಪ್ರದೀಪ ಹೇಳಿದ. ನಿನಗೋಸ್ಕರ ಸಕ್ಕರೆ ಇಲ್ಲದೆ ರಾಗಿ ಮಾಲ್ಟ್ ಪುಡಿ ಮಾಡಿದ್ದೀನಿ. ನಾಳೆ ನಿಮ್ ಮಾವ ತಂದು ಕೊಡ್ತಾರೆ.
    tr: Shwētā, hēgiddīyamma? Shugar bārḍarlain anta Pradīpa hēḷida. Ninagōskara sakkare illade rāgi mālṭ puḍi māḍiddīni. Nāḷe nim māva tandu koḍtāre.
    en: Shwetha, how are you, dear? Pradeep told me your sugar is borderline. I've made you some ragi malt powder, without sugar. Your father-in-law will bring it over tomorrow.
  - who: shwe
    t: ಥ್ಯಾಂಕ್ಸ್ ಅತ್ತೆ. ನೀವ್ಯಾಕೆ ಇಷ್ಟು ಕಷ್ಟ ಪಡ್ತೀರಾ?
    tr: Thyāṅks atte. Nīvyāke iṣṭu kaṣṭa paḍtīrā?
    en: Thank you, Atte. Why do you go to so much trouble?
  - who: sumitra
    t: ಕಷ್ಟ ಏನು ಬಂತು? ಮತ್ತೆ ಒಂದು ವಿಷಯ — ಆಸ್ಪತ್ರೆ ಖರ್ಚಿಗೆ ನಾವೂ ಸ್ವಲ್ಪ ಕೊಡ್ತೀವಿ, ಬೇಡ ಅನ್ಬೇಡ. ಒಂದು ಕಾಲದಲ್ಲಿ ನಾವು ನಿಮ್ ಮನೆಯವರ ಮುಂದೆ ತಗೊಳ್ಳೋಕೆ ಕೈ ಚಾಚಿದ್ವಿ. ಈ ಸಲ ಕೊಡೋ ಕೈ ಆಗೋಕೆ ಬಿಡಮ್ಮ.
    tr: Kaṣṭa ēnu bantu? Matte ondu viṣaya — āspatre kharchige nāvū svalpa koḍtīvi, bēḍa anbēḍa. Ondu kāladalli nāvu nim maneyavara munde tagoḷḷōke kai chāchidvi. Ī sala koḍō kai āgōke biḍamma.
    en: What trouble? And one more thing — we'll contribute something to the hospital costs too, don't say no. Once we held out our hands to your family to take. This time, let us be the hand that gives, dear.
  - who: shwe
    t: ಅತ್ತೆ… ಸರಿ. ಆದ್ರೆ ಒಂದು ಕಂಡೀಷನ್ — ಸೀಮಂತಕ್ಕೆ ನೀವು ಬೇಗ ಬರ್ಬೇಕು, ಅಮ್ಮ-ಅಜ್ಜಿ ಜೊತೆ ಇರ್ಬೇಕು. ಅದೇ ನನಗೆ ದೊಡ್ಡ ಉಡುಗೊರೆ.
    tr: Atte… sari. Ādre ondu kaṇḍīṣan — sīmantakke nīvu bēga barbēku, amma-ajji jote irbēku. Adē nanage doḍḍa uḍugore.
    en: (after a pause) Atte… all right. But on one condition — you come early to the seemantha and stay with Amma and Ajji. That's the biggest gift you could give me.
  - who: sumitra
    t: ಬರ್ತೀನಿ. ನಿಮ್ ಅಜ್ಜಿ ಈಗಾಗ್ಲೇ ಫೋನ್ ಮಾಡಿ ಹೇಳಿದ್ರು — 'ಡಾಕ್ಟ್ರು ಏನಂದ್ರೂ ಸರಿ, ಶ್ವೇತಾಗೆ ಮೊದಲ ಆಶೀರ್ವಾದ ನಂದೇ' ಅಂತ!
    tr: Bartīni. Nim ajji īgāglē phōn māḍi hēḷidru — 'ḍākṭru ēnandrū sari, Shwētāge modala āśīrvāda nandē' anta!
    en: I'll come. Your grandmother has already phoned me to say, 'Whatever the doctors say, the first blessing for Shwetha is mine!'
  - who: pradeep
    t: ಅಂದ್ರೆ ಸೀಮಂತದ ಪ್ಲಾನಿಂಗ್ ಕಮಿಟಿ ಅಧ್ಯಕ್ಷೆ ಅಜ್ಜಿನೇ.
    tr: Andre sīmantada plāniṅg kamiṭi adhyakṣe ajjinē.
    en: So the chairperson of the seemantha planning committee is Ajji herself.
  - who: shwe
    t: ಹಾಗಾದ್ರೆ ಡಾಕ್ಟರ್ ಮೀರಾ ಕೂಡ ಏನೂ ಮಾಡೋಕಾಗಲ್ಲ!
    tr: Hāgādre ḍākṭar Mīrā kūḍa ēnū māḍōkāgalla!
    en: Then not even Dr. Meera can do anything about it!
  - chapter: Chapter 6 — Seemantha
  - section: 🌼 The morning of the seemantha
    learn: 'five rices: chitrānna, puḷiyōgare, mosaranna, kāyi anna, sihi pongal · -ಅಷ್ಟರಲ್ಲಿ (by the time) · causatives ಹಾಕಿಸು, ಇಡಿಸು (have something put)'
  - scene: Sunday, 20 September 2026, seven in the morning, the Rao house in Jayanagar. Shwetha is thirty-two weeks pregnant, in her eighth month; Ajji has been home for five weeks. Mango-leaf garlands are going up over the door, and the kitchen smells of tempering.
  - who: vimala
    t: ಲಕ್ಷ್ಮಿ, ಮಲ್ಲಿಗೆ ಹೂವು ತಂದೆ ನೋಡು, ಹತ್ತು ಮೊಳ. ಗಾಂಧಿ ಬಜಾರಿಗೆ ಬೆಳಿಗ್ಗೆ ಆರು ಗಂಟೆಗೇ ಹೋಗಿದ್ದೆ, ಆಮೇಲೆ ಹೋದ್ರೆ ಒಳ್ಳೆ ಹೂವು ಸಿಗಲ್ಲ.
    tr: Lakshmī, mallige hūvu tande nōḍu, hattu moḷa. Gāndhi Bajārige beḷigge āru gaṇṭegē hōgidde, āmēle hōdre oḷḷe hūvu sigalla.
    en: Lakshmi, look, I brought the jasmine — ten arm-lengths. I went to Gandhi Bazaar at six this morning; any later and you don't get good flowers.
  - who: amma
    t: ಎಷ್ಟು ಉಪಕಾರ ಮಾಡಿದೆ ವಿಮಲಾ. ಪುರೋಹಿತರು ಹತ್ತೂವರೆಗೆ ಬರ್ತಾರೆ. ಅಷ್ಟರಲ್ಲಿ ಐದು ಥರದ ಅನ್ನ ರೆಡಿ ಆಗಿರ್ಬೇಕು, ಹಾಲ್ ಅಲಂಕಾರ ಮುಗಿದಿರ್ಬೇಕು.
    tr: Eṣṭu upakāra māḍide Vimalā. Purōhitaru hattūvarege bartāre. Aṣṭaralli aidu tharada anna reḍi āgirbēku, hāl alaṅkāra mugidirbēku.
    en: What a help you are, Vimala. The priest comes at half past ten. By then the five kinds of rice have to be ready and the hall decorations finished.
  - who: sam
    t: ಐದು ಥರದ ಅನ್ನ ಯಾಕೆ ಆಂಟಿ? ಒಂದು ಬಿಸಿಬೇಳೆಬಾತ್ ಸಾಕಾಗಲ್ವಾ?
    tr: Aidu tharada anna yāke āṇṭi? Ondu bisibēḷebāt sākāgalvā?
    en: Why five kinds of rice, Aunty? Wouldn't one bisibelebath do?
  - who: amma
    t: ಸೀಮಂತದಲ್ಲಿ ಚಿತ್ರಾನ್ನ, ಪುಳಿಯೋಗರೆ, ಮೊಸರನ್ನ, ಕಾಯಿ ಅನ್ನ, ಸಿಹಿ ಪೊಂಗಲ್, ಐದೂ ಮಾಡೋದು ನಮ್ಮ ಮನೆ ಪದ್ಧತಿ. ಬಸುರಿಗೆ ಯಾವ ರುಚಿ ಆಸೆ ಆಗುತ್ತೋ, ಅದೆಲ್ಲಾ ತಟ್ಟೇಲಿ ಇರ್ಲಿ ಅಂತ.
    tr: Sīmantadalli chitrānna, puḷiyōgare, mosaranna, kāyi anna, sihi pongal, aidū māḍōdu namma mane paddhati. Basurige yāva ruchi āse āguttō, adellā taṭṭēli irli anta.
    en: 'At a seemantha we make chitranna, puliyogare, curd rice, coconut rice and sweet pongal — all five. It''s our family custom: whatever taste the pregnant woman craves, let it all be on her plate.'
  - who: vimala
    t: ಹಾಗಾದ್ರೆ ಸಿಹಿ ಪೊಂಗಲ್ ಜಾಸ್ತಿ ಮಾಡಿಸು ಲಕ್ಷ್ಮಿ. ಬಸುರಿಯರಿಗೆ ಸಿಹಿ ಆಸೆ ಜಾಸ್ತಿ.
    tr: Hāgādre sihi pongal jāsti māḍisu Lakshmī. Basuriyarige sihi āse jāsti.
    en: Then have plenty of sweet pongal made, Lakshmi. Pregnant women always crave sweets.
  - who: amma
    t: ಇಲ್ಲ ವಿಮಲಾ, ಶ್ವೇತಾಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಅಂತ ಡಾಕ್ಟ್ರು ಹೇಳಿದಾರೆ. ಅವಳಿಗೆ ಪೊಂಗಲ್ ಶಾಸ್ತ್ರಕ್ಕೆ ಒಂದು ಚಮಚ ಅಷ್ಟೇ. ಅಡುಗೆಯವರಿಗೆ ಬೆಲ್ಲ ಕಮ್ಮಿ ಹಾಕಿ ಅಂತ ಹೇಳಿದೀನಿ.
    tr: Illa Vimalā, Shwētāge śugar bārḍarlain anta ḍākṭru hēḷidāre. Avaḷige pongal śāstrakke ondu chamacha aṣṭē. Aḍugeyavarige bella kammi hāki anta hēḷidīni.
    en: No, Vimala — the doctor says Shwetha's sugar is borderline. For her, one spoon of pongal for the ritual's sake, that's all. I've told the cooks to go easy on the jaggery.
  - who: kiran
    t: ಅಮ್ಮ, ಶಾಮಿಯಾನದವರು ಬಂದ್ರು. ಕುರ್ಚಿ ಎಷ್ಟು ಬೇಕು, ಎಲ್ಲಿ ಹಾಕ್ಬೇಕು ಅಂತ ಕೇಳ್ತಿದಾರೆ.
    tr: Amma, śāmiyānadavaru bandru. Kurchi eṣṭu bēku, elli hākbēku anta kēḷtidāre.
    en: Amma, the shamiana people are here. They're asking how many chairs and where to put them.
  - who: amma
    t: ಐವತ್ತು ಕುರ್ಚಿ ಹಾಕಿಸು. ಅಜ್ಜಿಗೆ ಕೈ ಇರೋ ಮೆತ್ತನೆ ಕುರ್ಚಿ ಬೇರೆ, ಅದನ್ನ ಮಣೆ ಪಕ್ಕದಲ್ಲೇ, ಮುಂದೆನೇ ಇಡಿಸು.
    tr: Aivattu kurchi hākisu. Ajjige kai irō mettane kurchi bēre, adanna maṇe pakkadallē, mundenē iḍisu.
    en: Have fifty chairs put out. And a separate cushioned armchair for Ajji — have it placed right in front, next to the ritual seat.
  - who: sam
    t: ಮಾವಿನ ಎಲೆ ತೋರಣ ನಾನು ಕಟ್ತೀನಿ. ಈ ಸಲ ಉಲ್ಟಾ ಕಟ್ಟಲ್ಲ, ಪ್ರಾಮಿಸ್.
    tr: Māvina ele tōraṇa nānu kaṭtīni. Ī sala ulṭā kaṭṭalla, prāmis.
    en: I'll tie up the mango-leaf garland. I won't hang it upside down this time, promise.
  - who: kiran
    t: ಕಳೆದ ಯುಗಾದಿಗೆ ನೀನು ಕಟ್ಟಿದ್ದು ಇನ್ನೂ ಅಜ್ಜಿ ನೆನಪಿಸ್ಕೊಂಡು ನಗ್ತಾರೆ.
    tr: Kaḷeda Yugādige nīnu kaṭṭiddu innū ajji nenapiskoṇḍu nagtāre.
    en: Ajji still laughs about the one you tied last Ugadi.
  - who: appa
    t: ಅಮ್ಮ ಆಗ್ಲೇ ಎದ್ದು, ಸ್ನಾನ ಮಾಡಿ, ರೇಷ್ಮೆ ಸೀರೆ ಉಟ್ಕೊಂಡು ಕೂತಿದಾರೆ. ಏಳು ಗಂಟೆಗೇ ರೆಡಿ!
    tr: Amma āglē eddu, snāna māḍi, rēṣme sīre uṭkoṇḍu kūtidāre. Ēḷu gaṇṭegē reḍi!
    en: Amma is already up, bathed, and sitting there in her silk saree. Ready at seven!
  - who: amma
    t: ಅದೇ ನನ್ನ ಭಯ. ಸ್ಟೆಂಟ್ ಹಾಕಿ ಇನ್ನೂ ಎರಡು ತಿಂಗಳೂ ಆಗಿಲ್ಲ. ಸಂಭ್ರಮದಲ್ಲಿ ಮೈ ಮರೆತು ಓಡಾಡ್ತಾರೆ, ನೋಡ್ತಿರಿ.
    tr: Adē nanna bhaya. Sṭeṇṭ hāki innū eraḍu tiṅgaḷū āgilla. Sambhramadalli mai maretu ōḍāḍtāre, nōḍtiri.
    en: That's exactly what scares me. It's not even two months since the stent. In all the excitement she'll forget herself and rush around, you'll see.
  - section: 👵 Ajji will not sit this out
    learn: 'prohibitions: -ಬಾರದು, -ಬೇಡ · ಯಾವ ಕಾರಣಕ್ಕೂ (for any reason) · -ಬೇಕು ಅಂದ್ರೆ (if … is to happen) · ಹಠ (stubbornness)'
  - scene: Ajji's room. She sits on her bed in a green silk saree, a plate of turmeric, kumkum and akshate beside her. Appa stands in the doorway with her pill box.
  - who: ajji
    t: ರಮೇಶ, ಇವತ್ತು ನನ್ನ ಮೊಮ್ಮಗಳ ಸೀಮಂತ. ಮನೆಗೆ ನಾನೇ ಹಿರಿಯಳು, ಮೊದಲ ಆಶೀರ್ವಾದ ನಂದೇ. ಶಾಸ್ತ್ರ ಮುಗಿಯೋವರೆಗೂ ಅವಳ ಪಕ್ಕದಲ್ಲೇ ಇರ್ತೀನಿ. ಅದರಲ್ಲಿ ಯಾವ ಮಾತೂ ಇಲ್ಲ.
    tr: Ramēsha, ivattu nanna mommagaḷa sīmanta. Manege nānē hiriyaḷu, modala āśīrvāda nandē. Śāstra mugiyōvaregū avaḷa pakkadallē irtīni. Adaralli yāva mātū illa.
    en: Ramesh, today is my granddaughter's seemantha. I'm the eldest in this house, so the first blessing is mine. I'll stay right beside her until the rituals are over. No arguments.
  - who: appa
    t: ಸರಿ ಅಮ್ಮ, ಮೊದಲ ಆಶೀರ್ವಾದ ನಿಮ್ದೇ. ಆದ್ರೆ ಕುರ್ಚಿ ಮೇಲೆ ಕೂತ್ಕೊಂಡೇ. ಡಾಕ್ಟ್ರು ಏನು ಹೇಳಿದ್ರು ನೆನಪಿದೆ ತಾನೇ? ಜಾಸ್ತಿ ಹೊತ್ತು ನಿಲ್ಲಬಾರದು, ಆಯಾಸ ಮಾಡ್ಕೊಳ್ಳಬಾರದು.
    tr: Sari amma, modala āśīrvāda nimdē. Ādre kurchi mēle kūtkoṇḍē. Ḍākṭru ēnu hēḷidru nenapide tānē? Jāsti hottu nillabāradu, āyāsa māḍkoḷḷabāradu.
    en: Fine, Amma, the first blessing is yours. But from the chair. You remember what the doctor said, don't you? No standing for long, and no wearing yourself out.
  - who: ajji
    t: ನೆಲದ ಮೇಲೆ ಮಣೆ ಹಾಕಿ ಕೂತ್ಕೊಳ್ತೀನಿ. ಕುರ್ಚಿ ಮೇಲೆ ಕೂತು ಆಶೀರ್ವಾದ ಮಾಡಿದ್ರೆ ನೆಂಟರು ಏನಂತಾರೆ?
    tr: Nelada mēle maṇe hāki kūtkoḷtīni. Kurchi mēle kūtu āśīrvāda māḍidre neṇṭaru ēnantāre?
    en: I'll sit on a wooden plank on the floor. If I bless her from a chair, what will the relatives say?
  - who: sam
    t: ಅಜ್ಜಿ, ನೆಂಟರು ಏನೂ ಅನ್ನಲ್ಲ. ಎಲ್ರೂ 'ನೋಡಿ, ಅಜ್ಜಿ ಎಷ್ಟು ಧೈರ್ಯವಾಗಿ ಬಂದಿದಾರೆ' ಅಂತಾರೆ. ಆದ್ರೆ ಕೆಳಗೆ ಕೂತ್ರೆ ಎದ್ದೇಳೋಕೆ ಕಷ್ಟ ಆಗುತ್ತೆ ಅಂತ ನಿನ್ನೆ ನೀವೇ ಹೇಳಿದ್ರಿ.
    tr: Ajji, neṇṭaru ēnū annalla. Ellrū 'nōḍi, ajji eṣṭu dhairyavāgi bandidāre' antāre. Ādre keḷage kūtre eddēḷōke kaṣṭa āgutte anta ninne nīvē hēḷidri.
    en: Ajji, the relatives won't say a thing. Everyone will say, 'Look how bravely Ajji has come.' But you said yourself yesterday that if you sit down low, it's hard to get up.
  - who: ajji
    t: ನೀನೂ ಇವರ ಪಾರ್ಟಿಗೆ ಸೇರ್ಕೊಂಡ್ಯಾ ಸ್ಯಾಮ್? ಸರಿ, ಕುರ್ಚಿನೇ ಆಗ್ಲಿ.
    tr: Nīnū ivara pārṭige sērkoṇḍyā Sām? Sari, kurchinē āgli.
    en: (smiling) So you've joined their side too, Sam? Fine, let it be the chair.
  - who: appa
    t: ಇನ್ನೊಂದು ವಿಷಯ. ಬೆಳಿಗ್ಗೆ ಮಾತ್ರೆ ತಗೊಂಡ್ರಾ? ತಿಂಡಿ ತಿಂದ್ರಾ?
    tr: Innondu viṣaya. Beḷigge mātre tagoṇḍrā? Tiṇḍi tindrā?
    en: One more thing. Did you take your morning tablets? Did you eat breakfast?
  - who: ajji
    t: ಶುಭ ಕಾರ್ಯ ಅಲ್ವಾ, ಪೂಜೆ ಮುಗಿಯೋವರೆಗೂ ಉಪವಾಸ ಇರ್ತೀನಿ. ಮಾತ್ರೆ ಆಮೇಲೆ ತಗೋತೀನಿ.
    tr: Śubha kārya alvā, pūje mugiyōvaregū upavāsa irtīni. Mātre āmēle tagōtīni.
    en: It's an auspicious day, isn't it? I'll fast until the puja is over. I'll take the tablets afterwards.
  - who: appa
    t: ಅಮ್ಮಾ, ಅದು ಮಾತ್ರ ಆಗಲ್ಲ. ರಕ್ತ ತೆಳು ಮಾಡೋ ಮಾತ್ರೆ ಯಾವ ಕಾರಣಕ್ಕೂ ತಪ್ಪಿಸಬಾರದು ಅಂತ ಡಾಕ್ಟ್ರು ಮೀರಾ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದಾರೆ. ಖಾಲಿ ಹೊಟ್ಟೇಲಿ ತಗೊಂಡ್ರೆ ಹೊಟ್ಟೆ ಉರಿ ಬರುತ್ತೆ. ಎರಡು ಇಡ್ಲಿ ತಿನ್ನಿ, ಆಮೇಲೆ ಮಾತ್ರೆ.
    tr: Ammā, adu mātra āgalla. Rakta teḷu māḍō mātre yāva kāraṇakkū tappisabāradu anta ḍākṭru Mīrā spaṣṭavāgi hēḷidāre. Khāli hoṭṭēli tagoṇḍre hoṭṭe uri barutte. Eraḍu iḍli tinni, āmēle mātre.
    en: Amma, that one I won't allow. Dr. Meera said very clearly that the blood thinner must not be skipped for any reason. On an empty stomach it'll give you acidity. Eat two idlis, then the tablet.
  - who: ajji
    t: ದೇವರೇ… ಆ ಡಾಕ್ಟ್ರಮ್ಮ ನನ್ನ ಉಪವಾಸನೂ ಕಿತ್ಕೊಂಡ್ಬಿಟ್ರು.
    tr: Dēvarē… ā ḍākṭramma nanna upavāsanū kitkoṇḍbiṭru.
    en: (sighing) Oh God… that lady doctor has taken even my fasting away from me.
  - who: appa
    t: ಅವರು ನಿಮ್ಮ ಜೀವ ಉಳಿಸಿದಾರೆ ಅಮ್ಮ. ಒಂದು ಉಪವಾಸ ತಪ್ಪಿದ್ರೆ ದೇವರು ಕ್ಷಮಿಸ್ತಾನೆ.
    tr: Avaru nimma jīva uḷisidāre amma. Ondu upavāsa tappidre dēvaru kṣamistāne.
    en: She saved your life, Amma. God will forgive one missed fast.
  - who: ajji
    t: ಸರಿ ಸರಿ, ಇಡ್ಲಿ ತಗೊಂಡ್ ಬಾ. ನನ್ನ ಮರಿಮಗುನ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಬೇಕು ಅಂದ್ರೆ ನಿಮ್ಮೆಲ್ಲರ ಮಾತು ಕೇಳ್ಲೇಬೇಕು.
    tr: Sari sari, iḍli tagoṇḍ bā. Nanna marimaguna kaiyalli ettikoḷbēku andre nimmellara mātu kēḷlēbēku.
    en: All right, all right, bring the idlis. If I'm going to hold my great-grandchild in my arms, I suppose I have to listen to all of you.
  - section: 🙏 The priest and the rituals
    learn: 'ritual words: ಸಂಕಲ್ಪ, ಅಕ್ಷತೆ, ಬಳೆ ಶಾಸ್ತ್ರ, ಮಡಿಲು ತುಂಬು, ಮುತ್ತೈದೆ, ಆರತಿ, ಬೀಗತಿ · blessings with -ಲಿ: ಸುಖ ಪ್ರಸವ ಆಗಲಿ'
  - scene: Half past ten. The hall is full. Shwetha sits on a decorated seat in a new green silk saree, jasmine in her hair, Pradeep beside her. Sumitra and Shankar came early and have been helping in the kitchen. Ajji sits in her armchair at the front.
  - who: purohit
    t: ಎಲ್ಲರೂ ಸ್ವಲ್ಪ ಶಾಂತವಾಗಿ ಕೂತ್ಕೊಳ್ಳಿ. ಮೊದಲು ಗಣಪತಿ ಪೂಜೆ, ಆಮೇಲೆ ಸಂಕಲ್ಪ. ಶ್ವೇತಾ ಅವರೇ, ಪ್ರದೀಪ್ ಅವರೇ, ಕೈಯಲ್ಲಿ ಸ್ವಲ್ಪ ಅಕ್ಷತೆ ಹಿಡ್ಕೊಳ್ಳಿ.
    tr: Ellarū svalpa śāntavāgi kūtkoḷḷi. Modalu Gaṇapati pūje, āmēle saṅkalpa. Shwētā avarē, Pradīp avarē, kaiyalli svalpa akṣate hiḍkoḷḷi.
    en: Everyone, please settle down. First the Ganapati puja, then the sankalpa, the formal vow. Shwetha, Pradeep, hold a little akshate in your hands.
  - who: sam
    t: ಅಕ್ಷತೆ ಅಂದ್ರೆ ಏನು ಕಿರಣ್?
    tr: Akṣate andre ēnu Kiraṇ?
    en: (whispering) What's akshate, Kiran?
  - who: kiran
    t: ಅರಿಶಿನ ಹಚ್ಚಿದ ಅಕ್ಕಿ. ಆಶೀರ್ವಾದ ಮಾಡೋವಾಗ ತಲೆ ಮೇಲೆ ಹಾಕ್ತಾರೆ. ಕೊನೇಲಿ ನಿನ್ನ ಕೈಗೂ ಕೊಡ್ತಾರೆ, ರೆಡಿಯಾಗಿರು.
    tr: Ariśina hachchida akki. Āśīrvāda māḍōvāga tale mēle hāktāre. Konēli ninna kaigū koḍtāre, reḍiyāgiru.
    en: (whispering) Rice coloured with turmeric. People sprinkle it on your head when they bless you. They'll hand you some at the end too, so be ready.
  - who: purohit
    t: ಇದು ಸೀಮಂತೋನ್ನಯನ ಸಂಸ್ಕಾರ. ತಾಯಿಯ ಮನಸ್ಸು ಸಂತೋಷವಾಗಿದ್ರೆ ಹೊಟ್ಟೆಯಲ್ಲಿರೋ ಮಗುವೂ ಸಂತೋಷವಾಗಿರುತ್ತೆ ಅಂತ ನಮ್ಮ ಹಿರಿಯರು ನಂಬಿದ್ರು. ಅದಕ್ಕೇ ಇವತ್ತು ಈ ಹುಡುಗಿಗೆ ಯಾವ ಚಿಂತೆನೂ ಇರಬಾರದು, ಯಾರೂ ಅವಳಿಗೆ ಬೇಜಾರು ಮಾಡಬಾರದು.
    tr: Idu sīmantōnnayana saṁskāra. Tāyiya manassu santōṣavāgidre hoṭṭeyallirō maguvū santōṣavāgirutte anta namma hiriyaru nambidru. Adakkē ivattu ī huḍugige yāva chintenū irabāradu, yārū avaḷige bējāru māḍabāradu.
    en: This is the seemantonnayana samskara. Our elders believed that if the mother's mind is happy, the baby in her womb is happy too. That's why today this girl must not have a single worry, and nobody must upset her.
  - who: purohit
    t: ಮೊದಲು ಮನೆಯ ಹಿರಿಯರ ಆಶೀರ್ವಾದ. ಅಜ್ಜಿ, ನೀವು ಕೂತಲ್ಲೇ ಇರಿ, ಹುಡುಗಿನೇ ನಿಮ್ಮ ಹತ್ರ ಬರ್ತಾಳೆ.
    tr: Modalu maneya hiriyara āśīrvāda. Ajji, nīvu kūtallē iri, huḍuginē nimma hatra bartāḷe.
    en: First, the blessing of the eldest of the house. Ajji, stay where you are; the girl will come to you.
  - who: ajji
    t: ಬಾ ಮಗಳೇ, ತಲೆ ಬಗ್ಗಿಸು. ಸುಖ ಪ್ರಸವ ಆಗ್ಲಿ. ತಾಯಿ-ಮಗು ಇಬ್ರೂ ನೂರು ವರ್ಷ ಚೆನ್ನಾಗಿರಿ. ಗಂಡೋ ಹೆಣ್ಣೋ, ದೇವರು ಕೊಟ್ಟಿದ್ದು ನಮ್ಮ ಭಾಗ್ಯ.
    tr: Bā magaḷē, tale baggisu. Sukha prasava āgli. Tāyi-magu ibrū nūru varṣa chennāgiri. Gaṇḍō heṇṇō, dēvaru koṭṭiddu namma bhāgya.
    en: Come, my girl, bow your head. May the birth be easy. May mother and child both live well for a hundred years. Boy or girl, whatever God gives is our good fortune.
  - who: shwe
    t: ಅಜ್ಜಿ… ಆಗಸ್ಟ್‌ನಲ್ಲಿ ಆ ರಾತ್ರಿ, ನೀವು ಇಲ್ಲಿ ಕೂತು ನನಗೆ ಆಶೀರ್ವಾದ ಮಾಡ್ತೀರಾ ಅಂತ ನಾನು ಅಂದ್ಕೊಂಡಿರಲಿಲ್ಲ.
    tr: Ajji… Āgasṭnalli ā rātri, nīvu illi kūtu nanage āśīrvāda māḍtīrā anta nānu andkoṇḍiralilla.
    en: (tearful) Ajji… that night in August, I never thought you'd be sitting here blessing me.
  - who: ajji
    t: ಅಳಬಾರದು ಕಣೇ, ಇವತ್ತು ಅಳಬಾರದು. ಪುರೋಹಿತರೇ ಹೇಳಿದ್ರಲ್ಲ. ದೇವರು ನನ್ನನ್ನ ಇದಕ್ಕೇ ಉಳಿಸಿದ್ದು.
    tr: Aḷabāradu kaṇē, ivattu aḷabāradu. Purōhitarē hēḷidralla. Dēvaru nannanna idakkē uḷisiddu.
    en: No crying, dear, not today. You heard the priest. God kept me alive for exactly this.
  - who: purohit
    t: ಈಗ ಬಳೆ ಶಾಸ್ತ್ರ. ಮುತ್ತೈದೆಯರು ಬನ್ನಿ. ಹುಡುಗಿಯ ತಾಯಿ ಮತ್ತು ಬೀಗತಿಯವರು, ಅಂದ್ರೆ ಹುಡುಗನ ತಾಯಿ, ಇಬ್ರೂ ಒಟ್ಟಿಗೆ ಮೊದಲ ಬಳೆ ತೊಡಿಸಿ. ಬಳೆ ಸದ್ದು ಹೊಟ್ಟೆಯಲ್ಲಿರೋ ಮಗುವಿಗೆ ಕೇಳಿಸುತ್ತೆ ಅಂತಾರೆ.
    tr: Īga baḷe śāstra. Muttaideyaru banni. Huḍugiya tāyi mattu bīgatiyavaru, andre huḍugana tāyi, ibrū oṭṭige modala baḷe toḍisi. Baḷe saddu hoṭṭeyallirō maguvige kēḷisutte antāre.
    en: Now the bangle ceremony. Married women, please come. The girl's mother and her beegathi — the boy's mother — put on the first bangles together. They say the baby in the womb can hear the bangles jingle.
  - who: sumitra
    t: ಬನ್ನಿ ಲಕ್ಷ್ಮಿ ಅವರೇ, ನೀವು ಎಡಗೈಗೆ, ನಾನು ಬಲಗೈಗೆ. ನಿಧಾನ… ಹಸಿರು ಬಳೆ ಸ್ವಲ್ಪ ಬಿಗಿ ಇದೆ.
    tr: Banni Lakshmī avarē, nīvu eḍagaige, nānu balagaige. Nidhāna… hasiru baḷe svalpa bigi ide.
    en: Come, Lakshmi — you take the left hand, I'll take the right. Gently… the green bangles are a little tight.
  - who: amma
    t: ಮದುವೆಗೆ ಮುಂಚೆ ಯಾರಾದ್ರೂ 'ನೀವಿಬ್ರೂ ಹೀಗೆ ಒಟ್ಟಿಗೆ ಬಳೆ ತೊಡಿಸ್ತೀರಾ' ಅಂತ ಹೇಳಿದ್ರೆ ನಾನು ನಂಬ್ತಿರಲಿಲ್ಲ, ಸುಮಿತ್ರಾ ಅವರೇ.
    tr: Maduvege munche yārādrū 'nīvibrū hīge oṭṭige baḷe toḍistīrā' anta hēḷidre nānu nambtiralilla, Sumitrā avarē.
    en: (softly) Before the wedding, if anyone had told me the two of us would put on bangles together like this, I wouldn't have believed it, Sumitra.
  - who: sumitra
    t: ನಾನೂ ನಂಬ್ತಿರಲಿಲ್ಲ. ಆಗ ನಾನು ದೊಡ್ಡ ತಪ್ಪು ಮಾಡಿದೆ. ಅದನ್ನ ಮರೆತು ನನ್ನ ಸೊಸೆಯ ಮಡಿಲು ತುಂಬಿಸೋ ಭಾಗ್ಯ ಕೊಟ್ರಿ. ಅದಕ್ಕಿಂತ ದೊಡ್ಡದು ಏನೂ ಇಲ್ಲ.
    tr: Nānū nambtiralilla. Āga nānu doḍḍa tappu māḍide. Adanna maretu nanna soseya maḍilu tumbisō bhāgya koṭri. Adakkinta doḍḍadu ēnū illa.
    en: Neither would I. I made a big mistake back then. You put it behind you and gave me the blessing of filling my daughter-in-law's lap. Nothing is bigger than that.
  - who: purohit
    t: ಈಗ ಮಡಿಲು ತುಂಬಿ. ತೆಂಗಿನಕಾಯಿ, ಐದು ಥರದ ಹಣ್ಣು, ರವಿಕೆ ಕಣ, ಅಕ್ಕಿ, ಎಲೆ-ಅಡಿಕೆ, ಹೂವು. ಆಮೇಲೆ ಮುತ್ತೈದೆಯರು ಆರತಿ ಎತ್ತಿ, ಎಲ್ಲರೂ ಅಕ್ಷತೆ ಹಾಕಿ ಆಶೀರ್ವಾದ ಮಾಡಿ.
    tr: Īga maḍilu tumbi. Teṅginakāyi, aidu tharada haṇṇu, ravike kaṇa, akki, ele-aḍike, hūvu. Āmēle muttaideyaru ārati etti, ellarū akṣate hāki āśīrvāda māḍi.
    en: 'Now fill her lap: coconut, five kinds of fruit, a blouse piece, rice, betel leaves and nuts, flowers. Then the married women wave the arathi, and everyone sprinkle akshate and give your blessing.'
  - who: shankar
    t: ಶ್ವೇತಾ, ಮಗಳೇ… ನಿಂಗೆ ಏನು ಬೇಕಾದ್ರೂ ಸಂಕೋಚ ಇಲ್ಲದೆ ಕೇಳು. ಈ ಮನೆ, ಆ ಮನೆ ಅಂತ ಇಲ್ಲ. ಎರಡೂ ನಿನ್ನವೇ.
    tr: Shwētā, magaḷē… ninge ēnu bēkādrū saṅkōcha illade kēḷu. Ī mane, ā mane anta illa. Eraḍū ninnavē.
    en: Shwetha, my girl… whatever you need, ask without hesitating. There's no 'this house' and 'that house'. Both are yours.
  - who: pradeep
    t: ಅಪ್ಪ ಇಷ್ಟು ಮಾತಾಡಿದ್ದು ನಾನು ಇತ್ತೀಚೆಗೆ ಕೇಳೇ ಇಲ್ಲ. ಥ್ಯಾಂಕ್ಸ್ ಅಪ್ಪ.
    tr: Appa iṣṭu mātāḍiddu nānu ittīchege kēḷē illa. Thyāṅks appa.
    en: I haven't heard Appa say this much in a long time. Thanks, Appa.
  - section: 🍲 Everybody's advice
    learn: 'reported advice: -ಅಂತಾರೆ, -ಅಂತೆ · ಉಷ್ಣ (heaty) · polite disagreement: ನೀವು ಹೇಳೋದು ಪ್ರೀತಿಯಿಂದ ಅಂತ ಗೊತ್ತು, ಆದ್ರೆ… · ಹಸಿ vs ಹಣ್ಣಾದ'
  - scene: Lunch on banana leaves. Relatives gather around Shwetha, and each of them has advice.
  - who: vimala
    t: ಶ್ವೇತಾ, ಇನ್ನು ಮೇಲೆ ದಿನಾ ಒಂದು ಚಮಚ ತುಪ್ಪ ಜಾಸ್ತಿ ತಿನ್ನು. ತುಪ್ಪ ತಿಂದ್ರೆ ಹೆರಿಗೆ ಸಲೀಸಾಗುತ್ತೆ ಅಂತಾರೆ. ನನ್ನ ಸೊಸೆಗೆ ಹಾಗೇ ಆಯ್ತು.
    tr: Shwētā, innu mēle dinā ondu chamacha tuppa jāsti tinnu. Tuppa tindre herige salīsāgutte antāre. Nanna sosege hāgē āytu.
    en: Shwetha, from now on eat an extra spoon of ghee every day. They say ghee makes the delivery smooth. That's how it went for my daughter-in-law.
  - who: shwe
    t: ಆಂಟಿ, ನೀವು ಹೇಳೋದು ಪ್ರೀತಿಯಿಂದ ಅಂತ ಗೊತ್ತು. ಆದ್ರೆ ನನಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಇದೆ. ಸಿಹಿ, ಎಣ್ಣೆ, ತುಪ್ಪ ಕಮ್ಮಿ ಮಾಡು, ದಿನಾ ಅರ್ಧ ಗಂಟೆ ನಡಿ ಅಂತ ಡಾಕ್ಟ್ರು ಉಷಾ ಹೇಳಿದಾರೆ. ಶುಗರ್ ಜಾಸ್ತಿ ಆದ್ರೆ ಮಗು ತುಂಬಾ ದೊಡ್ಡದಾಗಬಹುದಂತೆ, ಆಮೇಲೆ ಹೆರಿಗೆನೇ ಕಷ್ಟ ಆಗುತ್ತಂತೆ.
    tr: Āṇṭi, nīvu hēḷōdu prītiyinda anta gottu. Ādre nanage śugar bārḍarlain ide. Sihi, eṇṇe, tuppa kammi māḍu, dinā ardha gaṇṭe naḍi anta ḍākṭru Uṣā hēḷidāre. Śugar jāsti ādre magu tumbā doḍḍadāgabahudante, āmēle herigenē kaṣṭa āguttante.
    en: Aunty, I know you say it out of love. But my sugar is borderline. Dr. Usha told me to cut down sweets, oil and ghee and walk half an hour every day. Apparently if the sugar goes up, the baby can grow too big, and then the delivery itself gets harder.
  - who: vimala
    t: ಅಯ್ಯೋ, ಈಗಿನ ಡಾಕ್ಟ್ರುಗಳು ಎಲ್ಲದಕ್ಕೂ 'ಬೇಡ' ಅಂತಾರೆ. ನಮ್ಮ ಕಾಲದಲ್ಲಿ ಬಸುರಿ ಇಬ್ಬರಿಗೆ ತಿನ್ನಬೇಕು ಅಂತ ಹೇಳ್ತಿದ್ರು.
    tr: Ayyō, īgina ḍākṭrugaḷu elladakkū 'bēḍa' antāre. Namma kāladalli basuri ibbarige tinnabēku anta hēḷtidru.
    en: Oh, today's doctors say 'no' to everything. In our day they said a pregnant woman should eat for two.
  - who: sumitra
    t: ವಿಮಲಾ ಅವರೇ, ಇಬ್ಬರಿಗೆ ತಿನ್ನೋದು ಮುಖ್ಯ ಅಲ್ಲ, ಇಬ್ಬರಿಗೋಸ್ಕರ ಒಳ್ಳೇದನ್ನ ತಿನ್ನೋದು ಮುಖ್ಯ. ನನ್ನ ಸೊಸೆ ತನ್ನ ಡಾಕ್ಟ್ರ ಮಾತು ಕೇಳ್ತಾಳೆ, ಅದೇ ಸರಿ.
    tr: Vimalā avarē, ibbarige tinnōdu mukhya alla, ibbarigōskara oḷḷēdanna tinnōdu mukhya. Nanna sose tanna ḍākṭra mātu kēḷtāḷe, adē sari.
    en: Vimala, what matters isn't eating for two, it's eating well for the two of them. My daughter-in-law listens to her doctor, and that's right.
  - who: shwe
    t: ಕೇಳಿಸ್ಕೊಂಡ್ಯಾ? ನಿಮ್ಮಮ್ಮ ನನ್ನ ಪರ ಮಾತಾಡಿದ್ರು!
    tr: Kēḷiskoṇḍyā? Nimmamma nanna para mātāḍidru!
    en: (quietly, to Pradeep) Did you hear that? Your mother took my side!
  - who: pradeep
    t: ಕೇಳಿಸ್ಕೊಂಡೆ. ಅಮ್ಮ ತುಂಬಾ ಬದಲಾಗಿದಾರೆ, ಶ್ವೇತಾ. ಅಜ್ಜಿ ಆಸ್ಪತ್ರೆಯಲ್ಲಿದ್ದಾಗ ಏನೋ ಬದಲಾಯ್ತು ಅವರಲ್ಲಿ.
    tr: Kēḷiskoṇḍe. Amma tumbā badalāgidāre, Shwētā. Ajji āspatreyalliddāga ēnō badalāytu avaralli.
    en: (quietly) I heard. Amma has changed a lot, Shwetha. Something changed in her while Ajji was in hospital.
  - who: ajji
    t: ವಿಮಲಾ, ಡಾಕ್ಟ್ರ ಮಾತನ್ನ ಹಗುರವಾಗಿ ತಗೋಬೇಡ. ಆಗಸ್ಟ್‌ನಲ್ಲಿ ನಾನು 'ಗ್ಯಾಸ್ ಅಷ್ಟೇ, ಏನೂ ಆಗಿಲ್ಲ' ಅಂತ ಹಠ ಮಾಡಿದ್ರೆ ಇವತ್ತು ಇಲ್ಲಿ ಕೂತಿರ್ತಿರಲಿಲ್ಲ.
    tr: Vimalā, ḍākṭra mātanna haguravāgi tagōbēḍa. Āgasṭnalli nānu 'gyās aṣṭē, ēnū āgilla' anta haṭha māḍidre ivattu illi kūtirtiralilla.
    en: Vimala, don't take what doctors say lightly. In August, if I'd stubbornly insisted 'it's only gas, nothing's wrong', I wouldn't be sitting here today.
  - who: vimala
    t: ಅದೂ ನಿಜ ಅಜ್ಜಿ. ಸರಿ, ತುಪ್ಪ ಬೇಡ. ಆದ್ರೆ ಪಪ್ಪಾಯಿ ಮಾತ್ರ ಮುಟ್ಟಬೇಡ ಶ್ವೇತಾ, ಉಷ್ಣ!
    tr: Adū nija ajji. Sari, tuppa bēḍa. Ādre pappāyi mātra muṭṭabēḍa Shwētā, uṣṇa!
    en: That's true too, Ajji. Fine, no ghee. But don't you touch papaya, Shwetha — it's heaty!
  - who: shwe
    t: 'ಆಂಟಿ, ಪಪ್ಪಾಯಿ ಕೇಸ್ ಮಾರ್ಚ್‌ನಲ್ಲೇ ಮುಗೀತು. ಅಜ್ಜಿನೂ ಡಾಕ್ಟ್ರೂ ಇಬ್ರೂ ಖುಷಿ ಆಗೋ ತೀರ್ಪು: ಹೆರಿಗೆ ಆಗೋವರೆಗೂ ಪಪ್ಪಾಯಿ ಮುಟ್ಟಲ್ಲ. ಪ್ರಾಮಿಸ್.'
    tr: 'Āṇṭi, pappāyi kēs mārch-nallē mugītu. Ajjinū ḍākṭrū ibrū khuṣi āgō tīrpu: herige āgōvaregū pappāyi muṭṭalla. Prāmis.'
    en: 'Aunty, the papaya case was closed back in March, with a verdict that keeps both Ajji and the doctor happy: no papaya until the baby comes. Promise.'
  - who: sam
    t: ಶ್ವೇತಾ ಒಳ್ಳೆ ಡಿಪ್ಲೊಮ್ಯಾಟ್ ಆಗಿದಾಳೆ. ಆಫೀಸಲ್ಲಿ ಟೀಮ್ ಲೀಡ್ ಆಗಿದ್ದು ವ್ಯರ್ಥ ಆಗಿಲ್ಲ.
    tr: Shwētā oḷḷe ḍiplomyāṭ āgidāḷe. Āphīsalli ṭīm līḍ āgiddu vyartha āgilla.
    en: Shwetha's become quite the diplomat. Being a team lead at the office hasn't gone to waste.
  - who: kiran
    t: ಅಕ್ಕ, ಇದು ನಿನ್ನ ಬಯಕೆ ಊಟ. ಇವತ್ತು ನೀನು ಏನು ಕೇಳಿದ್ರೂ ಸಿಗುತ್ತೆ. ಹೇಳು, ಏನು ಬೇಕು?
    tr: Akka, idu ninna bayake ūṭa. Ivattu nīnu ēnu kēḷidrū sigutte. Hēḷu, ēnu bēku?
    en: Akka, this is your craving meal. Today you get anything you ask for. Tell me, what do you want?
  - who: shwe
    t: ಇನ್ನೊಂದು ಸೌಟು ಪುಳಿಯೋಗರೆ, ಜೊತೆಗೆ ನಿಂಬೆಕಾಯಿ ಉಪ್ಪಿನಕಾಯಿ. ಸಿಹಿ ಬೇಡ, ಈ ತಿಂಗಳೆಲ್ಲಾ ಬರೀ ಹುಳಿ ಬೇಕು ಅನ್ಸುತ್ತೆ.
    tr: Innondu sauṭu puḷiyōgare, jotege nimbekāyi uppinakāyi. Sihi bēḍa, ī tiṅgaḷellā barī huḷi bēku ansutte.
    en: Another ladle of puliyogare, with lemon pickle. No sweets — this whole month I've wanted nothing but sour things.
  - section: 🧳 Going to her mother's home
    learn: ತವರು ಮನೆ (a woman's parental home) · ಕಳಿಸು (send off), ಒಪ್ಪಿಸು (hand over) · -ಆದ್ಮೇಲೆ (after) · who pays for the delivery
  - scene: 'Evening. The guests have gone. On the veranda: Pradeep, Shwetha, Appa, Amma, Sumitra and Shankar. A suitcase stands by the door — Shwetha will now stay at her parents'' house until the delivery.'
  - who: sumitra
    t: ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಸೀಮಂತ ಆದ್ಮೇಲೆ ಹುಡುಗಿನ ತವರು ಮನೆಗೆ ಕಳಿಸ್ತೀವಿ. ಲಕ್ಷ್ಮಿ ಅವರೇ, ನಮ್ಮ ಸೊಸೆನ ನಿಮ್ಮ ಕೈಗೆ ಒಪ್ಪಿಸ್ತಿದೀವಿ. ಜೋಪಾನವಾಗಿ ನೋಡ್ಕೊಳ್ಳಿ.
    tr: Sampradāyada prakāra sīmanta ādmēle huḍugina tavaru manege kaḷistīvi. Lakshmī avarē, namma sosena nimma kaige oppistidīvi. Jōpānavāgi nōḍkoḷḷi.
    en: By tradition, after the seemantha we send the girl to her mother's home. Lakshmi, we're placing our daughter-in-law in your hands. Look after her carefully.
  - who: amma
    t: ಅವಳು ನಮ್ಮ ಮಗಳೂ ಹೌದು, ನಿಮ್ಮ ಸೊಸೆನೂ ಹೌದು. ನೀವು ಯಾವಾಗ ಬೇಕಾದ್ರೂ ಬನ್ನಿ, ಫೋನ್ ಮಾಡಿ ಬರೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ.
    tr: Avaḷu namma magaḷū haudu, nimma sosenū haudu. Nīvu yāvāga bēkādrū banni, phōn māḍi barō avaśyakate illa.
    en: She's our daughter and your daughter-in-law both. Come whenever you like — there's no need to call before you come.
  - who: pradeep
    t: ನಾನು ಜೆಪಿ ನಗರದಿಂದ ದಿನಾ ಸಂಜೆ ಬರ್ತೀನಿ. ನನ್ನ ಆಫೀಸ್ ಕಾಲ್‌ಗಳೆಲ್ಲಾ ರಾತ್ರಿನೇ ಇರ್ತವೆ, ಅವನ್ನ ಇಲ್ಲಿಂದಾನೇ ಮಾಡ್ಬಹುದು. ಲ್ಯಾಪ್‌ಟಾಪ್ ತಗೊಂಡು ಬರ್ತೀನಿ.
    tr: Nānu Jepi Nagaradinda dinā sañje bartīni. Nanna āphīs kālgaḷellā rātrinē irtave, avanna illindānē māḍbahudu. Lyāpṭāp tagoṇḍu bartīni.
    en: I'll come over from JP Nagar every evening. All my office calls are at night anyway; I can take them from here. I'll bring my laptop.
  - who: appa
    t: ಇನ್ನೊಂದು ವಿಷಯ, ಹೆರಿಗೆ ಖರ್ಚು. ಮೊದಲ ಹೆರಿಗೆ ಖರ್ಚು ತವರು ಮನೆಯವರೇ ನೋಡ್ಕೋಬೇಕು ಅನ್ನೋದು ನಮ್ಮ ಕಡೆ ಪದ್ಧತಿ. ಆಸ್ಪತ್ರೆ ಬಿಲ್ ನಾನು ಕಟ್ತೀನಿ.
    tr: Innondu viṣaya, herige kharchu. Modala herige kharchu tavaru maneyavarē nōḍkōbēku annōdu namma kaḍe paddhati. Āspatre bil nānu kaṭtīni.
    en: 'One more thing: the delivery costs. Where we come from, the mother''s family bears the cost of the first delivery. I''ll pay the hospital bill.'
  - who: pradeep
    t: ಮಾವ, ಬೇಡ. ನಮ್ಮ ಇನ್ಶೂರೆನ್ಸ್‌ನಲ್ಲಿ ಮೆಟರ್ನಿಟಿ ಕವರ್ ಇದೆ, ಲಿಮಿಟ್ ಮೀರಿದ್ದನ್ನ ನಾವು ಕಟ್ತೀವಿ. ಅಜ್ಜಿ ಆಸ್ಪತ್ರೆ ಖರ್ಚು ಆಗಿ ಇನ್ನೂ ಎರಡು ತಿಂಗಳೂ ಆಗಿಲ್ಲ.
    tr: Māva, bēḍa. Namma inśūrensnalli meṭarniṭi kavar ide, limiṭ mīriddanna nāvu kaṭtīvi. Ajji āspatre kharchu āgi innū eraḍu tiṅgaḷū āgilla.
    en: Mava, please don't. Our insurance has maternity cover, and whatever goes over the limit, we'll pay. It's not even two months since Ajji's hospital expenses.
  - who: shankar
    t: 'ರಮೇಶ್ ಅವರೇ, ಹಳೇ ಪದ್ಧತಿಗಳಲ್ಲಿ ಕೆಲವನ್ನ ನಾವು ಬಿಟ್ಟಿದೀವಿ. ವರದಕ್ಷಿಣೆಯಂಥ ಕೆಟ್ಟದ್ದನ್ನ ಬಿಟ್ಟಿದ್ದು ತುಂಬಾ ತಡವಾಗಿ, ಅದಕ್ಕೆ ನನಗೆ ಈಗಲೂ ನಾಚಿಕೆ ಆಗುತ್ತೆ. ಇದನ್ನ ಹಂಚ್ಕೊಳ್ಳೋಣ: ಇನ್ಶೂರೆನ್ಸ್ ಮೀರಿದ್ದು ಮಕ್ಕಳು ಕಟ್ಟಲಿ, ಅದಕ್ಕೆ ನಾವೂ ಒಂದು ಪಾಲು ಕೊಡ್ತೀವಿ. ಶ್ವೇತಾ ಆಗ್ಲೇ ಒಪ್ಕೊಂಡಿದ್ದಾಳೆ. ನೀವು ಈಗ ತಾನೇ ಅಜ್ಜಿ ಖರ್ಚು ನೋಡಿದ್ದೀರಿ.'
    tr: 'Ramēsh avarē, haḷē paddhatigaḷalli kelavanna nāvu biṭṭidīvi. Varadakṣiṇeyantha keṭṭaddanna biṭṭiddu tumbā taḍavāgi, adakke nanage īgalū nāchike āgutte. Idanna hañchkoḷḷōṇa: inśūrens mīriddu makkaḷu kaṭṭali, adakke nāvū ondu pālu koḍtīvi. Shwētā āglē opkoṇḍiddāḷe. Nīvu īga tānē ajji kharchu nōḍiddīri.'
    en: 'Ramesh, we''ve left some old customs behind. We dropped a bad one like dowry far too late, and I''m still ashamed of that. Let''s share this one: the children pay what the insurance doesn''t, and we put in a share towards it. Shwetha has already agreed. You''ve only just had Ajji''s expenses.'
  - who: appa
    t: ಶಂಕರ್ ಅವರೇ, ನೀವು ಹಾಗಂದ ಮೇಲೆ ನಾನೇನು ಹೇಳಲಿ. ಸರಿ, ಹಾಗೇ ಮಾಡೋಣ.
    tr: Śaṅkar avarē, nīvu hāganda mēle nānēnu hēḷali. Sari, hāgē māḍōṇa.
    en: Shankar, after you've said that, what can I say? All right, let's do it that way.
  - who: amma
    t: 'ಆಸ್ಪತ್ರೆ ಬ್ಯಾಗ್ ಈಗ್ಲೇ ರೆಡಿ ಮಾಡಿಡೋಣ. ಡಾಕ್ಟ್ರು ಉಷಾ ಕೊಟ್ಟ ಲಿಸ್ಟ್ ಇದೆ: ಫೈಲ್, ಸ್ಕ್ಯಾನ್ ರಿಪೋರ್ಟ್‌ಗಳು, ತಾಯಿ ಕಾರ್ಡ್, ಇನ್ಶೂರೆನ್ಸ್ ಕಾರ್ಡ್, ಆಧಾರ್, ಶ್ವೇತಾಗೆ ಸಡಿಲ ನೈಟಿ, ಮಗುವಿಗೆ ಹತ್ತಿ ಬಟ್ಟೆ, ಟವಲ್.'
    tr: 'Āspatre byāg īglē reḍi māḍiḍōṇa. Ḍākṭru Uṣā koṭṭa lisṭ ide: phail, skyān riporṭgaḷu, tāyi kārḍ, inśūrens kārḍ, ādhār, Shwētāge saḍila naiṭi, maguvige hatti baṭṭe, ṭaval.'
    en: 'Let''s get the hospital bag ready right now. There''s the list Dr. Usha gave: the file, the scan reports, the Thayi card, insurance card, Aadhaar, a loose nightie for Shwetha, soft cotton clothes and a towel for the baby.'
  - who: shwe
    t: ಡ್ಯೂ ಡೇಟ್ ನವೆಂಬರ್ ಹತ್ತು ಅಮ್ಮ. ಇನ್ನೂ ಏಳು ವಾರ ಇದೆ, ಈಗ್ಲೇ ಯಾಕೆ ಬ್ಯಾಗ್?
    tr: Ḍyū ḍēṭ navembar hattu amma. Innū ēḷu vāra ide, īglē yāke byāg?
    en: The due date is the tenth of November, Amma. That's seven weeks away — why the bag already?
  - who: amma
    t: ಮಗು ಕ್ಯಾಲೆಂಡರ್ ನೋಡ್ಕೊಂಡು ಬರಲ್ಲ ಕಣೇ. ನೀನು ಹುಟ್ಟಿದ್ದು ಡ್ಯೂ ಡೇಟ್‌ಗಿಂತ ಹತ್ತು ದಿನ ಮುಂಚೆ, ಮಧ್ಯರಾತ್ರಿ ಎರಡು ಗಂಟೆಗೆ.
    tr: Magu kyāleṇḍar nōḍkoṇḍu baralla kaṇē. Nīnu huṭṭiddu ḍyū ḍēṭginta hattu dina munche, madhyarātri eraḍu gaṇṭege.
    en: Babies don't check the calendar before they come, dear. You were born ten days before your due date, at two in the morning.
  - who: ajji
    t: ಅವತ್ತು ನಾನು ರಾತ್ರಿ ಆಟೋ ಹುಡುಕ್ಕೊಂಡು ರೋಡಲ್ಲಿ ಓಡಿದ್ದು ಇನ್ನೂ ನೆನಪಿದೆ. ಈಗ ಓಡೋಕಾಗಲ್ಲ, ಅದಕ್ಕೇ ಸ್ಯಾಮ್ ಇದಾನೆ.
    tr: Avattu nānu rātri āṭō huḍukkoṇḍu rōḍalli ōḍiddu innū nenapide. Īga ōḍōkāgalla, adakkē Sām idāne.
    en: I still remember running down the road that night looking for an auto. I can't run now — that's what Sam is for.
  - who: sam
    t: ಕಾರಲ್ಲಿ ಯಾವಾಗ್ಲೂ ಅರ್ಧ ಟ್ಯಾಂಕ್ ಪೆಟ್ರೋಲ್ ಇಟ್ಟಿರ್ತೀನಿ ಅಜ್ಜಿ. ರಾತ್ರಿ ಎಷ್ಟೊತ್ತಾದ್ರೂ ಸರಿ, ಎಬ್ಬಿಸಿ.
    tr: Kāralli yāvāglū ardha ṭyāṅk peṭrōl iṭṭirtīni ajji. Rātri eṣṭottādrū sari, ebbisi.
    en: I'll always keep at least half a tank of petrol in the car, Ajji. Whatever time of night it is, wake me.
  - who: ajji
    t: ಶ್ವೇತಾ, ನಿನ್ನ ಮಗುವನ್ನ ಈ ಕೈಯಲ್ಲಿ ಎತ್ತಿಕೊಳ್ಳೋವರೆಗೂ ನಾನು ಎಲ್ಲೂ ಹೋಗಲ್ಲ. ಅದು ನನ್ನ ಹರಕೆ, ದೇವರಿಗೂ ಹೇಳಿದೀನಿ.
    tr: Shwētā, ninna maguvanna ī kaiyalli ettikoḷḷōvaregū nānu ellū hōgalla. Adu nanna harake, dēvarigū hēḷidīni.
    en: Shwetha, I'm not going anywhere until I've held your baby in these arms. That's my vow — I've told God as well.
  - who: shwe
    t: ಹಾಗಾದ್ರೆ ಆಮೇಲೂ ತುಂಬಾ ವರ್ಷ ಇರ್ಬೇಕು ಅಜ್ಜಿ. ಮರಿಮಗು ಮದುವೆವರೆಗೂ!
    tr: Hāgādre āmēlū tumbā varṣa irbēku ajji. Marimagu maduvevaregū!
    en: Then you'll have to stay many years after that too, Ajji. Right up to the great-grandchild's wedding!
  - chapter: Chapter 7 — Delivery
  - section: 🌙 Two in the morning
    learn: 'dative experiencer: ನನಗೆ ನೋವು ಬರ್ತಿದೆ · -ಕ್ಕೊಂದು ಸಲ (once every …) · ಬಂದು ಹೋಗು (come and go) · true vs false labour'
  - scene: Seven weeks after the seemantha. Shwetha has been on maternity leave since the first of November. It is the night of Tuesday, 10 November 2026, her due date — a little after one in the morning. The Rao house. Shwetha, forty weeks pregnant, knocks on her mother's door.
  - who: shwe
    t: ಅಮ್ಮ… ಅಮ್ಮ, ಎದ್ದೇಳು. ನನಗೆ ಹೊಟ್ಟೆ ಕೆಳಗೆ ನೋವು ಬರ್ತಿದೆ, ಬೆನ್ನಿಗೂ ಹೋಗ್ತಿದೆ. ಹನ್ನೆರಡು ಗಂಟೆಯಿಂದ ಬಂದು ಹೋಗ್ತಿದೆ.
    tr: Amma… amma, eddēḷu. Nanage hoṭṭe keḷage nōvu bartide, bennigū hōgtide. Hanneraḍu gaṇṭeyinda bandu hōgtide.
    en: Amma… Amma, wake up. I'm getting pain low in my belly, and it's going into my back. It's been coming and going since midnight.
  - who: amma
    t: ಗಾಬರಿ ಆಗ್ಬೇಡ, ಕೂತ್ಕೋ. ನೋವು ಬಂದು ಹೋಗ್ತಿದೆಯಾ, ಅಥವಾ ಒಂದೇ ಸಮನೆ ಇದೆಯಾ? ನೋವು ಬಂದಾಗ ಹೊಟ್ಟೆ ಕಲ್ಲಿನ ಥರ ಗಟ್ಟಿ ಆಗುತ್ತಾ?
    tr: Gābari āgbēḍa, kūtkō. Nōvu bandu hōgtideyā, athavā ondē samane ideyā? Nōvu bandāga hoṭṭe kallina thara gaṭṭi āguttā?
    en: Don't panic, sit down. Is the pain coming and going, or is it constant? When it comes, does your belly go hard like a stone?
  - who: shwe
    t: ಬಂದು ಹೋಗ್ತಿದೆ. ಬಂದಾಗ ಹೊಟ್ಟೆ ಗಟ್ಟಿ ಆಗುತ್ತೆ, ಉಸಿರು ಕಟ್ಟಿದ ಹಾಗೆ ಆಗುತ್ತೆ. ಆಮೇಲೆ ಐದಾರು ನಿಮಿಷ ಏನೂ ಇಲ್ಲ.
    tr: Bandu hōgtide. Bandāga hoṭṭe gaṭṭi āgutte, usiru kaṭṭida hāge āgutte. Āmēle aidāru nimiṣa ēnū illa.
    en: Coming and going. When it comes my belly goes hard and I feel like I can't breathe. Then nothing for five or six minutes.
  - who: amma
    t: ಕಳೆದ ವಾರನೂ ಹೀಗೇ ಆಗಿತ್ತಲ್ಲ, ಆಮೇಲೆ ನಿಂತು ಹೋಯ್ತು. ಅದು ಫಾಲ್ಸ್ ಪೇನ್ ಅಂತ ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ರು. ಈ ಸಲ ನಿಜವೋ ಸುಳ್ಳೋ ನೋಡೋಣ. ನೋವು ಶುರುವಾದಾಗ ಹೇಳು, ನಾನು ಫೋನಲ್ಲಿ ಟೈಮ್ ನೋಡ್ತೀನಿ.
    tr: Kaḷeda vāranū hīgē āgittalla, āmēle nintu hōytu. Adu phāls pēn anta ḍākṭru hēḷidru. Ī sala nijavō suḷḷō nōḍōṇa. Nōvu śuruvādāga hēḷu, nānu phōnalli ṭaim nōḍtīni.
    en: Last week it was like this too, and then it stopped. The doctor said that was false labour. Let's see whether this time it's real. Tell me when a pain starts — I'll time it on the phone.
  - scene: Forty minutes later. Ajji has woken too and sits on the sofa with a shawl around her shoulders. Amma holds the phone with a stopwatch running.
  - who: amma
    t: 'ನೋಡು: ಪ್ರತಿ ಆರು ನಿಮಿಷಕ್ಕೊಂದು ಸಲ, ಒಂದೊಂದು ನೋವು ನಲವತ್ತೈದು ಸೆಕೆಂಡು. ಅರ್ಧ ಗಂಟೆಯಿಂದ ಹತ್ರ ಹತ್ರ ಬರ್ತಿದೆ, ಜೋರೂ ಆಗ್ತಿದೆ. ಇದು ಸುಳ್ಳು ನೋವು ಅಲ್ಲ.'
    tr: 'Nōḍu: prati āru nimiṣakkondu sala, ondondu nōvu nalavattaidu sekeṇḍu. Ardha gaṇṭeyinda hatra hatra bartide, jōrū āgtide. Idu suḷḷu nōvu alla.'
    en: 'Look: once every six minutes, each pain forty-five seconds. For half an hour they''ve been coming closer together, and getting stronger too. This isn''t false labour.'
  - who: ajji
    t: ನಿಜವಾದ ನೋವು ಹಾಗೇ ಬರೋದು, ಸಮುದ್ರದ ಅಲೆ ಥರ. ಶ್ವೇತಾ, ನೀರು ಹೋಗಿದೆಯಾ? ರಕ್ತ ಏನಾದ್ರೂ ಕಾಣಿಸ್ತಾ?
    tr: Nijavāda nōvu hāgē barōdu, samudrada ale thara. Shwētā, nīru hōgideyā? Rakta ēnādrū kāṇistā?
    en: Real pains come just like that, like waves of the sea. Shwetha, has your water gone? Have you seen any blood?
  - who: shwe
    t: ನೀರು ಹೋಗಿಲ್ಲ ಅಜ್ಜಿ. ಸ್ವಲ್ಪ ಲೋಳೆ ಥರ ಬಂತು, ಅದರಲ್ಲಿ ರಕ್ತದ ಗೆರೆ ಇತ್ತು. ಮಗು ಮಾತ್ರ ಚೆನ್ನಾಗಿ ಒದೀತಿದೆ, ಅದೇ ಸಮಾಧಾನ.
    tr: Nīru hōgilla ajji. Svalpa lōḷe thara bantu, adaralli raktada gere ittu. Magu mātra chennāgi odītide, adē samādhāna.
    en: The water hasn't gone, Ajji. A little mucus came, with a streak of blood in it. But the baby's kicking well — that's a relief.
  - who: ajji
    t: ಅದೇ ಶುರುವಾಗೋ ಲಕ್ಷಣ. ಲಕ್ಷ್ಮಿ, ಡಾಕ್ಟ್ರಿಗೆ ಫೋನ್ ಮಾಡು. ನಾನು ದೇವರಿಗೆ ದೀಪ ಹಚ್ಚ್ತೀನಿ.
    tr: Adē śuruvāgō lakṣaṇa. Lakshmī, ḍākṭrige phōn māḍu. Nānu dēvarige dīpa hachchtīni.
    en: That's the sign it's starting. Lakshmi, call the doctor. I'll light a lamp for God.
  - who: amma
    t: ಅಮ್ಮ, ದೀಪ ಹಚ್ಚಿ ಮಲಗಿ. ರಾತ್ರಿಯೆಲ್ಲಾ ಎದ್ದಿದ್ರೆ ನಾಳೆ ನಿಮ್ಮ ಬಿಪಿ ಏರುತ್ತೆ.
    tr: Amma, dīpa hachchi malagi. Rātriyellā eddidre nāḷe nimma bipi ērutte.
    en: Amma, light the lamp and then go to bed. If you're up all night, your BP will go up tomorrow.
  - who: ajji
    t: ನನ್ನ ಮರಿಮಗು ಬರ್ತಿರೋ ರಾತ್ರಿ ನಾನು ಮಲಗ್ಬೇಕಾ? ಆಸ್ಪತ್ರೆಗೆ ಬರಲ್ಲ, ಅಷ್ಟು ಮಾತು ಕೇಳ್ತೀನಿ. ಆದ್ರೆ ಇಲ್ಲೇ ಕೂತು ಜಪ ಮಾಡ್ತೀನಿ.
    tr: Nanna marimagu bartirō rātri nānu malagbēkā? Āspatrege baralla, aṣṭu mātu kēḷtīni. Ādre illē kūtu japa māḍtīni.
    en: On the night my great-grandchild is coming, I'm supposed to sleep? I won't come to the hospital — I'll listen to you that far. But I'll sit right here and pray.
  - section: 📞 Calling Dr. Usha
    learn: 'the doctor''s questions on the phone · -ಇರೋದ್ರಿಂದ (because of) · instructions: ತಿನ್ನಬೇಡಿ, ಕುಡೀಬಹುದು'
  - scene: 2:10 a.m. Shwetha calls Dr. Usha Rao's mobile, on speaker.
  - who: gyn
    t: ಹಲೋ ಶ್ವೇತಾ, ಹೇಳಿ. ನೋವು ಶುರು ಆಯ್ತಾ?
    tr: Halō Shwētā, hēḷi. Nōvu śuru āytā?
    en: Hello Shwetha, tell me. Have the pains started?
  - who: shwe
    t: ಹೌದು ಡಾಕ್ಟರ್. ಸಾರಿ, ರಾತ್ರಿ ಹೊತ್ತು ಫೋನ್ ಮಾಡಿದ್ದಕ್ಕೆ. ಅರ್ಧ ಗಂಟೆಯಿಂದ ಆರು ನಿಮಿಷಕ್ಕೊಂದು ಸಲ ಬರ್ತಿದೆ, ಒಂದೊಂದೂ ನಲವತ್ತೈದು ಸೆಕೆಂಡ್ ಇರುತ್ತೆ.
    tr: Haudu ḍākṭar. Sāri, rātri hottu phōn māḍiddakke. Ardha gaṇṭeyinda āru nimiṣakkondu sala bartide, ondondū nalavattaidu sekeṇḍ irutte.
    en: Yes, Doctor. Sorry for calling in the middle of the night. For half an hour they've been coming every six minutes, each one lasting forty-five seconds.
  - who: gyn
    t: ಸಾರಿ ಯಾಕೆ, ಇದೇ ನನ್ನ ಕೆಲಸ. ನೀರು ಹೋಗಿದೆಯಾ? ಬ್ಲೀಡಿಂಗ್ ಇದೆಯಾ? ಮಗುವಿನ ಮೂವ್‌ಮೆಂಟ್ ಸರಿಯಾಗಿದೆಯಾ?
    tr: Sāri yāke, idē nanna kelasa. Nīru hōgideyā? Blīḍiṅg ideyā? Maguvina mūvmeṇṭ sariyāgideyā?
    en: Why sorry? This is exactly my job. Has your water broken? Any bleeding? Is the baby moving normally?
  - who: shwe
    t: ನೀರು ಹೋಗಿಲ್ಲ. ಸ್ವಲ್ಪ ಲೋಳೆ ಬಂತು, ಅದರಲ್ಲಿ ರಕ್ತದ ಗೆರೆ ಇತ್ತು, ಅಷ್ಟೇ. ಮಗು ಚೆನ್ನಾಗಿ ಒದೀತಿದೆ.
    tr: Nīru hōgilla. Svalpa lōḷe bantu, adaralli raktada gere ittu, aṣṭē. Magu chennāgi odītide.
    en: No water. A little mucus with a streak of blood, that's all. The baby's kicking well.
  - who: gyn
    t: ಸರಿ, ಅದು ಸಹಜ, ಅದನ್ನ 'ಶೋ' ಅಂತೀವಿ. ಮೊದಲ ಹೆರಿಗೆಯಲ್ಲಿ ಇದು ಇನ್ನೂ ತುಂಬಾ ಗಂಟೆ ಹೋಗಬಹುದು. ಆದ್ರೆ ನಿಮಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಇರೋದ್ರಿಂದ ಮನೇಲಿ ಕಾಯೋದು ಬೇಡ. ಈಗ್ಲೇ ಆಸ್ಪತ್ರೆಗೆ ಬನ್ನಿ, ಲೇಬರ್ ವಾರ್ಡ್‌ಗೆ ನಾನು ಹೇಳ್ತೀನಿ. ಬರೋವಾಗ ಏನೂ ತಿನ್ನಬೇಡಿ, ಸ್ವಲ್ಪ ನೀರು ಕುಡೀಬಹುದು.
    tr: Sari, adu sahaja, adanna 'śō' antīvi. Modala herigeyalli idu innū tumbā gaṇṭe hōgabahudu. Ādre nimage śugar bārḍarlain irōdrinda manēli kāyōdu bēḍa. Īglē āspatrege banni, lēbar vārḍge nānu hēḷtīni. Barōvāga ēnū tinnabēḍi, svalpa nīru kuḍībahudu.
    en: All right, that's normal — we call it the 'show'. With a first baby this can still go on for many hours. But since your sugar is borderline, I don't want you waiting at home. Come to the hospital now; I'll inform the labour ward. Don't eat anything on the way — a little water is fine.
  - who: shwe
    t: ನೀವು ಈಗ ಬರ್ತೀರಾ ಡಾಕ್ಟರ್?
    tr: Nīvu īga bartīrā ḍākṭar?
    en: Will you come now, Doctor?
  - who: gyn
    t: ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು ಮೊದಲು ನಿಮ್ಮನ್ನ ಚೆಕ್ ಮಾಡಿ ನನಗೆ ಹೇಳ್ತಾರೆ. ಬೇಕಾದ ತಕ್ಷಣ ನಾನು ಹತ್ತು ನಿಮಿಷದಲ್ಲಿ ಅಲ್ಲಿರ್ತೀನಿ. ಧೈರ್ಯವಾಗಿರಿ, ನಾವೆಲ್ಲಾ ಇದೀವಿ.
    tr: Ḍyūṭi ḍākṭru modalu nimmanna chek māḍi nanage hēḷtāre. Bēkāda takṣaṇa nānu hattu nimiṣadalli allirtīni. Dhairyavāgiri, nāvellā idīvi.
    en: The duty doctor will examine you first and report to me. The moment I'm needed, I'll be there in ten minutes. Be brave — we're all here.
  - who: kiran
    t: ಸ್ಯಾಮ್ ಆಗ್ಲೇ ಕಾರ್ ಕೀ ಹಿಡ್ಕೊಂಡು ಶೂ ಹಾಕ್ತಿದಾನೆ! ಬ್ಯಾಗ್ ಡಿಕ್ಕಿಯಲ್ಲಿಟ್ಟೆ. ಪ್ರದೀಪ್ ಭಾವನಿಗೆ ನಾನು ಫೋನ್ ಮಾಡ್ತೀನಿ, ನೇರ ಆಸ್ಪತ್ರೆಗೆ ಬರೋಕೆ ಹೇಳ್ತೀನಿ.
    tr: Sām āglē kār kī hiḍkoṇḍu śū hāktidāne! Byāg ḍikkiyalliṭṭe. Pradīp bhāvanige nānu phōn māḍtīni, nēra āspatrege barōke hēḷtīni.
    en: Sam's already putting his shoes on with the car key in his hand! I've put the bag in the boot. I'll call Pradeep and tell him to come straight to the hospital.
  - section: 🚗 The night drive and admission
    learn: ನಿಲ್ಲಿಸು (to stop something, causative of ನಿಲ್ಲು) · ಮೊದಲೇ ಹೇಳ್ತೀನಿ (I'll tell you up front) · cashless, advance, maternity limit
  - scene: 2:40 a.m. Sam drives through the empty streets of Jayanagar, Amma and Shwetha in the back seat.
  - who: sam
    t: ಶ್ವೇತಾ, ಮುಂದೆ ಹಂಪ್ ಇದೆ, ನಿಧಾನ ಮಾಡ್ತೀನಿ. ನೋವು ಬಂದ್ರೆ ಹೇಳು, ಗಾಡಿ ನಿಲ್ಲಿಸ್ತೀನಿ.
    tr: Shwētā, munde hamp ide, nidhāna māḍtīni. Nōvu bandre hēḷu, gāḍi nillistīni.
    en: Shwetha, there's a speed bump ahead, I'll slow down. Tell me if a pain comes and I'll stop the car.
  - who: shwe
    t: ನಿಲ್ಲಿಸ್ಬೇಡ ಸ್ಯಾಮ್, ಓಡಿಸ್ತಾನೇ ಇರು! ಉಸಿರು ಒಳಗೆ… ಹೊರಗೆ… ಪ್ರೆಗ್ನೆನ್ಸಿ ಕ್ಲಾಸಲ್ಲಿ ಹೇಳಿಕೊಟ್ಟಿದ್ದು ಈಗ ನೆನಪಾಗ್ತಿದೆ.
    tr: Nillisbēḍa Sām, ōḍistānē iru! Usiru oḷage… horage… pregnensi klāsalli hēḷikoṭṭiddu īga nenapāgtide.
    en: Don't stop, Sam, keep driving! Breathe in… out… what they taught us in the pregnancy class is coming back to me now.
  - who: amma
    t: ಹಾಗೇ, ನಿಧಾನವಾಗಿ ಉಸಿರಾಡು. ನನ್ನ ಕೈ ಹಿಡ್ಕೋ, ಎಷ್ಟು ಬೇಕಾದ್ರೂ ಒತ್ತು.
    tr: Hāgē, nidhānavāgi usirāḍu. Nanna kai hiḍkō, eṣṭu bēkādrū ottu.
    en: That's it, breathe slowly. Hold my hand — squeeze as hard as you need to.
  - scene: The hospital's maternity entrance. Pradeep is already there, hair uncombed, a folder under his arm.
  - who: pradeep
    t: ರೋಡ್ ಖಾಲಿ ಇತ್ತು, ಹದಿನೈದು ನಿಮಿಷದಲ್ಲಿ ಬಂದ್ಬಿಟ್ಟೆ. ಶ್ವೇತಾ, ಹೇಗಿದೀಯಾ?
    tr: Rōḍ khāli ittu, hadinaidu nimiṣadalli bandbiṭṭe. Shwētā, hēgidīyā?
    en: The road was empty, I got here in fifteen minutes. Shwetha, how are you?
  - who: shwe
    t: ಹೇಗಿದೀನಿ ಅಂತ ಮಾತ್ರ ಕೇಳ್ಬೇಡ. ಫೈಲ್ ತಂದ್ಯಾ?
    tr: Hēgidīni anta mātra kēḷbēḍa. Phail tandyā?
    en: Just don't ask me how I am. Did you bring the file?
  - who: pradeep
    t: ತಂದೆ. ಫೈಲ್, ಇನ್ಶೂರೆನ್ಸ್ ಕಾರ್ಡ್, ಆಧಾರ್, ಎಲ್ಲಾ ಇದೆ.
    tr: Tande. Phail, inśūrens kārḍ, ādhār, ellā ide.
    en: I did. The file, insurance card, Aadhaar — it's all here.
  - who: desk
    t: ಡಾಕ್ಟರ್ ಉಷಾ ರಾವ್ ಪೇಶಂಟಾ? ಡಾಕ್ಟ್ರು ಫೋನ್ ಮಾಡಿ ಹೇಳಿದ್ರು. ಪೇಶಂಟ್‌ನ ಮೊದಲು ಲೇಬರ್ ವಾರ್ಡ್‌ಗೆ ಕರ್ಕೊಂಡು ಹೋಗಿ. ಅಡ್ಮಿಷನ್ ಫಾರ್ಮಾಲಿಟಿ ನೀವು ಇಲ್ಲಿ ಮುಗಿಸಿ ಸಾರ್.
    tr: Ḍākṭar Uṣā Rāv pēśaṇṭā? Ḍākṭru phōn māḍi hēḷidru. Pēśaṇṭna modalu lēbar vārḍge karkoṇḍu hōgi. Aḍmiṣan phārmāliṭi nīvu illi mugisi sār.
    en: Dr. Usha Rao's patient? The doctor phoned us. Take the patient up to the labour ward first. You can finish the admission formalities here, sir.
  - who: desk
    t: 'ಇನ್ಶೂರೆನ್ಸ್ ಕ್ಯಾಶ್‌ಲೆಸ್ ಆಗುತ್ತೆ, ಪ್ರಿ-ಆಥರೈಸೇಶನ್ ಈಗ್ಲೇ ಕಳಿಸ್ತೀವಿ. ಆದ್ರೆ ಒಂದು ವಿಷಯ ಮೊದಲೇ ಹೇಳ್ತೀನಿ: ನಿಮ್ಮ ಪಾಲಿಸಿಲಿ ಮೆಟರ್ನಿಟಿಗೆ ಲಿಮಿಟ್ ಇದೆ. ನಾರ್ಮಲ್‌ಗೆ ಐವತ್ತು ಸಾವಿರ, ಸಿಸೇರಿಯನ್ ಆದ್ರೆ ಎಪ್ಪತ್ತೈದು ಸಾವಿರ. ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಆದ್ರೆ ನೀವೇ ಕಟ್ಬೇಕು. ಈಗ ಇಪ್ಪತ್ತು ಸಾವಿರ ಅಡ್ವಾನ್ಸ್ ಕಟ್ಟಿ.'
    tr: 'Inśūrens kyāśles āgutte, pri-ātharaisēśan īglē kaḷistīvi. Ādre ondu viṣaya modalē hēḷtīni: nimma pālisili meṭarniṭige limiṭ ide. Nārmalge aivattu sāvira, sisēriyan ādre eppattaidu sāvira. Adakkinta jāsti ādre nīvē kaṭbēku. Īga ippattu sāvira aḍvāns kaṭṭi.'
    en: 'The insurance will be cashless; we''ll send the pre-authorisation right away. But let me tell you one thing up front: your policy has a maternity limit — fifty thousand for a normal delivery, seventy-five thousand if it''s a C-section. Anything above that you pay yourselves. For now, please pay an advance of twenty thousand.'
  - who: pradeep
    t: ಕ್ಯಾಶ್‌ಲೆಸ್ ಅಂದ್ರೂ ಅಡ್ವಾನ್ಸ್ ಯಾಕೆ?
    tr: Kyāśles andrū aḍvāns yāke?
    en: Why an advance if it's cashless?
  - who: desk
    t: ಅಪ್ರೂವಲ್ ಬರೋವರೆಗೂ ಸಾರ್. ಬಿಲ್ ಲಿಮಿಟ್ ಒಳಗೇ ಮುಗಿದ್ರೆ ಡಿಸ್ಚಾರ್ಜ್ ಟೈಮಲ್ಲಿ ಅಡ್ವಾನ್ಸ್ ವಾಪಸ್ ಕೊಡ್ತೀವಿ. ಯುಪಿಐ ಆಗುತ್ತೆ.
    tr: Aprūval barōvaregū sār. Bil limiṭ oḷagē mugidre ḍischārj ṭaimalli aḍvāns vāpas koḍtīvi. Yupiai āgutte.
    en: Until the approval comes, sir. If the bill stays within the limit, we refund the advance at discharge. UPI is fine.
  - who: pradeep
    t: ಸರಿ, ಈಗ್ಲೇ ಮಾಡ್ತೀನಿ. ಸ್ಯಾಮ್, ನೀನು ಅತ್ತೆ ಜೊತೆ ಮೇಲೆ ಹೋಗು. ನಾನು ಐದು ನಿಮಿಷದಲ್ಲಿ ಬರ್ತೀನಿ.
    tr: Sari, īglē māḍtīni. Sām, nīnu atte jote mēle hōgu. Nānu aidu nimiṣadalli bartīni.
    en: Fine, I'll pay now. Sam, you go up with my mother-in-law. I'll be there in five minutes.
  - section: 🩺 The labour ward — a long night
    learn: 'monitoring words: ಸಿಟಿಜಿ, ಹಾರ್ಟ್‌ಬೀಟ್, ಗರ್ಭಕೋಶದ ಬಾಯಿ, ಸೆಂಟಿಮೀಟರ್ ತೆರೆದಿದೆ · -ಅಂದ್ಮೇಲೆ (once … says so) · ಸುಸ್ತು (exhaustion)'
  - scene: 3:15 a.m. The labour room. Two belts are strapped around Shwetha's belly and a machine beeps with the baby's heartbeat. Only one attendant is allowed inside; Pradeep is with her.
  - who: nurse
    t: ಶ್ವೇತಾ ಅವರೇ, ಇದು ಸಿಟಿಜಿ ಮಷೀನ್. ಒಂದು ಬೆಲ್ಟ್ ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ನೋಡುತ್ತೆ, ಇನ್ನೊಂದು ನಿಮ್ಮ ನೋವು ಎಷ್ಟು ಹೊತ್ತಿಗೊಂದು ಸಲ, ಎಷ್ಟು ಜೋರಾಗಿ ಬರ್ತಿದೆ ಅಂತ ತೋರಿಸುತ್ತೆ. ಆ ಟಕ್ ಟಕ್ ಸದ್ದು ನಿಮ್ಮ ಮಗುವಿನ ಹೃದಯ.
    tr: Shwētā avarē, idu siṭiji maṣīn. Ondu belṭ maguvina hārṭbīṭ nōḍutte, innondu nimma nōvu eṣṭu hottigondu sala, eṣṭu jōrāgi bartide anta tōrisutte. Ā ṭak ṭak saddu nimma maguvina hṛdaya.
    en: Shwetha, this is the CTG machine. One belt follows the baby's heartbeat; the other shows how often your contractions come and how strong they are. That tick-tick sound is your baby's heart.
  - who: pradeep
    t: ಸ್ಕ್ರೀನ್ ಮೇಲೆ ನೂರ ನಲವತ್ತು ಅಂತ ತೋರಿಸ್ತಿದೆ. ಅದು ಸರಿನಾ ಸಿಸ್ಟರ್?
    tr: Skrīn mēle nūra nalavattu anta tōristide. Adu sarinā sisṭar?
    en: The screen says a hundred and forty. Is that all right, Sister?
  - who: nurse
    t: 'ಹೌದು, ನೂರ ಹತ್ತರಿಂದ ನೂರ ಅರವತ್ತರ ಒಳಗೆ ಇದ್ರೆ ನಾರ್ಮಲ್. ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು ಒಳಗೆ ಚೆಕ್ ಮಾಡಿದ್ರು: ಗರ್ಭಕೋಶದ ಬಾಯಿ ಮೂರು ಸೆಂಟಿಮೀಟರ್ ತೆರೆದಿದೆ. ಹತ್ತು ಆಗ್ಬೇಕು.'
    tr: 'Haudu, nūra hattarinda nūra aravattara oḷage idre nārmal. Ḍyūṭi ḍākṭru oḷage chek māḍidru: garbhakōśada bāyi mūru seṇṭimīṭar teredide. Hattu āgbēku.'
    en: 'Yes, anything between a hundred and ten and a hundred and sixty is normal. The duty doctor examined you inside: the cervix is three centimetres open. It has to reach ten.'
  - who: shwe
    t: ಇನ್ನೂ ಮೂರೇನಾ? ಎರಡು ಗಂಟೆಯಿಂದ ಈ ನೋವು ತಿಂತಿದೀನಿ…
    tr: Innū mūrēnā? Eraḍu gaṇṭeyinda ī nōvu tintidīni…
    en: Only three? I've been suffering this pain for two hours…
  - who: nurse
    t: ಮೊದಲ ಮಗುವಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಗಂಟೆಗೆ ಒಂದು ಸೆಂಟಿಮೀಟರ್ ಅಂತ ಲೆಕ್ಕ. ನೋವು ಬಂದಾಗ ಉಸಿರು ಬಿಗಿ ಹಿಡೀಬೇಡಿ, ನಿಧಾನವಾಗಿ ಬಿಡಿ. ನೋವು ಇಲ್ಲದಾಗ ಸ್ವಲ್ಪ ನಡೀರಿ, ಅದರಿಂದ ಮಗು ಕೆಳಗೆ ಇಳಿಯುತ್ತೆ.
    tr: Modala maguvige sāmānyavāgi gaṇṭege ondu seṇṭimīṭar anta lekka. Nōvu bandāga usiru bigi hiḍībēḍi, nidhānavāgi biḍi. Nōvu illadāga svalpa naḍīri, adarinda magu keḷage iḷiyutte.
    en: With a first baby we usually reckon about a centimetre an hour. When a pain comes, don't hold your breath — let it out slowly. Between pains, walk a little; it helps the baby come down.
  - who: shwe
    t: ಎಪಿಡ್ಯೂರಲ್ ಸಿಗುತ್ತಾ? ಬೇಕಾದ್ರೆ ಕೊಡಬಹುದು ಅಂತ ಡಾಕ್ಟ್ರು ಉಷಾ ಹೇಳಿದ್ರು.
    tr: Epiḍyūral siguttā? Bēkādre koḍabahudu anta ḍākṭru Uṣā hēḷidru.
    en: Can I get an epidural? Dr. Usha said I could have one if I wanted.
  - who: nurse
    t: ಸಿಗುತ್ತೆ. ಡ್ಯೂಟಿ ಡಾಕ್ಟ್ರು ಸರಿ ಅಂದ್ಮೇಲೆ ಅನಸ್ತೀಶಿಯಾ ಡಾಕ್ಟ್ರು ಬಂದು ಬೆನ್ನಿಗೆ ಹಾಕ್ತಾರೆ. ಅದಕ್ಕೆ ಬೇರೆ ಚಾರ್ಜ್ ಇದೆ ಅಂತ ನಿಮ್ಮ ಮನೆಯವರಿಗೆ ಹೇಳಿ.
    tr: Sigutte. Ḍyūṭi ḍākṭru sari andmēle anastīśiyā ḍākṭru bandu bennige hāktāre. Adakke bēre chārj ide anta nimma maneyavarige hēḷi.
    en: You can. Once the duty doctor okays it, the anaesthetist will come and put it in your back. Tell your family there's a separate charge for it.
  - scene: Morning, 9:30. Outside the labour room. Appa has arrived with Kiran and a flask of coffee. Sam never went home. Pradeep has come out to talk while Amma takes his place inside.
  - who: appa
    t: ಏನಾಯ್ತು ಪ್ರದೀಪ್? ಡಾಕ್ಟ್ರು ಏನಂದ್ರು?
    tr: Ēnāytu Pradīp? Ḍākṭru ēnandru?
    en: What's happening, Pradeep? What did the doctor say?
  - who: pradeep
    t: ರಾತ್ರಿ ಮೂರು ಇತ್ತು, ಬೆಳಿಗ್ಗೆ ಆರು ಗಂಟೆಗೆ ಆರು ಸೆಂಟಿಮೀಟರ್ ಆಯ್ತು. ಆಮೇಲೆ ಮೂರೂವರೆ ಗಂಟೆಯಿಂದ ಅಲ್ಲೇ ನಿಂತಿದೆ, ಮುಂದೆ ಹೋಗ್ತಿಲ್ಲ. ಎಂಟು ಗಂಟೆಗೆ ನೀರು ಹೋಯ್ತು, ಎಪಿಡ್ಯೂರಲ್ ಕೊಟ್ಟಿದಾರೆ, ನೋವು ಸ್ವಲ್ಪ ಕಮ್ಮಿ. ಆದ್ರೆ ಅವಳು ತುಂಬಾ ಸುಸ್ತಾಗಿದಾಳೆ, ಮಾವ.
    tr: Rātri mūru ittu, beḷigge āru gaṇṭege āru seṇṭimīṭar āytu. Āmēle mūrūvare gaṇṭeyinda allē nintide, munde hōgtilla. Eṇṭu gaṇṭege nīru hōytu, epiḍyūral koṭṭidāre, nōvu svalpa kammi. Ādre avaḷu tumbā sustāgidāḷe, māva.
    en: At night it was three; by six this morning it was six centimetres. Since then, three and a half hours, it's been stuck there, not moving. Her water broke at eight, they've given the epidural, so the pain's a bit less. But she's completely exhausted, Mava.
  - who: kiran
    t: ಅಕ್ಕ ರಾತ್ರಿಯೆಲ್ಲಾ ಒಂದು ನಿಮಿಷನೂ ನಿದ್ದೆ ಮಾಡಿಲ್ಲ ಅಲ್ವಾ…
    tr: Akka rātriyellā ondu nimiṣanū nidde māḍilla alvā…
    en: Akka hasn't slept a single minute all night, has she…
  - who: sam
    t: ಎಲ್ರಿಗೂ ಕಾಫಿ ಇದೆ. ಪ್ರದೀಪ್, ನೀನು ಏನಾದ್ರೂ ತಿನ್ನು. ಇಲ್ಲಾಂದ್ರೆ ಆಮೇಲೆ ನಿನ್ನನ್ನೂ ಅಡ್ಮಿಟ್ ಮಾಡ್ಬೇಕಾಗುತ್ತೆ.
    tr: Ellrigū kāphi ide. Pradīp, nīnu ēnādrū tinnu. Illāndre āmēle ninnannū aḍmiṭ māḍbēkāgutte.
    en: There's coffee for everyone. Pradeep, eat something. Otherwise they'll have to admit you too.
  - who: amma
    t: ಪ್ರದೀಪ್, ಬೇಗ ಒಳಗೆ ಬಾ. ಮಷೀನ್ ಬೀಪ್ ಮಾಡ್ತಾ ಇತ್ತು, ಸಿಸ್ಟರ್ ಓಡಿ ಹೋಗಿ ಡಾಕ್ಟ್ರು ಉಷಾನ ಕರೆದ್ರು. ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ಕೆಳಗೆ ಹೋಗ್ತಿತ್ತು ಅನ್ಸುತ್ತೆ.
    tr: Pradīp, bēga oḷage bā. Maṣīn bīp māḍtā ittu, sisṭar ōḍi hōgi ḍākṭru Uṣāna karedru. Maguvina hārṭbīṭ keḷage hōgtittu ansutte.
    en: (at the door, anxious) Pradeep, come in quickly. The machine was beeping and the sister ran to call Dr. Usha. I think the baby's heartbeat was dropping.
  - section: '⚠️ The decision: a C-section'
    learn: 'explaining risk: -ಬಹುದು, ಕಾಯೋದು ಸೇಫ್ ಅಲ್ಲ · ಸಲಹೆ (advice), ರಕ್ತಸ್ರಾವ (bleeding), ಅರಿವಳಿಕೆ (anaesthesia), ಸಾಕ್ಷಿ (witness) · consent: who signs'
  - scene: 10:05 a.m. Dr. Usha Rao, in green scrubs, sits on a stool beside Shwetha's bed. Pradeep stands holding Shwetha's hand. The CTG paper strip lies on the bed.
  - who: gyn
    t: ಶ್ವೇತಾ, ಪ್ರದೀಪ್, ನೇರವಾಗಿ ಹೇಳ್ತೀನಿ. ಕಳೆದ ಅರ್ಧ ಗಂಟೆಯಿಂದ ಪ್ರತಿ ನೋವು ಬಂದಾಗ ಮಗುವಿನ ಹಾರ್ಟ್‌ರೇಟ್ ತೊಂಬತ್ತಕ್ಕೆ ಇಳೀತಿದೆ, ಮತ್ತೆ ಮೇಲೆ ಬರೋಕೆ ತುಂಬಾ ಟೈಮ್ ತಗೋತಿದೆ. ನೀರಿನ ಬಣ್ಣನೂ ಹಸಿರಾಗಿದೆ, ಅಂದ್ರೆ ಮಗು ಒಳಗೇ ಮೆಕೋನಿಯಂ, ಅಂದ್ರೆ ಮೊದಲ ಮಲ, ಮಾಡಿದೆ. ಇದನ್ನ ನಾವು ಫೀಟಲ್ ಡಿಸ್ಟ್ರೆಸ್ ಅಂತೀವಿ.
    tr: Shwētā, Pradīp, nēravāgi hēḷtīni. Kaḷeda ardha gaṇṭeyinda prati nōvu bandāga maguvina hārṭrēṭ tombattakke iḷītide, matte mēle barōke tumbā ṭaim tagōtide. Nīrina baṇṇanū hasirāgide, andre magu oḷagē mekōniyam, andre modala mala, māḍide. Idanna nāvu phīṭal ḍisṭres antīvi.
    en: Shwetha, Pradeep, I'll be direct. For the last half hour, with every contraction the baby's heart rate drops to ninety and takes too long to come back up. And the fluid has turned green, which means the baby has passed meconium — its first stool — inside. We call this foetal distress.
  - who: shwe
    t: ಮಗುವಿಗೆ ಏನಾದ್ರೂ ಆಗಿದೆಯಾ ಡಾಕ್ಟರ್?
    tr: Maguvige ēnādrū āgideyā ḍākṭar?
    en: Has something happened to the baby, Doctor?
  - who: gyn
    t: ಈ ಕ್ಷಣದಲ್ಲಿ ಮಗು ಸರಿಯಾಗಿದೆ. ಆದ್ರೆ ಮಗುವಿಗೆ ಆಕ್ಸಿಜನ್ ಸರಿಯಾಗಿ ಸಿಗ್ತಿಲ್ಲ ಅನ್ನೋ ಸೂಚನೆ ಇದು. ಮೂರೂವರೆ ಗಂಟೆಯಿಂದ ಆರು ಸೆಂಟಿಮೀಟರ್‌ನಲ್ಲೇ ನಿಂತಿದೆ. ನಾರ್ಮಲ್ ಡೆಲಿವರಿಗೆ ಇನ್ನೂ ಹಲವು ಗಂಟೆ ಬೇಕಾಗಬಹುದು. ಅಷ್ಟು ಹೊತ್ತು ಕಾಯೋದು ಸೇಫ್ ಅಲ್ಲ. ಸಿಸೇರಿಯನ್ ಮಾಡೋಣ ಅಂತ ನನ್ನ ಸಲಹೆ.
    tr: Ī kṣaṇadalli magu sariyāgide. Ādre maguvige āksijan sariyāgi sigtilla annō sūchane idu. Mūrūvare gaṇṭeyinda āru seṇṭimīṭarnallē nintide. Nārmal ḍelivarige innū halavu gaṇṭe bēkāgabahudu. Aṣṭu hottu kāyōdu sēph alla. Sisēriyan māḍōṇa anta nanna salahe.
    en: At this moment the baby is all right. But this is a sign the baby isn't getting enough oxygen. You've been stuck at six centimetres for three and a half hours. A normal delivery could take many more hours. Waiting that long isn't safe. My advice is a C-section.
  - who: shwe
    t: ನಾರ್ಮಲ್ ಆಗ್ಬೇಕು ಅಂತ ಒಂಬತ್ತು ತಿಂಗಳು ದಿನಾ ನಡೆದೆ, ಯೋಗ ಮಾಡಿದೆ, ಸಿಹಿ ಬಿಟ್ಟೆ… ಅದೆಲ್ಲಾ ವ್ಯರ್ಥ ಆಯ್ತಾ?
    tr: Nārmal āgbēku anta ombattu tiṅgaḷu dinā naḍede, yōga māḍide, sihi biṭṭe… adellā vyartha āytā?
    en: (crying) For nine months I walked every day so it would be normal, I did yoga, I gave up sweets… was all of that for nothing?
  - who: gyn
    t: ಒಂದು ಚೂರೂ ವ್ಯರ್ಥ ಆಗಿಲ್ಲ. ನೀವು ಆರೋಗ್ಯವಾಗಿದೀರಿ, ಅದಕ್ಕೇ ಆಪರೇಷನ್ ಆದ್ಮೇಲೆ ಬೇಗ ಹುಷಾರಾಗ್ತೀರಿ. ಸಿಸೇರಿಯನ್ ಸೋಲು ಅಲ್ಲ ಶ್ವೇತಾ. ಮಗು ಸುರಕ್ಷಿತವಾಗಿ ಹೊರಗೆ ಬರೋದು ಮುಖ್ಯ.
    tr: Ondu chūrū vyartha āgilla. Nīvu ārōgyavāgidīri, adakkē āparēṣan ādmēle bēga huṣārāgtīri. Sisēriyan sōlu alla Shwētā. Magu surakṣitavāgi horage barōdu mukhya.
    en: Not one bit of it was wasted. You're healthy, and that's exactly why you'll recover quickly after the operation. A C-section isn't a failure, Shwetha. What matters is that the baby comes out safely.
  - who: pradeep
    t: ಶ್ವೇತಾಗೆ ಏನು ರಿಸ್ಕ್ ಇದೆ ಡಾಕ್ಟರ್? ಮುಚ್ಚಿಡದೆ ಹೇಳಿ.
    tr: Shwētāge ēnu risk ide ḍākṭar? Muchchiḍade hēḷi.
    en: What are the risks for Shwetha, Doctor? Please don't hide anything.
  - who: gyn
    t: ಯಾವ ಆಪರೇಷನ್‌ನಲ್ಲೂ ಸ್ವಲ್ಪ ರಿಸ್ಕ್ ಇರುತ್ತೆ. ರಕ್ತಸ್ರಾವ ಜಾಸ್ತಿ ಆಗಬಹುದು, ಗಾಯಕ್ಕೆ ಇನ್‌ಫೆಕ್ಷನ್ ಆಗಬಹುದು, ಕಾಲಲ್ಲಿ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟಬಹುದು. ಅಪರೂಪಕ್ಕೆ ಮೂತ್ರಕೋಶಕ್ಕೆ ಪೆಟ್ಟಾಗಬಹುದು. ಇವನ್ನ ತಡೆಯೋಕೆ ಆಂಟಿಬಯಾಟಿಕ್ ಕೊಡ್ತೀವಿ, ನಾಳೆನೇ ಎಬ್ಬಿಸಿ ನಡೆಸ್ತೀವಿ. ಆದ್ರೆ ಈಗ ಕಾಯೋದ್ರಲ್ಲಿರೋ ರಿಸ್ಕ್ ಇದಕ್ಕಿಂತ ಜಾಸ್ತಿ.
    tr: Yāva āparēṣannallū svalpa risk irutte. Raktasrāva jāsti āgabahudu, gāyakke inphekṣan āgabahudu, kālalli rakta heppugaṭṭabahudu. Aparūpakke mūtrakōśakke peṭṭāgabahudu. Ivanna taḍeyōke āṇṭibayāṭik koḍtīvi, nāḷenē ebbisi naḍestīvi. Ādre īga kāyōdralli irō risk idakkinta jāsti.
    en: Every operation carries some risk. There could be heavier bleeding, the wound could get infected, a clot could form in the legs. Rarely, the bladder can be injured. To prevent these we give antibiotics, and we'll have you up and walking tomorrow. But right now, the risk in waiting is bigger than all of this.
  - who: shwe
    t: ಅರಿವಳಿಕೆ ಕೊಟ್ಟು ನನ್ನನ್ನ ಪೂರ್ತಿ ಮಲಗಿಸ್ತೀರಾ? ಮಗು ಹುಟ್ಟೋದು ನನಗೆ ಗೊತ್ತೇ ಆಗಲ್ವಾ?
    tr: Arivaḷike koṭṭu nannanna pūrti malagistīrā? Magu huṭṭōdu nanage gottē āgalvā?
    en: Will you put me completely to sleep with anaesthesia? Won't I even know when the baby is born?
  - who: gyn
    t: ಇಲ್ಲ. ಎಪಿಡ್ಯೂರಲ್ ಆಗ್ಲೇ ಹಾಕಿದೆಯಲ್ಲ, ಅದರಲ್ಲೇ ಜಾಸ್ತಿ ಔಷಧ ಕೊಟ್ಟು ಸೊಂಟದ ಕೆಳಗೆ ಮಾತ್ರ ಮರಗಟ್ಟಿಸ್ತಾರೆ. ನೀವು ಎಚ್ಚರವಾಗೇ ಇರ್ತೀರಿ. ನೋವು ಇರಲ್ಲ, ಸ್ವಲ್ಪ ಎಳೆದ ಹಾಗೆ ಅನ್ಸುತ್ತೆ ಅಷ್ಟೇ. ಮಗು ಅಳೋದನ್ನ ಮೊದಲು ಕೇಳೋದು ನೀವೇ.
    tr: Illa. Epiḍyūral āglē hākideyalla, adarallē jāsti auṣadha koṭṭu soṇṭada keḷage mātra maragaṭṭistāre. Nīvu echcharavāgē irtīri. Nōvu iralla, svalpa eḷeda hāge ansutte aṣṭē. Magu aḷōdanna modalu kēḷōdu nīvē.
    en: No. The epidural is already in; they'll give a stronger dose through it so you're numb only below the waist. You'll stay awake. There'll be no pain, just a feeling of tugging. You'll be the first to hear the baby cry.
  - who: pradeep
    t: ಮುಂದೆ ಇನ್ನೊಂದು ಮಗು ಬೇಕು ಅಂದ್ರೆ, ಅದೂ ಆಪರೇಷನ್ನೇ ಆಗ್ಬೇಕಾ?
    tr: Munde innondu magu bēku andre, adū āparēṣannē āgbēkā?
    en: If we want another child later, will that have to be an operation too?
  - who: gyn
    t: ಹಾಗೇನಿಲ್ಲ. ಸಿಸೇರಿಯನ್ ಆದ್ಮೇಲೂ ಎಷ್ಟೋ ಜನಕ್ಕೆ ಮುಂದಿನ ಸಲ ನಾರ್ಮಲ್ ಆಗುತ್ತೆ. ಸಾಮಾನ್ಯವಾಗಿ ಕನಿಷ್ಠ ಒಂದೂವರೆ ವರ್ಷ ಅಂತರ ಇರ್ಲಿ ಅಂತ ಹೇಳ್ತೀವಿ. ಅದನ್ನ ಆಮೇಲೆ ಆರಾಮಾಗಿ ಮಾತಾಡೋಣ.
    tr: Hāgēnilla. Sisēriyan ādmēlū eṣṭō janakke mundina sala nārmal āgutte. Sāmānyavāgi kaniṣṭha ondūvare varṣa antara irli anta hēḷtīvi. Adanna āmēle ārāmāgi mātāḍōṇa.
    en: Not necessarily. Plenty of women have a normal delivery the next time, even after a C-section. We usually advise a gap of at least a year and a half. We can talk about that calmly later.
  - who: nurse
    t: ಇದು ಕನ್ಸೆಂಟ್ ಫಾರ್ಮ್. ಆಪರೇಷನ್ ಯಾಕೆ, ಏನೇನು ರಿಸ್ಕ್, ಅರಿವಳಿಕೆ, ಬೇಕಾದ್ರೆ ರಕ್ತ ಕೊಡೋದು, ಎಲ್ಲಾ ಇದರಲ್ಲಿ ಬರೆದಿದೆ. ಕನ್ನಡದಲ್ಲೂ ಇದೆ, ಓದಿ.
    tr: Idu kanseṇṭ phārm. Āparēṣan yāke, ēnēnu risk, arivaḷike, bēkādre rakta koḍōdu, ellā idaralli baredide. Kannaḍadallū ide, ōdi.
    en: This is the consent form. Why the operation is needed, what the risks are, the anaesthesia, a blood transfusion if needed — it's all written here. It's in Kannada too; please read it.
  - who: pradeep
    t: ನಾನು ಸೈನ್ ಮಾಡ್ಲಾ?
    tr: Nānu sain māḍlā?
    en: Shall I sign?
  - who: gyn
    t: ಮೊದಲು ಶ್ವೇತಾ ಸೈನ್ ಮಾಡ್ಬೇಕು. ಪೇಶಂಟ್ ಅವರೇ, ಪೂರ್ತಿ ಎಚ್ಚರವಾಗಿದಾರೆ, ನಿರ್ಧಾರ ಅವರದ್ದು. ನೀವು ಕೆಳಗೆ ಸಂಬಂಧಿಕರಾಗಿ, ಸಾಕ್ಷಿಯಾಗಿ ಸೈನ್ ಮಾಡಿ. ಏನಾದ್ರೂ ಡೌಟ್ ಇದ್ರೆ ಈಗ್ಲೇ ಕೇಳಿ.
    tr: Modalu Shwētā sain māḍbēku. Pēśaṇṭ avarē, pūrti echcharavāgidāre, nirdhāra avaraddu. Nīvu keḷage sambandhikarāgi, sākṣiyāgi sain māḍi. Ēnādrū ḍauṭ idre īglē kēḷi.
    en: Shwetha signs first. She's the patient, she's fully conscious, the decision is hers. You sign below as her relative and witness. If you have any doubts, ask now.
  - who: shwe
    t: ಡೌಟ್ ಇಲ್ಲ ಡಾಕ್ಟರ್. ಭಯ ಇದೆ, ಡೌಟ್ ಇಲ್ಲ. ಪೆನ್ ಕೊಡಿ.
    tr: Ḍauṭ illa ḍākṭar. Bhaya ide, ḍauṭ illa. Pen koḍi.
    en: No doubts, Doctor. I'm scared, but I have no doubts. Give me the pen.
  - who: gyn
    t: ಧೈರ್ಯವಂತೆ. ಇಪ್ಪತ್ತು ನಿಮಿಷದಲ್ಲಿ ಓಟಿಗೆ ಶಿಫ್ಟ್ ಮಾಡ್ತೀವಿ. ಮಕ್ಕಳ ಡಾಕ್ಟ್ರು ಫರ್ಹಾನ್ ಕೂಡ ಓಟಿಯಲ್ಲಿರ್ತಾರೆ, ಮಗು ಹೊರಗೆ ಬಂದ ತಕ್ಷಣ ಅವರು ನೋಡ್ಕೊಳ್ತಾರೆ.
    tr: Dhairyavante. Ippattu nimiṣadalli ōṭige śifṭ māḍtīvi. Makkaḷa ḍākṭru Pharhān kūḍa ōṭiyallirtāre, magu horage banda takṣaṇa avaru nōḍkoḷtāre.
    en: Brave girl. We'll shift you to the OT in twenty minutes. The paediatrician, Dr. Farhan, will be in the OT too; he'll take care of the baby the moment she's out.
  - who: pradeep
    t: ನಾನು ಇಲ್ಲೇ ಬಾಗಿಲ ಹತ್ರ ಇರ್ತೀನಿ, ಶ್ವೇತಾ. ಎಲ್ಲೂ ಹೋಗಲ್ಲ.
    tr: Nānu illē bāgila hatra irtīni, Shwētā. Ellū hōgalla.
    en: I'll be right here by the door, Shwetha. I'm not going anywhere.
  - section: 🪑 Waiting outside the OT
    learn: 'ನಡುಗು (tremble) · ಹರಕೆ ಹೊರು (make a vow) · telling elders the truth: ಸುಳ್ಳು ಹೇಳ್ಬೇಡ · ಅತ್ತ ಇತ್ತ (back and forth)'
  - scene: 10:40 a.m. The corridor outside the operation theatre; a red light glows above the door. Appa, Amma, Pradeep, Kiran and Sam. Sumitra and Shankar hurry in.
  - who: sumitra
    t: ಏನಾಯ್ತು? ಫೋನಲ್ಲಿ ಪ್ರದೀಪ್ 'ಆಪರೇಷನ್' ಅಂದ ತಕ್ಷಣ ನನ್ನ ಕೈ ಕಾಲು ನಡುಗೋಕೆ ಶುರು ಆಯ್ತು.
    tr: Ēnāytu? Phōnalli Pradīp 'āparēṣan' anda takṣaṇa nanna kai kālu naḍugōke śuru āytu.
    en: What happened? The moment Pradeep said 'operation' on the phone, my hands and legs started shaking.
  - who: amma
    t: ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ಇಳೀತಿತ್ತು, ಅದಕ್ಕೆ ಡಾಕ್ಟ್ರು ಸಿಸೇರಿಯನ್ ಮಾಡ್ತಿದಾರೆ. ಶ್ವೇತಾ ತುಂಬಾ ಧೈರ್ಯವಾಗಿ ಸೈನ್ ಮಾಡಿದ್ಲು. ನಾನೇ ಅಳ್ತಾ ಇದ್ದೆ, ಅವಳು ನನಗೆ ಸಮಾಧಾನ ಮಾಡಿದ್ಲು.
    tr: Maguvina hārṭbīṭ iḷītittu, adakke ḍākṭru sisēriyan māḍtidāre. Shwētā tumbā dhairyavāgi sain māḍidlu. Nānē aḷtā idde, avaḷu nanage samādhāna māḍidlu.
    en: The baby's heartbeat was dropping, so the doctor is doing a C-section. Shwetha signed so bravely. I was the one crying — she was the one comforting me.
  - who: shankar
    t: ಉಷಾ ಡಾಕ್ಟ್ರದ್ದು ಒಳ್ಳೆ ಕೈ ಅಂತ ಎಲ್ರೂ ಹೇಳ್ತಾರೆ. ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ನಿರ್ಧಾರ ತಗೊಂಡಿದಾರೆ. ಎಲ್ಲಾ ಸರಿ ಹೋಗುತ್ತೆ.
    tr: Uṣā ḍākṭraddu oḷḷe kai anta ellrū hēḷtāre. Samayakke sariyāgi nirdhāra tagoṇḍidāre. Ellā sari hōgutte.
    en: Everyone says Dr. Usha has good hands. She made the decision at the right time. It'll all be fine.
  - who: appa
    t: ಹಲೋ ಅಮ್ಮ… ಹೌದು, ಓಟಿ ಒಳಗೆ ಕರ್ಕೊಂಡು ಹೋದ್ರು. ಇಲ್ಲ ಇಲ್ಲ, ಗಾಬರಿ ಪಡೋ ಅಂಥದ್ದು ಏನಿಲ್ಲ…
    tr: Halō amma… haudu, ōṭi oḷage karkoṇḍu hōdru. Illa illa, gābari paḍō anthaddu ēnilla…
    en: (on the phone) Hello, Amma… yes, they've taken her into the OT. No, no, there's nothing to panic about…
  - who: ajji
    t: ರಮೇಶ, ನನಗೆ ಸುಳ್ಳು ಹೇಳ್ಬೇಡ. ನಿನ್ನ ಧ್ವನಿಯಲ್ಲೇ ಗೊತ್ತಾಗುತ್ತೆ. ಆಪರೇಷನ್ ಯಾಕೆ ಆಯ್ತು?
    tr: Ramēsha, nanage suḷḷu hēḷbēḍa. Ninna dhvaniyallē gottāgutte. Āparēṣan yāke āytu?
    en: (on the phone) Ramesh, don't lie to me. I can hear it in your voice. Why did it become an operation?
  - who: appa
    t: ಮಗುವಿನ ಹಾರ್ಟ್‌ಬೀಟ್ ಸ್ವಲ್ಪ ಕಮ್ಮಿ ಆಗ್ತಿತ್ತು ಅಮ್ಮ. ಅದಕ್ಕೇ ಕಾಯದೆ ಆಪರೇಷನ್. ಡಾಕ್ಟ್ರು ಎಲ್ಲಾ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದ್ರು, ಶ್ವೇತಾ ಸಮಾಧಾನವಾಗಿದಾಳೆ.
    tr: Maguvina hārṭbīṭ svalpa kammi āgtittu amma. Adakkē kāyade āparēṣan. Ḍākṭru ellā spaṣṭavāgi hēḷidru, Shwētā samādhānavāgidāḷe.
    en: The baby's heartbeat was going down a bit, Amma. That's why they're operating instead of waiting. The doctor explained everything clearly, and Shwetha is calm.
  - who: ajji
    t: ಸರಿ. ನಾನು ಇಲ್ಲಿ ದೇವರ ಮುಂದೆ ಕೂತಿದೀನಿ, ವಿಮಲಾ ಜೊತೆಗಿದಾಳೆ. ನನ್ನ ಚಿಂತೆ ಮಾಡ್ಬೇಡ. ಮಗು ಅತ್ತ ತಕ್ಷಣ ನನಗೆ ಫೋನ್ ಮಾಡು, ಮೊದಲು ನನಗೆ.
    tr: Sari. Nānu illi dēvara munde kūtidīni, Vimalā jotegidāḷe. Nanna chinte māḍbēḍa. Magu atta takṣaṇa nanage phōn māḍu, modalu nanage.
    en: All right. I'm sitting here in front of the gods, and Vimala is with me. Don't worry about me. The moment the baby cries, call me — me first.
  - who: vimala
    t: ರಮೇಶ್, ಅಜ್ಜಿ ಬಿಪಿ ನೋಡಿದೀನಿ, ನೂರ ಮೂವತ್ತು ಬೈ ಎಂಬತ್ತು. ಮಾತ್ರೆನೂ ತಗೊಂಡಿದಾರೆ. ಇಲ್ಲಿ ನಾನು ನೋಡ್ಕೊಳ್ತೀನಿ, ನೀವು ಅಲ್ಲಿ ನೋಡ್ಕೊಳ್ಳಿ.
    tr: Ramēsh, ajji bipi nōḍidīni, nūra mūvattu bai embattu. Mātrenū tagoṇḍidāre. Illi nānu nōḍkoḷtīni, nīvu alli nōḍkoḷḷi.
    en: (on the phone) Ramesh, I've checked Ajji's BP — one-thirty over eighty. She's taken her tablets too. I'll look after things here; you look after things there.
  - who: kiran
    t: ಪ್ರದೀಪ್ ಭಾವ, ಸ್ವಲ್ಪ ಕೂತ್ಕೊಳ್ಳಿ. ಅರ್ಧ ಗಂಟೆಯಿಂದ ಆ ಬಾಗಿಲ ಮುಂದೆ ಅತ್ತ ಇತ್ತ ಓಡಾಡ್ತಿದೀರಿ.
    tr: Pradīp bhāva, svalpa kūtkoḷḷi. Ardha gaṇṭeyinda ā bāgila munde atta itta ōḍāḍtidīri.
    en: Pradeep, sit down for a bit. You've been pacing back and forth in front of that door for half an hour.
  - who: pradeep
    t: ಕೂತ್ರೆ ಇನ್ನೂ ಜಾಸ್ತಿ ಟೆನ್ಶನ್ ಆಗುತ್ತೆ ಕಿರಣ್. ಒಳಗೆ ಏನಾಗ್ತಿದೆ ಅಂತ ಗೊತ್ತಿಲ್ಲದೆ ಕಾಯೋದು… ಇದಕ್ಕಿಂತ ಕಷ್ಟದ ಕೆಲಸ ನಾನು ಜೀವನದಲ್ಲಿ ಮಾಡಿಲ್ಲ.
    tr: Kūtre innū jāsti ṭenśan āgutte Kiraṇ. Oḷage ēnāgtide anta gottillade kāyōdu… idakkinta kaṣṭada kelasa nānu jīvanadalli māḍilla.
    en: Sitting down makes it worse, Kiran. Waiting without knowing what's happening inside… I've never done anything harder in my life.
  - who: sam
    t: ಅಜ್ಜಿ ಐಸಿಯುನಲ್ಲಿದ್ದಾಗ್ಲೂ ನಾವು ಹೀಗೇ ಕಾಯ್ತಿದ್ವಿ, ನೆನಪಿದೆಯಾ? ಆ ರಾತ್ರಿನೂ ಚೆನ್ನಾಗಿ ಮುಗೀತು. ಇದೂ ಮುಗಿಯುತ್ತೆ.
    tr: Ajji aisiyunalliddāglū nāvu hīgē kāytidvi, nenapideyā? Ā rātrinū chennāgi mugītu. Idū mugiyutte.
    en: When Ajji was in the ICU we waited just like this, remember? That night ended well too. This will as well.
  - who: sumitra
    t: ನಾನು ತಿರುಪತಿಗೆ ಹರಕೆ ಹೊತ್ತಿದೀನಿ. ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಆರಾಮಾಗಿ ಹೊರಗೆ ಬಂದ್ರೆ ನಾವೆಲ್ಲಾ ಒಟ್ಟಿಗೆ ಹೋಗಿ ಬರೋಣ.
    tr: Nānu Tirupatige harake hottidīni. Tāyi-magu ibrū ārāmāgi horage bandre nāvellā oṭṭige hōgi barōṇa.
    en: I've made a vow to Tirupati. If mother and child both come out safe and well, let's all go there together.
  - who: amma
    t: ನಾನೂ ಬರ್ತೀನಿ ಸುಮಿತ್ರಾ ಅವರೇ. ಡಾಕ್ಟ್ರು ಒಪ್ಪಿದ್ರೆ ಅಜ್ಜಿನೂ ಕರ್ಕೊಂಡು ಹೋಗೋಣ.
    tr: Nānū bartīni Sumitrā avarē. Ḍākṭru oppidre ajjinū karkoṇḍu hōgōṇa.
    en: I'll come too, Sumitra. And if the doctor agrees, let's take Ajji with us.
  - section: 👶 A baby girl
    learn: 'birth news: ಹೆಣ್ಣು ಮಗು, ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಆರಾಮಾಗಿದಾರೆ · ಹೊಲಿಗೆ (stitches) · ಮರಿಮಗಳು, ಮಾಮ, ತಾತ — new titles'
  - scene: Wednesday, 11 November, 11:12 a.m. The OT door opens. A nurse comes out carrying a small bundle wrapped in a green cloth.
  - who: nurse
    t: ಶ್ವೇತಾ ಅವರ ಕಡೆಯವರು ಯಾರು? ಬನ್ನಿ. ಹೆಣ್ಣು ಮಗು! ಹನ್ನೊಂದು ಗಂಟೆ ಏಳು ನಿಮಿಷಕ್ಕೆ ಹುಟ್ಟಿದ್ದು. ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಆರಾಮಾಗಿದಾರೆ.
    tr: Shwētā avara kaḍeyavaru yāru? Banni. Heṇṇu magu! Hannondu gaṇṭe ēḷu nimiṣakke huṭṭiddu. Tāyi-magu ibrū ārāmāgidāre.
    en: Who's with Shwetha? Come. It's a girl! Born at seven minutes past eleven. Mother and baby are both fine.
  - who: pradeep
    t: ಹೆಣ್ಣು ಮಗು… ನನ್ನ ಮಗಳು… ಸಿಸ್ಟರ್, ಶ್ವೇತಾ ಹೇಗಿದಾಳೆ? ನಿಜವಾಗ್ಲೂ ಆರಾಮಾಗಿದಾಳಾ?
    tr: Heṇṇu magu… nanna magaḷu… sisṭar, Shwētā hēgidāḷe? Nijavāglū ārāmāgidāḷā?
    en: A girl… my daughter… Sister, how's Shwetha? Is she really all right?
  - who: nurse
    t: ಹೌದು ಸಾರ್. ಅವರು ಎಚ್ಚರವಾಗಿದಾರೆ, ಮಗು ಅತ್ತಿದ್ದು ಕೇಳಿ ಅತ್ತು-ನಕ್ಕರು. ಡಾಕ್ಟ್ರು ಹೊಲಿಗೆ ಹಾಕ್ತಿದಾರೆ, ಅರ್ಧ ಗಂಟೆಯಲ್ಲಿ ರಿಕವರಿ ರೂಮಿಗೆ ಶಿಫ್ಟ್ ಮಾಡ್ತೀವಿ. ತಗೊಳ್ಳಿ, ತಲೆ ಕೆಳಗೆ ಕೈ ಇಟ್ಕೊಂಡು ಹಿಡೀರಿ.
    tr: Haudu sār. Avaru echcharavāgidāre, magu attiddu kēḷi attu-nakkaru. Ḍākṭru holige hāktidāre, ardha gaṇṭeyalli rikavari rūmige śifṭ māḍtīvi. Tagoḷḷi, tale keḷage kai iṭkoṇḍu hiḍīri.
    en: Yes, sir. She's awake; when she heard the baby cry she laughed and cried at once. The doctor is putting in the stitches; we'll shift her to the recovery room in half an hour. Here — take her, keep your hand under her head.
  - who: amma
    t: ಅಯ್ಯೋ ನನ್ನ ಬಂಗಾರ… ನೋಡಿ, ಶ್ವೇತಾ ಹುಟ್ಟಿದಾಗ ಹೀಗೇ ಇದ್ಲು. ಅದೇ ಮೂಗು.
    tr: Ayyō nanna baṅgāra… nōḍi, Shwētā huṭṭidāga hīgē idlu. Adē mūgu.
    en: Oh, my little treasure… look, Shwetha looked just like this when she was born. The very same nose.
  - who: sumitra
    t: ಮೂಗು ನಿಮ್ಮ ಕಡೆದು ಲಕ್ಷ್ಮಿ ಅವರೇ, ಒಪ್ತೀನಿ. ಆದ್ರೆ ಕಣ್ಣು ನೋಡಿ, ಅದು ಪ್ರದೀಪ್ ಕಣ್ಣು!
    tr: Mūgu nimma kaḍedu Lakshmī avarē, optīni. Ādre kaṇṇu nōḍi, adu Pradīp kaṇṇu!
    en: (laughing through tears) The nose is from your side, Lakshmi, I'll grant you that. But look at the eyes — those are Pradeep's eyes!
  - who: appa
    t: ಅಮ್ಮ! ಹೆಣ್ಣು ಮಗು, ಮನೆಗೆ ಲಕ್ಷ್ಮಿ ಬಂದ್ಲು! ತಾಯಿ-ಮಗು ಇಬ್ರೂ ಚೆನ್ನಾಗಿದಾರೆ. ಮೊದಲು ನಿಮಗೇ ಫೋನ್ ಮಾಡಿದೀನಿ.
    tr: Amma! Heṇṇu magu, manege Lakshmī bandlu! Tāyi-magu ibrū chennāgidāre. Modalu nimagē phōn māḍidīni.
    en: (on the phone) Amma! It's a girl — Lakshmi herself has come into the house! Mother and baby are both well. I called you first.
  - who: ajji
    t: ದೇವರೇ… ನಿನ್ನ ದಯೆ. ನನ್ನ ಮರಿಮಗಳು… ರಮೇಶ, ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಎಲ್ರಿಗೂ ಸಿಹಿ ಹಂಚು. ವಿಮಲಾ, ದೀಪಕ್ಕೆ ಇನ್ನೂ ಸ್ವಲ್ಪ ಎಣ್ಣೆ ಹಾಕು.
    tr: Dēvarē… ninna daye. Nanna marimagaḷu… Ramēsha, āspatreyalli ellrigū sihi hañchu. Vimalā, dīpakke innū svalpa eṇṇe hāku.
    en: (on the phone, her voice breaking) Oh God… by your grace. My great-granddaughter… Ramesh, hand out sweets to everyone at the hospital. Vimala, pour a little more oil in the lamp.
  - who: shankar
    t: ನಮ್ಮ ವಂಶದಲ್ಲಿ ಎರಡು ತಲೆಮಾರಿನಿಂದ ಹೆಣ್ಣು ಮಗು ಹುಟ್ಟಿರಲಿಲ್ಲ. ಇದಕ್ಕಿಂತ ದೊಡ್ಡ ಭಾಗ್ಯ ಇಲ್ಲ.
    tr: Namma vaṁśadalli eraḍu talemārininda heṇṇu magu huṭṭiralilla. Idakkinta doḍḍa bhāgya illa.
    en: (quietly) No girl has been born in our family for two generations. There's no greater blessing than this.
  - who: kiran
    t: ನಾನು ಮಾಮ ಆದೆ! ಸ್ಯಾಮ್, ಫೋಟೋ ತೆಗಿ, ಫ್ಯಾಮಿಲಿ ಗ್ರೂಪಿಗೆ ಹಾಕ್ಬೇಕು.
    tr: Nānu māma āde! Sām, phōṭō tegi, phyāmili grūpige hākbēku.
    en: I'm an uncle! Sam, take a photo, it has to go on the family group.
  - who: sam
    t: ತೆಗೀತೀನಿ, ಆದ್ರೆ ಫ್ಲ್ಯಾಶ್ ಇಲ್ಲದೆ. ಮೊದಲು ಅಜ್ಜಿಗೆ ವಿಡಿಯೋ ಕಾಲ್ ಮಾಡೋಣ, ಗ್ರೂಪ್ ಆಮೇಲೆ.
    tr: Tegītīni, ādre phlyāś illade. Modalu ajjige viḍiyō kāl māḍōṇa, grūp āmēle.
    en: I'll take one, but without the flash. First let's video-call Ajji; the group can wait.
  - section: '🍼 Dr. Farhan: the first hours'
    learn: 'ತೂಕ (weight) · APGAR explained · ಗಿಣ್ಣಿನ ಹಾಲು (colostrum), ಎದೆಹಾಲು, ಹಾಲು ಕುಡಿಸು · ಲಸಿಕೆ: BCG, OPV-0, Hep B · prohibitions: ಜೇನುತುಪ್ಪ ಕೊಡಬೇಡಿ'
  - scene: Two hours later, the postnatal room. Shwetha lies propped up, pale but smiling, the baby skin-to-skin on her chest. The paediatrician, Dr. Farhan, examines the baby while Pradeep and Amma listen.
  - who: paed
    t: 'ನಮಸ್ಕಾರ, ನಾನು ಡಾಕ್ಟರ್ ಫರ್ಹಾನ್, ಮಕ್ಕಳ ಡಾಕ್ಟ್ರು. ಮೊದಲು ಒಳ್ಳೆ ಸುದ್ದಿ: ಮಗು ಎರಡು ಪಾಯಿಂಟ್ ಒಂಬತ್ತು ಕೆಜಿ, ಉದ್ದ ನಲವತ್ತೊಂಬತ್ತು ಸೆಂಟಿಮೀಟರ್. ನಲವತ್ತು ವಾರಕ್ಕೆ ಇದು ಒಳ್ಳೆ ತೂಕ.'
    tr: 'Namaskāra, nānu ḍākṭar Pharhān, makkaḷa ḍākṭru. Modalu oḷḷe suddi: magu eraḍu pāyiṇṭ ombattu keji, udda nalavattombattu seṇṭimīṭar. Nalavattu vārakke idu oḷḷe tūka.'
    en: 'Hello, I''m Dr. Farhan, the paediatrician. Good news first: the baby weighs 2.9 kilos and is forty-nine centimetres long. That''s a good weight at forty weeks.'
  - who: shwe
    t: ಹುಟ್ಟಿದ ತಕ್ಷಣ ಅವಳು ಅತ್ತಳಾ ಡಾಕ್ಟರ್? ನೀರು ಹಸಿರಾಗಿತ್ತು ಅಂತ ಹೇಳಿದ್ರು, ಅದಕ್ಕೆ ಭಯ.
    tr: Huṭṭida takṣaṇa avaḷu attaḷā ḍākṭar? Nīru hasirāgittu anta hēḷidru, adakke bhaya.
    en: Did she cry straight away when she was born, Doctor? They said the fluid was green, so I'm scared.
  - who: paed
    t: ಹೌದು, ಹೊರಗೆ ಬಂದ ತಕ್ಷಣ ಜೋರಾಗಿ ಅತ್ತಳು. ಮೆಕೋನಿಯಂ ಇದ್ದಿದ್ರಿಂದ ನಾವು ರೆಡಿಯಾಗಿದ್ವಿ, ಆದ್ರೆ ಅವಳಿಗೆ ಉಸಿರಾಟಕ್ಕೆ ಯಾವ ಸಹಾಯನೂ ಬೇಕಾಗಲಿಲ್ಲ. ಆಪ್ಗಾರ್ ಸ್ಕೋರ್ ಒಂದು ನಿಮಿಷಕ್ಕೆ ಎಂಟು, ಐದು ನಿಮಿಷಕ್ಕೆ ಒಂಬತ್ತು.
    tr: Haudu, horage banda takṣaṇa jōrāgi attaḷu. Mekōniyam iddidrinda nāvu reḍiyāgidvi, ādre avaḷige usirāṭakke yāva sahāyanū bēkāgalilla. Āpgār skōr ondu nimiṣakke eṇṭu, aidu nimiṣakke ombattu.
    en: Yes, she cried loudly the moment she was out. Because of the meconium we were prepared, but she didn't need any help with breathing. Her APGAR score was eight at one minute and nine at five minutes.
  - who: pradeep
    t: ಆಪ್ಗಾರ್ ಅಂದ್ರೆ ಏನು? ಹತ್ತಕ್ಕೆ ಒಂಬತ್ತಾ?
    tr: Āpgār andre ēnu? Hattakke ombattā?
    en: What's APGAR? Nine out of ten?
  - who: paed
    t: 'ಹೌದು. ಹುಟ್ಟಿದ ತಕ್ಷಣ ಐದು ವಿಷಯ ನೋಡ್ತೀವಿ: ಹಾರ್ಟ್‌ರೇಟ್, ಉಸಿರಾಟ, ಮೈ ಬಣ್ಣ, ಕೈ ಕಾಲು ಎಷ್ಟು ಗಟ್ಟಿಯಾಗಿ ಆಡಿಸ್ತಾಳೆ, ಮುಟ್ಟಿದ್ರೆ ಹೇಗೆ ಸ್ಪಂದಿಸ್ತಾಳೆ. ಒಂದೊಂದಕ್ಕೂ ಎರಡು ಮಾರ್ಕ್ಸ್. ಹತ್ತು ಸಿಗೋದು ಅಪರೂಪ, ಮೊದಲು ಕೈ ಕಾಲು ಸ್ವಲ್ಪ ನೀಲಿ ಇರುತ್ತೆ. ಎಂಟು-ಒಂಬತ್ತು ಅಂದ್ರೆ ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ.'
    tr: 'Haudu. Huṭṭida takṣaṇa aidu viṣaya nōḍtīvi: hārṭrēṭ, usirāṭa, mai baṇṇa, kai kālu eṣṭu gaṭṭiyāgi āḍistāḷe, muṭṭidre hēge spandistāḷe. Ondondakkū eraḍu mārks. Hattu sigōdu aparūpa, modalu kai kālu svalpa nīli irutte. Eṇṭu-ombattu andre tumbā chennāgide.'
    en: 'Yes. Right after birth we check five things: heart rate, breathing, skin colour, how strongly she moves her arms and legs, and how she responds to touch. Two marks for each. A ten is rare — the hands and feet are usually a little blue at first. Eight or nine is very good.'
  - who: paed
    t: 'ಇನ್ನೊಂದು ವಿಷಯ: ತಾಯಿಗೆ ಶುಗರ್ ಬಾರ್ಡರ್‌ಲೈನ್ ಇದ್ದಿದ್ರಿಂದ ಮೊದಲ ಇಪ್ಪತ್ನಾಲ್ಕು ಗಂಟೆ ಮಗುವಿನ ಶುಗರ್ ಕೆಲವು ಸಲ ಚೆಕ್ ಮಾಡ್ತೀವಿ. ಹಿಮ್ಮಡಿಗೆ ಸಣ್ಣ ಸೂಜಿ ಚುಚ್ಚಿ ಒಂದು ಹನಿ ರಕ್ತ ತಗೋತೀವಿ. ಮೊದಲ ಟೆಸ್ಟ್ ನಾರ್ಮಲ್ ಬಂದಿದೆ.'
    tr: 'Innondu viṣaya: tāyige śugar bārḍarlain iddidrinda modala ippatnālku gaṇṭe maguvina śugar kelavu sala chek māḍtīvi. Himmaḍige saṇṇa sūji chuchchi ondu hani rakta tagōtīvi. Modala ṭesṭ nārmal bandide.'
    en: 'One more thing: because the mother''s sugar was borderline, we''ll check the baby''s sugar a few times in the first twenty-four hours. We prick her heel with a tiny needle and take one drop of blood. The first test came back normal.'
  - who: amma
    t: ಡಾಕ್ಟ್ರೇ, ನಮ್ಮ ಕಡೆ ಹುಟ್ಟಿದ ತಕ್ಷಣ ಸ್ವಲ್ಪ ಜೇನುತುಪ್ಪ ನೆಕ್ಕಿಸ್ತಾರೆ… ಅದು ಕೊಡಬಹುದಾ?
    tr: Ḍākṭrē, namma kaḍe huṭṭida takṣaṇa svalpa jēnutuppa nekkistāre… adu koḍabahudā?
    en: Doctor, in our family we give a newborn a little lick of honey… can we give that?
  - who: paed
    t: ಬೇಡ ಅಮ್ಮ, ದಯವಿಟ್ಟು ಬೇಡ. ಜೇನುತುಪ್ಪ, ನೀರು, ಗ್ರೈಪ್ ವಾಟರ್, ಯಾವುದೂ ಬೇಡ. ಒಂದು ವರ್ಷದ ಒಳಗಿನ ಮಗುವಿಗೆ ಜೇನುತುಪ್ಪದಿಂದ ಅಪಾಯಕಾರಿ ಇನ್‌ಫೆಕ್ಷನ್ ಆಗಬಹುದು. ಆರು ತಿಂಗಳು ಬರೀ ಎದೆಹಾಲು ಸಾಕು, ನೀರೂ ಬೇಕಾಗಿಲ್ಲ.
    tr: Bēḍa amma, dayaviṭṭu bēḍa. Jēnutuppa, nīru, graip vāṭar, yāvudū bēḍa. Ondu varṣada oḷagina maguvige jēnutuppadinda apāyakāri inphekṣan āgabahudu. Āru tiṅgaḷu barī edehālu sāku, nīrū bēkāgilla.
    en: No, Amma — please, no. No honey, no water, no gripe water, nothing. In a baby under one, honey can cause a dangerous infection. For six months, breast milk alone is enough — she doesn't even need water.
  - who: paed
    t: 'ಮೊದಲು ಬರೋದು ಗಿಣ್ಣಿನ ಹಾಲು: ಹಳದಿ, ದಪ್ಪ, ಸ್ವಲ್ಪನೇ ಬರುತ್ತೆ. ಅದು ಮಗುವಿನ ಮೊದಲ ಲಸಿಕೆ ಇದ್ದ ಹಾಗೆ, ಒಂದು ಹನಿನೂ ವೇಸ್ಟ್ ಮಾಡ್ಬೇಡಿ. ಆಪರೇಷನ್ ಆಗಿದೆ ಅಂತ ಕಾಯೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ, ಈಗ್ಲೇ ಹಾಲು ಕುಡಿಸಿ. ಹೇಗೆ ಹಿಡ್ಕೋಬೇಕು ಅಂತ ಸಿಸ್ಟರ್ ತೋರಿಸ್ತಾರೆ.'
    tr: 'Modalu barōdu giṇṇina hālu: haḷadi, dappa, svalpanē barutte. Adu maguvina modala lasike idda hāge, ondu haninū vēsṭ māḍbēḍi. Āparēṣan āgide anta kāyō avaśyakate illa, īglē hālu kuḍisi. Hēge hiḍkōbēku anta sisṭar tōristāre.'
    en: The first milk is colostrum — yellow, thick, and only a little of it. It's like the baby's first vaccine; don't waste a single drop. There's no need to wait because of the operation — feed her now. The sister will show you how to hold her.
  - who: shwe
    t: ಹಾಲು ಸಾಕಾಗುತ್ತಾ ಅಂತ ಭಯ ಆಗ್ತಿದೆ ಡಾಕ್ಟರ್. ಏನೂ ಬರ್ತಿಲ್ಲ ಅನ್ಸುತ್ತೆ.
    tr: Hālu sākāguttā anta bhaya āgtide ḍākṭar. Ēnū bartilla ansutte.
    en: I'm scared there won't be enough milk, Doctor. It feels like nothing's coming.
  - who: paed
    t: ಮೊದಲ ಎರಡು-ಮೂರು ದಿನ ಸ್ವಲ್ಪನೇ ಬರೋದು ಸಹಜ. ಈಗ ಮಗುವಿನ ಹೊಟ್ಟೆ ಒಂದು ಗೋಲಿ ಅಷ್ಟು ಚಿಕ್ಕದು. ಎಷ್ಟು ಸಲ ಕುಡಿಸ್ತೀರೋ ಅಷ್ಟು ಹಾಲು ಜಾಸ್ತಿ ಆಗುತ್ತೆ. ಹಾಲು ಬರೋದು ಹೊಟ್ಟೆಯಿಂದ ಅಲ್ಲ, ಮನಸ್ಸಿನಿಂದ ಅಂತಾರೆ, ಅದಕ್ಕೇ ಟೆನ್ಶನ್ ತಗೋಬೇಡಿ.
    tr: Modala eraḍu-mūru dina svalpanē barōdu sahaja. Īga maguvina hoṭṭe ondu gōli aṣṭu chikkadu. Eṣṭu sala kuḍistīrō aṣṭu hālu jāsti āgutte. Hālu barōdu hoṭṭeyinda alla, manassininda antāre, adakkē ṭenśan tagōbēḍi.
    en: For the first two or three days, only a little comes — that's normal. Right now the baby's stomach is as small as a marble. The more often you feed her, the more milk you'll make. They say milk comes from the mind, not the body — so don't stress.
  - who: paed
    t: 'ಈಗ ಲಸಿಕೆ. ಹುಟ್ಟಿದಾಗ ಮೂರು ಕೊಡ್ತೀವಿ: ಬಿಸಿಜಿ, ಟಿಬಿಗೆ, ಎಡ ತೋಳಿನ ಮೇಲೆ; ಓಪಿವಿ ಝೀರೋ, ಬಾಯಿಗೆ ಎರಡು ಹನಿ ಪೋಲಿಯೊ; ಮತ್ತೆ ಹೆಪಟೈಟಿಸ್ ಬಿ ಮೊದಲ ಡೋಸ್, ತೊಡೆಗೆ ಇಂಜೆಕ್ಷನ್. ಹೆಪಟೈಟಿಸ್ ಬಿ ಇಪ್ಪತ್ನಾಲ್ಕು ಗಂಟೆ ಒಳಗೆ ಕೊಡ್ಬೇಕು, ಅದಕ್ಕೇ ಇವತ್ತೇ ಕೊಡ್ತೀವಿ.'
    tr: 'Īga lasike. Huṭṭidāga mūru koḍtīvi: bisiji, ṭibige, eḍa tōḷina mēle; ōpivi zīrō, bāyige eraḍu hani pōliyo; matte hepaṭaiṭis bi modala ḍōs, toḍege iñjekṣan. Hepaṭaiṭis bi ippatnālku gaṇṭe oḷage koḍbēku, adakkē ivattē koḍtīvi.'
    en: 'Now the vaccines. At birth we give three: BCG, against TB, on the left upper arm; OPV zero, two drops of polio vaccine in the mouth; and the first dose of hepatitis B, an injection in the thigh. Hepatitis B has to be given within twenty-four hours, so we''ll do it today.'
  - who: pradeep
    t: ಬಿಸಿಜಿ ಹಾಕಿದ ಜಾಗದಲ್ಲಿ ಆಮೇಲೆ ಏನಾದ್ರೂ ಆಗುತ್ತಾ? ಏನು ನೋಡ್ಕೋಬೇಕು?
    tr: Bisiji hākida jāgadalli āmēle ēnādrū āguttā? Ēnu nōḍkōbēku?
    en: Does anything happen later where the BCG is given? What should we watch for?
  - who: paed
    t: ಒಳ್ಳೆ ಪ್ರಶ್ನೆ. ಕೆಲವು ವಾರ ಆದ್ಮೇಲೆ ಅಲ್ಲಿ ಸಣ್ಣ ಗುಳ್ಳೆ ಆಗಿ, ಸ್ವಲ್ಪ ಕೀವು ಬಂದು, ಆಮೇಲೆ ಒಣಗಿ ಒಂದು ಸಣ್ಣ ಕಲೆ ಉಳಿಯುತ್ತೆ. ಲಸಿಕೆ ಕೆಲಸ ಮಾಡ್ತಿದೆ ಅನ್ನೋದಕ್ಕೆ ಅದೇ ಗುರುತು. ಅದರ ಮೇಲೆ ಏನೂ ಹಚ್ಚಬೇಡಿ, ಒತ್ತಬೇಡಿ.
    tr: Oḷḷe praśne. Kelavu vāra ādmēle alli saṇṇa guḷḷe āgi, svalpa kīvu bandu, āmēle oṇagi ondu saṇṇa kale uḷiyutte. Lasike kelasa māḍtide annōdakke adē gurutu. Adara mēle ēnū hachchabēḍi, ottabēḍi.
    en: Good question. After a few weeks a small bump forms there, a little pus comes, then it dries and leaves a small scar. That's the sign the vaccine is working. Don't put anything on it, and don't press it.
  - who: paed
    t: 'ಮುಂದಿನದು ಆರನೇ ವಾರಕ್ಕೆ: ಪೋಲಿಯೊ, ಪೆಂಟಾವೇಲೆಂಟ್, ರೋಟಾವೈರಸ್, ನ್ಯುಮೋಕಾಕಲ್, ಆಮೇಲೆ ಹತ್ತನೇ ವಾರ, ಹದಿನಾಲ್ಕನೇ ವಾರ. ಈ ಕಾರ್ಡಲ್ಲಿ ಎಲ್ಲಾ ದಿನಾಂಕ ಬರೆದಿದೀನಿ. ಸರ್ಕಾರಿ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಇವೆಲ್ಲಾ ಫ್ರೀ. ಪ್ರೈವೇಟ್‌ನಲ್ಲಿ ''ಪೇನ್‌ಲೆಸ್'' ಆಪ್ಷನ್ ಇದೆ, ಆದ್ರೆ ಒಂದು ಡೋಸಿಗೆ ಮೂರು-ನಾಲ್ಕು ಸಾವಿರ ಆಗುತ್ತೆ. ಎರಡೂ ಸೇಫ್, ನೀವೇ ನಿರ್ಧಾರ ಮಾಡಿ.'
    tr: 'Mundinadu āranē vārakke: pōliyo, peṇṭāvēleṇṭ, rōṭāvairas, nyumōkākal, āmēle hattanē vāra, hadinālkanē vāra. Ī kārḍalli ellā dināṅka baredidīni. Sarkāri āspatreyalli ivellā phrī. Praivēṭnalli ''pēnles'' āpṣan ide, ādre ondu ḍōsige mūru-nālku sāvira āgutte. Eraḍū sēph, nīvē nirdhāra māḍi.'
    en: 'The next ones are at six weeks: polio, pentavalent, rotavirus, pneumococcal; then at ten weeks and fourteen weeks. I''ve written all the dates on this card. At government hospitals all of these are free. Privately there''s a ''painless'' option, but it costs three to four thousand a dose. Both are safe — you decide.'
  - who: amma
    t: ಸರ್ಕಾರಿದ್ದು ಫ್ರೀ, ಪ್ರೈವೇಟ್ ತುಂಬಾ ದುಬಾರಿ… ಮನೆ ಹತ್ರ ಸರ್ಕಾರಿ ಆರೋಗ್ಯ ಕೇಂದ್ರ ಇದೆ, ಅಲ್ಲಿ ವಿಚಾರಿಸೋಣ.
    tr: Sarkāriddu phrī, praivēṭ tumbā dubāri… mane hatra sarkāri ārōgya kēndra ide, alli vichārisōṇa.
    en: The government one is free, the private one very expensive… there's a government health centre near the house; let's ask there.
  - who: paed
    t: 'ಹಾಗೇ ಮಾಡಿ, ತೊಂದರೆ ಇಲ್ಲ. ಒಂದೇ ಕಂಡೀಷನ್: ದಿನಾಂಕ ತಪ್ಪಿಸ್ಬೇಡಿ. ಮತ್ತೆ ಮೂರನೇ ದಿನದಿಂದ ಮಗುವಿನ ಕಣ್ಣು, ಮೈ ಹಳದಿ ಆಗ್ತಿದೆಯಾ ಅಂತ ನೋಡ್ತೀವಿ. ಸ್ವಲ್ಪ ಕಾಮಾಲೆ ತುಂಬಾ ಮಕ್ಕಳಿಗೆ ಬರುತ್ತೆ, ಗಾಬರಿ ಬೇಡ.'
    tr: 'Hāgē māḍi, tondare illa. Ondē kaṇḍīṣan: dināṅka tappisbēḍi. Matte mūranē dinadinda maguvina kaṇṇu, mai haḷadi āgtideyā anta nōḍtīvi. Svalpa kāmāle tumbā makkaḷige barutte, gābari bēḍa.'
    en: 'Do that, no problem. Just one condition: don''t miss the dates. And from the third day we''ll check whether the baby''s eyes and skin are turning yellow. Lots of babies get a little jaundice — no need to panic.'
  - section: 🧾 Discharge and the bill
    learn: 'billing words: ಫೈನಲ್ ಬಿಲ್, ಅಪ್ರೂವಲ್, ಲಿಮಿಟ್ ಮೀರಿದ್ದು, ರಸೀದಿ, ಜನನ ನೋಂದಣಿ · arithmetic in lakhs and thousands · ಕಳೆದು (minus)'
  - scene: Saturday, 14 November, the fourth day. Discharge was promised for ten in the morning. It is now half past three. Appa and Pradeep stand at the billing desk.
  - who: desk
    t: ಸಾರ್, ಫೈನಲ್ ಬಿಲ್ ರೆಡಿ. ಒಟ್ಟು ಒಂದು ಲಕ್ಷ ನಲವತ್ತೆರಡು ಸಾವಿರದ ಐನೂರು. ಸಿಸೇರಿಯನ್ ಪ್ಯಾಕೇಜ್, ಎಪಿಡ್ಯೂರಲ್, ನಾಲ್ಕು ದಿನದ ರೂಮ್, ಮಕ್ಕಳ ಡಾಕ್ಟ್ರ ಚಾರ್ಜ್, ಲ್ಯಾಬ್, ಮೆಡಿಸಿನ್, ಎಲ್ಲಾ ಸೇರಿದೆ.
    tr: Sār, phainal bil reḍi. Oṭṭu ondu lakṣa nalavatteraḍu sāvirada ainūru. Sisēriyan pyākēj, epiḍyūral, nālku dinada rūm, makkaḷa ḍākṭra chārj, lyāb, meḍisin, ellā sēride.
    en: Sir, the final bill is ready. One lakh forty-two thousand five hundred in total. That includes the C-section package, the epidural, four days' room, the paediatrician's charges, lab and medicines.
  - who: appa
    t: ಹತ್ತು ಗಂಟೆಗೆ ಡಿಸ್ಚಾರ್ಜ್ ಅಂದಿದ್ರಿ. ಈಗ ಮೂರೂವರೆ. ಬಾಣಂತಿ, ಹಸುಗೂಸು ಮೇಲೆ ಬ್ಯಾಗ್ ಕಟ್ಕೊಂಡು ಕಾಯ್ತಾ ಕೂತಿದಾರೆ.
    tr: Hattu gaṇṭege ḍischārj andidri. Īga mūrūvare. Bāṇanti, hasugūsu mēle byāg kaṭkoṇḍu kāytā kūtidāre.
    en: You said discharge at ten. It's half past three. A new mother and a newborn are sitting upstairs with their bags packed, waiting.
  - who: desk
    t: ಗೊತ್ತು ಸಾರ್, ಕ್ಷಮಿಸಿ. ಇನ್ಶೂರೆನ್ಸ್ ಕಡೆಯಿಂದ ಫೈನಲ್ ಅಪ್ರೂವಲ್ ಈಗ ತಾನೇ ಬಂತು. ಅವರಿಗೆ ಡಿಸ್ಚಾರ್ಜ್ ಸಮ್ಮರಿ, ಓಟಿ ನೋಟ್ಸ್ ಎಲ್ಲಾ ಕಳಿಸ್ಬೇಕಿತ್ತು. ರೂಲ್ಸ್ ಪ್ರಕಾರ ಮೂರು ಗಂಟೆ ಒಳಗೆ ಕೊಡ್ಬೇಕು, ಆದ್ರೆ ಶನಿವಾರ ಅಂದ್ರೆ ಎಲ್ಲಾ ನಿಧಾನ.
    tr: Gottu sār, kṣamisi. Inśūrens kaḍeyinda phainal aprūval īga tānē bantu. Avarige ḍischārj sammari, ōṭi nōṭs ellā kaḷisbēkittu. Rūls prakāra mūru gaṇṭe oḷage koḍbēku, ādre śanivāra andre ellā nidhāna.
    en: I know, sir, I'm sorry. The final approval from the insurance side has only just come. We had to send them the discharge summary, the OT notes, everything. By the rules they should answer within three hours, but on a Saturday everything's slow.
  - who: pradeep
    t: ಎಷ್ಟು ಅಪ್ರೂವ್ ಆಯ್ತು?
    tr: Eṣṭu aprūv āytu?
    en: How much was approved?
  - who: desk
    t: ಮೆಟರ್ನಿಟಿ ಲಿಮಿಟ್ ಪೂರ್ತಿ, ಸಿಸೇರಿಯನ್‌ಗೆ ಎಪ್ಪತ್ತೈದು ಸಾವಿರ. ಮಗುವಿನ ಚಾರ್ಜ್ ಕೂಡ ಅದೇ ಲಿಮಿಟ್ ಒಳಗೆ ಬರುತ್ತೆ ಅಂತ ಟಿಪಿಎ ಹೇಳಿದೆ. ಉಳಿದ ಅರವತ್ತೇಳು ಸಾವಿರದ ಐನೂರು ನೀವು ಕಟ್ಬೇಕು. ಇಪ್ಪತ್ತು ಸಾವಿರ ಅಡ್ವಾನ್ಸ್ ಕಳೆದು, ಈಗ ನಲವತ್ತೇಳು ಸಾವಿರದ ಐನೂರು.
    tr: Meṭarniṭi limiṭ pūrti, sisēriyange eppattaidu sāvira. Maguvina chārj kūḍa adē limiṭ oḷage barutte anta ṭipie hēḷide. Uḷida aravattēḷu sāvirada ainūru nīvu kaṭbēku. Ippattu sāvira aḍvāns kaḷedu, īga nalavattēḷu sāvirada ainūru.
    en: The full maternity limit — seventy-five thousand for a C-section. The TPA says the baby's charges also fall within that same limit. The remaining sixty-seven thousand five hundred is yours to pay. Minus the twenty-thousand advance, that's forty-seven thousand five hundred now.
  - who: pradeep
    t: ಅಡ್ಮಿಷನ್ ಟೈಮಲ್ಲೇ ನೀವು ಲಿಮಿಟ್ ಬಗ್ಗೆ ಹೇಳಿದ್ರಿ, ಅದು ಒಳ್ಳೇದಾಯ್ತು. ಕೊನೇ ಕ್ಷಣದಲ್ಲಿ ಶಾಕ್ ಇಲ್ಲ.
    tr: Aḍmiṣan ṭaimallē nīvu limiṭ bagge hēḷidri, adu oḷḷēdāytu. Konē kṣaṇadalli śāk illa.
    en: You told us about the limit right at admission, which was good. No last-minute shock.
  - who: appa
    t: ಇಗೋ ನನ್ನ ಕಾರ್ಡ್, ನಾನು ಕಟ್ತೀನಿ.
    tr: Igō nanna kārḍ, nānu kaṭtīni.
    en: Here's my card. I'll pay.
  - who: pradeep
    t: ಮಾವ! ಸೀಮಂತದ ದಿನ ನಾವು ಏನು ಮಾತಾಡ್ಕೊಂಡಿದ್ವಿ, ನೆನಪಿದೆಯಲ್ಲ? ಲಿಮಿಟ್ ಮೀರಿದ್ದು ನಾವು ಕಟ್ತೀವಿ.
    tr: Māva! Sīmantada dina nāvu ēnu mātāḍkoṇḍidvi, nenapideyalla? Limiṭ mīriddu nāvu kaṭtīvi.
    en: Mava! You remember what we agreed on the day of the seemantha? What goes over the limit, we pay.
  - who: appa
    t: ನೆನಪಿದೆ, ನೆನಪಿದೆ. ಸರಿ, ಬಿಲ್ ನೀನು ಕಟ್ಟು. ಆದ್ರೆ ಮಗುವಿನ ತೊಟ್ಟಿಲು, ನಾಮಕರಣದ ಖರ್ಚು ತಾತನದ್ದು. ಅದರಲ್ಲಿ ವಾದ ಇಲ್ಲ.
    tr: Nenapide, nenapide. Sari, bil nīnu kaṭṭu. Ādre maguvina toṭṭilu, nāmakaraṇada kharchu tātanaddu. Adaralli vāda illa.
    en: I remember, I remember. Fine, you pay the bill. But the baby's cradle and the naming ceremony are on her grandfather. No arguing about that.
  - who: pradeep
    t: ಡೀಲ್, ತಾತ!
    tr: Ḍīl, tāta!
    en: (laughing) Deal, Grandpa!
  - who: desk
    t: 'ಇವು ನಿಮ್ಮ ಪೇಪರ್ಸ್: ಡಿಸ್ಚಾರ್ಜ್ ಸಮ್ಮರಿ, ಫೈನಲ್ ಬಿಲ್, ಪೇಮೆಂಟ್ ರಸೀದಿ. ಎಲ್ಲದಕ್ಕೂ ಜೆರಾಕ್ಸ್ ಇಟ್ಕೊಳ್ಳಿ. ಮಗುವಿನ ಜನನ ನೋಂದಣಿ ಆಸ್ಪತ್ರೆಯಿಂದಲೇ ಆನ್‌ಲೈನ್ ಮಾಡ್ತೀವಿ. ಹೆಸರು ಇನ್ನೂ ಇಟ್ಟಿಲ್ಲ ಅಂದ್ರೆ ಆಮೇಲೆ ಸೇರಿಸ್ಬಹುದು, ಆದ್ರೆ ತುಂಬಾ ತಡ ಮಾಡ್ಬೇಡಿ.'
    tr: 'Ivu nimma pēpars: ḍischārj sammari, phainal bil, pēmeṇṭ rasīdi. Elladakkū jerāks iṭkoḷḷi. Maguvina janana nōndaṇi āspatreyindalē ānlain māḍtīvi. Hesaru innū iṭṭilla andre āmēle sērisbahudu, ādre tumbā taḍa māḍbēḍi.'
    en: 'Here are your papers: discharge summary, final bill, payment receipt. Keep photocopies of everything. We register the baby''s birth online from the hospital itself. If you haven''t named her yet, you can add the name later — but don''t leave it too long.'
  - scene: 4:30 p.m. Sam brings the car round to the entrance. Shwetha walks slowly, one hand pressed over her stitches. Amma carries the baby. A nurse walks them to the door.
  - who: nurse
    t: ಏಳನೇ ದಿನ ಹೊಲಿಗೆ ತೋರಿಸೋಕೆ ಬನ್ನಿ. ಜ್ವರ ಬಂದ್ರೆ, ಗಾಯದಿಂದ ಕೀವು ಬಂದ್ರೆ, ತುಂಬಾ ರಕ್ತಸ್ರಾವ ಆದ್ರೆ ಕಾಯದೆ ತಕ್ಷಣ ಬನ್ನಿ. ಆರು ವಾರ ಭಾರ ಎತ್ತಬಾರದು. ಮಗುವಿಗಿಂತ ಭಾರ ಏನೂ ಎತ್ತಬೇಡಿ.
    tr: Ēḷanē dina holige tōrisōke banni. Jvara bandre, gāyadinda kīvu bandre, tumbā raktasrāva ādre kāyade takṣaṇa banni. Āru vāra bhāra ettabāradu. Maguviginta bhāra ēnū ettabēḍi.
    en: Come on the seventh day to have the stitches checked. If you get a fever, pus from the wound, or heavy bleeding, don't wait — come at once. No lifting heavy things for six weeks. Nothing heavier than the baby.
  - who: shwe
    t: ಸ್ಯಾಮ್, ನಿಧಾನವಾಗಿ ಓಡಿಸು. ಈ ಸಲ ಹಂಪ್ ಬಂದ್ರೆ ನಿಜವಾಗ್ಲೂ ನಿಲ್ಲಿಸು!
    tr: Sām, nidhānavāgi ōḍisu. Ī sala hamp bandre nijavāglū nillisu!
    en: Sam, drive slowly. This time, if there's a speed bump, really do stop!
  - who: sam
    t: ಗಂಟೆಗೆ ಇಪ್ಪತ್ತು ಕಿಲೋಮೀಟರ್ ಅಷ್ಟೇ, ಪ್ರಾಮಿಸ್. ಇವತ್ತು ನನ್ನ ಕಾರಲ್ಲಿ ಇಡೀ ಮನೆಯ ಅತಿ ಮುಖ್ಯ ವ್ಯಕ್ತಿ ಕೂತಿದಾಳೆ.
    tr: Gaṇṭege ippattu kilōmīṭar aṣṭē, prāmis. Ivattu nanna kāralli iḍī maneya ati mukhya vyakti kūtidāḷe.
    en: Twenty kilometres an hour, no more, promise. Today the most important person in the whole family is sitting in my car.
  - who: amma
    t: ಅಮ್ಮ, ಹೊರಟ್ವಿ. ಇನ್ನು ಇಪ್ಪತ್ತು ನಿಮಿಷ.
    tr: Amma, horaṭvi. Innu ippattu nimiṣa.
    en: (on the phone) Amma, we've left. Twenty more minutes.
  - who: ajji
    t: ಬಾಗಿಲಲ್ಲಿ ಆರತಿ ತಟ್ಟೆ ರೆಡಿ ಇದೆ. ದೃಷ್ಟಿ ತೆಗೆದೇ ಒಳಗೆ ಕರ್ಕೊಳ್ಳೋದು. ಬೇಗ ಬನ್ನಿ… ಅಲ್ಲ, ನಿಧಾನವಾಗಿ ಬನ್ನಿ. ಇಷ್ಟು ವರ್ಷ ಕಾದಿದೀನಿ, ಇನ್ನು ಇಪ್ಪತ್ತು ನಿಮಿಷ ಕಾಯ್ತೀನಿ.
    tr: Bāgilalli ārati taṭṭe reḍi ide. Dṛṣṭi tegedē oḷage karkoḷḷōdu. Bēga banni… alla, nidhānavāgi banni. Iṣṭu varṣa kādidīni, innu ippattu nimiṣa kāytīni.
    en: (on the phone) The arathi plate is ready at the door. We'll ward off the evil eye before she comes in. Come quickly… no — come slowly. I've waited all these years; I can wait twenty more minutes.
  - chapter: Chapter 8 — The first weeks
  - section: 🌙 Three in the morning
    learn: 'dative experiencer: nange nōvāgtide, avaḷige hasivu · hālu kuḍisu (to feed milk) · causative tēgu barisu (to burp a baby) · cīpu (to suckle) · odde (wet) · counting ḍaipars'
  - scene: 'Day five after the birth: Sunday, 15 November, three in the morning, the first night home at the Rao house in Jayanagar. The baby has been crying for an hour. Shwetha sits propped up on pillows, one hand pressed to her stomach where the stitches are. Pradeep, who stayed the night, is asleep in a chair.'
  - who: shwe
    t: ಪ್ರದೀಪ್, ಏಳು. ಇವಳು ಒಂದು ಗಂಟೆಯಿಂದ ಅಳ್ತಾನೇ ಇದ್ದಾಳೆ. ನಂಗೆ ಏನು ಮಾಡ್ಬೇಕು ಅಂತಾನೇ ಗೊತ್ತಾಗ್ತಿಲ್ಲ.
    tr: Pradīp, ēḷu. Ivaḷu ondu gaṇṭeyinda aḷtānē iddāḷe. Nange ēnu māḍbēku antānē gottāgtilla.
    en: Pradeep, get up. She's been crying for an hour. I just don't know what to do.
  - who: pradeep
    t: ಹಾ… ಹಾ, ಎದ್ದೆ. ಹಸಿವಾಗಿರಬಹುದಾ? ಈಗ ತಾನೇ ಹಾಲು ಕುಡಿಸಿದ್ಯಲ್ಲಾ?
    tr: Hā… hā, edde. Hasivāgirabahudā? Īga tānē hālu kuḍisidyallā?
    en: Huh... yes, I'm up. Could she be hungry? Didn't you just feed her?
  - who: shwe
    t: ಕುಡಿಸೋಕೆ ಟ್ರೈ ಮಾಡಿದೆ. ಸರಿಯಾಗಿ ಹಿಡ್ಕೊಳ್ತಿಲ್ಲ. ಎರಡು ನಿಮಿಷ ಚೀಪ್ತಾಳೆ, ಆಮೇಲೆ ಬಿಟ್ಟು ಮತ್ತೆ ಅಳ್ತಾಳೆ. ನಂಗೆ ತುಂಬಾ ನೋವಾಗ್ತಿದೆ.
    tr: Kuḍisōke ṭrai māḍide. Sariyāgi hiḍkoḷtilla. Eraḍu nimiṣa cīptāḷe, āmēle biṭṭu matte aḷtāḷe. Nange tumbā nōvāgtide.
    en: I tried to feed her. She isn't latching properly. She sucks for two minutes, then lets go and cries again. It hurts me so much.
  - who: pradeep
    t: ಹೊಲಿಗೆ ನೋವಾ, ಇಲ್ಲಾ…?
    tr: Holige nōvā, illā…?
    en: Is it the stitches hurting, or...?
  - who: shwe
    t: ಎರಡೂ. ಕೂತ್ಕೊಂಡ್ರೆ ಹೊಟ್ಟೆ ಎಳೆಯುತ್ತೆ, ಅವಳು ಕುಡಿಯೋವಾಗ ಎದೆ ಉರಿಯುತ್ತೆ. ಹಾಲು ಸಾಕಾಗ್ತಿಲ್ವೇನೋ ಅನ್ಸುತ್ತೆ. ನಾನು ಸರಿಯಾದ ಅಮ್ಮ ಅಲ್ಲ ಅನ್ಸುತ್ತೆ.
    tr: Eraḍū. Kūtkoṇḍre hoṭṭe eḷeyutte, avaḷu kuḍiyōvāga ede uriyutte. Hālu sākāgtilvēnō ansutte. Nānu sariyāda amma alla ansutte.
    en: Both. When I sit, my stomach pulls; when she feeds, my breast burns. I feel the milk isn't enough. I feel like I'm not a proper mother.
  - who: pradeep
    t: ಹಾಗೆಲ್ಲಾ ಹೇಳ್ಬೇಡ. ಐದು ದಿನ ಆಗಿದೆ ಅಷ್ಟೇ. ಅವಳಿಗೂ ಹೊಸದು, ನಿಂಗೂ ಹೊಸದು, ನಂಗಂತೂ ಎಲ್ಲಾ ಹೊಸದು. ಇರು, ಅತ್ತೆನ ಎಬ್ಬಿಸ್ತೀನಿ.
    tr: Hāgellā hēḷbēḍa. Aidu dina āgide aṣṭē. Avaḷigū hosadu, ningū hosadu, nangantū ellā hosadu. Iru, attena ebbistīni.
    en: Don't say things like that. It's only been five days. It's new for her, new for you, and for me everything is new. Wait, I'll wake your mother.
  - scene: Before he reaches the door, Amma comes in, hair loose, a shawl around her shoulders.
  - who: amma
    t: ನಾನು ಎದ್ದೇ ಇದ್ದೆ, ಅಳು ಕೇಳ್ತಿತ್ತು. ಕೊಡು ಇಲ್ಲಿ. ಮೊದಲು ತೇಗು ಬರಿಸೋಣ. ಹೊಟ್ಟೆಯಲ್ಲಿ ಗಾಳಿ ಇದ್ರೂ ಮಕ್ಕಳು ಹೀಗೇ ಅಳ್ತಾರೆ.
    tr: Nānu eddē idde, aḷu kēḷtittu. Koḍu illi. Modalu tēgu barisōṇa. Hoṭṭeyalli gāḷi idrū makkaḷu hīgē aḷtāre.
    en: I was already up, I could hear the crying. Give her here. Let's burp her first. Babies cry like this even when there's just air in the tummy.
  - scene: Amma lays the baby against her shoulder and pats her back. A small burp. The crying softens into hiccups.
  - who: amma
    t: ನೋಡಿದ್ಯಾ? ಈಗ ಕೇಳು, ಶ್ವೇತಾ. ಮಗುನ ಹೊಟ್ಟೆಗೆ ಹೊಟ್ಟೆ ತಾಗೋ ಹಾಗೆ ಹತ್ತಿರ ಹಿಡ್ಕೋ. ಬಾಯಿ ದೊಡ್ಡದಾಗಿ ತೆಗೆದಾಗ ತಕ್ಷಣ ಎಳ್ಕೋ. ಬರೀ ತುದಿ ಹಿಡ್ಕೊಂಡ್ರೆ ನಿಂಗೆ ನೋವು, ಅವಳಿಗೆ ಹಾಲು ಬರಲ್ಲ.
    tr: Nōḍidyā? Īga kēḷu, Shwētā. Maguna hoṭṭege hoṭṭe tāgō hāge hattira hiḍkō. Bāyi doḍḍadāgi tegedāga takṣaṇa eḷkō. Barī tudi hiḍkoṇḍre ninge nōvu, avaḷige hālu baralla.
    en: See? Now listen, Shwetha. Hold the baby close, tummy to tummy. When she opens her mouth wide, bring her in quickly. If she only takes the tip, it hurts you and she gets no milk.
  - who: shwe
    t: ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ನರ್ಸ್ ಕೂಡ ಇದನ್ನೇ ಹೇಳಿದ್ರು. ಅಲ್ಲಿ ಸುಲಭ ಅನ್ನಿಸ್ತು. ಇಲ್ಲಿ ರಾತ್ರಿ ಮೂರು ಗಂಟೆಗೆ ಎಲ್ಲಾ ಮರೆತು ಹೋಗುತ್ತೆ.
    tr: Āspatreyalli nars kūḍa idannē hēḷidru. Alli sulabha annistu. Illi rātri mūru gaṇṭege ellā maretu hōgutte.
    en: The nurse at the hospital said exactly this. There it seemed easy. Here, at three in the morning, I forget everything.
  - who: amma
    t: ಎಲ್ರಿಗೂ ಹಾಗೇ ಆಗುತ್ತೆ ಕಣೇ. ನೀನು ಹುಟ್ಟಿದಾಗ ಮೊದಲ ವಾರ ಪೂರ್ತಿ ನಾನು ಅಳ್ತಾನೇ ಇದ್ದೆ. ಹಾಲು ಸರಿಯಾಗಿ ಬರೋಕೆ ಮೂರು-ನಾಲ್ಕು ದಿನ ಬೇಕು. ಮಗು ಚೀಪಿದಷ್ಟೂ ಜಾಸ್ತಿ ಬರುತ್ತೆ.
    tr: Elrigū hāgē āgutte kaṇē. Nīnu huṭṭidāga modala vāra pūrti nānu aḷtānē idde. Hālu sariyāgi barōke mūru-nālku dina bēku. Magu cīpidaṣṭū jāsti barutte.
    en: It happens to everyone, dear. When you were born, I cried the whole first week. The milk needs three or four days to come in properly. The more the baby suckles, the more comes.
  - who: pradeep
    t: ಸ್ವಲ್ಪ ಡಬ್ಬಿ ಹಾಲು ಕೊಡೋಣ್ವಾ? ಇವಳ ಹೊಟ್ಟೆ ತುಂಬ್ಲಿ, ಶ್ವೇತಾ ಸ್ವಲ್ಪ ಮಲಗ್ಲಿ.
    tr: Svalpa ḍabbi hālu koḍōṇvā? Ivaḷa hoṭṭe tumbli, Shwētā svalpa malagli.
    en: Shall we give her a little formula? Let her tummy fill up, and let Shwetha sleep a bit.
  - who: amma
    t: ಡಾಕ್ಟ್ರನ್ನ ಕೇಳದೆ ಬೇಡ. ಮಗು ದಿನಕ್ಕೆ ಆರು-ಏಳು ಸಲ ಒದ್ದೆ ಮಾಡ್ತಿದ್ರೆ ಹಾಲು ಸಾಕಾಗ್ತಿದೆ ಅಂತ ಅರ್ಥ ಅಂತ ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ರು. ಇವತ್ತು ಎಷ್ಟು ಡೈಪರ್ ಆಯ್ತು?
    tr: Ḍākṭranna kēḷade bēḍa. Magu dinakke āru-ēḷu sala odde māḍtidre hālu sākāgtide anta artha anta ḍākṭru hēḷidru. Ivattu eṣṭu ḍaipar āytu?
    en: Not without asking the doctor. The doctor said if the baby wets six or seven times a day, it means the milk is enough. How many diapers today?
  - who: pradeep
    t: ಒಂದು ನಿಮಿಷ, ಫೋನ್‌ನಲ್ಲಿ ಬರೆದಿಟ್ಟಿದ್ದೀನಿ. ಬೆಳಿಗ್ಗೆಯಿಂದ ಏಳು ಸಲ ಒದ್ದೆ, ಎರಡು ಸಲ ಕಕ್ಕ. ಟೈಮ್ ಸಮೇತ.
    tr: Ondu nimiṣa, phōn-nalli barediṭṭiddīni. Beḷiggeyinda ēḷu sala odde, eraḍu sala kakka. Ṭaim samēta.
    en: (with a tired smile) One minute, I've noted it on my phone. Since morning, seven wet, two dirty. With the times.
  - who: amma
    t: ಇಂಜಿನಿಯರ್ ಅಳಿಯ ಅಂದ್ರೆ ಹೀಗೇ! ಸರಿ, ಹಾಲು ಸಾಕಾಗ್ತಿದೆ. ಈಗ ಇನ್ನೊಂದು ಸಲ ಪ್ರಯತ್ನ ಮಾಡು. ನಾನು ಇಲ್ಲೇ ಕೂತಿರ್ತೀನಿ.
    tr: Iñjiniyar aḷiya andre hīgē! Sari, hālu sākāgtide. Īga innondu sala prayatna māḍu. Nānu illē kūtirtīni.
    en: That's an engineer son-in-law for you! Fine, the milk is enough. Now try once more. I'll sit right here.
  - scene: This time the baby latches. For a while the only sound is small, steady swallowing. Shwetha leans her head back, tears on her face, half laughing.
  - who: shwe
    t: ಕುಡೀತಿದ್ದಾಳೆ… ಅಮ್ಮಾ, ಕುಡೀತಿದ್ದಾಳೆ.
    tr: Kuḍītiddāḷe… Ammā, kuḍītiddāḷe.
    en: She's drinking... Amma, she's drinking.
  - section: 🛁 Ajji's rules
    learn: 'bāṇantana words: bāṇanti, bisinīru snāna, sabbasige, eṇṇe haccu, uṣṇa / tampu · prohibitions -bāradu / -bēḍa · reported speech -ante (apparently) · bāyārike (thirst)'
  - scene: 'Day six, mid-morning. Ajji sits in her chair in the hall with her pill box. Amma brings Shwetha a plate: dill rasam, garlic, rice with ghee. Kiran is on the sofa with his laptop. The ceiling fan is on.'
  - who: ajji
    t: ಶ್ವೇತಾ, ತಲೆಗೆ ಬಟ್ಟೆ ಯಾಕೆ ಕಟ್ಟಿಲ್ಲ? ಕಿವಿಗೆ ಹತ್ತಿ ಇಟ್ಕೋ. ಬಾಣಂತಿಗೆ ಗಾಳಿ ಸೋಕಬಾರದು. ಕಿರಣ್, ಫ್ಯಾನ್ ಆಫ್ ಮಾಡು.
    tr: Shwētā, talege baṭṭe yāke kaṭṭilla? Kivige hatti iṭkō. Bāṇantige gāḷi sōkabāradu. Kiraṇ, fyān āph māḍu.
    en: Shwetha, why haven't you tied a cloth round your head? Put cotton in your ears. A new mother mustn't be touched by the wind. Kiran, switch off the fan.
  - who: kiran
    t: ಅಜ್ಜಿ, ಹೊರಗೆ ಇಪ್ಪತ್ತೆಂಟು ಡಿಗ್ರಿ ಇದೆ. ಅಕ್ಕ ಬೆವರ್ತಿದ್ದಾಳೆ.
    tr: Ajji, horage ippatteṇṭu ḍigri ide. Akka bevartiddāḷe.
    en: Ajji, it's twenty-eight degrees outside. Akka is sweating.
  - who: ajji
    t: ಬೆವರಲಿ. ಬೆವರಿದ್ರೆ ಒಳ್ಳೇದು. ನಾವೆಲ್ಲಾ ಮೂರು ತಿಂಗಳು ಕೋಣೆಯಿಂದ ಹೊರಗೆ ಬರ್ತಿರಲಿಲ್ಲ. ದಿನಾ ಮೈಗೆ ಎಣ್ಣೆ, ಸುಡೋ ಬಿಸಿನೀರು ಸ್ನಾನ. ಅದಕ್ಕೇ ಈ ವಯಸ್ಸಲ್ಲೂ ನನ್ನ ಸೊಂಟ ಗಟ್ಟಿ ಇದೆ.
    tr: Bevarali. Bevaridre oḷḷēdu. Nāvellā mūru tingaḷu kōṇeyinda horage bartiralilla. Dinā maige eṇṇe, suḍō bisinīru snāna. Adakkē ī vayassallū nanna soṇṭa gaṭṭi ide.
    en: Let her sweat. Sweating is good. We didn't come out of the room for three months. Oil on the body every day and a scalding hot bath. That's why my back is still strong at this age.
  - who: amma
    t: ಅತ್ತೆ, ಸ್ನಾನದ ವಿಷಯದಲ್ಲಿ ನಾನೂ ನಿಮ್ ಕಡೆನೇ. ಆದ್ರೆ ಇವಳಿಗೆ ಆಪರೇಷನ್ ಆಗಿದೆ. ಹೊಟ್ಟೆ ಮೇಲೆ ಹೊಲಿಗೆ ಇದೆ. ಸುಡೋ ನೀರು, ಎಣ್ಣೆ ಮಸಾಜ್ ಎಲ್ಲಾ ಅಲ್ಲಿಗೆ ಬೇಡ ಅಂತ ನರ್ಸ್ ಹೇಳಿದ್ರು.
    tr: Atte, snānada viṣayadalli nānū nim kaḍenē. Ādre ivaḷige āparēṣan āgide. Hoṭṭe mēle holige ide. Suḍō nīru, eṇṇe masāj ellā allige bēḍa anta nars hēḷidru.
    en: Atte, on the bath I'm on your side too. But she's had an operation. There are stitches on her stomach. The nurse said no scalding water or oil massage there.
  - who: ajji
    t: ಹೊಲಿಗೆ ಮೇಲೆ ಯಾರು ಎಣ್ಣೆ ಹಾಕ್ತಾರೆ? ಬೆನ್ನಿಗೆ, ಕಾಲಿಗೆ ಹಚ್ಚೋಣ. ಮತ್ತೆ ನೀರು ಜಾಸ್ತಿ ಕುಡೀಬೇಡ, ಹೊಟ್ಟೆ ಬರುತ್ತೆ. ಬಿಸಿ ಬಿಸಿ ಸಬ್ಬಸಿಗೆ ಸಾರು, ಬೆಳ್ಳುಳ್ಳಿ, ತುಪ್ಪದ ಅನ್ನ. ಮೊಸರು, ಹಣ್ಣು ತಂಪು, ಬೇಡ.
    tr: Holige mēle yāru eṇṇe hāktāre? Bennige, kālige haccōṇa. Matte nīru jāsti kuḍībēḍa, hoṭṭe barutte. Bisi bisi sabbasige sāru, beḷḷuḷḷi, tuppada anna. Mosaru, haṇṇu tampu, bēḍa.
    en: Who puts oil on stitches? We'll rub it on her back and legs. And don't drink much water, you'll get a belly. Piping hot dill rasam, garlic, rice with ghee. Curd and fruit are cooling — no.
  - who: shwe
    t: ಅಜ್ಜಿ, ನಂಗೆ ತುಂಬಾ ಬಾಯಾರಿಕೆ ಆಗ್ತಿದೆ. ಹಾಲು ಕೊಡೋವಾಗ ಬಾಯಿ ಒಣಗಿ ಹೋಗುತ್ತೆ. ಒಂದು ಲೋಟ ನೀರಿಗೂ ಪರ್ಮಿಷನ್ ಬೇಕಾ?
    tr: Ajji, nange tumbā bāyārike āgtide. Hālu koḍōvāga bāyi oṇagi hōgutte. Ondu lōṭa nīrigū parmiṣan bēkā?
    en: Ajji, I'm so thirsty. My mouth goes dry when I'm feeding. Do I need permission even for a glass of water?
  - scene: Vimala Aunty appears at the open door with a steel box.
  - who: vimala
    t: ಬಾಗಿಲು ತೆಗೆದೇ ಇತ್ತು, ನಾನೇ ಒಳಗೆ ಬಂದೆ! ಬಾಣಂತಿಗೆ ಅಂಟಿನ ಉಂಡೆ ತಂದಿದ್ದೀನಿ. ನಮ್ ಸೊಸೆಗೂ ಇದನ್ನೇ ಮಾಡಿದ್ದೆ, ಎರಡು ತಿಂಗಳಲ್ಲಿ ಮೈ ತುಂಬ್ಕೊಂಡ್ಳು.
    tr: Bāgilu tegedē ittu, nānē oḷage bande! Bāṇantige aṇṭina uṇḍe tandiddīni. Nam sosegū idannē māḍidde, eraḍu tingaḷalli mai tumbkoṇḍḷu.
    en: The door was open, so I came straight in! I've brought gum laddus for the new mother. I made the same for my daughter-in-law — in two months she'd filled out nicely.
  - who: vimala
    t: ಆದ್ರೆ ಒಂದು ವಿಷಯ ಕೇಳಿ. ನೀರು ಕೊಡಬೇಡಿ ಅಂತ ನಮ್ಮತ್ತೆನೂ ಹೇಳ್ತಿದ್ರು. ಆಮೇಲೆ ನಮ್ ಸೊಸೆಯ ಡಾಕ್ಟ್ರು ಚೆನ್ನಾಗಿ ಬೈದ್ರಂತೆ, ನೀರು ಕಮ್ಮಿ ಆದ್ರೆ ಹಾಲು ಕಮ್ಮಿ ಆಗುತ್ತೆ ಅಂತ. ಈಗಿನ ಕಾಲ ಬೇರೆ, ಸರಸ್ವತಮ್ಮ.
    tr: Ādre ondu viṣaya kēḷi. Nīru koḍabēḍi anta nammattenū hēḷtidru. Āmēle nam soseya ḍākṭru cennāgi baidrante, nīru kammi ādre hālu kammi āgutte anta. Īgina kāla bēre, Sarasvatamma.
    en: But listen to this. My mother-in-law also used to say don't give water. Then apparently my daughter-in-law's doctor gave them a proper scolding — said less water means less milk. Times are different now, Saraswathamma.
  - who: ajji
    t: ಹೂಂ. ನಾಳೆ ಉಷಾ ಡಾಕ್ಟ್ರ ಹತ್ರ ಹೋಗ್ತೀರಲ್ಲ? ನಾನೂ ಬರ್ತೀನಿ. ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳ್ತೀನಿ.
    tr: Hūṃ. Nāḷe Uṣā ḍākṭra hatra hōgtīralla? Nānū bartīni. Avara bāyindalē kēḷtīni.
    en: Hm. You're going to Dr. Usha tomorrow, aren't you? I'm coming too. I'll hear it from her own mouth.
  - section: '🩺 Dr. Usha: stitches, water and tears'
    learn: 'wound care: holige, gāya, kīvu, jvara, hepputaṭṭu (clot) · -bahudu vs -bāradu · polite disagreement: nimma anubhava mukhya, ādre… · talking about feelings: kāraṇa illade aḷu baratte'
  - scene: Day seven. Dr. Usha Rao's clinic, the post-operative check. Pradeep waits outside with the baby. Shwetha comes in with Amma and, slowly, Ajji.
  - who: gyn
    t: ಬನ್ನಿ ಶ್ವೇತಾ. ಅಜ್ಜಿನೂ ಬಂದಿದ್ದಾರಾ! ಹಾರ್ಟ್ ಹೇಗಿದೆ ಅಜ್ಜಿ? ಮರಿಮೊಮ್ಮಗಳ ಮುಖ ನೋಡಿ ಬಿಪಿ ಸರಿಹೋಗಿರಬೇಕು.
    tr: Banni Shwētā. Ajjinū bandiddārā! Hārṭ hēgide ajji? Marimommagaḷa mukha nōḍi bi-pi sarihōgirabēku.
    en: Come in, Shwetha. Ajji has come too! How's the heart, Ajji? Seeing your great-granddaughter's face must have fixed your BP.
  - who: ajji
    t: ನೋಡಿದ್ದೀನಿ ಡಾಕ್ಟ್ರೇ, ದೂರದಿಂದ. ಎತ್ಕೊಳ್ಳೋಕೆ ಇನ್ನೂ ಧೈರ್ಯ ಬಂದಿಲ್ಲ.
    tr: Nōḍiddīni ḍākṭrē, dūradinda. Etkoḷḷōke innū dhairya bandilla.
    en: I've seen her, doctor — from a distance. I still haven't found the courage to hold her.
  - who: gyn
    t: ಹೊಲಿಗೆ ನೋಡೋಣ, ಮಲಗಿ… ಚೆನ್ನಾಗಿ ಒಣಗ್ತಿದೆ. ಕೆಂಪಾಗಿಲ್ಲ, ಕೀವು ಇಲ್ಲ. ಇವು ಕರಗೋ ಹೊಲಿಗೆ, ತೆಗೆಯೋ ಅವಶ್ಯಕತೆ ಇಲ್ಲ.
    tr: Holige nōḍōṇa, malagi… Cennāgi oṇagtide. Kempāgilla, kīvu illa. Ivu karagō holige, tegeyō avaśyakate illa.
    en: Let's look at the stitches — lie down... It's drying nicely. No redness, no pus. These are dissolving stitches; there's no need to remove them.
  - who: shwe
    t: ಡಾಕ್ಟ್ರೇ, ಕೆಮ್ಮಿದ್ರೂ, ನಕ್ಕರೂ ನೋವಾಗುತ್ತೆ. ಒಳಗೆ ಏನಾದ್ರೂ ಬಿಚ್ಚಿ ಹೋಗುತ್ತಾ ಅಂತ ಭಯ.
    tr: Ḍākṭrē, kemmidrū, nakkarū nōvāgutte. Oḷage ēnādrū bicci hōguttā anta bhaya.
    en: Doctor, it hurts even when I cough or laugh. I'm scared something inside will come open.
  - who: gyn
    t: ಆ ಭಯ ಎಲ್ರಿಗೂ ಇರುತ್ತೆ. ಕೆಮ್ಮುವಾಗ ಒಂದು ದಿಂಬು ಹೊಟ್ಟೆಗೆ ಒತ್ತಿ ಹಿಡ್ಕೊಳ್ಳಿ. ಆರು ವಾರ ಭಾರ ಎತ್ತಬಾರದು, ಮಗುವಿಗಿಂತ ಭಾರ ಏನೂ ಬೇಡ. ಆದ್ರೆ ಮಲಗೇ ಇರಬಾರದು. ದಿನಾ ಮನೇಲೇ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ನಡೀಬೇಕು, ಇಲ್ಲಾಂದ್ರೆ ಕಾಲಲ್ಲಿ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟೋ ಅಪಾಯ ಇರುತ್ತೆ.
    tr: Ā bhaya elrigū irutte. Kemmuvāga ondu dimbu hoṭṭege otti hiḍkoḷḷi. Āru vāra bhāra ettabāradu, maguviginta bhāra ēnū bēḍa. Ādre malagē irabāradu. Dinā manēlē svalpa svalpa naḍībēku, illāndre kālalli rakta heppugaṭṭō apāya irutte.
    en: Everyone has that fear. When you cough, press a pillow to your stomach. For six weeks, no lifting — nothing heavier than the baby. But you mustn't just lie down either. Walk a little every day at home, otherwise there's a risk of blood clots in the legs.
  - who: gyn
    t: ಜ್ವರ ಬಂದ್ರೆ, ಹೊಲಿಗೆಯಿಂದ ಕೀವು ಅಥವಾ ವಾಸನೆ ಬಂದ್ರೆ, ಬ್ಲೀಡಿಂಗ್ ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಜಾಸ್ತಿ ಆದ್ರೆ, ಅಥವಾ ಒಂದು ಕಾಲು ಊದ್ಕೊಂಡು ನೋವಾದ್ರೆ, ಕಾಯಬೇಡಿ. ತಕ್ಷಣ ಫೋನ್ ಮಾಡಿ.
    tr: Jvara bandre, holigeyinda kīvu athavā vāsane bandre, blīḍiṅg iddakkiddante jāsti ādre, athavā ondu kālu ūdkoṇḍu nōvādre, kāyabēḍi. Takṣaṇa phōn māḍi.
    en: If you get a fever, if there's pus or a smell from the stitches, if the bleeding suddenly gets heavier, or if one leg swells and hurts — don't wait. Call immediately.
  - who: amma
    t: ಡಾಕ್ಟ್ರೇ, ಸ್ನಾನದ ಬಗ್ಗೆ ಕೇಳ್ಬೇಕಿತ್ತು. ನಮ್ ಮನೇಲಿ ಬಾಣಂತಿಗೆ ಬಿಸಿನೀರು ಸ್ನಾನ, ಎಣ್ಣೆ ಹಚ್ಚೋದು ಎಲ್ಲಾ ಪದ್ಧತಿ. ಮಾಡ್ಬಹುದಾ?
    tr: Ḍākṭrē, snānada bagge kēḷbēkittu. Nam manēli bāṇantige bisinīru snāna, eṇṇe haccōdu ellā paddhati. Māḍbahudā?
    en: Doctor, I wanted to ask about bathing. In our house a hot bath and oil for the new mother are the custom. Can we do it?
  - who: gyn
    t: ಮಾಡ್ಬಹುದು. ಹದವಾದ ಬಿಸಿನೀರು, ಸುಡೋದು ಬೇಡ. ಹೊಲಿಗೆ ಮೇಲೆ ಸೋಪ್ ನೀರು ಹರಿದು ಹೋದ್ರೆ ತೊಂದರೆ ಇಲ್ಲ, ಆದ್ರೆ ಉಜ್ಜಬಾರದು. ಆಮೇಲೆ ಮೆತ್ತಗೆ ಒತ್ತಿ ಒಣಗಿಸಿ. ಬೆನ್ನಿಗೆ, ಕಾಲಿಗೆ ಎಣ್ಣೆ ಮಸಾಜ್ ಒಳ್ಳೇದೇ. ಹೊಟ್ಟೆ ಮೇಲೆ ಮಾತ್ರ ಬೇಡ.
    tr: Māḍbahudu. Hadavāda bisinīru, suḍōdu bēḍa. Holige mēle sōp nīru haridu hōdre tondare illa, ādre ujjabāradu. Āmēle mettage otti oṇagisi. Bennige, kālige eṇṇe masāj oḷḷēdē. Hoṭṭe mēle mātra bēḍa.
    en: You can. Comfortably warm water, not scalding. Soapy water running over the stitches is fine, but don't scrub. Then pat it dry gently. An oil massage on the back and legs is good. Just not on the stomach.
  - who: ajji
    t: ನೀರಿನ ವಿಷಯ ಏನು? ನಮ್ ಕಾಲದಲ್ಲಿ ಬಾಣಂತಿಗೆ ಲೋಟದಲ್ಲಿ ಅಳೆದು ಕೊಡ್ತಿದ್ವಿ. ಜಾಸ್ತಿ ಕುಡಿದ್ರೆ ಹೊಟ್ಟೆ ಬರುತ್ತೆ, ಗಾಯ ಒಣಗಲ್ಲ ಅಂತಿದ್ರು.
    tr: Nīrina viṣaya ēnu? Nam kāladalli bāṇantige lōṭadalli aḷedu koḍtidvi. Jāsti kuḍidre hoṭṭe barutte, gāya oṇagalla antidru.
    en: And the water? In our day we measured it out to the new mother by the glass. They said if she drank a lot she'd get a belly and the wound wouldn't dry.
  - who: gyn
    t: ಅಜ್ಜಿ, ನಿಮ್ಮ ಕಾಲದ ಬಾಣಂತಿಯರು ಎಷ್ಟು ಕಷ್ಟಪಟ್ರು ಅಂತ ನಂಗೆ ಗೊತ್ತು. ಆದ್ರೆ ಈ ಒಂದು ವಿಷಯದಲ್ಲಿ ನಾನು ಒಪ್ಪಲ್ಲ. ಹಾಲು ಚೆನ್ನಾಗಿ ಬರ್ಬೇಕು ಅಂದ್ರೆ ಬಾಣಂತಿ ನೀರು ಚೆನ್ನಾಗಿ ಕುಡೀಬೇಕು, ದಿನಕ್ಕೆ ಎರಡೂವರೆ-ಮೂರು ಲೀಟರ್. ನೀರು ಕಮ್ಮಿ ಆದ್ರೆ ಮಲಬದ್ಧತೆ, ಯೂರಿನ್ ಇನ್ಫೆಕ್ಷನ್, ಹೊಲಿಗೆ ಮೇಲೆ ಒತ್ತಡ, ಎಲ್ಲಾ ಬರುತ್ತೆ.
    tr: Ajji, nimma kālada bāṇantiyaru eṣṭu kaṣṭapaṭru anta nange gottu. Ādre ī ondu viṣayadalli nānu oppalla. Hālu cennāgi barbēku andre bāṇanti nīru cennāgi kuḍībēku, dinakke eraḍūvare-mūru līṭar. Nīru kammi ādre malabaddhate, yūrin inphekṣan, holige mēle ottaḍa, ellā barutte.
    en: Ajji, I know how much new mothers suffered in your day. But on this one point I don't agree. If the milk is to come well, the new mother must drink plenty of water — two and a half to three litres a day. Too little water brings constipation, urine infections, strain on the stitches, all of it.
  - who: ajji
    t: ಹಾಗಾದ್ರೆ ತಣ್ಣೀರು ಬೇಡ. ಕಾಯಿಸಿ ಆರಿಸಿದ ಬೆಚ್ಚಗಿನ ನೀರು. ಅದನ್ನಾದ್ರೂ ಒಪ್ತೀರಾ?
    tr: Hāgādre taṇṇīru bēḍa. Kāyisi ārisida beccagina nīru. Adannādrū optīrā?
    en: Then not cold water. Boiled and cooled, lukewarm. Will you at least agree to that?
  - who: gyn
    t: ಸಂತೋಷವಾಗಿ ಒಪ್ತೀನಿ! ಸಬ್ಬಸಿಗೆ, ಮೆಂತ್ಯ, ಬೆಳ್ಳುಳ್ಳಿ, ತುಪ್ಪ ಎಲ್ಲಾ ಕೊಡಿ, ಒಳ್ಳೇದು. ಜೊತೆಗೆ ಹಣ್ಣು, ಮೊಸರು, ಬೇಳೆ, ಮೊಳಕೆ ಕಾಳು ತಿಂದ್ರೆ ಇನ್ನೂ ಒಳ್ಳೇದು. ಐರನ್, ಕ್ಯಾಲ್ಸಿಯಂ ಮಾತ್ರೆ ಮೂರು ತಿಂಗಳು ಮುಂದುವರಿಸಿ.
    tr: Santōṣavāgi optīni! Sabbasige, mentya, beḷḷuḷḷi, tuppa ellā koḍi, oḷḷēdu. Jotege haṇṇu, mosaru, bēḷe, moḷake kāḷu tindre innū oḷḷēdu. Airan, kyālsiyam mātre mūru tingaḷu munduvarisi.
    en: (smiling) Gladly! Give her dill, fenugreek, garlic, ghee — all good. If she also eats fruit, curd, dal and sprouts, even better. Continue the iron and calcium tablets for three months.
  - who: amma
    t: ಡಾಕ್ಟ್ರೇ, ಹಾಲು ಕುಡಿಸೋದು ತುಂಬಾ ಕಷ್ಟ ಆಗ್ತಿದೆ. ರಾತ್ರಿ ಇವಳು ತುಂಬಾ ಅಳ್ತಾಳೆ. ಇಬ್ರೂ… ಶ್ವೇತಾನೂ.
    tr: Ḍākṭrē, hālu kuḍisōdu tumbā kaṣṭa āgtide. Rātri ivaḷu tumbā aḷtāḷe. Ibrū… Shwētānū.
    en: Doctor, feeding has been very hard. At night she cries a lot. Both of them... Shwetha too.
  - who: gyn
    t: ಶ್ವೇತಾ, ನನ್ನ ಕಡೆ ನೋಡಿ. ಹೇಗಿದ್ದೀರಾ? ಮಗು ಬಗ್ಗೆ ಅಲ್ಲ. ನೀವು ಹೇಗಿದ್ದೀರಾ?
    tr: Shwētā, nanna kaḍe nōḍi. Hēgiddīrā? Magu bagge alla. Nīvu hēgiddīrā?
    en: Shwetha, look at me. How are you? Not the baby. How are *you*?
  - who: shwe
    t: ಗೊತ್ತಿಲ್ಲ ಡಾಕ್ಟ್ರೇ. ಎಲ್ರೂ ಖುಷಿಯಾಗಿದ್ದಾರೆ. ನಾನೂ ಖುಷಿಯಾಗಿರ್ಬೇಕು. ಆದ್ರೆ ಕಾರಣ ಇಲ್ಲದೆ ಅಳು ಬರುತ್ತೆ. ಸಣ್ಣ ವಿಷಯಕ್ಕೂ ಸಿಟ್ಟು ಬರುತ್ತೆ. ಆಮೇಲೆ ಅದಕ್ಕೂ ಗಿಲ್ಟ್ ಆಗುತ್ತೆ.
    tr: Gottilla ḍākṭrē. Elrū khuṣiyāgiddāre. Nānū khuṣiyāgirbēku. Ādre kāraṇa illade aḷu barutte. Saṇṇa viṣayakkū siṭṭu barutte. Āmēle adakkū gilṭ āgutte.
    en: I don't know, doctor. Everyone is happy. I should be happy too. But I cry for no reason. I get angry over small things. And then I feel guilty about that too.
  - who: gyn
    t: ಇದಕ್ಕೆ ಬೇಬಿ ಬ್ಲೂಸ್ ಅಂತಾರೆ. ಹೆರಿಗೆ ಆದ ಮೇಲೆ ತುಂಬಾ ತಾಯಂದಿರಿಗೆ ಆಗುತ್ತೆ. ಹಾರ್ಮೋನ್ ಬದಲಾವಣೆ, ನಿದ್ದೆ ಇಲ್ಲದಿರೋದು, ಆಪರೇಷನ್ ನೋವು, ಎಲ್ಲಾ ಸೇರಿ. ಇದು ನಿಮ್ಮ ತಪ್ಪಲ್ಲ. ನೀವು ಕೆಟ್ಟ ಅಮ್ಮ ಅಂತಾನೂ ಅಲ್ಲ.
    tr: Idakke bēbi blūs antāre. Herige āda mēle tumbā tāyandirige āgutte. Hārmōn badalāvaṇe, nidde illadirōdu, āparēṣan nōvu, ellā sēri. Idu nimma tappalla. Nīvu keṭṭa amma antānū alla.
    en: This is called the baby blues. Lots of mothers get it after delivery. Hormone changes, no sleep, the pain of the operation — all of it together. It isn't your fault. And it doesn't mean you're a bad mother.
  - who: gyn
    t: ಸಾಮಾನ್ಯವಾಗಿ ಎರಡು ವಾರದೊಳಗೆ ಕಮ್ಮಿ ಆಗುತ್ತೆ. ಆದ್ರೆ ಎರಡು ವಾರ ಆದ್ಮೇಲೂ ಹೀಗೇ ಇದ್ರೆ, ಏನೂ ಬೇಡ ಅನ್ನಿಸಿದ್ರೆ, ಮಗುನ ನೋಡ್ಕೊಳ್ಳೋಕೆ ಆಗಲ್ಲ ಅನ್ನಿಸಿದ್ರೆ, ಅಥವಾ ನಿಮಗೆ ನೀವೇ ಏನಾದ್ರೂ ಮಾಡ್ಕೊಳ್ಳೋ ಯೋಚನೆ ಬಂದ್ರೆ, ಅದು ಡಿಪ್ರೆಷನ್ ಆಗಿರಬಹುದು. ಆಗ ನಾಚಿಕೆ ಇಲ್ಲದೆ ನಂಗೆ ಹೇಳಲೇಬೇಕು. ಅದಕ್ಕೂ ಚಿಕಿತ್ಸೆ ಇದೆ.
    tr: Sāmānyavāgi eraḍu vāradoḷage kammi āgutte. Ādre eraḍu vāra ādmēlū hīgē idre, ēnū bēḍa annisidre, maguna nōḍkoḷḷōke āgalla annisidre, athavā nimage nīvē ēnādrū māḍkoḷḷō yōcane bandre, adu ḍipreṣan āgirabahudu. Āga nācike illade nange hēḷalēbēku. Adakkū cikitse ide.
    en: Usually it eases within two weeks. But if it's still like this after two weeks, if nothing seems worth it, if you feel you can't look after the baby, or if you have thoughts of harming yourself — that may be depression. Then you must tell me, with no shame at all. There's treatment for that too.
  - who: gyn
    t: ಮನೆಯವರಿಗೂ ಒಂದು ಮಾತು. ಇವರಿಗೆ ದಿನಕ್ಕೆ ಒಂದು ಸಲವಾದ್ರೂ ನಾಲ್ಕು ಗಂಟೆ ಒಟ್ಟಿಗೆ ನಿದ್ದೆ ಸಿಗೋ ಹಾಗೆ ನೋಡ್ಕೊಳ್ಳಿ. ಎದೆಹಾಲು ಪಂಪ್ ಮಾಡಿ ಬಾಟಲ್‌ನಲ್ಲಿ ಇಟ್ರೆ, ರಾತ್ರಿ ಒಂದು ಫೀಡ್ ಪ್ರದೀಪ್ ಕೊಡ್ಬಹುದು. ನಮ್ ಲ್ಯಾಕ್ಟೇಶನ್ ನರ್ಸ್ ಹೊರಗಿದ್ದಾರೆ, ಹೇಗೆ ಹಿಡ್ಕೋಬೇಕು ಅಂತ ತೋರಿಸ್ತಾರೆ.
    tr: Maneyavarigū ondu mātu. Ivarige dinakke ondu salavādrū nālku gaṇṭe oṭṭige nidde sigō hāge nōḍkoḷḷi. Edehālu pamp māḍi bāṭal-nalli iṭre, rātri ondu phīḍ Pradīp koḍbahudu. Nam lyākṭēśan nars horagiddāre, hēge hiḍkōbēku anta tōristāre.
    en: (to Amma and Ajji) A word for the family too. Make sure she gets at least one stretch of four hours' sleep a day. If she pumps breast milk into a bottle, Pradeep can give one feed at night. Our lactation nurse is outside; she'll show you how to hold the baby.
  - who: ajji
    t: ಡಾಕ್ಟ್ರೇ, ನಮ್ ಕಾಲದಲ್ಲಿ ಇದಕ್ಕೆ ಹೆಸರೇ ಇರಲಿಲ್ಲ. ಬಾಣಂತಿ ಅತ್ತರೆ “ಹಠ” ಅಂತಿದ್ರು. ಒಳ್ಳೇದಾಯ್ತು, ಈಗಲಾದ್ರೂ ಹೆಸರಿದೆ.
    tr: Ḍākṭrē, nam kāladalli idakke hesarē iralilla. Bāṇanti attare “haṭha” antidru. Oḷḷēdāytu, īgalādrū hesaride.
    en: Doctor, in our time this didn't even have a name. If a new mother cried, they called it “stubbornness”. It's good that at least now it has a name.
  - scene: On the way out, they stop at Dr. Farhan's room next door. He weighs the baby while Pradeep holds his breath.
  - who: paed
    t: ಎರಡು ಕೆಜಿ ಏಳುನೂರ ಐವತ್ತು. ಹುಟ್ಟಿದಾಗ ಎರಡು ಕೆಜಿ ಒಂಬೈನೂರು ಇತ್ತು. ಗಾಬರಿ ಆಗಬೇಡಿ, ಮೊದಲ ವಾರ ಸ್ವಲ್ಪ ತೂಕ ಕಮ್ಮಿ ಆಗೋದು ಸಾಮಾನ್ಯ. ಎರಡು ವಾರದೊಳಗೆ ಮತ್ತೆ ಹುಟ್ಟಿದಾಗಿನ ತೂಕಕ್ಕೆ ಬರಬೇಕು.
    tr: Eraḍu keji ēḷunūra aivattu. Huṭṭidāga eraḍu keji ombainūru ittu. Gābari āgabēḍi, modala vāra svalpa tūka kammi āgōdu sāmānya. Eraḍu vāradoḷage matte huṭṭidāgina tūkakke barabēku.
    en: Two kilos seven hundred and fifty. She was two kilos nine hundred at birth. Don't panic — losing a little weight in the first week is normal. Within two weeks she should be back to her birth weight.
  - who: shwe
    t: ಹಾಗಾದ್ರೆ ಡಬ್ಬಿ ಹಾಲು ಬೇಡ ಅಲ್ವಾ ಡಾಕ್ಟ್ರೇ?
    tr: Hāgādre ḍabbi hālu bēḍa alvā ḍākṭrē?
    en: So she doesn't need formula, doctor?
  - who: paed
    t: ಈಗ ಬೇಡ. ದಿನಕ್ಕೆ ಎಂಟರಿಂದ ಹನ್ನೆರಡು ಸಲ, ಅವಳು ಕೇಳಿದಾಗೆಲ್ಲಾ ಕುಡಿಸಿ. ಆರು ತಿಂಗಳು ಎದೆಹಾಲು ಮಾತ್ರ, ನೀರು ಕೂಡ ಬೇಡ. ಕಣ್ಣು, ಮೈ ಹಳದಿ ಆದ್ರೆ, ಅಥವಾ ಹಾಲು ಕುಡಿಯೋದು ನಿಲ್ಲಿಸಿದ್ರೆ, ತಕ್ಷಣ ಕರ್ಕೊಂಡು ಬನ್ನಿ.
    tr: Īga bēḍa. Dinakke eṇṭarinda hanneraḍu sala, avaḷu kēḷidāgellā kuḍisi. Āru tiṅgaḷu edehālu mātra, nīru kūḍa bēḍa. Kaṇṇu, mai haḷadi ādre, athavā hālu kuḍiyōdu nillisidre, takṣaṇa karkoṇḍu banni.
    en: Not now. Feed her eight to twelve times a day, whenever she asks. Only breast milk for six months — not even water. If her eyes or skin turn yellow, or if she stops feeding, bring her in straight away.
  - who: ajji
    t: ನೀರು ಕೂಡ ಬೇಡವಾ? ಅಮ್ಮನಿಗೆ ಮೂರು ಲೀಟರ್, ಮಗೂಗೆ ಒಂದು ಹನಿನೂ ಇಲ್ಲ. ಈ ಕಾಲದ ಲೆಕ್ಕಾನೇ ಬೇರೆ!
    tr: Nīru kūḍa bēḍavā? Ammanige mūru līṭar, magūge ondu haninū illa. Ī kālada lekkānē bēre!
    en: Not even water? Three litres for the mother and not a drop for the baby. The sums are different these days!
  - section: 🍼 Pradeep's night shift
    learn: 'baby care: bāṭal, pamp, tēgu, suttu (to swaddle) · -ōṣṭralli (by the time …) · -bēku / -bāradu for instructions · habitual past -ttiralilla (never used to)'
  - scene: Day eight, one in the morning. Shwetha has been asleep since ten. In the kitchen, Pradeep warms a small bottle of expressed milk in a bowl of hot water, the baby on his shoulder. Sam comes in from a late shift.
  - who: sam
    t: ಪ್ರದೀಪ್? ಒಂದು ಗಂಟೆ ಆಯ್ತು. ನೀನು ಇನ್ನೂ ಮಲಗಿಲ್ವಾ?
    tr: Pradīp? Ondu gaṇṭe āytu. Nīnu innū malagilvā?
    en: Pradeep? It's one o'clock. You're still not asleep?
  - who: pradeep
    t: ಇವತ್ತು ನನ್ ಡ್ಯೂಟಿ. ಶ್ವೇತಾ ಹತ್ತು ಗಂಟೆಗೆ ಮಲಗಿದ್ಲು. ಐದು ದಿನದಲ್ಲಿ ಮೊದಲ ಸಲ ಸರಿಯಾದ ನಿದ್ದೆ. ಅವಳು ಏಳೋಷ್ಟರಲ್ಲಿ ಇವಳಿಗೆ ಹಾಲು ಕುಡಿಸಿ, ತೇಗು ಬರಿಸಿ, ಮಲಗಿಸಬೇಕು.
    tr: Ivattu nan ḍyūṭi. Shwētā hattu gaṇṭege malagidlu. Aidu dinadalli modala sala sariyāda nidde. Avaḷu ēḷōṣṭaralli ivaḷige hālu kuḍisi, tēgu barisi, malagisabēku.
    en: Tonight's my shift. Shwetha went to sleep at ten — her first real sleep in five days. Before she wakes up, I have to feed this one, burp her and get her to sleep.
  - who: sam
    t: ಬಾಟಲ್ ಹಾಲು? ಡಬ್ಬಿ ಹಾಲಾ?
    tr: Bāṭal hālu? Ḍabbi hālā?
    en: A bottle? Formula?
  - who: pradeep
    t: ಇಲ್ಲ, ಸಂಜೆ ಶ್ವೇತಾನೇ ಪಂಪ್ ಮಾಡಿ ಇಟ್ಟಿದ್ದು. ಫ್ರಿಜ್‌ನಲ್ಲಿ ಇಟ್ರೆ ಕೆಡಲ್ಲ ಅಂತ ನರ್ಸ್ ಹೇಳಿದ್ರು. ಆದ್ರೆ ನೇರವಾಗಿ ಕುದಿಸಬಾರದು, ಮೈಕ್ರೋವೇವ್ ಕೂಡ ಬೇಡ. ಹೀಗೆ ಬಿಸಿನೀರಿನ ಬಟ್ಟಲಲ್ಲಿ ಇಟ್ಟು ಬೆಚ್ಚಗೆ ಮಾಡಬೇಕು.
    tr: Illa, sañje Shwētānē pamp māḍi iṭṭiddu. Phrij-nalli iṭre keḍalla anta nars hēḷidru. Ādre nēravāgi kudisabāradu, maikrōvēv kūḍa bēḍa. Hīge bisinīrina baṭṭalalli iṭṭu beccage māḍabēku.
    en: No, Shwetha pumped it this evening. The nurse said it won't spoil in the fridge. But you mustn't boil it directly, and no microwave either. You warm it like this, standing in a bowl of hot water.
  - who: sam
    t: ನೀನು ಎಕ್ಸ್‌ಪರ್ಟ್ ಆಗಿಬಿಟ್ಟಿದ್ದೀಯಾ.
    tr: Nīnu ekspart āgibiṭṭiddīyā.
    en: You've become an expert.
  - who: pradeep
    t: ಎಕ್ಸ್‌ಪರ್ಟ್? ಮೊದಲ ದಿನ ಡೈಪರ್ ಹಿಂದೆ-ಮುಂದೆ ಹಾಕಿದ್ದೆ. ಅತ್ತೆ ನಕ್ಕು ನಕ್ಕು ಸುಸ್ತಾದ್ರು. ಸುತ್ತೋದು ಇನ್ನೂ ಬರಲ್ಲ. ನಾನು ಬಟ್ಟೆ ಸುತ್ತಿದ್ರೆ ಐದು ನಿಮಿಷದಲ್ಲಿ ಒಂದು ಕೈ ಹೊರಗೆ ಬರುತ್ತೆ.
    tr: Ekspart? Modala dina ḍaipar hinde-munde hākidde. Atte nakku nakku sustādru. Suttōdu innū baralla. Nānu baṭṭe suttidre aidu nimiṣadalli ondu kai horage barutte.
    en: Expert? On the first day I put the diaper on back to front. My mother-in-law laughed till she was worn out. I still can't swaddle. When I wrap her, one hand pops out within five minutes.
  - scene: The baby finishes the bottle. Pradeep lifts her to his shoulder the way Amma showed him and pats her back. Nothing. He keeps patting.
  - who: sam
    t: ಭಯ ಆಗುತ್ತಾ? ಇಷ್ಟು ಚಿಕ್ಕ ಮಗುನ ಎತ್ಕೊಳ್ಳೋಕೆ?
    tr: Bhaya āguttā? Iṣṭu cikka maguna etkoḷḷōke?
    en: Are you scared? Holding a baby this small?
  - who: pradeep
    t: ಪ್ರತಿ ಸಲ. ಕತ್ತು ಸರಿಯಾಗಿ ಹಿಡ್ಕೊಂಡಿದ್ದೀನಾ, ತುಂಬಾ ಗಟ್ಟಿಯಾಗಿ ಹಿಡ್ಕೊಂಡಿದ್ದೀನಾ… ಒಂದು ವಿಷಯ ಹೇಳ್ಲಾ, ಸ್ಯಾಮ್? ಸಿಯಾಟಲ್‌ನಲ್ಲಿ ಪ್ರೊಡಕ್ಷನ್ ಸರ್ವರ್ ಡೌನ್ ಆದಾಗಲೂ ನಂಗೆ ಇಷ್ಟು ಟೆನ್ಷನ್ ಆಗ್ತಿರಲಿಲ್ಲ. ಆದ್ರೆ ಇಷ್ಟು ಖುಷಿನೂ ಯಾವತ್ತೂ ಆಗಿರಲಿಲ್ಲ.
    tr: Prati sala. Kattu sariyāgi hiḍkoṇḍiddīnā, tumbā gaṭṭiyāgi hiḍkoṇḍiddīnā… Ondu viṣaya hēḷlā, Sām? Siyāṭal-nalli prōḍakṣan sarvar ḍaun ādāgalū nange iṣṭu ṭenṣan āgtiralilla. Ādre iṣṭu khuṣinū yāvattū āgiralilla.
    en: Every time. Am I holding the neck right, am I holding her too tight... Shall I tell you something, Sam? Even when a production server went down in Seattle, I never got this tense. But I was never this happy either.
  - scene: A small, loud burp. Both men laugh under their breath.
  - who: pradeep
    t: ಬಂತು! ತೇಗು ಬಂತು! ಈಗ ಮಲಗು ಮಗಳೇ. ನಿಮ್ಮಮ್ಮನ್ನ ಎಬ್ಬಿಸಬೇಡ.
    tr: Bantu! Tēgu bantu! Īga malagu magaḷē. Nimmammanna ebbisabēḍa.
    en: There it is! The burp! Now go to sleep, my girl. Don't wake your mother.
  - section: 👵 Ajji holds her
    learn: 'muttajji, marimommagaḷu · dhairya (courage) · past habitual -ttidde (I used to …) · -ōvaregū (until) · blessings: cennāgiru, nūru varṣa sukhavāgi bāḷu'
  - scene: Day nine, late afternoon. Winter sunlight in Ajji's room. Shwetha, who slept well last night, carries the baby in slowly, one hand on her stitches. Ajji is sitting on her bed with her prayer beads.
  - who: shwe
    t: ಅಜ್ಜಿ, ಒಂಬತ್ತು ದಿನ ಆಯ್ತು. ಇವತ್ತು ತಪ್ಪಿಸ್ಕೊಳ್ಳೋಕೆ ಬಿಡಲ್ಲ. ನಿಮ್ಮ ಮರಿಮೊಮ್ಮಗಳನ್ನ ನೀವು ಎತ್ಕೋಬೇಕು.
    tr: Ajji, ombattu dina āytu. Ivattu tappiskoḷḷōke biḍalla. Nimma marimommagaḷanna nīvu etkōbēku.
    en: Ajji, it's been nine days. Today I won't let you escape. You have to hold your great-granddaughter.
  - who: ajji
    t: ಬೇಡ ಕಣೇ. ನನ್ ಕೈ ನಡುಗುತ್ತೆ. ಬಿಪಿ ಮಾತ್ರೆಯಿಂದ ಒಮ್ಮೊಮ್ಮೆ ತಲೆ ಸುತ್ತುತ್ತೆ. ಬೀಳಿಸಿಬಿಟ್ರೆ? ನಾನು ದೂರದಿಂದ ನೋಡ್ತೀನಿ, ಅಷ್ಟೇ ಸಾಕು.
    tr: Bēḍa kaṇē. Nan kai naḍugutte. Bi-pi mātreyinda ommomme tale suttutte. Bīḷisibiṭre? Nānu dūradinda nōḍtīni, aṣṭē sāku.
    en: No, dear. My hands shake. The BP tablets make me dizzy sometimes. What if I drop her? I'll watch from a distance. That's enough for me.
  - who: shwe
    t: ಆಗಸ್ಟ್‌ನಲ್ಲಿ ನೀವು ಐಸಿಯುನಲ್ಲಿದ್ದಾಗ ನಾನು ದೇವರ ಹತ್ರ ಒಂದೇ ಒಂದು ಕೇಳಿದ್ದೆ, ಅಜ್ಜಿ. ನೀವು ಇವಳನ್ನ ಎತ್ಕೋಬೇಕು ಅಂತ. ದೂರದಿಂದ ಅಲ್ಲ. ಒರಗಿ ಕೂತ್ಕೊಳ್ಳಿ, ದಿಂಬು ಇಡ್ತೀನಿ. ನಾನು ಪಕ್ಕದಲ್ಲೇ ಇರ್ತೀನಿ.
    tr: Āgasṭ-nalli nīvu ai-si-yu-nalliddāga nānu dēvara hatra ondē ondu kēḷidde, ajji. Nīvu ivaḷanna etkōbēku anta. Dūradinda alla. Oragi kūtkoḷḷi, dimbu iḍtīni. Nānu pakkadallē irtīni.
    en: In August, when you were in the ICU, I asked God for just one thing, Ajji — that you would hold her. Not from a distance. Lean back, I'll put a pillow. I'll be right beside you.
  - scene: Shwetha puts a pillow on Ajji's lap, lays the baby on it, and guides Ajji's hands under the small head. For a moment Ajji does not breathe.
  - who: ajji
    t: ಅಯ್ಯೋ… ಎಷ್ಟು ಹಗುರ. ಹತ್ತಿ ಉಂಡೆ ಥರ. ನೋಡು, ನೋಡು, ಕಣ್ಣು ಬಿಟ್ಳು. ನನ್ನನ್ನೇ ನೋಡ್ತಿದ್ದಾಳೆ.
    tr: Ayyō… eṣṭu hagura. Hatti uṇḍe thara. Nōḍu, nōḍu, kaṇṇu biṭḷu. Nannannē nōḍtiddāḷe.
    en: Oh... how light. Like a ball of cotton. Look, look, she's opened her eyes. She's looking right at me.
  - who: shwe
    t: ಇವಳಿಗೆ ನಿಮ್ಮ ಮೂಗು ಬಂದಿದೆ ಅಂತ ಅಮ್ಮ ಹೇಳ್ತಾಳೆ.
    tr: Ivaḷige nimma mūgu bandide anta amma hēḷtāḷe.
    en: Amma says she's got your nose.
  - who: ajji
    t: ಅಯ್ಯೋ ಪಾಪ! ಮಗೂಗೆ ಯಾಕೆ ಅಂಥಾ ಶಿಕ್ಷೆ?
    tr: Ayyō pāpa! Magūge yāke anthā śikṣe?
    en: (laughing through tears) Oh, poor thing! Why punish the baby like that?
  - who: ajji
    t: ಶ್ವೇತಾ, ನಿಮ್ಮಪ್ಪ ಹುಟ್ಟಿದಾಗ ನಂಗೆ ಇಪ್ಪತ್ತೆರಡು ವರ್ಷ. ಊರಿನ ಮನೆ. ಕರೆಂಟ್ ಇರಲಿಲ್ಲ, ಡಾಕ್ಟ್ರು ಇರಲಿಲ್ಲ, ಸೂಲಗಿತ್ತಿ ಬಂದಿದ್ಲು. ಮೂರು ತಿಂಗಳು ಕತ್ತಲೆ ಕೋಣೆ. ರಾತ್ರಿ ಎಲ್ರೂ ಮಲಗಿದ ಮೇಲೆ ನಾನು ಒಬ್ಬಳೇ ಅಳ್ತಿದ್ದೆ. ಯಾಕೆ ಅಂತ ನಂಗೂ ಗೊತ್ತಿರಲಿಲ್ಲ.
    tr: Shwētā, nimmappa huṭṭidāga nange ippatteraḍu varṣa. Ūrina mane. Karaṇṭ iralilla, ḍākṭru iralilla, sūlagitti bandidlu. Mūru tingaḷu kattale kōṇe. Rātri elrū malagida mēle nānu obbaḷē aḷtidde. Yāke anta nangū gottiralilla.
    en: Shwetha, when your father was born I was twenty-two. Our house in the village. No electricity, no doctor — the midwife came. Three months in a dark room. At night, after everyone was asleep, I used to cry alone. I didn't know why myself.
  - who: ajji
    t: ಯಾರಿಗೂ ಹೇಳಲಿಲ್ಲ. ಹೇಳಿದ್ರೆ ಏನಂತಾರೋ ಅಂತ ಭಯ. ಒಂದು ರಾತ್ರಿ ನಿಮ್ ತಾತ ನೋಡಿಬಿಟ್ರು. ಏನೂ ಕೇಳಲಿಲ್ಲ. ಸುಮ್ಮನೆ ಪಕ್ಕದಲ್ಲಿ ಕೂತು ಬೆಳಿಗ್ಗೆವರೆಗೂ ಮಗುನ ಎತ್ಕೊಂಡಿದ್ರು. ಅವತ್ತಿಂದ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಸರಿ ಹೋಯ್ತು.
    tr: Yārigū hēḷalilla. Hēḷidre ēnantārō anta bhaya. Ondu rātri nim tāta nōḍibiṭru. Ēnū kēḷalilla. Summane pakkadalli kūtu beḷiggevaregū maguna etkoṇḍidru. Avattinda svalpa svalpa sari hōytu.
    en: I didn't tell anyone. I was afraid of what they'd say. One night your grandfather saw me. He didn't ask anything. He just sat beside me and held the baby until morning. From that day, little by little, it got better.
  - who: shwe
    t: ಅಜ್ಜಿ… ನಂಗೂ ಹಾಗೇ ಆಗ್ತಿದೆ. ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ದು ಕೇಳಿ ಸ್ವಲ್ಪ ಸಮಾಧಾನ ಆಯ್ತು. ಆದ್ರೆ ನಿಮ್ಮ ಬಾಯಿಂದ ಕೇಳಿದ ಮೇಲೆ ನಾನು ಒಬ್ಬಳೇ ಅಲ್ಲ ಅನ್ನಿಸ್ತಿದೆ.
    tr: Ajji… nangū hāgē āgtide. Ḍākṭru hēḷiddu kēḷi svalpa samādhāna āytu. Ādre nimma bāyinda kēḷida mēle nānu obbaḷē alla annistide.
    en: Ajji... it's happening to me too. What the doctor said comforted me a little. But hearing it from you, I feel I'm not the only one.
  - who: ajji
    t: ನೀನು ಒಬ್ಬಳಲ್ಲ. ಈ ಮನೇಲಿ ಯಾರೂ ಒಬ್ಬರಲ್ಲ. ಅಳು ಬಂದ್ರೆ ಅಳು, ಆದ್ರೆ ಮುಚ್ಚಿಡಬೇಡ. ರಾತ್ರಿ ನಿದ್ದೆ ಬರದಿದ್ರೆ ನನ್ ಕೋಣೆಗೆ ಬಾ. ನಂಗೂ ನಿದ್ದೆ ಕಮ್ಮಿ. ಮುದುಕಿ ಅಲ್ವಾ.
    tr: Nīnu obbaḷalla. Ī manēli yārū obbaralla. Aḷu bandre aḷu, ādre mucciḍabēḍa. Rātri nidde baradidre nan kōṇege bā. Nangū nidde kammi. Muduki alvā.
    en: You're not alone. Nobody in this house is alone. If you need to cry, cry — but don't hide it. If you can't sleep at night, come to my room. I hardly sleep either. I'm an old woman, aren't I.
  - scene: Ajji bends, slowly, and touches her forehead to the baby's.
  - who: ajji
    t: ದೇವರೇ, ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಆ ರಾತ್ರಿ ನಿನ್ ಹತ್ರ ಬೇಡ್ಕೊಂಡಿದ್ದೆ. ಇವಳ ಮುಖ ನೋಡೋವರೆಗೂ ನನ್ನ ಕರ್ಕೊಂಡು ಹೋಗಬೇಡ ಅಂತ. ನೀನು ಕೇಳಿಸ್ಕೊಂಡೆ. ಇನ್ನು ನಿನ್ನಿಷ್ಟ.
    tr: Dēvarē, āspatreyalli ā rātri nin hatra bēḍkoṇḍidde. Ivaḷa mukha nōḍōvaregū nanna karkoṇḍu hōgabēḍa anta. Nīnu kēḷiskoṇḍe. Innu ninniṣṭa.
    en: God, that night in the hospital I begged you not to take me until I had seen her face. You listened. From now on, as you wish.
  - scene: The baby's tiny fingers close around Ajji's finger and hold on.
  - who: ajji
    t: ಓ… ನೋಡು, ಹಿಡ್ಕೊಂಡ್ಳು. ಬಿಡ್ತಾನೇ ಇಲ್ಲ. ಸರಿ ಸರಿ, ದೇವರೇ, ನಾನು ಹೇಳಿದ್ದು ವಾಪಸ್. ಇವಳು ನನ್ನ “ಅಜ್ಜಿ” ಅಂತ ಕರೆಯೋವರೆಗೂ ಇರ್ತೀನಿ.
    tr: Ō… nōḍu, hiḍkoṇḍḷu. Biḍtānē illa. Sari sari, dēvarē, nānu hēḷiddu vāpas. Ivaḷu nanna “ajji” anta kareyōvaregū irtīni.
    en: Oh... look, she's holding on. She won't let go. All right, all right, God, I take back what I said. I'll stay until she calls me “Ajji”.
  - who: shwe
    t: ಅಷ್ಟೇ ಅಲ್ಲ. ಅವಳ ಮದುವೆಯಲ್ಲಿ ಅಕ್ಷತೆ ಹಾಕೋವರೆಗೂ.
    tr: Aṣṭē alla. Avaḷa maduveyalli akṣate hākōvaregū.
    en: Not just that. Until you throw the blessing rice at her wedding.
  - who: ajji
    t: ಆಸೆ ನೋಡು ಇವಳಿಗೆ! ಹೂಂ… ನೋಡೋಣ. ಚೆನ್ನಾಗಿರು ಮಗೂ. ನೂರು ವರ್ಷ ಸುಖವಾಗಿ ಬಾಳು.
    tr: Āse nōḍu ivaḷige! Hūṃ… nōḍōṇa. Cennāgiru magū. Nūru varṣa sukhavāgi bāḷu.
    en: Listen to her, so greedy! Hm... we'll see. Be well, little one. Live a hundred happy years.
  - chapter: Chapter 9 — A name for the baby
  - section: 📜 Meenakshi or Meera?
    learn: 'nakṣatra, akṣara, hesariḍu (to name) · reported speech: -ante, anta hēḷidru · comparing: idakkinta oḷḷe … · compromising: ondu kelasa māḍōṇa, eraḍū iḍōṇa'
  - scene: Day ten, evening. The whole Rao household around the dining table. Appa has come back from the temple with a slip of paper from the purohit.
  - who: appa
    t: ಪುರೋಹಿತರು ಜಾತಕ ನೋಡಿದ್ರು. ಮಘಾ ನಕ್ಷತ್ರ ಅಂತೆ. ಹೆಸರು ಮ, ಮಿ, ಮು, ಮೆ, ಈ ಅಕ್ಷರಗಳಲ್ಲಿ ಶುರು ಆದ್ರೆ ಒಳ್ಳೇದು ಅಂತ ಹೇಳಿದ್ರು.
    tr: Purōhitaru jātaka nōḍidru. Maghā nakṣatra ante. Hesaru ma, mi, mu, me, ī akṣaragaḷalli śuru ādre oḷḷēdu anta hēḷidru.
    en: 'The purohit looked at the horoscope. It''s Magha nakshatra, apparently. He said it''s good if the name starts with one of these syllables: ma, mi, mu, me.'
  - who: ajji
    t: ಮಿ ಅಂದ್ಮೇಲೆ ಇನ್ನೇನು? ಮೀನಾಕ್ಷಿ. ನನ್ನ ಅಮ್ಮನ ಹೆಸರು. ಮಧುರೆ ಮೀನಾಕ್ಷಿ ಅಮ್ಮನವರ ಹೆಸರು. ಇದಕ್ಕಿಂತ ಒಳ್ಳೆ ಹೆಸರು ಎಲ್ಲಿ ಸಿಗುತ್ತೆ?
    tr: Mi andmēle innēnu? Mīnākṣi. Nanna ammana hesaru. Madhure Mīnākṣi ammanavara hesaru. Idakkinta oḷḷe hesaru elli sigutte?
    en: If it's mi, what else? Meenakshi. My mother's name. The name of the goddess Meenakshi of Madurai. Where will you find a better name than that?
  - who: kiran
    t: ಅಜ್ಜಿ, ಸ್ಕೂಲ್‌ನಲ್ಲಿ ಎಲ್ರೂ ಅವಳನ್ನ “ಮೀನು” ಅಂತ ಕರೀತಾರೆ. ಮೀನು ಅಂದ್ರೆ ಫಿಶ್!
    tr: Ajji, skūl-nalli elrū avaḷanna “mīnu” anta karītāre. Mīnu andre phiś!
    en: Ajji, everyone at school will call her “Meenu”. Meenu means fish!
  - who: ajji
    t: ಮೀನು ಆದ್ರೆ ಏನಾಯ್ತು? ಮೀನಿನ ಥರ ಕಣ್ಣು ಅಂತಾನೇ ಮೀನಾಕ್ಷಿ ಅರ್ಥ. ದೊಡ್ಡ ಸುಂದರ ಕಣ್ಣು. ನೋಡು ಅವಳ ಕಣ್ಣು.
    tr: Mīnu ādre ēnāytu? Mīnina thara kaṇṇu antānē Mīnākṣi artha. Doḍḍa sundara kaṇṇu. Nōḍu avaḷa kaṇṇu.
    en: So what if it's fish? That's exactly what Meenakshi means — eyes shaped like a fish. Big, beautiful eyes. Look at her eyes.
  - who: shwe
    t: ಅಜ್ಜಿ, ಹೆಸರು ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ. ಆದ್ರೆ ನಾನು, ಪ್ರದೀಪ್ ಬೇರೆ ಯೋಚನೆ ಮಾಡಿದ್ವಿ. “ಮೀರಾ”. ಚಿಕ್ಕದು, ಯಾರು ಬೇಕಾದ್ರೂ ಸುಲಭವಾಗಿ ಹೇಳಬಹುದು. ನಾಳೆ ಅವಳು ಹೊರದೇಶದಲ್ಲಿ ಓದಿದ್ರೂ ಯಾರೂ ತಪ್ಪಾಗಿ ಕರೆಯಲ್ಲ.
    tr: Ajji, hesaru tumbā cennāgide. Ādre nānu, Pradīp bēre yōcane māḍidvi. “Mīrā”. Cikkadu, yāru bēkādrū sulabhavāgi hēḷabahudu. Nāḷe avaḷu horadēśadalli ōdidrū yārū tappāgi kareyalla.
    en: 'Ajji, it''s a lovely name. But Pradeep and I had another idea: “Meera”. It''s short, anyone can say it easily. Even if she studies abroad one day, nobody will get it wrong.'
  - who: sam
    t: ಒಂದು ವರ್ಷದ ಹಿಂದೆ “ಸರಸ್ವತಮ್ಮ” ಅನ್ನೋಕೆ ನಂಗೆ ಐದು ನಿಮಿಷ ಬೇಕಾಗ್ತಿತ್ತು. ಈಗ ಸುಲಭವಾಗಿ ಹೇಳ್ತೀನಿ. ಜನ ಕಲೀತಾರೆ, ಶ್ವೇತಾ.
    tr: Ondu varṣada hinde “Sarasvatamma” annōke nange aidu nimiṣa bēkāgtittu. Īga sulabhavāgi hēḷtīni. Jana kalītāre, Shwētā.
    en: A year ago it took me five minutes to say “Saraswathamma”. Now I say it easily. People learn, Shwetha.
  - who: ajji
    t: ನೋಡಿದ್ಯಾ! ಸ್ವಿಸ್ ಹುಡುಗ ನನ್ ಕಡೆ.
    tr: Nōḍidyā! Svis huḍuga nan kaḍe.
    en: See that! The Swiss boy is on my side.
  - who: pradeep
    t: ಅಜ್ಜಿ, ಮೀರಾ ಕೂಡ ಹೊಸ ಹೆಸರಲ್ಲ. ಮೀರಾಬಾಯಿ ಕೃಷ್ಣನ ಭಕ್ತೆ, ಐನೂರು ವರ್ಷದ ಹಿಂದಿನವರು. ಯಾರು ಏನೇ ಅಂದ್ರೂ ಅವರು ತಮಗೆ ಸರಿ ಅನ್ನಿಸಿದ್ದನ್ನೇ ಮಾಡಿದ್ರು. ನಮ್ ಮಗಳೂ ಹಾಗೇ ಆಗ್ಲಿ ಅಂತ ಆಸೆ.
    tr: Ajji, Mīrā kūḍa hosa hesaralla. Mīrābāyi Kṛṣṇana bhakte, ainūru varṣada hindinavaru. Yāru ēnē andrū avaru tamage sari annisiddannē māḍidru. Nam magaḷū hāgē āgli anta āse.
    en: Ajji, Meera isn't a new name either. Meerabai was a devotee of Krishna, five hundred years ago. Whatever anyone said, she did what she felt was right. We'd like our daughter to be like that.
  - who: ajji
    t: ಯಾರು ಏನೇ ಅಂದ್ರೂ? ಮುತ್ತಜ್ಜಿ ಅಂದ್ರೂ? ಅದೇ ನನ್ನ ಭಯ!
    tr: Yāru ēnē andrū? Muttajji andrū? Adē nanna bhaya!
    en: Whatever anyone said? Even her great-grandmother? That's exactly what I'm afraid of!
  - who: amma
    t: ಒಂದು ಕೆಲಸ ಮಾಡೋಣ. ಎಷ್ಟೋ ಮನೆಗಳಲ್ಲಿ ಎರಡು ಹೆಸರು ಇಡ್ತಾರೆ. ಒಂದು ನಕ್ಷತ್ರದ ಹೆಸರು, ಪೂಜೆ, ಶಾಸ್ತ್ರಕ್ಕೆ. ಇನ್ನೊಂದು ಕರೆಯೋ ಹೆಸರು, ಸ್ಕೂಲ್‌ಗೆ, ಸರ್ಟಿಫಿಕೇಟ್‌ಗೆ.
    tr: Ondu kelasa māḍōṇa. Eṣṭō manegaḷalli eraḍu hesaru iḍtāre. Ondu nakṣatrada hesaru, pūje, śāstrakke. Innondu kareyō hesaru, skūlge, sarṭiphikēṭge.
    en: Let's do one thing. Lots of families give two names. One is the nakshatra name, for pujas and rituals. The other is the name she's called by, for school and certificates.
  - who: appa
    t: ಹೌದು. ನನಗೂ ಎರಡು ಹೆಸರಿವೆ. ಜಾತಕದಲ್ಲಿ ನಾನು “ವೆಂಕಟರಮಣ”. ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಮೂವತ್ತು ವರ್ಷದಿಂದ ರಮೇಶ್.
    tr: Haudu. Nanagū eraḍu hesarive. Jātakadalli nānu “Veṅkaṭaramaṇa”. Byāṅk-nalli mūvattu varṣadinda Ramēsh.
    en: That's right. I have two names myself. In my horoscope I'm “Venkataramana”. At the bank I've been Ramesh for thirty years.
  - who: kiran
    t: ಏನು? ಅಪ್ಪಾ, ಇಪ್ಪತ್ತು ವರ್ಷದಲ್ಲಿ ಇದು ನಂಗೆ ಇವತ್ತೇ ಗೊತ್ತಾಗ್ತಿರೋದು!
    tr: Ēnu? Appā, ippattu varṣadalli idu nange ivattē gottāgtirōdu!
    en: What? Appa, twenty years and I'm only finding this out today!
  - who: ajji
    t: ಸರಿ. ಕಿವಿಯಲ್ಲಿ ಮೊದಲು ಮೀನಾಕ್ಷಿ ಅಂತ ಹೇಳ್ಬೇಕು. ಆಮೇಲೆ ನೀವು ಏನು ಬೇಕಾದ್ರೂ ಕರೀರಿ. ನಾನು ಮಾತ್ರ “ಮೀನು” ಅಂತಾನೇ ಕರೆಯೋದು. ಕಿರಣ್, ಏನಾದ್ರೂ ತಕರಾರು ಇದ್ಯಾ?
    tr: Sari. Kiviyalli modalu Mīnākṣi anta hēḷbēku. Āmēle nīvu ēnu bēkādrū karīri. Nānu mātra “Mīnu” antānē kareyōdu. Kiraṇ, ēnādrū takarāru idyā?
    en: Fine. Meenakshi must be said into her ear first. After that, call her whatever you like. But I'll call her “Meenu” and nothing else. Kiran, any objection?
  - who: kiran
    t: ಇಲ್ಲ ಅಜ್ಜಿ. ನಿಮ್ ಜೊತೆ ಯಾರು ವಾದ ಮಾಡ್ತಾರೆ?
    tr: Illa ajji. Nim jote yāru vāda māḍtāre?
    en: No, Ajji. Who would argue with you?
  - who: shwe
    t: ಮೀರಾ ಮೀನಾಕ್ಷಿ. ಮುಂದೆ ಯಾವುದು ಬೇಕು ಅಂತ ಅವಳೇ ಆರಿಸ್ಕೊಳ್ಳಲಿ.
    tr: Mīrā Mīnākṣi. Munde yāvudu bēku anta avaḷē āriskoḷḷali.
    en: Meera Meenakshi. Later on she can choose for herself which one she wants.
  - section: 🪔 The eleventh day
    learn: 'ritual words: nāmakaraṇa, puṇyāha, sūtaka, muhūrta, maṇe, akki, uṅgura · respectful address: -avarē, svāmi · making amends: nācike, hañcikoḷḷu (to share)'
  - scene: 'Day eleven: Saturday, 21 November. The hall of the Rao house is hung with mango leaves and marigolds. A wooden cradle, wound with jasmine, hangs from a hook in the ceiling. Sumitra and Shankar arrive early with fruit, a new frock and a small velvet box.'
  - who: sumitra
    t: ಲಕ್ಷ್ಮಿ ಅವರೇ, ಎಲ್ಲಿ ನಮ್ ಮೊಮ್ಮಗಳು? ರಾತ್ರಿ ಪೂರ್ತಿ ನಿದ್ದೆ ಬರಲಿಲ್ಲ, ಬೆಳಿಗ್ಗೆ ಆಗೋದನ್ನೇ ಕಾಯ್ತಿದ್ದೆ.
    tr: Lakshmī avarē, elli nam mommagaḷu? Rātri pūrti nidde baralilla, beḷigge āgōdannē kāytidde.
    en: Lakshmi, where's our granddaughter? I couldn't sleep all night; I was just waiting for morning.
  - who: amma
    t: ಬನ್ನಿ ಸುಮಿತ್ರಾ, ಬನ್ನಿ ಶಂಕರ್ ಅವರೇ. ಒಳಗೆ ಅಮ್ಮನ ಜೊತೆ ಇದ್ದಾಳೆ. ಹೊಸ ಬಟ್ಟೆ ಹಾಕ್ತಿದ್ದೀವಿ.
    tr: Banni Sumitrā, banni Śaṅkar avarē. Oḷage ammana jote iddāḷe. Hosa baṭṭe hāktiddīvi.
    en: Come in, Sumitra, come in, Shankar. She's inside with her mother. We're putting her new clothes on.
  - who: sumitra
    t: ಇದು ಬೆಳ್ಳಿ ಕಾಲ್ಗೆಜ್ಜೆ, ಪುಟ್ಟ ಕೈಬಳೆ. ಲಕ್ಷ್ಮಿ ಅವರೇ, ಒಂದು ವರ್ಷದ ಹಿಂದೆ ಇದೇ ಮನೆಗೆ ಬೇರೆ ಮನಸ್ಸಿನಿಂದ ಬಂದಿದ್ದೆ. ಇವತ್ತು ಬರಿಗೈಯಲ್ಲಿ ಬಂದಿದ್ರೂ ನೀವು ಬಾಗಿಲು ತೆಗೀತಿದ್ರಿ ಅಂತ ಗೊತ್ತು. ಅದಕ್ಕೇ ಇದು ಉಡುಗೊರೆ ಅಲ್ಲ. ಪ್ರೀತಿ.
    tr: Idu beḷḷi kālgejje, puṭṭa kaibaḷe. Lakshmī avarē, ondu varṣada hinde idē manege bēre manassininda bandidde. Ivattu barigaiyalli bandidrū nīvu bāgilu tegītidri anta gottu. Adakkē idu uḍugore alla. Prīti.
    en: (handing over the box) Silver anklets and a tiny bangle. Lakshmi, a year ago I came to this same house with a different heart. I know that today you'd have opened the door even if I'd come empty-handed. That's why this isn't a gift. It's love.
  - who: amma
    t: ಅದೆಲ್ಲಾ ಮುಗಿದ ಕಥೆ, ಸುಮಿತ್ರಾ. ಜಯದೇವದಲ್ಲಿ ಆ ರಾತ್ರಿ ನೀವು ಊಟ ತಂದಾಗಲೇ ಮುಗೀತು. ಇವತ್ತು ನಾವಿಬ್ರೂ ಅಜ್ಜಿಯರು, ಅಷ್ಟೇ.
    tr: Adellā mugida kathe, Sumitrā. Jayadēvadalli ā rātri nīvu ūṭa tandāgalē mugītu. Ivattu nāvibrū ajjiyaru, aṣṭē.
    en: That's a closed story, Sumitra. It ended that night at Jayadeva when you brought food. Today we're both just grandmothers, that's all.
  - who: shankar
    t: ರಮೇಶ್ ಅವರೇ, ನಮ್ ಕಡೆ ಮೊದಲ ಹೆರಿಗೆ ತವರು ಮನೆಯವರ ಖರ್ಚು ಅಂತ ಪದ್ಧತಿ. ಸೀಮಂತದ ದಿನ ಆ ಪದ್ಧತಿನ ನಾವೆಲ್ಲಾ ಸೇರಿ ಬದಲಾಯಿಸಿದ್ವಿ, ಆಸ್ಪತ್ರೆ ಬಿಲ್ ಮಕ್ಕಳೇ ಕಟ್ಟಿದ್ರು. ಆದ್ರೆ ಒಂದು ವರ್ಷದ ಹಿಂದೆ ನಾವು ನಿಮ್ಮಿಂದ ಏನೇನು ಕೇಳಿದ್ವಿ ಅಂತ ನೆನೆಸಿಕೊಂಡ್ರೆ ಇನ್ನೂ ನಾಚಿಕೆ ಆಗುತ್ತೆ. ಇವತ್ತಿನ ನಾಮಕರಣದ ಖರ್ಚೂ ನಾವು ಹಂಚ್ಕೊಳ್ತೀವಿ. ಬೇಡ ಅನ್ಬೇಡಿ.
    tr: Ramēsh avarē, nam kaḍe modala herige tavaru maneyavara kharcu anta paddhati. Sīmantada dina ā paddhatina nāvellā sēri badalāyisidvi, āspatre bil makkaḷē kaṭṭidru. Ādre ondu varṣada hinde nāvu nimminda ēnēnu kēḷidvi anta nenesikoṇḍre innū nācike āgutte. Ivattina nāmakaraṇada kharcū nāvu hañckoḷtīvi. Bēḍa anbēḍi.
    en: (quietly, to Appa) Ramesh, among us the custom is that the girl's family pays for the first delivery. At the seemantha we all changed that custom together, and the children paid the hospital themselves. But when I remember what we asked of you a year ago, I'm still ashamed. Let us share the cost of today's naming too. Please don't say no.
  - who: appa
    t: ಶಂಕರ್ ಅವರೇ, ಹಂಚ್ಕೊಳ್ಳೋಣ. ಖರ್ಚು ಮಾತ್ರ ಅಲ್ಲ, ಈ ಮಗೂನೂ. ಅವಳಿಗೆ ಎರಡು ಮನೆ, ನಾಲ್ಕು ಅಜ್ಜ-ಅಜ್ಜಿ, ಒಬ್ಬ ಮುತ್ತಜ್ಜಿ. ಅದಕ್ಕಿಂತ ದೊಡ್ಡ ಆಸ್ತಿ ಬೇಕಾ?
    tr: Śaṅkar avarē, hañckoḷḷōṇa. Kharcu mātra alla, ī magūnū. Avaḷige eraḍu mane, nālku ajja-ajji, obba muttajji. Adakkinta doḍḍa āsti bēkā?
    en: Shankar, let's share. Not just the costs — this child too. She has two homes, four grandparents and a great-grandmother. What greater wealth could she need?
  - scene: Ten o'clock. The purohit has lit the lamp and set out plates of rice, turmeric and flowers. Pradeep and Shwetha sit before him with the baby.
  - who: purohit
    t: ಮುಹೂರ್ತ ಹತ್ತೂವರೆಗೆ. ತಂದೆ-ತಾಯಿ ಮಗುನ ತಗೊಂಡು ಮಣೆ ಮೇಲೆ ಕೂತ್ಕೊಳ್ಳಿ. ಮಗಳೇ, ನಿಮಗೆ ಆಪರೇಷನ್ ಆಗಿದೆ ಅಂತ ಗೊತ್ತು. ನೆಲದ ಮೇಲೆ ಕಷ್ಟ ಆದ್ರೆ ಕುರ್ಚಿ ಮೇಲೇ ಕೂತ್ಕೊಳ್ಳಿ. ದೇವರು ಬೇಜಾರು ಮಾಡ್ಕೊಳ್ಳಲ್ಲ.
    tr: Muhūrta hattūvarege. Tande-tāyi maguna tagoṇḍu maṇe mēle kūtkoḷḷi. Magaḷē, nimage āparēṣan āgide anta gottu. Nelada mēle kaṣṭa ādre kurci mēlē kūtkoḷḷi. Dēvaru bējāru māḍkoḷḷalla.
    en: The auspicious time is half past ten. Father and mother, take the baby and sit on the low wooden seat. Daughter, I know you've had an operation. If the floor is hard for you, sit on a chair. God won't mind.
  - who: shwe
    t: ಧನ್ಯವಾದ ಸ್ವಾಮಿ. ಕುರ್ಚಿನೇ ಸರಿ.
    tr: Dhanyavāda svāmi. Kurcinē sari.
    en: Thank you, sir. The chair is better.
  - who: purohit
    t: ಮೊದಲು ಪುಣ್ಯಾಹ, ಮನೆ ಶುದ್ಧಿ. ಇವತ್ತಿಗೆ ಹನ್ನೊಂದನೇ ದಿನ, ಸೂತಕ ಮುಗೀತು. ಈಗ ಈ ತಟ್ಟೆಯಲ್ಲಿ ಅಕ್ಕಿ ಹರಡಿ. ತಂದೆ ಉಂಗುರದಿಂದ ಅಕ್ಕಿ ಮೇಲೆ ಹೆಸರು ಬರೀಬೇಕು.
    tr: Modalu puṇyāha, mane śuddhi. Ivattige hannondanē dina, sūtaka mugītu. Īga ī taṭṭeyalli akki haraḍi. Tande uṅguradinda akki mēle hesaru barībēku.
    en: First the punyaha, the purification of the house. Today is the eleventh day; the birth impurity is over. Now spread rice on this plate. The father writes the name in the rice with a ring.
  - scene: Shankar slips off his gold ring and hands it to his son. Pradeep writes slowly in the rice. Kiran holds up his phone to film it.
  - who: purohit
    t: ಈಗ ಮಗುವಿನ ಬಲ ಕಿವಿಯಲ್ಲಿ ಮೂರು ಸಲ ಹೆಸರು ಹೇಳಿ. ಮೊದಲು ನಕ್ಷತ್ರದ ಹೆಸರು, ಆಮೇಲೆ ಕರೆಯೋ ಹೆಸರು.
    tr: Īga maguvina bala kiviyalli mūru sala hesaru hēḷi. Modalu nakṣatrada hesaru, āmēle kareyō hesaru.
    en: Now say the name three times into the baby's right ear. First the nakshatra name, then the name she'll be called by.
  - who: pradeep
    t: ಮೀನಾಕ್ಷಿ… ಮೀನಾಕ್ಷಿ… ಮೀನಾಕ್ಷಿ. ಮೀರಾ… ಮೀರಾ… ಮೀರಾ.
    tr: Mīnākṣi… Mīnākṣi… Mīnākṣi. Mīrā… Mīrā… Mīrā.
    en: (whispering) Meenakshi... Meenakshi... Meenakshi. Meera... Meera... Meera.
  - who: purohit
    t: ಈಗ ಹಿರಿಯರೆಲ್ಲಾ ಅಕ್ಷತೆ ಹಾಕಿ ಆಶೀರ್ವಾದ ಮಾಡಿ.
    tr: Īga hiriyarellā akṣate hāki āśīrvāda māḍi.
    en: Now let all the elders throw the blessing rice and give their blessings.
  - who: sumitra
    t: ಆಯುಷ್ಯ, ಆರೋಗ್ಯ, ವಿದ್ಯೆ ಎಲ್ಲಾ ಸಿಗ್ಲಿ, ಮೀರಾ. ದೊಡ್ಡವಳಾಗಿ ಎರಡೂ ಮನೆಗೆ ಹೆಸರು ತಗೊಂಡು ಬಾ.
    tr: Āyuṣya, ārōgya, vidye ellā sigli, Mīrā. Doḍḍavaḷāgi eraḍū manege hesaru tagoṇḍu bā.
    en: May you have long life, health and learning, Meera. Grow up and bring a good name to both your homes.
  - who: shankar
    t: ಚೆನ್ನಾಗಿ ಓದು, ಮಗೂ. ಯಾರ ಮುಂದೂ ತಲೆ ತಗ್ಗಿಸೋ ಕೆಲಸ ಮಾಡಬೇಡ. ನಾವು ಮಾಡಿದ ತಪ್ಪನ್ನ ನಿನ್ನ ಕಾಲದಲ್ಲಿ ಯಾರೂ ಮಾಡದೇ ಇರಲಿ.
    tr: Cennāgi ōdu, magū. Yāra mundū tale taggisō kelasa māḍabēḍa. Nāvu māḍida tappanna ninna kāladalli yārū māḍadē irali.
    en: Study well, little one. Never do anything that makes you hang your head before anyone. And in your time, may nobody make the mistake we made.
  - section: 🎶 The cradle
    learn: toṭṭilu śāstra · jōguḷa (lullaby) · tūgu (to rock, swing) · koṭṭe / tagoṇḍe (given / taken) · wishes with -ali / -li
  - scene: The women gather round the cradle. Vimala Aunty, in her best silk sari, takes charge.
  - who: vimala
    t: ಮೊದಲು ತೊಟ್ಟಿಲಲ್ಲಿ ಗುಂಡುಕಲ್ಲು ಇಡಬೇಕು, ಮಗು ಕಲ್ಲಿನ ಥರ ಗಟ್ಟಿಯಾಗಿ ಬೆಳೀಲಿ ಅಂತ. ಆಮೇಲೆ ತೊಟ್ಟಿಲ ಕೆಳಗಿಂದ ಮಗುನ ಒಬ್ಬರಿಂದ ಒಬ್ಬರಿಗೆ ಕೊಡಬೇಕು. ನಮ್ ಕಡೆ ಹೀಗೇ ಮಾಡೋದು.
    tr: Modalu toṭṭilalli guṇḍukallu iḍabēku, magu kallina thara gaṭṭiyāgi beḷīli anta. Āmēle toṭṭila keḷaginda maguna obbarinda obbarige koḍabēku. Nam kaḍe hīgē māḍōdu.
    en: First a round grinding stone goes into the cradle, so the baby grows up strong as stone. Then the baby is passed from one person to another under the cradle. That's how we do it in our parts.
  - who: sumitra
    t: ನಾನು “ಕೊಟ್ಟೆ” ಅಂತ ಕೊಡ್ತೀನಿ, ನೀವು “ತಗೊಂಡೆ” ಅಂತ ತಗೊಳ್ಳಿ, ಲಕ್ಷ್ಮಿ ಅವರೇ. ಮೂರು ಸಲ.
    tr: Nānu “koṭṭe” anta koḍtīni, nīvu “tagoṇḍe” anta tagoḷḷi, Lakshmī avarē. Mūru sala.
    en: I'll pass her saying “given”, and you take her saying “taken”, Lakshmi. Three times.
  - scene: Sumitra and Amma pass the baby to each other under the swaying cradle, three times. Then Amma lays her inside. The baby looks up at the jasmine and, for once, does not cry.
  - who: amma
    t: ಅತ್ತೆ, ಜೋಗುಳ ನೀವೇ ಹಾಡಿ. ಶ್ವೇತಾಗೂ ಕಿರಣ್‌ಗೂ ನೀವೇ ಹಾಡಿದ್ದು.
    tr: Atte, jōguḷa nīvē hāḍi. Shwētāgū Kiraṇgū nīvē hāḍiddu.
    en: Atte, you sing the lullaby. You're the one who sang it for Shwetha and Kiran.
  - who: ajji
    t: ಧ್ವನಿ ಮೊದಲಿನ ಹಾಗಿಲ್ಲ… ಆದ್ರೂ ಹಾಡ್ತೀನಿ. ಜೋ ಜೋ ಶ್ರೀ ಕೃಷ್ಣ ಪರಮಾನಂದ… ಜೋ ಜೋ ಗೋಪಿಯ ಕಂದ ಮುಕುಂದ…
    tr: Dhvani modalina hāgilla… ādrū hāḍtīni. Jō jō Śrī Kṛṣṇa paramānanda… jō jō gōpiya kanda Mukunda…
    en: My voice isn't what it was... but I'll sing. (singing) Hush, hush, Sri Krishna, highest joy... hush, hush, Gopi's little one, Mukunda...
  - scene: Ajji sings two verses in her thin, steady voice while Amma rocks the cradle. Sumitra wipes her eyes with the end of her sari. At the back of the room, Sam has lowered his phone.
  - who: sam
    t: ನಾನು ಇಲ್ಲಿಗೆ ಬಂದ ಮೊದಲ ದಿನ ಅಜ್ಜಿ ಕೇಳಿದ ಮೊದಲ ಪ್ರಶ್ನೆ “ಊಟ ಆಯ್ತಾ?”. ಇವತ್ತು ಇದು… ಇದನ್ನ ನಾನು ಯಾವತ್ತೂ ಮರೆಯಲ್ಲ.
    tr: Nānu illige banda modala dina ajji kēḷida modala praśne “ūṭa āytā?”. Ivattu idu… idanna nānu yāvattū mareyalla.
    en: (quietly, to Kiran) The first question Ajji asked me on my first day here was “Have you eaten?”. And today, this... I'll never forget this.
  - who: kiran
    t: ಆಗಸ್ಟ್‌ನಲ್ಲಿ ಆ ರಾತ್ರಿ ಆಂಬುಲೆನ್ಸ್ ನಮ್ ಗೇಟ್ ಹತ್ರ ನಿಂತಾಗ, ಈ ದಿನ ಬರುತ್ತೆ ಅಂತ ನಾನು ಅಂದ್ಕೊಂಡಿರಲಿಲ್ಲ, ಸ್ಯಾಮ್.
    tr: Āgasṭ-nalli ā rātri āmbulens nam gēṭ hatra nintāga, ī dina barutte anta nānu andkoṇḍiralilla, Sām.
    en: That night in August, when the ambulance stood at our gate, I didn't think this day would ever come, Sam.
  - section: 🌳 Three generations
    learn: 'talemāru (generation) · then and now: -ttidru / īga … · relative clauses: herige āda heṇṇu · last wishes: -ōdu bēḍa, -ali, -ōvāga'
  - scene: Afternoon. The lunch on banana leaves is over. The guests sit around the cradle on mats and chairs. Ajji taps her steel tumbler with a spoon.
  - who: ajji
    t: ಎಲ್ರೂ ಸ್ವಲ್ಪ ಕೂತ್ಕೊಳ್ಳಿ. ಈ ಮುದುಕಿ ಎರಡು ಮಾತು ಹೇಳ್ಬೇಕು. ಆಮೇಲೆ ನಾನು ಮಲಗ್ಬೇಕು, ಡಾಕ್ಟ್ರು ಹೇಳಿದ್ದಾರೆ.
    tr: Elrū svalpa kūtkoḷḷi. Ī muduki eraḍu mātu hēḷbēku. Āmēle nānu malagbēku, ḍākṭru hēḷiddāre.
    en: Everyone sit down a moment. This old woman has a few words to say. After that I have to lie down — doctor's orders.
  - who: ajji
    t: 'ಮೂರು ತಿಂಗಳ ಹಿಂದೆ ನಾನು ಜಯದೇವದಲ್ಲಿ ಮಲಗಿದ್ದೆ. ಎದೆ ಮೇಲೆ ವೈರ್, ಕೈಗೆ ಸೂಜಿ. ಆಗ ಒಂದೇ ಯೋಚನೆ: ಈ ಮಗುನ ನೋಡ್ತೀನೋ ಇಲ್ವೋ. ಇವತ್ತು ಅವಳ ತೊಟ್ಟಿಲು ತೂಗಿದ್ದೀನಿ. ದೇವರಿಗೂ, ಡಾಕ್ಟ್ರಿಗೂ, ನಿಮಗೆಲ್ಲಾ ಕೈ ಮುಗೀತೀನಿ.'
    tr: 'Mūru tiṅgaḷa hinde nānu Jayadēvadalli malagidde. Ede mēle vair, kaige sūji. Āga ondē yōcane: ī maguna nōḍtīnō ilvō. Ivattu avaḷa toṭṭilu tūgiddīni. Dēvarigū, ḍākṭrigū, nimagellā kai mugītīni.'
    en: 'Three months ago I was lying in Jayadeva. Wires on my chest, a needle in my arm. Only one thought then: will I see this child or not. Today I have rocked her cradle. I fold my hands to God, to the doctors, and to all of you.'
  - who: ajji
    t: ನನ್ನ ಕಾಲದಲ್ಲಿ ಹೆಣ್ಣು ಮಗು ಹುಟ್ಟಿದ್ರೆ ಕೆಲವು ಮನೆಗಳಲ್ಲಿ ಮುಖ ಸಪ್ಪಗೆ ಮಾಡ್ತಿದ್ರು. ಹುಟ್ಟಿದ ದಿನವೇ ವರದಕ್ಷಿಣೆ ಲೆಕ್ಕ ಹಾಕ್ತಿದ್ರು. ಅದನ್ನೆಲ್ಲಾ ನಾನು ಕಣ್ಣಾರೆ ನೋಡಿದ್ದೀನಿ.
    tr: Nanna kāladalli heṇṇu magu huṭṭidre kelavu manegaḷalli mukha sappage māḍtidru. Huṭṭida dinavē varadakṣiṇe lekka hāktidru. Adannellā nānu kaṇṇāre nōḍiddīni.
    en: In my time, in some houses, faces fell when a girl was born. They'd start counting the dowry on the very day she was born. I've seen all that with my own eyes.
  - who: ajji
    t: ಲಕ್ಷ್ಮಿ ಕಾಲದಲ್ಲಿ ಹೆಣ್ಣು ಮಕ್ಕಳು ಓದೋಕೆ ಶುರು ಮಾಡಿದ್ರು, ಆದ್ರೆ ಕೆಲಸಕ್ಕೆ ಹೋಗೋಕೆ ಎಲ್ರೂ ಬಿಡ್ತಿರಲಿಲ್ಲ. ಶ್ವೇತಾ ಕಾಲದಲ್ಲಿ ಅವಳು ಒಂದು ಟೀಮ್ ನಡೆಸ್ತಾಳೆ, ಅವಳ ಗಂಡ ರಾತ್ರಿ ಮಗುವಿಗೆ ಬಾಟಲ್ ಕೊಡ್ತಾನೆ. ಮೂರು ತಲೆಮಾರು, ಮೂರು ಪ್ರಪಂಚ.
    tr: Lakshmī kāladalli heṇṇu makkaḷu ōdōke śuru māḍidru, ādre kelasakke hōgōke elrū biḍtiralilla. Shwētā kāladalli avaḷu ondu ṭīm naḍestāḷe, avaḷa gaṇḍa rātri maguvige bāṭal koḍtāne. Mūru talemāru, mūru prapañca.
    en: In Lakshmi's time girls began to study, but not everyone let them go out to work. In Shwetha's time she runs a team, and her husband gives the baby a bottle at night. Three generations, three worlds.
  - who: ajji
    t: ಆದ್ರೆ ಒಂದು ವಿಷಯ ಬದಲಾಗಿಲ್ಲ. ಹೆರಿಗೆ ಆದ ಹೆಣ್ಣಿಗೆ ಮನೆಯವರ ಕೈ ಬೇಕು. ನಾನು ಒಬ್ಬಳೇ ಕೂತು ಅತ್ತಿದ್ದೆ. ಶ್ವೇತಾ ಒಬ್ಬಳೇ ಅಳೋದು ಬೇಡ. ಮೀರಾ ಯಾವತ್ತೂ ಒಬ್ಬಳೇ ಅಳೋದು ಬೇಡ. ಅಷ್ಟೇ ನನ್ನ ಆಸೆ.
    tr: Ādre ondu viṣaya badalāgilla. Herige āda heṇṇige maneyavara kai bēku. Nānu obbaḷē kūtu attidde. Shwētā obbaḷē aḷōdu bēḍa. Mīrā yāvattū obbaḷē aḷōdu bēḍa. Aṣṭē nanna āse.
    en: But one thing hasn't changed. A woman who has just given birth needs her family's hands. I sat and cried alone. Shwetha must not cry alone. Meera must never cry alone. That is all I wish for.
  - who: ajji
    t: ಸುಮಿತ್ರಾ, ಶಂಕರ್, ನಾವು ಹಳಬರು ಎಷ್ಟೋ ತಪ್ಪು ಮಾಡಿದ್ದೀವಿ. ನಾನೂ ಮಾಡಿದ್ದೀನಿ. ತಪ್ಪು ಒಪ್ಕೊಂಡು ಮುಂದೆ ಬರೋದೇ ದೊಡ್ಡತನ. ನೀವು ಅದನ್ನ ಮಾಡಿದ್ರಿ. ಈ ಮಗು ಎರಡು ಮನೆಗಳ ಮಧ್ಯೆ ಸೇತುವೆ.
    tr: Sumitrā, Śaṅkar, nāvu haḷabaru eṣṭō tappu māḍiddīvi. Nānū māḍiddīni. Tappu opkoṇḍu munde barōdē doḍḍatana. Nīvu adanna māḍidri. Ī magu eraḍu manegaḷa madhye sētuve.
    en: Sumitra, Shankar, we old people have made many mistakes. I have too. Admitting a mistake and moving on — that is true greatness. You did that. This child is a bridge between two homes.
  - who: shankar
    t: ಅಮ್ಮಾ, ನಿಮ್ಮ ಮಾತೇ ನಮಗೆ ಆಶೀರ್ವಾದ.
    tr: Ammā, nimma mātē namage āśīrvāda.
    en: (his voice thick) Amma, your words are our blessing.
  - who: ajji
    t: ಮತ್ತೆ ನನ್ನ ಮರಿಮೊಮ್ಮಗಳಿಗೆ… ಮೀರಾ, ಮೀನು, ಮೀನಾಕ್ಷಿ, ಯಾವ ಹೆಸರಾದ್ರೂ ಸರಿ. ಓದು, ಪ್ರಪಂಚ ನೋಡು, ನಿನಗೆ ಸರಿ ಅನ್ನಿಸಿದ್ದನ್ನ ಮಾಡು. ಆದ್ರೆ ಎಲ್ಲಿ ಹೋದ್ರೂ ಈ ಮನೆಯ ದಾರಿ ಮರೀಬೇಡ. ತವರು ಮನೆ ಬಾಗಿಲು ಯಾವಾಗ್ಲೂ ತೆಗೆದೇ ಇರುತ್ತೆ.
    tr: Matte nanna marimommagaḷige… Mīrā, Mīnu, Mīnākṣi, yāva hesarādrū sari. Ōdu, prapañca nōḍu, ninage sari annisiddanna māḍu. Ādre elli hōdrū ī maneya dāri marībēḍa. Tavaru mane bāgilu yāvāglū tegedē irutte.
    en: And to my great-granddaughter... Meera, Meenu, Meenakshi — whatever the name. Study, see the world, do what you feel is right. But wherever you go, don't forget the way to this house. The door of your mother's home will always be open.
  - who: shwe
    t: ಅಜ್ಜಿ, ಈ ಮಾತನ್ನ ನೀವು ಅವಳಿಗೆ ಮತ್ತೆ ಹೇಳಬೇಕು. ಅವಳಿಗೆ ಅರ್ಥ ಆಗೋವಷ್ಟು ದೊಡ್ಡವಳಾದಾಗ. ನಿಮ್ಮ ಬಾಯಿಂದಲೇ.
    tr: Ajji, ī mātanna nīvu avaḷige matte hēḷabēku. Avaḷige artha āgōvaṣṭu doḍḍavaḷādāga. Nimma bāyindalē.
    en: Ajji, you'll have to say this to her again — when she's old enough to understand. From your own mouth.
  - who: ajji
    t: ದೇವರ ದಯೆ ಇದ್ರೆ ಹೇಳ್ತೀನಿ. ಇಲ್ಲಾಂದ್ರೆ… ನೀನು ಹೇಳು. ನೀನು ಹೇಳೋವಾಗ ನಾನು ಅಲ್ಲೇ ಇರ್ತೀನಿ, ಕಣೇ.
    tr: Dēvara daye idre hēḷtīni. Illāndre… nīnu hēḷu. Nīnu hēḷōvāga nānu allē irtīni, kaṇē.
    en: If God is kind, I'll tell her myself. If not... you tell her. When you tell her, I'll be right there, dear.
  - scene: Nobody speaks. In the cradle, the baby yawns, pushes one small fist out of her new frock and falls asleep. Amma gives the cradle one more gentle push.
  - who: amma
    t: ಜೋ ಜೋ… ಮಲಗು ಮೀರಾ. ನಾವೆಲ್ಲಾ ಇಲ್ಲೇ ಇದ್ದೀವಿ.
    tr: Jō jō… malagu Mīrā. Nāvellā illē iddīvi.
    en: Hush, hush... sleep, Meera. We're all right here.
