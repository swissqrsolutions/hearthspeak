    q: ["أَرادَ", "بَيْت", "عَبْد", "اللَّه", "فِي"]
  - who: seller
    t: "كِيلُو سُكَّرِي بِأَرْبَعِينْ، وَنُصّ عَجْوَةْ بِسِتِّينْ. الْمَجْمُوعْ مِيَّةْ."
    tr: "Keelu sukkari bi-arba'een, wa nuss 'ajwa bi-sitteen. Al-majmoo' mayya."
