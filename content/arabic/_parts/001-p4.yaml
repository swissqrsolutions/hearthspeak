    q: ["قالَ", "ى", "فِي", "بَيْت", "عِند", "الَّذِي", "عَلَى", "هِۦ"]
  - who: abukhalid
    t: "هٰذَا حَسَنٌ. وَإِذَا شَكَكْتَ فِي شَيْءٍ، فَاسْأَلْ عَالِمًا، وَلَا تَعْتَمِدْ عَلَى رَأْيِي وَحْدَهْ."
