    q: ["ذا", "إِذا", "فِي", "شَىْء", "سَأَلَ", "لا", "عَلَى", "ى", "هُۥ"]

  - section: "💭 The niyyah"
    learn: "نِيَّةْ = intention, in the heart · نَوَى / يَنْوِي = to intend (انْوِ = intend!) · لَبَّيْكَ عُمْرَةً = Here I am, for Umrah · أَرَادَ / يُرِيدُ = to want — the أَفْعَلَ pattern again · يَسِّرْهَا = make it easy"
  - who: imran
    t: "يَا عَمِّي، كَيْفَ أَنْوِي؟ هَلْ هُنَاكَ كَلِمَاتٌ خَاصَّةٌ؟"
    tr: "Ya 'ammi, kaifa anwi? Hal hunaaka kalimaatun khaassah?"
    en: "Uncle, how do I make the niyyah? Are there special words?"
    q: ["ى", "كَيْف", "هَل", "كَلِمَة"]
  - who: abukhalid
    t: "النِّيَّةُ فِي الْقَلْبِ يَا بُنَيَّ: أَنْ تُرِيدَ بِقَلْبِكَ الدُّخُولَ فِي الْعُمْرَةِ، لِلَّهِ وَحْدَهْ."
    tr: "An-niyyatu fil-qalbi ya bunayya: an tureeda bi-qalbikad-dukhoola fil-'Umrah, lillahi wahdah."
    en: "The niyyah is in the heart, my son: that you want, in your heart, to enter into Umrah — for Allah alone."
    q: ["فِي", "قَلْب", "بُنَىّ", "أَن", "أَرادَ", "كَ", "اللَّه", "هُۥ"]
  - who: abukhalid
    t: "وَمِنَ السُّنَّةِ أَنْ تَقُولَ بِلِسَانِكَ فِي الْمِيقَاتِ: لَبَّيْكَ عُمْرَةً."
    tr: "Wa minas-sunnati an taqoola bi-lisaanika fil-meeqaat: Labbaika 'Umrah."
    en: "And it is sunnah to say aloud at the miqat: Labbaika 'Umrah — here I am, for Umrah."
    q: ["مِن", "أَن", "قالَ", "كَ", "فِي"]
  - who: abukhalid
    t: "وَبَعْضُ النَّاسِ يَقُولُونَ: اللَّهُمَّ إِنِّي أُرِيدُ الْعُمْرَةَ، فَيَسِّرْهَا لِي وَتَقَبَّلْهَا مِنِّي."
    tr: "Wa ba'dun-naasi yaqooloon: Allahumma inni ureedul-'Umrata, fa-yassirha li wa taqabbalha minni."
    en: "And some people say: O Allah, I intend Umrah, so make it easy for me and accept it from me."
    q: ["بَعْض", "ناس", "قالَ", "إِنّ", "ى", "أَرادَ", "هَا", "مِن"]
  - who: imran
    t: "هٰذَا الدُّعَاءُ تَعَلَّمْتُهُ مِنْ كِتَابٍ فِي الْهِنْدِ! وَالْآنَ أَفْهَمُهُ: «يَسِّرْهَا» يَعْنِي اجْعَلْهَا سَهْلَةْ."
    tr: "Haadhad-du'aa'u ta'allamtuhu min kitaabin fil-Hind! Wal-aana afhamuh: «yassirha» ya'ni ij'alha sahlah."
    en: "I learned this du'a from a book in India! And now I understand it: yassirha means make it easy."
    q: ["ذا", "هُۥ", "مِن", "كِتاب", "فِي", "جَعَلَ", "هَا"]
  - who: abukhalid
    t: "أَحْسَنْتَ. وَ«أُرِيدُ» مِنْ «أَرَادَ يُرِيدُ»، عَلَى وَزْنِ «أَفْعَلَ» الَّذِي تَعَلَّمْنَاهُ عَلَى السَّطْحْ."
    tr: "Ahsanta. Wa «ureedu» min «araada yureedu», 'ala wazni «af'ala» alladhi ta'allamnaahu 'alas-sath."
    en: "Well done. And ureedu comes from araada, yureedu — the af'ala pattern we learned on the roof."
    q: ["أَرادَ", "مِن", "عَلَى", "الَّذِي", "نَا", "هُۥ"]

  - section: "📣 Labbayk — the talbiyah, word by word"
    learn: "لَبَّيْكَ = Here I am, answering You, again and again · اللَّهُمَّ = O Allah · شَرِيك = partner (ش ر ك — also شِرْك, associating partners with Allah) · نِعْمَةْ = blessing, favour · مُلْك = dominion, kingship — don't confuse with مَلِك (king), مَلَك (angel), مَالِك (owner, as in مَالِكِ يَوْمِ الدِّينِ)"
  - who: abukhalid
    t: "وَبَعْدَ النِّيَّةِ تَبْدَأُ التَّلْبِيَةَ. قُلْهَا مَعِي، بِبُطْءٍ."
    tr: "Wa ba'dan-niyyati tabda'ut-talbiyah. Qul-ha ma'ee, bi-but'."
    en: "After the niyyah you begin the talbiyah. Say it with me, slowly."
    q: ["بَعْد", "قالَ", "هَا", "مَع", "ى"]
  - who: abukhalid
    t: "لَبَّيْكَ اللَّهُمَّ لَبَّيْكْ."
    tr: "Labbaik Allahumma labbaik."
    en: "Here I am, O Allah, here I am."
    q: ["كَ"]
  - who: imran
    t: "لَبَّيْكَ اللَّهُمَّ لَبَّيْكْ."
    tr: "Labbaik Allahumma labbaik."
    en: "Here I am, O Allah, here I am."
    q: ["كَ"]
  - who: abukhalid
    t: "لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكْ."
    tr: "Labbaika la shareeka laka labbaik."
    en: "Here I am — You have no partner — here I am."
    q: ["كَ", "لا", "شَرِيك"]
  - who: imran
    t: "لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكْ."
    tr: "Labbaika la shareeka laka labbaik."
    en: "Here I am — You have no partner — here I am."
    q: ["كَ", "لا", "شَرِيك"]
  - who: abukhalid
    t: "إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكْ."
    tr: "Innal-hamda wan-ni'mata laka wal-mulk, la shareeka lak."
    en: "All praise and all blessing are Yours, and all dominion. You have no partner."
    q: ["إِنّ", "حَمْد", "نِعْمَة", "كَ", "مُلْك", "لا", "شَرِيك"]
  - who: imran
    t: "إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكْ."
    tr: "Innal-hamda wan-ni'mata laka wal-mulk, la shareeka lak."
    en: "All praise and all blessing are Yours, and all dominion. You have no partner."
    q: ["إِنّ", "حَمْد", "نِعْمَة", "كَ", "مُلْك", "لا", "شَرِيك"]
  - who: imran
    t: "كُنْتُ أَسْمَعُهَا فِي التِّلْفَازِ كُلَّ سَنَةٍ فِي الْحَجِّ. مَا مَعْنَى «لَبَّيْكَ» بِالضَّبْطِ؟"
    tr: "Kuntu asma'uha fit-tilfaazi kulla sanatin fil-Hajj. Ma ma'na «labbaik» bid-dabt?"
    en: "I used to hear it on TV every year during Hajj. What exactly does 'labbaik' mean?"
    q: ["كانَ", "سَمِعَ", "هَا", "فِي", "كُلّ", "ما", "كَ"]
  - who: abukhalid
    t: "«لَبَّيْكَ» يَعْنِي: أَنَا هُنَا يَا رَبِّ، أُجِيبُكَ، ثُمَّ أُجِيبُكَ، مَرَّةً بَعْدَ مَرَّةْ."
    tr: "«Labbaik» ya'ni: ana huna ya Rabbi, ujeebuk, thumma ujeebuk, marratan ba'da marrah."
    en: "Labbaik means: here I am, my Lord, I answer You — and answer You again, time after time."
    q: ["أَنَا۠", "رَبّ", "كَ", "ثُمّ", "بَعْد"]
  - who: abukhalid
    t: "كَأَنَّ اللَّهَ دَعَاكَ، وَأَنْتَ تَرُدُّ: نَعَمْ يَا رَبِّ، جِئْتُ!"
    tr: "Ka-annallaha da'aak, wa anta tarudd: na'am ya Rabbi, ji'tu!"
    en: "As if Allah has called you, and you answer: Yes, my Lord, I've come!"
    q: ["اللَّه", "دَعا", "كَ", "أَنتَ", "رَبّ", "جاءَ"]
  - who: imran
    t: "وَهُوَ دَعَانِي فِعْلًا... مِنْ زِيُورِخْ، عَنْ طَرِيقِ خَالِدٍ، إِلَى هٰذَا الْبَيْتِ، ثُمَّ إِلَى بَيْتِهِ هُوَ."
    tr: "Wa huwa da'aani fi'lan... min Zurich, 'an tareeqi Khaalid, ila haadhal-bait, thumma ila baitihi huwa."
    en: "And He really did call me... from Zurich, through Khalid, to this house — and now to His own House."
    q: ["هُوَ", "دَعا", "ى", "مِن", "عَن", "إِلَى", "ذا", "بَيْت", "ثُمّ", "هِۦ"]
  - who: abukhalid
    t: "«لَا شَرِيكَ لَكَ»: «شَرِيكٌ» مِنْ شِينٍ، رَاءٍ، كَافٍ، وَمِنْهُ «الشِّرْكُ»، أَعْظَمُ الذُّنُوبْ."
    tr: "«La shareeka lak»: «shareek» min sheen, raa', kaaf, wa minhu «ash-shirk», a'zamudh-dhunoob."
    en: "La sharika lak: sharik comes from shin, ra, kaf — and so does shirk, the greatest of sins."
    q: ["لا", "شَرِيك", "كَ", "مِن", "هُۥ"]
  - who: abukhalid
    t: "وَ«النِّعْمَةُ»: كُلُّ خَيْرٍ عِنْدَكَ، صِحَّتُكَ وَعَمَلُكَ وَأَهْلُكَ، كُلُّهُ مِنْهْ."
    tr: "Wan-«ni'mah»: kullu khairin 'indak, sihhatuka wa 'amaluka wa ahluk, kulluhu minh."
    en: "And ni'mah: every good thing you have — your health, your work, your family — all of it is from Him."
    q: ["نِعْمَة", "كُلّ", "خَيْر", "عِند", "كَ", "عَمَل", "أَهْل", "هُۥ", "مِن"]
  - who: abukhalid
    t: "وَ«الْمُلْكُ» بِضَمِّ الْمِيمِ: السُّلْطَانُ عَلَى كُلِّ شَيْءٍ. وَلَا تَخْلِطْ بَيْنَهُ وَبَيْنَ «مَلِكٍ» وَ«مَلَكٍ»."
    tr: "Wal-«mulk» bi-dammil-meem: as-sultaanu 'ala kulli shay'. Wa la takhlit bainahu wa baina «malik» wa «malak»."
    en: "And al-mulk, with u on the meem: authority over everything. Don't mix it up with malik, a king, or malak, an angel."
    q: ["مُلْك", "عَلَى", "كُلّ", "شَىْء", "لا", "بَيْن", "هُۥ", "مَلَك"]
  - who: imran
    t: "«مُلْكٌ»، «مَلِكٌ»، «مَلَكٌ»... وَ«مَالِكِ يَوْمِ الدِّينِ» فِي الْفَاتِحَةْ!"
    tr: "«Mulk», «malik», «malak»... wa «Maaliki Yawmid-Deen» fil-Faatiha!"
    en: "Mulk, malik, malak... and Maliki Yawmid-Din in Al-Fatiha!"
    q: ["مُلْك", "مَلَك", "يَوْم", "دِين", "فِي"]
  - who: abukhalid
    t: "نَعَمْ! كُلُّهَا مِنْ جَذْرٍ وَاحِدٍ. أَرَأَيْتَ؟ الْفَاتِحَةُ وَالصَّلَاةُ وَالتَّلْبِيَةُ، تُكَلِّمُ بَعْضُهَا بَعْضًا."
    tr: "Na'am! Kulluha min jadhrin waahid. A-ra'aita? Al-Faatihatu was-salaatu wat-talbiyah, tukallimu ba'duha ba'dan."
    en: "Yes! All from one root. You see? Al-Fatiha, the prayer and the talbiyah all speak to one another."
    q: ["كُلّ", "هَا", "مِن", "رَأَى", "صَلاة", "بَعْض"]

  - section: "🤲 A du'a for the tawaf"
    learn: "آتَى / يُؤْتِي = to give — the أَفْعَلَ form of أَتَى (to come): 'to make something come to someone' · آتِنَا = give us · دُنْيَا this world · آخِرَةْ the next world · عَذَاب punishment · نَار fire · قِنَا = protect us (from وَقَى)"
  - who: abukhalid
    t: "وَأُعَلِّمُكَ دُعَاءً تَقُولُهُ فِي الطَّوَافِ، بَيْنَ الرُّكْنِ الْيَمَانِيِّ وَالْحَجَرِ الْأَسْوَدِ، كَمَا كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُهْ."
    tr: "Wa u'allimuka du'aa'an taqooluhu fit-tawaaf, bainar-ruknil-yamaaniyyi wal-Hajaril-Aswad, kama kaanan-Nabiyyu sallallahu alaihi wa sallama yaqooluh."
    en: "And I'll teach you a du'a to say in tawaf, between the Yemeni Corner and the Black Stone, as the Prophet, peace be upon him, used to say it."
    q: ["عَلَّمَ", "كَ", "قالَ", "هُۥ", "فِي", "بَيْن", "كانَ", "نَبِيّ", "اللَّه", "عَلَى", "هِۦ"]
  - quran: { s: 2, a: 201 }
    by: abukhalid
    en: "Our Lord, give us good in this world and good in the world to come, and keep us safe from the punishment of the Fire."
  - who: abukhalid
    t: "«آتِنَا»: أَعْطِنَا. مِنْ «آتَى»، عَلَى وَزْنِ «أَفْعَلَ»، مِنْ «أَتَى» أَيْ: جَاءَ. كَأَنَّكَ تَقُولُ: اجْعَلِ الْخَيْرَ يَأْتِينَا."
    tr: "«Aatina»: a'tina. Min «aataa», 'ala wazni «af'ala», min «ataa» ai: jaa'a. Ka-annaka taqool: ij'alil-khaira ya'teena."
    en: "Atina: give us. From ataa, on the af'ala pattern, from ataa, to come. It's as if you're saying: make the good come to us."
    q: ["آتَى", "نَا", "مِن", "عَلَى", "أَتَى", "أَيّ", "جاءَ", "كَ", "قالَ", "جَعَلَ", "خَيْر"]
  - who: abukhalid
    t: "«فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً»: لَمْ يَقُلْ «مَالًا» وَلَا «بَيْتًا»، بَلْ كُلَّ مَا هُوَ حَسَنْ."
    tr: "«Fid-dunya hasanatan wa fil-aakhirati hasanah»: lam yaqul «maalan» wa la «baitan», bal kulla ma huwa hasan."
    en: "Fid-dunya hasanatan wa fil-akhirati hasanah: it doesn't say 'money' or 'a house', but everything that is good."
    q: ["فِي", "دُنْيا", "آخِر", "لَم", "قالَ", "مال", "لا", "بَيْت", "بَل", "كُلّ", "ما", "هُوَ"]
  - who: abukhalid
    t: "«وَقِنَا عَذَابَ النَّارِ»: احْفَظْنَا مِنْ عَذَابِ النَّارْ."
    tr: "«Wa qina 'adhaaban-naar»: ihfazna min 'adhaabin-naar."
    en: "Wa qina 'adhaban-nar: protect us from the punishment of the Fire."
    q: ["نَا", "عَذاب", "نار", "مِن"]
  - who: imran
    t: "دُعَاءٌ قَصِيرٌ، وَفِيهِ كُلُّ شَيْءْ."
    tr: "Du'aa'un qaseer, wa feehi kullu shay'."
    en: "A short du'a, and everything is in it."
    q: ["فِي", "هِۦ", "كُلّ", "شَىْء"]

  - section: "🎁 Farewell gifts"
    learn: "هَدِيَّةْ = gift · خُذْ = take! (from أَخَذَ) · مُحْرِم = someone in ihram · no perfume while in ihram · رَسَمَ / يَرْسُمُ = to draw · دَعَا / يَدْعُو = to pray for, call · وَعَدَ / يَعِدُ = to promise (أَعِدُكَ I promise you)"
  - scene: "Umm Khalid comes in carrying a small carved wooden box. Sara and Faisal follow her, each hiding something behind their back."
  - who: ummkhalid
    t: "يَا عِمْرَانُ، هٰذِهِ هَدِيَّةٌ صَغِيرَةٌ مِنِّي: عُودٌ مِنْ أَحْسَنِ عُودِ جِدَّةْ."
    tr: "Ya Imraan, haadhihi hadiyyatun sagheeratun minni: 'oodun min ahsani 'oodi Jiddah."
    en: "Imran, here's a little gift from me: oud, some of the finest in Jeddah."
    q: ["ذا", "مِن", "ى"]
  - who: ummkhalid
    t: "وَلٰكِنِ انْتَبِهْ! لَا تَتَطَيَّبْ بِهِ وَأَنْتَ مُحْرِمٌ. ضَعْهُ فِي حَقِيبَتِكَ حَتَّى تَنْتَهِيَ عُمْرَتُكْ."
    tr: "Wa laakinin-tabih! La tatatayyab bihi wa anta muhrim. Da'hu fi haqeebatika hatta tantahiya 'Umratuk."
    en: "But careful! Don't put it on while you're in ihram. Keep it in your bag until your Umrah is finished."
    q: ["لٰكِن", "لا", "هِۦ", "أَنتَ", "هُۥ", "فِي", "كَ", "حَتَّى"]
  - who: imran
    t: "جَزَاكِ اللَّهُ خَيْرًا يَا خَالَتِي. رَائِحَتُهُ سَتُذَكِّرُنِي بِهٰذَا الْبَيْتِ دَائِمًا."
    tr: "Jazaakillahu khairan ya khaalati. Raa'ihatuhu sa-tudhakkiruni bi-haadhal-baiti daa'iman."
    en: "Jazak Allahu khairan, auntie. Its scent will always remind me of this house."
    q: ["جَزَى", "كَ", "اللَّه", "خَيْر", "ى", "هُۥ", "ذا", "بَيْت"]
  - who: sara
    t: "وَهٰذِهِ مِنِّي، كَطَبِيبَةٍ: أَمْلَاحٌ تَضَعُهَا فِي الْمَاءِ، وَدَوَاءٌ لِلصُّدَاعِ، وَكِرِيمٌ بِلَا رَائِحَةٍ لِلْقَدَمَيْنْ."
    tr: "Wa haadhihi minni, ka-tabeebah: amlaahun tada'uha fil-maa', wa dawaa'un lis-sudaa', wa kireemun bila raa'ihatin lil-qadamain."
    en: "And this is from me, as a doctor: rehydration salts to put in water, medicine for headaches, and an unscented cream for your feet."
    q: ["ذا", "مِن", "ى", "هَا", "فِي", "ماء", "لا"]
  - who: sara
    t: "وَاشْرَبِ الْمَاءَ كَثِيرًا. فِي الطَّوَافِ وَالسَّعْيِ قَدْ تَمْشِي أَكْثَرَ مِنْ خَمْسَةِ كِيلُومِتْرَاتْ."
    tr: "Washrabil-maa'a katheeran. Fit-tawaafi was-sa'yi qad tamshi akthara min khamsati keelumitraat."
    en: "And drink plenty of water. Between tawaf and sa'i you may walk more than five kilometres."
    q: ["ماء", "كَثِير", "فِي", "قَد", "أَكْثَر", "مِن"]
  - who: faisal
    t: "وَأَنَا رَسَمْتُ لَكَ الْكَعْبَةَ! انْظُرْ، وَهٰذَا أَنْتَ، بِالْإِحْرَامِ الْأَبْيَضْ!"
    tr: "Wa ana rasamtu lakal-Ka'bah! Unzur, wa haadha anta, bil-ihraamil-abyad!"
    en: "And I drew you the Kaaba! Look, and that's you, in the white ihram!"
    q: ["أَنَا۠", "كَ", "نَظَرَ", "ذا", "أَنتَ"]
  - who: imran
    t: "يَا فَيْصَلُ، هٰذِهِ أَجْمَلُ لَوْحَةٍ رَأَيْتُهَا! سَأَضَعُهَا فِي مَكْتَبِي فِي زِيُورِخْ."
    tr: "Ya Faisal, haadhihi ajmalu lawhatin ra'aituha! Sa-ada'uha fi maktabi fi Zurich."
    en: "Faisal, this is the most beautiful picture I've ever seen! I'll put it up in my office in Zurich."
    q: ["ذا", "رَأَى", "هَا", "فِي", "ى"]
  - who: faisal
    t: "وَادْعُ لِي أَنْ أَنْجَحَ فِي الرِّيَاضِيَّاتْ!"
    tr: "Wad'u li an anjaha fir-riyaadiyyaat!"
    en: "And pray for me to pass maths!"
    q: ["دَعا", "ى", "أَن", "فِي"]
  - who: imran
    t: "أَعِدُكَ، إِنْ شَاءَ اللَّهْ."
    tr: "A'iduk, Insha Allah."
    en: "I promise, Insha Allah."
    q: ["وَعَدَ", "كَ", "إِن", "شاءَ", "اللَّه"]

  - section: "📜 Abu Khalid's advice"
    learn: "Commands: اصْبِرْ be patient (صَبَرَ / يَصْبِرُ) · اذْكُرْ remember (ذَكَرَ / يَذْكُرُ) · أَكْثِرْ do much of (أَفْعَلَ again) · قِفْ stop, stand · الذِّكْر = remembrance of Allah · غَيْرَكَ = others besides you"
  - scene: "Abu Khalid stands, takes an old mushaf from the shelf and holds it in both hands. Its margins are full of tiny notes in his handwriting."
  - who: abukhalid
    t: "وَهٰذَا مِنِّي: مُصْحَفِي الَّذِي دَرَّسْتُ مِنْهُ أَرْبَعِينَ سَنَةً. فِي هَوَامِشِهِ مَعَانِي الْكَلِمَاتْ."
    tr: "Wa haadha minni: mus-hafi alladhi darrastu minhu arba'eena sanah. Fi hawaamishihi ma'aanil-kalimaat."
    en: "And this is from me: the mushaf I taught from for forty years. The meanings of the words are written in its margins."
    q: ["ذا", "مِن", "ى", "الَّذِي", "هُۥ", "فِي", "هِۦ", "كَلِمَة"]
  - who: imran
    t: "يَا عَمِّي... لَا أَسْتَطِيعُ أَنْ آخُذَ هٰذَا. هٰذَا كَثِيرٌ جِدًّا."
    tr: "Ya 'ammi... la astatee'u an aakhudha haadha. Haadha katheerun jiddan."
    en: "(overwhelmed) Uncle... I can't take this. This is far too much."
    q: ["ى", "لا", "اسْتَطاعَ", "أَن", "أَخَذَ", "ذا", "كَثِير"]
  - who: abukhalid
    t: "خُذْهُ. الْعِلْمُ الَّذِي لَا يَنْتَقِلُ يَمُوتُ. وَأَنْتَ سَتُعَلِّمُ غَيْرَكَ يَوْمًا مَا."
    tr: "Khudh-hu. Al-'ilmul-ladhi la yantaqilu yamoot. Wa anta satu'allimu ghairaka yawman ma."
    en: "Take it. Knowledge that isn't passed on dies. And one day you will teach others."
    q: ["أَخَذَ", "هُۥ", "عِلْم", "الَّذِي", "لا", "ماتَ", "أَنتَ", "عَلَّمَ", "غَيْر", "كَ", "يَوْم", "ما"]
  - who: abukhalid
    t: "وَاسْمَعْ نَصِيحَتِي. أَوَّلًا: اصْبِرْ. فِي الزِّحَامِ سَتَرَى مَا يُغْضِبُكَ، فَلَا تَغْضَبْ."
    tr: "Wasma' naseehati. Awwalan: isbir. Fiz-zihaami sataraa ma yughdibuk, fa-la taghdab."
    en: "And listen to my advice. First: be patient. In the crowds you'll see things that make you angry — so don't get angry."
    q: ["سَمِعَ", "ى", "أَوَّل", "صَبَرَ", "فِي", "رَأَى", "ما", "كَ", "لا"]
  - who: abukhalid
    t: "ثَانِيًا: أَكْثِرْ مِنَ الذِّكْرِ وَالدُّعَاءِ، وَلَا تَشْغَلْ نَفْسَكَ بِالتَّصْوِيرِ وَالْهَاتِفْ."
    tr: "Thaaniyan: akthir minadh-dhikri wad-du'aa', wa la tashghal nafsaka bit-tasweeri wal-haatif."
    en: "Second: do plenty of dhikr and du'a, and don't keep yourself busy with photos and your phone."
    q: ["مِن", "ذِكْر", "لا", "نَفْس", "كَ"]
  - who: abukhalid
    t: "ثَالِثًا: عِنْدَمَا تَرَى الْكَعْبَةَ أَوَّلَ مَرَّةٍ، لَا تَسْتَعْجِلْ. قِفْ، وَانْظُرْ، وَادْعُ بِمَا فِي قَلْبِكْ."
    tr: "Thaalithan: 'indama taral-Ka'bata awwala marrah, la tasta'jil. Qif, wanzur, wad'u bima fi qalbik."
    en: "Third: when you see the Kaaba for the first time, don't rush. Stop, look, and make du'a with whatever is in your heart."
    q: ["عِند", "ما", "رَأَى", "أَوَّل", "لا", "نَظَرَ", "دَعا", "فِي", "قَلْب", "كَ"]
  - who: abukhalid
    t: "وَاذْكُرْ دَائِمًا أَنَّكَ لَسْتَ هُنَاكَ بِقُوَّتِكَ، بَلْ بِرَحْمَتِهِ هُوَ."
    tr: "Wadhkur daa'iman annaka lasta hunaaka bi-quwwatik, bal bi-rahmatihi huwa."
    en: "And always remember: you aren't there by your own strength, but by His mercy."
    q: ["ذَكَرَ", "أَنّ", "كَ", "لَيْسَ", "بَل", "رَحْمَة", "هِۦ", "هُوَ"]
  - who: imran
    t: "سَأَذْكُرُ، إِنْ شَاءَ اللَّهُ. وَسَأَذْكُرُكُمْ جَمِيعًا هُنَاكَ، فِي كُلِّ دُعَاءْ."
    tr: "Sa-adhkur, Insha Allah. Wa sa-adhkurukum jamee'an hunaak, fi kulli du'aa'."
    en: "I will remember, Insha Allah. And I'll remember all of you there, in every du'a."
    q: ["ذَكَرَ", "إِن", "شاءَ", "اللَّه", "كُمْ", "جَمِيع", "فِي", "كُلّ"]
  - who: ummkhalid
    t: "نَمْ مُبَكِّرًا يَا وَلَدِي. الْفَجْرُ قَرِيبْ."
    tr: "Nam mubakkiran ya waladi. Al-Fajru qareeb."
    en: "Get to bed early, my boy. Fajr is close."
    q: ["وَلَد", "ى"]

  - section: "🤍 Before dawn"
    learn: "إِزَار = the lower ihram cloth · رِدَاء = the upper cloth, over the shoulders · قِطْعَتَانِ بَيْضَاوَانِ = two white pieces (dual) · لَا … وَلَا … = neither … nor … · سَيَّارَةْ = car (in the Quran, سَيَّارَةْ is a travelling caravan, 12:10) · بِسْمِ اللَّهِ (Bismillah) — اسْم, name"
  - scene: "Half past four in the morning. Imran has had his ghusl. In the guest room he wraps the white izar around his waist, then lays the rida over his shoulders. He stands in front of the mirror for a long time."
  - who: imran
    t: "إِزَارٌ وَرِدَاءٌ... قِطْعَتَانِ بَيْضَاوَانِ، وَلَا شَيْءَ غَيْرُهُمَا."
    tr: "Izaarun wa ridaa'... qit'ataani baidaawaan, wa la shai'a ghairuhuma."
    en: "(to himself) An izar and a rida... two white cloths, and nothing else."
    q: ["لا", "شَىْء", "غَيْر"]
  - who: imran
    t: "لَا مُهَنْدِسَ، وَلَا زِيُورِخْ، وَلَا بِنْغَالُورَ... عَبْدٌ فَقَطْ، يَقِفُ أَمَامَ رَبِّهْ."
    tr: "La muhandisa, wa la Zurich, wa la Bengaluru... 'abdun faqat, yaqifu amaama Rabbih."
    en: "No engineer, no Zurich, no Bengaluru... just a servant, standing before his Lord."
    q: ["لا", "عَبْد", "رَبّ", "هِۦ"]
  - scene: "A soft knock at the door. Abu Khalid and Khalid stand in the corridor. Khalid holds the car keys; Abu Khalid's eyes are wet."
  - who: khalid
    t: "السَّيَّارَةُ جَاهِزَةٌ يَا أَخِي."
    tr: "As-sayyaaratu jaahizatun ya akhi."
    en: "The car's ready, brother."
    q: ["أَخ", "ى"]
  - who: abukhalid
    t: "بِسْمِ اللَّهِ. مَكَّةُ تَنْتَظِرُكَ يَا بُنَيَّ."
    tr: "Bismillah. Makkatu tantaziruka ya bunayya."
    en: "(smiling at the white figure in the doorway) Bismillah. Makkah is waiting for you, my son."
    q: ["اسْم", "اللَّه", "كَ", "بُنَىّ"]
  - who: imran
    t: "بِسْمِ اللَّهِ... تَوَكَّلْتُ عَلَى اللَّهْ."
    tr: "Bismillah... tawakkaltu 'alallah."
    en: "(taking a deep breath) Bismillah... I put my trust in Allah."
    q: ["اسْم", "اللَّه", "تَوَكَّلْ", "عَلَى"]
  - scene: "Imran picks up his small bag and steps out into the dark street. The engine starts. Somewhere ahead, beyond the hills, is the miqat — and Makkah."
