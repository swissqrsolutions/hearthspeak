  - section: "👡 Sandals"
    learn: "Comparatives on أَفْعَل again: أَكْبَر bigger · أَصْغَر smaller · أَغْلَى more expensive · Hijazi إِيوَه = نَعَمْ (yes) · أَكِيد = sure · مَقَاس = size · ص in صَغِير is a heavy s, from deeper in the mouth than س"
