    q: ["مِن", "بَحْر", "كانَ", "أَخْرَجَ", "هُۥ"]
  - who: faisal
    t: "وَهٰذَا بَيْتُ نَصِيفٍ! جَدِّي يَقُولُ إِنَّ الْمَلِكَ عَبْدَ الْعَزِيزِ نَزَلَ فِيهْ."
    tr: "Wa haadha Baitu Naseef! Jaddi yaqoolu innal-Malika 'Abdal-'Azeezi nazala feeh."
