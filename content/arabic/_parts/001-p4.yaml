lines:
  - chapter: "Chapter 7 — A night on the roof"
  - section: "🌙 After Isha, on the roof"
    learn: "يَا + name: يَا عِمْرَانُ · بُنَيَّ = 'my dear son' (the word Luqman uses for his son, 31:13) · كُنْتُ + present verb = 'I used to …' · pausal form: the last vowel drops at the end of a sentence (fil-lail, not fil-laili)"
  - scene: "The flat roof of the Al-Harbi house, after Isha. The air is cool, a breeze comes in from the Red Sea, and the lights of Jeddah stretch to the horizon. Abu Khalid sets out two plastic chairs and a flask of tea."
  - who: abukhalid
    t: "تَعَالَ يَا عِمْرَانُ، اجْلِسْ هُنَا مَعِي. الْهَوَاءُ هُنَا جَمِيلٌ فِي اللَّيْلْ."
    tr: "Ta'aala ya Imraan, ijlis huna ma'ee. Al-hawaa'u huna jameelun fil-lail."
    en: "Come, Imran, sit here with me. The air up here is lovely at night."
    q: ["مَع", "ى", "فِي", "لَيْل"]
  - who: imran
    t: "شُكْرًا يَا عَمِّي. مَا أَجْمَلَ هٰذَا الْمَكَانْ!"
    tr: "Shukran ya 'ammi. Ma ajmala haadhal-makaan!"
    en: "Thank you, uncle. What a beautiful place this is!"
    q: ["ى", "ما", "ذا"]
  - who: abukhalid
    t: "كُنْتُ أَجْلِسُ هُنَا مَعَ خَالِدٍ وَهُوَ صَغِيرٌ، وَكُنَّا نَقْرَأُ الْقُرْآنَ مَعًا."
    tr: "Kuntu ajlisu huna ma'a Khaalidin wa huwa sagheer, wa kunna naqra'ul-Quraana ma'an."
    en: "I used to sit here with Khalid when he was little, and we read the Quran together."
    q: ["كانَ", "مَع", "هُوَ", "قُرْءان"]
  - who: imran
    t: "خَالِدٌ عَلَّمَنِي الْفَاتِحَةَ فِي زِيُورِخْ. الْآنَ أَفْهَمُ مَا أَقُولُ فِي صَلَاتِي."
    tr: "Khaalidun 'allamanil-Faatiha fi Zurich. Al-aana afhamu ma aqoolu fi salaati."
    en: "Khalid taught me Al-Fatiha in Zurich. Now I understand what I say in my prayer."
    q: ["عَلَّمَ", "فِي", "ما", "قالَ", "صَلاة", "ى"]
  - who: abukhalid
    t: "الْحَمْدُ لِلَّهِ. وَاللَّيْلَةَ نُكْمِلُ: كُلُّ كَلِمَةٍ فِي الصَّلَاةِ، مِنَ التَّكْبِيرِ إِلَى السَّلَامْ."
    tr: "Alhamdulillah. Wal-lailata nukmil: kullu kalimatin fis-salaah, minat-takbeeri ilas-salaam."
    en: "Alhamdulillah. Tonight we go on: every word of the prayer, from the takbir to the salam."
    q: ["حَمْد", "اللَّه", "كُلّ", "كَلِمَة", "فِي", "صَلاة", "مِن", "إِلَى", "سَلام"]
  - who: imran
    t: "هٰذَا مَا أُرِيدُهُ مُنْذُ سِنِينَ. أُصَلِّي كُلَّ يَوْمٍ، وَلٰكِنْ لَا أَفْهَمُ إِلَّا قَلِيلًا."
    tr: "Haadha ma ureeduhu mundhu sineen. Usalli kulla yawm, wa laakin la afhamu illa qaleelan."
    en: "This is what I've wanted for years. I pray every day, but I understand only a little."
    q: ["ذا", "ما", "أَرادَ", "هُۥ", "كُلّ", "يَوْم", "لٰكِن", "لا", "إِلّا", "قَلِيل"]
  - who: abukhalid
    t: "لَا بَأْسَ يَا بُنَيَّ. الْفَهْمُ يَأْتِي قَلِيلًا قَلِيلًا، مِثْلَ الْمَاءِ فِي الْأَرْضْ."
    tr: "La ba'sa ya bunayya. Al-fahmu ya'ti qaleelan qaleelan, mithlal-maa'i fil-ard."
    en: "Never mind, my son. Understanding comes little by little, like water sinking into the earth."
    q: ["لا", "بُنَىّ", "أَتَى", "قَلِيل", "مِثْل", "ماء", "فِي", "أَرْض"]

  - section: "📢 Allahu Akbar — the takbir"
    learn: "ك ب ر: كَبِير = big, great → أَكْبَر = greater, greatest (pattern أَفْعَل, 'more …') · ق is not ک: it comes from deep in the throat · كُلّ شَيْء = everything"
  - who: abukhalid
    t: "أَوَّلُ كَلِمَةٍ فِي الصَّلَاةِ: اللَّهُ أَكْبَرُ. مَا مَعْنَاهَا؟"
    tr: "Awwalu kalimatin fis-salaah: Allahu Akbar. Ma ma'naaha?"
    en: "The first word of the prayer: Allahu Akbar. What does it mean?"
    q: ["أَوَّل", "كَلِمَة", "فِي", "صَلاة", "اللَّه", "ما", "هَا"]
  - who: imran
    t: "اللَّهُ كَبِيرْ؟"
    tr: "Allahu kabeer?"
    en: "God is great?"
    q: ["اللَّه", "كَبِير"]
  - who: abukhalid
    t: "قَرِيبٌ. «كَبِيرٌ» يَعْنِي عَظِيمٌ، وَلٰكِنَّ «أَكْبَرُ» أَكْثَرُ: اللَّهُ أَكْبَرُ مِنْ كُلِّ شَيْءْ."
    tr: "Qareeb. «Kabeer» ya'ni 'azeem, wa laakinna «Akbar» akthar: Allahu akbaru min kulli shay'."
    en: "Close. Kabeer means great, but Akbar says more: Allah is greater than everything."
    q: ["كَبِير", "عَظِيم", "لٰكِنّ", "أَكْثَر", "اللَّه", "مِن", "كُلّ", "شَىْء"]
  - who: abukhalid
    t: "أَكْبَرُ مِنْ عَمَلِكَ، وَمِنْ هُمُومِكَ، وَمِنَ الدُّنْيَا كُلِّهَا."
    tr: "Akbaru min 'amalik, wa min humoomik, wa minad-dunya kulliha."
    en: "Greater than your work, greater than your worries, greater than the whole world."
    q: ["مِن", "عَمَل", "كَ", "دُنْيا", "كُلّ", "هَا"]
  - who: imran
    t: "لِذٰلِكَ نَرْفَعُ أَيْدِيَنَا، كَأَنَّنَا نَتْرُكُ الدُّنْيَا وَرَاءَنَا؟"
    tr: "Li-dhaalika narfa'u aideena, ka-annana natrukud-dunya waraa'ana?"
    en: "Is that why we raise our hands — as if we're leaving the world behind us?"
    q: ["ذا", "يَد", "نَا", "تَرَكَ", "دُنْيا"]
  - who: abukhalid
    t: "هٰكَذَا قَالَ بَعْضُ الْعُلَمَاءِ. أَحْسَنْتَ!"
    tr: "Haakadha qaala ba'dul-'ulamaa'. Ahsanta!"
    en: "That is how some scholars explained it. Well done!"
    q: ["قالَ", "بَعْض"]

  - section: "🤲 Subhanakallahumma — the opening"
    learn: "ح in سُبْحَان is a breathy h from the throat, not ہ · ض (ضَبْط) is a heavy d — Urdu says 'z' (zabt), Saudis say a deep 'd' · ظ (تَظُنُّ) is a heavy dh — Urdu says 'z' · غَيْر = other than"
  - who: imran
    t: "بَعْدَ التَّكْبِيرِ أَقُولُ: سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ. هٰذَا مَا تَعَلَّمْتُهُ فِي بِنْغَالُورْ."
    tr: "Ba'dat-takbeer aqool: Subhanakallahumma wa bihamdik. Haadha ma ta'allamtuhu fi Bengaluru."
    en: "After the takbir I say: Subhanakallahumma wa bihamdika. That's what I learned in Bengaluru."
    q: ["بَعْد", "قالَ", "سُبْحان", "كَ", "حَمْد", "ذا", "ما", "هُۥ", "فِي"]
  - who: abukhalid
    t: "نَعَمْ، وَهُوَ دُعَاءٌ جَمِيلٌ. «سُبْحَانَ» يَعْنِي: اللَّهُ بَعِيدٌ عَنْ كُلِّ نَقْصٍ وَكُلِّ عَيْبْ."
    tr: "Na'am, wa huwa du'aa'un jameel. «Subhaan» ya'ni: Allahu ba'eedun 'an kulli naqsin wa kulli 'aib."
    en: "Yes, and it's a beautiful du'a. Subhan means: Allah is far above every flaw and every fault."
    q: ["هُوَ", "سُبْحان", "اللَّه", "عَن", "كُلّ"]
  - who: abukhalid
    t: "وَ«تَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلٰهَ غَيْرُكَ»: لَا أَحَدَ يَسْتَحِقُّ الْعِبَادَةَ بِحَقٍّ إِلَّا هُوَ."
    tr: "Wa «tabaarakasmuka, wa ta'aala jadduka, wa la ilaaha ghairuk»: la ahada yastahiqqul-'ibaadata bi-haqqin illa huwa."
    en: "And 'Blessed is Your name, high is Your majesty, there is no god other than You': no one truly deserves worship except Him."
    q: ["اسْم", "كَ", "لا", "إِلٰه", "غَيْر", "أَحَد", "حَقّ", "إِلّا", "هُوَ"]
  - who: imran
    t: "«إِلٰهَ»... هٰذِهِ هِيَ الْكَلِمَةُ فِي «لَا إِلٰهَ إِلَّا اللَّهُ»!"
    tr: "«Ilaaha»... haadhihi hiyal-kalimatu fi «La ilaaha illallah»!"
    en: "Ilah... that's the word in La ilaha illallah!"
    q: ["إِلٰه", "ذا", "هِىَ", "كَلِمَة", "فِي", "لا", "إِلّا", "اللَّه"]
  - who: abukhalid
    t: "بِالضَّبْطِ. أَنْتَ تَعْرِفُ كَلِمَاتٍ أَكْثَرَ مِمَّا تَظُنّ."
    tr: "Bid-dabt. Anta ta'rifu kalimaatin akthara mimma tazunn."
    en: "Exactly. You know more words than you think."
    q: ["أَنتَ", "كَلِمَة", "أَكْثَر", "مِن", "ما", "ظَنَّ"]

  - section: "🙇 Ruku' — bowing, and the idea of a root"
    learn: "Most Arabic words grow from a 3-letter root (جَذْر). ر ك ع: رَكَعَ he bowed · يَرْكَعُ he bows · رُكُوع bowing · رَاكِع one who bows. س ج د: سَجَدَ · يَسْجُدُ · سُجُود · مَسْجِد (place of sujud) · ذ in جَذْر = 'dh' as in 'this' — Urdu says 'z' (jazr), Saudis say jadhr"
  - who: abukhalid
    t: "ثُمَّ تَقْرَأُ الْفَاتِحَةَ، وَبَعْدَهَا سُورَةً، ثُمَّ تَرْكَعُ. مَاذَا تَقُولُ فِي الرُّكُوعْ؟"
    tr: "Thumma taqra'ul-Faatiha, wa ba'daha Surah, thumma tarka'. Maadha taqoolu fir-rukoo'?"
    en: "Then you recite Al-Fatiha, then a surah, then you bow. What do you say in ruku'?"
    q: ["ثُمّ", "بَعْد", "هَا", "ما", "ذا", "قالَ", "فِي"]
  - who: imran
    t: "سُبْحَانَ رَبِّيَ الْعَظِيمْ."
    tr: "Subhana Rabbiyal Azeem."
    en: "Glory be to my Lord, the Most Great."
    q: ["سُبْحان", "رَبّ", "ى", "عَظِيم"]
  - who: abukhalid
    t: "«رَبِّي» يَعْنِي: رَبِّي أَنَا، الَّذِي خَلَقَنِي وَيَرْعَانِي. وَ«الْعَظِيمُ»: الْكَبِيرُ جِدًّا فِي قُدْرَتِهِ وَشَأْنِهْ."
    tr: "«Rabbi» ya'ni: Rabbi ana, alladhi khalaqani wa yar'aani. Wal-«'Azeem»: al-kabeeru jiddan fi qudratihi wa sha'nih."
    en: "Rabbi means my own Lord — the one who created me and looks after me. And Al-Azeem: immensely great in His power and His rank."
    q: ["رَبّ", "ى", "أَنَا۠", "الَّذِي", "خَلَقَ", "عَظِيم", "كَبِير", "فِي", "هِۦ"]
  - who: abukhalid
    t: "فِي الرُّكُوعِ ظَهْرُكَ مُنْحَنٍ، وَلِسَانُكَ يَقُولُ: رَبِّي هُوَ الْعَظِيمُ، لَسْتُ أَنَا."
    tr: "Fir-rukoo'i dhahruka munhanin, wa lisaanuka yaqool: Rabbi huwal-'Azeem, lastu ana."
    en: "In ruku' your back is bent, and your tongue says: my Lord is the Great One — not me."
    q: ["فِي", "كَ", "قالَ", "رَبّ", "ى", "هُوَ", "عَظِيم", "لَيْسَ", "أَنَا۠"]
  - who: imran
    t: "سُبْحَانَ اللَّهِ... أَقُولُهَا مُنْذُ ثَلَاثِينَ سَنَةً، وَلَمْ أَسْمَعْ مَعْنَاهَا أَبَدًا."
    tr: "Subhanallah... aqooluha mundhu thalaatheena sanah, wa lam asma' ma'naaha abadan."
    en: "Subhanallah... I've been saying it for thirty years and never once heard what it means."
    q: ["سُبْحان", "اللَّه", "قالَ", "هَا", "لَم", "سَمِعَ"]
  - who: abukhalid
    t: "وَالْآنَ سَمِعْتَهُ. وَالْآنَ نَتَعَلَّمُ شَيْئًا مُهِمًّا جِدًّا: الْجَذْرْ."
    tr: "Wal-aana sami'tah. Wal-aana nata'allamu shai'an muhimman jiddan: al-jadhr."
    en: "And now you've heard it. And now we learn something very important: the root."
    q: ["سَمِعَ", "هُۥ", "شَىْء"]
  - who: imran
    t: "الْجَذْرُ؟ مِثْلَ جَذْرِ الشَّجَرَةْ؟"
    tr: "Al-jadhr? Mithla jadhrish-shajarah?"
    en: "The root? Like the root of a tree?"
    q: ["مِثْل"]
  - who: abukhalid
    t: "نَعَمْ. أَكْثَرُ كَلِمَاتِ الْعَرَبِيَّةِ لَهَا جَذْرٌ مِنْ ثَلَاثَةِ حُرُوفٍ. مِثَالٌ: رَاءٌ، كَافٌ، عَيْنْ."
    tr: "Na'am. Aktharu kalimaatil-'Arabiyyati laha jadhrun min thalaathati huroof. Mithaal: raa', kaaf, 'ain."
    en: "Yes. Most Arabic words have a root of three letters. For example: ra, kaf, 'ain."
    q: ["أَكْثَر", "كَلِمَة", "هَا", "مِن"]
  - who: abukhalid
    t: "مِنْ هٰذَا الْجَذْرِ: رَكَعَ، يَرْكَعُ، رُكُوعٌ، رَاكِعٌ. كُلُّهَا فِيهَا مَعْنَى الِانْحِنَاءْ."
    tr: "Min haadhal-jadhr: raka'a, yarka'u, rukoo', raaki'. Kulluha feeha ma'nal-inhinaa'."
    en: "From this root: raka'a (he bowed), yarka'u (he bows), ruku' (bowing), raki' (someone bowing). All of them carry the meaning of bending."
    q: ["مِن", "ذا", "كُلّ", "هَا", "فِي"]
  - who: imran
    t: "وَسَجَدَ؟ يَسْجُدُ، سُجُودٌ... وَمَسْجِدٌ!"
    tr: "Wa sajada? Yasjudu, sujood... wa masjid!"
    en: "And sajada? Yasjudu, sujud... and masjid!"
    q: []
  - who: abukhalid
    t: "مَا شَاءَ اللَّهُ! الْمَسْجِدُ: مَكَانُ السُّجُودِ. أَنْتَ الْآنَ تَفْهَمُ الْعَرَبِيَّةَ مِنَ الدَّاخِلْ."
    tr: "Masha Allah! Al-Masjid: makaanus-sujood. Antal-aana tafhamul-'Arabiyyata minad-daakhil."
    en: "Masha Allah! Masjid: the place of sujud. Now you're understanding Arabic from the inside."
    q: ["ما", "شاءَ", "اللَّه", "أَنتَ", "مِن"]

  - section: "🧩 The pattern فَعَلَ / يَفْعَلُ"
    learn: "Past = فَعَلَ (fa'ala, 'he did'); present = يَفْعَلُ (yaf'alu, 'he does'). Put any root into the pattern: عَلِمَ / يَعْلَمُ (know) · سَمِعَ / يَسْمَعُ (hear) · جَعَلَ / يَجْعَلُ (make) · أَخَذَ / يَأْخُذُ (take). One root, many words: عِلْم knowledge · عَلِيم all-knowing · عَلَّمَ taught · مُعَلِّم teacher"
  - who: abukhalid
    t: "اسْمَعْ هٰذَا الْوَزْنَ: فَعَلَ، يَفْعَلُ. «فَعَلَ» لِلْمَاضِي، وَ«يَفْعَلُ» لِلْحَاضِرْ."
    tr: "Isma' haadhal-wazn: fa'ala, yaf'alu. «Fa'ala» lil-maadi, wa «yaf'alu» lil-haadir."
    en: "Listen to this pattern: fa'ala, yaf'alu. Fa'ala is for the past, yaf'alu for the present."
    q: ["سَمِعَ", "ذا", "فَعَلَ"]
  - who: abukhalid
    t: "عَلِمَ يَعْلَمُ، سَمِعَ يَسْمَعُ، جَعَلَ يَجْعَلُ. كُلُّهَا عَلَى هٰذَا الْوَزْنْ."
    tr: "'Alima ya'lamu, sami'a yasma'u, ja'ala yaj'alu. Kulluha 'ala haadhal-wazn."
    en: "'Alima, ya'lamu (know); sami'a, yasma'u (hear); ja'ala, yaj'alu (make). All of them follow this pattern."
    q: ["عَلِمَ", "سَمِعَ", "جَعَلَ", "كُلّ", "هَا", "عَلَى", "ذا"]
  - who: imran
    t: "وَفِي الْقُرْآنِ: «يَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ»؟"
    tr: "Wa fil-Quran: «Ya'lamu ma fis-samaawaati wa ma fil-ard»?"
    en: "And in the Quran: 'He knows what is in the heavens and what is on the earth'?"
    q: ["فِي", "قُرْءان", "عَلِمَ", "ما", "سَماء", "أَرْض"]
  - who: abukhalid
    t: "نَعَمْ! «يَعْلَمُ»: هُوَ يَعْلَمُ الْآنَ وَدَائِمًا. وَ«عَلِيمٌ»: الَّذِي يَعْلَمُ كُلَّ شَيْءْ."
    tr: "Na'am! «Ya'lamu»: huwa ya'lamul-aana wa daa'iman. Wa «'Aleem»: alladhi ya'lamu kulla shay'."
    en: "Yes! Ya'lamu: He knows, now and always. And 'Aleem: the One who knows everything."
    q: ["عَلِمَ", "هُوَ", "عَلِيم", "الَّذِي", "كُلّ", "شَىْء"]
  - who: imran
    t: "عِلْمٌ، عَلِيمٌ، يَعْلَمُ، عَلَّمَ... كُلُّهَا مِنْ عَيْنٍ، لَامٍ، مِيمْ!"
    tr: "'Ilm, 'Aleem, ya'lamu, 'allama... kulluha min 'ain, laam, meem!"
    en: "'Ilm, 'Aleem, ya'lamu, 'allama... all from 'ain, lam, meem!"
    q: ["عِلْم", "عَلِيم", "عَلِمَ", "عَلَّمَ", "كُلّ", "هَا", "مِن"]
  - who: abukhalid
    t: "الْآنَ صِرْتَ مِثْلَ طُلَّابِي الْقُدَمَاءِ. كُنْتُ مُعَلِّمًا أَرْبَعِينَ سَنَةً، وَهٰذِهِ اللَّحْظَةُ أَحَبُّ شَيْءٍ إِلَيَّ: عِنْدَمَا يَرَى الطَّالِبُ الْجَذْرْ."
    tr: "Al-aana sirta mithla tullaabil-qudamaa'. Kuntu mu'alliman arba'eena sanah, wa haadhihil-lahzatu ahabbu shai'in ilayya: 'indama yarat-taalibul-jadhr."
    en: "(laughing) Now you're like my old students. I was a teacher for forty years, and this is the moment I love most: when a student sees the root."
    q: ["مِثْل", "ى", "كانَ", "ذا", "شَىْء", "إِلَى", "عِند", "ما", "رَأَى"]

  - section: "↕️ Rising from ruku', then sujud"
    learn: "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ — a past verb used as a prayer: 'may Allah hear' · مَنْ = whoever, who · الْأَعْلَى = the Most High (أَفْعَل again, like أَكْبَر) · ث in يُثْنِي = 'th' as in 'think' — Urdu says 's'"
  - who: abukhalid
    t: "ثُمَّ تَرْفَعُ مِنَ الرُّكُوعِ. مَاذَا يَقُولُ الْإِمَامْ؟"
    tr: "Thumma tarfa'u minar-rukoo'. Maadha yaqoolul-imaam?"
    en: "Then you rise from ruku'. What does the imam say?"
    q: ["ثُمّ", "مِن", "ما", "ذا", "قالَ"]
  - who: imran
    t: "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ. وَنَحْنُ نَقُولُ: رَبَّنَا وَلَكَ الْحَمْدْ."
    tr: "Sami'allahu liman hamidah. Wa nahnu naqool: Rabbana wa lakal-hamd."
    en: "Sami'allahu liman hamidah. And we say: Rabbana wa lakal hamd."
    q: ["سَمِعَ", "اللَّه", "مَن", "هُۥ", "نَحْنُ", "قالَ", "رَبّ", "نَا", "كَ", "حَمْد"]
  - who: abukhalid
    t: "«سَمِعَ» فِعْلٌ مَاضٍ، عَلَى وَزْنِ «فَعَلَ». وَلٰكِنَّ مَعْنَاهُ هُنَا: اللَّهُ يَسْمَعُ وَيَقْبَلْ."
    tr: "«Sami'a» fi'lun maadin, 'ala wazni «fa'ala». Wa laakinna ma'naahu huna: Allahu yasma'u wa yaqbal."
    en: "Sami'a is a past verb on the fa'ala pattern. But here it means: Allah hears and accepts."
    q: ["سَمِعَ", "عَلَى", "فَعَلَ", "لٰكِنّ", "هُۥ", "اللَّه"]
  - who: abukhalid
    t: "«لِمَنْ حَمِدَهُ»: لِكُلِّ مَنْ يَحْمَدُهُ، أَيْ: يَشْكُرُهُ وَيُثْنِي عَلَيْهْ."
    tr: "«Liman hamidah»: li-kulli man yahmaduh, ai: yashkuruhu wa yuthni 'alaih."
    en: "Liman hamidah: for everyone who praises Him — that is, who thanks Him and speaks well of Him."
    q: ["مَن", "كُلّ", "هُۥ", "أَيّ", "شَكَرَ", "عَلَى", "هِۦ"]
  - who: imran
    t: "وَنَحْنُ نَرُدُّ: يَا رَبَّنَا، لَكَ الْحَمْدُ. كَأَنَّهُ حِوَارْ!"
    tr: "Wa nahnu narudd: ya Rabbana, lakal-hamd. Ka-annahu hiwaar!"
    en: "And we answer: our Lord, Yours is the praise. It's like a conversation!"
    q: ["نَحْنُ", "رَبّ", "نَا", "كَ", "حَمْد", "هُۥ"]
  - who: abukhalid
    t: "هُوَ حِوَارٌ فِعْلًا يَا بُنَيَّ. الصَّلَاةُ كُلُّهَا حِوَارٌ بَيْنَ الْعَبْدِ وَرَبِّهْ."
    tr: "Huwa hiwaarun fi'lan ya bunayya. As-salaatu kulluha hiwaarun bainal-'abdi wa Rabbih."
    en: "It really is a conversation, my son. The whole prayer is a conversation between the servant and his Lord."
    q: ["هُوَ", "بُنَىّ", "صَلاة", "كُلّ", "هَا", "بَيْن", "عَبْد", "رَبّ", "هِۦ"]
  - who: abukhalid
    t: "ثُمَّ تَسْجُدُ، وَتَقُولُ: سُبْحَانَ رَبِّيَ الْأَعْلَى."
    tr: "Thumma tasjudu, wa taqool: Subhana Rabbiyal A'la."
    en: "Then you go down into sujud and say: Subhana Rabbiyal A'la."
    q: ["ثُمّ", "قالَ", "سُبْحان", "رَبّ", "ى"]
  - who: imran
    t: "فِي الرُّكُوعِ «الْعَظِيمُ»، وَفِي السُّجُودِ «الْأَعْلَى». لِمَاذَا؟"
    tr: "Fir-rukoo'i «al-'Azeem», wa fis-sujoodi «al-A'la». Limaadha?"
    en: "In ruku' it's 'the Most Great', and in sujud 'the Most High'. Why?"
    q: ["فِي", "عَظِيم", "ما", "ذا"]
  - who: abukhalid
    t: "سُؤَالٌ جَمِيلٌ. فِي السُّجُودِ وَجْهُكَ عَلَى الْأَرْضِ؛ أَنْتَ فِي أَخْفَضِ مَكَانْ."
    tr: "Su'aalun jameel. Fis-sujoodi wajhuka 'alal-ard; anta fi akhfadi makaan."
    en: "A beautiful question. In sujud your face is on the ground; you are in the lowest place."
    q: ["فِي", "وَجْه", "كَ", "عَلَى", "أَرْض", "أَنتَ"]
  - who: abukhalid
    t: "فَتَقُولُ: رَبِّيَ «الْأَعْلَى»، أَيْ: أَعْلَى مِنْ كُلِّ شَيْءٍ. وَ«الْأَعْلَى» عَلَى وَزْنِ «أَفْعَلُ»، مِثْلَ «أَكْبَرْ»."
    tr: "Fa-taqool: Rabbiyal-«A'la», ai: a'la min kulli shay'. Wal-«A'la» 'ala wazni «af'al», mithla «Akbar»."
    en: "So you say: my Lord is the Most High — higher than everything. And A'la is on the af'al pattern, like Akbar."
    q: ["قالَ", "رَبّ", "ى", "أَيّ", "مِن", "كُلّ", "شَىْء", "عَلَى", "مِثْل"]
  - who: abukhalid
    t: "وَفِي الْحَدِيثِ: «أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ»."
    tr: "Wa fil-hadeeth: «Aqrabu ma yakoonul-'abdu min Rabbihi wa huwa saajid»."
    en: "And in the hadith: 'The closest a servant is to his Lord is when he is in sujud.'"
    q: ["فِي", "ما", "كانَ", "عَبْد", "مِن", "رَبّ", "هِۦ", "هُوَ"]
  - who: imran
    t: "وَأَنَا كُنْتُ أَسْجُدُ وَعَقْلِي فِي الْعَمَلِ، فِي الْبَيْتِ، فِي كُلِّ مَكَانٍ... إِلَّا فِي الصَّلَاةْ."
    tr: "Wa ana kuntu asjudu wa 'aqli fil-'amal, fil-bait, fi kulli makaan... illa fis-salaah."
    en: "(his voice catching) And I used to go into sujud with my mind at work, at home, everywhere... except in the prayer."
    q: ["أَنَا۠", "كانَ", "ى", "فِي", "عَمَل", "بَيْت", "كُلّ", "إِلّا", "صَلاة"]
  - who: abukhalid
    t: "كُلُّنَا كَذٰلِكَ يَا بُنَيَّ. وَلٰكِنْ إِذَا فَهِمْتَ مَا تَقُولُ، يَحْضُرُ قَلْبُكَ مَعَ لِسَانِكْ."
    tr: "Kulluna kadhaalika ya bunayya. Wa laakin idha fahimta ma taqool, yahduru qalbuka ma'a lisaanik."
    en: "We are all like that, my son. But when you understand what you're saying, your heart comes along with your tongue."
    q: ["كُلّ", "نَا", "ذا", "بُنَىّ", "لٰكِن", "إِذا", "ما", "قالَ", "قَلْب", "كَ", "مَع"]

  - section: "☝️ The tashahhud"
    learn: "ش ه د: شَهِدَ / يَشْهَدُ = to witness → أَشْهَدُ I bear witness · شَهِيد witness, martyr · ع ب د: عَبْد servant → عِبَاد servants · ط in الطَّيِّبَات is a heavy t, deeper than ٹ · ص in الصَّلَوَات is a heavy s"
  - who: abukhalid
    t: "وَفِي الْجُلُوسِ تَقُولُ التَّشَهُّدَ. قُلْهُ مَعِي."
    tr: "Wa fil-juloosi taqoolut-tashahhud. Qul-hu ma'ee."
    en: "And when you sit, you say the tashahhud. Say it with me."
    q: ["فِي", "قالَ", "هُۥ", "مَع", "ى"]
  - who: imran
    t: "التَّحِيَّاتُ لِلَّهِ، وَالصَّلَوَاتُ، وَالطَّيِّبَاتْ."
    tr: "Attahiyyatu lillahi was-salawatu wat-tayyibaat."
    en: "All greetings are for Allah, and the prayers, and the good things."
    q: ["اللَّه", "صَلاة"]
  - who: abukhalid
    t: "«التَّحِيَّاتُ»: كُلُّ تَحِيَّةٍ وَتَعْظِيمٍ لِلَّهِ. وَ«الصَّلَوَاتُ»: الصَّلَاةُ وَالدُّعَاءُ. وَ«الطَّيِّبَاتُ»: الْكَلَامُ الطَّيِّبُ وَالْعَمَلُ الطَّيِّبْ."
    tr: "«At-tahiyyaat»: kullu tahiyyatin wa ta'zeemin lillah. Was-«salawaat»: as-salaatu wad-du'aa'. Wat-«tayyibaat»: al-kalaamut-tayyibu wal-'amalut-tayyib."
    en: "At-tahiyyat: every greeting and every honour belongs to Allah. As-salawat: prayer and du'a. At-tayyibat: good words and good deeds."
    q: ["كُلّ", "اللَّه", "صَلاة", "عَمَل"]
  - who: imran
    t: "السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهْ."
    tr: "Assalamu alaika ayyuhan-Nabiyyu wa rahmatullahi wa barakaatuh."
    en: "Peace be upon you, O Prophet, and the mercy of Allah and His blessings."
    q: ["سَلام", "عَلَى", "كَ", "نَبِيّ", "رَحْمَة", "اللَّه", "هُۥ"]
  - who: abukhalid
    t: "هُنَا تُسَلِّمُ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. ثُمَّ: السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينْ."
    tr: "Huna tusallimu 'alan-Nabiyyi sallallahu alaihi wa sallam. Thumma: Assalamu alaina wa 'ala 'ibaadillahis-saaliheen."
    en: "Here you greet the Prophet, peace and blessings be upon him. Then: peace be upon us and upon Allah's righteous servants."
    q: ["عَلَى", "نَبِيّ", "اللَّه", "هِۦ", "ثُمّ", "سَلام", "نَا", "عَبْد", "صالِح"]
  - who: imran
    t: "«عِبَادِ اللَّهِ الصَّالِحِينَ»... هَلْ هٰذَا يَعْنِي كُلَّ الصَّالِحِينْ؟"
    tr: "«'Ibaadillahis-saaliheen»... hal haadha ya'ni kullas-saaliheen?"
    en: "'Allah's righteous servants'... does that mean all the righteous?"
    q: ["عَبْد", "اللَّه", "صالِح", "هَل", "ذا", "كُلّ"]
  - who: abukhalid
    t: "نَعَمْ. أَخْبَرَنَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّ هٰذَا السَّلَامَ يُصِيبُ كُلَّ عَبْدٍ صَالِحٍ فِي السَّمَاءِ وَالْأَرْضْ."
    tr: "Na'am. Akhbaranan-Nabiyyu sallallahu alaihi wa sallam anna haadhas-salaama yuseebu kulla 'abdin saalihin fis-samaa'i wal-ard."
    en: "Yes. The Prophet, peace be upon him, told us that this greeting reaches every righteous servant in the heavens and on earth."
    q: ["نَا", "نَبِيّ", "اللَّه", "هِۦ", "أَنّ", "ذا", "سَلام", "أَصابَ", "كُلّ", "عَبْد", "صالِح", "فِي", "سَماء", "أَرْض"]
  - who: imran
    t: "يَعْنِي... وَأَنَا وَحْدِي فِي غُرْفَتِي فِي زِيُورِخْ، كَانَ سَلَامِي يَصِلُ إِلَى كُلِّ عَبْدٍ صَالِحْ؟"
    tr: "Ya'ni... wa ana wahdi fi ghurfati fi Zurich, kaana salaami yasilu ila kulli 'abdin saalih?"
    en: "(softly) So... when I was all alone in my room in Zurich, my salam was reaching every righteous servant?"
    q: ["أَنَا۠", "ى", "فِي", "كانَ", "سَلام", "إِلَى", "كُلّ", "عَبْد", "صالِح"]
  - who: abukhalid
    t: "نَعَمْ. لَمْ تَكُنْ وَحْدَكَ أَبَدًا."
    tr: "Na'am. Lam takun wahdaka abadan."
    en: "Yes. You were never alone."
    q: ["لَم", "كانَ", "كَ"]
  - who: abukhalid
    t: "ثُمَّ: أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهْ."
    tr: "Thumma: Ash-hadu an la ilaaha illallah, wa ash-hadu anna Muhammadan 'abduhu wa Rasooluh."
    en: "Then: I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and His Messenger."
    q: ["ثُمّ", "شَهِدَ", "أَن", "لا", "إِلٰه", "إِلّا", "اللَّه", "أَنّ", "عَبْد", "هُۥ", "رَسُول"]
  - who: abukhalid
    t: "«أَشْهَدُ» مِنْ شَهِدَ يَشْهَدُ: أَقُولُ عَنْ عِلْمٍ، كَأَنِّي أَرَى بِعَيْنِي. وَمِنْ نَفْسِ الْجَذْرِ: «شَهِيدٌ»."
    tr: "«Ash-hadu» min shahida yash-hadu: aqoolu 'an 'ilm, ka-anni araa bi-'aini. Wa min nafsil-jadhr: «shaheed»."
    en: "Ash-hadu comes from shahida, yash-hadu: I say it from knowledge, as if I see it with my own eyes. And from the same root: shaheed, witness."
    q: ["شَهِدَ", "مِن", "قالَ", "عَن", "عِلْم", "رَأَى", "عَيْن", "ى", "نَفْس", "شَهِيد"]
  - who: imran
    t: "«عَبْدُهُ وَرَسُولُهُ»: الْعَبْدُ أَوَّلًا، ثُمَّ الرَّسُولْ."
    tr: "«'Abduhu wa Rasooluh»: al-'abdu awwalan, thummar-Rasool."
    en: "'His servant and His Messenger': servant first, then Messenger."
    q: ["عَبْد", "هُۥ", "رَسُول", "أَوَّل", "ثُمّ"]
  - who: abukhalid
    t: "لَاحَظْتَ شَيْئًا عَمِيقًا. حَتَّى أَعْظَمُ النَّاسِ عَبْدٌ لِلَّهِ قَبْلَ كُلِّ شَيْءْ."
    tr: "Laahazta shai'an 'ameeqa. Hatta a'zamun-naasi 'abdun lillahi qabla kulli shay'."
    en: "You've noticed something deep. Even the greatest of people is a servant of Allah before anything else."
    q: ["شَىْء", "حَتَّى", "ناس", "عَبْد", "اللَّه", "قَبْل", "كُلّ"]
  - who: abukhalid
    t: "وَفِي الْآخِرِ: السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ، يَمِينًا ثُمَّ شِمَالًا."
    tr: "Wa fil-aakhir: Assalamu alaikum wa rahmatullah, yameenan thumma shimaalan."
    en: "And at the end: Assalamu alaikum wa rahmatullah — to the right, then to the left."
    q: ["فِي", "آخِر", "سَلام", "عَلَى", "كُمْ", "رَحْمَة", "اللَّه", "يَمِين", "ثُمّ"]
  - who: imran
    t: "«يَمِينٌ»... مِثْلَ «أَصْحَابِ الْيَمِينِ» فِي سُورَةِ الْوَاقِعَةْ!"
    tr: "«Yameen»... mithla «as-haabil-yameen» fi Surati Al-Waaqi'ah!"
    en: "Yameen... like 'the people of the right' in Surah Al-Waqi'ah!"
    q: ["يَمِين", "مِثْل", "أَصْحاب", "فِي"]
  - who: abukhalid
    t: "صَحِيحٌ. وَفِي جِدَّةَ تَقُولُ لِلسَّائِقِ: «يَمِينٌ» أَوْ «شِمَالٌ». نَفْسُ الْكَلِمَةِ مِنَ الْقُرْآنْ."
    tr: "Saheeh. Wa fi Jiddata taqoolu lis-saa'iq: «yameen» aw «shimaal». Nafsul-kalimati minal-Quran."
    en: "Right. And in Jeddah you tell the driver 'yameen' or 'shimal'. The same word, straight from the Quran."
    q: ["فِي", "قالَ", "يَمِين", "أَو", "نَفْس", "كَلِمَة", "مِن", "قُرْءان"]

  - section: "📖 Ayat al-Kursi, phrase by phrase"
    learn: "ح in الْحَيُّ is the throat h · ق in الْقَيُّوم is a deep q — Urdu speakers often say k · ق و م: قَامَ يَقُومُ (stand) → قَيُّوم · قِيَامَةْ · قَوْم · أَخَذَ / يَأْخُذُ = fa'ala / yaf'ulu (some verbs take u in the present) · بَيْنَ أَيْدِيهِمْ = literally 'between their hands' = in front of them"
  - scene: "Abu Khalid is quiet for a moment. Then he closes his eyes and recites, slowly, the ayah he has loved since he was a boy."
  - who: abukhalid
    t: "الْآنَ أُرِيدُ أَنْ أَقْرَأَ عَلَيْكَ آيَةً تَحْفَظُهَا، وَلٰكِنْ رُبَّمَا لَا تَعْرِفُ مَعْنَاهَا: آيَةَ الْكُرْسِيّْ."
    tr: "Al-aana ureedu an aqra'a 'alaika aayatan tahfazuha, wa laakin rubbama la ta'rifu ma'naaha: Ayatal-Kursi."
    en: "Now I want to recite to you an ayah you know by heart, but perhaps you don't know its meaning: Ayat al-Kursi."
