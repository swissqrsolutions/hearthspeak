  - chapter: "Chapter 9 — Towards Makkah"
  - section: "🗓️ The plan for tomorrow"
    learn: "Future: سَـ + present (سَنَخْرُجُ we will go out) · إِذَنْ = so, then · سَاعَةْ: in modern Arabic an hour or a watch; in the Quran السَّاعَةْ is the Hour, the Day of Judgement · أَمَّا … فَـ = as for … · مِيقَات = the boundary where pilgrims enter ihram"
  - scene: "Two days later, the third evening. After Maghrib the family sits in the majlis. Imran's new ihram lies folded on the sofa beside him, the sandals in a bag at his feet."
  - who: khalid
    t: "إِذَنْ، الْخُطَّةُ لِغَدٍ: نُصَلِّي الْفَجْرَ، ثُمَّ نَخْرُجُ مُبَاشَرَةً إِلَى مَكَّةْ."
    tr: "Idhan, al-khuttatu li-ghad: nusallil-Fajr, thumma nakhruju mubaasharatan ila Makkah."
    en: "So, the plan for tomorrow: we pray Fajr, then we head straight out to Makkah."
    q: ["ثُمّ", "خَرَجَ", "إِلَى"]
  - who: imran
    t: "وَكَمْ سَاعَةً الطَّرِيقْ؟"
    tr: "Wa kam saa'atan at-tareeq?"
    en: "And how many hours is the drive?"
