  - chapter: "Chapter 8 — Old Jeddah"
  - section: "🏛️ Bab Makkah"
    learn: "كَانَ + present verb = 'used to' (كَانَ الْحُجَّاجُ يَخْرُجُونَ) · years: عَامَ أَلْفَيْنِ وَأَرْبَعَةَ عَشَرَ (2014) · Hijazi يَلَّا = come on, let's go · اصْبِرْ = be patient (صَبَرَ / يَصْبِرُ)"
  - scene: "The next morning, nine o'clock. Sara parks near Bab Makkah, the old eastern gate of Jeddah. Faisal jumps out first. The air smells of cardamom, incense and the sea."
  - who: sara
    t: "هٰذَا بَابُ مَكَّةَ. مِنْ هُنَا كَانَ الْحُجَّاجُ يَخْرُجُونَ مِنْ جِدَّةَ إِلَى مَكَّةْ."
    tr: "Haadha Baabu Makkah. Min huna kaanal-hujjaaju yakhrujoona min Jiddata ila Makkah."
    en: "This is Bab Makkah, the Makkah Gate. From here the pilgrims used to set out from Jeddah to Makkah."
    q: ["ذا", "مِن", "كانَ", "خَرَجَ", "إِلَى"]
  - who: imran
    t: "بَابُ مَكَّةَ... وَأَنَا بَعْدَ يَوْمَيْنِ سَأَخْرُجُ مِنْ جِدَّةَ إِلَى مَكَّةَ أَيْضًا، إِنْ شَاءَ اللَّهْ."
    tr: "Baabu Makkah... wa ana ba'da yawmaini sa-akhruju min Jiddata ila Makkata aidan, Insha Allah."
    en: "The Makkah Gate... and in two days I'll be setting out from Jeddah to Makkah too, Insha Allah."
    q: ["أَنَا۠", "بَعْد", "يَوْم", "خَرَجَ", "مِن", "إِلَى", "إِن", "شاءَ", "اللَّه"]
  - who: faisal
    t: "يَلَّا يَا عَمِّي عِمْرَانْ! السُّوقُ مِنْ هِنَا!"
    tr: "Yalla ya 'ammi Imraan! As-sooq min hina!"
    en: "Come on, Uncle Imran! The market's this way!"
    q: ["ى", "مِن"]
  - who: sara
    t: "اصْبِرْ يَا فَيْصَلُ! جِدَّةُ الْقَدِيمَةُ كَانَتْ دَاخِلَ سُورٍ، وَلِلسُّورِ أَبْوَابٌ، وَهٰذَا أَشْهَرُهَا."
    tr: "Isbir ya Faisal! Jiddatul-qadeematu kaanat daakhila soor, wa lis-soori abwaab, wa haadha ash-haruha."
