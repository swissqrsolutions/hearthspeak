    en: "Ta'khudhu comes from akhadha, ya'khudhu. That's another pattern: fa'ala, yaf'ulu, with a u. Not every verb goes yaf'alu."
    q: ["أَخَذَ", "مِن", "ذا", "آخَر", "فَعَلَ", "لَيْسَ", "كُلّ"]
  - who: imran
