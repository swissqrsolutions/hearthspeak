  - section: "🧺 Buying the ihram"
    learn: "Hijazi at the market: إِيشْ = مَاذَا (what) · تِبْغَى / أَبْغَى = تُرِيدُ / أُرِيدُ (from Quranic بَغَى, to seek) · مَرَّةْ = جِدًّا (very; in Fusha مَرَّةً = once) · بِكَمْ؟ = how much? (Hijazi often just كَمْ) · numbers: خَمْسُونَ 50 · سِتُّونَ 60 · سَبْعُونَ 70 · ثَمَانُونَ 80 — Hijazi always says the -een form (sab'een) · ث in ثَمَانُونَ = 'th' as in 'think' (Urdu says 's'; Hijazis often say 't')"
  - scene: "Souq Al-Alawi, a narrow lane of shops shaded with cloth. A seller in a white thobe sits among stacks of towels and folded ihram sets."
  - who: seller
