  - section: "🪟 The rawashin"
    learn: "رَوْشَن (plural رَوَاشِين) = carved wooden bay window of old Jeddah · نَظَرَ / يَنْظُرُ = to look (انْظُرِي = look! to a woman) · رَأَى / يَرَى = to see · أَهْلُ الْبَيْتِ = the family of the house · بَحْر = sea — ح is the throat h"
  - who: imran
    t: "انْظُرِي إِلَى هٰذِهِ النَّوَافِذِ الْخَشَبِيَّةِ! مَا اسْمُهَا؟"
    tr: "Unzuri ila haadhihin-nawaafidhil-khashabiyyah! Masmuha?"
    en: "Look at these wooden windows! What are they called?"
    q: ["نَظَرَ", "إِلَى", "ذا", "ما", "اسْم", "هَا"]
  - who: sara
    t: "هٰذِهِ «رَوَاشِينُ»، وَالْوَاحِدُ «رَوْشَنٌ». كَانَتْ تَجْعَلُ الْهَوَاءَ يَدْخُلُ، وَأَهْلُ الْبَيْتِ يَرَوْنَ الشَّارِعَ، وَلَا يَرَاهُمْ أَحَدْ."
    tr: "Haadhihi «rawaasheen», wal-waahidu «rawshan». Kaanat taj'alul-hawaa'a yadkhul, wa ahlul-baiti yarawnash-shaari', wa la yaraahum ahad."
    en: "These are rawashin; one is a rawshan. They let the air in, and the family inside could see the street while no one could see them."
    q: ["ذا", "كانَ", "جَعَلَ", "دَخَلَ", "أَهْل", "بَيْت", "رَأَى", "لا", "هُمْ", "أَحَد"]
  - who: imran
    t: "ذَكِيٌّ جِدًّا! مِثْلُ الْمُكَيِّفِ قَبْلَ الْكَهْرَبَاءْ."
    tr: "Dhakiyyun jiddan! Mithlul-mukayyifi qablal-kahrabaa'."
    en: "Very clever! Like air conditioning before electricity."
    q: ["مِثْل", "قَبْل"]
  - who: sara
    t: "بِالضَّبْطِ. وَالْجُدْرَانُ مِنْ حَجَرِ الْمَنْقَبَةِ، حَجَرٌ مِنَ الْبَحْرِ الْأَحْمَرِ، كَانُوا يُخْرِجُونَهُ مِنْ قُرْبِ الشَّاطِئْ."
    tr: "Bid-dabt. Wal-judraanu min hajaril-manqabah, hajarun minal-bahril-ahmar, kaanoo yukhrijoonahu min qurbish-shaati'."
