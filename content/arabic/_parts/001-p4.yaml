    q: ["لٰكِن", "عِند", "ما"]
  - who: sara
    t: "هٰذَا طَبِيعِيٌّ. فِي الْمُسْتَشْفَى عِنْدِي مَرْضَى مِنْ كُلِّ الدُّنْيَا، وَنَفْهَمُ بَعْضُنَا بَعْضًا قَلِيلًا قَلِيلًا."
    tr: "Haadha tabee'i. Fil-mustashfa 'indi mardaa min kullid-dunya, wa nafhamu ba'duna ba'dan qaleelan qaleelan."
