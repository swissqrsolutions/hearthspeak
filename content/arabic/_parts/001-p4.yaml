  - who: khalid
    t: "سَاعَةٌ تَقْرِيبًا، إِنْ شَاءَ اللَّهُ. وَ«سَاعَةٌ» هُنَا سِتُّونَ دَقِيقَةً؛ أَمَّا فِي الْقُرْآنِ، فَالسَّاعَةُ هِيَ يَوْمُ الْقِيَامَةْ."
    tr: "Saa'atun taqreeban, Insha Allah. Wa «saa'ah» huna sittoona daqeeqah; amma fil-Quran, fas-saa'atu hiya Yawmul-Qiyaamah."
    en: "About an hour, Insha Allah. And 'sa'ah' here means sixty minutes; but in the Quran, as-Sa'ah is the Day of Resurrection."
    q: ["ساعَة", "إِن", "شاءَ", "اللَّه", "أَمّا", "فِي", "قُرْءان", "هِىَ", "يَوْم", "قِيامَة"]
  - who: abukhalid
