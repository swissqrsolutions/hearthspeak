  - quran: { s: 2, a: 255 }
    by: abukhalid
    en: "Allah — there is no god but Him, the Ever-Living, the One who keeps everything in being. Neither drowsiness nor sleep comes over Him. All that is in the heavens and on the earth is His. Who could speak for anyone before Him except with His permission? He knows what lies ahead of people and what lies behind them, and they grasp nothing of His knowledge except what He wills. His Kursi spans the heavens and the earth, and keeping them both is no burden to Him. He is the Most High, the Most Great."
  - who: abukhalid
    t: "«اللَّهُ لَا إِلٰهَ إِلَّا هُوَ»: هٰذِهِ هِيَ الْكَلِمَةُ الَّتِي سَمِعْتَهَا فِي التَّشَهُّدْ."
    tr: "«Allahu la ilaaha illa huw»: haadhihi hiyal-kalimatul-latee sami'taha fit-tashahhud."
    en: "Allahu la ilaha illa Huwa: that's the very sentence you heard in the tashahhud."
    q: ["اللَّه", "لا", "إِلٰه", "إِلّا", "هُوَ", "ذا", "هِىَ", "كَلِمَة", "الَّذِي", "سَمِعَ", "هَا", "فِي"]
