  - section: "🌴 Dates"
    learn: "أَكَلَ / يَأْكُلُ = to eat (fa'ala / yaf'ulu, like أَخَذَ) · كِيلُو · نِصْف half (Hijazi نُصّ) · مِائَةْ 100 (Hijazi مِيَّة) · عَجْوَة, سُكَّرِي = kinds of dates · خَيْرُ طَعَامٍ = the best food · ذ in ذُقْ (taste!) = 'dh' — not 'z'"
  - scene: "The date shop: pyramids of dates on wide brass trays. The seller holds out a sample on a toothpick."
  - who: seller
    t: "ذُقْ يَا حَاجُّ، ذُقْ! هٰذَا سُكَّرِي مِنَ الْقَصِيمْ."
    tr: "Dhuq ya Haaj, dhuq! Haadha sukkari minal-Qaseem."
