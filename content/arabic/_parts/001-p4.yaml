  - section: "💧 Tears on the roof — and the pattern أَفْعَلَ"
    learn: "Pattern أَفْعَلَ = to make something happen: نَزَلَ came down → أَنْزَلَ sent down · خَرَجَ went out → أَخْرَجَ took out · أَمِنَ was safe → آمَنَ believed · رَسُول messenger ← أَرْسَلَ sent · قَلْب = heart"
  - scene: "Imran looks out at the lights of the city. He wipes his eyes with the back of his hand and does not try to hide it."
