  - who: imran
    t: "وَلٰكِنْ عِنْدَمَا يَتَكَلَّمُونَ بِسُرْعَةٍ، أَضِيعُ تَمَامًا."
    tr: "Wa laakin 'indama yatakallamoona bi-sur'ah, adee'u tamaaman."
