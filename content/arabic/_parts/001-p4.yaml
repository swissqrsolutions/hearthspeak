    q: ["صَبَرَ", "كانَ", "ذا", "هَا"]
  - who: sara
    t: "وَجَعَلَتِ الْيُونِسْكُو الْبَلَدَ مِنَ التُّرَاثِ الْعَالَمِيِّ عَامَ أَلْفَيْنِ وَأَرْبَعَةَ عَشَرْ."
    tr: "Wa ja'alatil-Yoonisku al-Balada minat-turaathil-'aalamiyyi 'aama alfaini wa arba'ata 'ashar."
