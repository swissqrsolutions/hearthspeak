    q: ["إِلَى", "مَع", "لا", "أَحْبَبْ"]
  - who: imran
    t: "تُصْبِحُ عَلَى خَيْرٍ يَا عَمِّي، وَجَزَاكَ اللَّهُ خَيْرًا."
    tr: "Tusbihu 'ala khairin ya 'ammi, wa Jazak Allahu khairan."
    en: "Good night, uncle, and Jazak Allahu khairan."
    q: ["عَلَى", "خَيْر", "ى", "جَزَى", "كَ", "اللَّه"]
  - who: abukhalid
