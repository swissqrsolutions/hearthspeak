    q: ["هَل", "عِند", "كَ"]
  - who: seller
    t: "لِفَيْصَلْ؟ عَلَى رَاسِي! خُذْ يَا بَطَلْ."
    tr: "Li-Faisal? 'Ala raasi! Khudh ya batal."
    en: "For Faisal? With pleasure! Here you go, champ."
    q: ["عَلَى", "أَخَذَ"]
  - who: faisal
    t: "شُكْرًا يَا عَمّْ! اللَّهُ يُعْطِيكَ الْعَافِيَةْ!"
    tr: "Shukran ya 'amm! Allahu yu'teekal-'aafiyah!"
    en: "Thanks, uncle! God give you strength!"
    q: ["اللَّه", "كَ"]

  - section: "🕌 Zuhr in Al-Balad"
    learn: "عِنْدَمَا = when · أَكْثَرَ مِمَّا تَظُنُّ = more than you think · بَعْضُنَا بَعْضًا = each other · قَلِيلًا قَلِيلًا = little by little · مَسْجِد الشَّافِعِيّ — one of the oldest mosques of old Jeddah"
  - scene: "Late morning. The call to Zuhr rises from the old mosques of Al-Balad. They walk back through the lanes with their bags."
  - who: imran
    t: "يَا سَارَةُ، الْيَوْمَ تَكَلَّمْتُ مَعَ الْبَائِعِينَ بِالْعَرَبِيَّةِ وَحْدِي تَقْرِيبًا!"
