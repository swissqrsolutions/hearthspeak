  - who: imran
    t: "مَا شَاءَ اللَّهُ! حُلْوٌ مِثْلَ الْعَسَلْ!"
    tr: "Masha Allah! Hulwun mithlal-'asal!"
    en: "Masha Allah! Sweet as honey!"
    q: ["ما", "شاءَ", "اللَّه", "مِثْل"]
  - who: faisal
    t: "عَمِّي، الْعَجْوَةُ أَحْسَنُ! جَدِّي يَأْكُلُ سَبْعَ تَمَرَاتٍ كُلَّ صَبَاحْ."
    tr: "'Ammi, al-'ajwatu ahsan! Jaddi ya'kulu sab'a tamaraatin kulla sabaah."
    en: "Uncle, Ajwa is better! Grandpa eats seven dates every morning."
    q: ["ى", "أَكَلَ", "كُلّ"]
  - who: sara
    t: "هٰذِهِ سُنَّةٌ. فِي الْحَدِيثِ أَنَّ مَنْ أَكَلَ سَبْعَ تَمَرَاتٍ عَجْوَةً فِي الصَّبَاحِ، لَمْ يَضُرَّهُ فِي ذٰلِكَ الْيَوْمِ سُمٌّ وَلَا سِحْرْ."
    tr: "Haadhihi sunnah. Fil-hadeethi anna man akala sab'a tamaraatin 'ajwatan fis-sabaah, lam yadurrahu fi dhaalikal-yawmi summun wa la sihr."
    en: "That's a sunnah. In the hadith, whoever eats seven Ajwa dates in the morning will not be harmed that day by poison or magic."
    q: ["ذا", "فِي", "أَنّ", "مَن", "أَكَلَ", "لَم", "هُۥ", "يَوْم", "لا"]
  - who: sara
    t: "وَأَنَا كَطَبِيبَةٍ أَقُولُ لَكَ: فِي الْعُمْرَةِ سَتَمْشِي كَثِيرًا، وَالتَّمْرُ وَالْمَاءُ خَيْرُ طَعَامٍ لِلطَّرِيقْ."
    tr: "Wa ana ka-tabeebatin aqoolu lak: fil-'Umrati satamshi katheeran, wat-tamru wal-maa'u khairu ta'aamin lit-tareeq."
    en: "And as a doctor I'll tell you: you'll walk a lot during Umrah, and dates and water are the best food for the way."
    q: ["أَنَا۠", "قالَ", "كَ", "فِي", "كَثِير", "ماء", "خَيْر"]
  - who: imran
    t: "بِكَمْ كِيلُو الْعَجْوَةْ؟"
    tr: "Bikam keelul-'ajwah?"
    en: "How much is a kilo of Ajwa?"
    q: []
  - who: seller
    t: "الْعَجْوَةْ الْمُمْتَازَةْ بِمِيَّةْ وَعِشْرِينْ، وَالْعَادِيَّةْ بِثَمَانِينْ."
    tr: "Al-'ajwa al-mumtaaza bi-mayya wa 'ishreen, wal-'aadiyya bi-thamaaneen."
    en: "The top-quality Ajwa is a hundred and twenty, and the ordinary one is eighty."
    q: []
  - who: sara
    t: "يَعْنِي: الْمُمْتَازَةُ بِمِائَةٍ وَعِشْرِينَ رِيَالًا، وَالْعَادِيَّةُ بِثَمَانِينَ. «مِيَّةْ» هِيَ «مِائَةْ»."
    tr: "Ya'ni: al-mumtaazatu bi-mi'atin wa 'ishreena riyaalan, wal-'aadiyyatu bi-thamaaneen. «Mayya» hiya «mi'ah»."
