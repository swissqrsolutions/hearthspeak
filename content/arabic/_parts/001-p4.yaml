    q: ["هِىَ"]
  - who: imran
    t: "أُرِيدُ كِيلُو سُكَّرِي لِلْبَيْتِ، وَنِصْفَ كِيلُو عَجْوَةٍ مُمْتَازَةٍ هَدِيَّةً لِلْإِمَامِ عَبْدِ اللَّهِ فِي زِيُورِخْ."
    tr: "Ureedu keelu sukkari lil-bait, wa nisfa keelu 'ajwatin mumtaazatin hadiyyatan lil-Imaami 'Abdillahi fi Zurich."
