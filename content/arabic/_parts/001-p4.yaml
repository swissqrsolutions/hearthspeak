    q: []
  - who: imran
    t: "مِائَةُ رِيَالٍ، تَفَضَّلْ. وَهَلْ عِنْدَكَ هَدِيَّةٌ صَغِيرَةٌ لِفَيْصَلْ؟"
    tr: "Mi'atu riyaal, tafaddal. Wa hal 'indaka hadiyyatun sagheeratun li-Faisal?"
