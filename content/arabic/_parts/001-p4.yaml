  - section: "🍵 Tea from Umm Khalid"
    learn: "Good-night phrases: تُصْبِحُ عَلَى خَيْرٍ — reply وَأَنْتَ مِنْ أَهْلِهِ · جَزَاكَ اللَّهُ خَيْرًا (Jazak Allahu khairan) — reply وَإِيَّاكَ · dual command نَامَا (you two, sleep)"
  - scene: "Footsteps on the stairs. Khalid comes up with a tray: mint tea in small glasses and a plate of ma'amoul from his mother."
  - who: khalid
    t: "أُمِّي أَرْسَلَتْ هٰذَا الشَّايَ. وَتَقُولُ: لَا تُتْعِبْ ضَيْفَنَا يَا أَبِي، الْوَقْتُ مُتَأَخِّرْ!"
    tr: "Ummi arsalat haadhash-shaay. Wa taqool: la tut'ib daifana ya abi, al-waqtu muta'akhkhir!"
    en: "Mum sent this tea. And she says: don't wear out our guest, Dad, it's late!"
    q: ["ى", "أَرْسَلَ", "ذا", "قالَ", "لا", "نَا", "أَب"]
  - who: abukhalid
    t: "قُلْ لِأُمِّكَ: ضَيْفُنَا هُوَ الَّذِي يُتْعِبُنِي بِأَسْئِلَتِهِ الْجَمِيلَةْ!"
    tr: "Qul li-ummik: daifuna huwal-ladhi yut'ibuni bi-as'ilatihil-jameelah!"
    en: "(laughing) Tell your mother: it's our guest who's wearing me out with his beautiful questions!"
    q: ["قالَ", "كَ", "نَا", "هُوَ", "الَّذِي", "هِۦ"]
  - who: imran
    t: "يَا خَالِدُ، أَبُوكَ عَلَّمَنِي اللَّيْلَةَ مَا لَمْ أَتَعَلَّمْهُ فِي ثَلَاثِينَ سَنَةْ."
    tr: "Ya Khaalid, abooka 'allamaniy-lailata ma lam ata'allamhu fi thalaatheena sanah."
    en: "Khalid, tonight your father taught me what I didn't learn in thirty years."
    q: ["أَب", "كَ", "عَلَّمَ", "ما", "لَم", "هُۥ", "فِي"]
  - who: khalid
    t: "أَعْرِفُ. وَأَنَا تَعَلَّمْتُ كُلَّ شَيْءٍ هُنَا، عَلَى هٰذَا السَّطْحْ."
    tr: "A'rif. Wa ana ta'allamtu kulla shai'in huna, 'ala haadhas-sath."
