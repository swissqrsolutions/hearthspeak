  - who: abukhalid
    t: "نَعَمْ، نَفْسُ الْجَذْرِ: قَافٌ، وَاوٌ، مِيمٌ. يَوْمُ الْقِيَامَةِ: «يَوْمَ يَقُومُ النَّاسُ لِرَبِّ الْعَالَمِينَ». وَمِنْهُ أَيْضًا «قَوْمٌ»."
    tr: "Na'am, nafsul-jadhr: qaaf, waaw, meem. Yawmul-Qiyaamah: «Yawma yaqoomun-naasu li-Rabbil-'aalameen». Wa minhu aidan «qawm»."
    en: "Yes, the same root: qaf, waw, meem. The Day of Resurrection: 'the Day people stand before the Lord of the worlds.' And qawm, a people, comes from it too."
    q: ["نَفْس", "يَوْم", "قِيامَة", "ناس", "رَبّ", "عالَم", "مِن", "هُۥ", "قَوْم"]
  - who: abukhalid
    t: "«لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ»: السِّنَةُ نَوْمٌ خَفِيفٌ، أَوَّلُ النَّوْمِ. وَاللَّهُ لَا يَنَامُ أَبَدًا."
    tr: "«La ta'khudhuhu sinatun wa la nawm»: as-sinatu nawmun khafeef, awwalun-nawm. Wallahu la yanaamu abadan."
    en: "La ta'khudhuhu sinatun wa la nawm: sinah is light sleep, the first doze. And Allah never sleeps."
