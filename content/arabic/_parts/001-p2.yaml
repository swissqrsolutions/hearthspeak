    en: "(moved) May Allah reward you, auntie."
    q: ["جَزَى", "اللَّه", "خَيْر"]

  - section: "🏠 The invitation"
    learn: "Hospitality words: ضَيْف daif = guest · بَيْتُنَا بَيْتُكَ = our house is your house · تَفَضَّلْ tafaddal = please, come in / go ahead · فُنْدُق funduq = hotel (not a Quran word). خَيْر khair = good, goodness (178 times in the Quran). Hijazi: تِجِي tijee = تَأْتِي (you come) · خَلَاصْ khalaas = done, settled. ض = the heavy 'd' that gives Arabic its name 'the language of daad' — Urdu says 'z' (zaif); Saudis say daif."
  - who: "abukhalid"
    t: "يَا عِمْرَانُ، قَالَ لِي خَالِدٌ: سَتَبْقَى فِي جُدَّةَ ثَلَاثَ لَيَالٍ قَبْلَ مَكَّةَ. أَيْنَ سَتَنَامُ؟"
    tr: "Ya Imran, qaala lee Khalid: satabqaa fee Jiddata thalaatha layaalin qabla Makkah. Aina satanaam?"
    en: "Imran, Khalid told me you'll stay in Jeddah three nights before Makkah. Where will you sleep?"
    q: ["قالَ", "ى", "خالِد", "فِي", "لَيْل", "قَبْل"]
  - who: "imran"
    t: "حَجَزْتُ فُنْدُقًا قَرِيبًا مِنَ الْكُورْنِيشِ، يَا عَمِّي…"
    tr: "Hajaztu funduqan qareeban mina l-Corniche, ya ʿammee…"
    en: "I've booked a hotel near the Corniche, uncle…"
    q: ["مِن"]
  - who: "abukhalid"
    t: "فُنْدُقٌ؟! لَا وَاللَّهِ. بَيْتُنَا كَبِيرٌ، وَغُرْفَةُ خَالِدٍ تَنْتَظِرُكَ."
    tr: "Funduq?! Laa wallaahi. Baitunaa kabeer, wa ghurfatu Khalidin tantaziruk."
    en: "A hotel?! No, by Allah. Our house is big, and Khalid's room is waiting for you."
    q: ["لا", "اللَّه", "بَيْت", "نَا", "كَبِير", "خالِد", "كَ"]
  - who: "imran"
    t: "يَا عَمِّي، لَا أُرِيدُ أَنْ أُتْعِبَكُمْ."
    tr: "Ya ʿammee, laa ureedu an utʿibakum."
    en: "Uncle, I don't want to be a burden to you."
    q: ["لا", "أَرادَ", "أَن", "كُمْ"]
  - who: "ummkhalid"
    t: "تُتْعِبُنَا؟ الضَّيْفُ يَأْتِي، وَالْخَيْرُ يَأْتِي مَعَهُ يَا وَلَدِي."
    tr: "Tutʿibunaa? Ad-daifu ya'tee, wa l-khairu ya'tee maʿahu ya waladee."
    en: "A burden to us? When a guest comes, good comes with him, my son."
    q: ["نَا", "أَتَى", "خَيْر", "مَع", "هُۥ", "وَلَد", "ى"]
  - who: "sara"
    t: "وَفِي الْفُنْدُقِ مَنْ يُعَلِّمُكَ الْعَرَبِيَّةَ؟ هُنَا أَبِي يُعَلِّمُكَ لَيْلًا وَنَهَارًا!"
    tr: "Wa fi l-funduqi man yuʿallimuka l-ʿArabiyyah? Hunaa abee yuʿallimuka lailan wa nahaaraa!"
    en: "And who'll teach you Arabic in a hotel? Here my father will teach you night and day!"
    q: ["فِي", "مَن", "عَلَّمَ", "كَ", "أَب", "ى", "لَيْل", "نَهار"]
  - who: "imran"
    t: "إِذَنْ… أَقْبَلُ بِكُلِّ سُرُورٍ. سَأُلْغِي حَجْزَ الْفُنْدُقِ اللَّيْلَةْ."
    tr: "Idhan… aqbalu bi-kulli suroor. Sa-ulghee hajza l-funduqi l-lailah."
    en: "Then… I accept with great pleasure. I'll cancel the hotel booking tonight."
    q: ["إِذًا", "كُلّ"]
  - who: "faisal"
    t: "يَلَّا! تِجِي يَوْمَ إِيشْ؟"
    tr: "Yalla! Tijee yawm eesh?"
    en: "Yay! What day are you coming?"
    q: ["يَوْم"]
  - who: "khalid"
    t: "يَسْأَلُ: فِي أَيِّ يَوْمٍ تَأْتِي؟"
    tr: "Yas'al: fee ayyi yawmin ta'tee?"
    en: "He's asking: on which day do you come?"
    q: ["سَأَلَ", "فِي", "أَيّ", "يَوْم", "أَتَى"]
  - who: "imran"
    t: "يَوْمَ الْخَمِيسِ، سَبْعَةَ عَشَرَ دِيسَمْبَرَ، فِي اللَّيْلِ. وَمَعِي شَيْءٌ لَكَ يَا فَيْصَلُ!"
    tr: "Yawma l-Khamees, sabʿata ʿashara December, fi l-lail. Wa maʿee shai'un laka ya Faisal!"
    en: "On Thursday the 17th of December, at night. And I've got something for you, Faisal!"
    q: ["يَوْم", "فِي", "لَيْل", "مَع", "ى", "شَىْء", "كَ"]
  - who: "faisal"
    t: "خَلَاصْ! أَنَا أَجِي الْمَطَارْ!"
    tr: "Khalaas! Ana ajee l-mataar!"
    en: "Settled! I'm coming to the airport!"
    q: ["أَنَا۠"]
  - who: "khalid"
    t: "لَا يَا فَيْصَلُ. الطَّائِرَةُ تَصِلُ مُتَأَخِّرَةً، وَسَتَكُونُ نَائِمًا. سَتَرَاهُ فِي الصَّبَاحْ."
    tr: "Laa ya Faisal. At-taa'iratu tasilu muta'akhkhiratan, wa satakoonu naa'imaa. Sataraahu fi s-sabaah."
    en: "No, Faisal. The plane lands late, and you'll be asleep. You'll see him in the morning."
    q: ["لا", "كانَ", "رَأَى", "هُ", "فِي"]

  - section: "📖 Abu Khalid's ayah — 49:13"
    learn: "Words of 49:13: النَّاس an-naas = people · خَلَقَ khalaqa = He created · ذَكَر dhakar = male · أُنْثَى unthaa = female · شُعُوب shuʿoob = peoples, nations · قَبَائِل qabaa'il = tribes · لِتَعَارَفُوا li-taʿaarafoo = so that you know one another · أَكْرَم akram = most honoured · أَتْقَى atqaa = most God-conscious · عَلِيم ʿaleem = All-Knowing · خَبِير khabeer = All-Aware. ذ = 'dh' as in 'this' — Urdu says 'z' (zikr); Saudis say dhakar, dhikr. تَقْوَى taqwaa comes from وَقَى (to protect): a shield between you and what angers Allah."
  - scene: "Abu Khalid takes off his reading glasses and leans towards the camera. The others fall quiet; even Faisal sits down."
  - who: "abukhalid"
    t: "يَا عِمْرَانُ، أَنْتَ مِنَ الْهِنْدِ، وَنَحْنُ مِنَ الْحِجَازِ. لُغَتُكَ غَيْرُ لُغَتِنَا، وَطَعَامُكَ غَيْرُ طَعَامِنَا."
    tr: "Ya Imran, anta mina l-Hind, wa nahnu mina l-Hijaaz. Lughatuka ghairu lughatinaa, wa taʿaamuka ghairu taʿaaminaa."
    en: "Imran, you are from India, and we are from the Hijaz. Your language is not our language, and your food is not our food."
    q: ["أَنتَ", "مِن", "نَحْنُ", "كَ", "غَيْر", "نَا"]
  - who: "abukhalid"
    t: "لَكِنَّ اللَّهَ قَالَ كَلِمَةً جَمَعَتْنَا. اسْمَعْ."
    tr: "Laakinna Allaha qaala kalimatan jamaʿatnaa. Ismaʿ."
    en: "But Allah said a word that brings us together. Listen."
    q: ["لٰكِنّ", "اللَّه", "قالَ", "كَلِمَة", "نَا", "سَمِعَ"]
  - quran: { s: 49, a: 13 }
    by: "abukhalid"
    en: "O people, We created you from one male and one female, and made you into nations and tribes so that you would come to know one another. The most honoured of you in Allah's sight is the one most mindful of Him. Allah knows all and is aware of everything."
  - who: "abukhalid"
    t: "«يَا أَيُّهَا النَّاسُ»: الْكَلَامُ لِكُلِّ النَّاسِ، لَيْسَ لِلْعَرَبِ وَحْدَهُمْ."
    tr: "Yaa ayyuha n-naas: al-kalaamu li-kulli n-naas, laisa li-l-ʿArabi wahdahum."
    en: "'O people': the words are for all people, not for the Arabs alone."
    q: ["أَيّ", "ناس", "كُلّ", "لَيْسَ", "هُمْ"]
  - who: "abukhalid"
    t: "«إِنَّا خَلَقْنَاكُمْ مِنْ ذَكَرٍ وَأُنْثَى»: كُلُّنَا مِنْ أَبٍ وَاحِدٍ وَأُمٍّ وَاحِدَةٍ، آدَمَ وَحَوَّاءْ."
    tr: "Innaa khalaqnaakum min dhakarin wa unthaa: kullunaa min abin waahidin wa ummin waahidah, Aadama wa Hawwaa'."
    en: "'We created you from a male and a female': all of us come from one father and one mother, Adam and Hawwa."
    q: ["إِنّ", "نَا", "خَلَقَ", "كُمْ", "مِن", "كُلّ", "أَب", "واحِد", "أُمّ", "واحِدَة"]
  - who: "imran"
    t: "وَ«جَعَلْنَاكُمْ»… مِنْ «جَعَلَ»! دَرَسْنَاهُ أَنَا وَخَالِدٌ."
    tr: "Wa jaʿalnaakum… min jaʿala! Darasnaahu ana wa Khalid."
    en: "And 'jaʿalnaakum'… from 'jaʿala'! Khalid and I studied it."
    q: ["جَعَلَ", "نَا", "كُمْ", "مِن", "هُ", "أَنَا۠", "خالِد"]
  - who: "abukhalid"
    t: "أَحْسَنْتَ. جَعَلَنَا اللَّهُ شُعُوبًا كَبِيرَةً، مِثْلَ الْهُنُودِ وَالْعَرَبِ، وَقَبَائِلَ أَصْغَرَ، مِثْلَ قَوْمِنَا: قَبِيلَةِ حَرْبْ."
    tr: "Ahsanta. Jaʿalana Allahu shuʿooban kabeerah, mithla l-Hunoodi wa l-ʿArab, wa qabaa'ila asghar, mithla qawminaa: qabeelati Harb."
    en: "Well done. Allah made us into big nations, like the Indians and the Arabs, and smaller tribes, like our own people: the tribe of Harb."
    q: ["جَعَلَ", "نَا", "اللَّه", "كَبِير", "مِثْل", "قَوْم"]
  - who: "abukhalid"
    t: "لِمَاذَا؟ «لِتَعَارَفُوا»: لِيَعْرِفَ بَعْضُكُمْ بَعْضًا، لَا لِيَتَكَبَّرَ بَعْضُكُمْ عَلَى بَعْضْ."
    tr: "Limaadhaa? Li-taʿaarafoo: li-yaʿrifa baʿdukum baʿdaa, laa li-yatakabbara baʿdukum ʿalaa baʿd."
    en: "Why? 'So that you know one another': so that you get to know each other — not so that some of you look down on others."
    q: ["ما", "ذا", "بَعْض", "كُمْ", "لا", "عَلَى"]
  - who: "imran"
    t: "مِثْلَ الْآنَ: هِنْدِيٌّ وَعَائِلَةٌ سُعُودِيَّةٌ يَتَعَارَفُونَ عَلَى الشَّاشَةْ."
    tr: "Mithla l-aan: Hindiyyun wa ʿaa'ilatun Saʿoodiyyah yataʿaarafoona ʿala sh-shaashah."
    en: "Like right now: an Indian and a Saudi family getting to know each other on a screen."
    q: ["مِثْل", "عَلَى"]
  - who: "abukhalid"
    t: "بِالضَّبْطِ. ثُمَّ: «إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ». الْأَكْرَمُ لَيْسَ الْأَغْنَى، وَلَا صَاحِبَ أَكْبَرِ بَيْتٍ، وَلَا الْعَرَبِيَّ. الْأَكْرَمُ هُوَ الَّذِي يَتَّقِي اللَّهَ أَكْثَرْ."
    tr: "Bi-d-dabt. Thumma: inna akramakum ʿinda Llaahi atqaakum. Al-akramu laisa l-aghnaa, wa laa saahiba akbari bait, wa la l-ʿArabiyy. Al-akramu huwa lladhee yattaqi Llaaha akthar."
    en: "Exactly. Then: 'The most honoured of you with Allah is the most mindful of Him.' The most honoured isn't the richest, or the owner of the biggest house, or the Arab. The most honoured is the one most mindful of Allah."
    q: ["ثُمّ", "إِنّ", "كُمْ", "عِند", "اللَّه", "لَيْسَ", "لا", "بَيْت", "هُوَ", "الَّذِي", "اتَّقَى", "أَكْثَر"]
  - who: "imran"
    t: "وَمَا مَعْنَى «يَتَّقِي» بِالضَّبْطِ؟"
    tr: "Wa maa maʿnaa yattaqee bi-d-dabt?"
    en: "And what exactly does 'yattaqee' mean?"
    q: ["ما", "اتَّقَى"]
  - who: "abukhalid"
    t: "التَّقْوَى: أَنْ تَجْعَلَ بَيْنَكَ وَبَيْنَ عَذَابِ اللَّهِ وِقَايَةً. تَخَافُ اللَّهَ وَتُحِبُّهُ، فَتَعْمَلُ الْخَيْرَ وَتَتْرُكُ الشَّرّْ."
    tr: "At-taqwaa: an tajʿala bainaka wa baina ʿadhaabi Llaahi wiqaayah. Takhaafu Llaaha wa tuhibbuh, fa-taʿmalu l-khaira wa tatruku sh-sharr."
    en: "Taqwa: to put a shield between yourself and Allah's punishment. You fear Allah and you love Him, so you do good and leave evil."
    q: ["أَن", "جَعَلَ", "بَيْن", "كَ", "عَذاب", "اللَّه", "خافَ", "أَحْبَبْ", "هُۥ", "عَمِلَ", "خَيْر", "تَرَكَ", "شَرّ"]
  - who: "abukhalid"
    t: "وَ«إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ»: يَعْلَمُ مَا فِي الْقُلُوبِ، لَا مَا عَلَى الْوُجُوهِ فَقَطْ."
    tr: "Wa inna Llaaha ʿaleemun khabeer: yaʿlamu maa fi l-quloob, laa maa ʿala l-wujoohi faqat."
    en: "And 'Allah is Knowing, Aware': He knows what is in the hearts, not only what is on the faces."
    q: ["إِنّ", "اللَّه", "عَلِيم", "خَبِير", "عَلِمَ", "ما", "فِي", "قَلْب", "لا", "عَلَى", "وَجْه"]
  - who: "imran"
    t: "يَا عَمِّي… قَرَأْتُ هَذِهِ الْآيَةَ سِنِينَ طَوِيلَةً، وَلَمْ أَعْرِفْ هَذَا الْمَعْنَى."
