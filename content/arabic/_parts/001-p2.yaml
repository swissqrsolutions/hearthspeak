  - section: "✈️ Saturday 31 October — flight, vaccine, money"
    learn: "The future: سَ + present verb. سَآخُذُ sa-aakhudhu = I will take · سَأَكُونُ sa-akoonu = I will be. أَخَذَ akhadha = to take (Quran: أَخَذَ). مَطَار mataar = airport, from طَارَ (to fly) — the same root as طَائِر (bird) in the Quran. ط is a heavy 't', the tongue pressed up; ص a heavy 's'. Money: رِيَال riyaal; مَال maal = money, wealth (Quranic: الْمَالُ وَالْبَنُونَ)."
  - scene: "Saturday 31 October. Imran's flat. Khalid has come round with a box of dates; they sit side by side looking at flight prices."
  - who: "imran"
