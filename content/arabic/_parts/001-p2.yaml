lines:
  - chapter: "Chapter 3 — Preparations"

  - section: "📅 Thursday 1 October — I, you, he, they"
    learn: "Pronouns: أَنَا ana (I) · أَنْتَ anta (you, to a man) · هُوَ huwa (he) · هِيَ hiya (she) · نَحْنُ nahnu (we) · هُمْ hum (they). Arabic has no 'am / is / are' in the present: أَنَا مِنْ جُدَّةَ = I (am) from Jeddah. The name خَالِد is a Quran word: خَالِدِينَ فِيهَا = 'remaining in it forever'. خ = 'kh', the Urdu خ of خدا."
  - scene: "Thursday 1 October, lunchtime. The staff canteen of the company in Zurich where Imran and Khalid work. Rain runs down the big windows."
  - who: "khalid"
    t: "السَّلَامُ عَلَيْكُمْ يَا عِمْرَانُ. دَرْسُ الْيَوْمِ عَنِ الضَّمَائِرْ."
    tr: "Assalamu Alaikum ya Imran. Darsu l-yawmi ʿani d-dama'ir."
    en: "Assalamu Alaikum, Imran. Today's lesson is about pronouns."
    q: ["سَلام", "عَلَى", "كُمْ", "يَوْم", "عَن"]
  - who: "khalid"
    t: "أَنَا خَالِدٌ. أَنَا مِنْ جُدَّةْ."
    tr: "Ana Khalid. Ana min Jiddah."
    en: "I am Khalid. I am from Jeddah."
    q: ["أَنَا۠", "خالِد", "مِن"]
  - who: "imran"
    t: "وَأَنَا عِمْرَانُ. أَنَا مِنْ بَنْغَالُورُو."
    tr: "Wa ana Imran. Ana min Bengaluru."
    en: "And I am Imran. I am from Bengaluru."
    q: ["أَنَا۠", "مِن"]
  - who: "khalid"
    t: "وَهُوَ مَارْكُو، هُوَ مِنْ إِيطَالِيَا. وَهِيَ آنَّا، هِيَ مِنْ زِيُورِخْ."
    tr: "Wa huwa Marco, huwa min Italiya. Wa hiya Anna, hiya min Zurich."
    en: "(nodding at two colleagues) And he is Marco, he's from Italy. And she is Anna, she's from Zurich."
    q: ["هُوَ", "مِن", "هِىَ"]
  - who: "imran"
    t: "وَنَحْنُ؟"
    tr: "Wa nahnu?"
    en: "And we?"
    q: ["نَحْنُ"]
  - who: "khalid"
    t: "نَحْنُ زُمَلَاءُ. نَحْنُ نَعْمَلُ فِي شَرِكَةٍ وَاحِدَةْ."
    tr: "Nahnu zumalaa'. Nahnu naʿmalu fee sharikatin waahidah."
    en: "We are colleagues. We work in one company."
    q: ["نَحْنُ", "عَمِلَ", "فِي", "واحِدَة"]
  - who: "khalid"
    t: "وَهُمْ؟ هُمْ مِنَ الْهِنْدِ، مِثْلَكْ."
    tr: "Wa hum? Hum mina l-Hind, mithlak."
    en: "And they? They are from India, like you."
    q: ["هُم", "مِن", "مِثْل", "كَ"]
  - who: "imran"
    t: "نَعَمْ! هُمْ مِنْ مُومْبَايْ. وَأَنَا الْوَحِيدُ مِنْ بَنْغَالُورُو."
    tr: "Naʿam! Hum min Mumbai. Wa ana l-waheedu min Bengaluru."
    en: "Yes! They're from Mumbai. And I'm the only one from Bengaluru."
    q: ["نَعَم", "هُم", "مِن", "أَنَا۠"]

  - section: "⏳ The verb كَانَ (was)"
    learn: "كَانَ kaana = he was · كُنْتُ kuntu = I was · كُنْتَ kunta = you were · كَانُوا kaanoo = they were · سَأَكُونُ sa-akoonu = I will be. In the Quran وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا does not mean Allah 'was' and stopped: كَانَ here means 'has always been'. ح = the 'h' of the middle throat, as in Urdu حکیم said properly — not a plain h."
  - who: "khalid"
    t: "الْآنَ فِعْلٌ مُهِمٌّ جِدًّا: كَانَ. أَيْنَ كُنْتَ أَمْسِ يَا عِمْرَانُ؟"
    tr: "Al-aana fiʿlun muhimmun jiddan: kaana. Aina kunta amsi ya Imran?"
    en: "Now a very important verb: kaana, 'was'. Where were you yesterday, Imran?"
    q: ["كانَ"]
  - who: "imran"
    t: "كُنْتُ فِي الْمَسْجِدِ بَعْدَ الْعِشَاءِ. كَانَ هُنَاكَ دَرْسٌ عَنْ سُورَةِ الْفَاتِحَةْ."
    tr: "Kuntu fi l-Masjidi baʿda l-Isha. Kaana hunaaka darsun ʿan Surati l-Fatiha."
    en: "I was in the Masjid after Isha. There was a class on Surah Al-Fatiha."
    q: ["كانَ", "فِي", "مَسْجِد", "بَعْد", "عَن"]
  - who: "khalid"
    t: "مُمْتَازٌ. فِي الْقُرْآنِ نَسْمَعُ كَثِيرًا: «وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا»."
    tr: "Mumtaaz. Fi l-Quran nasmaʿu katheeran: wa kaana Allahu ʿaleeman hakeema."
    en: "Excellent. In the Quran we often hear: 'And Allah is ever Knowing, Wise.'"
    q: ["فِي", "قُرْءان", "سَمِعَ", "كَثِير", "كانَ", "اللَّه", "عَلِيم", "حَكِيم"]
  - who: "imran"
    t: "«كَانَ»؟ هَلْ يَعْنِي: كَانَ عَلِيمًا فِي الْمَاضِي فَقَطْ؟"
    tr: "Kaana? Hal yaʿnee: kaana ʿaleeman fi l-maadee faqat?"
    en: "'Was'? Does it mean He was knowing only in the past?"
    q: ["كانَ", "هَل", "عَلِيم", "فِي"]
  - who: "khalid"
    t: "سُؤَالٌ جَيِّدٌ. لَا. «كَانَ» هُنَا لَيْسَتْ عَنِ الْمَاضِي. هِيَ تَعْنِي: هُوَ هَكَذَا دَائِمًا."
    tr: "Su'aalun jayyid. Laa. Kaana hunaa laisat ʿani l-maadee. Hiya taʿnee: huwa haakadhaa daa'iman."
    en: "Good question. No. Here 'kaana' isn't about the past. It means: He is always like this."
    q: ["لا", "كانَ", "لَيْسَ", "عَن", "هِىَ", "هُوَ"]
  - who: "imran"
    t: "سُبْحَانَ اللَّهِ. كَلِمَةٌ صَغِيرَةٌ، وَمَعْنًى كَبِيرْ."
    tr: "Subhan Allah. Kalimatun sagheerah, wa maʿnan kabeer."
    en: "Subhan Allah. A small word, and a big meaning."
    q: ["سُبْحان", "اللَّه", "كَلِمَة", "كَبِير"]
  - who: "khalid"
    t: "وَالْعُمْرَةُ يَا عِمْرَانُ؟ هَلْ قَرَّرْتَ؟"
    tr: "Wa l-Umrah ya Imran? Hal qarrarta?"
    en: "And the Umrah, Imran? Have you decided?"
    q: ["هَل"]
  - who: "imran"
    t: "نَعَمْ، إِنْ شَاءَ اللَّهُ فِي مُنْتَصَفِ دِيسَمْبَرَ. أَخَذْتُ إِجَازَةً مِنَ الْعَمَلِ الْيَوْمْ."
    tr: "Naʿam, Insha Allah fee muntasafi December. Akhadhtu ijaazatan mina l-ʿamali l-yawm."
    en: "Yes, Insha Allah in mid-December. I got my leave from work approved today."
    q: ["نَعَم", "إِن", "شاءَ", "اللَّه", "فِي", "أَخَذَ", "مِن", "عَمَل", "يَوْم"]
  - who: "khalid"
    t: "مَا شَاءَ اللَّهُ! وَأَنَا أُسَافِرُ إِلَى جُدَّةَ قَبْلَكَ بِأُسْبُوعٍ. أَهْلِي هُنَاكْ."
    tr: "Masha Allah! Wa ana usaafiru ila Jiddata qablaka bi-usbooʿ. Ahlee hunaak."
    en: "Masha Allah! And I fly to Jeddah a week before you. My family is there."
    q: ["ما", "شاءَ", "اللَّه", "أَنَا۠", "إِلَى", "قَبْل", "كَ", "أَهْل", "ى"]
  - who: "imran"
    t: "إِذَنْ نَلْتَقِي فِي جُدَّةَ، إِنْ شَاءَ اللَّهْ."
    tr: "Idhan naltaqee fee Jiddah, Insha Allah."
    en: "Then we'll meet in Jeddah, Insha Allah."
    q: ["إِذًا", "فِي", "إِن", "شاءَ", "اللَّه"]

  - section: "📱 Sunday 4 October — visa, Nusuk and the permit"
    learn: "قَالَ qaala = he said · قُلْتُ qultu = I said · قُلْتَ qulta = you said · يَقُولُ yaqoolu = he says · قُلْ qul = say! (as in قُلْ هُوَ اللَّهُ أَحَدٌ). ق comes from deep in the throat: not 'k'. Urdu speakers often flatten it; Jeddah people sometimes say 'g'. New words: تَأْشِيرَة ta'sheera = visa · تَطْبِيق tatbeeq = app · تَصْرِيح tasreeh = permit. سَاعَة: in the Quran 'the Hour' (Judgement Day); today also 'hour, o'clock, watch'."
  - scene: "Sunday 4 October, evening. Imran's small flat in Oerlikon. His laptop is open; Khalid is on the phone, on speaker."
  - who: "imran"
    t: "يَا خَالِدُ، أَنَا أَمَامَ الْحَاسُوبِ. مِنْ أَيْنَ أَبْدَأُ؟"
    tr: "Ya Khalid, ana amaama l-haasoob. Min aina abda'?"
    en: "Khalid, I'm in front of the computer. Where do I start?"
    q: ["خالِد", "أَنَا۠", "مِن"]
  - who: "khalid"
    t: "أَوَّلًا التَّأْشِيرَةُ. جَوَازُكَ هِنْدِيٌّ، وَعِنْدَكَ إِقَامَةٌ فِي سُوِيسْرَا، صَحِيحْ؟"
    tr: "Awwalan at-ta'sheerah. Jawaazuka Hindiyy, wa ʿindaka iqaamatun fee Swisra, saheeh?"
    en: "First the visa. Your passport is Indian, and you have a residence permit in Switzerland, right?"
    q: ["أَوَّل", "كَ", "عِند", "فِي"]
  - who: "khalid"
    t: "صَدِيقٌ لِي قَالَ: مَنْ عِنْدَهُ إِقَامَةٌ فِي أُورُوبَّا يَسْتَطِيعُ أَنْ يَطْلُبَ تَأْشِيرَةً إِلِكْتُرُونِيَّةْ."
    tr: "Sadeequn lee qaala: man ʿindahu iqaamatun fee Oroppa yastateeʿu an yatluba ta'sheeratan iliktroniyyah."
    en: "A friend of mine said: anyone with residence in Europe can apply for an e-visa."
    q: ["ى", "قالَ", "مَن", "عِند", "هُۥ", "فِي", "اسْتَطاعَ", "أَن"]
  - who: "khalid"
    t: "لَكِنْ لَا تَعْتَمِدْ عَلَى كَلَامِ صَدِيقِي. اُنْظُرْ فِي الْمَوْقِعِ الرَّسْمِيِّ؛ الْقَوَاعِدُ تَتَغَيَّرْ."
    tr: "Laakin laa taʿtamid ʿalaa kalaami sadeeqee. Unzur fi l-mawqiʿi r-rasmiyy; al-qawaaʿidu tataghayyar."
    en: "But don't rely on my friend's word. Look on the official website; the rules change."
    q: ["لٰكِن", "لا", "عَلَى", "ى", "نَظَرَ", "فِي"]
  - who: "imran"
    t: "طَيِّبٌ. وَبَعْدَ التَّأْشِيرَةِ؟"
    tr: "Tayyib. Wa baʿda t-ta'sheerah?"
    en: "Okay. And after the visa?"
    q: ["بَعْد"]
  - who: "khalid"
    t: "بَعْدَ ذَلِكَ تَطْبِيقُ «نُسُكْ». فِيهِ تَحْجِزُ تَصْرِيحَ الْعُمْرَةِ: الْيَوْمَ وَالسَّاعَةْ."
    tr: "Baʿda dhaalika tatbeequ Nusuk. Feehi tahjizu tasreeha l-Umrah: al-yawma wa s-saaʿah."
    en: "After that, the Nusuk app. In it you book the Umrah permit: the day and the hour."
    q: ["بَعْد", "ذا", "فِي", "هِ", "يَوْم", "ساعَة"]
  - who: "imran"
    t: "تَصْرِيحٌ؟ أَلَيْسَتِ الْعُمْرَةُ مَفْتُوحَةً لِكُلِّ مُسْلِمٍ؟"
    tr: "Tasreeh? A-laisati l-Umratu maftoohatan li-kulli muslim?"
    en: "A permit? Isn't Umrah open to every Muslim?"
    q: ["لَيْسَ", "كُلّ", "مُسْلِم"]
  - who: "khalid"
    t: "بَلَى، لَكِنَّ النَّاسَ كَثِيرُونَ جِدًّا. التَّصْرِيحُ يُنَظِّمُ الزِّحَامَ فِي الْمَسْجِدِ الْحَرَامْ."
    tr: "Balaa, laakinna n-naasa katheeroona jiddan. At-tasreehu yunazzimu z-zihaama fi l-Masjidi l-Haraam."
    en: "Yes it is, but there are so many people. The permit organises the crowds in Masjid al-Haram."
    q: ["لٰكِنّ", "ناس", "كَثِير", "فِي", "مَسْجِد", "حَرام"]
  - who: "imran"
    t: "هُنَا مَكْتُوبٌ: «اخْتَرِ التَّارِيخَ». هَلْ أَحْجِزُ الْآنْ؟"
    tr: "Hunaa maktoob: ikhtari t-taareekh. Hal ahjizu l-aan?"
    en: "It says here: 'Choose the date.' Shall I book now?"
    q: ["هَل"]
  - who: "khalid"
    t: "لَا تَحْجِزِ الْآنَ. أَوَّلًا التَّأْشِيرَةُ، ثُمَّ الطَّيَرَانُ، ثُمَّ التَّصْرِيحْ."
    tr: "Laa tahjizi l-aan. Awwalan at-ta'sheerah, thumma t-tayaraan, thumma t-tasreeh."
    en: "Don't book now. First the visa, then the flight, then the permit."
    q: ["لا", "أَوَّل", "ثُمّ"]
  - who: "khalid"
    t: "وَالْآنَ قُلْ أَنْتَ: مَاذَا قَالَ خَالِدٌ؟"
    tr: "Wa l-aana qul anta: maadhaa qaala Khalid?"
    en: "And now you say it: what did Khalid say?"
    q: ["قالَ", "أَنتَ", "ما", "ذا", "خالِد"]
  - who: "imran"
    t: "قَالَ خَالِدٌ: التَّأْشِيرَةُ، ثُمَّ الطَّيَرَانُ، ثُمَّ التَّصْرِيحُ. وَقَالَ أَيْضًا: لَا تَعْجَلْ يَا عِمْرَانْ!"
    tr: "Qaala Khalid: at-ta'sheerah, thumma t-tayaraan, thumma t-tasreeh. Wa qaala aidan: laa taʿjal ya Imran!"
    en: "(smiling) Khalid said: the visa, then the flight, then the permit. And he also said: don't rush, Imran!"
    q: ["قالَ", "خالِد", "ثُمّ", "لا"]
  - who: "khalid"
    t: "صَحِيحٌ. الْقَوْلُ سَهْلٌ، وَالْعَمَلُ صَعْبْ."
    tr: "Saheeh. Al-qawlu sahl, wa l-ʿamalu saʿb."
    en: "(laughing) Right. Saying is easy, doing is hard."
    q: ["قَوْل", "عَمَل"]

  - section: "🧾 Thursday 8 October — a rejected photo, and the verb جَعَلَ"
    learn: "جَعَلَ jaʿala = to make, to put, to turn something into something. جَعَلَنِي سَعِيدًا = it made me happy · جَعَلْنَا jaʿalnaa = We made (in the Quran, Allah speaking with the 'We' of majesty — not a number: Allah is One). ع: the throat squeezed — don't drop it as Urdu often does (ʿUmrah, not 'Umrah' with a plain U). وَجْه wajh = face."
  - scene: "Thursday 8 October. The lakeside café, their regular Thursday lesson. Imran drops into his chair and pushes his phone across the table."
  - who: "khalid"
    t: "مَا بِكَ يَا عِمْرَانُ؟ أَرَى التَّعَبَ فِي وَجْهِكْ."
    tr: "Maa bika ya Imran? Araa t-taʿaba fee wajhik."
    en: "What's wrong, Imran? I can see tiredness in your face."
    q: ["ما", "كَ", "رَأَى", "فِي", "وَجْه"]
  - who: "imran"
    t: "الْمَوْقِعُ رَفَضَ صُورَتِي ثَلَاثَ مَرَّاتٍ! قَالَ: الْخَلْفِيَّةُ لَيْسَتْ بَيْضَاءْ."
    tr: "Al-mawqiʿu rafada sooratee thalaatha marraat! Qaala: al-khalfiyyatu laisat baidaa'."
    en: "The website rejected my photo three times! It said: the background isn't white."
    q: ["ى", "قالَ", "لَيْسَ"]
  - who: "imran"
    t: "جَعَلَنِي مَجْنُونًا! صَوَّرْتُ نَفْسِي أَمَامَ الْجِدَارِ خَمْسَ مَرَّاتٍ، وَفِي النِّهَايَةِ قَبِلَهَا."
    tr: "Jaʿalanee majnoonaa! Sawwartu nafsee amaama l-jidaari khamsa marraat, wa fi n-nihaayati qabilahaa."
    en: "It drove me mad! I photographed myself against the wall five times, and in the end it accepted it."
    q: ["جَعَلَ", "ى", "نَفْس", "فِي", "هَا"]
  - who: "khalid"
    t: "الْحَمْدُ لِلَّهِ. وَهَذَا دَرْسُنَا الْيَوْمَ: «جَعَلَ». جَعَلَ يَعْنِي: صَنَعَ، أَوْ وَضَعَ، أَوْ غَيَّرَ شَيْئًا إِلَى شَيْءٍ آخَرْ."
    tr: "Alhamdulillah. Wa haadhaa darsunaa l-yawm: jaʿala. Jaʿala yaʿnee: sanaʿa, aw wadaʿa, aw ghayyara shai'an ilaa shai'in aakhar."
    en: "Alhamdulillah. And that's our lesson today: jaʿala. It means to make, or to put, or to turn one thing into another."
    q: ["حَمْد", "اللَّه", "ذا", "نَا", "يَوْم", "جَعَلَ", "أَو", "شَىْء", "إِلَى", "آخَر"]
  - who: "khalid"
    t: "مَثَلًا: جَعَلَ الْمُدِيرُ الِاجْتِمَاعَ يَوْمَ الِاثْنَيْنِ. أَوْ: الْمَطَرُ جَعَلَ الطَّرِيقَ مُبْتَلًّا."
    tr: "Mathalan: jaʿala l-mudeeru l-ijtimaaʿa yawma l-ithnain. Aw: al-mataru jaʿala t-tareeqa mubtallaa."
    en: "For example: the manager put the meeting on Monday. Or: the rain made the road wet."
    q: ["مَثَل", "جَعَلَ", "يَوْم", "أَو"]
  - who: "imran"
    t: "وَأَنَا جَعَلْتُ الْعُمْرَةَ هَدَفِي هَذِهِ السَّنَةْ."
    tr: "Wa ana jaʿaltu l-Umrata hadafee haadhihi s-sanah."
    en: "And I've made Umrah my goal this year."
    q: ["أَنَا۠", "جَعَلَ", "ى", "ذا"]
  - who: "khalid"
    t: "جُمْلَةٌ جَمِيلَةٌ. وَفِي الْقُرْآنِ عَنِ الْكَعْبَةِ: «وَإِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِلنَّاسِ وَأَمْنًا»."
    tr: "Jumlatun jameelah. Wa fi l-Quraani ʿani l-Kaaba: wa idh jaʿalna l-baita mathaabatan li-n-naasi wa amnaa."
    en: "A beautiful sentence. And in the Quran, about the Kaaba: 'And when We made the House a place of return for people, and a place of safety.'"
    q: ["فِي", "قُرْءان", "عَن", "إِذ", "جَعَلَ", "نَا", "بَيْت", "ناس"]
  - who: "imran"
    t: "«جَعَلْنَا»: «نَا» يَعْنِي نَحْنُ. لَكِنَّ اللَّهَ وَاحِدٌ…"
    tr: "Jaʿalnaa: naa yaʿnee nahnu. Laakinna Allaha waahid…"
    en: "'Jaʿalnaa': 'naa' means 'we'. But Allah is One…"
    q: ["جَعَلَ", "نَا", "نَحْنُ", "لٰكِنّ", "اللَّه", "واحِد"]
  - who: "khalid"
    t: "نَعَمْ. «نَحْنُ» هُنَا لِلتَّعْظِيمِ، لَيْسَتْ لِلْعَدَدِ. مِثْلَ مَلِكٍ يَقُولُ: نَحْنُ أَمَرْنَا."
    tr: "Naʿam. Nahnu hunaa li-t-taʿzeem, laisat li-l-ʿadad. Mithla malikin yaqoolu: nahnu amarnaa."
    en: "Yes. 'We' here is for majesty, not for number. Like a king who says: 'We have ordered.'"
    q: ["نَعَم", "نَحْنُ", "لَيْسَ", "مِثْل", "قالَ", "أَمَرَ", "نَا"]
  - who: "imran"
    t: "وَ«مَثَابَةً»؟"
    tr: "Wa mathaabatan?"
    en: "And 'mathaabah'?"
    q: []
  - who: "khalid"
    t: "مَثَابَةٌ: مَكَانٌ يَرْجِعُ إِلَيْهِ النَّاسُ مَرَّةً بَعْدَ مَرَّةٍ، وَلَا يَشْبَعُونَ مِنْهْ."
    tr: "Mathaabah: makaanun yarjiʿu ilaihi n-naasu marratan baʿda marrah, wa laa yashbaʿoona minh."
    en: "Mathaabah: a place people return to again and again, and never have enough of."
    q: ["رَجَعَ", "إِلَى", "هِ", "ناس", "بَعْد", "لا", "مِن", "هُ"]
  - who: "imran"
    t: "وَأَنَا أَذْهَبُ إِلَيْهِ لِأَوَّلِ مَرَّةٍ فِي حَيَاتِي."
    tr: "Wa ana adh-habu ilaihi li-awwali marratin fee hayaatee."
    en: "(quietly) And I'm going to it for the first time in my life."
    q: ["أَنَا۠", "ذَهَبَ", "إِلَى", "هِ", "أَوَّل", "فِي", "حَياة", "ى"]
  - who: "khalid"
    t: "وَسَتَرْجِعُ إِلَيْهِ مَرَّةً بَعْدَ مَرَّةٍ، إِنْ شَاءَ اللَّهْ."
    tr: "Wa satarjiʿu ilaihi marratan baʿda marrah, Insha Allah."
    en: "And you'll return to it again and again, Insha Allah."
    q: ["رَجَعَ", "إِلَى", "هِ", "بَعْد", "إِن", "شاءَ", "اللَّه"]

  - section: "🕌 Friday 16 October — ihram, niyyah and the miqat"
    learn: "إِحْرَام Ihram = entering the sacred state (not only the two white cloths) · نِيَّة niyyah = intention, in the heart · مِيقَات meeqaat = the set place where pilgrims enter Ihram. آمَنَ aamana = he believed · آمَنْتُ aamantu = I believed · آمَنُوا aamanoo = they believed · مُؤْمِن mu'min = believer · إِيمَان eemaan = faith — same root as أَمْن amn (safety). كَفَرَ kafara: the root first means 'to cover'. Detailed rulings differ: ask a scholar about your own case."
  - scene: "Friday 16 October. After Jumu'ah, the small office of Imam Abdullah behind the prayer hall. Mint tea in glass cups; the radiator ticks."
  - who: "imam"
    t: "أَهْلًا يَا عِمْرَانُ. قَالَ لِي خَالِدٌ: أَنْتَ ذَاهِبٌ إِلَى الْعُمْرَةِ فِي دِيسَمْبَرْ."
    tr: "Ahlan ya Imran. Qaala lee Khalid: anta dhaahibun ila l-Umrati fee December."
    en: "Welcome, Imran. Khalid told me you're going for Umrah in December."
    q: ["أَهْل", "قالَ", "ى", "خالِد", "أَنتَ", "إِلَى", "فِي"]
  - who: "imran"
    t: "نَعَمْ، إِنْ شَاءَ اللَّهُ. وَعِنْدِي أَسْئِلَةٌ كَثِيرَةٌ عَنِ الْإِحْرَامْ."
    tr: "Naʿam, Insha Allah. Wa ʿindee as'ilatun katheeratun ʿani l-Ihraam."
    en: "Yes, Insha Allah. And I have a lot of questions about Ihram."
    q: ["نَعَم", "إِن", "شاءَ", "اللَّه", "عِند", "ى", "كَثِير", "عَن"]
  - who: "imran"
    t: "مَا هُوَ الْإِحْرَامُ بِالضَّبْطِ؟ هَلْ هُوَ الثِّيَابُ الْبَيْضَاءْ؟"
    tr: "Maa huwa l-Ihraamu bi-d-dabt? Hal huwa th-thiyaabu l-baidaa'?"
    en: "What exactly is Ihram? Is it the white clothes?"
    q: ["ما", "هُوَ", "هَل"]
  - who: "imam"
    t: "الثِّيَابُ جُزْءٌ مِنْهُ فَقَطْ. الْإِحْرَامُ هُوَ النِّيَّةُ: أَنْ تَدْخُلَ فِي الْعُمْرَةِ بِقَلْبِكْ."
    tr: "Ath-thiyaabu juz'un minhu faqat. Al-Ihraamu huwa n-niyyah: an tadkhula fi l-Umrati bi-qalbik."
    en: "The clothes are only part of it. Ihram is the intention: entering into Umrah with your heart."
    q: ["مِن", "هُ", "هُوَ", "أَن", "دَخَلَ", "فِي", "قَلْب", "كَ"]
  - who: "imam"
    t: "وَلِلرَّجُلِ ثَوْبَانِ أَبْيَضَانِ غَيْرُ مَخِيطَيْنِ: إِزَارٌ وَرِدَاءْ."
    tr: "Wa li-r-rajuli thawbaani abyadaani ghairu makheetain: izaarun wa ridaa'."
    en: "And for a man, two white unstitched cloths: a lower wrap and an upper sheet."
    q: ["رَجُل", "غَيْر"]
  - who: "imran"
    t: "وَالنِّيَّةُ… هَلْ أَقُولُهَا بِلِسَانِي؟"
    tr: "Wa n-niyyah… hal aqooluhaa bi-lisaanee?"
    en: "And the intention… do I say it with my tongue?"
    q: ["هَل", "قالَ", "هَا", "ى"]
  - who: "imam"
    t: "النِّيَّةُ فِي الْقَلْبِ. وَيَقُولُ الْمُحْرِمُ: «لَبَّيْكَ عُمْرَةً»، كَمَا جَاءَ فِي السُّنَّةْ."
    tr: "An-niyyatu fi l-qalb. Wa yaqoolu l-muhrimu: labbaika ʿumratan, kamaa jaa'a fi s-sunnah."
    en: "The intention is in the heart. And the pilgrim says 'Labbaika ʿUmratan' — 'Here I am, for Umrah' — as it comes in the Sunnah."
    q: ["فِي", "قَلْب", "قالَ", "ما", "جاءَ"]
  - who: "imam"
    t: "وَتُحْرِمُ مِنَ الْمِيقَاتِ. الْمِيقَاتُ مَكَانٌ حَدَّدَهُ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَلَا يَتَجَاوَزُهُ مَنْ يُرِيدُ الْعُمْرَةَ إِلَّا مُحْرِمًا."
    tr: "Wa tuhrimu mina l-meeqaat. Al-meeqaatu makaanun haddadahu n-Nabiyyu sallallahu ʿalaihi wa sallam, wa laa yatajaawazuhu man yureedu l-Umrata illaa muhrimaa."
    en: "And you enter Ihram at the miqat. The miqat is a place the Prophet, peace be upon him, fixed; whoever intends Umrah does not pass it except in Ihram."
    q: ["مِن", "هُۥ", "نَبِيّ", "اللَّه", "عَلَى", "هِ", "لا", "مَن", "أَرادَ", "إِلّا"]
  - who: "imran"
    t: "لَكِنِّي فِي الطَّائِرَةِ! أَيْنَ الْمِيقَاتُ فِي السَّمَاءْ؟"
    tr: "Laakinnee fi t-taa'irah! Aina l-meeqaatu fi s-samaa'?"
    en: "But I'll be on a plane! Where is the miqat in the sky?"
    q: ["لٰكِنّ", "ى", "فِي", "سَماء"]
  - who: "imam"
    t: "الطَّائِرَةُ تَمُرُّ فَوْقَ الْمِيقَاتِ أَوْ قَرِيبًا مِنْهُ. الْقَادِمُ مِنْ أُورُوبَّا يَمُرُّ غَالِبًا بِمِيقَاتِ الْجُحْفَةِ، قُرْبَ رَابِغْ."
    tr: "At-taa'iratu tamurru fawqa l-meeqaati aw qareeban minh. Al-qaadimu min Oroppa yamurru ghaaliban bi-meeqaati l-Juhfah, qurba Raabigh."
    en: "The plane passes over the miqat or near it. Someone coming from Europe usually passes the miqat of Al-Juhfa, near Rabigh."
    q: ["فَوْق", "أَو", "مِن", "هُ"]
  - who: "imam"
    t: "وَكَثِيرٌ مِنَ الطَّائِرَاتِ تُعْلِنُ قَبْلَ الْمِيقَاتِ، لِذَلِكَ يَلْبَسُ النَّاسُ ثِيَابَ الْإِحْرَامِ قَبْلَ الرِّحْلَةِ أَوْ فِي الطَّائِرَةْ."
    tr: "Wa katheerun mina t-taa'iraati tuʿlinu qabla l-meeqaat, li-dhaalika yalbasu n-naasu thiyaaba l-Ihraami qabla r-rihlati aw fi t-taa'irah."
    en: "Many airlines announce it before the miqat, so people put on the Ihram clothes before the flight or on the plane."
    q: ["كَثِير", "مِن", "قَبْل", "ذا", "ناس", "أَو", "فِي"]
  - who: "imran"
    t: "لَكِنْ عِنْدِي مُشْكِلَةٌ. أَنَا لَا أَذْهَبُ إِلَى مَكَّةَ مُبَاشَرَةً. أَبْقَى ثَلَاثَ لَيَالٍ فِي جُدَّةَ عِنْدَ أَهْلِ خَالِدٍ أَوَّلًا."
    tr: "Laakin ʿindee mushkilah. Ana laa adh-habu ilaa Makkata mubaasharatan. Abqaa thalaatha layaalin fee Jiddata ʿinda ahli Khalidin awwalaa."
    en: "But I have a problem. I'm not going straight to Makkah. I'm staying three nights in Jeddah with Khalid's family first."
    q: ["لٰكِن", "عِند", "ى", "أَنَا۠", "لا", "ذَهَبَ", "إِلَى", "لَيْل", "فِي", "أَهْل", "خالِد", "أَوَّل"]
  - who: "imam"
    t: "هَذِهِ مَسْأَلَةٌ فِيهَا تَفْصِيلٌ، وَالْعُلَمَاءُ اخْتَلَفُوا فِيهَا."
    tr: "Haadhihi mas'alatun feehaa tafseel, wa l-ʿulamaa'u khtalafoo feehaa."
    en: "This is a question with details, and the scholars have differed on it."
    q: ["ذا", "فِي", "هَا", "اخْتَلَفَ"]
  - who: "imam"
    t: "بَعْضُهُمْ قَالَ: إِذَا كَانَتْ نِيَّتُكَ الْعُمْرَةَ مِنَ الْبِدَايَةِ، فَأَحْرِمْ قَبْلَ أَنْ تَتَجَاوَزَ الْمِيقَاتْ."
    tr: "Baʿduhum qaala: idhaa kaanat niyyatuka l-Umrata mina l-bidaayah, fa-ahrim qabla an tatajaawaza l-meeqaat."
    en: "Some of them said: if your intention was Umrah from the start, enter Ihram before you pass the miqat."
    q: ["بَعْض", "هُمْ", "قالَ", "إِذا", "كانَ", "كَ", "مِن", "قَبْل", "أَن"]
  - who: "imam"
    t: "وَبَعْضُهُمْ قَالَ: إِذَا كَانَ سَفَرُكَ لِزِيَارَةِ أَهْلٍ فِي جُدَّةَ، وَتُقِيمُ عِنْدَهُمْ، فَلَكَ أَنْ تُحْرِمَ مِنْ جُدَّةْ."
    tr: "Wa baʿduhum qaala: idhaa kaana safaruka li-ziyaarati ahlin fee Jiddah, wa tuqeemu ʿindahum, fa-laka an tuhrima min Jiddah."
    en: "And some of them said: if your journey is to visit people in Jeddah and you stay with them, you may enter Ihram from Jeddah."
    q: ["بَعْض", "هُمْ", "قالَ", "إِذا", "كانَ", "كَ", "أَهْل", "فِي", "عِند", "أَن", "مِن"]
  - who: "imam"
    t: "أَنَا لَا أُعْطِيكَ فَتْوًى الْيَوْمَ. اُكْتُبْ تَفَاصِيلَ رِحْلَتِكَ كُلَّهَا، وَاسْأَلْ عَالِمًا تَثِقُ بِهْ."
    tr: "Ana laa uʿteeka fatwan al-yawm. Uktub tafaaseela rihlatika kullahaa, wa s'al ʿaaliman tathiqu bih."
    en: "I'm not giving you a fatwa today. Write down all the details of your trip, and ask a scholar you trust."
    q: ["أَنَا۠", "لا", "كَ", "يَوْم", "كَتَبَ", "كُلّ", "هَا", "سَأَلَ", "هِۦ"]
  - who: "imran"
    t: "جَزَاكَ اللَّهُ خَيْرًا. سَأَسْأَلُ، وَسَأَعْمَلُ بِمَا يَقُولُ."
    tr: "Jazak Allahu khairan. Sa-as'alu, wa sa-aʿmalu bimaa yaqool."
    en: "Jazak Allahu khairan. I'll ask, and I'll act on what he says."
    q: ["جَزَى", "كَ", "اللَّه", "خَيْر", "سَأَلَ", "عَمِلَ", "ما", "قالَ"]
  - who: "imam"
    t: "وَأَبْشِرْ. قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: «الْعُمْرَةُ إِلَى الْعُمْرَةِ كَفَّارَةٌ لِمَا بَيْنَهُمَا، وَالْحَجُّ الْمَبْرُورُ لَيْسَ لَهُ جَزَاءٌ إِلَّا الْجَنَّةُ»."
    tr: "Wa abshir. Qaala Rasoolullahi sallallahu ʿalaihi wa sallam: al-ʿUmratu ila l-ʿUmrati kaffaaratun limaa bainahumaa, wa l-Hajju l-mabrooru laisa lahu jazaa'un illa l-Jannah."
    en: "And here is good news. The Messenger of Allah, peace be upon him, said: 'One Umrah to the next wipes out what is between them, and an accepted Hajj has no reward but Paradise.'"
    q: ["قالَ", "رَسُول", "اللَّه", "عَلَى", "هِ", "إِلَى", "ما", "بَيْن", "لَيْسَ", "هُۥ", "جَزاء", "إِلّا", "جَنَّة"]
  - who: "imran"
    t: "«كَفَّارَةٌ»… هَلْ هِيَ مِنْ «كَفَرَ»؟"
    tr: "Kaffaarah… hal hiya min kafara?"
    en: "'Kaffaarah'… does it come from 'kafara'?"
    q: ["هَل", "هِىَ", "مِن", "كَفَرَ"]
  - who: "imam"
    t: "نَفْسُ الْجَذْرِ. «كَفَرَ» فِي الْأَصْلِ: غَطَّى. الْكَافِرُ غَطَّى الْحَقَّ، وَالْكَفَّارَةُ تُغَطِّي الذُّنُوبَ وَتَمْحُوهَا."
    tr: "Nafsu l-jadhr. Kafara fi l-asl: ghattaa. Al-kaafiru ghatta l-haqq, wa l-kaffaaratu tughatti dh-dhunooba wa tamhoohaa."
    en: "The same root. 'Kafara' originally means to cover. The kaafir covered over the truth, and the kaffaarah covers the sins and wipes them away."
    q: ["نَفْس", "كَفَرَ", "فِي", "كافِر", "حَقّ", "هَا"]
  - who: "imam"
    t: "وَالْآنَ كَلِمَةٌ أُخْرَى: «آمَنَ». أَنْتَ تَقْرَأُ «الَّذِينَ آمَنُوا» كَثِيرًا. مَا مَعْنَاهَا؟"
    tr: "Wa l-aana kalimatun ukhraa: aamana. Anta taqra'u alladheena aamanoo katheeraa. Maa maʿnaahaa?"
    en: "And now another word: 'aamana'. You often recite 'alladheena aamanoo'. What does it mean?"
    q: ["كَلِمَة", "آمَنَ", "أَنتَ", "الَّذِي", "كَثِير", "ما", "هَا"]
  - who: "imran"
    t: "الَّذِينَ صَدَّقُوا بِقُلُوبِهِمْ؟"
    tr: "Alladheena saddaqoo bi-quloobihim?"
    en: "Those who believed with their hearts?"
    q: ["الَّذِي", "قَلْب", "هُمْ"]
  - who: "imam"
    t: "نَعَمْ. آمَنْتُ، آمَنْتَ، آمَنُوا. وَالْمُؤْمِنُ: الَّذِي آمَنَ. وَمِنْ نَفْسِ الْجَذْرِ: الْأَمْنُ وَالْأَمَانْ."
    tr: "Naʿam. Aamantu, aamanta, aamanoo. Wa l-mu'minu: alladhee aamana. Wa min nafsi l-jadhr: al-amnu wa l-amaan."
    en: "Yes. I believed, you believed, they believed. And the mu'min is the one who believed. And from the same root: safety and security."
    q: ["نَعَم", "آمَنَ", "مُؤْمِن", "الَّذِي", "مِن", "نَفْس"]
  - who: "imran"
    t: "سُبْحَانَ اللَّهِ… الْإِيمَانُ وَالْأَمَانُ مِنْ بَيْتٍ وَاحِدْ."
    tr: "Subhan Allah… al-eemaanu wa l-amaanu min baitin waahid."
    en: "Subhan Allah… faith and safety come from one house."
    q: ["سُبْحان", "اللَّه", "إِيمان", "مِن", "بَيْت", "واحِد"]
  - who: "imam"
    t: "هَكَذَا تَعَلَّمِ الْعَرَبِيَّةَ: لِكُلِّ كَلِمَةٍ أَهْلٌ وَبَيْتٌ. وَأَنْتَ ذَاهِبٌ إِلَى أَوَّلِ بَيْتٍ لِلنَّاسِ. اسْمَعْ."
    tr: "Haakadhaa taʿallami l-ʿArabiyyah: li-kulli kalimatin ahlun wa bait. Wa anta dhaahibun ilaa awwali baitin li-n-naas. Ismaʿ."
    en: "That's how to learn Arabic: every word has a family and a house. And you are going to the first House made for people. Listen."
    q: ["كُلّ", "كَلِمَة", "أَهْل", "بَيْت", "أَنتَ", "إِلَى", "أَوَّل", "ناس", "سَمِعَ"]
