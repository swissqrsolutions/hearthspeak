  - section: "📞 Friday 27 November — Abu Khalid and Umm Khalid"
    learn: "Saudis call parents by their eldest son: أَبُو خَالِدٍ Abu Khalid (father of Khalid), أُمُّ خَالِدٍ Umm Khalid. A younger man says يَا عَمِّي ya ʿammee (uncle) to an older man and يَا خَالَةُ ya khaalah (auntie) to an older woman — respectful, not literal. Family: أَبٌ ab (father) · أُمٌّ umm (mother) · أَخٌ akh (brother) · أُخْتٌ ukht (sister) · ابْنٌ ibn (son) · وَلَدٌ walad (child, boy; Umm Khalid's يَا وَلَدِي = 'my son'). صَبَرَ sabara = to be patient — صَبْر, as in إِنَّ اللَّهَ مَعَ الصَّابِرِينَ. ص = heavy s."
  - scene: "Friday 27 November, after Maghrib. Khalid's flat in Zurich, a tablet propped against the teapot. In Jeddah it is two hours later; the family is sitting in the majlis, Abu Khalid in the middle with his reading glasses on."
