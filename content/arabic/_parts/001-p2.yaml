  - section: "👦 Sara and Faisal — family words"
    learn: "Faisal speaks Hijazi, the Jeddah dialect: إِيشْ eesh = مَاذَا (what) · مِينْ meen = مَنْ (who) · فِينْ feen = أَيْنَ (where) · مَرَّة marra = جِدًّا (very) · أَبْغَى abghaa = أُرِيدُ (I want — from Quranic ابْتَغَى, to seek) · أَشُوفْ ashoof = أَرَى (I see) · يَلَّا yalla = come on · جِيبْ jeeb = أَحْضِرْ (bring). The family restates for Imran in Fusha. عَمَّة ʿamma = father's sister; جَدّ jadd = grandfather, جَدَّة jadda = grandmother. نَهَار nahaar = daytime, the opposite of لَيْل lail (night) — a Quran pair."
  - scene: "A small face pushes into the frame from the side, almost knocking the tablet over: Faisal, ten years old, in a white thobe."
