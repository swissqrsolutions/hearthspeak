    q: ["لا", "نَسِيَ", "ماء", "قَبْل"]
  - who: "faisal"
    t: "مَعَ السَّلَامَةْ! جِيبْ مَعَاكْ شُوكُولَاتَةْ!"
    tr: "Maʿa s-salaamah! Jeeb maʿaak shokolaatah!"
    en: "Bye! Bring chocolate with you!"
    q: ["مَع", "سَلام"]
  - who: "khalid"
    t: "يَقُولُ: أَحْضِرْ مَعَكَ شُوكُولَاتَةً. يَا فَيْصَلُ، أَيْنَ الْأَدَبُ؟"
    tr: "Yaqool: ahdir maʿaka shokolaatah. Ya Faisal, aina l-adab?"
    en: "He's saying: bring chocolate with you. Faisal, where are your manners?"
    q: ["قالَ", "مَع", "كَ"]
  - who: "imran"
    t: "هِيَ فِي الْحَقِيبَةِ مِنَ الْآنَ يَا فَيْصَلُ!"
    tr: "Hiya fi l-haqeebati mina l-aana ya Faisal!"
    en: "(laughing) It's already in the suitcase, Faisal!"
    q: ["هِىَ", "فِي", "مِن"]
  - scene: "The screen goes dark. Rain taps on Khalid's window. Imran sits for a moment without speaking, holding his cold tea."
  - who: "imran"
    t: "يَا خَالِدُ… أَهْلُكَ… لَا أَعْرِفُ مَاذَا أَقُولُ."
    tr: "Ya Khalid… ahluk… laa aʿrifu maadhaa aqool."
    en: "Khalid… your family… I don't know what to say."
    q: ["خالِد", "أَهْل", "كَ", "لا", "ما", "ذا", "قالَ"]
  - who: "khalid"
    t: "لَا تَقُلْ شَيْئًا. قُلْ: الْحَمْدُ لِلَّهْ."
    tr: "Laa taqul shai'aa. Qul: Alhamdulillah."
    en: "Don't say anything. Just say: Alhamdulillah."
    q: ["لا", "قالَ", "شَىْء", "حَمْد", "اللَّه"]
  - who: "imran"
    t: "الْحَمْدُ لِلَّهِ. ثَلَاثَةُ أَسَابِيعَ… ثُمَّ جُدَّةُ، ثُمَّ مَكَّةُ، إِنْ شَاءَ اللَّهْ."
    tr: "Alhamdulillah. Thalaathatu asaabeeʿ… thumma Jiddah, thumma Makkah, Insha Allah."
    en: "Alhamdulillah. Three weeks… then Jeddah, then Makkah, Insha Allah."
    q: ["حَمْد", "اللَّه", "ثُمّ", "إِن", "شاءَ"]
