  - section: "🧳 Thursday 26 November — packing, and the scholar's answer"
    learn: "Attached pronouns, the endings you hear in every ayah: ـِي -ee (my) · ـكَ -ka (your) · ـهُ -hu (his) · ـهَا -haa (her) · ـنَا -naa (our) · ـكُمْ -kum (your, plural) · ـهُمْ -hum (their): كِتَابِي, كِتَابُكَ, كِتَابُهُ, كِتَابُنَا, كِتَابُهُمْ. لَا تَخَفْ laa takhaf = don't be afraid — word for word what is said to Musa in the Quran. ث = 'th' as in 'think' (Urdu says s); Jeddah speech often says t."
