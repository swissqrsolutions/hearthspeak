  - who: "abukhalid"
    t: "الْحَمْدُ لِلَّهِ الَّذِي هَدَاكَ إِلَيْهِ الْآنَ. وَعِنْدَمَا تَأْتِي، أُعَلِّمُكَ كُلَّ لَيْلَةٍ آيَةً، وَتُعَلِّمُنِي أَنْتَ كَلِمَةً مِنْ لُغَتِكَ."
