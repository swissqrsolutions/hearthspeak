  - section: "👋 Goodbye until Jeddah"
    learn: "Goodbyes: فِي أَمَانِ اللَّهِ fee amaanillah = in Allah's safekeeping (أَمَان — same root as آمَنَ and إِيمَان) · مَعَ السَّلَامَةِ maʿa s-salaamah. نَسِيَ nasiya = to forget · لَا تَنْسَ laa tansa = don't forget. Hijazi: جِيبْ مَعَاكْ jeeb maʿaak = أَحْضِرْ مَعَكَ (bring with you)."
