    en: "The first House set up for people is the one at Bakkah, full of blessing, and a guidance for all the worlds."
  - who: "imam"
    t: "«أَوَّلَ بَيْتٍ»: أَوَّلُ بَيْتٍ لِعِبَادَةِ اللَّهِ فِي الْأَرْضِ. وَ«بَكَّةُ» اسْمٌ مِنْ أَسْمَاءِ مَكَّةْ."
    tr: "Awwala bait: awwalu baitin li-ʿibaadati Llaahi fi l-ard. Wa Bakkah: ismun min asmaa'i Makkah."
    en: "'The first House': the first house for the worship of Allah on earth. And 'Bakkah' is one of the names of Makkah."
    q: ["أَوَّل", "بَيْت", "اللَّه", "فِي", "أَرْض", "اسْم", "مِن"]
