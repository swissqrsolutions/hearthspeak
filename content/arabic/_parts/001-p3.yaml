    en: "Alhamdulillah. And did you understand Surah Al-Asr?"
    q: ["حَمْد", "اللَّه", "هَل"]
  - who: "imran"
    t: "بَعْضَهَا. «إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ»: كُلُّ النَّاسِ يَخْسَرُونَ... ثُمَّ «إِلَّا»، وَلَمْ أَفْهَمِ الْبَاقِيَ."
    tr: "Baʿdahaa. «Innal-insaana lafee khusr»: kullun-naasi yakhsaroon... thumma «illaa», wa lam afhamil-baaqee."
    en: "Some of it. 'Innal-insana lafi khusr': all people are losing... then 'illa' — and I didn't understand the rest."
    q: ["بَعْض", "هَا", "إِنّ", "إِنسان", "فِي", "كُلّ", "ناس", "ثُمّ", "إِلّا", "لَم"]
  - who: "abukhalid"
    t: "«إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ»: إِلَّا مَنْ آمَنَ بِاللَّهِ، وَعَمِلَ عَمَلًا صَالِحًا."
    tr: "«Illal-ladheena aamanoo wa ʿamilus-saalihaat»: illaa man aamana billaah, wa ʿamila ʿamalan saalihaa."
    en: "'Except those who believe and do good deeds': except whoever believes in Allah and does good work."
    q: ["إِلّا", "الَّذِي", "آمَنَ", "عَمِلَ", "صالِحَة", "مَن", "اللَّه", "عَمَل", "صالِح"]
  - who: "abukhalid"
    t: "«وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ»: يَنْصَحُ بَعْضُهُمْ بَعْضًا بِالْحَقِّ، وَبِالصَّبْرِ عَلَيْهْ."
    tr: "«Wa tawaasaw bil-haqqi wa tawaasaw bis-sabr»: yansahu baʿduhum baʿdan bil-haqq, wa bis-sabri ʿalayh."
    en: "'And urge one another to the truth and to patience': they advise each other to hold to the truth, and to be patient in it."
    q: ["حَقّ", "بَعْض", "هُم", "عَلَى", "هِۦ"]
  - who: "abukhalid"
    t: "قَالَ الْإِمَامُ الشَّافِعِيُّ رَحِمَهُ اللَّهُ: لَوْ مَا أَنْزَلَ اللَّهُ حُجَّةً عَلَى خَلْقِهِ إِلَّا هٰذِهِ السُّورَةَ لَكَفَتْهُمْ."
    tr: "Qaalal-Imaamush-Shaafiʿiyyu rahimahullaah: law maa anzalAllaahu hujjatan ʿalaa khalqihi illaa haadhihis-soorata la-kafat-hum."
    en: "Imam Al-Shafi'i, may Allah have mercy on him, said: if Allah had sent down no proof to His creation except this surah, it would have been enough for them."
    q: ["قالَ", "هُۥ", "اللَّه", "لَو", "ما", "أَنزَلَ", "عَلَى", "خَلْق", "هِۦ", "إِلّا", "ذا", "هُم"]
  - who: "imran"
    t: "سُورَةٌ قَصِيرَةٌ جِدًّا، وَلٰكِنَّ فِيهَا الدِّينَ كُلَّهْ."
    tr: "Sooratun qaseeratun jiddan, wa laakinna feehad-deena kullah."
    en: "Such a short surah, and yet the whole religion is in it."
    q: ["لٰكِنّ", "فِي", "هَا", "دِين", "كُلّ", "هُۥ"]
  - section: "🍛 Kabsa on the floor"
    learn: "At the سُفْرَة (sufrah, the cloth spread for a meal): say بِسْمِ اللَّهِ, eat with your right hand (يَمِين), and eat from what is in front of you. زِدْ! (zid = take more!) — from Quranic زَادَ, to increase. After the meal guests say سُفْرَةٌ دَائِمَةٌ (may your table always be spread) and make dua for the hosts. ض in ضَيْف and ضِيَافَة (hospitality) is the heavy 'ḍ' — not 'z'. ص in صَحِيح and صَبْر is a heavy 's'."
  - scene: "A plastic sheet is spread over the majlis carpet. Umm Khalid and Sara carry in a huge round tray: orange rice with raisins and fried almonds, and a whole shoulder of lamb on top. Bowls of salad, yoghurt and a spicy tomato sauce surround it."
  - who: "ummkhalid"
    t: "تَفَضَّلُوا، تَفَضَّلُوا. هٰذِهِ كَبْسَةُ لَحْمٍ، طَبَخْتُهَا خَاصَّةً لِعِمْرَانْ."
    tr: "Tafaddaloo, tafaddaloo. Haadhihi kabsatu lahm, tabakhtuhaa khaassatan li-ʿImraan."
    en: "Please, come, come. This is lamb kabsa — I cooked it specially for Imran."
    q: ["ذا", "هَا"]
  - who: "imran"
    t: "مَا شَاءَ اللَّهُ! هٰذَا طَعَامٌ لِقَوْمٍ كَامِلِينَ، لَا لِسِتَّةِ أَشْخَاصْ!"
    tr: "Masha Allah! Haadha taʿaamun li-qawmin kaamileen, laa li-sittati ashkhaas!"
    en: "Masha Allah! This is food for a whole tribe, not for six people!"
    q: ["ما", "شاءَ", "اللَّه", "ذا", "قَوْم", "لا"]
  - who: "abukhalid"
    t: "قُلْ: بِسْمِ اللَّهِ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ. هٰكَذَا عَلَّمَنَا النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمْ."
    tr: "Qul: Bismillah, wa kul bi-yameenik, wa kul mimmaa yaleek. Haakadhaa ʿallamanan-Nabiyyu sallAllahu ʿalayhi wa sallam."
    en: "Say Bismillah, eat with your right hand, and eat from what is in front of you. That is how the Prophet, peace be upon him, taught us."
    q: ["قالَ", "اسْم", "اللَّه", "أَكَلَ", "يَمِين", "كَ", "مِن", "ما", "ذا", "عَلَّمَ", "نَا", "نَبِيّ", "عَلَى", "هِۦ"]
  - who: "imran"
    t: "بِسْمِ اللَّهِ. فِي بَنْغَالُورَ نَأْكُلُ الْبِرْيَانِيَ بِالْيَدِ أَيْضًا. أَنَا مُتَعَوِّدْ!"
    tr: "Bismillah. Fee Bangaloor na'kulul-biryaaniya bil-yadi aydan. Ana mutaʿawwid!"
    en: "Bismillah. In Bengaluru we eat biryani with our hands too. I'm used to it!"
    q: ["اسْم", "اللَّه", "فِي", "أَكَلَ", "يَد", "أَنَا۠"]
  - who: "sara"
    t: "وَمَا الْفَرْقُ بَيْنَ الْبِرْيَانِيِّ وَالْكَبْسَةْ؟"
    tr: "Wa mal-farqu baynal-biryaaniyyi wal-kabsah?"
    en: "And what's the difference between biryani and kabsa?"
    q: ["ما", "بَيْن"]
  - who: "imran"
    t: "الْبِرْيَانِيُّ عِنْدَنَا فِيهِ فُلْفُلٌ أَكْثَرُ، وَهُوَ حَارٌّ جِدًّا. وَالْكَبْسَةُ أَلْطَفُ، وَفِيهَا رَائِحَةُ الْهَيْلِ وَالْقِرْفَةْ."
    tr: "Al-biryaaniyyu ʿindanaa feehi fulfulun akthar, wa huwa haarrun jiddan. Wal-kabsatu altaf, wa feehaa raa'ihatul-hayli wal-qirfah."
    en: "Our biryani has more chilli in it, and it's very hot. Kabsa is gentler, with the smell of cardamom and cinnamon."
    q: ["عِند", "نَا", "فِي", "هِۦ", "أَكْثَر", "هُوَ", "هَا"]
  - who: "ummkhalid"
    t: "زِدْ يَا عِمْرَانُ، زِدْ! أَنْتَ لَمْ تَأْكُلْ شَيْئًا!"
    tr: "Zid yaa ʿImraan, zid! Anta lam ta'kul shay'an!"
    en: "Take more, Imran, take more! You haven't eaten anything!"
    q: ["زادَ", "أَنتَ", "لَم", "أَكَلَ", "شَىْء"]
  - who: "imran"
    t: "وَاللَّهِ أَكَلْتُ كَثِيرًا يَا خَالَةُ! أَكَلْتُ أَكْثَرَ مِنْ خَالِدْ!"
    tr: "WAllahi akaltu katheeran yaa khaalah! Akaltu akthara min Khaalid!"
    en: "By Allah, I've eaten a lot, auntie! I've eaten more than Khalid!"
    q: ["اللَّه", "أَكَلَ", "كَثِير", "أَكْثَر", "مِن"]
  - who: "ummkhalid"
    t: "هٰذِهِ الْقِطْعَةُ لَكَ، لَا تَتْرُكْهَا!"
    tr: "Haadhihil-qitʿatu lak, laa tatruk-haa!"
    en: "(putting a piece of meat in front of him) This piece is for you — don't leave it!"
    q: ["ذا", "كَ", "لا", "تَرَكَ", "هَا"]
  - who: "sara"
    t: "لَا تُحَاوِلْ يَا عِمْرَانُ. أُمِّي لَا تَقْبَلُ «لَا» مِنْ أَحَدٍ عَلَى السُّفْرَةْ."
    tr: "Laa tuhaawil yaa ʿImraan. Ummee laa taqbalu «laa» min ahadin ʿalas-sufrah."
    en: "(laughing) Don't even try, Imran. My mother doesn't accept 'no' from anyone at the table."
    q: ["لا", "ى", "مِن", "أَحَد", "عَلَى"]
  - who: "abukhalid"
    t: "هٰذَا كَرَمٌ قَدِيمٌ يَا عِمْرَانُ، مِنْ أَيَّامِ إِبْرَاهِيمَ عَلَيْهِ السَّلَامُ. اسْمَعْ مَا قَالَ اللَّهُ عَنْ ضُيُوفِهْ:"
    tr: "Haadha karamun qadeemun yaa ʿImraan, min ayyaami Ibraaheema ʿalayhis-salaam. Ismaʿ maa qaalAllaahu ʿan duyoofih:"
    en: "This is an old generosity, Imran — from the days of Ibrahim, peace be upon him. Listen to what Allah says about his guests:"
    q: ["ذا", "مِن", "يَوْم", "إِبْراهِيم", "عَلَى", "هِۦ", "سَلام", "سَمِعَ", "ما", "قالَ", "اللَّه", "عَن"]
  - quran: { s: 51, a: 24 }
    by: "abukhalid"
    en: "Has the story of Ibrahim's honoured guests reached you?"
  - quran: { s: 51, a: 25 }
    by: "abukhalid"
    en: "When they came in to him and said 'Peace!', he answered 'Peace!' — people he did not know."
  - quran: { s: 51, a: 26 }
    by: "abukhalid"
    en: "Then he slipped away quietly to his family and came back with a fat calf,"
  - quran: { s: 51, a: 27 }
    by: "abukhalid"
    en: "and set it close in front of them, saying: 'Won't you eat?'"
  - who: "abukhalid"
    t: "«إِذْ دَخَلُوا عَلَيْهِ فَقَالُوا سَلَامًا»: هُمْ بَدَؤُوا بِالسَّلَامِ، وَهُوَ رَدَّ بِسَلَامٍ أَحْسَنَ، مَعَ أَنَّهُ لَمْ يَعْرِفْهُمْ."
    tr: "«Idh dakhaloo ʿalayhi fa-qaaloo salaamaa»: hum bada'oo bis-salaam, wa huwa radda bi-salaamin ahsan, maʿa annahu lam yaʿrifhum."
    en: "'When they came in to him and said Peace': they began with the greeting, and he answered with a better one — even though he did not know them."
    q: ["إِذ", "دَخَلَ", "عَلَى", "هِۦ", "قالَ", "سَلام", "هُمْ", "هُوَ", "مَع", "أَنّ", "هُۥ", "لَم", "هُم"]
  - who: "abukhalid"
    t: "«فَرَاغَ إِلَى أَهْلِهِ»: ذَهَبَ إِلَى أَهْلِهِ بِسُرْعَةٍ وَبِهُدُوءٍ، وَلَمْ يَسْأَلْهُمْ: هَلْ تُرِيدُونَ طَعَامًا؟"
    tr: "«Fa-raagha ilaa ahlih»: dhahaba ilaa ahlihi bi-surʿatin wa bi-hudoo', wa lam yas'alhum: hal tureedoona taʿaamaa?"
    en: "'He slipped away to his family': he went to his household quickly and quietly — he didn't ask them, 'Do you want food?'"
    q: ["إِلَى", "أَهْل", "هِۦ", "لَم", "سَأَلَ", "هُم", "هَل", "أَرادَ"]
  - who: "abukhalid"
    t: "«فَجَاءَ بِعِجْلٍ سَمِينٍ»: جَاءَ بِأَحْسَنِ مَا عِنْدَهُ. «فَقَرَّبَهُ إِلَيْهِمْ»: وَضَعَهُ قَرِيبًا مِنْهُمْ، لَا بَعِيدًا عَنْهُمْ."
    tr: "«Fa-jaa'a bi-ʿijlin sameen»: jaa'a bi-ahsani maa ʿindah. «Fa-qarrabahu ilayhim»: wadaʿahu qareeban minhum, laa baʿeedan ʿanhum."
    en: "'He brought a fat calf': he brought the best he had. 'He set it close to them': he put it right near them, not far away."
    q: ["جاءَ", "ما", "عِند", "هُۥ", "إِلَى", "هُم", "مِن", "لا", "عَن"]
  - who: "abukhalid"
    t: "ثُمَّ قَالَ: «أَلَا تَأْكُلُونَ؟» بِلُطْفٍ، لَا بِأَمْرٍ. آدَابُ الضِّيَافَةِ كُلُّهَا فِي هٰذِهِ الْآيَاتْ."
    tr: "Thumma qaal: «a-laa ta'kuloon?» bi-lutf, laa bi-amr. Aadaabud-diyaafati kulluhaa fee haadhihil-aayaat."
    en: "Then he said 'Won't you eat?' — gently, not as an order. All the manners of hospitality are in these ayat."
    q: ["ثُمّ", "قالَ", "أَلا", "أَكَلَ", "لا", "أَمْر", "كُلّ", "هَا", "فِي", "ذا", "آيَة"]
  - who: "imran"
    t: "وَأَنْتُمُ اللَّيْلَةَ فَعَلْتُمْ مِثْلَ إِبْرَاهِيمَ تَمَامًا: بِلَا سُؤَالٍ، وَبِأَحْسَنِ مَا عِنْدَكُمْ."
    tr: "Wa antumul-laylata faʿaltum mithla Ibraaheema tamaaman: bilaa su'aal, wa bi-ahsani maa ʿindakum."
    en: "And tonight you did exactly what Ibrahim did: no questions, and the best you have."
    q: ["أَنتُمْ", "فَعَلَ", "مِثْل", "إِبْراهِيم", "ما", "عِند", "كُمْ"]
  - who: "ummkhalid"
    t: "نَحْنُ لَمْ نَفْعَلْ شَيْئًا يَا ابْنِي. هٰذَا حَقُّكَ عَلَيْنَا."
    tr: "Nahnu lam nafʿal shay'an yabnee. Haadha haqquka ʿalaynaa."
    en: "We haven't done anything, my son. This is your right over us."
    q: ["نَحْنُ", "لَم", "فَعَلَ", "شَىْء", "ابْن", "ى", "ذا", "حَقّ", "كَ", "عَلَى", "نَا"]
  - scene: "When everyone has finished, Imran wipes his hand and raises both palms."
  - who: "imran"
    t: "سُفْرَةٌ دَائِمَةٌ. اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ، وَارْحَمْهُمْ."
    tr: "Sufratun daa'imah. Allahumma baarik lahum feemaa razaqtahum, waghfir lahum, warhamhum."
    en: "May your table always be spread. O Allah, bless them in what You have provided for them, forgive them, and have mercy on them."
    q: ["فِي", "ما", "رَزَقَ", "هُم", "غَفَرَ"]
  - who: "abukhalid"
    t: "آمِينَ، آمِينَ، وَاللَّهُ غَفُورٌ رَحِيمٌ. وَمَنْ عَلَّمَكَ هٰذَا الدُّعَاءْ؟"
    tr: "Aameen, aameen, wAllahu ghafoorun raheem. Wa man ʿallamaka haadhad-duʿaa'?"
    en: "Ameen, ameen — and Allah is Forgiving, Merciful. And who taught you this dua?"
    q: ["اللَّه", "غَفُور", "رَحِيم", "مَن", "عَلَّمَ", "كَ", "ذا"]
  - who: "imran"
    t: "ابْنُكَ خَالِدٌ، فِي زِيُورِخَ. قَالَ لِي: هٰذَا دُعَاءُ الضَّيْفِ لِأَهْلِ الْبَيْتِ، مِنْ حَدِيثِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمْ."
    tr: "Ibnuka Khaalid, fee Zyoorikh. Qaala lee: haadha duʿaa'ud-dayfi li-ahlil-bayt, min hadeethin-Nabiyyi sallAllahu ʿalayhi wa sallam."
    en: "Your son Khalid, in Zurich. He told me: this is the guest's dua for the people of the house, from a hadith of the Prophet, peace be upon him."
    q: ["ابْن", "كَ", "فِي", "قالَ", "ى", "ذا", "أَهْل", "بَيْت", "مِن", "نَبِيّ", "اللَّه", "عَلَى", "هِۦ"]
  - who: "abukhalid"
    t: "جَزَاكَ اللَّهُ خَيْرًا يَا خَالِدُ. مَنْ عَلَّمَ خَيْرًا فَلَهُ أَجْرُهُ، وَأَجْرُ مَنْ عَمِلَ بِهْ."
    tr: "Jazak Allahu khairan yaa Khaalid. Man ʿallama khayran fa-lahu ajruhu, wa ajru man ʿamila bih."
    en: "(looking at Khalid) Jazak Allahu khairan, Khalid. Whoever teaches something good has its reward, and the reward of everyone who acts on it."
    q: ["جَزَى", "كَ", "اللَّه", "خَيْر", "مَن", "عَلَّمَ", "هُۥ", "أَجْر", "عَمِلَ", "هِۦ"]
  - who: "abukhalid"
    t: "وَالْآنَ نَحْمَدُ اللَّهَ وَنَشْكُرُهُ عَلَى نِعْمَتِهِ، وَلَا نَكْفُرُهَا. لِذٰلِكَ لَا نَرْمِي الطَّعَامَ الْبَاقِيَ، بَلْ نُعْطِيهِ لِمَنْ يَحْتَاجُهْ."
    tr: "Wal-aana nahmadullaaha wa nashkuruhu ʿalaa niʿmatih, wa laa nakfuruhaa. Li-dhaalika laa narmit-taʿaamal-baaqee, bal nuʿteehi liman yahtaajuh."
    en: "And now we praise Allah and thank Him for His blessing, and we don't repay it with ingratitude. That's why we never throw away leftover food — we give it to someone who needs it."
    q: ["اللَّه", "شَكَرَ", "هُۥ", "عَلَى", "نِعْمَة", "هِۦ", "لا", "كَفَرَ", "هَا", "ذا", "بَل", "مَن"]
  - section: "🫖 Tea and family talk"
    learn: "Talking about work: أَعْمَلُ (aʿmalu = I work, from عَمِلَ), عَمَلِي (my work), فِي نَفْسِ الشَّرِكَةِ (in the same company — نَفْس = self, same). طَبِيبَة = (woman) doctor: ط is a heavy 't'. Hijazi from Faisal: إِيشْ = مَاذَا (what), وَلَّا = أَمْ (or, in a question), تِشَجِّعْ = تُشَجِّعُ (you support a team). أَمْ in 'this or that?' questions is all over the Quran."
  - scene: "Mint tea in small glasses. Faisal lies on the cushions, half listening. Sara glances at her phone: tomorrow she has a night shift."
