  - chapter: "Chapter 6 — The Al-Harbi home"
  - section: "🚪 At the green door"
    learn: "Welcome words: أَهْلًا وَسَهْلًا (Ahlan wa sahlan), حَيَّاكَ اللَّهُ (HayyaakAllah), الْبَيْتُ بَيْتُكَ (al-baytu baytuk = this house is your house), تَفَضَّلْ (please come in), نَوَّرْتَ الْبَيْتَ (you've lit up the house — from نُور, light). Hijazi from Faisal: يَا هَلَا = welcome; مِنْ بَدْرِي = for ages; يِسْتَنَّى = يَنْتَظِرُ (waits). عَمِّي (ʿammee, 'my uncle') and خَالَة (khaalah, 'auntie') are the polite way to address an older man and woman."
  - scene: "Faisal reaches the car before the engine stops. Abu Khalid stands in the doorway in a white thobe, his reading glasses pushed up on his head."
  - who: "faisal"
    t: "عَمِّي خَالِدْ! هَذَا عِمْرَانْ؟ يَا هَلَا، يَا هَلَا! جَدِّي مِنْ بَدْرِي يِسْتَنَّاكُمْ!"
    tr: "ʿAmmee Khaalid! Haadha ʿImraan? Yaa hala, yaa hala! Jaddee min badree yistannaakum!"
    en: "(Hijazi, very fast) Uncle Khalid! Is this Imran? Welcome, welcome! Grandpa's been waiting for you for ages!"
    q: ["ى", "ذا", "مِن"]
  - who: "khalid"
    t: "يَقُولُ فَيْصَلُ: جَدِّي يَنْتَظِرُكُمْ مُنْذُ وَقْتٍ طَوِيلٍ. «يِسْتَنَّى» عِنْدَهُمْ يَعْنِي «يَنْتَظِرُ»."
    tr: "Yaqoolu Faysal: jaddee yantazirukum mundhu waqtin taweel. «Yistanna» ʿindahum yaʿnee «yantaziru»."
    en: "(to Imran) Faisal says Grandpa has been waiting for you for a long time. 'Yistanna' in their speech means 'he waits'."
    q: ["قالَ", "ى", "كُمْ", "عِند", "هُم"]
  - who: "imran"
    t: "السَّلَامُ عَلَيْكَ يَا فَيْصَلُ! أَنْتَ أَطْوَلُ مِمَّا رَأَيْتُكَ عَلَى الشَّاشَةْ!"
    tr: "Assalamu ʿalayka yaa Faysal! Anta atwalu mimmaa ra'aytuka ʿalash-shaashah!"
