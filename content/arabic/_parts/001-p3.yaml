  - section: "🕌 Isha together"
    learn: "إِقَامَة (iqamah) is the second call just before the prayer; it comes from أَقَامَ 'to set up, establish' — the Quran's أَقِيمُوا الصَّلَاةَ. قِبْلَة = direction of the Kaaba. جَمَاعَة = congregation. ع in عِشَاء and عَصْر comes from deep in the throat ('Isha', 'Asr' in IndoPak spelling). ص in صَلَاة and عَصْر is a heavy 's'. Hijazi: مَرَّة = جِدًّا (very); نَاحِيَة = جِهَة (direction)."
  - scene: "Eight o'clock. The Isha congregation at the neighbourhood masjid finished while they were on the Corniche."
  - who: "abukhalid"
    t: "فَاتَتْنَا جَمَاعَةُ الْمَسْجِدِ، فَنُصَلِّي الْعِشَاءَ هُنَا جَمَاعَةً. تَوَضَّأْ يَا عِمْرَانُ، وَخُذْ رَاحَتَكْ."
    tr: "Faatatnaa jamaaʿatul-Masjid, fa-nusallil-ʿIshaa'a hunaa jamaaʿah. Tawadda' yaa ʿImraan, wa khudh raahatak."
    en: "We've missed the congregation at the masjid, so we'll pray Isha here together. Make wuzu, Imran, and take your time."
    q: ["نَا", "أَخَذَ", "كَ"]
  - who: "imran"
    t: "أَيْنَ الْقِبْلَةُ؟ فِي زِيُورِخَ أُصَلِّي إِلَى الْجَنُوبِ الشَّرْقِيِّ، وَفِي بَنْغَالُورَ إِلَى الْغَرْبْ."
    tr: "Aynal-Qiblah? Fee Zyoorikh usallee ilal-janoobish-sharqiyy, wa fee Bangaloor ilal-gharb."
    en: "(after wuzu) Where is the qibla? In Zurich I pray towards the south-east, and in Bengaluru towards the west."
    q: ["فِي", "إِلَى"]
  - who: "faisal"
    t: "هِنَاكْ، نَاحِيَةَ الشَّرْقْ! مَكَّة قَرِيبَة مَرَّة!"
