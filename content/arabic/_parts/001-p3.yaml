    q: ["أَب", "كَ"]
  - who: "khalid"
    t: "عَلَى الطَّرِيقِ يَا أُمِّي. عِشْرُونَ دَقِيقَةً، إِنْ شَاءَ اللَّهْ."
    tr: "ʿAlat-tareeqi yaa ummee. ʿIshroona daqeeqah, Insha Allah."
