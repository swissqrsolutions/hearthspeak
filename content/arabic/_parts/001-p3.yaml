lines:
  - chapter: "Chapter 5 — To Jeddah"
  - section: "✈️ Above the clouds"
    learn: "Polite requests: مِنْ فَضْلِكَ (min fadlik = please), تَفَضَّلْ (tafaddal = here you are / please go ahead), أُرِيدُ (ureedu = I want — from the Quran's أَرَادَ). ض in فَضْل is a heavy 'd' made with the side of the tongue: Urdu says 'fazl', Arabs say 'faḍl'. ذ in مَاذَا is 'dh' as in 'this' (Urdu turns it into 'z'). ث in ثَلَاثَة is 'th' as in 'think' (Urdu says 's'). سَاعَة today means 'hour'; in the Quran السَّاعَة is usually the Hour — the Day of Judgement."
  - scene: "Mid-December 2026, somewhere over Egypt, about two hours before Jeddah. Imran sits by the window. A flight attendant comes down the aisle with a trolley."
  - who: "crew"
    t: "السَّلَامُ عَلَيْكُمْ. مَاذَا تُرِيدُ أَنْ تَشْرَبَ؟"
    tr: "Assalamu Alaikum. Maadha tureedu an tashrab?"
    en: "Assalamu Alaikum. What would you like to drink?"
    q: ["سَلام", "عَلَى", "كُمْ", "ما", "ذا", "أَرادَ", "أَن"]
  - who: "crew"
    t: "عِنْدَنَا مَاءٌ، وَعَصِيرٌ، وَقَهْوَةٌ، وَشَايْ."
    tr: "ʿIndanaa maa'un, wa ʿaseerun, wa qahwatun, wa shaay."
    en: "We have water, juice, coffee and tea."
    q: ["عِند", "نَا", "ماء"]
  - who: "imran"
    t: "وَعَلَيْكُمُ السَّلَامُ. مَاءٌ، مِنْ فَضْلِكَ، وَقَهْوَةٌ بِغَيْرِ سُكَّرْ."
    tr: "Wa Alaikumus-salaam. Maa'un, min fadlik, wa qahwatun bighayri sukkar."
    en: "Wa Alaikumus-salam. Water, please, and coffee without sugar."
    q: ["عَلَى", "كُمُ", "سَلام", "ماء", "مِن", "فَضْل", "كَ", "غَيْر"]
  - who: "crew"
    t: "تَفَضَّلْ. مَا شَاءَ اللَّهُ، أَنْتَ تَتَكَلَّمُ الْعَرَبِيَّةْ!"
    tr: "Tafaddal. Masha Allah, anta tatakallamul-ʿarabiyyah!"
    en: "Here you are. Masha Allah, you speak Arabic!"
    q: ["ما", "شاءَ", "اللَّه", "أَنتَ"]
  - who: "imran"
    t: "قَلِيلًا فَقَطْ. أَنَا أَتَعَلَّمُ مُنْذُ ثَلَاثَةِ أَشْهُرْ."
    tr: "Qaleelan faqat. Ana ataʿallamu mundhu thalaathati ash-hur."
    en: "Only a little. I've been learning for three months."
    q: ["قَلِيل", "أَنَا۠"]
  - who: "crew"
    t: "مِنْ أَيْنَ أَنْتَ؟"
    tr: "Min ayna anta?"
    en: "Where are you from?"
    q: ["مِن", "أَنتَ"]
  - who: "imran"
    t: "أَنَا مِنَ الْهِنْدِ، مِنْ بَنْغَالُورَ، وَلٰكِنِّي أَعْمَلُ فِي زِيُورِخْ."
    tr: "Ana minal-Hind, min Bangaloor, wa laakinnee aʿmalu fee Zyoorikh."
    en: "I'm from India, from Bengaluru, but I work in Zurich."
    q: ["أَنَا۠", "مِن", "لٰكِنّ", "ى", "عَمِلَ", "فِي"]
  - who: "crew"
    t: "أَهْلًا وَسَهْلًا. هَلْ أَنْتَ ذَاهِبٌ إِلَى الْعُمْرَةِ؟"
    tr: "Ahlan wa sahlan. Hal anta dhaahibun ilal-Umrah?"
    en: "Welcome. Are you going for Umrah?"
    q: ["هَل", "أَنتَ", "إِلَى"]
  - who: "imran"
    t: "نَعَمْ، إِنْ شَاءَ اللَّهُ. وَلٰكِنْ أَوَّلًا أَزُورُ عَائِلَةَ صَدِيقِي فِي جُدَّةَ ثَلَاثَةَ أَيَّامْ."
    tr: "Naʿam, Insha Allah. Wa laakin awwalan azooru ʿaa'ilata sadeeqee fee Jiddah thalaathata ayyaam."
    en: "Yes, Insha Allah. But first I'm visiting my friend's family in Jeddah for three days."
    q: ["إِن", "شاءَ", "اللَّه", "لٰكِن", "أَوَّل", "ى", "فِي", "يَوْم"]
  - who: "crew"
    t: "جَمِيلٌ. سَنَصِلُ إِلَى جُدَّةَ بَعْدَ سَاعَتَيْنِ تَقْرِيبًا."
    tr: "Jameel. Sanasilu ilaa Jiddah baʿda saaʿatayni taqreeban."
    en: "Lovely. We'll reach Jeddah in about two hours."
    q: ["إِلَى", "بَعْد", "ساعَة"]
  - who: "imran"
    t: "سَاعَتَانِ؟ فِي الْقُرْآنِ «السَّاعَةُ» هِيَ يَوْمُ الْقِيَامَةِ، أَلَيْسَ كَذٰلِكَ؟"
    tr: "Saaʿataan? Fil-Quran «as-saaʿah» hiya Yawmul-Qiyaamah, a-laysa kadhaalik?"
    en: "Two hours? In the Quran 'as-sa'ah' is the Day of Judgement, isn't it?"
    q: ["ساعَة", "فِي", "قُرْءان", "هِىَ", "يَوْم", "قِيامَة", "لَيْسَ", "ذا"]
  - who: "crew"
    t: "صَحِيحٌ. فِي الْقُرْآنِ هِيَ الْقِيَامَةُ، وَفِي كَلَامِنَا الْيَوْمَ هِيَ سِتُّونَ دَقِيقَةْ."
    tr: "Saheeh. Fil-Quran hiya al-qiyaamah, wa fee kalaaminal-yawma hiya sittoona daqeeqah."
    en: "(smiling) Right. In the Quran it's the Day of Judgement, and in our speech today it's sixty minutes."
    q: ["فِي", "قُرْءان", "هِىَ", "قِيامَة", "نَا", "يَوْم"]
  - scene: "An hour later the captain's voice comes over the speakers. Several passengers stand up with white towels and small bags: they are changing into ihram."
  - who: "crew"
    t: "سَيِّدَاتِي وَسَادَتِي، بَعْدَ عِشْرِينَ دَقِيقَةً نَمُرُّ بِالْمِيقَاتْ."
    tr: "Sayyidaatee wa saadatee, baʿda ʿishreena daqeeqatan namurru bil-meeqaat."
    en: "Ladies and gentlemen, in twenty minutes we will pass the miqat."
    q: ["ى", "بَعْد"]
  - who: "crew"
    t: "مَنْ نَوَى الْعُمْرَةَ الْآنَ، فَلْيَسْتَعِدَّ لِلْإِحْرَامْ."
    tr: "Man nawal-ʿUmrata al-aan, fal-yastaʿidda lil-Ihraam."
    en: "Whoever intends Umrah now should get ready for Ihram."
    q: ["مَن"]
  - who: "imran"
    t: "أَنَا أَبْقَى فِي جُدَّةَ أَوَّلًا. سَأَلْتُ الْإِمَامَ عَبْدَ اللَّهِ فِي زِيُورِخَ عَنْ هٰذَا الْأَمْرِ، وَأَخَذْتُ بِقَوْلِهْ."
    tr: "Ana abqaa fee Jiddah awwalan. Sa'altul-Imaama ʿAbdallaahi fee Zyoorikh ʿan haadhal-amr, wa akhadhtu bi-qawlih."
    en: "(quietly, to the attendant) I'm staying in Jeddah first. I asked Imam Abdullah in Zurich about this, and I'm following what he said."
    q: ["أَنَا۠", "فِي", "أَوَّل", "سَأَلَ", "عَبْد", "اللَّه", "عَن", "ذا", "أَمْر", "أَخَذَ", "قَوْل", "هِۦ"]
  - who: "crew"
    t: "أَحْسَنْتَ. فِي مِثْلِ هٰذِهِ الْمَسَائِلِ نَسْأَلُ أَهْلَ الْعِلْمِ، فَأَحْوَالُ النَّاسِ مُخْتَلِفَةٌ، وَاللَّهُ أَعْلَمْ."
    tr: "Ahsanta. Fee mithli haadhihil-masaa'il nas'alu ahlal-ʿilm, fa-ahwaalun-naasi mukhtalifah, wAllahu aʿlam."
    en: "Good. In matters like these we ask the people of knowledge — everyone's situation is different. And Allah knows best."
    q: ["فِي", "مِثْل", "ذا", "سَأَلَ", "أَهْل", "عِلْم", "ناس", "اللَّه", "أَعْلَم"]
  - section: "🛬 Landing"
    learn: "الْحَمْدُ لِلَّهِ عَلَى السَّلَامَةِ (Alhamdulillah ʿalas-salaamah) = thank God you arrived safely — said to every traveller; the reply is اللَّهُ يُسَلِّمُكَ (Allah yusallimuk = may Allah keep you safe). ح in الْحَمْد is a breathy 'h' squeezed from the middle of the throat, not the soft Urdu 'h'. ط in مَطَار (airport) is a heavy, dark 't'. Arabs say 'ʿaalameen' with a real ع."
  - scene: "Twenty past five in the afternoon, local time. The plane touches down at King Abdulaziz International Airport. The sun is low and orange over the Red Sea."
  - who: "crew"
    t: "الْحَمْدُ لِلَّهِ عَلَى السَّلَامَةِ. أَهْلًا بِكُمْ فِي مَطَارِ الْمَلِكِ عَبْدِ الْعَزِيزِ الدَّوْلِيِّ بِجُدَّةْ."
    tr: "Alhamdulillah ʿalas-salaamah. Ahlan bikum fee mataaril-Malik ʿAbdil-ʿAzeez ad-dawliyyi bi-Jiddah."
    en: "Alhamdulillah for your safe arrival. Welcome to King Abdulaziz International Airport in Jeddah."
    q: ["حَمْد", "اللَّه", "عَلَى", "كُمْ", "فِي", "عَبْد", "عَزِيز"]
  - who: "crew"
    t: "دَرَجَةُ الْحَرَارَةِ فِي جُدَّةَ الْآنَ سَبْعٌ وَعِشْرُونَ دَرَجَةً مِئَوِيَّةْ."
    tr: "Darajatul-haraarati fee Jiddah al-aan sabʿun wa ʿishroona darajatan mi'awiyyah."
    en: "The temperature in Jeddah is now twenty-seven degrees Celsius."
    q: ["فِي"]
  - who: "imran"
    t: "سَبْعٌ وَعِشْرُونَ! وَفِي زِيُورِخَ صَبَاحَ الْيَوْمِ كَانَتِ الْحَرَارَةُ دَرَجَتَيْنِ تَحْتَ الصِّفْرْ."
    tr: "Sabʿun wa ʿishroon! Wa fee Zyoorikh sabaahal-yawmi kaanatil-haraaratu darajatayni tahtas-sifr."
    en: "(to himself) Twenty-seven! And in Zurich this morning it was two degrees below zero."
    q: ["فِي", "يَوْم", "كانَ", "تَحْت"]
  - who: "imran"
    t: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ... بَلَغْتُ أَرْضَ الْحِجَازِ أَخِيرًا."
    tr: "Alhamdulillahi Rabbil-ʿaalameen... balaghtu ardal-Hijaazi akheeran."
    en: "(quietly, looking out of the window) All praise is for Allah, Lord of the worlds... At last I have reached the land of the Hijaz."
    q: ["حَمْد", "اللَّه", "رَبّ", "عالَم", "بَلَغَ", "أَرْض"]
  - who: "crew"
    t: "مَعَ السَّلَامَةِ. عُمْرَةً مَقْبُولَةً، إِنْ شَاءَ اللَّهْ."
    tr: "Maʿas-salaamah. ʿUmratan maqboolah, Insha Allah."
    en: "(at the door) Goodbye. May your Umrah be accepted, Insha Allah."
    q: ["مَع", "سَلام", "إِن", "شاءَ", "اللَّه"]
  - who: "imran"
    t: "جَزَاكَ اللَّهُ خَيْرًا."
    tr: "Jazak Allahu khairan."
    en: "Jazak Allahu khairan — may Allah reward you with good."
    q: ["جَزَى", "كَ", "اللَّه", "خَيْر"]
  - section: "🛂 Passport control"
    learn: "Formal questions: مَا سَبَبُ الزِّيَارَةِ؟ (maa sababuz-ziyaarah = what is the purpose of the visit?), كَمْ يَوْمًا؟ (kam yawman = how many days? — after كَمْ the noun is singular), أَيْنَ تَسْكُنُ؟ (where will you stay?). ضَيْفُ الرَّحْمٰنِ (dayful-Rahmaan) = guest of the Most Merciful — Saudis call every pilgrim this. ز in زِيَارَة is a real 'z'; keep it apart from ذ ('dh')."
  - scene: "The new Terminal 1 is huge and bright. The queue for passport control is long — forty minutes of standing. Imran sends Khalid a message; a voice note comes back."
  - who: "khalid"
    t: "لَا تَقْلَقْ يَا عِمْرَانُ. أَنَا فِي صَالَةِ الْوُصُولِ. خُذْ وَقْتَكْ."
    tr: "Laa taqlaq yaa ʿImraan. Ana fee saalatil-wusool. Khudh waqtak."
    en: "(voice note) Don't worry, Imran. I'm in the arrivals hall. Take your time."
    q: ["لا", "أَنَا۠", "فِي", "أَخَذَ", "كَ"]
  - who: "imran"
    t: "أَرْبَعُونَ دَقِيقَةً فِي الطَّابُورِ... اصْبِرْ يَا عِمْرَانُ، اصْبِرْ."
    tr: "Arbaʿoona daqeeqatan fit-taaboor... isbir yaa ʿImraan, isbir."
    en: "(sighing) Forty minutes in the queue... Be patient, Imran. Be patient."
    q: ["فِي", "صَبَرَ"]
  - who: "officer"
    t: "السَّلَامُ عَلَيْكُمْ. جَوَازَ السَّفَرِ، لَوْ سَمَحْتْ."
    tr: "Assalamu Alaikum. Jawaazas-safar, law samaht."
    en: "Assalamu Alaikum. Your passport, please."
    q: ["سَلام", "عَلَى", "كُمْ", "لَو"]
  - who: "imran"
    t: "وَعَلَيْكُمُ السَّلَامُ. تَفَضَّلْ، وَهٰذِهِ التَّأْشِيرَةْ."
    tr: "Wa Alaikumus-salaam. Tafaddal, wa haadhihit-ta'sheerah."
    en: "Wa Alaikumus-salam. Here you are, and this is the visa."
    q: ["عَلَى", "كُمُ", "سَلام", "ذا"]
  - who: "officer"
    t: "أَنْتَ هِنْدِيٌّ، وَتَسْكُنُ فِي سُوِيسْرَا؟"
    tr: "Anta Hindiyyun, wa taskunu fee Swisra?"
    en: "You're Indian, and you live in Switzerland?"
    q: ["أَنتَ", "فِي"]
  - who: "imran"
    t: "نَعَمْ. أَنَا مُهَنْدِسٌ، وَأَعْمَلُ فِي زِيُورِخَ مُنْذُ ثَلَاثِ سَنَوَاتْ."
    tr: "Naʿam. Ana muhandis, wa aʿmalu fee Zyoorikh mundhu thalaathi sanawaat."
    en: "Yes. I'm an engineer, and I've been working in Zurich for three years."
    q: ["أَنَا۠", "عَمِلَ", "فِي"]
  - who: "officer"
    t: "مَا سَبَبُ الزِّيَارَةْ؟"
    tr: "Maa sababuz-ziyaarah?"
    en: "What is the purpose of your visit?"
    q: ["ما"]
  - who: "imran"
    t: "الْعُمْرَةُ، إِنْ شَاءَ اللَّهُ. عِنْدِي تَأْشِيرَةُ عُمْرَةٍ، وَتَصْرِيحٌ مِنْ تَطْبِيقِ نُسُكْ."
    tr: "Al-ʿUmrah, Insha Allah. ʿIndee ta'sheeratu ʿUmrah, wa tasreehun min tatbeeqi Nusuk."
    en: "Umrah, Insha Allah. I have an Umrah visa, and a permit from the Nusuk app."
    q: ["إِن", "شاءَ", "اللَّه", "عِند", "ى", "مِن"]
  - who: "officer"
    t: "كَمْ يَوْمًا سَتَبْقَى فِي الْمَمْلَكَةْ؟"
    tr: "Kam yawman satabqaa fil-Mamlakah?"
    en: "How many days will you stay in the Kingdom?"
    q: ["يَوْم", "فِي"]
  - who: "imran"
    t: "عَشَرَةَ أَيَّامٍ. ثَلَاثَةُ أَيَّامٍ فِي جُدَّةَ، ثُمَّ أَذْهَبُ إِلَى مَكَّةَ الْمُكَرَّمَةْ."
    tr: "ʿAsharata ayyaam. Thalaathatu ayyaamin fee Jiddah, thumma adh-habu ilaa Makkatal-Mukarramah."
    en: "Ten days. Three days in Jeddah, then I go to Makkah al-Mukarramah."
    q: ["يَوْم", "فِي", "ثُمّ", "إِلَى"]
  - who: "officer"
    t: "وَأَيْنَ تَسْكُنُ فِي جُدَّةَ؟ فِي فُنْدُقٍ؟"
    tr: "Wa ayna taskunu fee Jiddah? Fee funduq?"
    en: "And where are you staying in Jeddah? In a hotel?"
    q: ["فِي"]
  - who: "imran"
    t: "لَا، عِنْدَ أَهْلِ صَدِيقِي، عَائِلَةِ الْحَرْبِيِّ، فِي حَيِّ الرَّوْضَةْ."
    tr: "Laa, ʿinda ahli sadeeqee, ʿaa'ilatil-Harbiyy, fee hayyir-Rawdah."
    en: "No, with my friend's family, the Al-Harbi family, in the Al-Rawdah district."
    q: ["لا", "عِند", "أَهْل", "ى", "فِي"]
  - who: "officer"
    t: "عِنْدَكَ الْعُنْوَانُ وَرَقْمُ هَاتِفِهِمْ؟"
    tr: "ʿIndakal-ʿunwaanu wa raqmu haatifihim?"
    en: "Do you have the address and their phone number?"
    q: ["عِند", "كَ", "هُم"]
  - who: "imran"
    t: "نَعَمْ. هٰذَا هُوَ الْعُنْوَانُ، وَهٰذَا رَقْمُ صَدِيقِي خَالِدْ."
    tr: "Naʿam. Haadha huwal-ʿunwaan, wa haadha raqmu sadeeqee Khaalid."
    en: "Yes. This is the address, and this is my friend Khalid's number."
    q: ["ذا", "هُوَ", "ى"]
  - who: "officer"
    t: "طَيِّبٌ. ضَعْ أَصَابِعَ يَدِكَ الْيُمْنَى هُنَا، فَوْقَ الْجِهَازْ."
    tr: "Tayyib. Daʿ asaabiʿa yadikal-yumnaa hunaa, fawqal-jihaaz."
    en: "Fine. Put the fingers of your right hand here, on the scanner."
    q: ["يَد", "كَ", "فَوْق"]
  - who: "officer"
    t: "وَالْآنَ انْظُرْ إِلَى الْكَامِيرَا... شُكْرًا."
    tr: "Wal-aan unzur ilal-kaameera... shukran."
    en: "And now look at the camera... thank you."
    q: ["نَظَرَ", "إِلَى"]
  - who: "officer"
    t: "أَهْلًا بِكَ فِي الْمَمْلَكَةِ يَا ضَيْفَ الرَّحْمٰنْ."
    tr: "Ahlan bika fil-Mamlakah, yaa dayfar-Rahmaan."
    en: "(stamping the passport, with a small smile) Welcome to the Kingdom, guest of the Most Merciful."
    q: ["كَ", "فِي", "رَحْمٰن"]
  - who: "imran"
    t: "ضَيْفُ الرَّحْمٰنِ؟ مَا أَجْمَلَ هٰذِهِ الْكَلِمَةْ!"
    tr: "Dayfur-Rahmaan? Maa ajmala haadhihil-kalimah!"
    en: "Guest of the Most Merciful? What a beautiful phrase!"
    q: ["رَحْمٰن", "ما", "ذا", "كَلِمَة"]
  - who: "officer"
    t: "كُلُّ مَنْ جَاءَ لِلْحَجِّ أَوِ الْعُمْرَةِ فَهُوَ ضَيْفُ الرَّحْمٰنِ. تَفَضَّلْ، وَفَّقَكَ اللَّهْ."
    tr: "Kullu man jaa'a lil-Hajji awil-ʿUmrati fa-huwa dayfur-Rahmaan. Tafaddal, waffaqakAllah."
    en: "Everyone who comes for Hajj or Umrah is a guest of the Most Merciful. Go ahead — may Allah grant you success."
    q: ["كُلّ", "مَن", "جاءَ", "أَو", "هُوَ", "رَحْمٰن", "كَ", "اللَّه"]
  - section: "🧳 Baggage and a Hijazi porter"
    learn: "Hijazi you will hear: تِبْغَى (tibgha) = تُرِيدُ (you want) — from the Quran's بَغَى 'to seek'; عَرَبِيَّة = a luggage trolley (yes, the same word as 'Arabic'!); شُوَيَّة = قَلِيلًا (a little); لِسَّه = مَا زَالَ (still); إِيوَه = نَعَمْ; كِدَا = هٰكَذَا (like this); خَلَاص = done, enough; يَلَّا = let's go. حَقِيبَة (haqeebah) = suitcase — ح from the throat, ق deep at the back."
  - scene: "Baggage hall. The screen shows the Zurich flight on belt number seven. A porter in a blue vest stands ready with a trolley."
  - who: "imran"
    t: "مِنْ فَضْلِكَ، أَيْنَ حَقَائِبُ الرِّحْلَةِ مِنْ زِيُورِخْ؟"
    tr: "Min fadlik, ayna haqaa'ibur-rihlati min Zyoorikh?"
    en: "Excuse me, where are the bags from the Zurich flight?"
    q: ["مِن", "فَضْل", "كَ"]
  - who: "driver"
    t: "هِنَاكْ، السَّيْرْ سَبْعَة. تِبْغَى عَرَبِيَّة لِلشُّنَطْ؟"
    tr: "Hinaak, as-sayr sabʿa. Tibgha ʿarabiyya lish-shunat?"
    en: "(Hijazi, fast) Over there, belt seven. Want a trolley for the bags?"
    q: []
  - who: "imran"
    t: "عَفْوًا... عَرَبِيَّةٌ؟ أَنَا أَتَكَلَّمُ الْعَرَبِيَّةَ قَلِيلًا!"
    tr: "ʿAfwan... ʿarabiyyah? Ana atakallamul-ʿarabiyyata qaleelan!"
    en: "(puzzled) Sorry... 'Arabic'? I speak a little Arabic!"
    q: ["أَنَا۠", "قَلِيل"]
  - who: "driver"
    t: "لَا، لَا! أَقْصِدُ: هَلْ تُرِيدُ عَرَبَةً تَحْمِلُ عَلَيْهَا الْحَقَائِبْ؟"
    tr: "Laa, laa! Aqsidu: hal tureedu ʿarabatan tahmilu ʿalayhal-haqaa'ib?"
    en: "(laughing, now slowly) No, no! I mean: do you want a cart to carry your bags on?"
    q: ["لا", "هَل", "أَرادَ", "حَمَلَ", "عَلَى", "هَا"]
  - who: "imran"
    t: "آهْ، نَعَمْ، أُرِيدُ. عِنْدِي حَقِيبَتَانِ: وَاحِدَةٌ كَبِيرَةٌ زَرْقَاءُ، وَالْأُخْرَى صَغِيرَةٌ سَوْدَاءْ."
    tr: "Aah, naʿam, ureed. ʿIndee haqeebataan: waahidatun kabeeratun zarqaa', wal-ukhraa sagheeratun sawdaa'."
    en: "Ah, yes, I do. I have two suitcases: a big blue one, and the other one small and black."
    q: ["أَرادَ", "عِند", "ى", "كَبِير", "آخَر"]
  - scene: "Twenty minutes pass. The big blue suitcase comes round. The small black one does not."
  - who: "imran"
    t: "جَاءَتِ الْكَبِيرَةُ، وَلٰكِنْ أَيْنَ الصَّغِيرَةُ؟ فِيهَا الْهَدَايَا لِلْعَائِلَةْ!"
    tr: "Jaa'atil-kabeerah, wa laakin aynas-sagheerah? Feehal-hadaayaa lil-ʿaa'ilah!"
    en: "(worried) The big one has come, but where's the small one? The presents for the family are in it!"
    q: ["جاءَ", "كَبِير", "لٰكِن", "فِي", "هَا"]
  - who: "driver"
    t: "اِصْبِرْ شُوَيَّة. لِسَّه فِيه شُنَطْ جَايَّة."
    tr: "Isbir shuwayya. Lissa fee shunat jaayya."
    en: "(Hijazi) Wait a bit. There are still bags coming."
    q: ["صَبَرَ"]
  - who: "imran"
    t: "تَقْصِدُ: اصْبِرْ قَلِيلًا، مَا زَالَتْ هُنَاكَ حَقَائِبُ قَادِمَةٌ؟"
    tr: "Taqsidu: isbir qaleelan, maa zaalat hunaaka haqaa'ibu qaadimah?"
    en: "You mean: be patient a little, there are still bags coming?"
    q: ["صَبَرَ", "قَلِيل", "ما"]
  - who: "driver"
    t: "إِيوَه، بِالضَّبْطْ!"
    tr: "Aywa, bid-dabt!"
    en: "Yes, exactly!"
    q: []
  - scene: "Five long minutes later the small black suitcase appears — the very last one on the belt."
  - who: "imran"
    t: "الْحَمْدُ لِلَّهِ! هَا هِيَ!"
    tr: "Alhamdulillah! Haa hiya!"
    en: "Alhamdulillah! There it is!"
    q: ["حَمْد", "اللَّه", "هِىَ"]
  - who: "driver"
    t: "كِدَا خَلَاصْ. يَلَّا، عَلَى بَرَّا!"
    tr: "Kida khalaas. Yalla, ʿala barra!"
    en: "(loading the trolley) That's it, done. Come on, outside!"
    q: ["عَلَى"]
  - who: "imran"
    t: "تَفَضَّلْ، هٰذِهِ عَشَرَةُ رِيَالَاتٍ. جَزَاكَ اللَّهُ خَيْرًا."
    tr: "Tafaddal, haadhihi ʿasharatu riyaalaat. Jazak Allahu khairan."
    en: "(handing him a note) Here you are, ten riyals. Jazak Allahu khairan."
    q: ["ذا", "جَزَى", "كَ", "اللَّه", "خَيْر"]
  - section: "🚕 Taxi touts and a familiar face"
    learn: "Hijazi: فِين = أَيْنَ (where), رَايِح = ذَاهِبٌ (going), أَوَدِّيكْ = أُوصِلُكَ (I'll take you), بَسْ = فَقَطْ (only), مِيَّة = مِئَة (hundred), أَخُويَا = أَخِي (my brother). حَيَّاكَ اللَّهُ (hayyaakAllah, 'may Allah give you life') is the everyday Saudi 'welcome'. Reply to حَمْدًا لِلَّهِ عَلَى السَّلَامَةِ with اللَّهُ يُسَلِّمُكَ."
  - scene: "The arrivals hall is crowded and loud. Families wait with flowers; drivers hold up name boards. Two men walk straight towards Imran."
  - who: "driver"
    t: "تَاكْسِي؟ تَاكْسِي يَا حَاجّ؟ فِينْ رَايِحْ؟ مَكَّة؟"
    tr: "Taaksi? Taaksi yaa Haajj? Feen raayih? Makka?"
    en: "(Hijazi) Taxi? Taxi, Hajji? Where are you going? Makkah?"
    q: []
  - who: "imran"
    t: "لَا، شُكْرًا. صَدِيقِي يَنْتَظِرُنِي هُنَا."
    tr: "Laa, shukran. Sadeeqee yantazirunee hunaa."
    en: "No, thank you. My friend is waiting for me here."
    q: ["لا", "ى"]
  - who: "driver"
    t: "طَيِّبْ، أَوَدِّيكْ أَيّ حِتَّة فِي جُدَّة بِمِيَّة رِيَالْ بَسْ!"
    tr: "Tayyib, awaddeek ayy hitta fee Jidda bi-miyya riyaal bass!"
    en: "OK, I'll take you anywhere in Jeddah for just a hundred riyals!"
    q: ["أَيّ", "فِي"]
  - who: "khalid"
    t: "عِمْرَانُ! يَا عِمْرَانُ! أَنَا هُنَا!"
    tr: "ʿImraan! Yaa ʿImraan! Ana hunaa!"
    en: "(from behind the barrier, waving) Imran! Imran! I'm here!"
    q: ["أَنَا۠"]
  - who: "khalid"
    t: "مَشْكُورْ يَا أَخُويَا، هُوَ مَعِي."
    tr: "Mashkoor yaa akhooya, huwa maʿee."
    en: "(to the driver, smiling) Thanks, brother — he's with me."
    q: ["أَخ", "هُوَ", "مَع", "ى"]
  - who: "khalid"
    t: "هَلْ فَهِمْتَ مَا قَالَ؟ قَالَ: «إِلَى أَيْنَ أَنْتَ ذَاهِبٌ؟ أُوصِلُكَ إِلَى أَيِّ مَكَانٍ بِمِئَةِ رِيَالٍ فَقَطْ». «فِينْ» يَعْنِي «أَيْنَ»، وَ«بَسْ» يَعْنِي «فَقَطْ»."
    tr: "Hal fahimta maa qaal? Qaal: «ilaa ayna anta dhaahib? Oosiluka ilaa ayyi makaanin bi-mi'ati riyaalin faqat». «Feen» yaʿnee «ayna», wa «bass» yaʿnee «faqat»."
    en: "(to Imran) Did you understand what he said? He said: 'Where are you going? I'll take you anywhere for only a hundred riyals.' 'Feen' means 'where', and 'bass' means 'only'."
    q: ["هَل", "ما", "قالَ", "إِلَى", "أَنتَ", "كَ", "أَيّ"]
  - who: "imran"
    t: "أَنَا فَهِمْتُ «مَكَّةَ» فَقَطْ!"
    tr: "Ana fahimtu «Makkah» faqat!"
    en: "(laughing) I only understood 'Makkah'!"
    q: ["أَنَا۠"]
  - who: "khalid"
    t: "الْحَمْدُ لِلَّهِ عَلَى السَّلَامَةِ يَا أَخِي! أَهْلًا وَسَهْلًا، حَيَّاكَ اللَّهْ!"
    tr: "Alhamdulillah ʿalas-salaamah yaa akhee! Ahlan wa sahlan, hayyaakAllah!"
    en: "(embracing him) Alhamdulillah for your safe arrival, my brother! Welcome, welcome!"
    q: ["حَمْد", "اللَّه", "عَلَى", "سَلام", "أَخ", "ى", "كَ"]
  - who: "imran"
    t: "اللَّهُ يُسَلِّمُكَ يَا خَالِدُ. وَاللَّهِ اشْتَقْتُ إِلَيْكَ، وَأَنْتَ غِبْتَ أُسْبُوعًا وَاحِدًا فَقَطْ!"
    tr: "Allahu yusallimuka yaa Khaalid. WAllahi ishtaqtu ilayk, wa anta ghibta usbooʿan waahidan faqat!"
    en: "Allah keep you safe, Khalid. By Allah, I missed you — and you were only gone one week!"
    q: ["اللَّه", "كَ", "إِلَى", "أَنتَ"]
  - who: "khalid"
    t: "كَيْفَ كَانَتِ الرِّحْلَةُ؟"
    tr: "Kayfa kaanatir-rihlah?"
    en: "How was the trip?"
    q: ["كَيْف", "كانَ"]
  - who: "imran"
    t: "الطَّائِرَةُ كَانَتْ مُرِيحَةً، وَلٰكِنَّ الطَّابُورَ كَانَ طَوِيلًا جِدًّا، وَحَقِيبَةٌ تَأَخَّرَتْ."
    tr: "At-taa'iratu kaanat mureehah, wa laakinnat-taaboora kaana taweelan jiddan, wa haqeebatun ta'akh-kharat."
    en: "The plane was comfortable, but the queue was very long, and one bag was late."
    q: ["كانَ", "لٰكِنّ"]
  - who: "khalid"
    t: "هٰكَذَا الْمَطَارُ فِي مَوْسِمِ الْعُمْرَةِ؛ النَّاسُ يَأْتُونَ مِنْ كُلِّ أَرْضٍ. هَلْ صَلَّيْتَ الْمَغْرِبَ؟"
    tr: "Haakadhal-mataaru fee mawsimil-ʿUmrah; an-naasu ya'toona min kulli ard. Hal sallaytal-Maghrib?"
    en: "That's the airport in Umrah season — people come from every land. Have you prayed Maghrib?"
    q: ["ذا", "فِي", "ناس", "أَتَى", "مِن", "كُلّ", "أَرْض", "هَل"]
  - who: "imran"
    t: "لَا، لَيْسَ بَعْدُ. أَذَّنَ الْمَغْرِبُ وَأَنَا فِي الطَّابُورْ."
    tr: "Laa, laysa baʿd. Adh-dhanal-Maghribu wa ana fit-taaboor."
    en: "No, not yet. The adhan for Maghrib went while I was in the queue."
    q: ["لا", "لَيْسَ", "بَعْد", "أَنَا۠", "فِي"]
  - who: "khalid"
    t: "هُنَاكَ مُصَلًّى قَرِيبٌ. نُصَلِّي، ثُمَّ نَخْرُجُ إِلَى السَّيَّارَةْ."
    tr: "Hunaaka musallan qareeb. Nusallee, thumma nakhruju ilas-sayyaarah."
    en: "There's a prayer room nearby. We'll pray, then go out to the car."
    q: ["ثُمّ", "خَرَجَ", "إِلَى"]
  - section: "🚗 The travel dua"
    learn: "سَيَّارَة (sayyaarah) = car today; in Surah Yusuf سَيَّارَة is a caravan of travellers — an old word with a new job. سُبْحَانَ اللَّهِ (SubhanAllah) = Allah is far above every fault (root س ب ح). سَخَّرَ = made something serve us. In ayah 43:13 listen for ظُهُور (backs): ظ is a heavy 'dh' — Urdu says 'z' (as in 'Zuhr'), Arabs say 'ḍhuhr' with the tongue between the teeth."
  - scene: "After Maghrib they wheel the bags to the car park, second floor. The car is Abu Khalid's old white Land Cruiser."
  - who: "khalid"
    t: "هٰذِهِ سَيَّارَةُ أَبِي. ضَعِ الْحَقَائِبَ فِي الْخَلْفِ، وَأَنَا أُسَاعِدُكْ."
    tr: "Haadhihi sayyaaratu abee. Daʿil-haqaa'iba fil-khalf, wa ana usaaʿiduk."
    en: "This is my father's car. Put the bags in the back — I'll help you."
    q: ["ذا", "أَب", "ى", "فِي", "أَنَا۠", "كَ"]
  - who: "imran"
    t: "«سَيَّارَةٌ»... هٰذِهِ الْكَلِمَةُ فِي سُورَةِ يُوسُفَ، أَلَيْسَ كَذٰلِكَ؟"
    tr: "«Sayyaarah»... haadhihil-kalimatu fee Soorati Yoosuf, a-laysa kadhaalik?"
    en: "'Sayyarah'... this word is in Surah Yusuf, isn't it?"
    q: ["ذا", "كَلِمَة", "فِي", "لَيْسَ"]
  - who: "khalid"
    t: "نَعَمْ! وَلٰكِنَّهَا هُنَاكَ قَافِلَةُ مُسَافِرِينَ، لَا سَيَّارَةٌ. الْكَلِمَةُ الْقَدِيمَةُ لَهَا مَعْنًى جَدِيدٌ الْيَوْمْ."
    tr: "Naʿam! Wa laakinnahaa hunaaka qaafilatu musaafireen, laa sayyaarah. Al-kalimatul-qadeematu lahaa maʿnan jadeedun al-yawm."
    en: "Yes! But there it's a caravan of travellers, not a car. The old word has a new meaning today."
    q: ["لٰكِنّ", "هَا", "لا", "كَلِمَة", "يَوْم"]
  - who: "khalid"
    t: "قَبْلَ أَنْ نَتَحَرَّكَ، نَقُولُ دُعَاءَ السَّفَرِ كَمَا عَلَّمَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرْ."
    tr: "Qabla an nataharrak, naqoolu duʿaa'as-safari kamaa ʿallamanaa Rasoolullaahi sallAllahu ʿalayhi wa sallam: Allahu Akbar, Allahu Akbar, Allahu Akbar."
    en: "Before we move, we say the travel dua, as the Messenger of Allah, peace be upon him, taught us: Allahu Akbar, Allahu Akbar, Allahu Akbar."
    q: ["قَبْل", "أَن", "قالَ", "ما", "عَلَّمَ", "نَا", "رَسُول", "اللَّه", "عَلَى", "هِۦ"]
  - quran: { s: 43, a: 13 }
    by: "khalid"
    en: "...so that you sit firmly on their backs, then remember your Lord's favour once you are settled, and say: 'Glory to the One who made this serve us — we could never have managed it on our own.'"
  - quran: { s: 43, a: 14 }
    by: "khalid"
    en: "'And to our Lord we will surely return.'"
  - who: "imran"
    t: "أَعْرِفُ هٰذَا الدُّعَاءَ، وَلٰكِنْ مَا مَعْنَى «سَخَّرَ»؟"
    tr: "Aʿrifu haadhad-duʿaa', wa laakin maa maʿnaa «sakh-khara»?"
    en: "I know this dua, but what does 'sakh-khara' mean?"
    q: ["ذا", "لٰكِن", "ما"]
  - who: "khalid"
    t: "«سَخَّرَ لَنَا» يَعْنِي: جَعَلَهُ يَخْدُمُنَا. الْجَمَلُ قَوِيٌّ، وَالسَّيَّارَةُ أَقْوَى مِنَّا، وَلٰكِنَّ اللَّهَ جَعَلَهَا فِي أَيْدِينَا."
    tr: "«Sakh-khara lanaa» yaʿnee: jaʿalahu yakhdumunaa. Al-jamalu qawiyy, was-sayyaaratu aqwaa minnaa, wa laakinnAllaaha jaʿalahaa fee aydeenaa."
    en: "'Sakh-khara lana' means: He made it serve us. A camel is strong, and a car is stronger than us, but Allah put it in our hands."
    q: ["نَا", "جَعَلَ", "هُۥ", "مِن", "لٰكِنّ", "اللَّه", "هَا", "فِي", "يَد"]
  - who: "khalid"
    t: "«وَمَا كُنَّا لَهُ مُقْرِنِينَ»: مَا كُنَّا نَقْدِرُ عَلَيْهِ وَحْدَنَا. وَ«مُنْقَلِبُونَ»: رَاجِعُونَ. كُلُّ سَفَرٍ يَجْعَلُنَا نَذْكُرُ الرُّجُوعَ إِلَى رَبِّنَا."
    tr: "«Wa maa kunnaa lahu muqrineen»: maa kunnaa naqdiru ʿalayhi wahdanaa. Wa «munqaliboon»: raajiʿoon. Kullu safarin yajʿalunaa nadhkurur-rujooʿa ilaa Rabbinaa."
    en: "'Wa ma kunna lahu muqrinin': we could never control it by ourselves. And 'munqalibun': returning. Every journey reminds us of the return to our Lord."
    q: ["ما", "كانَ", "نَا", "هُۥ", "عَلَى", "هِۦ", "رَجَعَ", "كُلّ", "جَعَلَ", "ذَكَرَ", "إِلَى", "رَبّ"]
  - who: "imran"
    t: "سُبْحَانَ اللَّهِ. قُلْتُهُ مِئَاتِ الْمَرَّاتِ، وَالْيَوْمَ أَفْهَمُهُ لِأَوَّلِ مَرَّةْ."
    tr: "SubhanAllah. Qultuhu mi'aatil-marraat, wal-yawma afhamuhu li-awwali marrah."
    en: "(quietly) SubhanAllah. I've said it hundreds of times, and today I understand it for the first time."
    q: ["سُبْحان", "اللَّه", "قالَ", "هُۥ", "يَوْم", "أَوَّل"]
  - who: "khalid"
    t: "وَالْمُسَافِرُ دُعَاؤُهُ مُسْتَجَابٌ، فَادْعُ اللَّهَ بِمَا شِئْتَ. مَاذَا تَقُولُ أَنْتَ فِي السَّفَرِ؟"
    tr: "Wal-musaafiru duʿaa'uhu mustajaab, fadʿullaaha bimaa shi'ta. Maadha taqoolu anta fis-safar?"
    en: "And a traveller's dua is answered, so ask Allah for whatever you wish. What do you say when you travel?"
    q: ["هُۥ", "دَعا", "اللَّه", "ما", "شاءَ", "ذا", "قالَ", "أَنتَ", "فِي"]
  - who: "imran"
    t: "أُمِّي عَلَّمَتْنِي هٰذَا الدُّعَاءَ مِنَ الْقُرْآنِ، وَأَنَا صَغِيرٌ:"
    tr: "Ummee ʿallamatnee haadhad-duʿaa'a minal-Quran, wa ana sagheer:"
    en: "My mother taught me this dua from the Quran when I was small:"
    q: ["ى", "عَلَّمَ", "ذا", "مِن", "قُرْءان", "أَنَا۠"]
  - quran: { s: 2, a: 201 }
    by: "imran"
    en: "And some of them say: 'Our Lord, give us good in this world and good in the next, and protect us from the punishment of the Fire.'"
  - who: "khalid"
    t: "دُعَاءٌ جَامِعٌ! «الدُّنْيَا» هِيَ هٰذِهِ الْحَيَاةُ، وَ«الْآخِرَةُ» الْحَيَاةُ بَعْدَ الْمَوْتِ. وَ«آتِنَا» يَعْنِي: أَعْطِنَا."
    tr: "Duʿaa'un jaamiʿ! «Ad-dunyaa» hiya haadhihil-hayaah, wa «al-aakhirah» al-hayaatu baʿdal-mawt. Wa «aatinaa» yaʿnee: aʿtinaa."
    en: "A dua that holds everything! 'Ad-dunya' is this life, and 'al-akhirah' is the life after death. And 'atina' means: give us."
    q: ["دُنْيا", "هِىَ", "ذا", "حَياة", "آخِر", "بَعْد", "مَوْت", "آتَى", "نَا"]
  - who: "khalid"
    t: "وَ«قِنَا عَذَابَ النَّارِ»: احْفَظْنَا مِنْ عَذَابِ النَّارِ. «قِنَا» مِنْ نَفْسِ جَذْرِ «التَّقْوَى»: الْوِقَايَةُ وَالْحِفْظْ."
    tr: "Wa «qinaa ʿadhaaban-naar»: ihfaznaa min ʿadhaabin-naar. «Qinaa» min nafsi jadhrit-taqwaa: al-wiqaayatu wal-hifz."
    en: "And 'qina ʿadhaban-nar': keep us safe from the punishment of the Fire. 'Qina' comes from the same root as 'taqwa': protection, guarding."
    q: ["عَذاب", "نار", "نَا", "مِن", "نَفْس"]
  - section: "🌊 Night drive through Jeddah"
    learn: "Directions: يَمِين (right — the Quran's أَصْحَابُ الْيَمِينِ, 'people of the right'), يَسَار (left; Hijazi often says شِمَال for left), شَمَال / جَنُوب / شَرْق / غَرْب (north / south / east / west). Numbers above twenty put the units first: خَمْسَةٌ وَعِشْرُونَ = 'five and twenty' = 25. بَحْر = sea (ح again from the throat). The Red Sea = الْبَحْرُ الْأَحْمَرُ."
  - scene: "Seven o'clock. The car leaves the airport and heads south on Madinah Road. The city is bright with traffic and shop signs."
  - who: "khalid"
    t: "الْمَطَارُ فِي شَمَالِ جُدَّةَ، وَبَيْتُنَا فِي حَيِّ الرَّوْضَةِ، عَلَى بُعْدِ خَمْسَةٍ وَعِشْرِينَ كِيلُومِتْرًا تَقْرِيبًا."
    tr: "Al-mataaru fee shamaali Jiddah, wa baytunaa fee hayyir-Rawdah, ʿalaa buʿdi khamsatin wa ʿishreena keelomitran taqreeban."
    en: "The airport is in the north of Jeddah, and our house is in Al-Rawdah, about twenty-five kilometres away."
    q: ["فِي", "بَيْت", "نَا", "عَلَى"]
  - who: "imran"
    t: "كَمْ دَقِيقَةً نَحْتَاجُ؟"
    tr: "Kam daqeeqatan nahtaaj?"
    en: "How many minutes do we need?"
    q: []
  - who: "khalid"
    t: "ثَلَاثِينَ دَقِيقَةً، إِذَا لَمْ يَكُنْ هُنَاكَ زِحَامٌ. وَلٰكِنْ أُرِيدُ أَنْ أُرِيَكَ شَيْئًا قَبْلَ الْبَيْتْ."
    tr: "Thalaatheena daqeeqah, idhaa lam yakun hunaaka zihaam. Wa laakin ureedu an uriyaka shay'an qablal-bayt."
    en: "Thirty minutes, if there's no traffic. But I want to show you something before the house."
    q: ["إِذا", "لَم", "كانَ", "لٰكِن", "أَرادَ", "أَن", "أَرَيْ", "كَ", "شَىْء", "قَبْل", "بَيْت"]
  - who: "imran"
    t: "مَاذَا؟ أُمُّكَ قَالَتْ: لَا تَتَأَخَّرُوا!"
    tr: "Maadha? Ummuka qaalat: laa tata'akh-kharoo!"
    en: "What? Your mother said: don't be late!"
    q: ["ما", "ذا", "كَ", "قالَ", "لا"]
  - who: "khalid"
    t: "عَشْرُ دَقَائِقَ فَقَطْ. الْكُورْنِيشُ فِي طَرِيقِنَا تَقْرِيبًا: نَذْهَبُ غَرْبًا إِلَى الْبَحْرِ، ثُمَّ جَنُوبًا، ثُمَّ شَرْقًا إِلَى الْبَيْتْ."
    tr: "ʿAshru daqaa'iqa faqat. Al-korneeshu fee tareeqinaa taqreeban: nadh-habu gharban ilal-bahr, thumma janooban, thumma sharqan ilal-bayt."
    en: "(laughing) Only ten minutes. The Corniche is more or less on our way: we go west to the sea, then south, then east to the house."
    q: ["فِي", "نَا", "إِلَى", "بَحْر", "ثُمّ", "بَيْت"]
  - scene: "Fifteen minutes later the road opens onto the Corniche. Black water, a long line of lamps, families on carpets on the grass, children on bicycles."
  - who: "khalid"
    t: "انْظُرْ عَلَى الْيَمِينِ. هٰذَا هُوَ الْبَحْرُ الْأَحْمَرْ."
    tr: "Unzur ʿalal-yameen. Haadha huwal-bahrul-ahmar."
    en: "Look on the right. That's the Red Sea."
    q: ["نَظَرَ", "عَلَى", "يَمِين", "ذا", "هُوَ", "بَحْر"]
  - who: "imran"
    t: "الْبَحْرُ الْأَحْمَرُ... قَرَأْتُ عَنْهُ فِي الْكُتُبِ مُنْذُ كُنْتُ وَلَدًا صَغِيرًا، وَالْيَوْمَ أَرَاهُ بِعَيْنِي."
    tr: "Al-bahrul-ahmar... qara'tu ʿanhu fil-kutubi mundhu kuntu waladan sagheeran, wal-yawma araahu bi-ʿaynee."
    en: "The Red Sea... I've read about it in books since I was a small boy, and today I see it with my own eyes."
    q: ["بَحْر", "عَن", "هُۥ", "فِي", "كِتاب", "كانَ", "وَلَد", "يَوْم", "رَأَى", "عَيْن", "ى"]
  - who: "khalid"
    t: "وَلٰكِنَّهُ فِي اللَّيْلِ أَسْوَدُ، لَيْسَ أَحْمَرَ!"
    tr: "Wa laakinnahu fil-layli aswad, laysa ahmar!"
    en: "(smiling) But at night it's black, not red!"
    q: ["لٰكِنّ", "هُۥ", "فِي", "لَيْل", "لَيْسَ"]
  - who: "imran"
    t: "سُبْحَانَ مَنْ خَلَقَهُ. أَسْوَدُ أَوْ أَحْمَرُ، هُوَ عَظِيمْ."
    tr: "Subhaana man khalaqah. Aswadu aw ahmar, huwa ʿazeem."
    en: "Glory to the One who created it. Black or red, it's magnificent."
    q: ["سُبْحان", "مَن", "خَلَقَ", "هُۥ", "أَو", "هُوَ", "عَظِيم"]
  - who: "khalid"
    t: "وَعَلَى الْيَمِينِ أَيْضًا، ذٰلِكَ الْمَسْجِدُ الْأَبْيَضُ عَلَى الْمَاءِ: مَسْجِدُ الرَّحْمَةِ. النَّاسُ يُسَمُّونَهُ «الْمَسْجِدَ الْعَائِمْ»."
    tr: "Wa ʿalal-yameeni aydan, dhaalikal-Masjidul-abyadu ʿalal-maa': Masjidur-Rahmah. An-naasu yusammoonahu «al-Masjidal-ʿaa'im»."
    en: "Also on the right, that white mosque on the water: the Al-Rahma Mosque. People call it 'the Floating Mosque'."
    q: ["عَلَى", "يَمِين", "ذا", "ماء", "رَحْمَة", "ناس", "هُۥ"]
  - who: "imran"
    t: "وَمَا هٰذَا الْمَاءُ الْعَالِي هُنَاكَ، فِي وَسَطِ الْبَحْرِ؟"
    tr: "Wa maa haadhal-maa'ul-ʿaalee hunaaka, fee wasatil-bahr?"
    en: "And what's that tall water over there, in the middle of the sea?"
    q: ["ما", "ذا", "ماء", "فِي", "بَحْر"]
  - who: "khalid"
    t: "هٰذِهِ نَافُورَةُ الْمَلِكِ فَهْدٍ. يَرْتَفِعُ مَاؤُهَا أَكْثَرَ مِنْ مِئَتَيْنِ وَخَمْسِينَ مِتْرًا فِي السَّمَاءْ."
    tr: "Haadhihi naafooratul-Malik Fahd. Yartafiʿu maa'uhaa akthara min mi'atayni wa khamseena mitran fis-samaa'."
    en: "That's King Fahd's Fountain. Its water shoots more than two hundred and fifty metres into the sky."
    q: ["ذا", "ماء", "هَا", "أَكْثَر", "مِن", "فِي", "سَماء"]
  - who: "imran"
    t: "مَا أَجْمَلَ هٰذَا الْمَكَانَ! وَالنَّاسُ جَالِسُونَ عَلَى الْأَرْضِ مَعَ أَوْلَادِهِمْ فِي اللَّيْلْ."
    tr: "Maa ajmala haadhal-makaan! Wan-naasu jaalisoona ʿalal-ardi maʿa awlaadihim fil-layl."
    en: "What a beautiful place! And people are sitting on the ground with their children at night."
    q: ["ما", "ذا", "ناس", "عَلَى", "أَرْض", "مَع", "وَلَد", "هُم", "فِي", "لَيْل"]
  - who: "khalid"
    t: "فِي الشِّتَاءِ الْجَوُّ هُنَا جَمِيلٌ، فَيَخْرُجُ النَّاسُ إِلَى الْبَحْرِ. أَمَّا فِي الصَّيْفِ فَالْحَرُّ شَدِيدٌ جِدًّا."
