    q: ["عَلَى", "سَلام", "اللَّه", "نَحْنُ"]
  - scene: "They turn east, away from the sea, into the quieter streets of Al-Rawdah. Khalid slows down."
  - who: "khalid"
    t: "عِنْدَ الْإِشَارَةِ نَذْهَبُ يَمِينًا، ثُمَّ الشَّارِعُ الثَّانِي عَلَى الْيَسَارِ... وَهٰذَا بَيْتُنَا: الْبَابُ الْأَخْضَرْ."
