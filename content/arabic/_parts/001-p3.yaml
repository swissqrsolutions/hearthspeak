    q: ["كَ", "فِي", "إِذا", "شَىْء", "قالَ", "لا"]
  - who: "sara"
    t: "وَأَنَا سَوْفَ أَنَامُ الْآنَ، فَغَدًا لَيْلٌ طَوِيلٌ فِي الْمُسْتَشْفَى. تُصْبِحُ عَلَى خَيْرٍ يَا عِمْرَانُ."
    tr: "Wa ana sawfa anaamul-aan, fa-ghadan laylun taweelun fil-mustashfaa. Tusbihu ʿalaa khayrin yaa ʿImraan."
    en: "And I'm going to sleep now — tomorrow is a long night at the hospital. Goodnight, Imran."
    q: ["أَنَا۠", "سَوْف", "لَيْل", "فِي", "عَلَى", "خَيْر"]
  - who: "imran"
    t: "وَأَنْتِ مِنْ أَهْلِهِ. جَزَاكُمُ اللَّهُ خَيْرًا جَمِيعًا. وَاللَّهِ مَا شَعَرْتُ أَنِّي ضَيْفٌ؛ شَعَرْتُ أَنِّي فِي دَارِي، بَيْنَ أَهْلِي."
    tr: "Wa anti min ahlih. Jazaakumullaahu khayran jameeʿan. WAllahi maa shaʿartu annee dayf; shaʿartu annee fee daaree, bayna ahlee."
    en: "And may you wake to it too. May Allah reward you all with good. By Allah, I didn't feel like a guest — I felt I was in my own home, among my own family."
    q: ["مِن", "أَهْل", "هِۦ", "جَزَى", "كُمُ", "اللَّه", "خَيْر", "جَمِيع", "ما", "أَنّ", "ى", "فِي", "دار", "بَيْن"]
  - who: "imran"
    t: "كُنْتُ أَخَافُ أَنْ أُخْطِئَ فِي الْعَرَبِيَّةِ أَمَامَكُمْ، وَلٰكِنَّكُمْ صَبَرْتُمْ عَلَيَّ. لَنْ أَنْسَى هٰذِهِ اللَّيْلَةَ أَبَدًا."
    tr: "Kuntu akhaafu an ukhti'a fil-ʿarabiyyati amaamakum, wa laakinnakum sabartum ʿalayy. Lan ansaa haadhihil-laylata abadaa."
    en: "I was afraid of making mistakes in Arabic in front of you, but you were patient with me. I will never forget this night."
    q: ["كانَ", "خافَ", "أَن", "فِي", "كُمْ", "لٰكِنّ", "صَبَرَ", "عَلَى", "ى", "لَن", "ذا"]
  - who: "abukhalid"
    t: "لَعَلَّكَ تَعْبَانُ مِنَ السَّفَرِ يَا وَلَدِي... وَلٰكِنْ إِنْ لَمْ تَكُنْ تَعْبَانَ، فَتَعَالَ مَعِي إِلَى السَّطْحِ قَلِيلًا. الْهَوَاءُ هُنَاكَ بَارِدٌ، وَالسَّمَاءُ صَافِيَةْ."
    tr: "Laʿallaka taʿbaanu minas-safari yaa waladee... wa laakin in lam takun taʿbaan, fa-taʿaala maʿee ilas-sathi qaleelan. Al-hawaa'u hunaaka baarid, was-samaa'u saafiyah."
    en: "Perhaps you're tired from the journey, my son... but if you're not, come up to the roof with me for a while. The air is cool up there, and the sky is clear."
    q: ["لَعَلّ", "كَ", "مِن", "وَلَد", "ى", "لٰكِن", "إِن", "لَم", "كانَ", "مَع", "إِلَى", "قَلِيل", "سَماء"]
  - who: "abukhalid"
    t: "عِنْدِي لَكَ دَرْسٌ صَغِيرٌ: كَلِمَاتُ صَلَاتِكَ الَّتِي تَقُولُهَا كُلَّ يَوْمٍ، كَلِمَةً كَلِمَةْ."
    tr: "ʿIndee laka darsun sagheer: kalimaatu salaatikal-latee taqooluhaa kulla yawm, kalimatan kalimah."
    en: "I have a small lesson for you: the words of the prayer you say every day — word by word."
    q: ["عِند", "ى", "كَ", "كَلِمَة", "صَلاة", "الَّذِي", "قالَ", "هَا", "كُلّ", "يَوْم"]
  - who: "imran"
    t: "تَعْبَانُ؟ أَنَا؟ لَا وَاللَّهِ يَا عَمِّي. هٰذَا مَا جِئْتُ مِنْ أَجْلِهْ!"
    tr: "Taʿbaan? Ana? Laa WAllahi yaa ʿammee. Haadha maa ji'tu min ajlih!"
    en: "Tired? Me? No, by Allah, uncle. This is exactly what I came for!"
    q: ["أَنَا۠", "لا", "اللَّه", "ى", "ذا", "ما", "جاءَ", "مِن", "هِۦ"]
