  - section: "🌙 Goodnight — almost"
    learn: "Night-time phrases: لَعَلَّكَ تَعْبَانُ (laʿallaka taʿbaan = perhaps you're tired — لَعَلَّ is a very Quranic word), تُصْبِحُ عَلَى خَيْرٍ (goodnight — 'may you wake to good'), reply وَأَنْتَ مِنْ أَهْلِهِ ('and may you be among its people'). لَنْ + present verb = will never (لَنْ أَنْسَى = I'll never forget). سَوْفَ + present = will (future)."
