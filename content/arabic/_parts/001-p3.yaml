  - section: "☕ Coffee and dates"
    learn: "Saudi coffee (قَهْوَة, qahwah) is pale and flavoured with cardamom (هَيْل). Take the little cup (فِنْجَان; Hijazi/Gulf فِنْجَال) with your right hand. A small pour is an honour; to say 'enough', gently shake the cup from side to side. After coffee a guest may say دَائِمَة ('may it last'), and the host answers دَامَتْ أَيَّامُكَ. ق is a deep 'q' from the back of the throat — many Saudis say 'gahwa' in daily speech. Hijazi: وِلَّا = وَإِلَّا (or else)."
  - scene: "The majlis: low cushions along the walls, a red carpet, a brass tray. Khalid stands with the dallah — the long-spouted coffee pot — in his left hand and a stack of small cups in his right. Umm Khalid sets down a plate of dates."
