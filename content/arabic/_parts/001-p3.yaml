    t: "صَحِيحٌ. مَكَّةُ عَلَى بُعْدِ ثَمَانِينَ كِيلُومِتْرًا فَقَطْ. وَ«مَرَّة» عِنْدَنَا فِي جُدَّةَ تَعْنِي «جِدًّا»."
    tr: "Saheeh. Makkatu ʿalaa buʿdi thamaaneena keelomitran faqat. Wa «marra» ʿindanaa fee Jiddah taʿnee «jiddan»."
    en: "That's right. Makkah is only about eighty kilometres away. And 'marra' here in Jeddah means 'very'."
