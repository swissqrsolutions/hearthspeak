    t: "«أَنْزِلْنِي» مِنْ «نَزَلَ»: الضَّيْفُ يَنْزِلُ عِنْدَ أَهْلِ الْبَيْتِ. وَاللَّهُ هُوَ خَيْرُ مَنْ يُنْزِلُ الضُّيُوفَ وَيُكْرِمُهُمْ."
    tr: "«Anzilnee» min «nazala»: ad-dayfu yanzilu ʿinda ahlil-bayt. WAllahu huwa khayru man yunzilud-duyoofa wa yukrimuhum."
    en: "'Anzilni' comes from 'nazala', to come down and stay: a guest 'comes down' with the people of a house. And Allah is the best of all who host guests and honour them."
    q: ["أَنزَلَ", "ى", "مِن", "عِند", "أَهْل", "بَيْت", "اللَّه", "هُوَ", "خَيْر", "مَن", "هُم"]
  - who: "abukhalid"
    t: "وَمِنْ نَفْسِ الْجَذْرِ: أَنْزَلَ اللَّهُ الْكِتَابَ، وَنَزَّلَ الْقُرْآنَ عَلَى قَلْبِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمْ."
