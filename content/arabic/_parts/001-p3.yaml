  - who: "ummkhalid"
    t: "وَعِمْرَانُ مَعَكَ؟ السَّلَامُ عَلَيْكَ يَا عِمْرَانُ، حَمْدًا لِلَّهِ عَلَى سَلَامَتِكْ!"
