  - who: "imran"
    t: "وَعَلَيْكِ السَّلَامُ يَا خَالَةُ. اللَّهُ يُسَلِّمُكِ. نَحْنُ قَرِيبُونَ!"
    tr: "Wa ʿalaykis-salaam yaa khaalah. Allahu yusallimuki. Nahnu qareeboon!"
