    tr: "Alladheena an'amta 'alaihim: alladheena a'taitahum ni'matak."
    en: "Alladheena an'amta 'alaihim: those You gave Your blessing to."
    q: ["الَّذِي", "عَلَى", "هُم", "نِعْمَة", "كَ"]
