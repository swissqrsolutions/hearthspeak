lines:
  - chapter: "Chapter 1 — After Jumu'ah"
  - section: "🕌 At the mosque door"
    learn: "Greetings: السَّلَامُ عَلَيْكُمْ and its reply · names: اِسْمِي … / مَا اسْمُكَ؟ · ع ('ain) is a tight squeeze deep in the throat, not a plain 'a' — Urdu speakers often drop it; Saudis say it clearly: عَلَيْكُمْ · ح is a breathy throat 'h', stronger than ه: رَحْمَة · ق is a deep 'q' from the back of the throat, never 'k': قَرِيبَة · Saudis stop words with a silent ending (pausal form): خَالِدْ, not khaalidun"
  - scene: "Zurich, Friday the 25th of September 2026. Jumu'ah prayer has just ended. Men stream out of the mosque into a cool grey afternoon. Imran Shareef sits on the bench by the door, tying his shoes. The man next to him smiles and greets him."
  - who: "khalid"
    t: "السَّلَامُ عَلَيْكُمْ."
    tr: "Assalamu Alaikum."
    en: "Peace be upon you."
    q: ["سَلام", "عَلَى", "كُمْ"]
  - who: "imran"
    t: "وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهْ."
    tr: "Wa Alaikumus Salam wa Rahmatullahi wa Barakatuh."
    en: "And upon you be peace, and Allah's mercy and His blessings."
    q: ["عَلَى", "كُمْ", "سَلام", "رَحْمَة", "اللَّه", "هُۥ"]
  - who: "khalid"
    t: "أَنَا خَالِدْ."
    tr: "Ana Khaalid."
    en: "I'm Khalid."
    q: ["أَنَا۠", "خالِد"]
  - who: "khalid"
    t: "مَا اسْمُكْ؟"
    tr: "Mas-muk?"
    en: "What's your name?"
    q: ["ما", "كَ"]
  - who: "imran"
    t: "اِسْمِي عِمْرَانْ."
    tr: "Ismee Imraan."
    en: "My name is Imran."
    q: ["ى"]
  - who: "khalid"
    t: "أَهْلًا وَسَهْلًا يَا عِمْرَانْ."
    tr: "Ahlan wa sahlan, ya Imraan."
    en: "Welcome, Imran."
    q: ["أَهْل"]
  - who: "imran"
    t: "أَهْلًا بِكْ."
    tr: "Ahlan bik."
    en: "Welcome to you too."
    q: ["أَهْل", "كَ"]
  - who: "khalid"
    t: "مِنْ أَيْنَ أَنْتْ؟"
    tr: "Min ayna ant?"
    en: "Where are you from?"
    q: ["مِن", "أَنتَ"]
  - who: "imran"
    t: "أَنَا مِنَ الْهِنْدْ. مِنْ بَنْغَالُورْ."
    tr: "Ana minal Hind. Min Bangaloor."
    en: "I'm from India. From Bengaluru."
    q: ["أَنَا۠", "مِن"]
  - who: "khalid"
    t: "مَا شَاءَ اللَّهْ! وَأَنَا مِنَ السُّعُودِيَّةِ، مِنْ جُدَّةْ."
    tr: "Masha Allah! Wa ana minas-Su'oodiyyah, min Juddah."
    en: "Masha Allah! And I'm from Saudi Arabia, from Jeddah."
    q: ["ما", "شاءَ", "اللَّه", "أَنَا۠", "مِن"]
  - who: "imran"
    t: "جُدَّةُ قَرِيبَةٌ مِنْ مَكَّةْ؟"
    tr: "Juddatu qareebatun min Makkah?"
    en: "Jeddah is near Makkah, isn't it?"
    q: ["مِن"]
  - who: "khalid"
    t: "نَعَمْ. سَاعَةٌ بِالسَّيَّارَةْ."
    tr: "Na'am. Saa'atun bis-sayyaarah."
    en: "Yes. An hour by car."
    q: ["ساعَة"]
  - section: "💼 Work — and a surprise"
    learn: "مَاذَا تَعْمَلُ؟ (What do you do?) · أَعْمَلُ (I work) — the Quran's عَمِلَ · نَفْس = 'the same' (نَفْسُ الشَّرِكَةِ) · ذ = 'th' as in 'this' — Urdu says 'z', Saudis say 'dh': مَاذَا · ض = a heavy 'd' — Urdu says 'z': أَيْضًا · ط = a heavy, full-mouth 't': الطَّابِق · ث = 'th' as in 'think' — Urdu says 's': الثَّالِث · Old word, new meaning: سَاعَة in the Quran is 'the Hour' (Judgement Day); today it also means 'an hour' or 'a watch'. سَيَّارَة in Surah Yusuf is a caravan of travellers; today it is a car."
  - who: "khalid"
    t: "مَاذَا تَعْمَلُ يَا عِمْرَانْ؟"
    tr: "Maadhaa ta'malu ya Imraan?"
    en: "What do you do, Imran?"
    q: ["ما", "ذا", "عَمِلَ"]
  - who: "imran"
    t: "أَنَا مُهَنْدِسُ بَرْمَجِيَّاتْ."
    tr: "Ana muhandisu barmajiyyaat."
    en: "I'm a software engineer."
    q: ["أَنَا۠"]
  - who: "imran"
    t: "أَعْمَلُ هُنَا فِي زِيُورِخْ."
    tr: "A'malu hunaa fee Zyoorikh."
    en: "I work here in Zurich."
    q: ["عَمِلَ", "فِي"]
  - who: "khalid"
    t: "وَأَنَا مُهَنْدِسٌ أَيْضًا!"
    tr: "Wa ana muhandisun aydan!"
    en: "I'm an engineer too!"
    q: ["أَنَا۠"]
  - who: "khalid"
    t: "فِي أَيِّ شَرِكَةٍ تَعْمَلْ؟"
    tr: "Fee ayyi sharikatin ta'mal?"
    en: "Which company do you work for?"
    q: ["فِي", "أَيّ", "عَمِلَ"]
  - who: "imran"
    t: "فِي شَرِكَةٍ كَبِيرَةٍ، قُرْبَ الْمَحَطَّةِ الرَّئِيسِيَّةْ."
    tr: "Fee sharikatin kabeeratin, qurbal-mahattatir-ra'eesiyyah."
    en: "In a big company, near the main station."
    q: ["فِي", "كَبِير"]
  - who: "khalid"
    t: "حَقًّا؟ أَنَا بَدَأْتُ الْعَمَلَ هُنَاكَ يَوْمَ الِاثْنَيْنْ!"
    tr: "Haqqan? Ana bada'tul-'amala hunaaka yawmal-ithnayn!"
    en: "Really? I started work there on Monday!"
    q: ["حَقّ", "أَنَا۠", "عَمَل", "يَوْم"]
  - who: "imran"
    t: "سُبْحَانَ اللَّهْ! نَحْنُ فِي نَفْسِ الشَّرِكَةْ!"
    tr: "Subhan Allah! Nahnu fee nafsish-sharikah!"
    en: "Subhan Allah! We're in the same company!"
    q: ["سُبْحان", "اللَّه", "نَحْنُ", "فِي", "نَفْس"]
  - who: "khalid"
    t: "فِي أَيِّ طَابِقٍ أَنْتْ؟"
    tr: "Fee ayyi taabiqin ant?"
    en: "Which floor are you on?"
    q: ["فِي", "أَيّ", "أَنتَ"]
  - who: "imran"
    t: "فِي الطَّابِقِ الْخَامِسْ. فِي فَرِيقِ التَّطْبِيقَاتْ."
    tr: "Fit-taabiqil-khaamis. Fee fareeqit-tatbeeqaat."
    en: "The fifth floor. In the apps team."
    q: ["فِي"]
  - who: "khalid"
    t: "وَأَنَا فِي الثَّالِثْ. أَنَا جَدِيدٌ هُنَا، لَا أَعْرِفُ أَحَدًا."
    tr: "Wa ana fith-thaalith. Ana jadeedun hunaa, laa a'rifu ahadan."
    en: "And I'm on the third. I'm new here, I don't know anyone."
    q: ["أَنَا۠", "فِي", "لا", "أَحَد"]
  - who: "imran"
    t: "الْآنَ تَعْرِفُ أَحَدًا!"
    tr: "Al-aana ta'rifu ahadan!"
    en: "Now you know someone!"
    q: ["أَحَد"]
  - who: "khalid"
    t: "اَلْحَمْدُ لِلَّهْ."
    tr: "Alhamdulillah."
    en: "(laughing) Alhamdulillah."
    q: ["حَمْد", "اللَّه"]
  - section: "👨‍👩‍👧 Family"
    learn: "Family words: أَب (father), أُمّ (mother), أَخ (brother), أُخْت (sister), أَهْل (family) · -ī = my: أَبِي، أُمِّي، أَهْلِي · -ka = your: أَهْلُكَ · كَانَ = was — the Quran's second most common verb"
  - who: "imran"
    t: "هَلْ أَنْتَ هُنَا مَعَ أَهْلِكْ؟"
    tr: "Hal anta hunaa ma'a ahlik?"
    en: "Are you here with your family?"
    q: ["هَل", "أَنتَ", "مَع", "أَهْل", "كَ"]
  - who: "khalid"
    t: "لَا، أَنَا هُنَا وَحْدِي. أَهْلِي فِي جُدَّةْ."
    tr: "Laa, ana hunaa wahdee. Ahlee fee Juddah."
    en: "No, I'm here on my own. My family is in Jeddah."
    q: ["لا", "أَنَا۠", "ى", "أَهْل", "فِي"]
  - who: "khalid"
    t: "أَبِي، وَأُمِّي، وَأُخْتِي سَارَةْ."
    tr: "Abee, wa ummee, wa ukhtee Saarah."
    en: "My father, my mother, and my sister Sara."
    q: ["أَب", "ى"]
  - who: "khalid"
    t: "سَارَةُ طَبِيبَةٌ فِي مُسْتَشْفًى كَبِيرْ."
    tr: "Saaratu tabeebatun fee mustashfan kabeer."
    en: "Sara is a doctor in a big hospital."
    q: ["فِي", "كَبِير"]
  - who: "imran"
    t: "مَا شَاءَ اللَّهْ. وَأَبُوكَ، مَاذَا يَعْمَلْ؟"
    tr: "Masha Allah. Wa abooka, maadhaa ya'mal?"
    en: "Masha Allah. And your father, what does he do?"
    q: ["ما", "شاءَ", "اللَّه", "أَب", "كَ", "ذا", "عَمِلَ"]
  - who: "khalid"
    t: "كَانَ مُعَلِّمًا لِلُّغَةِ الْعَرَبِيَّةِ وَالْقُرْآنْ."
    tr: "Kaana mu'alliman lil-lughatil-'arabiyyati wal-Quran."
    en: "He was a teacher of Arabic and the Quran."
    q: ["كانَ", "عَلَّمَ", "قُرْءان"]
  - who: "khalid"
    t: "هُوَ الْآنَ مُتَقَاعِدٌ، فِي الْبَيْتْ."
    tr: "Huwal-aana mutaqaa'id, fil-bait."
    en: "Now he's retired, at home."
    q: ["هُوَ", "فِي", "بَيْت"]
  - who: "khalid"
    t: "وَأَنْتَ؟ أَيْنَ أَهْلُكْ؟"
    tr: "Wa ant? Ayna ahluk?"
    en: "And you? Where is your family?"
    q: ["أَنتَ", "أَهْل", "كَ"]
  - who: "imran"
    t: "أَبِي وَأُمِّي فِي بَنْغَالُورْ. وَلِي أَخٌ وَأُخْتْ."
    tr: "Abee wa ummee fee Bangaloor. Wa lee akhun wa ukht."
    en: "My father and mother are in Bengaluru. And I have a brother and a sister."
    q: ["أَب", "ى", "فِي", "أَخ"]
  - who: "imran"
    t: "أَنَا فِي زِيُورِخَ مُنْذُ خَمْسِ سَنَوَاتْ."
    tr: "Ana fee Zyoorikha mundhu khamsi sanawaat."
    en: "I've been in Zurich for five years."
    q: ["أَنَا۠", "فِي"]
  - who: "khalid"
    t: "خَمْسُ سَنَوَاتٍ! إِذَنْ تَتَكَلَّمُ الْأَلْمَانِيَّةْ؟"
    tr: "Khamsu sanawaat! Idhan tatakallamul-almaaniyyah?"
    en: "Five years! So you speak German?"
    q: []
  - who: "imran"
    t: "قَلِيلًا... قَلِيلًا جِدًّا."
    tr: "Qaleelan... qaleelan jiddan."
    en: "(laughing) A little... a very little."
    q: ["قَلِيل"]
  - section: "📖 \"I recite, but I don't understand\""
    learn: "Saying no: لَا أَفْهَمُ (I don't understand), لَا أَعْرِفُ (I don't know) · وَلٰكِنْ = but · كُلَّ يَوْمٍ = every day · ص is a heavy, full-mouth 's' — keep it different from س: صَلَاة"
  - who: "khalid"
    t: "وَالْعَرَبِيَّةُ؟ هَلْ تَتَكَلَّمُ الْعَرَبِيَّةْ؟"
    tr: "Wal-'arabiyyah? Hal tatakallamul-'arabiyyah?"
    en: "And Arabic? Do you speak Arabic?"
    q: ["هَل"]
  - who: "imran"
    t: "لَا. أَتَكَلَّمُ الْإِنْجِلِيزِيَّةَ وَالْأُرْدِيَّةَ، وَقَلِيلًا مِنَ الْكَنَّادَا."
    tr: "Laa. Atakallamul-injileeziyyata wal-urdiyyah, wa qaleelan minal-Kannada."
    en: "No. I speak English and Urdu, and a little Kannada."
    q: ["لا", "قَلِيل", "مِن"]
  - who: "khalid"
    t: "وَالْقُرْآنُ؟ هَلْ تَقْرَأُ الْقُرْآنْ؟"
    tr: "Wal-Quran? Hal taqra'ul-Quran?"
    en: "And the Quran? Do you read the Quran?"
    q: ["قُرْءان", "هَل"]
  - who: "imran"
    t: "نَعَمْ. أَقْرَأُ الْقُرْآنَ كُلَّ يَوْمٍ، بَعْدَ الْفَجْرْ."
    tr: "Na'am. Aqra'ul-Qurana kulla yawmin, ba'dal-Fajr."
    en: "Yes. I read the Quran every day, after Fajr."
    q: ["قُرْءان", "كُلّ", "يَوْم", "بَعْد"]
  - who: "imran"
    t: "وَلٰكِنْ... لَا أَفْهَمُ مَا أَقْرَأْ."
    tr: "Wa laakin... laa afhamu maa aqra'."
    en: "But... I don't understand what I'm reading."
    q: ["لٰكِن", "لا", "ما"]
  - who: "imran"
    t: "أُصَلِّي، وَلَا أَعْرِفُ مَعْنَى صَلَاتِي."
    tr: "Usallee, wa laa a'rifu ma'naa salaatee."
    en: "I pray, and I don't know the meaning of my own prayer."
    q: ["لا", "صَلاة", "ى"]
  - who: "imran"
    t: "هٰذَا صَعْبٌ عَلَيَّ يَا خَالِدْ."
    tr: "Haadhaa sa'bun 'alayya ya Khaalid."
    en: "That's hard for me, Khalid."
    q: ["ذا", "عَلَى", "ى", "خالِد"]
  - who: "khalid"
    t: "أَفْهَمُكَ يَا أَخِي. هٰذَا كَثِيرٌ عِنْدَ النَّاسْ."
    tr: "Afhamuka ya akhee. Haadhaa katheerun 'indan-naas."
    en: "I understand you, brother. It's very common among people."
    q: ["كَ", "أَخ", "ى", "ذا", "كَثِير", "عِند", "ناس"]
  - who: "khalid"
    t: "الْقُرْآنُ كِتَابُ اللَّهْ."
    tr: "Al-Quranu kitaabullaah."
    en: "The Quran is the Book of Allah."
    q: ["قُرْءان", "كِتاب", "اللَّه"]
  - who: "khalid"
    t: "وَاللَّهُ أَنْزَلَهُ لِنَفْهَمَهُ وَنَعْمَلَ بِهْ."
    tr: "Wallaahu anzalahu linafhamahu wa na'mala bih."
    en: "Allah sent it down so that we understand it and live by it."
    q: ["اللَّه", "أَنزَلَ", "هُۥ", "عَمِلَ", "هِۦ"]
  - who: "imran"
    t: "وَأَنَا أُرِيدُ ذٰلِكْ. وَلٰكِنْ كَيْفْ؟ أَنَا مَشْغُولٌ دَائِمًا."
    tr: "Wa ana ureedu dhaalik. Wa laakin kayf? Ana mashghoolun daa'iman."
    en: "And I want that. But how? I'm always busy."
    q: ["أَنَا۠", "أَرادَ", "ذا", "لٰكِن", "كَيْف"]
  - who: "khalid"
    t: "كُلُّ النَّاسِ مَشْغُولُونْ. وَلٰكِنْ قَلِيلٌ كُلَّ يَوْمٍ خَيْرٌ مِنْ لَا شَيْءْ."
    tr: "Kullun-naasi mashghooloon. Wa laakin qaleelun kulla yawmin khairun min laa shai'."
    en: "Everyone's busy. But a little every day is better than nothing."
    q: ["كُلّ", "ناس", "لٰكِن", "قَلِيل", "يَوْم", "خَيْر", "مِن", "لا", "شَىْء"]
  - section: "👳 Imam Abdullah"
    learn: "Words you already know from the Quran: سَلَام، حَمْد، شَاءَ، يَوْم، رَبّ، كِتَاب، عِلْم · قَالَ (said) → تَقُولُ (you say) · ظ = a heavy 'dh' — Urdu says 'z', Saudis say a thick 'dh': أَظُنُّ (I think) · أَحْسَنْتَ = well done"
  - scene: "Imam Abdullah comes out of the prayer hall: a calm man in his fifties, in a white dishdasha and an embroidered Omani cap, a bag of books under his arm. Imran has prayed behind him for five years but has never really spoken to him."
  - who: "imam"
    t: "السَّلَامُ عَلَيْكُمْ يَا شَبَابْ."
    tr: "Assalamu Alaikum ya shabaab."
    en: "Assalamu Alaikum, young men."
    q: ["سَلام", "عَلَى", "كُمْ"]
  - who: "khalid"
    t: "وَعَلَيْكُمُ السَّلَامُ يَا شَيْخْ. كَيْفَ حَالُكْ؟"
    tr: "Wa Alaikumus Salam ya Shaikh. Kayfa haaluk?"
    en: "Wa Alaikumus Salam, Shaikh. How are you?"
    q: ["عَلَى", "كُمْ", "سَلام", "كَيْف", "كَ"]
  - who: "imam"
    t: "بِخَيْرٍ وَالْحَمْدُ لِلَّهْ. مَنْ صَاحِبُكَ يَا خَالِدْ؟"
    tr: "Bikhairin wal-hamdu lillaah. Man saahibuka ya Khaalid?"
    en: "Well, alhamdulillah. Who is your friend, Khalid?"
    q: ["خَيْر", "حَمْد", "اللَّه", "مَن", "كَ", "خالِد"]
  - who: "khalid"
    t: "هٰذَا أَخِي عِمْرَانْ. نَحْنُ فِي نَفْسِ الشَّرِكَةْ."
    tr: "Haadhaa akhee Imraan. Nahnu fee nafsish-sharikah."
    en: "This is my brother Imran. We're at the same company."
    q: ["ذا", "أَخ", "ى", "نَحْنُ", "فِي", "نَفْس"]
  - who: "imam"
    t: "أَهْلًا يَا عِمْرَانْ. أَرَاكَ هُنَا كُلَّ جُمُعَةْ."
    tr: "Ahlan ya Imraan. Araaka hunaa kulla Jumu'ah."
    en: "Welcome, Imran. I see you here every Friday."
    q: ["أَهْل", "رَأَى", "كَ", "كُلّ"]
  - who: "imran"
    t: "نَعَمْ يَا شَيْخْ. أُصَلِّي هُنَا مُنْذُ خَمْسِ سَنَوَاتْ."
    tr: "Na'am ya Shaikh. Usallee hunaa mundhu khamsi sanawaat."
    en: "Yes, Shaikh. I've been praying here for five years."
    q: []
  - who: "khalid"
    t: "يَا شَيْخُ، عِمْرَانُ يَقْرَأُ الْقُرْآنَ كُلَّ يَوْمٍ، وَلٰكِنَّهُ لَا يَفْهَمُ الْعَرَبِيَّةْ."
