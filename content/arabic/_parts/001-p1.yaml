  - section: "2️⃣ Alhamdulillah — ayah 2"
    learn: "root ح م د = praise: حَمْد، مُحَمَّد، أَحْمَد · لِلَّهِ = لِ (for, belongs to) + اللَّه · root ر ب ب: رَبّ = the Lord who creates, owns, provides and raises · عَالَمِين = all the worlds (plural of عَالَم) · مَلَائِكَة (angels) is the plural of مَلَك"
  - quran: { s: 1, a: 2 }
    by: "khalid"
    en: "All praise belongs to Allah, Lord of all the worlds."
  - who: "khalid"
