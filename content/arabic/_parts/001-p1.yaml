    tr: "Ihdinaa: ihdi wa naa. Ya'nee: yaa Rabbi, hdinaa ant."
    en: "Ihdina: ihdi, 'guide', plus na, 'us'. It means: O my Lord, You guide us."
    q: ["هَدَى", "نَا", "رَبّ", "ى", "أَنتَ"]
