    q: ["لَيْسَ", "مِن", "هَا", "رَبّ", "ى"]
  - section: "💧 Understanding, for the first time"
    learn: "A hadith qudsi (Sahih Muslim): Allah answers each ayah of Al-Fatiha · حَمِدَنِي عَبْدِي = My servant has praised Me · بَيْنِي وَبَيْنَ عَبْدِي = between Me and My servant · لِعَبْدِي مَا سَأَلَ = My servant will have what he asked for"
  - who: "khalid"
    t: "الْآنَ اقْرَأْهَا أَنْتَ، بِبُطْءٍ، وَفَكِّرْ فِي كُلِّ كَلِمَةْ."
    tr: "Al-aanaqra'haa anta, bibut', wa fakkir fee kulli kalimah."
    en: "Now you read it, slowly, and think about every word."
    q: ["هَا", "أَنتَ", "فِي", "كُلّ", "كَلِمَة"]
  - scene: "Imran recites Al-Fatiha under his breath, slowly, his finger moving along the line. At 'iyyaka na'budu' his voice breaks. He stops and presses his hand over his eyes."
  - who: "imran"
    t: "لَا أَسْتَطِيعُ أَنْ أُكْمِلْ."
    tr: "Laa astatee'u an ukmil."
    en: "I can't go on."
    q: ["لا", "اسْتَطاعَ", "أَن"]
  - who: "imran"
    t: "أَوَّلَ مَرَّةٍ أَفْهَمُ مَا أَقُولُ لِرَبِّي."
    tr: "Awwala marratin afhamu maa aqoolu li-Rabbee."
    en: "For the first time, I understand what I'm saying to my Lord."
    q: ["أَوَّل", "ما", "قالَ", "رَبّ", "ى"]
  - who: "khalid"
    t: "خُذْ وَقْتَكَ يَا أَخِي."
    tr: "Khudh waqtaka ya akhee."
    en: "Take your time, my brother."
    q: ["أَخَذَ", "كَ", "أَخ", "ى"]
  - who: "khalid"
    t: "هَلْ تَعْرِفُ أَنَّ اللَّهَ يُجِيبُكَ عِنْدَ كُلِّ آيَةٍ مِنْهَا؟"
    tr: "Hal ta'rifu annallaaha yujeebuka 'inda kulli aayatin minhaa?"
    en: "Did you know that Allah answers you at every ayah of it?"
    q: ["هَل", "أَنّ", "اللَّه", "كَ", "عِند", "كُلّ", "آيَة", "مِن", "هَا"]
  - who: "khalid"
    t: "فِي صَحِيحِ مُسْلِمٍ، قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فِي حَدِيثٍ قُدْسِيّْ:"
    tr: "Fee Saheehi Muslim, qaala Rasoolullaahi sallallaahu 'alaihi wa sallam, fee hadeethin qudsiyy:"
    en: "In Sahih Muslim, the Messenger of Allah, peace and blessings be upon him, said in a hadith qudsi:"
    q: ["فِي", "قالَ", "رَسُول", "اللَّه", "عَلَى", "هِۦ"]
  - who: "khalid"
    t: "إِذَا قَالَ الْعَبْدُ: «الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ»، قَالَ اللَّهُ: «حَمِدَنِي عَبْدِي»."
    tr: "Idhaa qaalal-'abd: «Alhamdu lillaahi Rabbil-'aalameen», qaalallaah: «Hamidanee 'abdee»."
    en: "'When the servant says: All praise belongs to Allah, Lord of the worlds — Allah says: My servant has praised Me.'"
    q: ["فِي", "إِذا", "قالَ", "عَبْد", "حَمْد", "اللَّه", "رَبّ", "عالَم", "ى"]
  - who: "khalid"
    t: "وَإِذَا قَالَ: «إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ»، قَالَ: «هٰذَا بَيْنِي وَبَيْنَ عَبْدِي، وَلِعَبْدِي مَا سَأَلَ»."
    tr: "Wa idhaa qaal: «Iyyaaka na'budu wa iyyaaka nasta'een», qaal: «Haadhaa bainee wa baina 'abdee, wa li'abdee maa sa'al»."
    en: "And when he says 'You alone we worship and You alone we ask for help', Allah says: 'This is between Me and My servant, and My servant shall have what he asked.'"
    q: ["إِذا", "قالَ", "عَبَدَ", "ذا", "بَيْن", "ى", "عَبْد", "ما", "سَأَلَ"]
  - who: "imran"
    t: "إِذَنِ الصَّلَاةُ... كَلَامٌ بَيْنِي وَبَيْنَ رَبِّي."
    tr: "Idhanis-salaah... kalaamun bainee wa baina Rabbee."
    en: "(very quietly) So the prayer... is a conversation between me and my Lord."
    q: ["صَلاة", "بَيْن", "ى", "رَبّ"]
  - who: "khalid"
    t: "نَعَمْ. وَهٰذَا مَا أَرَدْتُ أَنْ تَشْعُرَ بِهِ الْيَوْمْ."
    tr: "Na'am. Wa haadhaa maa aradtu an tash'ura bihil-yawm."
    en: "Yes. And that's what I wanted you to feel today."
    q: ["ذا", "ما", "أَرادَ", "أَن", "هِۦ", "يَوْم"]
  - section: "📅 Twice a week"
    learn: "Days: يَوْمُ السَّبْتِ (Saturday), يَوْمُ الثُّلَاثَاءِ (Tuesday) · مَرَّتَيْنِ فِي الْأُسْبُوعِ = twice a week · بَعْدَ الْعَمَلِ = after work · نَمْشِي مُسْتَقِيمًا = we go straight on — the مُسْتَقِيم of the Fatiha, in a street direction"
  - who: "imran"
    t: "خَالِدُ، أُرِيدُ أَنْ أَتَعَلَّمَ أَكْثَرْ. هَلْ نَلْتَقِي مَرَّةً أُخْرَى؟"
    tr: "Khaalid, ureedu an ata'allama akthar. Hal naltaqee marratan ukhraa?"
    en: "Khalid, I want to learn more. Can we meet again?"
    q: ["خالِد", "أَرادَ", "أَن", "أَكْثَر", "هَل", "آخَر"]
  - who: "khalid"
    t: "مَرَّتَيْنِ فِي الْأُسْبُوعِ: يَوْمَ الثُّلَاثَاءِ بَعْدَ الْعَمَلِ، وَيَوْمَ السَّبْتِ هُنَا."
    tr: "Marratayni fil-usboo': yawmath-thulaathaa'i ba'dal-'amal, wa yawmas-sabti hunaa."
    en: "Twice a week: Tuesdays after work, and Saturdays here."
    q: ["فِي", "يَوْم", "بَعْد", "عَمَل"]
  - who: "imran"
    t: "اِتَّفَقْنَا. وَمَاذَا أَفْعَلُ قَبْلَ الثُّلَاثَاءْ؟"
    tr: "Ittafaqnaa. Wa maadhaa af'alu qablath-thulaathaa'?"
    en: "Agreed. And what should I do before Tuesday?"
    q: ["ما", "ذا", "فَعَلَ", "قَبْل"]
  - who: "khalid"
    t: "اِسْمَعِ الْفَاتِحَةَ كُلَّ يَوْمٍ. وَفِي الصَّلَاةِ، فَكِّرْ فِي كَلِمَةٍ وَاحِدَةٍ فَقَطْ."
    tr: "Isma'il-Faatihata kulla yawm. Wa fis-salaah, fakkir fee kalimatin waahidatin faqat."
    en: "Listen to Al-Fatiha every day. And in the prayer, think about just one word."
    q: ["سَمِعَ", "كُلّ", "يَوْم", "فِي", "صَلاة", "كَلِمَة"]
  - who: "khalid"
    t: "وَفِي الدَّرْسِ الْقَادِمِ: هُوَ، وَهِيَ، وَأَنْتَ، وَنَحْنُ... وَأَفْعَالٌ مِثْلُ: قَالَ، وَكَانَ."
    tr: "Wa fid-darsil-qaadim: huwa, wa hiya, wa anta, wa nahnu... wa af'aalun mithlu: qaala, wa kaan."
    en: "And next lesson: he, she, you, we... and verbs like qaala, 'he said', and kaana, 'he was'."
    q: ["فِي", "هُوَ", "هِىَ", "أَنتَ", "نَحْنُ", "مِثْل", "قالَ", "كانَ"]
  - who: "imran"
    t: "وَالْعُمْرَةُ؟ هَلْ أَسْتَطِيعُ أَنْ أَفْهَمَ كُلَّ شَيْءٍ قَبْلَ دِيسَمْبَرْ؟"
    tr: "Wal-Umrah? Hal astatee'u an afhama kulla shai'in qabla Deesambar?"
