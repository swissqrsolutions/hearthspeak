  - section: "6️⃣ Guide us — ayah 6"
    learn: "اِهْدِنَا = اِهْدِ (guide!) + نَا (us) · root ه د ي: هَدَى (guided), هُدًى (guidance) · صِرَاط = a wide, clear road (ص and ط are both 'heavy' letters) · مُسْتَقِيم = straight, from ق و م (to stand upright) — the same root as قِيَامَة"
