  - section: "1️⃣ Bismillah — ayah 1"
    learn: "بِسْمِ = بِ (with, in) + اسْمِ (name) · root ر ح م = mercy: رَحْمَة (mercy), رَحْمٰن، رَحِيم، رَحِم (womb) · a common explanation of the two names: رَحْمٰن = mercy that is vast and overflowing, for all creation; رَحِيم = mercy that is constant, especially for the believers"
  - who: "khalid"
    t: "اِسْمَعْ أَوَّلًا، ثُمَّ نَتَكَلَّمْ."
    tr: "Isma' awwalan, thumma natakallam."
    en: "Listen first, then we'll talk."
