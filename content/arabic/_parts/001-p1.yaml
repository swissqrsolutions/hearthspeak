  - section: "7️⃣ Not those — ayah 7"
    learn: "الَّذِينَ = those who · أَنْعَمْتَ عَلَيْهِمْ = You blessed them (root ن ع م → نِعْمَة, a blessing) · غَيْرِ = not, other than · root غ ض ب = anger · root ض ل ل = to lose the way (ضَلَّ) · غ is like a soft, gargled French 'r' · ض again: a heavy 'd' made with the side of the tongue — many IndoPak reciters say 'z' (wa laz-zaalleen); Saudis say wa laḍ-ḍaalleen"
  - quran: { s: 1, a: 7 }
    by: "khalid"
    en: "The path of those You have blessed — not of those who earned Your anger, and not of those who lost the way."
