    t: "تَذْكُرُ كَلِمَةَ أَمْسِ؟ «إِيَّاكَ»."
    tr: "Tadhkuru kalimata ams? «Iyyaak»."
    en: "Remember yesterday's word? Iyyaka."
    q: ["ذَكَرَ", "كَلِمَة"]
  - who: "imran"
    t: "نَعَمْ! «إِيَّاكَ» يَعْنِي: أَنْتْ؟"
    tr: "Na'am! «Iyyaaka» ya'nee: ant?"
    en: "Yes! Iyyaka means 'you'?"
